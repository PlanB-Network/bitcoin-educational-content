question: "În diamantul Nolan, ce poziție se află în vârf și reprezintă libertatea maximă?"
answer: "Libertarianismul, susținând cea mai mare libertate economică și personală"
wrong_answers:
  - "Conservatorismul, susținând valorile tradiționale și libertatea economică"
  - "Centrismul, echilibrând toate pozițiile politice într-un mod pragmatic"
  - "Socialismul, susținând libertatea personală și egalitatea socială"
explanation: >-
  Libertarianismul ocupă vârful diamantului Nolan ca opus al etatismului. El îi reprezintă pe cei care susțin cel mai mare grad de libertate atât economică, cât și personală. Conservatorismul se află la dreapta (libertate economică ridicată, libertate personală scăzută), socialismul la stânga (libertate personală ridicată, libertate economică scăzută), iar centrismul la mijloc.
reviewed: false
