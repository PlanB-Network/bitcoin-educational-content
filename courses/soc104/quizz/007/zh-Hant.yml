question: "在 Nolan diamond 中，哪個位置位於頂端並代表最大自由？"
answer: "自由意志主義，支持最大程度的經濟自由與個人自由"
wrong_answers:
  - "保守主義，支持傳統價值與經濟自由"
  - "中間主義，以務實方式平衡所有政治立場"
  - "社會主義，支持個人自由與社會平等"
explanation: >-
  自由意志主義位於 Nolan diamond 的頂端，作為國家主義的反面。它代表支持最大程度經濟自由與個人自由的人。保守主義位於右側（高度經濟自由、低度個人自由），社會主義位於左側（高度個人自由、低度經濟自由），而中間主義位於中間。
reviewed: false
