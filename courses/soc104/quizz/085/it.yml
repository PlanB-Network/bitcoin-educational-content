question: "Che cosa incoraggia le persone a fare il motto di Kant 'Sapere aude'?"
answer: "Ad avere il coraggio di pensare da sé e a uscire dallo stato di minorità in cui dipendono dalla direzione di un'autorità superiore"
wrong_answers:
  - "A perseguire la conoscenza accademica iscrivendosi a istituzioni educative formali e ottenendo credenziali"
  - "A sfidare ogni forma di moralità e creare sistemi etici completamente nuovi basati sul desiderio personale"
  - "A cercare la saggezza attraverso la devozione religiosa e la sottomissione agli insegnamenti della chiesa"
explanation: >-
  Sapere aude, che significa "Abbi il coraggio di pensare da te", fu tratto da Kant dal poeta Orazio e reso il motto dell'Illuminismo. Simboleggia l'uscita dalla minorità, uno stato in cui le persone sono incapaci di usare il proprio intelletto senza la direzione di una classe o autorità superiore. Kant incoraggia l'emancipazione e la piena responsabilità del proprio pensiero.
