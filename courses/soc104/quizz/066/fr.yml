question: "Quelle est la position libertarienne sur la question du mariage homosexuel ?"
answer: "L'État n'a pas à définir le mariage ; celui-ci devrait être privatisé et laissé aux individus, aux associations et aux institutions religieuses"
wrong_answers:
  - "Le mariage homosexuel devrait être légalisé parce que tous les citoyens méritent un traitement égal devant la loi"
  - "Le mariage homosexuel devrait être interdit parce que le mariage traditionnel est une institution fondamentale pour la procréation"
  - "Le mariage homosexuel devrait être légalisé, mais seulement dans un cadre juridique séparé, distinct du mariage traditionnel"
explanation: >-
  Les libertariens soutiennent que la question du mariage est fondamentalement mal posée parce qu'elle est formulée en termes étatistes. Ils estiment que l'État n'a pas à s'immiscer dans la vie privée, de sorte que la solution consiste à séparer entièrement le mariage de l'État. En imposant une définition unique, l'État crée des conflits. La première mauvaise réponse reflète la position socialiste ou centriste, et la deuxième reflète la position conservatrice.
reviewed: false
