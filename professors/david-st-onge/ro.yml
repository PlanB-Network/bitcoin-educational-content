bio: |
  Salut tuturor! Pasionat de bitcoin din 2018, am dezvoltat o înclinație spre economie și hiperinflație. Îmi doresc să îmi împărtășesc pasiunea prin cursul ECON204 despre hiperinflație, precum și prin cartea mea „Tous sur Bitcoin”. Aștept cu nerăbdare să discutăm la viitoarele conferințe despre bitcoin!

short_bio: Expert în hiperinflație și autor al cărții „Tous sur bitcoin”
