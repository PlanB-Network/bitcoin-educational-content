question: "同性婚の問題に関するリバタリアンの立場は何ですか？"
answer: "国家は結婚を定義するべきではなく、結婚は民営化され、個人、結社、宗教制度に委ねられるべきである"
wrong_answers:
  - "すべての市民は法律のもとで平等に扱われるべきなので、同性婚は合法化されるべきである"
  - "伝統的結婚は生殖のための根本的制度なので、同性婚は禁止されるべきである"
  - "同性婚は合法化されるべきだが、伝統的結婚とは異なる別個の法的枠組みによってのみ認められるべきである"
explanation: >-
  リバタリアンは、結婚の問いは国家統制主義的な言葉で立てられているため、根本的に設定が誤っていると論じます。国家は個人の私生活に干渉すべきではないと考えるため、解決策は結婚を国家から完全に分離することです。国家は単一の定義を押しつけることで対立を作り出します。最初の誤答は社会主義または中道主義の立場を反映し、2 つ目は保守主義の立場を反映しています。
reviewed: false
