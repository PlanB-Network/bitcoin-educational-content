question: මෙම කතුවරුන් අතරින් Gournay විසින් විශේෂයෙන් ආභාෂය ලැබුවේ කවුද?
answer: Turgot
wrong_answers:
  - Josiah Child
  - François Quesnay
  - Adam Smith
explanation: |
  Turgot, Gournayගේ අදහස්වලින් දැඩි ලෙස බලපෑමට ලක් විය. විශේෂයෙන් ඔහුගේ ආර්ථික නිදහස ආරක්ෂා කිරීම සහ රාජ්‍ය මැදිහත්වීම පිළිබඳ විවේචනය ඔහුට බලපෑවේය.
