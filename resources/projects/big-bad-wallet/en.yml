description: |
  Big Bad Wallet is a Bitcoin learning center with a self-custody wallet on the way, from Sour Labs, in English and French. The learning center is live: 33 plain-language guides on sats, seed phrases, fees, Lightning and self-custody, a glossary that explains every term in one sentence, a scam quiz, a sats converter, and a free eight-week email course that takes a complete beginner from "what is Bitcoin" to holding it themselves.

  The wallet is built for people who keep their bitcoin on an exchange because self-custody looks hard. It is non-custodial: the seed phrase never leaves the device, there are no accounts and no KYC, and the wallet engine is open source. Bitcoin only, no altcoins. It is on a waitlist while it is being built.
