question: "Каковы два принципа справедливости Джона Ролза?"
answer: "Равная свобода для всех и принцип различия, допускающий неравенства только в том случае, если они приносят пользу наиболее обездоленным"
wrong_answers:
  - "Всеобщее избирательное право для всех граждан и прогрессивное налогообложение для финансирования общественных услуг"
  - "Свобода слова без ограничений и обязательное перераспределение богатства для достижения равенства"
  - "Защита прав частной собственности и принцип ненападения, применяемый ко всем действиям государства"
explanation: >-
  Ролз предлагает два принципа: во-первых, равную свободу для всех (основание демократии), и во-вторых, принцип различия, который допускает неравенства только в том случае, если они приносят пользу наиболее обездоленным членам общества. Это означает, что человек имеет право разбогатеть при условии, что перераспределение позволяет также получить пользу наименее благоприятствуемым. Другие варианты смешивают элементы разных политических философий.
