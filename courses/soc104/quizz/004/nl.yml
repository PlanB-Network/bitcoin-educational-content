question: "Welk gemeenschappelijk punt delen linkse en rechtse politieke partijen ondanks hun schijnbare tegenstelling?"
answer: "Beide verdedigen het recht van de staat om het leven van mensen te sturen via regels en belastingen"
wrong_answers:
  - "Beide pleiten voor de volledige afschaffing van staatsinterventie in economische zaken"
  - "Beide geven individuele vrijheid voorrang boven de collectieve organisatie van de samenleving"
  - "Beide wijzen het gebruik van monetair beleid af als instrument voor overheidsuitgaven"
explanation: >-
  Ondanks dat ze tegengesteld lijken, delen links en rechts een voorkeur voor staatsinterventie. Beide bekritiseren de vrije markt en verdedigen het recht van de staat om het leven van mensen te sturen via regels en belastingen. Links bekritiseert markten als bron van ongelijkheid, terwijl rechts ze ziet als een bedreiging voor soevereiniteit, maar beide wenden zich tot de staat voor oplossingen.
reviewed: false
