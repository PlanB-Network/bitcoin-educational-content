question: "Trong năm tranh luận xã hội (hôn nhân, nhập cư, súng, ma túy, đồ uống có đường), khung phân tích lặp lại nào định hình lập trường xã hội chủ nghĩa trong từng vấn đề?"
answer: "Một khung xung đột giữa nhóm thống trị và nhóm bị trị, trong đó xã hội được cấu trúc bởi áp bức và nhà nước phải can thiệp để bảo vệ nhóm dễ bị tổn thương"
wrong_answers:
  - "Một khung vị lợi tập trung vào việc tối đa hóa hạnh phúc tổng thể và năng suất kinh tế cho số lượng công dân lớn nhất"
  - "Một khung quyền tự nhiên, trong đó các quyền tự do cá nhân phải được bảo vệ khỏi cả sự can thiệp của nhà nước lẫn doanh nghiệp"
  - "Một khung truyền thống chủ nghĩa, trong đó các thiết chế xã hội đã được xác lập phải được bảo tồn trước những thay đổi hiện đại gây xáo trộn"
explanation: >-
  Lập trường xã hội chủ nghĩa trong các tranh luận xã hội luôn được định hình bởi khung xung đột giữa nhóm thống trị và nhóm bị trị. Về hôn nhân, đó là đa số dị tính áp bức thiểu số đồng tính. Về nhập cư, các hạn chế dựa trên quốc tịch là các hình thức áp bức. Về súng, chỉ nhà nước nên nắm giữ vũ lực để bảo vệ người dễ bị tổn thương. Về đồ uống có đường, các nhà công nghiệp kiếm lợi từ sự dễ bị tổn thương của những người ít được bảo vệ nhất. Lăng kính kẻ áp bức/người bị áp bức này được tái tạo trong nhiều lĩnh vực, bao gồm giới, chủng tộc, và thậm chí cả mối quan hệ giữa nhân loại và thiên nhiên.
