bio: |
  Dr. Russell O'Connor este dezvoltator de infrastructuri tehnice la Blockstream și creatorul Simplicity, un limbaj de contracte inteligente de nouă generație pentru Bitcoin. Deține un doctorat în Științe de la Radboud University Nijmegen și o licență în Matematică Pură și Informatică de la University of Waterloo. Activitatea sa la Blockstream Research a contribuit la inovații de referință ale Bitcoin, printre care Taproot. Simplicity, pe care a conceput-o pentru prima dată în jurul anului 2012 și a detaliat-o în lucrarea sa din 2017, a fost activată pe Liquid Network în iulie 2025, după ani de verificare formală și dezvoltare.

short_bio: Creatorul Simplicity la Blockstream Research
