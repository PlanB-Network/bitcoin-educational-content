question: Что такое суммарный тип (A + B) в Simplicity?
answer: "Помеченное объединение: значение — это либо A с левой меткой, либо B с правой меткой."
wrong_answers:
  - Тип, который одновременно содержит все значения из A и B.
  - Арифметическая сумма размеров в битах двух исходных типов.
  - Тип функции, отображающий каждое входное значение из A в выходное значение в B.
explanation: >-
  Суммарный тип A + B — это помеченное объединение. Каждое значение несёт
  однобитную метку, указывающую, является ли оно левым вариантом (типа A)
  или правым вариантом (типа B). Даже если A и B — один и тот же тип,
  значения с левой и правой меткой остаются различными.
reviewed: false
