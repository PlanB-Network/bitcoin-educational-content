question: "Ders, geleneksel sol-sağ-merkez yelpazesinin ötesinde gerçek siyasi ayrımı ne olarak tanımlar?"
answer: "Temel felsefi ilkeler arasındaki ayrım: özgürlük ya da zorlama, gönüllü rıza ya da mecburiyet, sorumlu birey ya da kolektif"
wrong_answers:
  - "Uluslararası ticaret anlaşmaları ve küresel finansal kurumların kontrolü konusunda zengin ve yoksul uluslar arasındaki ayrım"
  - "Hükümet harcama öncelikleri ve altyapı yatırımı konusunda kentsel ve kırsal nüfuslar arasındaki ayrım"
  - "Toplumsal normlar, aile değerleri ve dinî eğitim konusunda ilerici ve geleneksel kültürler arasındaki ayrım"
explanation: >-
  Ders, gerçek siyasi ayrımın geleneksel sol-sağ-merkez etiketlerinde değil, temel felsefi ilkelerde yattığını savunur: özgürlük ya da zorlama, gönüllü rıza ya da mecburiyet, sorumlu birey ya da kolektif. Siyaseti düşünmenin doğru yolu, etiketlerden değil etik ilkelerden başlamaktır.
reviewed: false
