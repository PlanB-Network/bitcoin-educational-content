question: "Comment la réponse de George W. Bush à la crise financière de 2008 illustre-t-elle la « flexibilité problématique » des principes conservateurs ?"
answer: "Il a abandonné les principes du marché libre pour renflouer de grandes banques, révélant la vision conservatrice de l'État comme garant ultime de la stabilité économique nationale"
wrong_answers:
  - "Il a refusé toute intervention gouvernementale et laissé les banques faire faillite, adhérant strictement à l'idéologie du marché libre quelles qu'en soient les conséquences"
  - "Il a nationalisé durablement le secteur bancaire et introduit une fiscalité progressive, passant du conservatisme au socialisme démocratique"
  - "Il a réagi en réduisant toutes les dépenses publiques et en éliminant les réglementations financières pour laisser le marché s'autocorriger"
explanation: >-
  Bush a déclaré qu'il avait « abandonné les principes du marché libre pour sauver le système de marché libre » en intervenant pour renflouer les grandes banques. Cela illustre la manière dont les conservateurs peuvent donner la priorité à la puissance et à la continuité de la nation plutôt qu'à des principes abstraits de marché. La même logique flexible apparaît dans les politiques commerciales protectionnistes de Trump, menées au nom de l'intérêt national au risque d'alimenter le corporatisme et le capitalisme de connivence.
reviewed: false
