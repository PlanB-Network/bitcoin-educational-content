question: "Welke gemeenschappelijke basis delen libertariërs en conservatieven, en wat verdeelt hen?"
answer: "Ze delen gehechtheid aan beperkte overheid en afwijzing van gedwongen egalitarisme, maar verschillen van mening over militair interventionisme en sociaal beleid"
wrong_answers:
  - "Ze delen steun voor protectionistisch handelsbeleid en nationale defensie, maar verschillen van mening over de rol van religie in het openbare leven"
  - "Ze delen een inzet voor progressieve belastingheffing en verzorgingsprogramma's, maar verschillen van mening over immigratiebeleid"
  - "Ze delen verzet tegen vrije handel en legalisering van drugs, maar verschillen van mening over de omvang van de federale overheid"
explanation: >-
  Libertariërs en conservatieven verdedigen allebei beperkte overheid, wijzen gedwongen egalitarisme af, verzetten zich tegen overheidsschuld en verdedigen de rechten van deelstaten. Libertariërs verwerpen echter het militaire interventionisme van neoconservatieven, verzetten zich tegen conservatief sociaal beleid en subsidies, veroordelen drugsverbod en wijzen protectionisme af. De alliantie is reëel, maar inherent gespannen.
reviewed: false
