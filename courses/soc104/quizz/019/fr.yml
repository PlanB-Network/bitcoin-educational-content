question: "Que révèle l'axe vertical du diagramme de Nolan sur la vraie question politique ?"
answer: "Il révèle si vous voulez imposer vos propres sensibilités aux autres par l'État, ou si vous préférez que chacun soit libre de décider pour lui-même"
wrong_answers:
  - "Il révèle si vous soutenez la gouvernance démocratique ou si vous préférez un pouvoir autoritaire exercé par un seul dirigeant"
  - "Il révèle si vous vous identifiez aux mouvements sociaux progressistes ou aux institutions religieuses traditionnelles"
  - "Il révèle si votre préoccupation principale est la sécurité nationale ou la prospérité économique"
explanation: >-
  L'axe vertical expose la vraie question politique : non pas si vous êtes de gauche ou de droite, mais dans quelle mesure vous voulez que l'État intervienne pour façonner la société selon vos valeurs. Souhaitez-vous imposer vos sensibilités aux autres, ou préférez-vous que chacun soit libre de décider pour lui-même ? Ce cadrage dépasse le clivage gauche-droite et montre que les deux camps peuvent être également étatistes.
reviewed: false
