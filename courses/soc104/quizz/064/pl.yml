question: "Jakie jest stanowisko libertariańskie w sprawie małżeństw osób tej samej płci?"
answer: "Państwo nie ma żadnego interesu w definiowaniu małżeństwa; powinno ono zostać sprywatyzowane i pozostawione jednostkom, stowarzyszeniom oraz instytucjom religijnym"
wrong_answers:
  - "Małżeństwa osób tej samej płci powinny zostać zalegalizowane, ponieważ wszyscy obywatele zasługują na równe traktowanie wobec prawa"
  - "Małżeństwa osób tej samej płci powinny zostać zakazane, ponieważ tradycyjne małżeństwo jest fundamentalną instytucją prokreacji"
  - "Małżeństwa osób tej samej płci powinny zostać zalegalizowane, ale tylko poprzez odrębne ramy prawne, inne niż tradycyjne małżeństwo"
explanation: >-
  Libertarianie twierdzą, że pytanie o małżeństwo jest zasadniczo źle postawione, ponieważ ujmuje się je w kategoriach etatystycznych. Uważają, że państwo nie powinno ingerować w życie prywatne, więc rozwiązaniem jest całkowite oddzielenie małżeństwa od państwa. Narzucając jedną definicję, państwo tworzy konflikty. Pierwsza błędna odpowiedź odzwierciedla stanowisko socjalistyczne lub centrowe, a druga stanowisko konserwatywne.
