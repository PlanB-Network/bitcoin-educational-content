question: "Khái niệm 'trật tự tự phát' theo mô tả của Friedrich Hayek là gì?"
answer: "Các quy tắc và chuẩn mực xã hội nên nảy sinh từ những tương tác tự do giữa các cá nhân thay vì bị áp đặt bởi kế hoạch hóa độc đoán"
wrong_answers:
  - "Các thị trường tự nhiên có xu hướng tiến tới độc quyền trừ khi nhà nước can thiệp để duy trì cân bằng cạnh tranh"
  - "Bầu cử dân chủ là cơ chế hợp pháp duy nhất để thiết lập các luật lệ điều chỉnh xã hội"
  - "Khủng hoảng kinh tế phát sinh một cách tự phát và đòi hỏi chính phủ phải can thiệp ngay lập tức để khôi phục ổn định"
explanation: >-
  Khái niệm trật tự tự phát của Hayek cho rằng các quy tắc điều chỉnh xã hội không nên bị áp đặt từ trên xuống bởi kế hoạch hóa trung ương, mà nên nảy sinh từ sự vận hành tự do của các ý chí cá nhân, hợp đồng và các quan hệ tự nguyện. Đây là một trục nền tảng của tư tưởng libertarian. Nó không hàm ý rằng thị trường có xu hướng tiến tới độc quyền hay khủng hoảng đòi hỏi chính phủ can thiệp.
reviewed: false
