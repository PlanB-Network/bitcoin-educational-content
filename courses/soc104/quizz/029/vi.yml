question: "Những người theo chủ nghĩa tự do cá nhân và những người bảo thủ có điểm chung nào, và điều gì chia rẽ họ?"
answer: "Họ cùng gắn bó với chính quyền hạn chế và bác bỏ chủ nghĩa bình quân cưỡng bức, nhưng bất đồng về chủ nghĩa can thiệp quân sự và các chính sách xã hội"
wrong_answers:
  - "Họ cùng ủng hộ các chính sách thương mại bảo hộ và quốc phòng, nhưng bất đồng về vai trò của tôn giáo trong đời sống công cộng"
  - "Họ cùng cam kết với thuế lũy tiến và các chương trình phúc lợi, nhưng bất đồng về chính sách nhập cư"
  - "Họ cùng phản đối thương mại tự do và hợp pháp hóa ma túy, nhưng bất đồng về quy mô của chính phủ liên bang"
explanation: >-
  Những người theo chủ nghĩa tự do cá nhân và những người bảo thủ đều ủng hộ chính quyền hạn chế, bác bỏ chủ nghĩa bình quân cưỡng bức, phản đối nợ công và bảo vệ quyền của các tiểu bang. Tuy nhiên, những người theo chủ nghĩa tự do cá nhân bác bỏ chủ nghĩa can thiệp quân sự của các tân bảo thủ, phản đối các chính sách xã hội và trợ cấp bảo thủ, lên án việc cấm ma túy và bác bỏ chủ nghĩa bảo hộ. Liên minh này có thật nhưng vốn dĩ căng thẳng.
