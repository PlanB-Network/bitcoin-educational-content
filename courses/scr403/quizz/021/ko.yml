question: "bip0340-verify는 왜 불리언(true/false)을 반환하지 않고 Failure 효과를 사용하나요?"
answer: Schnorr 서명의 배치 검증을 가능하게 하기 위해서이며, 하나의 검사 실패가 배치 전체를 실패시킵니다.
wrong_answers:
  - 불리언 타입은 유닛 타입에 비해 블록 공간 측면에서 너무 비싸기 때문입니다.
  - Simplicity의 타입 시스템은 jets에서 오는 불리언 반환값을 표현할 수 없기 때문입니다.
  - 단순한 불리언 값을 반환하면 완전성 정리를 직접 위반하게 되기 때문입니다.
explanation: >-
  bip0340-verify가 불리언을 반환한다면, 실패한 서명 검사도 여전히
  스크립트가 성공하는 분기로 이어질 수 있습니다. 그런 경우 검증자는 어떤 특정 서명이
  실패했는지를 알아야 하므로 배치 검증이 불가능해집니다. Failure 효과를 사용하면 실패한 검사는 항상
  전체 계산을 중단시키며, 많은 서명을 함께 모으는 효율적인 배치 검증이 가능해집니다.
reviewed: true
