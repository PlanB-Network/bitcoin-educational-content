question: Vauban තම ලේඛනවල අනුමත කළේ කුමන බදු වර්ගයද?
answer: සමානුපාතික බදු, සෑම කෙනෙකුම තම ආදායමේ එකම ප්‍රතිශතය රාජ්‍යයට දිය යුතුය
wrong_answers:
  - ප්‍රගතිශීලී බදුකරණය, ධනවතුන් සඳහා බදු අනුපාතය දුප්පතුන් සඳහා අනුපාතයට වඩා වැඩි විය යුතුය
  - ස්ථාවර අනුපාත බද්ද, ඔබේ ආදායම කුමක් වුවත්, ඔබ සෑම වසරකම රජයට එකම මුදල ගෙවයි
  - ප්‍රතිගාමී බදුකරණය, දුප්පතුන් සඳහා බදු අනුපාත ධනවතුන් සඳහා අනුපාතවලට වඩා වැඩි විය යුතුය
explanation: |
  Vauban සමානුපාතික බද්දක්, එනම් "රාජකීය දශමය", අනුමත කළේය. එය සමාජ තත්ත්වය කුමක් වුවත් සියලුම ප්‍රංශ ජනයාගේ ආදායමෙන් දශමයක් (10%) අය කිරීමෙන් සමන්විත විය. දැනට පැවති බදු ක්‍රමයට වඩා මෙම බද්ද සාධාරණ සහ කාර්යක්ෂම වනු ඇතැයි ඔහු විශ්වාස කළේය.
