question: "Miks hakkasid klassikalised liberaalid Ameerika Ühendriikides alates 1960. aastatest end nimetama 'libertaarlasteks'?"
answer: "Et eristada end Ameerika liberaalidest, kelle tähendus oli nihkunud riikliku interventsionismi poole"
wrong_answers:
  - "Et joonduda Demokraatliku Parteiga ja selle progressiivsete sotsiaalprogrammidega"
  - "Et anda märku oma toetusest Lyndon B. Johnsoni Great Society reformidele"
  - "Et võtta omaks radikaalsem revolutsiooniline identiteet, mis oli inspireeritud Euroopa sotsialistlikest liikumistest"
explanation: >-
  Ameerika Ühendriikides nihkus sõna 'liberal' tähendama suure valitsuse ja riikliku sekkumise toetajaid, eriti pärast New Deal'i ja Great Society't. Klassikalised liberaalid võtsid kasutusele nimetuse 'libertaarlane', et säilitada oma filosoofia algne tähendus. Nad distantseerisid end Ameerika liberaalidest, mitte ei joondunud nendega.
reviewed: false
