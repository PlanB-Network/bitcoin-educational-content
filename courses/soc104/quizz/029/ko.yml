question: "Friedrich Hayek이 설명한 '자생적 질서'의 개념은 무엇인가요?"
answer: "사회적 규칙과 규범은 권위주의적 계획에 의해 부과되는 것이 아니라 자유로운 개인 간 상호작용에서 생겨나야 한다는 것입니다"
wrong_answers:
  - "시장은 국가가 경쟁 균형을 유지하기 위해 개입하지 않는 한 자연스럽게 독점으로 향한다는 것입니다"
  - "민주적 선거만이 사회를 지배하는 법을 수립하는 유일하게 정당한 메커니즘이라는 것입니다"
  - "경제 위기는 자생적으로 발생하며 안정을 회복하기 위해 즉각적인 정부 개입이 필요하다는 것입니다"
explanation: >-
  Hayek의 자생적 질서 개념은 사회를 지배하는 규칙이 중앙 계획에 의해 위에서 부과되어서는 안 되며, 개인 의지, 계약, 자발적 관계의 자유로운 작용에서 생겨나야 한다고 봅니다. 이는 자유지상주의 사상의 근본 축입니다. 이것이 시장이 독점으로 향한다거나 위기에는 정부 개입이 필요하다는 뜻은 아닙니다.
reviewed: false
