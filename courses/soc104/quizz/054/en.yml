question: "Why did classical liberals in the United States begin calling themselves 'libertarians' during the twentieth century?"
answer: "Because American 'liberalism' had been co-opted by growing state interventionism and the welfare state"
wrong_answers:
  - "Because they wanted to distance themselves from European monarchist traditions"
  - "Because the term 'liberal' became associated with anarchism and political violence"
  - "Because new trade agreements required a distinct political identity for free-market advocates"
explanation: >-
  During the twentieth century, a fundamental shift occurred as laissez-faire principles were progressively abandoned in favor of the welfare state. American "liberalism" came to mean something very different from classical liberalism, embracing state interventionism. Classical liberals adopted the term "libertarian" to preserve the distinction. This rebranding had nothing to do with European monarchism, anarchist violence, or trade agreements.
reviewed: false
