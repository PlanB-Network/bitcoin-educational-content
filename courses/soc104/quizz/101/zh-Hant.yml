question: "為什麼 Cypherpunk 主張有匿名特性的數位貨幣是必要的？"
answer: "因為現金這個主要的匿名交易系統正在數位社會中消失，因此必須發明一種具有相同隱私特性的數位替代品"
wrong_answers:
  - "因為現有數位支付系統太慢且昂貴，需要一種更快、更便宜的線上商務替代方案"
  - "因為政府已經禁止所有形式的匿名交易，只有新技術才能規避這些法律"
  - "因為傳統銀行拒絕服務某些人口，使普遍可近用的數位支付系統成為經濟必要性"
explanation: >-
  Cypherpunk 宣言指出，開放社會中的保密性需要匿名交易系統。在數位時代以前，現金一直是這類系統的主要形式。但在現金正在消失的數位社會中，必須發明一種具有相同匿名特性的數位貨幣。這一願景直接預示了 Bitcoin 後來會達成的事情。
reviewed: false
