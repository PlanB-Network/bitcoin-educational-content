question: "Hur kan statligt finansierade socialbidragsprogram skapa perversa effekter och illustrera faran med att förlita sig enbart på intentioner?"
answer: "De kan skapa beroende, ta bort incitament att arbeta och utgöra plundring eftersom pengarna först måste tas från dem som producerade välståndet"
wrong_answers:
  - "De uppmuntrar till överdrivet personligt sparande, minskar konsumtionen och orsakar deflation i den bredare ekonomin"
  - "De stärker privat företagsamhet genom att flytta arbetskostnader till staten och minska behovet av konkurrenskraftiga löner"
  - "De avskaffar klasskillnader så grundligt att social rörlighet blir onödig och innovation stagnerar"
explanation: >-
  Friedman varnar för att generösa intentioner kan ge skadliga konsekvenser när de försummar en rigorös analys av mänskliga incitament. Statligt finansierade biståndsprogram riskerar att skapa beroende, inte ge några incitament att arbeta och utgöra en form av plundring eftersom medlen först måste tas från välståndsproducenterna. Mätbara resultat som fattigdomsminskning och effektivitet måste ges företräde framför ädla intentioner.
reviewed: false
