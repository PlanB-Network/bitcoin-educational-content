question: Gournay bojoval za slobodný obchod najmä s dvoma tovarmi
answer: Obilie a potlačené plátno
wrong_answers:
  - Železo a uhlie
  - Víno a obilniny
  - Soľ a tabak
explanation: |
  Gournay presadzoval liberalizáciu obchodu s obilím a plátnom, pretože bol presvedčený, že predpisy zaťažujúce tieto odvetvia škodia hospodárstvu.
