question: "¿Qué principio rector guiaba los votos de Frederic Bastiat en la Asamblea Nacional?"
answer: "La promoción de las libertades individuales y económicas y la reducción de la injerencia gubernamental"
wrong_answers:
  - "La defensa de la autoridad real y la preservación de las tradiciones monárquicas"
  - "El avance de políticas socialistas para redistribuir la riqueza de forma más igualitaria"
  - "Una estrategia centrista de compromiso entre las facciones de izquierda y derecha"
explanation: >-
  Bastiat votaba basándose en un principio fundamental: promover las libertades individuales y económicas reduciendo al mismo tiempo la injerencia gubernamental. No era un oportunista centrista, ni un monárquico ni un socialista. Votaba con el lado que propusiera medidas alineadas con la libertad y el gobierno limitado.
