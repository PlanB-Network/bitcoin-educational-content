question: Breez SDKのアーキテクチャで、リバース・サブマリンスワップが失敗またはタイムアウトした場合、何が起こりますか？
answer: SDKが返金トランザクションを自動的に作成してブロードキャストし、資金をユーザーのウォレットに戻す
wrong_answers:
  - スワッププロバイダーが手動で回復手続きを開始し、24時間以内にユーザーの対応が必要になる
  - Lightning Networkへの接続が回復するまで、資金がずっとロックされたままになる
  - ユーザーがBoltzのサポートに連絡し、フェデレーションによるペグアウトのトランザクションを手動で実行してもらう必要がある
explanation: |
  Breez SDKは、重要な安全機構として返金の自動管理を実装しています。SDKはすべてのスワップの状態を監視しており、スワップが失敗またはタイムアウトした場合は、ユーザーが何もしなくても自動的に回復処理を行います。これにより、タイムロック付きコントラクトの複雑さが隠され、資金が永久に失われることもありません。他の選択肢は、手動での対応が必要だとしたり、資金が永久に失われることを前提にしたり、自動化された仕組みには存在しない手続きを含んでいたりするため誤りです。