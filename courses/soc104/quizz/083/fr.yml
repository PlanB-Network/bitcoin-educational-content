question: "Qu'est-ce que le constructivisme en tant que conviction politique partagée ?"
answer: "La croyance qu'un gouvernement central peut créer, par la force de la loi, un ordre social qui est bon pour le plus grand nombre"
wrong_answers:
  - "La croyance que la société devrait être organisée par la coopération volontaire entre individus sans ingérence de l'État"
  - "La croyance que seuls les marchés libres peuvent déterminer la distribution optimale des ressources dans la société"
  - "La croyance que l'autorité politique devrait être distribuée également entre tous les citoyens par la démocratie directe"
explanation: >-
  Le constructivisme unit centristes, conservateurs et socialistes autour d'une conviction partagée : la supériorité du processus politique sur le processus de marché. C'est la croyance qu'un gouvernement central peut créer, par la force de la loi, un ordre social bon pour le plus grand nombre. Cela s'oppose directement à la défense libertarienne de l'ordre spontané émergent des interactions volontaires.
