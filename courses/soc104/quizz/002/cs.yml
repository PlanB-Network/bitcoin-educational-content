question: "Jakým vůdčím principem se řídilo hlasování Frédérica Bastiata v Národním shromáždění?"
answer: "Podporou individuálních a ekonomických svobod a omezováním vládních zásahů"
wrong_answers:
  - "Obranou královské autority a zachováním monarchických tradic"
  - "Prosazováním socialistických politik k rovnoměrnějšímu přerozdělení bohatství"
  - "Centristickou strategií kompromisu mezi levicovými a pravicovými frakcemi"
explanation: >-
  Bastiat hlasoval na základě zásadního principu: podpory individuálních a ekonomických svobod při omezování vládních zásahů. Nebyl centristickým oportunistou, royalistou ani socialistou. Hlasoval s tou stranou, která navrhovala opatření v souladu se svobodou a omezenou vládou.
reviewed: false
