question: "Popper は、利点があるにもかかわらず、開かれた社会が本質的に脆弱であり続けると論じるのはなぜか？"
answer: "個人主義が含意する責任は恐ろしく見えることがあり、共同体的保護、権威、または理想化された過去へのノスタルジーに避難所を求める誘惑を生むから"
wrong_answers:
  - "開かれた社会は軍事力を欠き、閉じた社会からの侵略に対して自衛できないから"
  - "民主的制度は本質的に非効率であり、最終的に官僚的複雑性の重みによって崩壊するから"
  - "開かれた社会は過度の経済的不平等を認め、それが必然的に革命と権威主義体制の樹立につながるから"
explanation: >-
  Popper は、開かれた社会の脆弱性が心理的な弱さに由来することを強調する。個人主義が含意する責任は、自分自身の選択を行わなければならず、失敗することもあり得るため、恐ろしく危険に見えることがある。これにより、共同体的保護や、理想化された過去へのノスタルジックな傾向に避難所を求める誘惑が生じる。開かれた社会は、コミュニタリアン的衝動と反復的な暴力への誘惑から、継続的な課題に直面する。
reviewed: false
