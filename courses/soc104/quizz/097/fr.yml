question: "Pourquoi l'inflation monétaire est-elle décrite comme un impôt caché imposé sans le consentement des citoyens ?"
answer: "Parce que la création monétaire par l'État dévalue la monnaie, si bien que les personnes peuvent acheter moins avec le même montant, mais la plupart ne réalisent pas que la hausse des prix reflète une politique gouvernementale plutôt que des forces naturelles du marché"
wrong_answers:
  - "Parce que les banques centrales facturent secrètement des frais sur chaque transaction traitée par le système bancaire sans les divulguer aux titulaires de compte"
  - "Parce que les gouvernements impriment de la monnaie et la distribuent uniquement aux individus riches tout en taxant les pauvres par des taxes de vente plus élevées sur les biens essentiels"
  - "Parce que l'inflation est causée par les entreprises privées qui augmentent les prix pour accroître leurs profits, ce qui fonctionne comme un impôt non officiel sur les consommateurs"
explanation: >-
  L'injection de monnaie dans le système se traduit par une dévaluation monétaire, où le même montant permet d'acheter moins parce que la nouvelle monnaie ne reflète pas une véritable croissance économique. La plupart des personnes ne voient pas que la politique gouvernementale a conduit à la hausse des prix, qui ne sont que le reflet de la dévaluation monétaire. Cela équivaut à un vol légal et à une spoliation institutionnalisée, appauvrissant la classe moyenne tandis que les plus riches captent la nouvelle monnaie par des actifs spéculatifs.
