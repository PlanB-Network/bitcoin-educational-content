question: "Как система фиатных денег усиливает разделение между управляющими и управляемыми?"
answer: "Она позволяет правительствам финансировать неограниченные расходы через создание денег, что обесценивает сбережения посредством инфляции"
wrong_answers:
  - "Она дает гражданам прямой контроль над денежно-кредитной политикой через демократические выборы и референдумы"
  - "Она не позволяет правительствам занимать деньги, вынуждая их опираться исключительно на налогообложение как источник доходов"
  - "Она распределяет вновь созданные деньги поровну между всеми гражданами, чтобы стимулировать экономический рост"
explanation: >-
  Фиатная валюта описывается как краеугольный камень расширения государственной власти, потому что она позволяет правительствам занимать деньги и подталкивать банки к печатанию новых денег. Возникающая в результате инфляция обесценивает сбережения людей, принося выгоду самым богатым и самым влиятельным субъектам. Она не дает гражданам контроля над деньгами, не предотвращает заимствования и не распределяет деньги поровну.
reviewed: false
