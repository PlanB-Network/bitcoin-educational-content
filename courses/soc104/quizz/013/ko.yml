question: "놀런 도표에서 최대한의 경제적 자유와 관련된 상징적 인물들은 누구인가요?"
answer: "마거릿 대처, 로널드 레이건, 하비에르 밀레이"
wrong_answers:
  - "프랭클린 D. 루스벨트, 장 조레스, 버니 샌더스"
  - "넬슨 만델라, 시몬 베유, 노엄 촘스키"
  - "블라디미르 푸틴, 시진핑, 조제프 드 메스트르"
explanation: >-
  대처, 레이건, 밀레이는 국가 개입 축소, 규제 완화, 세금 인하를 선호하는 최대한의 경제적 자유의 상징적 인물로 언급됩니다. 루스벨트, 조레스, 샌더스는 경제에 대한 국가 통제를 선호하는 반대쪽 끝을 나타냅니다. 만델라, 베유, 촘스키는 최대한의 개인적 자유를 나타냅니다. 푸틴, 시진핑, 드 메스트르는 개인 생활에 대한 최대한의 국가 통제를 나타냅니다.
reviewed: false
