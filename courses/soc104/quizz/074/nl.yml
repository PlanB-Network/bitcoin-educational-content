question: "Hoe verschillen de conservatieve en libertarische standpunten over het minimumloon in hun redenering, ondanks dat beide voorstander zijn van afschaffing ervan?"
answer: "Conservatieven accepteren enige staatsbetrokkenheid bij loonvorming als die het concurrentievermogen niet belemmert, terwijl libertariërs het minimumloon zien als een morele oplegging aan de vrijheid om mensen aan te nemen en zaken te doen"
wrong_answers:
  - "Conservatieven verzetten zich tegen het minimumloon omdat het inflatie veroorzaakt, terwijl libertariërs zich ertegen verzetten omdat het vakbonden te veel macht geeft"
  - "Conservatieven willen dat lonen worden vastgesteld door religieuze en gemeenschapsinstellingen, terwijl libertariërs willen dat lonen worden bepaald door door de overheid goedgekeurde marktstudies"
  - "Conservatieven geloven dat minimumlonen per regio moeten verschillen, terwijl libertariërs geloven dat één vlak loon nationaal moet gelden"
explanation: >-
  Beiden zijn voor het verlagen of afschaffen van het minimumloon, maar hun redenering verschilt fundamenteel. Conservatieven accepteren enige staatsbetrokkenheid bij loonvorming, terwijl ze erop staan dat die minimaal en contextafhankelijk blijft, met de nadruk op concurrentievermogen. Libertariërs nemen een sterker moreel standpunt in: een minimumloon is een oplegging aan de vrijheid om mensen aan te nemen en zaken te doen. Wanneer libertariërs "de markt" zeggen, bedoelen ze het contract, vrij onderhandeld tussen twee partijen zonder staatsinmenging.
reviewed: false
