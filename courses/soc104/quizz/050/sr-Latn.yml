question: "Ko se često navodi kao osnivačka figura modernog konzervativizma?"
answer: "Edmund Burke, koji se zalagao za očuvanje institucija i tradicija naspram radikalnih promena Francuske revolucije"
wrong_answers:
  - "Karl Marx, koji je razvio teoriju klasne borbe i istorijskog materijalizma u devetnaestom veku"
  - "John Locke, koji je artikulisao teoriju prirodnih prava i društvenog ugovora u sedamnaestom veku"
  - "Adam Smith, koji je napisao Bogatstvo naroda i utemeljio disciplinu klasične ekonomije"
explanation: >-
  Edmund Burke se često navodi kao osnivačka figura konzervativizma zbog svog protivljenja Francuskoj revoluciji. Njegovo delo Razmišljanja o revoluciji u Francuskoj (1790) zastupalo je razboritost i postepenu reformu umesto radikalne promene. Verovao je da društvo treba da napreduje ne brisanjem svega postojećeg, već kroz postepene reforme koje čuvaju proverene institucije i tradicije.
