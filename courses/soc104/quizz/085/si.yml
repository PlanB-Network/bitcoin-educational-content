question: "Kantගේ motto එක වන 'Sapere aude' මිනිසුන්ට කුමක් කිරීමට උනන්දු කරයිද?"
answer: "තමන් වෙනුවෙන් සිතීමට ධෛර්ය ගෙන, උසස් authority එකක direction මත රඳා පවතින minority state එකෙන් පිටවීමට"
wrong_answers:
  - "formal educational institutions වලට enroll වී credentials ලබාගෙන academic knowledge හඹා යාමට"
  - "morality හි සියලු forms අභියෝගයට ලක් කර personal desire මත පදනම් වූ සම්පූර්ණයෙන්ම නව ethical systems නිර්මාණය කිරීමට"
  - "religious devotion සහ church හි teachings වෙත submission හරහා wisdom සෙවීමට"
explanation: >-
  Sapere aude, “තමන් වෙනුවෙන් සිතීමට ධෛර්ය ගන්න” යන අර්ථයෙන්, Kant විසින් poet Horace වෙතින් ගෙන Enlightenment හි motto බවට පත් කරන ලදී. එය minority වෙතින් පිටවීම සංකේතවත් කරයි; එය superior class හෝ authority එකක direction නොමැතිව තම understanding භාවිත කිරීමට මිනිසුන්ට නොහැකි state එකකි. Kant emancipation සහ තමන්ගේම thinking සඳහා පූර්ණ responsibility උනන්දු කරයි.
reviewed: false
