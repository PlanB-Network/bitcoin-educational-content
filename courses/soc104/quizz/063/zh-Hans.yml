question: "Hannah Arendt 对古典专制主义与极权主义作出的关键区分是什么？"
answer: "极权主义并不只是让人服从暴政规则，而是使人类无法进行独立行动，从而否定政治本身"
wrong_answers:
  - "古典专制主义控制经济，而极权主义只控制政治和军事制度"
  - "极权主义只是专制主义的更极端版本，区别仅在于镇压规模"
  - "古典专制主义用意识形态为其统治辩护，而极权主义纯粹依赖军事力量"
explanation: >-
  Arendt 认为，极权主义与古典专制主义有根本区别。它并不只是更极端的暴政，而是一种使人类变得多余、摧毁其独立行动能力的体系。对 Arendt 而言，政治是一个人民把自身命运掌握在手中的能力，而极权主义正是对这种能力的否定，因此它在性质上不同于专制主义。
reviewed: false
