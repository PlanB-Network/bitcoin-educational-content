question: ElementsのConfidential Transactionsで、ユーザーが無からお金を生み出せないようにしているものは何ですか？
answer: 隠された値が有効な範囲内の正の整数であることを数学的に証明するレンジプルーフ
wrong_answers:
  - トランザクションの金額を公開鍵に暗号学的に結び付けるペダーセン・コミットメント
  - すべてのトランザクションの金額を登録済みアセットの上限と照合するアセットレジストリの検証
  - Confidential Transactionsの金額をすべて復号して検証するフェデレーテッド・コンセンサスのノード
explanation: |
  レンジプルーフは、負の数や不正な金額を使って無からお金を生み出すといった、Confidential Transactionsの悪用を防ぐための暗号メカニズムです。ペダーセン・コミットメントが実際の金額を隠す一方で、レンジプルーフは隠された値が正当な範囲内にあることを証明し、数学的な整合性を保証します。アセットレジストリはアセットIDを人が読める名前に対応付けるだけで、金額の検証は行いません。また、フェデレーションのノードはConfidential Transactionsを復号するのではなく、実際の値を見ないまま検証します。