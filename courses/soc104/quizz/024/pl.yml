question: "Czym jest paleolibertarianizm?"
answer: "Syntezą łączącą odrzucenie państwa jako źródła przymusu ze wzmocnieniem tradycyjnych instytucji i dobrowolnych struktur społecznych"
wrong_answers:
  - "Ruchem libertariańskim, który odrzuca wszystkie tradycyjne wartości i promuje radykalny progresywizm społeczny"
  - "Ideologią konserwatywną, która używa władzy państwowej do egzekwowania tradycyjnych wartości, dopuszczając jednocześnie pewną wolność gospodarczą"
  - "Filozofią centrową, która szuka zrównoważonego kompromisu między socjalistyczną gospodarką a konserwatywną polityką społeczną"
explanation: >-
  Paleolibertarianizm łączy odrzucenie państwa jako instytucjonalnego źródła przymusu ze wzmocnieniem tradycyjnych instytucji i preferencją dla dobrowolnych struktur społecznych zamiast władzy państwowej. Odróżnia się od neolibertarianizmu większą sympatią wobec tradycyjnych wartości. Paleolibertarianin nie sprzeciwia się temu, by wspólnoty organizowały się wokół zasad socjalistycznych lub komunitariańskich; odmawia jedynie tego, by takie wspólnoty narzucały wszystkim swoje wartości siłą prawa.
