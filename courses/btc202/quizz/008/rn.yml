question: Ni igiki Wallet ikeneye gukora kugira ibone uko Blockchain imeze?
answer: Guhuza node ya hafi canke iya kure
wrong_answers:
  - Kubaza izindi wallets ziri ku rubuga.
  -  Kubaza abacukuzi bo ku rubuga
  - Guhuza na plateforme yo guhanahanirako amafaranga kuri internet
explanation: |
   Wallet ikeneye kwifatanya na node kugira ibone amakuru y’uko Blockchain imeze no kugira ishobore gukwiragiza transactions.
reviewed: true
