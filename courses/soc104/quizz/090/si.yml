question: "advantages තිබියදීත් open society ස්වභාවයෙන්ම fragile ලෙස පවතින බව Popper තර්ක කරන්නේ ඇයි?"
answer: "individualism ඇඟවුම් කරන responsibility බියජනක ලෙස පෙනිය හැකි බැවින්, communal protection, authority, හෝ idealized past එකකට nostalgia තුළ refuge සෙවීමට temptation එකක් නිර්මාණය වන නිසා"
