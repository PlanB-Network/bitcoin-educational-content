question: "Cánh tả muốn lập pháp và điều tiết điều gì?"
answer: "Nền kinh tế, xuất phát từ thái độ thù địch với tự do kinh tế, chủ nghĩa tư bản và thị trường tự do"
wrong_answers:
  - "Đạo đức cá nhân và thực hành tôn giáo, xuất phát từ mong muốn bảo tồn các thiết chế truyền thống"
  - "Nhập cư và biên giới quốc gia, xuất phát từ lo ngại về bản sắc văn hóa và chủ quyền"
  - "Công nghệ và đổi mới, xuất phát từ nỗi sợ tự động hóa thay thế lao động con người"
explanation: >-
  Cánh tả ưu tiên công bằng xã hội và bình đẳng, đặc biệt ở cấp độ kinh tế. Điều này dẫn tới thái độ thù địch của họ đối với tự do kinh tế, chủ nghĩa tư bản và thị trường tự do, cũng như mong muốn lập pháp và điều tiết nền kinh tế. Ngược lại, cánh hữu muốn lập pháp về đạo đức và tôn giáo. Điều tiết nhập cư và công nghệ không phải là trọng tâm chính được mô tả ở đây.
