question: "Защо двумерният модел твърди, че повечето политически въпроси могат да бъдат разделени на икономически и лични категории?"
answer: "Защото икономическите въпроси засягат това, което правите като производител и потребител, докато личните въпроси засягат частните ви отношения, убеждения и телесна автономия"
wrong_answers:
  - "Защото всички политически дебати в крайна сметка се свеждат до разногласия относно нивата на данъчно облагане и религиозните практики"
  - "Защото правителствата исторически регулират само две неща: пазара и армията"
  - "Защото политическите философи винаги са отделяли материалните грижи от духовните грижи още от Античността"
explanation: >-
  Двумерният модел се основава на идеята, че политическите въпроси се разделят на две широки категории. Икономическите свободи обхващат производство, потребление, търговия, заетост и управление на парите. Личните свободи обхващат частни отношения, мнения, убеждения и избори относно собственото ви тяло и ум. Това разделение позволява много по-нюансирано картографиране на политическите позиции, отколкото единична ос ляво-дясно.
reviewed: false
