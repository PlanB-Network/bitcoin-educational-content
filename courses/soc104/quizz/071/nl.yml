question: "Waarom verzetten libertariërs zich tegen belastingheffing?"
answer: "Omdat het een morele schending van eigendomsrechten is, een vorm van staatsdiefstal die andermans eigendom zonder toestemming in beslag neemt"
wrong_answers:
  - "Omdat belastingen economisch inefficiënt zijn en altijd leiden tot hogere werkloosheidscijfers"
  - "Omdat belastingheffing buitenlandse investeringen ontmoedigt en de concurrentiepositie van een land verzwakt"
  - "Omdat progressieve belastingstelsels rijke individuen, die de meeste banen creëren, oneerlijk treffen"
explanation: >-
  Het libertarische bezwaar tegen belastingheffing is moreel voordat het economisch is. Libertariërs zien belastingheffing als een vorm van staatsdiefstal en een belemmering voor private eigendom, omdat het bestaat uit het in beslag nemen van andermans eigendom zonder toestemming. Hoewel er economische argumenten tegen belastingheffing kunnen zijn, berust het fundamentele libertarische argument op het principe dat ze eigendomsrechten schendt, niet op berekeningen van efficiëntie of concurrentievermogen.
reviewed: false
