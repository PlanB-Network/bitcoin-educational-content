question: 「case」コンビネータのシグネチャに共有環境型 C が含まれるのはなぜですか？
answer: 両方の分岐がタグ付き入力とあわせて共有コンテキストデータを読めるようにするためです。
wrong_answers:
  - スタックオーバーフローを防ぐために入力のサイズを制限するため。
  - 2つの分岐の間で相互に再帰呼び出しできるようにするため。
  - チェーン内で前にあるコンビネータの出力を保存するため。
explanation: >-
  case コンビネータのシグネチャは (A + B) × C ⊢ D です。追加の型 C は、
  左分岐 (f : A × C ⊢ D) と右分岐 (g : B × C ⊢ D) の両方がアクセスできる
  共有環境として機能します。これは単純な if-then-else よりも強力です。なぜなら
  各分岐は、それぞれ固有のデータと、計算に必要なコンテキスト情報の両方を受け取るからです。
reviewed: false
