question: چرا ترکیب‌گر 'case' در امضای خود یک نوع محیط مشترک C دارد؟
answer: تا هر دو شاخه بتوانند در کنار ورودی برچسب‌خورده، داده‌های زمینه‌ای مشترک را بخوانند.
wrong_answers:
  - برای محدود کردن اندازه ورودی به منظور جلوگیری از سرریز پشته.
  - برای امکان‌پذیر کردن فراخوانی‌های بازگشتی رفت‌وبرگشتی بین دو شاخه.
  - برای ذخیره خروجی ترکیب‌گر قبلی در زنجیره.
explanation: >-
  ترکیب‌گر case امضای (A + B) × C ⊢ D دارد. نوع اضافی C
  مانند یک محیط مشترک عمل می‌کند که هم شاخه چپ (f : A × C ⊢ D)
  و هم شاخه راست (g : B × C ⊢ D) می‌توانند به آن دسترسی داشته باشند. این از
  یک if-then-else ساده قدرتمندتر است، زیرا شاخه‌ها هم داده
  اختصاصی خود و هم اطلاعات زمینه‌ای لازم برای محاسبه را دریافت می‌کنند.
reviewed: false
