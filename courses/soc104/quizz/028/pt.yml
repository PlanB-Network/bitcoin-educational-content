question: "Qual é o conceito de 'ordem espontânea' descrito por Friedrich Hayek?"
answer: "Regras e normas sociais devem emergir de interações individuais livres em vez de serem impostas por planejamento autoritário"
wrong_answers:
  - "Os mercados tendem naturalmente ao monopólio a menos que o Estado intervenha para manter o equilíbrio competitivo"
  - "Eleições democráticas são o único mecanismo legítimo para estabelecer as leis que governam a sociedade"
  - "Crises econômicas surgem espontaneamente e exigem intervenção governamental imediata para restaurar a estabilidade"
explanation: >-
  O conceito de ordem espontânea de Hayek sustenta que as regras que governam a sociedade não devem ser impostas de cima por planejamento central, mas devem emergir do livre jogo das vontades individuais, dos contratos e das relações voluntárias. Esse é um eixo fundamental do pensamento libertário. Ele não implica que os mercados tendam ao monopólio nem que crises exijam intervenção governamental.
