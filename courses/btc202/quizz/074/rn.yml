question:  Ni iyihe structure ikoreshwa mu gusobanura (summarize) transactions zo muri block?
answer: Ivyo Merkle Tree.
wrong_answers:
  - Imeza ya Hash UTXO
  - Dosiye peers.dat
  - assumeutxo register
explanation: |
  Ibikorwa biri mu bubiko bishikirizwa Merkle Tree, umuzi wayo ukaba ushirwa mu mutwe w’ububiko kugira ngo ubutungane bw’ububiko bube ubw’ukuri.
reviewed: true
