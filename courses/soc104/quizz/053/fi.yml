question: "Millaiseen hallintomuotoon keskustalaisuus taipuu?"
answer: "Teknokratiaan, jossa valta uskotaan asiantuntijoille, jotka ohjaavat taloutta ja rahapolitiikkaa"
wrong_answers:
  - "Suoraan demokratiaan, jossa kansalaiset äänestävät jokaisesta merkittävästä politiikkapäätöksestä"
  - "Aristokratiaan, jossa valta on perinteisellä hallitsevalla luokalla"
  - "Laissez-faire-hallintoon, jossa markkinat säätelevät itseään ilman valtion puuttumista"
explanation: >-
  Keskustalaisuus asettaa etusijalle tehokkuuden ja pragmatismin ja taipuu teknokratiaan, mikä tarkoittaa, että valta tulisi uskoa asiantuntijoille, jotka ohjaavat taloutta ja luotsaavat rahapolitiikkaa. Tämä eroaa perustavasti suorasta demokratiasta, aristokratiasta ja laissez-faire-ajattelusta, joista kukin jakaa vallan täysin erilaisten periaatteiden mukaan.
