bio: |
  Blink este un portofel Lightning ușor de utilizat și sigur, care permite tuturor să își gestioneze cu ușurință plățile în Bitcoin. Prin integrarea Stablesats, oferă posibilitatea de a deține, trimite și primi fonduri în Bitcoin sau stablecoins, facilitând în același timp utilizarea zilnică a Lightning Network.
  
short_bio: Portofel custodial Lightning Network ușor de utilizat