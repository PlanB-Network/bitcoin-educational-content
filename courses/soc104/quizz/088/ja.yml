question: "中央計画が失敗する理由について、Hayek の根本的議論は何か？"
answer: "知識は、異なる個人が持つ分散した断片としてのみ存在し、中央権威によって集中または統合されることはできないということ"
wrong_answers:
  - "中央計画者は道徳的に腐敗しており、常に公共善ではなく自分自身の利益のために行動するということ"
  - "民主的制度は経済変化への対応が遅すぎるため、中央集権的決定は常に時代遅れになるということ"
  - "市民が政府の命令に意図的に抵抗し、規制に従うことを拒否するため、中央計画は失敗するということ"
explanation: >-
  Hayek の根本的議論は、情報の性質に基づいている。彼は、知識は集中または統合された形では決して存在せず、すべての異なる個人が持つ分散した断片としてのみ存在することを示した。価値は主観的であり、局所的かつ不完全にしか知られない。事務所に座る中央計画者は、相互作用や交換に従事していないため、物事の真の価格を知らない。
reviewed: false
