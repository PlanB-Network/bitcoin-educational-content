question: "Uyuşturucuların yasallaştırılması konusundaki liberteryen tutum neden devletin toplumdaki rolünün azaltılması koşuluyla birlikte gelir?"
answer: "Çünkü devletin devraldığı bir serbestleştirme, bireysel sorumluluğun yerine devlet tarafından yönetilen bakımı koyar; oysa liberteryenler yurttaşların seçimlerinin sonuçlarına özel derneklerin desteğiyle katlanmasını ister"
wrong_answers:
  - "Çünkü devlet kontrollü yasallaştırma çok fazla vergi geliri yaratır, hükümeti aşırı güçlü ve yozlaşmış hâle getirir"
  - "Çünkü devlet, fiyatları yükseltecek ve karaborsaları yeniden yaratacak kalite standartları dayatır"
  - "Çünkü uyuşturucuların devletçe düzenlenmesi uluslararası ticaret anlaşmalarını ve diplomatik ilişkileri ihlal eder"
explanation: >-
  Liberteryenler uyuşturucularda serbestleştirmeyi destekler, ancak devletin rolünün azaltılması gerektiğinde ısrar ederler; çünkü amaçları devlet yönetimini genişletmek değil, bireysel sorumluluğu yeniden tesis etmektir. Bir kişi bağımlı hâle gelirse, devletten bakım sağlamasını istemek yerine sorumluluk almalıdır. Bağımlılığın çözümü özel girişimde yatar: bireylerden, ailelerden ve hayır derneklerinden gönüllü destek. Devlet tarafından yönetilen yasallaştırma, kişisel sorumluluk şeklindeki temel liberteryen ilkeyle çelişirdi.
