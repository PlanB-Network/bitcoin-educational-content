question: "ฝ่ายขวาต้องการออกกฎหมายด้านใด?"
answer: "ศีลธรรมและศาสนา ซึ่งขับเคลื่อนโดยความปรารถนาจะรักษาสถาบันดั้งเดิมและลำดับชั้นทางสังคม"
wrong_answers:
  - "เศรษฐกิจและตลาดการเงิน ซึ่งขับเคลื่อนโดยความปรารถนาจะลดความไม่เท่าเทียมและกระจายความมั่งคั่งซ้ำ"
  - "วิทยาศาสตร์และการศึกษา ซึ่งขับเคลื่อนโดยความปรารถนาจะควบคุมสิ่งที่สอนในโรงเรียนรัฐ"
  - "การค้าระหว่างประเทศและการทูต ซึ่งขับเคลื่อนโดยความปรารถนาจะขยายอิทธิพลของชาติในต่างประเทศ"
explanation: >-
  ฝ่ายขวาให้ความสำคัญกับศีลธรรมส่วนบุคคลและค่านิยมแบบดั้งเดิม ฝ่ายขวามองว่าอารยธรรมถูกสร้างขึ้นบนสถาบันดั้งเดิมและลำดับชั้นทางสังคมบางอย่างที่ต้องถูกรักษาไว้ และต้องการออกกฎหมายด้านศีลธรรมและศาสนา ฝ่ายซ้าย ไม่ใช่ฝ่ายขวา ที่มุ่งเน้นการออกกฎหมายเกี่ยวกับเศรษฐกิจ วิทยาศาสตร์ การศึกษา และนโยบายการค้าไม่ใช่จุดเน้นหลักที่อธิบายไว้สำหรับฝ่ายขวา
reviewed: false
