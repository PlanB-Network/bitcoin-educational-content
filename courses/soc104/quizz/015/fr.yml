question: "Pourquoi le modèle bidimensionnel soutient-il que la plupart des enjeux politiques peuvent être divisés en catégories économiques et personnelles ?"
answer: "Parce que les enjeux économiques concernent ce que vous faites en tant que producteur et consommateur, tandis que les enjeux personnels concernent vos relations privées, vos croyances et votre autonomie corporelle"
wrong_answers:
  - "Parce que tous les débats politiques se réduisent finalement à des désaccords sur les niveaux d'imposition et les pratiques religieuses"
  - "Parce que les gouvernements ne réglementent historiquement que deux choses : le marché et l'armée"
  - "Parce que les philosophes politiques ont toujours séparé les préoccupations matérielles des préoccupations spirituelles depuis l'Antiquité"
explanation: >-
  Le modèle bidimensionnel repose sur l'idée que les enjeux politiques se divisent en deux grandes catégories. Les libertés économiques couvrent la production, la consommation, le commerce, l'emploi et la gestion de l'argent. Les libertés personnelles couvrent les relations privées, les opinions, les croyances et les choix concernant votre propre corps et votre esprit. Cette séparation permet une cartographie bien plus nuancée des positions politiques qu'un seul axe gauche-droite.
