question: "Bagaimana Michael Oakeshott menggambarkan konservatisme dalam karya filosofisnya?"
answer: "Sebagai temperamen dan disposisi terhadap kehidupan, bukan ideologi sistematis yang kaku"
wrong_answers:
  - "Sebagai teori ekonomi komprehensif dengan resep kebijakan yang presisi untuk setiap bidang pemerintahan"
  - "Sebagai gerakan revolusioner yang berusaha membongkar institusi modern dan kembali ke masyarakat praindustri"
  - "Sebagai doktrin keagamaan murni yang berlandaskan teologi Kristen dan otoritas gerejawi"
explanation: >-
  Michael Oakeshott, seorang filsuf Britania, membela konsepsi konservatisme sebagai temperamen, bukan ideologi sistematis. Esainya On Being Conservative (1956) tetap menjadi rujukan penting. Pandangan tentang konservatisme sebagai disposisi ini juga memengaruhi Friedrich Hayek. Pendekatan Oakeshott menonjol karena kritiknya terhadap rasionalisme dalam politik, dengan menolak gagasan bahwa politik dapat direduksi menjadi suatu sistem.
