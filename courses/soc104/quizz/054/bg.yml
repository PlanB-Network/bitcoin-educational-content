question: "Защо класическите либерали в Съединените щати започват да се наричат 'либертарианци' през XX век?"
answer: "Защото американският 'либерализъм' е бил присвоен от нарастващия държавен интервенционизъм и социалната държава"
wrong_answers:
  - "Защото искат да се разграничат от европейските монархистки традиции"
  - "Защото терминът 'либерален' започва да се свързва с анархизъм и политическо насилие"
  - "Защото нови търговски споразумения изискват отделна политическа идентичност за защитниците на свободния пазар"
explanation: >-
  През XX век настъпва фундаментално изместване, когато принципите laissez-faire са прогресивно изоставени в полза на социалната държава. Американският "либерализъм" започва да означава нещо много различно от класическия либерализъм, възприемайки държавния интервенционизъм. Класическите либерали приемат термина "либертарианец", за да запазят разграничението. Това ребрандиране няма нищо общо с европейския монархизъм, анархисткото насилие или търговските споразумения.
reviewed: false
