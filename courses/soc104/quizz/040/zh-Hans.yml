question: "国家资助的社会援助项目如何产生反效果，从而说明仅依赖意图的危险？"
answer: "它们可能制造依赖、消除工作的激励，并构成掠夺，因为资金必须先从创造财富的人那里取得"
wrong_answers:
  - "它们鼓励过度的个人储蓄，减少消费者支出，并在整体经济中造成通货紧缩"
  - "它们通过把劳动成本转移给政府并减少对竞争性工资的需要来强化私人企业"
  - "它们如此彻底地消除阶级差异，以至于社会流动变得不必要，创新也陷入停滞"
explanation: >-
  Friedman 警告说，当慷慨意图忽视对人类激励的严谨分析时，可能产生有害后果。国家资助的援助项目有制造依赖、产生不工作激励的风险，并且构成一种掠夺形式，因为资金必须先从财富创造者那里取得。减贫和效率等可衡量结果必须优先于崇高意图。
reviewed: false
