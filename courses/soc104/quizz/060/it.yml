question: "Chi viene spesso citato come figura fondatrice del conservatorismo moderno?"
answer: "Edmund Burke, che sosteneva la preservazione di istituzioni e tradizioni contro i cambiamenti radicali della Rivoluzione francese"
wrong_answers:
  - "Karl Marx, che sviluppò la teoria della lotta di classe e del materialismo storico nel diciannovesimo secolo"
  - "John Locke, che articolò la teoria dei diritti naturali e del contratto sociale nel diciassettesimo secolo"
  - "Adam Smith, che scrisse The Wealth of Nations e fondò la disciplina dell'economia classica"
explanation: >-
  Edmund Burke è spesso citato come figura fondatrice del conservatorismo per la sua opposizione alla Rivoluzione francese. Le sue Reflections on the Revolution in France (1790) sostennero prudenza e riforma graduale rispetto al cambiamento radicale. Credeva che la società dovesse avanzare non facendo tabula rasa, ma attraverso riforme incrementali che preservano istituzioni e tradizioni collaudate.
