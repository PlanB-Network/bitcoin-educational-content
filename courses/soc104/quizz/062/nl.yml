question: "Wat is Hannah Arendts belangrijkste onderscheid tussen klassiek despotisme en totalitarisme?"
answer: "Totalitarisme onderwerpt mensen niet louter aan tirannieke regels, maar maakt menselijke wezens onbekwaam tot onafhankelijk handelen, waardoor het de politiek zelf ontkent"
wrong_answers:
  - "Klassiek despotisme controleert de economie, terwijl totalitarisme alleen politieke en militaire instellingen controleert"
  - "Totalitarisme is simpelweg een extremere versie van despotisme, die alleen verschilt in de schaal van repressie"
  - "Klassiek despotisme gebruikt ideologie om zijn heerschappij te rechtvaardigen, terwijl totalitarisme puur op militaire macht vertrouwt"
explanation: >-
  Arendt stelt dat totalitarisme fundamenteel verschilt van klassiek despotisme. Het is niet simpelweg een extremere tirannie, maar een systeem dat menselijke wezens overbodig maakt en hun vermogen tot onafhankelijk handelen vernietigt. Voor Arendt is politiek het vermogen van een volk om zijn lot in eigen handen te nemen, en totalitarisme is de ontkenning zelf van dit vermogen, waardoor het kwalitatief verschilt van despotisme.
reviewed: false
