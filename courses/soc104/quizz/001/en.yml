question: "Where does the left-right political divide originate?"
answer: "From the seating arrangement during the French Revolution debates of 1789"
wrong_answers:
  - "From the writings of Karl Marx and Adam Smith in the nineteenth century"
  - "From the American Civil War between Northern and Southern states"
  - "From the Enlightenment philosophers who separated reason from tradition"
explanation: >-
  The left-right divide dates back to 1789, when deputies in the French National Assembly who favored maintaining the king's power sat to the right of the president, while those who wanted to limit his powers sat to the left. It did not originate from Marx and Smith, the American Civil War, or Enlightenment philosophy.
reviewed: false
