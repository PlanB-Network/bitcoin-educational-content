question: "Wat is het libertarische standpunt over de kwestie van het homohuwelijk?"
answer: "De staat heeft niets te zoeken bij het definiëren van het huwelijk; het moet worden geprivatiseerd en worden overgelaten aan individuen, verenigingen en religieuze instellingen"
wrong_answers:
  - "Het homohuwelijk moet worden gelegaliseerd omdat alle burgers gelijke behandeling onder de wet verdienen"
  - "Het homohuwelijk moet worden verboden omdat het traditionele huwelijk een fundamentele instelling voor voortplanting is"
  - "Het homohuwelijk moet worden gelegaliseerd, maar alleen via een afzonderlijk juridisch kader dat verschilt van het traditionele huwelijk"
explanation: >-
  Libertariërs stellen dat de huwelijkskwestie fundamenteel verkeerd is gekaderd omdat ze in statelijke termen wordt gesteld. Zij geloven dat de staat zich niet met privélevens moet bemoeien, dus de oplossing is om het huwelijk volledig van de staat te scheiden. Door één enkele definitie op te leggen, creëert de staat conflicten. Het eerste foute antwoord weerspiegelt het socialistische of centristische standpunt, en het tweede weerspiegelt het conservatieve standpunt.
reviewed: false
