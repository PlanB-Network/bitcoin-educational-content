question: "在欧洲政治传统中，'liberal' 一词是什么意思？"
answer: "laissez-faire 经济、减少国家干预和个人自由的支持者"
wrong_answers:
  - "国家干预、公共医疗保险和反贫困计划的倡导者"
  - "寻求彻底废除政府和私有财产的激进无政府主义者"
  - "在所有政策领域同等平衡社会主义和保守主义立场的中间主义者"
explanation: >-
  在欧洲，liberalism 一直与 laissez-faire 经济政策、减少国家干预以及捍卫个人自由相关。第一个错误答案描述的是美国 liberals，他们已经把该词的含义转向干预主义。欧洲 liberalism 既不是无政府主义，也不是中间主义。
reviewed: false
