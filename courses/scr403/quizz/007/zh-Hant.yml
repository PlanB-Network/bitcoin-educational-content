question: 在 Simplicity 中，布林型別（𝟚）是如何定義的？
answer: 定義為和型別 𝟙 + 𝟙，恰好持有兩個值（false 與 true）。
wrong_answers:
  - 定義為積型別 𝟙 × 𝟙，這樣就只會持有一個值。
  - 作為一種直接內建於語言中的特殊原始型別。
  - 作為一種僅限於值 0 與 1 的 32 位元整數型別。
explanation: >-
  布林型別 𝟚 定義為 𝟙 + 𝟙，即兩個單位型別的和。左標籤值 σᴸ⟨⟩ 表示 false（0），右標籤值 σᴿ⟨⟩ 表示 true（1）。這是一種一位元的資料型別，僅由單位型別與和型別建構子建成——不需要積型別建構子。
reviewed: false
