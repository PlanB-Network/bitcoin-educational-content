question: Защо изразите на Simplicity се сериализират като DAG-ове, а не като дървета?
answer: За да се предотврати експоненциален растеж, тъй като споделените подизрази се съхраняват само веднъж.
wrong_answers:
  - Защото обикновените дървовидни структури изобщо не могат да представят условно разклоняване.
  - За да се позволи паралелно изпълнение върху много отделни многоядрени процесори.
  - Защото протоколът Liquid Network строго изисква DAG формат точно тук.
explanation: >-
  Изразите на Simplicity естествено образуват дървета, които могат да растат
  експоненциално с увеличаване на сложността. Чрез сериализация като насочени
  ациклични графи (DAG-ове) подизразите, които се появяват многократно, се
  съхраняват веднъж и се реферират от множество родители. Така действителните
  размери на програмите растат линейно, а не експоненциално.
reviewed: false
