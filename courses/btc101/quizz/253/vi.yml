question: Một trong những đặc điểm chính của giao thức Bitcoin là gì?
answer: Nó trung lập với các bên tham gia, nghĩa là đối xử bình đẳng với tất cả người dùng.
wrong_answers:
  - Nó ưu ái một số người dùng hơn người khác.
  - Nó thiên vị một số người dùng.
  - Nó chỉ mang lại lợi ích cho một nhóm người dùng nhất định.
explanation: >-
  Bản cáo bạch đề cập rằng giao thức Bitcoin trung lập với tất cả người tham gia sử dụng.
reviewed: true