question: Ce idee dezvoltată de Biserica Catolică a atacat Gournay?
answer: Interdicția împrumuturilor cu dobândă
wrong_answers:
  - Pomana pentru cei nevoiași
  - Viața autosuficientă a călugărilor
  - Zeciuiala
explanation: |
  Gournay a criticat interdicția împrumuturilor cu dobândă, considerând că aceasta împiedica dezvoltarea economică, deoarece antreprenorii nu puteau accesa creditul.
