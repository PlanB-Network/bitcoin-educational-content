question: "Qual é o conceito de 'risco moral' no contexto do debate sobre subsídios, e qual família política levanta essa preocupação?"
answer: "Risco moral é o incentivo à irresponsabilidade quando empresas são impedidas de falir por meio de subsídios, porque quem paga em última instância é o contribuinte; essa preocupação é levantada pelos libertários"
wrong_answers:
  - "Risco moral é o risco de que empresas subsidiadas se mudem para países com impostos mais baixos, levando empregos consigo; essa preocupação é levantada pelos conservadores"
  - "Risco moral é o perigo de que funcionários do governo se tornem corruptos ao escolher quais empresas recebem subsídios; essa preocupação é levantada pelos centristas"
  - "Risco moral é o problema ético de empresas explorarem trabalhadores depois de receberem recursos públicos; essa preocupação é levantada pelos socialistas"
explanation: >-
  Libertários argumentam que subsídios e resgates criam risco moral: quando empresas são impedidas de falir, isso incentiva irresponsabilidade e imprudência porque não há consequências para decisões ruins. No fim, é o contribuinte quem paga, o que os libertários consideram profundamente injusto. Esse conceito é distinto das preocupações com realocação corporativa, corrupção oficial ou exploração de trabalhadores levantadas por outras famílias políticas.
