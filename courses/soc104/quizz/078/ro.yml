question: "Ce are prioritate față de libertate în filosofia politică conservatoare?"
answer: "Ordinea și tradiția, care trebuie să fie ferm stabilite înainte ca libertatea să poată fi valorizată"
wrong_answers:
  - "Justiția socială și egalitatea, care trebuie garantate înainte ca indivizii să poată fi cu adevărat liberi"
  - "Eficiența economică și rezultatele pragmatice, care determină când este potrivită libertatea"
  - "Drepturile individuale de proprietate, care trebuie protejate înainte ca orice altă libertate să fie acordată"
explanation: >-
  Pentru conservatori, ordinea și tradiția au prioritate față de libertate. Ei susțin că prea multă libertate generează haos și dezordine socială, astfel încât libertatea poate fi valorizată doar după ce ordinea a fost ferm stabilită. Acest lucru contrastează cu viziunea socialistă, care prioritizează justiția, sau cu accentul centrist pe eficiență.
reviewed: false
