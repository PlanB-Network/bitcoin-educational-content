question: "Hitler 的德國與 Stalin 的蘇聯在經濟方法上有何不同，儘管它們共享極權方法？"
answer: "Nazi 德國維持私有財產的表象，同時使私人部門從屬於國家目標；而 Stalinism 廢除所有私人所有權，並全面規劃經濟"
wrong_answers:
  - "Nazi 德國將所有產業完全國有化，而 Stalin 政權允許農業中有限的私人企業"
  - "Nazi 德國推動自由國際貿易以資助重新武裝，而 Stalinism 實施完全的經濟孤立"
  - "Nazi 德國依靠企業與國家的自願合作，而 Stalinism 只使用強迫勞動"
explanation: >-
  儘管兩個政權使用相同的政治方法（人格崇拜、全面監控、系統性消除反對派），它們的經濟模型在形式上有所不同。Nazi 德國沒有正式廢除私有財產，但完全使私人部門從屬於戰爭與重新武裝等國家目標，並強加經濟自給自足。Stalinism 則更進一步，廢除所有私人所有權，實施五年計畫，並直接控制所有生產與分配。
reviewed: false
