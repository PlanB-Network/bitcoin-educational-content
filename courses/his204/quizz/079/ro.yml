question: În lettre sur la marque des fers, Turgot exprimă ideea că este imposibil să știi mai bine decât piața. Care economist austriac a dezvoltat-o în secolul al XX-lea?
answer: Friedrich Hayek
wrong_answers:
  - Carl Menger
  - Murray Rothbard
  - Ludwig von Mises
explanation: |
  Hayek a dezvoltat ideea „descoperirii prețurilor” de către piață, potrivit căreia piața este un proces de descoperire a informației, iar prețurile sunt rezultatul interacțiunii dintre cerere și ofertă.
