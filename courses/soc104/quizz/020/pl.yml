question: "Czym jest konserwatyzm kulturowy?"
answer: "Osobistym przywiązaniem do rodzinnych, moralnych, estetycznych i metafizycznych wartości odziedziczonych z przeszłości, a nie filozofią polityczną"
wrong_answers:
  - "Ideologią polityczną, która używa władzy państwowej, aby poprzez ustawodawstwo narzucać tradycyjne wartości całemu społeczeństwu"
  - "Ruchem, który odrzuca wszelkie formy nowoczesności i dąży do powrotu społeczeństwa do przedindustrialnego sposobu życia"
  - "Doktryną gospodarczą, która chroni krajowe gałęzie przemysłu i sprzeciwia się wolnemu handlowi z innymi krajami"
explanation: >-
  Konserwatyzm kulturowy jest definiowany jako mądrość życiowa: osobiste przywiązanie do rodzinnych, moralnych, estetycznych i metafizycznych wartości odziedziczonych z przeszłości, czy to grecko-rzymskich, czy judeochrześcijańskich. Wyraźnie nie jest filozofią polityczną. Różni się od konserwatyzmu politycznego, który dąży do zachowania instytucji politycznych i ładu społecznego poprzez władzę państwową. Nie polega też na odrzucaniu nowoczesności ani na protekcjonizmie gospodarczym.
