question: "左翼與右翼的國家主義者共享什麼政治目標？"
answer: "贏得權力，以便按照自己的世界觀組織社會，並將其強加給所有人"
wrong_answers:
  - "縮小政府規模，並把決策權還給個別公民"
  - "建立一種直接民主，讓每位公民都能對每項立法決定投票"
  - "消除政黨，並以獨立的技術官僚治理取而代之"
explanation: >-
  左翼與右翼的國家主義者共享同一個政治目標：贏得權力，以便按照自己的世界觀組織社會，並透過立法將其強加給所有人。差別只在於他們的價值觀：右翼援引捍衛文明，而左翼援引捍衛工人階級或受壓迫者。兩者都不是在尋求縮小政府或消除政黨。
reviewed: false
