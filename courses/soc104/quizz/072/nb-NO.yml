question: "Hvorfor motsetter libertarianere seg skattlegging?"
answer: "Fordi det er et moralsk brudd på eiendomsretten, en form for statlig tyveri som beslaglegger en annens eiendom uten samtykke"
wrong_answers:
  - "Fordi skatter er økonomisk ineffektive og alltid fører til høyere arbeidsledighet"
  - "Fordi skattlegging motvirker utenlandske investeringer og svekker et lands konkurranseposisjon"
  - "Fordi progressive skattesystemer urettferdig rammer velstående individer som skaper flest arbeidsplasser"
explanation: >-
  Den libertarianske innvendingen mot skattlegging er moralsk før den er økonomisk. Libertarianere ser skattlegging som en form for statlig tyveri og et hinder for privat eiendom, fordi den består i å beslaglegge en annens eiendom uten samtykke. Selv om det kan finnes økonomiske argumenter mot skattlegging, hviler det grunnleggende libertarianske argumentet på prinsippet om at den krenker eiendomsretten, ikke på beregninger av effektivitet eller konkurranseevne.
reviewed: false
