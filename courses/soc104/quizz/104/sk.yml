question: "Čomu veria libertariáni o schopnosti jednotlivcov rozhodovať sa?"
answer: "Jednotlivci majú právo aj zodpovednosť robiť vlastné rozhodnutia o svojich životoch"
wrong_answers:
  - "Jednotlivci by sa mali rozhodovať až po konzultácii s volenými zástupcami, ktorí rozumejú politickým dôsledkom"
  - "Jednotlivci vo všeobecnosti nie sú schopní robiť dobré rozhodnutia a potrebujú odborné vedenie od vládnych inštitúcií"
  - "Jednotlivci by mali robiť ekonomické rozhodnutia slobodne, ale vo všetkých sociálnych a kultúrnych otázkach sa podriadiť štátu"
explanation: >-
  Z libertariánskeho hľadiska majú jednotlivci právo aj zodpovednosť robiť vlastné rozhodnutia. To kontrastuje s konvenčnými politickými rodinami od ľavice po pravicu, ktoré veria, že vláda by mala robiť niektoré alebo mnohé dôležité rozhodnutia v živote jednotlivca a v ekonomickom živote všeobecne.
reviewed: false
