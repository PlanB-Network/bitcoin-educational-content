question: "Jak se liší konzervativní a libertariánské postoje k minimální mzdě ve svém zdůvodnění, přestože oba podporují její zrušení?"
answer: "Konzervativci přijímají určité státní zapojení do určování mezd, pokud nebrání konkurenceschopnosti, zatímco libertariáni považují minimální mzdu za morální vnucení svobodě najímat a podnikat"
wrong_answers:
  - "Konzervativci odmítají minimální mzdu, protože vytváří inflaci, zatímco libertariáni ji odmítají, protože dává příliš velkou moc odborům"
  - "Konzervativci chtějí, aby mzdy určovaly náboženské a komunitní instituce, zatímco libertariáni chtějí mzdy určené vládou schválenými tržními studiemi"
  - "Konzervativci věří, že minimální mzdy by se měly lišit podle regionu, zatímco libertariáni věří, že by měla celostátně platit jedna jednotná mzda"
explanation: >-
  Obě strany podporují snížení nebo zrušení minimální mzdy, ale jejich zdůvodnění se zásadně liší. Konzervativci přijímají určité státní zapojení do určování mezd, přičemž trvají na tom, aby zůstalo minimální a závislé na kontextu, se zaměřením na konkurenceschopnost. Libertariáni zaujímají silnější morální pozici: minimální mzda je vnucením svobodě najímat a podnikat. Když libertariáni říkají „trh“, myslí tím smlouvu svobodně vyjednanou mezi dvěma stranami bez státního zásahu.
