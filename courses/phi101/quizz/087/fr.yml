question: Selon Constant, qu'est-ce qui limite la souveraineté du peuple ?
answer: La justice et les droits des individus.
wrong_answers:
  - La volonté de la majorité exprimée par les élections.
  - L'autorité du monarque et de l'aristocratie.
  - Les traités internationaux et les alliances entre nations.
explanation: |
  Benjamin Constant affirme que la souveraineté du peuple n'est pas illimitée, mais est circonscrite dans les bornes tracées par la justice et les droits des individus. La volonté de tout un peuple ne peut rendre juste ce qui est injuste, car le droit naturel fixe des limites au pouvoir politique.
reviewed: true
