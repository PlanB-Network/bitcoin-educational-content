question: "Jak kurs argumentuje, że wolność pozwala wartościom lewicowym i prawicowym pokojowo współistnieć?"
answer: "W reżimie autentycznej wolności ludzie o ideałach lewicowych mogą dobrowolnie dzielić się majątkiem i redystrybuować środki, podczas gdy osoby o wartościach prawicowych mogą oszczędzać i przekazywać tradycje, bez narzucania przez którąkolwiek stronę swojego sposobu życia drugiej"
wrong_answers:
  - "Wolność wymaga od obu stron kompromisu przez przyjęcie stanowiska centrowego, w którym rząd równoważy konkurujące wartości za pomocą umiarkowanej regulacji"
  - "Wolność oznacza, że społeczności lewicowe i prawicowe muszą żyć na oddzielnych terytoriach geograficznych z własnymi niezależnymi rządami"
  - "Wolność działa przez umożliwienie obywatelom głosowania nad tym, które wartości powinny być egzekwowane w każdym regionie, rotując między politykami lewicowymi i prawicowymi w każdym cyklu wyborczym"
explanation: >-
  Kurs pokazuje, że w autentycznym reżimie wolności ci, którzy trzymają się ideałów lewicy, mogą dobrowolnie rezygnować z majątku, dzielić się środkami produkcji albo przekazywać wynagrodzenia organizacjom redystrybucyjnym. Ci o wartościach prawicowych mogą ciężko pracować, oszczędzać i przekazywać wartości rodzinne. Nikt nie powinien narzucać innym swojego sposobu życia. To dzięki wolności rynku i sile wyboru cele mogą być osiągane pokojowo.
reviewed: false
