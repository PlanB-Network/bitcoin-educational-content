question: "Prečo sa intencionálne definície politických systémov považujú za problematické na analytické účely?"
answer: "Vytvárajú pojmový zmätok, pretože všetky systémy tvrdia, že sledujú podobné ciele, ako spravodlivosť, rovnosť a sloboda"
wrong_answers:
  - "Sú príliš presné a rigidné, takže nenechávajú priestor pre prirodzený vývoj politických hnutí v čase"
  - "Príliš sa zameriavajú na ekonomické výsledky a ignorujú kultúrne a sociálne rozmery politického života"
  - "Spoliehajú sa na utajované vládne dokumenty, ktoré sú nezávislým výskumníkom zriedka dostupné"
explanation: >-
  Intencionálne definície sa opierajú o deklarované motivácie a ciele, no každý politický systém tvrdí, že sleduje spravodlivosť, rovnosť a slobodu. To znemožňuje odlíšiť systémy jeden od druhého. Štrukturálna analýza naopak hodnotí systémy podľa ich empirických, merateľných dôsledkov a prostriedkov, ktoré používajú, čím odhaľuje ich skutočnú povahu za rétorikou.
reviewed: false
