question: "Hva ønsker venstresiden å lovfeste og regulere?"
answer: "Økonomien, drevet av fiendtlighet mot økonomisk frihet, kapitalisme og det frie markedet"
wrong_answers:
  - "Personlig moral og religiøs praksis, drevet av et ønske om å bevare tradisjonelle institusjoner"
  - "Innvandring og nasjonale grenser, drevet av bekymringer for kulturell identitet og suverenitet"
  - "Teknologi og innovasjon, drevet av frykt for at automatisering skal erstatte menneskelige arbeidere"
explanation: >-
  Venstresiden prioriterer sosial rettferdighet og likhet, særlig på det økonomiske planet. Dette fører til dens fiendtlighet mot økonomisk frihet, kapitalisme og det frie markedet, og dens ønske om å lovfeste og regulere økonomien. Høyresiden ønsker derimot å lovfeste moral og religion. Regulering av innvandring og teknologi er ikke hovedfokuset som beskrives her.
reviewed: false
