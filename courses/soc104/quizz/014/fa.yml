question: "سیستم پول فیات چگونه شکاف میان حاکمان و حکومت‌شوندگان را تقویت می‌کند؟"
answer: "به دولت‌ها اجازه می‌دهد از طریق خلق پول هزینه‌های نامحدود را تأمین مالی کنند، که پس‌اندازها را از طریق تورم بی‌ارزش می‌کند"
wrong_answers:
  - "از طریق انتخابات و همه‌پرسی‌های دموکراتیک، کنترل مستقیم سیاست پولی را به شهروندان می‌دهد"
  - "مانع قرض‌گرفتن دولت‌ها می‌شود و آن‌ها را وادار می‌کند برای درآمد فقط به مالیات تکیه کنند"
  - "پول تازه خلق‌شده را به‌طور برابر میان همهٔ شهروندان توزیع می‌کند تا رشد اقتصادی را تحریک کند"
explanation: >-
  ارز فیات به عنوان سنگ بنای گسترش قدرت دولت توصیف می‌شود، زیرا به دولت‌ها اجازه می‌دهد قرض بگیرند و بانک‌ها را به چاپ پول جدید سوق دهند. تورم حاصل پس‌اندازهای مردم را بی‌ارزش می‌کند و به ثروتمندترین و قدرتمندترین نهادها سود می‌رساند. این امر نه به شهروندان کنترل پولی می‌دهد، نه از قرض‌گرفتن جلوگیری می‌کند، و نه پول را به‌طور برابر توزیع می‌کند.
reviewed: false
