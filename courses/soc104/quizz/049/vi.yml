question: "Những người libertarian đặt điều gì ở trung tâm triết lý chính trị của họ?"
answer: "Đạo đức và luật pháp"
wrong_answers:
  - "Tăng trưởng kinh tế và tạo ra của cải"
  - "Bình đẳng xã hội và phúc lợi tập thể"
  - "Bản sắc quốc gia và bảo tồn văn hóa"
explanation: >-
  Những người libertarian tự phân biệt mình với tất cả các họ chính trị khác bằng cách đặt đạo đức và luật pháp ở trung tâm triết lý của họ, chứ không phải nền kinh tế. Khi họ bảo vệ kinh tế thị trường, điều đó ít vì khả năng tạo ra của cải của nó hơn là vì nó thúc đẩy tự do cá nhân và trách nhiệm. Tăng trưởng kinh tế là một lợi ích thứ cấp, không phải nguyên tắc nền tảng.
reviewed: false
