question: "What guiding principle drove Frederic Bastiat's votes in the National Assembly?"
answer: "The promotion of individual and economic freedoms and the reduction of government interference"
wrong_answers:
  - "The defense of royal authority and the preservation of monarchical traditions"
  - "The advancement of socialist policies to redistribute wealth more equally"
  - "A centrist strategy of compromise between the left and right factions"
explanation: >-
  Bastiat voted based on a fundamental principle: promoting individual and economic freedoms while reducing government interference. He was not a centrist opportunist, nor a royalist or a socialist. He voted with whichever side proposed measures aligned with freedom and limited government.
reviewed: false
