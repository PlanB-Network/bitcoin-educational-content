question: "Bitcoin welfare state के किन तीन pillars को challenge करता है?"
answer: "Fiscal system, debt के through spending finance करने के लिए monetary monopoly, और alternative currencies के use को prevent करने के लिए transactions की surveillance"
wrong_answers:
  - "Military budget, public education system, और government-controlled healthcare infrastructure"
  - "Judicial system, legislative process, और businesses पर regulations की executive enforcement"
  - "Social security system, minimum wage legislation, और progressive income tax structure"
explanation: >-
  Bitcoin उन तीन pillars को challenge करता है जिन पर welfare state rest करती है। First, fiscal system जो expenditures cover करने के लिए insufficient है। Second, monetary monopoly, यानी debt के through spending finance करने के लिए money issue करने की capacity। Third, transactions की surveillance, लोगों को state-imposed fiat के अलावा कोई भी currency use करने से prevent करने की ability। Bitcoin तीनों को simultaneously undermine करता है।
reviewed: false
