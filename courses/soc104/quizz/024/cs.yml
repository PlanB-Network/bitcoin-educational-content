question: "Co je paleo-libertarianismus?"
answer: "Syntéza kombinující odmítnutí státu jako zdroje donucení s posílením tradičních institucí a dobrovolných společenských struktur"
wrong_answers:
  - "Libertariánské hnutí, které odmítá všechny tradiční hodnoty a podporuje radikální sociální progresivismus"
  - "Konzervativní ideologie, která používá státní moc k prosazování tradičních hodnot a zároveň připouští určitou ekonomickou svobodu"
  - "Centristická filozofie, která hledá vyvážený kompromis mezi socialistickou ekonomikou a konzervativní sociální politikou"
explanation: >-
  Paleo-libertarianismus kombinuje odmítnutí státu jako institucionálního zdroje donucení s posílením tradičních institucí a preferencí dobrovolných společenských struktur před státní autoritou. Od neo-libertarianismu se odlišuje tím, že je sympatičtější k tradičním hodnotám. Paleo-libertarián se nestaví proti tomu, aby se komunity organizovaly podle socialistických nebo komunitárních principů; odmítá pouze to, aby takové komunity vnucovaly své hodnoty všem silou zákona.
