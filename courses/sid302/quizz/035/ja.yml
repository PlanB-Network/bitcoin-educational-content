question: Breez SDKの開発者向けインターフェースにある、Connect（接続）、Prepare（準備）、Execute（実行）という3ステップの手順の主な目的は何ですか？
answer: ウォレットを同期し、すべての手数料を事前に計算してからトランザクションを構築することで、複雑な金融フローを標準化すること
wrong_answers:
  - アトミックな処理を始める前に、複数のスワッププロバイダーとの間に冗長なバックアップ接続を確立すること
  - チェーンをまたぐサブマリンスワップのトランザクションに関わるネットワークごとに、別々の暗号署名を作ること
  - エスクローから資金を解放する前に、ペイメント・プリイメージをタイムロック付きコントラクトと照合して検証すること
explanation: |
  Connect、Prepare、Executeというパターンは、複雑な処理を扱いやすいステップに分けることで開発を簡単にします。Connectはウォレットを初期化して監視用の接続を確立し、Prepareはすべてのコストを計算してユーザーにわかりやすく示し、Executeは実際のトランザクションの構築とブロードキャストを行います。この標準化によって、サブマリンスワップやチェーンをまたぐ処理の複雑さが隠され、開発者は低レベルの詳細を管理しなくても、Bitcoinの機能を組み込みやすくなります。