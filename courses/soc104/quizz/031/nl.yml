question: "Wat geloven de Franse libertaires (socialistische anarchisten) over privé-eigendom?"
answer: "Privé-eigendom en kapitalisme moeten worden afgeschaft omdat ze bronnen van onderdrukking zijn"
wrong_answers:
  - "Privé-eigendom is een natuurlijk recht dat aan de staat voorafgaat en koste wat kost beschermd moet worden"
  - "Privé-eigendom moet door de staat worden gereguleerd, maar nooit volledig uit de samenleving worden verwijderd"
  - "Privé-eigendom is alleen aanvaardbaar wanneer het gelijk wordt verdeeld onder alle leden van een commune"
explanation: >-
  De Franse libertaires, erfgenamen van het socialistisch anarchisme via denkers als Proudhon en Bakunin, stellen dat zowel de staat als privé-eigendom moeten worden afgeschaft als twee bronnen van onderdrukking. Dit wordt samengevat in Proudhons beroemde formule "Eigendom is diefstal." Het eerste foute antwoord beschrijft het libertarische standpunt, dat fundamenteel tegengesteld is aan de visie van de libertaires.
