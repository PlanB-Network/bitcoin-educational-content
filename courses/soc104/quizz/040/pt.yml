question: "Como programas de assistência social financiados pelo Estado podem produzir efeitos perversos, ilustrando o perigo de depender apenas das intenções?"
answer: "Eles podem criar dependência, remover incentivos ao trabalho e equivaler à espoliação, já que o dinheiro deve primeiro ser retirado daqueles que produziram a riqueza"
wrong_answers:
  - "Eles incentivam a poupança pessoal excessiva, reduzem o consumo e causam deflação na economia mais ampla"
  - "Eles fortalecem a iniciativa privada ao transferir custos trabalhistas para o governo e reduzir a necessidade de salários competitivos"
  - "Eles eliminam as distinções de classe tão completamente que a mobilidade social se torna desnecessária e a inovação estagna"
explanation: >-
  Friedman alerta que intenções generosas podem produzir consequências prejudiciais quando negligenciam uma análise rigorosa dos incentivos humanos. Programas de assistência financiados pelo Estado correm o risco de criar dependência, não gerar incentivo ao trabalho e constituir uma forma de espoliação, já que os recursos devem primeiro ser retirados dos produtores de riqueza. Resultados mensuráveis, como redução da pobreza e eficiência, devem ter precedência sobre intenções nobres.
reviewed: false
