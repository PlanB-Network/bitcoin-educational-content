question: "なぜサイファーパンクは、匿名性を備えたデジタル通貨が必要だと主張したのか？"
answer: "主要な匿名取引システムである現金がデジタル社会で消えつつあり、同じプライバシー特性を持つデジタルな代替物を発明しなければならないから"
wrong_answers:
  - "既存のデジタル決済システムは遅すぎて高すぎたため、オンライン商取引のためにより速く安価な代替手段が必要だったから"
  - "政府がすでにあらゆる形態の匿名取引を禁止しており、新しい技術だけがこれらの法律を回避できたから"
  - "従来の銀行が特定の人々へのサービスを拒否したため、普遍的にアクセスできるデジタル決済システムが経済的に必要だったから"
explanation: >-
  サイファーパンクのマニフェストは、開かれた社会における機密性には匿名取引システムが必要だと述べている。
  デジタル時代までは、現金がこの種の主要なシステムとして機能していた。
  しかし現金が消えつつあるデジタル社会では、同じ匿名性の性質を持つデジタル通貨が発明されなければならない。
  このビジョンは、Bitcoin が実現することを直接先取りしていた。
reviewed: false
