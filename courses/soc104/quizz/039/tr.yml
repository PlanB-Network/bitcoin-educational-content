question: "Milton Friedman siyasi politikaları yargılama konusunda hangi uyarıda bulundu?"
answer: "Politikalar niyetlerine göre değil, sonuçlarına göre yargılanmalıdır"
wrong_answers:
  - "Politikalar, onları öneren siyasetçilerin ahlaki karakterine göre yargılanmalıdır"
  - "Politikalar, genel seçmen kitlesi arasında ne kadar popüler olduklarına göre yargılanmalıdır"
  - "Politikalar, ülkenin ilk anayasasıyla uyumlu olup olmadıklarına göre yargılanmalıdır"
explanation: >-
  Friedman, en büyük hatalardan birinin politikaları sonuçlarına göre değil niyetlerine göre yargılamak olduğunu yazmış; yoksullar için olduğu söylenen programların neredeyse her zaman sponsorlarının amaçladıklarının tersine etkiler ürettiğini belirtmiştir. Bu, Bastiat'nın iyi bir iktisatçının tüm nüfus üzerindeki hem kısa vadeli hem de uzun vadeli etkileri dikkate aldığı yönündeki öğretisini yankılar.
reviewed: false
