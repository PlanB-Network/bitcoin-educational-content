question: "How does the chapter suggest you discover your brand characteristics if you struggle to identify them yourself?"
answer: "Ask five people you trust to each give you five words that describe you"
wrong_answers:
  - "Take an online personality assessment test and use the top five results"
  - "Study successful personal brands and adopt the traits they display publicly"
  - "Hire a professional branding consultant to conduct interviews on your behalf"
explanation: >-
  The chapter recommends asking five people you trust (family, friends, or colleagues) to each describe you in five words. Out of those 25 words, the ones that resonate become your brand characteristics. This approach grounds your brand in how others already perceive you rather than in borrowed traits or external assessments.
reviewed: false
