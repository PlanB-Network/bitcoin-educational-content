question: "Hoe verschilden de economische benaderingen van Hitlers Duitsland en Stalins Sovjet-Unie, ondanks hun gedeelde totalitaire methoden?"
answer: "Nazi-Duitsland handhaafde een schijn van private eigendom terwijl het de private sector ondergeschikt maakte aan staatsdoelstellingen, terwijl het stalinisme alle private eigendom afschafte en de economie volledig plande"
wrong_answers:
  - "Nazi-Duitsland nationaliseerde alle industrieën volledig, terwijl Stalins regime beperkte particuliere ondernemingen in de landbouw toestond"
  - "Nazi-Duitsland bevorderde vrije internationale handel om herbewapening te financieren, terwijl het stalinisme volledige economische isolatie oplegde"
  - "Nazi-Duitsland vertrouwde op vrijwillige samenwerking van bedrijven met de staat, terwijl het stalinisme alleen dwangarbeid gebruikte"
explanation: >-
  Hoewel beide regimes identieke politieke methoden gebruikten (persoonlijkheidscultus, totale surveillance, systematische uitschakeling van oppositie), verschilden hun economische modellen in vorm. Nazi-Duitsland schafte private eigendom niet formeel af, maar maakte de private sector volledig ondergeschikt aan staatsdoelen zoals oorlog en herbewapening, en legde economische autarkie op. Het stalinisme ging verder door alle private eigendom af te schaffen, vijfjarenplannen in te voeren en alle productie en distributie rechtstreeks te controleren.
reviewed: false
