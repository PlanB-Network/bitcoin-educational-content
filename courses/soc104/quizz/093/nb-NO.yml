question: "Hvilke tre pilarer i velferdsstaten utfordrer Bitcoin?"
answer: "Skattesystemet, det monetære monopolet for å finansiere utgifter gjennom gjeld, og overvåkingen av transaksjoner for å hindre bruk av alternative valutaer"
wrong_answers:
  - "Militærbudsjettet, det offentlige utdanningssystemet og den statskontrollerte helseinfrastrukturen"
  - "Rettssystemet, lovgivningsprosessen og den utøvende håndhevingen av reguleringer overfor bedrifter"
  - "Trygdesystemet, minstelønnslovgivningen og den progressive inntektsskattestrukturen"
explanation: >-
  Bitcoin utfordrer de tre pilarene som velferdsstaten hviler på. For det første skattesystemet, som er utilstrekkelig til å dekke utgiftene. For det andre det monetære monopolet, altså evnen til å utstede penger for å finansiere utgifter gjennom gjeld. For det tredje overvåkingen av transaksjoner, evnen til å hindre folk i å bruke noen annen valuta enn den statspålagte fiatvalutaen. Bitcoin undergraver alle tre samtidig.
reviewed: false
