question: "In che modo il sistema della moneta fiat rafforza la divisione tra governanti e governati?"
answer: "Consente ai governi di finanziare una spesa illimitata tramite la creazione di moneta, che svaluta i risparmi attraverso l'inflazione"
wrong_answers:
  - "Dà ai cittadini il controllo diretto della politica monetaria tramite elezioni democratiche e referendum"
  - "Impedisce ai governi di indebitarsi, costringendoli a fare affidamento solo sulla tassazione per le entrate"
  - "Distribuisce la moneta appena creata in modo uguale tra tutti i cittadini per stimolare la crescita economica"
explanation: >-
  La valuta fiat è descritta come la pietra angolare dell'espansione del potere statale perché consente ai governi di prendere in prestito e di spingere le banche a stampare nuova moneta. L'inflazione risultante svaluta i risparmi delle persone, avvantaggiando le entità più ricche e potenti. Non dà ai cittadini il controllo monetario, né impedisce l'indebitamento o distribuisce il denaro in modo uguale.
reviewed: false
