question: "Proč libertariánský postoj k legalizaci drog přichází s podmínkou, že role státu ve společnosti musí být omezena?"
answer: "Protože liberalizace převzatá státem by nahradila individuální odpovědnost státem řízenou péčí, zatímco libertariáni chtějí, aby občané nesli důsledky svých voleb s podporou soukromých sdružení"
wrong_answers:
  - "Protože státem kontrolovaná legalizace by vytvořila příliš velké daňové příjmy a učinila vládu příliš mocnou a zkorumpovanou"
  - "Protože stát by vnutil standardy kvality, které by zvýšily ceny a znovu vytvořily černé trhy"
  - "Protože vládní regulace drog by porušila mezinárodní obchodní dohody a diplomatické vztahy"
explanation: >-
  Libertariáni podporují liberalizaci drog, ale trvají na tom, že role státu musí být omezena, protože jejich cílem je obnovit individuální odpovědnost, nikoli rozšířit státní řízení. Pokud se někdo stane závislým, musí nést odpovědnost místo toho, aby žádal stát o poskytování péče. Řešení závislosti spočívá v soukromé iniciativě: dobrovolné podpoře od jednotlivců, rodin a charitativních sdružení. Legalizace řízená státem by odporovala základnímu libertariánskému principu osobní odpovědnosti.
