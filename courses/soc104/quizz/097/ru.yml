question: "Каков главный посыл Манифеста шифропанка Эрика Хьюза 1993 года о приватности?"
answer: "Приватность необходима открытому обществу в электронную эпоху, и люди должны строить её сами, а не ожидать, что правительства или корпорации её гарантируют"
wrong_answers:
  - "Приватность — это роскошь, которой нужно пожертвовать в обмен на национальную безопасность и защиту демократических институтов"
  - "Приватность должна регулироваться международными договорами, устанавливающими единые стандарты защиты данных во всех странах"
  - "Приватность важна только для преступников и диссидентов, тогда как законопослушные граждане выигрывают от прозрачных систем надзора"
explanation: >-
  Манифест Эрика Хьюза 1993 года утверждает, что приватность необходима открытому обществу в электронную эпоху и что мы не можем ожидать, что правительства, корпорации или другие крупные организации её гарантируют. Фундаментальная мотивация состоит в том, что конфиденциальность — ключевой элемент свободы, и её должны строить сами люди, а не ждать её как подарка от институтов.
