question: "法定通貨 (Fiat) 制度は、統治する側と統治される側の分断をどのように強化しますか？"
answer: "政府が通貨発行を通じて無制限の支出を賄えるようにし、それがインフレーションを通じて貯蓄の価値を低下させる"
wrong_answers:
  - "民主的選挙と国民投票を通じて、市民に金融政策への直接的な統制を与える"
  - "政府の借り入れを防ぎ、歳入を税収だけに頼らざるを得なくする"
  - "経済成長を刺激するため、新たに創造された通貨をすべての市民に平等に分配する"
explanation: >-
  法定通貨 (Fiat) は、政府が借り入れを行い、銀行に新たな通貨を発行させることを可能にするため、国家権力拡大の礎石として説明されます。その結果生じるインフレーションは人々の貯蓄の価値を低下させ、最も裕福で強力な主体を利します。それは市民に金融の統制権を与えるものではなく、借り入れを防ぐものでも、通貨を平等に分配するものでもありません。
reviewed: false
