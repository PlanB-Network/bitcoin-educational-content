question: "Czym różnią się strategie zniesienia państwa między libertaires a libertarianami?"
answer: "Libertaires historycznie opowiadają się za przemocowym zniszczeniem, podczas gdy libertarianie dążą do delegitymizacji państwa przez edukację i nieposłuszeństwo obywatelskie"
wrong_answers:
  - "Libertaires używają demokratycznych wyborów do demontażu państwa, podczas gdy libertarianie sprzyjają zbrojnej rewolucji i akcji bezpośredniej"
  - "Libertaires skupiają się na budowaniu alternatywnych wspólnot, podczas gdy libertarianie działają w istniejącym systemie politycznym, aby uchwalać reformy"
  - "Zarówno libertaires, jak i libertarianie zgadzają się, że pokojowy protest jest jedynym uzasadnionym środkiem transformacji społecznej"
explanation: >-
  Libertaires historycznie opowiadają się za zniszczeniem państwa i kapitalizmu poprzez przemoc, w tym terror i ukierunkowane ataki. Libertarianie przeciwnie, odrzucają przemoc agresywną jako nieuzasadnioną. Ich strategia opiera się na delegitymizacji państwa poprzez argumentację, debatę, edukację i nieposłuszeństwo obywatelskie. Te fundamentalnie różne podejścia do zmiany odzwierciedlają ich głębsze spory filozoficzne.
