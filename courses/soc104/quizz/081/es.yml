question: "¿Qué es el constructivismo como convicción política compartida?"
answer: "La creencia de que un gobierno central puede crear, por fuerza de ley, un orden social que sea bueno para el mayor número"
wrong_answers:
  - "La creencia de que la sociedad debe organizarse mediante la cooperación voluntaria entre individuos sin interferencia estatal"
  - "La creencia de que solo los mercados libres pueden determinar la distribución óptima de los recursos en la sociedad"
  - "La creencia de que la autoridad política debe distribuirse por igual entre todos los ciudadanos mediante democracia directa"
explanation: >-
  El constructivismo une a centristas, conservadores y socialistas en torno a una convicción compartida: la superioridad del proceso político sobre el proceso de mercado. Es la creencia de que un gobierno central puede crear, por fuerza de ley, un orden social bueno para el mayor número. Esto se opone directamente a la defensa libertaria del orden espontáneo que surge de las interacciones voluntarias.
reviewed: false
