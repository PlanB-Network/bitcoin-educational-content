question: "مایکل اوکشات در کار فلسفی خود محافظه‌کاری را چگونه توصیف کرد؟"
answer: "به‌عنوان خلق‌وخو و گرایشی نسبت به زندگی، نه یک ایدئولوژی نظام‌مند و سخت"
wrong_answers:
  - "به‌عنوان یک نظریه اقتصادی جامع با نسخه‌های سیاستی دقیق برای هر حوزه‌ای از دولت"
  - "به‌عنوان جنبشی انقلابی که می‌کوشد نهادهای مدرن را برچیند و به جامعه پیشاصنعتی بازگردد"
  - "به‌عنوان آموزه‌ای کاملاً دینی که بر الهیات مسیحی و اقتدار کلیسایی استوار است"
explanation: >-
  مایکل اوکشات، فیلسوف بریتانیایی، از تصوری از محافظه‌کاری به‌عنوان خلق‌وخو دفاع کرد، نه ایدئولوژی نظام‌مند. مقاله او با عنوان درباره محافظه‌کار بودن (1956) همچنان مرجعی اساسی است. این نگاه به محافظه‌کاری به‌عنوان یک گرایش، بر فریدریش هایک نیز اثر گذاشت. رویکرد اوکشات به‌سبب نقدش بر عقل‌گرایی در سیاست قابل توجه است، زیرا این ایده را رد می‌کند که سیاست را می‌توان به یک نظام فروکاست.
reviewed: false
