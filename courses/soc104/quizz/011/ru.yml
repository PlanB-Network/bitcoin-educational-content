question: "Что включает категория экономической свободы?"
answer: "То, что вы делаете как производитель и потребитель: покупка, продажа, производство, работа, наем и управление своими деньгами"
wrong_answers:
  - "Ваши религиозные убеждения, личные отношения и свободу выражения"
  - "Ваше право голосовать, участвовать в выборах и вступать в политические партии"
  - "Вашу способность свободно путешествовать, выбирать место жительства и пересекать национальные границы"
explanation: >-
  Экономическая свобода охватывает то, что вы делаете как производитель и потребитель: что вы можете покупать, продавать или производить; где вы работаете; кого нанимаете; и что делаете со своими деньгами. Личные отношения, религиозные убеждения и свобода передвижения относятся к категории личной свободы, а не экономической.
reviewed: false
