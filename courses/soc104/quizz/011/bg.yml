question: "Кои емблематични фигури са свързани с максималната икономическа свобода върху диаграмата на Нолан?"
answer: "Margaret Thatcher, Ronald Reagan и Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures и Bernie Sanders"
  - "Nelson Mandela, Simone Veil и Noam Chomsky"
  - "Vladimir Putin, Xi Jinping и Joseph de Maistre"
explanation: >-
  Thatcher, Reagan и Milei са посочени като емблематични фигури на максималната икономическа свобода, защото предпочитат по-малко държавна намеса, по-малко регулации и по-ниски данъци. Roosevelt, Jaures и Sanders представляват противоположния край, предпочитащ държавен контрол върху икономиката. Mandela, Veil и Chomsky представляват максимална лична свобода. Putin, Xi Jinping и de Maistre представляват максимален държавен контрол върху личния живот.
