question: "Que pensent les libertariens de la capacité des individus à prendre des décisions ?"
answer: "Les individus ont à la fois le droit et la responsabilité de prendre leurs propres décisions concernant leur vie"
wrong_answers:
  - "Les individus ne devraient prendre des décisions qu'après avoir consulté des représentants élus qui comprennent les implications des politiques publiques"
  - "Les individus sont généralement incapables de prendre de bonnes décisions et ont besoin de l'orientation experte des institutions gouvernementales"
  - "Les individus devraient prendre librement les décisions économiques, mais s'en remettre à l'État sur toutes les questions sociales et culturelles"
explanation: >-
  D'un point de vue libertarien, les individus ont à la fois le droit et la responsabilité de prendre leurs propres décisions. Cela contraste avec les familles politiques conventionnelles, de gauche à droite, qui pensent que le gouvernement devrait prendre certaines ou beaucoup des décisions importantes dans la vie d'un individu et dans la vie économique en général.
reviewed: false
