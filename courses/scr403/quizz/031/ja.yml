question: push-<n の型は Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ です。なぜその出力は完全なベクトル型 Aⁿ を含む和でなければならないのでしょうか？
answer: バッファ Aᑉⁿ は最大でも n−1 個の項目しか保持できないため、満杯のバッファに push すると n 個の項目になります。それを表せるのは Aⁿ だけです。
wrong_answers:
  - 和により、ベクトルはオプション積よりもコンパクトにシリアライズされるため、呼び出し側がより安いエンコーディングを選べる。
  - Push は空のバッファで失敗する可能性があり、Aⁿ 分岐は古い内容を運ぶエラーケースである。
  - case は、和型のバッファを消費する任意の関数にも、和型の出力を生成することを要求する。
explanation: >-
  Aᑉⁿ は長さが n より厳密に小さいリストの型そのものなので、最大容量の
  バッファは n−1 個の要素を保持しています。そこにもう 1 つ push すると
  ちょうど n 個の要素になり、これは Aᑉⁿ では表せません。Aⁿ の加項は、
  そのオーバーフローした結果を完全なベクトルとして返します。オーバーフローを
  出力型にエンコードすることで、push-<n は部分関数ではなく全域関数のままになります。
  空バッファでの失敗ケースは pop-<n に属するものであり、push ではありません。
