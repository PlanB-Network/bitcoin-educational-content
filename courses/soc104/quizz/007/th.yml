question: "กลุ่ม Greens อยู่ตรงไหนบน Nolan diagram และเพราะอะไร?"
answer: "อยู่ต่ำมากในแผนภาพ เพราะพวกเขามองว่าผลประโยชน์ส่วนบุคคลต้องไม่มาก่อนผลประโยชน์ส่วนรวมของโลก"
wrong_answers:
  - "อยู่ด้านบนของแผนภาพ เพราะพวกเขาให้ความสำคัญกับเสรีภาพส่วนบุคคลและความตระหนักด้านสิ่งแวดล้อมอย่างเท่าเทียมกัน"
  - "อยู่ตรงกลางของแผนภาพ เพราะพวกเขาสร้างสมดุลระหว่างการเติบโตทางเศรษฐกิจกับการปกป้องสิ่งแวดล้อม"
  - "อยู่ไกลทางขวา เพราะพวกเขาสนับสนุนทางออกแบบตลาดต่อความท้าทายด้านสิ่งแวดล้อม"
explanation: >-
  กลุ่ม Greens อยู่ต่ำมากบน Nolan diagram เพราะพวกเขาสนับสนุนการควบคุมอย่างเข้มแข็งของรัฐเหนือทั้งการตัดสินใจทางเศรษฐกิจและส่วนบุคคลในนามของความเป็นอยู่ที่ดีของโลก พวกเขาแทนที่การต่อสู้ทางชนชั้นแบบ Marxist ด้วยการต่อสู้ระหว่างมนุษย์กับธรรมชาติ และมีแนวโน้มปกป้องการควบคุมทางเศรษฐกิจ รวมถึงแม้แต่การยกเลิกทรัพย์สินส่วนตัว สิ่งนี้วางพวกเขาไว้ในภาคอำนาจนิยม ไม่ใช่ด้านบนหรือตรงกลาง
reviewed: false
