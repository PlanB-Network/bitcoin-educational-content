question: "Mengapa Rothbard mengkritik visi libertaires tentang sifat manusia, dan alternatif apa yang ia usulkan?"
answer: "Ia menuduh mereka memiliki pandangan 'noble savage' yang naif dan berargumen bahwa masyarakat harus menggunakan kepemilikan pribadi serta insentif yang baik untuk membimbing perilaku yang mementingkan diri sendiri"
wrong_answers:
  - "Ia memuji pemahaman mereka tentang kerja sama manusia tetapi berargumen bahwa negara minimal tetap diperlukan untuk menegakkan kontrak"
  - "Ia setuju bahwa manusia secara alamiah baik tetapi menegaskan bahwa hanya pasar bebas yang dapat menyalurkan kebaikan itu ke dalam aktivitas produktif"
  - "Ia menolak penekanan mereka pada hak individu dan sebaliknya berargumen bahwa komunitas seharusnya secara kolektif menentukan standar moral"
explanation: >-
  Rothbard mengkritik libertaires karena mengadopsi visi tentang sifat manusia yang naif dan mirip Rousseau sebagai secara alamiah baik. Sebaliknya, ia berargumen bahwa manusia dipandu oleh kepentingan diri, dan masyarakat harus diorganisasi sedemikian rupa sehingga insentif yang baik membimbing perilaku. Ini membutuhkan pengakuan dan jaminan atas kepemilikan pribadi. Menghapuskan negara tidak berarti menghapuskan fungsinya; polisi dan peradilan seharusnya dikelola oleh pasar bebas melalui kompetisi.
