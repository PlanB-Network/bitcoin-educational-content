question: "Varför beskrivs monetär inflation som en dold skatt som påförs utan medborgarnas samtycke?"
answer: "Eftersom statligt penningskapande devalverar valutan så att människor kan köpa mindre för samma belopp, men de flesta inser inte att stigande priser återspeglar statlig politik snarare än naturliga marknadskrafter"
wrong_answers:
  - "Eftersom centralbanker i hemlighet tar ut avgifter på varje transaktion som behandlas genom banksystemet utan att informera kontoinnehavarna"
  - "Eftersom regeringar trycker pengar och delar ut dem endast till förmögna individer samtidigt som de beskattar de fattiga genom högre moms på nödvändiga varor"
  - "Eftersom inflation orsakas av privata företag som höjer priserna för att öka vinsterna, vilket fungerar som en inofficiell skatt på konsumenter"
explanation: >-
  Injektionen av pengar i systemet leder till valutadevalvering, där samma belopp köper mindre eftersom de nya pengarna inte återspeglar verklig ekonomisk tillväxt. De flesta ser inte att statlig politik ledde till stigande priser, som helt enkelt är återspeglingen av valutadevalvering. Detta motsvarar legaliserad stöld och institutionaliserad plundring, som utarmar medelklassen medan de förmögna fångar upp nya pengar genom spekulativa tillgångar.
