question: What are the two essential VS Code extensions mentioned for JavaScript development and what are their primary functions?
answer: ESLint for code quality analysis and error detection, and Prettier for automatic code formatting
wrong_answers:
  - IntelliSense for auto-completion and Live Documentation for function parameter hints
  - Node.js runtime for JavaScript execution and npm for package management
  - Git integration for version control and Terminal for command line access
explanation: |
  ESLint and Prettier are the two essential extensions specifically highlighted in the chapter. ESLint analyzes JavaScript code in real-time to catch syntax errors, enforce consistent style, and teach best practices. Prettier automatically formats code with consistent indentation and spacing, especially when configured to format on save. The other options describe built-in VS Code features or separate tools rather than the specific extensions recommended for JavaScript development workflow.
