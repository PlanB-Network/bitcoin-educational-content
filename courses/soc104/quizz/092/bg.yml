question: "Какъв е фундаменталният проблем с фиатните валути, който Satoshi Nakamoto идентифицира?"
answer: "Те изискват доверие в централната банка да не обезценява валутата, но историята на фиатните валути е пълна с нарушения на това доверие"
wrong_answers:
  - "Те са твърде трудни за използване при ежедневни транзакции, защото физическите пари в брой се износват бързо и производството им е скъпо"
  - "Те не могат да бъдат прехвърляни международно, защото всяка държава има несъвместими парични стандарти и регулации"
  - "Те са обезпечени със златни резерви, които са недостатъчни да покрият общото парично предлагане в обращение"
explanation: >-
  Satoshi Nakamoto заявява, че фундаменталният проблем с конвенционалните валути е доверието, необходимо, за да работят. Фиатните валути не са обезпечени със стока, а почиват изцяло върху институционален авторитет. Когато една институция държи пълен контрол върху парите, изкушението за злоупотреба е твърде силно, а историята е показвала това многократно чрез обезценяване на валутите.
