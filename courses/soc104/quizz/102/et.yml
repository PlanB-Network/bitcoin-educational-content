question: "Kuidas väidab kursus, et vabadus võimaldab nii vasakpoolsetel kui ka parempoolsetel väärtustel rahumeelselt koos eksisteerida?"
answer: "Tõelise vabaduse režiimis saavad vasakpoolsete ideaalidega inimesed vabatahtlikult jagada omandit ja ümber jaotada vahendeid, samal ajal kui parempoolsete väärtustega inimesed saavad säästa ja traditsioone edasi anda, ilma et kumbki pool suruks oma eluviisi teisele peale"
wrong_answers:
  - "Vabadus nõuab, et mõlemad pooled teeksid kompromissi, aktsepteerides tsentristlikku positsiooni, kus valitsus tasakaalustab konkureerivaid väärtusi mõõduka regulatsiooni kaudu"
  - "Vabadus tähendab, et vasakpoolsed ja parempoolsed kogukonnad peavad elama eraldi geograafilistel territooriumidel oma sõltumatute valitsustega"
  - "Vabadus toimib nii, et lubab kodanikel hääletada, milliseid väärtusi igas piirkonnas jõustada, vaheldudes igas valimistsüklis vasakpoolsete ja parempoolsete poliitikate vahel"
explanation: >-
  Kursus näitab, et tõelise vabaduse režiimis saavad vasakpoolsete ideaalide järgijad vabatahtlikult omandist loobuda, tootmisvahendeid jagada või annetada palku ümberjaotavatele organisatsioonidele. Parempoolsete väärtustega inimesed saavad kõvasti töötada, säästa ja perekondlikke väärtusi edasi anda. Keegi ei tohiks oma eluviisi teistele peale suruda. Eesmärke saab rahumeelselt saavutada turu vabaduse ja valiku jõu kaudu.
