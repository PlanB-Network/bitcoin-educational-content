question: "Mtazamo wa kilibertari kuhusu uhuru unatofautianaje na mtazamo wa watu wa msimamo wa kati?"
answer: "Walibertari huchukulia uhuru kama aksiomu isiyo na masharti, ilhali watu wa msimamo wa kati hutetea uhuru kwa fursa kulingana na muktadha na ufanisi"
wrong_answers:
  - "Walibertari huruhusu dola kulinda uhuru kwa kuchagua, ilhali watu wa msimamo wa kati hukataa ushiriki wowote wa dola katika kulinda haki za mtu binafsi"
  - "Walibertari huuelekeza uhuru kwenye masuala ya kiuchumi pekee, ilhali watu wa msimamo wa kati hutumia uhuru kwa upana katika nyanja za kijamii na kitamaduni"
  - "Walibertari na watu wa msimamo wa kati wana mtazamo uleule wa uhuru lakini hawakubaliani kuhusu ukubwa wa serikali unaohitajika kuutekeleza"
explanation: >-
  Walibertari hufafanua uhuru kama kanuni ya jumla isiyo na masharti inayofanya kazi kama aksiomu. Kinyume chake, watu wa msimamo wa kati hutetea baadhi ya uhuru kwa njia ya fursa na kimuktadha bila kutumia kanuni yoyote ya jumla. Njia ya watu wa msimamo wa kati inaonyesha dhana ya uhuru kama chombo, daima ukiwekwa chini ya malengo ya kiutendaji kama ufanisi, jambo ambalo walibertari hulikataa kimsingi.
