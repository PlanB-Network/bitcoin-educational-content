question: "2008 financial crisis වෙත George W. Bush ගේ response එක conservative principles වල 'problematic flexibility' පෙන්නුම් කරන්නේ කෙසේද?"
answer: "ඔහු major banks bail out කිරීමට free-market principles අත්හැර, national economic stability හි ultimate guarantor ලෙස state පිළිබඳ conservative view එක හෙළි කළේය"
wrong_answers:
  - "ඔහු government intervention සියල්ල ප්‍රතික්ෂේප කර, consequences නොසලකා free-market ideology එක දැඩිව අනුගමනය කරමින් banks fail වීමට ඉඩ දුන්නේය"
  - "ඔහු banking sector permanent ලෙස nationalize කර progressive taxation හඳුන්වා දී, conservatism සිට democratic socialism වෙත මාරු විය"
  - "market self-correct වීමට ඉඩ දීමට government spending සියල්ල කපා financial regulations ඉවත් කිරීමෙන් ඔහු ප්‍රතිචාර දැක්වීය"
explanation: >-
  Major banks bail out කිරීමට මැදිහත් වීමෙන් Bush 'free-market system එක බේරා ගැනීමට free-market principles අත්හැරියා' යැයි ප්‍රකාශ කළේය. Conservatives abstract market principles වලට වඩා nation හි power සහ continuity ප්‍රමුඛ කළ හැකි ආකාරය මෙය පෙන්වයි. එම flexible logic එක Trump's protectionist trade policies තුළද පෙනේ; corporatism සහ crony capitalism පෝෂණය කිරීමේ අවදානමක් ඇතිව national interest නමින් ඒවා අනුගමනය කරන ලදී.
