question: "Hoe verschillen de rollen van het Cato Institute, het Mises Institute en de Libertarian Party binnen de libertaire beweging?"
answer: "Het Cato Institute richt zich op voorstellen voor publiek beleid, het Mises Institute op onderwijs en academische publicatie, en de Libertarian Party op electorale politiek"
wrong_answers:
  - "Het Cato Institute financiert politieke campagnes, het Mises Institute lobbyt rechtstreeks bij het Congres en de Libertarian Party organiseert academische conferenties"
  - "Het Cato Institute publiceert economische handboeken, het Mises Institute organiseert kiezersregistratieacties en de Libertarian Party stelt wetsvoorstellen op"
  - "Het Cato Institute organiseert grassroots-protesten, het Mises Institute biedt juridische verdediging voor libertariërs en de Libertarian Party beheert denktankonderzoek"
explanation: >-
  Het Cato Institute (opgericht in 1977) is een in Washington gevestigde denktank die werkt aan voorstellen voor publiek beleid. Het Mises Institute (opgericht in 1982) richt zich op onderwijs in plaats van politieke lobby, en functioneert als een soort online universiteit met conferenties en heruitgegeven werken. De Libertarian Party (opgericht in 1971) is de op twee na grootste Amerikaanse politieke partij en neemt deel aan verkiezingen, waar zelfs haar stemaandeel van ongeveer 2% de uitkomst kan doen kantelen.
reviewed: false
