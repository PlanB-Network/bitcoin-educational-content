question: "Que princípio orientador guiava os votos de Frederic Bastiat na Assembleia Nacional?"
answer: "A promoção das liberdades individuais e econômicas e a redução da interferência governamental"
wrong_answers:
  - "A defesa da autoridade real e a preservação das tradições monárquicas"
  - "O avanço de políticas socialistas para redistribuir a riqueza de forma mais igualitária"
  - "Uma estratégia centrista de compromisso entre as facções de esquerda e de direita"
explanation: >-
  Bastiat votava com base em um princípio fundamental: promover as liberdades individuais e econômicas enquanto reduzia a interferência governamental. Ele não era um oportunista centrista, nem um monarquista ou socialista. Ele votava com qualquer lado que propusesse medidas alinhadas à liberdade e ao governo limitado.
