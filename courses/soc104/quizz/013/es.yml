question: "¿Qué incluye la categoría de libertad personal?"
answer: "Lo que haces en tus relaciones privadas, con tus opiniones, creencias y todo lo que involucra tu propio cuerpo y mente"
wrong_answers:
  - "Lo que haces como productor, incluyendo abrir una empresa, contratar empleados y comerciar bienes"
  - "Cuántos impuestos pagas, qué inversiones haces y cómo gestionas tus activos financieros"
  - "Tu capacidad de competir en el mercado, fijar precios para tus productos y elegir a tus proveedores"
explanation: >-
  La libertad personal abarca lo que haces en tus relaciones privadas, con tus opiniones y creencias, y todo lo que involucra tu propio cuerpo y mente. Esto incluye el matrimonio, las elecciones de lectura, las prácticas religiosas, las elecciones de alimentos y medicamentos, y con quién te asocias. Las actividades empresariales, los impuestos y las decisiones de mercado pertenecen a la libertad económica.
