question: "Ni gute ibikorwa bitatu vy'ishimikiro vy'isoko ryisanzuye, nk'uko aba libertarian babidondora, vyose hamwe bigira sisitemu y'itunganywa ry'imibano ikora neza kandi ikurikiza imico?"
answer: "Ibiciro bitanga compas y'ingingo, isoko rigahishura ivyo abantu bipfuza vy'ukuri biciye ku bishikirizwa n'ibisabwa, kandi uguhanahana kwidegemvya kugaha abantu ubushobozi bwo kugena ivyabo bisunze indangagaciro zabo bwite, bigahuza gukora neza mu makuru n'ukwigenga mu mico"
wrong_answers:
  - "Isoko rirushiriza ubutunzi bwose, rikabuza monopoly biciye mu higanwa ryizana, kandi rigatuma ibikoresho bigaburwa ku buryo bungana, bigahuza umwimbu n'ubutungane bw'imibano"
  - "Amasoko yidegemvya agabanya amafaranga leta ikoresha, agakabura ubuhinga bushasha, kandi akarema amahirwe y'akazi, bigahuza inshingano y'ingengo y'imari n'iterambere ry'ubutunzi"
  - "Amasoko agabanya ibiciro vy'abaguzi, akongera ubwiza bw'ibicuruzwa biciye mu higanwa, kandi akagura urudandazwa mpuzamakungu, bigahuza uburumbuke bw'imbere mu gihugu n'ugukorana kw'isi yose"
explanation: >-
  Ingingo ya libertarian yo gushigikira isoko ryisanzuye ishingiye ku bikorwa bitatu bifatanye. Ubwa mbere, ibiciro bikora nk'ibimenyetso vyizewe biyobora ingingo z'ubutunzi n'iz'imibano (compas). Ubwa kabiri, isoko rihishura ivyo abantu ku giti cabo bipfuza vy'ukuri biciye ku bishikirizwa n'ibisabwa. Ubwa gatatu, uguhanahana kwidegemvya guha abakinyi ubushobozi bwo kugena ivyabo bisunze indangagaciro zabo bwite. Hayek yerekanye ko amasoko yidegemvya ahuza amakuru atatanye neza kuruta igenamigambi riva hagati (ugukora neza), mu gihe ukwemera kw'abahanye kwubaha agaciro k'umuntu kuruta agahato (ubutungane).
