question: "Waarop richt een structurele definitie van een politiek systeem zich?"
answer: "Hoe het systeem daadwerkelijk functioneert en wat de waarneembare kenmerken ervan zijn, zoals de mate van staatscontrole"
wrong_answers:
  - "De verklaarde doelen en nobele intenties die door de oprichters en leiders van het systeem worden uitgesproken"
  - "De historische oorsprong van de politieke beweging en de biografieën van haar belangrijkste denkers"
  - "Het aantal toegestane politieke partijen en de frequentie waarmee democratische verkiezingen worden gehouden"
explanation: >-
  Structurele definities richten zich op hoe politieke systemen daadwerkelijk functioneren en op hun waarneembare kenmerken. Socialisme wordt bijvoorbeeld structureel gekenmerkt door de alomtegenwoordigheid van de staat. Deze benadering staat tegenover intentionele definities, die steunen op uitgesproken motieven en doelen. De structurele benadering maakt een objectievere beoordeling op basis van meetbare resultaten mogelijk.
reviewed: false
