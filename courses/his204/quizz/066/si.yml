question: ප්‍රංශ ආර්ථික විද්‍යාඥයාගේ පුත්‍රයා විසින් පිහිටුවන ලද Dupont de Nemours et Cie ක්‍රියාත්මක වන ව්‍යාපාරය කුමක්ද?
answer: රසායන විද්‍යාව සහ ජීව විද්‍යාව
wrong_answers:
  - බැංකුකරණය සහ රක්ෂණය
  - වස්ත්‍ර කර්මාන්තය
  - ආහාර කර්මාන්තය
explanation: |
  Dupont de Nemours යනු ආර්ථික විද්‍යාඥ Pierre-Samuel Dupont de Nemoursගේ පුත්‍රයා විසින් පිහිටුවන ලද රසායනික හා ජීව විද්‍යා සමාගමකි.
