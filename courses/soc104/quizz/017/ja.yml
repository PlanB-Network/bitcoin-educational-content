question: "右派は何について立法したいと考えているのか？"
answer: "道徳と宗教であり、その動機は伝統的制度と社会的ヒエラルキーを守りたいという願望である"
wrong_answers:
  - "経済と金融市場であり、その動機は不平等を減らし富を再分配したいという願望である"
  - "科学と教育であり、その動機は公立学校で教えられる内容を統制したいという願望である"
  - "国際貿易と外交であり、その動機は国外での国家的影響力を拡大したいという願望である"
explanation: >-
  右派は個人の道徳と伝統的価値を優先する。
  右派は、文明は特定の伝統的制度と社会的ヒエラルキーの上に築かれており、それらは守られなければならないと考え、道徳と宗教について立法したいと考える。
  経済の立法化に焦点を当てるのは右派ではなく左派である。
  科学、教育、貿易政策は、右派について述べられている主な焦点ではない。
reviewed: false
