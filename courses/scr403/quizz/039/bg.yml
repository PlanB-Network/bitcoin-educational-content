question: Джет half-agg-verify логва множество от кортежи като ефект Writer. Според теста за комутативност/идемпотентност/унитарност какво постига дизайнът с множество и какво още липсва?
answer: "Комутативност и идемпотентност (както изисква Simplicity), но не и унитарност: изхвърлянето на извикване би премахнало неговия кортеж и би пропуснало подпис."
wrong_answers:
  - Идемпотентност и унитарност, но не и комутативност, тъй като агрегатът трябва да комбинира r-компонентите в реда на подписване.
  - И трите, така че оптимизаторът може свободно да дублира, пренарежда или изхвърля извикванията без риск.
  - Комутативност, но не и идемпотентност, тъй като логването на един и същ кортеж два пъти би изисквало два агрегатни s-компонента.
explanation: >-
  Третирането на writer лога като множество прави ефекта идемпотентен и
  комутативен, защото самото вмъкване в множество има и двете свойства — точно
  двете, които Simplicity изисква от всеки ефект. Унитарността все още е извън
  обсег: подобно на Failure, записването влияе върху валидността на транзакцията,
  тъй като транзакцията е валидна само когато агрегатен s-компонент покрива всеки
  логнат кортеж. Следователно израз, който извършва записването, не може да бъде
  изхвърлен само защото неговият unit изход не се използва, понеже кортежът му би
  изчезнал безшумно от half-aggregation проверката.
reviewed: false
