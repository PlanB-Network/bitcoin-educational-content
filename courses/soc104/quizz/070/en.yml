question: "Across the five societal debates (marriage, immigration, firearms, drugs, sugary drinks), what recurring analytical framework shapes the socialist position on each issue?"
answer: "A conflict framework between dominants and dominated, where society is structured by oppression and the state must intervene to protect the vulnerable group"
wrong_answers:
  - "A utilitarian framework focused on maximizing overall happiness and economic productivity for the greatest number of citizens"
  - "A natural rights framework where individual freedoms must be protected from both state and corporate interference"
  - "A traditionalist framework where established social institutions must be preserved against disruptive modern changes"
explanation: >-
  The socialist position across societal debates is consistently shaped by a dominant/dominated conflict framework. On marriage, it is heterosexual majority oppressing a homosexual minority. On immigration, nationality-based restrictions are forms of oppression. On firearms, only the state should hold force to protect the vulnerable. On sugary drinks, industrialists profit from the vulnerability of the least protected. This oppressor/oppressed lens is reproduced across numerous domains including gender, race, and even the relationship between humanity and nature.
reviewed: false
