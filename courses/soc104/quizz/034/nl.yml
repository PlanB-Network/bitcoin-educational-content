question: "Wat is het non-agressieprincipe zoals getheoretiseerd door Murray Rothbard?"
answer: "Het is illegitiem om fysiek geweld te initiëren tegen een ander individu of diens eigendom, al is defensief geweld toegestaan"
wrong_answers:
  - "Alle vormen van geweld zijn altijd verkeerd, inclusief zelfverdediging en verzet tegen onderdrukking"
  - "Geweld is aanvaardbaar wanneer het tegen onderdrukkende instellingen is gericht, maar nooit tegen andere individuen"
  - "Alleen de staat heeft het legitieme recht om geweld te gebruiken, en individuen mogen nooit tot geweld overgaan"
explanation: >-
  Rothbards non-agressieprincipe houdt in dat het initiëren van fysiek geweld tegen een andere persoon of diens eigendom illegitiem is. Het is een filosofische vertaling van de gulden regel. Het verbiedt echter niet alle geweld: defensief geweld, waaronder zelfverdediging en verzet tegen onderdrukking, wordt als legitiem beschouwd. Dit onderscheidt het van puur pacifisme en van het door de staat opgeëiste monopolie op geweld.
reviewed: false
