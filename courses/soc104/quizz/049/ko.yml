question: "2008년 금융 위기에 대한 조지 W. 부시의 대응은 보수주의 원칙의 '문제적 유연성'을 어떻게 보여주나요?"
answer: "그는 대형 은행들을 구제하기 위해 자유시장 원칙을 포기했고, 국가를 국민경제 안정의 최종 보증자로 보는 보수주의적 관점을 드러냈습니다"
wrong_answers:
  - "그는 결과와 무관하게 자유시장 이데올로기를 엄격히 고수하며 모든 정부 개입을 거부하고 은행들이 파산하도록 두었습니다"
  - "그는 은행 부문을 영구적으로 국유화하고 누진세를 도입하여 보수주의에서 민주사회주의로 전환했습니다"
  - "그는 시장이 스스로 조정되도록 모든 정부 지출을 삭감하고 금융 규제를 폐지하는 방식으로 대응했습니다"
explanation: >-
  부시는 대형 은행들을 구제하기 위해 개입하면서 '자유시장 체제를 구하기 위해 자유시장 원칙을 포기했다'고 선언했습니다. 이는 보수주의자들이 추상적 시장 원칙보다 국가의 힘과 연속성을 우선시할 수 있음을 보여줍니다. 같은 유연한 논리는 트럼프의 보호무역주의 통상 정책에서도 나타나는데, 이는 코퍼러티즘과 정실 자본주의를 부추길 위험을 감수하면서도 국익의 이름으로 추진되었습니다.
