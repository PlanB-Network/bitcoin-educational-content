question: "Welk personage verdedigt in de dialogen van Gustave de Molinari uit 1849 vrijheid als een fundamenteel principe, in plaats van haar ondergeschikt te maken aan andere doelen?"
answer: "De econoom, die vrijheid behandelt als een principe dat niet ondergeschikt is aan enig ander doel"
wrong_answers:
  - "De socialist, die vrijheid verdedigt via progressieve hervormingen gericht op sociale gelijkheid"
  - "De conservatief, die vrijheid hooghoudt door de traditionele sociale orde en stabiliteit te behouden"
  - "Alle drie de personages verdedigen vrijheid in gelijke mate, maar verschillen van mening over hoe die moet worden toegepast"
explanation: >-
  In Molinari's dialogen uit Les Soirees de la rue Saint-Lazare staat de econoom voortdurend op gespannen voet met zowel de socialist als de conservatief. Hij is de enige die vrijheid verdedigt als een fundamenteel principe. De socialist maakt vrijheid ondergeschikt aan progressieve idealen, en de conservatief maakt haar ondergeschikt aan het behoud van orde, waardoor de econoom uniek is in zijn onvoorwaardelijke verdediging van vrijheid.
reviewed: false
