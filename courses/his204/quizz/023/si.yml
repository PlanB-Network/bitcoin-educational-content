question: Saint-Pierre Académie française වෙතින් බැහැර කළේ ඇයි?
answer: යුද්ධ සහ අතිරික්තයෙන් පිරුණු Louis XIVගේ පාලන කාලය විවේචනය කිරීමට ඔහු නිර්භය වූ නිසා
wrong_answers:
  - බරපතල රෝගයකින් පීඩා විඳ ඔහු අඩක් පිස්සු වී තිබූ නිසා
  - Franceහි පාරම්පරික සතුරා වූ England රජුට සහාය දැක්වීමට ඔහු නිර්භය වූ නිසා
  - ඔහු වෙනත් academician කෙනෙකුගේ කෘතියක් සොරකම් කර තිබූ නිසා
explanation: |
  Saint-Pierre Louis XIVගේ පාලන කාලය, විශේෂයෙන් ඔහුගේ යුද්ධ සහ අධික වියදම්, විවේචනය කිරීම නිසා Académie française වෙතින් නෙරපා හරින ලදී. ඔහුගේ විවේචනය රාජාධිරාජයාට අගෞරවයක් ලෙස සැලකුණි.