question: "Những người libertarian tin gì về năng lực ra quyết định của các cá nhân?"
answer: "Các cá nhân có cả quyền lẫn trách nhiệm đưa ra những quyết định của chính họ về cuộc đời mình"
wrong_answers:
  - "Các cá nhân chỉ nên đưa ra quyết định sau khi tham khảo các đại diện dân cử hiểu rõ các hàm ý chính sách"
  - "Các cá nhân nhìn chung không có khả năng đưa ra quyết định tốt và cần sự hướng dẫn chuyên gia từ các định chế chính phủ"
  - "Các cá nhân nên tự do đưa ra quyết định kinh tế nhưng phải nhường quyền quyết định cho nhà nước trong mọi vấn đề xã hội và văn hóa"
explanation: >-
  Từ quan điểm libertarian, các cá nhân có cả quyền lẫn trách nhiệm đưa ra những quyết định của chính họ. Điều này tương phản với các họ chính trị thông thường từ tả đến hữu, vốn tin rằng chính phủ nên đưa ra một số hoặc nhiều quyết định quan trọng trong đời sống của một cá nhân và trong đời sống kinh tế nói chung.
reviewed: false
