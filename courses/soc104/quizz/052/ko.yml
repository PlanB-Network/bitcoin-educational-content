question: "중도주의의 핵심 가치는 무엇인가요?"
answer: "온건함, 타협, 적응, 공공 효용"
wrong_answers:
  - "전통, 질서, 권위, 국가 정체성"
  - "자유, 사유재산, 동의, 개인적 책임"
  - "평등, 사회정의, 연대, 집단 소유"
explanation: >-
  중도주의의 핵심 가치는 온건함, 타협, 적응, 공공 효용입니다. 이는 이데올로기적 헌신보다 실용적 균형을 중시하는 중도주의의 강조점을 반영합니다. 다른 선택지들은 각각 보수주의, 자유지상주의, 사회주의의 핵심 가치를 설명합니다.
reviewed: false
