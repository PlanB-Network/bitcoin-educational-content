question: "Điều gì đặc trưng cho đáy của trục tự do cá nhân trên biểu đồ Nolan?"
answer: "Ưu tiên trật tự, an ninh, các giá trị truyền thống, và việc nhà nước điều chỉnh đạo đức cũng như duy trì trật tự công cộng"
wrong_answers:
  - "Ưu tiên quyền tự chủ cá nhân, sự khoan dung và sự can thiệp tối thiểu của nhà nước vào các lựa chọn đời sống cá nhân"
  - "Ưu tiên phi điều tiết kinh tế, thương mại tự do và bãi bỏ thuế quan cùng trợ cấp"
  - "Ưu tiên tái phân phối của cải, thuế cao và quốc hữu hóa các ngành công nghiệp then chốt"
explanation: >-
  Đáy của trục tự do cá nhân đại diện cho sự kiểm soát tối đa của nhà nước đối với đời sống cá nhân, được đặc trưng bởi sự ưu tiên dành cho trật tự, an ninh và các giá trị truyền thống. Nhà nước điều chỉnh đạo đức, duy trì trật tự công cộng, và có thể bảo vệ một tầm nhìn cụ thể về luân lý hay truyền thống. Đỉnh của trục đại diện cho điều ngược lại: tự do cá nhân và sự khoan dung. Các chính sách kinh tế được đo trên trục ngang riêng biệt.
