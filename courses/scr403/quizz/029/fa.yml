question: Simplicity بازگشتِ نامحدود را حذف می‌کند. جایگزین مورد نظر آن برای تکرار نامحدود چیست؟
answer: کاوننت‌های بازگشتی که محاسبه را در چندین تراکنش پخش می‌کنند و هزینه هر تراکنش را قابل پیش‌بینی نگه می‌دارند.
wrong_answers:
  - ویژگی delegation، که مشخصاً برای دادن شکلی اندازه‌گیری‌شده از بازگشت نامحدود درون یک تراکنش واحد ساخته شده است.
  - نُه ترکیب‌گر اصلی، که کامل بودنشان اجازه می‌دهد یک ساختار نقطه ثابت هر تابع بازگشتی را کُدگذاری کند.
  - باز کردن حلقه در زمان کامپایل، که در آن تحلیل ایستا بیشینه تعداد تکرار را استنتاج می‌کند و بدنه را تکثیر می‌کند.
explanation: >-
  تز مقاله این است که تکرار نامحدود بهتر است
  به صورت کاوننت‌های بازگشتی پیاده‌سازی شود که روی چندین تراکنش محاسبه می‌کنند، و این
  از محدودیت‌های فضای بلاک و standardness اجتناب می‌کند و هزینه‌های تراکنش را
  قابل پیش‌بینی می‌سازد. delegation فقط می‌تواند مورد سوءاستفاده قرار گیرد تا چیزی
  شبیه بازگشت نامحدود تولید کند — مکانیزم مورد نظر نیست — و
  نُه ترکیب‌گر اصلی فقط برای محاسبات متناهی کامل‌اند، بنابراین
  هیچ ساختار نقطه ثابتی درون یک برنامه واحد وجود ندارد.
reviewed: false
