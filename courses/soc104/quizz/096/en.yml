question: "Who launched the first Cypherpunk mailing list in 1992?"
answer: "Tim May and Eric Hughes, who created a platform that became the movement's nerve center"
wrong_answers:
  - "Satoshi Nakamoto and Hal Finney, who later went on to create Bitcoin together in 2008"
  - "Julian Assange and Edward Snowden, who used the list to coordinate government whistleblowing activities"
  - "Phil Zimmermann and Bruce Schneier, who designed the list as a tool for distributing encryption software"
explanation: >-
  In 1992, Tim May and Eric Hughes launched the first Cypherpunk mailing list. This platform quickly became the movement's nerve center, bringing together developers, cryptographers, and advocates of digital freedom. It was on this same list that Satoshi Nakamoto would later share the Bitcoin White Paper for the first time in 2008.
