question: "为什么美国的古典自由主义者在二十世纪开始称自己为“自由意志主义者”？"
answer: "因为美国的“自由主义”已被日益扩张的国家干预主义和福利国家所夺用"
wrong_answers:
  - "因为他们想让自己与欧洲君主主义传统保持距离"
  - "因为“自由主义者”一词开始与无政府主义和政治暴力联系在一起"
  - "因为新的贸易协定要求自由市场倡导者拥有一种不同的政治身份"
explanation: >-
  在二十世纪，随着自由放任原则逐步被抛弃，转而支持福利国家，一场根本性转变发生了。美国的“自由主义”开始意味着与古典自由主义非常不同的东西，即拥抱国家干预主义。古典自由主义者采用“自由意志主义者”一词来保留这种区别。这次重新命名与欧洲君主主义、无政府主义暴力或贸易协定毫无关系。
reviewed: false
