bio: |
  Predau geopolitică în școli de afaceri, după ce am lucrat în domeniul relațiilor internaționale, în Franța și în străinătate. Pasionat de a îmbina ideile cu practica, sunt co-autor al cărții 'Bitcoin, le choc géopolitique', alături de Alexandre Stachtchenko (Armand Colin, 2025), și vorbesc regulat la conferințe și în media despre mizele geopolitice ale Bitcoin.
  
  
short_bio: Co-autor al cărții Bitcoin, le choc géopolitique