question: "Wie bilden die drei wesentlichen Funktionen des freien Marktes, wie sie von Libertären beschrieben werden, zusammen sowohl ein effizientes als auch ein ethisches System sozialer Organisation?"
answer: "Preise liefern einen Kompass für Entscheidungen, der Markt offenbart authentische Präferenzen durch Angebot und Nachfrage, und freier Austausch ermöglicht Individuen, ihre eigenen Angelegenheiten gemäß persönlichen Werten zu bestimmen, wodurch informationelle Effizienz mit moralischer Autonomie verbunden wird"
wrong_answers:
  - "Der Markt maximiert den Gesamtwohlstand, verhindert Monopole durch natürlichen Wettbewerb und stellt eine gleiche Verteilung der Ressourcen sicher, wodurch Produktivität mit sozialer Gerechtigkeit verbunden wird"
  - "Freie Märkte senken Staatsausgaben, stimulieren technologische Innovation und schaffen Beschäftigungsmöglichkeiten, wodurch fiskalische Verantwortung mit Wirtschaftswachstum verbunden wird"
  - "Märkte senken Verbraucherpreise, erhöhen die Produktqualität durch Wettbewerb und erweitern den internationalen Handel, wodurch heimischer Wohlstand mit globaler Zusammenarbeit verbunden wird"
explanation: >-
  Die libertäre Verteidigung des freien Marktes beruht auf drei miteinander verbundenen Funktionen. Erstens dienen Preise als verlässliche Indikatoren, die wirtschaftliche und soziale Entscheidungen leiten (der Kompass). Zweitens offenbart der Markt authentische individuelle Präferenzen durch Angebot und Nachfrage. Drittens ermöglicht freier Austausch den Akteuren, ihre eigenen Angelegenheiten gemäß persönlichen Werten zu bestimmen. Hayek zeigte, dass freie Märkte verstreute Informationen besser koordinieren als zentrale Planung (Effizienz), während gegenseitige Zustimmung die menschliche Würde stärker respektiert als Zwang (Gerechtigkeit).
