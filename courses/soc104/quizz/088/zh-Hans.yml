question: "Karl Popper 对开放社会与封闭社会的区分，如何关联到个人主义与集体主义之争？"
answer: "开放社会承认个人通过个人决定自行判断的权利，而封闭社会是集体主义的，建立在部落心态和拒绝批判自由之上"
wrong_answers:
  - "开放社会允许跨国边境自由贸易，而封闭社会则施加关税和保护主义经济政策"
  - "开放社会由每个公民投票的直接民主治理，而封闭社会由单一世袭君主统治"
  - "开放社会透明公开所有政府文件，而封闭社会把信息列为国家机密"
explanation: >-
  Popper 把封闭社会定义为魔法式或部落式社会，把开放社会定义为个人面对个人决定的社会。封闭社会是集体主义的，建立在部落心态之上，拒绝批判自由，并理想化一种静态秩序。开放社会让价值、信念和关系的自由选择占据优先地位，直接体现了个人主义原则。
reviewed: false
