question: "Qual é a distinção importante entre ser pró-empresas e ser pró-mercado?"
answer: "Ser pró-empresas significa favorecer uma aliança entre grandes empresas e o Estado, enquanto ser pró-mercado significa apoiar a livre concorrência sem favoritismo estatal"
wrong_answers:
  - "Ser pró-empresas significa apoiar pequenas empresas, enquanto ser pró-mercado significa apoiar corporações multinacionais"
  - "Ser pró-empresas significa se opor inteiramente à regulação, enquanto ser pró-mercado significa aceitar regulação moderada"
  - "Ser pró-empresas se concentra na indústria doméstica, enquanto ser pró-mercado se concentra no comércio internacional"
explanation: >-
  Centristas tendem a ser pró-empresas, o que significa que favorecem uma espécie de aliança entre grandes empresas e o Estado, algo que difere de ser pró-mercado. Ser pró-mercado apoia a livre concorrência sem favoritismo estatal ou protecionismo corporativo. Essa distinção é crucial porque políticas pró-empresas podem criar monopólios e proteções regulatórias que, na prática, minam a concorrência de livre mercado.
