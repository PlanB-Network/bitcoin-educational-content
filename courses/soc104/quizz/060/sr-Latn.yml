question: "Koje su kardinalne vrednosti centrizma?"
answer: "Umerenost, kompromis, prilagođavanje i javna korist"
wrong_answers:
  - "Tradicija, poredak, autoritet i nacionalni identitet"
  - "Sloboda, privatna svojina, pristanak i individualna odgovornost"
  - "Jednakost, društvena pravda, solidarnost i kolektivno vlasništvo"
explanation: >-
  Kardinalne vrednosti centrizma su umerenost, kompromis, prilagođavanje i javna korist. One odražavaju centristički naglasak na pragmatičnoj ravnoteži, a ne na ideološkoj posvećenosti. Druge opcije opisuju kardinalne vrednosti konzervativizma, libertarijanizma i socijalizma.
