question: "Chủ nghĩa bảo thủ chính trị là gì?"
answer: "Một hệ tư tưởng nhằm bảo tồn các thiết chế chính trị đã được xác lập và trật tự xã hội, phản đối các biến động cấu trúc lớn"
wrong_answers:
  - "Một cam kết cá nhân với các giá trị gia đình truyền thống và thực hành tôn giáo mà không tìm cách áp đặt chúng lên người khác"
  - "Một triết lý thúc đẩy thay đổi xã hội nhanh chóng thông qua cải cách dân chủ và lập pháp tiến bộ"
  - "Một lý thuyết kinh tế chủ trương thị trường tự do, thuế tối thiểu và bãi bỏ các rào cản thương mại"
explanation: >-
  Chủ nghĩa bảo thủ chính trị là một hệ tư tưởng, thường được đại diện trong các đảng cánh hữu hoặc cực hữu, nhằm bảo tồn các thiết chế chính trị đã được xác lập và trật tự xã hội trong khi phản đối các biến động cấu trúc lớn. Những người ủng hộ nó muốn sử dụng quyền lực và pháp luật để bảo vệ di sản của họ. Điều này khác với chủ nghĩa bảo thủ văn hóa, vốn là một lựa chọn đời sống cá nhân hơn là một chương trình chính trị.
