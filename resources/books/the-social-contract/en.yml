title: "The Social Contract"

publication_year: 1762

cover: cover_en.webp

original: false

description: |
  Rousseau's most influential political work argues that legitimate political authority rests on a social contract agreed upon by all citizens for the common good. The concept of the "general will" became central to democratic theory but also to critiques of collectivism. Rousseau's vision of popular sovereignty, where individuals surrender natural freedom in exchange for civil freedom guaranteed by the state, stands as the philosophical counterpoint to the liberal tradition of natural rights defended by Locke, Bastiat, and the Austrian school.
