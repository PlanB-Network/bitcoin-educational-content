question: "वामपंथी और दक्षिणपंथी राज्यवादियों का साझा राजनीतिक उद्देश्य क्या है?"
answer: "सत्ता जीतना ताकि वे अपनी विश्वदृष्टि के अनुसार समाज को संगठित कर सकें और उसे सभी पर थोप सकें"
wrong_answers:
  - "सरकार का आकार घटाना और निर्णय लेने की शक्ति व्यक्तिगत नागरिकों को लौटाना"
  - "एक प्रत्यक्ष लोकतंत्र स्थापित करना जहाँ हर नागरिक हर विधायी निर्णय पर वोट दे"
  - "राजनीतिक दलों को समाप्त करना और उनकी जगह स्वतंत्र तकनीकी-विशेषज्ञ शासन लाना"
explanation: >-
  वाम और दक्षिण, दोनों राज्यवादी समान राजनीतिक उद्देश्य साझा करते हैं: सत्ता जीतना ताकि वे अपनी विश्वदृष्टि के अनुसार समाज को संगठित कर सकें और कानून के माध्यम से उसे सभी पर थोप सकें। अंतर केवल उनके मूल्यों में है: दक्षिणपंथ सभ्यता की रक्षा का आह्वान करता है, जबकि वामपंथ श्रमिक वर्ग या उत्पीड़ितों की रक्षा का। इनमें से कोई भी सरकार घटाने या दलों को समाप्त करने की कोशिश नहीं करता।
