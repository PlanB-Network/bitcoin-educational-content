question: Как се представят буферите с променлива дължина в типовата система на Simplicity?
answer: Като вложени произведения от option типове, като всеки слой маркира блок със степен на две.
wrong_answers:
  - Чрез специален тип динамичен масив, вграден директно в езика.
  - Чрез рекурсивни sum типове, които нарастват при всяко извикване на функция.
  - Като вектори с фиксиран размер, допълнени с крайни нулеви стойности.
explanation: >-
  Буферите използват вложени option типове. Например Xᑉ⁸ се разгръща до
  (1 + X⁴) × ((1 + X²) × (1 + X)), което като полином дава
  1 + X + X² + ... + X⁷ — представяйки колекции от 0 до 7 елемента.
  Всеки option слой показва дали присъства блок със степен на две,
  като ефективно кодира дължината двоично.
reviewed: false
