question: "동성 결혼 문제에 대한 리버테리언의 입장은 무엇인가요?"
answer: "국가는 결혼을 정의할 일이 없으며, 결혼은 사유화되어 개인, 결사체, 종교 기관에 맡겨져야 합니다"
wrong_answers:
  - "모든 시민은 법 아래 평등한 대우를 받을 자격이 있으므로 동성 결혼은 합법화되어야 합니다"
  - "전통적 결혼은 출산을 위한 근본 제도이므로 동성 결혼은 금지되어야 합니다"
  - "동성 결혼은 합법화되어야 하지만 전통적 결혼과 구별되는 별도의 법적 틀을 통해서만 가능해야 합니다"
explanation: >-
  리버테리언들은 결혼 문제가 국가주의적 용어로 제기되기 때문에 근본적으로 잘못 구성되어 있다고 주장합니다. 그들은 국가가 사생활에 개입할 일이 없다고 믿으므로, 해결책은 결혼을 국가로부터 완전히 분리하는 것입니다. 국가는 단일한 정의를 부과함으로써 갈등을 만들어냅니다. 첫 번째 오답은 사회주의자 또는 중도주의자의 입장을 반영하고, 두 번째는 보수주의자의 입장을 반영합니다.
reviewed: false
