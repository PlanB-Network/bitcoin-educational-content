question: "Hvordan karakteriserte Michael Oakeshott konservatisme i sitt filosofiske arbeid?"
answer: "Som et temperament og en innstilling til livet snarere enn en rigid systematisk ideologi"
wrong_answers:
  - "Som en omfattende økonomisk teori med presise politiske forskrifter for hvert område av staten"
  - "Som en revolusjonær bevegelse som søker å rive ned moderne institusjoner og vende tilbake til det førindustrielle samfunnet"
  - "Som en rent religiøs doktrine forankret i kristen teologi og kirkelig autoritet"
explanation: >-
  Michael Oakeshott, en britisk filosof, forsvarte en forståelse av konservatisme som temperament snarere enn systematisk ideologi. Hans essay On Being Conservative (1956) er fortsatt en vesentlig referanse. Dette synet på konservatisme som en innstilling påvirket også Friedrich Hayek. Oakeshotts tilnærming er bemerkelsesverdig for sin kritikk av rasjonalisme i politikken, ved at den avviser ideen om at politikk kan reduseres til et system.
