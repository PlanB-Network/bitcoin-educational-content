question: "Proč je měnová inflace popisována jako skrytá daň uvalená bez souhlasu občanů?"
answer: "Protože vládní tvorba peněz znehodnocuje měnu, takže si lidé za stejnou částku koupí méně, ale většina si neuvědomuje, že rostoucí ceny odrážejí vládní politiku, nikoli přirozené tržní síly"
wrong_answers:
  - "Protože centrální banky tajně účtují poplatky za každou transakci zpracovanou bankovním systémem, aniž by je sdělovaly majitelům účtů"
  - "Protože vlády tisknou peníze a rozdělují je pouze bohatým jednotlivcům, zatímco chudé zdaňují vyššími prodejními daněmi na základní zboží"
  - "Protože inflaci způsobují soukromé korporace zvyšováním cen za účelem růstu zisků, což funguje jako neoficiální daň na spotřebitele"
explanation: >-
  Vstřikování peněz do systému se promítá do znehodnocení měny, kdy stejná částka koupí méně, protože nové peníze neodrážejí skutečný hospodářský růst. Většina lidí nevidí, že k růstu cen vedla vládní politika a že ceny jsou pouze odrazem znehodnocení měny. To se rovná zákonné krádeži a institucionalizovanému olupování, které ochuzuje střední třídu, zatímco bohatí zachycují nové peníze prostřednictvím spekulativních aktiv.
