question: "Ce paradox ascuns se află în pragmatismul centrist?"
answer: "Pragmatismul însuși se sprijină pe o formă de dogmatism, și anume convingerea neexprimată că numai experții sunt competenți să dirijeze societatea"
wrong_answers:
  - "Centriștii pretind că sunt moderați, dar se aliniază constant cu partidele de stânga în guverne de coaliție"
  - "Politicile centriste par echilibrate, dar favorizează întotdeauna creșterea economică în detrimentul protecției mediului"
  - "Centriștii resping ideologia, dar adoptă principii rigide ale pieței libere când iau decizii economice"
explanation: >-
  Paradoxul pragmatismului centrist este că pretinde să respingă ideologia în favoarea expertizei raționale, însă tocmai această pretenție se sprijină pe o dogmă invizibilă și neexprimată: că numai tehnocrații sunt capabili să ia deciziile corecte. Această convingere că numai experții ar trebui să dirijeze societatea este ea însăși un angajament ideologic, chiar dacă centriștii nu o recunosc ca atare.
reviewed: false
