title: "The Monetary Sin of the West"

publication_year: 1971

cover: cover_en.webp

original: false

description: |
  French economist Jacques Rueff's critique of the Bretton Woods system and the gold exchange standard, published the same year Nixon ended dollar-gold convertibility. Rueff argues that the system's fatal flaw was allowing the United States to export dollars without constraint, creating inflation and instability worldwide. A lifelong advocate of the gold standard, Rueff warned that abandoning sound money would lead to chronic deficits, monetary disorder, and the erosion of individual freedom.
