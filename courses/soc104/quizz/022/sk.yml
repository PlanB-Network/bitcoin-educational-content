question: "Čo je kultúrny konzervativizmus?"
answer: "Osobné priľnutie k rodinným, morálnym, estetickým a metafyzickým hodnotám zdedeným z minulosti, nie politická filozofia"
wrong_answers:
  - "Politická ideológia, ktorá používa štátnu moc na vnucovanie tradičných hodnôt celej spoločnosti prostredníctvom legislatívy"
  - "Hnutie, ktoré odmieta všetky formy modernity a snaží sa vrátiť spoločnosť k predindustriálnemu spôsobu života"
  - "Ekonomická doktrína, ktorá chráni národné odvetvia a odmieta voľný obchod so zahraničnými krajinami"
explanation: >-
  Kultúrny konzervativizmus je definovaný ako životná múdrosť: osobné priľnutie k rodinným, morálnym, estetickým a metafyzickým hodnotám zdedeným z minulosti, či už grécko-rímskej alebo židovsko-kresťanskej. Výslovne nie je politickou filozofiou. Líši sa od politického konzervativizmu, ktorého cieľom je zachovať politické inštitúcie a spoločenský poriadok prostredníctvom štátnej moci. Nejde ani o odmietanie modernity alebo ekonomický protekcionizmus.
