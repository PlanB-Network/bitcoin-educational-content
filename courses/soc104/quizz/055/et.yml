question: "Miks hakkasid klassikalised liberaalid Ameerika Ühendriikides kahekümnendal sajandil end nimetama „libertaarideks”?"
answer: "Sest kasvav riiklik interventsionism ja heaoluriik olid Ameerika „liberalismi” üle võtnud"
wrong_answers:
  - "Sest nad tahtsid end distantseerida Euroopa monarhistlikest traditsioonidest"
  - "Sest termin „liberaal” seostus anarhismi ja poliitilise vägivallaga"
  - "Sest uued kaubanduslepingud nõudsid vabaturu pooldajatele eraldi poliitilist identiteeti"
explanation: >-
  Kahekümnendal sajandil toimus põhjalik nihe, kui laissez-faire-põhimõtetest loobuti järk-järgult heaoluriigi kasuks. Ameerika „liberalism” hakkas tähendama midagi väga erinevat klassikalisest liberalismist, võttes omaks riikliku interventsionismi. Klassikalised liberaalid võtsid eristuse säilitamiseks kasutusele termini „libertaar”. Sellel ümberbrändimisel polnud mingit seost Euroopa monarhismi, anarhistliku vägivalla ega kaubanduslepingutega.
reviewed: false
