question: "Que placent les libertariens au centre de leur philosophie politique ?"
answer: "L'éthique et le droit"
wrong_answers:
  - "La croissance économique et la création de richesse"
  - "L'égalité sociale et le bien-être collectif"
  - "L'identité nationale et la préservation culturelle"
explanation: >-
  Les libertariens se distinguent de toutes les autres familles politiques en plaçant l'éthique et le droit au centre de leur philosophie, et non l'économie. Lorsqu'ils défendent l'économie de marché, c'est moins pour sa capacité à produire de la richesse que pour sa promotion de la liberté et de la responsabilité individuelles. La croissance économique est un bénéfice secondaire, non le principe fondateur.
reviewed: false
