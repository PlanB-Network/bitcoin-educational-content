question: "Почему двумерная модель утверждает, что большинство политических вопросов можно разделить на экономические и личные категории?"
answer: "Потому что экономические вопросы касаются того, что вы делаете как производитель и потребитель, тогда как личные вопросы касаются ваших частных отношений, убеждений и телесной автономии"
wrong_answers:
  - "Потому что все политические дебаты в конечном счете сводятся к разногласиям об уровне налогообложения и религиозных практиках"
  - "Потому что исторически правительства регулировали только две вещи: рынок и армию"
  - "Потому что политические философы всегда отделяли материальные вопросы от духовных со времен античности"
explanation: >-
  Двумерная модель основана на идее, что политические вопросы делятся на две широкие категории. Экономические свободы охватывают производство, потребление, торговлю, занятость и управление деньгами. Личные свободы охватывают частные отношения, мнения, убеждения и выборы, касающиеся вашего собственного тела и разума. Это разделение позволяет гораздо более тонко отображать политические позиции, чем одна ось левые–правые.
reviewed: false
