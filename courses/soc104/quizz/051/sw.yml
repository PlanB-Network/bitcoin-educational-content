question: "Kanuni ya kutoshambulia inasema nini?"
answer: "Mtu yuko huru kutenda anavyotaka mradi hakuna vurugu inayofanywa dhidi ya maisha, uhuru, au mali ya mwingine"
wrong_answers:
  - "Dola ina haki ya pekee ya kutumia nguvu ili kudumisha mpangilio wa kijamii"
  - "Raia lazima watii utawala wa wengi hata unapozuia uhuru wa mtu binafsi"
  - "Uhuru wa kutenda unaruhusiwa tu unapofaidi manufaa ya pamoja ya jamii"
explanation: >-
  Kanuni ya kutoshambulia ni nguzo kuu ya siasa za ulibertaria, ikisema kwamba watu binafsi wanaweza kutenda kwa uhuru mradi hawafanyi vurugu dhidi ya maisha, uhuru, au mali ya wengine. Inakumbusha kanuni ya dhahabu inayopatikana katika ustaarabu mbalimbali. Tofauti na chaguo nyingine, haitoi mamlaka maalum ya kimaadili kwa dola wala kuweka haki za mtu binafsi chini ya manufaa ya pamoja.
