question: "libertarians විස්තර කරන free market හි අත්‍යවශ්‍ය functions තුන, efficient සහ ethical social organization system එකක් එකවර constitute කරන්නේ කෙසේද?"
answer: "Prices decisions සඳහා compass එකක් සපයයි, market supply සහ demand හරහා authentic preferences හෙළි කරයි, සහ free exchange පුද්ගලයන්ට personal values අනුව තමන්ගේම affairs තීරණය කිරීමට ඉඩ සලසයි; මෙයින් informational efficiency සහ moral autonomy එකට එක් වේ"
wrong_answers:
  - "market total wealth maximize කරයි, natural competition හරහා monopolies වළක්වයි, සහ resources හි equal distribution සහතික කරයි; මෙයින් productivity සහ social justice එකට එක් වේ"
  - "Free markets government spending අඩු කරයි, technological innovation උත්තේජනය කරයි, සහ employment opportunities නිර්මාණය කරයි; මෙයින් fiscal responsibility සහ economic growth එකට එක් වේ"
  - "Markets consumer prices අඩු කරයි, competition හරහා product quality වැඩි කරයි, සහ international trade පුළුල් කරයි; මෙයින් domestic prosperity සහ global cooperation එකට එක් වේ"
explanation: >-
  free market සඳහා libertarian case එක interconnected functions තුනක් මත රඳා පවතී. පළමුව, prices economic සහ social decisions මඟ පෙන්වන reliable indicators (compass) ලෙස සේවය කරයි. දෙවනුව, market supply සහ demand හරහා authentic individual preferences හෙළි කරයි. තෙවනුව, free exchange actorsට personal values අනුව තමන්ගේම affairs තීරණය කිරීමට ඉඩ සලසයි. free markets central planningට වඩා dispersed information හොඳින් coordinate කරන බව Hayek පෙන්වා දුන්නේය (efficiency), අතර mutual consent coercionට වඩා human dignity ගෞරව කරයි (justice).
reviewed: false
