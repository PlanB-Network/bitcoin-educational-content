question: "Qu'est-ce que le cours identifie comme la véritable fracture politique, au-delà du spectre traditionnel gauche-droite-centre ?"
answer: "La fracture entre des principes philosophiques fondamentaux : liberté ou coercition, consentement volontaire ou contrainte, l'individu responsable ou le collectif"
wrong_answers:
  - "La fracture entre nations riches et nations pauvres autour du contrôle des accords commerciaux internationaux et des institutions financières mondiales"
  - "La fracture entre populations urbaines et rurales autour des priorités de dépenses publiques et des investissements en infrastructures"
  - "La fracture entre cultures progressistes et traditionnelles autour des normes sociales, des valeurs familiales et de l'éducation religieuse"
explanation: >-
  Le cours soutient que la véritable fracture politique ne réside pas dans les étiquettes traditionnelles gauche-droite-centre, mais dans des principes philosophiques fondamentaux : liberté ou coercition, consentement volontaire ou contrainte, l'individu responsable ou le collectif. La bonne manière de penser la politique est de partir des principes éthiques plutôt que des étiquettes.
reviewed: false
