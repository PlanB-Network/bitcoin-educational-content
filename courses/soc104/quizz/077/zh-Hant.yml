question: "constructivism 作為一項共同政治信念是什麼？"
answer: "相信中央政府可以透過法律武力，創造一種對最多數人有益的社會秩序"
wrong_answers:
  - "相信社會應透過個人之間的自願合作來組織，而沒有國家干預"
  - "相信只有自由市場能決定社會中資源的最優分配"
  - "相信政治權威應透過直接民主在所有公民之間平等分配"
explanation: >-
  Constructivism 把中間派、保守主義者與社會主義者團結在一項共同信念周圍：政治過程優於市場過程。它是相信中央政府可以透過法律武力，為最多數人創造良好社會秩序的信念。這與自由至上主義對自願互動中浮現的自發秩序之捍衛，形成直接對立。
reviewed: false
