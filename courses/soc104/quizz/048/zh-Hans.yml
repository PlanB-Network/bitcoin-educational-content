question: "迈克尔·奥克肖特在其哲学著作中如何描述保守主义？"
answer: "它是一种面对生活的气质和倾向，而不是一种僵硬的系统性意识形态"
wrong_answers:
  - "它是一套全面的经济理论，对政府每个领域都有精确的政策处方"
  - "它是一场革命运动，试图拆解现代制度并回到前工业社会"
  - "它是一种纯粹的宗教教义，建立在基督教神学和教会权威之上"
explanation: >-
  英国哲学家迈克尔·奥克肖特捍卫了一种把保守主义理解为气质而非系统性意识形态的观念。他的文章《论做一个保守主义者》（1956）仍是一项重要参考。这种把保守主义视为一种倾向的观点也影响了弗里德里希·哈耶克。奥克肖特的方法以其对政治理性主义的批判而著称，它拒绝认为政治可以被简化为一个体系的想法。
reviewed: false
