question: "Bagaimana sistem uang fiat memperkuat pembagian antara yang memerintah dan yang diperintah?"
answer: "Sistem itu memungkinkan pemerintah membiayai belanja tak terbatas melalui penciptaan uang, yang mendevaluasi tabungan melalui inflasi"
wrong_answers:
  - "Sistem itu memberi warga kendali langsung atas kebijakan moneter melalui pemilu dan referendum demokratis"
  - "Sistem itu mencegah pemerintah berutang, memaksa mereka bergantung semata-mata pada perpajakan untuk pendapatan"
  - "Sistem itu mendistribusikan uang yang baru diciptakan secara merata kepada semua warga untuk merangsang pertumbuhan ekonomi"
explanation: >-
  Mata uang fiat digambarkan sebagai batu penjuru perluasan kekuasaan negara karena memungkinkan pemerintah berutang dan mendorong bank untuk mencetak uang baru. Inflasi yang dihasilkan mendevaluasi tabungan orang, menguntungkan entitas yang paling kaya dan paling berkuasa. Sistem ini tidak memberi warga kendali moneter, juga tidak mencegah utang atau mendistribusikan uang secara merata.
reviewed: false
