question: "Aké vnútorné napätie existuje medzi libertariánmi na Nolanovom diagrame?"
answer: "Niektorí chcú úplne zrušiť štát (anarchokapitalisti), zatiaľ čo iní uprednostňujú minimálny štát zachovávajúci základné suverénne funkcie (minarchisti)"
wrong_answers:
  - "Niektorí chcú silnú ekonomickú reguláciu, zatiaľ čo iní uprednostňujú úplnú dereguláciu všetkých odvetví"
  - "Niektorí podporujú demokratické voľby, zatiaľ čo iní uprednostňujú dedičný systém vládnutia"
  - "Niektorí presadzujú progresívne sociálne politiky, zatiaľ čo iní obhajujú prísne tradičné morálne hodnoty"
explanation: >-
  V libertariánskej rodine existuje zásadný nesúhlas o úlohe štátu. Anarchokapitalisti chcú nahradiť všetky štátne funkcie súkromnými službami, zatiaľ čo minarchisti akceptujú minimálny štát, ktorý si ponecháva základné suverénne funkcie, ako sú obrana a súdy. Obe skupiny zdieľajú libertariánsky vrchol, ale líšia sa v tom, či má vôbec existovať nejaký štát.
reviewed: false
