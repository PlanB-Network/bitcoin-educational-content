question: "Co si francouzští libertaires (socialističtí anarchisté) myslí o soukromém vlastnictví?"
answer: "Soukromé vlastnictví a kapitalismus musí být zrušeny, protože jsou zdroji útlaku"
wrong_answers:
  - "Soukromé vlastnictví je přirozené právo, které předchází státu a musí být chráněno za každou cenu"
  - "Soukromé vlastnictví by mělo být regulováno státem, ale nikdy zcela odstraněno ze společnosti"
  - "Soukromé vlastnictví je přijatelné pouze tehdy, když je rovnoměrně rozděleno mezi všechny členy komuny"
explanation: >-
  Francouzští libertaires, dědici socialistického anarchismu prostřednictvím myslitelů, jako byli Proudhon a Bakunin, zastávají názor, že stát i soukromé vlastnictví musí být zrušeny jako dvojí zdroj útlaku. To vystihuje slavná Proudhonova formule „Vlastnictví je krádež.“ První chybná odpověď popisuje libertariánskou pozici, která je s pohledem libertaires v zásadním rozporu.
