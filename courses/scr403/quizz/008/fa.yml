question: بردارهای طول ثابت در سیستم نوع Simplicity چگونه ساخته می‌شوند؟
answer: از طریق نوع‌های ضربی تو در تو با طول توانِ دو (مثلاً A⁴ = A² × A²).
wrong_answers:
  - با استفاده از یک سازنده نوع آرایه ویژه که در زبان ساخته شده است.
  - از طریق نوع‌های جمعی بازگشتی که عنصرها را در یک فهرست به هم زنجیر می‌کنند.
  - با استفاده از بافرهای طول‌متغیر که اندازه بیشینه ثابتی دارند.
explanation: >-
  Simplicity بردارها را از نوع‌های ضربی تو در تو می‌سازد. A² برابر A × A است،
  A⁴ برابر A² × A² است، A⁸ برابر A⁴ × A⁴ است، و به همین ترتیب. این کار
  مجموعه‌هایی با اندازه‌های توانِ دو می‌دهد. برای مثال، 𝟚²⁵⁶ (یک هش ۲۵۶بیتی)
  با تو در تو کردن ضرب‌ها در عمق ۸ سطح از نوع بولی ساخته می‌شود.
reviewed: false
