question: "Hvordan behandler konservatisme friheter i den økonomiske og den samfunnsmessige sfæren?"
answer: "Sterke friheter i den økonomiske sfæren, men svake friheter i den samfunnsmessige sfæren"
wrong_answers:
  - "Svake friheter i både den økonomiske og den samfunnsmessige sfæren for å opprettholde tradisjonell sosial orden"
  - "Sterke friheter i den samfunnsmessige sfæren, men svake friheter i den økonomiske sfæren"
  - "Like og ubegrensede friheter i begge sfærer med minimal statlig inngripen av noe slag"
explanation: >-
  Konservatisme viser en dikotomi som er speilbildet av sosialisme. På det økonomiske området forsvarer konservative det frie markedet, entreprenørskap og privat eiendom. På det samfunnsmessige området rettferdiggjøres begrensninger med bevaringen av tradisjonelle moralske normer og sosial stabilitet. Det tredje gale svaret beskriver det sosialistiske mønsteret, som er det motsatte.
