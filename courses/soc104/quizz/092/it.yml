question: "Quali tre pilastri dello Stato sociale Bitcoin mette in discussione?"
answer: "Il sistema fiscale, il monopolio monetario per finanziare la spesa tramite debito e la sorveglianza delle transazioni per impedire l'uso di valute alternative"
wrong_answers:
  - "Il bilancio militare, il sistema di istruzione pubblica e l'infrastruttura sanitaria controllata dal governo"
  - "Il sistema giudiziario, il processo legislativo e l'applicazione esecutiva delle normative sulle imprese"
  - "Il sistema di previdenza sociale, la legislazione sul salario minimo e la struttura progressiva dell'imposta sul reddito"
explanation: >-
  Bitcoin mette in discussione i tre pilastri su cui poggia lo Stato sociale. Primo, il sistema fiscale, insufficiente a coprire le spese. Secondo, il monopolio monetario, cioè la capacità di emettere denaro per finanziare la spesa tramite debito. Terzo, la sorveglianza delle transazioni, ossia la capacità di impedire alle persone di usare qualsiasi valuta diversa dalla fiat imposta dallo Stato. Bitcoin indebolisce tutti e tre simultaneamente.
