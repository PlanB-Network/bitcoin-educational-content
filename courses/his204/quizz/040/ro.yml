question: Ce carte celebră a permis grupul lui de Gournay să fie publicată?
answer: Eseu asupra naturii comerțului în general de Richard Cantillon
wrong_answers:
  - Discursurile politice ale lui David Hume
  - Tratatele de comerț ale lui Josiah Child
  - Principele lui Machiavelli
explanation: |
  Cercul lui Gournay a contribuit la publicarea postumă a „Eseului” lui Cantillon, o lucrare majoră a gândirii economice.
