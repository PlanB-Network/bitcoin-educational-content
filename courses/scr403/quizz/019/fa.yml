question: SimplicityHL چیست و چرا لازم است؟
answer: زبانی سطح‌بالاتر که به Simplicity کامپایل می‌شود و نام‌گذاری و دامنه را مدیریت می‌کند.
wrong_answers:
  - یک زبان توصیف سخت‌افزار برای استخراج ASICهایی که Simplicity را اجرا می‌کنند.
  - یک IDE گرافیکی drag-and-drop برای سیم‌کشی ترکیب‌گرهای Simplicity به یکدیگر.
  - یک چارچوب آزمون برای اجرای برنامه‌های Simplicity درون یک sandbox امن.
explanation: >-
  Simplicity خام در سطح پیچیدگی تولیدی ناخوانا می‌شود، زیرا
  همه دسترسی‌های داده باید از طریق ترکیب‌گرهای take/drop تودرتو انجام شود. SimplicityHL
  سازه‌های برنامه‌نویسی آشنا — متغیرهای نام‌دار، دامنه‌بندی، import کردن
  کتابخانه‌ها و جریان کنترل — را فراهم می‌کند که به عبارت‌های ترکیب‌گری Simplicity
  کامپایل می‌شوند. کاربران نهایی SimplicityHL می‌نویسند، در حالی که Simplicity نقش
  هدف کامپایلِ رسماً اثبات‌شده را دارد.
reviewed: false
