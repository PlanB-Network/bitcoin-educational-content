question: "Hva omfatter kategorien økonomisk frihet?"
answer: "Hva du gjør som produsent og forbruker: kjøp, salg, produksjon, arbeid, ansettelser og forvaltning av pengene dine"
wrong_answers:
  - "Dine religiøse overbevisninger, personlige relasjoner og ytringsfrihet"
  - "Din rett til å stemme, delta i valg og bli med i politiske partier"
  - "Din evne til å reise fritt, velge bosted og krysse nasjonale grenser"
explanation: >-
  Økonomisk frihet dekker hva du gjør som produsent og forbruker: hva du kan kjøpe, selge eller produsere; hvor du arbeider; hvem du ansetter; og hva du gjør med pengene dine. Personlige relasjoner, religiøse overbevisninger og bevegelsesfrihet faller inn under kategorien personlig frihet, ikke den økonomiske.
reviewed: false
