question: "乔治·W·布什对 2008 年金融危机的回应如何体现保守主义原则的“有问题的灵活性”？"
answer: "他放弃自由市场原则来救助大型银行，揭示了保守主义将国家视为国民经济稳定最终担保人的观点"
wrong_answers:
  - "他拒绝一切政府干预，任由银行倒闭，不顾后果地严格坚持自由市场意识形态"
  - "他永久性地将银行业国有化并引入累进税制，从保守主义转向民主社会主义"
  - "他的回应是削减所有政府支出并取消金融监管，让市场自我修正"
explanation: >-
  布什宣称，他通过干预来救助大型银行，是“为了拯救自由市场体系而放弃了自由市场原则”。这说明保守主义者如何能够把国家的力量和延续性置于抽象的市场原则之上。同样的灵活逻辑也出现在特朗普的保护主义贸易政策中，这些政策以国家利益的名义推行，却有助长法团主义和裙带资本主义的风险。
reviewed: false
