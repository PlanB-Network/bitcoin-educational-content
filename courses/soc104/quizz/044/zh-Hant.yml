question: "Green New Deal 如何代表民主社會主義的當代演變？"
answer: "它把環境關切用作國家干預與沒收私人收入的新正當理由，將個人利益置於集體的行星健康之下"
wrong_answers:
  - "它完全放棄傳統社會主義經濟學，轉而支持透過碳交易以自由市場解決環境問題"
  - "它拒絕國家干預，轉而依賴自願的個人行動與私部門創新來應對氣候變遷"
  - "它代表與社會主義決裂，因為它把環境保護置於所有社會正義與就業關切之上"
explanation: >-
  Green New Deal 將環境關切與社會目標融合，把生態轉型與社會正義、就業保障和強化公共服務結合起來。個人利益被置於由行星健康所定義的集體利益之下。其核心在於，它提供了一個新的修辭外殼，用來正當化國家干預與沒收私人收入，而不再僅僅以社會正義之名，也以環境之名。
reviewed: false
