question: "نوع یک برنامه Simplicity چیست؟"
answer: 1 ⊢ 1 (unit به unit) — بدون ورودی یا خروجی معنادار؛ side effectها I/O را انجام می‌دهند.
wrong_answers:
  - TxEnv ⊢ Bool — داده تراکنش را می‌گیرد و یک boolean اعتبار برمی‌گرداند.
  - 2^256 ⊢ 2^256 — یک ورودی hash می‌گیرد و یک مقدار hash خروجی جدید برمی‌گرداند.
  - هر نوع A ⊢ B — برنامه‌ها ممکن است نوع‌های ورودی و خروجی کاملاً دلخواه داشته باشند.
explanation: >-
  یک برنامه Simplicity به عنوان عبارتی از نوع 1 ⊢ 1 تعریف می‌شود. اثر Reader
  ورودی محیط تراکنش را می‌گیرد، در حالی که اثر Failure موفقیت یا شکست را تعیین می‌کند.
  این side effectها همه I/O را مدیریت می‌کنند، نه خود نوع‌های Simplicity.
reviewed: true
