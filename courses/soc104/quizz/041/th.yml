question: "สังคมนิยมปฏิบัติต่อเสรีภาพในขอบเขตสังคมและขอบเขตเศรษฐกิจต่างกันอย่างไร?"
answer: "สังคมนิยมสนับสนุนเสรีภาพที่แข็งแกร่งในขอบเขตสังคม แต่เสรีภาพที่อ่อนแอในขอบเขตเศรษฐกิจ"
wrong_answers:
  - "สังคมนิยมจำกัดเสรีภาพทั้งหมดเท่า ๆ กันทั้งในขอบเขตสังคมและเศรษฐกิจ"
  - "สังคมนิยมสนับสนุนเสรีภาพทางเศรษฐกิจที่แข็งแกร่ง แต่จำกัดเสรีภาพทางสังคมเพื่อรักษาระเบียบสังคม"
  - "สังคมนิยมให้เสรีภาพไม่จำกัดในทั้งสองขอบเขต และพึ่งพาความร่วมมือโดยสมัครใจเพื่อรักษาสมดุล"
explanation: >-
  ในความคิดสังคมนิยม มีทวิภาคพื้นฐานระหว่างเสรีภาพทางสังคมกับเสรีภาพทางเศรษฐกิจ เสรีภาพทางสังคมแข็งแกร่ง แต่เสรีภาพทางเศรษฐกิจอ่อนแอ เนื่องจากการเน้นการควบคุม การวางแผน และการกระจายความมั่งคั่งซ้ำโดยรัฐ คำตอบผิดข้อที่สามอธิบายอุดมคติลิเบอร์ทาเรียน ส่วนข้อที่สองอธิบายแบบแผนอนุรักษนิยม ซึ่งเป็นภาพสะท้อนกลับของสังคมนิยม
reviewed: false
