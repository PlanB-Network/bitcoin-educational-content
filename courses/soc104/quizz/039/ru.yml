question: "Что такое принцип ненападения в теории Мюррея Ротбарда?"
answer: "Инициировать физическую силу против другого индивида или его собственности нелегитимно, хотя оборонительное насилие допускается"
wrong_answers:
  - "Все формы насилия всегда неправильны, включая самооборону и сопротивление угнетению"
  - "Насилие допустимо, когда оно направлено против угнетающих институтов, но никогда против других индивидов"
  - "Только государство имеет легитимное право применять силу, и индивиды никогда не должны прибегать к насилию"
explanation: >-
  Принцип ненападения Ротбарда утверждает, что инициирование физической силы против другого человека или его собственности нелегитимно. Это философский перевод золотого правила. Однако он не запрещает всякое насилие: оборонительное насилие, включая самооборону и сопротивление угнетению, считается легитимным. Это отличает его от чистого пацифизма и от заявленной государством монополии на силу.
