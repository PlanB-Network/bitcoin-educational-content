question: "Was ist Hayeks grundlegendes Argument dafür, warum zentrale Planung scheitert?"
answer: "Wissen existiert nur als verstreute Fragmente, die im Besitz verschiedener Individuen sind, und kann nicht von einer zentralen Autorität konzentriert oder integriert werden"
wrong_answers:
  - "Zentrale Planer sind moralisch korrupt und handeln immer in ihrem eigenen Interesse statt zum öffentlichen Wohl"
  - "Demokratische Institutionen reagieren zu langsam auf wirtschaftliche Veränderungen, wodurch zentralisierte Entscheidungen immer veraltet sind"
  - "Zentrale Planung scheitert, weil Bürger sich staatlichen Anordnungen absichtlich widersetzen und sich weigern, Vorschriften einzuhalten"
explanation: >-
  Hayeks grundlegendes Argument beruht auf der Natur von Information. Er zeigte, dass Wissen niemals in konzentrierter oder integrierter Form existiert, sondern nur als verstreute Fragmente, die im Besitz aller verschiedenen Individuen sind. Wert ist subjektiv und nur lokal und unvollständig bekannt. Der zentrale Planer, der in einem Büro sitzt, hat keine Kenntnis vom wahren Preis der Dinge, weil er nicht in Interaktion und Austausch eingebunden ist.
reviewed: false
