question: "¿Por qué se ha descrito a los regímenes totalitarios como 'religiones seculares', y qué revela esto sobre las condiciones necesarias para que exista el totalitarismo?"
answer: "Exigen una fe cuasi religiosa de los militantes y usan el miedo contra los opositores, y el totalitarismo requiere todas las características simultáneamente: libertades suprimidas, gobierno de partido único, revolución violenta y economía dirigida"
wrong_answers:
  - "Sustituyen el culto tradicional por ceremonias estatales, y el totalitarismo requiere solo un líder carismático y control militar"
  - "Usan instituciones religiosas para imponer la ideología del Estado, y el totalitarismo puede surgir siempre que un solo partido político domine el parlamento"
  - "Prometen salvación espiritual mediante la acción política, y el totalitarismo existe siempre que el Estado controle la economía, independientemente de las libertades políticas"
explanation: >-
  Raymond Aron observó que los regímenes totalitarios funcionan sobre dos principios: la fe de los militantes y el miedo de los opositores. Este fanatismo cuasi religioso los caracteriza más allá de sus diferentes motivaciones, lo que les vale la etiqueta de religiones seculares. De forma crucial, el totalitarismo requiere todas sus características definitorias simultáneamente: libertades suprimidas, autoridad ilimitada a través de un partido único, revolución violenta y economía dirigida. Las democracias modernas pueden mostrar algunos de estos rasgos, pero el totalitarismo está presente solo cuando todos se reúnen a la vez.
