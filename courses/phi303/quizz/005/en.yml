question: "Why does the Machiavellian analysis make Plato's philosopher-king impossible?"
answer: "Because those who rise in organizations rise on political skills \u2014 ambition, ruthlessness, eloquence \u2014 not on wisdom or the best ideas."
wrong_answers:
  - "Because philosophy was forbidden to rulers in ancient Greece."
  - "Because kings can never be educated in philosophy."
  - "Because organizations always select their leaders at random."
explanation: |
  The traits that carry people to the top of organizations are interpersonal and political. The wisest ruling is therefore a theoretical ideal — Plato's idealism, precisely.
reviewed: false
