question: "¿En qué se centra una definición estructural de un sistema político?"
answer: "En cómo funciona realmente el sistema y en sus características observables, como el grado de control estatal"
wrong_answers:
  - "En los objetivos declarados y las nobles intenciones proclamadas por los fundadores y líderes del sistema"
  - "En los orígenes históricos del movimiento político y las biografías de sus pensadores clave"
  - "En el número de partidos políticos permitidos y la frecuencia de las elecciones democráticas celebradas"
explanation: >-
  Las definiciones estructurales se centran en cómo funcionan realmente los sistemas políticos y en sus características observables. Por ejemplo, el socialismo se caracteriza estructuralmente por la omnipresencia del Estado. Este enfoque contrasta con las definiciones intencionales, que se basan en motivaciones y objetivos declarados. El enfoque estructural permite una evaluación más objetiva basada en resultados medibles.
reviewed: false
