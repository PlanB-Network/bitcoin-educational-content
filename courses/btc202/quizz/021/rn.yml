question: Ni igiki kigena uburemere bwa node mu mategeko ya consensus??
answer: Uburemere bwayo bw'ubutunzi
wrong_answers:
  - N'Igiharuro c'amahuza asohoka
  - Igihe imaze mu rubuga
  - Nta na kimwe, kuko node yose ifise ijwi rimwe
explanation: |
  Inkurikizi ku mategeko y’uguhurizako bivana n’igikorwa c’ubutunzi gishigikiwe na node, atari igiharuro  cayo.
reviewed: true
