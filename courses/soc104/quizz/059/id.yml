question: "Paradoks tersembunyi apa yang terdapat dalam pragmatisme sentris?"
answer: "Pragmatisme itu sendiri bertumpu pada suatu bentuk dogmatisme, yaitu keyakinan tak terucapkan bahwa hanya para ahli yang kompeten untuk mengarahkan masyarakat"
wrong_answers:
  - "Kaum sentris mengklaim diri moderat tetapi secara konsisten bersekutu dengan partai-partai kiri dalam pemerintahan koalisi"
  - "Kebijakan sentris tampak seimbang tetapi selalu mengutamakan pertumbuhan ekonomi dibanding perlindungan lingkungan"
  - "Kaum sentris menolak ideologi tetapi mengadopsi prinsip pasar bebas yang kaku ketika membuat keputusan ekonomi"
explanation: >-
  Paradoks pragmatisme sentris adalah bahwa ia mengklaim menolak ideologi demi keahlian rasional, namun klaim ini sendiri bertumpu pada dogma yang tak terlihat dan tak terucapkan: bahwa hanya teknokrat yang mampu membuat keputusan yang benar. Keyakinan bahwa hanya para ahli yang seharusnya mengarahkan masyarakat ini sendiri merupakan komitmen ideologis, meskipun kaum sentris tidak mengenalinya demikian.
