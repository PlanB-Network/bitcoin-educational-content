question: "Wat zijn John Rawls' twee principes van rechtvaardigheid?"
answer: "Gelijke vrijheid voor iedereen, en het verschilprincipe dat ongelijkheden alleen toestaat als ze de meest benadeelden ten goede komen"
wrong_answers:
  - "Algemeen kiesrecht voor alle burgers, en progressieve belastingheffing om publieke diensten te financieren"
  - "Vrijheid van meningsuiting zonder beperking, en verplichte herverdeling van welvaart om gelijkheid te bereiken"
  - "Bescherming van privé-eigendomsrechten, en het non-agressieprincipe toegepast op alle staatshandelingen"
explanation: >-
  Rawls stelt twee principes voor: ten eerste gelijke vrijheid voor iedereen (de basis van democratie), en ten tweede het verschilprincipe, dat ongelijkheden alleen toestaat als ze de meest benadeelde leden van de samenleving ten goede komen. Dit betekent dat men het recht heeft rijk te worden, mits herverdeling ook de minst bevoordeelden laat meeprofiteren. De andere opties mengen elementen uit verschillende politieke filosofieën.
