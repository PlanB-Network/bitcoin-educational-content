question: "Каковы главные ценности центризма?"
answer: "Умеренность, компромисс, адаптация и общественная польза"
wrong_answers:
  - "Традиция, порядок, авторитет и национальная идентичность"
  - "Свобода, частная собственность, согласие и индивидуальная ответственность"
  - "Равенство, социальная справедливость, солидарность и коллективная собственность"
explanation: >-
  Главные ценности центризма — умеренность, компромисс, адаптация и общественная польза. Они отражают центристский акцент на прагматическом равновесии, а не на идеологической приверженности. Другие варианты описывают главные ценности соответственно консерватизма, либертарианства и социализма.
reviewed: false
