question: "Co w konserwatywnej filozofii politycznej ma pierwszeństwo przed wolnością?"
answer: "Porządek i tradycja, które muszą zostać mocno ustanowione, zanim wolność może być ceniona"
wrong_answers:
  - "Sprawiedliwość społeczna i równość, które muszą zostać zagwarantowane, zanim jednostki mogą być naprawdę wolne"
  - "Efektywność gospodarcza i pragmatyczne rezultaty, które określają, kiedy wolność jest właściwa"
  - "Indywidualne prawa własności, które muszą być chronione, zanim zostanie przyznana jakakolwiek inna wolność"
explanation: >-
  Dla konserwatystów porządek i tradycja mają pierwszeństwo przed wolnością. Twierdzą oni, że zbyt dużo wolności generuje chaos i nieporządek społeczny, więc wolność może być ceniona dopiero wtedy, gdy porządek został mocno ustanowiony. Kontrastuje to z poglądem socjalistycznym, który priorytetowo traktuje sprawiedliwość, albo z centrowym skupieniem na efektywności.
