question: "Những người libertaire Pháp (những người vô chính phủ xã hội chủ nghĩa) tin gì về sở hữu tư nhân?"
answer: "Sở hữu tư nhân và chủ nghĩa tư bản phải bị bãi bỏ vì chúng là nguồn gốc của áp bức"
wrong_answers:
  - "Sở hữu tư nhân là một quyền tự nhiên có trước nhà nước và phải được bảo vệ bằng mọi giá"
  - "Sở hữu tư nhân nên được nhà nước điều tiết nhưng không bao giờ bị loại bỏ hoàn toàn khỏi xã hội"
  - "Sở hữu tư nhân chỉ chấp nhận được khi được phân bổ bình đẳng giữa tất cả thành viên của một công xã"
explanation: >-
  Những người libertaire Pháp, kế thừa chủ nghĩa vô chính phủ xã hội chủ nghĩa qua các nhà tư tưởng như Proudhon và Bakunin, cho rằng cả nhà nước lẫn sở hữu tư nhân đều phải bị bãi bỏ như hai nguồn gốc song hành của áp bức. Điều này được tóm gọn trong công thức nổi tiếng của Proudhon: "Sở hữu là trộm cắp." Câu trả lời sai đầu tiên mô tả lập trường libertarian, vốn đối lập căn bản với quan điểm libertaire.
reviewed: false
