question: "¿Cómo trata un libertario culturalmente conservador los comportamientos que desaprueba moralmente?"
answer: "Se opone a esos comportamientos y los desalienta mediante la persuasión y el ejemplo, pero sin recurrir a la fuerza coercitiva de la ley"
wrong_answers:
  - "Apoya prohibiciones de esos comportamientos por parte de gobiernos locales mientras se opone a prohibiciones a nivel federal"
  - "Permanece completamente en silencio sobre esos comportamientos, creyendo que cualquier forma de desaprobación viola la libertad individual"
  - "Defiende tribunales comunitarios que puedan castigar esos comportamientos fuera del sistema legal formal"
explanation: >-
  El libertario culturalmente conservador puede desaprobar moralmente ciertos comportamientos, pero no defiende la prohibición legal de acciones consensuales y no agresivas. Puede que no le gusten esas acciones, oponerse a ellas y desalentarlas activamente, pero siempre mediante la persuasión, la educación y el ejemplo, y no mediante la fuerza coercitiva de la ley. No se trata de permanecer en silencio ni de crear mecanismos alternativos de aplicación.
