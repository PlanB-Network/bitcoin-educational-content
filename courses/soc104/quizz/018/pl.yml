question: "Jaka jest definicja etatyzmu przedstawiona w ramie Nolana?"
answer: "Używanie ustawodawstwa do kontrolowania i kształtowania społeczeństwa, czy to w imię obrony cywilizacji, klasy pracującej, natury, czy uciskanych"
wrong_answers:
  - "System rządów, w którym wybrani urzędnicy sprawują stałe kadencje, a przekazywanie władzy odbywa się poprzez demokratyczne wybory"
  - "Przekonanie, że tylko silna armia może chronić suwerenność i integralność terytorialną państwa"
  - "Filozofia gospodarcza, która poprzez cła i kontyngenty stawia krajowe gałęzie przemysłu ponad zagraniczną konkurencją"
explanation: >-
  Etatyzm definiuje się jako używanie ustawodawstwa do kontrolowania i kształtowania społeczeństwa. Praktykują go zarówno lewica, jak i prawica: jedni w imię obrony cywilizacji, inni w imię obrony klasy pracującej, natury lub uciskanych. Nawet centryści aprobują go, gdy im to odpowiada. Etatyzm nie ogranicza się do polityki wojskowej, protekcjonizmu handlowego ani samego posiadania wybieralnych rządów.
reviewed: false
