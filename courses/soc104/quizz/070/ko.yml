question: "다섯 가지 사회적 논쟁(결혼, 이민, 총기, 마약, 가당 음료) 전반에서, 각 쟁점에 대한 사회주의자의 입장을 형성하는 반복적 분석 틀은 무엇인가요?"
answer: "지배자와 피지배자 사이의 갈등 틀로, 사회는 억압에 의해 구조화되어 있으며 국가는 취약한 집단을 보호하기 위해 개입해야 한다고 봅니다"
wrong_answers:
  - "가장 많은 시민의 전반적 행복과 경제 생산성을 극대화하는 데 초점을 맞춘 공리주의적 틀"
  - "개인의 자유가 국가와 기업의 간섭 모두로부터 보호되어야 한다는 자연권의 틀"
  - "확립된 사회 제도가 파괴적인 현대적 변화에 맞서 보존되어야 한다는 전통주의적 틀"
explanation: >-
  사회적 논쟁 전반에서 사회주의자의 입장은 일관되게 지배자/피지배자 갈등 틀에 의해 형성됩니다. 결혼에서는 이성애자 다수가 동성애자 소수를 억압합니다. 이민에서는 국적에 기반한 제한이 억압의 형태입니다. 총기에서는 취약한 사람들을 보호하기 위해 국가만이 힘을 가져야 합니다. 가당 음료에서는 산업가들이 가장 보호받지 못한 사람들의 취약성에서 이익을 얻습니다. 이 억압자/피억압자 렌즈는 젠더, 인종, 심지어 인류와 자연의 관계를 포함한 수많은 영역에서 재생산됩니다.
