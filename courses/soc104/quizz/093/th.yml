question: "สารหลักของ Cypherpunk Manifesto ปี 1993 ของ Eric Hughes เกี่ยวกับความเป็นส่วนตัวคืออะไร?"
answer: "ความเป็นส่วนตัวจำเป็นต่อสังคมเปิดในยุคอิเล็กทรอนิกส์ และปัจเจกบุคคลต้องสร้างมันขึ้นเอง แทนที่จะคาดหวังให้รัฐบาลหรือบริษัทรับประกันมัน"
wrong_answers:
  - "ความเป็นส่วนตัวเป็นความฟุ่มเฟือยที่ต้องเสียสละเพื่อแลกกับความมั่นคงแห่งชาติและการปกป้องสถาบันประชาธิปไตย"
  - "ความเป็นส่วนตัวควรถูกกำกับโดยสนธิสัญญาระหว่างประเทศที่กำหนดมาตรฐานเดียวกันสำหรับการคุ้มครองข้อมูลในทุกประเทศ"
  - "ความเป็นส่วนตัวสำคัญเฉพาะต่ออาชญากรและผู้เห็นต่าง ขณะที่พลเมืองที่เคารพกฎหมายได้ประโยชน์จากระบบเฝ้าระวังที่โปร่งใส"
explanation: >-
  Manifesto ปี 1993 ของ Eric Hughes ระบุว่าความเป็นส่วนตัวจำเป็นต่อสังคมเปิดในยุคอิเล็กทรอนิกส์ และเราไม่อาจคาดหวังให้รัฐบาล บริษัท หรือองค์กรขนาดใหญ่อื่น ๆ รับประกันมันได้ แรงจูงใจพื้นฐานคือ confidentiality เป็นองค์ประกอบสำคัญของเสรีภาพ และต้องถูกสร้างโดยปัจเจกบุคคลเอง ไม่ใช่รอคอยให้เป็นของขวัญจากสถาบัน
reviewed: false
