question: Lợi ích nào cho người bán hàng khi chấp nhận Bitcoin?
answer: Khả năng chống kiểm duyệt.
wrong_answers:
  - Phí giao dịch tăng cao.
  - Bảo vệ chống lại sự lạm phát.
  - Hạn chế tài chính.
explanation: >-
  Việc chấp nhận Bitcoin dưới góc độ một người bán hàng mang lại nhiều lợi ích, bao gồm khả năng chống kiểm duyệt, giảm phí giao dịch, tăng hiệu quả, bảo vệ chống lại lạm phát,
  cũng như tự do và chủ quyền tài chính.
reviewed: true