question: "Kako je Michael Oakeshott u svom filozofskom radu okarakterisao konzervativizam?"
answer: "Kao temperament i sklonost prema životu, a ne kao krutu sistematsku ideologiju"
wrong_answers:
  - "Kao sveobuhvatnu ekonomsku teoriju sa preciznim političkim propisima za svaku oblast vlasti"
  - "Kao revolucionarni pokret koji nastoji da demontira moderne institucije i vrati se u predindustrijsko društvo"
  - "Kao čisto religijsku doktrinu utemeljenu u hrišćanskoj teologiji i crkvenom autoritetu"
explanation: >-
  Michael Oakeshott, britanski filozof, branio je shvatanje konzervativizma kao temperamenta, a ne sistematske ideologije. Njegov esej O tome kako biti konzervativan (1956) ostaje suštinska referenca. Ovo viđenje konzervativizma kao sklonosti uticalo je i na Friedrich Hayek-a. Oakeshottov pristup je značajan po kritici racionalizma u politici, odbacujući ideju da se politika može svesti na sistem.
