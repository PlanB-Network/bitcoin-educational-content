question: "Che cosa afferma il principio di non aggressione?"
answer: "Una persona è libera di agire come desidera finché non viene commessa violenza contro la vita, la libertà o la proprietà di un altro"
wrong_answers:
  - "Lo Stato ha il diritto esclusivo di usare la forza per mantenere l'ordine sociale"
  - "I cittadini devono sottomettersi al governo della maggioranza anche quando limita le libertà individuali"
  - "La libertà d'azione è consentita solo quando giova al bene collettivo della società"
explanation: >-
  Il principio di non aggressione è una pietra angolare della politica libertaria, affermando che gli individui possono agire liberamente purché non commettano violenza contro la vita, la libertà o la proprietà altrui. Richiama la regola d'oro presente in tutte le civiltà. A differenza delle altre opzioni, non concede allo Stato una speciale autorità morale né subordina i diritti individuali al beneficio collettivo.
