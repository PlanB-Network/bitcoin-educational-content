question: "What is the key difference between minarchists and anarcho-capitalists within libertarianism?"
answer: "Minarchists accept a minimal state for defense, justice, and police, while anarcho-capitalists want all state functions privatized"
wrong_answers:
  - "Minarchists reject all forms of government, while anarcho-capitalists accept limited state regulation of markets"
  - "Minarchists favor progressive taxation for essential services, while anarcho-capitalists oppose all taxation"
  - "Minarchists focus on economic freedom only, while anarcho-capitalists defend both economic and societal freedoms"
explanation: >-
  Minarchists believe the state should be limited to core functions such as defense, justice, and police (the "night-watchman state"), while anarcho-capitalists argue that even these functions should be privatized and managed through voluntary market competition. Their disagreement is more about practical implementation than fundamental ethical principles. Both tendencies share the same libertarian values of self-ownership and non-aggression.
