question: "Care este definiția etatismului așa cum este prezentată în cadrul Nolan?"
answer: "Folosirea legislației pentru a controla și modela societatea, fie în numele apărării civilizației, al clasei muncitoare, al naturii sau al celor oprimați"
wrong_answers:
  - "Un sistem de guvernare în care aleșii au mandate fixe, iar tranzițiile de putere au loc prin alegeri democratice"
  - "Credința că doar o armată puternică poate proteja suveranitatea și integritatea teritorială a unei națiuni"
  - "O filosofie economică ce prioritizează industriile naționale față de concurența străină prin tarife și cote"
explanation: >-
  Etatismul este definit ca folosirea legislației pentru a controla și modela societatea. Atât stânga, cât și dreapta îl practică: unii în numele apărării civilizației, alții în numele apărării clasei muncitoare, al naturii sau al celor oprimați. Chiar și centriștii îl aprobă atunci când le convine. Etatismul nu se limitează la politica militară, la protecționismul comercial sau pur și simplu la existența unor guverne alese.
reviewed: false
