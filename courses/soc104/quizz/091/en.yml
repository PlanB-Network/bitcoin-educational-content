question: "What message did Satoshi Nakamoto embed in the first Bitcoin block ever mined?"
answer: "A headline from the London Times about the Chancellor being on the brink of a second bank bailout"
wrong_answers:
  - "A quote from Friedrich Hayek about the dangers of central planning and government control over money"
  - "A declaration of independence from all forms of government and financial regulation worldwide"
  - "A mathematical proof demonstrating that decentralized currency is more efficient than fiat money"
explanation: >-
  In the genesis block, Satoshi Nakamoto inserted a symbolic headline from the London Times: "The Times 03/Jan/2009 Chancellor on the brink of a second bank bailout." This was a direct reference to the 2008 financial crisis and the monetary interventionism that followed, making Bitcoin's intention unmistakable as an alternative to centralized banking systems.
reviewed: false
