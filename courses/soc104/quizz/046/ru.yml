question: "Кого часто называют основателем современного консерватизма?"
answer: "Эдмунда Бёрка, который выступал за сохранение институтов и традиций перед лицом радикальных изменений Французской революции"
wrong_answers:
  - "Карла Маркса, который в девятнадцатом веке разработал теорию классовой борьбы и исторического материализма"
  - "Джона Локка, который в семнадцатом веке сформулировал теорию естественных прав и общественного договора"
  - "Адама Смита, который написал «Богатство народов» и основал дисциплину классической экономической теории"
explanation: >-
  Эдмунда Бёрка часто называют основателем консерватизма из-за его оппозиции Французской революции. Его «Размышления о революции во Франции» (1790) отстаивали благоразумие и постепенные реформы вместо радикальных перемен. Он считал, что общество должно развиваться не через создание чистого листа, а посредством постепенных реформ, сохраняющих проверенные институты и традиции.
