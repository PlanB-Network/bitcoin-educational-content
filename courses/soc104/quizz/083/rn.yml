question: "Constructivism ni iki nk'ukwemera kwa politike gusangiwe?"
answer: "Ni ukwemera ko leta yo hagati ishobora kurema, biciye ku nguvu z'amategeko, urutonde rw'imibano rubereye benshi cane"
wrong_answers:
  - "Ni ukwemera ko ikibano gikwiye gutunganirizwa biciye mu gukorana ku bushake hagati y'abantu ata kwivanga kwa leta"
  - "Ni ukwemera ko amasoko yidegemvya yonyene ari yo ashobora kugena igaburwa ryiza kuruta irindi ry'ubutunzi mu kibano"
  - "Ni ukwemera ko ububasha bwa politike bukwiye kugaburwa ku buryo bungana mu banyagihugu bose biciye muri demokarasi itaziguye"
explanation: >-
  Constructivism ihuza aba centrist, abakonserevateri, n'abasosiyaliste ku kwemera basangiye: ko inzira ya politike iruta inzira y'isoko. Ni ukwemera ko leta yo hagati ishobora kurema, biciye ku nguvu z'amategeko, urutonde rw'imibano rubereye benshi cane. Ivyo birahushanye ata guca ku ruhande n'ukuburanira kwa libertarian urutonde rwizana ruseruka mu migenderanire y'ubushake.
