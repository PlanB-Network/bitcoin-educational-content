question: "Jak rozróżnienie Karla Poppera między społeczeństwami otwartymi i zamkniętymi odnosi się do debaty indywidualizm kontra kolektywizm?"
answer: "Społeczeństwo otwarte uznaje prawo jednostki do samodzielnego osądu poprzez osobiste decyzje, podczas gdy społeczeństwo zamknięte jest kolektywistyczne, oparte na mentalności plemiennej i odmowie wolności krytycznej"
wrong_answers:
  - "Społeczeństwo otwarte to takie, które pozwala na wolny handel przez granice narodowe, podczas gdy społeczeństwo zamknięte nakłada cła i protekcjonistyczne polityki gospodarcze"
  - "Społeczeństwo otwarte jest rządzone przez demokrację bezpośrednią, w której głosuje każdy obywatel, podczas gdy społeczeństwem zamkniętym rządzi jeden dziedziczny monarcha"
  - "Społeczeństwo otwarte publikuje przejrzyście wszystkie dokumenty rządowe, podczas gdy społeczeństwo zamknięte klasyfikuje informacje jako tajemnice państwowe"
explanation: >-
  Popper zdefiniował społeczeństwo zamknięte jako społeczeństwo magiczne albo plemienne, a społeczeństwo otwarte jako takie, w którym jednostki stają wobec osobistych decyzji. Społeczeństwo zamknięte jest kolektywistyczne, opiera się na mentalności plemiennej z odmową wolności krytycznej i idealizacją statycznego porządku. Społeczeństwo otwarte przyznaje pierwszeństwo wolnemu wyborowi wartości, przekonań i relacji, bezpośrednio ucieleśniając zasady indywidualistyczne.
