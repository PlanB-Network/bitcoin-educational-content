question: "Ako sa všetky totalitné režimy dostali k moci?"
answer: "Prostredníctvom násilnej revolúcie, ktorá ospravedlňovala urobenie čistého stola s predchádzajúcim systémom"
wrong_answers:
  - "Prostredníctvom postupnej legislatívnej reformy v rámci existujúcich demokratických inštitúcií"
  - "Prostredníctvom vojenských prevratov organizovaných zahraničnými mocnosťami usilujúcimi sa o regionálnu kontrolu"
  - "Prostredníctvom pokojných masových hnutí, ktoré veľkou väčšinou vyhrali ľudové voľby"
explanation: >-
  Všetky totalitné režimy sa dostali k moci prostredníctvom násilnej revolúcie. Táto revolúcia slúži dvojitému účelu: fyzicky zničí starý poriadok a ideologicky ospravedlní použitie násilia ako nevyhnutné na budovanie novej spoločnosti. To odlišuje totalitné prevzatia moci od demokratických prechodov, prevratov podporovaných zo zahraničia alebo pokojných volebných víťazstiev.
