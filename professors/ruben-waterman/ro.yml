bio: |
  Ruben Waterman este fondatorul Bittr și un bitcoiner devotat. După ce și-a obținut masteratul în Digital Currency la University of Nicosia, și-a propus să creeze cel mai simplu mod de a economisi în bitcoin. Cu convingerea fermă că bitcoin este cea mai bună tehnologie de economisire, Ruben a construit Bittr ca un instrument minimalist și practic pentru cei care economisesc pe termen lung. Bittr acceptă atât achiziții unice, cât și recurente de bitcoin, trimise întotdeauna direct în propriul tău portofel.

short_bio: Bittr este un serviciu simplu pentru a cumpăra Bitcoin direct în propriul tău portofel
