question: "Sur quoi une définition structurelle d'un système politique se concentre-t-elle ?"
answer: "Sur la manière dont le système fonctionne réellement et sur ses caractéristiques observables, comme le degré de contrôle étatique"
wrong_answers:
  - "Les objectifs déclarés et les nobles intentions proclamées par les fondateurs et les dirigeants du système"
  - "Les origines historiques du mouvement politique et les biographies de ses penseurs clés"
  - "Le nombre de partis politiques autorisés et la fréquence des élections démocratiques organisées"
explanation: >-
  Les définitions structurelles se concentrent sur la manière dont les systèmes politiques fonctionnent réellement et sur leurs caractéristiques observables. Par exemple, le socialisme est structurellement caractérisé par l'omniprésence de l'État. Cette approche contraste avec les définitions intentionnelles, qui reposent sur les motivations et objectifs déclarés. L'approche structurelle permet une évaluation plus objective fondée sur des résultats mesurables.
