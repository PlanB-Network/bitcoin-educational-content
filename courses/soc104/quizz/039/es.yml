question: "¿Cómo pueden los programas de asistencia social financiados por el Estado producir efectos perversos, ilustrando el peligro de basarse únicamente en las intenciones?"
answer: "Pueden crear dependencia, eliminar incentivos para trabajar y equivaler a expoliación, ya que el dinero primero debe tomarse de quienes produjeron la riqueza"
wrong_answers:
  - "Fomentan un ahorro personal excesivo, reducen el consumo y provocan deflación en la economía en general"
  - "Fortalecen la empresa privada al trasladar los costos laborales al gobierno y reducir la necesidad de salarios competitivos"
  - "Eliminan las distinciones de clase tan completamente que la movilidad social se vuelve innecesaria y la innovación se estanca"
explanation: >-
  Friedman advierte que las intenciones generosas pueden producir consecuencias perjudiciales cuando descuidan un análisis riguroso de los incentivos humanos. Los programas de asistencia financiados por el Estado corren el riesgo de crear dependencia, no generar incentivo alguno para trabajar y constituir una forma de expoliación, ya que los fondos primero deben tomarse de los productores de riqueza. Los resultados medibles, como la reducción de la pobreza y la eficiencia, deben tener prioridad sobre las nobles intenciones.
