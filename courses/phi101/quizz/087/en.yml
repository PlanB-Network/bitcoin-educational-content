question: According to Constant, what limits the sovereignty of the people?
answer: Justice and the rights of individuals.
wrong_answers:
  - The will of the majority expressed through elections.
  - The authority of the monarch and the aristocracy.
  - International treaties and alliances between nations.
explanation: |
  Benjamin Constant asserts that the sovereignty of the people is not unlimited but is circumscribed within the bounds traced by justice and the rights of individuals. The will of an entire people cannot make just what is unjust, as natural law sets limits on political power.
reviewed: true
