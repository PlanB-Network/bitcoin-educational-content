question: "リバタリアニズム内部におけるミナキストと無政府資本主義者の重要な違いは何か？"
answer: "ミナキストは防衛、司法、警察のための最小国家を受け入れる一方、無政府資本主義者はすべての国家機能の民営化を望む"
wrong_answers:
  - "ミナキストはあらゆる形態の政府を拒否する一方、無政府資本主義者は市場への限定的な国家規制を受け入れる"
  - "ミナキストは必須サービスのための累進課税を支持する一方、無政府資本主義者はあらゆる課税に反対する"
  - "ミナキストは経済的自由だけに集中する一方、無政府資本主義者は経済的自由と社会的自由の双方を擁護する"
explanation: >-
  ミナキストは、国家は防衛、司法、警察のような核心的機能に限定されるべきだと考える（「夜警国家」）。一方、無政府資本主義者は、これらの機能でさえ民営化され、自発的な市場競争を通じて運営されるべきだと主張する。両者の不一致は、根本的な倫理原則というより実践的実装に関するものである。双方の傾向は、自己所有権と不可侵という同じリバタリアン的価値を共有している。
