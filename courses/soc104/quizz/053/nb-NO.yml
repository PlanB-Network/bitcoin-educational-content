question: "Hvorfor begynte klassiske liberalere i USA å kalle seg 'libertarianere' i løpet av det tjuende århundret?"
answer: "Fordi amerikansk 'liberalisme' var blitt kapret av økende statlig intervensjonisme og velferdsstaten"
wrong_answers:
  - "Fordi de ønsket å distansere seg fra europeiske monarkistiske tradisjoner"
  - "Fordi begrepet 'liberal' ble assosiert med anarkisme og politisk vold"
  - "Fordi nye handelsavtaler krevde en egen politisk identitet for frimarkedstilhengere"
explanation: >-
  I løpet av det tjuende århundret skjedde det et grunnleggende skifte da laissez-faire-prinsipper gradvis ble forlatt til fordel for velferdsstaten. Amerikansk "liberalisme" kom til å bety noe svært annet enn klassisk liberalisme, ved å omfavne statlig intervensjonisme. Klassiske liberalere tok i bruk begrepet "libertarianer" for å bevare skillet. Denne omprofileringen hadde ingenting å gjøre med europeisk monarkisme, anarkistisk vold eller handelsavtaler.
reviewed: false
