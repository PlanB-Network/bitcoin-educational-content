question: "Jak socjalizm traktuje wolności inaczej w sferze społecznej i gospodarczej?"
answer: "Socjalizm sprzyja silnym wolnościom w sferze społecznej, ale słabym wolnościom w sferze gospodarczej"
wrong_answers:
  - "Socjalizm ogranicza wszystkie wolności jednakowo w sferze społecznej i gospodarczej"
  - "Socjalizm sprzyja silnym wolnościom gospodarczym, ale ogranicza wolności społeczne, aby utrzymać porządek społeczny"
  - "Socjalizm przyznaje nieograniczone wolności w obu sferach i polega na dobrowolnej współpracy, aby utrzymać równowagę"
explanation: >-
  W myśli socjalistycznej istnieje fundamentalna dychotomia między wolnościami społecznymi a gospodarczymi. Wolności społeczne są silne, ale wolności gospodarcze są słabe ze względu na nacisk na kontrolę państwa, planowanie i redystrybucję bogactwa. Trzecia błędna odpowiedź opisuje ideał libertariański, podczas gdy druga opisuje wzorzec konserwatywny, będący lustrzanym odbiciem socjalizmu.
