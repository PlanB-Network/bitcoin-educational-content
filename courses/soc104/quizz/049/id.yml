question: "Bagaimana respons George W. Bush terhadap krisis finansial 2008 menggambarkan 'fleksibilitas bermasalah' prinsip konservatif?"
answer: "Ia meninggalkan prinsip pasar bebas untuk menyelamatkan bank-bank besar, mengungkap pandangan konservatif tentang negara sebagai penjamin akhir stabilitas ekonomi nasional"
wrong_answers:
  - "Ia menolak semua intervensi pemerintah dan membiarkan bank-bank gagal, dengan ketat mematuhi ideologi pasar bebas terlepas dari konsekuensinya"
  - "Ia menasionalisasi sektor perbankan secara permanen dan memperkenalkan perpajakan progresif, bergeser dari konservatisme ke sosialisme demokratis"
  - "Ia merespons dengan memangkas semua belanja pemerintah dan menghapus regulasi finansial agar pasar mengoreksi dirinya sendiri"
explanation: >-
  Bush menyatakan bahwa ia telah 'meninggalkan prinsip pasar bebas untuk menyelamatkan sistem pasar bebas' dengan melakukan intervensi untuk menyelamatkan bank-bank besar. Ini menggambarkan bagaimana kaum konservatif dapat memprioritaskan kekuatan dan kesinambungan bangsa di atas prinsip pasar yang abstrak. Logika fleksibel yang sama tampak dalam kebijakan perdagangan proteksionis Trump, yang dijalankan atas nama kepentingan nasional dengan risiko memicu korporatisme dan kapitalisme kroni.
reviewed: false
