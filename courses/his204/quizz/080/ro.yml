question: În memoriul său despre împrumutul cu dobândă, pe cine apără Turgot libertatea, respingându-le totodată principiile?
answer: Grecii și Biserica Catolică
wrong_answers:
  - Grecii și egiptenii
  - Biserica Catolică și egiptenii
  - Romanii și cartaginezii
explanation: |
  Turgot a apărat libertatea de a împrumuta bani, respingând în același timp argumentele grecilor și ale Bisericii Catolice împotriva dobânzii. El credea că interzicerea dobânzii împiedica dezvoltarea economică și că era necesar să li se permită indivizilor să împrumute și să dea cu împrumut în mod liber.
