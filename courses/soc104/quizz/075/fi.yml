question: "Mikä on ratkaiseva ero konservatiivien ja libertaarien kantojen välillä tuliaseiden sääntelyä koskevassa kysymyksessä?"
answer: "Molemmat hyväksyvät jonkinasteisen sääntelyn, mutta konservatiivit haluavat sääntöjen tulevan legitiimiltä julkiselta auktoriteetilta, kun taas libertaarit haluavat niiden syntyvän suoraan asianomaisten tahojen, kuten kansalaisyhdistysten ja markkinakilpailun, kautta"
wrong_answers:
  - "Konservatiivit vastustavat kaikkea tuliaseiden sääntelyä, kun taas libertaarit hyväksyvät tiukan valtiollisen kontrollin yleisen turvallisuuden vuoksi"
  - "Konservatiivit haluavat kieltää tuliaseet kokonaan, kun taas libertaarit tukevat rajoittamatonta pääsyä kaikkiin aseisiin"
  - "Konservatiivit perustavat kantansa yksilön oikeuksiin, kun taas libertaarit perustavat omansa kollektiiviseen vastuuseen"
explanation: >-
  Sekä konservatiivit että libertaarit ovat yhtä mieltä siitä, että jonkinlainen sääntely aseiden kantamiselle on välttämätöntä. Ratkaiseva ero on siinä, kuka nämä säännöt asettaa. Konservatiivit vaativat, että sääntelyn on tultava julkiselta auktoriteetilta, jonka tehtävänä on turvata yhteinen hyvä (ylhäältä alas). Libertaarit väittävät, että sääntelyn tulisi syntyä suoraan asianomaisten tahojen piiristä: turvallisuusalan ammattilaisilta, kansalaisyhdistyksiltä ja markkinakilpailusta (alhaalta ylös).
