question: Какво гарантира теоремата за пълнота относно Simplicity?
answer: Че всяка функция между два типа на Simplicity може да бъде изградена от деветте комбинатора.
wrong_answers:
  - Че програмите на Simplicity гарантирано винаги завършват за константно време.
  - Че Simplicity е Turing-пълен и може да симулира абсолютно всяка машина на Turing.
  - Че всяка валидна програма на Simplicity има едно-единствено уникално представяне.
explanation: >-
  Теоремата за пълнота доказва, че за всяка функция между крайни типове
  на Simplicity съществува израз на Simplicity, който я изчислява.
  Конструктивното доказателство изгражда таблица за търсене чрез вложени
  изрази case и scribe. Това е формално верифицирано в помощника за доказателства Rocq.
