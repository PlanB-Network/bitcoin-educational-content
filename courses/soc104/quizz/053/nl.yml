question: "Wat stelt het non-agressieprincipe?"
answer: "Een persoon is vrij om te handelen zoals hij wil zolang er geen geweld wordt gepleegd tegen het leven, de vrijheid of het eigendom van een ander"
wrong_answers:
  - "De staat heeft het alleenrecht om geweld te gebruiken om de sociale orde te handhaven"
  - "Burgers moeten zich onderwerpen aan meerderheidsbesluitvorming, zelfs wanneer die individuele vrijheden beperkt"
  - "Handelingsvrijheid is alleen toegestaan wanneer zij het collectieve welzijn van de samenleving dient"
explanation: >-
  Het non-agressieprincipe is een hoeksteen van libertarische politiek en stelt dat individuen vrij mogen handelen zolang zij geen geweld plegen tegen het leven, de vrijheid of het eigendom van anderen. Het herinnert aan de gulden regel die in verschillende beschavingen voorkomt. In tegenstelling tot de andere opties kent het de staat geen bijzondere morele autoriteit toe en maakt het individuele rechten niet ondergeschikt aan collectief voordeel.
reviewed: false
