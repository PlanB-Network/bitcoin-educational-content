question: "Hvorfor viste Molinaris forutsigelse fra 1849 seg profetisk når det gjelder forholdet mellom frihet og politisk makt?"
answer: "Fordi konservative og sosialister har vekslet om makten og instrumentalisert frihet i tjeneste for sine respektive politiske mål, akkurat slik han beskrev"
wrong_answers:
  - "Fordi økonom-figuren han beskrev til slutt fikk politisk makt og gjennomførte libertariansk politikk over hele Europa"
  - "Fordi hans forutsigelse om at alle tre politiske familier ville smelte sammen til én enkelt sentristisk bevegelse, gikk i oppfyllelse i det tjuende århundret"
  - "Fordi frihet gradvis ble utvidet av påfølgende regjeringer til den ble det primære organiserende prinsippet i moderne demokratier"
explanation: >-
  Molinaris visjon viste seg profetisk fordi konservative og sosialister siden midten av det nittende århundret har vekslet om makten og gjort nettopp det han beskrev: instrumentaliseringen av frihet i tjeneste for politiske mål. Begge familier er villige til å begrense friheter og be staten om å påtvinge sine respektive agendaer, mens økonomens posisjon om ubetinget frihet forble marginalisert.
reviewed: false
