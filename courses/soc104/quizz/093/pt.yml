question: "Quais são os três pilares do Estado de bem-estar social que o Bitcoin desafia?"
answer: "O sistema fiscal, o monopólio monetário para financiar gastos por meio de dívida e a vigilância das transações para impedir o uso de moedas alternativas"
wrong_answers:
  - "O orçamento militar, o sistema de educação pública e a infraestrutura de saúde controlada pelo governo"
  - "O sistema judicial, o processo legislativo e a execução regulatória do poder executivo sobre as empresas"
  - "O sistema de seguridade social, a legislação de salário mínimo e a estrutura progressiva do imposto de renda"
explanation: >-
  O Bitcoin desafia os três pilares sobre os quais repousa o Estado de bem-estar social. Primeiro, o sistema fiscal, que é insuficiente para cobrir as despesas. Segundo, o monopólio monetário, ou seja, a capacidade de emitir dinheiro para financiar gastos por meio de dívida. Terceiro, a vigilância das transações, a capacidade de impedir que as pessoas usem qualquer moeda que não seja a fiat imposta pelo Estado. O Bitcoin enfraquece os três simultaneamente.
