question: جمع‌کنندهٔ کامل، بیت‌های نقلیِ دو نیم‌جمع‌کنندهٔ خود را به‌جای XOR کردن، OR می‌کند. چرا OR درست است؟
answer: برای هر ورودی، حداکثر یکی از دو نیم‌جمع‌کننده می‌تواند نقلی تولید کند، پس OR دو حالتِ متقابلاً انحصاری را دقیقاً ادغام می‌کند.
wrong_answers:
  - دو بیت نقلی باید با هم جمع شوند، و OR همان روشی است که جمع دودوییِ تک‌بیتی در Simplicity انجام می‌شود.
  - پس از شاخه‌زنی، OR تنها عملگر بولی است که نوعش هنوز با محیط سازگار است.
  - OR نقلی را بیش‌برآورد می‌کند؛ هر نقلیِ کاذب بعداً با تصویر نهایی دور انداخته می‌شود.
explanation: >-
  اگر نیم‌جمع‌کنندهٔ نخست نقلی تولید کند، هر دو بیت ورودی آن 1 بوده‌اند، پس بیت
  جمع آن 0 است — و نیم‌جمع‌کننده‌ای که یک 0 به آن داده شود هرگز نمی‌تواند نقلی
  تولید کند. بنابراین دو بیت نقلی هرگز هم‌زمان 1 نیستند، و OR آن‌ها را دقیقاً
  ادغام می‌کند (روی ورودی‌های قابل‌دسترسی حتی با XOR هم منطبق است). همین
  انحصار متقابل دقیقاً چیزی است که تجزیهٔ جمع‌کنندهٔ کامل به دو نیم‌جمع‌کننده را
  درست می‌کند.
reviewed: false
