question: "Kuidas iseloomustas Michael Oakeshott konservatismi oma filosoofilises töös?"
answer: "Temperamendi ja ellusuhtumisena, mitte jäiga süstemaatilise ideoloogiana"
wrong_answers:
  - "Tervikliku majandusteooriana koos täpsete poliitikasoovitustega iga valitsemisvaldkonna jaoks"
  - "Revolutsioonilise liikumisena, mis püüab lammutada modernsed institutsioonid ja naasta eelindustriaalsesse ühiskonda"
  - "Puhtalt religioosse doktriinina, mis põhineb kristlikul teoloogial ja kiriklikul autoriteedil"
explanation: >-
  Briti filosoof Michael Oakeshott kaitses arusaama konservatismist kui temperamendist, mitte süstemaatilisest ideoloogiast. Tema essee On Being Conservative (1956) on endiselt oluline viide. See arusaam konservatismist kui hoiakust mõjutas ka Friedrich Hayekit. Oakeshotti lähenemine on tähelepanuväärne poliitilise ratsionalismi kriitika poolest, lükates tagasi idee, et poliitikat saab taandada süsteemiks.
reviewed: false
