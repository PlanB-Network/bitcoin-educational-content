question: "Comment le cours soutient-il que la liberté permet aux valeurs de gauche et de droite de coexister pacifiquement ?"
answer: "Dans un régime de liberté authentique, les personnes aux idéaux de gauche peuvent volontairement partager des possessions et redistribuer des fonds, tandis que celles aux valeurs de droite peuvent épargner et transmettre des traditions, sans qu'aucun des deux camps n'impose son mode de vie à l'autre"
wrong_answers:
  - "La liberté exige que les deux camps fassent des compromis en acceptant une position centriste où le gouvernement équilibre des valeurs concurrentes par une régulation modérée"
  - "La liberté signifie que les communautés de gauche et de droite doivent vivre dans des territoires géographiques séparés avec leurs propres gouvernements indépendants"
  - "La liberté fonctionne en permettant aux citoyens de voter sur les valeurs qui devraient être imposées dans chaque région, en alternant entre politiques de gauche et de droite à chaque cycle électoral"
explanation: >-
  Le cours montre que dans un véritable régime de liberté, ceux qui adhèrent aux idéaux de gauche peuvent volontairement renoncer à des possessions, partager les moyens de production ou donner leurs salaires à des organisations redistributives. Ceux qui ont des valeurs de droite peuvent travailler dur, épargner et transmettre des valeurs familiales. Personne ne devrait imposer son mode de vie aux autres. C'est par la liberté du marché et le pouvoir du choix que les objectifs peuvent être atteints pacifiquement.
reviewed: false
