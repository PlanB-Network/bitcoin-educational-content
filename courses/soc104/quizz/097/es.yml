question: "¿Qué identifica el curso como la verdadera división política, más allá del espectro tradicional izquierda-derecha-centro?"
answer: "La división entre principios filosóficos fundamentales: libertad o coerción, consentimiento voluntario o compulsión, el individuo responsable o el colectivo"
wrong_answers:
  - "La división entre naciones ricas y pobres por el control de los acuerdos comerciales internacionales y las instituciones financieras globales"
  - "La división entre poblaciones urbanas y rurales por las prioridades de gasto público y la inversión en infraestructuras"
  - "La división entre culturas progresistas y tradicionales por normas sociales, valores familiares y educación religiosa"
explanation: >-
  El curso sostiene que la verdadera división política no reside en las etiquetas tradicionales de izquierda-derecha-centro, sino en principios filosóficos fundamentales: libertad o coerción, consentimiento voluntario o compulsión, el individuo responsable o el colectivo. La forma correcta de pensar sobre la política es partir de principios éticos en lugar de etiquetas.
reviewed: false
