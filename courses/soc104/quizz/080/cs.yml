question: "Co je konstruktivismus jako sdílené politické přesvědčení?"
answer: "Přesvědčení, že centrální vláda může silou zákona vytvořit společenský řád dobrý pro největší počet lidí"
wrong_answers:
  - "Přesvědčení, že společnost by měla být organizována dobrovolnou spoluprací mezi jednotlivci bez státního zasahování"
  - "Přesvědčení, že pouze volné trhy mohou určit optimální rozdělení zdrojů ve společnosti"
  - "Přesvědčení, že politická autorita by měla být rovnoměrně rozdělena mezi všechny občany prostřednictvím přímé demokracie"
explanation: >-
  Konstruktivismus spojuje centristy, konzervativce a socialisty kolem sdíleného přesvědčení: nadřazenosti politického procesu nad tržním procesem. Je to přesvědčení, že centrální vláda může silou zákona vytvořit společenský řád dobrý pro největší počet lidí. To stojí v přímém protikladu k libertariánské obraně spontánního řádu vznikajícího z dobrovolných interakcí.
