question: "Wie unterscheiden sich die konservative und die libertäre Position zum Mindestlohn in ihrer Begründung, obwohl beide seine Abschaffung befürworten?"
answer: "Konservative akzeptieren eine gewisse staatliche Beteiligung an der Lohnfestsetzung, sofern sie die Wettbewerbsfähigkeit nicht behindert, während Libertäre den Mindestlohn als moralischen Eingriff in die Freiheit sehen, einzustellen und Geschäfte zu tätigen"
wrong_answers:
  - "Konservative lehnen den Mindestlohn ab, weil er Inflation erzeugt, während Libertäre ihn ablehnen, weil er Gewerkschaften zu viel Macht gibt"
  - "Konservative wollen, dass Löhne von religiösen und gemeinschaftlichen Institutionen festgelegt werden, während Libertäre wollen, dass Löhne durch staatlich genehmigte Marktstudien bestimmt werden"
  - "Konservative glauben, Mindestlöhne sollten je nach Region variieren, während Libertäre glauben, ein einheitlicher Pauschallohn sollte landesweit gelten"
explanation: >-
  Beide befürworten eine Reduzierung oder Abschaffung des Mindestlohns, aber ihre Begründung unterscheidet sich grundlegend. Konservative akzeptieren eine gewisse staatliche Beteiligung an der Lohnfestsetzung, bestehen jedoch darauf, dass sie minimal und kontextabhängig bleibt, mit Fokus auf Wettbewerbsfähigkeit. Libertäre nehmen eine stärkere moralische Position ein: Ein Mindestlohn ist ein Eingriff in die Freiheit, einzustellen und Geschäfte zu tätigen. Wenn Libertäre "der Markt" sagen, meinen sie den Vertrag, der zwischen zwei Parteien ohne staatliche Einmischung frei ausgehandelt wird.
