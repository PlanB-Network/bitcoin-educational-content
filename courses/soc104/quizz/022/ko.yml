question: "문화적으로 보수적인 자유지상주의자는 자신이 도덕적으로 반대하는 행동을 어떻게 다루나요?"
answer: "그들은 설득과 모범을 통해 그런 행동에 반대하고 억제하지만, 법의 강제력에 의존하지는 않습니다"
wrong_answers:
  - "그들은 연방 차원의 금지에는 반대하면서, 그런 행동에 대한 지방정부의 금지는 지지합니다"
  - "그들은 어떤 형태의 반대 표명도 개인의 자유를 침해한다고 믿어, 그런 행동에 대해 완전히 침묵합니다"
  - "그들은 공식 법체계 밖에서 그런 행동을 처벌할 수 있는 공동체 재판소를 옹호합니다"
explanation: >-
  문화적으로 보수적인 자유지상주의자는 특정 행동을 도덕적으로 못마땅하게 여길 수 있지만, 합의에 기반하고 공격적이지 않은 행위의 법적 금지를 주장하지 않습니다. 그들은 그런 행위를 싫어하고, 반대하며, 적극적으로 억제할 수 있지만, 언제나 법의 강제력이 아니라 설득, 교육, 모범을 통해 그렇게 합니다. 이는 침묵을 지키거나 대안적 집행 메커니즘을 만드는 문제가 아닙니다.
reviewed: false
