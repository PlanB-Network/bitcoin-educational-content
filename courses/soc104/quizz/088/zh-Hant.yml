question: "Ludwig von Mises 寫道只有個人會思考、推理與行動時，他是什麼意思？"
answer: "像國家或民族這樣的集體，除了其個別成員的行動之外，沒有自身存在"
wrong_answers:
  - "個人應避免組成團體或協會，因為集體行動總是有害"
  - "只有某些有天賦的個人才有能力理性思考，而多數人只是遵循本能"
  - "思考與推理是私人活動，絕不應在公共場合分享或討論"
explanation: >-
  Mises 澄清，個人主義反對這種觀念：像社會或民族這樣的社會實體，可以獨立於構成它們的個人而存在。集體除了其個別成員的行動之外，沒有自身存在。我們無法有意義地談論國家或公司的行動，因為這些實體沒有自己的意志或思想，只能透過個人而行動。
reviewed: false
