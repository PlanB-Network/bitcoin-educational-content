question: "Jak kulturowo konserwatywny libertarianin podchodzi do zachowań, które moralnie potępia?"
answer: "Sprzeciwia się tym zachowaniom i zniechęca do nich poprzez perswazję i przykład, ale bez uciekania się do przymusowej siły prawa"
wrong_answers:
  - "Popiera lokalne rządowe zakazy tych zachowań, sprzeciwiając się jednocześnie zakazom na poziomie federalnym"
  - "Zachowuje całkowite milczenie wobec tych zachowań, wierząc, że każda forma dezaprobaty narusza wolność jednostki"
  - "Opowiada się za trybunałami wspólnotowymi, które mogą karać takie zachowania poza formalnym systemem prawnym"
explanation: >-
  Kulturowo konserwatywny libertarianin może moralnie potępiać pewne zachowania, ale nie opowiada się za prawnym zakazem dobrowolnych, nieagresywnych działań. Może nie lubić takich działań, sprzeciwiać się im i aktywnie do nich zniechęcać, ale zawsze poprzez perswazję, edukację i przykład, a nie poprzez przymusową siłę prawa. Nie chodzi tu o zachowywanie milczenia ani o tworzenie alternatywnych mechanizmów egzekwowania.
reviewed: false
