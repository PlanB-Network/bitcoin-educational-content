question: "Welk onderscheid maakte Karl Marx tussen utopisch socialisme en wetenschappelijk socialisme?"
answer: "Hij beschuldigde vroege Franse socialisten ervan denkbeeldige oplossingen voor te stellen, terwijl zijn wetenschappelijk socialisme was gegrond in historisch materialisme en klassenstrijd"
wrong_answers:
  - "Hij betoogde dat utopisch socialisme te veel op economie was gericht, terwijl wetenschappelijk socialisme culturele en artistieke transformatie prioriteit gaf"
  - "Hij prees utopische socialisten om hun praktische experimenten en bekritiseerde wetenschappelijk socialisme omdat het te abstract en theoretisch was"
  - "Hij beweerde dat utopisch socialisme gewelddadig en revolutionair was, terwijl wetenschappelijk socialisme vreedzame democratische hervorming verkoos"
explanation: >-
  Marx beschuldigde vroege Franse socialisten zoals Proudhon, Saint-Simon en Fourier ervan utopisten te zijn die louter denkbeeldige oplossingen voorstelden. Zijn wetenschappelijk socialisme rustte op historisch materialisme: het idee dat de geschiedenis voortschrijdt via klassenstrijd en de toe-eigening van de productiemiddelen, waarbij alle culturele voorstellingen worden geconditioneerd door productiekrachten en productieverhoudingen.
