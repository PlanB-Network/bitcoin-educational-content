question: "Hvilket skille trakk Karl Marx mellom utopisk sosialisme og vitenskapelig sosialisme?"
answer: "Han anklaget tidlige franske sosialister for å foreslå imaginære løsninger, mens hans vitenskapelige sosialisme var forankret i historisk materialisme og klassekamp"
wrong_answers:
  - "Han argumenterte for at utopisk sosialisme var for fokusert på økonomi, mens vitenskapelig sosialisme prioriterte kulturell og kunstnerisk transformasjon"
  - "Han roste utopiske sosialister for deres praktiske eksperimenter og kritiserte vitenskapelig sosialisme for å være for abstrakt og teoretisk"
  - "Han hevdet at utopisk sosialisme var voldelig og revolusjonær, mens vitenskapelig sosialisme favoriserte fredelig demokratisk reform"
explanation: >-
  Marx anklaget tidlige franske sosialister som Proudhon, Saint-Simon og Fourier for å være utopister som foreslo rent imaginære løsninger. Hans vitenskapelige sosialisme hvilte på historisk materialisme: ideen om at historien skrider fram gjennom klassekamp og tilegnelsen av produksjonsmidlene, der alle kulturelle representasjoner er betinget av produktivkrefter og produksjonsforhold.
