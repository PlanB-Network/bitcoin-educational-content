question: "Murray Rothbard විසින් theorized කළ non-aggression principle එක කුමක්ද?"
answer: "වෙනත් පුද්ගලයෙකුට හෝ ඔවුන්ගේ property වෙත physical force initiate කිරීම illegitimate වන අතර, defensive violence permitted වේ"
wrong_answers:
  - "self-defense සහ oppression ට resistance ඇතුළුව, violence හි සියලු forms සැමවිටම වැරදිය"
  - "violence oppressive institutions වෙත directed කරන විට acceptable නමුත්, අනෙකුත් individuals වෙත කිසි විටෙක නොවේ"
  - "force භාවිත කිරීමට legitimate right එක state එකට පමණක් ඇති අතර, individuals කිසි විටෙක violence වෙත යොමු නොවිය යුතුය"
explanation: >-
  Rothbardගේ non-aggression principle අනුව, වෙනත් පුද්ගලයෙකුට හෝ ඔවුන්ගේ property වෙත physical force initiate කිරීම illegitimate වේ. එය golden rule හි philosophical translation එකකි. කෙසේ වෙතත්, එය සියලු violence තහනම් නොකරයි: self-defense සහ oppression ට resistance ඇතුළුව defensive violence legitimate ලෙස සලකනු ලැබේ. මෙය එය pure pacifism වෙතින් සහ force මත state එක claim කරන monopoly එකෙන් වෙන් කරයි.
reviewed: false
