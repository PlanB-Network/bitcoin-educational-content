question: "classical despotism සහ totalitarianism අතර Hannah Arendtගේ ප්‍රධාන distinction එක කුමක්ද?"
answer: "Totalitarianism මිනිසුන් tyrannical rules වලට යටත් කිරීමෙන් පමණක් නොව, human beings independent action කිරීමට අසමත් කර, politics ම negate කරයි"
wrong_answers:
  - "Classical despotism economy පාලනය කරන අතර totalitarianism political සහ military institutions පමණක් පාලනය කරයි"
  - "Totalitarianism යනු despotism හි තවත් extreme version එකක් පමණක් වන අතර, repression හි scale එකෙන් පමණක් වෙනස් වේ"
  - "Classical despotism තම rule යුක්තිසහගත කිරීමට ideology භාවිත කරන අතර totalitarianism සම්පූර්ණයෙන් military force මත රඳා පවතී"
explanation: >-
  Arendt තර්ක කරන්නේ totalitarianism classical despotism වෙතින් මූලිකව වෙනස් බවයි. එය simply වඩාත් extreme tyranny එකක් නොව, human beings superfluous බවට පත් කරමින් independent action සඳහා ඔවුන්ගේ capacity විනාශ කරන system එකකි. Arendt සඳහා, politics යනු people එකකට තම destiny අතට ගැනීමට ඇති capacity එක වන අතර, totalitarianism මෙම capacity එකේම negation එකයි; එමඟින් එය despotism වෙතින් qualitatively වෙනස් වේ.
reviewed: false
