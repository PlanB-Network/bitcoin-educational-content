question: Hậu quả tiềm ẩn của việc sụt giảm giá trị đột ngột hoặc mất niềm tin vào một loại tiền tín dụng là gì?
answer: Lạm phát phi mã.
wrong_answers:
  - Lạm phát giảm.
  - Một nền kinh tế ổn định.
  - Sự tăng giá trị của đồng tiền.
explanation: |
  Hiện tượng giảm giá đột ngột hoặc mất niềm tin vào một loại tiền tín dụng có thể dẫn đến lạm phát phi mã. Đây là tình huống
  khi giá cả hàng hóa và dịch vụ tăng lên với tốc độ cực kỳ cao (trên 2 con số), thường dẫn đến sự bất ổn kinh tế.
reviewed: true
