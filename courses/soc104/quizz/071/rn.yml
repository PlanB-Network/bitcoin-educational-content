question: "Kubera iki ikibanza c'aba-libertarian ku kwemerera ibiyayuramutwe mu mategeko kizana igisabwa c'uko uruhara rwa Leta mu kibano rukwiye kugabanuka?"
answer: "Kuko ukworohereza kwigaruriwe na Leta kwosubiriza ukwishura kw'umuntu ku giti ciwe n'ukwitwararikwa gucungwa na Leta, mu gihe aba-libertarian bashaka ko abanyagihugu bishura ingaruka z'amahitamwo yabo bafashijwe n'amashirahamwe yigenga"
wrong_answers:
  - "Kuko ukwemerera kugenzurwa na Leta kwovyara amahera menshi cane y'amakori, bigatuma Leta ikomera cane kandi igatwarwa na ruswa"
  - "Kuko Leta yoshiraho ingingo z'ubuziranenge zotuma ibiciro biduga kandi zigasubira kurema amasoko yirabura"
  - "Kuko ugutunganya ibiyayuramutwe na Leta kworenga ku masezerano mpuzamakungu y'ubudandaji n'imigenderanire y'abadiplomate"
explanation: >-
  Aba-libertarian bashigikira ukworohereza amategeko ku biyayuramutwe ariko bagashimika ko uruhara rwa Leta rukwiye kugabanuka kuko intumbero yabo ari ugusubiza umuntu ku giti ciwe ukwishura ku vyo akora, atari ukwongereza ugucungera kwa Leta. Iyo umuntu abaye imbata y'ibiyayuramutwe, ategerezwa kuvyishura aho gusaba Leta ngo imwitwararike. Umuti w'ukuba imbata uri mu bwiyemezi bwigenga: infashanyo y'ubushake iva ku bantu ku giti cabo, imiryango, n'amashirahamwe y'abagiraneza. Ukwemerera gucungwa na Leta kwovuguruza ingingo ngenderwako shingiro y'aba-libertarian y'ukwishura kw'umuntu ku giti ciwe.
