question: "Icivugo ca Kant 'Sapere aude' gishishikariza abantu gukora iki?"
answer: "Gutinyuka kwiyumvira bo ubwabo no kuva mu gihe c'ubuto aho bisunga ubuyobozi bw'ububasha buri hejuru"
wrong_answers:
  - "Gukurikirana ubumenyi bw'amashure mu kwiyandikisha mu bigo vy'indero vyemewe no kuronka impapuro z'ubumenyi"
  - "Guhangana n'ubwoko bwose bw'imico runtu no kurema sisitemu nshasha rwose z'imico zishingiye ku cipfuzo c'umuntu"
  - "Kurondera ubukerebutsi biciye mu kwihebera idini no kugamburukira inyigisho z'ishengero"
explanation: >-
  Sapere aude, bisobanura "Tinyuka kwiyumvira wewe ubwawe," Kant yabikuye ku musizi Horace maze abigira icivugo c'Enlightenment. Bishushanya kuva mu buto, ni ukuvuga igihe abantu baba badashoboye gukoresha ugutahura kwabo ata buyobozi bw'umugwi canke ububasha buri hejuru. Kant ashishikariza ukwibohora no kwemera inshingano zuzuye z'ukwiyumvira kwawe bwite.
