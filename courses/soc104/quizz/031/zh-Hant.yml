question: "libertaires 與自由意志主義者在廢除國家的策略上有何不同？"
answer: "libertaires 歷來主張以暴力摧毀國家，而自由意志主義者則試圖透過教育與公民不服從使國家喪失正當性"
wrong_answers:
  - "libertaires 利用民主選舉來拆解國家，而自由意志主義者偏好武裝革命與直接行動"
  - "libertaires 專注於建立替代性社群，而自由意志主義者在既有政治體制內推動改革"
  - "libertaires 與自由意志主義者都同意，和平抗議是社會轉型唯一正當的手段"
explanation: >-
  libertaires 歷來主張透過暴力摧毀國家與資本主義，包括恐怖行動與定點攻擊。相較之下，自由意志主義者拒絕將侵略性暴力視為正當。他們的策略建立在透過論證、辯論、教育與公民不服從使國家喪失正當性。這些根本不同的變革方式，反映出他們更深層的哲學分歧。
reviewed: false
