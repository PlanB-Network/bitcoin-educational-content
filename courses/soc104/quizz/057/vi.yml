question: "Các giá trị cốt yếu của chủ nghĩa trung dung là gì?"
answer: "Ôn hòa, thỏa hiệp, thích nghi và lợi ích công"
wrong_answers:
  - "Truyền thống, trật tự, quyền uy và bản sắc quốc gia"
  - "Tự do, tài sản tư nhân, đồng thuận và trách nhiệm cá nhân"
  - "Bình đẳng, công bằng xã hội, đoàn kết và sở hữu tập thể"
explanation: >-
  Các giá trị cốt yếu của chủ nghĩa trung dung là ôn hòa, thỏa hiệp, thích nghi và lợi ích công. Chúng phản ánh sự nhấn mạnh của những người trung dung vào cân bằng thực dụng hơn là cam kết hệ tư tưởng. Các lựa chọn khác lần lượt mô tả các giá trị cốt yếu của chủ nghĩa bảo thủ, chủ nghĩa libertarian và chủ nghĩa xã hội.
