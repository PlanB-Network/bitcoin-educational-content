question: "Что курс определяет как настоящий политический раскол, лежащий за пределами традиционного спектра левых, правых и центра?"
answer: "Раскол между фундаментальными философскими принципами: свобода или принуждение, добровольное согласие или понуждение, ответственный индивид или коллектив"
wrong_answers:
  - "Раскол между богатыми и бедными странами из-за контроля над международными торговыми соглашениями и глобальными финансовыми институтами"
  - "Раскол между городским и сельским населением из-за приоритетов государственных расходов и инвестиций в инфраструктуру"
  - "Раскол между прогрессивными и традиционными культурами из-за социальных норм, семейных ценностей и религиозного образования"
explanation: >-
  Курс утверждает, что настоящий политический раскол проходит не по традиционным ярлыкам левых, правых и центра, а по фундаментальным философским принципам: свобода или принуждение, добровольное согласие или понуждение, ответственный индивид или коллектив. Правильный способ думать о политике — исходить из этических принципов, а не из ярлыков.
