question: "Jak souvisí rozlišení Karla Poppera mezi otevřenými a uzavřenými společnostmi s debatou individualismu versus kolektivismu?"
answer: "Otevřená společnost uznává právo jednotlivce soudit sám za sebe prostřednictvím osobních rozhodnutí, zatímco uzavřená společnost je kolektivistická, spočívá na kmenové mentalitě a odmítání kritické svobody"
wrong_answers:
  - "Otevřená společnost je taková, která umožňuje volný obchod přes národní hranice, zatímco uzavřená společnost zavádí cla a protekcionistické ekonomické politiky"
  - "Otevřená společnost je řízena přímou demokracií, kde hlasuje každý občan, zatímco uzavřené společnosti vládne jediný dědičný monarcha"
  - "Otevřená společnost zveřejňuje všechny vládní dokumenty transparentně, zatímco uzavřená společnost klasifikuje informace jako státní tajemství"
explanation: >-
  Popper definoval uzavřenou společnost jako magickou nebo kmenovou společnost a otevřenou společnost jako takovou, v níž jsou jednotlivci konfrontováni s osobními rozhodnutími. Uzavřená společnost je kolektivistická, spočívá na kmenové mentalitě s odmítáním kritické svobody a idealizací statického řádu. Otevřená společnost dává primát svobodné volbě hodnot, přesvědčení a vztahů, čímž přímo ztělesňuje individualistické principy.
