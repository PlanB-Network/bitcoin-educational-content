question: The chapter's full-adder combines the carry bits of its two half-adders with logical OR rather than with XOR or a third adder stage. Why is a plain OR sufficient to produce the correct carry-out?
answer: Because for any input, at most one of the two half-adders can produce a carry, so OR merges two mutually exclusive carry cases exactly.
wrong_answers:
  - Because the two carry bits must themselves be added together, and OR is how single-bit binary addition is implemented in Simplicity.
  - Because after the case-based branching, OR is the only binary Boolean operator whose type still matches the remaining environment.
  - Because OR over-approximates the carry, and any spurious extra carry values are discarded by the final I I H projection afterwards.
explanation: >-
  If the first half-adder carries, both of its input bits were 1, so its
  sum bit is 0 — and a half-adder fed a 0 can never carry. The two carry
  bits are therefore never simultaneously 1, and OR merges them exactly
  (on the reachable inputs it even coincides with XOR). This mutual
  exclusivity is precisely what makes the two-half-adder decomposition of
  a full-adder correct.
reviewed: false
