question: Simplicity 的类型系统如何表示可变长度缓冲区？
answer: 作为嵌套的 option 类型乘积，每一层标记一个二的幂大小的块。
wrong_answers:
  - 使用一种直接内置于语言中的特殊动态数组类型。
  - 通过在每次函数调用时变大的递归和类型。
  - 作为固定大小向量，并用尾随零值填充。
explanation: >-
  缓冲区使用嵌套的 option 类型。例如，Xᑉ⁸ 展开为
  (1 + X⁴) × ((1 + X²) × (1 + X))，作为多项式得到
  1 + X + X² + ... + X⁷——表示包含 0 到 7 个元素的集合。
  每个 option 层表示一个二的幂大小的块是否存在，
  实际上以二进制编码长度。
