question: "¿Qué terreno común comparten los libertarios y los conservadores, y qué los divide?"
answer: "Comparten el apego al gobierno limitado y el rechazo del igualitarismo forzado, pero discrepan sobre el intervencionismo militar y las políticas sociales"
wrong_answers:
  - "Comparten el apoyo a políticas comerciales proteccionistas y a la defensa nacional, pero discrepan sobre el papel de la religión en la vida pública"
  - "Comparten un compromiso con la tributación progresiva y los programas de bienestar, pero discrepan sobre la política migratoria"
  - "Comparten la oposición al libre comercio y a la legalización de las drogas, pero discrepan sobre el tamaño del gobierno federal"
explanation: >-
  Libertarios y conservadores defienden ambos el gobierno limitado, rechazan el igualitarismo forzado, se oponen a la deuda pública y defienden los derechos de los estados. Sin embargo, los libertarios rechazan el intervencionismo militar de los neoconservadores, se oponen a las políticas sociales conservadoras y a los subsidios, condenan la prohibición de las drogas y rechazan el proteccionismo. La alianza es real, pero inherentemente tensa.
