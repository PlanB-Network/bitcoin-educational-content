question:  Ni kuki ubunini bwa UTXO set bukunda kwiyongera mu buryo busanzwe uko igihe kigenda?
answer:  Kuri buri payment akenshi havuka UTXO zibiri nshasha .
wrong_answers:
  - Payments zisanzwe ntizikoresha UTXO nk’input
  - Buri Fork igwiza igitigiri c'ama UTXO ariho .
  -Igitigiri c'ama bitcoins ashobora kuremwa nta n'iherezo .
explanation: |
  Igikorwa kijanye n’ukwishura gifata UTXO imwe kandi kenshi kigasubira kurema zibiri (ukwishura + Exchange), kigatuma ubunini bwose bw’ivyo bikoresho butera imbere.
reviewed: true
