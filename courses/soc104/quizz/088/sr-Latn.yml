question: "Zašto Popper tvrdi da otvoreno društvo ostaje inherentno krhko uprkos svojim prednostima?"
answer: "Zato što odgovornost koju individualizam podrazumeva može delovati zastrašujuće, stvarajući iskušenje da se potraži utočište u zajedničkoj zaštiti, autoritetu ili nostalgiji za idealizovanom prošlošću"
wrong_answers:
  - "Zato što otvorena društva nemaju vojnu snagu i ne mogu se braniti od invazije zatvorenih društava"
  - "Zato što su demokratske institucije inherentno neefikasne i na kraju se urušavaju pod teretom birokratske složenosti"
  - "Zato što otvorena društva dopuštaju preveliku ekonomsku nejednakost, što neizbežno vodi revoluciji i uspostavljanju autoritarnih režima"
explanation: >-
  Popper naglašava da krhkost otvorenog društva potiče iz psihološke ranjivosti. Odgovornost koju individualizam podrazumeva može delovati zastrašujuće i rizično zato što čovek mora donositi sopstvene izbore i može pogrešiti. To stvara iskušenje da se potraži utočište u zajedničkoj zaštiti ili nostalgičnim težnjama ka idealizovanoj prošlosti. Otvoreno društvo suočava se sa stalnim izazovima komunitarnih impulsa i ponavljajućim iskušenjem nasilja.
