question: "為什麼 Failure 副作用在 Simplicity 中是可交換的，即使例外通常並不可交換？"
answer: 因為例外的型別是單位型別（1），只有一個值，所以拋出的順序並不重要。
wrong_answers:
  - 因為 Simplicity 是依照組合子樹所定義的確定性順序來執行所有運算式。
  - 因為 Failure 副作用總是會被 case 組合子捕捉並接著重新拋出。
  - 因為 Simplicity 使用批次驗證，這使得所有被拋出的例外都等價。
explanation: >-
  一般而言，例外並不可交換，因為不同的運算式可能拋出不同的例外值。然而，Simplicity 將例外限制為單位型別（只有一個可能的值），因此交換兩個可能失敗的運算式的順序，無論實際上是哪一個失敗，都會產生相同的例外。這種可交換性使得重要的程式最佳化成為可能。
reviewed: true
