question: "How does democracy undermine itself politically?"
answer: "The openness democracy requires produces scrutiny that threatens the ruling minority, which then stifles that openness to stay in power."
wrong_answers:
  - "Voters abolish elections as soon as they are prosperous."
  - "Openness attracts foreign invasions."
  - "Parliaments pass laws faster than they can be printed."
explanation: |
  Democracy's values — openness, transparency, power to the ruled — are exactly contrary to the ruling minority's survival. The current campaign to control social media, the first mass vehicle of political scrutiny, is the mechanism playing out in real time.
reviewed: false
