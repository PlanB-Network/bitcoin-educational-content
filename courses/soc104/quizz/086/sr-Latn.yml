question: "Koje je ključno neslaganje između libertarijanaca i drugih političkih porodica kada dele iste ciljeve?"
answer: "Neslaganje je oko sredstava: libertarijanci odbacuju prinudna rešenja i daju prednost dobrovoljnoj razmeni kroz tržišni proces"
wrong_answers:
  - "Neslaganje je oko ciljeva: libertarijanci teže različitim ciljevima, kao što je individualno bogatstvo umesto društvenog blagostanja"
  - "Neslaganje je oko vremena: libertarijanci žele da iste ciljeve postignu sporije, kroz postepenu reformu"
  - "Neslaganje je oko obima: libertarijanci žele da iste politike primenjuju samo na lokalnom, a ne na nacionalnom nivou"
explanation: >-
  Libertarijanci se mogu slagati sa socijalistima, konzervativcima i centristima oko određenih ciljeva, kao što su odbrana potlačenih ili promovisanje društvene kohezije. Neslaganje ne leži u ciljevima, već u sredstvima. Libertarijanci odbacuju sva prinudna rešenja koja nastoje da uniformišu prakse i propise, umesto toga braneći moć izbora i odgovornu slobodu kroz slobodnu, decentralizovanu razmenu zasnovanu na dobrovoljnim ugovorima.
