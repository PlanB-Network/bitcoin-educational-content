question: Condillacගේ න්‍යාය නිදහස් වෙළඳාමේ මූලධර්මයට සැලකිය යුතු සහය ලබා දෙන්නේ ඇයි?
answer: වෙළඳාම සැමවිටම දෙපාර්ශ්වයටම ප්‍රයෝජනවත් නම්, රේගු මගින් එය සීමා කිරීම හෝ තහනම් කිරීමේ අර්ථයක් නැති බැවින්
wrong_answers:
  - Condillac ගණනය කිරීමෙන් නිදහස් වෙළඳාම ආරක්ෂණවාදයට වඩා ජාතියක් වැඩියෙන් පොහොසත් කරන බව පෙන්වූ බැවින්
  - Condillac නිදහස් වෙළඳාම සාමයට හොඳ බව ඔප්පු කළ බැවින්
  - Condillac Adam Smithගේ මිතුරෙකු වූ බැවින්
explanation: |
  Condillacගේ න්‍යාය පවසන්නේ හුවමාරුව දෙපාර්ශ්වයටම ප්‍රයෝජනවත් බවයි, මන්ද සෑම පාර්ශ්වයක්ම තමන් අඩුවෙන් වටිනාකමක් දෙන දෙය අත්හැර තමන් වැඩියෙන් වටිනාකමක් දෙන දෙය ලබා ගනී. එබැවින් රේගු හෝ වෙනත් සීමා කිරීම් මගින් වෙළඳාම සීමා කිරීම හෝ තහනම් කිරීම අවශ්‍ය නොවේ.