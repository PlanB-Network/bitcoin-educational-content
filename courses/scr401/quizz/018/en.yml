question: How are variable-length buffers represented in Simplicity's type system?
answer: As nested products of option types, where each option layer represents the presence or absence of a power-of-two sized block.
wrong_answers:
  - Using a special dynamic array type built into the language.
  - Through recursive sum types that grow on each function call.
  - As fixed-size vectors padded with zero values.
explanation: >-
  Buffers use nested option types. For example, Xᑉ⁸ expands to
  (1 + X⁴) × ((1 + X²) × (1 + X)), which as a polynomial yields
  1 + X + X² + ... + X⁷ — representing collections of 0 to 7 elements.
  Each option layer indicates whether a power-of-two block is present,
  effectively encoding the length in binary.
