question: 为什么 'case' 组合子的签名中包含一个共享环境类型 C？
answer: 这样两个分支就都能在带标签的输入之外读取共享的上下文数据。
wrong_answers:
  - 为了限制输入大小，以防止栈溢出。
  - 为了允许两个分支之间来回递归调用。
  - 为了存储链中前一个组合子的输出。
explanation: >-
  case 组合子的签名是 (A + B) × C ⊢ D。额外的类型 C
  充当共享环境，左分支 (f : A × C ⊢ D)
  和右分支 (g : B × C ⊢ D) 都可以访问它。这比简单的
  if-then-else 更强大，因为各分支既接收自己的特定数据，
  也接收计算所需的上下文信息。
