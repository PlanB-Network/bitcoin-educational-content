question: "Lập trường xã hội chủ nghĩa về chăm sóc y tế là gì?"
answer: "Tiếp cận chăm sóc y tế là một quyền cơ bản, và nhà nước phải bảo đảm một hệ thống phổ quát, được tài trợ công cho mọi người bất kể thu nhập"
wrong_answers:
  - "Chăm sóc y tế nên là một hệ thống hỗn hợp với bảo hiểm cơ bản của nhà nước được bổ sung bởi các lựa chọn bảo hiểm tư nhân"
  - "Thị trường tư nhân cung cấp chăm sóc y tế đổi mới hơn, vì vậy các cá nhân nên tự do chọn hệ thống của riêng mình"
  - "Nhà nước chỉ nên cung cấp chăm sóc y tế cho những công dân nghèo nhất, trong khi bảo hiểm tư nhân bao phủ tất cả những người còn lại"
explanation: >-
  Với những người xã hội chủ nghĩa, tiếp cận chăm sóc y tế là một quyền cơ bản, không phải một hàng hóa. Nhà nước phải bảo đảm một hệ thống chăm sóc y tế phổ quát, được tài trợ công, để mọi người đều có quyền tiếp cận chăm sóc bất kể thu nhập. Điều này phản ánh mối quan tâm xã hội chủ nghĩa đối với bình đẳng, công bằng xã hội, và tầm quan trọng của nhà nước trong việc tổ chức dịch vụ vì lợi ích chung. Hệ thống hỗn hợp mô tả quan điểm trung dung, trong khi các cách tiếp cận dựa trên lựa chọn phản ánh các lập trường tự do cá nhân và bảo thủ.
