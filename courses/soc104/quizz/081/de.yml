question: "Was ist Konstruktivismus als gemeinsame politische Überzeugung?"
answer: "Der Glaube, dass eine Zentralregierung kraft Gesetzes eine soziale Ordnung schaffen kann, die für die größte Zahl gut ist"
wrong_answers:
  - "Der Glaube, dass die Gesellschaft durch freiwillige Zusammenarbeit zwischen Individuen ohne staatliche Einmischung organisiert werden sollte"
  - "Der Glaube, dass nur freie Märkte die optimale Verteilung von Ressourcen in der Gesellschaft bestimmen können"
  - "Der Glaube, dass politische Autorität durch direkte Demokratie gleichmäßig unter allen Bürgern verteilt werden sollte"
explanation: >-
  Konstruktivismus vereint Zentristen, Konservative und Sozialisten um eine gemeinsame Überzeugung: die Überlegenheit des politischen Prozesses gegenüber dem Marktprozess. Es ist der Glaube, dass eine Zentralregierung kraft Gesetzes eine für die größte Zahl gute soziale Ordnung schaffen kann. Dies steht in direktem Gegensatz zur libertären Verteidigung der spontanen Ordnung, die aus freiwilligen Interaktionen entsteht.
