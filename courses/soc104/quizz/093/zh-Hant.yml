question: "Bitcoin 挑戰了福利國家的哪三大支柱？"
answer: "財政系統、透過債務為支出融資的貨幣壟斷，以及為了防止使用替代貨幣而進行的交易監控"
wrong_answers:
  - "軍事預算、公共教育系統，以及由政府控制的醫療基礎設施"
  - "司法系統、立法程序，以及行政部門對企業法規的執行"
  - "社會保障制度、最低工資立法，以及累進所得稅結構"
explanation: >-
  Bitcoin 挑戰了福利國家賴以立足的三大支柱。第一，是不足以覆蓋支出的財政系統。第二，是貨幣壟斷，也就是發行貨幣以透過債務為支出融資的能力。第三，是交易監控，也就是阻止人們使用國家強加的法定貨幣以外任何貨幣的能力。Bitcoin 同時削弱了這三者。
reviewed: false
