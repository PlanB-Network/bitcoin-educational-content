question: "cultural conservatism යනු කුමක්ද?"
answer: "අතීතයෙන් උරුම වූ පවුල්, සදාචාරික, aesthetic, සහ metaphysical වටිනාකම් වෙත පුද්ගලික අනුගත වීමක්, political philosophy එකක් නොවේ"
wrong_answers:
  - "legislation හරහා සම්ප්‍රදායික වටිනාකම් සමස්ත සමාජය මත පැනවීමට state power භාවිත කරන political ideology එකක්"
  - "modernity හි සියලු ආකාර ප්‍රතික්ෂේප කර සමාජය pre-industrial ජීවන රටාවකට ආපසු ගෙන යාමට උත්සාහ කරන movement එකක්"
  - "ජාතික කර්මාන්ත ආරක්ෂා කර foreign countries සමඟ free trade වලට විරුද්ධ වන economic doctrine එකක්"
explanation: >-
  Cultural conservatism ජීවිතයේ ප්‍රඥාවක් ලෙස නිර්වචනය වේ: Greco-Roman හෝ Judeo-Christian වේවා, අතීතයෙන් උරුම වූ පවුල්, සදාචාරික, aesthetic, සහ metaphysical වටිනාකම් වෙත පුද්ගලික අනුගත වීම. එය political philosophy එකක් නොවන බව පැහැදිලිව කියයි. එය state power හරහා දේශපාලන ආයතන සහ සමාජ පිළිවෙළ රැක ගැනීමට අරමුණු කරන political conservatism වෙතින් වෙනස් වේ. එය modernity ප්‍රතික්ෂේප කිරීම හෝ economic protectionism පිළිබඳද නොවේ.
reviewed: false
