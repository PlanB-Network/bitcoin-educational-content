question: "Uhifadhi wa kisiasa ni nini?"
answer: "Itikadi inayolenga kuhifadhi taasisi za kisiasa zilizopo na mpangilio wa kijamii, ikipinga mtikisiko mkubwa wa kimuundo"
wrong_answers:
  - "Ahadi binafsi kwa thamani za jadi za familia na mazoea ya kidini bila kutafuta kuwalazimisha wengine kuzifuata"
  - "Falsafa inayokuza mabadiliko ya haraka ya kijamii kupitia mageuzi ya kidemokrasia na sheria za kimaendeleo"
  - "Nadharia ya kiuchumi inayotetea masoko huru, kodi ndogo, na kufutwa kwa vizuizi vya biashara"
explanation: >-
  Uhifadhi wa kisiasa ni itikadi, mara nyingi ikiwakilishwa katika vyama vya mrengo wa kulia au mrengo wa kulia uliokithiri, inayolenga kuhifadhi taasisi za kisiasa zilizopo na mpangilio wa kijamii huku ikipinga mtikisiko mkubwa wa kimuundo. Wafuasi wake hutaka kutumia madaraka na sheria kulinda urithi wao. Hili linatofautiana na uhifadhi wa kitamaduni, ambao ni chaguo binafsi la maisha badala ya programu ya kisiasa.
