question: در زمان خرج کردن، یک شاخهٔ case هرس می‌شود. اعتبارسنج چگونه همچنان می‌تواند برنامهٔ آشکارشده را با CMR تعهدشده تطبیق دهد؟
answer: CMR یک ریشهٔ Merkle است، پس خرج‌کننده فقط CMR شاخهٔ هرس‌شده را فراهم می‌کند و اعتبارسنج آن را برای بازمحاسبهٔ ریشه در محاسبه ادغام می‌کند.
wrong_answers:
  - اعتبارسنج فقط از شاخهٔ اجراشده استفاده می‌کند، چون شاخه‌های اجرا‌نشدهٔ case هرگز در CMR نبودند.
  - شاخه‌های هرس‌شده به یک جانگهدار استاندارد تبدیل می‌شوند که CMR ثابتش هنگام بازمحاسبهٔ ریشه جایگزین می‌شود.
  - کد کاملِ شاخهٔ هرس‌شده در شاهد می‌ماند، جایی که اعتبارسنج آن را هش می‌کند اما اجرا نمی‌کند.
explanation: >-
  CMR عبارت case f g یک هش برچسب‌خورده روی CMRهای هر دو فرزند است، بنابراین هر
  شاخه — اجراشده یا نه — در زمان آدرس‌دهی تعهد شده است. چون ساختار یک درخت Merkle
  است، یک شاخهٔ هرس‌شده را می‌توان فقط با CMR سی‌ودو‌بایتی آن خلاصه کرد: اعتبارسنج
  آن هش را در محاسبهٔ بازگشتی وارد می‌کند و بررسی می‌کند که ریشه با تعهد UTXO
  منطبق باشد، بی‌آنکه هرگز کد هرس‌شده را ببیند. دقیقاً به همین دلیل از ریشهٔ
  Merkle برای تعهد استفاده می‌شود، و به همین دلیل هیچ عبارت شاهد داخل شاخهٔ
  هرس‌شده روی زنجیره ظاهر نمی‌شود.
reviewed: false
