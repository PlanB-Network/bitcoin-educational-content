question: "구조적 접근은 사회주의와 리버테리언주의의 근본적 차이를 어떻게 정의하나요?"
answer: "사회주의는 규제, 계획, 통제를 통해 국가에 우선권을 주는 반면, 리버테리언주의는 최소한의 국가 개입을 통해 개인에 우선권을 줍니다"
wrong_answers:
  - "사회주의는 농촌 농업 공동체를 우선시하는 반면, 리버테리언주의는 도시 산업 발전을 선호합니다"
  - "사회주의는 민주적 선거 지지로 정의되는 반면, 리버테리언주의는 모든 형태의 정치 참여를 거부합니다"
  - "사회주의는 외교 정책과 국제 협력에 집중하는 반면, 리버테리언주의는 국내 경제 문제에만 관심을 둡니다"
explanation: >-
  구조적으로 사회주의는 규제하고, 계획하고, 통제하는 국가의 편재성으로 특징지어집니다. 리버테리언주의는 경제와 사생활에서 최소한의 국가 개입으로 정의되며, 개인의 자유와 자유시장의 우선성으로 향합니다. 이 구조적 구분은 각 시스템의 표방된 의도를 비교하는 것보다 분석적으로 훨씬 더 유용합니다.
