question: "Cum definește abordarea structurală diferența fundamentală dintre socialism și libertarianism?"
answer: "Socialismul acordă primat statului prin reglementare, planificare și control, în timp ce libertarianismul acordă primat individului prin intervenție minimă a statului"
wrong_answers:
  - "Socialismul prioritizează comunitățile agricole rurale, în timp ce libertarianismul favorizează dezvoltarea industrială urbană"
  - "Socialismul este definit prin susținerea alegerilor democratice, în timp ce libertarianismul respinge toate formele de participare politică"
  - "Socialismul se concentrează pe politica externă și cooperarea internațională, în timp ce libertarianismul este preocupat doar de chestiuni economice interne"
explanation: >-
  Structural, socialismul este caracterizat de omniprezența statului, care reglementează, planifică și controlează. Libertarianismul este definit prin intervenția minimă a statului în economie și în viața privată, tinzând către primatul libertății individuale și al pieței libere. Această distincție structurală este mult mai utilă analitic decât compararea intențiilor declarate ale fiecărui sistem.
