question: "政治体制の構造的定義は何に注目しますか？"
answer: "その体制が実際にどのように機能しているか、また国家統制の程度など観察可能な特徴"
wrong_answers:
  - "その体制の創設者や指導者が表明した目標と高尚な意図"
  - "政治運動の歴史的起源と、その主要思想家たちの伝記"
  - "認められている政党の数と、民主的選挙が行われる頻度"
explanation: >-
  構造的定義は、政治体制が実際にどのように機能しているか、またその観察可能な特徴に注目する。たとえば、社会主義は構造的には国家の遍在によって特徴づけられる。このアプローチは、表明された動機や目標に依拠する意図的定義とは対照的である。構造的アプローチにより、測定可能な結果に基づくより客観的な評価が可能になる。
reviewed: false
