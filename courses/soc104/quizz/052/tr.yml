question: "George W. Bush'un 2008 finansal krizine verdiği yanıt, muhafazakâr ilkelerin 'sorunlu esnekliğini' nasıl gösterir?"
answer: "Büyük bankaları kurtarmak için serbest piyasa ilkelerini terk etti ve devletin ulusal ekonomik istikrarın nihai garantörü olduğuna dair muhafazakâr görüşü açığa çıkardı"
wrong_answers:
  - "Tüm devlet müdahalelerini reddetti ve sonuçları ne olursa olsun serbest piyasa ideolojisine sıkı sıkıya bağlı kalarak bankaların batmasına izin verdi"
  - "Bankacılık sektörünü kalıcı olarak kamulaştırdı ve artan oranlı vergilendirmeyi getirerek muhafazakârlıktan demokratik sosyalizme geçti"
  - "Piyasanın kendini düzeltmesine izin vermek için tüm kamu harcamalarını keserek ve finansal düzenlemeleri kaldırarak yanıt verdi"
explanation: >-
  Bush, büyük bankaları kurtarmak için müdahale ederek 'serbest piyasa sistemini kurtarmak adına serbest piyasa ilkelerini terk ettiğini' ilan etti. Bu, muhafazakârların soyut piyasa ilkelerinin üzerinde ulusun gücüne ve sürekliliğine öncelik verebildiğini gösterir. Aynı esnek mantık, Trump'ın ulusal çıkar adına izlenen ve korporatizmi ile ahbap-çavuş kapitalizmini besleme riski taşıyan korumacı ticaret politikalarında da görülür.
