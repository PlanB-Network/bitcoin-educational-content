question: Ktorá myšlienka sa v L'Ami des Hommes NENACHÁDZA?
answer: Manufaktúry chradnú, pretože ich vytláča poľnohospodárstvo
wrong_answers:
  - Národy majú harmonické záujmy
  - Obchod má byť slobodný medzi všetkými národmi
  - Obyvateľstvo je skutočným zdrojom bohatstva národa
explanation: |
  L'Ami des Hommes vyzdvihuje poľnohospodárstvo, obhajuje slobodný obchod a tvrdí, že bohatstvo národa tvorí obyvateľstvo. Netvrdí však, že poľnohospodárstvo vytláča manufaktúry. Mirabeau vidí v poľnohospodárstve zdroj skutočného bohatstva, nie súpera priemyslu.
