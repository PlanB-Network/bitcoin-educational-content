question: "左右の政治的対立軸はどこに由来しますか？"
answer: "1789年のフランス革命の討論における座席配置に由来する"
wrong_answers:
  - "19世紀のカール・マルクスとアダム・スミスの著作に由来する"
  - "北部諸州と南部諸州の間で起きたアメリカ南北戦争に由来する"
  - "理性を伝統から切り離した啓蒙思想家たちに由来する"
explanation: >-
  左右の区分は1789年にさかのぼります。当時、フランス国民議会で国王の権力維持を支持する代議士たちは議長の右側に座り、国王の権力を制限したい代議士たちは左側に座りました。それはマルクスとスミス、アメリカ南北戦争、あるいは啓蒙思想に由来するものではありません。
reviewed: false
