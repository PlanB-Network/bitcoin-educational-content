question: "¿Cómo trata el conservadurismo las libertades en las esferas económica y social?"
answer: "Libertades fuertes en la esfera económica, pero libertades débiles en la esfera social"
wrong_answers:
  - "Libertades débiles tanto en la esfera económica como en la social para mantener el orden social tradicional"
  - "Libertades fuertes en la esfera social, pero libertades débiles en la esfera económica"
  - "Libertades iguales e ilimitadas en ambas esferas con una intervención gubernamental mínima de cualquier tipo"
explanation: >-
  El conservadurismo exhibe una dicotomía que es la imagen especular del socialismo. En el ámbito económico, los conservadores defienden el libre mercado, el emprendimiento y la propiedad privada. En el ámbito social, las restricciones se justifican por la preservación de las normas morales tradicionales y la estabilidad social. La tercera respuesta incorrecta describe el patrón socialista, que es lo opuesto.
