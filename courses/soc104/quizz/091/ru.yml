question: "Какое сообщение Сатоши Накамото встроил в самый первый добытый блок Bitcoin?"
answer: "Заголовок из лондонской The Times о канцлере на грани второго спасения банков"
wrong_answers:
  - "Цитату Фридриха Хайека об опасностях центрального планирования и государственного контроля над деньгами"
  - "Декларацию независимости от всех форм государственного управления и финансового регулирования во всём мире"
  - "Математическое доказательство того, что децентрализованная валюта эффективнее фиатных денег"
explanation: >-
  В генезис-блок Сатоши Накамото вставил символический заголовок из лондонской The Times: "The Times 03/Jan/2009 Chancellor on the brink of a second bank bailout." Это была прямая отсылка к финансовому кризису 2008 года и последовавшему за ним денежному интервенционизму, делавшая замысел Bitcoin безошибочно ясным: быть альтернативой централизованным банковским системам.
reviewed: false
