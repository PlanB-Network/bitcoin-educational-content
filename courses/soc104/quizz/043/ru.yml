question: "Что означает термин «холизм» в контексте социалистической философии?"
answer: "Видение общества как неделимого целого, где коллектив имеет первенство над индивидом"
wrong_answers:
  - "Философия, рассматривающая каждого индивида как самодостаточную единицу, чьи права не могут быть отменены никакой группой"
  - "Экономическая теория, выступающая за равновесие между государственным и частным секторами в равной мере"
  - "Политическая стратегия, которая объединяет все точки зрения меньшинств в единую платформу на основе консенсуса"
explanation: >-
  Холизм происходит от греческого 'holos', означающего 'целое'. В социалистической мысли он обозначает видение общества как неделимого целого, а не простой суммы индивидов. Социалистическое государство стремится максимально взять человеческую деятельность под своё ведение и направлять её. Этот коллектив может быть представлен как социальный класс, нация, раса или гендер, но в каждом случае индивид определяется принадлежностью к группе.
reviewed: false
