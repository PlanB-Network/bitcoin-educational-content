question: "Vad betyder termen 'liberal' i den europeiska politiska traditionen?"
answer: "En anhängare av laissez-faire-ekonomi, minskad statlig intervention och individuella friheter"
wrong_answers:
  - "En förespråkare för statlig intervention, offentlig sjukförsäkring och program mot fattigdom"
  - "En radikal anarkist som eftersträvar ett fullständigt avskaffande av staten och privat egendom"
  - "En centrist som balanserar socialistiska och konservativa ståndpunkter lika i alla politikområden"
explanation: >-
  I Europa har liberalism fortsatt att förknippas med laissez-faire-ekonomisk politik, minskad statlig intervention och försvar av individuella friheter. Det första felaktiga svaret beskriver amerikanska liberaler, som har förskjutit termens betydelse mot interventionism. Europeisk liberalism är varken anarkism eller centrism.
reviewed: false
