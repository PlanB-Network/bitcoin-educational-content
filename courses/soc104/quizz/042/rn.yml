question: "Ijambo 'holism' risigura iki mu ciyumviro ca sosiyaliste?"
answer: "Ukubona ikibano nk'ikintu kimwe kitagabanyika aho umugwi rusangi ufise ubukuru ku muntu ku giti ciwe"
wrong_answers:
  - "Ubufilosofi bufata umuntu wese nk'ikintu cikwiye ukwaco, gifise uburenganzira budashobora guhonyangwa n'umugwi uwo ari wo wose"
  - "Inyigisho y'ubutunzi ishigikira kuringaniza inzego za Leta n'iz'abikorera ku rugero rungana"
  - "Ingamba ya politike yinjiza ivyiyumviro vyose vy'imigwi mito mu rubuga rumwe rushingiye ku mwumvikano"
explanation: >-
  Holism iva mw'ijambo ry'Ikigiriki 'holos' risigura 'ikintu cose.' Mu ciyumviro ca sosiyaliste, ryerekeza ku kubona ikibano nk'ikintu kimwe kitagabanyika aho kuba igiteranyo gisanzwe c'abantu ku giti cabo. Leta ya sosiyaliste irondera gufata mu minwe no kuyobora ibikorwa vy'umuntu gushika ku rugero rwo hejuru rushoboka. Uwo mugwi rusangi ushobora guserukirwa nk'umugwi w'abantu mu kibano, ihanga, ubwoko, canke igitsina, ariko muri buri gihe umuntu asigurwa n'ukuba mu mugwi.
