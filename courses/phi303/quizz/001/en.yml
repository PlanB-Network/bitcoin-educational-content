question: "What distinction did Benjamin Constant draw between two kinds of freedom?"
answer: "The freedom of the ancients (political participation) versus the freedom of the moderns (personal and economic independence)."
wrong_answers:
  - "Freedom of speech versus freedom of religion."
  - "Positive rights versus natural rights granted by the state."
  - "The freedom of rulers versus the freedom of the ruled."
explanation: |
  For Constant, the ancient citizen was free because he participated in political decisions, while the modern individual values independence in his private and economic life. The two freedoms are very different — which is why democracy and liberty cannot be equated.
