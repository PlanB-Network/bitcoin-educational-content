question: "为什么加密朋克认为具有匿名属性的数字货币是必要的？"
answer: "因为现金这一主要的匿名交易系统正在数字社会中消失，必须发明一种具有相同隐私属性的数字替代品"
wrong_answers:
  - "因为现有数字支付系统太慢且太昂贵，在线商业需要一种更快、更便宜的替代方案"
  - "因为政府已经禁止了所有形式的匿名交易，只有新技术才能绕过这些法律"
  - "因为传统银行拒绝服务某些人群，使一种普遍可访问的数字支付系统成为经济必要性"
explanation: >-
  加密朋克宣言指出，开放社会中的机密性需要匿名交易系统。在数字时代之前，现金一直是这种类型的主要系统。但在现金正在消失的数字社会中，必须发明一种具有同样匿名属性的数字货币。这一愿景直接预见了 Bitcoin 后来将实现的东西。
reviewed: false
