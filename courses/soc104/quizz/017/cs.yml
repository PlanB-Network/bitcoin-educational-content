question: "Co chce pravice legislativně upravovat?"
answer: "Morálku a náboženství, motivována touhou zachovat tradiční instituce a společenské hierarchie"
wrong_answers:
  - "Ekonomiku a finanční trhy, motivována touhou snížit nerovnost a přerozdělit bohatství"
  - "Vědu a vzdělávání, motivována touhou kontrolovat, co se vyučuje ve veřejných školách"
  - "Mezinárodní obchod a diplomacii, motivována touhou rozšířit národní vliv v zahraničí"
explanation: >-
  Pravice dává prioritu osobní morálce a tradičním hodnotám. Má za to, že civilizace je vybudována na určitých tradičních institucích a společenských hierarchiích, které musí být zachovány, a chce legislativně upravovat morálku a náboženství. Na legislativní úpravu ekonomiky se zaměřuje levice, nikoli pravice. Věda, vzdělávání a obchodní politika nejsou hlavním zaměřením popsaným pro pravici.
