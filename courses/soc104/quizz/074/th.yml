question: "มโนทัศน์ 'moral hazard' ในบริบทของการถกเถียงเรื่องเงินอุดหนุนคืออะไร และกลุ่มการเมืองใดหยิบยกข้อกังวลนี้?"
answer: "Moral hazard คือแรงจูงใจไปสู่ความไร้ความรับผิดชอบเมื่อบริษัทถูกป้องกันไม่ให้ล้มเหลวผ่านเงินอุดหนุน เพราะท้ายที่สุดผู้เสียภาษีเป็นผู้จ่าย; ข้อกังวลนี้ถูกหยิบยกโดยลิเบอร์ทาเรียน"
wrong_answers:
  - "Moral hazard คือความเสี่ยงที่บริษัทที่ได้รับเงินอุดหนุนจะย้ายไปประเทศที่ภาษีต่ำกว่าและนำงานไปด้วย; ข้อกังวลนี้ถูกหยิบยกโดยอนุรักษนิยม"
  - "Moral hazard คืออันตรายที่เจ้าหน้าที่รัฐจะคอร์รัปชันจากการเลือกว่าบริษัทใดได้รับเงินอุดหนุน; ข้อกังวลนี้ถูกหยิบยกโดยสายกลาง"
  - "Moral hazard คือปัญหาทางจริยธรรมของบริษัทที่เอาเปรียบแรงงานหลังได้รับเงินสาธารณะ; ข้อกังวลนี้ถูกหยิบยกโดยสังคมนิยม"
explanation: >-
  ลิเบอร์ทาเรียนโต้แย้งว่าเงินอุดหนุนและ bailouts สร้าง moral hazard: เมื่อบริษัทถูกป้องกันไม่ให้ล้มเหลว มันสร้างแรงจูงใจต่อความไร้ความรับผิดชอบและความประมาท เพราะไม่มีผลตามมาต่อการตัดสินใจที่ย่ำแย่ สุดท้ายผู้เสียภาษีเป็นผู้จ่าย ซึ่งลิเบอร์ทาเรียนถือว่าไม่ยุติธรรมอย่างลึกซึ้ง มโนทัศน์นี้แตกต่างจากข้อกังวลเรื่องการย้ายที่ตั้งของบริษัท คอร์รัปชันของเจ้าหน้าที่ หรือการเอาเปรียบแรงงานที่กลุ่มการเมืองอื่นหยิบยก
reviewed: false
