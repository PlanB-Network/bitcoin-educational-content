question: "Por que Rothbard criticou a visão dos libertaires sobre a natureza humana, e que alternativa ele propôs?"
answer: "Ele os acusou de sustentar uma visão ingênua do 'bom selvagem' e argumentou que a sociedade deve usar a propriedade privada e bons incentivos para orientar o comportamento autointeressado"
wrong_answers:
  - "Ele elogiou a compreensão deles sobre a cooperação humana, mas argumentou que um Estado mínimo ainda era necessário para fazer cumprir contratos"
  - "Ele concordou que os humanos são naturalmente bons, mas insistiu que somente os mercados livres poderiam canalizar essa bondade para a atividade produtiva"
  - "Ele rejeitou a ênfase deles nos direitos individuais e argumentou, em vez disso, que as comunidades deveriam definir coletivamente os padrões morais"
explanation: >-
  Rothbard criticou os libertaires por adotarem uma visão ingênua, semelhante à de Rousseau, da natureza humana como naturalmente boa. Ele argumentou, em vez disso, que as pessoas são guiadas pelo interesse próprio, e a sociedade deve ser organizada de modo que bons incentivos orientem o comportamento. Isso exige reconhecer e garantir a propriedade privada. Abolir o Estado não significa abolir suas funções; a polícia e a justiça devem ser geridas pelo livre mercado por meio da concorrência.
