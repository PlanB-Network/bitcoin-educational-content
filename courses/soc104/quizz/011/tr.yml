question: "Nolan diyagramında liberteryenler arasında hangi iç gerilim vardır?"
answer: "Bazıları devleti tamamen ortadan kaldırmak ister (anarko-kapitalistler), bazıları ise çekirdek egemen işlevleri koruyan minimal bir devleti tercih eder (minarşistler)"
wrong_answers:
  - "Bazıları güçlü ekonomik düzenleme isterken bazıları tüm sektörlerin düzenlemelerden tamamen arındırılmasını tercih eder"
  - "Bazıları demokratik seçimleri desteklerken bazıları kalıtsal bir yönetim sistemini tercih eder"
  - "Bazıları ilerici sosyal politikaları savunurken bazıları katı biçimde geleneksel ahlaki değerleri savunur"
explanation: >-
  Liberteryen aile içinde devletin rolü konusunda temel bir anlaşmazlık vardır. Anarko-kapitalistler tüm devlet işlevlerini özel hizmetlerle değiştirmek isterken minarşistler savunma ve mahkemeler gibi çekirdek egemen işlevleri koruyan minimal bir devleti kabul eder. Her iki grup da liberteryen zirveyi paylaşır; fakat herhangi bir devletin var olup olmaması gerektiği konusunda ayrılır.
