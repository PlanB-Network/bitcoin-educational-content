question: "Какво е важното разграничение между това да бъдеш pro-business и това да бъдеш pro-market?"
answer: "Да бъдеш pro-business означава да предпочиташ съюз между големите предприятия и държавата, докато да бъдеш pro-market означава да подкрепяш свободна конкуренция без държавно фаворизиране"
wrong_answers:
  - "Да бъдеш pro-business означава да подкрепяш малките бизнеси, докато да бъдеш pro-market означава да подкрепяш мултинационалните корпорации"
  - "Да бъдеш pro-business означава да се противопоставяш изцяло на регулацията, докато да бъдеш pro-market означава да приемаш умерена регулация"
  - "Да бъдеш pro-business се фокусира върху местната индустрия, докато да бъдеш pro-market се фокусира върху международната търговия"
explanation: >-
  Центристите имат тенденция да бъдат pro-business, което означава, че предпочитат вид съюз между големите предприятия и държавата, различаващ се от това да бъдеш pro-market. Да бъдеш pro-market подкрепя свободна конкуренция без държавно фаворизиране или корпоративен протекционизъм. Това разграничение е решаващо, защото pro-business политиките могат да създадат монополи и регулаторни защити, които всъщност подкопават конкуренцията на свободния пазар.
