question: "Qu'est-ce que le conservatisme culturel ?"
answer: "Une adhésion personnelle à des valeurs familiales, morales, esthétiques et métaphysiques héritées du passé, et non une philosophie politique"
wrong_answers:
  - "Une idéologie politique qui utilise le pouvoir de l'État pour imposer des valeurs traditionnelles à toute la société par la législation"
  - "Un mouvement qui rejette toutes les formes de modernité et cherche à ramener la société à un mode de vie préindustriel"
  - "Une doctrine économique qui protège les industries nationales et s'oppose au libre-échange avec les pays étrangers"
explanation: >-
  Le conservatisme culturel est défini comme une sagesse de vie : l'adhésion personnelle à des valeurs familiales, morales, esthétiques et métaphysiques héritées du passé, qu'elles soient gréco-romaines ou judéo-chrétiennes. Ce n'est explicitement pas une philosophie politique. Il diffère du conservatisme politique, qui vise à préserver les institutions politiques et l'ordre social par le pouvoir de l'État. Il ne s'agit pas non plus de rejeter la modernité ou de défendre le protectionnisme économique.
reviewed: false
