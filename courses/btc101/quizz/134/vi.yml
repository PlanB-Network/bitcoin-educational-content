question: Hash (mật mã hóa) hợp lệ trong việc đào khối dữ liệu (block) trên mạng Bitcoin là gì?
answer: Một dấu vân tay duy nhất liên kết với khối dữ liệu (block), bao gồm 256 ký tự.
wrong_answers:
  - Một mã duy nhất được sử dụng để truy cập khối dữ liệu (block).
  - Một mật khẩu duy nhất cần thiết để đào khối dữ liệu (block).
  - Một mã định danh duy nhất cho người đào khối dữ liệu (block) đó.
explanation: |
  Trong bối cảnh đào khối dữ liệu (block) trong mạng Bitcoin, một hash (mật mã hóa) hợp lệ là một dấu vân tay duy nhất liên kết với khối dữ liệu (block), bao gồm 256 ký tự. Tính hợp lệ của hash (mật mã hóa) này phụ thuộc vào độ khó của mạng Bitcoin.
reviewed: true