question: "I de fem samhällsdebatterna (äktenskap, invandring, skjutvapen, droger, sockrade drycker), vilket återkommande analytiskt ramverk formar den socialistiska positionen i varje fråga?"
answer: "Ett konfliktramverk mellan dominerande och dominerade, där samhället är strukturerat av förtryck och staten måste ingripa för att skydda den sårbara gruppen"
wrong_answers:
  - "Ett utilitaristiskt ramverk inriktat på att maximera övergripande lycka och ekonomisk produktivitet för största möjliga antal medborgare"
  - "Ett naturrättsligt ramverk där individuella friheter måste skyddas från både statlig och företagsmässig inblandning"
  - "Ett traditionalistiskt ramverk där etablerade sociala institutioner måste bevaras mot störande moderna förändringar"
explanation: >-
  Den socialistiska positionen i samhällsdebatter formas konsekvent av ett konfliktperspektiv mellan dominerande och dominerade. I äktenskapsfrågan handlar det om en heterosexuell majoritet som förtrycker en homosexuell minoritet. I invandringsfrågan är nationalitetsbaserade restriktioner former av förtryck. I skjutvapenfrågan bör endast staten inneha våldet för att skydda de sårbara. I frågan om sockrade drycker profiterar industrialister på de minst skyddades sårbarhet. Denna förtryckare/förtryckt-lins reproduceras över många domäner, inklusive kön, ras och till och med relationen mellan mänskligheten och naturen.
reviewed: false
