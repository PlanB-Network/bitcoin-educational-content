question: "Qual é a definição de estatismo apresentada no quadro de Nolan?"
answer: "Usar a legislação para controlar e moldar a sociedade, seja em nome da defesa da civilização, da classe trabalhadora, da natureza ou dos oprimidos"
wrong_answers:
  - "Um sistema de governo em que autoridades eleitas cumprem mandatos fixos e o poder transita por meio de eleições democráticas"
  - "A crença de que apenas um exército forte pode proteger a soberania e a integridade territorial de uma nação"
  - "Uma filosofia econômica que prioriza as indústrias nacionais em relação à concorrência estrangeira por meio de tarifas e cotas"
explanation: >-
  O estatismo é definido como o uso da legislação para controlar e moldar a sociedade. Tanto a esquerda quanto a direita o praticam: alguns em nome da defesa da civilização, outros em nome da defesa da classe trabalhadora, da natureza ou dos oprimidos. Até mesmo os centristas o aprovam quando isso lhes convém. O estatismo não se limita à política militar, ao protecionismo comercial ou simplesmente à existência de governos eleitos.
reviewed: false
