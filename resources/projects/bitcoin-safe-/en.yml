description: |
  Bitcoin-Safe is a FOSS (Free and Open Source Software) desktop wallet that makes self-custody accessible to everyone. It supports hardware wallets, multisig, testnet playground with test-coins, encrypted nostr chat groups, categories and labels sync, and air-gapped signing — no KYC, no accounts, no telemetry, no middlemen. 
  
  Your keys, your sats!
  
  - 🌐 Official Website: https://bitcoin-safe.org
  
  - 💻 Source code & releases: https://github.com/andreasgriffin/bitcoin-safe
  
  - 🏴‍☠️ Contribute to Translations: https://hosted.weblate.org/engage/bitcoin-safe/
  
  - 🐦 X: https://x.com/BitcoinSafeOrg
  
  - 📺 Video tutorials: https://www.youtube.com/@BitcoinSafeOrg
  
