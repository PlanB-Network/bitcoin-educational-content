question: "Umugwi w'umwidegemvyo w'ubutunzi urimwo iki?"
answer: "Ivyo ukora nk'umuhinguzi n'umuguzi: kugura, kugurisha, guhingura, gukora, guha akazi, no gucunga amahera yawe"
wrong_answers:
  - "Ukwemera kwawe kw'idini, imigenderanire yawe bwite, n'umwidegemvyo wo gushikiriza ivyiyumviro"
  - "Uburenganzira bwawe bwo gutora, kugira uruhara mu matora, no kwinjira mu migambwe ya politike"
  - "Ubushobozi bwawe bwo gutembera ata nkomanzi, guhitamwo aho uba, no kurenga imbibe z'ibihugu"
explanation: >-
  Umwidegemvyo w'ubutunzi ukwirikira ivyo ukora nk'umuhinguzi n'umuguzi: ivyo ushobora kugura, kugurisha, canke guhingura; aho ukorera; uwo uha akazi; n'ivyo ukora n'amahera yawe. Imigenderanire y'ubuzima bwite, ukwemera kw'idini, n'umwidegemvyo wo kwimuka biri mu mugwi w'umwidegemvyo w'umuntu ku giti ciwe, si mu w'ubutunzi.
reviewed: false
