question: "個人的自由のカテゴリには何が含まれますか？"
answer: "私的な人間関係、意見、信念、そして自分の身体と精神に関わるすべてのことにおいて行うこと"
wrong_answers:
  - "事業の開始、従業員の雇用、商品の取引など、生産者として行うこと"
  - "どれだけ税金を払うか、どの投資を行うか、金融資産をどう管理するか"
  - "市場で競争し、自分の製品の価格を設定し、仕入先を選ぶ能力"
explanation: >-
  個人的自由は、私的な人間関係、意見や信念、そして自分の身体と精神に関わるすべてのことにおいて、あなたが行うことを包含します。これには結婚、読むものの選択、宗教的実践、食品や医薬品の選択、そして誰と関わるかが含まれます。事業活動、税金、市場での意思決定は経済的自由に属します。
reviewed: false
