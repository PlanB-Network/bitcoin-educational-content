question: "리버테리언은 사유 재산과 자유의 관계를 어떻게 보나요?"
answer: "사유 재산은 법과 국가에 선행하는 자연권이며 자유의 바로 그 토대입니다"
wrong_answers:
  - "사유 재산은 국가가 만든 사회적 관습이며, 불평등을 초래하면 철회될 수 있습니다"
  - "사유 재산은 경제적 효율성에는 유용하지만 고유한 도덕적 또는 철학적 의미는 없습니다"
  - "사유 재산은 개인 소유물에 대해서만 존재해야 하며, 생산 자산이나 토지에는 존재해서는 안 됩니다"
explanation: >-
  리버테리언은 사유 재산을 법과 국가에 선행하는 자연권으로 옹호합니다. 그들은 개인이 자기 몸을 소유한다면 자신의 노동과 그 노동의 산물도 소유한다고 주장합니다. 물질적 재화의 소유는 자기소유권의 확장입니다. 이는 재산을 사회적 관습이나 억압의 원천으로 보는 libertaire 관점과 날카롭게 대비됩니다.
