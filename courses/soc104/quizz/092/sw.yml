question: "Ni tatizo gani la msingi la sarafu za Fiat ambalo Satoshi Nakamoto alilibainisha?"
answer: "Zinahitaji imani kwamba benki kuu haitashusha thamani ya sarafu, lakini historia ya sarafu za Fiat imejaa ukiukaji wa imani hii"
wrong_answers:
  - "Ni ngumu mno kutumiwa kwa miamala ya kila siku kwa sababu pesa taslimu za karatasi na sarafu huchakaa haraka na ni ghali kuzalisha"
  - "Haziwezi kuhamishwa kimataifa kwa sababu kila nchi ina viwango na kanuni za kifedha zisizoendana"
  - "Zinaegemezwa na akiba ya dhahabu ambayo haitoshi kufunika jumla ya usambazaji wa pesa ulioko kwenye mzunguko"
explanation: >-
  Satoshi Nakamoto alisema kwamba tatizo la msingi la sarafu za kawaida ni imani inayohitajika ili zifanye kazi. Sarafu za Fiat haziegemezwi na bidhaa yoyote bali hutegemea kabisa mamlaka ya taasisi. Taasisi inapokuwa na udhibiti kamili juu ya pesa, kishawishi cha kutumia vibaya udhibiti huo huwa kikubwa mno, na historia imelionyesha hili mara kwa mara kupitia kushushwa kwa thamani ya sarafu.
