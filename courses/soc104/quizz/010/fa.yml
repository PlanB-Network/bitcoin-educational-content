question: "دستهٔ آزادی اقتصادی شامل چه چیزهایی می‌شود؟"
answer: "آنچه به عنوان تولیدکننده و مصرف‌کننده انجام می‌دهید: خرید، فروش، تولید، کارکردن، استخدام، و مدیریت پولتان"
wrong_answers:
  - "باورهای دینی، روابط شخصی، و آزادی بیان شما"
  - "حق شما برای رأی دادن، شرکت در انتخابات، و پیوستن به احزاب سیاسی"
  - "توانایی شما برای سفر آزادانه، انتخاب محل سکونت، و عبور از مرزهای ملی"
explanation: >-
  آزادی اقتصادی آنچه را که به عنوان تولیدکننده و مصرف‌کننده انجام می‌دهید پوشش می‌دهد: اینکه چه چیزی را می‌توانید بخرید، بفروشید، یا تولید کنید؛ کجا کار می‌کنید؛ چه کسی را استخدام می‌کنید؛ و با پولتان چه می‌کنید. روابط شخصی، باورهای دینی، و آزادی جابه‌جایی ذیل دستهٔ آزادی شخصی قرار می‌گیرند، نه آزادی اقتصادی.
reviewed: false
