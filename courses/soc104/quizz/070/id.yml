question: "Di lima perdebatan masyarakat (pernikahan, imigrasi, senjata api, narkoba, minuman bergula), kerangka analitis berulang apa yang membentuk posisi sosialis pada setiap isu?"
answer: "Kerangka konflik antara dominan dan yang didominasi, di mana masyarakat distrukturkan oleh penindasan dan negara harus campur tangan untuk melindungi kelompok rentan"
wrong_answers:
  - "Kerangka utilitarian yang berfokus pada memaksimalkan kebahagiaan keseluruhan dan produktivitas ekonomi bagi jumlah warga terbesar"
  - "Kerangka hak alamiah di mana kebebasan individu harus dilindungi dari campur tangan negara maupun korporasi"
  - "Kerangka tradisionalis di mana institusi sosial yang mapan harus dipertahankan melawan perubahan modern yang disruptif"
explanation: >-
  Posisi sosialis di berbagai perdebatan masyarakat secara konsisten dibentuk oleh kerangka konflik dominan/yang didominasi. Pada pernikahan, itu adalah mayoritas heteroseksual yang menindas minoritas homoseksual. Pada imigrasi, pembatasan berbasis kebangsaan adalah bentuk penindasan. Pada senjata api, hanya negara yang harus memegang kekuatan untuk melindungi yang rentan. Pada minuman bergula, industrialis mengambil keuntungan dari kerentanan kelompok yang paling tidak terlindungi. Lensa penindas/tertindas ini direproduksi di berbagai domain termasuk gender, ras, bahkan hubungan antara umat manusia dan alam.
reviewed: false
