question: عملیات منطقی AND در Simplicity چگونه کار می‌کند؟
answer: روی بیت اول شاخه‌بندی می‌کند — اگر false باشد false را برمی‌گرداند، وگرنه بیت دوم را.
wrong_answers:
  - دو مقدار بولی را با استفاده از نوع ضربی در هم ضرب می‌کند.
  - از یک جدول جست‌وجو با هر چهار ترکیب ورودی ممکن استفاده می‌کند.
  - ترکیب‌گر XOR را اعمال می‌کند و سپس ترکیب‌گر NOT را بر نتیجه اعمال می‌کند.
explanation: >-
  AND به‌صورت case (injl unit) (drop iden) تعریف می‌شود. ترکیب‌گر case
  روی بیت اول شاخه‌بندی می‌کند. اگر false باشد (با برچسب چپ)، injl unit
  بدون توجه به بیت دوم false را برمی‌گرداند. اگر true باشد (با برچسب راست)،
  drop iden بیت دوم را بدون تغییر برمی‌گرداند. این با جدول درستی AND
  سازگار است.
reviewed: false
