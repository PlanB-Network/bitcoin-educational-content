question: "Como as estratégias para abolir o Estado diferem entre libertaires e libertários?"
answer: "Os libertaires historicamente defendem a destruição violenta, enquanto os libertários buscam deslegitimar o Estado por meio da educação e da desobediência civil"
wrong_answers:
  - "Os libertaires usam eleições democráticas para desmantelar o Estado, enquanto os libertários favorecem a revolução armada e a ação direta"
  - "Os libertaires se concentram em construir comunidades alternativas, enquanto os libertários trabalham dentro do sistema político existente para aprovar reformas"
  - "Tanto libertaires quanto libertários concordam que o protesto pacífico é o único meio legítimo de transformação social"
explanation: >-
  Os libertaires historicamente defendem destruir o Estado e o capitalismo por meio da violência, incluindo terror e ataques direcionados. Os libertários, em contraste, rejeitam a violência agressiva como ilegítima. Sua estratégia se apoia em deslegitimar o Estado por meio de argumentação, debate, educação e desobediência civil. Essas abordagens fundamentalmente diferentes de mudança refletem suas divergências filosóficas mais profundas.
