question: "Wat zijn de twee assen van het Nolan-diagram?"
answer: "Een verticale as die persoonlijke vrijheden meet en een horizontale as die economische vrijheden meet"
wrong_answers:
  - "Een horizontale as van links naar rechts en een verticale as van autoritair naar democratisch"
  - "Een verticale as die rijkdom meet en een horizontale as die opleidingsniveaus meet"
  - "Een horizontale as van socialisme naar kapitalisme en een verticale as van traditie naar vooruitgang"
explanation: >-
  David Nolan ontwierp zijn diagram met twee specifieke assen: persoonlijke vrijheden (verticaal) en economische vrijheden (horizontaal). Deze tweedimensionale aanpak vervangt de oververeenvoudigde links-rechtslijn en vat de complexiteit van politieke ideologieën beter door de twee hoofdcategorieën van vrijheid van elkaar te scheiden.
