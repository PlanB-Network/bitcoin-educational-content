question: Что такое единичный тип (𝟙) и почему он полезен, несмотря на то что не несёт никакой информации?
answer: Он содержит одно значение (пустой кортеж) и служит основой для всех остальных типов.
wrong_answers:
  - Он представляет число 1 и используется непосредственно в арифметических операциях.
  - Это специальный отладочный тип, записывающий трассировки выполнения в файл.
  - Он хранит ровно один бит данных, используемый для булевых операций.
explanation: >-
  Единичный тип 𝟙 имеет ровно одно значение — пустой кортеж ⟨⟩. Хотя
  он не несёт ни бита информации, он необходим как отправная точка, из
  которой суммарные типы и типы произведений строят все полезные типы
  данных. Например, булев тип 𝟚 — это 𝟙 + 𝟙, построенный целиком из
  единичных типов.
reviewed: false
