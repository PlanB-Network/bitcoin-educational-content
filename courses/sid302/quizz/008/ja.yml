question: ある開発者が、外部に依存せず、ブロックの承認も待たずに、Elementsでアセット発行をテストしたいと考えています。どの設定を使うべきですか？
answer: chain=elementsregtestを設定し、ブロックを即座に生成できるローカルのテスト環境を作る
wrong_answers:
  - chain=liquidv1を設定し、Liquidのメインネットワークに接続してすぐにテストする
  - issueasset RPCコマンドに--testmodeフラグを付けて、隔離された環境で開発する
  - "chain=bitcoin-regtestを設定し、Bitcoinのテスト環境でElementsの機能を使う"
explanation: |
  elementsregtestを設定すると、ローカルの回帰テスト（regtest）環境が作られます。この環境では、generateblockなどのコマンドでブロックを即座に生成できるため、ネットワークの承認を待ったり外部のノードに依存したりすることなく、アセット発行などの機能をテストできます。chain=liquidv1を設定すると、ブロック間隔が1分で外部への依存もある本番のLiquidネットワークに接続されます。issueassetコマンドに--testmodeフラグは存在せず、bitcoin-regtestはBitcoin Core用であって、Elementsの機能のためのものではありません。