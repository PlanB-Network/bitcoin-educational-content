question: "К какой форме управления склоняется центризм?"
answer: "К технократии, при которой власть доверяется экспертам, направляющим экономику и денежно-кредитную политику"
wrong_answers:
  - "К прямой демократии, при которой граждане голосуют по каждому важному политическому решению"
  - "К аристократии, при которой власть принадлежит традиционному правящему классу"
  - "К управлению в духе laissez-faire, при котором рынок регулирует сам себя без государственного вмешательства"
explanation: >-
  Центризм отдаёт предпочтение эффективности и прагматизму и склоняется к технократии, то есть к представлению, что власть следует доверять экспертам, которые направляют экономику и управляют денежно-кредитной политикой. Это принципиально отличается от прямой демократии, аристократии или laissez-faire, каждая из которых распределяет власть по совершенно иным принципам.
