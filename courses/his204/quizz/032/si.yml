question: Gournay විශේෂයෙන් භාණ්ඩ දෙකක නිදහස් වෙළඳාම සඳහා සටන් කළේය
answer: ධාන්‍ය සහ වර්ණිත කැන්වස්
wrong_answers:
  - යකඩ සහ ගල් අඟුරු
  - වයින් සහ ධාන්‍ය
  - ලුණු සහ දුම්කොළ
explanation: |
  Gournay ධාන්‍ය සහ කැන්වස් වෙළඳාම නිදහස් කිරීම සඳහා ප්‍රචාරක කටයුතු කළේය. මෙම අංශවලට බරක් වූ නියමන ආර්ථිකයට හානිකර බව ඔහු විශ්වාස කළේය.
