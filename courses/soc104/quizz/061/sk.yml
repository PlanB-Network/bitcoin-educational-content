question: "Prečo boli totalitné režimy opísané ako „sekulárne náboženstvá“ a čo to odhaľuje o podmienkach nevyhnutných na existenciu totalitarizmu?"
answer: "Vyžadujú od militantov kvázináboženskú vieru a proti oponentom používajú strach, a totalitarizmus vyžaduje všetky charakteristiky súčasne: potlačené slobody, vládu jednej strany, násilnú revolúciu a riadenú ekonomiku"
wrong_answers:
  - "Nahrádzajú tradičné bohoslužby štátnymi ceremóniami a totalitarizmus vyžaduje iba charizmatického vodcu a vojenskú kontrolu"
  - "Používajú náboženské inštitúcie na presadzovanie štátnej ideológie a totalitarizmus môže vzniknúť vždy, keď jedna politická strana ovládne parlament"
  - "Sľubujú duchovnú spásu prostredníctvom politického konania a totalitarizmus existuje vždy, keď štát kontroluje ekonomiku bez ohľadu na politické slobody"
explanation: >-
  Raymond Aron si všimol, že totalitné režimy fungujú na dvoch princípoch: viere militantov a strachu oponentov. Tento kvázináboženský fanatizmus ich charakterizuje nad rámec ich odlišných motivácií a vyslúžil im označenie sekulárne náboženstvá. Kľúčové je, že totalitarizmus vyžaduje všetky definujúce charakteristiky súčasne: potlačené slobody, neobmedzenú autoritu prostredníctvom jednej strany, násilnú revolúciu a riadenú ekonomiku. Moderné demokracie môžu vykazovať niektoré z týchto čŕt, ale totalitarizmus je prítomný iba vtedy, keď sú všetky spojené dohromady.
