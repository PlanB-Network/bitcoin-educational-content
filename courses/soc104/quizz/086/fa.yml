question: "لودویگ فون میزس وقتی نوشت که فقط فرد می‌اندیشد، استدلال می‌کند و عمل می‌کند، چه منظوری داشت؟"
answer: "اینکه جمع‌هایی مانند دولت یا ملت، فراتر از کنش‌های اعضای فردی خود، هیچ وجود مستقلی ندارند"
wrong_answers:
  - "اینکه افراد باید از تشکیل گروه‌ها یا انجمن‌ها پرهیز کنند، زیرا کنش جمعی همیشه زیان‌بار است"
  - "اینکه فقط برخی افراد بااستعداد قادر به اندیشهٔ عقلانی هستند، در حالی که بیشتر مردم از غریزه پیروی می‌کنند"
  - "اینکه اندیشیدن و استدلال‌کردن فعالیت‌هایی خصوصی‌اند که هرگز نباید در فضای عمومی به اشتراک گذاشته یا بحث شوند"
explanation: >-
  میزس روشن کرد که فردگرایی با این تصور مخالف است که هویت‌های اجتماعی مانند جامعه یا ملت می‌توانند مستقل از افرادی که آن‌ها را تشکیل می‌دهند وجود داشته باشند. یک جمع، فراتر از کنش‌های اعضای فردی خود، هیچ وجود مستقلی ندارد. ما نمی‌توانیم به‌طور معنادار از کنش دولت یا یک شرکت سخن بگوییم، زیرا این هویت‌ها اراده یا اندیشه‌ای از آنِ خود ندارند و فقط از طریق افراد عمل می‌کنند.
reviewed: false
