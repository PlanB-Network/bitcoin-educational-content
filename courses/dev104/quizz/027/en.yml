question: In the Pleb Wallet project, which CSS display property and value combination is used to create the flexible button layout that automatically distributes space between the Send and Receive buttons?
answer: display: flex with justify-content: space-around
wrong_answers:
  - display: grid with grid-template-columns: repeat(2, 1fr)
  - display: inline-block with text-align: center
  - display: block with margin: 0 auto
explanation: |
  The buttons container uses 'display: flex' to create a flexible container, combined with 'justify-content: space-around' to automatically distribute equal space around each button. This creates the desired spacing effect where buttons are evenly distributed within their container. Grid would create columns but doesn't provide the same automatic spacing, inline-block with text-align centers elements but doesn't control spacing between them, and display block with margin only centers the container itself, not the individual buttons within it.
