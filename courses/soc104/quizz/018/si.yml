question: "left-wing සහ right-wing රාජ්‍යවාදීන්ට ඇති පොදු දේශපාලන අරමුණ කුමක්ද?"
answer: "තමන්ගේ ලෝකදෘෂ්ටිය අනුව සමාජය සංවිධානය කර එය සියලු දෙනා මත පැනවීම සඳහා බලය ජය ගැනීම"
wrong_answers:
  - "government හි ප්‍රමාණය අඩු කර තීරණ ගැනීමේ බලය තනි පුරවැසියන් වෙත ආපසු ලබා දීම"
  - "සෑම පුරවැසියෙකුම සෑම නීතිමය තීරණයක් පිළිබඳව ඡන්දය දෙන direct democracy එකක් ස්ථාපනය කිරීම"
  - "දේශපාලන පක්ෂ ඉවත් කර ඒවා independent technocratic governance එකකින් ප්‍රතිස්ථාපනය කිරීම"
explanation: >-
  වමේ සහ දකුණේ රාජ්‍යවාදීන් දෙදෙනාටම එකම දේශපාලන අරමුණක් ඇත: තමන්ගේ ලෝකදෘෂ්ටිය අනුව සමාජය සංවිධානය කර එය නීති සම්පාදනය හරහා සියලු දෙනා මත පැනවීම සඳහා බලය ජය ගැනීම. වෙනස ඇත්තේ ඔවුන්ගේ වටිනාකම්වල පමණි: දකුණ සභ්‍යත්වය ආරක්ෂා කිරීම කැඳවයි, වම වැඩකරන පන්තිය හෝ පීඩිතයන් ආරක්ෂා කිරීම කැඳවයි. දෙදෙනාගෙන් කිසිවෙකුත් government අඩු කිරීමට හෝ පක්ෂ ඉවත් කිරීමට උත්සාහ නොකරයි.
