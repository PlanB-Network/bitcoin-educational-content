question: "Perché i liberali classici negli Stati Uniti hanno iniziato a chiamarsi 'libertarians' dagli anni 1960 in poi?"
answer: "Per distinguersi dai liberals americani, il cui significato si era spostato verso l'interventismo statale"
wrong_answers:
  - "Per allinearsi al Partito Democratico e ai suoi programmi sociali progressisti"
  - "Per segnalare il loro sostegno alle riforme della Great Society di Lyndon B. Johnson"
  - "Per adottare un'identità rivoluzionaria più radicale ispirata ai movimenti socialisti europei"
explanation: >-
  Negli Stati Uniti, la parola 'liberal' è passata a indicare i sostenitori del Big Government e dell'intervento statale, in particolare dopo il New Deal e la Great Society. I liberali classici hanno adottato l'etichetta 'libertarian' per preservare il significato originale della loro filosofia. Stavano prendendo le distanze dai liberals americani, non allineandosi con loro.
reviewed: false
