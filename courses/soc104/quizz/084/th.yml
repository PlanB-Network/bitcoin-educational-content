question: "คติพจน์ 'Sapere aude' ของ Kant กระตุ้นให้ผู้คนทำอะไร?"
answer: "ให้กล้าคิดด้วยตนเองและออกจากภาวะผู้เยาว์ที่พวกเขาต้องพึ่งพาการชี้นำของอำนาจที่สูงกว่า"
wrong_answers:
  - "ให้แสวงหาความรู้ทางวิชาการด้วยการเข้าเรียนในสถาบันการศึกษาแบบทางการและได้รับวุฒิบัตร"
  - "ให้ท้าทายศีลธรรมทุกรูปแบบและสร้างระบบจริยธรรมใหม่ทั้งหมดบนฐานความปรารถนาส่วนตัว"
  - "ให้แสวงหาปัญญาผ่านความศรัทธาทางศาสนาและการยอมจำนนต่อคำสอนของคริสตจักร"
explanation: >-
  Sapere aude ซึ่งหมายถึง "จงกล้าคิดด้วยตนเอง" ถูก Kant นำมาจากกวี Horace และทำให้เป็นคติพจน์ของยุคเรืองปัญญา มันเป็นสัญลักษณ์ของการออกจากภาวะผู้เยาว์ ซึ่งเป็นภาวะที่ผู้คนไม่สามารถใช้ความเข้าใจของตนได้โดยปราศจากการชี้นำของชนชั้นหรืออำนาจที่เหนือกว่า Kant กระตุ้นให้เกิดการปลดปล่อยและความรับผิดชอบเต็มที่ต่อการคิดของตนเอง
reviewed: false
