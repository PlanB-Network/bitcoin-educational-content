question: Liquidで、トランザクションの金額とアセットの種類を一般の人から見えないようにしている暗号機能はどれですか？
answer: Confidential Transactions（CT）
wrong_answers:
  - ハードウェア・セキュリティ・モジュール（HSM）
  - Dynamic Federation（Dynafed）プロトコル
  - ペグアウト認可キー（PAK）
explanation: |
  Confidential Transactions（CT）は、公開台帳からアセットの種類とトランザクションの金額を隠しながら、ネットワークがトランザクションの有効性を検証できるようにする暗号機能です。これにより、金融機関に欠かせない商取引上のプライバシーが確保されます。HSMは秘密鍵を守る物理デバイス、Dynafedプロトコルはフェデレーションの変更を管理する仕組み、PAKはペグアウトを管理する鍵であり、いずれもトランザクションの詳細を隠すものではありません。