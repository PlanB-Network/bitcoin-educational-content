question: "ทำไมเสรีนิยมคลาสสิกในสหรัฐอเมริกาจึงเริ่มเรียกตนเองว่า 'libertarians' ในช่วงศตวรรษที่ยี่สิบ?"
answer: "เพราะ 'liberalism' อเมริกันถูกการแทรกแซงของรัฐที่เพิ่มขึ้นและรัฐสวัสดิการยึดครองความหมายไปแล้ว"
wrong_answers:
  - "เพราะพวกเขาต้องการแยกตนเองออกจากธรรมเนียมราชาธิปไตยของยุโรป"
  - "เพราะคำว่า 'liberal' เริ่มเชื่อมโยงกับอนาธิปไตยและความรุนแรงทางการเมือง"
  - "เพราะข้อตกลงการค้าใหม่ ๆ ต้องการอัตลักษณ์ทางการเมืองที่แตกต่างสำหรับผู้สนับสนุนตลาดเสรี"
explanation: >-
  ในช่วงศตวรรษที่ยี่สิบ เกิดการเปลี่ยนแปลงพื้นฐานเมื่อหลัก laissez-faire ถูกละทิ้งมากขึ้นเรื่อย ๆ เพื่อสนับสนุนรัฐสวัสดิการ "liberalism" อเมริกันเริ่มหมายถึงสิ่งที่แตกต่างอย่างมากจากเสรีนิยมคลาสสิก โดยยอมรับการแทรกแซงของรัฐ เสรีนิยมคลาสสิกจึงรับคำว่า "libertarian" มาใช้เพื่อรักษาความแตกต่างไว้ การเปลี่ยนชื่อเช่นนี้ไม่เกี่ยวข้องกับราชาธิปไตยยุโรป ความรุนแรงแบบอนาธิปไตย หรือข้อตกลงการค้าเลย
reviewed: false
