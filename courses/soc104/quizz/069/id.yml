question: "Mengapa posisi libertarian tentang legalisasi narkoba disertai syarat bahwa peran negara dalam masyarakat harus dikurangi?"
answer: "Karena liberalisasi yang diambil alih oleh negara akan menggantikan tanggung jawab individu dengan perawatan yang dikelola pemerintah, sedangkan libertarian menginginkan warga menanggung konsekuensi pilihan mereka dengan dukungan dari asosiasi swasta"
wrong_answers:
  - "Karena legalisasi yang dikendalikan negara akan menghasilkan terlalu banyak pendapatan pajak, membuat pemerintah terlalu kuat dan korup"
  - "Karena negara akan memberlakukan standar kualitas yang akan menaikkan harga dan menciptakan kembali pasar gelap"
  - "Karena regulasi pemerintah atas narkoba akan melanggar perjanjian perdagangan internasional dan hubungan diplomatik"
explanation: >-
  Libertarian mendukung liberalisasi narkoba tetapi menegaskan bahwa peran negara harus dikurangi karena tujuan mereka adalah memulihkan tanggung jawab individu, bukan memperluas pengelolaan negara. Jika seseorang menjadi ketergantungan, ia harus bertanggung jawab alih-alih meminta negara menyediakan perawatan. Solusi terhadap adiksi terletak pada inisiatif privat: dukungan sukarela dari individu, keluarga, dan asosiasi amal. Legalisasi yang dikelola negara akan bertentangan dengan prinsip libertarian fundamental tentang tanggung jawab pribadi.
