question: "libertarians තම political philosophy හි මධ්‍යයේ තබන්නේ කුමක්ද?"
answer: "Ethics සහ law"
wrong_answers:
  - "Economic growth සහ wealth creation"
  - "Social equality සහ collective welfare"
  - "National identity සහ cultural preservation"
explanation: >-
  Libertarians economy නොව, ethics සහ law තම philosophy හි මධ්‍යයේ තබමින් අනෙකුත් සියලු political families වලින් තමන්ව වෙන් කර දක්වති. ඔවුන් market economy ආරක්ෂා කරන විට, එය wealth නිෂ්පාදනය කිරීමේ capacity නිසාට වඩා individual freedom සහ responsibility ප්‍රවර්ධනය කිරීම නිසාය. Economic growth secondary benefit එකකි, foundational principle එක නොවේ.
reviewed: false
