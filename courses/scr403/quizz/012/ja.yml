question: なぜSimplicityはEthereumのような動的gasモデルではなく静的解析を使うのですか？
answer: 実行が始まる前にリソース境界を決定し、予測可能なコストを得るためです。
wrong_answers:
  - 静的解析は開発者にとって実装が単純にはるかに速いためです。
  - Ethereum自身のgasモデルが特許で保護されており、利用できなかったためです。
  - Simplicityプログラムは非常に短く、実際には計量が必要になることがまったくないためです。
explanation: >-
  Simplicityの静的解析により、ネットワークはプログラムが実行される前に、
  そのプログラムがどれだけの計算を必要とするかを正確に知ることができる。
  これにより、動的な計量の予測不能性がなくなり、リソース枯渇による
  サービス拒否を防ぎ、ノードは計算を無駄にせずに制限を超えるプログラムを
  拒否できる。
