question: "Apa perbedaan kunci antara minarkis dan anarko-kapitalis di dalam libertarianisme?"
answer: "Minarkis menerima negara minimal untuk pertahanan, keadilan, dan polisi, sementara anarko-kapitalis ingin semua fungsi negara diprivatisasi"
wrong_answers:
  - "Minarkis menolak semua bentuk pemerintahan, sementara anarko-kapitalis menerima regulasi negara terbatas atas pasar"
  - "Minarkis mendukung perpajakan progresif untuk layanan esensial, sementara anarko-kapitalis menentang semua perpajakan"
  - "Minarkis berfokus hanya pada kebebasan ekonomi, sementara anarko-kapitalis membela kebebasan ekonomi maupun sosial"
explanation: >-
  Minarkis percaya bahwa negara seharusnya dibatasi pada fungsi inti seperti pertahanan, keadilan, dan polisi ("night-watchman state"), sementara anarko-kapitalis berargumen bahwa bahkan fungsi-fungsi ini seharusnya diprivatisasi dan dikelola melalui kompetisi pasar sukarela. Ketidaksepakatan mereka lebih menyangkut implementasi praktis daripada prinsip etis fundamental. Kedua kecenderungan berbagi nilai libertarian yang sama tentang kepemilikan-diri dan non-agresi.
