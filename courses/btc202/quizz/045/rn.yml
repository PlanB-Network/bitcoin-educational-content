question: Ni intambwe izihe zitegerezwa kurangira imbere y’uko UmbrelOS ishobora gushirwaho?
answer: Gukora bootable USB key irimwo image
wrong_answers:
  - Gukoranya kode y'inkomoko ya Bitcoin core
  - Gutegura igitabu ca Blockchain.
  - Rema konti kuri umbrel.com
explanation: |
  Gushiramwo bitangura no gutegura urupfunguzo rwa USB rushobora gufungurwa n’UmbrelOS biciye kuri Balena Etcher.
reviewed: true
