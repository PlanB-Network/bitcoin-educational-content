question: Vauban පළමුවරට බදු ප්‍රතිසංස්කරණයක් යෝජනා කළේ කවදාද?
answer: 1695
wrong_answers:
  - 1693
  - 1697
  - 1700
explanation: |
  ප්‍රංශයේ මාර්ෂල්වරයකු සහ හමුදා ඉංජිනේරුවරයකු වූ Vauban, 1695දී "Dîme Royale" ලෙස හැඳින්වෙන බදු ප්‍රතිසංස්කරණයක් යෝජනා කළේය. මෙම යෝජනාවේ අරමුණ වූයේ බදු ක්‍රමය සරල කිරීම සහ බදු බර වඩා සමාන ලෙස බෙදා හැරීමයි.
