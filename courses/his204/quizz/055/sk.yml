question: V ktorých krajinách sa uplatnili ekonomické reformy inšpirované fyziokraciou?
answer: Francúzsko, Nemecko, Taliansko a Švédsko
wrong_answers:
  - Anglicko, Španielsko a Holandsko
  - Portugalsko, Anglicko a Španielsko
  - Holandsko, Španielsko a Portugalsko
explanation: |
  Fyziokratické reformy sa uplatnili vo Francúzsku (za Turgota), v Nemecku (bádenský markgróf, so Schlettweinovým experimentom v Dietlingene), v Taliansku (Leopold Toskánsky) a vo Švédsku (Gustáv III.). Ruská Katarína II. pozvala aj Merciera de la Riviere, ale bola ním sklamaná.
