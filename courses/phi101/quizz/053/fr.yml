question: Quels sont les arguments utilisés par l'Église pour affirmer sa suprématie sur le pouvoir temporel ?
answer: L'autorité du pape en tant que vicaire du Christ sur Terre.
wrong_answers:
  - Le droit canon et les tribunaux ecclésiastiques.
  - Le contrôle de l'Église sur les forces militaires à travers l'Europe.
  - La supériorité de la foi chrétienne sur toute autre religion ou philosophie.
explanation: |
  L'argument principal utilisé par l'Église pour affirmer sa suprématie sur le pouvoir temporel était l'autorité du pape en tant que représentant du Christ sur Terre, ce qui conférait à l'Église une revendication d'autorité spirituelle sur tous les dirigeants terrestres.
reviewed: true
