description: |
  Boltz on avoimen lähdekoodin projekti, joka mahdollistaa automaattiset atomien vaihdot Bitcoin:n, Lightningin ja Liquid:n välillä.

  Boltz keskeytti kaikki swapit 3. elokuuta 2026, kun hyökkääjät olivat käyttäneet hyväkseen useita haavoittuvuuksia. Sen verkkosivusto on ollut poissa käytöstä syyskuusta 2026 lähtien.