question: "Hur behandlar socialism friheter olika i den samhälleliga och den ekonomiska sfären?"
answer: "Socialism förespråkar starka friheter i den samhälleliga sfären men svaga friheter i den ekonomiska sfären"
wrong_answers:
  - "Socialism begränsar alla friheter lika mycket i både den samhälleliga och den ekonomiska sfären"
  - "Socialism förespråkar starka ekonomiska friheter men begränsar samhälleliga friheter för att upprätthålla social ordning"
  - "Socialism ger obegränsade friheter i båda sfärerna och förlitar sig på frivilligt samarbete för att upprätthålla balans"
explanation: >-
  I socialistiskt tänkande finns en grundläggande dikotomi mellan samhälleliga och ekonomiska friheter. Samhälleliga friheter är starka, men ekonomiska friheter är svaga på grund av betoningen på statlig kontroll, planering och omfördelning av välstånd. Det tredje felaktiga svaret beskriver det libertarianska idealet, medan det andra beskriver det konservativa mönstret, som är socialismens spegelbild.
