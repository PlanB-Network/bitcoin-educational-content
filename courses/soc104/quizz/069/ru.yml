question: "Почему либертарианская позиция по легализации наркотиков сопровождается условием, что роль государства в обществе должна быть сокращена?"
answer: "Потому что либерализация, взятая на себя государством, заменила бы индивидуальную ответственность государственно управляемой заботой, тогда как либертарианцы хотят, чтобы граждане несли последствия своего выбора при поддержке частных ассоциаций"
wrong_answers:
  - "Потому что контролируемая государством легализация принесла бы слишком большие налоговые поступления, сделав правительство чрезмерно сильным и коррумпированным"
  - "Потому что государство ввело бы стандарты качества, которые повысили бы цены и заново создали бы чёрные рынки"
  - "Потому что государственное регулирование наркотиков нарушило бы международные торговые соглашения и дипломатические отношения"
explanation: >-
  Либертарианцы поддерживают либерализацию наркотиков, но настаивают, что роль государства должна быть сокращена, потому что их цель — восстановление индивидуальной ответственности, а не расширение государственного управления. Если человек становится зависимым, он должен взять на себя ответственность, а не просить государство предоставить помощь. Решение проблемы зависимости лежит в частной инициативе: добровольной поддержке со стороны индивидов, семей и благотворительных ассоциаций. Легализация под управлением государства противоречила бы фундаментальному либертарианскому принципу личной ответственности.
reviewed: false
