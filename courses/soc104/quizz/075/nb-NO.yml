question: "På tvers av alle fem økonomiske debatter (skatter, minstelønn, helsetjenester, miljø, subsidier), hvilket konsekvent mønster skiller den sentristiske metoden fra posisjonene til andre politiske familier?"
answer: "Sentrister nekter å forplikte seg til et fast prinsipp og krever i stedet empirisk analyse og ekspertvurdering for å avgjøre politikk fra sak til sak, noe som gjør tilnærmingen deres iboende teknokratisk"
wrong_answers:
  - "Sentrister inntar alltid en mellomposisjon mellom den sosialistiske og den konservative posisjonen, og deler forskjellen likt i hvert spørsmål"
  - "Sentrister prioriterer konsekvent økonomisk vekst over sosial velferd, slutter seg til libertarianere i finanspolitikken og er enige med sosialister om regulering"
  - "Sentrister overlater alle økonomiske beslutninger til internasjonale organisasjoner og handelsavtaler i stedet for å utforme selvstendig nasjonal politikk"
explanation: >-
  På tvers av alle fem økonomiske debatter følger den sentristiske tilnærmingen det samme mønsteret: i stedet for å forplikte seg til et fast ideologisk prinsipp krever sentrister empirisk evidens og ekspertvurdering før de tar beslutninger. Når det gjelder skatter, må riktig nivå bestemmes ved analyse. Når det gjelder minstelønn, må nivået justeres pragmatisk. Når det gjelder helsetjenester, er en blanding kalibrert av eksperter ideell. Når det gjelder miljø, må politikken balansere konkurranseevne. Når det gjelder subsidier, må hvert tilfelle vurderes etter sine egne meritter. Dette gjør sentrismen iboende teknokratisk, noe som er forskjellig fra bare å dele forskjellen eller overlate beslutninger til internasjonale organer.
reviewed: false
