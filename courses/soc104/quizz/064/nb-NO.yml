question: "Hva er den libertarianske posisjonen i spørsmålet om homofilt ekteskap?"
answer: "Staten har ingenting med å definere ekteskap; det bør privatiseres og overlates til individer, foreninger og religiøse institusjoner"
wrong_answers:
  - "Homofilt ekteskap bør legaliseres fordi alle borgere fortjener lik behandling etter loven"
  - "Homofilt ekteskap bør forbys fordi tradisjonelt ekteskap er en grunnleggende institusjon for forplantning"
  - "Homofilt ekteskap bør legaliseres, men bare gjennom et separat juridisk rammeverk adskilt fra tradisjonelt ekteskap"
explanation: >-
  Libertarianere hevder at ekteskapsspørsmålet er fundamentalt feil innrammet fordi det stilles i et etatistisk perspektiv. De mener staten ikke har noe med å blande seg inn i privatlivet, så løsningen er å skille ekteskap helt fra staten. Ved å påtvinge én enkelt definisjon skaper staten konflikter. Det første gale svaret gjenspeiler den sosialistiske eller sentristiske posisjonen, og det andre gjenspeiler den konservative posisjonen.
