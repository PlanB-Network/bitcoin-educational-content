question: "¿En qué difiere la concepción libertaria de la libertad de la concepción centrista?"
answer: "Los libertarios tratan la libertad como un axioma incondicional, mientras que los centristas defienden las libertades de forma oportunista según el contexto y la eficiencia"
wrong_answers:
  - "Los libertarios permiten que el Estado proteja la libertad selectivamente, mientras que los centristas rechazan cualquier intervención estatal en la protección de los derechos individuales"
  - "Los libertarios se centran en la libertad económica, mientras que los centristas aplican la libertad ampliamente en todos los ámbitos culturales"
  - "Los libertarios y los centristas comparten la misma visión de la libertad, pero discrepan sobre el tamaño del Estado necesario para implementarla"
explanation: >-
  Los libertarios definen la libertad como un principio general e incondicional que funciona como un axioma. Los centristas, por el contrario, defienden ciertas libertades de forma oportunista y contextual, sin aplicar ningún principio general. El enfoque centrista revela una concepción instrumental de la libertad, siempre subordinada a objetivos pragmáticos como la eficiencia, que los libertarios rechazan fundamentalmente.
