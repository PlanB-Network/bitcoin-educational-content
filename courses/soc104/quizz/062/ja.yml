question: "Hannah Arendt が示した古典的専制と全体主義の重要な区別は何ですか？"
answer: "全体主義は人々を専制的規則に従わせるだけでなく、人間を独立して行動できない存在にし、政治そのものを否定する"
wrong_answers:
  - "古典的専制は経済を統制し、全体主義は政治制度と軍事制度だけを統制する"
  - "全体主義は単に専制のより極端な形であり、抑圧の規模だけが異なる"
  - "古典的専制は支配を正当化するためにイデオロギーを用い、全体主義は純粋に軍事力だけに依拠する"
explanation: >-
  Arendt は、全体主義は古典的専制と根本的に異なると論じます。それは単により極端な暴政ではなく、人間を余計な存在にし、独立して行動する能力を破壊するシステムです。Arendt にとって、政治とは人々が自らの運命を自らの手に取る能力であり、全体主義はこの能力そのものの否定です。そのため、全体主義は専制とは質的に異なります。
reviewed: false
