question: "Jaký je socialistický postoj ke zdravotnictví?"
answer: "Přístup ke zdravotní péči je základní právo a stát musí zaručit univerzální, veřejně financovaný systém pro každého bez ohledu na příjem"
wrong_answers:
  - "Zdravotnictví by mělo být smíšeným systémem se základním státním krytím doplněným soukromými možnostmi pojištění"
  - "Soukromé trhy poskytují inovativnější zdravotnictví, takže jednotlivci by si měli svobodně zvolit vlastní systém"
  - "Stát by měl poskytovat zdravotní péči pouze nejchudším občanům, zatímco soukromé pojištění by krylo všechny ostatní"
explanation: >-
  Pro socialisty je přístup ke zdravotní péči základní právo, nikoli komodita. Stát musí zaručit univerzální, veřejně financovaný zdravotnický systém, aby měl každý přístup k péči bez ohledu na příjem. To odráží socialistickou starost o rovnost, sociální spravedlnost a význam státu při organizaci služeb v obecném zájmu. Smíšený systém popisuje centristický pohled, zatímco přístupy založené na volbě odrážejí libertariánské a konzervativní pozice.
