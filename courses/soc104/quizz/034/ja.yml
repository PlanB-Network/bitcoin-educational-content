question: "マレー・ロスバードが理論化した不侵害原則とは何ですか？"
answer: "他の個人またはその財産に対して物理的強制力を先に用いることは正当ではないが、防衛的な暴力は認められる"
wrong_answers:
  - "自己防衛や抑圧への抵抗を含め、あらゆる形の暴力は常に誤っている"
  - "暴力は抑圧的な制度に向けられる場合には許容されるが、他の個人に向けられる場合には決して許容されない"
  - "国家だけが力を用いる正当な権利を持ち、個人は決して暴力に訴えてはならない"
explanation: >-
  ロスバードの不侵害原則は、他者またはその財産に対して物理的強制力を先に用いることは正当ではないとする。これは黄金律の哲学的翻訳である。しかし、それはあらゆる暴力を禁じるものではない。自己防衛や抑圧への抵抗を含む防衛的な暴力は正当とみなされる。この点で、それは純粋な平和主義とも、国家が主張する力の独占とも区別される。
reviewed: false
