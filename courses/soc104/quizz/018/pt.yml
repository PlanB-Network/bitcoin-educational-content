question: "Sobre o que a direita quer legislar?"
answer: "Moralidade e religião, impulsionada pelo desejo de preservar instituições tradicionais e hierarquias sociais"
wrong_answers:
  - "A economia e os mercados financeiros, impulsionada pelo desejo de reduzir a desigualdade e redistribuir riqueza"
  - "A ciência e a educação, impulsionada pelo desejo de controlar o que é ensinado nas escolas públicas"
  - "O comércio internacional e a diplomacia, impulsionada pelo desejo de expandir a influência nacional no exterior"
explanation: >-
  A direita dá prioridade à moralidade pessoal e aos valores tradicionais. Ela considera que a civilização é construída sobre certas instituições tradicionais e hierarquias sociais que devem ser preservadas, e quer legislar sobre moralidade e religião. A esquerda, não a direita, concentra-se em legislar sobre a economia. Ciência, educação e política comercial não são o foco principal descrito para a direita.
