question: "Co zahrnuje kategorie osobní svobody?"
answer: "To, co děláte ve svých soukromých vztazích, se svými názory, přesvědčeními a se vším, co se týká vašeho vlastního těla a mysli"
wrong_answers:
  - "To, co děláte jako výrobce, včetně založení podniku, najímání zaměstnanců a obchodování se zbožím"
  - "Kolik platíte na daních, jaké investice provádíte a jak spravujete svá finanční aktiva"
  - "Vaši schopnost soutěžit na trhu, stanovovat ceny svých produktů a vybírat si dodavatele"
explanation: >-
  Osobní svoboda zahrnuje to, co děláte ve svých soukromých vztazích, se svými názory a přesvědčeními a se vším, co se týká vašeho vlastního těla a mysli. Patří sem manželství, výběr četby, náboženské praktiky, volby ohledně potravin a léků a to, s kým se stýkáte. Podnikatelské aktivity, daně a rozhodnutí na trhu spadají pod ekonomickou svobodu.
