question: "چرا تورم پولی به‌عنوان مالیاتی پنهان توصیف می‌شود که بدون رضایت شهروندان تحمیل می‌گردد؟"
answer: "زیرا خلق پول توسط دولت ارزش ارز را کاهش می‌دهد، پس مردم با همان مقدار پول کمتر می‌توانند بخرند، اما بیشترشان درک نمی‌کنند که افزایش قیمت‌ها بازتاب سیاست دولت است نه نیروهای طبیعی بازار"
wrong_answers:
  - "زیرا بانک‌های مرکزی مخفیانه بر هر تراکنشی که از طریق نظام بانکی پردازش می‌شود کارمزد می‌گیرند، بی‌آنکه آن را به دارندگان حساب افشا کنند"
  - "زیرا دولت‌ها پول چاپ می‌کنند و آن را فقط میان افراد ثروتمند توزیع می‌کنند، در حالی که فقرا را از طریق مالیات فروش بالاتر بر کالاهای ضروری مالیات‌بندی می‌کنند"
  - "زیرا تورم ناشی از افزایش قیمت‌ها توسط شرکت‌های خصوصی برای افزایش سود است و این کار همچون مالیاتی غیررسمی بر مصرف‌کنندگان عمل می‌کند"
explanation: >-
  تزریق پول به نظام به کاهش ارزش ارز تبدیل می‌شود؛ همان مقدار پول کمتر می‌خرد، زیرا پول جدید بازتاب رشد اقتصادی واقعی نیست. بیشتر مردم نمی‌بینند که سیاست دولت به افزایش قیمت‌ها انجامیده است؛ قیمت‌هایی که صرفاً بازتاب کاهش ارزش ارزند. این به سرقت قانونی و غارت نهادینه‌شده می‌انجامد، طبقه متوسط را فقیرتر می‌کند، در حالی که ثروتمندان پول جدید را از طریق دارایی‌های سفته‌بازانه جذب می‌کنند.
reviewed: false
