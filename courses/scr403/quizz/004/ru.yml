question: Сколько базовых комбинаторов у Simplicity?
answer: Девять (iden, unit, comp, pair, case, take, drop, injl, injr).
wrong_answers:
  - Три (последовательная композиция, параллельная композиция, условный оператор).
  - Пять (только комбинаторы comp, pair, case, take и drop).
  - Двенадцать (девять базовых плюс три дополнительных расширяющих комбинатора).
explanation: >-
  У Simplicity ровно девять базовых комбинаторов. Две базовые операции (iden
  и unit), три способа композиции (comp, pair, case) и четыре средства
  доступа (take, drop — для произведений, injl и injr — для сумм). Этих
  девяти достаточно, чтобы выразить любую функцию между типами Simplicity.
