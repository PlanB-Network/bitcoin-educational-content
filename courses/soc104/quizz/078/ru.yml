question: "Чем либертарианское понимание свободы отличается от центристского?"
answer: "Либертарианцы рассматривают свободу как безусловную аксиому, тогда как центристы защищают свободы оппортунистически, в зависимости от контекста и эффективности"
wrong_answers:
  - "Либертарианцы позволяют государству избирательно защищать свободу, тогда как центристы отвергают любое участие государства в защите индивидуальных прав"
  - "Либертарианцы сосредотачивают свободу только на экономических вопросах, тогда как центристы широко применяют свободу к социальным и культурным областям"
  - "Либертарианцы и центристы разделяют один и тот же взгляд на свободу, но расходятся во мнениях о размере правительства, необходимом для ее обеспечения"
explanation: >-
  Либертарианцы определяют свободу как общий, безусловный принцип, который функционирует как аксиома. Центристы, напротив, защищают определенные свободы оппортунистически и контекстуально, не применяя никакого общего принципа. Центристский подход выявляет инструментальное понимание свободы, всегда подчиненное прагматическим целям вроде эффективности, что либертарианцы принципиально отвергают.
