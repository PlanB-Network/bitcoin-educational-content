question: "Какой скрытый парадокс заложен в центристском прагматизме?"
answer: "Сам прагматизм опирается на форму догматизма, а именно на невысказанное убеждение, что только эксперты компетентны направлять общество"
wrong_answers:
  - "Центристы утверждают, что они умеренны, но в коалиционных правительствах постоянно выстраиваются рядом с левыми партиями"
  - "Центристская политика выглядит сбалансированной, но всегда отдаёт предпочтение экономическому росту перед защитой окружающей среды"
  - "Центристы отвергают идеологию, но при принятии экономических решений перенимают жёсткие принципы свободного рынка"
explanation: >-
  Парадокс центристского прагматизма в том, что он заявляет об отказе от идеологии в пользу рациональной экспертизы, однако само это заявление опирается на невидимую и невысказанную догму: только технократы способны принимать правильные решения. Это убеждение, что одни лишь эксперты должны направлять общество, само является идеологической приверженностью, хотя центристы не признают его таковой.
