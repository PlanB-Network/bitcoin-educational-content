question: "¿Dónde se sitúan los Verdes en el diagrama de Nolan, y por qué?"
answer: "Muy abajo en el diagrama, porque consideran que el interés individual no debe prevalecer sobre el interés colectivo del planeta"
wrong_answers:
  - "En la parte superior del diagrama, porque priorizan por igual la libertad personal y la conciencia ambiental"
  - "En el centro del diagrama, porque equilibran el crecimiento económico con la protección del medioambiente"
  - "En el extremo derecho, porque apoyan soluciones de mercado a los desafíos ambientales"
explanation: >-
  Los Verdes se sitúan muy abajo en el diagrama de Nolan porque favorecen un fuerte control estatal tanto sobre las decisiones económicas como personales en nombre del bienestar planetario. Han sustituido la lucha de clases marxista por una lucha entre el hombre y la naturaleza, y tienden a defender el control económico e incluso la abolición de la propiedad privada. Esto los sitúa en el sector autoritario, no en la parte superior ni en el centro.
reviewed: false
