question: Simplicityが実行中の動的メモリ割り当てを排除しているのはなぜですか？
answer: 静的解析を可能にし、バグや攻撃のクラス全体を排除するためです。
wrong_answers:
  - Liquid Networkが低レベルのメモリ操作に対応していないためです。
  - 新しいスマートコントラクト開発者にとってプログラミングの学習曲線を下げるためです。
  - Bitcoin Script自体にも動的メモリ割り当てが存在しないためです。
explanation: >-
  Simplicityは動的メモリ割り当てを避けることで、すべてのリソース使用量を
  実行前に静的に決定できるようにしている。これにより、予測可能な
  リソース境界が可能になり、メモリ管理に関連する脆弱性が排除される。
  これはブロックチェーン検証の文脈では極めて重要である。
reviewed: false
