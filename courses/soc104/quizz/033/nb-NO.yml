question: "Hvordan skiller strategiene for å avskaffe staten seg mellom libertaires og libertarianere?"
answer: "Libertaires har historisk gått inn for voldelig ødeleggelse, mens libertarianere søker å delegitimere staten gjennom utdanning og sivil ulydighet"
wrong_answers:
  - "Libertaires bruker demokratiske valg for å demontere staten, mens libertarianere foretrekker væpnet revolusjon og direkte handling"
  - "Libertaires fokuserer på å bygge alternative fellesskap, mens libertarianere arbeider innenfor det eksisterende politiske systemet for å vedta reformer"
  - "Både libertaires og libertarianere er enige om at fredelig protest er det eneste legitime middelet til sosial transformasjon"
explanation: >-
  Libertaires har historisk gått inn for å ødelegge staten og kapitalismen gjennom vold, inkludert terror og målrettede angrep. Libertarianere avviser derimot aggressiv vold som illegitim. Strategien deres hviler på å delegitimere staten gjennom argumentasjon, debatt, utdanning og sivil ulydighet. Disse grunnleggende ulike tilnærmingene til endring gjenspeiler deres dypere filosofiske uenigheter.
reviewed: false
