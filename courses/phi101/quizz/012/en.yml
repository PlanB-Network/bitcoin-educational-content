question: According to Acton, what role did the Catholic Church play in the rise of freedom in Europe?
answer: It promoted the separation of powers and the balance of forces
wrong_answers:
  - It defended individual rights and freedom of conscience
  - It established democratic institutions to replace monarchical rule
  - It encouraged critical thinking and questioning authority
explanation: |
  According to Acton, the Catholic Church was the only force capable of challenging the authority of feudal lords, monarchs, and emperors, creating a power struggle that prevented the concentration of absolute power and proved crucial for the rise of liberty.
reviewed: true
