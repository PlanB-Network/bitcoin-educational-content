question: 순차 합성에서 연산 f(A → B)를 연산 g(B → C)와 연결하면 무엇이 만들어지나요?
answer: f의 출력이 g로 들어가는, A에서 C로 가는 하나의 복합 연산입니다.
wrong_answers:
  - B와 C 타입의 두 중간 출력을 모두 담은 쌍 값입니다.
  - 입력에 따라 f와 g 중 하나를 선택하는 조건문입니다.
  - 데이터를 공유하지 않고 독립적으로 실행되는 두 개의 별도 연산입니다.
explanation: >-
  순차 합성은 두 연산을 끝에서 끝으로 연결합니다. 첫 번째 연산의 출력이
  두 번째 연산의 입력이 됩니다. Simplicity에서는 이것을 comp 컴비네이터로
  표현합니다. comp f g는 먼저 f를 적용한 다음, 그 결과에 g를 적용합니다.
reviewed: false
