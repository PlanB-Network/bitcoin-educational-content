question: "Cum diferă concepția libertariană despre libertate de concepția centristă?"
answer: "Libertarienii tratează libertatea ca pe o axiomă necondiționată, în timp ce centriștii apără libertățile în mod oportunist, în funcție de context și eficiență"
wrong_answers:
  - "Libertarienii permit statului să protejeze libertatea selectiv, în timp ce centriștii resping orice implicare a statului în protejarea drepturilor individuale"
  - "Libertarienii se concentrează asupra libertății doar în chestiuni economice, în timp ce centriștii aplică libertatea pe scară largă în domeniile sociale și culturale"
  - "Libertarienii și centriștii împărtășesc aceeași viziune asupra libertății, dar nu sunt de acord cu privire la dimensiunea guvernului necesar pentru a o impune"
explanation: >-
  Libertarienii definesc libertatea ca pe un principiu general, necondiționat, care funcționează ca o axiomă. Centriștii, în schimb, apără anumite libertăți într-o manieră oportunistă și contextuală, fără a aplica vreun principiu general. Abordarea centristă dezvăluie o concepție instrumentală asupra libertății, mereu subordonată unor scopuri pragmatice precum eficiența, pe care libertarienii o resping fundamental.
reviewed: false
