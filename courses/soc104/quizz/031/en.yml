question: "What do the French libertaires (socialist anarchists) believe about private property?"
answer: "Private property and capitalism must be abolished because they are sources of oppression"
wrong_answers:
  - "Private property is a natural right that precedes the state and must be protected at all costs"
  - "Private property should be regulated by the state but never completely eliminated from society"
  - "Private property is acceptable only when distributed equally among all members of a commune"
explanation: >-
  The French libertaires, heirs of socialist anarchism through thinkers like Proudhon and Bakunin, hold that both the state and private property must be abolished as twin sources of oppression. This is captured in Proudhon's famous formula "Property is theft." The first wrong answer describes the libertarian position, which is fundamentally opposed to the libertaire view.
