question: "Kuidas käitub kultuuriliselt konservatiivne libertaarlane käitumistega, mida ta moraalselt taunib?"
answer: "Ta vastustab ja heidutab neid käitumisi veenmise ja eeskuju kaudu, kuid ilma seaduse sunnijõudu kasutamata"
wrong_answers:
  - "Ta toetab nende käitumiste keelamist kohaliku omavalitsuse tasandil, vastustades samal ajal föderaaltasandi keelde"
  - "Ta vaikib nende käitumiste suhtes täielikult, uskudes, et igasugune taunimine rikub üksikisiku vabadust"
  - "Ta pooldab kogukondlikke tribunale, mis võivad neid käitumisi karistada väljaspool formaalset õigussüsteemi"
explanation: >-
  Kultuuriliselt konservatiivne libertaarlane võib teatud käitumisi moraalselt taunida, kuid ei poolda konsensuslike ja mitteagressiivsete tegude seaduslikku keelamist. Ta võib selliseid tegusid mitte sallida, neid vastustada ja aktiivselt heidutada, kuid alati veenmise, hariduse ja eeskuju kaudu, mitte seaduse sunnijõuga. See ei tähenda vaikimist ega alternatiivsete jõustamismehhanismide loomist.
reviewed: false
