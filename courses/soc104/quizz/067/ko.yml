question: "이민에 대한 보수주의자의 입장은 무엇인가요?"
answer: "국가는 국가 안보와 문화적 정체성을 보호하기 위해 국경을 통제할 주권적 권리를 가집니다"
wrong_answers:
  - "차별적 제한은 인권을 침해하므로 국경은 무조건 열려 있어야 합니다"
  - "이민은 시장 수요에 따라 결정되어야 하며, 시민들이 외국인과의 관계를 계약적으로 결정해야 합니다"
  - "이민 정책은 전문가 평가에 기반해 경제적 필요와 성공적인 통합 사이의 균형을 맞춰야 합니다"
explanation: >-
  보수주의자들은 질서, 정체성, 국가 주권이 외국인이나 난민의 무제한 수용보다 우선해야 한다고 봅니다. 국경과 명확히 정의된 인구는 문명화된 가치의 일부입니다. 오답들은 사회주의자의 입장(인권으로서의 열린 국경), 리버테리언의 입장(시장 기반 이민), 중도주의자의 입장(전문가 주도의 균형 잡힌 접근)을 나타냅니다.
reviewed: false
