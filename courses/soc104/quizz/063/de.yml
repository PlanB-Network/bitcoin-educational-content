question: "Wie kamen alle totalitären Regime an die Macht?"
answer: "Durch eine gewaltsame Revolution, die rechtfertigte, mit dem vorherigen System reinen Tisch zu machen"
wrong_answers:
  - "Durch schrittweise Gesetzesreformen innerhalb bestehender demokratischer Institutionen"
  - "Durch Militärputsche, die von ausländischen Mächten organisiert wurden, die regionale Kontrolle anstrebten"
  - "Durch friedliche Massenbewegungen, die Wahlen mit großen Mehrheiten gewannen"
explanation: >-
  Alle totalitären Regime kamen durch gewaltsame Revolution an die Macht. Diese Revolution erfüllt einen doppelten Zweck: Sie zerstört die alte Ordnung physisch und rechtfertigt ideologisch den Einsatz von Gewalt als notwendig für den Aufbau der neuen Gesellschaft. Dies unterscheidet totalitäre Machtübernahmen von demokratischen Übergängen, aus dem Ausland unterstützten Putschen oder friedlichen Wahlsiegen.
reviewed: false
