question: "为什么自由意志主义者关于毒品合法化的立场附带一个条件，即国家在社会中的角色必须被削减？"
answer: "因为由国家接管的自由化会用政府管理的照护取代个人责任，而自由意志主义者希望公民承担其选择的后果，并由私人协会提供支持"
wrong_answers:
  - "因为国家控制的合法化会产生过多税收收入，使政府过于强大和腐败"
  - "因为国家会施加质量标准，推高价格并重新制造黑市"
  - "因为政府对毒品的监管会违反国际贸易协定和外交关系"
explanation: >-
  自由意志主义者支持毒品自由化，但坚持国家角色必须被削减，因为他们的目标是恢复个人责任，而不是扩大国家管理。如果有人产生依赖，他必须承担责任，而不是要求国家提供照护。成瘾问题的解决方案在于私人倡议：来自个人、家庭和慈善协会的自愿支持。国家管理的合法化会违背个人责任这一根本的自由意志主义原则。
reviewed: false
