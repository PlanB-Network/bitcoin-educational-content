question: "Monetary मुद्रास्फीति को citizens की consent के बिना impose किया गया hidden tax क्यों describe किया जाता है?"
answer: "क्योंकि government money creation currency को devalue कर देती है, इसलिए लोग same amount से कम खरीद पाते हैं, लेकिन अधिकांश लोग realize नहीं करते कि rising prices natural market forces के बजाय government policy को reflect करती हैं"
wrong_answers:
  - "क्योंकि central banks banking system के through process होने वाली हर transaction पर secret fees charge करते हैं और account holders को disclose नहीं करते"
  - "क्योंकि governments money print करके उसे केवल wealthy individuals में distribute करती हैं, जबकि essential goods पर higher sales taxes के through poor को tax करती हैं"
  - "क्योंकि inflation private corporations द्वारा profits बढ़ाने के लिए prices raise करने से caused होती है, जो consumers पर unofficial tax की तरह function करती है"
explanation: >-
  System में money का injection currency devaluation में translate होता है, जहाँ same amount कम खरीदता है क्योंकि new money genuine economic growth को reflect नहीं करता। अधिकांश लोग यह नहीं देखते कि rising prices government policy से आईं, जो simply currency devaluation का reflection हैं। यह legal theft और institutionalized spoliation के बराबर है, जो middle class को impoverish करता है जबकि wealthy speculative assets के through new money capture करते हैं।
