question: "Comment les libertariens conçoivent-ils la relation entre propriété privée et liberté ?"
answer: "La propriété privée est un droit naturel qui précède la loi et l'État, et elle est le fondement même de la liberté"
wrong_answers:
  - "La propriété privée est une convention sociale créée par l'État qui peut être révoquée lorsqu'elle provoque des inégalités"
  - "La propriété privée est utile pour l'efficacité économique mais n'a aucune signification morale ou philosophique intrinsèque"
  - "La propriété privée ne devrait exister que pour les possessions personnelles, pas pour les actifs productifs ni la terre"
explanation: >-
  Les libertariens défendent la propriété privée comme un droit naturel qui précède la loi et l'État. Ils soutiennent que si un individu possède son propre corps, il possède aussi son travail et les fruits de celui-ci. La propriété des biens matériels est une extension de la propriété de soi. Cela contraste fortement avec la vision libertaire selon laquelle la propriété est une convention sociale ou une source d'oppression.
