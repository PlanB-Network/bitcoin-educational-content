question: Kuidas on kohustuslik solidaarsus vale solidaarsus?
answer: Kuna see viib andmisele mittevabatahtlikul viisil
wrong_answers:
  - Kuna seda ei otsustata alati demokraatlikult
  - Kuna see nõuab liiga palju haldust
  - Kuna seda on raske rakendada
explanation: |
  Sunnitud solidaarsus, Bastiati sõnul, ei saa tõeliselt olla moraalne, kuna see paneb peale andmise ilma vabatahtliku nõusolekuta.
reviewed: false
