question: 完備性證明藉由巢狀的 case 來分解輸入、並以 scribe 對應每個輸出，藉此建構出任何函數。為什麼它只是一個理論性的工具？
answer: 所產生的運算式是一個巨大的查找表，其大小呈指數成長 —— 一個 256 位元的輸入會需要大約 2²⁵⁶ 個項目。
wrong_answers:
  - scribe 是一個巨集，而非核心組合子，所以該運算式落在經形式化驗證的語言之外。
  - Bit Machine 以指數時間對它求值，即使該運算式本身透過共享而保持精簡。
  - 巢狀的 case 只能分解和型別，所以此構造法對任何積型別的輸入都會失敗。
explanation: >-
  此構造法透過巢狀的 case 分解列舉每一個可能的輸入，並以 scribe 把每個輸出寫死，因此運算式的大小呈指數爆炸 —— 對於像 256 位元字這類實際的型別而言更是天文數字。爆炸發生在運算式的大小上，而非某個原本精簡之運算式的執行期。scribe 會展開成真正的核心組合子（unit、injl、injr、pair），所以其結果仍留在核心語言之內，而該語言的完備性定理已在 Rocq 中經形式化驗證；此外，此分解能處理任何型別的輸入，積型別也包含在內。
reviewed: false
