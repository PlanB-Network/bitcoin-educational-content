question: "How does the fiat money system reinforce the divide between governors and governed?"
answer: "It allows governments to finance unlimited spending through money creation, which devalues savings through inflation"
wrong_answers:
  - "It gives citizens direct control over monetary policy through democratic elections and referendums"
  - "It prevents governments from borrowing, forcing them to rely solely on taxation for revenue"
  - "It distributes newly created money equally among all citizens to stimulate economic growth"
explanation: >-
  Fiat currency is described as the cornerstone of state power expansion because it allows governments to borrow and push banks to print new money. The resulting inflation devalues people's savings, benefiting the wealthiest and most powerful entities. It does not give citizens monetary control, nor does it prevent borrowing or distribute money equally.
reviewed: false
