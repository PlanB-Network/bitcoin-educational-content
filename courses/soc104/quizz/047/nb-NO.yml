question: "Hvem blir ofte sitert som grunnleggerfiguren for moderne konservatisme?"
answer: "Edmund Burke, som tok til orde for å bevare institusjoner og tradisjoner mot de radikale endringene i den franske revolusjonen"
wrong_answers:
  - "Karl Marx, som utviklet teorien om klassekamp og historisk materialisme på 1800-tallet"
  - "John Locke, som formulerte teorien om naturrettigheter og samfunnskontrakten på 1600-tallet"
  - "Adam Smith, som skrev The Wealth of Nations og grunnla disiplinen klassisk økonomi"
explanation: >-
  Edmund Burke blir ofte sitert som grunnleggerfiguren for konservatisme på grunn av sin motstand mot den franske revolusjonen. Hans Reflections on the Revolution in France (1790) forsvarte klokskap og gradvis reform fremfor radikal endring. Han mente at samfunnet ikke burde gå fremover ved å starte med blanke ark, men gjennom trinnvise reformer som bevarer prøvde institusjoner og tradisjoner.
reviewed: false
