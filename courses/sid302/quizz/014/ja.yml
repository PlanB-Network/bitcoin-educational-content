question: レイヤー間のスワップで、両者のトランザクションがともに成功するか、資金を失うことなくともに失敗するかのどちらかになることを保証しているものは何ですか？
answer: 両方のネットワークで同じハッシュロックを使い、スワップの両側を暗号学的に結び付けていること
wrong_answers:
  - 両方のネットワークでトランザクションが承認されるまで、タイムロックによってどちらも資金を受け取れないこと
  - MuSig2の鍵集約によって、資金を動かす前に両者の共同署名が必要になること
  - "一方のネットワークで処理が完了しなかった場合に、Taprootのスクリプトパスが自動的にトランザクションを取り消すこと"
explanation: |
  レイヤー間のスワップのアトミック性は、両方のネットワークで同一のハッシュロックを使うことで成り立っています。受取人が一方のレイヤーで資金を受け取るために秘密のプリイメージを公開すると、その同じ秘密が送金者にも見えるようになり、送金者はそれを使ってもう一方のレイヤーで対応する資金を受け取れます。この暗号学的な結び付きによって、両者がともに資金を受け取るか、どちらも受け取らないかのどちらかになることが保証され、トラストレスなスワップにおけるカウンターパーティーリスクがなくなります。