question: "Yeşiller Nolan diyagramında nerede yer alır ve neden?"
answer: "Diyagramda oldukça aşağıda; çünkü bireysel çıkarın gezegenin kolektif çıkarının önüne geçmemesi gerektiğini düşünürler"
wrong_answers:
  - "Diyagramın tepesinde; çünkü kişisel özgürlüğe ve çevre bilincine eşit öncelik verirler"
  - "Diyagramın merkezinde; çünkü ekonomik büyüme ile çevre korumasını dengelerler"
  - "En sağda; çünkü çevresel zorluklara piyasa temelli çözümleri desteklerler"
explanation: >-
  Yeşiller, gezegensel esenlik adına hem ekonomik hem de kişisel kararlar üzerinde güçlü devlet denetimini savundukları için Nolan diyagramında oldukça aşağıda yer alır. Marksist sınıf mücadelesini insan ile doğa arasındaki mücadeleyle değiştirmişlerdir ve ekonomik denetimi, hatta özel mülkiyetin kaldırılmasını savunma eğilimindedirler. Bu onları tepeye ya da merkeze değil, otoriter sektöre yerleştirir.
