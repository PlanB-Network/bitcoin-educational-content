question: "Kaulimbiu ya Kant 'Sapere aude' inawahimiza watu wafanye nini?"
answer: "Kuthubutu kufikiri kwa ajili yao wenyewe na kutoka katika hali ya kutokomaa ambapo wanategemea mwelekeo wa mamlaka ya juu"
wrong_answers:
  - "Kutafuta maarifa ya kitaaluma kwa kujiandikisha katika taasisi rasmi za elimu na kupata vyeti"
  - "Kupinga aina zote za maadili na kuunda mifumo mipya kabisa ya kimaadili inayotegemea hamu binafsi"
  - "Kutafuta hekima kupitia ibada ya kidini na kujisalimisha kwa mafundisho ya kanisa"
explanation: >-
  Sapere aude, inayomaanisha "Thubutu kufikiri mwenyewe," ilichukuliwa na Kant kutoka kwa mshairi Horace na kufanywa kaulimbiu ya Enlightenment. Inaashiria kutoka katika hali ya kutokomaa, hali ambayo watu hawawezi kutumia ufahamu wao bila mwelekeo wa tabaka au mamlaka ya juu. Kant anahimiza ukombozi na uwajibikaji kamili kwa fikra za mtu mwenyewe.
