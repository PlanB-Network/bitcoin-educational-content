question: "Hoe verschilt de libertarische opvatting van vrijheid van de centristische opvatting?"
answer: "Libertariërs behandelen vrijheid als een onvoorwaardelijk axioma, terwijl centristen vrijheden opportunistisch verdedigen afhankelijk van context en efficiëntie"
wrong_answers:
  - "Libertariërs staan toe dat de staat vrijheid selectief beschermt, terwijl centristen elke staatsbetrokkenheid bij de bescherming van individuele rechten afwijzen"
  - "Libertariërs richten vrijheid alleen op economische kwesties, terwijl centristen vrijheid breed toepassen op sociale en culturele domeinen"
  - "Libertariërs en centristen delen dezelfde visie op vrijheid, maar verschillen van mening over de omvang van de overheid die nodig is om haar af te dwingen"
explanation: >-
  Libertariërs definiëren vrijheid als een algemeen, onvoorwaardelijk principe dat als axioma functioneert. Centristen verdedigen daarentegen bepaalde vrijheden op een opportunistische en contextuele manier, zonder enig algemeen principe toe te passen. De centristische benadering onthult een instrumentele opvatting van vrijheid, altijd ondergeschikt aan pragmatische doelen zoals efficiëntie, wat libertariërs fundamenteel afwijzen.
