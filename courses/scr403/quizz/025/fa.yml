question: "Commitment Merkle Root (CMR) در Simplicity چیست؟"
answer: یک hash 256 بیتی که با SHA-256 برچسب‌دار به ساختار یک برنامه Simplicity تعهد می‌دهد.
wrong_answers:
  - یک درخت دودویی که همه مسیرهای اجرای ممکن یک برنامه Simplicity را در بر دارد.
  - hash نوع‌های برنامه و مقادیر witness که برای تأیید آدرس استفاده می‌شود.
  - یک Merkle root از داده تراکنش که برنامه مجاز به دسترسی به آن است.
explanation: >-
  هر ترکیب‌گر Simplicity یک برچسب SHA-256 یکتا دارد (مثلاً Simplicity␟Commitment␟iden)، و
  CMR با hash کردن بازگشتی درخت ترکیب‌گر برنامه با استفاده از این midstateهای برچسب‌دار محاسبه می‌شود.
  مهم این است که CMR به نوع‌های عبارت‌ها تعهد نمی‌دهد و در زمان بازخرید به استنتاج نوع
  تکیه می‌کند. CMRها برای تعهد دادن برنامه‌ها در آدرس‌های Taproot استفاده می‌شوند.
reviewed: true
