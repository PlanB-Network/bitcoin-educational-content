question: Kto rozvinul myšlienku laissez-faire pred markízom d'Argensonom?
answer: Boisguilbert
wrong_answers:
  - Vauban
  - Cantillon
  - Colbert
explanation: |
  Pierre Le Pesant de Boisguilbert sa považuje za predchodcu laissez-faire pre jeho obhajobu hospodárskej slobody a jeho kritiku prehnaných zásahov štátu do hospodárstva.
