question: V ktorej francúzskej provincii Turgot prvý raz experimentoval so svojimi princípmi ekonomického liberalizmu?
answer: Limousin
wrong_answers:
  - Bretónsko
  - Alsasko
  - Normandia
explanation: |
  Turgot bol intendantom Limousinu, chudobnej a odlúčenej provincie, kde uskutočnil viaceré hospodárske reformy inšpirované liberalizmom.
