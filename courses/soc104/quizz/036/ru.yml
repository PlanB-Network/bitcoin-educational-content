question: "На чём сосредоточено структурное определение политической системы?"
answer: "На том, как система фактически функционирует, и на её наблюдаемых характеристиках, таких как степень государственного контроля"
wrong_answers:
  - "На заявленных целях и благородных намерениях, провозглашённых основателями и лидерами системы"
  - "На исторических истоках политического движения и биографиях его ключевых мыслителей"
  - "На количестве разрешённых политических партий и частоте проводимых демократических выборов"
explanation: >-
  Структурные определения сосредоточены на том, как политические системы фактически функционируют, и на их наблюдаемых характеристиках. Например, социализм структурно характеризуется всеприсутствием государства. Этот подход контрастирует с интенциональными определениями, которые опираются на заявленные мотивы и цели. Структурный подход позволяет проводить более объективную оценку на основе измеримых результатов.
reviewed: false
