question: "为什么 Ron Paul 认为美联储是有害的，Bitcoin 与他的立场有何关系？"
answer: "美联储通过操纵法币造成通货膨胀和经济周期，而 Bitcoin 代表一种可替代金本位制的健全货币形式"
wrong_answers:
  - "美联储限制银行竞争，而 Bitcoin 将银行服务去中心化，以改善金融包容性"
  - "美联储阻止国家之间的自由贸易，而 Bitcoin 能实现无需政府批准的无国界交易"
  - "美联储造成过度的政府债务，而 Bitcoin 提供一种消除国债的通缩型货币"
explanation: >-
  最小国家主义者 Ron Paul 认为，美联储应对通货膨胀和经济周期负责，因为它操纵法币。他倡导货币非国有化，这一思想由弗里德里希·哈耶克主张，并将 Bitcoin 视为一种可替代金本位制的健全货币。他的批判根植于自由意志主义货币理论，而不是主要根植于银行竞争、贸易壁垒或政府债务。
reviewed: false
