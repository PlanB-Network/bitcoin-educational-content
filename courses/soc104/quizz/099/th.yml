question: "หลักสูตรนี้ระบุว่าเส้นแบ่งทางการเมืองที่แท้จริงคืออะไร นอกเหนือจากสเปกตรัมซ้าย-ขวา-กลางแบบดั้งเดิม?"
answer: "เส้นแบ่งระหว่างหลักการทางปรัชญาพื้นฐาน: เสรีภาพหรือการบังคับ ความยินยอมโดยสมัครใจหรือการบังคับให้ทำ ปัจเจกบุคคลที่รับผิดชอบหรือส่วนรวม"
wrong_answers:
  - "เส้นแบ่งระหว่างประเทศร่ำรวยกับประเทศยากจนเรื่องการควบคุมข้อตกลงการค้าระหว่างประเทศและสถาบันการเงินโลก"
  - "เส้นแบ่งระหว่างประชากรเมืองกับชนบทเรื่องลำดับความสำคัญของการใช้จ่ายรัฐบาลและการลงทุนโครงสร้างพื้นฐาน"
  - "เส้นแบ่งระหว่างวัฒนธรรมก้าวหน้ากับวัฒนธรรมดั้งเดิมเรื่องบรรทัดฐานทางสังคม คุณค่าครอบครัว และการศึกษาศาสนา"
explanation: >-
  หลักสูตรโต้แย้งว่าเส้นแบ่งทางการเมืองที่แท้จริงไม่ได้อยู่ในป้ายกำกับซ้าย-ขวา-กลางแบบดั้งเดิม แต่อยู่ในหลักการทางปรัชญาพื้นฐาน: เสรีภาพหรือการบังคับ ความยินยอมโดยสมัครใจหรือการบังคับให้ทำ ปัจเจกบุคคลที่รับผิดชอบหรือส่วนรวม วิธีคิดที่ถูกต้องเกี่ยวกับการเมืองคือเริ่มจากหลักการทางจริยธรรม แทนที่จะเริ่มจากป้ายกำกับ
reviewed: false
