question: "In che modo i programmi di assistenza sociale finanziati dallo Stato possono produrre effetti perversi, illustrando il pericolo di affidarsi soltanto alle intenzioni?"
answer: "Possono creare dipendenza, eliminare gli incentivi a lavorare e costituire una spoliazione, poiché il denaro deve prima essere sottratto a coloro che hanno prodotto la ricchezza"
wrong_answers:
  - "Incoraggiano risparmi personali eccessivi, riducono la spesa dei consumatori e causano deflazione nell'economia più ampia"
  - "Rafforzano l'impresa privata trasferendo i costi del lavoro al governo e riducendo la necessità di salari competitivi"
  - "Eliminano le distinzioni di classe così completamente che la mobilità sociale diventa inutile e l'innovazione ristagna"
explanation: >-
  Friedman avverte che intenzioni generose possono produrre conseguenze dannose quando trascurano un'analisi rigorosa degli incentivi umani. I programmi di assistenza finanziati dallo Stato rischiano di creare dipendenza, di non generare alcun incentivo a lavorare e di costituire una forma di spoliazione, poiché i fondi devono prima essere prelevati dai produttori di ricchezza. Risultati misurabili come la riduzione della povertà e l'efficienza devono avere la precedenza sulle nobili intenzioni.
reviewed: false
