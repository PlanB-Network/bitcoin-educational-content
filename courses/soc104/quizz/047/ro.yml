question: "Cine este adesea citat drept figura fondatoare a conservatorismului modern?"
answer: "Edmund Burke, care a pledat pentru păstrarea instituțiilor și tradițiilor împotriva schimbărilor radicale ale Revoluției Franceze"
wrong_answers:
  - "Karl Marx, care a dezvoltat teoria luptei de clasă și materialismul istoric în secolul al XIX-lea"
  - "John Locke, care a articulat teoria drepturilor naturale și contractul social în secolul al XVII-lea"
  - "Adam Smith, care a scris Avuția națiunilor și a fondat disciplina economiei clasice"
explanation: >-
  Edmund Burke este adesea citat drept figura fondatoare a conservatorismului pentru opoziția sa față de Revoluția Franceză. Reflecțiile sale asupra Revoluției din Franța (1790) au susținut prudența și reforma graduală în locul schimbării radicale. El credea că societatea ar trebui să avanseze nu pornind de la o tabula rasa, ci prin reforme incrementale care păstrează instituțiile și tradițiile verificate.
