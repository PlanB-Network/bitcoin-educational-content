question: Ethereumベースのトークン化プラットフォームと比べて、Liquidがミッションクリティカルな金融業務に適しているのは、ブロックチェーンのアーキテクチャにどのような根本的な違いがあるからですか？
answer: LiquidはBitcoinのUTXOモデルを採用しているためトランザクションの結果が確定的である一方、Ethereumのアカウントモデルでは失敗したトランザクションでもガス代が消費されることがある
wrong_answers:
  - LiquidはProof-of-Stakeのコンセンサスで動いている一方、Ethereumはトランザクションの検証を電力消費の大きいProof-of-Workのマイニングに頼っている
  - "Liquidのフェデレーテッド・サイドチェーンの構造では処理能力が無制限である一方、Ethereumは単一チェーンのブロックサイズの制限に縛られている"
  - LiquidはElementsのスクリプトでネイティブのスマートコントラクト機能を実装している一方、Ethereumは外部の仮想マシン実行環境を必要とする
explanation: |
  UTXOモデルの確定的な性質は、金融機関にとって非常に重要です。トランザクションは完全に成功するか、コストなしで失敗するかのどちらかであり、結果を予測できるからです。Ethereumのアカウントモデルでは、失敗したトランザクションでもガス代が消費されることがあり、運用上の不確実性と追加コストが生じます。信頼性とコストの予測可能性が最優先されるミッションクリティカルな金融業務では、これは受け入れられません。