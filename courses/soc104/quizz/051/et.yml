question: "Mille asetavad libertaarid oma poliitilise filosoofia keskmesse?"
answer: "Eetika ja õiguse"
wrong_answers:
  - "Majanduskasvu ja jõukuse loomise"
  - "Sotsiaalse võrdsuse ja kollektiivse heaolu"
  - "Rahvusliku identiteedi ja kultuurilise säilitamise"
explanation: >-
  Libertaarid eristuvad kõigist teistest poliitilistest perekondadest sellega, et asetavad oma filosoofia keskmesse eetika ja õiguse, mitte majanduse. Kui nad kaitsevad turumajandust, teevad nad seda vähem selle võime pärast toota jõukust kui selle pärast, et see edendab individuaalset vabadust ja vastutust. Majanduskasv on teisene kasu, mitte aluspõhimõte.
