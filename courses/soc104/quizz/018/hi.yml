question: "वामपंथ किस चीज़ पर कानून बनाना और विनियमन करना चाहता है?"
answer: "अर्थव्यवस्था, आर्थिक स्वतंत्रता, पूंजीवाद और मुक्त बाज़ार के प्रति शत्रुता से प्रेरित होकर"
wrong_answers:
  - "व्यक्तिगत नैतिकता और धार्मिक आचरण, पारंपरिक संस्थाओं को संरक्षित रखने की इच्छा से प्रेरित होकर"
  - "आप्रवासन और राष्ट्रीय सीमाएँ, सांस्कृतिक पहचान और संप्रभुता को लेकर चिंताओं से प्रेरित होकर"
  - "प्रौद्योगिकी और नवाचार, स्वचालन द्वारा मानव श्रमिकों को प्रतिस्थापित करने के भय से प्रेरित होकर"
explanation: >-
  वामपंथ सामाजिक न्याय और समानता को प्राथमिकता देता है, विशेषकर आर्थिक स्तर पर। इससे आर्थिक स्वतंत्रता, पूंजीवाद और मुक्त बाज़ार के प्रति उसकी शत्रुता पैदा होती है, और अर्थव्यवस्था पर कानून बनाने और विनियमन करने की उसकी इच्छा भी। इसके विपरीत, दक्षिणपंथ नैतिकता और धर्म पर कानून बनाना चाहता है। आप्रवासन और प्रौद्योगिकी विनियमन यहाँ वर्णित प्राथमिक केंद्र नहीं हैं।
