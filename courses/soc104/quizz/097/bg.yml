question: "Как Bitcoin функционира като морален проект с политически последици, а не като политически проект с морални претенции?"
answer: "Bitcoin е проектиран да прави хората свободни, а не богати, като позволява ефективна собственост, защитава стойността на труда и запазва поверителността — морални постижения, които пораждат политически ефекти, без да претендират за който и да е политически лагер"
wrong_answers:
  - "Bitcoin е морален проект, защото кодът му налага етични правила, които предотвратяват измами, а политическата му последица е замяната на демократичното управление с алгоритмично вземане на решения"
  - "Bitcoin функционира като морален проект, защото преразпределя богатство от богатите към ранните възприематели, създавайки по-справедливо общество с политически последици за данъчната политика"
  - "Bitcoin е морален, защото Satoshi Nakamoto е вградил етични заповеди в протокола, а политическата му последица е обединяването на всички политически семейства под споделена парична система"
explanation: >-
  Bitcoin не е проектиран да прави хората богати, а да ги прави свободни. Той постига три морални резултата: позволява ефективна собственост (стимулирайки отговорност), защитава стойността, създадена чрез труд (насърчавайки продуктивно усилие), и запазва поверителността (позволявайки на хората да живеят без страх). Това са морални постижения, които носят политически последици, без да принадлежат към който и да е политически лагер, превръщайки го първо в морален и едва след това в политически проект.
reviewed: false
