question: "Greens Nolan රූපසටහනේ සිටින්නේ කොතැනද, සහ ඇයි?"
answer: "රූපසටහනේ ඉතා පහළින්, මන්ද ඔවුන් පුද්ගලික අභිලාෂය පෘථිවියේ සාමූහික අභිලාෂයට වඩා ප්‍රමුඛ නොවිය යුතු බව සලකන නිසා"
wrong_answers:
  - "රූපසටහනේ ඉහළින්, මන්ද ඔවුන් පුද්ගලික නිදහස සහ පාරිසරික දැනුවත්භාවය එකසේ ප්‍රමුඛ කරගන්නා නිසා"
  - "රූපසටහනේ මධ්‍යයේ, මන්ද ඔවුන් ආර්ථික වර්ධනය පාරිසරික ආරක්ෂාව සමඟ සමබර කරන නිසා"
  - "ඉතා දකුණු පැත්තේ, මන්ද ඔවුන් පාරිසරික අභියෝග සඳහා වෙළඳපොළ-පාදක විසඳුම්වලට සහාය දෙන නිසා"
explanation: >-
  Greens Nolan රූපසටහනේ ඉතා පහළින් සිටින්නේ, ඔවුන් පෘථිවියේ යහපැවැත්ම නාමයෙන් ආර්ථික සහ පුද්ගලික තීරණ දෙකටම ශක්තිමත් රාජ්‍ය පාලනයකට කැමති නිසාය. ඔවුන් Marxist පන්ති අරගලය මිනිසා සහ ස්වභාවය අතර අරගලයකින් ප්‍රතිස්ථාපනය කර ඇති අතර, ආර්ථික පාලනය සහ පුද්ගලික දේපළ අහෝසි කිරීම පවා ආරක්ෂා කිරීමට නැඹුරු වෙති. මෙය ඔවුන් ඉහළ හෝ මධ්‍යයේ නොව, අධිකාරවාදී අංශයේ ස්ථානගත කරයි.
