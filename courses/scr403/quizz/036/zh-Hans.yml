question: push-<n 的类型为 Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ。为什么它的输出必须是一个包含完整向量类型 Aⁿ 的和？
answer: 缓冲区 Aᑉⁿ 最多容纳 n−1 个元素，因此向已满缓冲区 push 会得到 n 个元素 —— 只有 Aⁿ 能表示这一点。
wrong_answers:
  - 这个和让调用者选择更便宜的编码，因为向量比 option product 序列化得更紧凑。
  - Push 可能在空缓冲区上失败，而 Aⁿ 分支是携带旧内容的错误情形。
  - case 要求任何消费和类型缓冲区的函数也必须产生和类型输出。
explanation: >-
  Aᑉⁿ 正是长度严格小于 n 的列表类型，
  因此处于最大容量的缓冲区容纳 n−1 个元素。再 push 一个元素
  会恰好产生 n 个元素，而 Aᑉⁿ 无法表示；Aⁿ 这个加项
  会把该溢出结果作为完整向量返回。把溢出编码在
  输出类型中，使 push-<n 成为全函数，而不是偏函数
  —— 空缓冲区失败情形属于 pop-<n，而不是 push。
