question: "마이클 오크숏은 자신의 철학적 작업에서 보수주의를 어떻게 특징지었나요?"
answer: "경직된 체계적 이데올로기가 아니라 삶에 대한 기질과 성향으로"
wrong_answers:
  - "정부의 모든 영역에 대해 정밀한 정책 처방을 가진 포괄적 경제 이론으로"
  - "현대 제도를 해체하고 산업화 이전 사회로 돌아가려는 혁명 운동으로"
  - "기독교 신학과 교회 권위에 근거한 순수한 종교 교리로"
explanation: >-
  영국 철학자 마이클 오크숏은 보수주의를 체계적 이데올로기가 아니라 기질로 보는 개념을 옹호했습니다. 그의 에세이 『보수적이라는 것에 관하여』(1956)는 여전히 중요한 참고 문헌입니다. 보수주의를 성향으로 보는 이러한 관점은 프리드리히 하이에크에게도 영향을 주었습니다. 오크숏의 접근은 정치에서의 합리주의를 비판하고, 정치가 하나의 체계로 환원될 수 있다는 생각을 거부한다는 점에서 주목할 만합니다.
reviewed: false
