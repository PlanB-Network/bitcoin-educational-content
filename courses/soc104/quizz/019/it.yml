question: "Quale obiettivo politico condiviso hanno gli statalisti di sinistra e di destra?"
answer: "Conquistare il potere per organizzare la società secondo la loro visione del mondo e imporla a tutti"
wrong_answers:
  - "Ridurre le dimensioni del governo e restituire il potere decisionale ai singoli cittadini"
  - "Stabilire una democrazia diretta in cui ogni cittadino vota su ogni decisione legislativa"
  - "Eliminare i partiti politici e sostituirli con una governance tecnocratica indipendente"
explanation: >-
  Gli statalisti di sinistra e di destra condividono lo stesso obiettivo politico: conquistare il potere per organizzare la società secondo la loro visione del mondo e imporla a tutti attraverso la legislazione. La differenza sta solo nei loro valori: la destra invoca la difesa della civiltà, mentre la sinistra invoca la difesa della classe lavoratrice o degli oppressi. Nessuna delle due cerca di ridurre il governo o eliminare i partiti.
