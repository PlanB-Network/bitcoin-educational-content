question: "Apa konsep 'spontaneous order' sebagaimana dijelaskan oleh Friedrich Hayek?"
answer: "Aturan dan norma sosial seharusnya muncul dari interaksi individu yang bebas, bukan dipaksakan oleh perencanaan otoriter"
wrong_answers:
  - "Pasar secara alami cenderung menuju monopoli kecuali negara campur tangan untuk menjaga keseimbangan kompetitif"
  - "Pemilihan demokratis adalah satu-satunya mekanisme sah untuk menetapkan hukum yang mengatur masyarakat"
  - "Krisis ekonomi muncul secara spontan dan membutuhkan intervensi pemerintah segera untuk memulihkan stabilitas"
explanation: >-
  Konsep spontaneous order Hayek menyatakan bahwa aturan yang mengatur masyarakat tidak boleh dipaksakan dari atas oleh perencanaan pusat, melainkan harus muncul dari permainan bebas kehendak individu, kontrak, dan hubungan sukarela. Ini adalah poros fundamental pemikiran libertarian. Konsep ini tidak menyiratkan bahwa pasar cenderung menuju monopoli atau bahwa krisis membutuhkan intervensi pemerintah.
