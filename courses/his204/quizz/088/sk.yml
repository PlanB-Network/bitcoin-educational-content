question: S ktorým členom fyziokratickej školy Condillac diskutoval o povahe hodnoty vecí?
answer: Guillaume-François Le Trosne
wrong_answers:
  - François Quesnay
  - Pierre-Samuel Dupont de Nemours
  - Markíz de Mirabeau
explanation: |
  Condillac diskutoval o povahe hodnoty s Le Trosnom, pričom obhajoval subjektívnu teóriu hodnoty.
