question: "ลิเบอร์ทาเรียนวางสิ่งใดไว้ที่ศูนย์กลางของปรัชญาการเมืองของตน?"
answer: "จริยธรรมและกฎหมาย"
wrong_answers:
  - "การเติบโตทางเศรษฐกิจและการสร้างความมั่งคั่ง"
  - "ความเท่าเทียมทางสังคมและสวัสดิการส่วนรวม"
  - "อัตลักษณ์ชาติและการรักษาวัฒนธรรม"
explanation: >-
  ลิเบอร์ทาเรียนแยกตนเองออกจากกลุ่มการเมืองอื่นทั้งหมดด้วยการวางจริยธรรมและกฎหมายไว้ที่ศูนย์กลางของปรัชญา ไม่ใช่เศรษฐกิจ เมื่อพวกเขาปกป้องเศรษฐกิจตลาด นั่นไม่ใช่เพราะความสามารถในการสร้างความมั่งคั่งมากเท่ากับเพราะมันส่งเสริมเสรีภาพและความรับผิดชอบส่วนบุคคล การเติบโตทางเศรษฐกิจเป็นประโยชน์รอง ไม่ใช่หลักการพื้นฐาน
reviewed: false
