question: "Hur behandlar konservatism friheter inom de ekonomiska och samhälleliga sfärerna?"
answer: "Starka friheter i den ekonomiska sfären men svaga friheter i den samhälleliga sfären"
wrong_answers:
  - "Svaga friheter i både den ekonomiska och samhälleliga sfären för att upprätthålla traditionell social ordning"
  - "Starka friheter i den samhälleliga sfären men svaga friheter i den ekonomiska sfären"
  - "Lika och obegränsade friheter i båda sfärerna med minimal statlig intervention av något slag"
explanation: >-
  Konservatism uppvisar en dikotomi som är socialismens spegelbild. På det ekonomiska området försvarar konservativa den fria marknaden, entreprenörskap och privat egendom. På det samhälleliga området motiveras begränsningar med bevarandet av traditionella moraliska normer och social stabilitet. Det tredje felaktiga svaret beskriver det socialistiska mönstret, vilket är motsatsen.
