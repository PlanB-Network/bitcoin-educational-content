question: "Kako tri suštinske funkcije slobodnog tržišta, kako ih opisuju libertarijanci, zajedno čine i efikasan i etički sistem društvene organizacije?"
answer: "Cene pružaju kompas za odluke, tržište otkriva autentične preferencije kroz ponudu i tražnju, a slobodna razmena omogućava pojedincima da određuju sopstvene poslove prema ličnim vrednostima, spajajući informacionu efikasnost sa moralnom autonomijom"
wrong_answers:
  - "Tržište maksimizuje ukupno bogatstvo, sprečava monopole kroz prirodnu konkurenciju i obezbeđuje jednaku raspodelu resursa, spajajući produktivnost sa socijalnom pravdom"
  - "Slobodna tržišta smanjuju državnu potrošnju, podstiču tehnološke inovacije i stvaraju prilike za zaposlenje, spajajući fiskalnu odgovornost sa ekonomskim rastom"
  - "Tržišta snižavaju potrošačke cene, povećavaju kvalitet proizvoda kroz konkurenciju i šire međunarodnu trgovinu, spajajući domaći prosperitet sa globalnom saradnjom"
explanation: >-
  Libertarijanski argument za slobodno tržište počiva na tri međusobno povezane funkcije. Prvo, cene služe kao pouzdani pokazatelji koji usmeravaju ekonomske i društvene odluke (kompas). Drugo, tržište otkriva autentične individualne preferencije kroz ponudu i tražnju. Treće, slobodna razmena omogućava akterima da određuju sopstvene poslove prema ličnim vrednostima. Hayek je pokazao da slobodna tržišta koordinišu raspršene informacije bolje od centralnog planiranja (efikasnost), dok uzajamni pristanak poštuje ljudsko dostojanstvo više nego prinuda (pravda).
reviewed: false
