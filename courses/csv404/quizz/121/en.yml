question: "What API endpoint is used to generate a new receiving address for Taproot Assets?"
answer: "POST /v1/taproot-assets/addrs"
wrong_answers:
  - "POST /v1/taproot-assets/addresses/new"
  - "GET /v1/taproot-assets/addrs/generate"
  - "POST /v1/taproot-assets/wallet/newaddress"
explanation: >-
  The receiving address is generated by sending a POST request to /v1/taproot-assets/addrs with a JSON payload containing the asset_id and amt fields. The response includes an encoded field containing the TAP address string that can be used for the transfer. The endpoint follows RESTful conventions where POST creates a new resource.
reviewed: false
