question: "Care este conceptul de 'ordine spontană' așa cum este descris de Friedrich Hayek?"
answer: "Regulile și normele sociale ar trebui să apară din interacțiunile libere dintre indivizi, nu să fie impuse prin planificare autoritară"
wrong_answers:
  - "Piețele tind în mod natural spre monopol dacă statul nu intervine pentru a menține echilibrul concurențial"
  - "Alegerile democratice sunt singurul mecanism legitim pentru stabilirea legilor care guvernează societatea"
  - "Crizele economice apar spontan și necesită intervenția imediată a guvernului pentru a restabili stabilitatea"
explanation: >-
  Conceptul de ordine spontană al lui Hayek susține că regulile care guvernează societatea nu ar trebui impuse de sus prin planificare centrală, ci ar trebui să apară din jocul liber al voințelor individuale, al contractelor și al relațiilor voluntare. Acesta este un ax fundamental al gândirii libertariene. Nu implică faptul că piețele tind spre monopol sau că crizele necesită intervenția guvernului.
reviewed: false
