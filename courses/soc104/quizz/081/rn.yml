question: "Ni ikihe kintu nyamukuru aba libertarian batumvikanako n'iyindi miryango ya politike igihe basangiye intumbero zimwe?"
answer: "Ukutumvikana kuri ku buryo bwo gushika ku ntumbero: aba libertarian banka inyishu zishingiye ku gahato bagashigikira uguhanahana ku bushake biciye mu nzira y'isoko"
wrong_answers:
  - "Ukutumvikana kuri ku mpera: aba libertarian bakurikirana intumbero zitandukanye nk'ubutunzi bw'umuntu ku giti ciwe aho gukurikirana ineza y'imibano"
  - "Ukutumvikana kuri ku gihe: aba libertarian bashaka gushika ku ntumbero zimwe buhorobuhoro biciye mu mavugurura make make"
  - "Ukutumvikana kuri ku rugero: aba libertarian bashaka gukoresha politike zimwe ku rwego rw'aho umuntu aba gusa aho kuzishira ku rwego rw'igihugu"
explanation: >-
  Aba libertarian barashobora kwemeranya n'abasosiyaliste, abakonserevateri, n'aba centrist ku ntumbero zimwe nko kuburanira abahahazwa canke guteza imbere ubumwe bw'imibano. Ukutumvikana ntikuri ku mpera, ahubwo kuri ku buryo bwo kuzishikako. Aba libertarian banka inyishu zose z'agahato zishaka guhuza ingeso n'amabwirizwa ku nguvu, ahubwo bakaburanira ububasha bwo guhitamwo n'ubwisanzure bufise inshingano biciye mu guhanahana kwidegemvya, kwegerejwe abantu, gushingiye ku masezerano y'ubushake.
