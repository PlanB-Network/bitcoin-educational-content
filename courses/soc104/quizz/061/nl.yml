question: "Wat onthult Mussolini's verklaring uit 1920 'Alles in de Staat, niets buiten de Staat, niets tegen de Staat' over totalitarisme?"
answer: "Er is geen scheiding meer tussen publieke en private ruimte, omdat de staat de samenleving volledig absorbeert"
wrong_answers:
  - "De staat richt zich uitsluitend op militaire macht en laat de economie over aan particulier ondernemerschap"
  - "Burgers zijn vrij om zich privé te organiseren zolang ze de regering niet openlijk bekritiseren"
  - "De regering controleert alleen politieke activiteit, terwijl het culturele en religieuze leven autonoom blijft"
explanation: >-
  Mussolini's verklaring vat de essentie van totalitarisme samen: totaliteit. Alles wordt door de staat geabsorbeerd, wat betekent dat er geen scheiding is tussen publieke en private ruimte. De samenleving verliest elke vorm van autonomie, tot aan de meest alledaagse activiteiten zoals het openen van een sportclub. Dit gaat veel verder dan alleen het controleren van militaire, politieke of economische sferen.
