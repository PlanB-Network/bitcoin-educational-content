question: "Warum begannen klassische Liberale in den Vereinigten Staaten ab den 1960er Jahren, sich 'Libertäre' zu nennen?"
answer: "Um sich von amerikanischen Liberalen zu unterscheiden, bei denen sich die Bedeutung des Begriffs in Richtung staatlichen Interventionismus verschoben hatte"
wrong_answers:
  - "Um sich mit der Democratic Party und ihren progressiven Sozialprogrammen zu verbünden"
  - "Um ihre Unterstützung für Lyndon B. Johnsons Great-Society-Reformen zu signalisieren"
  - "Um eine radikalere revolutionäre Identität anzunehmen, inspiriert von europäischen sozialistischen Bewegungen"
explanation: >-
  In den Vereinigten Staaten verschob sich das Wort 'liberal' hin zur Bedeutung von Befürwortern von Big Government und staatlicher Intervention, insbesondere nach dem New Deal und der Great Society. Klassische Liberale übernahmen die Bezeichnung 'Libertäre', um die ursprüngliche Bedeutung ihrer Philosophie zu bewahren. Sie distanzierten sich von amerikanischen Liberalen, statt sich mit ihnen zu verbünden.
reviewed: false
