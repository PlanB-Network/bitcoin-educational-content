question: "Jaký je libertariánský postoj k otázce homosexuálního manželství?"
answer: "Stát nemá co definovat manželství; mělo by být privatizováno a ponecháno jednotlivcům, sdružením a náboženským institucím"
wrong_answers:
  - "Homosexuální manželství by mělo být legalizováno, protože všichni občané si zaslouží rovné zacházení před zákonem"
  - "Homosexuální manželství by mělo být zakázáno, protože tradiční manželství je základní institucí pro plození"
  - "Homosexuální manželství by mělo být legalizováno, ale pouze prostřednictvím samostatného právního rámce odlišného od tradičního manželství"
explanation: >-
  Libertariáni tvrdí, že otázka manželství je zásadně špatně zarámována, protože je položena etatisticky. Domnívají se, že stát nemá co zasahovat do soukromého života, takže řešením je manželství od státu zcela oddělit. Tím, že stát vnucuje jedinou definici, vytváří konflikty. První chybná odpověď odráží socialistickou nebo centristickou pozici a druhá konzervativní pozici.
