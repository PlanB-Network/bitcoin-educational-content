question: "國家資助的社會救助計畫如何可能產生反效果，從而說明只依賴意圖的危險？"
answer: "它們可能造成依賴、移除工作的誘因，並且等同於掠奪，因為資金必須先從創造財富的人手中取得"
wrong_answers:
  - "它們鼓勵過度個人儲蓄、降低消費支出，並在整體經濟中造成通貨緊縮"
  - "它們把勞動成本轉移給政府並降低對競爭性工資的需求，從而強化私人企業"
  - "它們徹底消除階級區分，以至於社會流動變得不必要，創新也停滯"
explanation: >-
  Friedman 警告，當慷慨的意圖忽略對人類誘因的嚴格分析時，可能產生有害後果。國家資助的救助計畫有造成依賴、產生沒有工作誘因、並構成某種掠奪形式的風險，因為資金必須先從財富生產者手中取得。減少貧困與效率等可衡量結果，必須優先於高尚意圖。
reviewed: false
