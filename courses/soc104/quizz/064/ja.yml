question: "全体主義体制が「世俗宗教」と呼ばれてきたのはなぜであり、それは全体主義が存在するために必要な条件について何を明らかにしていますか？"
answer: "それらは闘士に準宗教的な信仰を要求し、反対者には恐怖を用いる。そして全体主義には、自由の抑圧、一党支配、暴力革命、指令経済というすべての特徴が同時に必要である"
wrong_answers:
  - "それらは伝統的な礼拝を国家儀式に置き換え、全体主義にはカリスマ的指導者と軍事統制だけが必要である"
  - "それらは宗教制度を使って国家イデオロギーを強制し、単一政党が議会を支配すればいつでも全体主義が生じ得る"
  - "それらは政治的行動を通じた精神的救済を約束し、政治的自由に関係なく国家が経済を統制すれば全体主義が存在する"
explanation: >-
  Raymond Aron は、全体主義体制は 2 つの原理、すなわち闘士の信仰と反対者の恐怖に基づいて機能すると観察しました。この準宗教的な狂信は、それぞれの動機の違いを超えてそれらを特徴づけ、世俗宗教という呼び名をもたらしました。重要なのは、全体主義には定義的特徴がすべて同時に必要だということです。自由の抑圧、一党を通じた無制限の権威、暴力革命、そして指令経済です。現代民主主義はこれらの特徴の一部を示すことがあるかもしれませんが、全体主義が存在するのは、それらすべてが同時に組み合わされた場合だけです。
reviewed: false
