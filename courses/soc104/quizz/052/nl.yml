question: "Wat is het belangrijkste verschil tussen minarchisten en anarcho-kapitalisten binnen het libertarianisme?"
answer: "Minarchisten accepteren een minimale staat voor defensie, justitie en politie, terwijl anarcho-kapitalisten alle staatsfuncties willen privatiseren"
wrong_answers:
  - "Minarchisten verwerpen elke vorm van overheid, terwijl anarcho-kapitalisten beperkte staatsregulering van markten accepteren"
  - "Minarchisten zijn voor progressieve belastingheffing voor essentiële diensten, terwijl anarcho-kapitalisten alle belastingheffing afwijzen"
  - "Minarchisten richten zich alleen op economische vrijheid, terwijl anarcho-kapitalisten zowel economische als maatschappelijke vrijheden verdedigen"
explanation: >-
  Minarchisten geloven dat de staat beperkt moet blijven tot kernfuncties zoals defensie, justitie en politie (de "nachtwakersstaat"), terwijl anarcho-kapitalisten betogen dat zelfs deze functies geprivatiseerd en beheerd moeten worden via vrijwillige marktconcurrentie. Hun meningsverschil gaat meer over praktische uitvoering dan over fundamentele ethische principes. Beide stromingen delen dezelfde libertarische waarden van zelfeigenaarschap en non-agressie.
reviewed: false
