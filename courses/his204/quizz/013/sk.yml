question: Čo vyčíta "dobrým dušiam"?
answer: Že spôsobujú biedu tým, že vynucujú stále nízke ceny
wrong_answers:
  - Že podporujú poľnohospodárstvo na účet manufaktúr
  - Že príliš nedbalo vynakladajú verejné peniaze na podporu chudobných
  - Že chudobným nepomáhajú dosť
explanation: |
  Boisguilbert kritizoval tých, ktorí sa snažili udržiavať ceny umelo nízke; veril, že to odrádza od výroby, vytvára nedostatok a v konečnom dôsledku spôsobuje biedu. Bol presvedčený, že ceny má určovať trh, podľa ponuky a dopytu.
