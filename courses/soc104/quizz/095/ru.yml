question: "Как Bitcoin функционирует как моральный проект с политическими последствиями, а не как политический проект с моральными притязаниями?"
answer: "Bitcoin был создан, чтобы делать людей свободными, а не богатыми: он обеспечивает эффективную собственность, защищает ценность труда и сохраняет приватность — моральные достижения, которые производят политические эффекты, не претендуя на принадлежность к какому-либо политическому лагерю"
wrong_answers:
  - "Bitcoin является моральным проектом, потому что его код закрепляет этические правила, предотвращающие мошенничество, а его политическое последствие — замена демократического управления алгоритмическим принятием решений"
  - "Bitcoin функционирует как моральный проект, потому что перераспределяет богатство от богатых к ранним пользователям, создавая более справедливое общество с политическими последствиями для налоговой политики"
  - "Bitcoin морален, потому что Сатоши Накамото встроил в протокол этические заповеди, а его политическое последствие — объединение всех политических семей вокруг общей денежной системы"
explanation: >-
  Bitcoin был создан не для того, чтобы делать людей богатыми, а для того, чтобы делать их свободными. Он достигает трёх моральных результатов: обеспечивает эффективную собственность (поощряя ответственность), защищает ценность, созданную трудом (поощряя продуктивное усилие), и сохраняет приватность (позволяя людям жить без страха). Это моральные достижения, которые несут политические последствия, не принадлежа ни к какому политическому лагерю, что делает его прежде всего моральным проектом и лишь затем политическим.
reviewed: false
