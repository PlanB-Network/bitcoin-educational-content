question: "Por que Popper argumenta que a sociedade aberta permanece inerentemente frágil apesar de suas vantagens?"
answer: "Porque a responsabilidade que o individualismo implica pode parecer assustadora, criando uma tentação de buscar refúgio na proteção comunitária, na autoridade ou na nostalgia de um passado idealizado"
wrong_answers:
  - "Porque sociedades abertas carecem de força militar e não conseguem se defender contra invasões por sociedades fechadas"
  - "Porque instituições democráticas são inerentemente ineficientes e acabam colapsando sob o peso da complexidade burocrática"
  - "Porque sociedades abertas permitem desigualdade econômica demais, o que inevitavelmente leva à revolução e à instalação de regimes autoritários"
explanation: >-
  Popper enfatiza que a fragilidade da sociedade aberta decorre de uma vulnerabilidade psicológica. A responsabilidade que o individualismo implica pode parecer assustadora e arriscada porque é preciso fazer as próprias escolhas e pode-se fracassar. Isso cria a tentação de buscar refúgio na proteção comunitária ou em tendências nostálgicas voltadas a um passado idealizado. A sociedade aberta enfrenta desafios contínuos vindos de impulsos comunitaristas e da tentação recorrente da violência.
