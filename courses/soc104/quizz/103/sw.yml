question: "Kozi inadaije kwamba uhuru huruhusu thamani za mrengo wa kushoto na mrengo wa kulia kuishi pamoja kwa amani?"
answer: "Katika utaratibu wa uhuru wa kweli, watu wenye maadili ya mrengo wa kushoto wanaweza kushiriki mali kwa hiari na kugawa upya fedha, ilhali wenye maadili ya mrengo wa kulia wanaweza kuweka akiba na kurithisha mila, bila upande wowote kulazimisha namna yake ya maisha kwa upande mwingine"
wrong_answers:
  - "Uhuru huhitaji pande zote mbili zikubali maelewano kwa kupokea msimamo wa kati ambapo serikali husawazisha thamani zinazoshindana kupitia udhibiti wa wastani"
  - "Uhuru humaanisha kwamba jamii za mrengo wa kushoto na mrengo wa kulia lazima ziishi katika maeneo tofauti ya kijiografia zikiwa na serikali zao huru"
  - "Uhuru hufanya kazi kwa kuruhusu raia kupiga kura kuhusu thamani zipi zinapaswa kutekelezwa katika kila eneo, zikibadilishana kati ya sera za mrengo wa kushoto na mrengo wa kulia kila mzunguko wa uchaguzi"
explanation: >-
  Kozi inaonyesha kwamba katika utaratibu wa kweli wa uhuru, wale wanaofuata maadili ya mrengo wa kushoto wanaweza kwa hiari kuacha mali, kushiriki njia za uzalishaji, au kuchangia mishahara kwa mashirika ya ugawaji upya. Wale wenye maadili ya mrengo wa kulia wanaweza kufanya kazi kwa bidii, kuweka akiba, na kurithisha thamani za kifamilia. Hakuna anayepaswa kulazimisha namna yake ya maisha kwa wengine. Ni kupitia uhuru wa soko na nguvu ya uchaguzi ndipo malengo yanaweza kufikiwa kwa amani.
