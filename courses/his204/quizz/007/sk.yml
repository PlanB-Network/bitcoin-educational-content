question: Prečo sa daňový systém ancien régime opisuje ako "odrádzajúci"?
answer: Pretože človek, ktorý len o málo zbohatol, mohol byť na ďalší rok zdanený dvojnásobne
wrong_answers:
  - Pretože jeho zložitosť odrádzala daňových výbercov od vyberania daní
  - Pretože jeho miernosť odrádzala Francúzov od úteku do zahraničia
  - Pretože bol príliš jednoduchý a predvídateľný
explanation: |
  Zdaňovanie za ancien régime bolo často svojvoľné a nepredvídateľné. Absencia jasných pravidiel a možnosť nadmerného zdanenia odrádzali od investovania a bohatnutia, pretože daň mohla zisky zhabať.
