question: "National Assembly में Frederic Bastiat के वोटों को कौन-सा मार्गदर्शक सिद्धांत चला रहा था?"
answer: "व्यक्तिगत और आर्थिक स्वतंत्रताओं को बढ़ावा देना और सरकारी हस्तक्षेप को कम करना"
wrong_answers:
  - "राजसत्ता की रक्षा और राजतंत्रीय परंपराओं का संरक्षण"
  - "धन को अधिक समान रूप से पुनर्वितरित करने के लिए समाजवादी नीतियों को आगे बढ़ाना"
  - "वाम और दक्षिण गुटों के बीच समझौते की मध्यमार्गी रणनीति"
explanation: >-
  Bastiat ने एक मूल सिद्धांत के आधार पर वोट किया: सरकारी हस्तक्षेप को कम करते हुए व्यक्तिगत और आर्थिक स्वतंत्रताओं को बढ़ावा देना। वे न तो मध्यमार्गी अवसरवादी थे, न राजतंत्रवादी और न समाजवादी। उन्होंने उस पक्ष के साथ वोट किया जिसने स्वतंत्रता और सीमित सरकार के अनुरूप उपाय प्रस्तावित किए।
reviewed: false
