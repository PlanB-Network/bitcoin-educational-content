question: "Jak systém fiat peněz posiluje dělení mezi vládci a ovládanými?"
answer: "Umožňuje vládám financovat neomezené výdaje tvorbou peněz, což znehodnocuje úspory prostřednictvím inflace"
wrong_answers:
  - "Dává občanům přímou kontrolu nad měnovou politikou prostřednictvím demokratických voleb a referend"
  - "Brání vládám v půjčování, takže je nutí spoléhat se u příjmů výhradně na zdanění"
  - "Rozděluje nově vytvořené peníze rovnoměrně mezi všechny občany, aby stimuloval ekonomický růst"
explanation: >-
  Fiat měna je popsána jako základní kámen expanze státní moci, protože umožňuje vládám půjčovat si a tlačit banky k tisku nových peněz. Výsledná inflace znehodnocuje úspory lidí a zvýhodňuje nejbohatší a nejmocnější entity. Nedává občanům měnovou kontrolu, nebrání půjčování ani nerozděluje peníze rovnoměrně.
