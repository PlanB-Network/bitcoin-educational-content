bio: |
  Cu un parcurs academic în Fizică și cu experiență ca consultant tehnologic, din 2013 Giacomo Zucco s-a reinventat ca antreprenor activ în domeniul Bitcoin (BSolutions, Coincapital, Bitsource, Greenaddress, inBitcoin, Blockchainlab, 0301, BTCTimes, Bcademy, BHB Network) și organizator de evenimente (Milan Bitcoin Meetup, conferințele Scaling Bitcoin, conferințele Understanding Bitcoin). De asemenea, a lucrat ca și consultant și formator independent și a sprijinit ingineri în crearea mai multor standarde deschise (precum BOLT, OTS, RGB, BDK).
  
  Este în continuare implicat ca consultant și micro-investitor în numeroase companii și organizații legate de Bitcoin (OCEAN, Relai, Satsback, Xsats, Geyser, Invebit, Lightning Ventures, Breez, LNP-BP Association, Plan B Foundation), însă principalul său obiectiv începând din 2024 este inițiativa Plan B Network.
  
short_bio: Sunt Giacomo Zucco