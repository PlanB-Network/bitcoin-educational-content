question: "Hvordan skiller rollene til Cato Institute, Mises Institute og Libertarian Party seg innenfor den libertarianske bevegelsen?"
answer: "Cato Institute fokuserer på offentlige politiske forslag, Mises Institute på utdanning og akademisk publisering, og Libertarian Party på valgpolitikk"
wrong_answers:
  - "Cato Institute finansierer politiske kampanjer, Mises Institute driver direkte lobbyvirksomhet overfor Kongressen, og Libertarian Party organiserer akademiske konferanser"
  - "Cato Institute utgir økonomiske lærebøker, Mises Institute driver velgerregistreringskampanjer, og Libertarian Party utarbeider lovforslag"
  - "Cato Institute organiserer grasrotprotester, Mises Institute tilbyr juridisk forsvar for libertarianere, og Libertarian Party styrer tenketankforskning"
explanation: >-
  Cato Institute (grunnlagt 1977) er en Washington-basert tenketank som arbeider med offentlige politiske forslag. Mises Institute (grunnlagt 1982) fokuserer på utdanning snarere enn politisk lobbyvirksomhet, og fungerer som en slags nettbasert universitet med konferanser og nyutgitte verk. Libertarian Party (grunnlagt 1971) er det tredje største amerikanske politiske partiet, og deltar i valg der selv dets omtrent 2 % stemmeandel kan vippe utfall.
reviewed: false
