question: "How does George W. Bush's response to the 2008 financial crisis illustrate the 'problematic flexibility' of conservative principles?"
answer: "He abandoned free-market principles to bail out major banks, revealing the conservative view of the state as the ultimate guarantor of national economic stability"
wrong_answers:
  - "He refused all government intervention and allowed the banks to fail, strictly adhering to free-market ideology regardless of consequences"
  - "He nationalized the banking sector permanently and introduced progressive taxation, shifting from conservatism to democratic socialism"
  - "He responded by cutting all government spending and eliminating financial regulations to let the market self-correct"
explanation: >-
  Bush declared he had 'abandoned free-market principles to save the free-market system' by intervening to bail out the major banks. This illustrates how conservatives can prioritize the power and continuity of the nation above abstract market principles. The same flexible logic appears in Trump's protectionist trade policies, pursued in the name of national interest at the risk of fueling corporatism and crony capitalism.
reviewed: false
