question: "Perché l'inflazione monetaria è descritta come una tassa nascosta imposta senza il consenso dei cittadini?"
answer: "Perché la creazione di denaro da parte del governo svaluta la valuta, così le persone possono comprare meno con la stessa quantità, ma la maggior parte non si rende conto che l'aumento dei prezzi riflette una politica governativa anziché forze naturali di mercato"
wrong_answers:
  - "Perché le banche centrali addebitano segretamente commissioni su ogni transazione elaborata attraverso il sistema bancario senza comunicarle ai titolari dei conti"
  - "Perché i governi stampano denaro e lo distribuiscono solo agli individui ricchi, tassando i poveri tramite imposte sulle vendite più alte sui beni essenziali"
  - "Perché l'inflazione è causata dalle aziende private che aumentano i prezzi per incrementare i profitti, funzionando come una tassa non ufficiale sui consumatori"
explanation: >-
  L'immissione di denaro nel sistema si traduce in svalutazione della valuta, per cui la stessa quantità compra meno, perché il nuovo denaro non riflette una crescita economica autentica. La maggior parte delle persone non vede che la politica governativa ha portato all'aumento dei prezzi, che sono semplicemente il riflesso della svalutazione della valuta. Questo equivale a furto legale e spoliazione istituzionalizzata, impoverendo la classe media mentre i ricchi catturano il nuovo denaro attraverso asset speculativi.
