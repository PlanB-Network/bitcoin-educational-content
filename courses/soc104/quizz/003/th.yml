question: "ทำไมแกนซ้าย-ขวาจึงถือว่าไม่เพียงพอสำหรับการจัดวางนักคิดเสรีนิยมคลาสสิกอย่าง Bastiat หรือ Ron Paul?"
answer: "เพราะเสรีนิยมคลาสสิกให้คุณค่าทั้งเสรีภาพทางเศรษฐกิจและเสรีภาพส่วนบุคคล ซึ่งทั้งฝ่ายซ้ายและฝ่ายขวาต่างก็ไม่ได้ยอมรับอย่างครบถ้วน"
wrong_answers:
  - "เพราะเสรีนิยมคลาสสิกมักสอดคล้องกับนโยบายเศรษฐกิจฝ่ายขวาเสมอและปฏิเสธจุดยืนฝ่ายซ้ายทั้งหมด"
  - "เพราะเสรีนิยมคลาสสิกเป็นพวกสายกลางที่รับเอาอุดมการณ์ฝ่ายซ้ายและฝ่ายขวาในรูปแบบปานกลางมาใช้"
  - "เพราะเสรีนิยมคลาสสิกต่อต้านรัฐบาลทุกรูปแบบ ทำให้พวกเขาเป็นอนาธิปไตยมากกว่านักคิดการเมือง"
explanation: >-
  แกนซ้าย-ขวาใช้ไม่ได้กับเสรีนิยมคลาสสิก เพราะมันไม่สามารถรองรับจุดยืนที่ปกป้องเสรีภาพทางเศรษฐกิจ (โดยทั่วไปอยู่ทางขวา) และเสรีภาพส่วนบุคคล (โดยทั่วไปอยู่ทางซ้าย) พร้อมกันได้ เสรีนิยมคลาสสิกไม่ใช่สายกลางที่แสวงหาการประนีประนอม และไม่ใช่อนาธิปไตยหรือฝ่ายขวาล้วน ๆ พวกเขาเพียงไม่เข้ากับสเปกตรัมมิติเดียว
reviewed: false
