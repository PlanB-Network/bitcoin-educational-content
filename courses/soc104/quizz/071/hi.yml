question: "स्वास्थ्य सेवा पर समाजवादी स्थिति क्या है?"
answer: "स्वास्थ्य सेवा तक पहुंच एक मूलभूत अधिकार है, और राज्य को आय की परवाह किए बिना सभी के लिए सार्वभौमिक, सार्वजनिक रूप से वित्तपोषित व्यवस्था की गारंटी देनी चाहिए"
wrong_answers:
  - "स्वास्थ्य सेवा मिश्रित व्यवस्था होनी चाहिए, जिसमें मूल राज्य कवरेज के साथ निजी बीमा विकल्प पूरक हों"
  - "निजी बाज़ार अधिक नवोन्मेषी स्वास्थ्य सेवा देते हैं, इसलिए व्यक्तियों को अपनी व्यवस्था स्वतंत्र रूप से चुननी चाहिए"
  - "राज्य को केवल सबसे गरीब नागरिकों के लिए स्वास्थ्य सेवा देनी चाहिए, जबकि निजी बीमा बाकी सभी को कवर करे"
explanation: >-
  समाजवादियों के लिए स्वास्थ्य सेवा तक पहुंच एक मूलभूत अधिकार है, कोई वस्तु नहीं। राज्य को सार्वभौमिक, सार्वजनिक रूप से वित्तपोषित स्वास्थ्य सेवा व्यवस्था की गारंटी देनी चाहिए ताकि आय की परवाह किए बिना सभी को देखभाल तक पहुंच मिले। यह समानता, सामाजिक न्याय और सामान्य हित में सेवाओं को संगठित करने में राज्य के महत्व के प्रति समाजवादी चिंता को दर्शाता है। मिश्रित व्यवस्था मध्यमार्गी दृष्टिकोण को बताती है, जबकि चयन-आधारित दृष्टिकोण लिबर्टेरियन और कंजरवेटिव स्थितियों को दर्शाते हैं।
reviewed: false
