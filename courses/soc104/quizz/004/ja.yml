question: "左派政党と右派政党は、見かけ上は対立しているにもかかわらず、どのような共通点を持っていますか？"
answer: "どちらも規制と税によって人々の生活を統治する国家の権利を擁護する"
wrong_answers:
  - "どちらも経済問題への国家介入の完全な廃止を主張する"
  - "どちらも社会の集団的組織化より個人の自由を優先する"
  - "どちらも政府支出の手段として金融政策を用いることを拒否する"
explanation: >-
  対立しているように見えても、左派と右派は国家介入を好む点を共有しています。どちらも自由市場を批判し、規制と税によって人々の生活を統治する国家の権利を擁護します。左派は市場を不平等の源として批判し、右派は市場を主権への脅威と見なしますが、どちらも解決策を国家に求めます。
reviewed: false
