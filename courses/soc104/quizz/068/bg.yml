question: "По въпроса за регулацията на огнестрелните оръжия каква е решаващата разлика между консервативната и либертарианската позиция?"
answer: "И двете приемат известна регулация, но консерваторите искат правила от легитимна публична власт, докато либертарианците искат правилата да възникват от пряко засегнатите, като граждански асоциации и пазарна конкуренция"
wrong_answers:
  - "Консерваторите се противопоставят на всяка регулация на огнестрелните оръжия, докато либертарианците приемат строг правителствен контрол в името на обществената безопасност"
  - "Консерваторите искат да забранят огнестрелните оръжия изцяло, докато либертарианците подкрепят неограничен достъп до всички оръжия"
  - "Консерваторите основават позицията си на индивидуални права, докато либертарианците основават своята на колективна отговорност"
explanation: >-
  И консерваторите, и либертарианците са съгласни, че някаква форма на регулация за носенето на оръжия е необходима. Решаващата разлика е в това кой установява тези правила. Консерваторите настояват регулациите да идват от публична власт, натоварена със защитата на общото благо (отгоре надолу). Либертарианците твърдят, че регулацията трябва да възниква от пряко засегнатите: професионалисти по сигурността, граждански асоциации и пазарна конкуренция (отдолу нагоре).
reviewed: false
