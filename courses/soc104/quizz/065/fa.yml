question: "موضع لیبرتارین درباره مسئله ازدواج همجنس‌گرایان چیست؟"
answer: "دولت هیچ کاری به تعریف ازدواج ندارد؛ ازدواج باید خصوصی‌سازی شود و به افراد، انجمن‌ها و نهادهای دینی واگذار گردد"
wrong_answers:
  - "ازدواج همجنس‌گرایان باید قانونی شود، زیرا همه شهروندان سزاوار رفتار برابر در برابر قانون هستند"
  - "ازدواج همجنس‌گرایان باید ممنوع شود، زیرا ازدواج سنتی نهادی بنیادی برای فرزندآوری است"
  - "ازدواج همجنس‌گرایان باید قانونی شود، اما فقط از طریق یک چارچوب حقوقی جداگانه و متمایز از ازدواج سنتی"
explanation: >-
  لیبرتارین‌ها استدلال می‌کنند که مسئله ازدواج اساساً نادرست چارچوب‌بندی شده است، زیرا با واژگان دولت‌گرایانه مطرح می‌شود. آن‌ها معتقدند دولت هیچ حقی برای دخالت در زندگی خصوصی ندارد، بنابراین راه‌حل این است که ازدواج کاملاً از دولت جدا شود. دولت با تحمیل یک تعریف واحد، تعارض ایجاد می‌کند. پاسخ نادرست نخست موضع سوسیالیستی یا میانه‌رو را بازتاب می‌دهد، و پاسخ دوم موضع محافظه‌کارانه را.
reviewed: false
