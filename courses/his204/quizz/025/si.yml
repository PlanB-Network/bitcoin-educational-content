question: Abbé de Saint-Pierre අනුව, හුවමාරුව සෑම විටම සහ අවශ්‍යයෙන්ම ධනාත්මක-එකතුවේ ක්‍රීඩාවක් වන්නේ ඇයි?
answer: මිනිසුන් දෙදෙනෙකු නිදහසේ ගිවිසුමකට ඇතුළුවීමට තෝරාගන්නේ නම්, එයට හේතුව ඔවුන් දෙදෙනාම එසේ කිරීමෙන් වාසියක් දකින නිසාය
wrong_answers:
  - භාණ්ඩ අත් මාරු වන වාර ගණන වැඩි වන තරමට ජාතිය වඩා ධනවත් වේ
  - වෙළඳාම් කරන ජාතියක් autarky තුළ ජීවත් වන ජාතියකට වඩා සැමවිටම ධනවත්ය
  - දෙවියන්ට එය අවශ්‍ය නිසා
explanation: |
  අනෙකුත් liberal චින්තකයන් මෙන්ම Abbé de Saint-Pierreද ස්වේච්ඡා හුවමාරුව දෙපාර්ශ්වයටම ප්‍රයෝජනවත් බව විශ්වාස කළේය. පුද්ගලයන් දෙදෙනෙකු යමක් හුවමාරු කිරීමට එකඟ වන්නේ නම්, එයට හේතුව දෙදෙනාම තමන්ට යමක් ලැබෙන බව හැඟෙන නිසාය; එසේ නොවුවහොත් ඔවුන් එය නොකරනු ඇත.