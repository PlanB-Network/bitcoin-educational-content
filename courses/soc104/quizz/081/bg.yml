question: "Кое от следните е пример за спонтанен ред, както е описан от Hayek?"
answer: "Езикът, който се е развил органично чрез исторически взаимодействия, вместо да бъде проектиран от интелектуалци в кабинет"
wrong_answers:
  - "Национална конституция, която е внимателно изготвена от избрани представители, за да установи социални правила"
  - "Правителствен план за стимулиране, който е проектиран от икономисти, за да координира икономическата дейност"
  - "Система на публично образование, която е създадена от законодатели, за да осигури всеобщ достъп до знание"
explanation: >-
  Hayek описва спонтанния ред като продукт на свободните взаимодействия в обществото, произтичащ от човешко действие, но не и от целенасочен човешки замисъл. Езикът е първостепенен пример: френският, английският и немският не са конструирани от интелектуалци, които решават граматически правила, а са възникнали като плод на бавна, органична организация, изградена чрез исторически взаимодействия.
reviewed: false
