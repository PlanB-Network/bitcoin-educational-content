question: "Cum pot programele de asistență socială finanțate de stat să producă efecte perverse, ilustrând pericolul de a te baza doar pe intenții?"
answer: "Ele pot crea dependență, pot elimina stimulentele pentru muncă și pot echivala cu spolierea, deoarece banii trebuie mai întâi luați de la cei care au produs bogăția"
wrong_answers:
  - "Ele încurajează economisirea personală excesivă, reduc cheltuielile de consum și provoacă deflație în economia mai largă"
  - "Ele întăresc întreprinderea privată prin transferarea costurilor muncii către guvern și reducerea nevoii de salarii competitive"
  - "Ele elimină distincțiile de clasă atât de complet încât mobilitatea socială devine inutilă și inovația stagnează"
explanation: >-
  Friedman avertizează că intențiile generoase pot produce consecințe dăunătoare atunci când neglijează analiza riguroasă a stimulentelor umane. Programele de asistență finanțate de stat riscă să creeze dependență, să nu genereze niciun stimulent pentru muncă și să constituie o formă de spoliere, deoarece fondurile trebuie mai întâi luate de la producătorii de bogăție. Rezultatele măsurabile precum reducerea sărăciei și eficiența trebuie să aibă prioritate față de intențiile nobile.
reviewed: false
