question: "Čo chce pravica legislatívne upravovať?"
answer: "Morálku a náboženstvo, z túžby zachovať tradičné inštitúcie a spoločenské hierarchie"
wrong_answers:
  - "Ekonomiku a finančné trhy, z túžby znižovať nerovnosť a prerozdeľovať bohatstvo"
  - "Vedu a vzdelávanie, z túžby kontrolovať, čo sa vyučuje vo verejných školách"
  - "Medzinárodný obchod a diplomaciu, z túžby rozširovať národný vplyv v zahraničí"
explanation: >-
  Pravica dáva prioritu osobnej morálke a tradičným hodnotám. Domnieva sa, že civilizácia bola vybudovaná na určitých tradičných inštitúciách a spoločenských hierarchiách, ktoré sa musia zachovať, a chce legislatívne upravovať morálku a náboženstvo. Na legislatívnu reguláciu ekonomiky sa zameriava ľavica, nie pravica. Veda, vzdelávanie a obchodná politika nie sú hlavným zameraním opísaným pre pravicu.
