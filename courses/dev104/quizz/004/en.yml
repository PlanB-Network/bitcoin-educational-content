question: What happens when you visit a website and your browser needs to display the content?
answer: Your browser downloads the HTML document from the server and reads it to display content according to the instructions
wrong_answers:
  - "Your browser directly connects to the website's database and retrieves the raw data to display on screen"
  - "Your browser generates the HTML code locally based on the website's URL and displays the predicted content"
  - Your browser sends your personal information to the server which then customizes and displays content specifically for you
explanation: |
  When you visit a website, a specific process occurs: HTML documents are stored on servers, and when you request a webpage, your browser downloads that HTML document from the server. The browser then interprets the HTML markup language instructions to properly display images, text, and other content on your screen. This is the fundamental way web browsing works - the HTML acts as instructions telling your browser exactly how to present the content, rather than the browser generating content independently or accessing databases directly.
