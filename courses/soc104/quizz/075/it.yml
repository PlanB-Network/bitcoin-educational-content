question: "In tutti e cinque i dibattiti economici (tasse, salario minimo, sanità, ambiente, sussidi), quale schema coerente distingue il metodo centrista dalle posizioni delle altre famiglie politiche?"
answer: "I centristi rifiutano di impegnarsi su un principio fisso e chiedono invece analisi empirica e valutazione degli esperti per determinare le politiche caso per caso, rendendo il loro approccio intrinsecamente tecnocratico"
wrong_answers:
  - "I centristi adottano sempre una posizione intermedia tra le posizioni socialista e conservatrice, dividendo equamente la differenza su ogni questione"
  - "I centristi danno costantemente priorità alla crescita economica rispetto al benessere sociale, schierandosi con i libertari sulla politica fiscale pur concordando con i socialisti sulla regolamentazione"
  - "I centristi deferiscono tutte le decisioni economiche alle organizzazioni internazionali e agli accordi commerciali invece di elaborare una politica nazionale indipendente"
explanation: >-
  In tutti e cinque i dibattiti economici, l'approccio centrista segue lo stesso schema: invece di impegnarsi su un principio ideologico fisso, i centristi richiedono prove empiriche e valutazione degli esperti prima di prendere decisioni. Sulle tasse, il livello giusto deve essere determinato dall'analisi. Sul salario minimo, il livello deve essere adeguato pragmaticamente. Sulla sanità, l'ideale è una combinazione calibrata dagli esperti. Sull'ambiente, la politica deve bilanciare la competitività. Sui sussidi, ogni caso deve essere valutato in base ai suoi meriti. Questo rende il centrismo intrinsecamente tecnocratico, il che è diverso dal semplice dividere la differenza o dal deferire agli organismi internazionali.
