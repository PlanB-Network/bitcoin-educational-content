question: "Jaký je konzervativní postoj k imigraci?"
answer: "Stát má suverénní právo kontrolovat své hranice, aby chránil národní bezpečnost a kulturní identitu"
wrong_answers:
  - "Hranice by měly být bezpodmínečně otevřené, protože diskriminační omezení porušují lidská práva"
  - "Imigrace by měla být určována poptávkou trhu, přičemž občané by smluvně rozhodovali o svých vztazích s cizinci"
  - "Imigrační politika by měla vyvažovat ekonomické potřeby s úspěšnou integrací na základě odborného hodnocení"
explanation: >-
  Konzervativci zastávají názor, že řád, identita a národní suverenita musí mít přednost před neomezeným přijímáním cizinců nebo uprchlíků. Hranice a dobře vymezené obyvatelstvo jsou součástí civilizovaných hodnot. Chybné odpovědi představují socialistickou pozici (otevřené hranice jako lidská práva), libertariánskou pozici (tržně založená imigrace) a centristickou pozici (vyvážený přístup řízený experty).
