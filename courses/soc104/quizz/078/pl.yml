question: "Dlaczego prognoza Molinariego z 1849 roku okazała się prorocza w odniesieniu do relacji między wolnością a władzą polityczną?"
answer: "Ponieważ konserwatyści i socjaliści na przemian sprawowali władzę i instrumentalizowali wolność w służbie swoich odpowiednich celów politycznych, dokładnie tak, jak opisał"
wrong_answers:
  - "Ponieważ opisana przez niego postać ekonomisty ostatecznie zdobyła władzę polityczną i wdrożyła polityki libertariańskie w całej Europie"
  - "Ponieważ jego prognoza, że wszystkie trzy rodziny polityczne połączą się w jeden ruch centrowy, spełniła się w XX wieku"
  - "Ponieważ wolność była stopniowo rozszerzana przez kolejne rządy, aż stała się podstawową zasadą organizującą nowoczesne demokracje"
explanation: >-
  Wizja Molinariego okazała się prorocza, ponieważ od połowy XIX wieku konserwatyści i socjaliści na przemian sprawowali władzę i realizowali dokładnie to, co opisał: instrumentalizację wolności w służbie celów politycznych. Obie rodziny są gotowe ograniczać wolności i wzywać państwo do narzucania ich odpowiednich programów, podczas gdy stanowisko ekonomisty, oparte na bezwarunkowej wolności, pozostało zmarginalizowane.
reviewed: false
