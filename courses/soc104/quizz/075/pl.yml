question: "Czym jest koncepcja „pokusy nadużycia” w kontekście debaty o subsydiach i która rodzina polityczna podnosi tę obawę?"
answer: "Pokusa nadużycia to bodziec do nieodpowiedzialności, gdy firmom uniemożliwia się upadek poprzez subsydia, ponieważ ostatecznie płaci podatnik; tę obawę podnoszą libertarianie"
wrong_answers:
  - "Pokusa nadużycia to ryzyko, że subsydiowane firmy przeniosą się do krajów o niższych podatkach, zabierając ze sobą miejsca pracy; tę obawę podnoszą konserwatyści"
  - "Pokusa nadużycia to niebezpieczeństwo, że urzędnicy państwowi staną się skorumpowani, wybierając, które firmy otrzymają subsydia; tę obawę podnoszą centrowcy"
  - "Pokusa nadużycia to etyczny problem firm wyzyskujących pracowników po otrzymaniu środków publicznych; tę obawę podnoszą socjaliści"
explanation: >-
  Libertarianie twierdzą, że subsydia i pakiety ratunkowe tworzą pokusę nadużycia: gdy firmom uniemożliwia się upadek, zachęca je to do nieodpowiedzialności i lekkomyślności, ponieważ złe decyzje nie niosą konsekwencji. Ostatecznie płaci za to podatnik, co libertarianie uznają za głęboko niesprawiedliwe. Koncepcja ta różni się od obaw dotyczących relokacji firm, korupcji urzędników czy wyzysku pracowników podnoszonych przez inne rodziny polityczne.
reviewed: false
