question: "ノーラン・チャートの個人的自由軸の下端を特徴づけるものは何ですか？"
answer: "秩序、安全、伝統的価値観を好み、国家が道徳を規制し公共秩序を維持すること"
wrong_answers:
  - "個人の自律、寛容、個人生活の選択への最小限の国家干渉を好むこと"
  - "経済的規制緩和、自由貿易、関税と補助金の廃止を好むこと"
  - "富の再分配、高い税、主要産業の国有化を好むこと"
explanation: >-
  個人的自由軸の下端は、個人生活に対する最大限の国家統制を表し、秩序、安全、伝統的価値観を好むことによって特徴づけられます。国家は道徳を規制し、公共秩序を維持し、特定の道徳観や伝統観を擁護することがあります。この軸の上端はその反対、すなわち個人の自由と寛容を表します。経済政策は別の水平軸で測定されます。
reviewed: false
