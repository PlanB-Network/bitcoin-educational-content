question: "ฝ่ายซ้ายต้องการออกกฎหมายและกำกับอะไร?"
answer: "เศรษฐกิจ ซึ่งขับเคลื่อนโดยความเป็นปฏิปักษ์ต่อเสรีภาพทางเศรษฐกิจ ทุนนิยม และตลาดเสรี"
wrong_answers:
  - "ศีลธรรมส่วนบุคคลและการปฏิบัติทางศาสนา ซึ่งขับเคลื่อนโดยความปรารถนาจะรักษาสถาบันดั้งเดิม"
  - "การย้ายถิ่นฐานและพรมแดนแห่งชาติ ซึ่งขับเคลื่อนโดยความกังวลเรื่องอัตลักษณ์ทางวัฒนธรรมและอธิปไตย"
  - "เทคโนโลยีและนวัตกรรม ซึ่งขับเคลื่อนโดยความกลัวว่าระบบอัตโนมัติจะมาแทนที่แรงงานมนุษย์"
explanation: >-
  ฝ่ายซ้ายให้ความสำคัญกับความยุติธรรมทางสังคมและความเท่าเทียม โดยเฉพาะในระดับเศรษฐกิจ สิ่งนี้นำไปสู่ความเป็นปฏิปักษ์ต่อเสรีภาพทางเศรษฐกิจ ทุนนิยม และตลาดเสรี รวมถึงความปรารถนาที่จะออกกฎหมายและกำกับเศรษฐกิจ ในทางตรงกันข้าม ฝ่ายขวาต้องการออกกฎหมายด้านศีลธรรมและศาสนา การกำกับการย้ายถิ่นฐานและเทคโนโลยีไม่ใช่จุดเน้นหลักที่อธิบายไว้ที่นี่
reviewed: false
