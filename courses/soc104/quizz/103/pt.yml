question: "Como o curso argumenta que a liberdade permite que valores de esquerda e de direita coexistam pacificamente?"
answer: "Em um regime de liberdade genuína, pessoas com ideais de esquerda podem compartilhar bens voluntariamente e redistribuir recursos, enquanto aquelas com valores de direita podem poupar e transmitir tradições, sem que nenhum lado imponha seu modo de vida ao outro"
wrong_answers:
  - "A liberdade exige que ambos os lados façam concessões ao aceitar uma posição centrista na qual o governo equilibra valores concorrentes por meio de regulação moderada"
  - "A liberdade significa que comunidades de esquerda e de direita devem viver em territórios geográficos separados, com seus próprios governos independentes"
  - "A liberdade funciona permitindo que os cidadãos votem sobre quais valores devem ser impostos em cada região, alternando entre políticas de esquerda e de direita a cada ciclo eleitoral"
explanation: >-
  O curso mostra que, em um regime genuíno de liberdade, aqueles que aderem a ideais de esquerda podem abrir mão voluntariamente de bens, compartilhar meios de produção ou doar salários a organizações redistributivas. Aqueles com valores de direita podem trabalhar duro, poupar e transmitir valores familiares. Ninguém deve impor seu modo de vida aos outros. É por meio da liberdade do mercado e do poder de escolha que objetivos podem ser alcançados pacificamente.
