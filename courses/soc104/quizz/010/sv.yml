question: "Vad omfattar kategorin ekonomisk frihet?"
answer: "Det du gör som producent och konsument: köper, säljer, producerar, arbetar, anställer och hanterar dina pengar"
wrong_answers:
  - "Dina religiösa övertygelser, personliga relationer och yttrandefrihet"
  - "Din rätt att rösta, delta i val och gå med i politiska partier"
  - "Din möjlighet att resa fritt, välja bostadsort och korsa nationsgränser"
explanation: >-
  Ekonomisk frihet omfattar det du gör som producent och konsument: vad du kan köpa, sälja eller producera; var du arbetar; vem du anställer; och vad du gör med dina pengar. Personliga relationer, religiösa övertygelser och rörelsefrihet faller under kategorin personlig frihet, inte den ekonomiska.
reviewed: false
