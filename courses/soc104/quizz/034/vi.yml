question: "Vì sao Rothbard phê phán tầm nhìn của những người libertaire về bản tính con người, và ông đề xuất phương án thay thế nào?"
answer: "Ông cáo buộc họ giữ quan điểm ngây thơ về 'người hoang dã cao quý' và lập luận rằng xã hội phải dùng sở hữu tư nhân cùng các khuyến khích tốt để định hướng hành vi vì lợi ích bản thân"
wrong_answers:
  - "Ông ca ngợi hiểu biết của họ về sự hợp tác của con người nhưng lập luận rằng một nhà nước tối thiểu vẫn cần thiết để thực thi hợp đồng"
  - "Ông đồng ý rằng con người tự nhiên là tốt nhưng nhấn mạnh rằng chỉ thị trường tự do mới có thể chuyển hóa lòng tốt đó thành hoạt động sản xuất"
  - "Ông bác bỏ sự nhấn mạnh của họ vào quyền cá nhân và thay vào đó lập luận rằng các cộng đồng nên cùng nhau định nghĩa các chuẩn mực đạo đức"
explanation: >-
  Rothbard phê phán những người libertaire vì đã chấp nhận một tầm nhìn ngây thơ, kiểu Rousseau, về bản tính con người như vốn tự nhiên là tốt. Thay vào đó, ông lập luận rằng con người được dẫn dắt bởi lợi ích bản thân, và xã hội phải được tổ chức sao cho các khuyến khích tốt định hướng hành vi. Điều này đòi hỏi phải thừa nhận và bảo đảm sở hữu tư nhân. Bãi bỏ nhà nước không có nghĩa là bãi bỏ các chức năng của nó; cảnh sát và tư pháp nên được thị trường tự do quản lý thông qua cạnh tranh.
