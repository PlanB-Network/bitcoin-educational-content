question: "Mengapa inflasi moneter digambarkan sebagai pajak tersembunyi yang dikenakan tanpa persetujuan warga negara?"
answer: "Karena penciptaan uang oleh pemerintah mendevaluasi mata uang sehingga orang dapat membeli lebih sedikit dengan jumlah yang sama, tetapi kebanyakan orang tidak menyadari bahwa kenaikan harga mencerminkan kebijakan pemerintah, bukan kekuatan pasar alami"
wrong_answers:
  - "Karena bank sentral secara diam-diam mengenakan biaya pada setiap transaksi yang diproses melalui sistem perbankan tanpa mengungkapkannya kepada pemegang rekening"
  - "Karena pemerintah mencetak uang dan mendistribusikannya hanya kepada individu kaya sambil memajaki orang miskin melalui pajak penjualan yang lebih tinggi atas barang esensial"
  - "Karena inflasi disebabkan oleh perusahaan swasta yang menaikkan harga untuk meningkatkan laba, yang berfungsi sebagai pajak tidak resmi atas konsumen"
explanation: >-
  Injeksi uang ke dalam sistem berubah menjadi devaluasi mata uang, di mana jumlah yang sama membeli lebih sedikit karena uang baru tersebut tidak mencerminkan pertumbuhan ekonomi yang nyata. Kebanyakan orang tidak melihat bahwa kebijakan pemerintah menyebabkan kenaikan harga, yang sebenarnya hanya merupakan cerminan devaluasi mata uang. Ini sama dengan pencurian legal dan spoliation yang dilembagakan, memiskinkan kelas menengah sementara orang kaya menangkap uang baru melalui aset spekulatif.
