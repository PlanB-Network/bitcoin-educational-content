question: 在 Simplicity 中，和型別（A + B）是什麼？
answer: "帶標籤的聯合：一個值要嘛是左標籤的 A，要嘛是右標籤的 B。"
wrong_answers:
  - 一種同時包含來自 A 與 B 所有值的型別。
  - 對兩個組成型別的位元大小進行的算術加法。
  - 一種將 A 中每個輸入映射到 B 中某個輸出的函式型別。
explanation: >-
  和型別 A + B 是一種帶標籤的聯合。每個值攜帶一個一位元標籤，指出它是左變體（型別 A）還是右變體（型別 B）。即使 A 與 B 是相同型別，左標籤與右標籤的值仍然彼此不同。
reviewed: false
