description: |
  "zk" zkSNACKs:ssa tarkoittaa nollatietoa, mikä tarkoittaa, että emme voi eikä meillä ole mahdollisuutta kerätä mitään henkilökohtaisia käyttäjätietoja tuotteissamme.

  zkSNACKs sulki coinjoin-koordinaattorinsa 1. kesäkuuta 2024, ja sen verkkosivusto on poissa käytöstä. Wasabi Wallet jatkuu avoimen lähdekoodin ohjelmistona.

