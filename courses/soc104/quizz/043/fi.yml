question: "Mitä termi 'holismi' tarkoittaa sosialistisen filosofian kontekstissa?"
answer: "Näkemystä yhteiskunnasta jakamattomana kokonaisuutena, jossa kollektiivilla on etusija yksilöön nähden"
wrong_answers:
  - "Filosofiaa, joka kohtelee jokaista yksilöä itsenäisenä yksikkönä, jonka oikeuksia mikään ryhmä ei voi syrjäyttää"
  - "Talousteoriaa, joka kannattaa julkisen ja yksityisen sektorin tasapainottamista yhtä suuressa määrin"
  - "Poliittista strategiaa, joka integroi kaikki vähemmistönäkökulmat yhdeksi konsensukseen perustuvaksi alustaksi"
explanation: >-
  Holismi tulee kreikan sanasta 'holos', joka tarkoittaa 'kokonaisuutta'. Sosialistisessa ajattelussa se viittaa näkemykseen yhteiskunnasta jakamattomana kokonaisuutena eikä pelkkänä yksilöiden summana. Sosialistinen valtio pyrkii ottamaan ihmistoiminnan mahdollisimman laajasti vastuulleen ja ohjaamaan sitä. Tätä kollektiivia voidaan edustaa yhteiskuntaluokkana, kansakuntana, rotuna tai sukupuolena, mutta jokaisessa tapauksessa yksilö määritellään ryhmään kuulumisen kautta.
