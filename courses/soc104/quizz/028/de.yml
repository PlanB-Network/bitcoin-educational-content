question: "Welche Gemeinsamkeiten teilen Libertäre und Konservative, und was trennt sie?"
answer: "Sie teilen die Bindung an eine begrenzte Regierung und die Ablehnung erzwungenen Egalitarismus, sind sich aber uneinig über militärischen Interventionismus und Sozialpolitik"
wrong_answers:
  - "Sie teilen die Unterstützung protektionistischer Handelspolitik und nationaler Verteidigung, sind sich aber uneinig über die Rolle der Religion im öffentlichen Leben"
  - "Sie teilen ein Bekenntnis zu progressiver Besteuerung und Wohlfahrtsprogrammen, sind sich aber uneinig über Einwanderungspolitik"
  - "Sie teilen die Ablehnung von Freihandel und Drogenlegalisierung, sind sich aber uneinig über die Größe der Bundesregierung"
explanation: >-
  Libertäre und Konservative treten beide für eine begrenzte Regierung ein, lehnen erzwungenen Egalitarismus ab, wenden sich gegen öffentliche Verschuldung und verteidigen die Rechte der Einzelstaaten. Libertäre lehnen jedoch den militärischen Interventionismus der Neokonservativen ab, stellen sich gegen konservative Sozialpolitik und Subventionen, verurteilen die Drogenprohibition und lehnen Protektionismus ab. Das Bündnis ist real, aber von Natur aus angespannt.
reviewed: false
