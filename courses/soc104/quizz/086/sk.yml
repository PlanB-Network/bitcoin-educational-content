question: "Čo mal Ludwig von Mises na mysli, keď napísal, že iba jednotlivec myslí, uvažuje a koná?"
answer: "Že kolektívy ako štát alebo národ nemajú vlastnú existenciu mimo konania svojich jednotlivých členov"
wrong_answers:
  - "Že jednotlivci by sa mali vyhýbať vytváraniu skupín alebo združení, pretože kolektívne konanie je vždy škodlivé"
  - "Že iba určití nadaní jednotlivci sú schopní racionálneho myslenia, zatiaľ čo väčšina ľudí sa riadi inštinktom"
  - "Že myslenie a uvažovanie sú súkromné činnosti, ktoré by sa nikdy nemali zdieľať ani verejne diskutovať"
explanation: >-
  Mises objasnil, že individualizmus odmieta predstavu, že spoločenské entity, ako spoločnosť alebo národ, by mohli existovať nezávisle od jednotlivcov, ktorí ich tvoria. Kolektív nemá nijakú vlastnú existenciu mimo konania svojich jednotlivých členov. Nemôžeme zmysluplne hovoriť o konaní štátu alebo firmy, pretože tieto entity nemajú vlastnú vôľu ani myslenie a konajú iba prostredníctvom jednotlivcov.
reviewed: false
