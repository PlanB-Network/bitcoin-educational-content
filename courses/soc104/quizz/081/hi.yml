question: "जब लिबर्टेरियन और अन्य राजनीतिक परिवार समान उद्देश्यों को साझा करते हैं, तो उनके बीच मुख्य असहमति क्या होती है?"
answer: "असहमति साधनों के बारे में है: लिबर्टेरियन जबरन समाधानों को अस्वीकार करते हैं और बाज़ार प्रक्रिया के माध्यम से स्वैच्छिक विनिमय का समर्थन करते हैं"
wrong_answers:
  - "असहमति लक्ष्यों के बारे में है: लिबर्टेरियन सामाजिक कल्याण के बजाय व्यक्तिगत धन जैसे अलग लक्ष्य अपनाते हैं"
  - "असहमति समय-सीमा के बारे में है: लिबर्टेरियन क्रमिक सुधार के माध्यम से समान लक्ष्यों को अधिक धीरे-धीरे प्राप्त करना चाहते हैं"
  - "असहमति दायरे के बारे में है: लिबर्टेरियन समान नीतियों को राष्ट्रीय स्तर के बजाय केवल स्थानीय स्तर पर लागू करना चाहते हैं"
explanation: >-
  लिबर्टेरियन समाजवादियों, रूढ़िवादियों और केंद्रवादियों के साथ कुछ उद्देश्यों पर सहमत हो सकते हैं, जैसे पीड़ितों की रक्षा करना या सामाजिक एकजुटता को बढ़ावा देना। असहमति लक्ष्यों में नहीं बल्कि साधनों में है। लिबर्टेरियन उन सभी जबरन समाधानों को अस्वीकार करते हैं जो व्यवहारों और नियमों को एकरूप बनाने की कोशिश करते हैं, और इसके बजाय स्वैच्छिक अनुबंधों पर आधारित स्वतंत्र, विकेंद्रीकृत विनिमय के माध्यम से चुनाव की शक्ति और जिम्मेदार स्वतंत्रता की रक्षा करते हैं।
reviewed: false
