question: "Bagaimana pendekatan ekonomi Jerman Hitler dan Uni Soviet Stalin berbeda, meskipun sama-sama menggunakan metode totalitarian?"
answer: "Jerman Nazi mempertahankan tampilan kepemilikan privat sambil mensubordinasikan sektor swasta kepada tujuan negara, sedangkan Stalinisme menghapus semua kepemilikan privat dan sepenuhnya merencanakan ekonomi"
wrong_answers:
  - "Jerman Nazi menasionalisasi sepenuhnya semua industri, sedangkan rezim Stalin mengizinkan perusahaan swasta terbatas di pertanian"
  - "Jerman Nazi mempromosikan perdagangan internasional bebas untuk mendanai persenjataan ulang, sedangkan Stalinisme memberlakukan isolasi ekonomi total"
  - "Jerman Nazi mengandalkan kerja sama korporasi sukarela dengan negara, sedangkan Stalinisme hanya menggunakan kerja paksa"
explanation: >-
  Meskipun kedua rezim menggunakan metode politik yang identik (kultus kepribadian, pengawasan total, penghapusan oposisi secara sistematis), model ekonomi mereka berbeda dalam bentuk. Jerman Nazi tidak secara formal menghapus kepemilikan privat, tetapi sepenuhnya mensubordinasikan sektor swasta kepada tujuan negara seperti perang dan persenjataan ulang, sambil memberlakukan autarki ekonomi. Stalinisme melangkah lebih jauh dengan menghapus semua kepemilikan privat, menerapkan rencana lima tahun, dan mengendalikan semua produksi serta distribusi secara langsung.
