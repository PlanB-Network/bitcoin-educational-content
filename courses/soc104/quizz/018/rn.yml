question: "Ibumoso bushaka gushingira amategeko no kugenzura iki?"
answer: "Ubutunzi, biterwa n'urwanko ku mwidegemvyo w'ubutunzi, capitalism, n'isoko ryidegemvya"
wrong_answers:
  - "Inyifato runtu y'umuntu n'imigenzo y'idini, biterwa n'icipfuzo co kuzigama inzego za kera"
  - "Abimukira n'imbibe z'igihugu, biterwa n'amakenga ku karanga k'umuco n'ubusugire"
  - "Ubuhinga n'ubuhingurabwenge, biterwa n'ubwoba ko automation izosubirira abakozi b'abantu"
explanation: >-
  Ibumoso buha imbere ubutungane bw'ikibano n'uburinganire, cane cane ku rwego rw'ubutunzi. Ivyo bituma bugira urwanko ku mwidegemvyo w'ubutunzi, capitalism, n'isoko ryidegemvya, kandi bukagira icipfuzo co gushingira amategeko no kugenzura ubutunzi. Ibiri ukundi, iburyo bushaka gushinga amategeko ku nyifato runtu no ku dini. Kugenzura abimukira n'ubuhinga si vyo vyerekanywe hano nk'ivy'imbere.
