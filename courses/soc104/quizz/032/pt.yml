question: "Como os libertários veem a relação entre propriedade privada e liberdade?"
answer: "A propriedade privada é um direito natural que precede a lei e o Estado, e é o próprio fundamento da liberdade"
wrong_answers:
  - "A propriedade privada é uma convenção social criada pelo Estado que pode ser revogada quando causa desigualdade"
  - "A propriedade privada é útil para a eficiência econômica, mas não tem nenhum significado moral ou filosófico inerente"
  - "A propriedade privada deve existir apenas para bens pessoais, não para ativos produtivos ou terra"
explanation: >-
  Os libertários defendem a propriedade privada como um direito natural que precede a lei e o Estado. Eles argumentam que, se um indivíduo é dono do próprio corpo, também é dono de seu trabalho e de seus frutos. A propriedade de bens materiais é uma extensão da autopropriedade. Isso contrasta fortemente com a visão libertaire de que a propriedade é uma convenção social ou uma fonte de opressão.
