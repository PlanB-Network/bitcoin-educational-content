question: "Modern conservatism के founding figure के रूप में अक्सर किसे cite किया जाता है?"
answer: "Edmund Burke, जिन्होंने French Revolution के radical changes के विरुद्ध institutions और traditions को preserve करने की वकालत की"
wrong_answers:
  - "Karl Marx, जिन्होंने nineteenth century में class struggle और historical materialism की theory विकसित की"
  - "John Locke, जिन्होंने seventeenth century में natural rights और social contract की theory articulate की"
  - "Adam Smith, जिन्होंने The Wealth of Nations लिखा और classical economics की discipline की foundation रखी"
explanation: >-
  Edmund Burke को French Revolution के विरोध के कारण अक्सर conservatism के founding figure के रूप में cite किया जाता है। उनकी Reflections on the Revolution in France (1790) ने radical change के बजाय prudence और gradual reform का समर्थन किया। वे मानते थे कि society को clean slate बनाकर नहीं, बल्कि tested institutions और traditions को preserve करने वाले incremental reforms के माध्यम से advance करना चाहिए।
reviewed: false
