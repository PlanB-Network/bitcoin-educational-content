question: "อะไรทำให้ neoconservatives แตกต่างจาก paleoconservatives ในแนวทางต่อนโยบายต่างประเทศ?"
answer: "Neoconservatives ให้เหตุผลสนับสนุน interventionism ทางทหารเพื่อเผยแพร่ประชาธิปไตย ขณะที่ paleoconservatives ปกป้องนโยบายต่างประเทศที่เป็น isolationist มากกว่า"
wrong_answers:
  - "Neoconservatives คัดค้านปฏิบัติการทางทหารทั้งหมดและสนับสนุนการทูต ขณะที่ paleoconservatives สนับสนุนการโจมตีก่อนต่อภัยคุกคามที่เป็นไปได้"
  - "Neoconservatives มุ่งเน้นเฉพาะมาตรการคว่ำบาตรทางเศรษฐกิจ ขณะที่ paleoconservatives สนับสนุนการสร้างแนวร่วมระหว่างประเทศเพื่อปฏิบัติการทางทหารร่วมกัน"
  - "Neoconservatives และ paleoconservatives เห็นพ้องกันเรื่องนโยบายต่างประเทศ แต่แตกต่างกันอย่างชัดเจนเรื่องการกำกับเศรษฐกิจภายในประเทศ"
explanation: >-
  ตั้งแต่ทศวรรษ 2000 เป็นต้นมา neoconservatives เข้ามามีส่วนร่วมมากขึ้นในการให้เหตุผลสนับสนุน interventionism ทางทหารเพื่อปลูกฝังประชาธิปไตยทั่วโลก โดยเฉพาะหลังวันที่ 11 กันยายน 2001 เพื่อตอบโต้ อนุรักษนิยมดั้งเดิมอ้างป้าย 'paleoconservative' เพื่อแยกตนเองออกมา Paleoconservatives วิจารณ์ interventionism ทางทหาร ปกป้องนโยบายต่างประเทศที่เป็น isolationist มากขึ้น และให้ความสำคัญมากขึ้นกับอัตลักษณ์ชาติและวัฒนธรรม
reviewed: false
