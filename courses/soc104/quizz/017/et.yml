question: "Milline ühine poliitiline eesmärk on vasak- ja parempoolsetel etatistidel?"
answer: "Võita võim, et korraldada ühiskond oma maailmapildi järgi ja suruda see kõigile peale"
wrong_answers:
  - "Vähendada valitsuse suurust ja anda otsustusõigus tagasi üksikisikutest kodanikele"
  - "Kehtestada otsedemokraatia, kus iga kodanik hääletab iga seadusandliku otsuse üle"
  - "Kaotada erakonnad ja asendada need sõltumatu tehnokraatliku valitsemisega"
explanation: >-
  Nii vasak- kui ka parempoolsed etatistid jagavad sama poliitilist eesmärki: võita võim, et korraldada ühiskond oma maailmavaate järgi ja suruda see seadusandluse kaudu kõigile peale. Erinevus seisneb ainult nende väärtustes: parempoolsed viitavad tsivilisatsiooni kaitsmisele, vasakpoolsed aga töölisklassi või rõhutute kaitsmisele. Kumbki ei püüa valitsust vähendada ega erakondi kaotada.
reviewed: false
