question: "On the question of firearms regulation, what is the crucial difference between the conservative and libertarian positions?"
answer: "Both accept some regulation, but conservatives want rules from a legitimate public authority while libertarians want rules to emerge from those directly concerned, such as citizens' associations and market competition"
wrong_answers:
  - "Conservatives oppose all firearm regulation while libertarians accept strict government control for public safety"
  - "Conservatives want to ban firearms entirely while libertarians support unrestricted access to all weapons"
  - "Conservatives base their position on individual rights while libertarians base theirs on collective responsibility"
explanation: >-
  Both conservatives and libertarians agree that some form of regulation for carrying weapons is necessary. The crucial difference is in who establishes those rules. Conservatives insist that regulations must come from a public authority charged with safeguarding the common good (top-down). Libertarians argue that regulation should emerge from those directly concerned: security professionals, citizens' associations, and market competition (bottom-up).
