question: Cu care gânditor de mai târziu NU a fost comparat Boisguilbert?
answer: Adam Smith și mâna invizibilă
wrong_answers:
  - Keynes și teoria subocupării
  - Marx și analiza claselor
  - Walras și echilibrul general
explanation: |
  Cercetătorii moderni l-au revendicat în mod exagerat pe Boisguilbert ca precursor al lui Keynes (subocuparea), al lui Marx (analiza claselor) și al lui Walras (echilibrul general). Conceptul de mână invizibilă este însă atribuit marchizului d'Argenson, nu lui Boisguilbert. Așa cum a întrebat un comentator: „De cine sau de ce nu ar putea fi Boisguilbert precursorul?”
