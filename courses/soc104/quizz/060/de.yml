question: "Welches verborgene Paradox liegt im zentristischen Pragmatismus?"
answer: "Der Pragmatismus selbst beruht auf einer Form von Dogmatismus, nämlich der unausgesprochenen Überzeugung, dass nur Experten kompetent sind, die Gesellschaft zu steuern"
wrong_answers:
  - "Zentristen behaupten, moderat zu sein, verbünden sich aber in Koalitionsregierungen konsequent mit linken Parteien"
  - "Zentristische Politiken erscheinen ausgewogen, bevorzugen aber immer Wirtschaftswachstum gegenüber Umweltschutz"
  - "Zentristen lehnen Ideologie ab, übernehmen aber starre Prinzipien des freien Marktes, wenn sie wirtschaftliche Entscheidungen treffen"
explanation: >-
  Das Paradox des zentristischen Pragmatismus besteht darin, dass er behauptet, Ideologie zugunsten rationaler Expertise abzulehnen, doch genau dieser Anspruch beruht auf einem unsichtbaren und unausgesprochenen Dogma: dass nur Technokraten in der Lage seien, die richtigen Entscheidungen zu treffen. Diese Überzeugung, dass allein Experten die Gesellschaft steuern sollten, ist selbst eine ideologische Verpflichtung, auch wenn Zentristen sie nicht als solche erkennen.
reviewed: false
