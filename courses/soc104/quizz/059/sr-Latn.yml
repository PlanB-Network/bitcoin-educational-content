question: "Koja je važna razlika između biti pro-business i biti pro-market?"
answer: "Biti pro-business znači favorizovati savez između velikih preduzeća i države, dok biti pro-market znači podržavati slobodnu konkurenciju bez državnog favorizovanja"
wrong_answers:
  - "Biti pro-business znači podržavati mala preduzeća, dok biti pro-market znači podržavati multinacionalne korporacije"
  - "Biti pro-business znači potpuno se protiviti regulaciji, dok biti pro-market znači prihvatati umerenu regulaciju"
  - "Biti pro-business usredsređuje se na domaću industriju, dok se biti pro-market usredsređuje na međunarodnu trgovinu"
explanation: >-
  Centristi teže da budu pro-business, što znači da favorizuju neku vrstu saveza između velikih preduzeća i države, što se razlikuje od toga da budu pro-market. Biti pro-market podržava slobodnu konkurenciju bez državnog favorizovanja ili korporativnog protekcionizma. Ova razlika je ključna zato što pro-business politike mogu stvoriti monopole i regulatorne zaštite koje zapravo podrivaju konkurenciju slobodnog tržišta.
reviewed: false
