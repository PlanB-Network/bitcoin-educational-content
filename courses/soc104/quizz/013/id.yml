question: "Di mana posisi kaum Hijau pada diagram Nolan, dan mengapa?"
answer: "Sangat rendah pada diagram, karena mereka menganggap kepentingan individu tidak boleh didahulukan atas kepentingan kolektif planet ini"
wrong_answers:
  - "Di puncak diagram, karena mereka memprioritaskan kebebasan pribadi dan kesadaran lingkungan secara setara"
  - "Di tengah diagram, karena mereka menyeimbangkan pertumbuhan ekonomi dengan perlindungan lingkungan"
  - "Di paling kanan, karena mereka mendukung solusi berbasis pasar terhadap tantangan lingkungan"
explanation: >-
  Kaum Hijau berada sangat rendah pada diagram Nolan karena mereka mendukung kontrol negara yang kuat atas keputusan ekonomi dan pribadi atas nama kesejahteraan planet. Mereka telah mengganti perjuangan kelas Marxis dengan perjuangan antara manusia dan alam, dan cenderung membela kontrol ekonomi bahkan penghapusan kepemilikan pribadi. Ini menempatkan mereka di sektor otoriter, bukan di puncak atau di tengah.
