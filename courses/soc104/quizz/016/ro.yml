question: "Ce vrea stânga să legifereze și să reglementeze?"
answer: "Economia, motivată de ostilitatea față de libertatea economică, capitalism și piața liberă"
wrong_answers:
  - "Morala personală și practicile religioase, motivate de dorința de a păstra instituțiile tradiționale"
  - "Imigrația și frontierele naționale, motivate de preocupări privind identitatea culturală și suveranitatea"
  - "Tehnologia și inovația, motivate de temeri că automatizarea va înlocui lucrătorii umani"
explanation: >-
  Stânga acordă prioritate justiției sociale și egalității, în special la nivel economic. Aceasta duce la ostilitatea ei față de libertatea economică, capitalism și piața liberă, precum și la dorința ei de a legifera și reglementa economia. Dreapta, în schimb, vrea să legifereze în materie de morală și religie. Reglementarea imigrației și a tehnologiei nu este principalul obiectiv descris aici.
reviewed: false
