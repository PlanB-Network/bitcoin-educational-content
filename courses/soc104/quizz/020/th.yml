question: "paleo-libertarianism คืออะไร?"
answer: "การสังเคราะห์ที่ผสานการปฏิเสธรัฐในฐานะแหล่งบังคับเข้ากับการเสริมความแข็งแรงของสถาบันดั้งเดิมและโครงสร้างสังคมโดยสมัครใจ"
wrong_answers:
  - "ขบวนการลิเบอร์ทาเรียนที่ปฏิเสธค่านิยมดั้งเดิมทั้งหมดและส่งเสริมความก้าวหน้าทางสังคมแบบสุดโต่ง"
  - "อุดมการณ์อนุรักษนิยมที่ใช้อำนาจรัฐบังคับใช้ค่านิยมแบบดั้งเดิม ขณะเดียวกันก็อนุญาตเสรีภาพทางเศรษฐกิจบางส่วน"
  - "ปรัชญาสายกลางที่แสวงหาการประนีประนอมอย่างสมดุลระหว่างเศรษฐกิจแบบสังคมนิยมกับนโยบายสังคมแบบอนุรักษนิยม"
explanation: >-
  paleo-libertarianism ผสานการปฏิเสธรัฐในฐานะแหล่งบังคับเชิงสถาบันเข้ากับการเสริมความแข็งแรงของสถาบันดั้งเดิม และความชอบต่อโครงสร้างสังคมโดยสมัครใจเหนืออำนาจรัฐ มันแยกตนเองจาก neo-libertarianism โดยเห็นอกเห็นใจค่านิยมแบบดั้งเดิมมากกว่า paleo-libertarian ไม่ได้คัดค้านชุมชนที่จัดระเบียบรอบหลักการสังคมนิยมหรือชุมชนนิยม พวกเขาเพียงปฏิเสธไม่ให้ชุมชนเช่นนั้นบังคับคุณค่าของตนต่อทุกคนด้วยกำลังของกฎหมาย
reviewed: false
