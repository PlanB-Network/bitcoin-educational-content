question: "Kültürel muhafazakârlık nedir?"
answer: "Geçmişten miras alınan ailevi, ahlaki, estetik ve metafizik değerlere kişisel bağlılık; siyasi bir felsefe değil"
wrong_answers:
  - "Geleneksel değerleri mevzuat yoluyla toplumun tamamına dayatmak için devlet gücünü kullanan siyasi bir ideoloji"
  - "Modernitenin tüm biçimlerini reddeden ve toplumu sanayi öncesi bir yaşam biçimine döndürmeyi amaçlayan bir hareket"
  - "Ulusal sanayileri koruyan ve yabancı ülkelerle serbest ticarete karşı çıkan bir ekonomik doktrin"
explanation: >-
  Kültürel muhafazakârlık bir yaşam bilgeliği olarak tanımlanır: Greko-Romen ya da Yahudi-Hristiyan olsun, geçmişten miras alınan ailevi, ahlaki, estetik ve metafizik değerlere kişisel bağlılık. Açıkça siyasi bir felsefe değildir. Siyasi kurumları ve toplumsal düzeni devlet gücü aracılığıyla korumayı amaçlayan siyasi muhafazakârlıktan farklıdır. Ayrıca moderniteyi reddetmek ya da ekonomik korumacılık anlamına da gelmez.
