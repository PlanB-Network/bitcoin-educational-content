question: "Cum diferă pozițiile conservatoare și libertariene privind salariul minim în raționamentul lor, deși ambele favorizează abolirea acestuia?"
answer: "Conservatorii acceptă o anumită implicare a statului în stabilirea salariilor dacă aceasta nu împiedică competitivitatea, în timp ce libertarienii văd salariul minim ca pe o impunere morală asupra libertății de a angaja și de a face afaceri"
wrong_answers:
  - "Conservatorii se opun salariului minim deoarece creează inflație, în timp ce libertarienii i se opun deoarece dă prea multă putere sindicatelor"
  - "Conservatorii vor ca salariile să fie stabilite de instituții religioase și comunitare, în timp ce libertarienii vor salarii determinate de studii de piață aprobate de guvern"
  - "Conservatorii cred că salariile minime ar trebui să varieze pe regiuni, în timp ce libertarienii cred că un singur salariu fix ar trebui aplicat la nivel național"
explanation: >-
  Ambele favorizează reducerea sau abolirea salariului minim, dar raționamentul lor diferă fundamental. Conservatorii acceptă o anumită implicare a statului în stabilirea salariilor, insistând totodată ca aceasta să rămână minimă și dependentă de context, concentrându-se pe competitivitate. Libertarienii adoptă o poziție morală mai puternică: salariul minim este o impunere asupra libertății de a angaja și de a face afaceri. Când libertarienii spun "piața", se referă la contractul negociat liber între două părți, fără interferența statului.
reviewed: false
