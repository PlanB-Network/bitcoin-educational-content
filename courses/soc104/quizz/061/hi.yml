question: "सभी सर्वसत्तावादी शासन सत्ता में कैसे आए?"
answer: "हिंसक क्रांति के माध्यम से, जिसने पिछली व्यवस्था को पूरी तरह मिटाकर नई शुरुआत करने को उचित ठहराया"
wrong_answers:
  - "मौजूदा लोकतांत्रिक संस्थाओं के भीतर क्रमिक विधायी सुधार के माध्यम से"
  - "क्षेत्रीय नियंत्रण चाहने वाली विदेशी शक्तियों द्वारा संगठित सैन्य तख्तापलट के माध्यम से"
  - "शांतिपूर्ण जन आंदोलनों के माध्यम से, जिन्होंने भारी अंतर से लोकप्रिय चुनाव जीते"
explanation: >-
  सभी सर्वसत्तावादी शासन हिंसक क्रांति के माध्यम से सत्ता में आए। यह क्रांति दोहरा उद्देश्य पूरा करती है: यह पुरानी व्यवस्था को भौतिक रूप से नष्ट करती है और नई समाज-व्यवस्था बनाने के लिए हिंसा के उपयोग को वैचारिक रूप से आवश्यक ठहराती है। यही बात सर्वसत्तावादी अधिग्रहणों को लोकतांत्रिक संक्रमणों, विदेशी समर्थन वाले तख्तापलटों या शांतिपूर्ण चुनावी जीतों से अलग करती है।
