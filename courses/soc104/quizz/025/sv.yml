question: "Hur illustrerade Ron Paul den paleo-libertarianska ståndpunkten i frågor som drogbruk och abort?"
answer: "Han avrådde personligen från drogbruk och motsatte sig abort, men politiskt kämpade han mot federala förbud och hävdade att valen borde lämnas åt individer eller delstater"
wrong_answers:
  - "Han stödde federal legalisering av alla droger och abort som en fråga om absolut individuell rättighet"
  - "Han kampanjade för strikta federala förbud mot både droger och abort utifrån sina personliga moraliska övertygelser"
  - "Han vägrade uttrycka någon personlig åsikt i dessa frågor och hävdade att politiker borde förbli moraliskt neutrala"
explanation: >-
  Ron Paul exemplifierar den paleo-libertarianska syntesen genom att skilja personliga moraliska övertygelser från politiskt tvång. Han avrådde alltid från drogbruk men motsatte sig samtidigt drogförbud. Han var personligen emot abort men hävdade att valet borde lämnas åt de federala delstaterna snarare än påtvingas uppifrån. Detta visar hur man kan ha starka traditionella värden samtidigt som man vägrar använda den federala regeringens tvingande makt för att upprätthålla dem.
reviewed: false
