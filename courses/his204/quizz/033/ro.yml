question: De ce crede el că contrabanda este atât de răspândită în Franța?
answer: Pentru că reglementările împiedică comerțul legal al anumitor mărfuri, deschizând o piață paralelă
wrong_answers:
  - Pentru că Franța are atât de mulți oameni săraci, încât singura lor resursă este contrabanda
  - Pentru că emigrația protestantă este un teren fertil pentru contrabandă
  - Pentru că vameșii sunt corupți
explanation: |
  Gournay credea că reglementarea excesivă încuraja contrabanda, creând piețe paralele pentru mărfurile al căror comerț era interzis sau puternic taxat.
