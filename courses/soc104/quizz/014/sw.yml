question: "Kwa nini mfano wa vipimo viwili unasema kwamba masuala mengi ya kisiasa yanaweza kugawanywa katika kategoria za kiuchumi na binafsi?"
answer: "Kwa sababu masuala ya kiuchumi yanahusu unachofanya kama mzalishaji na mtumiaji, huku masuala ya binafsi yakihusu mahusiano yako ya faragha, imani, na uhuru wa mwili"
wrong_answers:
  - "Kwa sababu mijadala yote ya kisiasa hatimaye hupunguzwa kuwa kutoelewana kuhusu viwango vya kodi na desturi za kidini"
  - "Kwa sababu kihistoria serikali hudhibiti vitu viwili tu: soko na jeshi"
  - "Kwa sababu wanafalsafa wa kisiasa daima wametenganisha masuala ya nyenzo na masuala ya kiroho tangu kale"
explanation: >-
  Mfano wa vipimo viwili unatokana na wazo kwamba masuala ya kisiasa hugawanyika katika kategoria mbili pana. Uhuru wa kiuchumi unahusu uzalishaji, matumizi, biashara, ajira, na usimamizi wa pesa. Uhuru wa binafsi unahusu mahusiano ya faragha, maoni, imani, na chaguo kuhusu mwili na akili yako mwenyewe. Utenganishaji huu huruhusu uchoraji ramani wa misimamo ya kisiasa ulio na undani zaidi kuliko mhimili mmoja wa kushoto-kulia.
