question: What does freedom entail?
answer: The power to do what one wants with what belongs to them
wrong_answers:
  - The absence of external constraints
  - The right to participate in collective political decisions
  - The ability to think and act independently
explanation: |
  Freedom is defined in this course as the ability to make choices over one's affairs and to dispose of oneself and one's property under the condition of responsibility. It is fundamentally individual and tied to property rights.
reviewed: true
