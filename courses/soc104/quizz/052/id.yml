question: "Mengapa kaum liberal klasik di Amerika Serikat mulai menyebut diri mereka 'libertarian' selama abad kedua puluh?"
answer: "Karena 'liberalisme' Amerika telah dikooptasi oleh intervensionisme negara yang berkembang dan welfare state"
wrong_answers:
  - "Karena mereka ingin menjauhkan diri dari tradisi monarkis Eropa"
  - "Karena istilah 'liberal' menjadi dikaitkan dengan anarkisme dan kekerasan politik"
  - "Karena perjanjian perdagangan baru mensyaratkan identitas politik yang berbeda bagi pendukung pasar bebas"
explanation: >-
  Selama abad kedua puluh, terjadi pergeseran fundamental ketika prinsip laissez-faire secara progresif ditinggalkan demi welfare state. "Liberalisme" Amerika mulai berarti sesuatu yang sangat berbeda dari liberalisme klasik, yakni merangkul intervensionisme negara. Kaum liberal klasik mengadopsi istilah "libertarian" untuk mempertahankan pembedaan tersebut. Rebranding ini tidak ada hubungannya dengan monarkisme Eropa, kekerasan anarkis, atau perjanjian perdagangan.
