question: "Dhana ya 'spontaneous order' kama ilivyoelezwa na Friedrich Hayek ni nini?"
answer: "Kanuni na desturi za kijamii zinapaswa kujitokeza kutokana na mwingiliano huru wa watu binafsi badala ya kulazimishwa na upangaji wa kimabavu"
wrong_answers:
  - "Masoko kwa asili huelekea kwenye ukiritimba isipokuwa dola iingilie ili kudumisha uwiano wa ushindani"
  - "Uchaguzi wa kidemokrasia ndio utaratibu pekee halali wa kuanzisha sheria zinazoitawala jamii"
  - "Migogoro ya kiuchumi hutokea yenyewe na huhitaji uingiliaji wa haraka wa serikali ili kurejesha uthabiti"
explanation: >-
  Dhana ya Hayek ya spontaneous order inasema kwamba kanuni zinazoitawala jamii hazipaswi kulazimishwa kutoka juu na upangaji wa kati, bali zinapaswa kujitokeza kutokana na mwingiliano huru wa matashi ya watu binafsi, mikataba, na mahusiano ya hiari. Huu ni mhimili wa msingi wa fikra za libertarian. Haimaanishi kwamba masoko huelekea kwenye ukiritimba au kwamba migogoro huhitaji uingiliaji wa serikali.
