question: "Uwuharanira umwidegemvyo ariko ari umunyabugumyabanga w'umuco afata gute inyifato atemera mu vy'inyifato runtu?"
answer: "Arayirwanya kandi akayica intege biciye mu kujijura no mu karorero, ariko adakoresheje inguvu z'agahato z'itegeko"
wrong_answers:
  - "Arashigikira ko intwaro zo mu karere zibuza izo nyifato mu gihe arwanya ukuzibuza ku rwego rwa Leta nkuru"
  - "Araceceka burundu kuri izo nyifato, yemera ko uburyo bwose bwo kuzigaya buhonyanga umwidegemvyo w'umuntu"
  - "Arasaba amasentare y'ikibano ashobora guhana izo nyifato hanze y'uburyo busanzwe bw'amategeko"
explanation: >-
  Uwuharanira umwidegemvyo ariko ari umunyabugumyabanga w'umuco yoshobora kwanka mu vy'inyifato runtu inyifato zimwezimwe, ariko ntasaba ko ibikorwa vyumvikanyweko kandi bidatera uwundi bibuzwa n'amategeko. Yoshobora kudakunda ivyo bikorwa, kubirwanya, no kubica intege n'umwete, ariko imisi yose abicisha mu kujijura, indero, n'akarorero aho kubicisha mu nguvu z'agahato z'itegeko. Ivyo si ukuvuga guceceka canke kurema ubundi buryo bwo guhatira abantu.
