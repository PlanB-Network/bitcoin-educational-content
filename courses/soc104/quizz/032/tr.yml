question: "Liberteryenler özel mülkiyet ile özgürlük arasındaki ilişkiyi nasıl görür?"
answer: "Özel mülkiyet, hukuktan ve devletten önce gelen doğal bir haktır ve özgürlüğün bizzat temelidir"
wrong_answers:
  - "Özel mülkiyet, devlet tarafından oluşturulan ve eşitsizliğe yol açtığında geri alınabilen toplumsal bir uzlaşıdır"
  - "Özel mülkiyet ekonomik verimlilik için yararlıdır, ancak kendiliğinden ahlaki veya felsefi bir öneme sahip değildir"
  - "Özel mülkiyet yalnızca kişisel eşyalar için var olmalı, üretken varlıklar veya arazi için var olmamalıdır"
explanation: >-
  Liberteryenler özel mülkiyeti, hukuktan ve devletten önce gelen doğal bir hak olarak savunur. Bir birey kendi bedenine sahipse, emeğine ve emeğinin meyvelerine de sahip olduğunu ileri sürerler. Maddi mallara sahiplik, kişinin kendine sahip olmasının bir uzantısıdır. Bu, mülkiyetin toplumsal bir uzlaşı veya bir baskı kaynağı olduğunu savunan libertaire görüşle keskin biçimde zıtlaşır.
