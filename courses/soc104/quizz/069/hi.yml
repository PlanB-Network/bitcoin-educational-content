question: "अपनी साझा सर्वसत्तावादी विधियों के बावजूद, हिटलर के जर्मनी और स्टालिन के सोवियत संघ के आर्थिक दृष्टिकोण कैसे भिन्न थे?"
answer: "नाज़ी जर्मनी ने निजी संपत्ति का आभास बनाए रखा, जबकि निजी क्षेत्र को राज्य के उद्देश्यों के अधीन कर दिया; इसके विपरीत स्टालिनवाद ने सभी निजी स्वामित्व को समाप्त कर दिया और अर्थव्यवस्था की पूरी योजना बनाई"
wrong_answers:
  - "नाज़ी जर्मनी ने सभी उद्योगों का पूर्ण राष्ट्रीयकरण किया, जबकि स्टालिन के शासन ने कृषि में सीमित निजी उद्यम की अनुमति दी"
  - "नाज़ी जर्मनी ने पुनःशस्त्रीकरण के लिए धन जुटाने हेतु मुक्त अंतरराष्ट्रीय व्यापार को बढ़ावा दिया, जबकि स्टालिनवाद ने पूर्ण आर्थिक अलगाव लागू किया"
  - "नाज़ी जर्मनी राज्य के साथ स्वैच्छिक कॉर्पोरेट सहयोग पर निर्भर था, जबकि स्टालिनवाद ने केवल जबरन श्रम का उपयोग किया"
explanation: >-
  हालांकि दोनों शासनों ने समान राजनीतिक विधियों का उपयोग किया (व्यक्तित्व-पूजा, पूर्ण निगरानी, विरोध का व्यवस्थित उन्मूलन), उनके आर्थिक मॉडल रूप में भिन्न थे। नाज़ी जर्मनी ने निजी संपत्ति को औपचारिक रूप से समाप्त नहीं किया, लेकिन निजी क्षेत्र को युद्ध और पुनःशस्त्रीकरण जैसे राज्य लक्ष्यों के पूरी तरह अधीन कर दिया और आर्थिक आत्मनिर्भरता थोपी। स्टालिनवाद इससे आगे गया: उसने सभी निजी स्वामित्व को समाप्त किया, पंचवर्षीय योजनाएं लागू कीं और सभी उत्पादन तथा वितरण को सीधे नियंत्रित किया।
reviewed: false
