question: "法定貨幣制度如何強化統治者與被統治者之間的分野？"
answer: "它讓政府能透過創造貨幣來資助無限制支出，而這會透過通膨使儲蓄貶值"
wrong_answers:
  - "它讓公民透過民主選舉與公投直接控制貨幣政策"
  - "它防止政府借貸，迫使政府只能依賴稅收取得收入"
  - "它將新創造的貨幣平均分配給所有公民，以刺激經濟成長"
explanation: >-
  法定貨幣被描述為國家權力擴張的基石，因為它讓政府能夠借貸，並促使銀行印製新貨幣。由此產生的通膨會使人們的儲蓄貶值，讓最富有、最有權勢的實體受益。它並沒有賦予公民貨幣控制權，也沒有防止借貸或平等分配貨幣。
reviewed: false
