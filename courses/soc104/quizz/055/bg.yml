question: "Защо Ron Paul твърди, че Federal Reserve е вреден, и как Bitcoin се свързва с неговата позиция?"
answer: "Federal Reserve причинява инфлация и икономически цикли чрез манипулиране на фиатните пари, а Bitcoin представлява форма на sound money, която би могла да замени златния стандарт"
wrong_answers:
  - "Federal Reserve ограничава банковата конкуренция, а Bitcoin децентрализира банковите услуги, за да подобри финансовото включване"
  - "Federal Reserve възпрепятства свободната търговия между нациите, а Bitcoin позволява трансгранични трансакции без правителствено одобрение"
  - "Federal Reserve създава прекомерен държавен дълг, а Bitcoin предлага дефлационна валута, която премахва националния дълг"
explanation: >-
  Ron Paul, минархист, твърди, че Federal Reserve е отговорен за инфлацията и икономическите цикли, защото манипулира фиатните пари. Той защитава денационализацията на парите, идея, застъпвана от Friedrich Hayek, и вижда Bitcoin като форма на sound money, която би могла да замени златния стандарт. Критиката му се корени в либертарианската парична теория, а не основно в банковата конкуренция, търговските бариери или държавния дълг.
reviewed: false
