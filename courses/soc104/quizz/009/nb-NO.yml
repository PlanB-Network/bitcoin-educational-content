question: "Hvor befinner De grønne seg i Nolan-diagrammet, og hvorfor?"
answer: "Svært lavt i diagrammet, fordi de mener at individuell interesse ikke må gå foran planetens kollektive interesse"
wrong_answers:
  - "Øverst i diagrammet, fordi de prioriterer personlig frihet og miljøbevissthet likt"
  - "I sentrum av diagrammet, fordi de balanserer økonomisk vekst med miljøvern"
  - "Lengst til høyre, fordi de støtter markedsbaserte løsninger på miljøutfordringer"
explanation: >-
  De grønne befinner seg svært lavt i Nolan-diagrammet fordi de favoriserer sterk statlig kontroll over både økonomiske og personlige beslutninger i planetens velferds navn. De har erstattet den marxistiske klassekampen med en kamp mellom menneske og natur, og tenderer mot å forsvare økonomisk kontroll og til og med avskaffelse av privat eiendom. Dette plasserer dem i den autoritære sektoren, ikke på toppen eller i sentrum.
reviewed: false
