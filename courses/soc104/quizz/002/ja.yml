question: "国民議会でのフレデリック・バスティアの投票を導いた原則は何でしたか？"
answer: "個人的および経済的自由の促進と、政府の干渉の削減"
wrong_answers:
  - "王権の擁護と君主制の伝統の維持"
  - "富をより平等に再分配するための社会主義政策の推進"
  - "左派と右派の諸派の間で妥協する中道戦略"
explanation: >-
  バスティアは、個人的および経済的自由を促進し、政府の干渉を減らすという根本原則に基づいて投票しました。彼は中道の日和見主義者でも、王党派でも、社会主義者でもありませんでした。自由と限定された政府に沿う措置を提案した側であれば、どちらの側にも投票したのです。
reviewed: false
