question: "Uko aba libertarian batahura ubwisanzure bitandukaniye he n'uko aba centrist babutahura?"
answer: "Aba libertarian babona ubwisanzure nk'axiom idasabwa icemezo, mu gihe aba centrist baburanira ubwisanzure bivanye n'akaryo, hisunzwe ibihe n'ukugira akamaro"
wrong_answers:
  - "Aba libertarian bareka leta igakingira ubwisanzure mu buryo buhitamwo, mu gihe aba centrist banka uruhara rwose rwa leta mu gukingira uburenganzira bw'umuntu"
  - "Aba libertarian bashira ubwisanzure ku vy'ubutunzi gusa, mu gihe aba centrist babukoresha cane mu mice y'imibano n'iy'umuco"
  - "Aba libertarian n'aba centrist basangiye uko babona ubwisanzure ariko ntibumvikana ku bunini bwa leta ikenewe kugira ngo ibushitse"
explanation: >-
  Aba libertarian basigura ubwisanzure nk'ingingo ngenderwako rusangi, idafise ivyo isabwa, ikora nka axiom. Aba centrist, ku rundi ruhande, baburanira ubwisanzure bumwebumwe mu buryo bw'akaryo kandi bujanye n'ibihe, badakurikiza ingingo ngenderwako rusangi. Uburyo bwa centrist bugaragaza ko babona ubwisanzure nk'igikoresho, cama gishirwa munsi y'intumbero ngirakamaro nk'ukugira akamaro, ivyo aba libertarian banka ku buryo bw'ishimikiro.
