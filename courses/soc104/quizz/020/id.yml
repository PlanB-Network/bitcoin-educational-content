question: "Apa tujuan politik bersama yang dimiliki para statis kiri dan kanan?"
answer: "Memenangkan kekuasaan untuk mengorganisasi masyarakat sesuai dengan visi mereka tentang dunia dan memaksakannya kepada semua orang"
wrong_answers:
  - "Mengurangi ukuran pemerintah dan mengembalikan kekuasaan pengambilan keputusan kepada warga individu"
  - "Membentuk demokrasi langsung di mana setiap warga memberikan suara atas setiap keputusan legislatif"
  - "Menghapus partai politik dan menggantinya dengan tata kelola teknokratis independen"
explanation: >-
  Baik statis kiri maupun kanan memiliki tujuan politik yang sama: memenangkan kekuasaan untuk mengorganisasi masyarakat sesuai dengan pandangan dunia mereka dan memaksakannya kepada semua orang melalui legislasi. Perbedaannya hanya terletak pada nilai-nilai mereka: kanan menyerukan pembelaan peradaban, sementara kiri menyerukan pembelaan kelas pekerja atau kaum tertindas. Keduanya tidak berupaya mengurangi pemerintah atau menghapus partai.
