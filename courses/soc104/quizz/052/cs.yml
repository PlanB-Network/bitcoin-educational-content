question: "Jaký je klíčový rozdíl mezi minarchisty a anarchokapitalisty uvnitř libertarianismu?"
answer: "Minarchisté přijímají minimální stát pro obranu, justici a policii, zatímco anarchokapitalisté chtějí privatizovat všechny státní funkce"
wrong_answers:
  - "Minarchisté odmítají všechny formy vlády, zatímco anarchokapitalisté přijímají omezenou státní regulaci trhů"
  - "Minarchisté upřednostňují progresivní zdanění základních služeb, zatímco anarchokapitalisté odmítají veškeré zdanění"
  - "Minarchisté se soustředí pouze na ekonomickou svobodu, zatímco anarchokapitalisté hájí ekonomické i společenské svobody"
explanation: >-
  Minarchisté se domnívají, že stát by měl být omezen na základní funkce, jako jsou obrana, justice a policie („stát noční hlídač“), zatímco anarchokapitalisté tvrdí, že i tyto funkce by měly být privatizovány a spravovány prostřednictvím dobrovolné tržní konkurence. Jejich neshoda se týká spíše praktické implementace než základních etických principů. Obě tendence sdílejí stejné libertariánské hodnoty sebevlastnictví a neagrese.
