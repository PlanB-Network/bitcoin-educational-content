question: Какво е sum тип (A + B) в Simplicity?
answer: "Тагнато обединение: стойността е или A с ляв таг, или B с десен таг."
wrong_answers:
  - Тип, който съдържа всички стойности от A и B едновременно.
  - Аритметично събиране на битовите размери на двата съставни типа.
  - Функционален тип, който съпоставя всеки вход от A с изход в B.
explanation: >-
  Sum типът A + B е тагнато обединение. Всяка стойност носи еднобитов таг,
  който указва дали тя е ляв вариант (от тип A), или десен вариант
  (от тип B). Дори когато A и B са един и същ тип, стойностите с ляв таг и
  стойностите с десен таг остават различни.
reviewed: false
