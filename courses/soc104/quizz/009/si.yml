question: "Nolan diamond තුළ, උපරිම නිදහස නියෝජනය කරමින් ඉහළින් සිටින්නේ කුමන ස්ථානයද?"
answer: "Libertarianism, එය වැඩිම ආර්ථික සහ පුද්ගලික නිදහසට සහාය දක්වයි"
wrong_answers:
  - "Conservatism, එය සම්ප්‍රදායික වටිනාකම් සහ ආර්ථික නිදහසට සහාය දක්වයි"
  - "Centrism, එය සියලු දේශපාලන ස්ථාන ප්‍රායෝගික ආකාරයෙන් සමබර කරයි"
  - "Socialism, එය පුද්ගලික නිදහස සහ සමාජ සමානාත්මතාවයට සහාය දක්වයි"
explanation: >-
  Libertarianism Nolan diamondහි ඉහළ කොටස අත්පත් කරන්නේ statismහි විරුද්ධ පැත්ත ලෙසය. එය ආර්ථික සහ පුද්ගලික නිදහස දෙකෙහිම වැඩිම මට්ටමට සහාය දෙන අය නියෝජනය කරයි. Conservatism දකුණු පැත්තේ (ඉහළ ආර්ථික, අඩු පුද්ගලික නිදහස), socialism වම් පැත්තේ (ඉහළ පුද්ගලික, අඩු ආර්ථික නිදහස), සහ centrism මධ්‍යයේ සිටී.
reviewed: false
