question: "Какие знаковые фигуры связаны с максимальной экономической свободой на диаграмме Нолана?"
answer: "Маргарет Тэтчер, Рональд Рейган и Хавьер Милей"
wrong_answers:
  - "Франклин Д. Рузвельт, Жан Жорес и Берни Сандерс"
  - "Нельсон Мандела, Симона Вейль и Ноам Хомский"
  - "Владимир Путин, Си Цзиньпин и Жозеф де Местр"
explanation: >-
  Тэтчер, Рейган и Милей приведены как знаковые фигуры максимальной экономической свободы, выступающие за меньшее государственное вмешательство, меньшее регулирование и более низкие налоги. Рузвельт, Жорес и Сандерс представляют противоположный край, выступающий за государственный контроль экономики. Мандела, Вейль и Хомский представляют максимальную личную свободу. Путин, Си Цзиньпин и де Местр представляют максимальный государственный контроль над личной жизнью.
