bio: |
  Pasionat de Bitcoin și convins că educația este cheia, doresc să vă împărtășesc puținele cunoștințe pe care le am și să contribui astfel la adopția Bitcoin. În rest, sunt un mare fan Pink Floyd, învăț să programez și fac meme-uri. Aștept cu nerăbdare să ne vedem la următorul meet-up!
  Sunt creatorul cursului BTC 205 - Soluție de cumpărare fără KYC.

short_bio: KYC este o escrocherie
