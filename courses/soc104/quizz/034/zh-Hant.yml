question: "法國 libertaires（社會主義無政府主義者）對私有財產有何看法？"
answer: "私有財產與資本主義必須被廢除，因為它們是壓迫的來源"
wrong_answers:
  - "私有財產是一項先於國家的自然權利，必須不惜一切代價加以保護"
  - "私有財產應由國家管制，但絕不應從社會中完全消除"
  - "私有財產只有在平等分配給公社所有成員時才可以接受"
explanation: >-
  法國 libertaires 是經由 Proudhon 與 Bakunin 等思想家傳承社會主義無政府主義的繼承者，他們認為國家與私有財產都必須被廢除，因為兩者同為壓迫的來源。這體現在 Proudhon 的著名公式「財產就是盜竊」。第一個錯誤答案描述的是自由意志主義立場，這與 libertaire 觀點根本相反。
reviewed: false
