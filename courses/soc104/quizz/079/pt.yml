question: "Por que a previsão de Molinari de 1849 se mostrou profética quanto à relação entre liberdade e poder político?"
answer: "Porque conservadores e socialistas se alternaram no poder e instrumentalizaram a liberdade a serviço de seus respectivos objetivos políticos, exatamente como ele descreveu"
wrong_answers:
  - "Porque o personagem economista que ele descreveu acabou conquistando o poder político e implementando políticas libertárias em toda a Europa"
  - "Porque sua previsão de que todas as três famílias políticas se fundiriam em um único movimento centrista se concretizou no século XX"
  - "Porque a liberdade foi gradualmente ampliada por governos sucessivos até se tornar o princípio organizador primário das democracias modernas"
explanation: >-
  A visão de Molinari se mostrou profética porque, desde meados do século XIX, conservadores e socialistas se alternaram no poder e fizeram precisamente o que ele descreveu: a instrumentalização da liberdade a serviço de objetivos políticos. Ambas as famílias estão dispostas a restringir liberdades e recorrer ao estado para impor suas respectivas agendas, enquanto a posição do economista de liberdade incondicional permaneceu marginalizada.
