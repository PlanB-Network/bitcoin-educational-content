question: "Indangagaciro nyamukuru za centrism ni izihe?"
answer: "Ukugereranya, ukwumvikana, ukwihindura, n'akamaro ka bose"
wrong_answers:
  - "Imigenzo, urutonde, ubukuru, n'akaranga k'igihugu"
  - "Umwidegemvyo, umutungo bwite, ukwemera ku bushake, n'ukwiyubara kw'umuntu ku giti ciwe"
  - "Ubungane, ubutungane bw'imibano, ugushigikirana, n'umutungo rusangi"
explanation: >-
  Indangagaciro nyamukuru za centrism ni ukugereranya, ukwumvikana, ukwihindura, n'akamaro ka bose. Ivyo vyerekana uko centrists bashira imbere ukuringaniza gushingiye kuri pragmatism kurusha ukwiyemeza kwa ideology. Ayandi mahitamwo adondora indangagaciro nyamukuru za conservatism, libertarianism, na socialism uko zikurikirana.
