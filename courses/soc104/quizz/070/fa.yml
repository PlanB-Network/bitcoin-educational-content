question: "در سراسر پنج مناظره اجتماعی (ازدواج، مهاجرت، سلاح گرم، مواد مخدر، نوشیدنی‌های قندی)، چه چارچوب تحلیلی تکرارشونده‌ای موضع سوسیالیستی را در هر مسئله شکل می‌دهد؟"
answer: "چارچوبی مبتنی بر تعارض میان سلطه‌گران و سلطه‌پذیران، که در آن جامعه با ستم ساختار یافته است و دولت باید برای حفاظت از گروه آسیب‌پذیر مداخله کند"
wrong_answers:
  - "چارچوبی فایده‌گرایانه که بر بیشینه‌سازی خوشبختی کلی و بهره‌وری اقتصادی برای بیشترین تعداد شهروندان تمرکز دارد"
  - "چارچوبی مبتنی بر حقوق طبیعی که در آن آزادی‌های فردی باید هم از مداخله دولت و هم از مداخله شرکت‌ها محافظت شوند"
  - "چارچوبی سنت‌گرا که در آن نهادهای اجتماعی تثبیت‌شده باید در برابر تغییرات مدرنِ اخلال‌گر حفظ شوند"
explanation: >-
  موضع سوسیالیستی در سراسر مناظره‌های اجتماعی همواره با چارچوب تعارضِ سلطه‌گر/سلطه‌پذیر شکل می‌گیرد. در ازدواج، اکثریت دگرجنس‌گرا اقلیت همجنس‌گرا را سرکوب می‌کند. در مهاجرت، محدودیت‌های مبتنی بر ملیت شکل‌هایی از ستم‌اند. در سلاح گرم، فقط دولت باید نیروی قهریه را در اختیار داشته باشد تا از آسیب‌پذیران محافظت کند. در نوشیدنی‌های قندی، صنعتگران از آسیب‌پذیری کم‌حمایت‌ترین افراد سود می‌برند. این لنز ستمگر/ستم‌دیده در حوزه‌های فراوانی از جمله جنسیت، نژاد و حتی رابطه میان انسانیت و طبیعت بازتولید می‌شود.
reviewed: false
