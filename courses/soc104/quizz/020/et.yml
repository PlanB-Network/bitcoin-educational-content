question: "Mis on kultuuriline konservatism?"
answer: "Isiklik kinnihoidmine minevikust päritud perekondlikest, moraalsetest, esteetilistest ja metafüüsilistest väärtustest, mitte poliitiline filosoofia"
wrong_answers:
  - "Poliitiline ideoloogia, mis kasutab riigivõimu, et suruda traditsioonilised väärtused seadusandluse kaudu kogu ühiskonnale peale"
  - "Liikumine, mis hülgab kõik modernsuse vormid ja püüab viia ühiskonna tagasi industriaalajastu eelsesse eluviisi"
  - "Majandusdoktriin, mis kaitseb riiklikke tööstusharusid ja vastustab vabakaubandust välisriikidega"
explanation: >-
  Kultuurilist konservatismi määratletakse elutarkusena: isiklik kinnihoidmine minevikust päritud perekondlikest, moraalsetest, esteetilistest ja metafüüsilistest väärtustest, olgu need kreeka-rooma või juudi-kristlikud. See ei ole sõnaselgelt poliitiline filosoofia. See erineb poliitilisest konservatismist, mille eesmärk on säilitada poliitilised institutsioonid ja ühiskonnakord riigivõimu kaudu. Samuti ei tähenda see modernsuse hülgamist ega majanduslikku protektsionismi.
reviewed: false
