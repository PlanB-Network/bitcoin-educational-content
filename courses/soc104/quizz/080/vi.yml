question: "Chủ nghĩa kiến tạo với tư cách một xác tín chính trị chung là gì?"
answer: "Niềm tin rằng một chính phủ trung ương có thể tạo ra, bằng sức mạnh của luật pháp, một trật tự xã hội tốt cho số đông nhất"
wrong_answers:
  - "Niềm tin rằng xã hội nên được tổ chức thông qua hợp tác tự nguyện giữa các cá nhân mà không có sự can thiệp của nhà nước"
  - "Niềm tin rằng chỉ các thị trường tự do mới có thể xác định sự phân bổ tài nguyên tối ưu trong xã hội"
  - "Niềm tin rằng quyền lực chính trị nên được phân bổ ngang nhau giữa mọi công dân thông qua dân chủ trực tiếp"
explanation: >-
  Chủ nghĩa kiến tạo liên kết những người trung dung, bảo thủ và xã hội chủ nghĩa quanh một xác tín chung: tính ưu việt của tiến trình chính trị so với tiến trình thị trường. Đó là niềm tin rằng một chính phủ trung ương có thể tạo ra, bằng sức mạnh của luật pháp, một trật tự xã hội tốt cho số đông nhất. Điều này đối lập trực tiếp với sự bảo vệ libertarian dành cho trật tự tự phát nảy sinh từ các tương tác tự nguyện.
