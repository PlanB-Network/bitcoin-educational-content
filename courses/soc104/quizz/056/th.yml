question: "ปฏิทรรศน์ที่ซ่อนอยู่ภายในปฏิบัตินิยมแบบสายกลางคืออะไร?"
answer: "ปฏิบัตินิยมเองตั้งอยู่บนรูปแบบหนึ่งของ dogmatism นั่นคือความเชื่อมั่นที่ไม่ได้กล่าวออกมาว่ามีเพียงผู้เชี่ยวชาญเท่านั้นที่มีความสามารถในการขับเคลื่อนสังคม"
wrong_answers:
  - "สายกลางอ้างว่าตนพอประมาณ แต่กลับเข้าข้างพรรคฝ่ายซ้ายอย่างสม่ำเสมอในรัฐบาลผสม"
  - "นโยบายสายกลางดูสมดุล แต่เอื้อการเติบโตทางเศรษฐกิจเหนือการคุ้มครองสิ่งแวดล้อมเสมอ"
  - "สายกลางปฏิเสธอุดมการณ์ แต่รับหลักตลาดเสรีที่แข็งทื่อมาใช้เมื่อตัดสินใจทางเศรษฐกิจ"
explanation: >-
  ปฏิทรรศน์ของปฏิบัตินิยมแบบสายกลางคือมันอ้างว่าปฏิเสธอุดมการณ์เพื่อสนับสนุนความเชี่ยวชาญเชิงเหตุผล แต่ข้ออ้างนี้เองกลับตั้งอยู่บน dogma ที่มองไม่เห็นและไม่ได้กล่าวออกมา: ว่ามีเพียงเทคโนแครตเท่านั้นที่สามารถตัดสินใจได้ถูกต้อง ความเชื่อมั่นว่าผู้เชี่ยวชาญเท่านั้นควรขับเคลื่อนสังคมนั้นเป็นพันธะทางอุดมการณ์ในตัวเอง แม้สายกลางจะไม่ยอมรับว่ามันเป็นเช่นนั้นก็ตาม
reviewed: false
