question: "Que terreno comum libertários e conservadores compartilham, e o que os divide?"
answer: "Eles compartilham o apego ao governo limitado e a rejeição ao igualitarismo forçado, mas discordam sobre o intervencionismo militar e as políticas sociais"
wrong_answers:
  - "Eles compartilham o apoio a políticas comerciais protecionistas e à defesa nacional, mas discordam sobre o papel da religião na vida pública"
  - "Eles compartilham um compromisso com tributação progressiva e programas de bem-estar social, mas discordam sobre a política de imigração"
  - "Eles compartilham oposição ao livre comércio e à legalização das drogas, mas discordam sobre o tamanho do governo federal"
explanation: >-
  Libertários e conservadores defendem ambos o governo limitado, rejeitam o igualitarismo forçado, opõem-se à dívida pública e defendem os direitos dos estados. No entanto, libertários rejeitam o intervencionismo militar dos neoconservadores, opõem-se às políticas sociais conservadoras e aos subsídios, condenam a proibição das drogas e rejeitam o protecionismo. A aliança é real, mas inerentemente tensa.
