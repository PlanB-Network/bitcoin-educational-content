bio: |
  Thibaut Gress este filosof, autor și educator francez. Absolvent al ENS (École Normale Supérieure), deține agregarea (agrégation) și un doctorat în filosofie. Predă filosofie în Classes Préparatoires la ENC Blomet, precum și la ICP și ESJ. A fondat și a condus ca redactor-șef revista Actu-Philosophia și este colaborator constant al revistei Revue Conflits. A publicat aproximativ cincisprezece cărți, axate în principal pe filosofia secolului al XVII-lea, în care investighează geneza liberalismului prin prelegeri și lucrări analitice.

short_bio: Filosof și autor specializat în liberalism
