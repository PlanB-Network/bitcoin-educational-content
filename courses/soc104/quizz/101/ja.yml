question: "このコースは、従来の左・右・中道のスペクトルを超えて、本当の政治的分断を何だと特定しているか？"
answer: "根本的な哲学的原則のあいだの分断、すなわち自由か強制か、自発的同意か強要か、責任ある個人か集合か"
wrong_answers:
  - "国際貿易協定とグローバル金融機関の支配をめぐる、富裕国と貧困国のあいだの分断"
  - "政府支出の優先順位とインフラ投資をめぐる、都市部と農村部の住民のあいだの分断"
  - "社会規範、家族的価値、宗教教育をめぐる、進歩的文化と伝統的文化のあいだの分断"
explanation: >-
  このコースは、本当の政治的分断は従来の左・右・中道というラベルの中にあるのではなく、根本的な哲学的原則の中にあると論じている。
  それは、自由か強制か、自発的同意か強要か、責任ある個人か集合かである。
  政治について考える正しい方法は、ラベルではなく倫理原則から始めることである。
reviewed: false
