question: Čo alebo koho treba podľa Boisguilberta nechať konať slobodne?
answer: Prírodu, teda prirodzený poriadok vecí
wrong_answers:
  - Moc, teda kráľa, jeho radu a ministrov
  - Ľudí, teda sedliakov, remeselníkov a pracovníkov
  - Finančné trhy
explanation: |
  Boisguilbert bol zástancom prirodzeného poriadku a laissez-faire. Veril, že hospodárstvo treba nechať konať samo, bez prehnaného zasahovania štátu, aby sa prirodzený poriadok vecí mohol rozvinúť a zaručil prosperitu.
