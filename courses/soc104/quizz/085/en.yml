question: "How do the three essential functions of the free market, as described by libertarians, together constitute both an efficient and ethical system of social organization?"
answer: "Prices provide a compass for decisions, the market reveals authentic preferences through supply and demand, and free exchange enables individuals to determine their own affairs according to personal values, combining informational efficiency with moral autonomy"
wrong_answers:
  - "The market maximizes total wealth, prevents monopolies through natural competition, and ensures equal distribution of resources, combining productivity with social justice"
  - "Free markets reduce government spending, stimulate technological innovation, and create employment opportunities, combining fiscal responsibility with economic growth"
  - "Markets lower consumer prices, increase product quality through competition, and expand international trade, combining domestic prosperity with global cooperation"
explanation: >-
  The libertarian case for the free market rests on three interconnected functions. First, prices serve as reliable indicators guiding economic and social decisions (the compass). Second, the market reveals authentic individual preferences through supply and demand. Third, free exchange enables actors to determine their own affairs according to personal values. Hayek showed that free markets coordinate dispersed information better than central planning (efficiency), while mutual consent respects human dignity more than coercion (justice).
