question: "Hvilket felles politisk mål har venstreorienterte og høyreorienterte statister?"
answer: "Å vinne makt for å organisere samfunnet etter sitt verdenssyn og påtvinge det alle"
wrong_answers:
  - "Å redusere størrelsen på staten og gi beslutningsmakt tilbake til individuelle borgere"
  - "Å etablere et direkte demokrati der hver borger stemmer over hver lovgivningsbeslutning"
  - "Å avskaffe politiske partier og erstatte dem med uavhengig teknokratisk styring"
explanation: >-
  Både venstre- og høyreorienterte statister deler det samme politiske målet: å vinne makt for å organisere samfunnet etter sitt verdenssyn og påtvinge det alle gjennom lovgivning. Forskjellen ligger bare i verdiene deres: høyresiden påberoper seg forsvar av sivilisasjonen, mens venstresiden påberoper seg forsvar av arbeiderklassen eller de undertrykte. Ingen av dem søker å redusere staten eller avskaffe partier.
reviewed: false
