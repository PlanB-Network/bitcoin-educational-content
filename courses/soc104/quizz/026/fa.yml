question: "یک لیبرتارینِ از نظر فرهنگی محافظه‌کار با رفتارهایی که از نظر اخلاقی نمی‌پسندد چگونه برخورد می‌کند؟"
answer: "با اقناع و الگو بودن با آن رفتارها مخالفت می‌کند و آن‌ها را دلسرد می‌سازد، اما بدون توسل به نیروی قهری قانون"
wrong_answers:
  - "از ممنوعیت‌های دولت محلی علیه آن رفتارها حمایت می‌کند و در عین حال با ممنوعیت‌های سطح فدرال مخالف است"
  - "دربارهٔ آن رفتارها کاملاً سکوت می‌کند، چون معتقد است هر شکلی از ناپسندی آزادی فردی را نقض می‌کند"
  - "از دادگاه‌های اجتماعی‌ای دفاع می‌کند که می‌توانند آن رفتارها را خارج از نظام حقوقی رسمی مجازات کنند"
explanation: >-
  لیبرتارینِ از نظر فرهنگی محافظه‌کار ممکن است از نظر اخلاقی با برخی رفتارها مخالف باشد، اما از ممنوعیت قانونی کنش‌های توافقی و غیرتهاجمی دفاع نمی‌کند. او ممکن است چنین کنش‌هایی را نپسندد، با آن‌ها مخالفت کند و فعالانه از آن‌ها دلسرد سازد، اما همیشه از راه اقناع، آموزش و الگو بودن، نه از طریق نیروی قهری قانون. این مسئله دربارهٔ سکوت کردن یا ایجاد سازوکارهای اجرایی جایگزین نیست.
reviewed: false
