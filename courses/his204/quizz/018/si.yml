question: Cantillon බලපෑම් යනු කුමක්ද?
answer: රටක මුදල් ප්‍රමාණය වැඩි කිරීම ආදායම් බෙදාහැරීමට බලපායි
wrong_answers:
  - මුදල් ප්‍රමාණය වැඩි කිරීම මිනිසුන්ගේ හැසිරීමට බලපායි
  - මුදල් ප්‍රමාණය වැඩි කිරීම රාජ්‍ය ණය ප්‍රමාණයට බලපායි
  - මුදල් ප්‍රමාණය වැඩි කිරීමෙන් සැලකිය යුතු බලපෑමක් නැත
explanation: |
  Cantillon බලපෑම් විස්තර කරන්නේ මුදල් සැපයුමේ වැඩිවීමක් ආර්ථිකයේ වෙනස් අංශවල මිල සහ ආදායම් වෙනස් ලෙස බලපාන ආකාරයයි. නව මුදල් එන්නත් කිරීම සමානව පැතිරෙන්නේ නැත; එමඟින් විකෘතිතා සහ අසමානතා ඇති වේ.