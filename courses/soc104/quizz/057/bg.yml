question: "Какви са кардиналните ценности на центризма?"
answer: "Умереност, компромис, адаптация и обществена полезност"
wrong_answers:
  - "Традиция, ред, власт и национална идентичност"
  - "Свобода, частна собственост, съгласие и индивидуална отговорност"
  - "Равенство, социална справедливост, солидарност и колективна собственост"
explanation: >-
  Кардиналните ценности на центризма са умереност, компромис, адаптация и обществена полезност. Те отразяват центристкия акцент върху прагматичния баланс, а не върху идеологическа ангажираност. Другите варианти описват съответно кардиналните ценности на консерватизма, либертарианството и социализма.
reviewed: false
