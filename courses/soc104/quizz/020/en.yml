question: "What does the vertical axis of the Nolan diagram reveal about the true political question?"
answer: "It reveals whether you want to impose your own sensibilities on others through the state, or prefer that each person be free to decide for themselves"
wrong_answers:
  - "It reveals whether you support democratic governance or prefer authoritarian rule by a single leader"
  - "It reveals whether you identify with progressive social movements or with traditional religious institutions"
  - "It reveals whether your primary concern is national security or economic prosperity"
explanation: >-
  The vertical axis exposes the true political question: not whether you are left or right, but to what extent you want the state to intervene in shaping society according to your values. Do you wish to impose your sensibilities on others, or do you prefer that each person be free to decide for themselves? This framing transcends the left-right divide and shows that both camps can be equally statist.
reviewed: false
