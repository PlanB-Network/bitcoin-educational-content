question: "Quelles sont les valeurs cardinales du centrisme ?"
answer: "La modération, le compromis, l'adaptation et l'utilité publique"
wrong_answers:
  - "La tradition, l'ordre, l'autorité et l'identité nationale"
  - "La liberté, la propriété privée, le consentement et la responsabilité individuelle"
  - "L'égalité, la justice sociale, la solidarité et la propriété collective"
explanation: >-
  Les valeurs cardinales du centrisme sont la modération, le compromis, l'adaptation et l'utilité publique. Elles reflètent l'accent centriste mis sur l'équilibre pragmatique plutôt que sur l'engagement idéologique. Les autres options décrivent respectivement les valeurs cardinales du conservatisme, du libertarianisme et du socialisme.
reviewed: false
