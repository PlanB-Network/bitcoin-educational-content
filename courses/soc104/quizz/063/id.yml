question: "Apa perbedaan kunci Hannah Arendt antara despotisme klasik dan totalitarianisme?"
answer: "Totalitarianisme tidak sekadar menundukkan orang pada aturan tiranis, tetapi membuat manusia tidak mampu bertindak secara independen, sehingga menegasikan politik itu sendiri"
wrong_answers:
  - "Despotisme klasik mengendalikan ekonomi sementara totalitarianisme hanya mengendalikan institusi politik dan militer"
  - "Totalitarianisme hanyalah versi despotisme yang lebih ekstrem, hanya berbeda dalam skala represi"
  - "Despotisme klasik menggunakan ideologi untuk membenarkan kekuasaannya sementara totalitarianisme murni mengandalkan kekuatan militer"
explanation: >-
  Arendt berargumen bahwa totalitarianisme secara mendasar berbeda dari despotisme klasik. Ia bukan sekadar tirani yang lebih ekstrem, melainkan sebuah sistem yang membuat manusia menjadi tidak berguna, menghancurkan kapasitas mereka untuk bertindak secara independen. Bagi Arendt, politik adalah kapasitas suatu rakyat untuk mengambil nasibnya sendiri ke tangan mereka, dan totalitarianisme adalah negasi langsung dari kapasitas ini, sehingga secara kualitatif berbeda dari despotisme.
