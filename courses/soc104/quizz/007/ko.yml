question: "놀런 다이아몬드에서 가장 위에 위치하며 최대의 자유를 나타내는 입장은 무엇인가요?"
answer: "자유지상주의로, 가장 큰 경제적·개인적 자유를 지지합니다"
wrong_answers:
  - "보수주의로, 전통적 가치와 경제적 자유를 지지합니다"
  - "중도주의로, 모든 정치적 입장을 실용적으로 균형 있게 조정합니다"
  - "사회주의로, 개인적 자유와 사회적 평등을 지지합니다"
explanation: >-
  자유지상주의는 국가주의의 반대편으로서 놀런 다이아몬드의 꼭대기를 차지합니다. 이는 경제적 자유와 개인적 자유 모두에서 가장 큰 정도의 자유를 지지하는 사람들을 나타냅니다. 보수주의는 오른쪽(높은 경제적 자유, 낮은 개인적 자유)에, 사회주의는 왼쪽(높은 개인적 자유, 낮은 경제적 자유)에, 중도주의는 가운데에 위치합니다.
reviewed: false
