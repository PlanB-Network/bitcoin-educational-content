question: "බොහෝ දේශපාලන ගැටලු ආර්ථික සහ පුද්ගලික කාණ්ඩවලට බෙදිය හැකි බව ද්වි-මාන ආකෘතිය තර්ක කරන්නේ ඇයි?"
answer: "ආර්ථික ගැටලු ඔබ නිෂ්පාදකයෙකු සහ පාරිභෝගිකයෙකු ලෙස කරන දේ පිළිබඳ වන අතර, පුද්ගලික ගැටලු ඔබේ පුද්ගලික සබඳතා, විශ්වාස, සහ ශරීර ස්වයංපාලනය පිළිබඳ වන නිසා"
wrong_answers:
  - "සියලු දේශපාලන විවාද අවසානයේ බදු මට්ටම් සහ ආගමික පුරුදු පිළිබඳ අසම්මතිවලට අඩුවන නිසා"
  - "රජයන් ඉතිහාසය පුරා නියාමනය කර ඇත්තේ දේවල් දෙකක් පමණක් වන නිසා: වෙළඳපොළ සහ හමුදාව"
  - "දේශපාලන දාර්ශනිකයන් පුරාණ කාලයේ සිටම භෞතික සැලකිලි ආධ්‍යාත්මික සැලකිලිවලින් සැමවිටම වෙන් කර ඇති නිසා"
explanation: >-
  ද්වි-මාන ආකෘතිය පදනම් වන්නේ දේශපාලන ගැටලු පුළුල් කාණ්ඩ දෙකකට බෙදෙන බවට ඇති අදහස මතය. ආර්ථික නිදහස්තා නිෂ්පාදනය, පරිභෝජනය, වෙළඳාම, රැකියාව, සහ මුදල් කළමනාකරණය ආවරණය කරයි. පුද්ගලික නිදහස්තා පුද්ගලික සබඳතා, මත, විශ්වාස, සහ ඔබේම ශරීරය හා මනස පිළිබඳ තේරීම් ආවරණය කරයි. මෙම වෙන් කිරීම එක් වම-දකුණ අක්ෂයකට වඩා දේශපාලන ස්ථාන සිතියම්ගත කිරීම ඉතා වඩා සූක්ෂ්ම කරයි.
