question: "Na czym skupia się strukturalna definicja systemu politycznego?"
answer: "Na tym, jak system faktycznie funkcjonuje, oraz na jego obserwowalnych cechach, takich jak stopień kontroli państwa"
wrong_answers:
  - "Na deklarowanych celach i szlachetnych intencjach ogłoszonych przez założycieli i przywódców systemu"
  - "Na historycznych początkach ruchu politycznego i biografiach jego kluczowych myślicieli"
  - "Na liczbie dozwolonych partii politycznych i częstotliwości przeprowadzania demokratycznych wyborów"
explanation: >-
  Definicje strukturalne skupiają się na tym, jak systemy polityczne faktycznie funkcjonują, oraz na ich obserwowalnych cechach. Na przykład socjalizm jest strukturalnie charakteryzowany przez wszechobecność państwa. Podejście to kontrastuje z definicjami intencjonalnymi, które opierają się na deklarowanych motywacjach i celach. Podejście strukturalne pozwala na bardziej obiektywną ocenę opartą na mierzalnych rezultatach.
