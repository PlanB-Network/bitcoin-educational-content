question: "O que a esquerda quer legislar e regular?"
answer: "A economia, impulsionada pela hostilidade à liberdade econômica, ao capitalismo e ao livre mercado"
wrong_answers:
  - "A moralidade pessoal e as práticas religiosas, impulsionada pelo desejo de preservar instituições tradicionais"
  - "A imigração e as fronteiras nacionais, impulsionada por preocupações com identidade cultural e soberania"
  - "A tecnologia e a inovação, impulsionada por temores de que a automação substitua trabalhadores humanos"
explanation: >-
  A esquerda dá prioridade à justiça social e à igualdade, particularmente no nível econômico. Isso leva à sua hostilidade em relação à liberdade econômica, ao capitalismo e ao livre mercado, e ao seu desejo de legislar e regular a economia. A direita, em contraste, quer legislar sobre moralidade e religião. A regulamentação da imigração e da tecnologia não é o foco principal descrito aqui.
reviewed: false
