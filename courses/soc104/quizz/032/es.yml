question: "¿Cómo ven los libertarianos la relación entre la propiedad privada y la libertad?"
answer: "La propiedad privada es un derecho natural que precede a la ley y al Estado, y es el fundamento mismo de la libertad"
wrong_answers:
  - "La propiedad privada es una convención social creada por el Estado que puede revocarse cuando causa desigualdad"
  - "La propiedad privada es útil para la eficiencia económica, pero no tiene una importancia moral o filosófica inherente"
  - "La propiedad privada debería existir solo para las posesiones personales, no para los activos productivos o la tierra"
explanation: >-
  Los libertarianos defienden la propiedad privada como un derecho natural que precede a la ley y al Estado. Sostienen que, si un individuo es dueño de su propio cuerpo, también es dueño de su trabajo y de sus frutos. La propiedad de bienes materiales es una extensión de la autopropiedad. Esto contrasta marcadamente con la visión libertaire, según la cual la propiedad es una convención social o una fuente de opresión.
