question: Richard Cantillon 1708දී ප්‍රංශ පුරවැසියෙකු වූ නමුත්, ඔහු පැමිණියේ කොහෙන්ද?
answer: Ireland වෙතින්
wrong_answers:
  - Spain වෙතින්
  - England වෙතින්
  - Germany වෙතින්
explanation: |
  Richard Cantillon Irish සම්භවයක් ඇති අයෙකු වූ අතර පසුව 1708දී ප්‍රංශ ජාතිකත්වය ලබා ගත්තේය. ඔහු තම ජීවිතයේ විශාල කොටසක් Franceහි ගත කළ අතර, තම කාලයේ ප්‍රංශ ආර්ථික අදහස්වලින් බලපෑමට ලක් විය.