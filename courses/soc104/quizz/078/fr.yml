question: "Quelle est la distinction essentielle entre être pro-business et être pro-market ?"
answer: "Les partisans pro-business recherchent l'intervention de l'État pour protéger des entreprises spécifiques de la faillite, tandis que les partisans pro-market soutiennent la déréglementation et laissent les entreprises faire faillite afin que le marché puisse se réorganiser naturellement"
wrong_answers:
  - "Les partisans pro-business se concentrent sur les grandes entreprises tandis que les partisans pro-market se concentrent exclusivement sur le soutien aux petites entreprises et aux startups"
  - "Pro-business est une position de gauche qui favorise les coopératives de travailleurs tandis que pro-market est une position de droite qui favorise la propriété privée"
  - "Les partisans pro-business rejettent toute concurrence tandis que les partisans pro-market soutiennent une concurrence réglementée par l'État entre entreprises approuvées"
explanation: >-
  La position pro-business considère la concurrence comme un instrument de gouvernance obtenu par des réglementations et justifie les subventions et les renflouements pour éviter les pertes d'emplois. Dans la vision pro-business, le marché est fragile et a besoin du sauvetage de l'État. Les partisans pro-market voient la concurrence comme le résultat naturel de la libre entreprise, ce qui implique la déréglementation et le fait de laisser les entreprises faire faillite, car l'échec permet au marché de se réorganiser naturellement et ouvre le champ à des acteurs plus capables.
reviewed: false
