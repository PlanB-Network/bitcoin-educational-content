question: "Welche Warnung gab Milton Friedman hinsichtlich der Beurteilung politischer Maßnahmen?"
answer: "Maßnahmen sollten nach ihren Ergebnissen und nicht nach ihren Absichten beurteilt werden"
wrong_answers:
  - "Maßnahmen sollten nach dem moralischen Charakter der Politiker beurteilt werden, die sie vorschlagen"
  - "Maßnahmen sollten danach beurteilt werden, wie beliebt sie bei der allgemeinen Wählerschaft sind"
  - "Maßnahmen sollten danach beurteilt werden, ob sie mit der ursprünglichen Verfassung des Landes übereinstimmen"
explanation: >-
  Friedman schrieb, dass einer der größten Fehler darin besteht, Maßnahmen nach ihren Absichten statt nach ihren Ergebnissen zu beurteilen, und merkte an, dass Programme, die als für die Armen bestimmt bezeichnet werden, fast immer Wirkungen hervorbringen, die dem Gegenteil dessen entsprechen, was ihre Befürworter beabsichtigten. Dies erinnert an Bastiats Lehre, dass ein guter Ökonom sowohl kurz- als auch langfristige Auswirkungen auf die gesamte Bevölkerung berücksichtigt.
