question: Înaintea marchizului d'Argenson, cine a dezvoltat ideea de laissez-faire?
answer: Boisguilbert
wrong_answers:
  - Vauban
  - Cantillon
  - Colbert
explanation: |
  Pierre Le Pesant de Boisguilbert este considerat un precursor al laissez-faire-ului datorită apărării sale a libertății economice și a criticii pe care a adus-o intervenției excesive a statului în economie.
