question: "How did all totalitarian regimes come to power?"
answer: "Through violent revolution that justified making a clean slate of the previous system"
wrong_answers:
  - "Through gradual legislative reform within existing democratic institutions"
  - "Through military coups organized by foreign powers seeking regional control"
  - "Through peaceful mass movements that won popular elections by wide margins"
explanation: >-
  All totalitarian regimes came to power through violent revolution. This revolution serves a dual purpose: it physically destroys the old order and ideologically justifies the use of violence as necessary for building the new society. This distinguishes totalitarian takeovers from democratic transitions, foreign-backed coups, or peaceful electoral victories.
reviewed: false
