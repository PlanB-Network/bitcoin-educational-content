question: "Waarom zijn totalitaire regimes beschreven als 'seculiere religies', en wat onthult dit over de voorwaarden die nodig zijn voor totalitarisme om te bestaan?"
answer: "Ze eisen quasi-religieus geloof van militanten en gebruiken angst tegen tegenstanders, en totalitarisme vereist alle kenmerken tegelijk: onderdrukte vrijheden, eenpartijstelsel, gewelddadige revolutie en een geleide economie"
wrong_answers:
  - "Ze vervangen traditionele eredienst door staatsceremonies, en totalitarisme vereist alleen een charismatische leider en militaire controle"
  - "Ze gebruiken religieuze instellingen om staatsideologie af te dwingen, en totalitarisme kan ontstaan wanneer één politieke partij het parlement domineert"
  - "Ze beloven spirituele verlossing door politieke actie, en totalitarisme bestaat wanneer de staat de economie controleert, ongeacht politieke vrijheden"
explanation: >-
  Raymond Aron merkte op dat totalitaire regimes op twee principes functioneren: het geloof van de militanten en de angst van de tegenstanders. Dit quasi-religieuze fanatisme kenmerkt hen los van hun verschillende motieven, waardoor ze het label seculiere religies krijgen. Cruciaal is dat totalitarisme alle bepalende kenmerken tegelijk vereist: onderdrukte vrijheden, onbeperkt gezag via één partij, gewelddadige revolutie en een geleide economie. Moderne democratieën kunnen sommige van deze trekken vertonen, maar totalitarisme is pas aanwezig wanneer ze allemaal samenkomen.
reviewed: false
