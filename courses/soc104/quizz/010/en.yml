question: "Why is the vertical axis (top-bottom) considered more fundamental than the horizontal axis (left-right) in the Nolan diagram?"
answer: "Because it reveals the true divide between those who defend maximum individual freedoms and those who favor maximum state control"
wrong_answers:
  - "Because it measures economic output more accurately than the horizontal axis measures social policies"
  - "Because most political conflicts throughout history have been about cultural identity rather than governance"
  - "Because the horizontal axis only applies to modern democracies while the vertical axis is universal"
explanation: >-
  The fundamental axis is the vertical one because it captures the essential political question: to what degree should the state control human action? The left-right axis merely reflects different sensibilities (social justice vs. tradition), but both sides can occupy the same position on the vertical axis as statists. The vertical axis reveals whether someone wants to impose their vision by force or respects individual freedom.
reviewed: false
