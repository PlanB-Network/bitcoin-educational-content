question: "Hur förstärker fiat-penningsystemet klyftan mellan styrande och styrda?"
answer: "Det låter regeringar finansiera obegränsade utgifter genom penningskapande, vilket urholkar sparande genom inflation"
wrong_answers:
  - "Det ger medborgarna direkt kontroll över penningpolitiken genom demokratiska val och folkomröstningar"
  - "Det hindrar regeringar från att låna, vilket tvingar dem att enbart förlita sig på beskattning för intäkter"
  - "Det fördelar nyskapade pengar lika mellan alla medborgare för att stimulera ekonomisk tillväxt"
explanation: >-
  Fiatvaluta beskrivs som hörnstenen i utvidgningen av statens makt eftersom den låter regeringar låna och driva banker att trycka nya pengar. Den inflation som följer urholkar människors sparande och gynnar de rikaste och mäktigaste aktörerna. Den ger inte medborgarna monetär kontroll, och den hindrar varken upplåning eller fördelar pengar lika.
reviewed: false
