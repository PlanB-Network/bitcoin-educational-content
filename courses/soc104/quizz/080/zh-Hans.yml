question: "当自由意志主义者和其他政治家族共享相同目标时，关键分歧是什么？"
answer: "分歧在于手段：自由意志主义者拒绝强制性解决方案，并支持通过市场过程进行自愿交换"
wrong_answers:
  - "分歧在于目的：自由意志主义者追求个人财富等不同目标，而不是社会福利"
  - "分歧在于时机：自由意志主义者希望通过渐进改革更缓慢地实现相同目标"
  - "分歧在于范围：自由意志主义者希望只在地方层面而非国家层面适用相同政策"
explanation: >-
  自由意志主义者可以在某些目标上同意社会主义者、保守主义者和中间主义者，例如捍卫被压迫者或促进社会凝聚。分歧不在目的，而在手段。自由意志主义者拒绝所有试图统一实践和监管的强制性解决方案，而是通过建立在自愿契约之上的自由、去中心化交换，捍卫选择权和负责任自由。
reviewed: false
