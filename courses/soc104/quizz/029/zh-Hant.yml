question: "自由意志主義者與保守主義者有哪些共同基礎，又是什麼使他們分歧？"
answer: "他們同樣重視有限政府並拒絕強制平等主義，但在軍事干預主義與社會政策上存在分歧"
wrong_answers:
  - "他們都支持保護主義貿易政策與國防，但在宗教於公共生活中的角色上存在分歧"
  - "他們都承諾支持累進稅與福利計畫，但在移民政策上存在分歧"
  - "他們都反對自由貿易與毒品合法化，但在聯邦政府規模上存在分歧"
explanation: >-
  自由意志主義者與保守主義者都支持有限政府、拒絕強制平等主義、反對公共債務，並捍衛各州權利。然而，自由意志主義者拒絕新保守主義者的軍事干預主義，反對保守主義社會政策與補貼，譴責禁毒，並拒絕保護主義。這一聯盟是真實的，但內在緊張。
reviewed: false
