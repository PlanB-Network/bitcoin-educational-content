question: "좌파 국가주의자와 우파 국가주의자가 공유하는 정치적 목표는 무엇인가요?"
answer: "권력을 획득해 자신들의 세계관에 따라 사회를 조직하고 그것을 모두에게 강요하는 것입니다"
wrong_answers:
  - "정부 규모를 줄이고 의사결정 권한을 개별 시민에게 돌려주는 것입니다"
  - "모든 시민이 모든 입법 결정에 투표하는 직접 민주주의를 수립하는 것입니다"
  - "정당을 없애고 독립적인 기술관료 통치로 대체하는 것입니다"
explanation: >-
  좌파와 우파 국가주의자는 같은 정치적 목표를 공유합니다. 권력을 획득해 자신들의 세계관에 따라 사회를 조직하고, 입법을 통해 그것을 모두에게 강요하는 것입니다. 차이는 그들의 가치에만 있습니다. 우파는 문명 방어를 내세우고, 좌파는 노동자 계급이나 억압받는 이들의 방어를 내세웁니다. 어느 쪽도 정부를 줄이거나 정당을 없애려 하지 않습니다.
reviewed: false
