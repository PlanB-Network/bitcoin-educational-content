question: "ทำไมหลักสูตรจึงอธิบาย Bitcoin ว่าเป็นเงินตลาดที่ต่อต้านเงินรัฐ แทนที่จะเป็นโครงการฝ่ายขวาหรือฝ่ายซ้าย?"
answer: "เพราะ Bitcoin เป็นสกุลเงินที่ถูกยอมรับโดยสมัครใจ ผลิตยาก และกระจายศูนย์ซึ่งรักษามูลค่า ตรงข้ามกับเงิน fiat แบบบังคับและรวมศูนย์ที่สูญเสียมูลค่า ทำให้เส้นแบ่งเป็นเรื่องตลาดกับรัฐ ไม่ใช่อุดมการณ์ทางการเมือง"
wrong_answers:
  - "เพราะ Bitcoin ถูกสร้างโดยนักพัฒนานิรนามที่จงใจหลีกเลี่ยงการแถลงทางการเมืองใด ๆ เกี่ยวกับวัตถุประสงค์หรือปรัชญาที่ตั้งใจไว้"
  - "เพราะอัลกอริทึม mining ของ Bitcoin รับประกันการกระจายเหรียญใหม่อย่างเท่าเทียมแก่พรรคการเมืองทั้งหมด ป้องกันอคติทางอุดมการณ์ในระบบการเงิน"
  - "เพราะ Bitcoin ทำหน้าที่เหมือนสกุลเงิน fiat ที่มีอยู่ทุกประการ แต่ทำงานบนเครือข่ายชำระเงินที่เร็วกว่า ทำให้ความแตกต่างทางการเมืองไม่เกี่ยวข้อง"
explanation: >-
  Bitcoin ถูกอธิบายว่าเป็นการกบฏอย่างสันติต่อการทำให้เงินเป็นการเมือง เงินของรัฐหรือเงิน fiat เป็นระบบบังคับรวมศูนย์ที่มีแนวโน้มสูญเสียมูลค่า เงินตลาด ซึ่งในประวัติศาสตร์คือทองคำและในปัจจุบันคือ Bitcoin คือสกุลเงินที่ดีต่อสุขภาพ ผลิตยาก เกิดขึ้นโดยสมัครใจ และรักษามูลค่าของตนในระยะยาว ความขัดแย้งที่แท้จริงไม่ใช่ซ้ายกับขวา แต่คือตลาดกับรัฐ ทำให้ Bitcoin เป็นการแตกหักทางการเมืองที่ก้าวข้ามค่ายอุดมการณ์แบบดั้งเดิม
reviewed: false
