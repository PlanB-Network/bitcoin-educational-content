question: "Šta kaže princip nenapadanja?"
answer: "Osoba je slobodna da postupa kako želi sve dok se ne vrši nasilje nad životom, slobodom ili imovinom drugoga"
wrong_answers:
  - "Država ima isključivo pravo da koristi silu kako bi održala društveni poredak"
  - "Građani moraju da se potčine vladavini većine čak i kada ona ograničava individualne slobode"
  - "Sloboda delovanja dopuštena je samo kada koristi kolektivnom dobru društva"
explanation: >-
  Princip nenapadanja je kamen temeljac libertarijanske politike i kaže da pojedinci mogu slobodno delovati pod uslovom da ne vrše nasilje nad životom, slobodom ili imovinom drugih. On podseća na zlatno pravilo prisutno u različitim civilizacijama. Za razliku od drugih opcija, on državi ne daje poseban moralni autoritet niti podređuje individualna prava kolektivnoj koristi.
