question: "공유된 정치적 확신으로서 구성주의란 무엇인가요?"
answer: "중앙정부가 법의 힘으로 최대 다수에게 좋은 사회질서를 만들 수 있다는 믿음입니다"
wrong_answers:
  - "사회가 국가 간섭 없이 개인들 사이의 자발적 협력을 통해 조직되어야 한다는 믿음입니다"
  - "오직 자유시장만이 사회에서 자원의 최적 분배를 결정할 수 있다는 믿음입니다"
  - "정치권위가 직접민주주의를 통해 모든 시민에게 동등하게 분배되어야 한다는 믿음입니다"
explanation: >-
  구성주의는 시장 과정에 대한 정치 과정의 우월성이라는 공유된 확신을 중심으로 중도주의자, 보수주의자, 사회주의자를 묶습니다. 이는 중앙정부가 법의 힘으로 최대 다수에게 좋은 사회질서를 만들 수 있다는 믿음입니다. 이는 자발적 상호작용에서 나타나는 자생적 질서에 대한 리버테리언의 옹호와 정면으로 대립합니다.
reviewed: false
