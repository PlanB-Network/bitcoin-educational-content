question: "Lập trường tự do cá nhân về vấn đề hôn nhân đồng giới là gì?"
answer: "Nhà nước không có việc gì phải định nghĩa hôn nhân; hôn nhân nên được tư nhân hóa và để cho các cá nhân, hiệp hội, và thiết chế tôn giáo quyết định"
wrong_answers:
  - "Hôn nhân đồng giới nên được hợp pháp hóa vì mọi công dân đều xứng đáng được đối xử bình đẳng trước pháp luật"
  - "Hôn nhân đồng giới nên bị cấm vì hôn nhân truyền thống là một thiết chế nền tảng cho sinh sản"
  - "Hôn nhân đồng giới nên được hợp pháp hóa nhưng chỉ thông qua một khuôn khổ pháp lý riêng biệt, khác với hôn nhân truyền thống"
explanation: >-
  Những người theo chủ nghĩa tự do cá nhân lập luận rằng câu hỏi về hôn nhân về căn bản đã bị đặt sai khung vì nó được đặt ra trong khung nhà nước chủ nghĩa. Họ tin rằng nhà nước không có việc gì phải can thiệp vào đời sống riêng tư, nên giải pháp là tách hôn nhân hoàn toàn khỏi nhà nước. Bằng cách áp đặt một định nghĩa duy nhất, nhà nước tạo ra xung đột. Câu trả lời sai đầu tiên phản ánh lập trường xã hội chủ nghĩa hoặc trung dung, và câu trả lời thứ hai phản ánh lập trường bảo thủ.
