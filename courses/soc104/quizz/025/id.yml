question: "Apa arti istilah 'liberal' dalam tradisi politik Eropa?"
answer: "Pendukung ekonomi laissez-faire, pengurangan intervensi negara, dan kebebasan individu"
wrong_answers:
  - "Penganjur intervensi negara, asuransi kesehatan publik, dan program anti-kemiskinan"
  - "Anarkis radikal yang mengupayakan penghapusan total pemerintah dan kepemilikan pribadi"
  - "Sentris yang menyeimbangkan posisi sosialis dan konservatif secara setara di semua bidang kebijakan"
explanation: >-
  Di Eropa, liberalisme tetap dikaitkan dengan kebijakan ekonomi laissez-faire, pengurangan intervensi negara, dan pembelaan kebebasan individu. Jawaban salah pertama menggambarkan liberal Amerika, yang telah menggeser makna istilah tersebut ke arah intervensionisme. Liberalisme Eropa bukanlah anarkisme maupun sentrisme.
reviewed: false
