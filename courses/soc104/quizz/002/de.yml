question: "Welches Leitprinzip bestimmte Frederic Bastiats Abstimmungen in der Nationalversammlung?"
answer: "Die Förderung individueller und wirtschaftlicher Freiheiten und die Verringerung staatlicher Einmischung"
wrong_answers:
  - "Die Verteidigung königlicher Autorität und die Bewahrung monarchischer Traditionen"
  - "Die Förderung sozialistischer Politik, um Wohlstand gleichmäßiger umzuverteilen"
  - "Eine zentristische Kompromissstrategie zwischen den linken und rechten Fraktionen"
explanation: >-
  Bastiat stimmte auf der Grundlage eines grundlegenden Prinzips ab: der Förderung individueller und wirtschaftlicher Freiheiten bei gleichzeitiger Verringerung staatlicher Einmischung. Er war weder ein zentristischer Opportunist noch ein Royalist oder Sozialist. Er stimmte mit derjenigen Seite, die Maßnahmen vorschlug, die mit Freiheit und begrenzter Regierung vereinbar waren.
