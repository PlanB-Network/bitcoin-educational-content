question: "Friedrich Hayek 所描述的“自发秩序”概念是什么？"
answer: "社会规则和规范应当从自由的个人互动中产生，而不是由威权规划强加"
wrong_answers:
  - "除非国家介入以维持竞争平衡，否则市场自然会趋向垄断"
  - "民主选举是确立治理社会法律的唯一正当机制"
  - "经济危机会自发出现，并需要政府立即干预以恢复稳定"
explanation: >-
  Hayek 的自发秩序概念认为，治理社会的规则不应由中央规划从上而下强加，而应从个人意志、契约和自愿关系的自由运作中产生。这是自由意志主义思想的一条根本轴线。它并不意味着市场会趋向垄断，也不意味着危机需要政府干预。
reviewed: false
