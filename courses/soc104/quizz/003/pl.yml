question: "Jakie wewnętrzne napięcie istnieje wśród libertarian na diagramie Nolana?"
answer: "Niektórzy chcą całkowicie znieść państwo (anarchokapitaliści), podczas gdy inni wolą państwo minimalne zachowujące podstawowe funkcje suwerenne (minarchiści)"
wrong_answers:
  - "Niektórzy chcą silnej regulacji gospodarczej, podczas gdy inni wolą całkowitą deregulację wszystkich branż"
  - "Niektórzy popierają demokratyczne wybory, podczas gdy inni preferują dziedziczny system rządów"
  - "Niektórzy opowiadają się za progresywną polityką społeczną, podczas gdy inni bronią ściśle tradycyjnych wartości moralnych"
explanation: >-
  W rodzinie libertariańskiej istnieje fundamentalna niezgoda co do roli państwa. Anarchokapitaliści chcą zastąpić wszystkie funkcje państwa usługami prywatnymi, podczas gdy minarchiści akceptują państwo minimalne, które zachowuje podstawowe funkcje suwerenne, takie jak obrona i sądy. Obie grupy dzielą libertariański szczyt, ale różnią się w kwestii tego, czy jakiekolwiek państwo powinno w ogóle istnieć.
reviewed: false
