question: "O que os libertaires franceses (anarquistas socialistas) acreditam sobre a propriedade privada?"
answer: "A propriedade privada e o capitalismo devem ser abolidos porque são fontes de opressão"
wrong_answers:
  - "A propriedade privada é um direito natural que precede o Estado e deve ser protegida a todo custo"
  - "A propriedade privada deve ser regulada pelo Estado, mas nunca completamente eliminada da sociedade"
  - "A propriedade privada é aceitável apenas quando distribuída igualmente entre todos os membros de uma comuna"
explanation: >-
  Os libertaires franceses, herdeiros do anarquismo socialista por meio de pensadores como Proudhon e Bakunin, sustentam que tanto o Estado quanto a propriedade privada devem ser abolidos como fontes gêmeas de opressão. Isso é capturado na famosa fórmula de Proudhon: "A propriedade é roubo." A primeira resposta errada descreve a posição libertária, que é fundamentalmente oposta à visão libertaire.
