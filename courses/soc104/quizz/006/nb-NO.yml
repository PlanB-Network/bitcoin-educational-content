question: "I Nolan-diamanten, hvilken posisjon sitter øverst og representerer maksimal frihet?"
answer: "Libertarianisme, som støtter størst økonomisk og personlig frihet"
wrong_answers:
  - "Konservatisme, som støtter tradisjonelle verdier og økonomisk frihet"
  - "Sentrisme, som balanserer alle politiske posisjoner på en pragmatisk måte"
  - "Sosialisme, som støtter personlig frihet og sosial likhet"
explanation: >-
  Libertarianisme inntar toppen av Nolan-diamanten som motsetningen til statisme. Den representerer dem som støtter størst grad av både økonomisk og personlig frihet. Konservatisme sitter til høyre (høy økonomisk, lav personlig frihet), sosialisme til venstre (høy personlig, lav økonomisk frihet), og sentrisme i midten.
reviewed: false
