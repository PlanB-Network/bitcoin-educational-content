question: "Почему классические либералы в Соединённых Штатах в двадцатом веке начали называть себя 'либертарианцами'?"
answer: "Потому что американский 'либерализм' был присвоен растущим государственным интервенционизмом и государством всеобщего благосостояния"
wrong_answers:
  - "Потому что они хотели дистанцироваться от европейских монархических традиций"
  - "Потому что термин 'либерал' стал ассоциироваться с анархизмом и политическим насилием"
  - "Потому что новые торговые соглашения требовали отдельной политической идентичности для сторонников свободного рынка"
explanation: >-
  В течение двадцатого века произошёл фундаментальный сдвиг: принципы laissez-faire постепенно были оставлены в пользу государства всеобщего благосостояния. Американский «либерализм» стал означать нечто совсем иное, чем классический либерализм, приняв государственный интервенционизм. Классические либералы приняли термин «либертарианец», чтобы сохранить это различие. Этот ребрендинг не имел никакого отношения к европейскому монархизму, анархистскому насилию или торговым соглашениям.
reviewed: false
