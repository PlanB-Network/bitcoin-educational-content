bio: |
  Benoît Malbranque este președintele Institutului Coppet, o asociație care promovează școala franceză de economie politică. Este autorul mai multor cărți, printre care cea mai recentă, Vincent de Gournay; The Political Economy of Laissez-faire (2016). Republică scrierile economiștilor francezi în colecțiile editoriale ale Institutului Coppet.

short_bio: Președintele Institutului Coppet, specialist în gândirea economică liberală franceză și autor al mai multor lucrări pe această temă.
