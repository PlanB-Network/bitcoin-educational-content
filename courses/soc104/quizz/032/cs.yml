question: "Jak libertariáni chápou vztah mezi soukromým vlastnictvím a svobodou?"
answer: "Soukromé vlastnictví je přirozené právo, které předchází zákonu i státu, a je samotným základem svobody"
wrong_answers:
  - "Soukromé vlastnictví je společenská konvence vytvořená státem, kterou lze odvolat, když způsobuje nerovnost"
  - "Soukromé vlastnictví je užitečné pro ekonomickou efektivitu, ale nemá žádný vlastní morální ani filozofický význam"
  - "Soukromé vlastnictví by mělo existovat pouze pro osobní věci, nikoli pro produktivní aktiva nebo půdu"
explanation: >-
  Libertariáni hájí soukromé vlastnictví jako přirozené právo, které předchází zákonu i státu. Tvrdí, že pokud jednotlivec vlastní své vlastní tělo, vlastní také svou práci a její plody. Vlastnictví hmotných statků je rozšířením sebevlastnictví. To ostře kontrastuje s pohledem libertaires, podle něhož je vlastnictví společenskou konvencí nebo zdrojem útlaku.
