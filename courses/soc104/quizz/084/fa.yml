question: "وقتی لیبرتارین‌ها و دیگر خانواده‌های سیاسی اهداف یکسانی دارند، اختلاف کلیدی میان آن‌ها چیست؟"
answer: "اختلاف بر سر ابزارهاست: لیبرتارین‌ها راه‌حل‌های قهری را رد می‌کنند و مبادلهٔ داوطلبانه از طریق فرایند بازار را ترجیح می‌دهند"
wrong_answers:
  - "اختلاف بر سر غایت‌هاست: لیبرتارین‌ها اهداف متفاوتی مانند ثروت فردی را به‌جای رفاه اجتماعی دنبال می‌کنند"
  - "اختلاف بر سر زمان‌بندی است: لیبرتارین‌ها می‌خواهند همان اهداف را آهسته‌تر و از طریق اصلاحات تدریجی محقق کنند"
  - "اختلاف بر سر دامنه است: لیبرتارین‌ها می‌خواهند همان سیاست‌ها را فقط در سطوح محلی و نه ملی به‌کار بگیرند"
explanation: >-
  لیبرتارین‌ها می‌توانند با سوسیالیست‌ها، محافظه‌کاران و میانه‌روها بر سر برخی اهداف، مانند دفاع از ستمدیدگان یا ترویج انسجام اجتماعی، هم‌نظر باشند. اختلاف نه در غایت‌ها، بلکه در ابزارهاست. لیبرتارین‌ها همهٔ راه‌حل‌های قهری‌ای را رد می‌کنند که می‌کوشند رویه‌ها و مقررات را یکسان‌سازی کنند؛ در عوض از قدرت انتخاب و آزادی مسئولانه از طریق مبادلهٔ آزاد و نامتمرکز، مبتنی بر قراردادهای داوطلبانه، دفاع می‌کنند.
reviewed: false
