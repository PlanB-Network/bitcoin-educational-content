question: Ni ingingo izihe zo gucungera umutekano zikenewe cane igihe umuntu akora konti ya Umbrel?
answer: Gukoresha 2FA
wrong_answers:
  - Guhagarika ijambo banga
  - Gukoresha kode ya PIN
  - Guhagarika amahuzwa yose
explanation: |
 2FA yongerera uburinzi bw’inyongera kandi isabwa cane, cane cane iyo ukoresha Lightning node canke services za self-hosting zifite amakuru y’ingenzi.
reviewed: true
