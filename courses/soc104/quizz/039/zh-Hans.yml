question: "结构性方法如何定义社会主义与自由意志主义之间的根本差异？"
answer: "社会主义通过监管、规划和控制赋予国家优先性，而自由意志主义通过最小国家干预赋予个人优先性"
wrong_answers:
  - "社会主义优先考虑农村农业共同体，而自由意志主义偏好城市工业发展"
  - "社会主义以支持民主选举为定义，而自由意志主义拒绝一切形式的政治参与"
  - "社会主义关注外交政策和国际合作，而自由意志主义只关心国内经济问题"
explanation: >-
  从结构上看，社会主义以国家无处不在为特征，由国家监管、规划和控制。自由意志主义则由国家对经济和私人生活的最小干预来定义，倾向于个人自由和自由市场的优先性。相比于比较各体系宣称的意图，这种结构性区分在分析上有用得多。
reviewed: false
