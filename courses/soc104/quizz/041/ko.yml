question: "20세기 초부터 사회주의자들을 갈라놓은 근본적 분열은 무엇이었나요?"
answer: "폭력을 통해 권력을 장악하려 한 혁명적 사회주의자들과 민주적 선거를 통해 변화를 추구한 개혁주의 사회주의자들의 대립이었습니다"
wrong_answers:
  - "산업 노동자에 집중한 도시 사회주의자들과 농업 코뮌을 조직한 농촌 사회주의자들의 대립이었습니다"
  - "자국을 우선시한 민족주의 사회주의자들과 세계 혁명을 옹호한 국제주의 사회주의자들의 대립이었습니다"
  - "이론적 텍스트를 쓴 지식인 사회주의자들과 노동 파업을 조직한 활동가 사회주의자들의 대립이었습니다"
explanation: >-
  20세기 초부터 근본적 분열은 재산권에 반대하고 폭력이나 프롤레타리아 독재를 통해 자본주의 사회를 파괴하려 한 혁명적 사회주의자들과, 자본주의를 일시적으로 받아들이면서 민주적 선거와 과세를 통해 사회정의를 추구한 개혁주의 사회주의자들을 갈라놓았습니다. 이 분열은 이후 사회주의 운동의 전체 역사를 형성했습니다.
