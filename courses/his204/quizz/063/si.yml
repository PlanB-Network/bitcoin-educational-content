question: Catherine IIගේ නීති ප්‍රතිසංස්කරණයට උදව් කිරීමට Mercier de la Rivière රුසියාවට යැව්වේ කවුද?
answer: Diderot
wrong_answers:
  - Voltaire
  - Turgot
  - Quesnay
explanation: |
  Catherine II සමඟ ලිපි හුවමාරුවක් පවත්වාගෙන ගිය Diderot, රුසියානු නීතිකරණය ප්‍රතිසංස්කරණය කිරීමට උදව් කිරීම සඳහා Mercier de la Rivière කැඳවීමට ඇයව උනන්දු කළේය.
