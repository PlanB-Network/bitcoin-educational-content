question: "Какая общая политическая цель есть у левых и правых этатистов?"
answer: "Завоевать власть, чтобы организовать общество согласно своему видению мира и навязать его всем"
wrong_answers:
  - "Сократить размер государства и вернуть власть принятия решений отдельным гражданам"
  - "Установить прямую демократию, при которой каждый гражданин голосует по каждому законодательному решению"
  - "Устранить политические партии и заменить их независимым технократическим управлением"
explanation: >-
  И левые, и правые этатисты разделяют одну и ту же политическую цель: завоевать власть, чтобы организовать общество согласно своему видению мира и навязать его всем через законодательство. Различие только в их ценностях: правые ссылаются на защиту цивилизации, а левые — на защиту рабочего класса или угнетенных. Ни те ни другие не стремятся сократить государство или устранить партии.
reviewed: false
