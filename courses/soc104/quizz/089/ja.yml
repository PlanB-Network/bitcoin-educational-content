question: "Kant の標語 'Sapere aude' は、人々に何をするよう促しているか？"
answer: "自分で考える勇気を持ち、上位の権威の指導に依存する未成年状態から脱出すること"
wrong_answers:
  - "正式な教育機関に入学し、資格を取得することによって学術的知識を追求すること"
  - "あらゆる形の道徳に挑戦し、個人的欲望に基づくまったく新しい倫理体系を作ること"
  - "宗教的献身と教会の教えへの服従を通じて知恵を求めること"
explanation: >-
  「自分で考える勇気を持て」を意味する Sapere aude は、Kant が詩人 Horace から取り、啓蒙の標語としたものである。それは、未成年状態からの脱出を象徴している。未成年状態とは、人々が上位階級や権威の指導なしに自らの理解力を用いることができない状態である。Kant は、解放と、自らの思考に対する完全な責任を促している。
reviewed: false
