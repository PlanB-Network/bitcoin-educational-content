question: According to Condorcet, why was Turgot doomed to fail?
answer: He was too honest for the political game in Paris
wrong_answers:
  - He lacked knowledge of economic theory
  - His physical constitution was too weak
  - He was too young for the position
explanation: |
  Condorcet told Turgot: "You are by no means a charlatan, and that is a flaw, given how things are in Paris." He pointed out the many adversaries Turgot would face: the king's favorites, the parliaments, the clergy, the nobility, and the guilds. These groups expected flattery, not reform.