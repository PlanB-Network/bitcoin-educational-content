question: "Was hat in der konservativen politischen Philosophie Vorrang vor der Freiheit?"
answer: "Ordnung und Tradition, die fest etabliert sein müssen, bevor Freiheit wertgeschätzt werden kann"
wrong_answers:
  - "Soziale Gerechtigkeit und Gleichheit, die garantiert sein müssen, bevor Individuen wirklich frei sein können"
  - "Wirtschaftliche Effizienz und pragmatische Ergebnisse, die bestimmen, wann Freiheit angemessen ist"
  - "Individuelle Eigentumsrechte, die geschützt werden müssen, bevor irgendeine andere Freiheit gewährt wird"
explanation: >-
  Für Konservative haben Ordnung und Tradition Vorrang vor der Freiheit. Sie argumentieren, dass zu viel Freiheit Chaos und soziale Unordnung erzeugt, sodass Freiheit erst wertgeschätzt werden kann, wenn Ordnung fest etabliert ist. Dies steht im Gegensatz zur sozialistischen Sichtweise, die Gerechtigkeit priorisiert, oder zum zentristischen Fokus auf Effizienz.
