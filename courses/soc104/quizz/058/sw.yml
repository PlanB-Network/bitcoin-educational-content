question: "Tofauti muhimu kati ya kuwa pro-business na kuwa pro-market ni ipi?"
answer: "Kuwa pro-business kunamaanisha kupendelea muungano kati ya makampuni makubwa na dola, ilhali kuwa pro-market kunamaanisha kuunga mkono ushindani huru bila upendeleo wa dola"
wrong_answers:
  - "Kuwa pro-business kunamaanisha kuunga mkono biashara ndogo, ilhali kuwa pro-market kunamaanisha kuunga mkono mashirika ya kimataifa"
  - "Kuwa pro-business kunamaanisha kupinga udhibiti kabisa, ilhali kuwa pro-market kunamaanisha kukubali udhibiti wa wastani"
  - "Kuwa pro-business huzingatia viwanda vya ndani, ilhali kuwa pro-market huzingatia biashara ya kimataifa"
explanation: >-
  Wafuasi wa msimamo wa kati huwa pro-business, ikimaanisha kwamba hupendelea aina fulani ya muungano kati ya makampuni makubwa na dola, jambo linalotofautiana na kuwa pro-market. Kuwa pro-market kunaunga mkono ushindani huru bila upendeleo wa dola au ulinzi wa mashirika. Tofauti hii ni muhimu kwa sababu sera za pro-business zinaweza kuunda ukiritimba na ulinzi wa kiudhibiti ambao kwa kweli hudhoofisha ushindani wa soko huria.
reviewed: false
