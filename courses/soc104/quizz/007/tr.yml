question: "Nolan elmasında hangi konum tepede yer alır ve azami özgürlüğü temsil eder?"
answer: "En yüksek ekonomik ve kişisel özgürlüğü destekleyen liberteryenizm"
wrong_answers:
  - "Geleneksel değerleri ve ekonomik özgürlüğü destekleyen muhafazakârlık"
  - "Tüm siyasi konumları pragmatik biçimde dengeleyen merkezcilik"
  - "Kişisel özgürlüğü ve sosyal eşitliği destekleyen sosyalizm"
explanation: >-
  Liberteryenizm, devletçiliğin karşıtı olarak Nolan elmasının tepesinde yer alır. Hem ekonomik hem de kişisel özgürlüğün en yüksek derecesini destekleyenleri temsil eder. Muhafazakârlık sağda (yüksek ekonomik, düşük kişisel özgürlük), sosyalizm solda (yüksek kişisel, düşük ekonomik özgürlük), merkezcilik ise ortadadır.
reviewed: false
