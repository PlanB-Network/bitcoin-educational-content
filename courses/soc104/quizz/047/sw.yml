question: "Ni nani anayetajwa mara nyingi kama mwanzilishi wa uhafidhina wa kisasa?"
answer: "Edmund Burke, aliyetetea kuhifadhi taasisi na mila dhidi ya mabadiliko makali ya Mapinduzi ya Ufaransa"
wrong_answers:
  - "Karl Marx, aliyeendeleza nadharia ya mapambano ya kitabaka na uyakinifu wa kihistoria katika karne ya kumi na tisa"
  - "John Locke, aliyefafanua nadharia ya haki za asili na mkataba wa kijamii katika karne ya kumi na saba"
  - "Adam Smith, aliyeandika The Wealth of Nations na kuanzisha taaluma ya uchumi wa klasiki"
explanation: >-
  Edmund Burke hutajwa mara nyingi kama mwanzilishi wa uhafidhina kwa sababu ya upinzani wake dhidi ya Mapinduzi ya Ufaransa. Kitabu chake Reflections on the Revolution in France (1790) kilitetea busara na mageuzi ya hatua kwa hatua badala ya mabadiliko makali. Aliamini jamii inapaswa kusonga mbele si kwa kuanza upya kabisa bali kupitia mageuzi ya nyongeza yanayohifadhi taasisi na mila zilizojaribiwa.
reviewed: false
