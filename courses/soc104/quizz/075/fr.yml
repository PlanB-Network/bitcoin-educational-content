question: "À travers les cinq débats économiques (impôts, salaire minimum, santé, environnement, subventions), quel schéma cohérent distingue la méthode centriste des positions des autres familles politiques ?"
answer: "Les centristes refusent de s'engager sur un principe fixe et exigent plutôt une analyse empirique et une évaluation par des experts pour déterminer la politique au cas par cas, ce qui rend leur approche intrinsèquement technocratique"
wrong_answers:
  - "Les centristes adoptent toujours une position intermédiaire entre les positions socialiste et conservatrice, en coupant la poire en deux sur chaque sujet de manière égale"
  - "Les centristes privilégient systématiquement la croissance économique par rapport au bien-être social, s'alignant sur les libertariens en matière de politique fiscale tout en étant d'accord avec les socialistes sur la réglementation"
  - "Les centristes délèguent toutes les décisions économiques aux organisations internationales et aux accords commerciaux plutôt que de mener une politique nationale indépendante"
explanation: >-
  À travers les cinq débats économiques, l'approche centriste suit le même schéma : plutôt que de s'engager sur un principe idéologique fixe, les centristes exigent des preuves empiriques et une évaluation par des experts avant de prendre des décisions. Sur les impôts, le bon niveau doit être déterminé par l'analyse. Sur le salaire minimum, le niveau doit être ajusté de manière pragmatique. Sur la santé, un mélange calibré par des experts est idéal. Sur l'environnement, la politique doit équilibrer la compétitivité. Sur les subventions, chaque cas doit être évalué selon ses mérites propres. Cela rend le centrisme intrinsèquement technocratique, ce qui est différent du simple fait de couper la poire en deux ou de s'en remettre à des organismes internationaux.
reviewed: false
