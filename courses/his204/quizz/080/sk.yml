question: Koho slobodu Turgot obhajuje vo svojom memorande o pôžičkách peňazí, hoci vyvracia ich zásady?
answer: Grékov a katolíckej cirkvi
wrong_answers:
  - Grékov a Egypťanov
  - Katolíckej cirkvi a Egypťanov
  - Rimanov a Kartágincov
explanation: |
  Turgot obhajoval slobodu požičiavať peniaze a zároveň vyvracal argumenty Grékov a katolíckej cirkvi proti úroku. Veril, že zákaz úroku bráni hospodárskemu rozvoju a že je potrebné umožniť jednotlivcom slobodne požičiavať a vypožičiavať si.
