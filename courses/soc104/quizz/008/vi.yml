question: "Nhóm tự do cá nhân bao gồm những gì?"
answer: "Những gì bạn làm trong các mối quan hệ riêng tư, với ý kiến, niềm tin của bạn, và mọi thứ liên quan đến cơ thể và tâm trí của chính bạn"
wrong_answers:
  - "Những gì bạn làm với tư cách là người sản xuất, bao gồm khởi nghiệp, thuê nhân viên và trao đổi hàng hóa"
  - "Bạn trả bao nhiêu thuế, thực hiện những khoản đầu tư nào, và quản lý tài sản tài chính của mình ra sao"
  - "Khả năng cạnh tranh của bạn trên thị trường, đặt giá cho sản phẩm của bạn, và chọn nhà cung cấp của bạn"
explanation: >-
  Tự do cá nhân bao gồm những gì bạn làm trong các mối quan hệ riêng tư, với ý kiến và niềm tin của bạn, cũng như mọi thứ liên quan đến cơ thể và tâm trí của chính bạn. Điều này bao gồm hôn nhân, lựa chọn đọc gì, thực hành tôn giáo, lựa chọn thực phẩm và thuốc men, và người mà bạn giao du. Hoạt động kinh doanh, thuế và các quyết định trên thị trường thuộc về tự do kinh tế.
