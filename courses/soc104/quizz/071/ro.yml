question: "De ce se opun libertarienii impozitării?"
answer: "Deoarece este o încălcare morală a drepturilor de proprietate, o formă de furt comis de stat care confiscă proprietatea altcuiva fără consimțământ"
wrong_answers:
  - "Deoarece taxele sunt ineficiente economic și duc întotdeauna la rate mai mari ale șomajului"
  - "Deoarece impozitarea descurajează investițiile străine și slăbește poziția competitivă a unei țări"
  - "Deoarece sistemele de impozitare progresivă îi vizează nedrept pe indivizii bogați care creează cele mai multe locuri de muncă"
explanation: >-
  Obiecția libertariană la impozitare este morală înainte de a fi economică. Libertarienii văd impozitarea ca pe o formă de furt comis de stat și ca pe un impediment în calea proprietății private, deoarece constă în confiscarea proprietății altcuiva fără consimțământ. Deși pot exista argumente economice împotriva impozitării, argumentul libertarian fundamental se sprijină pe principiul că aceasta încalcă drepturile de proprietate, nu pe calcule de eficiență sau competitivitate.
