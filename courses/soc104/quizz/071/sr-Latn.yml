question: "Zašto se libertarijanci protive oporezivanju?"
answer: "Zato što je ono moralno kršenje prava svojine, oblik državne krađe koji oduzima tuđu imovinu bez pristanka"
wrong_answers:
  - "Zato što su porezi ekonomski neefikasni i uvek vode do viših stopa nezaposlenosti"
  - "Zato što oporezivanje obeshrabruje strane investicije i slabi konkurentsku poziciju zemlje"
  - "Zato što progresivni poreski sistemi nepravedno ciljaju bogate pojedince koji stvaraju najviše radnih mesta"
explanation: >-
  Libertarijanski prigovor oporezivanju je moralan pre nego ekonomski. Libertarijanci vide oporezivanje kao oblik državne krađe i prepreku privatnoj svojini, jer se sastoji od oduzimanja tuđe imovine bez pristanka. Iako mogu postojati ekonomski argumenti protiv oporezivanja, temeljni libertarijanski argument počiva na principu da ono krši prava svojine, a ne na kalkulacijama efikasnosti ili konkurentnosti.
