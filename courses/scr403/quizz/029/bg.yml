question: Simplicity изключва неограничената рекурсия. Какъв е предвиденият заместител на неограничената итерация?
answer: Рекурсивни covenant-и, които разпределят изчислението през множество транзакции, поддържайки цената на всяка транзакция предвидима.
wrong_answers:
  - Функцията за делегиране, създадена специално да предостави измервана форма на неограничена рекурсия в една транзакция.
  - Деветте основни комбинатора, чиято пълнота позволява конструкция на фиксирана точка да кодира всяка рекурсивна функция.
  - Развиване на цикли по време на компилация, при което статичният анализ извежда максималния брой итерации и дублира тялото.
explanation: >-
  Тезата на статията е, че неограничената итерация се имплементира по-добре
  като рекурсивни covenant-и, които изчисляват през множество транзакции, което
  избягва ограниченията на блоковото пространство и стандартността и прави транзакционните
  разходи предвидими. Делегирането може само да бъде злоупотребено, за да произведе нещо,
  наподобяващо неограничена рекурсия — то не е предвиденият механизъм — а
  деветте основни комбинатора са пълни само за крайни изчисления, така че
  не съществува конструкция на фиксирана точка в рамките на една програма.
reviewed: false
