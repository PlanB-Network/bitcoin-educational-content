question: "Libertarians wanaamini nini kuhusu uwezo wa watu binafsi kufanya maamuzi?"
answer: "Watu binafsi wana haki na pia wajibu wa kufanya maamuzi yao wenyewe kuhusu maisha yao"
wrong_answers:
  - "Watu binafsi wanapaswa kufanya maamuzi tu baada ya kushauriana na wawakilishi waliochaguliwa wanaoelewa athari za kisera"
  - "Watu binafsi kwa ujumla hawawezi kufanya maamuzi mazuri na wanahitaji mwongozo wa wataalamu kutoka taasisi za serikali"
  - "Watu binafsi wanapaswa kufanya maamuzi ya kiuchumi kwa uhuru lakini waachie dola maamuzi yote ya kijamii na kitamaduni"
explanation: >-
  Kwa mtazamo wa libertarian, watu binafsi wana haki na pia wajibu wa kufanya maamuzi yao wenyewe. Hili linatofautiana na familia za kawaida za kisiasa kutoka kushoto hadi kulia, ambazo huamini kwamba serikali inapaswa kufanya baadhi au mengi ya maamuzi muhimu katika maisha ya mtu binafsi na katika maisha ya kiuchumi kwa ujumla.
