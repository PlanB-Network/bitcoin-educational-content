bio: |
  Expert în minerit și dispozitive conectate, mi-am găsit drumul în bitcoin prin mineritul la domiciliu. Sunt inițiatorul proiectului Attakai, care își propune să democratizeze mineritul pentru cât mai multe persoane posibil, transformând S9-uri uzate în mici încălzitoare auxiliare.

short_bio: Co-creator al Attakaï & expert în minerit
