question: "Katika mijadala ya Gustave de Molinari ya mwaka 1849, ni mhusika gani anayetetea uhuru kama kanuni ya msingi badala ya kuuweka chini ya malengo mengine?"
answer: "Mwanauchumi, anayechukulia uhuru kama kanuni isiyowekwa chini ya lengo lingine lolote"
wrong_answers:
  - "Mwanasoshalisti, anayetetea uhuru kupitia mageuzi ya kimaendeleo yanayolenga usawa wa kijamii"
  - "Mhafidhina, anayesimamia uhuru kwa kuhifadhi mpangilio na utulivu wa kijamii wa jadi"
  - "Wahusika wote watatu wanatetea uhuru kwa usawa lakini hawakubaliani kuhusu namna ya kuutekeleza"
explanation: >-
  Katika mijadala ya Molinari kutoka Les Soirees de la rue Saint-Lazare, mwanauchumi yuko katika kutokubaliana kwa kudumu na mwanasoshalisti na mhafidhina. Yeye ndiye pekee anayetetea uhuru kama kanuni ya msingi. Mwanasoshalisti anauweka uhuru chini ya maadili ya kimaendeleo, na mhafidhina anauweka chini ya uhifadhi wa utaratibu, jambo linalomfanya mwanauchumi awe wa kipekee katika utetezi wake usio na masharti wa uhuru.
