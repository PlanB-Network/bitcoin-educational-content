question: "Kant 的格言 'Sapere aude' 鼓励人们做什么？"
answer: "敢于为自己思考，并走出依赖上级权威指导的未成年状态"
wrong_answers:
  - "通过进入正式教育机构并取得文凭来追求学术知识"
  - "挑战一切形式的道德，并基于个人欲望创造全新的伦理体系"
  - "通过宗教虔敬和服从教会教导来寻求智慧"
explanation: >-
  Sapere aude，意为“敢于为自己思考”，由 Kant 从诗人 Horace 那里取来，并被他用作启蒙运动的格言。它象征着走出未成年状态：一种人们无法在没有上级阶层或权威指导的情况下运用自己理解力的状态。Kant 鼓励解放，并鼓励人们对自己的思想承担全部责任。
reviewed: false
