question: "Каква е либертарианската позиция по въпроса за гей брака?"
answer: "Държавата няма работа да дефинира брака; той трябва да бъде приватизиран и оставен на индивидите, асоциациите и религиозните институции"
wrong_answers:
  - "Гей бракът трябва да бъде легализиран, защото всички граждани заслужават равно третиране пред закона"
  - "Гей бракът трябва да бъде забранен, защото традиционният брак е фундаментална институция за размножаване"
  - "Гей бракът трябва да бъде легализиран, но само чрез отделна правна рамка, различна от традиционния брак"
explanation: >-
  Либертарианците твърдят, че въпросът за брака е фундаментално погрешно формулиран, защото е поставен в етатистки термини. Те вярват, че държавата няма работа да се намесва в частния живот, така че решението е бракът да бъде изцяло отделен от държавата. Като налага единна дефиниция, държавата създава конфликти. Първият грешен отговор отразява социалистическата или центристката позиция, а вторият — консервативната позиция.
