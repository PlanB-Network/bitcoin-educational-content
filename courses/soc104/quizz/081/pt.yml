question: "O que é o construtivismo como convicção política compartilhada?"
answer: "A crença de que um governo central pode criar, pela força da lei, uma ordem social que seja boa para o maior número de pessoas"
wrong_answers:
  - "A crença de que a sociedade deve ser organizada por meio da cooperação voluntária entre indivíduos sem interferência estatal"
  - "A crença de que apenas mercados livres podem determinar a distribuição ótima de recursos na sociedade"
  - "A crença de que a autoridade política deve ser distribuída igualmente entre todos os cidadãos por meio da democracia direta"
explanation: >-
  O construtivismo une centristas, conservadores e socialistas em torno de uma convicção compartilhada: a superioridade do processo político sobre o processo de mercado. É a crença de que um governo central pode criar, pela força da lei, uma ordem social boa para o maior número de pessoas. Isso se opõe diretamente à defesa libertária da ordem espontânea que emerge de interações voluntárias.
