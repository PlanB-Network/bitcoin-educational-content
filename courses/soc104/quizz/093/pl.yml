question: "Dlaczego inflacja monetarna jest opisywana jako ukryty podatek narzucony bez zgody obywateli?"
answer: "Ponieważ kreacja pieniądza przez rząd obniża wartość waluty, więc za tę samą ilość ludzie mogą kupić mniej, ale większość nie zdaje sobie sprawy, że wzrost cen odzwierciedla politykę rządu, a nie naturalne siły rynkowe"
wrong_answers:
  - "Ponieważ banki centralne potajemnie pobierają opłaty od każdej transakcji przetwarzanej przez system bankowy, nie ujawniając ich posiadaczom rachunków"
  - "Ponieważ rządy drukują pieniądze i rozdają je wyłącznie zamożnym osobom, jednocześnie opodatkowując biednych przez wyższe podatki od sprzedaży podstawowych dóbr"
  - "Ponieważ inflacja jest powodowana przez prywatne korporacje podnoszące ceny w celu zwiększenia zysków, co działa jak nieoficjalny podatek od konsumentów"
explanation: >-
  Wstrzyknięcie pieniądza do systemu przekłada się na dewaluację waluty, w której za tę samą ilość można kupić mniej, ponieważ nowy pieniądz nie odzwierciedla rzeczywistego wzrostu gospodarczego. Większość ludzi nie widzi, że polityka rządu doprowadziła do wzrostu cen, które są po prostu odzwierciedleniem dewaluacji waluty. Sprowadza się to do legalnej kradzieży i zinstytucjonalizowanej spoliacji, zubożając klasę średnią, podczas gdy zamożni przechwytują nowy pieniądz przez aktywa spekulacyjne.
