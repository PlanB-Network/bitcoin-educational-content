question: "Mitä libertaarit uskovat yksilöiden kyvystä tehdä päätöksiä?"
answer: "Yksilöillä on sekä oikeus että vastuu tehdä omat päätöksensä elämästään"
wrong_answers:
  - "Yksilöiden tulisi tehdä päätöksiä vasta kuultuaan vaaleilla valittuja edustajia, jotka ymmärtävät politiikkavaikutukset"
  - "Yksilöt ovat yleensä kykenemättömiä tekemään hyviä päätöksiä ja tarvitsevat asiantuntijaohjausta valtion instituutioilta"
  - "Yksilöiden tulisi tehdä taloudelliset päätökset vapaasti mutta tukeutua valtioon kaikissa sosiaalisissa ja kulttuurisissa asioissa"
explanation: >-
  Libertaarisesta näkökulmasta yksilöillä on sekä oikeus että vastuu tehdä omat päätöksensä. Tämä on vastakohta tavanomaisille poliittisille perheille vasemmalta oikealle, jotka uskovat, että valtion tulisi tehdä osa tai monet tärkeistä päätöksistä yksilön elämässä ja talouselämässä yleensä.
