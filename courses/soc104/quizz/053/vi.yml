question: "Vì sao những người tự do cổ điển ở Hoa Kỳ bắt đầu tự gọi mình là 'libertarians' trong thế kỷ XX?"
answer: "Vì 'liberalism' ở Mỹ đã bị chủ nghĩa can thiệp nhà nước ngày càng tăng và nhà nước phúc lợi chiếm dụng"
wrong_answers:
  - "Vì họ muốn tách mình khỏi các truyền thống quân chủ châu Âu"
  - "Vì thuật ngữ 'liberal' trở nên gắn với chủ nghĩa vô chính phủ và bạo lực chính trị"
  - "Vì các hiệp định thương mại mới đòi hỏi một bản sắc chính trị riêng biệt cho những người ủng hộ thị trường tự do"
explanation: >-
  Trong thế kỷ XX, một chuyển dịch căn bản đã diễn ra khi các nguyên tắc laissez-faire dần bị từ bỏ để ưu tiên nhà nước phúc lợi. "Liberalism" Mỹ bắt đầu mang một nghĩa rất khác với chủ nghĩa tự do cổ điển, bao hàm chủ nghĩa can thiệp nhà nước. Những người tự do cổ điển đã chấp nhận thuật ngữ "libertarian" để bảo tồn sự phân biệt này. Việc tái định danh này không liên quan gì đến chủ nghĩa quân chủ châu Âu, bạo lực vô chính phủ, hay các hiệp định thương mại.
reviewed: false
