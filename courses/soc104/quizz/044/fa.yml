question: "اصطلاح «هولیسم» در زمینه فلسفه سوسیالیستی به چه معناست؟"
answer: "بینشی از جامعه به‌عنوان کلی تقسیم‌ناپذیر که در آن جمع بر فرد تقدم دارد"
wrong_answers:
  - "فلسفه‌ای که هر فرد را واحدی خودبسنده می‌داند که حقوقش نمی‌تواند توسط هیچ گروهی نادیده گرفته شود"
  - "نظریه‌ای اقتصادی که از متوازن کردن بخش‌های عمومی و خصوصی به اندازه برابر دفاع می‌کند"
  - "راهبردی سیاسی که همه دیدگاه‌های اقلیت را در یک برنامه واحد مبتنی بر اجماع ادغام می‌کند"
explanation: >-
  هولیسم از واژه یونانی «holos» به معنای «کل» می‌آید. در اندیشه سوسیالیستی، این اصطلاح به بینشی از جامعه به‌عنوان کلی تقسیم‌ناپذیر اشاره دارد، نه صرفاً جمع ساده افراد. دولت سوسیالیستی می‌کوشد تا بیشترین حد عهده‌دار فعالیت انسانی شود و آن را هدایت کند. این جمع می‌تواند به‌صورت یک طبقه اجتماعی، یک ملت، یک نژاد یا یک جنسیت نمایندگی شود، اما در هر مورد فرد با تعلق گروهی تعریف می‌شود.
reviewed: false
