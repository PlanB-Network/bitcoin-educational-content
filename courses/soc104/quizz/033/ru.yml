question: "Как либертарианцы рассматривают связь между частной собственностью и свободой?"
answer: "Частная собственность — это естественное право, которое предшествует закону и государству и является самой основой свободы"
wrong_answers:
  - "Частная собственность — это социальная условность, созданная государством, которую можно отменить, когда она вызывает неравенство"
  - "Частная собственность полезна для экономической эффективности, но не имеет внутреннего морального или философского значения"
  - "Частная собственность должна существовать только для личного имущества, а не для производственных активов или земли"
explanation: >-
  Либертарианцы защищают частную собственность как естественное право, предшествующее закону и государству. Они утверждают, что если индивид владеет собственным телом, то он также владеет своим трудом и его плодами. Владение материальными благами является продолжением самопринадлежности. Это резко контрастирует со взглядом либертеров, согласно которому собственность является социальной условностью или источником угнетения.
reviewed: false
