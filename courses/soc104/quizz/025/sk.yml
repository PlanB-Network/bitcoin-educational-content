question: "Ako Ron Paul ilustroval paleo-libertariánsku pozíciu pri otázkach ako užívanie drog a potraty?"
answer: "Osobne odrádzal od užívania drog a odmietal potraty, ale politicky bojoval proti federálnemu zákazu a tvrdil, že rozhodnutia by mali byť ponechané jednotlivcom alebo štátom"
wrong_answers:
  - "Podporoval federálnu legalizáciu všetkých drog a potratov ako otázku absolútnych individuálnych práv"
  - "Viedol kampaň za prísne federálne zákazy drog aj potratov na základe svojich osobných morálnych presvedčení"
  - "Odmietal vyjadriť akýkoľvek osobný názor na tieto otázky a tvrdil, že politici by mali zostať morálne neutrálni"
explanation: >-
  Ron Paul stelesňuje paleo-libertariánsku syntézu tým, že oddeľuje osobné morálne presvedčenia od politického nátlaku. Vždy odrádzal od užívania drog, no zároveň odmietal zákaz drog. Osobne bol proti potratom, ale tvrdil, že voľba by mala zostať na federálnych štátoch, nie byť vnucovaná zhora. To ukazuje, ako možno zastávať silné tradičné hodnoty a zároveň odmietať používanie donucovacej moci federálnej vlády na ich vynucovanie.
reviewed: false
