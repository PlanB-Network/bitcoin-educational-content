question: "Hvorfor understreker Mises at individualisme ikke bør forveksles med selvtilstrekkelighet eller misantropi?"
answer: "Fordi individualisme fremmer samarbeid og forening, forutsatt at de hviler på deltakernes frie samtykke, og anerkjenner at mennesker utvikler sitt fulle potensial gjennom frivillige relasjoner med andre"
wrong_answers:
  - "Fordi individualisme krever at folk slutter seg til obligatoriske borgerorganisasjoner for å sikre at de bidrar til felles beste"
  - "Fordi individualisme betyr at hver person må stole helt på staten for tjenester de ikke kan levere selv"
  - "Fordi individualisme krever at folk konkurrerer mot hverandre på alle områder for å bevise sin personlige overlegenhet"
explanation: >-
  Mises understreker at mennesket er et sosialt vesen. Individualisme betyr ikke isolasjon. Den fremmer samarbeid og forening på betingelse av at de hviler på deltakernes frie samtykke. Mennesket kan bare utvikle sitt fulle potensial i relasjon til andre, men dette samarbeidet må være frivillig heller enn påtvunget av kollektiv autoritet.
reviewed: false
