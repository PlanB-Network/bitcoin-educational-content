question: Simplicity 排除了无界递归。它预期用什么来替代无界迭代？
answer: 递归限制条款，将计算分散到多笔交易中，使每笔交易的成本保持可预测。
wrong_answers:
  - delegation 功能，专门用于在单笔交易内部提供一种计量形式的无界递归。
  - 九个核心组合子，其完备性让固定点构造能够编码任何递归函数。
  - 编译时循环展开，即静态分析推断最大迭代次数并复制循环体。
explanation: >-
  文章的论点是，无界迭代更适合实现为
  跨多笔交易进行计算的递归限制条款，这样可以
  避免区块空间和标准性约束，并使交易
  成本可预测。Delegation 只能被滥用来产生某种
  类似无界递归的东西——它并不是预期机制——而且
  九个核心组合子只对有限计算完备，因此
  单个程序内不存在固定点构造。
reviewed: false
