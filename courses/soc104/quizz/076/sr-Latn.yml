question: "U dijalozima Gustava de Molinarija iz 1849. godine, koji lik brani slobodu kao fundamentalni princip umesto da je podređuje drugim ciljevima?"
answer: "Ekonomista, koji slobodu tretira kao princip koji nije podređen nijednom drugom cilju"
wrong_answers:
  - "Socijalista, koji brani slobodu kroz progresivne reforme usmerene na društvenu jednakost"
  - "Konzervativac, koji podržava slobodu očuvanjem tradicionalnog društvenog poretka i stabilnosti"
  - "Sva tri lika jednako brane slobodu, ali se ne slažu oko toga kako je sprovesti"
explanation: >-
  U Molinarijevim dijalozima iz Les Soirees de la rue Saint-Lazare, ekonomista je u trajnom neslaganju i sa socijalistom i sa konzervativcem. On je jedini koji brani slobodu kao fundamentalni princip. Socijalista podređuje slobodu progresivnim idealima, a konzervativac je podređuje očuvanju poretka, što ekonomistu čini jedinstvenim u njegovoj bezuslovnoj odbrani slobode.
