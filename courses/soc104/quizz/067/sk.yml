question: "Ako sa líšili ekonomické prístupy Hitlerovho Nemecka a Stalinovho Sovietskeho zväzu napriek ich spoločným totalitným metódam?"
answer: "Nacistické Nemecko zachovalo zdanie súkromného vlastníctva, pričom súkromný sektor podriadilo štátnym cieľom, zatiaľ čo stalinizmus zrušil všetko súkromné vlastníctvo a úplne plánoval ekonomiku"
wrong_answers:
  - "Nacistické Nemecko úplne znárodnilo všetky odvetvia, zatiaľ čo Stalinov režim umožňoval obmedzené súkromné podnikanie v poľnohospodárstve"
  - "Nacistické Nemecko podporovalo voľný medzinárodný obchod na financovanie znovuvyzbrojenia, zatiaľ čo stalinizmus zaviedol úplnú ekonomickú izoláciu"
  - "Nacistické Nemecko sa spoliehalo na dobrovoľnú spoluprácu korporácií so štátom, zatiaľ čo stalinizmus používal iba nútenú prácu"
explanation: >-
  Hoci oba režimy používali rovnaké politické metódy (kult osobnosti, úplný dohľad, systematickú elimináciu opozície), ich ekonomické modely sa líšili formou. Nacistické Nemecko formálne nezrušilo súkromné vlastníctvo, ale úplne podriadilo súkromný sektor štátnym cieľom, ako boli vojna a znovuvyzbrojenie, a zaviedlo ekonomickú autarkiu. Stalinizmus zašiel ďalej tým, že zrušil všetko súkromné vlastníctvo, zaviedol päťročné plány a priamo kontroloval celú výrobu a distribúciu.
