question: "Hva skiller nykonservative fra paleokonservative i deres tilnærming til utenrikspolitikk?"
answer: "Nykonservative rettferdiggjør militær intervensjonisme for å spre demokrati, mens paleokonservative forsvarer en mer isolasjonistisk utenrikspolitikk"
wrong_answers:
  - "Nykonservative motsetter seg all militær handling og foretrekker diplomati, mens paleokonservative støtter forebyggende angrep mot potensielle trusler"
  - "Nykonservative fokuserer utelukkende på økonomiske sanksjoner, mens paleokonservative tar til orde for å bygge internasjonale koalisjoner for felles militære operasjoner"
  - "Nykonservative og paleokonservative er enige om utenrikspolitikk, men skiller seg skarpt i innenlandsk økonomisk regulering"
explanation: >-
  Fra 2000-tallet og fremover ble nykonservative stadig mer involvert i å rettferdiggjøre militær intervensjonisme for å innføre demokrati rundt om i verden, særlig etter 11. september 2001. Som reaksjon tok tradisjonelle konservative i bruk merkelappen 'paleokonservativ' for å skille seg ut. Paleokonservative kritiserer militær intervensjonisme, forsvarer en mer isolasjonistisk utenrikspolitikk og legger større vekt på nasjonal og kulturell identitet.
reviewed: false
