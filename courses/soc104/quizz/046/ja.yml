question: "保守主義は、経済的領域と社会的領域における自由をどのように扱うか？"
answer: "経済的領域では強い自由を認めるが、社会的領域では弱い自由しか認めない"
wrong_answers:
  - "伝統的な社会秩序を維持するため、経済的領域と社会的領域の双方で自由を弱くする"
  - "社会的領域では強い自由を認めるが、経済的領域では弱い自由しか認めない"
  - "いかなる種類の政府介入も最小限に抑え、双方の領域で平等かつ無制限の自由を認める"
explanation: >-
  保守主義は、社会主義の鏡像である二分性を示す。経済的領域では、保守主義者は自由市場、起業、私有財産を擁護する。社会的領域では、制限は伝統的な道徳規範と社会的安定の保存によって正当化される。3 つ目の誤答は、その反対である社会主義のパターンを説明している。
reviewed: false
