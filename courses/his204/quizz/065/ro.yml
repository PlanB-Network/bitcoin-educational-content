question: Unde s-au întâlnit Adam Smith și fiziocrații?
answer: La Paris
wrong_answers:
  - La Glasgow
  - La Londra
  - Nu s-au întâlnit niciodată
explanation: |
  Adam Smith i-a întâlnit pe fiziocrați la Paris, în timpul unei călătorii în Europa. A fost influențat de ideile lor, dar și-a dezvoltat și propria teorie economică, care se deosebea de fiziocrație în anumite privințe.
