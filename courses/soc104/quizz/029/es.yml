question: "¿Qué significa el término 'liberal' en la tradición política europea?"
answer: "Un partidario de la economía laissez-faire, de una menor intervención estatal y de las libertades individuales"
wrong_answers:
  - "Un defensor de la intervención estatal, del seguro público de salud y de programas contra la pobreza"
  - "Un anarquista radical que busca la abolición completa del gobierno y de la propiedad privada"
  - "Un centrista que equilibra por igual posiciones socialistas y conservadoras en todas las áreas de política pública"
explanation: >-
  En Europa, el liberalismo ha permanecido asociado con políticas económicas de laissez-faire, una menor intervención estatal y la defensa de las libertades individuales. La primera respuesta incorrecta describe a los liberales estadounidenses, que han desplazado el significado del término hacia el intervencionismo. El liberalismo europeo no es ni anarquismo ni centrismo.
reviewed: false
