question: "Green New Deal yerekana gute ihindagurika rya none rya sosiyalizimu ya demokarasi?"
answer: "Ikoresha ibibazo vy'ibidukikije nk'ishingiro rishasha ryo kwemeza ukwivanga kwa Leta no kwaka igice c'amahera y'abikorera, igashira inyungu y'umuntu munsi y'amagara rusangi y'isi"
wrong_answers:
  - "Iraheba burundu ubutunzi bwa sosiyaliste bwa kera igashigikira inyishu z'isoko yidegemvya ku bibazo vy'ibidukikije biciye mu gucuruza carbon"
  - "Iranka ukwivanga kwa Leta maze ikizigira ibikorwa vy'abantu ku bushake n'udushasha tw'abikorera kugira ihangane n'ihindagurika ry'ikirere"
  - "Yerekana ugutandukana na sosiyalizimu mu gushira imbere gukingira ibidukikije kuruta ibibazo vyose vy'ubutungane bw'imibano n'akazi"
explanation: >-
  Green New Deal ivanga ibibazo vy'ibidukikije n'intumbero z'imibano, igahuza ihinduka ry'ivy'ekoloji n'ubutungane bw'imibano, ivyemezo vy'akazi, n'ibikorwa rusangi bikomejwe. Inyungu y'umuntu ishigwa munsi y'inyungu rusangi isigurwa n'amagara y'isi. Mu mushinge wayo, itanga igipfukisho gishasha c'imvugo co kwemeza ukwivanga kwa Leta no kwaka igice c'amahera y'abikorera, bitagikorwa gusa mw'izina ry'ubutungane bw'imibano ariko no mw'izina ry'ibidukikije.
