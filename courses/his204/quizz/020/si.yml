question: Cantillonගේ ආර්ථික න්‍යායට ආභාසය දුන්, ඔහු සමකාලීනයෙකු වූ සිදුවීම කුමක්ද?
answer: John Lawගේ පද්ධතිය අසාර්ථක වීම
wrong_answers:
  - 1705-1707 මහා ආර්ථික අර්බුදය
  - France සහ Holland අතර යුද්ධය
  - English revolution
explanation: |
  Cantillon Lawගේ පද්ධතියේ කඩා වැටීම දැක, එහි හේතු සහ ප්‍රතිඵල තම "Essai sur la nature du commerce en général" තුළ විශ්ලේෂණය කළේය. මෙම සිදුවීම ඔහුගේ ආර්ථික චින්තනයට සහ මුදල් සංසිද්ධි පිළිබඳ ඔහුගේ අවබෝධයට ගැඹුරු බලපෑමක් කළේය.