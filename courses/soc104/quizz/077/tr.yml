question: "Muhafazakâr siyaset felsefesinde özgürlükten önce ne gelir?"
answer: "Özgürlük değerli görülebilmeden önce sıkıca tesis edilmesi gereken düzen ve gelenek"
wrong_answers:
  - "Bireyler gerçekten özgür olabilmeden önce garanti edilmesi gereken sosyal adalet ve eşitlik"
  - "Özgürlüğün ne zaman uygun olduğunu belirleyen ekonomik verimlilik ve pragmatik sonuçlar"
  - "Başka herhangi bir özgürlük tanınmadan önce korunması gereken bireysel mülkiyet hakları"
explanation: >-
  Muhafazakârlar için düzen ve gelenek özgürlükten önce gelir. Fazla özgürlüğün kaos ve toplumsal düzensizlik ürettiğini, bu yüzden özgürlüğün ancak düzen sıkıca tesis edildikten sonra değerli görülebileceğini savunurlar. Bu, adaleti önceleyen sosyalist görüşle ya da verimliliğe odaklanan merkezci yaklaşımla karşıtlık oluşturur.
