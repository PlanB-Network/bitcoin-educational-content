question: "Kwa nini Mises anasisitiza kwamba ubinafsi haupaswi kuchanganywa na kujitosheleza au kuchukia wanadamu?"
answer: "Kwa sababu ubinafsi hukuza ushirikiano na kuungana, mradi vimejengwa juu ya ridhaa huru ya washiriki, ukitambua kwamba binadamu hukuza uwezo wao kamili kupitia mahusiano ya hiari na wengine"
wrong_answers:
  - "Kwa sababu ubinafsi unahitaji watu kujiunga na mashirika ya kiraia ya lazima ili kuhakikisha wanachangia manufaa ya pamoja"
  - "Kwa sababu ubinafsi unamaanisha kila mtu lazima aitegemee dola kikamilifu kwa huduma ambazo hawezi kujipatia mwenyewe"
  - "Kwa sababu ubinafsi unadai watu washindane wao kwa wao katika nyanja zote ili kuthibitisha ubora wao binafsi"
explanation: >-
  Mises anasisitiza kwamba binadamu ni kiumbe wa kijamii. Ubinafsi haumaanishi kujitenga. Hukuza ushirikiano na kuungana kwa sharti kwamba vimejengwa juu ya ridhaa huru ya washiriki. Binadamu anaweza kukuza uwezo wake kamili tu katika uhusiano na wengine, lakini ushirikiano huu lazima uwe wa hiari badala ya kulazimishwa na mamlaka ya pamoja.
