question: "Ce include categoria libertății personale?"
answer: "Ceea ce faci în relațiile tale private, cu opiniile și convingerile tale, și tot ceea ce implică propriul corp și propria minte"
wrong_answers:
  - "Ceea ce faci ca producător, inclusiv pornirea unei afaceri, angajarea de salariați și tranzacționarea de bunuri"
  - "Cât impozit plătești, ce investiții faci și cum îți gestionezi activele financiare"
  - "Capacitatea ta de a concura pe piață, de a stabili prețuri pentru produsele tale și de a-ți alege furnizorii"
explanation: >-
  Libertatea personală cuprinde ceea ce faci în relațiile tale private, cu opiniile și convingerile tale, și tot ceea ce implică propriul corp și propria minte. Aceasta include căsătoria, alegerile de lectură, practicile religioase, alegerile alimentare și medicale și persoanele cu care te asociezi. Activitățile de afaceri, taxele și deciziile de piață intră în categoria libertății economice.
reviewed: false
