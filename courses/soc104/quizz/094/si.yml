question: "Bitcoin political project with moral claims එකක් නොව, political consequences ඇති moral project එකක් ලෙස ක්‍රියා කරන්නේ කෙසේද?"
answer: "Bitcoin නිර්මාණය කළේ මිනිසුන් rich කිරීමට නොව free කිරීමටය; effective property සක්‍රීය කිරීම, work හි value ආරක්ෂා කිරීම, සහ privacy රැක ගැනීම මඟින් political camp කිසිවක් claim නොකර political effects ඇති කරන moral achievements නිපදවයි"
