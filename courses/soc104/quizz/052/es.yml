question: "¿Cuál es la diferencia clave entre minarquistas y anarcocapitalistas dentro del libertarismo?"
answer: "Los minarquistas aceptan un Estado mínimo para defensa, justicia y policía, mientras que los anarcocapitalistas quieren privatizar todas las funciones estatales"
wrong_answers:
  - "Los minarquistas rechazan toda forma de gobierno, mientras que los anarcocapitalistas aceptan una regulación estatal limitada de los mercados"
  - "Los minarquistas favorecen la tributación progresiva para servicios esenciales, mientras que los anarcocapitalistas se oponen a toda tributación"
  - "Los minarquistas se centran solo en la libertad económica, mientras que los anarcocapitalistas defienden tanto las libertades económicas como las sociales"
explanation: >-
  Los minarquistas creen que el Estado debe limitarse a funciones centrales como defensa, justicia y policía (el "Estado vigilante nocturno"), mientras que los anarcocapitalistas sostienen que incluso estas funciones deben privatizarse y gestionarse mediante competencia voluntaria de mercado. Su desacuerdo trata más sobre la implementación práctica que sobre principios éticos fundamentales. Ambas tendencias comparten los mismos valores libertarios de autopropiedad y no agresión.
