question: "Popper는 왜 열린 사회가 그 장점에도 불구하고 본질적으로 취약하다고 주장하나요?"
answer: "개인주의가 함축하는 책임이 두렵게 보일 수 있어, 공동체적 보호, 권위, 또는 이상화된 과거에 대한 향수 속으로 피난하려는 유혹을 만들기 때문입니다"
wrong_answers:
  - "열린 사회는 군사력이 부족해 닫힌 사회의 침략으로부터 자신을 방어할 수 없기 때문입니다"
  - "민주주의 제도는 본질적으로 비효율적이며 결국 관료적 복잡성의 무게 아래 붕괴하기 때문입니다"
  - "열린 사회는 지나친 경제적 불평등을 허용하고, 이는 필연적으로 혁명과 권위주의 정권의 설치로 이어지기 때문입니다"
explanation: >-
  Popper는 열린 사회의 취약성이 심리적 취약성에서 비롯된다고 강조합니다. 개인주의가 함축하는 책임은 두렵고 위험해 보일 수 있습니다. 스스로 선택해야 하며 실패할 수도 있기 때문입니다. 이는 공동체적 보호나 이상화된 과거를 향한 향수적 경향 속으로 피난하려는 유혹을 만듭니다. 열린 사회는 공동체주의적 충동과 반복되는 폭력의 유혹으로부터 계속 도전에 직면합니다.
reviewed: false
