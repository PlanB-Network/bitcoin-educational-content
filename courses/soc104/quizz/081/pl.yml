question: "Na czym polega kluczowa niezgoda między libertarianami a innymi rodzinami politycznymi, gdy podzielają te same cele?"
answer: "Niezgoda dotyczy środków: libertarianie odrzucają rozwiązania przymusowe i sprzyjają dobrowolnej wymianie poprzez proces rynkowy"
wrong_answers:
  - "Niezgoda dotyczy celów: libertarianie dążą do innych celów, takich jak indywidualne bogactwo, zamiast dobrobytu społecznego"
  - "Niezgoda dotyczy tempa: libertarianie chcą osiągnąć te same cele wolniej poprzez stopniową reformę"
  - "Niezgoda dotyczy zakresu: libertarianie chcą stosować te same polityki tylko na poziomie lokalnym, a nie krajowym"
explanation: >-
  Libertarianie mogą zgadzać się z socjalistami, konserwatystami i centrystami co do pewnych celów, takich jak obrona uciskanych albo promowanie spójności społecznej. Spór nie leży w celach, lecz w środkach. Libertarianie odrzucają wszystkie przymusowe rozwiązania, które dążą do ujednolicenia praktyk i regulacji, zamiast tego broniąc siły wyboru i odpowiedzialnej wolności przez wolną, zdecentralizowaną wymianę opartą na dobrowolnych umowach.
