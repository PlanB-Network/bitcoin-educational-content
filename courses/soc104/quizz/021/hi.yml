question: "यूरोपीय राजनीतिक परंपरा में 'liberal' शब्द का क्या अर्थ है?"
answer: "laissez-faire अर्थनीति, घटे हुए राज्य-हस्तक्षेप और व्यक्तिगत स्वतंत्रताओं का समर्थक"
wrong_answers:
  - "राज्य-हस्तक्षेप, सार्वजनिक स्वास्थ्य बीमा और गरीबी-विरोधी कार्यक्रमों का पक्षधर"
  - "एक कट्टर अराजकतावादी जो सरकार और निजी संपत्ति के पूर्ण उन्मूलन की मांग करता है"
  - "एक मध्यमार्गी जो सभी नीतिगत क्षेत्रों में समाजवादी और रूढ़िवादी स्थितियों को समान रूप से संतुलित करता है"
explanation: >-
  यूरोप में liberalism laissez-faire आर्थिक नीतियों, घटे हुए राज्य-हस्तक्षेप और व्यक्तिगत स्वतंत्रताओं की रक्षा से जुड़ा रहा है। पहला गलत उत्तर अमेरिकी liberals का वर्णन करता है, जिन्होंने इस शब्द के अर्थ को हस्तक्षेपवाद की ओर मोड़ दिया है। यूरोपीय liberalism न तो अराजकतावाद है और न मध्यमार्गवाद।
reviewed: false
