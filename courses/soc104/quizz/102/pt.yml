question: "O que o curso identifica como a verdadeira divisão política, para além do espectro tradicional esquerda-direita-centro?"
answer: "A divisão entre princípios filosóficos fundamentais: liberdade ou coerção, consentimento voluntário ou compulsão, o indivíduo responsável ou o coletivo"
wrong_answers:
  - "A divisão entre nações ricas e pobres pelo controle de acordos comerciais internacionais e instituições financeiras globais"
  - "A divisão entre populações urbanas e rurais sobre prioridades de gastos governamentais e investimento em infraestrutura"
  - "A divisão entre culturas progressistas e tradicionais sobre normas sociais, valores familiares e educação religiosa"
explanation: >-
  O curso argumenta que a verdadeira divisão política não está nos rótulos tradicionais de esquerda-direita-centro, mas em princípios filosóficos fundamentais: liberdade ou coerção, consentimento voluntário ou compulsão, o indivíduo responsável ou o coletivo. A maneira correta de pensar sobre política é partir de princípios éticos, e não de rótulos.
reviewed: false
