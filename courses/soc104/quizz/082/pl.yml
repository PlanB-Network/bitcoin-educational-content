question: "Czym jest konstruktywizm jako wspólne przekonanie polityczne?"
answer: "Wiarą, że centralny rząd może stworzyć, siłą prawa, porządek społeczny dobry dla największej liczby"
wrong_answers:
  - "Wiarą, że społeczeństwo powinno być organizowane przez dobrowolną współpracę między jednostkami bez ingerencji państwa"
  - "Wiarą, że tylko wolne rynki mogą określić optymalną dystrybucję zasobów w społeczeństwie"
  - "Wiarą, że władza polityczna powinna być rozdzielona równo między wszystkich obywateli poprzez demokrację bezpośrednią"
explanation: >-
  Konstruktywizm jednoczy centrystów, konserwatystów i socjalistów wokół wspólnego przekonania: wyższości procesu politycznego nad procesem rynkowym. Jest to wiara, że centralny rząd może stworzyć, siłą prawa, porządek społeczny dobry dla największej liczby. Stoi to w bezpośredniej opozycji do libertariańskiej obrony spontanicznego porządku wyłaniającego się z dobrowolnych interakcji.
