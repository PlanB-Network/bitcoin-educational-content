question: "Ni irihe tandukaniro rihambaye hagati yo kuba pro-business no kuba pro-market?"
answer: "Kuba pro-business bisigura gushigikira ubufatanye hagati y'ibigo binini na Leta, mu gihe kuba pro-market bisigura gushigikira uguhiganwa kwigenga ata butoni bwa Leta"
wrong_answers:
  - "Kuba pro-business bisigura gushigikira amashirahamwe matomato, mu gihe kuba pro-market bisigura gushigikira amashirahamwe mpuzamakungu"
  - "Kuba pro-business bisigura kurwanya amabwirizwa yose, mu gihe kuba pro-market bisigura kwemera amabwirizwa aringaniye"
  - "Kuba pro-business kwitwararika amahinguriro yo mu gihugu, mu gihe kuba pro-market kwitwararika ubudandaji mpuzamakungu"
explanation: >-
  Centrists bakunda kuba pro-business, bisigura ko bashigikira ubwoko bw'ubufatanye hagati y'ibigo binini na Leta, ivyo bikaba bitandukanye no kuba pro-market. Kuba pro-market bishigikira uguhiganwa kwigenga ata butoni bwa Leta canke protectionism y'amashirahamwe. Iri tandukaniro rirahambaye cane kuko politike za pro-business zishobora kurema ukwiharira amasoko n'uburinzi bw'amabwirizwa mu vy'ukuri busambura uguhiganwa kw'isoko ryigenga.
