question: "Bagaimana tiga fungsi esensial pasar bebas, sebagaimana dijelaskan oleh kaum libertarian, bersama-sama membentuk sistem organisasi sosial yang efisien sekaligus etis?"
answer: "Harga memberikan kompas bagi keputusan, pasar mengungkap preferensi autentik melalui penawaran dan permintaan, dan pertukaran bebas memungkinkan individu menentukan urusan mereka sendiri menurut nilai pribadi, memadukan efisiensi informasi dengan otonomi moral"
wrong_answers:
  - "Pasar memaksimalkan kekayaan total, mencegah monopoli melalui kompetisi alami, dan memastikan distribusi sumber daya yang setara, memadukan produktivitas dengan keadilan sosial"
  - "Pasar bebas mengurangi belanja pemerintah, merangsang inovasi teknologi, dan menciptakan peluang kerja, memadukan tanggung jawab fiskal dengan pertumbuhan ekonomi"
  - "Pasar menurunkan harga konsumen, meningkatkan kualitas produk melalui kompetisi, dan memperluas perdagangan internasional, memadukan kemakmuran domestik dengan kerja sama global"
explanation: >-
  Pembelaan libertarian atas pasar bebas bertumpu pada tiga fungsi yang saling terkait. Pertama, harga berfungsi sebagai indikator andal yang memandu keputusan ekonomi dan sosial (kompas). Kedua, pasar mengungkap preferensi individu yang autentik melalui penawaran dan permintaan. Ketiga, pertukaran bebas memungkinkan para aktor menentukan urusan mereka sendiri menurut nilai pribadi. Hayek menunjukkan bahwa pasar bebas mengoordinasikan informasi yang tersebar dengan lebih baik daripada perencanaan pusat (efisiensi), sementara persetujuan timbal balik lebih menghormati martabat manusia daripada paksaan (keadilan).
reviewed: false
