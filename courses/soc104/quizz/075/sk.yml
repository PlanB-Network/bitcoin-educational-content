question: "Ako sa líšia konzervatívne a libertariánske pozície k minimálnej mzde vo svojom zdôvodnení napriek tomu, že obe uprednostňujú jej zrušenie?"
answer: "Konzervatívci akceptujú určitú účasť štátu pri stanovovaní miezd, ak nebráni konkurencieschopnosti, zatiaľ čo libertariáni považujú minimálnu mzdu za morálne vnucovanie slobode najímať a podnikať"
wrong_answers:
  - "Konzervatívci odmietajú minimálnu mzdu, pretože vytvára infláciu, zatiaľ čo libertariáni ju odmietajú, pretože dáva príliš veľkú moc odborom"
  - "Konzervatívci chcú, aby mzdy stanovovali náboženské a komunitné inštitúcie, zatiaľ čo libertariáni chcú, aby mzdy určovali vládou schválené trhové štúdie"
  - "Konzervatívci veria, že minimálne mzdy by sa mali líšiť podľa regiónu, zatiaľ čo libertariáni veria, že na národnej úrovni by mala platiť jedna jednotná mzda"
explanation: >-
  Obe pozície uprednostňujú zníženie alebo zrušenie minimálnej mzdy, ale ich zdôvodnenie sa zásadne líši. Konzervatívci akceptujú určitú účasť štátu pri stanovovaní miezd, pričom trvajú na tom, aby zostala minimálna a závislá od kontextu, so zameraním na konkurencieschopnosť. Libertariáni zaujímajú silnejšiu morálnu pozíciu: minimálna mzda je vnucovaním slobode najímať a podnikať. Keď libertariáni hovoria „trh“, myslia tým zmluvu slobodne vyjednanú medzi dvoma stranami bez zásahu štátu.
