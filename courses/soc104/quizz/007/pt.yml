question: "Que tensão interna existe entre os libertários no diagrama de Nolan?"
answer: "Alguns querem abolir o Estado por completo (anarcocapitalistas), enquanto outros preferem um Estado mínimo que mantenha funções soberanas centrais (minarquistas)"
wrong_answers:
  - "Alguns querem forte regulação econômica, enquanto outros preferem a desregulamentação completa de todos os setores"
  - "Alguns apoiam eleições democráticas, enquanto outros favorecem um sistema hereditário de governança"
  - "Alguns defendem políticas sociais progressistas, enquanto outros defendem valores morais estritamente tradicionais"
explanation: >-
  Dentro da família libertária, há uma discordância fundamental sobre o papel do Estado. Anarcocapitalistas querem substituir todas as funções estatais por serviços privados, enquanto minarquistas aceitam um Estado mínimo que mantenha funções soberanas centrais como defesa e tribunais. Ambos os grupos compartilham o topo libertário, mas diferem sobre se algum Estado deve existir.
reviewed: false
