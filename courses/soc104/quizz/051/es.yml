question: "¿Qué colocan los libertarios en el centro de su filosofía política?"
answer: "La ética y el derecho"
wrong_answers:
  - "El crecimiento económico y la creación de riqueza"
  - "La igualdad social y el bienestar colectivo"
  - "La identidad nacional y la preservación cultural"
explanation: >-
  Los libertarios se distinguen de todas las demás familias políticas por situar la ética y el derecho en el centro de su filosofía, no la economía. Cuando defienden la economía de mercado, lo hacen menos por su capacidad de producir riqueza que por su promoción de la libertad individual y la responsabilidad. El crecimiento económico es un beneficio secundario, no el principio fundacional.
