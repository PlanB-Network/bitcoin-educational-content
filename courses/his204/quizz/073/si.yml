question: Voltaire L'Homme aux quarante écus තුළ කුමක් විවේචනය කරයිද?
answer: Physiocratsගේ බදු න්‍යාය
wrong_answers:
  - Physiocratsගේ මුදල් න්‍යාය
  - Physiocratsගේ දේශපාලන න්‍යාය
  - Physiocratsගේ වටිනාකම් න්‍යාය
explanation: |
  Voltaire "L'Homme aux quarante écus" තුළ Physiocratsගේ බදු න්‍යාය විවේචනය කරයි. එය Physiocrats යෝජනා කළ භූමිය මත තනි බද්දක් පිළිබඳ අදහස ඔහු උපහාසයට ලක් කරන දාර්ශනික කතාවකි.
