question: "چرا پوپر استدلال می‌کند که جامعهٔ باز، با وجود مزایایش، ذاتاً شکننده باقی می‌ماند؟"
answer: "زیرا مسئولیتی که فردگرایی در پی دارد می‌تواند ترسناک به نظر برسد و وسوسهٔ پناه‌بردن به حمایت جمعی، اقتدار، یا نوستالژی نسبت به گذشته‌ای آرمانی‌شده را ایجاد کند"
wrong_answers:
  - "زیرا جوامع باز توان نظامی ندارند و نمی‌توانند از خود در برابر تهاجم جوامع بسته دفاع کنند"
  - "زیرا نهادهای دموکراتیک ذاتاً ناکارآمدند و سرانجام زیر وزن پیچیدگی بوروکراتیک فرو می‌پاشند"
  - "زیرا جوامع باز نابرابری اقتصادی بیش از حدی را مجاز می‌دانند، که ناگزیر به انقلاب و برپایی رژیم‌های اقتدارگرا می‌انجامد"
explanation: >-
  پوپر تأکید می‌کند که شکنندگی جامعهٔ باز از یک آسیب‌پذیری روان‌شناختی سرچشمه می‌گیرد. مسئولیتی که فردگرایی در پی دارد می‌تواند ترسناک و پرخطر به نظر برسد، زیرا فرد باید انتخاب‌های خود را انجام دهد و ممکن است شکست بخورد. این امر وسوسهٔ پناه‌بردن به حمایت جمعی یا گرایش‌های نوستالژیک به سوی گذشته‌ای آرمانی‌شده را ایجاد می‌کند. جامعهٔ باز با چالش‌های مداومِ ناشی از تکانه‌های اجتماع‌گرایانه و وسوسهٔ تکرارشوندهٔ خشونت روبه‌روست.
reviewed: false
