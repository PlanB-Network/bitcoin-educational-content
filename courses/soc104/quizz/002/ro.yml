question: "De ce este considerată axa stânga-dreapta inadecvată pentru a plasa gânditori liberali clasici precum Bastiat sau Ron Paul?"
answer: "Deoarece liberalismul clasic prețuiește atât libertățile economice, cât și pe cele personale, pe care nici stânga, nici dreapta nu le îmbrățișează pe deplin"
wrong_answers:
  - "Deoarece liberalii clasici se aliniază întotdeauna cu politicile economice de dreapta și resping toate pozițiile de stânga"
  - "Deoarece liberalii clasici sunt centriști care adoptă versiuni moderate ale ideologiilor de stânga și de dreapta"
  - "Deoarece liberalii clasici se opun tuturor formelor de guvernare, ceea ce îi face anarhiști mai degrabă decât gânditori politici"
explanation: >-
  Axa stânga-dreapta eșuează în cazul liberalilor clasici deoarece nu poate acomoda o poziție care apără simultan libertatea economică (de obicei asociată cu dreapta) și libertatea personală (de obicei asociată cu stânga). Liberalii clasici nu sunt centriști care caută compromisuri, nici anarhiști sau pur și simplu oameni de dreapta. Ei pur și simplu nu se potrivesc pe un spectru unidimensional.
reviewed: false
