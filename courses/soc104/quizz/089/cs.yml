question: "Proč Mises zdůrazňuje, že individualismus by neměl být zaměňován se soběstačností nebo misantropií?"
answer: "Protože individualismus podporuje spolupráci a sdružování, pokud spočívají na svobodném souhlasu účastníků, a uznává, že lidé rozvíjejí svůj plný potenciál prostřednictvím dobrovolných vztahů s druhými"
wrong_answers:
  - "Protože individualismus vyžaduje, aby se lidé připojovali k povinným občanským organizacím a zajistili tak svůj příspěvek k obecnému dobru"
  - "Protože individualismus znamená, že každý člověk musí zcela spoléhat na stát u služeb, které si nedokáže zajistit sám"
  - "Protože individualismus vyžaduje, aby lidé soupeřili mezi sebou ve všech oblastech a prokazovali svou osobní nadřazenost"
explanation: >-
  Mises zdůrazňuje, že lidská bytost je společenský tvor. Individualismus neznamená izolaci. Podporuje spolupráci a sdružování za podmínky, že spočívají na svobodném souhlasu účastníků. Lidská bytost může plně rozvinout svůj potenciál pouze ve vztahu k druhým, ale tato spolupráce musí být dobrovolná, nikoli vnucená kolektivní autoritou.
