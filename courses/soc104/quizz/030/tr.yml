question: "Liberteryenler ile muhafazakârlar hangi ortak zemini paylaşır ve onları ne ayırır?"
answer: "Sınırlı hükümete bağlılığı ve zorla eşitçiliğin reddini paylaşırlar, ancak askeri müdahalecilik ve sosyal politikalar konusunda anlaşmazlığa düşerler"
wrong_answers:
  - "Korumacı ticaret politikalarına ve ulusal savunmaya desteği paylaşırlar, ancak dinin kamusal yaşamdaki rolü konusunda anlaşmazlığa düşerler"
  - "Artan oranlı vergilendirme ve refah programlarına bağlılığı paylaşırlar, ancak göç politikası konusunda anlaşmazlığa düşerler"
  - "Serbest ticarete ve uyuşturucunun yasallaştırılmasına muhalefeti paylaşırlar, ancak federal hükümetin büyüklüğü konusunda anlaşmazlığa düşerler"
explanation: >-
  Liberteryenler ve muhafazakârlar sınırlı hükümeti savunur, zorla eşitçiliği reddeder, kamu borcuna karşı çıkar ve eyalet haklarını savunur. Bununla birlikte liberteryenler neo-muhafazakârların askeri müdahaleciliğini reddeder, muhafazakâr sosyal politikalara ve sübvansiyonlara karşı çıkar, uyuşturucu yasağını mahkûm eder ve korumacılığı reddeder. İttifak gerçektir ama doğası gereği gerilimlidir.
