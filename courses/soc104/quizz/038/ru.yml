question: "Почему интенциональные определения политических систем считаются проблематичными для аналитических целей?"
answer: "Они создают концептуальную путаницу, потому что все системы заявляют, что преследуют сходные цели, такие как справедливость, равенство и свобода"
wrong_answers:
  - "Они слишком точны и жёстки, не оставляя места для естественной эволюции политических движений со временем"
  - "Они слишком сильно сосредоточены на экономических результатах и игнорируют культурные и социальные измерения политической жизни"
  - "Они опираются на засекреченные правительственные документы, которые редко доступны независимым исследователям"
explanation: >-
  Интенциональные определения опираются на заявленные мотивы и цели, но каждая политическая система заявляет, что стремится к справедливости, равенству и свободе. Из-за этого системы невозможно отличить друг от друга. Структурный анализ, напротив, оценивает системы по их эмпирическим, измеримым последствиям и средствам, которые они используют, раскрывая их подлинную природу за пределами риторики.
