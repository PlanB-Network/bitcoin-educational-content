question: "보수주의는 경제 영역과 사회 영역에서 자유를 어떻게 다루나요?"
answer: "경제 영역에서는 강한 자유를, 사회 영역에서는 약한 자유를 인정합니다"
wrong_answers:
  - "전통적 사회 질서를 유지하기 위해 경제와 사회 두 영역 모두에서 약한 자유를 인정합니다"
  - "사회 영역에서는 강한 자유를, 경제 영역에서는 약한 자유를 인정합니다"
  - "어떤 종류의 정부 개입도 최소화하며 두 영역 모두에서 동등하고 제한 없는 자유를 인정합니다"
explanation: >-
  보수주의는 사회주의의 거울상인 이분법을 보입니다. 경제 영역에서 보수주의자들은 자유 시장, 기업가정신, 사유재산을 옹호합니다. 사회 영역에서는 전통적 도덕 규범과 사회 안정의 보존으로 제한이 정당화됩니다. 세 번째 오답은 그 반대인 사회주의 패턴을 설명합니다.
