question: "Computing #ᶜ(comp f g) hashes 128 bytes: the comp tag twice, then both child CMRs. Why is that still at most one SHA-256 compression call?"
answer: The first 64-byte block is the constant tag∥tag, whose midstate is precomputed once; only the block holding the child CMRs is compressed.
wrong_answers:
  - Dropping SHA-256's final length-padding block alone lets the whole 128 bytes fit in one call.
  - The two child CMRs are XORed into one 32-byte digest, shrinking the input to a single block.
  - SHA-256-midstate is a wide-block variant that absorbs 128-byte message blocks in one pass.
explanation: >-
  SHA-256's compression function processes fixed 64-byte blocks, so a
  128-byte input normally needs two calls (plus one more for the length
  padding in full SHA-256). Because every combinator's first block is the
  constant tag∥tag, its midstate can be precomputed once and cached; each
  expression then only needs one fresh compression of the block holding
  its children's CMRs. Midstates also drop the final padding block, but
  that alone would still leave two compressions — the precomputed tag
  midstate is what brings it down to at most one.
reviewed: false
