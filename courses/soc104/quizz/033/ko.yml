question: "Milton Friedman은 정치 정책을 판단하는 것에 대해 어떤 경고를 했나요?"
answer: "정책은 의도가 아니라 결과로 판단해야 합니다"
wrong_answers:
  - "정책은 그것을 제안한 정치인들의 도덕적 성품으로 판단해야 합니다"
  - "정책은 일반 유권자들에게 얼마나 인기 있는지로 판단해야 합니다"
  - "정책은 그 나라의 원래 헌법과 부합하는지로 판단해야 합니다"
explanation: >-
  Friedman은 가장 큰 실수 중 하나가 정책을 그 결과가 아니라 의도로 판단하는 것이라고 썼으며, 가난한 사람들을 위한 것이라고 표시된 프로그램은 거의 언제나 그 후원자들이 의도한 것과 정반대의 효과를 낳는다고 지적했습니다. 이는 좋은 경제학자가 전체 인구에 대한 단기적 효과와 장기적 효과를 모두 고려한다는 Bastiat의 가르침과 공명합니다.
reviewed: false
