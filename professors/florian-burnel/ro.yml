bio: |
  Inginer de sisteme și rețele, co-fondator al IT-Connect și Microsoft MVP „Cloud and Datacenter Management”. Îmi place să îmi împărtășesc experiența și descoperirile prin articolele mele. Sunt un generalist cu un interes deosebit pentru soluțiile Microsoft și scripting.
  
