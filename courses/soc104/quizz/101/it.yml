question: "Che cosa credono i libertari riguardo alla capacità degli individui di prendere decisioni?"
answer: "Gli individui hanno sia il diritto sia la responsabilità di prendere le proprie decisioni riguardo alla loro vita"
wrong_answers:
  - "Gli individui dovrebbero prendere decisioni solo dopo aver consultato rappresentanti eletti che comprendono le implicazioni delle politiche pubbliche"
  - "Gli individui sono generalmente incapaci di prendere buone decisioni e hanno bisogno della guida esperta delle istituzioni governative"
  - "Gli individui dovrebbero prendere liberamente decisioni economiche ma deferire allo Stato su tutte le questioni sociali e culturali"
explanation: >-
  Da un punto di vista libertario, gli individui hanno sia il diritto sia la responsabilità di prendere le proprie decisioni. Questo contrasta con le famiglie politiche convenzionali, da sinistra a destra, che credono che il governo debba prendere alcune o molte delle decisioni importanti nella vita di un individuo e nella vita economica in generale.
reviewed: false
