question: "Kutokubaliana muhimu kati ya walibertari na familia nyingine za kisiasa ni kupi wanaposhiriki malengo yale yale?"
answer: "Kutokubaliana ni kuhusu njia: walibertari hukataa suluhu za kulazimisha na hupendelea ubadilishanaji wa hiari kupitia mchakato wa soko"
wrong_answers:
  - "Kutokubaliana ni kuhusu malengo ya mwisho: walibertari hufuata malengo tofauti kama utajiri wa mtu binafsi badala ya ustawi wa kijamii"
  - "Kutokubaliana ni kuhusu muda: walibertari wanataka kufikia malengo yale yale polepole zaidi kupitia mageuzi ya hatua kwa hatua"
  - "Kutokubaliana ni kuhusu upeo: walibertari wanataka kutumia sera zile zile katika viwango vya kienyeji pekee badala ya kitaifa"
explanation: >-
  Walibertari wanaweza kukubaliana na wanasoshalisti, wahafidhina, na watu wa msimamo wa kati kuhusu malengo fulani kama kuwatetea wanaokandamizwa au kukuza mshikamano wa kijamii. Kutokubaliana hakuko katika malengo ya mwisho bali katika njia. Walibertari hukataa suluhu zote za kulazimisha zinazotaka kusawazisha kwa lazima matendo na kanuni, badala yake wakitetea nguvu ya kuchagua na uhuru wenye wajibu kupitia ubadilishanaji huru, uliogatuliwa, unaotegemea mikataba ya hiari.
