question: Enlightenmentහි දාර්ශනිකයන් දේශපාලන ආර්ථිකයේ සංවර්ධනයේදී විරුද්ධාභාසී භූමිකාවක් ඉටු කළ බව පැවසිය හැක්කේ ඇයි?
answer: ඔවුන් එහි මූලධර්ම සමරමින්ද හෙළා දකිමින්ද සිටියහ
wrong_answers:
  - ඔවුන් මෙම විද්‍යාවට උනන්දු වූයේ ජීවිතයේ ඉතා පසුව පමණි
  - සමහරු පැහැදිලිවම ආර්ථික විද්‍යාඥයන් වන අතර, අනෙක් අය ඔවුන්ගේ විරුද්ධවාදීන්ය
  - ඔවුන් අධිකව න්‍යායාත්මක වූ අතර ප්‍රායෝගිකව ප්‍රමාණවත් නොවූහ
explanation: |
  Enlightenmentහි දාර්ශනිකයන් දේශපාලන ආර්ථිකය පිළිබඳ විවිධ, හිතකර සහ විවේචනාත්මක, අදහස් දැරූහ. සමහරු ආර්ථික ලිබරල්වාදයේ මූලධර්ම ආරක්ෂා කළ අතර, අනෙක් අය අසමානතාවයේ සහ සූරාකෑමේ අනතුරු ගැන අනතුරු ඇඟවූහ.
