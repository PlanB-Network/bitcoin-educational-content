question: "Cato Institute、Mises Institute 和 Libertarian Party 在自由意志主义运动中的角色有何不同？"
answer: "Cato Institute 专注于公共政策提案，Mises Institute 专注于教育和学术出版，Libertarian Party 专注于选举政治"
wrong_answers:
  - "Cato Institute 资助政治竞选，Mises Institute 直接游说国会，Libertarian Party 组织学术会议"
  - "Cato Institute 出版经济学教材，Mises Institute 开展选民登记活动，Libertarian Party 起草法案"
  - "Cato Institute 组织草根抗议，Mises Institute 为自由意志主义者提供法律辩护，Libertarian Party 管理智库研究"
explanation: >-
  Cato Institute（成立于 1977 年）是一家位于华盛顿的智库，致力于公共政策提案。Mises Institute（成立于 1982 年）专注于教育而非政治游说，作为一种在线大学运作，举办会议并重新出版著作。Libertarian Party（成立于 1971 年）是美国第三大政党，参与选举，即使其约 2% 的得票率也可能左右选举结果。
reviewed: false
