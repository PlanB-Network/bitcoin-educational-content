question: قضیه کامل‌بودن درباره Simplicity چه چیزی را تضمین می‌کند؟
answer: اینکه هر تابعی بین دو نوع Simplicity را می‌توان از نه ترکیب‌گر ساخت.
wrong_answers:
  - اینکه برنامه‌های Simplicity تضمین شده‌اند که همیشه در زمان ثابت پایان می‌یابند.
  - اینکه Simplicity تورینگ‌کامل است و می‌تواند هر ماشین تورینگ را کاملاً شبیه‌سازی کند.
  - اینکه هر برنامه معتبر Simplicity یک نمایش یکتای واحد دارد.
explanation: >-
  قضیه کامل‌بودن ثابت می‌کند که برای هر تابع بین نوع‌های متناهی Simplicity،
  یک عبارت Simplicity وجود دارد که آن را محاسبه می‌کند. اثبات سازنده، یک
  جدول جست‌وجو را با استفاده از عبارت‌های تو در توی case و scribe می‌سازد.
  این موضوع به‌صورت صوری در دستیار اثبات Rocq راستی‌آزمایی شده است.
