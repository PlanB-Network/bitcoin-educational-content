question: "Ktorá pozícia sa v Nolanovom diamante nachádza hore a predstavuje maximálnu slobodu?"
answer: "Libertarianizmus, podporujúci najväčšiu ekonomickú a osobnú slobodu"
wrong_answers:
  - "Konzervativizmus, podporujúci tradičné hodnoty a ekonomickú slobodu"
  - "Centrizmus, pragmaticky vyvažujúci všetky politické pozície"
  - "Socializmus, podporujúci osobnú slobodu a sociálnu rovnosť"
explanation: >-
  Libertarianizmus zaujíma vrchol Nolanovho diamantu ako opak etatizmu. Predstavuje tých, ktorí podporujú najväčšiu mieru ekonomickej aj osobnej slobody. Konzervativizmus sa nachádza napravo (vysoká ekonomická sloboda, nízka osobná sloboda), socializmus naľavo (vysoká osobná sloboda, nízka ekonomická sloboda) a centrizmus uprostred.
