question: "Mengapa libertarian menentang perpajakan?"
answer: "Karena itu merupakan pelanggaran moral terhadap hak milik, suatu bentuk pencurian negara yang merampas properti orang lain tanpa persetujuan"
wrong_answers:
  - "Karena pajak tidak efisien secara ekonomi dan selalu menyebabkan tingkat pengangguran yang lebih tinggi"
  - "Karena perpajakan menghambat investasi asing dan melemahkan posisi kompetitif suatu negara"
  - "Karena sistem pajak progresif secara tidak adil menargetkan individu kaya yang menciptakan paling banyak pekerjaan"
explanation: >-
  Keberatan libertarian terhadap perpajakan bersifat moral sebelum bersifat ekonomi. Libertarian memandang perpajakan sebagai bentuk pencurian negara dan hambatan terhadap properti privat karena ia terdiri dari perampasan properti orang lain tanpa persetujuan. Meskipun mungkin ada argumen ekonomi melawan perpajakan, argumen libertarian yang mendasar bertumpu pada prinsip bahwa perpajakan melanggar hak milik, bukan pada perhitungan efisiensi atau daya saing.
