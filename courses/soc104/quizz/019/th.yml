question: "รัฐนิยมฝ่ายซ้ายและรัฐนิยมฝ่ายขวามีวัตถุประสงค์ทางการเมืองร่วมกันอย่างไร?"
answer: "ชนะอำนาจเพื่อจัดระเบียบสังคมตามวิสัยทัศน์โลกของตนเองและบังคับใช้กับทุกคน"
wrong_answers:
  - "ลดขนาดของรัฐบาลและคืนอำนาจการตัดสินใจให้พลเมืองแต่ละคน"
  - "สถาปนาประชาธิปไตยทางตรงที่พลเมืองทุกคนลงคะแนนในทุกการตัดสินใจทางกฎหมาย"
  - "กำจัดพรรคการเมืองและแทนที่ด้วยการปกครองแบบเทคโนแครตอิสระ"
explanation: >-
  รัฐนิยมทั้งฝ่ายซ้ายและฝ่ายขวามีวัตถุประสงค์ทางการเมืองเดียวกัน: ชนะอำนาจเพื่อจัดระเบียบสังคมตามวิสัยทัศน์โลกของตนเอง และบังคับใช้กับทุกคนผ่านกฎหมาย ความแตกต่างมีเพียงคุณค่าของพวกเขา: ฝ่ายขวาอ้างการปกป้องอารยธรรม ขณะที่ฝ่ายซ้ายอ้างการปกป้องชนชั้นแรงงานหรือผู้ถูกกดขี่ ทั้งสองฝ่ายไม่ได้มุ่งลดรัฐบาลหรือกำจัดพรรคการเมือง
reviewed: false
