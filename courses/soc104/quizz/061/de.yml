question: "Was zeigt Mussolinis Erklärung von 1920, 'Alles im Staat, nichts außerhalb des Staates, nichts gegen den Staat', über den Totalitarismus?"
answer: "Es gibt keine Trennung zwischen öffentlichem und privatem Raum mehr, da der Staat die Gesellschaft vollständig absorbiert"
wrong_answers:
  - "Der Staat konzentriert sich ausschließlich auf militärische Macht, während er die Wirtschaft der Privatwirtschaft überlässt"
  - "Bürger dürfen sich privat organisieren, solange sie die Regierung nicht offen kritisieren"
  - "Die Regierung kontrolliert nur die politische Tätigkeit, während kulturelles und religiöses Leben autonom bleiben"
explanation: >-
  Mussolinis Erklärung bringt das Wesen des Totalitarismus auf den Punkt: Totalität. Alles wird in den Staat absorbiert, was bedeutet, dass es keine Trennung zwischen öffentlichem und privatem Raum gibt. Die Gesellschaft verliert jede Form von Autonomie, bis hin zu den alltäglichsten Tätigkeiten wie der Gründung eines Sportvereins. Das geht weit über die Kontrolle nur militärischer, politischer oder wirtschaftlicher Sphären hinaus.
reviewed: false
