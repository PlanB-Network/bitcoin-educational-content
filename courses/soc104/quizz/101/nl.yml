question: "Wat identificeert de cursus als de echte politieke scheidslijn, voorbij het traditionele links-rechts-centrum-spectrum?"
answer: "De scheidslijn tussen fundamentele filosofische principes: vrijheid of dwang, vrijwillige instemming of verplichting, het verantwoordelijke individu of het collectief"
wrong_answers:
  - "De scheidslijn tussen rijke en arme landen over controle over internationale handelsakkoorden en mondiale financiële instellingen"
  - "De scheidslijn tussen stedelijke en landelijke bevolkingen over prioriteiten voor overheidsuitgaven en infrastructuurinvesteringen"
  - "De scheidslijn tussen progressieve en traditionele culturen over sociale normen, familiewaarden en religieus onderwijs"
explanation: >-
  De cursus betoogt dat de echte politieke scheidslijn niet ligt in de traditionele labels links-rechts-centrum, maar in fundamentele filosofische principes: vrijheid of dwang, vrijwillige instemming of verplichting, het verantwoordelijke individu of het collectief. De juiste manier om over politiek na te denken is vertrekken vanuit ethische principes in plaats van labels.
reviewed: false
