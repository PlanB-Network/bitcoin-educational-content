question: "Những người libertarian nhìn nhận mối quan hệ giữa sở hữu tư nhân và tự do như thế nào?"
answer: "Sở hữu tư nhân là một quyền tự nhiên có trước luật pháp và nhà nước, đồng thời là chính nền tảng của tự do"
wrong_answers:
  - "Sở hữu tư nhân là một quy ước xã hội do nhà nước tạo ra và có thể bị thu hồi khi nó gây ra bất bình đẳng"
  - "Sở hữu tư nhân hữu ích cho hiệu quả kinh tế nhưng không có ý nghĩa đạo đức hay triết học nội tại"
  - "Sở hữu tư nhân chỉ nên tồn tại đối với tài sản cá nhân, không phải đối với tài sản sản xuất hay đất đai"
explanation: >-
  Những người libertarian bảo vệ sở hữu tư nhân như một quyền tự nhiên có trước luật pháp và nhà nước. Họ lập luận rằng nếu một cá nhân sở hữu chính thân thể mình, thì họ cũng sở hữu lao động của mình và thành quả của lao động đó. Quyền sở hữu hàng hóa vật chất là phần mở rộng của quyền tự sở hữu. Điều này tương phản rõ rệt với quan điểm libertaire rằng sở hữu là một quy ước xã hội hoặc một nguồn gốc của áp bức.
