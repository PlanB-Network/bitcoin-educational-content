question: "Kako se sajferpank filozofija o centralizaciji povezuje s libertarijanskim principom pristanka kao fundamentalne norme pravde?"
answer: "Sajferpankovi svu centralizaciju vide kao zasnovanu na prinudi, a ne na pristanku, odražavajući libertarijanski stav da ništa ne može biti pravedno ako ga centralizovani autoritet nameće silom"
wrong_answers:
  - "Sajferpankovi veruju da je centralizacija prihvatljiva kada je odobrena demokratskim većinskim glasanjem, što se usklađuje s libertarijanskim poštovanjem ustavnog upravljanja"
  - "Sajferpankovi podržavaju privremenu centralizaciju tokom vanrednih situacija, odražavajući libertarijanski stav da individualna prava mogu biti suspendovana kada je kolektiv ugrožen"
  - "Sajferpankovi se protive centralizaciji samo u tehnološkim sistemima, dok političku centralizaciju prihvataju kao neophodnu za sprovođenje prava svojine i ugovora"
explanation: >-
  Sajferpankovi polažu poverenje u decentralizovane kriptografske sisteme, a ne u centralizovane institucije. Sva centralizacija se doživljava kao zasnovana na prinudi, a ne na pristanku. To direktno odražava libertarijansku filozofiju da je pristanak fundamentalna norma pravde. Ništa ne može biti pravedno ako ga centralizovani autoritet nameće silom, zbog čega su nastojali da izgrade decentralizovane mreže u kojima nijedan pojedinačni entitet ne može nametnuti svoju volju.
