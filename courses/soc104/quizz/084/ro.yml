question: "Care este distincția esențială dintre a fi pro-business și a fi pro-market?"
answer: "Susținătorii pro-business caută intervenția statului pentru a proteja companii specifice de eșec, în timp ce susținătorii pro-market sprijină dereglementarea și permit afacerilor să eșueze, astfel încât piața să se poată reorganiza natural"
wrong_answers:
  - "Susținătorii pro-business se concentrează pe marile corporații, în timp ce susținătorii pro-market se concentrează exclusiv pe sprijinirea micilor afaceri și a startup-urilor"
  - "Pro-business este o poziție de stânga care favorizează cooperativele muncitorești, în timp ce pro-market este o poziție de dreapta care favorizează proprietatea privată"
  - "Susținătorii pro-business resping orice competiție, în timp ce susținătorii pro-market sprijină competiția reglementată de guvern între întreprinderi aprobate"
explanation: >-
  Poziția pro-business privește competiția ca pe un instrument de guvernanță obținut prin reglementări și justifică subvențiile și salvările financiare pentru a preveni pierderea locurilor de muncă. În viziunea pro-business, piața este fragilă și are nevoie de salvarea statului. Susținătorii pro-market văd competiția ca pe rezultatul natural al liberei întreprinderi, ceea ce implică dereglementare și permiterea eșecului afacerilor, deoarece eșecul permite pieței să se reorganizeze natural și deschide terenul pentru actori mai capabili.
reviewed: false
