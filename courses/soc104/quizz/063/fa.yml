question: "همه رژیم‌های تمامیت‌خواه چگونه به قدرت رسیدند؟"
answer: "از طریق انقلاب خشونت‌آمیزی که پاک‌کردن کامل نظام پیشین را توجیه می‌کرد"
wrong_answers:
  - "از طریق اصلاحات قانون‌گذاری تدریجی درون نهادهای دموکراتیک موجود"
  - "از طریق کودتاهای نظامی سازمان‌دهی‌شده توسط قدرت‌های خارجی که به دنبال کنترل منطقه‌ای بودند"
  - "از طریق جنبش‌های توده‌ای صلح‌آمیزی که با اختلاف زیاد در انتخابات مردمی پیروز شدند"
explanation: >-
  همه رژیم‌های تمامیت‌خواه از طریق انقلاب خشونت‌آمیز به قدرت رسیدند. این انقلاب دو هدف دارد: از نظر فیزیکی نظم قدیم را نابود می‌کند و از نظر ایدئولوژیک استفاده از خشونت را برای ساختن جامعه جدید ضروری جلوه می‌دهد. این امر تصرف قدرت توسط تمامیت‌خواهان را از گذارهای دموکراتیک، کودتاهای مورد حمایت خارجی یا پیروزی‌های انتخاباتی صلح‌آمیز متمایز می‌کند.
reviewed: false
