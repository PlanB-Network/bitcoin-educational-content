question: De ce este descris sistemul fiscal al Vechiului Regim drept „descurajator”?
answer: Pentru că un om abia îmbogățit se putea trezi impozitat dublu în anul următor
wrong_answers:
  - Pentru că, prin complexitatea lui, îi descuraja pe agenții fiscali să colecteze impozitele
  - Pentru că blândețea lui îi descuraja pe francezi să fugă în străinătate
  - Pentru că era prea simplu și predictibil
explanation: |
  Fiscalitatea sub Vechiul Regim era adesea arbitrară și imprevizibilă. Absența unor reguli clare și posibilitatea de a fi impozitat excesiv descurajau investițiile și îmbogățirea, întrucât câștigurile puteau fi confiscate prin impozitare.
