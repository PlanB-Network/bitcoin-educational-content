question: push-<n has type Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ. Why must its output be a sum that includes the full vector type Aⁿ?
answer: A buffer Aᑉⁿ holds at most n−1 items, so pushing onto a full buffer yields n items — only Aⁿ can represent that.
wrong_answers:
  - The sum lets callers pick the cheaper encoding, since vectors serialize more compactly than option products.
  - Push can fail on an empty buffer, and the Aⁿ branch is the error case carrying the old contents.
  - case requires any function consuming a sum-typed buffer to also produce a sum-typed output.
explanation: >-
  Aᑉⁿ is exactly the type of lists whose length is strictly less than n,
  so a buffer at maximum capacity holds n−1 elements. Pushing one more
  produces exactly n elements, which Aᑉⁿ cannot represent; the Aⁿ summand
  returns that overflowed result as a full vector. Encoding overflow in
  the output type keeps push-<n a total function rather than a partial one
  — the empty-buffer failure case belongs to pop-<n, not push.
