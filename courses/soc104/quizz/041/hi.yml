question: "Libertarians निजी संपत्ति और स्वतंत्रता के संबंध को कैसे देखते हैं?"
answer: "निजी संपत्ति एक प्राकृतिक अधिकार है जो कानून और राज्य से पहले आता है, और स्वतंत्रता की स्वयं बुनियाद है"
wrong_answers:
  - "निजी संपत्ति राज्य द्वारा बनाई गई एक सामाजिक परंपरा है जिसे असमानता पैदा होने पर वापस लिया जा सकता है"
  - "निजी संपत्ति आर्थिक दक्षता के लिए उपयोगी है लेकिन उसका कोई अंतर्निहित नैतिक या दार्शनिक महत्व नहीं है"
  - "निजी संपत्ति केवल व्यक्तिगत वस्तुओं के लिए होनी चाहिए, उत्पादक परिसंपत्तियों या भूमि के लिए नहीं"
explanation: >-
  Libertarians निजी संपत्ति का एक प्राकृतिक अधिकार के रूप में बचाव करते हैं जो कानून और राज्य से पहले आता है। वे तर्क देते हैं कि यदि कोई व्यक्ति अपने शरीर का स्वामी है, तो वह अपने श्रम और उसके फलों का भी स्वामी है। भौतिक वस्तुओं का स्वामित्व आत्म-स्वामित्व का विस्तार है। यह libertaire दृष्टिकोण से तीव्र विरोध रखता है, जिसके अनुसार संपत्ति एक सामाजिक परंपरा या उत्पीड़न का स्रोत है।
