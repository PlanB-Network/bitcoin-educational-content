question: "Phản ứng của George W. Bush trước cuộc khủng hoảng tài chính 2008 minh họa cho 'sự linh hoạt có vấn đề' của các nguyên tắc bảo thủ như thế nào?"
answer: "Ông từ bỏ các nguyên tắc thị trường tự do để cứu trợ các ngân hàng lớn, bộc lộ quan điểm bảo thủ về nhà nước như người bảo lãnh tối hậu cho ổn định kinh tế quốc gia"
wrong_answers:
  - "Ông từ chối mọi can thiệp của chính phủ và để các ngân hàng phá sản, tuân thủ nghiêm ngặt hệ tư tưởng thị trường tự do bất chấp hậu quả"
  - "Ông quốc hữu hóa vĩnh viễn lĩnh vực ngân hàng và đưa ra thuế lũy tiến, chuyển từ chủ nghĩa bảo thủ sang chủ nghĩa xã hội dân chủ"
  - "Ông đáp lại bằng cách cắt giảm toàn bộ chi tiêu chính phủ và loại bỏ các quy định tài chính để thị trường tự điều chỉnh"
explanation: >-
  Bush tuyên bố rằng ông đã 'từ bỏ các nguyên tắc thị trường tự do để cứu hệ thống thị trường tự do' bằng cách can thiệp để cứu trợ các ngân hàng lớn. Điều này minh họa cách những người bảo thủ có thể ưu tiên quyền lực và tính liên tục của quốc gia hơn các nguyên tắc thị trường trừu tượng. Cùng logic linh hoạt này xuất hiện trong các chính sách thương mại bảo hộ của Trump, được theo đuổi nhân danh lợi ích quốc gia dù có nguy cơ nuôi dưỡng chủ nghĩa tập đoàn và chủ nghĩa tư bản thân hữu.
