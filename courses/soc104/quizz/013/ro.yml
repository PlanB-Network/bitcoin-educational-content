question: "Ce caracterizează partea de jos a axei libertății personale pe diagrama Nolan?"
answer: "Preferința pentru ordine, securitate, valori tradiționale și pentru statul care reglementează morala și menține ordinea publică"
wrong_answers:
  - "Preferința pentru autonomie individuală, toleranță și interferență minimă a statului în alegerile vieții personale"
  - "Preferința pentru dereglementare economică, comerț liber și abolirea tarifelor și subvențiilor"
  - "Preferința pentru redistribuirea averii, taxe ridicate și naționalizarea industriilor-cheie"
explanation: >-
  Partea de jos a axei libertății personale reprezintă controlul maxim al statului asupra vieții personale, caracterizat printr-o preferință pentru ordine, securitate și valori tradiționale. Statul reglementează morala, menține ordinea publică și poate apăra o viziune specifică asupra moralității sau tradiției. Vârful axei reprezintă opusul: libertate individuală și toleranță. Politicile economice sunt măsurate pe axa orizontală separată.
