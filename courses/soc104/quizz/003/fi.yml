question: "Miksi vasemmisto–oikeisto-akselia pidetään riittämättömänä Bastiat'n tai Ron Paulin kaltaisten klassisten liberaalien ajattelijoiden sijoittamiseen?"
answer: "Koska klassinen liberalismi arvostaa sekä taloudellisia että henkilökohtaisia vapauksia, joita vasemmisto eikä oikeisto kumpikaan omaksu täysin"
wrong_answers:
  - "Koska klassiset liberaalit asettuvat aina oikeistolaisten talouspolitiikkojen puolelle ja hylkäävät kaikki vasemmistolaiset kannat"
  - "Koska klassiset liberaalit ovat keskustalaisia, jotka omaksuvat maltillisia versioita sekä vasemmiston että oikeiston ideologioista"
  - "Koska klassiset liberaalit vastustavat kaikkia hallinnon muotoja, mikä tekee heistä anarkisteja eikä poliittisia ajattelijoita"
explanation: >-
  Vasemmisto–oikeisto-akseli ei toimi klassisten liberaalien kohdalla, koska se ei pysty sijoittamaan kantaa, joka puolustaa samanaikaisesti taloudellista vapautta (tyypillisesti oikeisto) ja henkilökohtaista vapautta (tyypillisesti vasemmisto). Klassiset liberaalit eivät ole kompromissia etsiviä keskustalaisia, eivätkä he ole anarkisteja tai puhtaasti oikeistolaisia. He eivät yksinkertaisesti sovi yksiulotteiselle spektrille.
reviewed: false
