question: "constructivism ในฐานะความเชื่อมั่นทางการเมืองร่วมกันคืออะไร?"
answer: "ความเชื่อว่ารัฐบาลกลางสามารถสร้างระเบียบสังคมที่ดีสำหรับคนจำนวนมากที่สุดได้ด้วยอำนาจของกฎหมาย"
wrong_answers:
  - "ความเชื่อว่าสังคมควรถูกจัดระเบียบผ่านความร่วมมือโดยสมัครใจระหว่างปัจเจกบุคคลโดยไม่มีการแทรกแซงของรัฐ"
  - "ความเชื่อว่ามีเพียงตลาดเสรีเท่านั้นที่สามารถกำหนดการกระจายทรัพยากรที่เหมาะสมที่สุดในสังคมได้"
  - "ความเชื่อว่าอำนาจทางการเมืองควรถูกกระจายอย่างเท่าเทียมในหมู่พลเมืองทุกคนผ่านประชาธิปไตยทางตรง"
explanation: >-
  Constructivism รวมสายกลาง ฝ่ายอนุรักษนิยม และฝ่ายสังคมนิยมไว้รอบความเชื่อมั่นร่วมกัน: ความเหนือกว่าของกระบวนการทางการเมืองเหนือกระบวนการตลาด มันคือความเชื่อว่ารัฐบาลกลางสามารถสร้างระเบียบสังคมที่ดีสำหรับคนจำนวนมากที่สุดได้ด้วยอำนาจของกฎหมาย สิ่งนี้ตั้งอยู่ตรงข้ามกับการปกป้องระเบียบเกิดเองของลิเบอร์ทาเรียน ซึ่งเกิดขึ้นจากปฏิสัมพันธ์โดยสมัครใจ
reviewed: false
