question: "Nel diamante di Nolan, quale posizione si trova in cima e rappresenta la massima libertà?"
answer: "Il libertarismo, che sostiene la più ampia libertà economica e personale"
wrong_answers:
  - "Il conservatorismo, che sostiene i valori tradizionali e la libertà economica"
  - "Il centrismo, che bilancia tutte le posizioni politiche in modo pragmatico"
  - "Il socialismo, che sostiene la libertà personale e l'uguaglianza sociale"
explanation: >-
  Il libertarismo occupa la cima del diamante di Nolan come opposto dello statalismo. Rappresenta coloro che sostengono il massimo grado di libertà sia economica sia personale. Il conservatorismo si colloca a destra (alta libertà economica, bassa libertà personale), il socialismo a sinistra (alta libertà personale, bassa libertà economica) e il centrismo al centro.
reviewed: false
