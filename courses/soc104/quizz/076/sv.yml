question: "I Gustave de Molinaris dialoger från 1849, vilken karaktär försvarar frihet som en grundläggande princip snarare än att underordna den andra mål?"
answer: "Ekonomen, som behandlar frihet som en princip som inte är underordnad något annat mål"
wrong_answers:
  - "Socialisten, som försvarar frihet genom progressiva reformer inriktade på social jämlikhet"
  - "Den konservative, som upprätthåller frihet genom att bevara traditionell samhällsordning och stabilitet"
  - "Alla tre karaktärer försvarar frihet lika mycket men är oense om hur den ska genomföras"
explanation: >-
  I Molinaris dialoger från Les Soirees de la rue Saint-Lazare står ekonomen i permanent oenighet med både socialisten och den konservative. Han är den ende som försvarar frihet som en grundläggande princip. Socialisten underordnar friheten progressiva ideal, och den konservative underordnar den bevarandet av ordning, vilket gör ekonomen unik i sitt ovillkorliga försvar av frihet.
