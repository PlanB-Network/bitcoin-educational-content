question: ⟨⟨1,1⟩,1⟩(1+1+1)에서 full-adder를 추적하면, 두 번째 단계인 O O H ▵ (O I H ▵ I H ⨾ half-adder)는 최종 단계에 어떤 값을 넘기나요?
answer: ⟨1, ⟨0, 1⟩⟩ — 첫 번째 half-adder의 캐리, 이어서 두 번째의 캐리와 합입니다.
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ — 첫 번째 half-adder의 캐리, 이어서 두 번째의 합과 캐리입니다.
  - ⟨0, ⟨0, 1⟩⟩ — 첫 번째 half-adder의 합 비트, 이어서 두 번째의 캐리와 합입니다.
  - ⟨1, ⟨1, 1⟩⟩ — 첫 번째 half-adder의 캐리, 이어서 두 번째의 OR 및 XOR 비트입니다.
explanation: >-
  첫 번째 단계는 half-adder⟨1,1⟩ = ⟨1, 0⟩(캐리 1, 합 0)을 계산하고
  carry-in을 보존하여 ⟨⟨1,0⟩, 1⟩을 만듭니다. 두 번째 단계에서 O O H는 첫 번째
  캐리(1)를 추출하고, O I H ▵ I H는 ⟨0, 1⟩ — 첫 번째 합과 carry-
  in — 을 두 번째 half-adder에 넣어, and(0,1)=0이고
  xor(0,1)=1이므로 ⟨0, 1⟩을 산출합니다. 그런 다음 최종 단계는 두 캐리를 OR하고 합을 유지하여
  ⟨1, 1⟩을 생성합니다. 이는 예상대로 이진수 3입니다.
