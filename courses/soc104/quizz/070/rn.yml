question: "Mu biganiro bitanu vy'ikibano (umubano, ukwimuka, inkoho, ibiyayuramutwe, ibinyobwa birimwo isukari), ni uburyo ubuhe bw'isesengura bugaruka kenshi buha isura ikibanza c'abasosiyalisite kuri kimwe cose?"
answer: "Uburyo bw'amakimbirane hagati y'abaganza n'abaganzwa, aho ikibano kiba cubatswe n'agahahazo kandi Leta ikaba ikwiye kwivanga kugira ikingire umugwi w'abanyagoyagoya"
wrong_answers:
  - "Uburyo bushingiye ku nyungu rusangi bushira imbere kwongereza akanyamuneza rusangi n'umusaruro w'ubukungu ku gitigiri kinini kuruta c'abanyagihugu"
  - "Uburyo bw'uburenganzira karemano aho imwidegemvyo y'umuntu ku giti ciwe ikwiye gukingirwa kwivanga kwa Leta n'ukw'amasosiyete"
  - "Uburyo bushingiye ku migenzo ya kera aho inzego z'ikibano zisanzweho zikwiye kuzigamwa imbere y'amahinduka ya none asambura"
explanation: >-
  Ikibanza c'abasosiyalisite mu biganiro vy'ikibano kiguma gihabwa isura n'uburyo bw'amakimbirane hagati y'abaganza n'abaganzwa. Ku mubano, ni abenshi bakunda abo badasangiye igitsina bahahaza bake bakunda abo basangiye igitsina. Ku kwimuka, inzitizi zishingiye ku gihugu umuntu avamwo ni uburyo bw'agahahazo. Ku nkoho, Leta yonyene ni yo ikwiye kugira inguvu kugira ikingire abanyagoyagoya. Ku binyobwa birimwo isukari, abahingura mu mahinguriro bungukira ku bugoyagoye bw'abafise uburinzi buke kuruta abandi. Iyi ndorerwamo y'uwuhahaza n'uwuhahazwa irasubirwamwo mu bisata vyinshi harimwo igitsina, ubwoko, mbere n'imigenderanire hagati y'abantu n'ibidukikije.
