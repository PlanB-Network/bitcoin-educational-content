question: "Ce figuri emblematice sunt asociate cu libertatea economică maximă pe diagrama Nolan?"
answer: "Margaret Thatcher, Ronald Reagan și Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures și Bernie Sanders"
  - "Nelson Mandela, Simone Veil și Noam Chomsky"
  - "Vladimir Putin, Xi Jinping și Joseph de Maistre"
explanation: >-
  Thatcher, Reagan și Milei sunt citați ca figuri emblematice ale libertății economice maxime, favorizând mai puțină intervenție a statului, mai puține reglementări și taxe mai mici. Roosevelt, Jaures și Sanders reprezintă capătul opus, care favorizează controlul statului asupra economiei. Mandela, Veil și Chomsky reprezintă libertatea personală maximă. Putin, Xi Jinping și de Maistre reprezintă controlul maxim al statului asupra vieții personale.
reviewed: false
