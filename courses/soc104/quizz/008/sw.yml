question: "Ni mvutano gani wa ndani uliopo miongoni mwa walibertaria kwenye mchoro wa Nolan?"
answer: "Baadhi wanataka kufuta dola kabisa (anarcho-capitalists) huku wengine wakipendelea dola ndogo inayobakiza kazi kuu za kimamlaka (minarchists)"
wrong_answers:
  - "Baadhi wanataka udhibiti mkubwa wa kiuchumi huku wengine wakipendelea kuondolewa kabisa kwa udhibiti katika viwanda vyote"
  - "Baadhi wanaunga mkono uchaguzi wa kidemokrasia huku wengine wakipendelea mfumo wa urithi wa utawala"
  - "Baadhi wanatetea sera za kijamii za kimaendeleo huku wengine wakitetea maadili madhubuti ya kimapokeo"
explanation: >-
  Ndani ya familia ya walibertaria, kuna kutoelewana kwa msingi kuhusu nafasi ya dola. Anarcho-capitalists wanataka kubadilisha kazi zote za dola kwa huduma binafsi, huku minarchists wakikubali dola ndogo inayobakiza kazi kuu za kimamlaka kama ulinzi na mahakama. Makundi yote mawili hushiriki kilele cha ulibertaria lakini hutofautiana kuhusu kama dola yoyote inapaswa kuwepo kabisa.
reviewed: false
