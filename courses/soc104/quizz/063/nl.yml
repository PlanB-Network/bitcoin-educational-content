question: "Hoe zijn alle totalitaire regimes aan de macht gekomen?"
answer: "Door een gewelddadige revolutie die rechtvaardigde dat er met het vorige systeem schoon schip werd gemaakt"
wrong_answers:
  - "Door geleidelijke wetgevende hervorming binnen bestaande democratische instellingen"
  - "Door militaire staatsgrepen georganiseerd door buitenlandse machten die regionale controle zochten"
  - "Door vreedzame massabewegingen die volksverkiezingen met ruime marges wonnen"
explanation: >-
  Alle totalitaire regimes zijn via gewelddadige revolutie aan de macht gekomen. Deze revolutie dient een dubbel doel: ze vernietigt fysiek de oude orde en rechtvaardigt ideologisch het gebruik van geweld als noodzakelijk voor de opbouw van de nieuwe samenleving. Dit onderscheidt totalitaire machtsovernames van democratische transities, door het buitenland gesteunde staatsgrepen of vreedzame verkiezingsoverwinningen.
reviewed: false
