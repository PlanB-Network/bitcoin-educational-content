question: Эффекты Simplicity коммутативны и идемпотентны, но не унитарны. Какое преобразование оптимизатора из-за этого в общем случае должно быть запрещено?
answer: Замена, казалось бы, мёртвого выражения на unit — Failure не унитарен, поэтому за ним может скрываться неудачная проверка, которая должна привести к отмене.
wrong_answers:
  - Перестановка двух независимых подвыражений, поскольку sig-all-hash может наблюдать иное состояние окружения.
  - Слияние двух идентичных вызовов verify, поскольку продублированный Failure сработал бы дважды и привёл к неверной отмене.
  - Изменение порядка выражений, которые могут выбросить исключение, поскольку распространяемое исключение зависит от того, какая сторона выполняется первой.
explanation: >-
  Поскольку эффекты Simplicity гарантированно коммутативны и
  идемпотентны, перестановка независимых подвыражений, а также
  дублирование или слияние идентичных подвыражений всегда безопасны;
  окружение Reader фиксировано, а типизированное как unit исключение
  Failure одинаково независимо от того, какая сторона выбрасывает его
  первой и сколько раз. Однако преобразование-отбрасывание
  `f ⨾ unit = unit` требует унитарности, которой у Failure нет: если
  `f` содержит `bip0340-verify` для недействительной подписи,
  устранение «мёртвого» кода оптимизировало бы отмену и позволило бы
  пройти проверку транзакции, которая должна была провалиться.
reviewed: false
