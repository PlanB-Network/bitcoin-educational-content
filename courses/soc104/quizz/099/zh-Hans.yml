question: "加密朋克原则“Cypherpunks write code”揭示了该运动实现自由的方法是什么？"
answer: "通向自由的道路要经过主动用代码构建匿名系统，把代码作为将抽象自由理念转化为现实的根本工具"
wrong_answers:
  - "加密朋克主要是软件开发者，他们编写商业应用来资助自己的政治活动"
  - "该运动相信通过书面宣言和学术出版物教育公众，而不是采取直接行动"
  - "加密朋克专注于入侵现有政府系统，以揭露监控计划并迫使立法改革"
explanation: >-
  “Cypherpunks write code”这一公式反映了该运动对主动介入的承诺，而不是仅仅寄望于希望。对 Eric Hughes 而言，通向自由的道路经过主动构建匿名系统，使任意政治划分变得无关紧要。代码成为把抽象自由理念转化为现实的根本工具，这也正是 Satoshi Nakamoto 甚至在写白皮书之前就先写完整个 Bitcoin 代码的原因。
reviewed: false
