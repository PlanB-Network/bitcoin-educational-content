question: "¿Qué figuras emblemáticas están asociadas con la máxima libertad económica en el diagrama de Nolan?"
answer: "Margaret Thatcher, Ronald Reagan y Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures y Bernie Sanders"
  - "Nelson Mandela, Simone Veil y Noam Chomsky"
  - "Vladimir Putin, Xi Jinping y Joseph de Maistre"
explanation: >-
  Thatcher, Reagan y Milei se citan como figuras emblemáticas de la máxima libertad económica, favorables a menos intervención estatal, menos regulaciones e impuestos más bajos. Roosevelt, Jaures y Sanders representan el extremo opuesto, favorable al control estatal de la economía. Mandela, Veil y Chomsky representan la máxima libertad personal. Putin, Xi Jinping y de Maistre representan el máximo control estatal de la vida personal.
reviewed: false
