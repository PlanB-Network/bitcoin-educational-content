question: "¿Cuál es la definición de estatismo tal como se presenta en el marco de Nolan?"
answer: "Usar la legislación para controlar y moldear la sociedad, ya sea en nombre de la defensa de la civilización, de la clase trabajadora, de la naturaleza o de los oprimidos"
wrong_answers:
  - "Un sistema de gobierno en el que los funcionarios electos cumplen mandatos fijos y el poder cambia mediante elecciones democráticas"
  - "La creencia de que solo un ejército fuerte puede proteger la soberanía y la integridad territorial de una nación"
  - "Una filosofía económica que prioriza las industrias nacionales frente a la competencia extranjera mediante aranceles y cuotas"
explanation: >-
  El estatismo se define como el uso de la legislación para controlar y moldear la sociedad. Tanto la izquierda como la derecha lo practican: algunos en nombre de la defensa de la civilización, otros en nombre de la defensa de la clase trabajadora, la naturaleza o los oprimidos. Incluso los centristas lo aprueban cuando les conviene. El estatismo no se limita a la política militar, al proteccionismo comercial ni al simple hecho de tener gobiernos electos.
