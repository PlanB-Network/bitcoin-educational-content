question: Breez Liquid SDKのトランザクション機能には、フル機能のLightning Networkノードとは異なるどのような根本的な制約がありますか？
answer: Liquidだけを拠点として動作するため、LightningからLightningへの直接のトランザクションや、BitcoinからBitcoinへのトランザクションは行えない
wrong_answers:
  - クロスチェーンのスマートコントラクトに対応していないため、異なるブロックチェーン・ネットワーク間のアトミックスワップを扱えない
  - "Liquid Networkに組み込まれたトランザクションサイズの制限により、0.1 BTCを超えるトランザクションは処理できない"
  - 中央集権的なBreezのサーバーと常に同期する必要があるため、インターネットに接続していないと動作しない
explanation: |
  このSDKは、Liquidを「拠点」として動作する「あくまでLiquid中心のツール」と明確に説明されています。対応している操作は、LiquidからLiquid、LiquidからLightning、LiquidからBitcoinの3つだけです。Lightningチャネル間で支払いをルーティングできるフル機能のLightningノードとは異なり、Breez SDKはLightningからLightningへの直接のトランザクションを行えないため、従来のLightningのインフラとは根本的に異なります。