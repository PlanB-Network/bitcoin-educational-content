question: "Che cosa include la categoria della libertà personale?"
answer: "Ciò che fai nelle tue relazioni private, con le tue opinioni, credenze e tutto ciò che riguarda il tuo corpo e la tua mente"
wrong_answers:
  - "Ciò che fai come produttore, incluso avviare un'attività, assumere dipendenti e scambiare beni"
  - "Quante tasse paghi, quali investimenti fai e come gestisci i tuoi asset finanziari"
  - "La tua capacità di competere nel mercato, fissare i prezzi dei tuoi prodotti e scegliere i tuoi fornitori"
explanation: >-
  La libertà personale comprende ciò che fai nelle tue relazioni private, con le tue opinioni e credenze, e tutto ciò che riguarda il tuo corpo e la tua mente. Questo include il matrimonio, le scelte di lettura, le pratiche religiose, le scelte alimentari e mediche, e le persone con cui ti associ. Le attività commerciali, le tasse e le decisioni di mercato rientrano nella libertà economica.
