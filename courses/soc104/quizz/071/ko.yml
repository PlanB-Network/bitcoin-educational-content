question: "왜 리버테리언들은 조세에 반대하나요?"
answer: "조세는 재산권에 대한 도덕적 침해이며, 동의 없이 타인의 재산을 빼앗는 국가 절도의 한 형태이기 때문입니다"
wrong_answers:
  - "세금은 경제적으로 비효율적이며 항상 더 높은 실업률로 이어지기 때문입니다"
  - "조세는 외국인 투자를 위축시키고 한 나라의 경쟁력을 약화시키기 때문입니다"
  - "누진세 제도는 가장 많은 일자리를 만드는 부유한 개인들을 부당하게 표적으로 삼기 때문입니다"
explanation: >-
  조세에 대한 리버테리언의 반대는 경제적이기 이전에 도덕적입니다. 리버테리언들은 조세를 국가 절도의 한 형태이자 사유 재산에 대한 장애물로 봅니다. 그것은 동의 없이 타인의 재산을 빼앗는 일이기 때문입니다. 조세에 반대하는 경제적 논거가 있을 수는 있지만, 리버테리언의 기초적 논거는 조세가 효율성이나 경쟁력 계산이 아니라 재산권을 침해한다는 원칙 위에 서 있습니다.
