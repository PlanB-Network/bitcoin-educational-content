question: Ktorý z týchto autorov nezasadal počas revolúcie v zhromaždení?
answer: Markíz de Mirabeau
wrong_answers:
  - Dupont de Nemours
  - Louis-Paul Abeille
  - Condorcet
explanation: |
  Markíz de Mirabeau zomrel 13. júla 1789, deň pred dobytím Bastily, a v zhromaždení nikdy nezasadal. Dupont de Nemours, Abeille a Condorcet sa všetci aktívne zúčastnili na revolučných zhromaždeniach.
