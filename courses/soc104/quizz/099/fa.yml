question: "پیام اصلی مانیفست Cypherpunk سال 1993 نوشته Eric Hughes درباره حریم خصوصی چیست؟"
answer: "حریم خصوصی در عصر الکترونیک برای جامعه‌ای باز ضروری است، و افراد باید آن را خودشان بسازند نه اینکه انتظار داشته باشند دولت‌ها یا شرکت‌ها آن را تضمین کنند"
wrong_answers:
  - "حریم خصوصی تجملی است که باید در برابر امنیت ملی و حفاظت از نهادهای دموکراتیک قربانی شود"
  - "حریم خصوصی باید با معاهدات بین‌المللی تنظیم شود که استانداردهای یکنواخت حفاظت از داده را در همه کشورها برقرار می‌کنند"
  - "حریم خصوصی فقط برای مجرمان و مخالفان اهمیت دارد، در حالی که شهروندان قانون‌مدار از نظام‌های نظارتی شفاف سود می‌برند"
explanation: >-
  مانیفست سال 1993 Eric Hughes می‌گوید حریم خصوصی در عصر الکترونیک برای جامعه‌ای باز ضروری است و نمی‌توان انتظار داشت دولت‌ها، شرکت‌ها، یا دیگر سازمان‌های بزرگ آن را تضمین کنند. انگیزه بنیادی این است که محرمانگی عنصری کلیدی از آزادی است و باید توسط خود افراد ساخته شود، نه اینکه همچون هدیه‌ای از سوی نهادها انتظارش را بکشند.
reviewed: false
