question: "Was umfasst die Kategorie persönliche Freiheit?"
answer: "Was du in deinen privaten Beziehungen tust, mit deinen Meinungen, Überzeugungen und allem, was deinen eigenen Körper und Geist betrifft"
wrong_answers:
  - "Was du als Produzent tust, einschließlich der Gründung eines Unternehmens, der Einstellung von Mitarbeitern und des Handels mit Waren"
  - "Wie viel Steuern du zahlst, welche Investitionen du tätigst und wie du deine finanziellen Vermögenswerte verwaltest"
  - "Deine Fähigkeit, auf dem Markt zu konkurrieren, Preise für deine Produkte festzulegen und deine Lieferanten zu wählen"
explanation: >-
  Persönliche Freiheit umfasst, was du in deinen privaten Beziehungen tust, mit deinen Meinungen und Überzeugungen und allem, was deinen eigenen Körper und Geist betrifft. Dazu gehören Ehe, Leseentscheidungen, religiöse Praktiken, Entscheidungen über Nahrung und Medizin sowie die Frage, mit wem du dich verbindest. Geschäftliche Aktivitäten, Steuern und Marktentscheidungen fallen unter wirtschaftliche Freiheit.
reviewed: false
