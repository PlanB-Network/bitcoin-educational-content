question: "Prečo Rothbard kritizoval víziu ľudskej prirodzenosti u libertaires a akú alternatívu navrhol?"
answer: "Obvinil ich z naivného pohľadu 'ušľachtilého divocha' a tvrdil, že spoločnosť musí používať súkromné vlastníctvo a dobré stimuly na usmerňovanie správania vedeného vlastným záujmom"
wrong_answers:
  - "Pochválil ich chápanie ľudskej spolupráce, ale tvrdil, že minimálny štát je stále potrebný na vynucovanie zmlúv"
  - "Súhlasil, že ľudia sú prirodzene dobrí, ale trval na tom, že iba slobodné trhy dokážu nasmerovať túto dobrotu do produktívnej činnosti"
  - "Odmietol ich dôraz na individuálne práva a namiesto toho tvrdil, že morálne normy by mali kolektívne definovať komunity"
explanation: >-
  Rothbard kritizoval libertaires za prijatie naivnej, Rousseauovskej vízie ľudskej prirodzenosti ako prirodzene dobrej. Namiesto toho tvrdil, že ľudí vedie vlastný záujem a spoločnosť musí byť organizovaná tak, aby dobré stimuly usmerňovali správanie. To si vyžaduje uznanie a garantovanie súkromného vlastníctva. Zrušiť štát neznamená zrušiť jeho funkcie; polícia a spravodlivosť by mali byť spravované slobodným trhom prostredníctvom konkurencie.
