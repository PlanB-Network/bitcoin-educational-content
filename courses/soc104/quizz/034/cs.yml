question: "Proč Rothbard kritizoval vizi lidské přirozenosti u libertaires a jakou alternativu navrhl?"
answer: "Obviňoval je, že zastávají naivní představu „ušlechtilého divocha“, a tvrdil, že společnost musí využívat soukromé vlastnictví a dobré pobídky k vedení chování založeného na vlastním zájmu"
wrong_answers:
  - "Chválil jejich pochopení lidské spolupráce, ale tvrdil, že minimální stát je stále nezbytný k vymáhání smluv"
  - "Souhlasil, že lidé jsou přirozeně dobří, ale trval na tom, že pouze volné trhy mohou tuto dobrotu nasměrovat k produktivní činnosti"
  - "Odmítl jejich důraz na individuální práva a místo toho tvrdil, že morální standardy by měly kolektivně vymezovat komunity"
explanation: >-
  Rothbard kritizoval libertaires za přijetí naivní, Rousseauovi podobné vize lidské přirozenosti jako přirozeně dobré. Tvrdil naopak, že lidé jsou vedeni vlastním zájmem a společnost musí být uspořádána tak, aby dobré pobídky vedly chování. To vyžaduje uznání a zaručení soukromého vlastnictví. Zrušení státu neznamená zrušení jeho funkcí; policie a justice by měly být spravovány volným trhem prostřednictvím konkurence.
