question: "Wie definiert der strukturelle Ansatz den grundlegenden Unterschied zwischen Sozialismus und Libertarismus?"
answer: "Sozialismus gibt dem Staat durch Regulierung, Planung und Kontrolle Vorrang, während Libertarismus dem Individuum durch minimale staatliche Intervention Vorrang gibt"
wrong_answers:
  - "Sozialismus priorisiert ländliche Agrargemeinschaften, während Libertarismus städtische industrielle Entwicklung bevorzugt"
  - "Sozialismus wird durch seine Unterstützung demokratischer Wahlen definiert, während Libertarismus alle Formen politischer Beteiligung ablehnt"
  - "Sozialismus konzentriert sich auf Außenpolitik und internationale Zusammenarbeit, während Libertarismus nur mit innenpolitischen Wirtschaftsfragen befasst ist"
explanation: >-
  Strukturell ist Sozialismus durch die Allgegenwart des Staates gekennzeichnet, der reguliert, plant und kontrolliert. Libertarismus wird durch minimale staatliche Intervention in Wirtschaft und Privatleben definiert und tendiert zum Vorrang individueller Freiheit und des freien Marktes. Diese strukturelle Unterscheidung ist analytisch weitaus nützlicher als der Vergleich der erklärten Absichten jedes Systems.
