question: "次のうち、Hayek が説明する自生的秩序の例はどれか？"
answer: "言語。事務局の知識人によって設計されたのではなく、歴史的相互作用を通じて有機的に発展したもの"
wrong_answers:
  - "社会的規則を確立するために選出された代表者によって慎重に起草された国家憲法"
  - "経済活動を調整するために経済学者によって設計された政府の景気刺激策"
  - "知識への普遍的アクセスを保証するために立法者によって作られた公教育制度"
explanation: >-
  Hayek は自生的秩序を、社会における自由な相互作用の産物であり、人間の行為から生じるが、人間の意図的設計からは生じないものとして説明する。言語はその代表例である。フランス語、英語、ドイツ語は、知識人が文法規則を決めて構築したものではなく、歴史的相互作用を通じて築かれた、ゆっくりとした有機的組織化の果実として生じた。
reviewed: false
