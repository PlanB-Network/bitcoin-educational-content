question: "W rombie Nolana, która pozycja znajduje się na górze i reprezentuje maksymalną wolność?"
answer: "Libertarianizm, popierający największą wolność gospodarczą i osobistą"
wrong_answers:
  - "Konserwatyzm, popierający tradycyjne wartości i wolność gospodarczą"
  - "Centryzm, równoważący wszystkie stanowiska polityczne w pragmatyczny sposób"
  - "Socjalizm, popierający wolność osobistą i równość społeczną"
explanation: >-
  Libertarianizm zajmuje szczyt rombu Nolana jako przeciwieństwo etatyzmu. Reprezentuje tych, którzy popierają największy stopień zarówno wolności gospodarczej, jak i osobistej. Konserwatyzm znajduje się po prawej (wysoka wolność gospodarcza, niska wolność osobista), socjalizm po lewej (wysoka wolność osobista, niska wolność gospodarcza), a centryzm w środku.
reviewed: false
