question: "ノーランの枠組みで示される国家統制主義の定義は何か？"
answer: "文明、労働者階級、自然、または抑圧された人々の防衛という名目であれ、立法を用いて社会を統制し形作ること"
wrong_answers:
  - "選挙で選ばれた公職者が任期を務め、民主的選挙を通じて権力が移行する統治制度"
  - "強い軍隊だけが国家の主権と領土保全を守れるという信念"
  - "関税や割当を通じて、外国との競争よりも国内産業を優先する経済哲学"
explanation: >-
  国家統制主義は、立法を用いて社会を統制し形作ることと定義される。
  左派も右派もそれを実践する。
  ある者は文明の防衛の名のもとに、別の者は労働者階級、自然、または抑圧された人々の防衛の名のもとにそうする。
  中道派でさえ、自分たちに都合がよいときにはそれを承認する。
  国家統制主義は、軍事政策、貿易保護主義、または単に選挙で選ばれた政府を持つことに限定されない。
reviewed: false
