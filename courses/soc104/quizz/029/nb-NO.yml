question: "Hvilket felles grunnlag deler libertarianere og konservative, og hva skiller dem?"
answer: "De deler tilknytning til begrenset stat og avvisning av tvungen egalitarisme, men er uenige om militær intervensjonisme og sosialpolitikk"
wrong_answers:
  - "De deler støtte til proteksjonistisk handelspolitikk og nasjonalt forsvar, men er uenige om religionens rolle i offentlig liv"
  - "De deler en forpliktelse til progressiv beskatning og velferdsprogrammer, men er uenige om innvandringspolitikk"
  - "De deler motstand mot frihandel og legalisering av narkotika, men er uenige om størrelsen på den føderale staten"
explanation: >-
  Libertarianere og konservative forsvarer begge begrenset stat, avviser tvungen egalitarisme, motsetter seg offentlig gjeld og forsvarer delstatenes rettigheter. Libertarianere avviser imidlertid neokonservatives militære intervensjonisme, motsetter seg konservativ sosialpolitikk og subsidier, fordømmer narkotikaforbud og avviser proteksjonisme. Alliansen er reell, men iboende anstrengt.
reviewed: false
