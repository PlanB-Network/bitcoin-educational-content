question: "چه اصل راهنمایی رأی‌های فردریک باستیا را در مجلس ملی هدایت می‌کرد؟"
answer: "ترویج آزادی‌های فردی و اقتصادی و کاهش مداخلهٔ دولت"
wrong_answers:
  - "دفاع از اقتدار سلطنتی و حفظ سنت‌های پادشاهی"
  - "پیشبرد سیاست‌های سوسیالیستی برای بازتوزیع برابرتر ثروت"
  - "راهبردی میانه‌روانه برای سازش میان جناح‌های چپ و راست"
explanation: >-
  باستیا بر پایهٔ یک اصل بنیادین رأی می‌داد: ترویج آزادی‌های فردی و اقتصادی همراه با کاهش مداخلهٔ دولت. او نه یک فرصت‌طلب میانه‌رو بود، نه سلطنت‌طلب یا سوسیالیست. او با هر طرفی رأی می‌داد که اقداماتی همسو با آزادی و دولت محدود پیشنهاد می‌کرد.
reviewed: false
