question: "例外は一般に可換ではないのに、Simplicity では Failure エフェクトが可換なのはなぜですか？"
answer: 例外の型が unit（1）で値が1つしかないため、throw する順序が問題にならないからです。
wrong_answers:
  - Simplicity は、コンビネータツリーによって定義された決定的な順序で全式を実行するから。
  - Failure エフェクトは常に case コンビネータによって捕捉され、その後再 throw されるから。
  - Simplicity はバッチ検証を使うため、throw されたすべての例外が等価になるから。
explanation: >-
  一般に、例外は可換ではありません。なぜなら、異なる式が異なる
  例外値を throw する可能性があるからです。しかし、Simplicity は例外を unit 型（可能な値が1つだけ）に制限しているため、
  失敗する可能性のある2つの式の順序を入れ替えても、実際にどちらが失敗したかに関係なく同じ例外になります。
  この可換性の性質は、重要なプログラム最適化を可能にします。
reviewed: true
