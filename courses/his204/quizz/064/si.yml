question: විප්ලවය අතරතුර, මෙම කතුවරුන්ගෙන් සභාවේ නොසිටියේ කවුද?
answer: Marquis de Mirabeau
wrong_answers:
  - Dupont de Nemours
  - Louis-Paul Abeille
  - Condorcet
explanation: |
  Marquis de Mirabeau Bastilleට කඩා වැදීමට පෙර දින, 1789 ජූලි 13 වන දින මිය ගිය අතර, සභාවේ කිසිවිටෙක නොසිටියේය. Dupont de Nemours, Abeille, සහ Condorcet සියල්ලෝම විප්ලවකාරී සභාවල සක්‍රීයව සහභාගී වූහ.
