question: "ノーラン・チャート上のリバタリアンの間には、どのような内部的緊張がありますか？"
answer: "国家を完全に廃止したい人々（アナルコ・キャピタリスト）もいれば、中核的な主権機能を残す最小国家を好む人々（ミナーキスト）もいる"
wrong_answers:
  - "強力な経済規制を望む人々もいれば、すべての産業の完全な規制緩和を好む人々もいる"
  - "民主的選挙を支持する人々もいれば、世襲制の統治を好む人々もいる"
  - "進歩的な社会政策を主張する人々もいれば、厳格に伝統的な道徳的価値観を擁護する人々もいる"
explanation: >-
  リバタリアンの系譜の内部には、国家の役割をめぐる根本的な不一致があります。アナルコ・キャピタリストはすべての国家機能を民間サービスで置き換えたいと考える一方、ミナーキストは防衛や裁判所のような中核的な主権機能を保持する最小国家を受け入れます。両集団はリバタリアンの頂点を共有しますが、そもそも国家が少しでも存在すべきかどうかで異なります。
reviewed: false
