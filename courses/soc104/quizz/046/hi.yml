question: "Conservatism economic और societal spheres में freedoms के साथ कैसा व्यवहार करता है?"
answer: "Economic sphere में strong freedoms लेकिन societal sphere में weak freedoms"
wrong_answers:
  - "Traditional social order बनाए रखने के लिए economic और societal दोनों spheres में weak freedoms"
  - "Societal sphere में strong freedoms लेकिन economic sphere में weak freedoms"
  - "दोनों spheres में बराबर और unlimited freedoms, किसी भी तरह के minimal government intervention के साथ"
explanation: >-
  Conservatism एक dichotomy दिखाता है जो socialism की mirror image है। Economic domain में, conservatives free market, entrepreneurship और private property का बचाव करते हैं। Societal domain में, restrictions को traditional moral norms और social stability की preservation द्वारा justify किया जाता है। तीसरा गलत answer socialist pattern का वर्णन करता है, जो इसका opposite है।
reviewed: false
