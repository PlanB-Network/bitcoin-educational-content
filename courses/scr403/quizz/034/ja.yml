question: 全加算器は、2 つの半加算器のキャリービットについて XOR ではなく OR を取ります。なぜ OR が正しいのでしょうか？
answer: 任意の入力に対してキャリーを出せる半加算器は高々 1 つなので、OR は 2 つの相互排他的なケースを正確にまとめます。
wrong_answers:
  - 2 つのキャリービットは加算されなければならず、Simplicity では OR が単一ビットの二進加算の方法である。
  - 分岐の後では、OR だけが環境にまだ型が合うブール演算子である。
  - OR はキャリーを過大近似する。余分なキャリーがあっても、その後の最終射影で捨てられる。
explanation: >-
  最初の半加算器がキャリーを出すなら、その 2 つの入力ビットはどちらも 1 だったため、
  その和ビットは 0 になります。そして 0 を入力された半加算器がキャリーを出すことはありません。
  したがって 2 つのキャリービットが同時に 1 になることはなく、OR はそれらを正確に
  まとめます（到達可能な入力上では XOR と一致さえします）。この相互排他性こそが、
  2 つの半加算器による全加算器の分解を正しくしている理由です。
reviewed: false
