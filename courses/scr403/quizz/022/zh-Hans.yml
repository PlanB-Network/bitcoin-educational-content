question: "为什么 Simplicity 中的 Failure 效应是可交换的，尽管异常通常并不可交换？"
answer: 因为异常类型是单位类型 (1)，只有一个值，所以抛出顺序无关紧要。
wrong_answers:
  - 因为 Simplicity 按组合子树定义的确定性顺序执行所有表达式。
  - 因为 Failure 效应总是被 case 组合子捕获，然后重新抛出。
  - 因为 Simplicity 使用批量验证，这使得所有抛出的异常都等价。
explanation: >-
  一般来说，异常不可交换，因为不同表达式可能抛出不同的
  异常值。然而，Simplicity 将异常限制为单位类型（只有一个可能值），
  因此交换两个可能失败的表达式的顺序，无论实际失败的是哪一个，
  都会产生相同的异常。这种可交换性支持重要的程序优化。
reviewed: true
