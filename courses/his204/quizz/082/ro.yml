question: Corvoada, munca forțată neplătită folosită pentru construirea drumurilor, a fost în centrul reformelor sale. Cu ce a înlocuit-o?
answer: Cu o taxă în bani
wrong_answers:
  - Cu o taxă în natură (produse agricole)
  - Nu a înlocuit-o cu nimic
  - Printr-un sistem voluntar
explanation: |
  Turgot a înlocuit corvoada, munca forțată neplătită, cu o taxă în bani, distribuind astfel povara construcției drumurilor și eliberând țăranii de această obligație.
