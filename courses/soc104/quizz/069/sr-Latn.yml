question: "Kroz pet društvenih rasprava (brak, imigracija, vatreno oružje, droge, zaslađena pića), koji ponavljajući analitički okvir oblikuje socijalističku poziciju o svakom pitanju?"
answer: "Okvir sukoba između dominantnih i potčinjenih, u kojem je društvo strukturirano ugnjetavanjem, a država mora intervenisati da zaštiti ranjivu grupu"
wrong_answers:
  - "Utilitaristički okvir usmeren na maksimizovanje opšte sreće i ekonomske produktivnosti za najveći broj građana"
  - "Okvir prirodnih prava u kojem individualne slobode moraju biti zaštićene i od državnog i od korporativnog mešanja"
  - "Tradicionalistički okvir u kojem se uspostavljene društvene institucije moraju očuvati od remetilačkih modernih promena"
explanation: >-
  Socijalističku poziciju kroz društvene rasprave dosledno oblikuje okvir sukoba dominantnih i potčinjenih. Kod braka, to je heteroseksualna većina koja ugnjetava homoseksualnu manjinu. Kod imigracije, ograničenja zasnovana na nacionalnosti jesu oblici ugnjetavanja. Kod vatrenog oružja, samo država treba da drži silu kako bi zaštitila ranjive. Kod zaslađenih pića, industrijalci profitiraju od ranjivosti najmanje zaštićenih. Ova prizma ugnjetača/ugnjetenog reprodukuje se u brojnim domenima, uključujući rod, rasu, pa čak i odnos između čovečanstva i prirode.
reviewed: false
