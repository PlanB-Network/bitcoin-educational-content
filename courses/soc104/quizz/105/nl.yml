question: "Hoe betoogt de cursus dat vrijheid zowel linkse als rechtse waarden vreedzaam naast elkaar kan laten bestaan?"
answer: "In een regime van echte vrijheid kunnen mensen met linkse idealen vrijwillig bezittingen delen en middelen herverdelen, terwijl mensen met rechtse waarden kunnen sparen en tradities kunnen doorgeven, zonder dat een van beide kanten haar manier van leven aan de andere oplegt"
wrong_answers:
  - "Vrijheid vereist dat beide kanten compromissen sluiten door een centristische positie te aanvaarden waarin de overheid concurrerende waarden via gematigde regulering in balans brengt"
  - "Vrijheid betekent dat linkse en rechtse gemeenschappen in gescheiden geografische gebieden moeten leven met hun eigen onafhankelijke overheden"
  - "Vrijheid werkt door burgers te laten stemmen over welke waarden in elke regio moeten worden afgedwongen, waarbij links en rechts beleid bij elke verkiezingscyclus afwisselen"
explanation: >-
  De cursus laat zien dat in een werkelijk regime van vrijheid degenen die linkse idealen aanhangen vrijwillig afstand kunnen doen van bezittingen, productiemiddelen kunnen delen of lonen kunnen doneren aan herverdelende organisaties. Mensen met rechtse waarden kunnen hard werken, sparen en familiewaarden doorgeven. Niemand zou zijn manier van leven aan anderen moeten opleggen. Door de vrijheid van de markt en de kracht van keuze kunnen doelen vreedzaam worden bereikt.
reviewed: false
