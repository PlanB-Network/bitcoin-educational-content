question: În 1774, fiziocrații s-au bucurat de un mare succes în urma cărui eveniment?
answer: Sosirea lui Turgot la Minister
wrong_answers:
  - Sosirea lui Dupont de Nemours în Adunare
  - Sosirea lui Dupont de Nemours la Minister
  - Sosirea lui Turgot în Adunare
explanation: |
  Sosirea lui Turgot la minister în 1774 a marcat un succes pentru fiziocrați, deoarece acesta era un susținător fervent al ideilor lor și a pus în aplicare o parte din recomandările acestora.
