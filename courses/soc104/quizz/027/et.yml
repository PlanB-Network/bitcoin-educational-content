question: "Millist ühisosa jagavad libertaarlased ja konservatiivid ning mis neid lahutab?"
answer: "Nad jagavad piiratud valitsuse pooldamist ja pealesunnitud egalitarismi tagasilükkamist, kuid ei nõustu sõjalise interventsionismi ja sotsiaalpoliitika küsimustes"
wrong_answers:
  - "Nad jagavad toetust protektsionistlikule kaubanduspoliitikale ja riigikaitsele, kuid ei nõustu religiooni rolli küsimuses avalikus elus"
  - "Nad jagavad pühendumust progressiivsele maksustamisele ja hoolekandeprogrammidele, kuid ei nõustu immigratsioonipoliitika küsimuses"
  - "Nad jagavad vastuseisu vabakaubandusele ja uimastite legaliseerimisele, kuid ei nõustu föderaalvalitsuse suuruse küsimuses"
explanation: >-
  Libertaarlased ja konservatiivid kaitsevad mõlemad piiratud valitsust, lükkavad tagasi pealesunnitud egalitarismi, vastustavad riigivõlga ja kaitsevad osariikide õigusi. Libertaarlased lükkavad aga tagasi neokonservatiivide sõjalise interventsionismi, vastustavad konservatiivseid sotsiaalpoliitikaid ja toetusi, mõistavad hukka uimastikeelu ning hülgavad protektsionismi. Liit on tegelik, kuid olemuslikult pingeline.
