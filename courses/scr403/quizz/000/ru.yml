question: Почему Simplicity исключает динамическое выделение памяти во время выполнения?
answer: Чтобы обеспечить статический анализ и исключить целые классы ошибок и атак.
wrong_answers:
  - Потому что сеть Liquid Network не поддерживает низкоуровневые операции с памятью.
  - Чтобы снизить порог вхождения в программирование для новых разработчиков смарт-контрактов.
  - Потому что сам Bitcoin Script тоже не имеет динамического выделения памяти.
explanation: >-
  Simplicity избегает динамического выделения памяти, чтобы всё использование
  ресурсов можно было определить статически до начала выполнения. Это
  обеспечивает предсказуемые границы использования ресурсов и устраняет
  уязвимости, связанные с управлением памятью, что критически важно в
  контексте валидации блокчейна.
