question: نقش جت‌ها در Simplicity چیست؟
answer: جت‌ها پیاده‌سازی‌های بومی هستند که عبارت‌های مشخص Simplicity را برای سرعت جایگزین می‌کنند.
wrong_answers:
  - جت‌ها یک گام کامپایل هستند که Simplicity را به Bitcoin Script تبدیل می‌کند.
  - جت‌ها پیام‌های شبکه هستند که برنامه‌های Simplicity را به همه نودها پخش می‌کنند.
  - جت‌ها ابزارهای اشکال‌زدایی برای آزمایش و ردگیری عبارت‌های Simplicity هستند.
explanation: >-
  یک جت پیاده‌سازی بومی‌ای است که شبکه توافق می‌کند آن را جایگزین یک عبارت
  خاص Simplicity کند (که با ریشه Merkle آن شناسایی می‌شود). عبارت Simplicity
  به‌عنوان مشخصات صوریِ چیزی عمل می‌کند که جت محاسبه می‌کند، در حالی که کد
  بومی سرعت اجرای عملی را فراهم می‌کند. جت‌های رایج عملیات حسابی و رمزنگاری
  مانند SHA-256 را مدیریت می‌کنند.
reviewed: false
