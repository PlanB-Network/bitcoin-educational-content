question: "¿Qué quiso decir Ludwig von Mises cuando escribió que solo el individuo piensa, razona y actúa?"
answer: "Que colectividades como el Estado o una nación no tienen existencia propia más allá de las acciones de sus miembros individuales"
wrong_answers:
  - "Que los individuos deben evitar formar grupos o asociaciones porque la acción colectiva siempre es perjudicial"
  - "Que solo ciertos individuos dotados son capaces de pensamiento racional, mientras que la mayoría de las personas sigue el instinto"
  - "Que pensar y razonar son actividades privadas que nunca deben compartirse ni debatirse en público"
explanation: >-
  Mises aclaró que el individualismo se opone a la idea de que entidades sociales como la sociedad o la nación puedan existir independientemente de los individuos que las componen. Una colectividad no tiene existencia propia más allá de las acciones de sus miembros individuales. No podemos hablar con sentido de la acción del Estado o de una empresa porque estas entidades no tienen voluntad ni pensamiento propios y solo actúan a través de individuos.
