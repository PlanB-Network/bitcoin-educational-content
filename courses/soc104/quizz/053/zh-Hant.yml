question: "為什麼美國的古典自由主義者在二十世紀開始稱自己為「libertarians」？"
answer: "因為美國的「liberalism」已被日益增長的國家干預主義與福利國家所挪用"
wrong_answers:
  - "因為他們想與歐洲君主主義傳統保持距離"
  - "因為「liberal」一詞開始與無政府主義和政治暴力相連"
  - "因為新的貿易協定要求自由市場倡議者擁有不同的政治身份"
explanation: >-
  二十世紀期間，隨著 laissez-faire 原則逐步被拋棄，轉向 welfare state，一項根本轉變發生了。美國的「liberalism」開始意味著與古典自由主義非常不同的東西，擁抱國家干預主義。古典自由主義者採用「libertarian」一詞來保存這項區別。這次重新命名與歐洲君主主義、無政府主義暴力或貿易協定無關。
reviewed: false
