question: "Karl Marx đã phân biệt như thế nào giữa chủ nghĩa xã hội không tưởng và chủ nghĩa xã hội khoa học?"
answer: "Ông cáo buộc các nhà xã hội chủ nghĩa Pháp thời kỳ đầu đề xuất các giải pháp tưởng tượng, trong khi chủ nghĩa xã hội khoa học của ông đặt nền trên chủ nghĩa duy vật lịch sử và đấu tranh giai cấp"
wrong_answers:
  - "Ông lập luận rằng chủ nghĩa xã hội không tưởng quá tập trung vào kinh tế, trong khi chủ nghĩa xã hội khoa học ưu tiên chuyển hóa văn hóa và nghệ thuật"
  - "Ông ca ngợi các nhà xã hội chủ nghĩa không tưởng vì các thử nghiệm thực tiễn của họ và phê phán chủ nghĩa xã hội khoa học là quá trừu tượng và lý thuyết"
  - "Ông tuyên bố rằng chủ nghĩa xã hội không tưởng là bạo lực và cách mạng, trong khi chủ nghĩa xã hội khoa học ủng hộ cải cách dân chủ ôn hòa"
explanation: >-
  Marx cáo buộc các nhà xã hội chủ nghĩa Pháp thời kỳ đầu như Proudhon, Saint-Simon và Fourier là những người không tưởng, những người đề xuất các giải pháp hoàn toàn tưởng tượng. Chủ nghĩa xã hội khoa học của ông dựa trên chủ nghĩa duy vật lịch sử: ý tưởng rằng lịch sử tiến triển thông qua đấu tranh giai cấp và sự chiếm hữu các tư liệu sản xuất, trong đó mọi biểu hiện văn hóa đều bị quy định bởi lực lượng sản xuất và quan hệ sản xuất.
