question: "Mitkä symboliset hahmot yhdistetään suurimpaan taloudelliseen vapauteen Nolanin kaaviossa?"
answer: "Margaret Thatcher, Ronald Reagan ja Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures ja Bernie Sanders"
  - "Nelson Mandela, Simone Veil ja Noam Chomsky"
  - "Vladimir Putin, Xi Jinping ja Joseph de Maistre"
explanation: >-
  Thatcher, Reagan ja Milei mainitaan suurimman taloudellisen vapauden symbolisina hahmoina, jotka suosivat vähäisempää valtion puuttumista, vähemmän sääntelyä ja alempia veroja. Roosevelt, Jaures ja Sanders edustavat vastakkaista ääripäätä, joka suosii valtion kontrollia taloudessa. Mandela, Veil ja Chomsky edustavat suurinta henkilökohtaista vapautta. Putin, Xi Jinping ja de Maistre edustavat valtion maksimaalista kontrollia henkilökohtaiseen elämään.
