question: "Почему sig-all-hash использует эффект Reader вместо получения данных транзакции как типизированного входа?"
answer: Чтобы джет мог использовать PrecomputedTransactionData и выполняться за константное время на фиксированном окружении.
wrong_answers:
  - Потому что система типов Simplicity в принципе не может представлять данные транзакции как тип.
  - Потому что эффект Reader быстрее, чем передача этих данных через дерево комбинаторов.
  - Потому что данные транзакции слишком велики, чтобы поместиться в систему типов Simplicity с фиксированным размером.
explanation: >-
  Если бы sig-all-hash принимал входной тип TxEnv, программы могли бы
  передавать джету изменённые копии данных транзакции, что мешало бы ему
  использовать предвычисленные хеши. При эффекте Reader джет обращается
  только к фиксированному, неизменяемому окружению транзакции, поэтому
  его реализация может безопасно использовать PrecomputedTransactionData
  и выполняться за константное время на проверку подписи, избегая
  квадратичной проблемы хеширования, которая была характерна для раннего
  Bitcoin Script.
reviewed: true
