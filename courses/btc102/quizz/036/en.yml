question: What is the main purpose of defining a user profile?
answer: Adopt a strategy tailored to your needs
wrong_answers:
  - Maximizing speculation and therefore profits
  - Adopt a generalist strategy that works for everyone
  - Know which Bitcoin influencer to follow on social networks
explanation: |
  Knowing your profile and knowing how to adapt it will enable you to choose acquisition and storage solutions in line with your personal situation.
reviewed: false