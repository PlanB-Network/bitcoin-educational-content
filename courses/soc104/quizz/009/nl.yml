question: "Wat omvat de categorie economische vrijheid?"
answer: "Wat je doet als producent en consument: kopen, verkopen, produceren, werken, mensen aannemen en je geld beheren"
wrong_answers:
  - "Je religieuze overtuigingen, persoonlijke relaties en vrijheid van meningsuiting"
  - "Je stemrecht, deelname aan verkiezingen en lidmaatschap van politieke partijen"
  - "Je vermogen om vrij te reizen, je woonplaats te kiezen en landsgrenzen over te steken"
explanation: >-
  Economische vrijheid omvat wat je doet als producent en consument: wat je kunt kopen, verkopen of produceren; waar je werkt; wie je aanneemt; en wat je met je geld doet. Persoonlijke relaties, religieuze overtuigingen en bewegingsvrijheid vallen onder de categorie persoonlijke vrijheid, niet onder de economische.
