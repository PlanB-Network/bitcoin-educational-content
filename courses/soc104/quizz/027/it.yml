question: "Come ha illustrato Ron Paul la posizione paleo-libertaria su questioni come l'uso di droghe e l'aborto?"
answer: "Consigliava personalmente di evitare l'uso di droghe e si opponeva all'aborto, ma politicamente combatteva contro la proibizione federale e sosteneva che le scelte dovessero essere lasciate agli individui o agli stati"
wrong_answers:
  - "Sosteneva la legalizzazione federale di tutte le droghe e dell'aborto come questione di diritti individuali assoluti"
  - "Faceva campagna per divieti federali rigorosi sia sulle droghe sia sull'aborto sulla base delle sue convinzioni morali personali"
  - "Rifiutava di esprimere qualsiasi opinione personale su questi temi, sostenendo che i politici dovrebbero rimanere moralmente neutrali"
explanation: >-
  Ron Paul esemplifica la sintesi paleo-libertaria separando le convinzioni morali personali dalla coercizione politica. Ha sempre consigliato di evitare l'uso di droghe, ma al tempo stesso si è opposto alla proibizione delle droghe. Era personalmente contrario all'aborto, ma sosteneva che la scelta dovesse essere lasciata agli stati federati invece che imposta dall'alto. Questo dimostra come si possano avere forti valori tradizionali pur rifiutando di usare il potere coercitivo del governo federale per imporli.
reviewed: false
