question: "Quem é frequentemente citado como a figura fundadora do conservadorismo moderno?"
answer: "Edmund Burke, que defendia preservar instituições e tradições contra as mudanças radicais da Revolução Francesa"
wrong_answers:
  - "Karl Marx, que desenvolveu a teoria da luta de classes e do materialismo histórico no século XIX"
  - "John Locke, que articulou a teoria dos direitos naturais e do contrato social no século XVII"
  - "Adam Smith, que escreveu The Wealth of Nations e fundou a disciplina da economia clássica"
explanation: >-
  Edmund Burke é frequentemente citado como a figura fundadora do conservadorismo por sua oposição à Revolução Francesa. Seu Reflections on the Revolution in France (1790) defendeu a prudência e a reforma gradual em vez da mudança radical. Ele acreditava que a sociedade deveria avançar não fazendo uma tábula rasa, mas por meio de reformas incrementais que preservam instituições e tradições testadas.
