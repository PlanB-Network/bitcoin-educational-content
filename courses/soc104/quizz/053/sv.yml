question: "Vad är den centrala skillnaden mellan minarkister och anarkokapitalister inom libertarianismen?"
answer: "Minarkister accepterar en minimal stat för försvar, rättsväsende och polis, medan anarkokapitalister vill privatisera alla statliga funktioner"
wrong_answers:
  - "Minarkister avvisar alla former av statsmakt, medan anarkokapitalister accepterar begränsad statlig reglering av marknader"
  - "Minarkister förespråkar progressiv beskattning för grundläggande tjänster, medan anarkokapitalister motsätter sig all beskattning"
  - "Minarkister fokuserar endast på ekonomisk frihet, medan anarkokapitalister försvarar både ekonomiska och samhälleliga friheter"
explanation: >-
  Minarkister anser att staten bör begränsas till kärnfunktioner som försvar, rättsväsende och polis ("nattväktarstaten"), medan anarkokapitalister hävdar att även dessa funktioner bör privatiseras och hanteras genom frivillig marknadskonkurrens. Deras oenighet handlar mer om praktiskt genomförande än om grundläggande etiska principer. Båda riktningarna delar samma libertarianska värden om självägande och icke-aggression.
reviewed: false
