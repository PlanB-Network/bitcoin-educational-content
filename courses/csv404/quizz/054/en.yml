question: What is the relationship between TAPD and private key management?
answer: TAPD never handles private keys itself; it delegates signing to LND, which relies on Bitcoin Core for chain data
wrong_answers:
  - TAPD independently generates and stores its own private keys, kept separate from both LND and Bitcoin Core entirely
  - TAPD imports private keys directly from Bitcoin Core and uses them for signing all asset transactions
  - TAPD shares a single unified keystore with LND so that both daemons can sign transactions interchangeably
explanation: >-
  TAPD operates on top of the LND and Bitcoin Core stack without ever handling
  private keys directly. All signing operations are delegated to LND, which
  manages its own key material. LND in turn relies on Bitcoin Core for on-chain
  data. This separation of concerns ensures that TAPD does not introduce
  additional key management attack surface.
reviewed: false
