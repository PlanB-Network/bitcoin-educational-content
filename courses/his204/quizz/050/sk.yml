question: Čo Quesnay vyčítal svojim žiakom?
answer: Ich sektársky charakter
wrong_answers:
  - Ich prehnaný liberalizmus
  - Ich zmierlivosť voči moci Ľudovíta XV.
  - Ich nedostatok vedeckej prísnosti
explanation: |
  Quesnay kritizoval svojich nasledovníkov za sektárstvo a nedostatok otvorenosti voči iným myšlienkam. Obával sa, že ich dogmatizmus bude brániť šíreniu fyziokracie.
