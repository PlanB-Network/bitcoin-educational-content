description: |
  "zk" در zkSNACKs مخفف دانش صفر است، به این معنی که ما نمی‌توانیم و نمی‌خواهیم هیچ‌گونه اطلاعات شخصی کاربران را در محصولات خود جمع‌آوری کنیم.

  zkSNACKs هماهنگ‌کنندهٔ coinjoin خود را در ۱ ژوئن ۲۰۲۴ تعطیل کرد و وب‌سایت آن از دسترس خارج است. Wasabi Wallet به‌عنوان نرم‌افزار متن‌باز ادامه دارد.