question: "Как консерватизмът третира свободите в икономическата и обществената сфера?"
answer: "Силни свободи в икономическата сфера, но слаби свободи в обществената сфера"
wrong_answers:
  - "Слаби свободи както в икономическата, така и в обществената сфера, за да се поддържа традиционният социален ред"
  - "Силни свободи в обществената сфера, но слаби свободи в икономическата сфера"
  - "Равни и неограничени свободи и в двете сфери с минимална правителствена намеса от всякакъв вид"
explanation: >-
  Консерватизмът проявява дихотомия, която е огледален образ на социализма. В икономическата област консерваторите защитават свободния пазар, предприемачеството и частната собственост. В обществената област ограниченията се оправдават с опазването на традиционните морални норми и социалната стабилност. Третият грешен отговор описва социалистическия модел, който е противоположният.
