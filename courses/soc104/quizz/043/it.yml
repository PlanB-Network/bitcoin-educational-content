question: "Quale distinzione tracciò Karl Marx tra socialismo utopistico e socialismo scientifico?"
answer: "Accusò i primi socialisti francesi di proporre soluzioni immaginarie, mentre il suo socialismo scientifico era fondato sul materialismo storico e sulla lotta di classe"
wrong_answers:
  - "Sostenne che il socialismo utopistico fosse troppo concentrato sull'economia, mentre il socialismo scientifico dava priorità alla trasformazione culturale e artistica"
  - "Lodò i socialisti utopistici per i loro esperimenti pratici e criticò il socialismo scientifico perché troppo astratto e teorico"
  - "Affermò che il socialismo utopistico fosse violento e rivoluzionario, mentre il socialismo scientifico favoriva la riforma democratica pacifica"
explanation: >-
  Marx accusò i primi socialisti francesi come Proudhon, Saint-Simon e Fourier di essere utopisti che proponevano soluzioni puramente immaginarie. Il suo socialismo scientifico poggiava sul materialismo storico: l'idea che la storia progredisca attraverso la lotta di classe e l'appropriazione dei mezzi di produzione, dove tutte le rappresentazioni culturali sono condizionate dalle forze produttive e dai rapporti di produzione.
