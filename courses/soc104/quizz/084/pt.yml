question: "Qual é o argumento fundamental de Hayek sobre por que o planejamento central fracassa?"
answer: "O conhecimento existe apenas como fragmentos dispersos possuídos por indivíduos distintos e não pode ser concentrado nem integrado por uma autoridade central"
wrong_answers:
  - "Os planejadores centrais são moralmente corruptos e sempre agem em interesse próprio, em vez de agir pelo bem público"
  - "As instituições democráticas são lentas demais para responder a mudanças econômicas, tornando as decisões centralizadas sempre obsoletas"
  - "O planejamento central fracassa porque os cidadãos resistem deliberadamente aos mandatos governamentais e se recusam a cumprir regulamentações"
explanation: >-
  O argumento fundamental de Hayek repousa sobre a natureza da informação. Ele demonstrou que o conhecimento nunca existe em forma concentrada ou integrada, mas apenas como fragmentos dispersos possuídos por todos os indivíduos distintos. O valor é subjetivo e conhecido apenas localmente e de forma incompleta. O planejador central, sentado em um escritório, não tem conhecimento do verdadeiro preço das coisas porque não está envolvido em interação e troca.
