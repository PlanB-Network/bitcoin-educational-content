question: Liquid Networkで、実際の金額を公開せずに、トランザクションの入力が出力と手数料の合計に等しいことを検証できるようにしている暗号メカニズムは何ですか？
answer: ペダーセン・コミットメントとレンジプルーフ
wrong_answers:
  - マークルツリーとデジタル署名
  - ハッシュタイムロック・コントラクトとマルチシグ
  - Schnorr署名とTaprootスクリプト
explanation: |
  ペダーセン・コミットメントとレンジプルーフは、LiquidのConfidential Transactionsが数学的な検証を可能にしつつ金額を隠すための暗号プリミティブです。ペダーセン・コミットメントは値を明かさずにその値に暗号学的に結び付き、レンジプルーフはすべての金額が正の整数であることを保証して、負の値を使ってお金を生み出すことを防ぎます。他の選択肢もBitcoinで使われる正当な暗号ツールですが、金額を隠したまま検証できるConfidential Transactionsに必要なブラインディングの機能は備えていません。