question: "Как разграничението на Karl Popper между отворени и затворени общества се свързва с дебата индивидуализъм срещу колективизъм?"
answer: "Отвореното общество признава правото на индивида да преценява сам чрез лични решения, докато затвореното общество е колективистко, почиващо върху племенен манталитет и отказ от критична свобода"
wrong_answers:
  - "Отвореното общество е такова, което позволява свободна търговия през националните граници, докато затвореното общество налага мита и протекционистки икономически политики"
  - "Отвореното общество се управлява чрез пряка демокрация, при която всеки гражданин гласува, докато затвореното общество се управлява от един наследствен монарх"
  - "Отвореното общество публикува прозрачно всички правителствени документи, докато затвореното общество класифицира информацията като държавна тайна"
explanation: >-
  Popper определя затвореното общество като магическото или племенното общество, а отвореното общество като такова, в което индивидите са изправени пред лични решения. Затвореното общество е колективистко, почиващо върху племенен манталитет с отказ от критична свобода и идеализация на статичен ред. Отвореното общество дава първенство на свободния избор на ценности, убеждения и отношения, като пряко въплъщава индивидуалистичните принципи.
reviewed: false
