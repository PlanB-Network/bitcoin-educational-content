question: "Wie unterscheiden sich die Strategien zur Abschaffung des Staates zwischen Libertaires und Libertären?"
answer: "Libertaires befürworten historisch die gewaltsame Zerstörung, während Libertäre versuchen, den Staat durch Bildung und zivilen Ungehorsam zu delegitimieren"
wrong_answers:
  - "Libertaires nutzen demokratische Wahlen, um den Staat abzubauen, während Libertäre bewaffnete Revolution und direkte Aktion bevorzugen"
  - "Libertaires konzentrieren sich auf den Aufbau alternativer Gemeinschaften, während Libertäre innerhalb des bestehenden politischen Systems arbeiten, um Reformen zu verabschieden"
  - "Sowohl Libertaires als auch Libertäre sind sich einig, dass friedlicher Protest das einzige legitime Mittel gesellschaftlicher Transformation ist"
explanation: >-
  Die Libertaires befürworten historisch die Zerstörung des Staates und des Kapitalismus durch Gewalt, einschließlich Terror und gezielter Angriffe. Libertäre lehnen aggressive Gewalt dagegen als illegitim ab. Ihre Strategie beruht darauf, den Staat durch Argumentation, Debatte, Bildung und zivilen Ungehorsam zu delegitimieren. Diese grundlegend unterschiedlichen Ansätze des Wandels spiegeln ihre tieferen philosophischen Meinungsverschiedenheiten wider.
reviewed: false
