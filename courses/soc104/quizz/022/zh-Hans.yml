question: "文化保守主义是什么？"
answer: "个人对从过去继承而来的家庭、道德、审美和形而上价值的认同，而不是一种政治哲学"
wrong_answers:
  - "一种政治意识形态，通过立法使用国家权力把传统价值强加给整个社会"
  - "一种拒绝一切形式现代性并寻求让社会回到前工业生活方式的运动"
  - "一种保护本国产业并反对与外国自由贸易的经济学说"
explanation: >-
  文化保守主义被定义为一种生活智慧：个人对从过去继承而来的家庭、道德、审美和形而上价值的认同，无论其来源是希腊—罗马传统还是犹太—基督教传统。它明确不是一种政治哲学。它不同于政治保守主义，后者旨在通过国家权力保存政治制度和社会秩序。它也不是关于拒绝现代性或经济保护主义。
reviewed: false
