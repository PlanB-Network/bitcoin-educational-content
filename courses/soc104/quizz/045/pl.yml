question: "Jak Green New Deal reprezentuje współczesną ewolucję socjalizmu demokratycznego?"
answer: "Wykorzystuje troski środowiskowe jako nowe uzasadnienie interwencji państwa i konfiskaty prywatnych dochodów, podporządkowując interes jednostki zbiorowemu zdrowiu planety"
wrong_answers:
  - "Całkowicie porzuca tradycyjną ekonomię socjalistyczną na rzecz wolnorynkowych rozwiązań problemów środowiskowych poprzez handel emisjami"
  - "Odrzuca interwencję państwa i zamiast tego polega na dobrowolnym działaniu jednostek oraz innowacji sektora prywatnego w odpowiedzi na zmianę klimatu"
  - "Stanowi zerwanie z socjalizmem, ponieważ priorytetowo traktuje ochronę środowiska ponad wszystkimi kwestiami sprawiedliwości społecznej i zatrudnienia"
explanation: >-
  Green New Deal łączy troski środowiskowe z celami społecznymi, zestawiając transformację ekologiczną ze sprawiedliwością społeczną, gwarancjami zatrudnienia i wzmocnionymi usługami publicznymi. Interes jednostki jest podporządkowany interesowi zbiorowemu definiowanemu przez zdrowie planety. W gruncie rzeczy dostarcza nowej retorycznej otoczki uzasadniającej interwencję państwa i konfiskatę prywatnych dochodów, już nie wyłącznie w imię sprawiedliwości społecznej, ale także w imię środowiska.
