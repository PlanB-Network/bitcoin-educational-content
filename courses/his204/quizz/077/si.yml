question: Turgotගේ දීප්තිය පැහැදිලි කරන සාධක තුන කුමක්ද?
answer: ඔහුගේ පවුල් සම්භවය, කාලය, ඔහුගේ බුද්ධිමය පූර්ව පරිණතභාවය
wrong_answers:
  - ඔහුගේ පවුල් සම්භවය, ඔහුගේ මිතුරු ජාලය, ඔහුගේ ධනය
  - කාලය, ඔහුගේ ධනවාසනාව, ඔහුගේ සහෝදරයාගේ කීර්තිය
  - ඔහුගේ ආකර්ෂණීයත්වය, ඔහුගේ වාක්චාතුර්යය, ඔහුගේ අධිෂ්ඨානය
explanation: |
  Turgotගේ පවුල් සම්භවය, උසස් සහ බලවත් පවුලක සාමාජිකත්වය, බුද්ධිමය උණුසුමෙන් සහ සංශෝධනයට ඇති කැමැත්තෙන් සලකුණු වූ කාලපරිච්ඡේදය, සහ ආර්ථික හා දේශපාලන දැනුම ඉක්මනින් ප්‍රගුණ කිරීමට ඔහුට හැකි කළ ඔහුගේ බුද්ධිමය පූර්ව පරිණතභාවය යන සියල්ල ඔහුගේ දීප්තියට දායක විය.