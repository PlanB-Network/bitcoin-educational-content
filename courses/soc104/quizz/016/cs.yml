question: "Co chce levice legislativně upravovat a regulovat?"
answer: "Ekonomiku, motivována nepřátelstvím k ekonomické svobodě, kapitalismu a volnému trhu"
wrong_answers:
  - "Osobní morálku a náboženské praktiky, motivována touhou zachovat tradiční instituce"
  - "Imigraci a státní hranice, motivována obavami o kulturní identitu a suverenitu"
  - "Technologie a inovace, motivována obavami, že automatizace nahradí lidské pracovníky"
explanation: >-
  Levice dává prioritu sociální spravedlnosti a rovnosti, zejména na ekonomické úrovni. To vede k jejímu nepřátelství vůči ekonomické svobodě, kapitalismu a volnému trhu a k její touze legislativně upravovat a regulovat ekonomiku. Pravice naproti tomu chce legislativně upravovat morálku a náboženství. Regulace imigrace a technologií není hlavním zde popsaným zaměřením.
reviewed: false
