question: "What is the concept of 'moral hazard' in the context of the subsidies debate, and which political family raises this concern?"
answer: "Moral hazard is the incentive toward irresponsibility when companies are prevented from failing through subsidies, because the taxpayer ultimately pays; this concern is raised by libertarians"
wrong_answers:
  - "Moral hazard is the risk that subsidized companies will relocate to countries with lower taxes, taking jobs with them; this concern is raised by conservatives"
  - "Moral hazard is the danger that government officials will become corrupt by choosing which companies receive subsidies; this concern is raised by centrists"
  - "Moral hazard is the ethical problem of companies exploiting workers after receiving public funds; this concern is raised by socialists"
explanation: >-
  Libertarians argue that subsidies and bailouts create moral hazard: when companies are prevented from failing, it incentivizes irresponsibility and recklessness because there are no consequences for poor decisions. In the end, it is the taxpayer who pays, which libertarians consider profoundly unjust. This concept is distinct from concerns about corporate relocation, official corruption, or worker exploitation raised by other political families.
