question: Mirabeau hral aktívnu úlohu vo fyziokratickej škole. Koho obrátil predovšetkým?
answer: Duponta de Nemours
wrong_answers:
  - Françoisa Quesnaya
  - Turgota
  - Adama Smitha
explanation: |
  Mirabeau obrátil Duponta de Nemours k fyziokracii, čo mu umožnilo stať sa hlavným zástancom tejto myšlienkovej školy.
