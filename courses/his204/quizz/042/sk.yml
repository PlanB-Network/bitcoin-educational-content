question: Z ktorého autora čerpá Mirabeau v L'Ami des Hommes?
answer: Richard Cantillon
wrong_answers:
  - Vincent de Gournay
  - François Quesnay
  - Adam Smith
explanation: |
  Mirabeau mal 15 rokov v držbe rukopis Cantillonovej Eseje o povahe obchodu vo všeobecnosti a trpezlivo ho analyzoval. L'Ami des Hommes bolo pôvodne zamýšľané ako jednoduchý komentár k Cantillonovej Eseji. Jeho obrátenie ku Quesnayovej fyziokracii prišlo neskôr, keď už bola kniha vydaná.
