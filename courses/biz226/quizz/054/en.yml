question: "According to the chapter, what is the relationship between your personal brand and the organization you work for?"
answer: "Both brands benefit mutually when you associate your personal brand with your company"
wrong_answers:
  - "Your personal brand should always remain completely separate from your employer's brand"
  - "Your company's brand should take priority and your personal identity should stay hidden"
  - "Personal branding only benefits freelancers and entrepreneurs, not salaried employees"
explanation: >-
  The chapter describes a mutually beneficial relationship: your personal brand is the biggest gift you can give your company, because people connect with people more than logos. Statistics show that 20% of people who follow you will go on to follow your company. In return, you gain the credibility and reach of being associated with a recognized organization.
reviewed: false
