question: "Ders, özgürlüğün hem sol kanat hem de sağ kanat değerlerin barış içinde bir arada var olmasına nasıl imkân verdiğini savunur?"
answer: "Gerçek bir özgürlük rejiminde, sol kanat ideallere sahip insanlar mülklerini gönüllü olarak paylaşabilir ve fonları yeniden dağıtabilir; sağ kanat değerlere sahip olanlar ise tasarruf edebilir ve gelenekleri aktarabilir; hiçbir taraf kendi yaşam tarzını diğerine dayatmaz"
wrong_answers:
  - "Özgürlük, hükümetin rekabet eden değerleri ılımlı düzenleme yoluyla dengelediği merkezci bir konumu kabul ederek iki tarafın da uzlaşmasını gerektirir"
  - "Özgürlük, sol kanat ve sağ kanat toplulukların kendi bağımsız hükümetleriyle ayrı coğrafi bölgelerde yaşaması anlamına gelir"
  - "Özgürlük, vatandaşların her bölgede hangi değerlerin uygulanacağına oy vermesine izin vererek işler; her seçim döngüsünde sol kanat ve sağ kanat politikalar arasında dönüş yapılır"
explanation: >-
  Ders, gerçek bir özgürlük rejiminde sol kanat ideallere bağlı olanların mülklerinden gönüllü olarak vazgeçebileceğini, üretim araçlarını paylaşabileceğini ya da ücretlerini yeniden dağıtım yapan kuruluşlara bağışlayabileceğini gösterir. Sağ kanat değerlere sahip olanlar çok çalışabilir, tasarruf edebilir ve aile değerlerini aktarabilir. Hiç kimse kendi yaşam tarzını başkalarına dayatmamalıdır. Hedeflere barışçıl biçimde ulaşmayı mümkün kılan, piyasanın özgürlüğü ve seçim gücüdür.
