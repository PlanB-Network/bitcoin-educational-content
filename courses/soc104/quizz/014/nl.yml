question: "Waarom stelt het tweedimensionale model dat de meeste politieke kwesties kunnen worden verdeeld in economische en persoonlijke categorieën?"
answer: "Omdat economische kwesties gaan over wat je doet als producent en consument, terwijl persoonlijke kwesties gaan over je privérelaties, overtuigingen en lichamelijke autonomie"
wrong_answers:
  - "Omdat alle politieke debatten uiteindelijk neerkomen op meningsverschillen over belastingniveaus en religieuze praktijken"
  - "Omdat regeringen historisch gezien slechts twee dingen reguleren: de markt en het leger"
  - "Omdat politieke filosofen materiële zorgen sinds de oudheid altijd hebben gescheiden van spirituele zorgen"
explanation: >-
  Het tweedimensionale model is gebaseerd op het idee dat politieke kwesties in twee brede categorieën uiteenvallen. Economische vrijheden omvatten productie, consumptie, handel, werkgelegenheid en geldbeheer. Persoonlijke vrijheden omvatten privérelaties, meningen, overtuigingen en keuzes over je eigen lichaam en geest. Deze scheiding maakt een veel genuanceerdere mapping van politieke posities mogelijk dan één enkele links-rechtsas.
