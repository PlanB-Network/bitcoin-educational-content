question: "What is the main problem with a barter economy that currency solves?"
answer: "It requires a double coincidence of wants, meaning both parties must desire what the other offers at the same time"
wrong_answers:
  - "It makes transactions too fast for proper record-keeping"
  - "It forces governments to regulate every exchange individually"
  - "It only works for physical goods and cannot handle services"
explanation: >-
  In a barter system, trade can only happen when two people each want what
  the other has at the exact same moment. Currency eliminates this constraint
  by acting as a universal intermediary: a farmer can sell wheat for currency
  and later use that currency to buy shoes, without needing to find a
  shoemaker who specifically wants wheat.
reviewed: false
