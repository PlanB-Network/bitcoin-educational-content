question: "팔레오-자유지상주의란 무엇인가요?"
answer: "강제의 원천으로서 국가를 거부하는 것과 전통적 제도 및 자발적 사회 구조의 강화를 결합한 종합입니다"
wrong_answers:
  - "모든 전통적 가치를 거부하고 급진적 사회 진보주의를 촉진하는 자유지상주의 운동입니다"
  - "일부 경제적 자유는 허용하면서도 국가 권력을 사용해 전통적 가치를 집행하는 보수주의 이념입니다"
  - "사회주의 경제와 보수적 사회 정책 사이의 균형 잡힌 타협을 추구하는 중도주의 철학입니다"
explanation: >-
  팔레오-자유지상주의는 제도적 강제의 원천으로서 국가를 거부하는 것과, 전통적 제도의 강화 및 국가 권위보다 자발적 사회 구조를 선호하는 태도를 결합합니다. 이는 전통적 가치에 더 호의적이라는 점에서 네오-자유지상주의와 구별됩니다. 팔레오-자유지상주의자는 공동체가 사회주의적 또는 공동체주의적 원칙을 중심으로 조직되는 것에 반대하지 않습니다. 그들은 그런 공동체가 법의 힘으로 자신들의 가치를 모두에게 강요하는 것만 거부합니다.
