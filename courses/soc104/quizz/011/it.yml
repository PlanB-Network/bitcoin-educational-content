question: "Che cosa include la categoria della libertà economica?"
answer: "Ciò che fai come produttore e consumatore: comprare, vendere, produrre, lavorare, assumere e gestire il tuo denaro"
wrong_answers:
  - "Le tue credenze religiose, le relazioni personali e la libertà di espressione"
  - "Il tuo diritto di voto, di partecipare alle elezioni e di aderire a partiti politici"
  - "La tua capacità di viaggiare liberamente, scegliere la residenza e attraversare i confini nazionali"
explanation: >-
  La libertà economica copre ciò che fai come produttore e consumatore: cosa puoi comprare, vendere o produrre; dove lavori; chi assumi; e cosa fai con il tuo denaro. Le relazioni personali, le credenze religiose e la libertà di movimento rientrano nella categoria della libertà personale, non in quella economica.
reviewed: false
