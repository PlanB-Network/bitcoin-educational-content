question: "Ce înseamnă termenul «holism» în contextul filosofiei socialiste?"
answer: "O viziune asupra societății ca întreg indivizibil, în care colectivul are primat asupra individului"
wrong_answers:
  - "O filosofie care tratează fiecare individ ca pe o unitate autonomă ale cărei drepturi nu pot fi anulate de niciun grup"
  - "O teorie economică ce pledează pentru echilibrarea sectoarelor public și privat în măsură egală"
  - "O strategie politică ce integrează toate punctele de vedere minoritare într-o platformă unică bazată pe consens"
explanation: >-
  Holismul vine din grecescul „holos”, care înseamnă „întregul”. În gândirea socialistă, el se referă la o viziune asupra societății ca întreg indivizibil, nu ca o simplă sumă de indivizi. Statul socialist urmărește să preia în sarcină și să dirijeze activitatea umană la maximum. Acest colectiv poate fi reprezentat ca o clasă socială, o națiune, o rasă sau un gen, dar în fiecare caz individul este definit prin apartenența la grup.
