question: "文化保守的自由意志主义者如何处理他们在道德上不赞成的行为？"
answer: "他们通过劝说和榜样反对并劝阻这些行为，但不诉诸法律的强制力量"
wrong_answers:
  - "他们支持地方政府禁止这些行为，同时反对联邦层面的禁令"
  - "他们对这些行为保持完全沉默，认为任何形式的不赞成都会侵犯个人自由"
  - "他们主张设立共同体法庭，在正式法律体系之外惩罚这些行为"
explanation: >-
  文化保守的自由意志主义者可能在道德上不赞成某些行为，但并不主张用法律禁止自愿、非侵害性的行动。他们可能不喜欢这些行动，反对它们，并积极劝阻它们，但始终通过劝说、教育和榜样，而不是通过法律的强制力量。这并不是保持沉默，也不是创建替代性执行机制。
reviewed: false
