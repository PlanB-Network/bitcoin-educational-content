question: "Vì sao trục dọc (trên-dưới) được xem là nền tảng hơn trục ngang (tả-hữu) trong biểu đồ Nolan?"
answer: "Vì nó phơi bày sự phân chia thực sự giữa những người bảo vệ tối đa các quyền tự do cá nhân và những người ủng hộ sự kiểm soát tối đa của nhà nước"
wrong_answers:
  - "Vì nó đo lường sản lượng kinh tế chính xác hơn so với việc trục ngang đo lường các chính sách xã hội"
  - "Vì hầu hết các xung đột chính trị trong lịch sử đều xoay quanh bản sắc văn hóa hơn là quản trị"
  - "Vì trục ngang chỉ áp dụng cho các nền dân chủ hiện đại trong khi trục dọc mang tính phổ quát"
explanation: >-
  Trục nền tảng là trục dọc vì nó nắm bắt câu hỏi chính trị thiết yếu: nhà nước nên kiểm soát hành động của con người đến mức nào? Trục tả-hữu chỉ phản ánh các khuynh hướng khác nhau (công bằng xã hội so với truyền thống), nhưng cả hai phía có thể cùng chiếm một vị trí trên trục dọc với tư cách là những người theo chủ nghĩa nhà nước. Trục dọc cho thấy liệu một người muốn áp đặt tầm nhìn của mình bằng vũ lực hay tôn trọng tự do cá nhân.
reviewed: false
