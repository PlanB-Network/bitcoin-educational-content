question: Ni uwuhe murongo wa Bitcoin.conf ugabanya ubunini bwa Mempool muri MB?
answer: maxmempool
wrong_answers:
  - umubare wose
  - iherezo ry'igihe
  - ubunini bw'ikigega
explanation: |
  maxmempool igena ubunini ntarengwa bwa Mempool (ku buryo busanzwe ni 300 MB).  Iyo yuzuye, transactions zidafite fee nini zisohorwa.
reviewed: true
