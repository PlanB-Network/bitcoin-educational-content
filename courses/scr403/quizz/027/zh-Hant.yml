question: "為什麼見證值被排除在承諾 Merkle Root（CMR）之外？"
answer: 讓位址得以在見證資料已知之前就形成，並讓未使用的分支能私密地被修剪掉。
wrong_answers:
  - 因為見證值單純就是太大了，無法納入一個 256 位元的雜湊中。
  - 因為見證值完全是由 Failure 副作用另行驗證的。
  - 因為納入見證值會使 CMR 變得不具確定性。
explanation: >-
  見證運算式（例如簽章）是在花費時提供的，而非在建立位址時。將它們排除在 CMR 之外實現了兩項重要的性質：位址可以在花費交易存在之前就被產生，而未被執行的條件分支則可以從鏈上資料中被修剪掉，無須揭露與其相關聯的見證值。
reviewed: true
