question: "Vilken är den centrala skillnaden mellan att vara pro-business och att vara pro-market?"
answer: "Förespråkare för pro-business söker statlig intervention för att skydda specifika företag från misslyckande, medan förespråkare för pro-market stöder avreglering och låter företag misslyckas så att marknaden kan omorganisera sig naturligt"
wrong_answers:
  - "Förespråkare för pro-business fokuserar på stora företag medan förespråkare för pro-market uteslutande fokuserar på att stödja småföretag och startups"
  - "Pro-business är en vänsterståndpunkt som gynnar arbetarkooperativ medan pro-market är en högerståndpunkt som gynnar privat ägande"
  - "Förespråkare för pro-business avvisar all konkurrens medan förespråkare för pro-market stöder statligt reglerad konkurrens mellan godkända företag"
explanation: >-
  Pro-business-positionen ser konkurrens som ett styrningsinstrument som erhålls genom regleringar och rättfärdigar subventioner och räddningspaket för att förhindra jobbförluster. I pro-business-synen är marknaden skör och behöver statlig räddning. Förespråkare för pro-market ser konkurrens som det naturliga resultatet av fritt företagande, vilket innebär avreglering och att företag tillåts misslyckas, eftersom misslyckanden låter marknaden omorganisera sig naturligt och öppnar fältet för mer kapabla aktörer.
reviewed: false
