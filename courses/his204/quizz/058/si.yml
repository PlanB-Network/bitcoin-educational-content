question: Quesnay සහ Physiocrats අනුව, උත්සාහය සහ වැඩ උත්තේජනය කරන්නේ කුමක්ද?
answer: පුද්ගලික දේපළේ සුරක්ෂිතතාව
wrong_answers:
  - මර්දනකාරී නීති
  - කර්මාන්තකරුවන්ගේ සහ ශිල්පීන්ගේ පොහොසත් වීමට හිතකර සිරිත් විරිත්
  - සාගතයට ඇති බිය
explanation: |
  Physiocrats අනුව, ආයෝජනය සහ වැඩ දිරිගැන්වීමට පුද්ගලික දේපළේ සුරක්ෂිතතාව අත්‍යවශ්‍ය විය. පුද්ගලයන්ට තම ශ්‍රමයේ ඵල තබා ගැනීමට හැකි බවට සහතිකයක් තිබේ නම්, ඔවුන් වැඩ කිරීමට සහ ආයෝජනය කිරීමට වඩාත් නැඹුරු වන බව ඔවුන් විශ්වාස කළහ.