question: "什麼是 paleo-libertarianism？"
answer: "一種綜合體，將拒絕國家作為強制來源，與強化傳統制度和自願社會結構結合起來"
wrong_answers:
  - "一種拒絕所有傳統價值並推動激進社會進步主義的自由意志主義運動"
  - "一種保守主義意識形態，使用國家權力執行傳統價值，同時允許一定程度的經濟自由"
  - "一種中間主義哲學，尋求在社會主義經濟學與保守主義社會政策之間達成均衡妥協"
explanation: >-
  Paleo-libertarianism 將拒絕國家作為制度性強制來源，與強化傳統制度，以及偏好自願社會結構而非國家權威結合起來。它區別於 neo-libertarianism，因為它更同情傳統價值。Paleo-libertarian 並不反對圍繞社會主義或共同體主義原則組織起來的社群；他們只是拒絕這類社群透過法律強力把自己的價值觀強加給所有人。
reviewed: false
