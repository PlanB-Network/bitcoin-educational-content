question: "What is a positioning statement in the context of personal branding?"
answer: "A single line that captures who you are and what you do, used in social media bios"
wrong_answers:
  - "A multi-paragraph biography detailing your career history and achievements"
  - "A formal mission statement defining your company's long-term strategic goals"
  - "A detailed document listing your target audience segments and marketing channels"
explanation: >-
  A positioning statement is a concise one-liner that summarizes your brand identity for external use, such as social media bios. Efrat's own example is "Journalist and podcaster with a marketing background, tech savvy, allergic to tyranny, freedom and Bitcoin maxi." It sits on top of the five brand identity components, which stay internal.
reviewed: false
