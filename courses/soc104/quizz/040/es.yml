question: "¿Qué división fundamental separó a los socialistas desde comienzos del siglo XX en adelante?"
answer: "Socialistas revolucionarios que buscaban tomar el poder mediante la violencia frente a socialistas reformistas que perseguían el cambio mediante elecciones democráticas"
wrong_answers:
  - "Socialistas urbanos centrados en los trabajadores industriales frente a socialistas rurales que organizaban comunas agrícolas"
  - "Socialistas nacionalistas que priorizaban su propio país frente a socialistas internacionalistas que defendían la revolución global"
  - "Socialistas intelectuales que escribían textos teóricos frente a socialistas activistas que organizaban huelgas laborales"
explanation: >-
  Desde comienzos del siglo XX, una división fundamental separó a los socialistas revolucionarios, que se oponían a los derechos de propiedad y buscaban destruir la sociedad capitalista mediante la violencia o la dictadura del proletariado, de los socialistas reformistas, que perseguían la justicia social mediante elecciones democráticas e impuestos, aceptando temporalmente el capitalismo. Esta escisión dio forma a toda la historia posterior de los movimientos socialistas.
