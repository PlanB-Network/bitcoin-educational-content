question: "不可侵原則は何を述べているか？"
answer: "他者の生命、自由、または財産に対して暴力が行使されない限り、人は望むように行動する自由がある"
wrong_answers:
  - "社会秩序を維持するため、国家だけが武力を行使する権利を持つ"
  - "個人の自由を制限する場合でも、市民は多数決に従わなければならない"
  - "行動の自由は、社会の集合的利益に役立つ場合にのみ許される"
explanation: >-
  不可侵原則はリバタリアン政治の礎石であり、他者の生命、自由、または財産に対して暴力を犯さない限り、個人は自由に行動してよいと述べる。これは諸文明に見られる黄金律を想起させる。他の選択肢と異なり、これは国家に特別な道徳的権威を与えるものでも、個人の権利を集合的利益に従属させるものでもない。
reviewed: false
