question: "จุดยืนอนุรักษนิยมต่อการย้ายถิ่นฐานคืออะไร?"
answer: "รัฐมีสิทธิอธิปไตยในการควบคุมพรมแดนเพื่อปกป้องความมั่นคงแห่งชาติและอัตลักษณ์ทางวัฒนธรรม"
wrong_answers:
  - "พรมแดนควรเปิดอย่างไม่มีเงื่อนไข เพราะข้อจำกัดแบบเลือกปฏิบัติละเมิดสิทธิมนุษยชน"
  - "การย้ายถิ่นฐานควรถูกกำหนดโดยอุปสงค์ของตลาด โดยให้พลเมืองตัดสินใจเชิงสัญญาเกี่ยวกับความสัมพันธ์ของตนกับชาวต่างชาติ"
  - "นโยบายการย้ายถิ่นฐานควรสร้างสมดุลระหว่างความต้องการทางเศรษฐกิจกับการบูรณาการที่ประสบความสำเร็จบนฐานการประเมินของผู้เชี่ยวชาญ"
explanation: >-
  อนุรักษนิยมยึดว่า ระเบียบ อัตลักษณ์ และอธิปไตยแห่งชาติต้องมาก่อนการต้อนรับชาวต่างชาติหรือผู้ลี้ภัยโดยไร้ข้อจำกัด พรมแดนและประชากรที่นิยามชัดเจนเป็นส่วนหนึ่งของคุณค่าอารยธรรม คำตอบผิดแทนจุดยืนสังคมนิยม (พรมแดนเปิดในฐานะสิทธิมนุษยชน) จุดยืนลิเบอร์ทาเรียน (การย้ายถิ่นฐานที่ตั้งอยู่บนตลาด) และจุดยืนสายกลาง (แนวทางสมดุลที่ขับเคลื่อนโดยผู้เชี่ยวชาญ)
reviewed: false
