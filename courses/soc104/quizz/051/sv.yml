question: "Vad placerar libertarianer i centrum för sin politiska filosofi?"
answer: "Etik och rätt"
wrong_answers:
  - "Ekonomisk tillväxt och välståndsskapande"
  - "Social jämlikhet och kollektiv välfärd"
  - "Nationell identitet och kulturellt bevarande"
explanation: >-
  Libertarianer skiljer sig från alla andra politiska familjer genom att placera etik och rätt i centrum för sin filosofi, inte ekonomin. När de försvarar marknadsekonomin är det mindre för dess förmåga att producera välstånd än för dess främjande av individuell frihet och ansvar. Ekonomisk tillväxt är en sekundär fördel, inte den grundläggande principen.
reviewed: false
