question: "เหตุใด Popper จึงโต้แย้งว่าสังคมเปิดยังคงเปราะบางโดยเนื้อแท้ แม้จะมีข้อดี?"
answer: "เพราะความรับผิดชอบที่ปัจเจกนิยมบ่งนัยอาจดูน่ากลัว ทำให้เกิดแรงล่อใจให้หาที่หลบภัยในความคุ้มครองของชุมชน อำนาจ หรือความถวิลหาอดีตที่ถูกทำให้เป็นอุดมคติ"
wrong_answers:
  - "เพราะสังคมเปิดขาดกำลังทหารและไม่สามารถป้องกันตนเองจากการรุกรานของสังคมปิดได้"
  - "เพราะสถาบันประชาธิปไตยไม่มีประสิทธิภาพโดยเนื้อแท้ และท้ายที่สุดย่อมล่มสลายภายใต้น้ำหนักของความซับซ้อนทางราชการ"
  - "เพราะสังคมเปิดอนุญาตความไม่เท่าเทียมทางเศรษฐกิจมากเกินไป ซึ่งหลีกเลี่ยงไม่ได้ที่จะนำไปสู่การปฏิวัติและการสถาปนาระบอบอำนาจนิยม"
explanation: >-
  Popper เน้นว่าความเปราะบางของสังคมเปิดเกิดจากจุดอ่อนทางจิตวิทยา ความรับผิดชอบที่ปัจเจกนิยมบ่งนัยอาจดูน่ากลัวและเสี่ยง เพราะคนเราต้องเลือกด้วยตนเองและอาจล้มเหลวได้ สิ่งนี้ก่อให้เกิดแรงล่อใจให้หาที่หลบภัยในความคุ้มครองของชุมชน หรือแนวโน้มถวิลหาอดีตที่ถูกทำให้เป็นอุดมคติ สังคมเปิดเผชิญความท้าทายอย่างต่อเนื่องจากแรงขับแบบชุมชนนิยมและแรงล่อใจซ้ำ ๆ ของความรุนแรง
reviewed: false
