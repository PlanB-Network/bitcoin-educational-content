question: "ความแตกต่างสำคัญระหว่างการเป็น pro-business กับการเป็น pro-market คืออะไร?"
answer: "การเป็น pro-business หมายถึงการสนับสนุนพันธมิตรระหว่างบริษัทขนาดใหญ่กับรัฐ ขณะที่การเป็น pro-market หมายถึงการสนับสนุนการแข่งขันเสรีโดยไม่มีการเอื้อประโยชน์จากรัฐ"
wrong_answers:
  - "การเป็น pro-business หมายถึงการสนับสนุนธุรกิจขนาดเล็ก ขณะที่การเป็น pro-market หมายถึงการสนับสนุนบรรษัทข้ามชาติ"
  - "การเป็น pro-business หมายถึงการคัดค้านกฎระเบียบทั้งหมด ขณะที่การเป็น pro-market หมายถึงการยอมรับกฎระเบียบระดับปานกลาง"
  - "การเป็น pro-business มุ่งเน้นอุตสาหกรรมภายในประเทศ ขณะที่การเป็น pro-market มุ่งเน้นการค้าระหว่างประเทศ"
explanation: >-
  สายกลางมีแนวโน้มเป็น pro-business หมายความว่าพวกเขาสนับสนุนพันธมิตรแบบหนึ่งระหว่างบริษัทขนาดใหญ่กับรัฐ ซึ่งแตกต่างจากการเป็น pro-market การเป็น pro-market สนับสนุนการแข่งขันเสรีโดยไม่มีการเอื้อประโยชน์จากรัฐหรือการคุ้มครองบรรษัท ความแตกต่างนี้สำคัญอย่างยิ่ง เพราะนโยบาย pro-business สามารถสร้างการผูกขาดและการคุ้มครองทางกฎระเบียบที่บ่อนทำลายการแข่งขันในตลาดเสรีจริง ๆ
reviewed: false
