question: "Wat kenmerkt de onderkant van de as voor persoonlijke vrijheid op het Nolan-diagram?"
answer: "Een voorkeur voor orde, veiligheid, traditionele waarden en een staat die moraal reguleert en de openbare orde handhaaft"
wrong_answers:
  - "Een voorkeur voor individuele autonomie, tolerantie en minimale staatsinmenging in persoonlijke levenskeuzes"
  - "Een voorkeur voor economische deregulering, vrijhandel en de afschaffing van tarieven en subsidies"
  - "Een voorkeur voor herverdeling van rijkdom, hoge belastingen en nationalisatie van sleutelindustrieën"
explanation: >-
  De onderkant van de as voor persoonlijke vrijheid vertegenwoordigt maximale staatscontrole over het persoonlijke leven, gekenmerkt door een voorkeur voor orde, veiligheid en traditionele waarden. De staat reguleert moraal, handhaaft de openbare orde en kan een specifieke visie op moraal of traditie verdedigen. De bovenkant van de as vertegenwoordigt het tegenovergestelde: individuele vrijheid en tolerantie. Economisch beleid wordt gemeten op de afzonderlijke horizontale as.
reviewed: false
