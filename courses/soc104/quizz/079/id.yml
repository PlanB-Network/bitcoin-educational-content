question: "Apa yang dimaksud Ludwig von Mises ketika ia menulis bahwa hanya individu yang berpikir, bernalar, dan bertindak?"
answer: "Bahwa kolektivitas seperti negara atau bangsa tidak memiliki keberadaan sendiri di luar tindakan para anggota individualnya"
wrong_answers:
  - "Bahwa individu harus menghindari pembentukan kelompok atau asosiasi karena tindakan kolektif selalu berbahaya"
  - "Bahwa hanya individu berbakat tertentu yang mampu berpikir rasional sementara kebanyakan orang mengikuti insting"
  - "Bahwa berpikir dan bernalar adalah aktivitas pribadi yang tidak boleh pernah dibagikan atau dibahas di publik"
explanation: >-
  Mises menjelaskan bahwa individualisme menentang gagasan bahwa entitas sosial seperti masyarakat atau bangsa dapat ada secara independen dari individu-individu yang menyusunnya. Suatu kolektivitas tidak memiliki keberadaan sendiri di luar tindakan para anggota individualnya. Kita tidak dapat berbicara secara bermakna tentang tindakan negara atau perusahaan karena entitas-entitas ini tidak memiliki kehendak atau pikiran sendiri dan hanya bertindak melalui individu.
