question: "Wie argumentiert der Kurs, dass Freiheit sowohl linke als auch rechte Werte friedlich nebeneinander bestehen lässt?"
answer: "In einem Regime echter Freiheit können Menschen mit linken Idealen freiwillig Besitz teilen und Mittel umverteilen, während Menschen mit rechten Werten sparen und Traditionen weitergeben können, ohne dass eine Seite der anderen ihre Lebensweise aufzwingt"
wrong_answers:
  - "Freiheit erfordert, dass beide Seiten Kompromisse eingehen, indem sie eine zentristische Position akzeptieren, in der die Regierung konkurrierende Werte durch moderate Regulierung ausbalanciert"
  - "Freiheit bedeutet, dass linke und rechte Gemeinschaften in getrennten geografischen Gebieten mit eigenen unabhängigen Regierungen leben müssen"
  - "Freiheit funktioniert dadurch, dass Bürger darüber abstimmen dürfen, welche Werte in jeder Region durchgesetzt werden sollen, wobei bei jedem Wahlzyklus zwischen linker und rechter Politik gewechselt wird"
explanation: >-
  Der Kurs zeigt, dass in einem echten Freiheitsregime diejenigen, die linken Idealen anhängen, freiwillig Besitz aufgeben, Produktionsmittel teilen oder Löhne an umverteilende Organisationen spenden können. Menschen mit rechten Werten können hart arbeiten, sparen und Familienwerte weitergeben. Niemand sollte anderen seine Lebensweise aufzwingen. Durch die Freiheit des Marktes und die Macht der Wahl können Ziele friedlich erreicht werden.
