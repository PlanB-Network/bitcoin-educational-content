question: "Zašto su Sajferpankovi tvrdili da je digitalna valuta s anonimnim svojstvima neophodna?"
answer: "Zato što gotovina, primarni sistem anonimnih transakcija, nestaje u digitalnom društvu, pa se mora izmisliti digitalna zamena s istim svojstvima privatnosti"
wrong_answers:
  - "Zato što su postojeći digitalni platni sistemi bili previše spori i skupi, pa je bila potrebna brža i jeftinija alternativa za onlajn trgovinu"
  - "Zato što su vlade već zabranile sve oblike anonimnih transakcija, pa je samo nova tehnologija mogla da zaobiđe te zakone"
  - "Zato što su tradicionalne banke odbijale da opslužuju određene populacije, čineći univerzalno dostupan digitalni platni sistem ekonomskom nužnošću"
explanation: >-
  Sajferpank manifest navodi da poverljivost u otvorenom društvu zahteva sisteme anonimnih transakcija. Do digitalnog doba, gotovina je služila kao primarni sistem te vrste. Ali u digitalnom društvu u kojem gotovina nestaje, mora se izmisliti digitalna valuta s istim svojstvima anonimnosti. Ova vizija je direktno nagovestila ono što će Bitcoin ostvariti.
reviewed: false
