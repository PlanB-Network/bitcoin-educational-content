question: "تقسیم‌بندی سیاسی چپ-راست از کجا سرچشمه می‌گیرد؟"
answer: "از چیدمان صندلی‌ها در جریان مناظره‌های انقلاب فرانسه در سال 1789"
wrong_answers:
  - "از نوشته‌های کارل مارکس و آدام اسمیت در قرن نوزدهم"
  - "از جنگ داخلی آمریکا میان ایالت‌های شمالی و جنوبی"
  - "از فیلسوفان روشنگری که عقل را از سنت جدا کردند"
explanation: >-
  تقسیم‌بندی چپ-راست به سال 1789 بازمی‌گردد، زمانی که نمایندگان مجلس ملی فرانسه که طرفدار حفظ قدرت پادشاه بودند در سمت راست رئیس می‌نشستند، در حالی که کسانی که می‌خواستند اختیارات او را محدود کنند در سمت چپ می‌نشستند. این تقسیم‌بندی از مارکس و اسمیت، جنگ داخلی آمریکا، یا فلسفهٔ روشنگری سرچشمه نگرفت.
reviewed: false
