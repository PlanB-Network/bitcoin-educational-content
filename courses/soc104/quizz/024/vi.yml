question: "Paleo-libertarianism là gì?"
answer: "Một sự tổng hợp kết hợp việc bác bỏ nhà nước như một nguồn cưỡng chế với việc củng cố các thiết chế truyền thống và các cấu trúc xã hội tự nguyện"
wrong_answers:
  - "Một phong trào libertarian bác bỏ mọi giá trị truyền thống và thúc đẩy chủ nghĩa tiến bộ xã hội cấp tiến"
  - "Một hệ tư tưởng bảo thủ sử dụng quyền lực nhà nước để thực thi các giá trị truyền thống trong khi cho phép một mức độ tự do kinh tế nhất định"
  - "Một triết lý trung dung tìm kiếm một thỏa hiệp cân bằng giữa kinh tế học xã hội chủ nghĩa và chính sách xã hội bảo thủ"
explanation: >-
  Paleo-libertarianism kết hợp việc bác bỏ nhà nước như nguồn cưỡng chế mang tính thiết chế với việc củng cố các thiết chế truyền thống và ưu tiên các cấu trúc xã hội tự nguyện hơn thẩm quyền nhà nước. Nó tự phân biệt với neo-libertarianism bằng sự thiện cảm lớn hơn với các giá trị truyền thống. Người paleo-libertarian không phản đối việc các cộng đồng tổ chức quanh các nguyên tắc xã hội chủ nghĩa hoặc cộng đồng chủ nghĩa; họ chỉ từ chối việc những cộng đồng như vậy áp đặt các giá trị của mình lên mọi người bằng sức mạnh của pháp luật.
