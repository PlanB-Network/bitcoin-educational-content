question: "Tofauti ya Karl Popper kati ya jamii wazi na jamii funge inahusianaje na mjadala wa ubinafsi dhidi ya ujumuishi?"
answer: "Jamii wazi hutambua haki ya mtu binafsi kujihukumia kupitia maamuzi binafsi, ilhali jamii funge ni ya kijumuishi, ikiegemea kwenye fikra za kikabila na kukataa uhuru wa kukosoa"
wrong_answers:
  - "Jamii wazi ni ile inayoruhusu biashara huru kuvuka mipaka ya kitaifa, ilhali jamii funge huweka ushuru wa forodha na sera za kiuchumi za ulinzi"
  - "Jamii wazi inaongozwa na demokrasia ya moja kwa moja ambapo kila raia hupiga kura, ilhali jamii funge hutawaliwa na mfalme mmoja wa kurithi"
  - "Jamii wazi huchapisha nyaraka zote za serikali kwa uwazi, ilhali jamii funge huainisha taarifa kama siri za dola"
explanation: >-
  Popper alifafanua jamii funge kama jamii ya kichawi au ya kikabila na jamii wazi kama ile ambayo watu binafsi hukabiliwa na maamuzi binafsi. Jamii funge ni ya kijumuishi, ikiegemea kwenye fikra za kikabila pamoja na kukataa uhuru wa kukosoa na kuutukuza utaratibu tuli. Jamii wazi hutoa kipaumbele kwa uchaguzi huru wa maadili, imani, na mahusiano, ikijumuisha moja kwa moja kanuni za ubinafsi.
