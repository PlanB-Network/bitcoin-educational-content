question: "Mis on tulirelvade reguleerimise küsimuses otsustav erinevus konservatiivsete ja libertaarsete seisukohtade vahel?"
answer: "Mõlemad aktsepteerivad mõningast reguleerimist, kuid konservatiivid tahavad reegleid legitiimselt avalikult võimult, samal ajal kui libertaarid tahavad, et reeglid kujuneksid välja otseselt puudutatud inimeste, näiteks kodanike ühenduste ja turukonkurentsi kaudu"
wrong_answers:
  - "Konservatiivid on vastu igasugusele tulirelvade reguleerimisele, samal ajal kui libertaarid aktsepteerivad avaliku julgeoleku nimel ranget riiklikku kontrolli"
  - "Konservatiivid tahavad tulirelvad täielikult keelata, samal ajal kui libertaarid toetavad piiramatut juurdepääsu kõigile relvadele"
  - "Konservatiivid rajavad oma seisukoha individuaalsetele õigustele, samal ajal kui libertaarid rajavad oma seisukoha kollektiivsele vastutusele"
explanation: >-
  Nii konservatiivid kui ka libertaarid nõustuvad, et relvakandmise mingisugune reguleerimine on vajalik. Otsustav erinevus seisneb selles, kes need reeglid kehtestab. Konservatiivid rõhutavad, et regulatsioonid peavad tulema avalikult võimult, kelle ülesanne on kaitsta ühist hüve (ülalt alla). Libertaarid väidavad, et regulatsioon peaks kujunema välja otseselt puudutatutelt: turvaspetsialistidelt, kodanike ühendustelt ja turukonkurentsist (alt üles).
