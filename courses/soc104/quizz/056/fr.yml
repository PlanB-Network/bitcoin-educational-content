question: "Quelle est la distinction importante entre être pro-business et être pro-market ?"
answer: "Être pro-business signifie favoriser une alliance entre les grandes entreprises et l'État, tandis qu'être pro-market signifie soutenir la libre concurrence sans favoritisme étatique"
wrong_answers:
  - "Être pro-business signifie soutenir les petites entreprises, tandis qu'être pro-market signifie soutenir les multinationales"
  - "Être pro-business signifie s'opposer entièrement à la réglementation, tandis qu'être pro-market signifie accepter une réglementation modérée"
  - "Être pro-business se concentre sur l'industrie nationale, tandis qu'être pro-market se concentre sur le commerce international"
explanation: >-
  Les centristes ont tendance à être pro-business, ce qui signifie qu'ils favorisent une forme d'alliance entre les grandes entreprises et l'État, ce qui diffère d'une position pro-market. Être pro-market consiste à soutenir la libre concurrence sans favoritisme étatique ni protectionnisme d'entreprise. Cette distinction est cruciale car les politiques pro-business peuvent créer des monopoles et des protections réglementaires qui minent en réalité la concurrence de marché libre.
