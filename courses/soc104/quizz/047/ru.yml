question: "Как Майкл Оукшотт характеризовал консерватизм в своей философской работе?"
answer: "Как темперамент и жизненную установку, а не как жёсткую систематическую идеологию"
wrong_answers:
  - "Как всеобъемлющую экономическую теорию с точными политическими предписаниями для каждой области государственного управления"
  - "Как революционное движение, которое стремится демонтировать современные институты и вернуться к доиндустриальному обществу"
  - "Как сугубо религиозную доктрину, основанную на христианском богословии и церковной власти"
explanation: >-
  Майкл Оукшотт, британский философ, защищал понимание консерватизма как темперамента, а не как систематической идеологии. Его эссе «О том, что значит быть консерватором» (1956) остаётся важнейшим ориентиром. Этот взгляд на консерватизм как на установку также повлиял на Фридриха Хайека. Подход Оукшотта примечателен своей критикой рационализма в политике и отказом от идеи, что политику можно свести к системе.
