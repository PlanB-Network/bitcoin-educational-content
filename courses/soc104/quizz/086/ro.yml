question: "Ce îi încurajează pe oameni să facă deviza lui Kant « Sapere aude »?"
answer: "Să îndrăznească să gândească pentru ei înșiși și să iasă din starea de minorat în care depind de îndrumarea unei autorități superioare"
wrong_answers:
  - "Să urmărească cunoașterea academică înscriindu-se în instituții educaționale formale și obținând acreditări"
  - "Să conteste toate formele de moralitate și să creeze sisteme etice complet noi, bazate pe dorința personală"
  - "Să caute înțelepciunea prin devoțiune religioasă și supunere față de învățăturile bisericii"
explanation: >-
  Sapere aude, însemnând „Îndrăznește să gândești pentru tine însuți”, a fost preluată de Kant de la poetul Horațiu și transformată în deviza Iluminismului. Ea simbolizează ieșirea din minorat, o stare în care oamenii sunt incapabili să își folosească propria înțelegere fără îndrumarea unei clase sau autorități superioare. Kant încurajează emanciparea și responsabilitatea deplină pentru propria gândire.
reviewed: false
