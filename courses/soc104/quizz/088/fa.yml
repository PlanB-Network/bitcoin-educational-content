question: "چرا میزس تأکید می‌کند که فردگرایی را نباید با خودبسندگی یا انسان‌گریزی اشتباه گرفت؟"
answer: "زیرا فردگرایی همکاری و انجمن‌یابی را ترویج می‌کند، به شرط آنکه بر رضایت آزاد شرکت‌کنندگان استوار باشد، و می‌پذیرد که انسان‌ها توان کامل خود را از طریق روابط داوطلبانه با دیگران پرورش می‌دهند"
wrong_answers:
  - "زیرا فردگرایی از مردم می‌خواهد به سازمان‌های مدنی اجباری بپیوندند تا مطمئن شود به خیر مشترک کمک می‌کنند"
  - "زیرا فردگرایی یعنی هر شخص باید برای خدماتی که خودش نمی‌تواند فراهم کند، کاملاً به دولت تکیه کند"
  - "زیرا فردگرایی ایجاب می‌کند مردم در همهٔ حوزه‌ها با یکدیگر رقابت کنند تا برتری شخصی خود را ثابت کنند"
explanation: >-
  میزس تأکید می‌کند که انسان موجودی اجتماعی است. فردگرایی به معنای انزوا نیست. فردگرایی همکاری و انجمن‌یابی را ترویج می‌کند، به شرط آنکه بر رضایت آزاد شرکت‌کنندگان استوار باشد. انسان فقط در رابطه با دیگران می‌تواند توان کامل خود را پرورش دهد، اما این همکاری باید داوطلبانه باشد، نه تحمیل‌شده از سوی اقتدار جمعی.
reviewed: false
