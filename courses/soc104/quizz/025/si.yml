question: "paleo-libertarianism යනු කුමක්ද?"
answer: "බලහත්කාරයේ මූලාශ්‍රයක් ලෙස state ප්‍රතික්ෂේප කිරීම, සම්ප්‍රදායික ආයතන සහ voluntary social structures ශක්තිමත් කිරීම සමඟ එකට ගෙන එන synthesis එකක්"
wrong_answers:
  - "සියලු සම්ප්‍රදායික වටිනාකම් ප්‍රතික්ෂේප කර radical social progressivism ප්‍රවර්ධනය කරන libertarian movement එකක්"
  - "යම් ආර්ථික නිදහසකට ඉඩ දෙන අතරම සම්ප්‍රදායික වටිනාකම් ක්‍රියාත්මක කිරීමට state power භාවිත කරන conservative ideology එකක්"
  - "socialist economics සහ conservative social policy අතර balanced compromise එකක් සොයන centrist philosophy එකක්"
explanation: >-
  Paleo-libertarianism යනු coercion හි institutional source ලෙස state ප්‍රතික්ෂේප කිරීම, සම්ප්‍රදායික ආයතන ශක්තිමත් කිරීම සහ state authority වෙනුවට voluntary social structures සඳහා කැමැත්තක් සමඟ එකතු කරයි. Traditional values වෙත වඩා sympathetic වීමෙන් එය neo-libertarianism වෙතින් වෙන්ව පෙනේ. Paleo-libertarian කෙනෙකු socialist හෝ communitarian principles වටා communities සංවිධානය වීමට විරුද්ධ නොවේ; ඔවුන් ප්‍රතික්ෂේප කරන්නේ එවැනි communities තම වටිනාකම් law හි බලයෙන් සියලු දෙනා මත පැනවීම පමණි.
reviewed: false
