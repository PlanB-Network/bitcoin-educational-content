question: "Какво е основното послание на Cypherpunk Manifesto на Eric Hughes от 1993 г. относно поверителността?"
answer: "Поверителността е съществена за отворено общество в електронната епоха и индивидите трябва сами да я изграждат, вместо да очакват правителства или корпорации да я гарантират"
wrong_answers:
  - "Поверителността е лукс, който трябва да бъде пожертван в замяна на национална сигурност и защита на демократичните институции"
  - "Поверителността трябва да бъде регулирана чрез международни договори, които установяват единни стандарти за защита на данните във всички държави"
  - "Поверителността е важна само за престъпници и дисиденти, докато спазващите закона граждани печелят от прозрачни системи за наблюдение"
explanation: >-
  Манифестът на Eric Hughes от 1993 г. заявява, че поверителността е съществена за отворено общество в електронната епоха и че не можем да очакваме от правителства, корпорации или други големи организации да я гарантират. Фундаменталната мотивация е, че конфиденциалността е ключов елемент на свободата и трябва да бъде изградена от самите индивиди, а не да се очаква като подарък от институциите.
reviewed: false
