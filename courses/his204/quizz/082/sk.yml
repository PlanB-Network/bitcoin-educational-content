question: Corvée, neplatená nútená práca používaná na stavbu ciest, bola jadrom jeho reforiem. Čím ju nahradil?
answer: Peňažnou daňou
wrong_answers:
  - Daňou v naturáliách (poľnohospodárskymi produktmi)
  - Nenahradil ju ničím
  - Dobrovoľným systémom
explanation: |
  Turgot nahradil corvée, neplatenú nútenú prácu, peňažnou daňou, čím rozložil záťaž stavby ciest a zbavil roľníkov tejto povinnosti.
