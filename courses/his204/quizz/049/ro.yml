question: De unde provine termenul „fiziocrație”?
answer: Însemnând „guvernarea naturii”, a fost folosit prima dată ca titlu al unei culegeri de articole ale lui Quesnay
wrong_answers:
  - Însemnând „iubirea naturii”, a fost numele adoptat de un grup de agronomi care aveau să devină în curând economiști
  - Un nume dat de greci pentru a desemna politica economică, preluat de Quesnay pentru a numi noua știință a economiei
  - Acest termen a fost inventat de Voltaire pentru a batjocori ideile lui Quesnay
explanation: |
  Termenul „fiziocrație” înseamnă „guvernarea naturii” și a fost folosit de Quesnay pentru a-și desemna doctrina economică, care sublinia importanța agriculturii și a ordinii naturale.
