question: Abbé Galiani Physiocrats සහ ධාන්‍ය වෙළඳාමේ නිදහස පිළිබඳ ඔවුන්ගේ න්‍යායට පහර දුන්නේ කුමන සාහිත්‍ය ආකාරයකින්ද?
answer: සංවාදය
wrong_answers:
  - නවකතාව
  - කවිය
  - රචනය
explanation: |
  Galiani තම "Dialogues sur le commerce des blés" තුළ Physiocrats විවේචනය කළේය. එය විවිධ චරිත අතර සංවාද ආකාරයෙන් ලියන ලද කෘතියකි.
