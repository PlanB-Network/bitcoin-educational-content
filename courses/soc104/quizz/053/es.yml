question: "¿Qué establece el principio de no agresión?"
answer: "Una persona es libre de actuar como desee siempre que no se cometa violencia contra la vida, la libertad o la propiedad de otra"
wrong_answers:
  - "El Estado tiene el derecho exclusivo de usar la fuerza para mantener el orden social"
  - "Los ciudadanos deben someterse al gobierno de la mayoría incluso cuando restringe las libertades individuales"
  - "La libertad de acción está permitida solo cuando beneficia al bien colectivo de la sociedad"
explanation: >-
  El principio de no agresión es una piedra angular de la política libertaria, y afirma que los individuos pueden actuar libremente siempre que no cometan violencia contra la vida, la libertad o la propiedad de otros. Recuerda la regla de oro presente en distintas civilizaciones. A diferencia de las otras opciones, no concede al Estado una autoridad moral especial ni subordina los derechos individuales al beneficio colectivo.
