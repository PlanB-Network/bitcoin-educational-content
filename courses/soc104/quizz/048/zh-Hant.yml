question: "在外交政策取向上，neoconservatives 與 paleoconservatives 有何區別？"
answer: "neoconservatives 為了傳播民主而正當化軍事干預主義，而 paleoconservatives 則捍衛更孤立主義的外交政策"
wrong_answers:
  - "neoconservatives 反對一切軍事行動並偏好外交，而 paleoconservatives 支持對潛在威脅先發制人"
  - "neoconservatives 專注於經濟制裁，而 paleoconservatives 主張建立國際聯盟以進行聯合軍事行動"
  - "neoconservatives 與 paleoconservatives 在外交政策上立場一致，但在國內經濟管制上差異尖銳"
explanation: >-
  從 2000 年代起，neoconservatives 越來越投入為軍事干預主義辯護，以在世界各地植入民主，尤其是在 2001 年 9 月 11 日攻擊之後。作為反應，傳統保守主義者聲稱「paleoconservative」標籤，以區別於 neoconservatives。Paleoconservatives 批評軍事干預主義，捍衛更孤立主義的外交政策，並更強調民族與文化身份。
reviewed: false
