question: "Hur skiljer sig rollerna för Cato Institute, Mises Institute och Libertarian Party inom den libertarianska rörelsen?"
answer: "Cato Institute fokuserar på offentliga policyförslag, Mises Institute på utbildning och akademisk publicering, och Libertarian Party på valpolitik"
wrong_answers:
  - "Cato Institute finansierar politiska kampanjer, Mises Institute lobbar direkt mot kongressen, och Libertarian Party organiserar akademiska konferenser"
  - "Cato Institute publicerar ekonomiska läroböcker, Mises Institute driver väljarregistreringskampanjer, och Libertarian Party utformar lagförslag"
  - "Cato Institute organiserar gräsrotsprotester, Mises Institute tillhandahåller juridiskt försvar för libertarianer, och Libertarian Party hanterar tankesmedjeforskning"
explanation: >-
  Cato Institute (grundat 1977) är en Washington-baserad tankesmedja som arbetar med offentliga policyförslag. Mises Institute (grundat 1982) fokuserar på utbildning snarare än politisk lobbying och fungerar som ett slags onlineuniversitet med konferenser och återpublicerade verk. Libertarian Party (grundat 1971) är det tredje största amerikanska politiska partiet och deltar i val där även dess röstetal på ungefär 2 % kan avgöra utfall.
reviewed: false
