question: "Ce cred libertaires francezi (anarhiști socialiști) despre proprietatea privată?"
answer: "Proprietatea privată și capitalismul trebuie abolite deoarece sunt surse de opresiune"
wrong_answers:
  - "Proprietatea privată este un drept natural care precedă statul și trebuie protejat cu orice preț"
  - "Proprietatea privată ar trebui reglementată de stat, dar niciodată eliminată complet din societate"
  - "Proprietatea privată este acceptabilă doar atunci când este distribuită egal între toți membrii unei comune"
explanation: >-
  Libertaires francezi, moștenitori ai anarhismului socialist prin gânditori precum Proudhon și Bakunin, susțin că atât statul, cât și proprietatea privată trebuie abolite ca surse gemene de opresiune. Acest lucru este surprins în celebra formulă a lui Proudhon „Proprietatea este furt.” Primul răspuns greșit descrie poziția libertariană, care este fundamental opusă perspectivei libertaire.
