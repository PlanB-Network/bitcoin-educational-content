question: "Cum tratează un libertarian conservator cultural comportamentele pe care le dezaprobă moral?"
answer: "Se opune acelor comportamente și le descurajează prin persuasiune și exemplu, dar fără a recurge la forța coercitivă a legii"
wrong_answers:
  - "Susține interdicții ale guvernului local asupra acelor comportamente, opunându-se în același timp interdicțiilor la nivel federal"
  - "Rămâne complet tăcut în privința acelor comportamente, crezând că orice formă de dezaprobare încalcă libertatea individuală"
  - "Pledează pentru tribunale comunitare care pot pedepsi acele comportamente în afara sistemului juridic formal"
explanation: >-
  Libertarianul conservator cultural poate dezaproba moral anumite comportamente, dar nu susține interzicerea legală a acțiunilor consensuale, neagresive. Astfel de acțiuni îi pot displăcea, li se poate opune și le poate descuraja activ, dar întotdeauna prin persuasiune, educație și exemplu, mai degrabă decât prin forța coercitivă a legii. Nu este vorba despre a rămâne tăcut sau despre a crea mecanisme alternative de aplicare a sancțiunilor.
reviewed: false
