question: Quelle est l'importance du pluralisme juridique dans l'analyse d'Harold J. Berman ?
answer: Il a conduit à une fragmentation du pouvoir.
wrong_answers:
  - Il a favorisé la liberté individuelle.
  - Il a établi un code juridique unique et unifié à travers l'Europe.
  - Il a stimulé l'innovation.
explanation: |
  Harold J. Berman souligne que le pluralisme juridique a fragmenté le pouvoir entre des juridictions concurrentes, empêchant sa concentration excessive. Cette fragmentation est devenue un moteur de liberté et d'innovation dans la tradition juridique occidentale.
reviewed: true
