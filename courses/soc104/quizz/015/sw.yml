question: "Ni nini kinachoainisha sehemu ya chini ya mhimili wa uhuru wa binafsi kwenye mchoro wa Nolan?"
answer: "Upendeleo kwa utaratibu, usalama, maadili ya kimapokeo, na dola kudhibiti maadili na kudumisha utulivu wa umma"
wrong_answers:
  - "Upendeleo kwa uhuru wa mtu binafsi, uvumilivu, na uingiliaji mdogo wa dola katika chaguo za maisha ya binafsi"
  - "Upendeleo kwa kuondolewa kwa udhibiti wa kiuchumi, biashara huru, na kufutwa kwa ushuru wa forodha na ruzuku"
  - "Upendeleo kwa ugawaji upya wa utajiri, kodi kubwa, na utaifishaji wa viwanda muhimu"
explanation: >-
  Sehemu ya chini ya mhimili wa uhuru wa binafsi inawakilisha udhibiti mkubwa zaidi wa dola juu ya maisha ya binafsi, ukiainishwa na upendeleo kwa utaratibu, usalama, na maadili ya kimapokeo. Dola hudhibiti maadili, hudumisha utulivu wa umma, na inaweza kutetea maono maalum ya maadili au mapokeo. Sehemu ya juu ya mhimili inawakilisha kinyume chake: uhuru wa mtu binafsi na uvumilivu. Sera za kiuchumi hupimwa kwenye mhimili tofauti wa mlalo.
