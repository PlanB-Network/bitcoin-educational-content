question: "Milline põhimõtteline lõhe eraldas sotsialiste alates kahekümnenda sajandi algusest?"
answer: "Revolutsioonilised sotsialistid, kes püüdsid võimu haarata vägivalla kaudu, vastandusid reformistlikele sotsialistidele, kes taotlesid muutust demokraatlike valimiste kaudu"
wrong_answers:
  - "Linnasotsialistid, kes keskendusid tööstustöölistele, vastandusid maasotsialistidele, kes korraldasid põllumajanduslikke kommuune"
  - "Natsionalistlikud sotsialistid, kes eelistasid oma riiki, vastandusid internatsionalistlikele sotsialistidele, kes pooldasid ülemaailmset revolutsiooni"
  - "Intellektuaalsed sotsialistid, kes kirjutasid teoreetilisi tekste, vastandusid aktivistlikele sotsialistidele, kes korraldasid tööliste streike"
explanation: >-
  Alates kahekümnenda sajandi algusest eraldas põhimõtteline lõhe revolutsioonilisi sotsialiste, kes olid omandiõiguste vastu ja püüdsid hävitada kapitalistlikku ühiskonda vägivalla või proletariaadi diktatuuri kaudu, reformistlikest sotsialistidest, kes taotlesid sotsiaalset õiglust demokraatlike valimiste ja maksustamise kaudu, aktsepteerides kapitalismi ajutiselt. See lõhe kujundas kogu sotsialistlike liikumiste hilisema ajaloo.
reviewed: false
