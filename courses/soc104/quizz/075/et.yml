question: "Milline järjekindel muster eristab tsentristlikku meetodit teiste poliitiliste perekondade seisukohtadest kõigis viies majandusdebatis (maksud, miinimumpalk, tervishoid, keskkond, toetused)?"
answer: "Tsentristid keelduvad pühendumast kindlale põhimõttele ja nõuavad selle asemel empiirilist analüüsi ning ekspertide hinnangut, et määrata poliitika juhtumipõhiselt, muutes nende lähenemise olemuslikult tehnokraatlikuks"
wrong_answers:
  - "Tsentristid võtavad alati sotsialistliku ja konservatiivse seisukoha vahelise keskmise positsiooni, jagades erinevuse igas küsimuses võrdselt"
  - "Tsentristid seavad järjekindlalt majanduskasvu sotsiaalsest heaolust ettepoole, olles fiskaalpoliitikas libertaaride poolel ja nõustudes sotsialistidega regulatsiooni osas"
  - "Tsentristid delegeerivad kõik majandusotsused rahvusvahelistele organisatsioonidele ja kaubanduslepingutele, selle asemel et kujundada sõltumatut riiklikku poliitikat"
explanation: >-
  Kõigis viies majandusdebatis järgib tsentristlik lähenemine sama mustrit: kindlale ideoloogilisele põhimõttele pühendumise asemel nõuavad tsentristid enne otsuste tegemist empiirilisi tõendeid ja ekspertide hinnangut. Maksude puhul tuleb õige tase määrata analüüsi abil. Miinimumpalga puhul tuleb taset pragmaatiliselt kohandada. Tervishoiu puhul on ideaalne ekspertide kalibreeritud segu. Keskkonna puhul peab poliitika tasakaalustama konkurentsivõimet. Toetuste puhul tuleb iga juhtumit hinnata selle enda väärtuste alusel. See muudab tsentrismi olemuslikult tehnokraatlikuks, mis erineb lihtsalt vahe jagamisest või rahvusvahelistele organitele delegeerimisest.
reviewed: false
