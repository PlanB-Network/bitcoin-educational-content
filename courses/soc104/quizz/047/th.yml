question: "Michael Oakeshott อธิบายอนุรักษนิยมในงานปรัชญาของเขาอย่างไร?"
answer: "ในฐานะอุปนิสัยและทัศนคติต่อชีวิต มากกว่าอุดมการณ์เชิงระบบที่แข็งทื่อ"
wrong_answers:
  - "ในฐานะทฤษฎีเศรษฐกิจครอบคลุมพร้อมข้อกำหนดนโยบายที่แม่นยำสำหรับทุกด้านของรัฐบาล"
  - "ในฐานะขบวนการปฏิวัติที่มุ่งรื้อถอนสถาบันสมัยใหม่และกลับไปสู่สังคมก่อนอุตสาหกรรม"
  - "ในฐานะหลักคำสอนทางศาสนาล้วน ๆ ที่ตั้งอยู่บนเทววิทยาคริสต์และอำนาจศาสนจักร"
explanation: >-
  Michael Oakeshott นักปรัชญาชาวอังกฤษ ปกป้องมโนทัศน์ของอนุรักษนิยมในฐานะอุปนิสัย มากกว่าอุดมการณ์เชิงระบบ เรียงความ On Being Conservative (1956) ของเขายังคงเป็นแหล่งอ้างอิงสำคัญ มุมมองต่ออนุรักษนิยมในฐานะอุปนิสัยนี้ยังมีอิทธิพลต่อ Friedrich Hayek ด้วย แนวทางของ Oakeshott โดดเด่นจากการวิจารณ์ rationalism ในการเมือง โดยปฏิเสธแนวคิดว่าการเมืองสามารถถูกลดทอนให้เป็นระบบหนึ่งได้
reviewed: false
