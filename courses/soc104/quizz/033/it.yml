question: "Come vedono i libertariani il rapporto tra proprietà privata e libertà?"
answer: "La proprietà privata è un diritto naturale che precede la legge e lo Stato, ed è il fondamento stesso della libertà"
wrong_answers:
  - "La proprietà privata è una convenzione sociale creata dallo Stato che può essere revocata quando causa disuguaglianza"
  - "La proprietà privata è utile per l'efficienza economica ma non ha alcun significato morale o filosofico intrinseco"
  - "La proprietà privata dovrebbe esistere solo per i beni personali, non per i beni produttivi o la terra"
explanation: >-
  I libertariani difendono la proprietà privata come un diritto naturale che precede la legge e lo Stato. Sostengono che, se un individuo possiede il proprio corpo, possiede anche il proprio lavoro e i suoi frutti. La proprietà dei beni materiali è un'estensione della proprietà di sé. Questo contrasta nettamente con la visione libertaire secondo cui la proprietà è una convenzione sociale o una fonte di oppressione.
reviewed: false
