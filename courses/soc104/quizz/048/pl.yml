question: "Kto jest często wskazywany jako założycielska postać nowoczesnego konserwatyzmu?"
answer: "Edmund Burke, który opowiadał się za zachowaniem instytucji i tradycji wobec radykalnych zmian rewolucji francuskiej"
wrong_answers:
  - "Karl Marx, który w XIX wieku rozwinął teorię walki klas i materializmu historycznego"
  - "John Locke, który w XVII wieku sformułował teorię praw naturalnych i umowy społecznej"
  - "Adam Smith, który napisał The Wealth of Nations i założył dyscyplinę ekonomii klasycznej"
explanation: >-
  Edmund Burke jest często wskazywany jako założycielska postać konserwatyzmu ze względu na swój sprzeciw wobec rewolucji francuskiej. Jego Reflections on the Revolution in France (1790) broniły roztropności i stopniowej reformy zamiast radykalnej zmiany. Uważał, że społeczeństwo powinno iść naprzód nie przez zaczynanie od czystej karty, lecz poprzez stopniowe reformy zachowujące sprawdzone instytucje i tradycje.
reviewed: false
