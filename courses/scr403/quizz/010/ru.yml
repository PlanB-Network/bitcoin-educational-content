question: Как в системе типов Simplicity строятся векторы фиксированной длины?
answer: Через вложенные типы произведений длиной, равной степени двойки (например, A⁴ = A² × A²).
wrong_answers:
  - С помощью специального конструктора типа массива, встроенного в язык.
  - Через рекурсивные суммарные типы, связывающие элементы в цепочку в виде списка.
  - С помощью буферов переменной длины, имеющих фиксированный максимальный размер.
explanation: >-
  Simplicity строит векторы из вложенных типов произведений. A² — это
  A × A, A⁴ — это A² × A², A⁸ — это A⁴ × A⁴ и так далее. Это даёт
  коллекции размером, равным степени двойки. Например, 𝟚²⁵⁶ (256-битный
  хеш) строится путём вложения произведений на 8 уровней вглубь, начиная
  от булева типа.
reviewed: false
