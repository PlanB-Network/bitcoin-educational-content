question: "Sự phân biệt then chốt của Hannah Arendt giữa chế độ chuyên chế cổ điển và chủ nghĩa toàn trị là gì?"
answer: "Chủ nghĩa toàn trị không chỉ đặt con người dưới các quy tắc chuyên chế mà còn khiến con người mất khả năng hành động độc lập, phủ định chính trị tự thân"
wrong_answers:
  - "Chế độ chuyên chế cổ điển kiểm soát nền kinh tế trong khi chủ nghĩa toàn trị chỉ kiểm soát các thiết chế chính trị và quân sự"
  - "Chủ nghĩa toàn trị đơn giản là một phiên bản cực đoan hơn của chế độ chuyên chế, chỉ khác ở quy mô đàn áp"
  - "Chế độ chuyên chế cổ điển dùng ý thức hệ để biện minh cho sự cai trị, trong khi chủ nghĩa toàn trị chỉ dựa thuần túy vào lực lượng quân sự"
explanation: >-
  Arendt lập luận rằng chủ nghĩa toàn trị khác về căn bản với chế độ chuyên chế cổ điển. Nó không đơn giản là một hình thức bạo chúa cực đoan hơn, mà là một hệ thống khiến con người trở nên thừa thãi, phá hủy năng lực hành động độc lập của họ. Với Arendt, chính trị là năng lực của một dân tộc tự nắm lấy vận mệnh của mình, và chủ nghĩa toàn trị chính là sự phủ định năng lực đó, khiến nó khác về chất so với chế độ chuyên chế.
