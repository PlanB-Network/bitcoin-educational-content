question: "Centrism किस form of governance की ओर tend करता है?"
answer: "Technocracy, जहाँ power experts को entrusted होती है जो economy और monetary policy steer करते हैं"
wrong_answers:
  - "Direct democracy, जहाँ citizens हर major policy decision पर vote करते हैं"
  - "Aristocracy, जहाँ power एक traditional ruling class के पास होती है"
  - "Laissez-faire governance, जहाँ market state intervention के बिना स्वयं regulate करता है"
explanation: >-
  Centrism efficiency और pragmatism को privilege करता है, और technocracy की ओर tend करता है, जिसका अर्थ है कि power experts को entrusted होनी चाहिए जो economy steer और monetary policy pilot करें। यह direct democracy, aristocracy या laissez-faire से fundamentally different है, जिनमें से हर एक entirely different principles के अनुसार power distribute करता है।
reviewed: false
