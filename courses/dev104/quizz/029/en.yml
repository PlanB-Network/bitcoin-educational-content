question: When organizing CSS code for maintainability, what naming convention uses double underscores and double hyphens to create structured class names like 'wallet-card__title--highlighted'?
answer: BEM (Block Element Modifier) methodology
wrong_answers:
  - SMACSS (Scalable and Modular Architecture for CSS)
  - OOCSS (Object-Oriented CSS) methodology
  - ITCSS (Inverted Triangle CSS) architecture
explanation: |
  BEM (Block Element Modifier) is the correct naming convention that uses specific separators: single hyphens for word separation within names, double underscores (__) to separate elements from blocks, and double hyphens (--) to separate modifiers. In the example 'wallet-card__title--highlighted', 'wallet-card' is the block, 'title' is the element, and 'highlighted' is the modifier. While SMACSS, OOCSS, and ITCSS are legitimate CSS methodologies, they don't use this specific double underscore and double hyphen naming pattern that makes BEM distinctive and easily recognizable in codebases.
