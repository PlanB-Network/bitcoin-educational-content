question: "在社會主義哲學的語境中，holism 一詞是什麼意思？"
answer: "一種將社會視為不可分割整體的觀點，其中集體優先於個人"
wrong_answers:
  - "一種把每個個人都視為自足單位的哲學，其權利不能被任何群體凌駕"
  - "一種主張以同等比例平衡公部門與私部門的經濟理論"
  - "一種把所有少數觀點整合進單一共識型平台的政治策略"
explanation: >-
  Holism 源自希臘文 holos，意思是「整體」。在社會主義思想中，它指的是一種將社會視為不可分割整體的觀點，而不是把社會看成個人的簡單總和。社會主義國家旨在最大程度地接管並指導人類活動。這個集體可以被表述為社會階級、民族、種族或性別，但在每一種情況中，個人都是由其群體歸屬來界定。
reviewed: false
