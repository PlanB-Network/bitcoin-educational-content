question: فشرده‌سازی SHA-256 به یک jet تبدیل می‌شود، اما ترکیب‌گرهای fold و map نمی‌توانند. چه چیزی این عدم تقارن را توضیح می‌دهد؟
answer: یک jet یک عبارت ثابت را جایگزین می‌کند؛ fold و map عبارت‌های واحدی نیستند بلکه طرح‌واره‌هایی هستند که برای هر تابع داخلی f یکی متفاوت تولید می‌کنند.
wrong_answers:
  - jetها فقط کد بی‌انشعاب را شتاب می‌دهند، بنابراین ترکیب‌گرهای تکرارشونده باید اول باز شوند و سپس با هیچ jetی مطابقت نمی‌یابند.
  - فقط عبارت‌هایی واجد شرایط هستند که اثبات ماشین‌بررسی‌شدهٔ Rocq داشته باشند، که برای SHA-256 وجود دارد اما برای foldها نه.
  - foldها روی بردارهای کوتاه آن‌قدر ارزان‌اند که سودی ندارند، پس jetها برای عملیات رمزنگاری پرهزینه نگه داشته می‌شوند.
explanation: >-
  یک jet جایگزینی بومی برای یک عبارت مشخص و کاملاً شکل‌گرفتهٔ Simplicity است،
  که نودها می‌توانند آن را با حفظ معنای دقیقش جایگزین کنند. fold-right-n، map،
  zip و گونه‌های آن‌ها عبارت‌های واحدی نیستند، بلکه طرح‌های ساخت هستند: هر انتخاب
  از تابع داخلی f یک عبارت ساختاری متفاوت تولید می‌کند، پس هیچ jet واحدی نمی‌تواند
  نمایندهٔ کل خانواده باشد. به همین دلیل این الگوهای تکرار در برنامه‌های واقعی
  به‌صورت کد ترکیب‌گری حقیقی ظاهر می‌شوند، که معمولاً توسط زبان‌های سطح‌بالاتر
  مانند SimplicityHL تولید می‌شود.
reviewed: false
