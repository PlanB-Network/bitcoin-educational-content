question: "Why do libertarians oppose taxation?"
answer: "Because it is a moral violation of property rights, a form of state theft that seizes another's property without consent"
wrong_answers:
  - "Because taxes are economically inefficient and always lead to higher unemployment rates"
  - "Because taxation discourages foreign investment and weakens a country's competitive position"
  - "Because progressive tax systems unfairly target wealthy individuals who create the most jobs"
explanation: >-
  The libertarian objection to taxation is moral before it is economic. Libertarians view taxation as a form of state theft and an impediment to private property because it consists of seizing another's property without consent. While there may be economic arguments against taxation, the foundational libertarian argument rests on the principle that it violates property rights, not on calculations of efficiency or competitiveness.
reviewed: false
