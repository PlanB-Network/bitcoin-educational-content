question: "Why does the chapter describe pre-sales as the ultimate form of validation?"
answer: "Because getting customers to pay before the product is built simultaneously validates demand, revenue model, and cash flow"
wrong_answers:
  - "Because pre-sales generate media coverage that attracts venture capital investors to the startup"
  - "Because they allow the founder to skip the prototyping phase and move directly to production"
  - "Because early revenue eliminates the need for any further customer interviews or market research"
explanation: >-
  Pre-sales are described as the ultimate validation because they simultaneously prove three things: market demand exists, the revenue model works, and cash flow is viable. The chapter notes this is rare and extremely difficult to achieve, but when it happens, the founder receives money upfront and delivers afterward. It does not eliminate the need for continued research or allow skipping earlier phases.
reviewed: false
