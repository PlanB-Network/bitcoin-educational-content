question: "Rothbard 為什麼批判 libertaires 的人性觀，而他提出了什麼替代方案？"
answer: "他指責他們抱持天真的「高貴野蠻人」觀點，並主張社會必須運用私有財產與良好誘因來引導自利行為"
wrong_answers:
  - "他稱讚他們對人類合作的理解，但主張仍然需要一個最低限度的國家來執行契約"
  - "他同意人類天性本善，但堅持只有自由市場才能把這種善導向生產活動"
  - "他拒絕他們對個人權利的強調，轉而主張社群應集體定義道德標準"
explanation: >-
  Rothbard 批判 libertaires 採用一種天真的、近似 Rousseau 的人性觀，認為人天生是善的。相反地，他主張人受自利引導，而社會必須被組織成讓良好誘因引導行為的形式。這需要承認並保障私有財產。廢除國家並不意味著廢除其功能；警察與司法應透過競爭由自由市場管理。
reviewed: false
