question: "Comment Ron Paul a-t-il illustré la position paléo-libertarienne sur des questions comme la consommation de drogues et l'avortement ?"
answer: "Il déconseillait personnellement la consommation de drogues et s'opposait à l'avortement, mais politiquement il combattait l'interdiction fédérale et affirmait que les choix devaient être laissés aux individus ou aux États fédérés"
wrong_answers:
  - "Il soutenait la légalisation fédérale de toutes les drogues et de l'avortement au nom des droits individuels absolus"
  - "Il faisait campagne pour des interdictions fédérales strictes des drogues comme de l'avortement, fondées sur ses convictions morales personnelles"
  - "Il refusait d'exprimer la moindre opinion personnelle sur ces sujets, affirmant que les responsables politiques doivent rester moralement neutres"
explanation: >-
  Ron Paul illustre la synthèse paléo-libertarienne en séparant les convictions morales personnelles de la coercition politique. Il a toujours déconseillé la consommation de drogues tout en s'opposant simultanément à la prohibition des drogues. Il était personnellement opposé à l'avortement, mais soutenait que le choix devait être laissé aux États fédérés plutôt qu'imposé d'en haut. Cela montre comment on peut avoir de fortes valeurs traditionnelles tout en refusant d'utiliser le pouvoir coercitif du gouvernement fédéral pour les imposer.
reviewed: false
