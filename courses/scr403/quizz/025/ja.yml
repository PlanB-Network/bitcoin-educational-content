question: "Simplicity プログラムの型は何ですか？"
answer: 1 ⊢ 1（unit から unit）— 意味のある入力や出力はなく、副作用が I/O を担います。
wrong_answers:
  - TxEnv ⊢ Bool — トランザクションデータを受け取り、有効性のブール値を返す。
  - 2^256 ⊢ 2^256 — ハッシュ入力を受け取り、新しいハッシュ出力値を返す。
  - 任意の型 A ⊢ B — プログラムは完全に任意の入力型と出力型を持てる。
explanation: >-
  Simplicity プログラムは、型 1 ⊢ 1 の式として定義されます。Reader エフェクトは
  トランザクション環境入力を捕捉し、Failure エフェクトは成功または失敗を決定します。
  これらの副作用が、Simplicity の型そのものではなく、すべての I/O を処理します。
reviewed: true
