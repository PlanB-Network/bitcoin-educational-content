question: "What does the right want to legislate on?"
answer: "Morality and religion, driven by a desire to preserve traditional institutions and social hierarchies"
wrong_answers:
  - "The economy and financial markets, driven by a desire to reduce inequality and redistribute wealth"
  - "Science and education, driven by a desire to control what is taught in public schools"
  - "International trade and diplomacy, driven by a desire to expand national influence abroad"
explanation: >-
  The right gives priority to personal morality and traditional values. It considers that civilization is built on certain traditional institutions and social hierarchies that must be preserved, and it wants to legislate on morality and religion. The left, not the right, focuses on legislating the economy. Science, education, and trade policy are not the primary focus described for the right.
reviewed: false
