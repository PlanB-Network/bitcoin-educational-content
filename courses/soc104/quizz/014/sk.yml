question: "Prečo dvojrozmerný model tvrdí, že väčšinu politických otázok možno rozdeliť na ekonomické a osobné kategórie?"
answer: "Pretože ekonomické otázky sa týkajú toho, čo robíte ako producent a spotrebiteľ, zatiaľ čo osobné otázky sa týkajú vašich súkromných vzťahov, presvedčení a telesnej autonómie"
wrong_answers:
  - "Pretože všetky politické debaty sa napokon redukujú na nezhody o úrovni zdanenia a náboženských praktikách"
  - "Pretože vlády historicky regulujú iba dve veci: trh a armádu"
  - "Pretože politickí filozofi od staroveku vždy oddeľovali materiálne otázky od duchovných otázok"
explanation: >-
  Dvojrozmerný model je založený na myšlienke, že politické otázky sa delia na dve široké kategórie. Ekonomické slobody zahŕňajú výrobu, spotrebu, obchod, zamestnanie a správu peňazí. Osobné slobody zahŕňajú súkromné vzťahy, názory, presvedčenia a voľby týkajúce sa vlastného tela a mysle. Toto oddelenie umožňuje oveľa nuansovanejšie mapovanie politických pozícií než jediná ľavicovo-pravicová os.
