question: "在保守主义政治哲学中，什么优先于自由？"
answer: "秩序和传统，它们必须先被牢固建立，自由才可能受到重视"
wrong_answers:
  - "社会正义和平等，它们必须先得到保障，个人才能真正自由"
  - "经济效率和务实结果，它们决定自由在何时是适当的"
  - "个人财产权，它必须在任何其他自由被授予之前受到保护"
explanation: >-
  对保守主义者而言，秩序和传统优先于自由。他们认为，过多自由会制造混乱和社会无序，因此只有在秩序已经牢固建立之后，自由才可能受到重视。这与优先考虑正义的社会主义观点，或中间主义对效率的关注形成对比。
