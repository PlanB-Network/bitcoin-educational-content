question: "With what political development did the massive growth of the state coincide?"
answer: "The arrival of universal suffrage at the end of the 19th and beginning of the 20th century."
wrong_answers:
  - "The invention of the printing press."
  - "The fall of the Roman Empire."
  - "The end of the Cold War."
explanation: |
  Before the 20th century, state spending ran around 5-10% of GDP. Exactly when universal suffrage arrived, the modern state began its climb — a coincidence the course argues is no coincidence.
