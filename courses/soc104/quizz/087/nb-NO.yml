question: "Hva oppmuntrer Kants motto 'Sapere aude' folk til å gjøre?"
answer: "Å våge å tenke selv og tre ut av umyndighetens tilstand der de er avhengige av ledelsen fra en overordnet autoritet"
wrong_answers:
  - "Å søke akademisk kunnskap ved å melde seg inn i formelle utdanningsinstitusjoner og oppnå kvalifikasjoner"
  - "Å utfordre alle former for moral og skape helt nye etiske systemer basert på personlig begjær"
  - "Å søke visdom gjennom religiøs hengivenhet og underkastelse under kirkens lære"
explanation: >-
  Sapere aude, som betyr "Våg å tenke selv", ble hentet av Kant fra poeten Horats og gjort til opplysningstidens motto. Det symboliserer utgangen fra umyndighet, en tilstand der mennesker er ute av stand til å bruke sin forstand uten ledelsen fra en overordnet klasse eller autoritet. Kant oppmuntrer til frigjøring og fullt ansvar for egen tenkning.
reviewed: false
