question: "Като се има предвид пълният аргумент на този курс, как Bitcoin едновременно въплъщава либертарианската критика на конструктивизма, cypherpunk ангажимента към действие и индивидуалистическата защита на моралната автономия?"
answer: "Bitcoin заменя централно планираните пари със спонтанен пазарен ред (антиконструктивизъм), превръща абстрактния идеал за финансова свобода в работещ код (cypherpunk действие) и възстановява суверенната собственост и поверителността на индивида (морална автономия)"
wrong_answers:
  - "Bitcoin използва демократично управление, за да задава парична политика (антиконструктивизъм), публикува образователно съдържание за финансовата свобода (cypherpunk действие) и позволява на индивидите да гласуват за промени в протокола (морална автономия)"
  - "Bitcoin премахва всяка финансова регулация (антиконструктивизъм), създава общност от разработчици, които лобират за дерегулация (cypherpunk действие), и дава на богатите индивиди повече контрол върху паричната политика (морална автономия)"
  - "Bitcoin децентрализира сървърната инфраструктура в множество държави (антиконструктивизъм), използва open-source лицензиране, за да споделя технологията свободно (cypherpunk действие), и предоставя анонимни социални медийни платформи за политическо несъгласие (морална автономия)"
explanation: >-
  Bitcoin стои на пресечната точка на три интелектуални традиции, разгледани в курса. Той въплъщава антиконструктивисткия аргумент, като заменя централно планираните фиатни пари със спонтанен, децентрализиран паричен ред, който никой централен плановик не може да контролира. Той изпълнява cypherpunk императива да се пише код, като превръща абстрактните идеали за финансова свобода и поверителност в работеща технология. И служи на индивидуалистическата защита на моралната автономия, като позволява суверенна собственост, защитава плодовете на труда и запазва поверителността, оставяйки всеки човек да бъде господар на собствения си живот.
