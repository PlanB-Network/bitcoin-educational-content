question: "Какво фундаментално разделение отделя социалистите от началото на XX век нататък?"
answer: "Революционни социалисти, които се стремят да завземат властта чрез насилие, срещу реформаторски социалисти, които преследват промяна чрез демократични избори"
wrong_answers:
  - "Градски социалисти, които се фокусират върху индустриалните работници, срещу селски социалисти, които организират земеделски комуни"
  - "Националистически социалисти, които приоритизират собствената си страна, срещу интернационалистически социалисти, които защитават глобална революция"
  - "Интелектуални социалисти, които пишат теоретични текстове, срещу активистки социалисти, които организират работнически стачки"
explanation: >-
  От началото на XX век фундаментално разделение отделя революционните социалисти, които се противопоставят на правата на собственост и се стремят да унищожат капиталистическото общество чрез насилие или диктатура на пролетариата, от реформаторските социалисти, които преследват социална справедливост чрез демократични избори и данъчно облагане, като временно приемат капитализма. Това разцепление оформя цялата последваща история на социалистическите движения.
