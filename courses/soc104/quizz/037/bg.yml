question: "Какво представлява принципът на неагресия, както е теоретизиран от Murray Rothbard?"
answer: "Нелегитимно е да се инициира физическа сила срещу друг индивид или неговата собственост, макар че защитното насилие е допустимо"
wrong_answers:
  - "Всички форми на насилие винаги са погрешни, включително самозащитата и съпротивата срещу потисничество"
  - "Насилието е приемливо, когато е насочено срещу потиснически институции, но никога срещу други индивиди"
  - "Само държавата има легитимното право да използва сила и индивидите никога не трябва да прибягват до насилие"
explanation: >-
  Принципът на неагресия на Rothbard гласи, че инициирането на физическа сила срещу друг човек или неговата собственост е нелегитимно. Това е философски превод на златното правило. Той обаче не забранява всяко насилие: защитното насилие, включително самозащитата и съпротивата срещу потисничество, се смята за легитимно. Това го отличава от чистия пацифизъм и от претендирания от държавата монопол върху силата.
reviewed: false
