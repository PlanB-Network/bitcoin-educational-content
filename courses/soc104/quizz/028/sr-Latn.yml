question: "O čemu desnica želi da donosi zakone?"
answer: "O moralu i religiji, zbog želje da očuva tradicionalne institucije i društvene hijerarhije"
wrong_answers:
  - "O ekonomiji i finansijskim tržištima, zbog želje da smanji nejednakost i preraspodeli bogatstvo"
  - "O nauci i obrazovanju, zbog želje da kontroliše šta se predaje u javnim školama"
  - "O međunarodnoj trgovini i diplomatiji, zbog želje da proširi nacionalni uticaj u inostranstvu"
explanation: >-
  Desnica daje prednost ličnom moralu i tradicionalnim vrednostima. Smatra da je civilizacija izgrađena na određenim tradicionalnim institucijama i društvenim hijerarhijama koje moraju biti očuvane, i želi da donosi zakone o moralu i religiji. Levica, a ne desnica, fokusira se na donošenje zakona o ekonomiji. Nauka, obrazovanje i trgovinska politika nisu primarni fokus opisan za desnicu.
