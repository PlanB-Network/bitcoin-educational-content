question: "Koja je libertarijanska pozicija o pitanju gej braka?"
answer: "Država nema šta da definiše brak; treba ga privatizovati i prepustiti pojedincima, udruženjima i verskim institucijama"
wrong_answers:
  - "Gej brak treba legalizovati jer svi građani zaslužuju jednak tretman pred zakonom"
  - "Gej brak treba zabraniti jer je tradicionalni brak fundamentalna institucija za rađanje"
  - "Gej brak treba legalizovati, ali samo kroz zaseban pravni okvir odvojen od tradicionalnog braka"
explanation: >-
  Libertarijanci tvrde da je pitanje braka fundamentalno pogrešno postavljeno jer je postavljeno u etatističkim terminima. Oni smatraju da država nema šta da se meša u privatne živote, pa je rešenje da se brak potpuno odvoji od države. Nametanjem jedne definicije, država stvara sukobe. Prvi pogrešan odgovor odražava socijalističku ili centrističku poziciju, a drugi konzervativnu poziciju.
