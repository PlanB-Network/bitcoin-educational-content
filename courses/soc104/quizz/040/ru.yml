question: "Как финансируемые государством программы социальной помощи могут порождать извращённые эффекты, иллюстрируя опасность опоры только на намерения?"
answer: "Они могут создавать зависимость, устранять стимулы к труду и становиться формой грабежа, поскольку деньги сначала должны быть взяты у тех, кто произвёл богатство"
wrong_answers:
  - "Они поощряют чрезмерные личные сбережения, сокращают потребительские расходы и вызывают дефляцию в более широкой экономике"
  - "Они укрепляют частное предпринимательство, перекладывая трудовые издержки на государство и уменьшая необходимость конкурентных зарплат"
  - "Они настолько полностью устраняют классовые различия, что социальная мобильность становится ненужной, а инновации стагнируют"
explanation: >-
  Фридман предупреждает, что благие намерения могут приводить к вредным последствиям, когда они пренебрегают строгим анализом человеческих стимулов. Финансируемые государством программы помощи рискуют создавать зависимость, не порождать никаких стимулов к труду и составлять форму грабежа, поскольку средства сначала должны быть взяты у создателей богатства. Измеримые результаты, такие как снижение бедности и эффективность, должны иметь приоритет над благородными намерениями.
reviewed: false
