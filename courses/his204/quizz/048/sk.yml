question: Rok 1757 znamenal zrod fyziokracie. Ktoré dva články Quesnay publikoval v Encyklopédii?
answer: Farmári a Obilie
wrong_answers:
  - Záujem o peniaze a poľnohospodárstvo
  - Obrábanie pôdy a rotácia plodín
  - Dane a Obchod
explanation: |
  Quesnay publikoval články "Farmári" a "Obilie" v Diderotovej a d'Alembertovej Encyklopédii, čím sa zrodila fyziokracia ako škola ekonomického myslenia.
