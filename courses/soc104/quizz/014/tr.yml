question: "Nolan diyagramında kişisel özgürlük ekseninin altını ne karakterize eder?"
answer: "Düzen, güvenlik, geleneksel değerler ve devletin ahlakı düzenleyip kamu düzenini koruması tercihi"
wrong_answers:
  - "Bireysel özerklik, hoşgörü ve kişisel yaşam tercihlerinde asgari devlet müdahalesi tercihi"
  - "Ekonomik düzenlemelerin azaltılması, serbest ticaret ve gümrük tarifeleri ile sübvansiyonların kaldırılması tercihi"
  - "Servetin yeniden dağıtımı, yüksek vergiler ve kilit sektörlerin millileştirilmesi tercihi"
explanation: >-
  Kişisel özgürlük ekseninin altı, düzen, güvenlik ve geleneksel değerler tercihiyle karakterize edilen, kişisel yaşam üzerinde azami devlet denetimini temsil eder. Devlet ahlakı düzenler, kamu düzenini korur ve belirli bir ahlak ya da gelenek vizyonunu savunabilir. Eksenin üstü bunun karşıtını temsil eder: bireysel özgürlük ve hoşgörü. Ekonomi politikaları ayrı yatay eksende ölçülür.
