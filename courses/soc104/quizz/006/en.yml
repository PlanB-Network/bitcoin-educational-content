question: "What are the two axes of the Nolan diagram?"
answer: "A vertical axis measuring personal freedoms and a horizontal axis measuring economic freedoms"
wrong_answers:
  - "A horizontal axis from left to right and a vertical axis from authoritarian to democratic"
  - "A vertical axis measuring wealth and a horizontal axis measuring education levels"
  - "A horizontal axis from socialism to capitalism and a vertical axis from tradition to progress"
explanation: >-
  David Nolan designed his diagram with two specific axes: personal freedoms (vertical) and economic freedoms (horizontal). This two-dimensional approach replaces the oversimplified left-right line and better captures the complexity of political ideologies by separating the two main categories of freedom.
