question: "¿En qué difieren las posturas conservadora y libertaria sobre el salario mínimo en su razonamiento, pese a que ambas favorecen su abolición?"
answer: "Los conservadores aceptan cierta intervención estatal en la fijación de salarios si no obstaculiza la competitividad, mientras que los libertarios ven el salario mínimo como una imposición moral sobre la libertad de contratar y hacer negocios"
wrong_answers:
  - "Los conservadores se oponen al salario mínimo porque crea inflación, mientras que los libertarios se oponen porque da demasiado poder a los sindicatos"
  - "Los conservadores quieren salarios fijados por instituciones religiosas y comunitarias, mientras que los libertarios quieren salarios determinados por estudios de mercado aprobados por el gobierno"
  - "Los conservadores creen que los salarios mínimos deberían variar por región, mientras que los libertarios creen que debería aplicarse un único salario uniforme a nivel nacional"
explanation: >-
  Ambos favorecen reducir o abolir el salario mínimo, pero su razonamiento difiere fundamentalmente. Los conservadores aceptan cierta intervención estatal en la fijación de salarios mientras insisten en que siga siendo mínima y dependiente del contexto, centrándose en la competitividad. Los libertarios adoptan una postura moral más fuerte: un salario mínimo es una imposición sobre la libertad de contratar y hacer negocios. Cuando los libertarios dicen "el mercado", se refieren al contrato, libremente negociado entre dos partes sin interferencia estatal.
reviewed: false
