question: 完备性证明通过嵌套 case 来分解输入，并为每个输出使用 scribe，从而构建任意函数。为什么它只是一种理论工具？
answer: 得到的表达式是一个巨大的查找表，其大小呈指数级增长 —— 256-bit 输入大约需要 2²⁵⁶ 个条目。
wrong_answers:
  - scribe 是宏，不是核心组合子，所以该表达式落在经过形式化验证的语言之外。
  - Bit Machine 以指数时间对它求值，尽管表达式本身通过共享保持紧凑。
  - 嵌套 case 只能分解和类型，因此该构造在任何积类型输入上都会失败。
explanation: >-
  该构造通过嵌套 case 分解枚举每一个可能输入，
  并用 scribe 硬编码每个输出，因此表达式大小会
  指数级爆炸 —— 对于 256-bit 字这样的现实类型，这是天文数字。
  膨胀发生在表达式大小上，而不是某个原本紧凑的表达式的
  运行时间上。scribe 会展开为真正的核心组合子（unit、injl、injr、pair），
  因此结果仍然处于核心语言内部，而该核心语言的完备性定理已在 Rocq 中
  得到形式化验证；并且该分解能处理任意类型的输入，包括积类型。
reviewed: false
