question: "Как финансираните от държавата програми за социална помощ могат да произведат перверзни ефекти, илюстрирайки опасността от разчитане единствено на намерения?"
answer: "Те могат да създадат зависимост, да премахнат стимулите за работа и да представляват ограбване, тъй като парите първо трябва да бъдат взети от онези, които са произвели богатството"
wrong_answers:
  - "Те насърчават прекомерни лични спестявания, намаляват потребителските разходи и причиняват дефлация в по-широката икономика"
  - "Те укрепват частното предприемачество, като прехвърлят разходите за труд към правителството и намаляват нуждата от конкурентни заплати"
  - "Те премахват класовите различия толкова напълно, че социалната мобилност става ненужна, а иновациите застиват"
explanation: >-
  Friedman предупреждава, че щедрите намерения могат да произведат вредни последици, когато пренебрегват строгия анализ на човешките стимули. Финансираните от държавата програми за помощ рискуват да създадат зависимост, да не пораждат стимул за работа и да представляват форма на ограбване, тъй като средствата първо трябва да бъдат взети от производителите на богатство. Измеримите резултати като намаляване на бедността и ефективност трябва да имат предимство пред благородните намерения.
reviewed: false
