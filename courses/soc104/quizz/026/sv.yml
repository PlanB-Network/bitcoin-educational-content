question: "Varför började klassiska liberaler i USA kalla sig 'libertarianer' från 1960-talet och framåt?"
answer: "För att särskilja sig från amerikanska liberaler, vars betydelse hade förskjutits mot statlig interventionism"
wrong_answers:
  - "För att alliera sig med Demokratiska partiet och dess progressiva sociala program"
  - "För att signalera sitt stöd för Lyndon B. Johnsons Great Society-reformer"
  - "För att anta en mer radikal revolutionär identitet inspirerad av europeiska socialistiska rörelser"
explanation: >-
  I USA försköts ordet 'liberal' till att betyda anhängare av Big Government och statlig intervention, särskilt efter New Deal och Great Society. Klassiska liberaler antog etiketten 'libertarian' för att bevara den ursprungliga betydelsen av sin filosofi. De tog avstånd från amerikanska liberaler, inte allierade sig med dem.
reviewed: false
