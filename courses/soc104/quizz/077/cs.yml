question: "Jak se libertariánské pojetí svobody liší od centristického pojetí?"
answer: "Libertariáni chápou svobodu jako bezpodmínečný axiom, zatímco centristé hájí svobody oportunisticky podle kontextu a efektivity"
wrong_answers:
  - "Libertariáni dovolují státu chránit svobodu selektivně, zatímco centristé odmítají jakékoli zapojení státu do ochrany individuálních práv"
  - "Libertariáni zaměřují svobodu pouze na ekonomické otázky, zatímco centristé uplatňují svobodu široce napříč společenskou a kulturní oblastí"
  - "Libertariáni a centristé sdílejí stejný pohled na svobodu, ale neshodují se na velikosti vlády potřebné k jejímu vymáhání"
explanation: >-
  Libertariáni definují svobodu jako obecný, bezpodmínečný princip, který funguje jako axiom. Naproti tomu centristé hájí určité svobody oportunisticky a kontextuálně, aniž by uplatňovali jakýkoli obecný princip. Centristický přístup odhaluje instrumentální pojetí svobody, vždy podřízené pragmatickým cílům, jako je efektivita, což libertariáni zásadně odmítají.
