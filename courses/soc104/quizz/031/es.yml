question: "¿Qué creen los libertaires franceses (anarquistas socialistas) sobre la propiedad privada?"
answer: "La propiedad privada y el capitalismo deben ser abolidos porque son fuentes de opresión"
wrong_answers:
  - "La propiedad privada es un derecho natural que precede al Estado y debe protegerse a toda costa"
  - "La propiedad privada debe ser regulada por el Estado, pero nunca eliminada por completo de la sociedad"
  - "La propiedad privada es aceptable solo cuando se distribuye por igual entre todos los miembros de una comuna"
explanation: >-
  Los libertaires franceses, herederos del anarquismo socialista a través de pensadores como Proudhon y Bakunin, sostienen que tanto el Estado como la propiedad privada deben abolirse como fuentes gemelas de opresión. Esto queda recogido en la célebre fórmula de Proudhon: "La propiedad es un robo". La primera respuesta incorrecta describe la posición libertariana, que se opone fundamentalmente a la visión libertaire.
