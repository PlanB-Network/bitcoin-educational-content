question: "หลักการไม่รุกรานระบุว่าอย่างไร?"
answer: "บุคคลมีอิสระที่จะกระทำตามที่ตนต้องการ ตราบใดที่ไม่มีการกระทำรุนแรงต่อชีวิต เสรีภาพ หรือทรัพย์สินของผู้อื่น"
wrong_answers:
  - "รัฐมีสิทธิแต่เพียงผู้เดียวในการใช้กำลังเพื่อรักษาระเบียบสังคม"
  - "พลเมืองต้องยอมอยู่ใต้กฎเสียงข้างมากแม้มันจะจำกัดเสรีภาพส่วนบุคคลก็ตาม"
  - "เสรีภาพในการกระทำได้รับอนุญาตเฉพาะเมื่อมันเป็นประโยชน์ต่อความดีส่วนรวมของสังคม"
explanation: >-
  หลักการไม่รุกรานเป็นรากฐานสำคัญของการเมืองลิเบอร์ทาเรียน โดยระบุว่าปัจเจกบุคคลอาจกระทำได้อย่างเสรีตราบใดที่พวกเขาไม่กระทำความรุนแรงต่อชีวิต เสรีภาพ หรือทรัพย์สินของผู้อื่น มันชวนให้นึกถึงกฎทองที่พบได้ทั่วทุกอารยธรรม ต่างจากตัวเลือกอื่น ๆ มันไม่ได้มอบอำนาจศีลธรรมพิเศษแก่รัฐหรือทำให้สิทธิส่วนบุคคลอยู่ใต้อำนาจประโยชน์ส่วนรวม
reviewed: false
