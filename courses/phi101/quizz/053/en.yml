question: What are the arguments used by the Church to assert its supremacy over temporal power?
answer: The authority of the Pope as the vicar of Christ on Earth.
wrong_answers:
  - Canon law and ecclesiastical courts.
  - The Church's control over military forces across Europe.
  - The superiority of the Christian faith over any other religion or philosophy.
explanation: |
  The primary argument used by the Church to assert its supremacy over temporal power was the authority of the Pope as the representative of Christ on Earth, which gave the Church a claim to spiritual authority over all earthly rulers.
reviewed: true
