question: "O que a categoria de liberdade pessoal inclui?"
answer: "O que você faz em suas relações privadas, com suas opiniões, crenças e tudo que envolve seu próprio corpo e mente"
wrong_answers:
  - "O que você faz como produtor, incluindo abrir uma empresa, contratar funcionários e comerciar bens"
  - "Quanto imposto você paga, quais investimentos faz e como administra seus ativos financeiros"
  - "Sua capacidade de competir no mercado, definir preços para seus produtos e escolher seus fornecedores"
explanation: >-
  A liberdade pessoal engloba o que você faz em suas relações privadas, com suas opiniões e crenças, e tudo que envolve seu próprio corpo e mente. Isso inclui casamento, escolhas de leitura, práticas religiosas, escolhas alimentares e medicinais, e com quem você se associa. Atividades empresariais, impostos e decisões de mercado se enquadram na liberdade econômica.
reviewed: false
