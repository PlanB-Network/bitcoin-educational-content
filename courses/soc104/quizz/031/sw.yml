question: "Je, libertaires wa Kifaransa (wanasoshalisti wa anarchism) wanaamini nini kuhusu mali binafsi?"
answer: "Mali binafsi na ubepari lazima vifutwe kwa sababu ni vyanzo vya ukandamizaji"
wrong_answers:
  - "Mali binafsi ni haki ya asili inayotangulia dola na lazima ilindwe kwa gharama yoyote"
  - "Mali binafsi inapaswa kudhibitiwa na dola lakini isiondolewe kabisa kutoka katika jamii"
  - "Mali binafsi inakubalika tu inapogawanywa kwa usawa miongoni mwa wanachama wote wa jumuiya"
explanation: >-
  Libertaires wa Kifaransa, warithi wa anarchism ya kisoshalisti kupitia wanafikra kama Proudhon na Bakunin, hushikilia kwamba dola na mali binafsi lazima vyote vifutwe kama vyanzo pacha vya ukandamizaji. Hili linafupishwa katika kauli maarufu ya Proudhon "Mali ni wizi." Jibu la kwanza lisilo sahihi linaeleza msimamo wa libertarian, ambao kimsingi unapinga mtazamo wa libertaire.
