question: "Michael Oakeshott 在其哲學著作中如何描述保守主義？"
answer: "作為一種氣質與面向生活的態度，而不是僵硬的系統性意識形態"
wrong_answers:
  - "作為一套全面的經濟理論，為政府每個領域提供精確政策處方"
  - "作為一場革命運動，試圖拆除現代制度並回到前工業社會"
  - "作為一種純粹宗教教義，根植於基督教神學與教會權威"
explanation: >-
  英國哲學家 Michael Oakeshott 捍衛一種把保守主義理解為氣質而非系統性意識形態的觀念。他的文章《On Being Conservative》（1956）仍是重要參照。這種把保守主義視為一種性情的觀點也影響了 Friedrich Hayek。Oakeshott 的方法以批判政治理性主義而著稱，拒絕政治可以被化約為一個系統的想法。
reviewed: false
