question: "Libertarians bashira iki hagati mu filozofiya yabo ya politike?"
answer: "Inyifato runtu n'amategeko"
wrong_answers:
  - "Iterambere ry'ubutunzi no kurema ubutunzi"
  - "Ubungane bw'imibano n'ineza rusangi"
  - "Akaranga k'igihugu n'ukuzigama imico"
explanation: >-
  Libertarians bitandukanya n'iyindi miryango yose ya politike mu gushira inyifato runtu n'amategeko hagati muri filozofiya yabo, atari ubutunzi. Iyo barwanira ubutunzi bw'isoko, ntibabikora cane kubera ubushobozi bwabwo bwo kurema ubutunzi, ahubwo kubera ko buteza imbere umwidegemvyo n'ukwiyubara kw'umuntu ku giti ciwe. Iterambere ry'ubutunzi ni inyungu ya kabiri, si yo ngingo y'ishingiro.
