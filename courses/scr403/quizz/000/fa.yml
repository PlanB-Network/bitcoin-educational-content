question: چرا Simplicity تخصیص پویای حافظه را در زمان اجرا کنار می‌گذارد؟
answer: برای ممکن ساختن تحلیل ایستا و حذف کامل دسته‌هایی از باگ‌ها و حملات.
wrong_answers:
  - زیرا Liquid Network از عملیات سطح پایین حافظه پشتیبانی نمی‌کند.
  - برای کاهش شیب یادگیری برنامه‌نویسی برای توسعه‌دهندگان جدید قرارداد هوشمند.
  - زیرا خود Bitcoin Script نیز هیچ تخصیص پویای حافظه‌ای ندارد.
explanation: >-
  Simplicity از تخصیص پویای حافظه پرهیز می‌کند تا بتوان همه استفاده از منابع
  را پیش از اجرا به‌صورت ایستا تعیین کرد. این کار کران‌های منابع را قابل پیش‌بینی
  می‌کند و آسیب‌پذیری‌های مرتبط با مدیریت حافظه را حذف می‌کند، چیزی که در زمینه
  اعتبارسنجی بلاک‌چین حیاتی است.
reviewed: false
