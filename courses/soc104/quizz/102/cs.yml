question: "Co kurz označuje za skutečné politické dělení přesahující tradiční spektrum levice-pravice-střed?"
answer: "Dělení mezi základními filozofickými principy: svobodou nebo donucením, dobrovolným souhlasem nebo nátlakem, odpovědným jednotlivcem nebo kolektivem"
wrong_answers:
  - "Dělení mezi bohatými a chudými národy o kontrolu nad mezinárodními obchodními dohodami a globálními finančními institucemi"
  - "Dělení mezi městským a venkovským obyvatelstvem ohledně priorit vládních výdajů a investic do infrastruktury"
  - "Dělení mezi progresivními a tradičními kulturami ohledně sociálních norem, rodinných hodnot a náboženského vzdělávání"
explanation: >-
  Kurz tvrdí, že skutečné politické dělení nespočívá v tradičních nálepkách levice-pravice-střed, ale v základních filozofických principech: svoboda nebo donucení, dobrovolný souhlas nebo nátlak, odpovědný jednotlivec nebo kolektiv. Správný způsob, jak uvažovat o politice, je vycházet z etických principů, nikoli z nálepek.
