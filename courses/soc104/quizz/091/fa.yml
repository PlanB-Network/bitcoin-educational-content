question: "Satoshi Nakamoto چه پیامی را در نخستین بلاک Bitcoin که تاکنون استخراج شد، گنجاند؟"
answer: "تیتر روزنامه London Times درباره قرار گرفتن وزیر دارایی بریتانیا در آستانه دومین نجات بانکی"
wrong_answers:
  - "نقل‌قولی از Friedrich Hayek درباره خطرهای برنامه‌ریزی مرکزی و کنترل دولتی بر پول"
  - "اعلامیه استقلال از همه شکل‌های حکومت و مقررات مالی در سراسر جهان"
  - "برهانی ریاضی که نشان می‌دهد ارز غیرمتمرکز از پول Fiat کارآمدتر است"
explanation: >-
  در بلوک آفرینش، Satoshi Nakamoto تیتر نمادینی از روزنامه London Times درج کرد: "The Times 03/Jan/2009 Chancellor on the brink of a second bank bailout." این اشاره‌ای مستقیم به بحران مالی 2008 و مداخله‌گرایی پولی پس از آن بود و قصد Bitcoin را به‌عنوان بدیلی برای نظام‌های بانکی متمرکز کاملاً آشکار می‌کرد.
reviewed: false
