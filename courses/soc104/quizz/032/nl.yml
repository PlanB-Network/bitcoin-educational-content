question: "Hoe verschillen de strategieën om de staat af te schaffen tussen libertaires en libertariërs?"
answer: "Libertaires pleiten historisch voor gewelddadige vernietiging, terwijl libertariërs de staat via onderwijs en burgerlijke ongehoorzaamheid willen delegitimeren"
wrong_answers:
  - "Libertaires gebruiken democratische verkiezingen om de staat te ontmantelen, terwijl libertariërs gewapende revolutie en directe actie verkiezen"
  - "Libertaires richten zich op het opbouwen van alternatieve gemeenschappen, terwijl libertariërs binnen het bestaande politieke systeem werken om hervormingen door te voeren"
  - "Zowel libertaires als libertariërs zijn het erover eens dat vreedzaam protest het enige legitieme middel voor sociale transformatie is"
explanation: >-
  De libertaires pleiten historisch voor de vernietiging van de staat en het kapitalisme door geweld, waaronder terreur en gerichte aanvallen. Libertariërs verwerpen agressief geweld daarentegen als illegitiem. Hun strategie berust op het delegitimeren van de staat via argumentatie, debat, onderwijs en burgerlijke ongehoorzaamheid. Deze fundamenteel verschillende benaderingen van verandering weerspiegelen hun diepere filosofische meningsverschillen.
