question: "Dlaczego oś lewica-prawica uważa się za nieadekwatną do umieszczania klasycznych myślicieli liberalnych, takich jak Bastiat czy Ron Paul?"
answer: "Ponieważ klasyczny liberalizm ceni zarówno wolności gospodarcze, jak i osobiste, których ani lewica, ani prawica w pełni nie przyjmują"
wrong_answers:
  - "Ponieważ klasyczni liberałowie zawsze zgadzają się z prawicową polityką gospodarczą i odrzucają wszystkie stanowiska lewicowe"
  - "Ponieważ klasyczni liberałowie są centrystami, którzy przyjmują umiarkowane wersje ideologii lewicy i prawicy"
  - "Ponieważ klasyczni liberałowie sprzeciwiają się wszystkim formom rządu, co czyni ich anarchistami, a nie myślicielami politycznymi"
explanation: >-
  Oś lewica-prawica zawodzi w przypadku klasycznych liberałów, ponieważ nie potrafi pomieścić stanowiska, które jednocześnie broni wolności gospodarczej (zwykle prawica) i wolności osobistej (zwykle lewica). Klasyczni liberałowie nie są centrystami szukającymi kompromisu, nie są też anarchistami ani czysto prawicowi. Po prostu nie pasują do jednowymiarowego spektrum.
reviewed: false
