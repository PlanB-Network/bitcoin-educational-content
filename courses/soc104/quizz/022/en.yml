question: "What is political conservatism?"
answer: "An ideology that aims to preserve established political institutions and social order, opposing major structural upheaval"
wrong_answers:
  - "A personal commitment to traditional family values and religious practices without seeking to impose them on others"
  - "A philosophy that promotes rapid social change through democratic reform and progressive legislation"
  - "An economic theory that advocates for free markets, minimal taxation, and the abolition of trade barriers"
explanation: >-
  Political conservatism is an ideology, often represented in right-wing or far-right parties, that aims to preserve established political institutions and social order while opposing major structural upheaval. Its proponents wish to use power and law to safeguard their heritage. This differs from cultural conservatism, which is a personal life choice rather than a political program.
