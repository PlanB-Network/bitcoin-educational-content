bio: |
  Salut, sunt Alevand, un contabil și programator italian, cu o diplomă în științe ale comunicării. La biroul meu ofer consultanță IT și fiscală pe Bitcoin. Sunt membru al echipei de marketing BitPolito și absolvent al Biz School 2024 din cadrul Plan ₿ Network.
  
short_bio: Sunt un tip de treabă, cu niște vise frumoase.