question: Ktorá postava predstavuje chýbajúce spojivo medzi Boisguilbertom a fyziokratmi?
answer: Vincent de Gournay
wrong_answers:
  - Voltaire
  - Turgot
  - Colbert
explanation: |
  Vincent de Gournay ovplyvnil Boisguilberta aj fyziokratov, šíril liberálne myšlienky a kritizoval prehnané zasahovanie štátu do hospodárstva.
