question:Ni ubuhe buryo bushobora gukoreshwa kugira ngo node yikoreze snapshot ya UTXO set bityo iba ishobora gukoreshwa vuba?
answer: assumeutxo
wrong_answers:
 - assumechainstate
  - txindex
  - notxindex
explanation: |
  Assumeutxo yifashishwa mu gufata snapshot ya UTXO set kugira ngo node itangire gukora vuba, mu gihe iyi UTXO set yuzuye irimwo yubakwa inyuma buhoro buhoro.
reviewed: true
