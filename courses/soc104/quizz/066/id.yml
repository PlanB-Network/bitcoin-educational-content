question: "Apa posisi konservatif tentang imigrasi?"
answer: "Negara memiliki hak berdaulat untuk mengendalikan perbatasannya demi melindungi keamanan nasional dan identitas budaya"
wrong_answers:
  - "Perbatasan harus terbuka tanpa syarat karena pembatasan diskriminatif melanggar hak asasi manusia"
  - "Imigrasi harus ditentukan oleh permintaan pasar, dengan warga memutuskan secara kontraktual hubungan mereka dengan orang asing"
  - "Kebijakan imigrasi harus menyeimbangkan kebutuhan ekonomi dengan integrasi yang berhasil berdasarkan evaluasi ahli"
explanation: >-
  Kaum konservatif berpandangan bahwa ketertiban, identitas, dan kedaulatan nasional harus diprioritaskan di atas penerimaan tanpa batas terhadap orang asing atau pengungsi. Perbatasan dan populasi yang terdefinisi dengan baik adalah bagian dari nilai-nilai beradab. Jawaban yang salah mewakili posisi sosialis (perbatasan terbuka sebagai hak asasi manusia), posisi libertarian (imigrasi berbasis pasar), dan posisi sentris (pendekatan seimbang yang digerakkan oleh ahli).
reviewed: false
