question: La sfârșitul secolului al XVII-lea, care ministru a devenit reperul oamenilor de stat în materie de economie?
answer: Colbert
wrong_answers:
  - Turgot
  - Sully
  - Mazarin
explanation: |
  Colbert, ministrul de finanțe al lui Ludovic al XIV-lea, și-a pus amprenta asupra epocii sale printr-o politică economică intervenționistă cunoscută sub numele de colbertism, menită să dezvolte industria și comerțul francez. Acțiunile sale au servit drept model pentru mulți oameni de stat europeni.
