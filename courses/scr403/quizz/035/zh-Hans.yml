question: 在 ⟨⟨1,1⟩,1⟩（1+1+1）上跟踪全加器。第二阶段 O O H ▵ (O I H ▵ I H ⨾ half-adder) 会把什么值交给最终阶段？
answer: ⟨1, ⟨0, 1⟩⟩ —— 先是第一个半加器的进位，然后是第二个半加器的进位与和。
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ —— 先是第一个半加器的进位，然后是第二个半加器的和与进位。
  - ⟨0, ⟨0, 1⟩⟩ —— 先是第一个半加器的和位，然后是第二个半加器的进位与和。
  - ⟨1, ⟨1, 1⟩⟩ —— 先是第一个半加器的进位，然后是第二个半加器的 OR 和 XOR 位。
explanation: >-
  第一阶段计算 half-adder⟨1,1⟩ = ⟨1, 0⟩（进位 1，和 0），并保存
  carry-in，得到 ⟨⟨1,0⟩, 1⟩。在第二阶段，O O H 提取第一个
  进位（1），而 O I H ▵ I H 将 ⟨0, 1⟩ —— 第一个和与 carry-
  in —— 送入第二个半加器，由于 and(0,1)=0 且
  xor(0,1)=1，得到 ⟨0, 1⟩。最终阶段随后对两个进位执行 OR 并保留和，
  产生 ⟨1, 1⟩：二进制 3，符合预期。
