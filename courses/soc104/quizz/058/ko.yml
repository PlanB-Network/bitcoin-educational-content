question: "친기업적인 것과 친시장적인 것 사이의 중요한 구분은 무엇인가요?"
answer: "친기업적이라는 것은 대기업과 국가 사이의 동맹을 선호한다는 뜻인 반면, 친시장적이라는 것은 국가의 특혜 없는 자유 경쟁을 지지한다는 뜻입니다"
wrong_answers:
