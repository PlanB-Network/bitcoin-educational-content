question: "Non-aggression principle क्या कहता है?"
answer: "कोई person अपनी इच्छा से act करने के लिए free है, जब तक किसी दूसरे के life, liberty या property के विरुद्ध कोई violence committed न हो"
wrong_answers:
  - "Social order maintain करने के लिए force use करने का sole right state के पास है"
  - "Citizens को majority rule के आगे submit करना चाहिए, भले ही वह individual freedoms को restrict करे"
  - "Action की freedom केवल तब permitted है जब वह society के collective good को benefit करे"
explanation: >-
  Non-aggression principle libertarian politics का cornerstone है, जो कहता है कि individuals freely act कर सकते हैं, provided वे दूसरों के life, liberty या property के विरुद्ध violence commit न करें। यह civilizations में पाई जाने वाली golden rule को recall करता है। Other options के विपरीत, यह state को special moral authority grant नहीं करता और individual rights को collective benefit के अधीन नहीं करता।
