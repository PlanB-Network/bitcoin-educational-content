question: "Friedrich Hayek द्वारा वर्णित 'स्वस्फूर्त व्यवस्था' की अवधारणा क्या है?"
answer: "सामाजिक नियम और मानदंड अधिनायकवादी नियोजन द्वारा थोपे जाने के बजाय स्वतंत्र व्यक्तिगत अंतःक्रियाओं से उभरने चाहिए"
wrong_answers:
  - "बाज़ार स्वाभाविक रूप से एकाधिकार की ओर जाते हैं जब तक कि राज्य प्रतिस्पर्धी संतुलन बनाए रखने के लिए हस्तक्षेप न करे"
  - "लोकतांत्रिक चुनाव ही समाज को संचालित करने वाले कानून स्थापित करने का एकमात्र वैध तंत्र हैं"
  - "आर्थिक संकट स्वतः उत्पन्न होते हैं और स्थिरता बहाल करने के लिए तत्काल सरकारी हस्तक्षेप की आवश्यकता होती है"
explanation: >-
  Hayek की स्वस्फूर्त व्यवस्था की अवधारणा मानती है कि समाज को संचालित करने वाले नियम केंद्रीय नियोजन द्वारा ऊपर से थोपे नहीं जाने चाहिए, बल्कि व्यक्तिगत इच्छाओं, अनुबंधों और स्वैच्छिक संबंधों के स्वतंत्र खेल से उभरने चाहिए। यह लिबर्टेरियन विचार की एक मूलभूत धुरी है। इसका अर्थ यह नहीं है कि बाज़ार एकाधिकार की ओर जाते हैं या संकटों के लिए सरकारी हस्तक्षेप आवश्यक होता है।
reviewed: false
