question: "Perché i libertari si oppongono alla tassazione?"
answer: "Perché è una violazione morale dei diritti di proprietà, una forma di furto statale che si appropria della proprietà altrui senza consenso"
wrong_answers:
  - "Perché le tasse sono economicamente inefficienti e portano sempre a tassi di disoccupazione più elevati"
  - "Perché la tassazione scoraggia gli investimenti esteri e indebolisce la posizione competitiva di un Paese"
  - "Perché i sistemi fiscali progressivi prendono di mira ingiustamente gli individui facoltosi che creano più posti di lavoro"
explanation: >-
  L'obiezione libertaria alla tassazione è morale prima che economica. I libertari vedono la tassazione come una forma di furto statale e un impedimento alla proprietà privata, perché consiste nell'appropriarsi della proprietà altrui senza consenso. Sebbene possano esistere argomenti economici contro la tassazione, l'argomento libertario fondamentale poggia sul principio che essa viola i diritti di proprietà, non su calcoli di efficienza o competitività.
