question: "What does Kant's motto 'Sapere aude' encourage people to do?"
answer: "To dare to think for themselves and exit the state of minority where they depend on the direction of a superior authority"
wrong_answers:
  - "To pursue academic knowledge by enrolling in formal educational institutions and earning credentials"
  - "To challenge all forms of morality and create entirely new ethical systems based on personal desire"
  - "To seek wisdom through religious devotion and submission to the teachings of the church"
explanation: >-
  Sapere aude, meaning "Dare to think for yourself," was taken by Kant from the poet Horace and made the motto of the Enlightenment. It symbolizes the exit from minority, a state in which people are incapable of using their understanding without the direction of a superior class or authority. Kant encourages emancipation and full responsibility for one's own thinking.
