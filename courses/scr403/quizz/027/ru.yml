question: "Почему значения свидетеля исключены из Commitment Merkle Root (CMR)?"
answer: Чтобы адреса формировались до того, как станут известны свидетели, и чтобы неиспользуемые ветви можно было приватно отсекать.
wrong_answers:
  - Потому что значения свидетеля просто слишком велики, чтобы включить их в 256-битный хеш.
  - Потому что значения свидетеля проверяются полностью отдельно с помощью эффекта Failure.
  - Потому что включение значений свидетеля сделало бы CMR недетерминированным.
explanation: >-
  Выражения свидетеля (например, подписи) предоставляются в момент
  расходования, а не в момент создания адреса. Их исключение из CMR
  обеспечивает два важных свойства: адреса можно генерировать до того,
  как появится расходующая транзакция, а неисполненные условные ветви
  можно отсечь от данных в блокчейне, не раскрывая связанные с ними
  значения свидетеля.
reviewed: true
