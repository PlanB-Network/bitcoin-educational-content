question: "What form of governance does centrism tend toward?"
answer: "Technocracy, where power is entrusted to experts who steer the economy and monetary policy"
wrong_answers:
  - "Direct democracy, where citizens vote on every major policy decision"
  - "Aristocracy, where power is held by a traditional ruling class"
  - "Laissez-faire governance, where the market regulates itself without state intervention"
explanation: >-
  Centrism privileges efficiency, pragmatism, and tends toward technocracy, meaning power should be entrusted to experts who steer the economy and pilot monetary policy. This is fundamentally different from direct democracy, aristocracy, or laissez-faire, each of which distributes power according to entirely different principles.
reviewed: false
