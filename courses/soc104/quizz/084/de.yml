question: "Was ist der zentrale Unterschied zwischen pro-business und pro-market?"
answer: "Pro-business-Befürworter streben staatliche Interventionen an, um bestimmte Unternehmen vor dem Scheitern zu schützen, während pro-market-Befürworter Deregulierung unterstützen und zulassen, dass Unternehmen scheitern, damit der Markt sich natürlich neu organisieren kann"
wrong_answers:
  - "Pro-business-Befürworter konzentrieren sich auf große Konzerne, während pro-market-Befürworter sich ausschließlich auf die Unterstützung kleiner Unternehmen und Startups konzentrieren"
  - "Pro-business ist eine linke Position, die Arbeitergenossenschaften begünstigt, während pro-market eine rechte Position ist, die Privateigentum begünstigt"
  - "Pro-business-Befürworter lehnen jeden Wettbewerb ab, während pro-market-Befürworter staatlich regulierten Wettbewerb zwischen zugelassenen Unternehmen unterstützen"
explanation: >-
  Die pro-business-Position betrachtet Wettbewerb als ein durch Regulierungen gewonnenes Governance-Instrument und rechtfertigt Subventionen und Rettungsaktionen, um Arbeitsplatzverluste zu verhindern. Aus pro-business-Sicht ist der Markt fragil und braucht staatliche Rettung. Pro-market-Befürworter sehen Wettbewerb als natürliches Ergebnis freien Unternehmertums, was Deregulierung und das Zulassen des Scheiterns von Unternehmen impliziert, weil Scheitern dem Markt ermöglicht, sich natürlich neu zu organisieren und das Feld für fähigere Akteure zu öffnen.
