question: "Ni kipi kati ya vifuatavyo ni mfano wa utaratibu unaojitokeza wenyewe kama ulivyoelezwa na Hayek?"
answer: "Lugha, ambayo ilikua kiasili kupitia mwingiliano wa kihistoria badala ya kubuniwa na wasomi katika ofisi"
wrong_answers:
  - "Katiba ya kitaifa, ambayo iliandaliwa kwa uangalifu na wawakilishi waliochaguliwa ili kuweka kanuni za kijamii"
  - "Mpango wa serikali wa kuchochea uchumi, uliobuniwa na wanauchumi ili kuratibu shughuli za kiuchumi"
  - "Mfumo wa elimu ya umma, ulioundwa na wabunge ili kuhakikisha upatikanaji wa maarifa kwa wote"
explanation: >-
  Hayek anaeleza utaratibu unaojitokeza wenyewe kama zao la mwingiliano huru katika jamii, unaotokana na tendo la binadamu lakini si kutokana na usanifu wa makusudi wa binadamu. Lugha ni mfano mkuu: Kifaransa, Kiingereza, na Kijerumani havikujengwa na wasomi walioamua kanuni za sarufi, bali viliibuka kama tunda la mpangilio wa polepole na wa kiasili uliojengwa kupitia mwingiliano wa kihistoria.
