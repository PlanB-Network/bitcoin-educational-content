question: "Hvorfor kommer den libertarianske posisjonen om legalisering av narkotika med betingelsen om at statens rolle i samfunnet må reduseres?"
answer: "Fordi liberalisering overtatt av staten ville erstatte individuelt ansvar med statlig styrt omsorg, mens libertarianere ønsker at borgere skal bære konsekvensene av sine valg med støtte fra private foreninger"
wrong_answers:
  - "Fordi statskontrollert legalisering ville generere for mye skatteinntekter og gjøre staten overdrevent mektig og korrupt"
  - "Fordi staten ville pålegge kvalitetsstandarder som ville drive opp prisene og gjenskape svarte markeder"
  - "Fordi statlig regulering av narkotika ville bryte internasjonale handelsavtaler og diplomatiske relasjoner"
explanation: >-
  Libertarianere støtter liberalisering av narkotika, men insisterer på at statens rolle må reduseres fordi målet deres er å gjenopprette individuelt ansvar, ikke å utvide statlig forvaltning. Hvis noen blir avhengige, må de ta ansvar i stedet for å be staten om å yte omsorg. Løsningen på avhengighet ligger i privat initiativ: frivillig støtte fra individer, familier og veldedige foreninger. Statsstyrt legalisering ville motsi det grunnleggende libertarianske prinsippet om personlig ansvar.
