question: "स्वतंत्रता की लिबर्टेरियन अवधारणा केंद्रवादी अवधारणा से कैसे भिन्न है?"
answer: "लिबर्टेरियन स्वतंत्रता को बिना शर्त स्वयंसिद्ध मानते हैं, जबकि केंद्रवादी संदर्भ और दक्षता के आधार पर अवसरवादी ढंग से स्वतंत्रताओं का बचाव करते हैं"
wrong_answers:
  - "लिबर्टेरियन राज्य को स्वतंत्रता की चुनिंदा रक्षा करने देते हैं, जबकि केंद्रवादी व्यक्तिगत अधिकारों की रक्षा में राज्य की किसी भी भागीदारी को अस्वीकार करते हैं"
  - "लिबर्टेरियन स्वतंत्रता को केवल आर्थिक मामलों तक सीमित रखते हैं, जबकि केंद्रवादी स्वतंत्रता को सामाजिक और सांस्कृतिक क्षेत्रों में व्यापक रूप से लागू करते हैं"
  - "लिबर्टेरियन और केंद्रवादी स्वतंत्रता के बारे में समान दृष्टिकोण रखते हैं, लेकिन इसे लागू करने के लिए आवश्यक सरकार के आकार पर असहमत हैं"
explanation: >-
  लिबर्टेरियन स्वतंत्रता को एक सामान्य, बिना शर्त सिद्धांत के रूप में परिभाषित करते हैं जो स्वयंसिद्ध की तरह काम करता है। इसके विपरीत, केंद्रवादी किसी भी सामान्य सिद्धांत को लागू किए बिना कुछ स्वतंत्रताओं का अवसरवादी और संदर्भगत ढंग से बचाव करते हैं। केंद्रवादी दृष्टिकोण स्वतंत्रता की एक साधनात्मक अवधारणा को प्रकट करता है, जो हमेशा दक्षता जैसे व्यावहारिक लक्ष्यों के अधीन रहती है, जिसे लिबर्टेरियन मूलतः अस्वीकार करते हैं।
reviewed: false
