question: "سبزها در نمودار نولان کجا قرار می‌گیرند، و چرا؟"
answer: "بسیار پایینِ نمودار، زیرا معتقدند منفعت فردی نباید بر منفعت جمعی سیاره مقدم شود"
wrong_answers:
  - "در بالای نمودار، زیرا آزادی شخصی و آگاهی زیست‌محیطی را به یک اندازه در اولویت می‌گذارند"
  - "در مرکز نمودار، زیرا رشد اقتصادی را با حفاظت از محیط زیست متوازن می‌کنند"
  - "در دورترین سمت راست، زیرا از راه‌حل‌های مبتنی بر بازار برای چالش‌های زیست‌محیطی پشتیبانی می‌کنند"
explanation: >-
  سبزها بسیار پایینِ نمودار نولان قرار می‌گیرند، زیرا به نام رفاه سیاره‌ای از کنترل شدید دولت بر تصمیم‌های اقتصادی و شخصی پشتیبانی می‌کنند. آن‌ها مبارزهٔ طبقاتی مارکسیستی را با مبارزه‌ای میان انسان و طبیعت جایگزین کرده‌اند، و گرایش دارند از کنترل اقتصادی و حتی لغو مالکیت خصوصی دفاع کنند. این امر آن‌ها را در بخش اقتدارگرا قرار می‌دهد، نه در بالا یا در مرکز.
reviewed: false
