question: "Ce plasează libertarienii în centrul filosofiei lor politice?"
answer: "Etica și dreptul"
wrong_answers:
  - "Creșterea economică și crearea de bogăție"
  - "Egalitatea socială și bunăstarea colectivă"
  - "Identitatea națională și păstrarea culturală"
explanation: >-
  Libertarienii se disting de toate celelalte familii politice prin faptul că plasează etica și dreptul în centrul filosofiei lor, nu economia. Când apără economia de piață, o fac mai puțin pentru capacitatea ei de a produce bogăție și mai mult pentru promovarea libertății și responsabilității individuale. Creșterea economică este un beneficiu secundar, nu principiul fondator.
reviewed: false
