question: "Ako Green New Deal predstavuje súčasný vývoj demokratického socializmu?"
answer: "Využíva environmentálne obavy ako nové ospravedlnenie štátneho zásahu a konfiškácie súkromného príjmu, pričom podriaďuje individuálny záujem kolektívnemu záujmu definovanému zdravím planéty"
wrong_answers:
  - "Úplne opúšťa tradičnú socialistickú ekonomiku v prospech voľnotrhových riešení environmentálnych problémov prostredníctvom obchodovania s uhlíkom"
  - "Odmieta štátny zásah a namiesto toho sa spolieha na dobrovoľné individuálne konanie a inovácie súkromného sektora pri riešení klimatickej zmeny"
  - "Predstavuje odklon od socializmu tým, že uprednostňuje ochranu životného prostredia pred všetkými otázkami sociálnej spravodlivosti a zamestnanosti"
explanation: >-
  Green New Deal spája environmentálne obavy so sociálnymi cieľmi, kombinuje ekologickú transformáciu so sociálnou spravodlivosťou, garanciami zamestnania a posilnenými verejnými službami. Individuálny záujem je podriadený kolektívnemu záujmu definovanému zdravím planéty. Vo svojom jadre poskytuje nový rétorický obal ospravedlňujúci štátny zásah a konfiškáciu súkromného príjmu už nielen v mene sociálnej spravodlivosti, ale aj v mene životného prostredia.
