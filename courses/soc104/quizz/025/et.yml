question: "Mida paljastab Nolani diagrammi vertikaaltelg tegeliku poliitilise küsimuse kohta?"
answer: "See paljastab, kas tahad omaenda väärtushinnanguid riigi kaudu teistele peale suruda või eelistad, et iga inimene oleks vaba ise otsustama"
wrong_answers:
  - "See paljastab, kas toetad demokraatlikku valitsemist või eelistad autoritaarset võimu ühe juhi käes"
  - "See paljastab, kas samastud progressiivsete sotsiaalsete liikumiste või traditsiooniliste religioossete institutsioonidega"
  - "See paljastab, kas sinu peamine mure on riiklik julgeolek või majanduslik heaolu"
explanation: >-
  Vertikaaltelg toob nähtavale tegeliku poliitilise küsimuse: mitte selle, kas oled vasak- või parempoolne, vaid selle, mil määral tahad, et riik sekkuks ühiskonna kujundamisse sinu väärtuste järgi. Kas soovid oma väärtushinnanguid teistele peale suruda või eelistad, et iga inimene oleks vaba ise otsustama? See raamistik ületab vasak-parem jaotuse ning näitab, et mõlemad leerid võivad olla võrdselt etatistlikud.
reviewed: false
