question: "リバタリアンと保守派はどのような共通点を持ち、何が彼らを分けるのか？"
answer: "彼らは限定政府への愛着と強制的な平等主義の拒否を共有するが、軍事介入主義と社会政策について意見が分かれる"
wrong_answers:
  - "彼らは保護主義的な貿易政策と国防への支持を共有するが、公的生活における宗教の役割について意見が分かれる"
  - "彼らは累進課税と福祉プログラムへのコミットメントを共有するが、移民政策について意見が分かれる"
  - "彼らは自由貿易と薬物合法化への反対を共有するが、連邦政府の規模について意見が分かれる"
explanation: >-
  リバタリアンと保守派はどちらも限定政府を支持し、強制的な平等主義を拒否し、公的債務に反対し、州権を擁護する。
  しかし、リバタリアンは新保守主義者の軍事介入主義を拒否し、保守的な社会政策と補助金に反対し、薬物禁止を非難し、保護主義を拒否する。
  同盟は現実に存在するが、本質的に緊張をはらんでいる。
reviewed: false
