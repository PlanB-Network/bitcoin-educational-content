question: "Sulla questione della regolamentazione delle armi da fuoco, qual è la differenza cruciale tra le posizioni conservatrice e libertaria?"
answer: "Entrambi accettano una certa regolamentazione, ma i conservatori vogliono regole provenienti da un'autorità pubblica legittima, mentre i libertari vogliono che le regole emergano da coloro che sono direttamente interessati, come le associazioni di cittadini e la concorrenza di mercato"
wrong_answers:
  - "I conservatori si oppongono a ogni regolamentazione delle armi da fuoco, mentre i libertari accettano uno stretto controllo governativo per la sicurezza pubblica"
  - "I conservatori vogliono vietare completamente le armi da fuoco, mentre i libertari sostengono l'accesso illimitato a tutte le armi"
  - "I conservatori basano la loro posizione sui diritti individuali, mentre i libertari basano la propria sulla responsabilità collettiva"
explanation: >-
  Sia i conservatori sia i libertari concordano sul fatto che sia necessaria una qualche forma di regolamentazione per il porto d'armi. La differenza cruciale sta in chi stabilisce quelle regole. I conservatori insistono che le regolamentazioni debbano provenire da un'autorità pubblica incaricata di salvaguardare il bene comune (dall'alto verso il basso). I libertari sostengono che la regolamentazione debba emergere da coloro che sono direttamente interessati: professionisti della sicurezza, associazioni di cittadini e concorrenza di mercato (dal basso verso l'alto).
