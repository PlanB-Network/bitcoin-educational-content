question: "Mitä poliittinen konservatismi on?"
answer: "Ideologia, joka pyrkii säilyttämään vakiintuneet poliittiset instituutiot ja yhteiskuntajärjestyksen ja vastustaa suuria rakenteellisia mullistuksia"
wrong_answers:
  - "Henkilökohtainen sitoutuminen perinteisiin perhearvoihin ja uskonnollisiin käytäntöihin ilman pyrkimystä pakottaa niitä muille"
  - "Filosofia, joka edistää nopeaa yhteiskunnallista muutosta demokraattisen reformin ja edistyksellisen lainsäädännön kautta"
  - "Talousteoria, joka puolustaa vapaita markkinoita, vähäistä verotusta ja kaupan esteiden poistamista"
explanation: >-
  Poliittinen konservatismi on ideologia, jota usein edustavat oikeistolaiset tai äärioikeistolaiset puolueet ja joka pyrkii säilyttämään vakiintuneet poliittiset instituutiot ja yhteiskuntajärjestyksen samalla, kun se vastustaa suuria rakenteellisia mullistuksia. Sen kannattajat haluavat käyttää valtaa ja lakia perintönsä suojelemiseen. Tämä eroaa kulttuurikonservatismista, joka on henkilökohtainen elämäntapavalinta eikä poliittinen ohjelma.
reviewed: false
