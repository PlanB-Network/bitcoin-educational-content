question: "Ludwig von Mises muốn nói gì khi ông viết rằng chỉ cá nhân mới tư duy, lý luận và hành động?"
answer: "Rằng các tập thể như nhà nước hay quốc gia không có sự tồn tại riêng ngoài hành động của các thành viên cá nhân của chúng"
wrong_answers:
  - "Rằng các cá nhân nên tránh hình thành nhóm hay hiệp hội vì hành động tập thể luôn có hại"
  - "Rằng chỉ một số cá nhân thiên tài mới có khả năng tư duy lý tính trong khi hầu hết mọi người đi theo bản năng"
  - "Rằng tư duy và lý luận là các hoạt động riêng tư không bao giờ nên được chia sẻ hay thảo luận công khai"
explanation: >-
  Mises làm rõ rằng chủ nghĩa cá nhân phản đối quan niệm rằng các thực thể xã hội như xã hội hay quốc gia có thể tồn tại độc lập với những cá nhân cấu thành chúng. Một tập thể không có sự tồn tại riêng ngoài hành động của các thành viên cá nhân của nó. Chúng ta không thể nói một cách có nghĩa về hành động của nhà nước hay một công ty, vì các thực thể này không có ý chí hay tư duy riêng và chỉ hành động thông qua các cá nhân.
