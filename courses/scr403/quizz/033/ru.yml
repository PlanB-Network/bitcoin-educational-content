question: Учитывая правила типизации «меньшие типы в посылках», какие базовые комбинаторы на самом деле перемещают данные во время выполнения?
answer: Только iden и comp; остальные семь реализуются исключительно за счёт учёта, без копирования данных.
wrong_answers:
  - Только take и drop; извлечение одного компонента заставляет машину копировать его из произведения.
  - Только pair и case; дублирование входа для двух ветвей и диспетчеризация по метке перемещают данные.
  - Только injl и injr; добавление метки переписывает значение в более крупное представление типа-суммы.
explanation: >-
  Как ни странно, комбинаторы, которые выглядят как доступ к данным
  (take, drop, pair, case, injl, injr), не требуют никакого копирования:
  поскольку посылки в правилах типизации содержат меньшие типы, чем их
  заключения, Bit Machine может реализовать их исключительно за счёт
  учёта. Только iden, который копирует весь свой вход в выход, и comp,
  который материализует промежуточное значение, передаваемое от f к g,
  действительно перемещают данные.
reviewed: false
