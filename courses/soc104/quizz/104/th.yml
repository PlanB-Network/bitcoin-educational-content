question: "ทำไม cypherpunks จึงโต้แย้งว่าสกุลเงินดิจิทัลที่มีคุณสมบัติแบบนิรนามเป็นสิ่งจำเป็น?"
answer: "เพราะเงินสดซึ่งเป็นระบบธุรกรรมแบบนิรนามหลักกำลังหายไปในสังคมดิจิทัล และต้องมีการประดิษฐ์สิ่งทดแทนดิจิทัลที่มีคุณสมบัติความเป็นส่วนตัวแบบเดียวกัน"
wrong_answers:
  - "เพราะระบบชำระเงินดิจิทัลที่มีอยู่ช้าและแพงเกินไป จึงต้องมีทางเลือกที่เร็วและถูกกว่าสำหรับการค้าออนไลน์"
  - "เพราะรัฐบาลได้ห้ามธุรกรรมแบบนิรนามทุกรูปแบบแล้ว และมีเพียงเทคโนโลยีใหม่เท่านั้นที่สามารถหลบเลี่ยงกฎหมายเหล่านี้ได้"
  - "เพราะธนาคารดั้งเดิมปฏิเสธให้บริการประชากรบางกลุ่ม ทำให้ระบบชำระเงินดิจิทัลที่ทุกคนเข้าถึงได้เป็นความจำเป็นทางเศรษฐกิจ"
explanation: >-
  Cypherpunk manifesto ระบุว่าความลับในสังคมเปิดต้องการระบบธุรกรรมแบบไม่ระบุตัวตน จนถึงยุคดิจิทัล เงินสดทำหน้าที่เป็นระบบหลักของประเภทนี้ แต่ในสังคมดิจิทัลที่เงินสดกำลังหายไป ต้องมีการประดิษฐ์สกุลเงินดิจิทัลที่มีคุณสมบัติการไม่ระบุตัวตนแบบเดียวกัน วิสัยทัศน์นี้คาดการณ์ล่วงหน้าโดยตรงถึงสิ่งที่ Bitcoin จะบรรลุ
reviewed: false
