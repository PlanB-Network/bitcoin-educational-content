question: "Hvorfor begynte klassiske liberalere i USA å kalle seg 'libertarians' fra 1960-tallet og fremover?"
answer: "For å skille seg fra amerikanske liberalere, hvis betydning hadde forskjøvet seg mot statlig intervensjonisme"
wrong_answers:
  - "For å alliere seg med Det demokratiske partiet og dets progressive sosiale programmer"
  - "For å signalisere sin støtte til Lyndon B. Johnsons Great Society-reformer"
  - "For å anta en mer radikal revolusjonær identitet inspirert av europeiske sosialistiske bevegelser"
explanation: >-
  I USA forskjøv ordet 'liberal' seg til å bety tilhengere av Big Government og statlig inngripen, særlig etter New Deal og Great Society. Klassiske liberalere tok i bruk betegnelsen 'libertarian' for å bevare den opprinnelige betydningen av filosofien sin. De distanserte seg fra amerikanske liberalere, de allierte seg ikke med dem.
reviewed: false
