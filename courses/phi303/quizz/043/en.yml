question: "Why does the course say we must 'accept minority rule'?"
answer: "Because minority rule is natural \u2014 the point is to have natural leaders, not political leaders."
wrong_answers:
  - "Because resistance to any government is always futile."
  - "Because the current elite is the best possible one."
  - "Because majorities have no opinions worth considering."
explanation: |
  Denying the naturalness of minority rule is what generates democratic frustration. In a free society, leadership falls to those genuinely suited to it, freely accepted — and rewarded — rather than to the products of political selection.
reviewed: false
