question: "Wakijani wako wapi kwenye mchoro wa Nolan, na kwa nini?"
answer: "Chini sana kwenye mchoro, kwa sababu wanaona kwamba maslahi ya mtu binafsi hayapaswi kutangulia maslahi ya pamoja ya sayari"
wrong_answers:
  - "Juu ya mchoro, kwa sababu wanatanguliza uhuru wa binafsi na ufahamu wa mazingira kwa usawa"
  - "Katikati ya mchoro, kwa sababu wanasawazisha ukuaji wa kiuchumi na ulinzi wa mazingira"
  - "Upande wa kulia kabisa, kwa sababu wanaunga mkono suluhisho za kimazingira zinazotegemea soko"
explanation: >-
  Wakijani wako chini sana kwenye mchoro wa Nolan kwa sababu wanapendelea udhibiti mkubwa wa dola juu ya maamuzi ya kiuchumi na ya binafsi kwa jina la ustawi wa sayari. Wamebadilisha mapambano ya kitabaka ya Kimarx kwa mapambano kati ya binadamu na maumbile, na huwa wanatetea udhibiti wa kiuchumi na hata kufutwa kwa umiliki binafsi. Hili linawaweka katika sekta ya kimamlaka, si juu au katikati.
reviewed: false
