question: "Hoja ya msingi ya Hayek kuhusu kwa nini upangaji wa kati hushindwa ni ipi?"
answer: "Maarifa yapo tu kama vipande vilivyotawanyika vinavyomilikiwa na watu binafsi tofauti na hayawezi kukusanywa au kuunganishwa na mamlaka ya kati"
wrong_answers:
  - "Wapangaji wa kati ni wapotovu kimaadili na daima hutenda kwa maslahi yao binafsi badala ya manufaa ya umma"
  - "Taasisi za kidemokrasia ni polepole mno kujibu mabadiliko ya kiuchumi, hivyo maamuzi ya kati huwa yamepitwa na wakati daima"
  - "Upangaji wa kati hushindwa kwa sababu raia hupinga kwa makusudi maagizo ya serikali na hukataa kutii kanuni"
explanation: >-
  Hoja ya msingi ya Hayek inategemea asili ya taarifa. Alionyesha kwamba maarifa hayapo kamwe katika umbo lililokolezwa au kuunganishwa, bali yapo tu kama vipande vilivyotawanyika vinavyomilikiwa na watu binafsi wote tofauti. Thamani ni ya kibinafsi na hujulikana tu kienyeji na kwa kutokamilika. Mpangaji wa kati, akiwa ameketi ofisini, hana maarifa ya bei halisi ya vitu kwa sababu hahusiki katika mwingiliano na ubadilishanaji.
