question: "フランスのリベルテール（社会主義的アナキスト）は、私有財産について何を信じていますか？"
answer: "私有財産と資本主義は抑圧の源であるため、廃止されなければならない"
wrong_answers:
  - "私有財産は国家に先立つ自然権であり、いかなる犠牲を払っても保護されなければならない"
  - "私有財産は国家によって規制されるべきだが、社会から完全に排除されるべきではない"
  - "私有財産は、コミューンの全成員に平等に分配される場合に限って認められる"
explanation: >-
  プルードンやバクーニンのような思想家を通じて社会主義的アナキズムを継承するフランスのリベルテールは、国家と私有財産の双方が抑圧の二つの源として廃止されなければならないと考える。これはプルードンの有名な定式「所有は窃盗である」に表れている。最初の誤答はリバタリアンの立場を説明しており、リベルテールの見解とは根本的に対立している。
reviewed: false
