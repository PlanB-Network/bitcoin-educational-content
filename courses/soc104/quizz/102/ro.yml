question: "Ce cred libertarienii despre capacitatea indivizilor de a lua decizii?"
answer: "Indivizii au atât dreptul, cât și responsabilitatea de a lua propriile decizii privind viețile lor"
wrong_answers:
  - "Indivizii ar trebui să ia decizii doar după consultarea reprezentanților aleși care înțeleg implicațiile de politică publică"
  - "Indivizii sunt în general incapabili să ia decizii bune și au nevoie de îndrumare de specialitate din partea instituțiilor guvernamentale"
  - "Indivizii ar trebui să ia liber decizii economice, dar să se supună statului în toate chestiunile sociale și culturale"
explanation: >-
  Din punct de vedere libertarian, indivizii au atât dreptul, cât și responsabilitatea de a lua propriile decizii. Acest lucru contrastează cu familiile politice convenționale de la stânga la dreapta, care cred că guvernul ar trebui să ia unele sau multe dintre deciziile importante din viața unui individ și din viața economică în general.
