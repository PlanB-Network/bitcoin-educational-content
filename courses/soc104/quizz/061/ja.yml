question: "Mussolini の 1920 年の宣言「すべてを国家の中に、国家の外には何もなく、国家に反するものは何もない」は、全体主義について何を明らかにしていますか？"
answer: "国家が社会を完全に吸収するため、公的空間と私的空間のあいだの分離はもはや存在しない"
wrong_answers:
  - "国家は軍事力にのみ集中し、経済は民間企業に任せる"
  - "市民は政府を公然と批判しない限り、私的に組織する自由がある"
  - "政府は政治活動だけを統制し、文化生活と宗教生活は自律したままである"
explanation: >-
  Mussolini の宣言は、全体主義の本質、すなわち全体性を捉えています。すべてが国家に吸収されるため、公的空間と私的空間のあいだの分離は存在しません。社会は、スポーツクラブを開くようなごく日常的な活動に至るまで、あらゆる自律性を失います。これは、軍事、政治、経済の領域だけを統制することをはるかに超えています。
reviewed: false
