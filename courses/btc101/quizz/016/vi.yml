question: B-money của Wei Dai là gì?
answer: Một ý tưởng về một loại tiền số bảo mật, nơi mà việc phát hiện các giao dịch gian lận được đánh giá và phụ trách thực hiện bởi một cộng đồng độc lập thay vì một cơ quan trung ương.
wrong_answers:
  - Một loại tiền số được sử dụng rộng rãi trước Bitcoin và được kiểm soát bởi một nhóm cypherpunks.
  - Một hình thức tiền số được CIA tạo ra và sử dụng bởi quân đội.
  - Một loại tiền số được Wei Dai tạo ra như một đối thủ cạnh tranh với Bitcoin để có khả năng mở rộng cao hơn.
explanation: |
  B-money của Wei Dai là ý tưởng về một loại tiền số bảo mật
  không có sự tham gia của bất kỳ thực thể trung ương nào, điều này đã nhiều lần truyền cảm hứng
  cho sự tạo ra của Bitcoin. Thực tế, nó được trích dẫn trong
  bản cáo bạch của Bitcoin.
reviewed: true