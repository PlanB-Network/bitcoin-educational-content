question: "Ron Paul yerekanye gute ikibanza ca paleo-libertarian ku bibazo nk'ikoreshwa ry'ibiyayuramutwe no gukorora inda?"
answer: "Ku giti ciwe yarahanuye abantu kudakoresha ibiyayuramutwe kandi arwanya gukorora inda, ariko mu vya politike yararwanije ukuzibuzwa na Leta nkuru kandi avuga ko amahitamwo akwiye gusigirwa abantu ku giti cabo canke intara"
wrong_answers:
  - "Yarashigikiye ko Leta nkuru yemerera ibiyayuramutwe vyose n'ugukorora inda nk'ikibazo c'uburenganzira bwuzuye bw'umuntu ku giti ciwe"
  - "Yariyamamarije ukuzibuzwa gukomeye na Leta nkuru ku biyayuramutwe no ku gukorora inda ashingiye ku vyo yemera mu nyifato runtu ku giti ciwe"
  - "Yaranse kuvuga iciyumviro ciwe bwite kuri ivyo bibazo, avuga ko abanyapolitike bakwiye kuguma ata ruhande bafashe mu vy'inyifato runtu"
explanation: >-
  Ron Paul ni akarorero k'isanganya rya paleo-libertarian mu gutandukanya ivyo yemera mu nyifato runtu ku giti ciwe n'agahato ka politike. Yama ahanura abantu kudakoresha ibiyayuramutwe ariko muri ico gihe nyene akarwanya ukubibuza. Ku giti ciwe yarwanya gukorora inda, ariko akavuga ko ihitamwo rikwiye gusigirwa intara zigize igihugu aho guhatirwa rivuye hejuru. Ivyo vyerekana ingene umuntu ashobora kugira indangagaciro za kera zikomeye ariko akanka gukoresha ububasha bw'agahato bwa Leta nkuru kugira ngo azishikamishe.
