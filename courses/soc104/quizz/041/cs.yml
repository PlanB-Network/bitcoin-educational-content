question: "Jak mohou programy sociální pomoci financované státem vytvářet perverzní účinky a ilustrovat nebezpečí spoléhání se pouze na záměry?"
answer: "Mohou vytvářet závislost, odstraňovat pobídky k práci a představovat spoliaci, protože peníze musí být nejprve vzaty těm, kdo bohatství vytvořili"
wrong_answers:
  - "Podporují nadměrné osobní úspory, snižují spotřebitelské výdaje a způsobují deflaci v širší ekonomice"
  - "Posilují soukromé podnikání tím, že přesouvají náklady práce na vládu a snižují potřebu konkurenčních mezd"
  - "Odstraňují třídní rozdíly tak důkladně, že sociální mobilita se stává zbytečnou a inovace stagnují"
explanation: >-
  Friedman varuje, že velkorysé záměry mohou vytvářet škodlivé důsledky, když zanedbávají přísnou analýzu lidských pobídek. Programy pomoci financované státem riskují vytváření závislosti, nevytvářejí žádnou pobídku k práci a představují formu spoliace, protože prostředky musí být nejprve vzaty tvůrcům bohatství. Měřitelné výsledky, jako je snížení chudoby a efektivita, musí mít přednost před ušlechtilými záměry.
