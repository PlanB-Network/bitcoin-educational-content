question: "Čemu libertariáni věří ohledně schopnosti jednotlivců rozhodovat?"
answer: "Jednotlivci mají právo i odpovědnost činit vlastní rozhodnutí o svém životě"
wrong_answers:
  - "Jednotlivci by měli činit rozhodnutí pouze po konzultaci s volenými zástupci, kteří rozumějí politickým důsledkům"
  - "Jednotlivci obecně nejsou schopni činit dobrá rozhodnutí a potřebují odborné vedení vládních institucí"
  - "Jednotlivci by měli svobodně činit ekonomická rozhodnutí, ale ve všech sociálních a kulturních otázkách se podřídit státu"
explanation: >-
  Z libertariánského pohledu mají jednotlivci právo i odpovědnost činit vlastní rozhodnutí. To kontrastuje s konvenčními politickými rodinami od levice po pravici, které věří, že vláda by měla činit některá nebo mnohá důležitá rozhodnutí v životě jednotlivce a v ekonomickém životě obecně.
