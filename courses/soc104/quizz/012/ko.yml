question: "놀런 도표에서 개인적 자유 축의 하단은 무엇을 특징으로 하나요?"
answer: "질서, 안전, 전통적 가치에 대한 선호와, 국가가 도덕을 규제하고 공공질서를 유지하는 것"
wrong_answers:
  - "개인의 자율성, 관용, 개인적 삶의 선택에 대한 최소한의 국가 간섭에 대한 선호"
  - "경제 규제 완화, 자유무역, 관세와 보조금 폐지에 대한 선호"
  - "부의 재분배, 높은 세금, 핵심 산업의 국유화에 대한 선호"
explanation: >-
  개인적 자유 축의 하단은 개인 생활에 대한 최대한의 국가 통제를 나타내며, 질서, 안전, 전통적 가치에 대한 선호로 특징지어집니다. 국가는 도덕을 규제하고 공공질서를 유지하며, 특정한 도덕관이나 전통관을 옹호할 수 있습니다. 축의 상단은 그 반대, 즉 개인의 자유와 관용을 나타냅니다. 경제 정책은 별도의 수평축에서 측정됩니다.
reviewed: false
