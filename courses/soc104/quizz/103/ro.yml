question: "Cum susține cursul că libertatea permite valorilor de stânga și de dreapta să coexiste pașnic?"
answer: "Într-un regim de libertate autentică, oamenii cu idealuri de stânga pot împărți voluntar posesiuni și redistribui fonduri, în timp ce cei cu valori de dreapta pot economisi și transmite tradiții, fără ca vreuna dintre părți să-și impună modul de viață celeilalte"
wrong_answers:
  - "Libertatea cere ambelor părți să facă compromisuri acceptând o poziție centristă în care guvernul echilibrează valorile concurente prin reglementare moderată"
  - "Libertatea înseamnă că comunitățile de stânga și de dreapta trebuie să trăiască în teritorii geografice separate cu propriile guverne independente"
  - "Libertatea funcționează permițând cetățenilor să voteze ce valori ar trebui impuse în fiecare regiune, alternând între politici de stânga și de dreapta la fiecare ciclu electoral"
explanation: >-
  Cursul arată că, într-un regim autentic de libertate, cei care aderă la idealuri de stânga pot renunța voluntar la posesiuni, pot împărți mijloacele de producție sau pot dona salarii către organizații redistributive. Cei cu valori de dreapta pot munci din greu, pot economisi și pot transmite valori familiale. Nimeni nu ar trebui să-și impună modul de viață asupra altora. Prin libertatea pieței și puterea alegerii, obiectivele pot fi atinse pașnic.
reviewed: false
