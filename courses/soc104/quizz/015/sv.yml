question: "Varför hävdar den tvådimensionella modellen att de flesta politiska frågor kan delas upp i ekonomiska och personliga kategorier?"
answer: "Eftersom ekonomiska frågor handlar om det du gör som producent och konsument, medan personliga frågor handlar om dina privata relationer, övertygelser och kroppsliga autonomi"
wrong_answers:
  - "Eftersom alla politiska debatter i slutändan reduceras till oenigheter om skattenivåer och religiösa praktiker"
  - "Eftersom regeringar historiskt sett bara reglerar två saker: marknaden och militären"
  - "Eftersom politiska filosofer alltid har skilt materiella angelägenheter från andliga angelägenheter sedan antiken"
explanation: >-
  Den tvådimensionella modellen bygger på idén att politiska frågor delas upp i två breda kategorier. Ekonomiska friheter omfattar produktion, konsumtion, handel, sysselsättning och penninghantering. Personliga friheter omfattar privata relationer, åsikter, övertygelser och val som rör din egen kropp och ditt eget sinne. Denna uppdelning möjliggör en mycket mer nyanserad kartläggning av politiska positioner än en enda vänster-höger-axel.
