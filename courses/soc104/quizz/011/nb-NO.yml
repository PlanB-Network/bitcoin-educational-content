question: "Hva omfatter kategorien personlig frihet?"
answer: "Hva du gjør i dine private relasjoner, med dine meninger, overbevisninger og alt som involverer din egen kropp og ditt eget sinn"
wrong_answers:
  - "Hva du gjør som produsent, inkludert å starte en bedrift, ansette ansatte og handle varer"
  - "Hvor mye skatt du betaler, hvilke investeringer du gjør, og hvordan du forvalter dine finansielle eiendeler"
  - "Din evne til å konkurrere i markedet, sette priser på produktene dine og velge leverandørene dine"
explanation: >-
  Personlig frihet omfatter hva du gjør i dine private relasjoner, med dine meninger og overbevisninger, og alt som involverer din egen kropp og ditt eget sinn. Dette inkluderer ekteskap, lesevalg, religiøs praksis, valg av mat og medisin, og hvem du omgås. Forretningsaktiviteter, skatter og markedsbeslutninger faller inn under økonomisk frihet.
reviewed: false
