question: "Kuidas määratleb struktuurne lähenemine sotsialismi ja libertarismi põhilise erinevuse?"
answer: "Sotsialism annab regulatsiooni, planeerimise ja kontrolli kaudu esmasuse riigile, samas kui libertarism annab minimaalse riikliku sekkumise kaudu esmasuse üksikisikule"
wrong_answers:
  - "Sotsialism eelistab maaelu põllumajanduslikke kogukondi, samas kui libertarism soosib linnalist tööstusarengut"
  - "Sotsialismi määratleb selle toetus demokraatlikele valimistele, samas kui libertarism lükkab tagasi kõik poliitilise osaluse vormid"
  - "Sotsialism keskendub välispoliitikale ja rahvusvahelisele koostööle, samas kui libertarism tegeleb ainult sisemaiste majandusküsimustega"
explanation: >-
  Struktuurselt iseloomustab sotsialismi riigi kõikjalolek: riik reguleerib, planeerib ja kontrollib. Libertarismi määratleb riigi minimaalne sekkumine majandusse ja eraellu ning kalduvus üksikisiku vabaduse ja vaba turu esmasuse poole. See struktuurne eristus on analüütiliselt palju kasulikum kui iga süsteemi väljakuulutatud kavatsuste võrdlemine.
reviewed: false
