question: "Em todos os cinco debates econômicos (impostos, salário mínimo, saúde, meio ambiente, subsídios), que padrão consistente distingue o método centrista das posições de outras famílias políticas?"
answer: "Centristas se recusam a se comprometer com um princípio fixo e, em vez disso, exigem análise empírica e avaliação de especialistas para determinar a política caso a caso, tornando sua abordagem inerentemente tecnocrática"
wrong_answers:
  - "Centristas sempre adotam uma posição intermediária entre as posturas socialista e conservadora, dividindo a diferença em cada questão igualmente"
  - "Centristas priorizam consistentemente o crescimento econômico em detrimento do bem-estar social, alinhando-se aos libertários na política fiscal enquanto concordam com os socialistas na regulamentação"
  - "Centristas delegam todas as decisões econômicas a organizações internacionais e acordos comerciais em vez de formular política nacional independente"
explanation: >-
  Em todos os cinco debates econômicos, a abordagem centrista segue o mesmo padrão: em vez de se comprometer com um princípio ideológico fixo, centristas exigem evidência empírica e avaliação de especialistas antes de tomar decisões. Nos impostos, o nível correto deve ser determinado por análise. No salário mínimo, o nível deve ser ajustado pragmaticamente. Na saúde, uma combinação calibrada por especialistas é ideal. No meio ambiente, a política deve equilibrar competitividade. Nos subsídios, cada caso deve ser avaliado por seus próprios méritos. Isso torna o centrismo inerentemente tecnocrático, o que é diferente de simplesmente dividir a diferença ou delegar a organismos internacionais.
