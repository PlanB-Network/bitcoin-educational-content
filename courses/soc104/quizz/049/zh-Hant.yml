question: "George W. Bush 對 2008 年金融危機的回應如何說明保守主義原則的「有問題的彈性」？"
answer: "他放棄自由市場原則以救助大型銀行，揭示了保守主義把國家視為國民經濟穩定的最終保證者"
wrong_answers:
  - "他拒絕一切政府干預並讓銀行倒閉，不顧後果地嚴格遵守自由市場意識形態"
  - "他永久國有化銀行部門並引入累進稅制，從保守主義轉向民主社會主義"
  - "他的回應是削減所有政府支出並取消金融管制，讓市場自行修正"
explanation: >-
  Bush 宣稱，他透過干預救助大型銀行，已「放棄自由市場原則，以拯救自由市場體系」。這說明保守主義者如何能把國家的力量與延續，置於抽象市場原則之上。同樣的彈性邏輯也出現在 Trump 的保護主義貿易政策中；這些政策以國家利益之名推行，卻有助長 corporatism 與裙帶資本主義的風險。
reviewed: false
