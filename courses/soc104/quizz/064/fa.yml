question: "چرا رژیم‌های تمامیت‌خواه به‌عنوان «ادیان سکولار» توصیف شده‌اند، و این امر درباره شرایط لازم برای وجود تمامیت‌خواهی چه چیزی را آشکار می‌کند؟"
answer: "آن‌ها از مبارزان ایمانی شبه‌دینی می‌طلبند و علیه مخالفان از ترس استفاده می‌کنند، و تمامیت‌خواهی مستلزم حضور هم‌زمان همه ویژگی‌هاست: آزادی‌های سرکوب‌شده، حاکمیت تک‌حزبی، انقلاب خشونت‌آمیز و اقتصاد هدایت‌شده"
wrong_answers:
  - "آن‌ها عبادت سنتی را با مراسم دولتی جایگزین می‌کنند، و تمامیت‌خواهی فقط به یک رهبر کاریزماتیک و کنترل نظامی نیاز دارد"
  - "آن‌ها از نهادهای دینی برای تحمیل ایدئولوژی دولتی استفاده می‌کنند، و تمامیت‌خواهی هر زمان که یک حزب سیاسی واحد بر پارلمان مسلط شود می‌تواند پدید آید"
  - "آن‌ها از طریق کنش سیاسی وعده رستگاری معنوی می‌دهند، و تمامیت‌خواهی هر زمان که دولت اقتصاد را کنترل کند، صرف‌نظر از آزادی‌های سیاسی، وجود دارد"
explanation: >-
  ریمون آرون مشاهده کرد که رژیم‌های تمامیت‌خواه بر دو اصل عمل می‌کنند: ایمان مبارزان و ترس مخالفان. این تعصب شبه‌دینی، فراتر از انگیزه‌های متفاوتشان، آن‌ها را مشخص می‌کند و برچسب ادیان سکولار را برایشان به همراه می‌آورد. نکته حیاتی این است که تمامیت‌خواهی مستلزم حضور هم‌زمان همه ویژگی‌های تعریف‌کننده است: آزادی‌های سرکوب‌شده، اقتدار نامحدود از طریق یک حزب واحد، انقلاب خشونت‌آمیز و اقتصاد هدایت‌شده. دموکراسی‌های مدرن ممکن است برخی از این ویژگی‌ها را نشان دهند، اما تمامیت‌خواهی فقط زمانی حاضر است که همه آن‌ها با هم گرد آمده باشند.
reviewed: false
