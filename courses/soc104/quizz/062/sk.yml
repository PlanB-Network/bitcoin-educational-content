question: "Čo odhaľuje Mussoliniho vyhlásenie z roku 1920 „Všetko v štáte, nič mimo štátu, nič proti štátu“ o totalitarizme?"
answer: "Už neexistuje žiadne oddelenie verejného a súkromného priestoru, pretože štát úplne pohlcuje spoločnosť"
wrong_answers:
  - "Štát sa zameriava výlučne na vojenskú moc a ekonomiku ponecháva súkromnému podnikaniu"
  - "Občania sa môžu slobodne organizovať súkromne, pokiaľ otvorene nekritizujú vládu"
  - "Vláda kontroluje iba politickú činnosť, zatiaľ čo kultúrny a náboženský život zostávajú autonómne"
explanation: >-
  Mussoliniho vyhlásenie zachytáva podstatu totalitarizmu: totalitu. Všetko je pohltené štátom, čo znamená, že neexistuje oddelenie verejného a súkromného priestoru. Spoločnosť stráca akúkoľvek formu autonómie až po najvšednejšie činnosti, napríklad založenie športového klubu. To ďaleko presahuje kontrolu iba vojenskej, politickej alebo ekonomickej sféry.
reviewed: false
