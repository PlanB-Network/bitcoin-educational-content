question: "Hvordan behandler sosialisme friheter forskjellig i den samfunnsmessige og den økonomiske sfæren?"
answer: "Sosialisme favoriserer sterke friheter i den samfunnsmessige sfæren, men svake friheter i den økonomiske sfæren"
wrong_answers:
  - "Sosialisme begrenser alle friheter likt på tvers av både den samfunnsmessige og den økonomiske sfæren"
  - "Sosialisme favoriserer sterke økonomiske friheter, men begrenser samfunnsmessige friheter for å opprettholde sosial orden"
  - "Sosialisme gir ubegrensede friheter i begge sfærer og bygger på frivillig samarbeid for å opprettholde balanse"
explanation: >-
  I sosialistisk tenkning finnes det en grunnleggende dikotomi mellom samfunnsmessige og økonomiske friheter. Samfunnsmessige friheter er sterke, men økonomiske friheter er svake på grunn av vektleggingen av statlig kontroll, planlegging og omfordeling av rikdom. Det tredje gale svaret beskriver det libertarianske idealet, mens det andre beskriver det konservative mønsteret, som er speilbildet av sosialisme.
reviewed: false
