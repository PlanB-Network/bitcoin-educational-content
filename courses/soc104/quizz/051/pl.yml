question: "Jak reakcja George'a W. Busha na kryzys finansowy z 2008 roku ilustruje 'problematyczną elastyczność' zasad konserwatywnych?"
answer: "Porzucił zasady wolnego rynku, aby ratować wielkie banki, ujawniając konserwatywne postrzeganie państwa jako ostatecznego gwaranta narodowej stabilności gospodarczej"
wrong_answers:
  - "Odmówił jakiejkolwiek interwencji rządu i pozwolił bankom upaść, ściśle trzymając się ideologii wolnorynkowej bez względu na konsekwencje"
  - "Trwale znacjonalizował sektor bankowy i wprowadził progresywne opodatkowanie, przechodząc od konserwatyzmu do socjalizmu demokratycznego"
  - "Zareagował, tnąc wszystkie wydatki rządowe i eliminując regulacje finansowe, aby pozwolić rynkowi samodzielnie się skorygować"
explanation: >-
  Bush oświadczył, że 'porzucił zasady wolnego rynku, aby ocalić system wolnorynkowy', interweniując w celu ratowania wielkich banków. Pokazuje to, jak konserwatyści mogą przedkładać siłę i ciągłość narodu nad abstrakcyjne zasady rynkowe. Ta sama elastyczna logika pojawia się w protekcjonistycznej polityce handlowej Trumpa, prowadzonej w imię interesu narodowego, nawet za cenę ryzyka podsycania korporacjonizmu i kapitalizmu kolesiowskiego.
