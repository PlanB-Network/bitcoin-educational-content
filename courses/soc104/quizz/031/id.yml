question: "Apa yang diyakini libertaires Prancis (anarkis sosialis) tentang kepemilikan pribadi?"
answer: "Kepemilikan pribadi dan kapitalisme harus dihapuskan karena keduanya merupakan sumber penindasan"
wrong_answers:
  - "Kepemilikan pribadi adalah hak alamiah yang mendahului negara dan harus dilindungi dengan segala cara"
  - "Kepemilikan pribadi seharusnya diatur oleh negara tetapi tidak pernah dihapuskan sepenuhnya dari masyarakat"
  - "Kepemilikan pribadi dapat diterima hanya ketika didistribusikan secara merata di antara semua anggota komune"
explanation: >-
  Para libertaires Prancis, pewaris anarkisme sosialis melalui pemikir seperti Proudhon dan Bakunin, berpendapat bahwa baik negara maupun kepemilikan pribadi harus dihapuskan sebagai dua sumber penindasan. Hal ini terangkum dalam rumusan terkenal Proudhon "Kepemilikan adalah pencurian." Jawaban salah pertama menggambarkan posisi libertarian, yang secara fundamental bertentangan dengan pandangan libertaire.
