question: Kết quả của cuộc chiến kích thước khối dữ liệu (block size war) vào năm 2017 là gì?
answer: Người dùng và các máy chủ đã từ chối thay đổi đề xuất nhằm tăng kích thước khối (block size), và đã kích hoạt một bản cập nhật gọi là SegWit.
wrong_answers:
  - Người dùng và các máy chủ đã chấp nhận thay đổi đề xuất nhằm tăng kích thước khối (block size), và đã kích hoạt một bản cập nhật gọi là SegWit.
  - Người dùng và các máy chủ đã từ chối thay đổi đề xuất nhằm tăng kích thước khối (block size), và không kích hoạt bất kỳ bản cập nhật nào.
  - Người dùng và các máy chủ đã chấp nhận thay đổi đề xuất nhằm tăng kích thước khối (block size), và không kích hoạt bất kỳ bản cập nhật nào.
explanation: >-
  Trong cuộc chiến kích thước khối dữ liệu (block size war) vào năm 2017, người dùng và các máy chủ đã giành chiến thắng bằng cách từ chối thay đổi đề xuất nhằm tăng kích thước khối (block size), và đã kích hoạt một bản cập nhật gọi là SegWit.
reviewed: true