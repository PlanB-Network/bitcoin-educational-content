question: "Iburyo bushaka gushinga amategeko ku biki?"
answer: "Inyifato runtu n'idini, biterwa n'icipfuzo co kuzigama inzego za kera n'inzego z'ubusumbasumbane mu kibano"
wrong_answers:
  - "Ubutunzi n'amasoko y'imari, biterwa n'icipfuzo co kugabanya ubusumbasumbane no gusubira kugabura ubutunzi"
  - "Siyansi n'indero, biterwa n'icipfuzo co kugenzura ivyigishwa mu mashure ya Leta"
  - "Ubudandaji mpuzamakungu na diplomatie, biterwa n'icipfuzo co kwagura ububasha bw'igihugu hanze"
explanation: >-
  Iburyo buha imbere inyifato runtu y'umuntu n'indangagaciro za kera. Bubona ko ubusivilizasioni bwubakiye ku nzego zimwezimwe za kera no ku nzego z'ubusumbasumbane mu kibano zitegerezwa kuzigamwa, kandi bushaka gushinga amategeko ku nyifato runtu no ku dini. Ibumoso, si iburyo, ni bwo bwibanda ku gushinga amategeko ku butunzi. Siyansi, indero, na politike y'ubudandaji si vyo vyerekanywe nk'ivy'imbere ku buryo.
