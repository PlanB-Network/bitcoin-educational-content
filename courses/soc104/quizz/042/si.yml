question: "societal සහ economic spheres තුළ socialism freedoms වෙනස් ලෙස සලකන්නේ කෙසේද?"
answer: "socialism societal sphere තුළ strong freedoms කැමති නමුත් economic sphere තුළ weak freedoms තබයි"
wrong_answers:
  - "socialism societal සහ economic spheres දෙකම හරහා සියලු freedoms සමානව restrict කරයි"
  - "socialism strong economic freedoms කැමති නමුත් social order maintain කිරීමට societal freedoms restrict කරයි"
  - "socialism spheres දෙකෙහිම unlimited freedoms grant කර, balance maintain කිරීමට voluntary cooperation මත රඳා පවතී"
explanation: >-
  Socialist thought තුළ, societal සහ economic freedoms අතර fundamental dichotomy එකක් ඇත. Societal freedoms strong වන අතර, state control, planning, සහ wealth redistribution මත emphasis නිසා economic freedoms weak වේ. තුන්වන වැරදි පිළිතුර libertarian ideal එක විස්තර කරන අතර, දෙවන පිළිතුර socialism හි mirror image එක වන conservative pattern එක විස්තර කරයි.
