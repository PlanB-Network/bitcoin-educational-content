question: "Hvilket felles punkt deler venstreorienterte og høyreorienterte politiske partier til tross for deres tilsynelatende motsetning?"
answer: "Begge forsvarer statens rett til å styre folks liv gjennom reguleringer og skatter"
wrong_answers:
  - "Begge går inn for fullstendig avskaffelse av statlig inngripen i økonomiske saker"
  - "Begge prioriterer individuell frihet over kollektiv organisering av samfunnet"
  - "Begge avviser bruk av pengepolitikk som et verktøy for offentlige utgifter"
explanation: >-
  Til tross for at de virker som motsetninger, deler venstre og høyre en preferanse for statlig inngripen. Begge kritiserer det frie markedet og forsvarer statens rett til å styre folks liv gjennom reguleringer og skatter. Venstresiden kritiserer markeder som en kilde til ulikhet, mens høyresiden ser dem som en trussel mot suverenitet, men begge vender seg til staten for løsninger.
reviewed: false
