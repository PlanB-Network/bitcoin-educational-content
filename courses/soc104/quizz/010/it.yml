question: "Quale tensione interna esiste tra i libertari nel diagramma di Nolan?"
answer: "Alcuni vogliono abolire completamente lo stato (anarco-capitalisti), mentre altri preferiscono uno stato minimo che mantenga le funzioni sovrane fondamentali (minarchisti)"
wrong_answers:
  - "Alcuni vogliono una forte regolamentazione economica mentre altri preferiscono la deregolamentazione completa di tutte le industrie"
  - "Alcuni sostengono le elezioni democratiche mentre altri favoriscono un sistema di governo ereditario"
  - "Alcuni sostengono politiche sociali progressiste mentre altri difendono valori morali strettamente tradizionali"
explanation: >-
  All'interno della famiglia libertaria, c'è un disaccordo fondamentale sul ruolo dello stato. Gli anarco-capitalisti vogliono sostituire tutte le funzioni statali con servizi privati, mentre i minarchisti accettano uno stato minimo che mantenga funzioni sovrane fondamentali come difesa e tribunali. Entrambi i gruppi condividono il vertice libertario ma differiscono sul fatto che debba esistere o meno uno stato.
