question: Simplicity ක්‍රියාත්මක වන අතරතුර ගතික මතක වෙන්කිරීම බැහැර කරන්නේ ඇයි?
answer: ස්ථිතික විශ්ලේෂණය සක්‍රීය කර, සම්පූර්ණ දෝෂ සහ ප්‍රහාර පංති බැහැර කිරීමට.
wrong_answers:
  - Liquid Network පහළ-මට්ටමේ මතක මෙහෙයුම් සඳහා සහාය නොදක්වන නිසා.
  - නව smart-contract සංවර්ධකයින් සඳහා programming ඉගෙනුම් වක්‍රය අඩු කිරීමට.
  - Bitcoin Script තුළද ගතික මතක වෙන්කිරීමක් නැති නිසා.
explanation: >-
  Simplicity ගතික මතක වෙන්කිරීමෙන් වැළකෙන්නේ සියලුම සම්පත් භාවිතය
  ක්‍රියාත්මක කිරීමට පෙර ස්ථිතිකව තීරණය කළ හැකි වන පරිදි ය. මෙය පුරෝකථනය කළ හැකි
  සම්පත් සීමා සක්‍රීය කර, මතක කළමනාකරණයට සම්බන්ධ අවදානම් ඉවත් කරයි;
  blockchain සත්‍යාපන සන්දර්භයක මෙය අත්‍යවශ්‍ය වේ.
