question: "Wie verstärkt das Fiatgeldsystem die Kluft zwischen Regierenden und Regierten?"
answer: "Es erlaubt Regierungen, unbegrenzte Ausgaben durch Geldschöpfung zu finanzieren, was Ersparnisse durch Inflation entwertet"
wrong_answers:
  - "Es gibt Bürgern durch demokratische Wahlen und Referenden direkte Kontrolle über die Geldpolitik"
  - "Es hindert Regierungen daran, Kredite aufzunehmen, und zwingt sie, sich ausschließlich auf Steuern als Einnahmequelle zu stützen"
  - "Es verteilt neu geschaffenes Geld gleichmäßig an alle Bürger, um das Wirtschaftswachstum anzukurbeln"
explanation: >-
  Fiatwährung wird als Eckpfeiler der Ausweitung staatlicher Macht beschrieben, weil sie es Regierungen ermöglicht, Kredite aufzunehmen und Banken dazu zu drängen, neues Geld zu drucken. Die daraus resultierende Inflation entwertet die Ersparnisse der Menschen und begünstigt die reichsten und mächtigsten Akteure. Sie gibt den Bürgern keine monetäre Kontrolle, verhindert keine Kreditaufnahme und verteilt Geld nicht gleichmäßig.
reviewed: false
