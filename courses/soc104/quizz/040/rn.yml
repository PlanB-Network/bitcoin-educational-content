question: "Karl Marx yatandukanije gute sosiyalizimu y'ivyifuzo n'iyita sosiyalizimu ya siyansi?"
answer: "Yagirije abasosiyaliste b'Abafaransa ba mbere gutanga inyishu zishingiye ku vyiyumviro gusa, mu gihe sosiyalizimu yiwe ya siyansi yari ishingiye kuri materialisme historique no ku rugamba rw'imigwi"
wrong_answers:
  - "Yavuze ko sosiyalizimu y'ivyifuzo yibanda cane ku butunzi, mu gihe sosiyalizimu ya siyansi yashira imbere uguhindura umuco n'ubugeni"
  - "Yarashimagije abasosiyaliste b'ivyifuzo kubera igerageza ryabo ry'ingirakamaro, anegura sosiyalizimu ya siyansi ko ari iy'ivyiyumviro cane kandi idafatika"
  - "Yavuze ko sosiyalizimu y'ivyifuzo yari iy'inguvu n'iya revolisiyo, mu gihe sosiyalizimu ya siyansi yashigikira amavugurura ya demokarasi y'amahoro"
explanation: >-
  Marx yagirije abasosiyaliste b'Abafaransa ba mbere nka Proudhon, Saint-Simon, na Fourier ko ari abantu b'ivyifuzo batanga inyishu zishingiye ku nzozi gusa. Sosiyalizimu yiwe ya siyansi yari ishingiye kuri materialisme historique: iciyumviro c'uko amateka atera imbere biciye mu rugamba rw'imigwi no mu kwigarurira uburyo bwo gukora, aho amashusho yose y'umuco agengwa n'inguvu zo gukora n'imigenderanire y'uguhingura.
