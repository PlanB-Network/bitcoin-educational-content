question: "Mussolini 於 1920 年宣稱「一切都在國家之內，沒有任何東西在國家之外，沒有任何東西反對國家」，這揭示了極權主義的什麼特徵？"
answer: "公共空間與私人空間之間不再有任何分離，因為國家完全吸收社會"
wrong_answers:
  - "國家專注於軍事力量，同時把經濟留給私人企業"
  - "只要不公開批評政府，公民就能自由地私下組織"
  - "政府只控制政治活動，而文化與宗教生活仍保持自主"
explanation: >-
  Mussolini 的宣言抓住了極權主義的本質：總體性。一切都被吸收入國家，意味著公共空間與私人空間之間不再有任何分離。社會失去所有形式的自主，甚至到開設運動俱樂部這類最平凡的活動也不例外。這遠遠超出只控制軍事、政治或經濟領域。
reviewed: false
