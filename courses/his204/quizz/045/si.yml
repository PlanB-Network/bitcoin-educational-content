question: L'Ami des Hommes තුළ නොමැති අදහස කුමක්ද?
answer: කෘෂිකර්මාන්තය නිෂ්පාදන කර්මාන්තය වෙනුවට පැමිණෙන නිසා නිෂ්පාදන කර්මාන්තය මන්දගාමී වේ
wrong_answers:
  - ජාතීන්ගේ අවශ්‍යතා සමංජස වේ
  - සියලු ජනතාවන් අතර වෙළඳාම නිදහස් විය යුතුය
  - ජනගහනය ජාතියක ධනයේ සැබෑ මූලාශ්‍රය වේ
explanation: |
  L'Ami des Hommes කෘෂිකර්මාන්තය ප්‍රශංසා කරයි, නිදහස් වෙළඳාම ආරක්ෂා කරයි, සහ ජනගහනය ජාතියක ධනය සෑදෙන බව තර්ක කරයි. කෙසේ වෙතත්, කෘෂිකර්මාන්තය නිෂ්පාදන කර්මාන්තය ඉවත් කරයි යැයි එය නොකියයි. Mirabeau කෘෂිකර්මාන්තය සැබෑ ධනයේ මූලාශ්‍රය ලෙස දකින අතර, කර්මාන්තයට ප්‍රතිවාදියෙකු ලෙස නොදකියි.
