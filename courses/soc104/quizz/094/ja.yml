question: "なぜ貨幣インフレは、市民の同意なしに課される隠れた税と説明されるのか？"
answer: "政府による貨幣創造が通貨の価値を下げ、同じ金額で買えるものを減らすにもかかわらず、多くの人は価格上昇が自然な市場の力ではなく政府政策を反映していることに気づかないから"
wrong_answers:
  - "中央銀行が、銀行システムを通じて処理されるすべての取引に対して手数料を秘密裏に課し、口座保有者に開示しないから"
  - "政府が貨幣を印刷して富裕層にだけ配り、生活必需品への高い売上税を通じて貧しい人々に課税するから"
  - "インフレは民間企業が利益を増やすために価格を引き上げることで生じ、消費者に対する非公式な税として機能するから"
explanation: >-
  システムへの貨幣注入は通貨価値の低下へと変換され、新しい貨幣が本物の経済成長を反映していないため、同じ金額で買えるものは少なくなる。
  ほとんどの人は、価格上昇をもたらしたのが政府政策であり、それが単に通貨価値低下の反映であることを見ていない。
  これは合法的な窃盗であり、制度化された収奪に等しく、富裕層が投機的資産を通じて新しい貨幣を捕捉する一方で、中間層を貧困化させる。
reviewed: false
