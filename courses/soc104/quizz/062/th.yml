question: "ความแตกต่างสำคัญที่ Hannah Arendt ชี้ระหว่างเผด็จการคลาสสิกกับเบ็ดเสร็จนิยมคืออะไร?"
answer: "เบ็ดเสร็จนิยมไม่ได้เพียงทำให้ผู้คนอยู่ใต้กฎทรราชย์ แต่ทำให้มนุษย์ไม่สามารถกระทำโดยอิสระได้ เป็นการปฏิเสธการเมืองเอง"
wrong_answers:
  - "เผด็จการคลาสสิกควบคุมเศรษฐกิจ ขณะที่เบ็ดเสร็จนิยมควบคุมเฉพาะสถาบันการเมืองและทหาร"
  - "เบ็ดเสร็จนิยมเป็นเพียงเผด็จการเวอร์ชันสุดโต่งกว่า ต่างกันเพียงขนาดของการปราบปราม"
  - "เผด็จการคลาสสิกใช้ ideology เพื่อให้เหตุผลแก่การปกครอง ขณะที่เบ็ดเสร็จนิยมพึ่งกำลังทหารล้วน ๆ"
explanation: >-
  Arendt โต้แย้งว่าเบ็ดเสร็จนิยมแตกต่างจากเผด็จการคลาสสิกโดยพื้นฐาน มันไม่ใช่เพียงทรราชย์ที่รุนแรงกว่า แต่เป็นระบบที่ทำให้มนุษย์กลายเป็นส่วนเกิน ทำลายความสามารถของพวกเขาในการกระทำโดยอิสระ สำหรับ Arendt การเมืองคือความสามารถของประชาชนที่จะกุมชะตาของตนไว้ในมือ และเบ็ดเสร็จนิยมคือการปฏิเสธความสามารถนี้โดยตรง ทำให้มันแตกต่างจากเผด็จการในเชิงคุณภาพ
reviewed: false
