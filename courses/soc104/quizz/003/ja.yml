question: "バスティアやロン・ポールのような古典的自由主義の思想家を位置づけるうえで、左右軸が不十分だと考えられるのはなぜですか？"
answer: "古典的自由主義は経済的自由と個人的自由の両方を重視するが、左派も右派もその両方を完全には受け入れないから"
wrong_answers:
  - "古典的自由主義者は常に右派の経済政策に同調し、すべての左派的立場を拒否するから"
  - "古典的自由主義者は、左派と右派のイデオロギーの穏健版を取り入れる中道派だから"
  - "古典的自由主義者はあらゆる形の政府に反対するため、政治思想家ではなく無政府主義者だから"
explanation: >-
  左右軸は古典的自由主義者を捉え損ねます。なぜなら、経済的自由（典型的には右派）と個人的自由（典型的には左派）を同時に擁護する立場を収容できないからです。古典的自由主義者は妥協を求める中道派ではなく、無政府主義者でも純粋な右派でもありません。彼らは単に一次元のスペクトルに収まらないのです。
reviewed: false
