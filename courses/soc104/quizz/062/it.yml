question: "In che modo tutti i regimi totalitari sono arrivati al potere?"
answer: "Attraverso una rivoluzione violenta che giustificava il fare tabula rasa del sistema precedente"
wrong_answers:
  - "Attraverso una graduale riforma legislativa all'interno delle istituzioni democratiche esistenti"
  - "Attraverso colpi di Stato militari organizzati da potenze straniere in cerca di controllo regionale"
  - "Attraverso movimenti di massa pacifici che hanno vinto le elezioni popolari con ampi margini"
explanation: >-
  Tutti i regimi totalitari sono arrivati al potere attraverso una rivoluzione violenta. Questa rivoluzione serve a un duplice scopo: distrugge fisicamente il vecchio ordine e giustifica ideologicamente l'uso della violenza come necessario per costruire la nuova società. Questo distingue le prese di potere totalitarie dalle transizioni democratiche, dai colpi di Stato sostenuti dall'estero o dalle vittorie elettorali pacifiche.
