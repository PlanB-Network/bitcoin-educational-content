question: "Woher stammt die politische Links-rechts-Spaltung?"
answer: "Aus der Sitzordnung während der Debatten der Französischen Revolution von 1789"
wrong_answers:
  - "Aus den Schriften von Karl Marx und Adam Smith im neunzehnten Jahrhundert"
  - "Aus dem Amerikanischen Bürgerkrieg zwischen Nord- und Südstaaten"
  - "Von den Philosophen der Aufklärung, die Vernunft von Tradition trennten"
explanation: >-
  Die Links-rechts-Spaltung geht auf das Jahr 1789 zurück, als die Abgeordneten in der französischen Nationalversammlung, die für die Beibehaltung der Macht des Königs eintraten, rechts vom Präsidenten saßen, während diejenigen, die seine Befugnisse begrenzen wollten, links saßen. Sie stammt nicht von Marx und Smith, dem Amerikanischen Bürgerkrieg oder der Philosophie der Aufklärung.
reviewed: false
