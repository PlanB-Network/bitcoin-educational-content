bio: |
  Expert IT și mentor în securitate cibernetică. Sunt pasionat de bitcoin de când l-am descoperit în 2010. Hacker etic și fan Norster, îi ajut pe oameni să se pregătească mai bine pentru provocările de mâine. Am contribuit la crearea SECU101 pentru începători.

short_bio: Expert în securitate cibernetică
