question: "Кто запустил первый список рассылки шифропанков в 1992 году?"
answer: "Тим Мэй и Эрик Хьюз, создавшие платформу, которая стала нервным центром движения"
wrong_answers:
  - "Сатоши Накамото и Хэл Финни, которые позже вместе создали Bitcoin в 2008 году"
  - "Джулиан Ассанж и Эдвард Сноуден, использовавшие список для координации разоблачений государственной деятельности"
  - "Фил Циммерман и Брюс Шнайер, разработавшие список как инструмент для распространения программного обеспечения шифрования"
explanation: >-
  В 1992 году Тим Мэй и Эрик Хьюз запустили первый список рассылки шифропанков. Эта платформа быстро стала нервным центром движения, объединив разработчиков, криптографов и сторонников цифровой свободы. Именно в этом списке Сатоши Накамото позже впервые поделился Bitcoin White Paper в 2008 году.
reviewed: false
