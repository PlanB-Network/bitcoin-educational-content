question: "पांच सामाजिक बहसों (विवाह, आव्रजन, आग्नेयास्त्र, मादक पदार्थ, मीठे पेय) में कौन सा आवर्ती विश्लेषणात्मक ढांचा हर मुद्दे पर समाजवादी स्थिति को आकार देता है?"
answer: "प्रभुत्वशाली और अधीनस्थों के बीच संघर्ष का ढांचा, जिसमें समाज को उत्पीड़न से संरचित माना जाता है और राज्य को कमजोर समूह की रक्षा के लिए हस्तक्षेप करना चाहिए"
wrong_answers:
  - "एक उपयोगितावादी ढांचा, जो अधिकतम नागरिकों के लिए समग्र सुख और आर्थिक उत्पादकता को अधिकतम करने पर केंद्रित है"
  - "एक प्राकृतिक अधिकार ढांचा, जिसमें व्यक्तिगत स्वतंत्रताओं को राज्य और कॉर्पोरेट हस्तक्षेप दोनों से बचाया जाना चाहिए"
  - "एक परंपरावादी ढांचा, जिसमें स्थापित सामाजिक संस्थाओं को विघटनकारी आधुनिक परिवर्तनों के विरुद्ध संरक्षित किया जाना चाहिए"
explanation: >-
  सामाजिक बहसों में समाजवादी स्थिति लगातार प्रभुत्वशाली/अधीनस्थ संघर्ष ढांचे से आकार लेती है। विवाह पर, यह विषमलैंगिक बहुसंख्यक द्वारा समलैंगिक अल्पसंख्यक का उत्पीड़न है। आव्रजन पर, राष्ट्रीयता-आधारित प्रतिबंध उत्पीड़न के रूप हैं। आग्नेयास्त्रों पर, कमजोरों की रक्षा के लिए बल केवल राज्य के पास होना चाहिए। मीठे पेयों पर, उद्योगपति सबसे कम संरक्षित लोगों की कमजोरी से लाभ कमाते हैं। यह उत्पीड़क/उत्पीड़ित दृष्टि लिंग, नस्ल और यहां तक कि मानवता और प्रकृति के संबंध सहित अनेक क्षेत्रों में दोहराई जाती है।
reviewed: false
