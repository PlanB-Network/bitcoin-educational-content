question: "در فلسفهٔ سیاسی محافظه‌کارانه، چه چیزی بر آزادی تقدم دارد؟"
answer: "نظم و سنت، که باید پیش از آنکه آزادی بتواند ارزشمند شمرده شود، محکم برقرار شده باشند"
wrong_answers:
  - "عدالت اجتماعی و برابری، که باید پیش از آنکه افراد واقعاً آزاد باشند، تضمین شوند"
  - "کارایی اقتصادی و نتایج عمل‌گرایانه، که تعیین می‌کنند آزادی چه زمانی مناسب است"
  - "حقوق مالکیت فردی، که باید پیش از اعطای هر آزادی دیگری محافظت شوند"
explanation: >-
  برای محافظه‌کاران، نظم و سنت بر آزادی تقدم دارند. آنان استدلال می‌کنند که آزادی بیش از حد، آشوب و بی‌نظمی اجتماعی ایجاد می‌کند؛ بنابراین آزادی فقط زمانی می‌تواند ارزشمند شمرده شود که نظم به‌طور محکم برقرار شده باشد. این دیدگاه با نگاه سوسیالیستی که عدالت را در اولویت می‌گذارد، یا با تمرکز میانه‌روها بر کارایی، تفاوت دارد.
reviewed: false
