question: "लिबर्टेरियन कराधान का विरोध क्यों करते हैं?"
answer: "क्योंकि यह संपत्ति अधिकारों का नैतिक उल्लंघन है, राज्य द्वारा चोरी का एक रूप है, जो सहमति के बिना किसी दूसरे की संपत्ति छीनता है"
wrong_answers:
  - "क्योंकि कर आर्थिक रूप से अक्षम होते हैं और हमेशा बेरोज़गारी दर को बढ़ाते हैं"
  - "क्योंकि कराधान विदेशी निवेश को हतोत्साहित करता है और किसी देश की प्रतिस्पर्धी स्थिति को कमजोर करता है"
  - "क्योंकि प्रगतिशील कर प्रणालियां उन धनी व्यक्तियों को अन्यायपूर्ण ढंग से निशाना बनाती हैं जो सबसे अधिक नौकरियां पैदा करते हैं"
explanation: >-
  कराधान पर लिबर्टेरियन आपत्ति आर्थिक होने से पहले नैतिक है। लिबर्टेरियन कराधान को राज्य द्वारा चोरी का एक रूप और निजी संपत्ति में बाधा मानते हैं, क्योंकि इसमें सहमति के बिना किसी दूसरे की संपत्ति छीनी जाती है। कराधान के विरुद्ध आर्थिक तर्क हो सकते हैं, लेकिन मूल लिबर्टेरियन तर्क इस सिद्धांत पर आधारित है कि यह संपत्ति अधिकारों का उल्लंघन करता है, न कि दक्षता या प्रतिस्पर्धात्मकता की गणनाओं पर।
