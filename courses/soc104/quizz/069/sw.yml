question: "Kuhusu suala la udhibiti wa silaha za moto, tofauti muhimu kati ya misimamo ya kihafidhina na kilibertaria ni ipi?"
answer: "Wote hukubali kiwango fulani cha udhibiti, lakini wahafidhina wanataka kanuni zitoke kwa mamlaka halali ya umma huku walibertaria wakitaka kanuni zitokane na wale wanaohusika moja kwa moja, kama vyama vya raia na ushindani wa soko"
wrong_answers:
  - "Wahafidhina hupinga udhibiti wote wa silaha za moto huku walibertaria wakikubali udhibiti mkali wa serikali kwa ajili ya usalama wa umma"
  - "Wahafidhina wanataka kupiga marufuku silaha za moto kabisa huku walibertaria wakiunga mkono upatikanaji usio na mipaka wa silaha zote"
  - "Wahafidhina hujenga msimamo wao juu ya haki za mtu binafsi huku walibertaria wakijenga wao juu ya wajibu wa pamoja"
explanation: >-
  Wahafidhina na walibertaria wote hukubaliana kwamba aina fulani ya udhibiti wa kubeba silaha ni muhimu. Tofauti muhimu iko katika nani anaweka kanuni hizo. Wahafidhina husisitiza kwamba kanuni lazima zitoke kwa mamlaka ya umma iliyopewa jukumu la kulinda manufaa ya wote (kutoka juu kwenda chini). Walibertaria husema kwamba udhibiti unapaswa kutoka kwa wale wanaohusika moja kwa moja: wataalamu wa usalama, vyama vya raia, na ushindani wa soko (kutoka chini kwenda juu).
