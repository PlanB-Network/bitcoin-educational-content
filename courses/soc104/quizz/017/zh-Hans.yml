question: "诺兰框架中呈现的国家主义定义是什么？"
answer: "使用立法来控制和塑造社会，无论是以捍卫文明、工人阶级、自然还是被压迫者的名义"
wrong_answers:
  - "一种政府制度，其中民选官员任期固定，权力通过民主选举交接"
  - "认为只有强大的军队才能保护一个国家的主权和领土完整的信念"
  - "一种经济哲学，通过关税和配额优先保护本国产业而非外国竞争"
explanation: >-
  国家主义被定义为使用立法来控制和塑造社会。左派和右派都会实践它：一些人以捍卫文明的名义，另一些人以捍卫工人阶级、自然或被压迫者的名义。当这符合中间主义者的利益时，他们也会认可它。国家主义并不限于军事政策、贸易保护主义，也不只是拥有民选政府。
reviewed: false
