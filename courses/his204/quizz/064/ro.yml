question: În timpul Revoluției, care dintre acești autori nu a avut un loc în Adunare?
answer: Marchizul de Mirabeau
wrong_answers:
  - Dupont de Nemours
  - Louis-Paul Abeille
  - Condorcet
explanation: |
  Marchizul de Mirabeau a murit pe 13 iulie 1789, cu o zi înainte de căderea Bastiliei, și nu a avut niciodată un loc în Adunare. Dupont de Nemours, Abeille și Condorcet au participat cu toții activ la adunările revoluționare.
