question: 병렬 합성에서는 입력에 무슨 일이 일어나나요?
answer: 두 연산이 같은 입력을 받고, 그 출력들이 곱(쌍)을 이룹니다.
wrong_answers:
  - 입력이 반으로 나뉘어 각 연산이 별도의 한 부분을 받습니다.
  - 한 연산이 먼저 입력을 처리하고, 다른 연산은 수정된 결과를 받습니다.
  - 입력에 태그가 붙고 두 연산 중 하나에만 전달되어 처리됩니다.
explanation: >-
  병렬 합성은 수정되지 않은 같은 입력을 두 연산에 동시에 제공합니다.
  결과는 곱 타입(쌍)으로 묶입니다. Simplicity에서는 이를 pair 컴비네이터로
  표현하며, f ▵ g라고 쓰고 입력 a에 대해 ⟨f(a), g(a)⟩를 생성합니다.
reviewed: false
