question: "Какво разкрива вертикалната ос на диаграмата на Нолан за истинския политически въпрос?"
answer: "Тя разкрива дали искате да наложите собствените си чувствителности на другите чрез държавата, или предпочитате всеки човек да бъде свободен да решава сам за себе си"
wrong_answers:
  - "Тя разкрива дали подкрепяте демократично управление, или предпочитате авторитарна власт на един-единствен лидер"
  - "Тя разкрива дали се идентифицирате с прогресивни социални движения, или с традиционни религиозни институции"
  - "Тя разкрива дали основната ви грижа е националната сигурност, или икономическият просперитет"
explanation: >-
  Вертикалната ос изважда наяве истинския политически въпрос: не дали сте леви или десни, а до каква степен искате държавата да се намесва в оформянето на обществото според вашите ценности. Желаете ли да наложите собствените си чувствителности на другите, или предпочитате всеки човек да бъде свободен да решава сам за себе си? Тази рамка надхвърля разделението ляво-дясно и показва, че и двата лагера могат да бъдат еднакво етатистки.
reviewed: false
