question: "ทำไม classical liberals ในสหรัฐอเมริกาจึงเริ่มเรียกตนเองว่า 'libertarians' ตั้งแต่ทศวรรษ 1960 เป็นต้นมา?"
answer: "เพื่อแยกตนเองออกจาก American liberals ซึ่งความหมายได้เลื่อนไปทาง interventionism ของรัฐ"
wrong_answers:
  - "เพื่อจัดแนวตนเองกับ Democratic Party และโครงการสังคมก้าวหน้าของพรรค"
  - "เพื่อส่งสัญญาณสนับสนุนการปฏิรูป Great Society ของ Lyndon B. Johnson"
  - "เพื่อรับอัตลักษณ์ปฏิวัติที่สุดโต่งกว่า ซึ่งได้แรงบันดาลใจจากขบวนการสังคมนิยมยุโรป"
explanation: >-
  ในสหรัฐอเมริกา คำว่า 'liberal' เลื่อนไปหมายถึงผู้สนับสนุน Big Government และการแทรกแซงของรัฐ โดยเฉพาะหลัง New Deal และ Great Society classical liberals จึงรับป้ายชื่อ 'libertarian' เพื่อรักษาความหมายดั้งเดิมของปรัชญาของตน พวกเขากำลังเว้นระยะห่างจาก American liberals ไม่ใช่จัดแนวตนเองกับคนเหล่านั้น
reviewed: false
