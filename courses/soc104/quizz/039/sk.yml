question: "Na čo sa zameriava štrukturálna definícia politického systému?"
answer: "Na to, ako systém skutočne funguje, a na jeho pozorovateľné charakteristiky, napríklad mieru štátnej kontroly"
wrong_answers:
  - "Na deklarované ciele a ušľachtilé zámery vyhlasované zakladateľmi a lídrami systému"
  - "Na historické počiatky politického hnutia a životopisy jeho kľúčových mysliteľov"
  - "Na počet povolených politických strán a frekvenciu konaných demokratických volieb"
explanation: >-
  Štrukturálne definície sa zameriavajú na to, ako politické systémy skutočne fungujú, a na ich pozorovateľné charakteristiky. Napríklad socializmus sa štrukturálne vyznačuje všadeprítomnosťou štátu. Tento prístup kontrastuje s intencionálnymi definíciami, ktoré sa opierajú o deklarované motivácie a ciele. Štrukturálny prístup umožňuje objektívnejšie hodnotenie na základe merateľných výsledkov.
