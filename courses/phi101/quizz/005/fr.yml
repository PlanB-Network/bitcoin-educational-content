question: Quelle est la vision dominante du pouvoir dans la philosophie et l'historiographie occidentales ?
answer: Le pouvoir est nécessaire pour le progrès et la prospérité de l'humanité.
wrong_answers:
  - Le pouvoir est une force corruptrice qui mène à l'oppression.
  - Le pouvoir est un outil neutre qui peut être utilisé pour le bien ou le mal.
  - Le pouvoir est une usurpation illégitime que la société devrait abolir.
explanation: |
  Selon le cours, le préjugé culturel qui domine la philosophie et l'historiographie occidentales est que nous devons tout au pouvoir : la liberté, la santé, l'éducation, la sécurité et la prospérité, l'humanité étant perçue comme une "matière inerte" façonnée par le législateur. Bastiat conteste cette vision dominante en affirmant que la réalité du pouvoir est en fait l'oppression.
reviewed: true
