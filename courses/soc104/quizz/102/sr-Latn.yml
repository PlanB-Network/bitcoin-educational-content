question: "Šta kurs identifikuje kao stvarnu političku podelu, izvan tradicionalnog spektra levo-desno-centar?"
answer: "Podelu između fundamentalnih filozofskih principa: slobode ili prinude, dobrovoljnog pristanka ili prisile, odgovornog pojedinca ili kolektiva"
wrong_answers:
  - "Podelu između bogatih i siromašnih nacija oko kontrole međunarodnih trgovinskih sporazuma i globalnih finansijskih institucija"
  - "Podelu između urbanog i ruralnog stanovništva oko prioriteta državne potrošnje i infrastrukturnih investicija"
  - "Podelu između progresivnih i tradicionalnih kultura oko društvenih normi, porodičnih vrednosti i verskog obrazovanja"
explanation: >-
  Kurs tvrdi da stvarna politička podela ne leži u tradicionalnim oznakama levo-desno-centar, već u fundamentalnim filozofskim principima: sloboda ili prinuda, dobrovoljni pristanak ili prisila, odgovorni pojedinac ili kolektiv. Ispravan način razmišljanja o politici jeste da se počne od etičkih principa, a ne od oznaka.
reviewed: false
