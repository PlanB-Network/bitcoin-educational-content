question: "Dalam dialog Gustave de Molinari tahun 1849, tokoh mana yang membela kebebasan sebagai prinsip fundamental alih-alih menundukkannya pada tujuan lain?"
answer: "Sang ekonom, yang memperlakukan kebebasan sebagai prinsip yang tidak ditundukkan pada tujuan lain apa pun"
wrong_answers:
  - "Sang sosialis, yang membela kebebasan melalui reformasi progresif yang ditujukan pada kesetaraan sosial"
  - "Sang konservatif, yang menjunjung kebebasan dengan melestarikan tatanan dan stabilitas sosial tradisional"
  - "Ketiga tokoh sama-sama membela kebebasan tetapi tidak sepakat tentang cara menerapkannya"
explanation: >-
  Dalam dialog Molinari dari Les Soirees de la rue Saint-Lazare, sang ekonom berada dalam ketidaksepakatan permanen dengan sang sosialis maupun sang konservatif. Ia satu-satunya yang membela kebebasan sebagai prinsip fundamental. Sang sosialis menundukkan kebebasan pada cita-cita progresif, dan sang konservatif menundukkannya pada pelestarian tatanan, sehingga sang ekonom unik dalam pembelaannya yang tanpa syarat terhadap kebebasan.
