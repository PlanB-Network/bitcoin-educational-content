question: "Mussoliniගේ 1920 declaration වන 'Everything in the State, nothing outside the State, nothing against the State' totalitarianism පිළිබඳ කුමක් අනාවරණය කරයිද?"
answer: "state එක සමාජය සම්පූර්ණයෙන් අවශෝෂණය කරන බැවින් public සහ private space අතර කිසිදු වෙන්වීමක් තවදුරටත් නොමැත"
wrong_answers:
  - "state එක economy private enterprise වෙත භාරදෙමින් military power මත පමණක් අවධානය යොමු කරයි"
  - "citizens රජය විවෘතව විවේචනය නොකරන තාක් පෞද්ගලිකව සංවිධානය වීමට නිදහස්ය"
  - "government එක cultural සහ religious life autonomous ලෙස පවතින අතර political activity පමණක් පාලනය කරයි"
explanation: >-
  Mussoliniගේ declaration එක totalitarianism හි essence එක අල්ලා ගනී: totality. සියල්ල state එක තුළට අවශෝෂණය වේ, එනම් public සහ private space අතර වෙන්වීමක් නැත. Sports club එකක් විවෘත කිරීම වැනි සාමාන්‍යම activities දක්වා society සියලු autonomy අහිමි කරගනී. මෙය military, political, හෝ economic spheres පමණක් පාලනය කිරීමෙන් බොහෝ දුරට එහා යයි.
reviewed: false
