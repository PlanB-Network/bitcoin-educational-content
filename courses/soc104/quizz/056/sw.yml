question: "Kwa nini Ron Paul anasema Federal Reserve ina madhara, na Bitcoin inahusianaje na msimamo wake?"
answer: "Federal Reserve husababisha mfumuko wa bei na mizunguko ya kiuchumi kupitia uchezewaji wa pesa ya Fiat, na Bitcoin inawakilisha aina ya fedha thabiti inayoweza kuchukua nafasi ya kiwango cha dhahabu"
wrong_answers:
  - "Federal Reserve huzuia ushindani wa benki, na Bitcoin hugatua huduma za kibenki ili kuboresha ujumuishaji wa kifedha"
  - "Federal Reserve huzuia biashara huria kati ya mataifa, na Bitcoin huwezesha miamala isiyo na mipaka bila idhini ya serikali"
  - "Federal Reserve huunda deni la serikali kupita kiasi, na Bitcoin hutoa sarafu yenye mwelekeo wa kupunguza bei inayoondoa deni la taifa"
explanation: >-
  Ron Paul, mfuasi wa minarchism, anasema kwamba Federal Reserve inawajibika kwa mfumuko wa bei na mizunguko ya kiuchumi kwa sababu huichezea pesa ya Fiat. Anaunga mkono kuondolewa kwa fedha mikononi mwa taifa, wazo lililotetewa na Friedrich Hayek, na anaiona Bitcoin kama aina ya fedha thabiti inayoweza kuchukua nafasi ya kiwango cha dhahabu. Uhakiki wake umetia mizizi katika nadharia ya fedha ya ulibertaria, si hasa katika ushindani wa benki, vikwazo vya biashara, au deni la serikali.
reviewed: false
