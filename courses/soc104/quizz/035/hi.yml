question: "किसी राजनीतिक प्रणाली की संरचनात्मक परिभाषा किस पर ध्यान केंद्रित करती है?"
answer: "प्रणाली वास्तव में कैसे काम करती है और उसकी अवलोकनीय विशेषताएँ, जैसे राज्य नियंत्रण की मात्रा"
wrong_answers:
  - "प्रणाली के संस्थापकों और नेताओं द्वारा घोषित लक्ष्य और उदात्त इरादे"
  - "राजनीतिक आंदोलन की ऐतिहासिक उत्पत्ति और उसके प्रमुख विचारकों की जीवनियाँ"
  - "अनुमत राजनीतिक दलों की संख्या और आयोजित लोकतांत्रिक चुनावों की आवृत्ति"
explanation: >-
  संरचनात्मक परिभाषाएँ इस बात पर ध्यान केंद्रित करती हैं कि राजनीतिक प्रणालियाँ वास्तव में कैसे काम करती हैं और उनकी अवलोकनीय विशेषताएँ क्या हैं। उदाहरण के लिए, समाजवाद को संरचनात्मक रूप से राज्य की सर्वव्यापकता से चिह्नित किया जाता है। यह दृष्टिकोण आशय-आधारित परिभाषाओं से भिन्न है, जो घोषित प्रेरणाओं और लक्ष्यों पर निर्भर करती हैं। संरचनात्मक दृष्टिकोण मापनीय परिणामों के आधार पर अधिक वस्तुनिष्ठ मूल्यांकन की अनुमति देता है।
reviewed: false
