question: "What does the term 'liberal' mean in the European political tradition?"
answer: "A supporter of laissez-faire economics, reduced state intervention, and individual liberties"
wrong_answers:
  - "An advocate of state intervention, public health insurance, and anti-poverty programs"
  - "A radical anarchist who seeks the complete abolition of government and private property"
  - "A centrist who balances socialist and conservative positions equally in all policy areas"
explanation: >-
  In Europe, liberalism has remained associated with laissez-faire economic policies, reduced state intervention, and the defense of individual liberties. The first wrong answer describes American liberals, who have shifted the term's meaning toward interventionism. European liberalism is neither anarchism nor centrism.
reviewed: false
