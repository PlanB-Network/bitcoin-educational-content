question: Ni ubuhe buryo bworoshe bwo gufatanya telefone ngendanwa Wallet na Electrs biciye ku Umbrel?
answer: Scan kode ya Tor QR
wrong_answers:
  - Gukwega(Download) dosiye y'amakuki
  - Kwinjiza urupfunguzo rw'ibanga
  - Kopa dosiye Wallet.dat
explanation: |
  Umbrel ituma ushobora gusikana QR code ya Tor itangwa na Electrs kugira ngo wallet yo kuri telefone ihuza na node yawe mu buryo bworoshe.
reviewed: true
