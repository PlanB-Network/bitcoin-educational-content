question: "Na questão da regulamentação de armas de fogo, qual é a diferença crucial entre as posições conservadora e libertária?"
answer: "Ambas aceitam alguma regulamentação, mas os conservadores querem regras vindas de uma autoridade pública legítima, enquanto os libertários querem que as regras emerjam daqueles diretamente envolvidos, como associações de cidadãos e a concorrência de mercado"
wrong_answers:
  - "Os conservadores se opõem a toda regulamentação de armas de fogo, enquanto os libertários aceitam controle governamental estrito em nome da segurança pública"
  - "Os conservadores querem banir completamente as armas de fogo, enquanto os libertários apoiam acesso irrestrito a todas as armas"
  - "Os conservadores baseiam sua posição em direitos individuais, enquanto os libertários baseiam a deles na responsabilidade coletiva"
explanation: >-
  Tanto conservadores quanto libertários concordam que alguma forma de regulamentação para o porte de armas é necessária. A diferença crucial está em quem estabelece essas regras. Os conservadores insistem que as regulamentações devem vir de uma autoridade pública encarregada de salvaguardar o bem comum (de cima para baixo). Os libertários argumentam que a regulamentação deve emergir daqueles diretamente envolvidos: profissionais de segurança, associações de cidadãos e concorrência de mercado (de baixo para cima).
