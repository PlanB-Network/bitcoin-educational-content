question: "Čo má v konzervatívnej politickej filozofii prednosť pred slobodou?"
answer: "Poriadok a tradícia, ktoré musia byť pevne ustanovené skôr, než môže byť sloboda cenená"
wrong_answers:
  - "Sociálna spravodlivosť a rovnosť, ktoré musia byť zaručené skôr, než môžu byť jednotlivci skutočne slobodní"
  - "Ekonomická efektívnosť a pragmatické výsledky, ktoré určujú, kedy je sloboda vhodná"
  - "Individuálne vlastnícke práva, ktoré musia byť chránené skôr, než sa prizná akákoľvek iná sloboda"
explanation: >-
  Pre konzervatívcov majú poriadok a tradícia prednosť pred slobodou. Tvrdia, že príliš veľa slobody vytvára chaos a spoločenský neporiadok, takže slobodu možno ceniť až vtedy, keď bol poriadok pevne ustanovený. To kontrastuje so socialistickým pohľadom, ktorý uprednostňuje spravodlivosť, alebo s centristickým dôrazom na efektívnosť.
