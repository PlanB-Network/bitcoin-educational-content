question: "Milline korduv analüütiline raamistik kujundab sotsialistlikku seisukohta kõigis viies ühiskondlikus debatis (abielu, immigratsioon, tulirelvad, narkootikumid, suhkrurikkad joogid)?"
answer: "Konfliktiraamistik domineerijate ja domineeritavate vahel, kus ühiskond on struktureeritud rõhumise kaudu ja riik peab sekkuma haavatava rühma kaitsmiseks"
wrong_answers:
  - "Utilitaristlik raamistik, mis keskendub üldise õnne ja majandusliku tootlikkuse maksimeerimisele suurima arvu kodanike jaoks"
  - "Loomuõiguste raamistik, kus individuaalseid vabadusi tuleb kaitsta nii riigi kui ka korporatiivse sekkumise eest"
  - "Traditsionalistlik raamistik, kus väljakujunenud sotsiaalseid institutsioone tuleb säilitada häirivate kaasaegsete muutuste vastu"
explanation: >-
  Sotsialistlikku seisukohta ühiskondlikes debattides kujundab järjekindlalt domineerijate ja domineeritavate konfliktiraamistik. Abielu puhul on see heteroseksuaalne enamus, kes rõhub homoseksuaalset vähemust. Immigratsiooni puhul on rahvuspõhised piirangud rõhumise vormid. Tulirelvade puhul peaks ainult riik omama jõudu haavatavate kaitsmiseks. Suhkrurikaste jookide puhul teenivad töösturid kasumit kõige vähem kaitstute haavatavuselt. See rõhuja/rõhutu prisma kordub paljudes valdkondades, sealhulgas soo, rassi ja isegi inimkonna ning looduse vahelise suhte puhul.
