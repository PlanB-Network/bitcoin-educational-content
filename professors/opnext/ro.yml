bio: |
  OPNEXT este cea mai importantă conferință pentru dezvoltatori și investitori Bitcoin, reunind sute de constructori pentru aprofundări tehnice, ateliere și networking. Concentrată pe scalarea Bitcoin, propuneri tehnologice de ultimă generație și formarea de capital, OPNEXT face legătura dintre dezvoltatorii Bitcoin și comunitatea investitorilor.

short_bio: Cea mai importantă conferință pentru dezvoltatori și investitori Bitcoin
