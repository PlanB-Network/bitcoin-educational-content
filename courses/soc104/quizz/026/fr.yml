question: "Qu'est-ce que le paléo-libertarianisme ?"
answer: "Une synthèse combinant le rejet de l'État comme source de coercition avec un renforcement des institutions traditionnelles et des structures sociales volontaires"
wrong_answers:
  - "Un mouvement libertarien qui rejette toutes les valeurs traditionnelles et promeut un progressisme social radical"
  - "Une idéologie conservatrice qui utilise le pouvoir de l'État pour faire respecter les valeurs traditionnelles tout en autorisant une certaine liberté économique"
  - "Une philosophie centriste qui cherche un compromis équilibré entre l'économie socialiste et la politique sociale conservatrice"
explanation: >-
  Le paléo-libertarianisme combine le rejet de l'État comme source institutionnelle de coercition avec un renforcement des institutions traditionnelles et une préférence pour les structures sociales volontaires plutôt que pour l'autorité de l'État. Il se distingue du néo-libertarianisme par une plus grande sympathie pour les valeurs traditionnelles. Le paléo-libertarien ne s'oppose pas à ce que des communautés s'organisent autour de principes socialistes ou communautariens ; il refuse seulement que ces communautés imposent leurs valeurs à tous par la force de la loi.
reviewed: false
