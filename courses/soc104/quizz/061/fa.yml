question: "اعلامیه 1920 موسولینی «همه‌چیز در دولت، هیچ‌چیز بیرون از دولت، هیچ‌چیز علیه دولت» چه چیزی را درباره تمامیت‌خواهی آشکار می‌کند؟"
answer: "دیگر هیچ جدایی‌ای میان فضای عمومی و خصوصی وجود ندارد، زیرا دولت جامعه را به‌طور کامل در خود جذب می‌کند"
wrong_answers:
  - "دولت منحصراً بر قدرت نظامی تمرکز می‌کند و اقتصاد را به بنگاه‌های خصوصی واگذار می‌کند"
  - "شهروندان آزادند به‌صورت خصوصی سازمان‌دهی کنند، مادامی که آشکارا از حکومت انتقاد نکنند"
  - "حکومت فقط فعالیت سیاسی را کنترل می‌کند، در حالی که زندگی فرهنگی و دینی خودمختار باقی می‌ماند"
explanation: >-
  اعلامیه موسولینی جوهر تمامیت‌خواهی را بیان می‌کند: تمامیت. همه‌چیز در دولت جذب می‌شود، یعنی هیچ جدایی‌ای میان فضای عمومی و خصوصی وجود ندارد. جامعه هر شکلی از خودمختاری را از دست می‌دهد، حتی تا پیش‌پاافتاده‌ترین فعالیت‌ها مانند افتتاح یک باشگاه ورزشی. این بسیار فراتر از کنترل صرف حوزه‌های نظامی، سیاسی یا اقتصادی است.
reviewed: false
