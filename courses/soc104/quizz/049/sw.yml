question: "Ni nini kinachowatofautisha wahafidhina wapya na wahafidhina wa kale katika mtazamo wao wa sera ya kigeni?"
answer: "Wahafidhina wapya huhalalisha uingiliaji wa kijeshi ili kueneza demokrasia, ilhali wahafidhina wa kale hutetea sera ya kigeni yenye kujitenga zaidi"
wrong_answers:
  - "Wahafidhina wapya hupinga hatua zote za kijeshi na kupendelea diplomasia, ilhali wahafidhina wa kale huunga mkono mashambulizi ya kinga dhidi ya vitisho vinavyowezekana"
  - "Wahafidhina wapya huzingatia vikwazo vya kiuchumi pekee, ilhali wahafidhina wa kale hutetea kujenga miungano ya kimataifa kwa ajili ya operesheni za kijeshi za pamoja"
  - "Wahafidhina wapya na wahafidhina wa kale hukubaliana kuhusu sera ya kigeni lakini hutofautiana sana kuhusu udhibiti wa uchumi wa ndani"
explanation: >-
  Kuanzia miaka ya 2000 na kuendelea, wahafidhina wapya walizidi kujihusisha katika kuhalalisha uingiliaji wa kijeshi ili kupandikiza demokrasia duniani kote, hasa baada ya Septemba 11, 2001. Kama mwitikio, wahafidhina wa jadi waliitumia lebo 'paleoconservative' ili kujitofautisha. Wahafidhina wa kale hukosoa uingiliaji wa kijeshi, hutetea sera ya kigeni yenye kujitenga zaidi, na huweka mkazo mkubwa zaidi kwenye utambulisho wa kitaifa na kitamaduni.
