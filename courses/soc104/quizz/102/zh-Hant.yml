question: "自由意志主義者如何看待個人做決定的能力？"
answer: "個人既有權利，也有責任，對自己的生活做出自己的決定"
wrong_answers:
  - "個人只有在諮詢理解政策影響的民選代表之後，才應該做決定"
  - "個人通常無法做出良好決定，需要來自政府機構的專家指導"
  - "個人應自由做出經濟決策，但在所有社會與文化事務上服從國家"
explanation: >-
  從自由意志主義的觀點來看，個人既有權利，也有責任，做出自己的決定。這與從左到右的傳統政治家族形成對比，後者認為政府應該在個人的生活以及整體經濟生活中，做出某些或許多重要決定。
reviewed: false
