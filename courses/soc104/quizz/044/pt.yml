question: "Como o Green New Deal representa uma evolução contemporânea do socialismo democrático?"
answer: "Ele usa preocupações ambientais como uma nova justificativa para a intervenção estatal e a confiscação da renda privada, subordinando o interesse individual à saúde planetária coletiva"
wrong_answers:
  - "Ele abandona inteiramente a economia socialista tradicional em favor de soluções de livre mercado para problemas ambientais por meio do comércio de carbono"
  - "Ele rejeita a intervenção estatal e, em vez disso, depende da ação individual voluntária e da inovação do setor privado para enfrentar as mudanças climáticas"
  - "Ele representa uma ruptura com o socialismo ao priorizar a proteção ambiental acima de todas as preocupações com justiça social e emprego"
explanation: >-
  O Green New Deal funde preocupações ambientais com objetivos sociais, combinando transição ecológica com justiça social, garantias de emprego e serviços públicos reforçados. O interesse individual é subordinado ao interesse coletivo definido pela saúde planetária. Em sua essência, ele fornece um novo invólucro retórico que justifica a intervenção estatal e a confiscação da renda privada, não mais apenas em nome da justiça social, mas também em nome do meio ambiente.
