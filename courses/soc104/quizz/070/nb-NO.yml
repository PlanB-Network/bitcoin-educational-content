question: "På tvers av de fem samfunnsdebattene (ekteskap, innvandring, skytevåpen, narkotika, sukkerholdige drikker), hvilket tilbakevendende analytisk rammeverk former den sosialistiske posisjonen i hvert spørsmål?"
answer: "Et konfliktrammeverk mellom dominerende og dominerte, der samfunnet er strukturert av undertrykkelse og staten må gripe inn for å beskytte den sårbare gruppen"
wrong_answers:
  - "Et utilitaristisk rammeverk fokusert på å maksimere samlet lykke og økonomisk produktivitet for flest mulig borgere"
  - "Et naturrettslig rammeverk der individuelle friheter må beskyttes mot både statlig og bedriftsmessig innblanding"
  - "Et tradisjonalistisk rammeverk der etablerte sosiale institusjoner må bevares mot forstyrrende moderne endringer"
explanation: >-
  Den sosialistiske posisjonen på tvers av samfunnsdebatter formes konsekvent av et konfliktperspektiv mellom dominerende og dominerte. I ekteskapsspørsmålet er det et heteroseksuelt flertall som undertrykker en homoseksuell minoritet. Når det gjelder innvandring, er nasjonalitetsbaserte begrensninger former for undertrykkelse. Når det gjelder skytevåpen, bør bare staten ha makt for å beskytte de sårbare. Når det gjelder sukkerholdige drikker, tjener industrialister på sårbarheten til de minst beskyttede. Dette undertrykker/undertrykt-perspektivet gjentas på tvers av mange domener, inkludert kjønn, rase og til og med forholdet mellom menneskeheten og naturen.
reviewed: false
