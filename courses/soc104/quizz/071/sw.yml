question: "Msimamo wa kijamaa kuhusu huduma za afya ni upi?"
answer: "Upatikanaji wa huduma za afya ni haki ya msingi, na dola lazima ihakikishe mfumo wa wote, unaofadhiliwa na umma kwa kila mtu bila kujali kipato"
wrong_answers:
  - "Huduma za afya zinapaswa kuwa mfumo mchanganyiko wenye bima ya msingi ya dola inayokamilishwa na chaguo za bima binafsi"
  - "Masoko binafsi hutoa huduma za afya zenye ubunifu zaidi, kwa hiyo watu binafsi wanapaswa kuchagua mfumo wao kwa uhuru"
  - "Dola inapaswa kutoa huduma za afya kwa raia maskini zaidi pekee huku bima binafsi ikiwahudumia wengine wote"
explanation: >-
  Kwa wanajamaa, upatikanaji wa huduma za afya ni haki ya msingi, si bidhaa. Dola lazima ihakikishe mfumo wa huduma za afya wa wote unaofadhiliwa na umma ili kila mtu aweze kupata huduma, bila kujali kipato. Hili linaonyesha hangaiko la kijamaa kuhusu usawa, haki ya kijamii, na umuhimu wa dola katika kupanga huduma kwa maslahi ya jumla. Mfumo mchanganyiko unaelezea mtazamo wa kati, ilhali mbinu zinazotegemea uchaguzi zinaonyesha misimamo ya kilibertaria na kihafidhina.
