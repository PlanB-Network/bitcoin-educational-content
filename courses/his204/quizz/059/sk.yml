question: Čo navrhol Dupont de Nemours zakázať v návrhu zákona predloženom Ústavodarnému zhromaždeniu?
answer: Útočné vojny
wrong_answers:
  - Obchodné vojny
  - Obranné vojny
  - Všetky vojny
explanation: |
  Dupont de Nemours v súlade s fyziokratickými zásadami navrhoval zakázať útočné vojny, pretože ich považoval za škodlivé pre hospodársku prosperitu a blaho obyvateľstva.
