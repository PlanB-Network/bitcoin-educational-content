question: "Bitcoin は、道徳的主張を持つ政治的プロジェクトではなく、政治的帰結を持つ道徳的プロジェクトとしてどのように機能するのか？"
answer: "Bitcoin は人々を豊かにするためではなく自由にするために設計され、実効的な所有を可能にし、労働の価値を保護し、プライバシーを守る。これらは政治的陣営を主張することなく政治的効果を生む道徳的達成である"
wrong_answers:
  - "Bitcoin は、そのコードが詐欺を防ぐ倫理規則を強制するため道徳的プロジェクトであり、その政治的帰結は民主的統治をアルゴリズムによる意思決定に置き換えることだから"
  - "Bitcoin は、富を富裕層から早期採用者へ再分配し、税制政策に政治的含意を持つより公平な社会を作るため、道徳的プロジェクトとして機能するから"
  - "Satoshi Nakamoto がプロトコルに倫理的戒律を埋め込んだため Bitcoin は道徳的であり、その政治的帰結はすべての政治的家族を共有された貨幣システムの下に団結させることだから"
explanation: >-
  Bitcoin は人々を豊かにするためではなく、自由にするために設計された。
  それは 3 つの道徳的成果を実現する。
  実効的な所有を可能にすること（責任を促すこと）、労働によって生み出された価値を保護すること（生産的努力を促すこと）、そしてプライバシーを守ること（人々が恐れずに生きられるようにすること）である。
  これらは、いかなる政治陣営にも属さずに政治的帰結を伴う道徳的達成であり、Bitcoin をまず道徳的、次に政治的なプロジェクトにしている。
reviewed: false
