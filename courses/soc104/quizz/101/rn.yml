question: "Iri somo ryerekana ko umugabane nyakuri wa politike ari uwuhe, urenze umurongo usanzwe w'ibumoso-iburyo-hagati?"
answer: "Umugabane uri hagati y'ingingo za filozofiya z'ishimikiro: umwidegemvyo canke agahato, ukwemera ku bushake canke uguhatirwa, umuntu yikorera ibimwerekeye canke umugwi rusangi"
wrong_answers:
  - "Umugabane uri hagati y'ibihugu bikize n'ibikene ku kugenzura amasezerano y'ubudandaji mpuzamakungu n'ibigo vy'imari vy'isi"
  - "Umugabane uri hagati y'abantu bo mu bisagara n'abo mu vyaro ku vyo leta ikwiye gushirako amafaranga n'ishoramari mu nyubakwa"
  - "Umugabane uri hagati y'imico y'abashaka iterambere n'iy'abakunda imigenzo ku ngingo z'ikibano, agaciro k'umuryango, n'indero y'idini"
explanation: >-
  Iri somo rivuga ko umugabane nyakuri wa politike utari mu vyapa bisanzwe vy'ibumoso-iburyo-hagati, ahubwo uri mu ngingo za filozofiya z'ishimikiro: umwidegemvyo canke agahato, ukwemera ku bushake canke uguhatirwa, umuntu yikorera ibimwerekeye canke umugwi rusangi. Uburyo bubereye bwo kwiyumvira politike ni uguhereye ku ngingo z'imico runtu aho guhera ku vyapa.
