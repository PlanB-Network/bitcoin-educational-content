question: "Por que a inflação monetária é descrita como um imposto oculto imposto sem o consentimento dos cidadãos?"
answer: "Porque a criação de dinheiro pelo governo desvaloriza a moeda, fazendo com que as pessoas possam comprar menos com a mesma quantia, mas a maioria não percebe que a alta dos preços reflete a política governamental, e não forças naturais do mercado"
wrong_answers:
  - "Porque os bancos centrais cobram secretamente taxas sobre cada transação processada pelo sistema bancário sem divulgá-las aos titulares das contas"
  - "Porque os governos imprimem dinheiro e o distribuem apenas a indivíduos ricos, enquanto tributam os pobres por meio de impostos maiores sobre vendas de bens essenciais"
  - "Porque a inflação é causada por empresas privadas que aumentam preços para elevar lucros, o que funciona como um imposto não oficial sobre os consumidores"
explanation: >-
  A injeção de dinheiro no sistema se traduz em desvalorização monetária, na qual a mesma quantia compra menos porque o novo dinheiro não reflete crescimento econômico genuíno. A maioria das pessoas não vê que a política governamental levou à alta dos preços, que são simplesmente o reflexo da desvalorização monetária. Isso equivale a roubo legal e espoliação institucionalizada, empobrecendo a classe média enquanto os ricos capturam o dinheiro novo por meio de ativos especulativos.
