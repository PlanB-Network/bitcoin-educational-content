question: "Come caratterizzava Michael Oakeshott il conservatorismo nella sua opera filosofica?"
answer: "Come un temperamento e una disposizione verso la vita piuttosto che come una rigida ideologia sistematica"
wrong_answers:
  - "Come una teoria economica complessiva con prescrizioni politiche precise per ogni ambito di governo"
  - "Come un movimento rivoluzionario che cerca di smantellare le istituzioni moderne e tornare alla società preindustriale"
  - "Come una dottrina puramente religiosa fondata sulla teologia cristiana e sull'autorità ecclesiastica"
explanation: >-
  Michael Oakeshott, filosofo britannico, difese una concezione del conservatorismo come temperamento piuttosto che come ideologia sistematica. Il suo saggio On Being Conservative (1956) rimane un riferimento essenziale. Questa visione del conservatorismo come disposizione influenzò anche Friedrich Hayek. L'approccio di Oakeshott è notevole per la sua critica del razionalismo in politica, rifiutando l'idea che la politica possa essere ridotta a un sistema.
