question: "Ako štrukturálny prístup definuje základný rozdiel medzi socializmom a libertarianizmom?"
answer: "Socializmus dáva prvenstvo štátu prostredníctvom regulácie, plánovania a kontroly, zatiaľ čo libertarianizmus dáva prvenstvo jednotlivcovi prostredníctvom minimálneho štátneho zásahu"
wrong_answers:
  - "Socializmus uprednostňuje vidiecke poľnohospodárske komunity, zatiaľ čo libertarianizmus podporuje mestský priemyselný rozvoj"
  - "Socializmus je definovaný podporou demokratických volieb, zatiaľ čo libertarianizmus odmieta všetky formy politickej účasti"
  - "Socializmus sa zameriava na zahraničnú politiku a medzinárodnú spoluprácu, zatiaľ čo libertarianizmus sa zaoberá iba domácimi ekonomickými otázkami"
explanation: >-
  Štrukturálne sa socializmus vyznačuje všadeprítomnosťou štátu, ktorý reguluje, plánuje a kontroluje. Libertarianizmus je definovaný minimálnym štátnym zásahom do ekonomiky a súkromného života, smerujúcim k prvenstvu individuálnej slobody a slobodného trhu. Toto štrukturálne rozlíšenie je analyticky omnoho užitočnejšie než porovnávanie deklarovaných zámerov každého systému.
