question: "ข้อโต้แย้งพื้นฐานของ Hayek เกี่ยวกับเหตุที่การวางแผนจากศูนย์กลางล้มเหลวคืออะไร?"
answer: "ความรู้ดำรงอยู่เพียงในรูปเศษเสี้ยวที่กระจัดกระจายซึ่งปัจเจกบุคคลต่าง ๆ ถือครอง และไม่สามารถถูกรวมศูนย์หรือบูรณาการโดยอำนาจส่วนกลางได้"
wrong_answers:
  - "นักวางแผนส่วนกลางมีศีลธรรมเสื่อมทรามและมักทำเพื่อผลประโยชน์ตนเองแทนประโยชน์สาธารณะเสมอ"
  - "สถาบันประชาธิปไตยตอบสนองต่อการเปลี่ยนแปลงทางเศรษฐกิจช้าเกินไป ทำให้การตัดสินใจแบบรวมศูนย์ล้าสมัยเสมอ"
  - "การวางแผนจากศูนย์กลางล้มเหลวเพราะพลเมืองจงใจต่อต้านคำสั่งของรัฐบาลและปฏิเสธที่จะปฏิบัติตามกฎระเบียบ"
explanation: >-
  ข้อโต้แย้งพื้นฐานของ Hayek ตั้งอยู่บนธรรมชาติของข้อมูล เขาแสดงให้เห็นว่าความรู้ไม่เคยดำรงอยู่ในรูปที่รวมศูนย์หรือบูรณาการแล้ว แต่มีอยู่เพียงในฐานะเศษเสี้ยวที่กระจัดกระจายซึ่งปัจเจกบุคคลต่าง ๆ ทั้งหมดถือครอง คุณค่าเป็นสิ่งอัตวิสัยและถูกรู้ได้เฉพาะในระดับท้องถิ่นและอย่างไม่สมบูรณ์ นักวางแผนส่วนกลางที่นั่งอยู่ในสำนักงานไม่มีความรู้เกี่ยวกับราคาที่แท้จริงของสิ่งต่าง ๆ เพราะเขาไม่ได้มีส่วนร่วมในปฏิสัมพันธ์และการแลกเปลี่ยน
reviewed: false
