question: "Nolan diagram के दो अक्ष कौन-से हैं?"
answer: "एक ऊर्ध्वाधर अक्ष जो व्यक्तिगत स्वतंत्रताओं को मापता है और एक क्षैतिज अक्ष जो आर्थिक स्वतंत्रताओं को मापता है"
wrong_answers:
  - "बाएँ से दाएँ तक एक क्षैतिज अक्ष और authoritarian से democratic तक एक ऊर्ध्वाधर अक्ष"
  - "धन को मापने वाला ऊर्ध्वाधर अक्ष और शिक्षा स्तरों को मापने वाला क्षैतिज अक्ष"
  - "समाजवाद से पूंजीवाद तक एक क्षैतिज अक्ष और परंपरा से प्रगति तक एक ऊर्ध्वाधर अक्ष"
explanation: >-
  David Nolan ने अपने diagram को दो विशिष्ट अक्षों के साथ बनाया: व्यक्तिगत स्वतंत्रताएँ (ऊर्ध्वाधर) और आर्थिक स्वतंत्रताएँ (क्षैतिज)। यह दो-आयामी दृष्टिकोण अत्यधिक सरलीकृत बाएँ-दाएँ रेखा की जगह लेता है और स्वतंत्रता की दो मुख्य श्रेणियों को अलग करके राजनीतिक विचारधाराओं की जटिलता को बेहतर ढंग से पकड़ता है।
