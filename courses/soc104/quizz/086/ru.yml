question: "Как три существенные функции свободного рынка, описанные либертарианцами, вместе образуют одновременно эффективную и этическую систему социальной организации?"
answer: "Цены дают ориентир для решений, рынок выявляет подлинные предпочтения через спрос и предложение, а свободный обмен позволяет индивидам определять свои собственные дела в соответствии с личными ценностями, сочетая информационную эффективность с моральной автономией"
wrong_answers:
  - "Рынок максимизирует совокупное богатство, предотвращает монополии через естественную конкуренцию и обеспечивает равное распределение ресурсов, сочетая производительность с социальной справедливостью"
  - "Свободные рынки сокращают государственные расходы, стимулируют технологические инновации и создают возможности занятости, сочетая фискальную ответственность с экономическим ростом"
  - "Рынки снижают потребительские цены, повышают качество продуктов через конкуренцию и расширяют международную торговлю, сочетая внутреннее процветание с глобальным сотрудничеством"
explanation: >-
  Либертарианская аргументация в пользу свободного рынка основана на трех взаимосвязанных функциях. Во-первых, цены служат надежными индикаторами, направляющими экономические и социальные решения (компас). Во-вторых, рынок выявляет подлинные индивидуальные предпочтения через спрос и предложение. В-третьих, свободный обмен позволяет участникам определять свои собственные дела в соответствии с личными ценностями. Хайек показал, что свободные рынки координируют рассеянную информацию лучше, чем центральное планирование (эффективность), тогда как взаимное согласие уважает человеческое достоинство больше, чем принуждение (справедливость).
reviewed: false
