question: "In what sense is democracy a 'tragedy of the commons'?"
answer: "Voters support policies serving their short-term personal gain at the cost of long-term collective harm \u2014 like overfishing an unowned ocean."
wrong_answers:
  - "Parliaments physically meet on common land."
  - "Public parks are always overcrowded in democracies."
  - "Taxes are collected in common currency."
explanation: |
  Hoppe's analysis: the personal short-term gain from voting oneself benefits outweighs the diffuse, delayed, collective cost — so taxes ratchet up to their ceiling and the process of de-civilization begins.
reviewed: false
