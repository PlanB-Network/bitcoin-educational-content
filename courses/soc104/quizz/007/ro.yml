question: "Cum întărește sistemul de monedă fiat clivajul dintre guvernanți și guvernați?"
answer: "Le permite guvernelor să finanțeze cheltuieli nelimitate prin crearea de monedă, ceea ce devalorizează economiile prin inflație"
wrong_answers:
  - "Le oferă cetățenilor control direct asupra politicii monetare prin alegeri democratice și referendumuri"
  - "Împiedică guvernele să se împrumute, obligându-le să se bazeze doar pe impozitare pentru venituri"
  - "Distribuie moneda nou creată în mod egal tuturor cetățenilor pentru a stimula creșterea economică"
explanation: >-
  Moneda fiat este descrisă ca piatra de temelie a extinderii puterii statului, deoarece le permite guvernelor să se împrumute și să împingă băncile să tipărească monedă nouă. Inflația rezultată devalorizează economiile oamenilor, în beneficiul celor mai bogate și mai puternice entități. Ea nu le oferă cetățenilor control monetar, nici nu împiedică împrumuturile sau distribuie moneda în mod egal.
reviewed: false
