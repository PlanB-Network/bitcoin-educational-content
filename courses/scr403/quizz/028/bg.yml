question: В какъв смисъл условната композиция е дуалната на паралелната композиция?
answer: Паралелната подава на двете операции един вход и сдвоява изходите им (product); условната приема sum от входове, а двата клона споделят един изходен тип.
wrong_answers:
  - Паралелната задължително изпълнява двете си операции едновременно; условната ги изпълнява последователно и връща само клона, който тагът избира.
  - И двете работят върху един споделен вход; паралелната запазва двойката изходи, докато условната изпълнява двата клона и изхвърля неизбрания.
  - Паралелната предварително дублира входа си, докато условната дублира изхода си след това, разменяйки къде се извършва копирането.
explanation: >-
  Дуалността е размяна product/sum, при която споделеният тип сменя
  страната: паралелната композиция дава на двете операции един и същ
  входен тип и сдвоява изходите им в product, докато условната композиция
  приема sum (тагнато обединение) от двата входни типа и двата клона
  трябва да произвеждат един и същ изходен тип. Едновременността е без
  значение — статията подчертава, че паралелната композиция може да бъде
  имплементирана последователно — а условната композиция изпълнява точно
  един клон, избран от тага, вместо да изпълнява и двата и да изхвърля единия.
reviewed: false
