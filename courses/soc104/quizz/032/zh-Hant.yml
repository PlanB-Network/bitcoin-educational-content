question: "Murray Rothbard 所理論化的非侵略原則是什麼？"
answer: "對另一個個人或其財產主動發起物理強制是不正當的，但防衛性暴力是允許的"
wrong_answers:
  - "所有形式的暴力永遠都是錯的，包括自衛與反抗壓迫"
  - "針對壓迫性制度的暴力可以接受，但絕不能針對其他個人"
  - "只有國家擁有使用武力的正當權利，個人絕不能訴諸暴力"
explanation: >-
  Rothbard 的非侵略原則主張，對另一個人或其財產主動發起物理強制是不正當的。這是黃金律的一種哲學轉譯。然而，它並不禁止所有暴力：防衛性暴力，包括自衛與反抗壓迫，被視為正當。這使它有別於純粹和平主義，也有別於國家所宣稱的武力壟斷。
reviewed: false
