question: Boisguilbertට අනුව, නිදහසේ තැබිය යුත්තේ කුමක් හෝ කවුරුන්ද?
answer: ස්වභාවය, එනම් දේවල ස්වාභාවික පිළිවෙළ
wrong_answers:
  - බලය, එනම් රජු, ඔහුගේ කවුන්සිලය සහ ඇමතිවරු
  - මිනිසුන්, එනම් ගොවීන්, ශිල්පීන් සහ කම්කරුවන්
  - මූල්‍ය වෙළඳපොළවල්
explanation: |
  Boisguilbert ස්වාභාවික පිළිවෙළ සහ laissez-faire වෙනුවෙන් පෙනී සිටි අයෙකි. දේවල ස්වාභාවික පිළිවෙළ දිගහැරීමට සහ සමෘද්ධිය සහතික කිරීමට, අධික රාජ්‍ය මැදිහත්වීමකින් තොරව ආර්ථිකය තමන්ගේම ගමනට නිදහසේ තැබිය යුතු බව ඔහු විශ්වාස කළේය.
