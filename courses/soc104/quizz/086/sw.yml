question: "Ludwig von Mises alimaanisha nini alipoandika kwamba ni mtu binafsi pekee anayefikiri, kutumia mantiki, na kutenda?"
answer: "Kwamba makundi ya pamoja kama dola au taifa hayana uwepo wao wenyewe zaidi ya matendo ya wanachama wake binafsi"
wrong_answers:
  - "Kwamba watu binafsi wanapaswa kuepuka kuunda makundi au vyama kwa sababu tendo la pamoja huwa hatari daima"
  - "Kwamba ni watu wachache wenye vipaji pekee wanaoweza kufikiri kwa mantiki ilhali watu wengi hufuata silika"
  - "Kwamba kufikiri na kutumia mantiki ni shughuli za faragha ambazo hazipaswi kamwe kushirikiwa au kujadiliwa hadharani"
explanation: >-
  Mises alifafanua kwamba ubinafsi unapinga dhana kwamba vyombo vya kijamii kama jamii au taifa vinaweza kuwepo kwa kujitegemea kutoka kwa watu binafsi wanaoviunda. Kundi la pamoja halina uwepo wake wenyewe zaidi ya matendo ya wanachama wake binafsi. Hatuwezi kuzungumza kwa maana kuhusu tendo la dola au kampuni kwa sababu vyombo hivi havina nia au fikra zao wenyewe na hutenda tu kupitia watu binafsi.
