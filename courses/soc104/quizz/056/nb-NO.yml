question: "Hvilken form for styring tenderer sentrismen mot?"
answer: "Teknokrati, der makt overlates til eksperter som styrer økonomien og pengepolitikken"
wrong_answers:
  - "Direkte demokrati, der borgere stemmer over alle større politiske beslutninger"
  - "Aristokrati, der makten holdes av en tradisjonell herskende klasse"
  - "Laissez-faire-styring, der markedet regulerer seg selv uten statlig inngripen"
explanation: >-
  Sentrismen prioriterer effektivitet og pragmatisme, og tenderer mot teknokrati, noe som betyr at makt bør overlates til eksperter som styrer økonomien og fører pengepolitikken. Dette er grunnleggende forskjellig fra direkte demokrati, aristokrati eller laissez-faire, som hver fordeler makt etter helt andre prinsipper.
reviewed: false
