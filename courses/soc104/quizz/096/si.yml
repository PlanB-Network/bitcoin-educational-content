question: "Bitcoin challenge කරන welfare state හි pillars තුන කුමක්ද?"
answer: "fiscal system, debt හරහා spending finance කිරීමට monetary monopoly, සහ alternative currencies භාවිතය වැළැක්වීමට transactions surveillance"
wrong_answers:
  - "military budget, public education system, සහ government-controlled healthcare infrastructure"
  - "judicial system, legislative process, සහ businesses මත regulations executive enforcement"
  - "social security system, minimum wage legislation, සහ progressive income tax structure"
explanation: >-
  welfare state රඳා පවතින pillars තුන Bitcoin challenge කරයි. පළමුව, expenditures ආවරණය කිරීමට ප්‍රමාණවත් නොවන fiscal system එක. දෙවනුව, debt හරහා spending finance කිරීමට money issue කිරීමේ capacity අර්ථදක්වන monetary monopoly එක. තෙවනුව, state-imposed fiat හැර වෙනත් currency කිසිවක් භාවිත කිරීමෙන් මිනිසුන් වැළැක්වීමට ඇති ability වන transactions surveillance. Bitcoin මේ තුනම එකවර undermine කරයි.
reviewed: false
