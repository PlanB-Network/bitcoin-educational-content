question: "Wie sehen Libertäre die Beziehung zwischen Privateigentum und Freiheit?"
answer: "Privateigentum ist ein natürliches Recht, das dem Gesetz und dem Staat vorausgeht, und ist die eigentliche Grundlage der Freiheit"
wrong_answers:
  - "Privateigentum ist eine vom Staat geschaffene soziale Konvention, die widerrufen werden kann, wenn sie Ungleichheit verursacht"
  - "Privateigentum ist für wirtschaftliche Effizienz nützlich, hat aber keine inhärente moralische oder philosophische Bedeutung"
  - "Privateigentum sollte nur für persönliche Besitztümer existieren, nicht für produktive Vermögenswerte oder Land"
explanation: >-
  Libertäre verteidigen Privateigentum als natürliches Recht, das dem Gesetz und dem Staat vorausgeht. Sie argumentieren, dass ein Individuum, wenn es seinen eigenen Körper besitzt, auch seine Arbeit und deren Früchte besitzt. Eigentum an materiellen Gütern ist eine Erweiterung des Selbsteigentums. Dies steht in scharfem Gegensatz zur libertaire-Sicht, dass Eigentum eine soziale Konvention oder eine Quelle der Unterdrückung ist.
