question: "Jak se lišily ekonomické přístupy Hitlerova Německa a Stalinova Sovětského svazu, přestože sdílely totalitní metody?"
answer: "Nacistické Německo zachovalo zdání soukromého vlastnictví, zatímco soukromý sektor podřídilo cílům státu, kdežto stalinismus zrušil veškeré soukromé vlastnictví a ekonomiku plně plánoval"
wrong_answers:
  - "Nacistické Německo plně znárodnilo všechna průmyslová odvětví, zatímco Stalinův režim dovolil omezené soukromé podnikání v zemědělství"
  - "Nacistické Německo podporovalo svobodný mezinárodní obchod k financování znovuvyzbrojení, zatímco stalinismus zavedl úplnou ekonomickou izolaci"
  - "Nacistické Německo spoléhalo na dobrovolnou firemní spolupráci se státem, zatímco stalinismus používal pouze nucenou práci"
explanation: >-
  Ačkoli oba režimy používaly totožné politické metody (kult osobnosti, totální dohled, systematické odstraňování opozice), jejich ekonomické modely se formou lišily. Nacistické Německo formálně nezrušilo soukromé vlastnictví, ale soukromý sektor zcela podřídilo státním cílům, jako byly válka a znovuvyzbrojení, a zavedlo ekonomickou autarkii. Stalinismus šel dál tím, že zrušil veškeré soukromé vlastnictví, zavedl pětileté plány a přímo kontroloval veškerou výrobu a distribuci.
