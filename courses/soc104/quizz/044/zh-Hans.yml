question: "Karl Marx 在乌托邦社会主义与科学社会主义之间作出了什么区分？"
answer: "他指责早期法国社会主义者提出想象中的解决方案，而他的科学社会主义建立在历史唯物主义和阶级斗争之上"
wrong_answers:
  - "他认为乌托邦社会主义过于关注经济，而科学社会主义优先考虑文化和艺术转型"
  - "他赞扬乌托邦社会主义者的实践实验，并批评科学社会主义过于抽象和理论化"
  - "他声称乌托邦社会主义是暴力和革命性的，而科学社会主义支持和平的民主改革"
explanation: >-
  Marx 指责 Proudhon、Saint-Simon 和 Fourier 等早期法国社会主义者是乌托邦主义者，提出的是纯粹想象中的解决方案。他的科学社会主义建立在历史唯物主义之上：即历史通过阶级斗争和生产资料占有而推进，在其中所有文化表象都受生产力和生产关系的制约。
reviewed: false
