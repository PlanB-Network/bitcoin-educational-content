question: "Vilken är den libertarianska positionen i frågan om samkönat äktenskap?"
answer: "Staten har inget att göra med att definiera äktenskap; det bör privatiseras och lämnas åt individer, sammanslutningar och religiösa institutioner"
wrong_answers:
  - "Samkönat äktenskap bör legaliseras eftersom alla medborgare förtjänar likabehandling inför lagen"
  - "Samkönat äktenskap bör förbjudas eftersom traditionellt äktenskap är en grundläggande institution för fortplantning"
  - "Samkönat äktenskap bör legaliseras men endast genom ett separat juridiskt ramverk skilt från traditionellt äktenskap"
explanation: >-
  Libertarianer hävdar att äktenskapsfrågan i grunden är felramad eftersom den ställs i etatistiska termer. De menar att staten inte har något att göra med att blanda sig i privatlivet, så lösningen är att helt skilja äktenskapet från staten. Genom att påtvinga en enda definition skapar staten konflikter. Det första felaktiga svaret återspeglar den socialistiska eller centristiska positionen, och det andra återspeglar den konservativa positionen.
reviewed: false
