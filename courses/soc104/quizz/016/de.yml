question: "Wie lautet die Definition von Etatismus, wie sie im Nolan-Modell dargestellt wird?"
answer: "Gesetzgebung zu nutzen, um die Gesellschaft zu kontrollieren und zu formen, sei es im Namen der Verteidigung der Zivilisation, der Arbeiterklasse, der Natur oder der Unterdrückten"
wrong_answers:
  - "Ein Regierungssystem, in dem gewählte Amtsträger feste Amtszeiten haben und Machtwechsel durch demokratische Wahlen erfolgen"
  - "Die Überzeugung, dass nur ein starkes Militär die Souveränität und territoriale Integrität einer Nation schützen kann"
  - "Eine Wirtschaftsphilosophie, die nationale Industrien durch Zölle und Quoten gegenüber ausländischer Konkurrenz bevorzugt"
explanation: >-
  Etatismus wird definiert als die Nutzung von Gesetzgebung, um die Gesellschaft zu kontrollieren und zu formen. Sowohl die Linke als auch die Rechte praktizieren ihn: einige im Namen der Verteidigung der Zivilisation, andere im Namen der Verteidigung der Arbeiterklasse, der Natur oder der Unterdrückten. Selbst Zentristen befürworten ihn, wenn es ihnen passt. Etatismus beschränkt sich nicht auf Militärpolitik, Handelsprotektionismus oder bloß das Vorhandensein gewählter Regierungen.
reviewed: false
