question: "Как системата на фиатните пари засилва разделението между управляващи и управлявани?"
answer: "Тя позволява на правителствата да финансират неограничени разходи чрез създаване на пари, което обезценява спестяванията чрез инфлация"
wrong_answers:
  - "Тя дава на гражданите пряк контрол върху паричната политика чрез демократични избори и референдуми"
  - "Тя пречи на правителствата да заемат, като ги принуждава да разчитат единствено на данъчно облагане за приходи"
  - "Тя разпределя новосъздадените пари поравно между всички граждани, за да стимулира икономическия растеж"
explanation: >-
  Фиатната валута е описана като крайъгълния камък на разширяването на държавната власт, защото позволява на правителствата да заемат и да тласкат банките да печатат нови пари. Получената инфлация обезценява спестяванията на хората, облагодетелствайки най-богатите и най-мощните субекти. Тя не дава на гражданите паричен контрол, нито предотвратява заемането или разпределя парите поравно.
reviewed: false
