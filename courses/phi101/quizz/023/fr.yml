question: Pourquoi Rothbard considère-t-il que les constitutions écrites ne suffisent pas à limiter le pouvoir de l'État ?
answer: Elles peuvent être interprétées de manière extensive par ceux au pouvoir pour étendre l'autorité de l'État.
wrong_answers:
  - Elles peuvent être facilement modifiées par les pouvoirs en place.
  - Elles sont trop anciennes pour être pertinentes dans les sociétés démocratiques modernes.
  - Elles ne peuvent pas empêcher les abus de pouvoir par les bureaucrates et les fonctionnaires.
explanation: |
  Rothbard soutient que les constitutions sont insuffisantes car le parti majoritaire peut adopter des interprétations extensives pour accroître son pouvoir. Sans mécanismes concrets d'application, les constitutions deviennent des outils inefficaces contre l'expansion de l'autorité de l'État.
reviewed: true
