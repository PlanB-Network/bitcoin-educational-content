question: "Откуда происходит политическое деление на левых и правых?"
answer: "Из рассадки во время дебатов Французской революции 1789 года"
wrong_answers:
  - "Из работ Карла Маркса и Адама Смита в XIX веке"
  - "Из Гражданской войны в США между северными и южными штатами"
  - "Из философов Просвещения, которые отделили разум от традиции"
explanation: >-
  Деление на левых и правых восходит к 1789 году, когда депутаты французского Национального собрания, выступавшие за сохранение власти короля, сидели справа от председателя, а те, кто хотел ограничить его полномочия, сидели слева. Оно возникло не из-за Маркса и Смита, не из-за Гражданской войны в США и не из философии Просвещения.
