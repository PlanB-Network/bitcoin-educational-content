question: "Jak socialismus zachází se svobodami odlišně ve společenské a ekonomické sféře?"
answer: "Socialismus podporuje silné svobody ve společenské sféře, ale slabé svobody v ekonomické sféře"
wrong_answers:
  - "Socialismus omezuje všechny svobody stejně ve společenské i ekonomické sféře"
  - "Socialismus podporuje silné ekonomické svobody, ale omezuje společenské svobody, aby udržel společenský řád"
  - "Socialismus poskytuje neomezené svobody v obou sférách a spoléhá na dobrovolnou spolupráci k udržení rovnováhy"
explanation: >-
  V socialistickém myšlení existuje základní dichotomie mezi společenskými a ekonomickými svobodami. Společenské svobody jsou silné, ale ekonomické svobody jsou slabé kvůli důrazu na státní kontrolu, plánování a přerozdělování bohatství. Třetí chybná odpověď popisuje libertariánský ideál, zatímco druhá popisuje konzervativní vzorec, který je zrcadlovým obrazem socialismu.
