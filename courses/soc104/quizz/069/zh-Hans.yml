question: "在五个社会议题辩论（婚姻、移民、枪支、毒品、含糖饮料）中，什么反复出现的分析框架塑造了社会主义者在每个问题上的立场？"
answer: "支配者与被支配者之间的冲突框架，其中社会由压迫结构化，而国家必须介入以保护弱势群体"
wrong_answers:
  - "一种功利主义框架，专注于为最大数量的公民最大化整体幸福和经济生产率"
  - "一种自然权利框架，其中个人自由必须免受国家和企业干预的侵害"
  - "一种传统主义框架，其中既有社会制度必须被保护，以抵御破坏性的现代变化"
explanation: >-
  社会主义者在社会议题辩论中的立场始终受到支配者/被支配者冲突框架的塑造。在婚姻问题上，是异性恋多数压迫同性恋少数。在移民问题上，基于国籍的限制是压迫形式。在枪支问题上，只有国家应当掌握武力，以保护弱势者。在含糖饮料问题上，工业资本家从最缺乏保护者的脆弱性中获利。这种压迫者/被压迫者视角在众多领域中被复制，包括性别、种族，甚至人类与自然之间的关系。
reviewed: false
