question: "Jakie jest socjalistyczne stanowisko w sprawie opieki zdrowotnej?"
answer: "Dostęp do opieki zdrowotnej jest fundamentalnym prawem, a państwo musi zagwarantować powszechny, finansowany publicznie system dla wszystkich, niezależnie od dochodu"
wrong_answers:
  - "Opieka zdrowotna powinna być systemem mieszanym, z podstawowym zabezpieczeniem państwowym uzupełnianym przez opcje prywatnego ubezpieczenia"
  - "Prywatne rynki zapewniają bardziej innowacyjną opiekę zdrowotną, więc jednostki powinny swobodnie wybierać własny system"
  - "Państwo powinno zapewniać opiekę zdrowotną tylko najbiedniejszym obywatelom, podczas gdy prywatne ubezpieczenie obejmuje wszystkich pozostałych"
explanation: >-
  Dla socjalistów dostęp do opieki zdrowotnej jest fundamentalnym prawem, a nie towarem. Państwo musi zagwarantować powszechny, finansowany publicznie system opieki zdrowotnej, aby każdy miał dostęp do leczenia, niezależnie od dochodu. Odzwierciedla to socjalistyczną troskę o równość, sprawiedliwość społeczną i znaczenie państwa w organizowaniu usług w interesie ogólnym. System mieszany opisuje pogląd centrowy, podczas gdy podejścia oparte na wyborze odzwierciedlają stanowiska libertariańskie i konserwatywne.
reviewed: false
