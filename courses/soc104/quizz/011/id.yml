question: "Ketegangan internal apa yang ada di antara kaum libertarian pada diagram Nolan?"
answer: "Sebagian ingin menghapus negara sepenuhnya (anarko-kapitalis) sementara yang lain lebih memilih negara minimal yang mempertahankan fungsi kedaulatan inti (minarkis)"
wrong_answers:
  - "Sebagian menginginkan regulasi ekonomi yang kuat sementara yang lain lebih memilih deregulasi total semua industri"
  - "Sebagian mendukung pemilu demokratis sementara yang lain menyukai sistem pemerintahan turun-temurun"
  - "Sebagian menganjurkan kebijakan sosial progresif sementara yang lain membela nilai moral yang sangat tradisional"
explanation: >-
  Di dalam keluarga libertarian, ada ketidaksepakatan fundamental tentang peran negara. Anarko-kapitalis ingin mengganti semua fungsi negara dengan layanan privat, sementara minarkis menerima negara minimal yang mempertahankan fungsi kedaulatan inti seperti pertahanan dan pengadilan. Kedua kelompok berbagi puncak libertarian, tetapi berbeda tentang apakah negara apa pun seharusnya ada sama sekali.
