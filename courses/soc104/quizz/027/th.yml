question: "อนุรักษนิยมทางการเมืองคืออะไร?"
answer: "อุดมการณ์ที่มุ่งรักษาสถาบันการเมืองและระเบียบสังคมที่ตั้งมั่นอยู่แล้ว โดยต่อต้านการเปลี่ยนแปลงเชิงโครงสร้างครั้งใหญ่"
wrong_answers:
  - "ความมุ่งมั่นส่วนตัวต่อค่านิยมครอบครัวแบบดั้งเดิมและการปฏิบัติทางศาสนา โดยไม่พยายามบังคับสิ่งเหล่านั้นต่อผู้อื่น"
  - "ปรัชญาที่ส่งเสริมการเปลี่ยนแปลงสังคมอย่างรวดเร็วผ่านการปฏิรูปประชาธิปไตยและกฎหมายก้าวหน้า"
  - "ทฤษฎีเศรษฐกิจที่สนับสนุนตลาดเสรี ภาษีขั้นต่ำ และการยกเลิกอุปสรรคทางการค้า"
explanation: >-
  อนุรักษนิยมทางการเมืองคืออุดมการณ์ที่มักถูกแทนโดยพรรคการเมืองฝ่ายขวาหรือขวาจัด มุ่งรักษาสถาบันการเมืองและระเบียบสังคมที่ตั้งมั่นอยู่แล้ว พร้อมต่อต้านการเปลี่ยนแปลงเชิงโครงสร้างครั้งใหญ่ ผู้สนับสนุนมันต้องการใช้อำนาจและกฎหมายเพื่อคุ้มครองมรดกของตน สิ่งนี้แตกต่างจากอนุรักษนิยมทางวัฒนธรรม ซึ่งเป็นทางเลือกชีวิตส่วนตัวมากกว่าโครงการทางการเมือง
reviewed: false
