question: "Nos cinco debates sociais (casamento, imigração, armas de fogo, drogas, bebidas açucaradas), qual estrutura analítica recorrente molda a posição socialista em cada questão?"
answer: "Uma estrutura de conflito entre dominantes e dominados, na qual a sociedade é estruturada pela opressão e o Estado deve intervir para proteger o grupo vulnerável"
wrong_answers:
  - "Uma estrutura utilitarista focada em maximizar a felicidade geral e a produtividade econômica para o maior número de cidadãos"
  - "Uma estrutura de direitos naturais em que as liberdades individuais devem ser protegidas tanto da interferência estatal quanto da corporativa"
  - "Uma estrutura tradicionalista em que instituições sociais estabelecidas devem ser preservadas contra mudanças modernas disruptivas"
explanation: >-
  A posição socialista nos debates sociais é consistentemente moldada por uma estrutura de conflito dominante/dominado. No casamento, trata-se da maioria heterossexual oprimindo uma minoria homossexual. Na imigração, restrições baseadas em nacionalidade são formas de opressão. Nas armas de fogo, apenas o Estado deve deter a força para proteger os vulneráveis. Nas bebidas açucaradas, industriais lucram com a vulnerabilidade dos menos protegidos. Essa lente opressor/oprimido é reproduzida em numerosos domínios, incluindo gênero, raça e até a relação entre humanidade e natureza.
reviewed: false
