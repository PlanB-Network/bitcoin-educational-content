question: "Dlaczego model dwuwymiarowy twierdzi, że większość kwestii politycznych można podzielić na kategorie gospodarcze i osobiste?"
answer: "Ponieważ kwestie gospodarcze dotyczą tego, co robisz jako producent i konsument, podczas gdy kwestie osobiste dotyczą twoich prywatnych relacji, przekonań i autonomii cielesnej"
wrong_answers:
  - "Ponieważ wszystkie debaty polityczne ostatecznie sprowadzają się do sporów o poziomy opodatkowania i praktyki religijne"
  - "Ponieważ historycznie rządy regulowały tylko dwie rzeczy: rynek i wojsko"
  - "Ponieważ filozofowie polityczni od starożytności zawsze oddzielali troski materialne od trosk duchowych"
explanation: >-
  Model dwuwymiarowy opiera się na idei, że kwestie polityczne dzielą się na dwie szerokie kategorie. Wolności gospodarcze obejmują produkcję, konsumpcję, handel, zatrudnienie i zarządzanie pieniędzmi. Wolności osobiste obejmują prywatne relacje, opinie, przekonania i wybory dotyczące własnego ciała i umysłu. To rozdzielenie pozwala na znacznie bardziej zniuansowane mapowanie stanowisk politycznych niż pojedyncza oś lewica-prawica.
