question: "How do the strategies for abolishing the state differ between libertaires and libertarians?"
answer: "Libertaires historically advocate violent destruction, while libertarians seek to delegitimize the state through education and civil disobedience"
wrong_answers:
  - "Libertaires use democratic elections to dismantle the state, while libertarians favor armed revolution and direct action"
  - "Libertaires focus on building alternative communities, while libertarians work within the existing political system to pass reforms"
  - "Both libertaires and libertarians agree that peaceful protest is the only legitimate means of social transformation"
explanation: >-
  The libertaires historically advocate destroying the state and capitalism through violence, including terror and targeted attacks. Libertarians, by contrast, reject aggressive violence as illegitimate. Their strategy rests on delegitimizing the state through argumentation, debate, education, and civil disobedience. These fundamentally different approaches to change reflect their deeper philosophical disagreements.
