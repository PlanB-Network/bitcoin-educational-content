question: "Ubugumyabanga bw'umuco ni iki?"
answer: "Kwumira ku giti cawe ku ndangagaciro z'umuryango, inyifato runtu, ubwiza, n'ivy'inyuma y'ibiboneka warazwe na kahise, si filozofiya ya politike"
wrong_answers:
  - "Ingengabitekerezo ya politike ikoresha ububasha bwa Leta kugira ngo ihatire ikibano cose indangagaciro za kera biciye mu mategeko"
  - "Umuhari wanka ubwoko bwose bw'ubugezweho kandi ushaka gusubiza ikibano mu buryo bw'ubuzima bw'imbere y'inganda"
  - "Inyigisho y'ubutunzi ikingira inganda z'igihugu kandi ikarwanya ubudandaji bwidegemvya n'ibihugu vyo hanze"
explanation: >-
  Ubugumyabanga bw'umuco busobanurwa nk'ubukerebutsi bw'ubuzima: kwumira ku giti cawe ku ndangagaciro z'umuryango, inyifato runtu, ubwiza, n'ivy'inyuma y'ibiboneka warazwe na kahise, zaba iz'Abagiriki n'Abaroma canke iz'Abayuda n'Abakristo. Buratomora ko atari filozofiya ya politike. Buratandukanye n'ubugumyabanga bwa politike, bugamije kuzigama inzego za politike n'urutonde rw'ikibano biciye ku bubasha bwa Leta. Kandi si ukwanka ibihe vya none canke protectionism y'ubutunzi.
