question: "Kubera iki intwaro z'igitugu zigenzura vyose zadondowe nk' 'amadini adashingiye ku Mana,' kandi ivyo bihishura iki ku bintu bikenewe kugira ubutegetsi bw'igitugu bugenzura vyose bubeho?"
answer: "Zisaba ukwemera kumeze nk'ukw'idini ku barwanashaka kandi zigakoresha ubwoba ku bazirwanya, kandi ubutegetsi bw'igitugu bugenzura vyose busaba ibiranga vyose rimwe: umwidegemvyo ukandamijwe, ubutegetsi bw'umugambwe umwe, impinduka y'ubutegetsi y'ubukazi, n'ubukungu buyobowe"
wrong_answers:
  - "Zisubiriza ugusenga kwa kera imihango ya Leta, kandi ubutegetsi bw'igitugu bugenzura vyose busaba gusa indongozi ifise igikundiro gikomeye n'ugucungera igisirikare"
  - "Zikoresha inzego z'idini kugira zishire mu ngiro iciyumviro c'ingenderwako ca Leta, kandi ubutegetsi bw'igitugu bugenzura vyose bushobora kuza igihe cose umugambwe umwe wa politike wiganje mu nteko"
  - "Zisezerana agakiza ko mu vy'impwemu biciye mu gikorwa ca politike, kandi ubutegetsi bw'igitugu bugenzura vyose buba buhari igihe cose Leta igenzura ubukungu hatitawe ku mwidegemvyo wa politike"
explanation: >-
  Raymond Aron yabonye ko intwaro z'igitugu zigenzura vyose zikora ku ngingo ngenderwako zibiri: ukwemera kw'abarwanashaka n'ubwoba bw'abatavuga rumwe nazo. Ukwo kubandwa kumeze nk'ukw'idini kuraziranga kuruta intumbero zazo zitandukanye, bigatuma zitwa amadini adashingiye ku Mana. Ica nkenerwa cane, ubutegetsi bw'igitugu bugenzura vyose busaba ibiranga vyose rimwe: umwidegemvyo ukandamijwe, ububasha butagira imbibe biciye ku mugambwe umwe, impinduka y'ubutegetsi y'ubukazi, n'ubukungu buyobowe. Demokarasi zo muri iki gihe zoshobora kugaragaza bimwe muri ivyo bimenyetso, ariko ubutegetsi bw'igitugu bugenzura vyose buba buhari gusa igihe vyose bikoraniye hamwe.
