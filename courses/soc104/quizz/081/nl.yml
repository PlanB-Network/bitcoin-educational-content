question: "Wat is constructivisme als gedeelde politieke overtuiging?"
answer: "De overtuiging dat een centrale overheid, door kracht van wet, een sociale orde kan scheppen die goed is voor het grootste aantal mensen"
wrong_answers:
  - "De overtuiging dat de samenleving moet worden georganiseerd via vrijwillige samenwerking tussen individuen zonder staatsinmenging"
  - "De overtuiging dat alleen vrije markten de optimale verdeling van middelen in de samenleving kunnen bepalen"
  - "De overtuiging dat politieke autoriteit gelijk moet worden verdeeld onder alle burgers via directe democratie"
explanation: >-
  Constructivisme verenigt centristen, conservatieven en socialisten rond een gedeelde overtuiging: de superioriteit van het politieke proces boven het marktproces. Het is de overtuiging dat een centrale overheid, door kracht van wet, een sociale orde kan scheppen die goed is voor het grootste aantal mensen. Dit staat lijnrecht tegenover de libertarische verdediging van spontane orde die voortkomt uit vrijwillige interacties.
reviewed: false
