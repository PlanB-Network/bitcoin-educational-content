question: "Bitcoin ikora gute nk'umugambi w'imico runtu ufise ingaruka za politike aho kuba umugambi wa politike ufise ivyo wisaba mu mico runtu?"
answer: "Bitcoin yateguwe kugira ngo igire abantu abidegemvya aho kubagira abatunzi, igatuma haba itunga rikora, igakingira agaciro k'igikorwa, kandi ikazigama ubuzima bwite; ivyo ni ivyo gushika ku mico runtu bitanga ingaruka za politike ata kwivuga ko biri mu ruhande rwa politike urwo ari rwo rwose"
wrong_answers:
  - "Bitcoin ni umugambi w'imico runtu kuko code yayo ishiraho amategeko y'imico abuza ubusuma, kandi ingaruka yayo ya politike ni ugusubiriza ubutegetsi bwa demokarasi n'ugufata ingingo biciye muri algorithm"
  - "Bitcoin ikora nk'umugambi w'imico runtu kuko isubira kugabura ubutunzi ibukura ku batunzi ikabuha abayakiriye kare, igatuma haba ikibano kirushirije kuba c'ubutungane gifise ingaruka ku mategeko y'imisoro"
  - "Bitcoin ni iya runtu kuko Satoshi Nakamoto yashizemwo amabwirizwa y'imico muri protocol, kandi ingaruka yayo ya politike ni uguhuza imiryango yose ya politike mu buryo bumwe bw'amahera"
explanation: >-
  Bitcoin ntiyateguwe kugira ngo igire abantu abatunzi, ahubwo kugira ngo ibagire abidegemvya. Ishika ku vyavuye mu mico runtu bitatu: gutuma haba itunga rikora neza (bikaremesha kwikorera ibikuraba), gukingira agaciro karemewe n'igikorwa (bikaremesha akigoro k'ugutanga umwimbu), no kuzigama ubuzima bwite (bikareka abantu bakabaho ata bwoba). Ivyo ni ivyo gushika ku mico runtu bitwara ingaruka za politike ata kuba ivy'urugamba rwa politike urwo ari rwo rwose, bigatuma iba umugambi w'imico runtu ubwa mbere, iya politike ubwa kabiri.
