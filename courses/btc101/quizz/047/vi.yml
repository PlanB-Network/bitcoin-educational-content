question: Hyperinflation (Lạm phát phi mã) là gì?
answer: Một hiện tượng tăng đột biến trong khối lượng tiền tệ.
wrong_answers:
  - Một hiện tượng tăng nhỏ trong khối lượng tiền tệ.
  - Một hiện tượng giảm đột biến trong khối lượng tiền tệ.
  - Một hiện tượng giảm nhỏ trong khối lượng tiền tệ.
explanation: |
  Hyperinflation (Lạm phát phi mã) là một hiện tượng tiền tệ được đặc trưng bởi một
  sự tăng đột ngột trong lạm phát thông qua việc in tiền
  bởi các cơ quan chức năng, dẫn đến mất hoàn toàn
  lòng tin vào một đồng tiền.
reviewed: true