title: "The Constitution of Liberty"

publication_year: 1960

cover: cover_en.webp

original: true

description: |
  Hayek's comprehensive statement of classical liberal philosophy examines the meaning of liberty, the role of law in preserving freedom, and the dangers of the welfare state. He traces the intellectual history of freedom from the ancient Greeks through the Enlightenment to the modern era, arguing that spontaneous order and the rule of law, not central planning, produce the best outcomes for society. The book remains a cornerstone of 20th-century liberal thought.
