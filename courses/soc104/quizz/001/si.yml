question: "වම-දකුණ දේශපාලන බෙදීම ආරම්භ වන්නේ කොතැනින්ද?"
answer: "1789 ප්‍රංශ විප්ලව විවාද සමයේ ආසන සැලැස්මෙන්"
wrong_answers:
  - "දහනවවන සියවසේ Karl Marx සහ Adam Smithගේ ලියවිලිවලින්"
  - "උතුරු සහ දකුණු ප්‍රාන්ත අතර වූ ඇමරිකානු සිවිල් යුද්ධයෙන්"
  - "විචාරය සම්ප්‍රදායෙන් වෙන් කළ Enlightenment දාර්ශනිකයන්ගෙන්"
explanation: >-
  වම-දකුණ බෙදීම 1789 දක්වා යයි; එවිට ප්‍රංශ ජාතික සභාවේ රජුගේ බලය පවත්වා ගැනීමට පක්ෂ වූ නියෝජිතයෝ සභාපතිගේ දකුණු පැත්තේ වාඩි වූ අතර, ඔහුගේ බලතල සීමා කිරීමට කැමති වූ අය වම් පැත්තේ වාඩි වූහ. එය Marx සහ Smithගෙන්, ඇමරිකානු සිවිල් යුද්ධයෙන්, හෝ Enlightenment දාර්ශනිකත්වයෙන් ආරම්භ වූයේ නැත.
reviewed: false
