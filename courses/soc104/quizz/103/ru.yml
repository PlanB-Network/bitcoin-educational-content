question: "Как курс утверждает, что свобода позволяет левым и правым ценностям мирно сосуществовать?"
answer: "В режиме подлинной свободы люди с левыми идеалами могут добровольно делиться имуществом и перераспределять средства, а люди с правыми ценностями — сберегать и передавать традиции, при этом ни одна сторона не навязывает другой свой образ жизни"
wrong_answers:
  - "Свобода требует от обеих сторон компромисса через принятие центристской позиции, при которой государство уравновешивает конкурирующие ценности умеренным регулированием"
  - "Свобода означает, что левые и правые сообщества должны жить на отдельных географических территориях со своими независимыми правительствами"
  - "Свобода работает так, что позволяет гражданам голосовать за то, какие ценности должны принудительно применяться в каждом регионе, чередуя левую и правую политику на каждом избирательном цикле"
explanation: >-
  Курс показывает, что в подлинном режиме свободы те, кто придерживается левых идеалов, могут добровольно отказаться от имущества, делиться средствами производства или жертвовать заработную плату перераспределительным организациям. Люди с правыми ценностями могут усердно работать, сберегать и передавать семейные ценности. Никто не должен навязывать другим свой образ жизни. Именно благодаря свободе рынка и силе выбора цели могут достигаться мирно.
