question: "Hva avslører Mussolinis erklæring fra 1920, «Alt i staten, ingenting utenfor staten, ingenting mot staten», om totalitarisme?"
answer: "Det finnes ikke lenger noe skille mellom offentlig og privat rom, ettersom staten fullstendig absorberer samfunnet"
wrong_answers:
  - "Staten fokuserer utelukkende på militær makt, mens den overlater økonomien til privat næringsliv"
  - "Borgere står fritt til å organisere seg privat så lenge de ikke åpent kritiserer regjeringen"
  - "Regjeringen kontrollerer bare politisk aktivitet, mens kulturelt og religiøst liv forblir autonomt"
explanation: >-
  Mussolinis erklæring fanger essensen av totalitarisme: totalitet. Alt absorberes inn i staten, noe som betyr at det ikke finnes noe skille mellom offentlig og privat rom. Samfunnet mister enhver form for autonomi, helt ned til de mest hverdagslige aktivitetene som å starte en idrettsklubb. Dette går langt ut over å kontrollere bare militære, politiske eller økonomiske sfærer.
