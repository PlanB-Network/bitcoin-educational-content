question: "Majukumu ya Cato Institute, Mises Institute, na Libertarian Party yanatofautianaje ndani ya harakati ya libertarian?"
answer: "Cato Institute huzingatia mapendekezo ya sera za umma, Mises Institute elimu na uchapishaji wa kitaaluma, na Libertarian Party siasa za uchaguzi"
wrong_answers:
  - "Cato Institute hufadhili kampeni za kisiasa, Mises Institute hushawishi Congress moja kwa moja, na Libertarian Party huandaa makongamano ya kitaaluma"
  - "Cato Institute huchapisha vitabu vya kiada vya uchumi, Mises Institute huendesha kampeni za usajili wa wapiga kura, na Libertarian Party huandaa miswada ya sheria"
  - "Cato Institute huandaa maandamano ya mashinani, Mises Institute hutoa utetezi wa kisheria kwa libertarians, na Libertarian Party husimamia utafiti wa think tank"
explanation: >-
  Cato Institute (ilianzishwa 1977) ni think tank yenye makao Washington inayofanya kazi katika mapendekezo ya sera za umma. Mises Institute (ilianzishwa 1982) hulenga elimu badala ya ushawishi wa kisiasa, ikifanya kazi kama aina ya chuo kikuu cha mtandaoni chenye makongamano na kazi zilizochapishwa upya. Libertarian Party (ilianzishwa 1971) ni chama cha tatu kwa ukubwa cha kisiasa nchini Marekani, kikishiriki katika uchaguzi ambapo hata sehemu yake ya takribani 2% ya kura inaweza kubadili matokeo.
