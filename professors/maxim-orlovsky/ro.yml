bio: |
  Sunt un transumanist și cypherpunk care desfășoară activități științifice, inginerești și de afaceri. 
  Preocuparea mea principală este construirea unor fundații pentru viitor - fundații care vor debloca întregul potențial al indivizilor, permițând auto-suveranitatea, confidențialitatea și rezistența la cenzură. Acesta este viitorul progresului vertical și al evoluției umanității spre forme mult dincolo de ceea ce societatea colectivistă actuală poate propune sau permite.


short_bio: Ex Tenebrae sententia sapiens dominabitur astris. Cypher, AI, robotică, transumanism. Creatorul RGB, Prime, Radiant și lnp_bp, mycitadel_io & cyphernet_io

