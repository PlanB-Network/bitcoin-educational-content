question: "Paleo-liberteryenizm nedir?"
answer: "Devletin bir zorlama kaynağı olarak reddedilmesini, geleneksel kurumların ve gönüllü toplumsal yapıların güçlendirilmesiyle birleştiren bir sentez"
wrong_answers:
  - "Tüm geleneksel değerleri reddeden ve radikal toplumsal ilerlemeciliği teşvik eden bir liberteryen hareket"
  - "Bazı ekonomik özgürlüklere izin verirken geleneksel değerleri dayatmak için devlet gücünü kullanan muhafazakâr bir ideoloji"
  - "Sosyalist ekonomi ile muhafazakâr sosyal politika arasında dengeli bir uzlaşma arayan merkezci bir felsefe"
explanation: >-
  Paleo-liberteryenizm, devletin kurumsal zorlama kaynağı olarak reddedilmesini, geleneksel kurumların güçlendirilmesi ve devlet otoritesi yerine gönüllü toplumsal yapıların tercih edilmesiyle birleştirir. Geleneksel değerlere daha sempatiyle yaklaşmasıyla neo-liberteryenizmden ayrılır. Paleo-liberteryen, toplulukların sosyalist veya komüniteryen ilkeler etrafında örgütlenmesine karşı çıkmaz; yalnızca bu tür toplulukların değerlerini yasa gücüyle herkese dayatmasını reddeder.
