question: "Dlaczego reżimy totalitarne opisywano jako „religie świeckie” i co ujawnia to o warunkach koniecznych do istnienia totalitaryzmu?"
answer: "Wymagają od bojowników quasi-religijnej wiary i używają strachu wobec przeciwników, a totalitaryzm wymaga jednoczesnego wystąpienia wszystkich cech: tłumienia wolności, rządów jednej partii, brutalnej rewolucji i gospodarki kierowanej"
wrong_answers:
  - "Zastępują tradycyjny kult ceremoniami państwowymi, a totalitaryzm wymaga jedynie charyzmatycznego przywódcy i kontroli wojskowej"
  - "Wykorzystują instytucje religijne do egzekwowania ideologii państwowej, a totalitaryzm może pojawić się zawsze, gdy jedna partia polityczna dominuje w parlamencie"
  - "Obiecują duchowe zbawienie poprzez działanie polityczne, a totalitaryzm istnieje zawsze, gdy państwo kontroluje gospodarkę, niezależnie od wolności politycznych"
explanation: >-
  Raymond Aron zauważył, że reżimy totalitarne funkcjonują na dwóch zasadach: wierze bojowników i strachu przeciwników. Ten quasi-religijny fanatyzm charakteryzuje je ponad różnicami motywacji, nadając im miano religii świeckich. Co kluczowe, totalitaryzm wymaga jednoczesnego wystąpienia wszystkich cech definicyjnych: stłumionych wolności, nieograniczonej władzy sprawowanej przez jedną partię, brutalnej rewolucji i gospodarki kierowanej. Współczesne demokracje mogą wykazywać niektóre z tych cech, ale totalitaryzm jest obecny tylko wtedy, gdy wszystkie występują razem.
reviewed: false
