question: "Sur quoi la droite veut-elle légiférer ?"
answer: "La morale et la religion, sous l'effet du désir de préserver les institutions traditionnelles et les hiérarchies sociales"
wrong_answers:
  - "L'économie et les marchés financiers, sous l'effet du désir de réduire les inégalités et de redistribuer la richesse"
  - "La science et l'éducation, sous l'effet du désir de contrôler ce qui est enseigné dans les écoles publiques"
  - "Le commerce international et la diplomatie, sous l'effet du désir d'étendre l'influence nationale à l'étranger"
explanation: >-
  La droite donne la priorité à la morale personnelle et aux valeurs traditionnelles. Elle considère que la civilisation repose sur certaines institutions traditionnelles et hiérarchies sociales qui doivent être préservées, et elle veut légiférer sur la morale et la religion. C'est la gauche, et non la droite, qui se concentre sur la législation de l'économie. La science, l'éducation et la politique commerciale ne sont pas le principal enjeu décrit pour la droite.
reviewed: false
