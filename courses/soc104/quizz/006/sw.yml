question: "Mihimili miwili ya mchoro wa Nolan ni ipi?"
answer: "Mhimili wima unaopima uhuru wa binafsi na mhimili mlalo unaopima uhuru wa kiuchumi"
wrong_answers:
  - "Mhimili mlalo kutoka kushoto kwenda kulia na mhimili wima kutoka kimamlaka kwenda kidemokrasia"
  - "Mhimili wima unaopima utajiri na mhimili mlalo unaopima viwango vya elimu"
  - "Mhimili mlalo kutoka ujamaa kwenda ubepari na mhimili wima kutoka mapokeo kwenda maendeleo"
explanation: >-
  David Nolan aliunda mchoro wake ukiwa na mihimili miwili maalum: uhuru wa binafsi (wima) na uhuru wa kiuchumi (mlalo). Mtazamo huu wa vipimo viwili hubadilisha mstari wa kushoto-kulia uliorahisishwa kupita kiasi na hunasa vyema zaidi utata wa itikadi za kisiasa kwa kutenganisha makundi mawili makuu ya uhuru.
