question: "Điều gì phân biệt những người tân bảo thủ với những người paleoconservative trong cách tiếp cận chính sách đối ngoại?"
answer: "Những người tân bảo thủ biện minh cho chủ nghĩa can thiệp quân sự để truyền bá dân chủ, trong khi những người paleoconservative bảo vệ một chính sách đối ngoại cô lập hơn"
wrong_answers:
  - "Những người tân bảo thủ phản đối mọi hành động quân sự và ủng hộ ngoại giao, trong khi những người paleoconservative ủng hộ các cuộc tấn công phủ đầu vào các mối đe dọa tiềm tàng"
  - "Những người tân bảo thủ chỉ tập trung vào các biện pháp trừng phạt kinh tế, trong khi những người paleoconservative chủ trương xây dựng các liên minh quốc tế cho các chiến dịch quân sự chung"
  - "Những người tân bảo thủ và những người paleoconservative đồng ý về chính sách đối ngoại nhưng khác biệt gay gắt về điều tiết kinh tế trong nước"
explanation: >-
  Từ những năm 2000 trở đi, những người tân bảo thủ ngày càng tham gia vào việc biện minh cho chủ nghĩa can thiệp quân sự để cấy ghép dân chủ trên khắp thế giới, đặc biệt sau ngày 11 tháng 9 năm 2001. Để phản ứng, những người bảo thủ truyền thống nhận nhãn 'paleoconservative' để phân biệt mình. Những người paleoconservative phê phán chủ nghĩa can thiệp quân sự, bảo vệ một chính sách đối ngoại cô lập hơn, và nhấn mạnh nhiều hơn bản sắc quốc gia và văn hóa.
