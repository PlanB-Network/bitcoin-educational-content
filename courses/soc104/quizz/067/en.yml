question: "What is the conservative position on immigration?"
answer: "The state has the sovereign right to control its borders to protect national security and cultural identity"
wrong_answers:
  - "Borders should be open unconditionally because discriminatory restrictions violate human rights"
  - "Immigration should be determined by market demand, with citizens deciding contractually on their relationships with foreigners"
  - "Immigration policy should balance economic needs with successful integration based on expert evaluation"
explanation: >-
  Conservatives hold that order, identity, and national sovereignty must take priority over the unrestricted welcome of foreigners or refugees. Borders and a well-defined population are part of civilized values. The wrong answers represent the socialist position (open borders as human rights), the libertarian position (market-based immigration), and the centrist position (balanced expert-driven approach).
reviewed: false
