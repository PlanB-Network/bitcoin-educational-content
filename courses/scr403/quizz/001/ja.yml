question: 並列合成では、入力はどうなりますか？
answer: 両方の操作が同じ入力を受け取り、それらの出力が積（ペア）を形成します。
wrong_answers:
  - 入力が半分に分割され、各操作が別々の部分を受け取ります。
  - 一方の操作が最初に入力を処理し、もう一方が変更後の結果を受け取ります。
  - 入力にタグが付けられ、処理のために2つの操作のうち一方だけにルーティングされます。
explanation: >-
  並列合成は、同じ未変更の入力を両方の操作に同時に与える。
  その結果は積型（ペア）にまとめられる。Simplicityでは、これは
  f ▵ gと書かれるpairコンビネータを使い、入力aに対して
  ⟨f(a), g(a)⟩を生成する。
reviewed: false
