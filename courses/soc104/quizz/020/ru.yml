question: "Что такое культурный консерватизм?"
answer: "Личная приверженность семейным, моральным, эстетическим и метафизическим ценностям, унаследованным от прошлого, а не политическая философия"
wrong_answers:
  - "Политическая идеология, использующая государственную власть, чтобы через законодательство навязать традиционные ценности всему обществу"
  - "Движение, которое отвергает все формы современности и стремится вернуть общество к доиндустриальному образу жизни"
  - "Экономическая доктрина, которая защищает национальные отрасли и выступает против свободной торговли с иностранными странами"
explanation: >-
  Культурный консерватизм определяется как жизненная мудрость: личная приверженность семейным, моральным, эстетическим и метафизическим ценностям, унаследованным от прошлого, будь то греко-римского или иудео-христианского. Это явно не политическая философия. Он отличается от политического консерватизма, который стремится сохранять политические институты и общественный порядок через государственную власть. Он также не сводится к отвержению современности или экономическому протекционизму.
