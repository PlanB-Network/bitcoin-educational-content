question: "Vilken gemensam punkt delar vänster- och högerpartier trots deras skenbara motsättning?"
answer: "Båda försvarar statens rätt att styra människors liv genom regleringar och skatter"
wrong_answers:
  - "Båda förespråkar ett fullständigt avskaffande av statlig intervention i ekonomiska frågor"
  - "Båda prioriterar individuell frihet framför samhällets kollektiva organisering"
  - "Båda avvisar användningen av penningpolitik som ett verktyg för statliga utgifter"
explanation: >-
  Trots att de verkar stå emot varandra delar vänstern och högern en preferens för statlig intervention. Båda kritiserar den fria marknaden och försvarar statens rätt att styra människors liv genom regleringar och skatter. Vänstern kritiserar marknader som en källa till ojämlikhet, medan högern ser dem som ett hot mot suveränitet, men båda vänder sig till staten för lösningar.
reviewed: false
