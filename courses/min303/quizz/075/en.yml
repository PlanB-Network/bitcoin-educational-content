question: "Which field in the Bitcoin block header is specifically used to allow miners to modify the header without altering its meaning?"
answer: Nonce
wrong_answers:
  - Version
  - "Prev-hash"
  - Merkle root
explanation: |
  The nonce field in the Bitcoin block header allows miners to modify the header by incrementing the nonce value to find a hash that meets the target difficulty.
reviewed: false
