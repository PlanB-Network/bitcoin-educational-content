question: "Nei cinque dibattiti sociali (matrimonio, immigrazione, armi da fuoco, droghe, bevande zuccherate), quale quadro analitico ricorrente plasma la posizione socialista su ciascuna questione?"
answer: "Un quadro conflittuale tra dominanti e dominati, in cui la società è strutturata dall'oppressione e lo Stato deve intervenire per proteggere il gruppo vulnerabile"
wrong_answers:
  - "Un quadro utilitarista incentrato sulla massimizzazione della felicità complessiva e della produttività economica per il maggior numero di cittadini"
  - "Un quadro dei diritti naturali in cui le libertà individuali devono essere protette sia dall'interferenza dello Stato sia da quella delle imprese"
  - "Un quadro tradizionalista in cui le istituzioni sociali consolidate devono essere preservate contro i cambiamenti moderni dirompenti"
explanation: >-
  La posizione socialista nei dibattiti sociali è costantemente plasmata da un quadro conflittuale dominante/dominato. Sul matrimonio, è la maggioranza eterosessuale che opprime una minoranza omosessuale. Sull'immigrazione, le restrizioni basate sulla nazionalità sono forme di oppressione. Sulle armi da fuoco, solo lo Stato dovrebbe detenere la forza per proteggere i vulnerabili. Sulle bevande zuccherate, gli industriali traggono profitto dalla vulnerabilità dei meno protetti. Questa lente oppressore/oppresso si riproduce in numerosi ambiti, inclusi genere, razza e persino il rapporto tra umanità e natura.
reviewed: false
