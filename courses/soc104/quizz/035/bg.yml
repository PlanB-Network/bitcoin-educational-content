question: "Защо Rothbard критикува визията на libertaires за човешката природа и каква алтернатива предлага?"
answer: "Той ги обвинява, че поддържат наивен възглед за 'благородния дивак', и твърди, че обществото трябва да използва частната собственост и добри стимули, за да насочва поведение, водено от личен интерес"
wrong_answers:
  - "Той хвали разбирането им за човешкото сътрудничество, но твърди, че минимална държава все пак е необходима за налагане на договорите"
  - "Той се съгласява, че хората са естествено добри, но настоява, че само свободните пазари могат да канализират тази доброта в продуктивна дейност"
  - "Той отхвърля акцента им върху индивидуалните права и вместо това твърди, че общностите трябва колективно да дефинират моралните стандарти"
explanation: >-
  Rothbard критикува libertaires за това, че приемат наивна, русоистка визия за човешката природа като естествено добра. Той твърди вместо това, че хората са водени от личен интерес и че обществото трябва да бъде организирано така, че добри стимули да насочват поведението. Това изисква признаване и гарантиране на частната собственост. Премахването на държавата не означава премахване на нейните функции; полицията и правосъдието трябва да бъдат управлявани от свободния пазар чрез конкуренция.
reviewed: false
