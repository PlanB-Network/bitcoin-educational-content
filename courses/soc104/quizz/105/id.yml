question: "Dengan mempertimbangkan keseluruhan argumen kursus ini, bagaimana Bitcoin secara bersamaan mewujudkan kritik libertarian terhadap konstruktivisme, komitmen cypherpunk pada aksi, dan pembelaan individualis atas otonomi moral?"
answer: "Bitcoin menggantikan uang yang direncanakan secara terpusat dengan tatanan pasar spontan (anti-konstruktivisme), mengubah ideal abstrak kebebasan finansial menjadi code yang berjalan (aksi cypherpunk), dan memulihkan properti berdaulat serta privacy kepada individu (otonomi moral)"
wrong_answers:
  - "Bitcoin menggunakan tata kelola demokratis untuk menetapkan kebijakan moneter (anti-konstruktivisme), menerbitkan konten edukatif tentang kebebasan finansial (aksi cypherpunk), dan memungkinkan individu memilih perubahan protokol (otonomi moral)"
  - "Bitcoin menghapus semua regulasi keuangan (anti-konstruktivisme), menciptakan komunitas developer yang melobi deregulasi (aksi cypherpunk), dan memberi individu kaya lebih banyak kendali atas kebijakan moneter (otonomi moral)"
  - "Bitcoin mendesentralisasi infrastruktur server di banyak negara (anti-konstruktivisme), menggunakan lisensi open-source untuk membagikan teknologi secara bebas (aksi cypherpunk), dan menyediakan platform media sosial anonim untuk perbedaan pendapat politik (otonomi moral)"
explanation: >-
  Bitcoin berada di persimpangan tiga tradisi intelektual yang dieksplorasi dalam kursus ini. Bitcoin mewujudkan argumen anti-konstruktivis dengan menggantikan uang fiat yang direncanakan secara terpusat dengan tatanan moneter spontan dan terdesentralisasi yang tidak dapat dikendalikan oleh perencana pusat mana pun. Bitcoin memenuhi imperatif cypherpunk untuk write code dengan mengubah ideal abstrak kebebasan finansial dan privacy menjadi teknologi yang bekerja. Dan Bitcoin melayani pembelaan individualis atas otonomi moral dengan memungkinkan properti berdaulat, melindungi buah kerja, dan menjaga privacy, membiarkan setiap orang menjadi penguasa atas hidupnya sendiri.
reviewed: false
