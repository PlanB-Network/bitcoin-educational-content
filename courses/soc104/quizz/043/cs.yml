question: "Jaké základní rozdělení oddělilo socialisty od počátku dvacátého století dál?"
answer: "Revoluční socialisté, kteří usilovali o uchopení moci násilím, versus reformističtí socialisté, kteří prosazovali změnu prostřednictvím demokratických voleb"
wrong_answers:
  - "Městští socialisté zaměření na průmyslové dělníky versus venkovští socialisté organizující zemědělské komuny"
  - "Nacionalističtí socialisté upřednostňující vlastní zemi versus internacionalističtí socialisté prosazující globální revoluci"
  - "Intelektuální socialisté píšící teoretické texty versus aktivističtí socialisté organizující dělnické stávky"
explanation: >-
  Od počátku dvacátého století oddělila revoluční socialisty, kteří odmítali vlastnická práva a snažili se zničit kapitalistickou společnost násilím nebo diktaturou proletariátu, od reformistických socialistů zásadní dělící linie. Reformističtí socialisté usilovali o sociální spravedlnost prostřednictvím demokratických voleb a zdanění, zatímco dočasně přijímali kapitalismus. Tento rozkol formoval celé následné dějiny socialistických hnutí.
