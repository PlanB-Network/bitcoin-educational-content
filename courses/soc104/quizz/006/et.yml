question: "Milline positsioon asub Nolani rombi tipus ja esindab maksimaalset vabadust?"
answer: "Libertarism, mis toetab suurimat majanduslikku ja isiklikku vabadust"
wrong_answers:
  - "Konservatism, mis toetab traditsioonilisi väärtusi ja majanduslikku vabadust"
  - "Tsentrism, mis tasakaalustab kõiki poliitilisi positsioone pragmaatilisel viisil"
  - "Sotsialism, mis toetab isiklikku vabadust ja sotsiaalset võrdsust"
explanation: >-
  Libertarism paikneb Nolani rombi tipus riigikesksuse vastandina. See esindab neid, kes toetavad nii majandusliku kui ka isikliku vabaduse suurimat määra. Konservatism asub paremal (suur majanduslik vabadus, väike isiklik vabadus), sotsialism vasakul (suur isiklik vabadus, väike majanduslik vabadus) ja tsentrism keskel.
reviewed: false
