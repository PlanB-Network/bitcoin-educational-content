question: "Каква е социалистическата позиция относно здравеопазването?"
answer: "Достъпът до здравеопазване е фундаментално право и държавата трябва да гарантира универсална, публично финансирана система за всички, независимо от дохода"
wrong_answers:
  - "Здравеопазването трябва да бъде смесена система с основно държавно покритие, допълвано от възможности за частно застраховане"
  - "Частните пазари предоставят по-иновативно здравеопазване, така че индивидите трябва свободно да избират собствената си система"
  - "Държавата трябва да предоставя здравеопазване само за най-бедните граждани, докато частното застраховане покрива всички останали"
explanation: >-
  За социалистите достъпът до здравеопазване е фундаментално право, а не стока. Държавата трябва да гарантира универсална, публично финансирана здравна система, така че всеки да има достъп до грижи, независимо от дохода. Това отразява социалистическата грижа за равенството, социалната справедливост и значението на държавата в организирането на услуги в общ интерес. Смесената система описва центристката гледна точка, докато подходите, основани на избор, отразяват либертариански и консервативни позиции.
