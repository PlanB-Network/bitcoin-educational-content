question: "在自由意志主义内部，最小国家主义者和无政府资本主义者之间的关键区别是什么？"
answer: "最小国家主义者接受一个负责防务、司法和警察的最小国家，而无政府资本主义者希望所有国家职能都私有化"
wrong_answers:
  - "最小国家主义者拒绝一切政府形式，而无政府资本主义者接受对市场的有限国家监管"
  - "最小国家主义者支持为基本服务实行累进税制，而无政府资本主义者反对一切税收"
  - "最小国家主义者只关注经济自由，而无政府资本主义者同时捍卫经济自由和社会自由"
explanation: >-
  最小国家主义者认为，国家应限于防务、司法和警察等核心职能（即“守夜人国家”），而无政府资本主义者则主张，即便这些职能也应被私有化，并通过自愿的市场竞争来管理。他们的分歧更多关乎实际实施，而不是根本伦理原则。两种倾向都共享自我所有权和非侵略的自由意志主义价值。
reviewed: false
