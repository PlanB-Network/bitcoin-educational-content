question: "Qual é a distinção central de Hannah Arendt entre o despotismo clássico e o totalitarismo?"
answer: "O totalitarismo não apenas submete as pessoas a regras tirânicas, mas torna os seres humanos incapazes de ação independente, negando a própria política"
wrong_answers:
  - "O despotismo clássico controla a economia enquanto o totalitarismo controla apenas as instituições políticas e militares"
  - "O totalitarismo é simplesmente uma versão mais extrema do despotismo, diferindo apenas na escala da repressão"
  - "O despotismo clássico usa ideologia para justificar seu governo enquanto o totalitarismo depende puramente da força militar"
explanation: >-
  Arendt argumenta que o totalitarismo é fundamentalmente diferente do despotismo clássico. Ele não é simplesmente uma tirania mais extrema, mas um sistema que torna os seres humanos supérfluos, destruindo sua capacidade de ação independente. Para Arendt, política é a capacidade de um povo tomar seu destino em suas próprias mãos, e o totalitarismo é a própria negação dessa capacidade, o que o torna qualitativamente diferente do despotismo.
