question: "Как трите съществени функции на свободния пазар, както са описани от либертарианците, заедно изграждат едновременно ефективна и етична система на социална организация?"
answer: "Цените дават компас за решенията, пазарът разкрива автентични предпочитания чрез търсене и предлагане, а свободният обмен позволява на индивидите да определят собствените си дела според личните си ценности, съчетавайки информационна ефективност с морална автономия"
wrong_answers:
  - "Пазарът максимизира общото богатство, предотвратява монополите чрез естествена конкуренция и осигурява равно разпределение на ресурсите, съчетавайки производителност със социална справедливост"
  - "Свободните пазари намаляват държавните разходи, стимулират технологичните иновации и създават възможности за заетост, съчетавайки фискална отговорност с икономически растеж"
  - "Пазарите понижават потребителските цени, повишават качеството на продуктите чрез конкуренция и разширяват международната търговия, съчетавайки вътрешно благоденствие с глобално сътрудничество"
explanation: >-
  Либертарианската аргументация в полза на свободния пазар почива върху три взаимосвързани функции. Първо, цените служат като надеждни индикатори, направляващи икономическите и социалните решения (компасът). Второ, пазарът разкрива автентични индивидуални предпочитания чрез търсене и предлагане. Трето, свободният обмен позволява на участниците да определят собствените си дела според личните си ценности. Hayek показва, че свободните пазари координират разпръсната информация по-добре от централното планиране (ефективност), докато взаимното съгласие зачита човешкото достойнство повече от принудата (справедливост).
reviewed: false
