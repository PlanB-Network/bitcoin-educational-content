question: Turgot ආර්ථික ලිබරල්වාදයේ තම මූලධර්ම මුලින්ම අත්හදා බැලුවේ කුමන ප්‍රංශ පළාතේද?
answer: Limousin
wrong_answers:
  - Brittany
  - L'Alsace
  - Normandy
explanation: |
  Turgot දුප්පත් සහ වෙන්වූ පළාතක් වූ Limousinහි intendant විය. එහිදී ඔහු ලිබරල්වාදයෙන් ප්‍රේරණය වූ ආර්ථික සංශෝධන කිහිපයක් ක්‍රියාත්මක කළේය.