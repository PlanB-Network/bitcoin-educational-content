question: "Modern muhafazakârlığın kurucu figürü olarak sıklıkla kim anılır?"
answer: "Fransız Devrimi'nin radikal değişimlerine karşı kurumların ve geleneklerin korunmasını savunan Edmund Burke"
wrong_answers:
  - "On dokuzuncu yüzyılda sınıf mücadelesi ve tarihsel materyalizm teorisini geliştiren Karl Marx"
  - "On yedinci yüzyılda doğal haklar ve toplumsal sözleşme teorisini ortaya koyan John Locke"
  - "Ulusların Zenginliği'ni yazan ve klasik iktisat disiplinini kuran Adam Smith"
explanation: >-
  Edmund Burke, Fransız Devrimi'ne muhalefeti nedeniyle sıklıkla muhafazakârlığın kurucu figürü olarak anılır. Fransa'daki Devrim Üzerine Düşünceler (1790) adlı eseri, radikal değişim yerine ihtiyatı ve kademeli reformu savundu. Toplumun temiz bir sayfa açarak değil, sınanmış kurumları ve gelenekleri koruyan artımlı reformlar yoluyla ilerlemesi gerektiğine inanıyordu.
