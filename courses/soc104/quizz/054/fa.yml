question: "چرا لیبرال‌های کلاسیک در ایالات متحده در طول سده بیستم شروع کردند خود را «لیبرتارین» بنامند؟"
answer: "زیرا «لیبرالیسم» آمریکایی توسط مداخله‌گری فزاینده دولت و دولت رفاه مصادره شده بود"
wrong_answers:
  - "زیرا می‌خواستند خود را از سنت‌های سلطنت‌طلبانه اروپایی جدا کنند"
  - "زیرا اصطلاح «لیبرال» با آنارشیسم و خشونت سیاسی پیوند خورده بود"
  - "زیرا توافق‌های تجاری جدید برای مدافعان بازار آزاد هویتی سیاسی متمایز می‌طلبیدند"
explanation: >-
  در طول سده بیستم، هنگامی که اصول لسه‌فر به‌تدریج به نفع دولت رفاه کنار گذاشته شدند، تغییری بنیادین رخ داد. «لیبرالیسم» آمریکایی معنایی بسیار متفاوت از لیبرالیسم کلاسیک یافت و مداخله‌گری دولت را پذیرفت. لیبرال‌های کلاسیک اصطلاح «لیبرتارین» را پذیرفتند تا این تمایز را حفظ کنند. این بازنام‌گذاری هیچ ارتباطی با سلطنت‌طلبی اروپایی، خشونت آنارشیستی، یا توافق‌های تجاری نداشت.
reviewed: false
