question: "从二十世纪初开始，什么根本分裂把社会主义者区分开来？"
answer: "寻求通过暴力夺取权力的革命社会主义者，与通过民主选举追求变革的改良社会主义者之间的分裂"
wrong_answers:
  - "专注于产业工人的城市社会主义者，与组织农业公社的农村社会主义者之间的分裂"
  - "优先考虑本国的民族主义社会主义者，与主张全球革命的国际主义社会主义者之间的分裂"
  - "撰写理论文本的知识分子社会主义者，与组织劳工罢工的行动派社会主义者之间的分裂"
explanation: >-
  从二十世纪初开始，一条根本分界线将革命社会主义者与改良社会主义者分开。前者反对财产权，并试图通过暴力或无产阶级专政摧毁资本主义社会；后者通过民主选举和税收追求社会正义，同时暂时接受资本主义。这一分裂塑造了此后社会主义运动的整个历史。
