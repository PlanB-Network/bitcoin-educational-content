description: |
  Le "zk" dans zkSNACKs signifie "zero knowledge", ce qui signifie que nous ne collectons pas et ne pouvons pas collecter d'informations personnelles sur les utilisateurs dans nos produits.

  zkSNACKs a arrêté son coordinateur de coinjoin le 1er juin 2024, et son site web est hors ligne. Wasabi Wallet continue comme logiciel libre.
