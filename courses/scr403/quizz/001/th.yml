question: การประกอบแบบตามลำดับให้ผลลัพธ์เป็นอะไร เมื่อเชื่อมปฏิบัติการ f (A → B) เข้ากับปฏิบัติการ g (B → C)?
answer: ปฏิบัติการประกอบเดี่ยวจาก A ไป C โดยเอาต์พุตของ f ถูกป้อนเข้าไปยัง g.
wrong_answers:
  - ค่าคู่ที่มีเอาต์พุตตัวกลางทั้งชนิด B และ C.
  - เงื่อนไขที่เลือกว่าจะใช้ f หรือ g ตามอินพุต.
  - ปฏิบัติการแยกกันสองตัวที่ทำงานอิสระ โดยไม่แชร์ข้อมูลกัน.
explanation: >-
  การประกอบแบบตามลำดับเชื่อมปฏิบัติการสองตัวแบบหัวต่อท้าย เอาต์พุตของ
  ปฏิบัติการแรกจะกลายเป็นอินพุตของปฏิบัติการที่สอง ใน Simplicity สิ่งนี้
  แสดงด้วย comp combinator: comp f g เรียกใช้ f ก่อน แล้วจึงเรียกใช้ g กับ
  ผลลัพธ์นั้น.
reviewed: false
