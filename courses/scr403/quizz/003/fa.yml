question: نوع جمعی (A + B) در Simplicity چیست؟
answer: "یک اتحاد برچسب‌دار: یک مقدار یا A با برچسب چپ است یا B با برچسب راست."
wrong_answers:
  - نوعی که هم‌زمان همه مقادیر A و B را در خود دارد.
  - یک جمع حسابیِ اندازه‌های بیتی دو نوع مؤلفه.
  - یک نوع تابع که هر ورودی از A را به یک خروجی در B نگاشت می‌کند.
explanation: >-
  نوع جمعی A + B یک اتحاد برچسب‌دار است. هر مقدار یک برچسب یک‌بیتی
  با خود دارد که نشان می‌دهد آیا یک گونه چپ (از نوع A) است یا یک گونه راست
  (از نوع B). حتی وقتی A و B یک نوع باشند، مقدارهای با برچسب چپ و
  با برچسب راست متمایز باقی می‌مانند.
reviewed: false
