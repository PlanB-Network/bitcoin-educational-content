question: During the Revolution, which of these authors did not sit in the Assembly?
answer: The Marquis de Mirabeau
wrong_answers:
  - Dupont de Nemours
  - Louis-Paul Abeille
  - Condorcet
explanation: |
  The Marquis de Mirabeau died on July 13, 1789, the day before the storming of the Bastille, and never sat in the Assembly. Dupont de Nemours, Abeille, and Condorcet all participated actively in the revolutionary assemblies.