question: "چرا تعاریف نیت‌محور از نظام‌های سیاسی برای اهداف تحلیلی مسئله‌ساز دانسته می‌شوند؟"
answer: "آن‌ها آشفتگی مفهومی ایجاد می‌کنند، زیرا همه نظام‌ها ادعا می‌کنند اهداف مشابهی مانند عدالت، انصاف و آزادی را دنبال می‌کنند"
wrong_answers:
  - "آن‌ها بیش از حد دقیق و سخت‌گیرند و جایی برای تحول طبیعی جنبش‌های سیاسی در گذر زمان باقی نمی‌گذارند"
  - "آن‌ها بیش از حد بر پیامدهای اقتصادی تمرکز می‌کنند و ابعاد فرهنگی و اجتماعی زندگی سیاسی را نادیده می‌گیرند"
  - "آن‌ها بر اسناد محرمانه دولتی تکیه دارند که به‌ندرت در دسترس پژوهشگران مستقل قرار می‌گیرد"
explanation: >-
  تعاریف نیت‌محور بر انگیزه‌ها و اهداف اعلام‌شده تکیه می‌کنند، اما هر نظام سیاسی ادعا می‌کند که عدالت، انصاف و آزادی را دنبال می‌کند. این باعث می‌شود نظام‌ها از یکدیگر قابل تمایز نباشند. در مقابل، تحلیل ساختاری نظام‌ها را بر اساس پیامدهای تجربی و قابل اندازه‌گیری و ابزارهایی که به‌کار می‌گیرند ارزیابی می‌کند و ماهیت واقعی آن‌ها را فراتر از بلاغت آشکار می‌سازد.
reviewed: false
