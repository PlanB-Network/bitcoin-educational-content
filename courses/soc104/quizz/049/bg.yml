question: "Какво отличава неоконсерваторите от палеоконсерваторите в подхода им към външната политика?"
answer: "Неоконсерваторите оправдават военния интервенционизъм, за да разпространяват демокрация, докато палеоконсерваторите защитават по-изолационистка външна политика"
wrong_answers:
  - "Неоконсерваторите се противопоставят на всякакви военни действия и предпочитат дипломация, докато палеоконсерваторите подкрепят превантивни удари срещу потенциални заплахи"
  - "Неоконсерваторите се фокусират изключително върху икономически санкции, докато палеоконсерваторите се застъпват за изграждане на международни коалиции за съвместни военни операции"
  - "Неоконсерваторите и палеоконсерваторите са съгласни по външната политика, но се различават рязко по вътрешната икономическа регулация"
explanation: >-
  От 2000-те години нататък неоконсерваторите се ангажират все повече с оправдаването на военния интервенционизъм за имплантиране на демокрация по света, особено след 11 септември 2001 г. В реакция традиционните консерватори приемат етикета 'палеоконсервативни', за да се разграничат. Палеоконсерваторите критикуват военния интервенционизъм, защитават по-изолационистка външна политика и поставят по-голям акцент върху националната и културната идентичност.
