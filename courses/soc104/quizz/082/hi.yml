question: "स्वतंत्रता और राजनीतिक शक्ति के संबंध में Molinari की 1849 की भविष्यवाणी भविष्यसूचक क्यों साबित हुई?"
answer: "क्योंकि रूढ़िवादी और समाजवादी सत्ता में बारी-बारी से आए और अपने-अपने राजनीतिक लक्ष्यों की सेवा में स्वतंत्रता को साधन के रूप में इस्तेमाल किया, ठीक जैसा उन्होंने वर्णित किया था"
wrong_answers:
  - "क्योंकि उन्होंने जिस अर्थशास्त्री पात्र का वर्णन किया था, उसने अंततः राजनीतिक शक्ति प्राप्त की और पूरे यूरोप में लिबर्टेरियन नीतियाँ लागू कीं"
  - "क्योंकि उनकी यह भविष्यवाणी कि तीनों राजनीतिक परिवार एक ही केंद्रवादी आंदोलन में विलय हो जाएंगे, बीसवीं सदी में सच साबित हुई"
  - "क्योंकि स्वतंत्रता को क्रमिक सरकारों द्वारा धीरे-धीरे विस्तारित किया गया जब तक कि वह आधुनिक लोकतंत्रों का मुख्य संगठनात्मक सिद्धांत नहीं बन गई"
explanation: >-
  Molinari की दृष्टि भविष्यसूचक साबित हुई क्योंकि उन्नीसवीं सदी के मध्य से, रूढ़िवादी और समाजवादी सत्ता में बारी-बारी से आए हैं और ठीक वही किया है जो उन्होंने वर्णित किया था: राजनीतिक लक्ष्यों की सेवा में स्वतंत्रता को साधन के रूप में इस्तेमाल करना। दोनों परिवार स्वतंत्रताओं को सीमित करने और अपने-अपने एजेंडा थोपने के लिए राज्य को बुलाने के लिए तैयार रहते हैं, जबकि बिना शर्त स्वतंत्रता की अर्थशास्त्री की स्थिति हाशिए पर रही।
reviewed: false
