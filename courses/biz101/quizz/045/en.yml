question: How does the Austrian School define the concept of "time preference"?  
answer: The preference for consuming now rather than later  
wrong_answers:  
  - The desire to reduce short-term costs  
  - The optimization of immediate investments  
  - The ability to balance supply and demand  
explanation: |
  Time preference refers to the natural human tendency to prefer immediate consumption over deferred benefits. In Austrian economics, individuals with a low time preference are more willing to save and invest for the future, which is essential for capital accumulation. This concept helps explain why some businesses choose to hold assets like Bitcoin as a long-term store of value rather than spending all resources immediately.
reviewed: true  
