question: "Liberteryen özgürlük anlayışı merkezci anlayıştan nasıl farklıdır?"
answer: "Liberteryenler özgürlüğü koşulsuz bir aksiyom olarak ele alırken, merkezciler özgürlükleri bağlama ve verimliliğe bağlı olarak fırsatçı biçimde savunur"
wrong_answers:
  - "Liberteryenler devletin özgürlüğü seçici biçimde korumasına izin verirken, merkezciler bireysel hakları korumada her türlü devlet katılımını reddeder"
  - "Liberteryenler özgürlüğü yalnızca ekonomik meselelerle sınırlandırırken, merkezciler özgürlüğü toplumsal ve kültürel alanların tamamına geniş biçimde uygular"
  - "Liberteryenler ve merkezciler aynı özgürlük görüşünü paylaşır, fakat onu uygulamak için gereken hükümetin büyüklüğü konusunda anlaşmazlığa düşer"
explanation: >-
  Liberteryenler özgürlüğü, aksiyom işlevi gören genel ve koşulsuz bir ilke olarak tanımlar. Buna karşılık merkezciler, herhangi bir genel ilke uygulamadan belirli özgürlükleri fırsatçı ve bağlamsal biçimde savunur. Merkezci yaklaşım, özgürlüğün her zaman verimlilik gibi pragmatik hedeflere tabi kılındığı araçsal bir özgürlük anlayışını açığa çıkarır; liberteryenler bunu temelden reddeder.
