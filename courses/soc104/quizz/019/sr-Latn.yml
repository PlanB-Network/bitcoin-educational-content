question: "Šta pojam 'liberal' znači u evropskoj političkoj tradiciji?"
answer: "Pristalica laissez-faire ekonomije, smanjenog državnog mešanja i individualnih sloboda"
wrong_answers:
  - "Zagovornik državne intervencije, javnog zdravstvenog osiguranja i programa protiv siromaštva"
  - "Radikalni anarhista koji traži potpuno ukidanje vlade i privatne svojine"
  - "Centrista koji jednako uravnotežuje socijalističke i konzervativne pozicije u svim oblastima politike"
explanation: >-
  U Evropi je liberalizam ostao povezan sa laissez-faire ekonomskim politikama, smanjenim državnim mešanjem i odbranom individualnih sloboda. Prvi pogrešan odgovor opisuje američke liberale, koji su značenje tog pojma pomerili ka intervencionizmu. Evropski liberalizam nije ni anarhizam ni centrizam.
reviewed: false
