question: "În cele cinci dezbateri societale (căsătorie, imigrație, arme de foc, droguri, băuturi zaharoase), ce cadru analitic recurent modelează poziția socialistă asupra fiecărei chestiuni?"
answer: "Un cadru conflictual între dominanți și dominați, în care societatea este structurată de opresiune, iar statul trebuie să intervină pentru a proteja grupul vulnerabil"
wrong_answers:
  - "Un cadru utilitarist axat pe maximizarea fericirii generale și a productivității economice pentru cel mai mare număr de cetățeni"
  - "Un cadru al drepturilor naturale în care libertățile individuale trebuie protejate atât de interferența statului, cât și de cea a corporațiilor"
  - "Un cadru tradiționalist în care instituțiile sociale consacrate trebuie păstrate împotriva schimbărilor moderne perturbatoare"
explanation: >-
  Poziția socialistă în dezbaterile societale este modelată constant de un cadru conflictual dominant/dominat. În privința căsătoriei, este majoritatea heterosexuală care opresează o minoritate homosexuală. În privința imigrației, restricțiile bazate pe naționalitate sunt forme de opresiune. În privința armelor de foc, numai statul ar trebui să dețină forța pentru a-i proteja pe cei vulnerabili. În privința băuturilor zaharoase, industriașii profită de vulnerabilitatea celor mai puțin protejați. Această lentilă opresor/opresat se reproduce în numeroase domenii, inclusiv genul, rasa și chiar relația dintre umanitate și natură.
reviewed: false
