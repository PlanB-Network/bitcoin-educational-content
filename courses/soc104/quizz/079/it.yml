question: "Qual è il disaccordo chiave tra libertari e altre famiglie politiche quando condividono gli stessi obiettivi?"
answer: "Il disaccordo riguarda i mezzi: i libertari rifiutano le soluzioni coercitive e favoriscono lo scambio volontario attraverso il processo di mercato"
wrong_answers:
  - "Il disaccordo riguarda i fini: i libertari perseguono obiettivi diversi, come la ricchezza individuale invece del benessere sociale"
  - "Il disaccordo riguarda i tempi: i libertari vogliono raggiungere gli stessi obiettivi più lentamente attraverso una riforma graduale"
  - "Il disaccordo riguarda la portata: i libertari vogliono applicare le stesse politiche solo a livello locale invece che nazionale"
explanation: >-
  I libertari possono concordare con socialisti, conservatori e centristi su certi obiettivi, come difendere gli oppressi o promuovere la coesione sociale. Il disaccordo non sta nei fini ma nei mezzi. I libertari rifiutano tutte le soluzioni coercitive che cercano di uniformare pratiche e regolamenti, difendendo invece il potere della scelta e la libertà responsabile attraverso lo scambio libero e decentralizzato fondato su contratti volontari.
