question: "Bitcoin کدام سه ستون دولت رفاه را به چالش می‌کشد؟"
answer: "نظام مالیاتی، انحصار پولی برای تأمین مالی هزینه‌ها از طریق بدهی، و نظارت بر تراکنش‌ها برای جلوگیری از استفاده از ارزهای جایگزین"
wrong_answers:
  - "بودجه نظامی، نظام آموزش عمومی، و زیرساخت سلامت تحت کنترل دولت"
  - "نظام قضایی، فرایند قانون‌گذاری، و اجرای مقررات کسب‌وکارها توسط قوه مجریه"
  - "نظام تأمین اجتماعی، قانون حداقل دستمزد، و ساختار مالیات بر درآمد تصاعدی"
explanation: >-
  Bitcoin سه ستونی را که دولت رفاه بر آن‌ها تکیه دارد به چالش می‌کشد. نخست، نظام مالیاتی که برای پوشش مخارج کافی نیست. دوم، انحصار پولی، یعنی ظرفیت انتشار پول برای تأمین مالی هزینه‌ها از طریق بدهی. سوم، نظارت بر تراکنش‌ها، یعنی توانایی جلوگیری از استفاده مردم از هر ارزی جز Fiat تحمیل‌شده از سوی دولت. Bitcoin هر سه را هم‌زمان تضعیف می‌کند.
reviewed: false
