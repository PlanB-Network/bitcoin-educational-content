question: "Was will die Linke gesetzlich regeln und regulieren?"
answer: "Die Wirtschaft, angetrieben von Feindseligkeit gegenüber wirtschaftlicher Freiheit, Kapitalismus und dem freien Markt"
wrong_answers:
  - "Persönliche Moral und religiöse Praktiken, angetrieben von dem Wunsch, traditionelle Institutionen zu bewahren"
  - "Einwanderung und nationale Grenzen, angetrieben von Sorgen um kulturelle Identität und Souveränität"
  - "Technologie und Innovation, angetrieben von Ängsten, dass Automatisierung menschliche Arbeitskräfte ersetzt"
explanation: >-
  Die Linke gibt sozialer Gerechtigkeit und Gleichheit Vorrang, insbesondere auf wirtschaftlicher Ebene. Dies führt zu ihrer Feindseligkeit gegenüber wirtschaftlicher Freiheit, Kapitalismus und dem freien Markt sowie zu ihrem Wunsch, die Wirtschaft gesetzlich zu regeln und zu regulieren. Die Rechte will dagegen Moral und Religion gesetzlich regeln. Einwanderung und Technologieregulierung sind nicht der hier beschriebene primäre Fokus.
reviewed: false
