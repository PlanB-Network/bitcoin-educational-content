question: "Ce este constructivismul ca convingere politică împărtășită?"
answer: "Credința că un guvern central poate crea, prin forța legii, o ordine socială bună pentru cel mai mare număr de oameni"
wrong_answers:
  - "Credința că societatea ar trebui organizată prin cooperare voluntară între indivizi, fără interferența statului"
  - "Credința că doar piețele libere pot determina distribuția optimă a resurselor în societate"
  - "Credința că autoritatea politică ar trebui distribuită în mod egal între toți cetățenii prin democrație directă"
explanation: >-
  Constructivismul îi unește pe centriști, conservatori și socialiști în jurul unei convingeri comune: superioritatea procesului politic față de procesul de piață. Este credința că un guvern central poate crea, prin forța legii, o ordine socială bună pentru cel mai mare număr de oameni. Aceasta se află în opoziție directă cu apărarea libertariană a ordinii spontane care apare din interacțiuni voluntare.
