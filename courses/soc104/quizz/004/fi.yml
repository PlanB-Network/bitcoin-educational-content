question: "Mikä ohjaava periaate ohjasi Frederic Bastiat'n äänestyskäyttäytymistä kansalliskokouksessa?"
answer: "Yksilöllisten ja taloudellisten vapauksien edistäminen sekä valtion puuttumisen vähentäminen"
wrong_answers:
  - "Kuninkaallisen vallan puolustaminen ja monarkkisten perinteiden säilyttäminen"
  - "Sosialististen politiikkojen edistäminen varallisuuden jakamiseksi tasaisemmin uudelleen"
  - "Keskustalainen kompromissistrategia vasemmiston ja oikeiston ryhmittymien välillä"
explanation: >-
  Bastiat äänesti perustavanlaatuisen periaatteen pohjalta: yksilöllisten ja taloudellisten vapauksien edistämisen sekä valtion puuttumisen vähentämisen. Hän ei ollut keskustalainen opportunisti eikä rojalisti tai sosialisti. Hän äänesti sen puolen kanssa, joka ehdotti vapauden ja rajoitetun valtion kanssa linjassa olevia toimia.
