question: Ce motiv dă Dupont de Nemours pentru amânarea creării asignatelor?
answer: Asignatele vor face prețurile să crească
wrong_answers:
  - Asignatele vor fi folosite pentru a purta războaie ofensive
  - Asignatele vor ruina capitalul străin
  - Asignatele încalcă dreptul de proprietate
explanation: |
  Dupont de Nemours se temea de inflația provocată de asignate, o monedă de hârtie emisă de Adunarea Națională. El credea că această inflație va ruina economia franceză.
