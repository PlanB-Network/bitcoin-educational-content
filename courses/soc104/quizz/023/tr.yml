question: "Cato Institute, Mises Institute ve Libertarian Party'nin liberteryen hareket içindeki rolleri nasıl farklılaşır?"
answer: "Cato Institute kamu politikası önerilerine, Mises Institute eğitim ve akademik yayıncılığa, Libertarian Party ise seçim siyasetine odaklanır"
wrong_answers:
  - "Cato Institute siyasi kampanyaları finanse eder, Mises Institute doğrudan Kongre'ye lobi yapar ve Libertarian Party akademik konferanslar düzenler"
  - "Cato Institute ekonomi ders kitapları yayımlar, Mises Institute seçmen kayıt kampanyaları yürütür ve Libertarian Party yasa tasarıları hazırlar"
  - "Cato Institute taban protestoları düzenler, Mises Institute liberteryenlere hukuki savunma sağlar ve Libertarian Party düşünce kuruluşu araştırmalarını yönetir"
explanation: >-
  Cato Institute (1977'de kuruldu), Washington merkezli, kamu politikası önerileri üzerinde çalışan bir düşünce kuruluşudur. Mises Institute (1982'de kuruldu), siyasi lobi faaliyetlerinden ziyade eğitime odaklanır; konferansları ve yeniden yayımlanan eserleriyle bir tür çevrimiçi üniversite gibi işlev görür. Libertarian Party (1971'de kuruldu), seçimlere katılan üçüncü en büyük Amerikan siyasi partisidir; yaklaşık %2'lik oy payı bile sonuçları değiştirebilir.
