question: "Ni irihe tandukaniro nyamukuru hagati ya minarchists na anarcho-capitalists muri libertarianism?"
answer: "Minarchists baremera Leta ntoyi yo kurwanira igihugu, ubutungane, n'igipolisi, mu gihe anarcho-capitalists bashaka ko ibikorwa vyose vya Leta biba ivy'abikorera"
wrong_answers:
  - "Minarchists baranka ubwoko bwose bwa Leta, mu gihe anarcho-capitalists bemera amategeko make ya Leta ku masoko"
  - "Minarchists bashigikira amakori yiyongera uko umuntu aronka menshi ku bikorwa vya nkenerwa, mu gihe anarcho-capitalists barwanya amakori yose"
  - "Minarchists bitwararika umwidegemvyo w'ubutunzi gusa, mu gihe anarcho-capitalists barwanira umwidegemvyo w'ubutunzi n'uw'imibano"
explanation: >-
  Minarchists bemera ko Leta ikwiye kugarukira ku bikorwa nyamukuru nk'ukurwanira igihugu, ubutungane, n'igipolisi ("night-watchman state"), mu gihe anarcho-capitalists bavuga ko n'ivyo bikorwa bikwiye kugirwa ivy'abikorera kandi bikacungwa biciye mu guhiganwa kw'isoko ku bushake. Ivyo batumvikanako bijanye cane n'ukuntu vyoshirwa mu ngiro kurusha ingingo z'ishingiro z'inyifato runtu. Iyo mirwi yompi isangiye indangagaciro za libertarian z'ukwiyegukira kw'umuntu ku giti ciwe no kudatera abandi.
reviewed: false
