question: "Qual é a distinção central entre ser pró-empresas e ser pró-mercado?"
answer: "Defensores pró-empresas buscam intervenção estatal para proteger empresas específicas do fracasso, enquanto defensores pró-mercado apoiam a desregulamentação e permitem que empresas fracassem para que o mercado possa se reorganizar naturalmente"
wrong_answers:
  - "Defensores pró-empresas se concentram em grandes corporações, enquanto defensores pró-mercado se concentram exclusivamente em apoiar pequenas empresas e startups"
  - "Pró-empresas é uma posição de esquerda que favorece cooperativas de trabalhadores, enquanto pró-mercado é uma posição de direita que favorece a propriedade privada"
  - "Defensores pró-empresas rejeitam toda concorrência, enquanto defensores pró-mercado apoiam a concorrência regulada pelo governo entre empresas aprovadas"
explanation: >-
  A posição pró-empresas vê a concorrência como um instrumento de governança obtido por meio de regulamentações e justifica subsídios e resgates para evitar perdas de empregos. Na visão pró-empresas, o mercado é frágil e precisa de resgate estatal. Defensores pró-mercado veem a concorrência como o resultado natural da livre iniciativa, implicando desregulamentação e permitindo que empresas fracassem, porque o fracasso permite que o mercado se reorganize naturalmente e abre espaço para atores mais capazes.
reviewed: false
