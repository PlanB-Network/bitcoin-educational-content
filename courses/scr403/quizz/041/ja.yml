question: 完全性証明は、入力を分解するために case を入れ子にし、各出力に scribe を使うことで任意の関数を構築します。なぜそれは理論上の道具にすぎないのでしょうか？
answer: 得られる式は巨大なルックアップテーブルであり、そのサイズは指数関数的に増大します。256 ビット入力では約 2²⁵⁶ 個のエントリが必要になります。
wrong_answers:
  - scribe はマクロであり、コアコンビネータではないため、その式は形式検証済みの言語の外に出る。
  - Bit Machine はそれを指数時間で評価する。ただし式自体は共有によってコンパクトなままである。
  - 入れ子になった case は和型しか分解できないため、この構成は任意の積型入力で失敗する。
explanation: >-
  この構成は、入れ子になった case 分解によって可能なすべての入力を列挙し、
  各出力を scribe でハードコードするため、式のサイズは指数関数的に爆発します。
  256 ビット語のような現実的な型では天文学的な大きさになります。爆発するのは式の
  サイズであり、コンパクトな式の実行時間ではありません。scribe は本物のコアコンビネータ
  （unit、injl、injr、pair）へ展開されるため、結果はコア言語の内部にとどまります。
  その完全性定理は Rocq で形式検証されています。また、この分解は積を含む任意の型の入力を
  扱えます。
reviewed: false
