question: "Co łączy libertarian i konserwatystów, a co ich dzieli?"
answer: "Łączy ich przywiązanie do ograniczonego rządu i odrzucenie przymusowego egalitaryzmu, ale różnią się w kwestii interwencjonizmu wojskowego i polityk społecznych"
wrong_answers:
  - "Łączy ich poparcie dla protekcjonistycznej polityki handlowej i obrony narodowej, ale różnią się co do roli religii w życiu publicznym"
  - "Łączy ich zobowiązanie do progresywnego opodatkowania i programów socjalnych, ale różnią się w kwestii polityki imigracyjnej"
  - "Łączy ich sprzeciw wobec wolnego handlu i legalizacji narkotyków, ale różnią się co do wielkości rządu federalnego"
explanation: >-
  Libertarianie i konserwatyści opowiadają się za ograniczonym rządem, odrzucają przymusowy egalitaryzm, sprzeciwiają się długowi publicznemu i bronią praw stanów. Libertarianie odrzucają jednak interwencjonizm wojskowy neokonserwatystów, sprzeciwiają się konserwatywnym politykom społecznym i subsydiom, potępiają prohibicję narkotykową oraz odrzucają protekcjonizm. Sojusz jest realny, ale z natury napięty.
reviewed: false
