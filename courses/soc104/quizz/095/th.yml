question: "หลักการ cypherpunk ที่ว่า 'Cypherpunks write code' เผยอะไรเกี่ยวกับแนวทางของขบวนการในการบรรลุเสรีภาพ?"
answer: "ว่าเส้นทางสู่เสรีภาพผ่านการสร้างระบบนิรนามอย่างแข็งขัน โดยใช้ code เป็นเครื่องมือพื้นฐานในการเปลี่ยนแนวคิดนามธรรมของเสรีภาพให้เป็นความจริง"
wrong_answers:
  - "ว่า cypherpunks เป็นนักพัฒนาซอฟต์แวร์เป็นหลักซึ่งเขียนแอปพลิเคชันเชิงพาณิชย์เพื่อหาเงินสนับสนุนแคมเปญเคลื่อนไหวทางการเมือง"
  - "ว่าขบวนการนี้เชื่อในการให้ความรู้แก่สาธารณะผ่าน manifesto และสิ่งพิมพ์วิชาการ แทนการลงมือทำโดยตรง"
  - "ว่า cypherpunks มุ่ง hacking ระบบรัฐบาลที่มีอยู่เพื่อเปิดโปงโครงการเฝ้าระวังและบังคับให้เกิดการปฏิรูปกฎหมาย"
explanation: >-
  สูตร "Cypherpunks write code" สะท้อนพันธะของขบวนการต่อการแทรกแซงอย่างแข็งขัน ไม่ใช่เพียงความหวัง สำหรับ Eric Hughes เส้นทางสู่เสรีภาพผ่านการสร้างระบบนิรนามอย่างแข็งขันซึ่งทำให้การแบ่งแยกทางการเมืองตามอำเภอใจไม่เกี่ยวข้อง Code กลายเป็นเครื่องมือพื้นฐานในการเปลี่ยนแนวคิดนามธรรมของเสรีภาพให้เป็นความจริง นี่คือเหตุผลที่ Satoshi Nakamoto เขียน code Bitcoin ทั้งหมดก่อนแม้แต่จะเขียน white paper
reviewed: false
