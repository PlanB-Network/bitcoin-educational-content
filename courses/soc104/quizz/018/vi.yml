question: "Định nghĩa của chủ nghĩa nhà nước trong khung Nolan là gì?"
answer: "Sử dụng pháp luật để kiểm soát và định hình xã hội, dù nhân danh bảo vệ văn minh, giai cấp công nhân, thiên nhiên hay người bị áp bức"
wrong_answers:
  - "Một hệ thống chính quyền trong đó các quan chức dân cử phục vụ theo nhiệm kỳ cố định và quyền lực được chuyển giao thông qua bầu cử dân chủ"
  - "Niềm tin rằng chỉ một quân đội mạnh mới có thể bảo vệ chủ quyền và toàn vẹn lãnh thổ của một quốc gia"
  - "Một triết lý kinh tế ưu tiên các ngành công nghiệp quốc gia hơn cạnh tranh nước ngoài thông qua thuế quan và hạn ngạch"
explanation: >-
  Chủ nghĩa nhà nước được định nghĩa là việc sử dụng pháp luật để kiểm soát và định hình xã hội. Cả cánh tả lẫn cánh hữu đều thực hành nó: một số nhân danh bảo vệ văn minh, số khác nhân danh bảo vệ giai cấp công nhân, thiên nhiên hoặc người bị áp bức. Ngay cả những người trung dung cũng tán thành nó khi điều đó phù hợp với họ. Chủ nghĩa nhà nước không chỉ giới hạn ở chính sách quân sự, chủ nghĩa bảo hộ thương mại hay đơn giản là có chính phủ dân cử.
