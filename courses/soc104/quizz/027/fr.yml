question: "Pourquoi les libéraux classiques aux États-Unis ont-ils commencé à se qualifier de 'libertarians' à partir des années 1960 ?"
answer: "Pour se distinguer des liberals américains, dont le sens avait évolué vers l'interventionnisme étatique"
wrong_answers:
  - "Pour s'aligner sur le Parti démocrate et ses programmes sociaux progressistes"
  - "Pour signaler leur soutien aux réformes de la Great Society de Lyndon B. Johnson"
  - "Pour adopter une identité révolutionnaire plus radicale inspirée des mouvements socialistes européens"
explanation: >-
  Aux États-Unis, le mot 'liberal' a évolué pour désigner les partisans du Big Government et de l'intervention de l'État, en particulier après le New Deal et la Great Society. Les libéraux classiques ont adopté l'étiquette 'libertarian' afin de préserver le sens originel de leur philosophie. Ils prenaient leurs distances avec les liberals américains, ils ne s'alignaient pas sur eux.
reviewed: false
