question: "Что либертарианцы считают о способности людей принимать решения?"
answer: "У людей есть и право, и ответственность принимать собственные решения о своей жизни"
wrong_answers:
  - "Люди должны принимать решения только после консультации с избранными представителями, понимающими последствия политики"
  - "Люди, как правило, неспособны принимать хорошие решения и нуждаются в экспертном руководстве государственных институтов"
  - "Люди должны свободно принимать экономические решения, но уступать государству во всех социальных и культурных вопросах"
explanation: >-
  С либертарианской точки зрения, у людей есть и право, и ответственность принимать собственные решения. Это контрастирует с обычными политическими семьями от левых до правых, которые считают, что государство должно принимать некоторые или многие важные решения в жизни человека и в экономической жизни в целом.
reviewed: false
