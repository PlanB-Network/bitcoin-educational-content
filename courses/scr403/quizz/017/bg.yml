question: Какво представлява SimplicityHL и защо е нужен?
answer: Език от по-високо ниво, компилиращ се към Simplicity, който управлява именуването и обхвата.
wrong_answers:
  - Език за хардуерно описание за добивните ASIC-и, които изпълняват Simplicity.
  - Графична drag-and-drop IDE за свързване на комбинатори на Simplicity.
  - Тестова рамка за изпълнение на програми на Simplicity в безопасен sandbox.
explanation: >-
  Суровият Simplicity става неразбираем при производствени нива на сложност, защото
  всеки достъп до данни трябва да се прави чрез вложени комбинатори take/drop. SimplicityHL
  предоставя познати програмни конструкции — именувани променливи, обхват, импорти на библиотеки
  и поток на управление — които се компилират до комбинаторни изрази
  на Simplicity. Крайните потребители пишат на SimplicityHL, докато Simplicity служи като
  формално верифицираната цел за компилация.
reviewed: false
