question: Mục đích của khóa học Bitcoin này là gì?
answer: Giới thiệu một số tính chất tiền tệ chung, cách sử dụng và tương lai của Bitcoin.
wrong_answers:
  - Giới thiệu cách đào Bitcoin.
  - Giới thiệu cách quản lý Bitcoin.
  - Giới thiệu cách tạo một giao thức Bitcoin mới.
explanation: |
  Mục đích của khóa học Bitcoin này là thảo luận về
  các tính chất tiền tệ chung của Bitcoin, bao gồm cách
  mua và bán bitcoin, lưu trữ bitcoin an toàn trong ví điện tử,
  và sử dụng bitcoin cho các giao dịch. Đồng thời nhằm mục đích
  khám phá tương lai của Bitcoin.
reviewed: true