question: "පොදු political conviction එකක් ලෙස constructivism යනු කුමක්ද?"
answer: "central government එකකට, law හි බලය හරහා, වැඩිම පිරිසට යහපත් social order එකක් නිර්මාණය කළ හැකි බවට ඇති විශ්වාසය"
wrong_answers:
  - "state interference නොමැතිව පුද්ගලයන් අතර ස්වේච්ඡා cooperation හරහා සමාජය සංවිධානය විය යුතු බවට ඇති විශ්වාසය"
  - "සමාජයේ resources හි optimal distribution තීරණය කළ හැක්කේ free markets වලට පමණක් බවට ඇති විශ්වාසය"
  - "direct democracy හරහා political authority සියලු පුරවැසියන් අතර සමානව බෙදාහැරිය යුතු බවට ඇති විශ්වාසය"
explanation: >-
  Constructivism centrists, conservatives, සහ socialists එකතු කරන්නේ පොදු conviction එකක් වටාය: market process ට වඩා political process හි ප්‍රමුඛත්වය. එය central government එකකට law හි බලය හරහා වැඩිම පිරිසට යහපත් social order එකක් නිර්මාණය කළ හැකි බවට ඇති විශ්වාසයයි. මෙය ස්වේච්ඡා interactions වෙතින් මතුවන spontaneous order පිළිබඳ libertarian ආරක්ෂාවට සෘජු විරුද්ධතාවයක සිටී.
reviewed: false
