question: "مفهوم «مخاطره اخلاقی» در زمینه مناظره یارانه‌ها چیست، و کدام خانواده سیاسی این نگرانی را مطرح می‌کند؟"
answer: "مخاطره اخلاقی انگیزه‌ای به سوی بی‌مسئولیتی است، زمانی که شرکت‌ها از طریق یارانه‌ها از شکست بازداشته می‌شوند، زیرا در نهایت مالیات‌دهنده هزینه را می‌پردازد؛ این نگرانی را لیبرتارین‌ها مطرح می‌کنند"
wrong_answers:
  - "مخاطره اخلاقی خطر آن است که شرکت‌های یارانه‌گیر به کشورهایی با مالیات پایین‌تر منتقل شوند و شغل‌ها را با خود ببرند؛ این نگرانی را محافظه‌کاران مطرح می‌کنند"
  - "مخاطره اخلاقی خطر آن است که مقام‌های دولتی با انتخاب اینکه کدام شرکت‌ها یارانه دریافت کنند فاسد شوند؛ این نگرانی را میانه‌روها مطرح می‌کنند"
  - "مخاطره اخلاقی مسئله اخلاقیِ بهره‌کشی شرکت‌ها از کارگران پس از دریافت وجوه عمومی است؛ این نگرانی را سوسیالیست‌ها مطرح می‌کنند"
explanation: >-
  لیبرتارین‌ها استدلال می‌کنند که یارانه‌ها و نجات‌های مالی مخاطره اخلاقی ایجاد می‌کنند: وقتی شرکت‌ها از شکست بازداشته می‌شوند، این امر بی‌مسئولیتی و بی‌پروایی را تشویق می‌کند، زیرا تصمیم‌های بد پیامدی ندارند. در پایان، این مالیات‌دهنده است که هزینه را می‌پردازد، چیزی که لیبرتارین‌ها آن را عمیقاً ناعادلانه می‌دانند. این مفهوم از نگرانی‌هایی مانند انتقال شرکت‌ها، فساد مقام‌ها یا بهره‌کشی از کارگران که خانواده‌های سیاسی دیگر مطرح می‌کنند متمایز است.
reviewed: false
