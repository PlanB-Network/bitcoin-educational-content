question: "Jibu la George W. Bush kwa mgogoro wa kifedha wa 2008 linaonyeshaje 'unyumbufu wenye matatizo' wa kanuni za kihafidhina?"
answer: "Aliacha kanuni za soko huria ili kuzinusuru benki kubwa, akifichua mtazamo wa kihafidhina wa dola kama mdhamini wa mwisho wa uthabiti wa uchumi wa taifa"
wrong_answers:
  - "Alikataa uingiliaji wote wa serikali na kuziacha benki zishindwe, akishikamana kabisa na itikadi ya soko huria bila kujali matokeo"
  - "Alitaifisha sekta ya benki kwa kudumu na kuanzisha ushuru endelevu, akihama kutoka uhafidhina kwenda ujamaa wa kidemokrasia"
  - "Alijibu kwa kupunguza matumizi yote ya serikali na kuondoa kanuni za kifedha ili kuliacha soko lijisahihishe lenyewe"
explanation: >-
  Bush alitangaza kwamba alikuwa 'ameacha kanuni za soko huria ili kuokoa mfumo wa soko huria' kwa kuingilia kati ili kuzinusuru benki kubwa. Hili linaonyesha jinsi wahafidhina wanavyoweza kutanguliza nguvu na mwendelezo wa taifa juu ya kanuni dhahania za soko. Mantiki hiyo hiyo nyumbufu inaonekana katika sera za kibiashara za Trump za ulinzi wa viwanda vya ndani, zilizotekelezwa kwa jina la maslahi ya taifa huku kukiwa na hatari ya kuchochea ukorporati na ubepari wa upendeleo.
