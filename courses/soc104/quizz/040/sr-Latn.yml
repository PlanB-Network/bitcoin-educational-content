question: "Kako socijalizam različito tretira slobode u društvenoj i ekonomskoj sferi?"
answer: "Socijalizam favorizuje snažne slobode u društvenoj sferi, ali slabe slobode u ekonomskoj sferi"
wrong_answers:
  - "Socijalizam jednako ograničava sve slobode u društvenoj i ekonomskoj sferi"
  - "Socijalizam favorizuje snažne ekonomske slobode, ali ograničava društvene slobode radi održavanja društvenog poretka"
  - "Socijalizam daje neograničene slobode u obe sfere i oslanja se na dobrovoljnu saradnju za održavanje ravnoteže"
explanation: >-
  U socijalističkoj misli postoji fundamentalna dihotomija između društvenih i ekonomskih sloboda. Društvene slobode su snažne, ali ekonomske slobode su slabe zbog naglaska na državnoj kontroli, planiranju i preraspodeli bogatstva. Treći pogrešan odgovor opisuje libertarijanski ideal, dok drugi opisuje konzervativni obrazac, koji je ogledalska slika socijalizma.
reviewed: false
