question: "Por que os libertários se opõem à tributação?"
answer: "Porque ela é uma violação moral dos direitos de propriedade, uma forma de roubo estatal que toma a propriedade de outra pessoa sem consentimento"
wrong_answers:
  - "Porque os impostos são economicamente ineficientes e sempre levam a taxas de desemprego mais altas"
  - "Porque a tributação desencoraja o investimento estrangeiro e enfraquece a posição competitiva de um país"
  - "Porque sistemas tributários progressivos miram injustamente indivíduos ricos, que criam a maior parte dos empregos"
explanation: >-
  A objeção libertária à tributação é moral antes de ser econômica. Libertários veem a tributação como uma forma de roubo estatal e um impedimento à propriedade privada porque ela consiste em tomar a propriedade de outra pessoa sem consentimento. Embora possa haver argumentos econômicos contra a tributação, o argumento libertário fundamental repousa no princípio de que ela viola direitos de propriedade, não em cálculos de eficiência ou competitividade.
