question: "К чему девиз Канта 'Sapere aude' призывает людей?"
answer: "Осмелиться мыслить самостоятельно и выйти из состояния несовершеннолетия, в котором они зависят от руководства высшей власти"
wrong_answers:
  - "Стремиться к академическим знаниям, поступая в формальные образовательные учреждения и получая дипломы"
  - "Бросать вызов всем формам морали и создавать совершенно новые этические системы, основанные на личном желании"
  - "Искать мудрость через религиозное благочестие и подчинение учению церкви"
explanation: >-
  Sapere aude, означающее "Осмелься мыслить самостоятельно", было взято Кантом у поэта Горация и стало девизом Просвещения. Оно символизирует выход из несовершеннолетия — состояния, в котором люди неспособны пользоваться своим разумом без руководства высшего класса или власти. Кант призывает к эмансипации и полной ответственности за собственное мышление.
reviewed: false
