question: "為什麼自由至上主義者對毒品合法化的立場，附帶要求國家在社會中的角色必須被降低？"
answer: "因為由國家接管的自由化會以政府管理的照護取代個人責任，而自由至上主義者希望公民承擔自身選擇的後果，並由私人協會提供支持"
wrong_answers:
  - "因為國家控制的合法化會產生過多稅收收入，使政府過度強大且腐敗"
  - "因為國家會強加品質標準，推高價格並重新製造黑市"
  - "因為政府對毒品的管制會違反國際貿易協定與外交關係"
explanation: >-
  自由至上主義者支持毒品自由化，但堅持國家的角色必須被降低，因為他們的目標是恢復個人責任，而不是擴大國家管理。如果某人產生依賴，他必須承擔責任，而不是要求國家提供照護。成癮問題的解決方案在於私人主動性：來自個人、家庭與慈善協會的自願支持。由國家管理的合法化，將與個人責任這項自由至上主義根本原則相矛盾。
reviewed: false
