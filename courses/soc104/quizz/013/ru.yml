question: "Что включает категория личной свободы?"
answer: "То, что вы делаете в личных отношениях, со своими мнениями, убеждениями и всем, что касается вашего собственного тела и разума"
wrong_answers:
  - "То, что вы делаете как производитель, включая открытие бизнеса, наем сотрудников и торговлю товарами"
  - "Сколько налогов вы платите, какие инвестиции делаете и как управляете своими финансовыми активами"
  - "Вашу способность конкурировать на рынке, устанавливать цены на свои продукты и выбирать поставщиков"
explanation: >-
  Личная свобода охватывает то, что вы делаете в личных отношениях, со своими мнениями и убеждениями, а также все, что касается вашего собственного тела и разума. Это включает брак, выбор чтения, религиозные практики, выбор пищи и лекарств, а также то, с кем вы общаетесь. Деловая деятельность, налоги и рыночные решения относятся к экономической свободе.
