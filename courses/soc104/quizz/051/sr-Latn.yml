question: "Šta libertarijanci stavljaju u središte svoje političke filozofije?"
answer: "Etiku i pravo"
wrong_answers:
  - "Ekonomski rast i stvaranje bogatstva"
  - "Društvenu jednakost i kolektivno blagostanje"
  - "Nacionalni identitet i očuvanje kulture"
explanation: >-
  Libertarijanci se razlikuju od svih drugih političkih porodica po tome što u središte svoje filozofije stavljaju etiku i pravo, a ne ekonomiju. Kada brane tržišnu ekonomiju, to je manje zbog njene sposobnosti da proizvodi bogatstvo, a više zbog njenog podsticanja individualne slobode i odgovornosti. Ekonomski rast je sekundarna korist, a ne temeljni princip.
reviewed: false
