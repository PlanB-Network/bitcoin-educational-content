question: "ආර්ථික නිදහස කාණ්ඩයට ඇතුළත් වන්නේ කුමක්ද?"
answer: "ඔබ නිෂ්පාදකයෙකු සහ පාරිභෝගිකයෙකු ලෙස කරන දේ: මිලදී ගැනීම, විකිණීම, නිෂ්පාදනය කිරීම, වැඩ කිරීම, බඳවා ගැනීම, සහ ඔබේ මුදල් කළමනාකරණය කිරීම"
wrong_answers:
  - "ඔබේ ආගමික විශ්වාස, පුද්ගලික සබඳතා, සහ ප්‍රකාශනයේ නිදහස"
  - "ඔබේ ඡන්දය දීමේ, මැතිවරණවලට සහභාගී වීමේ, සහ දේශපාලන පක්ෂවලට එක්වීමේ අයිතිය"
  - "නිදහසේ ගමන් කිරීමේ, ඔබේ පදිංචිය තෝරාගැනීමේ, සහ ජාතික දේශසීමා හරහා යාමේ ඔබේ හැකියාව"
explanation: >-
  ආර්ථික නිදහස ඔබ නිෂ්පාදකයෙකු සහ පාරිභෝගිකයෙකු ලෙස කරන දේ ආවරණය කරයි: ඔබට මිලදී ගත, විකිණිය හැකි, හෝ නිෂ්පාදනය කළ හැකි දේ; ඔබ වැඩ කරන ස්ථානය; ඔබ බඳවා ගන්නා අය; සහ ඔබ ඔබේ මුදල් සමඟ කරන දේ. පුද්ගලික සබඳතා, ආගමික විශ්වාස, සහ චලනයේ නිදහස ආර්ථික කාණ්ඩයට නොව පුද්ගලික නිදහස කාණ්ඩයට අයත් වේ.
reviewed: false
