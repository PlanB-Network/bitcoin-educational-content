question: Cine l-a trimis pe Mercier de la Rivière în Rusia pentru a o ajuta pe Ecaterina a II-a să-și reformeze legile?
answer: Diderot
wrong_answers:
  - Voltaire
  - Turgot
  - Quesnay
explanation: |
  Diderot, care întreținea o corespondență cu Ecaterina a II-a, a încurajat-o pe aceasta să apeleze la Mercier de la Rivière pentru a ajuta la reformarea legislației ruse.
