question: "Co libertarianie stawiają w centrum swojej filozofii politycznej?"
answer: "Etykę i prawo"
wrong_answers:
  - "Wzrost gospodarczy i tworzenie bogactwa"
  - "Równość społeczną i dobrobyt zbiorowy"
  - "Tożsamość narodową i zachowanie kultury"
explanation: >-
  Libertarianie odróżniają się od wszystkich innych rodzin politycznych tym, że w centrum swojej filozofii stawiają etykę i prawo, a nie gospodarkę. Gdy bronią gospodarki rynkowej, czynią to mniej ze względu na jej zdolność do wytwarzania bogactwa, a bardziej ze względu na wspieranie wolności i odpowiedzialności jednostki. Wzrost gospodarczy jest korzyścią drugorzędną, a nie zasadą fundamentalną.
reviewed: false
