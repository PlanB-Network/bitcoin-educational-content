question: Bitcoin tuân theo nguyên tắc kinh tế nào?
answer: Nguyên tắc kinh tế học của Áo.
wrong_answers:
  - Nguyên tắc kinh tế học của Keynes.
  - Nguyên tắc kinh tế học của Marx.
  - Nguyên tắc kinh tế học Tân cổ điển.
explanation: |
  Bitcoin tuân theo nguyên tắc kinh tế học của Áo.
  Số lượng sẽ được giới hạn và không có một thực thể trung ương nào bảo vệ nó
  khỏi những rủi ro về lạm phát mà thường thấy trong
  các đồng tiền truyền thống.
reviewed: true