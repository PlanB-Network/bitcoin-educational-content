question: "Защо интенционалните дефиниции на политическите системи се смятат за проблематични за аналитични цели?"
answer: "Те създават концептуално объркване, защото всички системи твърдят, че преследват сходни цели като справедливост, равенство и свобода"
wrong_answers:
  - "Те са твърде прецизни и твърди, като не оставят място за естествената еволюция на политическите движения с времето"
  - "Те се фокусират прекалено силно върху икономическите резултати и пренебрегват културните и социалните измерения на политическия живот"
  - "Те разчитат на класифицирани правителствени документи, които рядко са достъпни за независими изследователи"
explanation: >-
  Интенционалните дефиниции разчитат на заявените мотивации и цели, но всяка политическа система твърди, че преследва справедливост, равенство и свобода. Това прави системите невъзможни за разграничаване една от друга. За разлика от това структурният анализ оценява системите според техните емпирични, измерими последици и средствата, които използват, разкривайки истинската им природа отвъд реториката.
