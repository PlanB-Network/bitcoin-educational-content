question: "Prečo libertariáni odmietajú zdanenie?"
answer: "Pretože je morálnym porušením vlastníckych práv, formou štátnej krádeže, ktorá sa zmocňuje cudzieho majetku bez súhlasu"
wrong_answers:
  - "Pretože dane sú ekonomicky neefektívne a vždy vedú k vyššej miere nezamestnanosti"
  - "Pretože zdanenie odrádza zahraničné investície a oslabuje konkurenčnú pozíciu krajiny"
  - "Pretože progresívne daňové systémy nespravodlivo cielia na bohatých jednotlivcov, ktorí vytvárajú najviac pracovných miest"
explanation: >-
  Libertariánska námietka voči zdaneniu je morálna skôr než ekonomická. Libertariáni považujú zdanenie za formu štátnej krádeže a prekážku súkromného vlastníctva, pretože spočíva v zmocnení sa cudzieho majetku bez súhlasu. Hoci môžu existovať ekonomické argumenty proti zdaneniu, základný libertariánsky argument stojí na princípe, že porušuje vlastnícke práva, nie na výpočtoch efektívnosti alebo konkurencieschopnosti.
