question: "Какво означава терминът 'холизъм' в контекста на социалистическата философия?"
answer: "Визия за обществото като неделимо цяло, при която колективът има първенство над индивида"
wrong_answers:
  - "Философия, която разглежда всеки индивид като самодостатъчна единица, чиито права не могат да бъдат отменяни от никоя група"
  - "Икономическа теория, която защитава балансирането на публичния и частния сектор в равна степен"
  - "Политическа стратегия, която интегрира всички малцинствени гледни точки в единна платформа, основана на консенсус"
explanation: >-
  Холизмът идва от гръцкото 'holos', означаващо 'цялото.' В социалистическата мисъл той се отнася до визия за обществото като неделимо цяло, а не като проста сума от индивиди. Социалистическата държава цели да поеме и насочва човешката дейност в максимална степен. Този колектив може да бъде представен като социална класа, нация, раса или пол, но във всеки случай индивидът се дефинира чрез принадлежността си към група.
reviewed: false
