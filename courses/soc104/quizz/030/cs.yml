question: "Jak se liší role Cato Institute, Mises Institute a Libertarian Party v libertariánském hnutí?"
answer: "Cato Institute se zaměřuje na návrhy veřejných politik, Mises Institute na vzdělávání a akademické publikování a Libertarian Party na volební politiku"
wrong_answers:
  - "Cato Institute financuje politické kampaně, Mises Institute přímo lobbuje v Kongresu a Libertarian Party organizuje akademické konference"
  - "Cato Institute vydává ekonomické učebnice, Mises Institute pořádá registrace voličů a Libertarian Party připravuje legislativní návrhy"
  - "Cato Institute organizuje protesty zdola, Mises Institute poskytuje právní obhajobu libertariánům a Libertarian Party řídí výzkum think tanků"
explanation: >-
  Cato Institute (založený 1977) je think tank sídlící ve Washingtonu, který pracuje na návrzích veřejných politik. Mises Institute (založený 1982) se zaměřuje na vzdělávání spíše než na politický lobbying a funguje jako druh online univerzity s konferencemi a znovu vydávanými díly. Libertarian Party (založená 1971) je třetí největší americká politická strana a účastní se voleb, v nichž i její zhruba 2% podíl hlasů může rozhodnout výsledky.
