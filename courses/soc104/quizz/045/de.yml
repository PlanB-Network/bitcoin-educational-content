question: "Welche Unterscheidung zog Karl Marx zwischen utopischem Sozialismus und wissenschaftlichem Sozialismus?"
answer: "Er warf den frühen französischen Sozialisten vor, imaginäre Lösungen vorzuschlagen, während sein wissenschaftlicher Sozialismus im historischen Materialismus und im Klassenkampf verankert war"
wrong_answers:
  - "Er argumentierte, dass der utopische Sozialismus zu sehr auf Ökonomie fokussiert war, während der wissenschaftliche Sozialismus kulturelle und künstlerische Transformation priorisierte"
  - "Er lobte die utopischen Sozialisten für ihre praktischen Experimente und kritisierte den wissenschaftlichen Sozialismus dafür, zu abstrakt und theoretisch zu sein"
  - "Er behauptete, der utopische Sozialismus sei gewaltsam und revolutionär, während der wissenschaftliche Sozialismus friedliche demokratische Reformen begünstige"
explanation: >-
  Marx warf frühen französischen Sozialisten wie Proudhon, Saint-Simon und Fourier vor, Utopisten zu sein, die rein imaginäre Lösungen vorschlugen. Sein wissenschaftlicher Sozialismus beruhte auf historischem Materialismus: der Vorstellung, dass die Geschichte durch Klassenkampf und die Aneignung der Produktionsmittel voranschreitet, wobei alle kulturellen Vorstellungen durch Produktivkräfte und Produktionsverhältnisse bedingt sind.
