question: "Sự phân biệt của Karl Popper giữa xã hội mở và xã hội đóng liên hệ thế nào với cuộc tranh luận giữa chủ nghĩa cá nhân và chủ nghĩa tập thể?"
answer: "Xã hội mở thừa nhận quyền của cá nhân tự phán đoán thông qua các quyết định cá nhân, trong khi xã hội đóng mang tính tập thể chủ nghĩa, dựa trên tâm lý bộ lạc và sự từ chối tự do phê phán"
wrong_answers:
  - "Xã hội mở là xã hội cho phép thương mại tự do qua biên giới quốc gia, trong khi xã hội đóng áp đặt thuế quan và các chính sách kinh tế bảo hộ"
  - "Xã hội mở được cai trị bằng dân chủ trực tiếp nơi mọi công dân bỏ phiếu, trong khi xã hội đóng do một quân chủ thế tập duy nhất cai trị"
  - "Xã hội mở công bố minh bạch mọi tài liệu chính phủ, trong khi xã hội đóng phân loại thông tin là bí mật nhà nước"
explanation: >-
  Popper định nghĩa xã hội đóng là xã hội ma thuật hay bộ lạc, và xã hội mở là xã hội trong đó các cá nhân đối mặt với các quyết định cá nhân. Xã hội đóng mang tính tập thể chủ nghĩa, dựa trên tâm lý bộ lạc với sự từ chối tự do phê phán và sự lý tưởng hóa một trật tự tĩnh tại. Xã hội mở trao vị trí ưu tiên cho lựa chọn tự do về giá trị, niềm tin và các mối quan hệ, trực tiếp hiện thân cho các nguyên tắc cá nhân chủ nghĩa.
