question: "Satoshi Nakamoto 指出的法定货币根本问题是什么？"
answer: "它们要求人们信任中央银行不会让货币贬值，但法定货币的历史充满了对这种信任的违反"
wrong_answers:
  - "它们太难用于日常交易，因为实物现金磨损很快，而且生产成本高昂"
  - "它们无法进行国际转账，因为每个国家都有互不兼容的货币标准和监管规定"
  - "它们由黄金储备支持，而这些储备不足以覆盖流通中的货币总供应量"
explanation: >-
  Satoshi Nakamoto 表示，传统货币的根本问题在于它们运作所需的信任。法定货币并没有商品作为支撑，而是完全依赖制度权威。当一个机构掌握对货币的完全控制时，滥用的诱惑过于强烈，而历史已经通过货币贬值反复证明了这一点。
reviewed: false
