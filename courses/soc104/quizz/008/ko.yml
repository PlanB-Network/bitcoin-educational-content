question: "놀런 도표에서 자유지상주의자들 사이에는 어떤 내부 긴장이 존재하나요?"
answer: "어떤 이들은 국가를 완전히 폐지하기를 원하고(아나코-자본주의자), 다른 이들은 핵심 주권 기능을 유지하는 최소국가를 선호합니다(최소국가주의자)"
wrong_answers:
  - "어떤 이들은 강한 경제 규제를 원하고, 다른 이들은 모든 산업의 완전한 규제 완화를 선호합니다"
  - "어떤 이들은 민주적 선거를 지지하고, 다른 이들은 세습 통치 체제를 선호합니다"
  - "어떤 이들은 진보적 사회 정책을 주장하고, 다른 이들은 엄격한 전통적 도덕 가치를 옹호합니다"
explanation: >-
  자유지상주의 진영 내부에는 국가의 역할을 둘러싼 근본적 의견 차이가 있습니다. 아나코-자본주의자들은 모든 국가 기능을 민간 서비스로 대체하기를 원하지만, 최소국가주의자들은 국방과 법원 같은 핵심 주권 기능을 유지하는 최소국가를 받아들입니다. 두 집단 모두 자유지상주의의 정상에 속하지만, 국가가 조금이라도 존재해야 하는지에 대해서는 의견이 다릅니다.
reviewed: false
