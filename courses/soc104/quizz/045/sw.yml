question: "Green New Deal inawakilishaje mageuzi ya kisasa ya usoshalisti wa kidemokrasia?"
answer: "Hutumia wasiwasi wa kimazingira kama uhalalishaji mpya wa uingiliaji wa dola na kunyang'anywa kwa mapato binafsi, ikiweka maslahi ya mtu binafsi chini ya afya ya pamoja ya sayari"
wrong_answers:
  - "Huacha kabisa uchumi wa jadi wa kisoshalisti kwa ajili ya suluhisho za soko huru kwa matatizo ya kimazingira kupitia biashara ya carbon"
  - "Hukataa uingiliaji wa dola na badala yake hutegemea hatua za hiari za mtu binafsi na ubunifu wa sekta binafsi kushughulikia mabadiliko ya tabianchi"
  - "Huwakilisha kujitenga na usoshalisti kwa kutanguliza ulinzi wa mazingira juu ya masuala yote ya haki ya kijamii na ajira"
explanation: >-
  Green New Deal huunganisha wasiwasi wa kimazingira na malengo ya kijamii, ikichanganya mpito wa kiekolojia na haki ya kijamii, dhamana za ajira, na huduma za umma zilizoimarishwa. Maslahi ya mtu binafsi huwekwa chini ya maslahi ya pamoja yanayofafanuliwa na afya ya sayari. Katika kiini chake, hutoa kifungashio kipya cha kibalagha kinachohalalisha uingiliaji wa dola na kunyang'anywa kwa mapato binafsi, si tena kwa jina la haki ya kijamii pekee bali pia kwa jina la mazingira.
