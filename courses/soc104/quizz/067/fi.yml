question: "Mikä johdonmukainen kaava erottaa keskustalaisen menetelmän muiden poliittisten suuntausten kannoista kaikissa viidessä talouspoliittisessa kiistassa (verot, vähimmäispalkka, terveydenhuolto, ympäristö, tuet)?"
answer: "Keskustalaiset kieltäytyvät sitoutumasta kiinteään periaatteeseen ja vaativat sen sijaan empiiristä analyysiä ja asiantuntija-arviointia politiikan määrittämiseksi tapauskohtaisesti, mikä tekee heidän lähestymistavastaan luontaisesti teknokraattisen"
wrong_answers:
  - "Keskustalaiset omaksuvat aina sosialistisen ja konservatiivisen kannan välisen keskiaseman ja jakavat erotuksen jokaisessa kysymyksessä tasan"
  - "Keskustalaiset asettavat johdonmukaisesti talouskasvun sosiaalisen hyvinvoinnin edelle, asettuvat libertaarien puolelle finanssipolitiikassa ja ovat samalla samaa mieltä sosialistien kanssa sääntelystä"
  - "Keskustalaiset siirtävät kaikki taloudelliset päätökset kansainvälisille järjestöille ja kauppasopimuksille sen sijaan, että tekisivät itsenäistä kansallista politiikkaa"
explanation: >-
  Kaikissa viidessä talouspoliittisessa kiistassa keskustalainen lähestymistapa noudattaa samaa kaavaa: sen sijaan, että keskustalaiset sitoutuisivat kiinteään ideologiseen periaatteeseen, he vaativat empiiristä näyttöä ja asiantuntija-arviointia ennen päätöksentekoa. Veroissa oikea taso on määritettävä analyysillä. Vähimmäispalkassa tasoa on säädettävä pragmaattisesti. Terveydenhuollossa asiantuntijoiden kalibroima yhdistelmä on ihanteellinen. Ympäristökysymyksissä politiikan on tasapainotettava kilpailukykyä. Tuissa jokainen tapaus on arvioitava omien ansioidensa perusteella. Tämä tekee keskustalaisuudesta luontaisesti teknokraattista, mikä on eri asia kuin pelkkä erotuksen jakaminen tai kansainvälisiin elimiin tukeutuminen.
