question: "What is a federation in the context of Taproot Assets universes?"
answer: "A node's collection of trusted universe connections for accessing and synchronizing asset data from multiple sources"
wrong_answers:
  - "A governance structure where multiple nodes vote on which assets are valid within the protocol"
  - "A group of nodes that collectively sign asset minting transactions using a multisig scheme"
  - "A centralized registry that assigns unique identifiers to all Taproot Assets across the network"
explanation: >-
  A federation refers to a node's collection of trusted universe connections. When nodes connect their universes to share data with each other, they form a federation. This allows nodes to discover, verify, and access asset proof data from multiple sources rather than relying solely on their own local universe store.
reviewed: false
