question: "Como a resposta de George W. Bush à crise financeira de 2008 ilustra a 'flexibilidade problemática' dos princípios conservadores?"
answer: "Ele abandonou princípios de livre mercado para socorrer grandes bancos, revelando a visão conservadora do Estado como o garantidor último da estabilidade econômica nacional"
wrong_answers:
  - "Ele recusou toda intervenção governamental e permitiu que os bancos falissem, aderindo estritamente à ideologia de livre mercado independentemente das consequências"
  - "Ele nacionalizou permanentemente o setor bancário e introduziu tributação progressiva, passando do conservadorismo para o socialismo democrático"
  - "Ele respondeu cortando todos os gastos governamentais e eliminando regulações financeiras para deixar o mercado se autocorrigir"
explanation: >-
  Bush declarou que havia 'abandonado princípios de livre mercado para salvar o sistema de livre mercado' ao intervir para socorrer os grandes bancos. Isso ilustra como conservadores podem priorizar o poder e a continuidade da nação acima de princípios abstratos de mercado. A mesma lógica flexível aparece nas políticas comerciais protecionistas de Trump, perseguidas em nome do interesse nacional sob o risco de alimentar o corporativismo e o capitalismo de compadrio.
reviewed: false
