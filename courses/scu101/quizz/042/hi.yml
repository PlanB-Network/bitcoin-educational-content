question: यादृच्छिक (रैंडम) जनरेट किए गए पासवर्ड का उपयोग करना क्यों ज़रूरी है?
answer: वे समान लंबाई के पासवर्ड्स के मुकाबले ब्रूट फोर्स अटैक के खिलाफ ज़्यादा मज़बूत होते हैं जिनमें शब्दकोश (डिक्शनरी) के शब्द शामिल होते हैं।
wrong_answers:
  - वे याद रखने में आसान होते हैं, लेकिन टाइप करने में धीमे।
  - वे हमेशा सुरक्षित होते हैं क्योंकि उनमें 20 से ज़्यादा रैंडम अक्षर होते हैं।
  - अधिकतर ऑनलाइन सेवाएँ सिर्फ न्यूनतम लंबाई और कुछ खास करैक्टर सेट की मांग करती हैं, इन मानदंडों को पूरा करने का मतलब है कि पासवर्ड काफी मजबूत हैं।
explanation: |
  यादृच्छिक (रैंडम) रूप से उत्पन्न पासवर्ड उच्च स्तर की सुरक्षा प्रदान करते हैं
  क्योंकि वे ब्रूट फोर्स हमलों के प्रति अधिक प्रतिरोधी होते हैैं,
  जिनमें अक्षरों के सभी संभावित संयोजनों को आजमाकर पासवर्ड
  का अनुमान लगाने की कोशिश की जाती है।
reviewed: true
