question: "Ni irihe tandukaniro nyamukuru hagati yo kuba pro-business no kuba pro-market?"
answer: "Abashigikiye pro-business barondera ukwivanga kwa leta kugira ngo ikingire amashirahamwe kanaka kudatsindwa, mu gihe abashigikiye pro-market bashigikira gukuraho amabwirizwa menshi kandi bakareka amashirahamwe agatsindwa kugira ngo isoko rishobore kwisubira ku buryo bwizana"
wrong_answers:
  - "Abashigikiye pro-business bibanda ku mashirahamwe manini, mu gihe abashigikiye pro-market bibanda gusa ku gufasha amashirahamwe mato n'ayatanguye vuba"
  - "Pro-business ni ikibanza c'ibubamfu gishigikira amakoperative y'abakozi, mu gihe pro-market ari ikibanza c'iburyo gishigikira umutungo w'abikorera"
  - "Abashigikiye pro-business banka ihiganwa ryose, mu gihe abashigikiye pro-market bashigikira ihiganwa rigenzurwa na leta hagati y'amashirahamwe yemejwe"
explanation: >-
  Ikibanza ca pro-business kibona ihiganwa nk'igikoresho c'ubutegetsi kiboneka biciye mu mabwirizwa, kandi kikerekana ko imfashanyo n'ugutabara amashirahamwe ari mu kaga bikwiye kugira ngo akazi ntigatakare. Mu kubona kwa pro-business, isoko riroroshe gusenyuka kandi rikeneye gutabarwa na leta. Abashigikiye pro-market babona ihiganwa nk'icavuye ku buryo bwizana mu kwihangira kwidegemvya, bikavuga gukuraho amabwirizwa menshi no kureka amashirahamwe agatsindwa, kuko ugutsindwa gutuma isoko ryisubira ku buryo bwizana kandi rikugururira ikibanza abakinyi babishoboye kuruta.
