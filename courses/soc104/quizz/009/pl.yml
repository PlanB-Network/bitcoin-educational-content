question: "Gdzie Zieloni znajdują się na diagramie Nolana i dlaczego?"
answer: "Bardzo nisko na diagramie, ponieważ uważają, że interes jednostki nie może mieć pierwszeństwa przed zbiorowym interesem planety"
wrong_answers:
  - "Na szczycie diagramu, ponieważ jednakowo priorytetowo traktują wolność osobistą i świadomość ekologiczną"
  - "W centrum diagramu, ponieważ równoważą wzrost gospodarczy z ochroną środowiska"
  - "Daleko po prawej, ponieważ popierają rynkowe rozwiązania wyzwań środowiskowych"
explanation: >-
  Zieloni znajdują się bardzo nisko na diagramie Nolana, ponieważ sprzyjają silnej kontroli państwa nad decyzjami gospodarczymi i osobistymi w imię dobrostanu planety. Zastąpili marksistowską walkę klas walką między człowiekiem a naturą i mają skłonność do obrony kontroli gospodarczej, a nawet zniesienia własności prywatnej. Umieszcza ich to w sektorze autorytarnym, a nie na szczycie ani w centrum.
reviewed: false
