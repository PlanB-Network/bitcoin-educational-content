question: "Prečo sa klasickí liberáli v Spojených štátoch začali počas dvadsiateho storočia nazývať „libertariánmi“?"
answer: "Pretože americký „liberalizmus“ bol kooptovaný rastúcim štátnym intervencionizmom a sociálnym štátom"
wrong_answers:
  - "Pretože sa chceli dištancovať od európskych monarchistických tradícií"
  - "Pretože pojem „liberál“ sa začal spájať s anarchizmom a politickým násilím"
  - "Pretože nové obchodné dohody vyžadovali osobitnú politickú identitu pre obhajcov voľného trhu"
explanation: >-
  Počas dvadsiateho storočia nastal zásadný posun, keď sa princípy laissez-faire postupne opúšťali v prospech sociálneho štátu. Americký „liberalizmus“ začal znamenať niečo veľmi odlišné od klasického liberalizmu a prijal štátny intervencionizmus. Klasickí liberáli prijali pojem „libertarián“, aby zachovali tento rozdiel. Táto zmena označenia nemala nič spoločné s európskym monarchizmom, anarchistickým násilím ani obchodnými dohodami.
