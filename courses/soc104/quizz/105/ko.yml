question: "이 강의는 자유가 어떻게 좌파적 가치와 우파적 가치가 평화롭게 공존하게 한다고 주장하나요?"
answer: "진정한 자유 체제에서는 좌파 이상을 가진 사람들이 자발적으로 소유물을 공유하고 자금을 재분배할 수 있으며, 우파 가치를 가진 사람들은 저축하고 전통을 전수할 수 있습니다. 어느 쪽도 자신의 삶의 방식을 다른 쪽에 강요하지 않습니다"
wrong_answers:
  - "자유는 정부가 온건한 규제를 통해 경쟁하는 가치들을 균형 있게 조정하는 중도적 입장을 받아들임으로써 양쪽이 타협할 것을 요구합니다"
  - "자유는 좌파와 우파 공동체가 각자 독립 정부를 가진 별도의 지리적 영토에서 살아야 함을 의미합니다"
  - "자유는 시민들이 각 지역에서 어떤 가치가 집행되어야 하는지 투표하게 하고, 선거 주기마다 좌파와 우파 정책을 번갈아 적용함으로써 작동합니다"
explanation: >-
  이 강의는 진정한 자유 체제에서 좌파 이상을 따르는 사람들이 자발적으로 소유물을 포기하고, 생산수단을 공유하거나, 임금을 재분배 조직에 기부할 수 있음을 보여 줍니다. 우파 가치를 가진 사람들은 열심히 일하고, 저축하며, 가족적 가치를 전수할 수 있습니다. 누구도 자신의 삶의 방식을 다른 사람들에게 부과해서는 안 됩니다. 목표는 시장의 자유와 선택의 힘을 통해 평화롭게 달성될 수 있습니다.
