question: نمادگذاری دسترسی (O, I, H) در Simplicity چگونه کار می‌کند؟
answer: O یعنی 'take' (چپ)، I یعنی 'drop' (راست)، و H یعنی 'iden' (کل مقدار).
wrong_answers:
  - O یعنی output، I یعنی input، و H یعنی متوقف کردن اجرای برنامه.
  - آن‌ها نام متغیرهایی هستند که کامپایلر به‌طور خودکار به مقادیر اختصاص می‌دهد.
  - O عناصر با اندیس فرد را انتخاب می‌کند، I عناصر با اندیس زوج را انتخاب می‌کند، و H سر را انتخاب می‌کند.
explanation: >-
  میان‌بُر O/I/H راهی فشرده برای پیمایش زوج‌های تودرتو فراهم می‌کند.
  O f همان take f است (استخراج چپ)، I f همان drop f است (استخراج راست)، و H همان
  iden است (کل مقدار). دنباله‌هایی مانند I O H یعنی drop(take(iden))،
  و عنصر اول از عنصر دوم را استخراج می‌کند. این شبیه
  اندیس‌های De Bruijn با رقم‌های دودویی به عنوان موقعیت‌های درخت است.
reviewed: false
