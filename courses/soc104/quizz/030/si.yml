question: "libertarians සහ conservatives බෙදාගන්නා පොදු භූමිය කුමක්ද, සහ ඔවුන් වෙන් කරන්නේ කුමක්ද?"
answer: "ඔවුන් limited government වෙත බැඳීම සහ forced egalitarianism ප්‍රතික්ෂේප කිරීම බෙදාගනී, නමුත් military interventionism සහ social policies පිළිබඳ එකඟ නොවෙති"
wrong_answers:
  - "ඔවුන් protectionist trade policies සහ national defense සඳහා සහාය බෙදාගන්නා නමුත්, public life තුළ religion හි භූමිකාව පිළිබඳ එකඟ නොවෙති"
  - "ඔවුන් progressive taxation සහ welfare programs සඳහා කැපවීමක් බෙදාගන්නා නමුත්, immigration policy පිළිබඳ එකඟ නොවෙති"
  - "ඔවුන් free trade සහ drug legalization වලට විරුද්ධත්වය බෙදාගන්නා නමුත්, federal government හි ප්‍රමාණය පිළිබඳ එකඟ නොවෙති"
explanation: >-
  Libertarians සහ conservatives දෙදෙනාම limited government වෙනුවෙන් පෙනී සිටිති, forced egalitarianism ප්‍රතික්ෂේප කරති, public debt වලට විරුද්ධ වෙති, සහ states' rights ආරක්ෂා කරති. කෙසේ වෙතත්, libertarians neoconservatives ගේ military interventionism ප්‍රතික්ෂේප කරති, conservative social policies සහ subsidies වලට විරුද්ධ වෙති, drug prohibition හෙළා දකිති, සහ protectionism ප්‍රතික්ෂේප කරති. සන්ධානය සැබෑ එකක් නමුත් ස්වභාවයෙන්ම ආතතියෙන් යුක්තය.
