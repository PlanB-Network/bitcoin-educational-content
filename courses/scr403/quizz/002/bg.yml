question: Какво се случва с входа при паралелна композиция?
answer: И двете операции получават един и същ вход, а изходите им образуват product (двойка).
wrong_answers:
  - Входът се разделя наполовина, като всяка операция получава една отделна част.
  - Едната операция обработва входа първа, а другата получава променения резултат.
  - Входът се маркира с таг и се насочва само към една от двете операции за обработка.
explanation: >-
  Паралелната композиция подава един и същ непроменен вход едновременно към
  двете операции. Резултатите се обединяват в product тип (двойка). В
  Simplicity това използва комбинатора pair, записван f ▵ g, който произвежда
  ⟨f(a), g(a)⟩ за вход a.
