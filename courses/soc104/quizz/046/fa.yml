question: "محافظه‌کاری با آزادی‌ها در حوزه‌های اقتصادی و اجتماعی چگونه برخورد می‌کند؟"
answer: "آزادی‌های قوی در حوزه اقتصادی اما آزادی‌های ضعیف در حوزه اجتماعی"
wrong_answers:
  - "آزادی‌های ضعیف در هر دو حوزه اقتصادی و اجتماعی برای حفظ نظم اجتماعی سنتی"
  - "آزادی‌های قوی در حوزه اجتماعی اما آزادی‌های ضعیف در حوزه اقتصادی"
  - "آزادی‌های برابر و نامحدود در هر دو حوزه، با کمترین مداخله دولتی از هر نوع"
explanation: >-
  محافظه‌کاری دوگانگی‌ای را نشان می‌دهد که تصویر آینه‌ای سوسیالیسم است. در قلمرو اقتصادی، محافظه‌کاران از بازار آزاد، کارآفرینی، و مالکیت خصوصی دفاع می‌کنند. در قلمرو اجتماعی، محدودیت‌ها با حفظ هنجارهای اخلاقی سنتی و ثبات اجتماعی توجیه می‌شوند. سومین پاسخ نادرست الگوی سوسیالیستی را توصیف می‌کند، که نقطه مقابل آن است.
reviewed: false
