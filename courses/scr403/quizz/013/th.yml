question: ทำไม Simplicity จึงใช้ static analysis แทนโมเดล gas แบบ dynamic เช่น Ethereum?
answer: เพื่อกำหนดขอบเขตทรัพยากรก่อน execution เริ่มต้น ทำให้ต้นทุนคาดการณ์ได้.
wrong_answers:
  - เพราะ static analysis นั้น implement ได้เร็วกว่ามากสำหรับนักพัฒนา.
  - เพราะโมเดล gas ของ Ethereum ถูกจดสิทธิบัตรและจึงไม่สามารถใช้งานได้.
  - เพราะโปรแกรม Simplicity สั้นเกินกว่าจะต้องใช้การวัดปริมาณจริง ๆ.
explanation: >-
  static analysis ของ Simplicity ทำให้เครือข่ายรู้ได้อย่างแน่นอนว่าโปรแกรมหนึ่ง
  ต้องใช้การคำนวณเท่าใดก่อนที่มันจะรัน สิ่งนี้กำจัดความคาดเดาไม่ได้ของ dynamic
  metering, ป้องกัน denial-of-service ผ่านการใช้ทรัพยากรจนหมด และทำให้ node
  ปฏิเสธโปรแกรมที่เกินขีดจำกัดได้โดยไม่ต้องเสียการคำนวณ.
reviewed: false
