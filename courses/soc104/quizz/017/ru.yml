question: "Каково определение этатизма, представленное в модели Нолана?"
answer: "Использование законодательства для контроля и формирования общества, будь то во имя защиты цивилизации, рабочего класса, природы или угнетенных"
wrong_answers:
  - "Система правления, при которой выборные должностные лица служат фиксированные сроки, а власть передается через демократические выборы"
  - "Убеждение, что только сильная армия может защитить суверенитет и территориальную целостность страны"
  - "Экономическая философия, которая через тарифы и квоты ставит национальные отрасли выше иностранной конкуренции"
explanation: >-
  Этатизм определяется как использование законодательства для контроля и формирования общества. И левые, и правые практикуют его: одни во имя защиты цивилизации, другие во имя защиты рабочего класса, природы или угнетенных. Даже центристы одобряют его, когда им это удобно. Этатизм не ограничивается военной политикой, торговым протекционизмом или простым наличием выборных правительств.
reviewed: false
