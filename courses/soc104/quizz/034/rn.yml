question: "Ni kubera iki insiguro zishingiye ku migambi y'imigwi ya politike zifatwa nk'iziteye ingorane mu gusesengura?"
answer: "Zitera urujijo rw'ivyiyumviro kuko imigwi yose ivuga ko ikurikirana intumbero zisa nk'ubutungane, uburinganire, n'umwidegemvyo"
wrong_answers:
  - "Zirasobanutse cane kandi zirakomeye cane, ntizisigira ikibanza ihinduka risanzwe ry'imigwi ya politike uko igihe kigenda"
  - "Zishira cane imbere ivyavuye mu butunzi maze zikibagira imice y'umuco n'imibano mu buzima bwa politike"
  - "Zishingiye ku nyandiko za Leta zagizwe ibanga zidashobora kuboneka kenshi ku bashakashatsi bigenga"
explanation: >-
  Insiguro zishingiye ku migambi zubakira ku mvo n'intumbero zivugwa, ariko buri mugwi wa politike uvuga ko ukurikirana ubutungane, uburinganire, n'umwidegemvyo. Ivyo bituma bidashoboka gutandukanya imigwi. Isesengura ry'imiterere, ku rundi ruhande, risuzuma imigwi hakurikijwe ingaruka zigaragara, zipimika, n'uburyo ikoresha, rigahishura kamere yayo nyakuri irenze imvugo nziza.
reviewed: false
