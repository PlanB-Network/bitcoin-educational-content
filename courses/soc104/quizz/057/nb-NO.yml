question: "Hva er sentrismens kardinalverdier?"
answer: "Moderasjon, kompromiss, tilpasning og offentlig nytte"
wrong_answers:
  - "Tradisjon, orden, autoritet og nasjonal identitet"
  - "Frihet, privat eiendom, samtykke og individuelt ansvar"
  - "Likhet, sosial rettferdighet, solidaritet og kollektivt eierskap"
explanation: >-
  Sentrismens kardinalverdier er moderasjon, kompromiss, tilpasning og offentlig nytte. Disse gjenspeiler den sentristiske vektleggingen av pragmatisk balanse snarere enn ideologisk forpliktelse. De andre alternativene beskriver kardinalverdiene til henholdsvis konservatisme, libertarianisme og sosialisme.
reviewed: false
