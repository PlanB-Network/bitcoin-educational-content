question: "În toate cele cinci dezbateri economice (taxe, salariu minim, asistență medicală, mediu, subvenții), ce tipar constant distinge metoda centristă de pozițiile celorlalte familii politice?"
answer: "Centriștii refuză să se angajeze față de un principiu fix și cer în schimb analiză empirică și evaluarea experților pentru a determina politica de la caz la caz, ceea ce face ca abordarea lor să fie inerent tehnocratică"
wrong_answers:
  - "Centriștii adoptă întotdeauna o poziție de mijloc între pozițiile socialistă și conservatoare, împărțind diferența în mod egal în fiecare chestiune"
  - "Centriștii prioritizează constant creșterea economică în detrimentul bunăstării sociale, alăturându-se libertarienilor în politica fiscală și fiind de acord cu socialiștii în privința reglementării"
  - "Centriștii deleagă toate deciziile economice organizațiilor internaționale și acordurilor comerciale, în loc să formuleze politici naționale independente"
explanation: >-
  În toate cele cinci dezbateri economice, abordarea centristă urmează același tipar: în loc să se angajeze față de un principiu ideologic fix, centriștii cer dovezi empirice și evaluarea experților înainte de a lua decizii. În privința taxelor, nivelul corect trebuie determinat prin analiză. În privința salariului minim, nivelul trebuie ajustat pragmatic. În privința asistenței medicale, ideal este un amestec calibrat de experți. În privința mediului, politica trebuie să echilibreze competitivitatea. În privința subvențiilor, fiecare caz trebuie evaluat după meritele sale. Acest lucru face centrismul inerent tehnocratic, ceea ce este diferit de simpla împărțire a diferenței sau de delegarea către organisme internaționale.
reviewed: false
