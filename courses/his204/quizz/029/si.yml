question: Marquis d'Argenson සමාජය කුමකට සමාන කළේද?
answer: මී මැසි කූඩයකට; එහි සෑම කෘමියෙකුම තමන්ගේම අභිලාෂ අනුව ක්‍රියා කරන අතර, එහි ප්‍රතිඵලය සියල්ලන්ගේ පොදු යහපැවැත්ම වේ
wrong_answers:
  - කැලයකට; එහි බලවත්ම තැනැත්තාගේ නීතිය පමණක් පාලනය කරයි
  - ගංගාවකට; එය නීතිවල මැදිහත්වීමකින් තොරව ස්වභාවිකව ගලා යයි
  - නිරන්තර නඩත්තුව අවශ්‍ය සංකීර්ණ යන්ත්‍රයකට
explanation: |
  D'Argenson සමාජය මී මැසි කූඩයකට සමාන කළේය. එහි සෑම කෘමියෙකුම තම ස්වභාවික ප්‍රේරණය අනුව ක්‍රියා කරන අතර, ජෙනරාල්වරුන්ගේ නියෝග නොමැතිව කුඩා සමාජයේ අවශ්‍යතා සඳහා මහත් සමුච්චයක් නිපදවයි. මෙය Adam Smithගේ සුප්‍රසිද්ධ "අදෘශ්‍ය හස්තය"ට ප්‍රංශ ආර්ථික චින්තනයේ ඇති සමීපතම ප්‍රකාශනය විය හැක.