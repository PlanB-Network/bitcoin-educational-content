question: "What is the socialist position on healthcare?"
answer: "Access to healthcare is a fundamental right, and the state must guarantee a universal, publicly funded system for everyone regardless of income"
wrong_answers:
  - "Healthcare should be a mixed system with basic state coverage supplemented by private insurance options"
  - "Private markets deliver more innovative healthcare, so individuals should choose their own system freely"
  - "The state should provide healthcare only for the poorest citizens while private insurance covers everyone else"
explanation: >-
  For socialists, access to healthcare is a fundamental right, not a commodity. The state must guarantee a universal, publicly funded healthcare system so that everyone has access to care, regardless of income. This reflects the socialist concern for equality, social justice, and the importance of the state in organizing services in the general interest. The mixed system describes the centrist view, while choice-based approaches reflect libertarian and conservative positions.
