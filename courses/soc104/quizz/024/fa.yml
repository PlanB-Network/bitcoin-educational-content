question: "پالئو-لیبرتارینیسم چیست؟"
answer: "ترکیبی که رد دولت به‌عنوان منبع اجبار را با تقویت نهادهای سنتی و ساختارهای اجتماعی داوطلبانه ترکیب می‌کند"
wrong_answers:
  - "جنبشی لیبرتارین که همهٔ ارزش‌های سنتی را رد می‌کند و ترقی‌خواهی اجتماعی رادیکال را ترویج می‌کند"
  - "ایدئولوژی‌ای محافظه‌کار که از قدرت دولت برای اجرای ارزش‌های سنتی استفاده می‌کند و در عین حال میزانی از آزادی اقتصادی را مجاز می‌داند"
  - "فلسفه‌ای میانه‌رو که به‌دنبال سازشی متوازن میان اقتصاد سوسیالیستی و سیاست اجتماعی محافظه‌کارانه است"
explanation: >-
  پالئو-لیبرتارینیسم رد دولت به‌عنوان منبع نهادیِ اجبار را با تقویت نهادهای سنتی و ترجیح ساختارهای اجتماعی داوطلبانه بر اقتدار دولت ترکیب می‌کند. این جریان با همدلی بیشتر نسبت به ارزش‌های سنتی، خود را از نئو-لیبرتارینیسم متمایز می‌کند. پالئو-لیبرتارین با سازمان‌یافتن جوامع حول اصول سوسیالیستی یا اجتماع‌گرایانه مخالفتی ندارد؛ فقط نمی‌پذیرد که چنین جوامعی ارزش‌های خود را با زور قانون بر همه تحمیل کنند.
reviewed: false
