question: "දකුණට කුමක් පිළිබඳ නීති සම්පාදනය කිරීමට අවශ්‍යද?"
answer: "සම්ප්‍රදායික ආයතන සහ සමාජ පදවික্রম රැක ගැනීමේ කැමැත්තෙන් මෙහෙයවන සදාචාරය සහ ආගම"
wrong_answers:
  - "අසමානතාව අඩු කර ධනය නැවත බෙදාහැරීමේ කැමැත්තෙන් මෙහෙයවන ආර්ථිකය සහ financial markets"
  - "public schools වල උගන්වන දේ පාලනය කිරීමේ කැමැත්තෙන් මෙහෙයවන science සහ education"
  - "විදේශවල ජාතික බලපෑම පුළුල් කිරීමේ කැමැත්තෙන් මෙහෙයවන international trade සහ diplomacy"
explanation: >-
  දකුණ පුද්ගලික සදාචාරයට සහ සම්ප්‍රදායික වටිනාකම්වලට ප්‍රමුඛතාවය දෙයි. සභ්‍යත්වය රැකගත යුතු ඇතැම් සම්ප්‍රදායික ආයතන සහ සමාජ පදවික్రమ මත ගොඩනැගී ඇති බව එය සලකන අතර, සදාචාරය සහ ආගම පිළිබඳ නීති සම්පාදනය කිරීමට එයට අවශ්‍ය වේ. ආර්ථිකය පිළිබඳ නීති සම්පාදනය කෙරෙහි අවධානය යොමු කරන්නේ දකුණ නොව වමයි. Science, education, සහ trade policy දකුණ සඳහා මෙහි විස්තර කරන ප්‍රධාන අවධානය නොවේ.
reviewed: false
