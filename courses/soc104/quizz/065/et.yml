question: "Mis on konservatiivne seisukoht immigratsiooni suhtes?"
answer: "Riigil on suveräänne õigus kontrollida oma piire, et kaitsta riiklikku julgeolekut ja kultuurilist identiteeti"
wrong_answers:
  - "Piirid peaksid olema tingimusteta avatud, sest diskrimineerivad piirangud rikuvad inimõigusi"
  - "Immigratsiooni peaks määrama turunõudlus, kus kodanikud otsustavad oma suhted välismaalastega lepinguliselt"
  - "Immigratsioonipoliitika peaks tasakaalustama majanduslikke vajadusi eduka integratsiooniga ekspertide hinnangu põhjal"
explanation: >-
  Konservatiivid leiavad, et kord, identiteet ja riiklik suveräänsus peavad olema tähtsamad kui välismaalaste või pagulaste piiramatu vastuvõtmine. Piirid ja selgelt määratletud elanikkond on osa tsiviliseeritud väärtustest. Valed vastused esindavad sotsialistlikku seisukohta (avatud piirid kui inimõigused), libertaarset seisukohta (turupõhine immigratsioon) ja tsentristlikku seisukohta (tasakaalustatud, ekspertidest juhitud lähenemine).
