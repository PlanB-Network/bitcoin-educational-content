question: "すべての全体主義体制はどのように権力を握りましたか？"
answer: "以前のシステムを白紙に戻すことを正当化する暴力革命を通じて"
wrong_answers:
  - "既存の民主的制度内での段階的な立法改革を通じて"
  - "地域支配を求める外国勢力が組織した軍事クーデターを通じて"
  - "大差で選挙に勝利した平和的な大衆運動を通じて"
explanation: >-
  すべての全体主義体制は、暴力革命を通じて権力を握りました。この革命には二重の目的があります。古い秩序を物理的に破壊すること、そして新しい社会を築くために暴力の使用が必要であるとイデオロギー的に正当化することです。この点が、全体主義的な権力掌握を、民主的移行、外国に支援されたクーデター、または平和的な選挙勝利から区別します。
reviewed: false
