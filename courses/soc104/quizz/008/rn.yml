question: "Abaharanira ibidukikije bari hehe ku gishushanyo ca Nolan, kandi kubera iki?"
answer: "Bari hasi cane ku gishushanyo, kubera ko babona ko inyungu y'umuntu ku giti ciwe idakwiye kuja imbere y'inyungu rusangi y'umubumbe w'isi"
wrong_answers:
  - "Bari hejuru ku gishushanyo, kubera ko bashira imbere umwidegemvyo w'umuntu ku giti ciwe n'ukumenya ibidukikije ku rugero rungana"
  - "Bari hagati ku gishushanyo, kubera ko bagerageza kuringaniza iterambere ry'ubutunzi n'ugukingira ibidukikije"
  - "Bari kure iburyo, kubera ko bashigikira inyishu zishingiye kw'isoko ku ngorane z'ibidukikije"
explanation: >-
  Abaharanira ibidukikije bari hasi cane ku gishushanyo ca Nolan kubera ko bashigikira igenzura rikomeye rya leta ku ngingo z'ubutunzi n'iz'umuntu ku giti ciwe mw'izina ry'ineza y'umubumbe w'isi. Basubirije urugamba rw'imigwi rwa Marx n'urugamba hagati y'umuntu n'ibidukikije, kandi akenshi bashigikira kugenzura ubutunzi mbere no gukuraho itunga ryigenga. Ivyo bibashira mu gice c'ubutegetsi bukaze, si hejuru canke hagati.
