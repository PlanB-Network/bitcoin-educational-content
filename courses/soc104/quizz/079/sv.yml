question: "Vilken är den centrala oenigheten mellan libertarianer och andra politiska familjer när de delar samma mål?"
answer: "Oenigheten handlar om medel: libertarianer avvisar tvångslösningar och föredrar frivilligt utbyte genom marknadsprocessen"
wrong_answers:
  - "Oenigheten handlar om ändamål: libertarianer eftersträvar andra mål, såsom individuell rikedom snarare än social välfärd"
  - "Oenigheten handlar om tidpunkt: libertarianer vill uppnå samma mål långsammare genom gradvisa reformer"
  - "Oenigheten handlar om omfattning: libertarianer vill tillämpa samma politik endast på lokal snarare än nationell nivå"
explanation: >-
  Libertarianer kan hålla med socialister, konservativa och centrister om vissa mål, såsom att försvara de förtryckta eller främja social sammanhållning. Oenigheten ligger inte i ändamålen utan i medlen. Libertarianer avvisar alla tvångslösningar som försöker likrikta praktiker och regleringar, och försvarar i stället valets makt och ansvarsfull frihet genom fritt, decentraliserat utbyte grundat på frivilliga kontrakt.
