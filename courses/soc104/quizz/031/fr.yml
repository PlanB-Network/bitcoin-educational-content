question: "Que pensent les libertaires français (anarchistes socialistes) de la propriété privée ?"
answer: "La propriété privée et le capitalisme doivent être abolis parce qu'ils sont des sources d'oppression"
wrong_answers:
  - "La propriété privée est un droit naturel qui précède l'État et doit être protégée à tout prix"
  - "La propriété privée devrait être régulée par l'État mais jamais complètement éliminée de la société"
  - "La propriété privée n'est acceptable que lorsqu'elle est répartie également entre tous les membres d'une commune"
explanation: >-
  Les libertaires français, héritiers de l'anarchisme socialiste à travers des penseurs comme Proudhon et Bakounine, soutiennent que l'État et la propriété privée doivent tous deux être abolis comme sources jumelles d'oppression. Cela est résumé dans la célèbre formule de Proudhon : "La propriété, c'est le vol." La première mauvaise réponse décrit la position libertarienne, qui est fondamentalement opposée à la vision libertaire.
reviewed: false
