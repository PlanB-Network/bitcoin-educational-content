  - "Private markets වඩා innovative healthcare ලබා දෙන බැවින්, individuals තමන්ගේම system එක නිදහසේ තෝරාගත යුතුය"
  - "state එක poorest citizens සඳහා පමණක් healthcare සපයා, private insurance අනෙක් සියල්ලන් cover කළ යුතුය"
explanation: >-
  Socialists සඳහා, healthcare වෙත access fundamental right එකකි, commodity එකක් නොවේ. income නොසලකා සියල්ලන්ට care වෙත access තිබෙන පරිදි state එක universal, publicly funded healthcare system එකක් guarantee කළ යුතුය. මෙය equality, social justice, සහ general interest තුළ services organize කිරීමේදී state එකේ importance පිළිබඳ socialist concern එක reflect කරයි. mixed system එක centrist view එක විස්තර කරන අතර, choice-based approaches libertarian සහ conservative positions reflect කරයි.
