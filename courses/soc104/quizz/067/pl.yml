question: "Jaka jest zasadnicza różnica między stanowiskiem konserwatywnym a libertariańskim w kwestii regulacji broni palnej?"
answer: "Oba akceptują pewną regulację, ale konserwatyści chcą zasad ustanawianych przez prawowitą władzę publiczną, podczas gdy libertarianie chcą, by zasady wyłaniały się od bezpośrednio zainteresowanych, takich jak stowarzyszenia obywatelskie i konkurencja rynkowa"
wrong_answers:
  - "Konserwatyści sprzeciwiają się wszelkiej regulacji broni palnej, podczas gdy libertarianie akceptują ścisłą kontrolę państwową dla bezpieczeństwa publicznego"
  - "Konserwatyści chcą całkowitego zakazu broni palnej, podczas gdy libertarianie popierają nieograniczony dostęp do każdej broni"
  - "Konserwatyści opierają swoje stanowisko na prawach jednostki, podczas gdy libertarianie opierają swoje na odpowiedzialności zbiorowej"
explanation: >-
  Zarówno konserwatyści, jak i libertarianie zgadzają się, że jakaś forma regulacji noszenia broni jest konieczna. Zasadnicza różnica dotyczy tego, kto ustanawia te reguły. Konserwatyści utrzymują, że regulacje muszą pochodzić od władzy publicznej odpowiedzialnej za ochronę dobra wspólnego (odgórnie). Libertarianie twierdzą, że regulacja powinna wyłaniać się od bezpośrednio zainteresowanych: specjalistów ds. bezpieczeństwa, stowarzyszeń obywatelskich i konkurencji rynkowej (oddolnie).
