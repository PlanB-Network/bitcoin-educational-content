bio: |
  Ulrich este educator și scriitor Bitcoin specializat în economie, istorie și geopolitică. Conduce publicația și podcastul Café Viennois, unde explorează evenimentele curente, libertățile individuale și suveranitatea economică. Contribuie la HowtoBitcoin.fr și Mises.org, aducând perspective de economie austriacă în educația despre Bitcoin.

short_bio: Educator și scriitor Bitcoin pe teme de economie și istorie.
