question: ඔහු "හොඳ හදවත්"ට චෝදනා කරන්නේ කුමක් ගැනද?
answer: මිල සැමවිටම පහළ මට්ටමක තබා ගැනීමට බල කිරීමෙන් දුක්ඛිත තත්ත්වය ඇති කිරීම
wrong_answers:
  - නිෂ්පාදන කර්මාන්තයේ වියදමෙන් කෘෂිකර්මාන්තයට සහාය දැක්වීම
  - දුප්පතුන්ට සහාය වීමට මහජන මුදල් ඉතා නොසැලකිලිමත් ලෙස වැය කිරීම
  - දුප්පතුන්ට ප්‍රමාණවත් ලෙස උදව් නොකිරීම
explanation: |
  මිල කෘත්‍රිමව පහළ මට්ටමක තබා ගැනීමට උත්සාහ කළ අය Boisguilbert විවේචනය කළේය. මෙය නිෂ්පාදනය අධෛර්යමත් කර, හිඟයන් ඇති කර, අවසානයේදී දුක්ඛිත තත්ත්වය ඇති කරයි යැයි ඔහු විශ්වාස කළේය. සැපයුම සහ ඉල්ලුම අනුව මිල වෙළඳපොළෙන් තීරණය විය යුතු බව ඔහු විශ්වාස කළේය.
