question: "Какво послание вмъква Satoshi Nakamoto в първия някога изкопан Bitcoin блок?"
answer: "Заглавие от London Times за британския финансов министър, който е на ръба на втори банков спасителен план"
wrong_answers:
  - "Цитат от Friedrich Hayek за опасностите от централното планиране и правителствения контрол върху парите"
  - "Декларация за независимост от всички форми на правителство и финансова регулация по света"
  - "Математическо доказателство, демонстриращо, че децентрализираната валута е по-ефективна от фиатните пари"
explanation: >-
  В генезис блока Satoshi Nakamoto вмъква символично заглавие от London Times: "The Times 03/Jan/2009 Chancellor on the brink of a second bank bailout." Това е пряка препратка към финансовата криза от 2008 г. и последвалия паричен интервенционизъм, което прави намерението на Bitcoin недвусмислено: алтернатива на централизираните банкови системи.
reviewed: false
