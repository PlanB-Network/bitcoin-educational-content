question: "Para qual forma de governança o centrismo tende?"
answer: "Tecnocracia, na qual o poder é confiado a especialistas que dirigem a economia e a política monetária"
wrong_answers:
  - "Democracia direta, na qual os cidadãos votam em cada grande decisão de política pública"
  - "Aristocracia, na qual o poder é detido por uma classe dirigente tradicional"
  - "Governança laissez-faire, na qual o mercado se regula sozinho sem intervenção estatal"
explanation: >-
  O centrismo privilegia a eficiência, o pragmatismo, e tende à tecnocracia, o que significa que o poder deve ser confiado a especialistas que dirigem a economia e conduzem a política monetária. Isso é fundamentalmente diferente da democracia direta, da aristocracia ou do laissez-faire, cada um dos quais distribui o poder segundo princípios inteiramente diferentes.
