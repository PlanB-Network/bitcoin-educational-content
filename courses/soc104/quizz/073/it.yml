question: "In che modo le posizioni conservatrice e libertaria sul salario minimo differiscono nel loro ragionamento, pur favorendone entrambe l'abolizione?"
answer: "I conservatori accettano un certo coinvolgimento dello Stato nella determinazione dei salari se non ostacola la competitività, mentre i libertari vedono il salario minimo come un'imposizione morale sulla libertà di assumere e fare impresa"
wrong_answers:
  - "I conservatori si oppongono al salario minimo perché crea inflazione, mentre i libertari vi si oppongono perché dà troppo potere ai sindacati"
  - "I conservatori vogliono salari fissati da istituzioni religiose e comunitarie, mentre i libertari vogliono salari determinati da studi di mercato approvati dal governo"
  - "I conservatori credono che i salari minimi dovrebbero variare per regione, mentre i libertari credono che un unico salario fisso dovrebbe applicarsi a livello nazionale"
explanation: >-
  Entrambi favoriscono la riduzione o l'abolizione del salario minimo, ma il loro ragionamento differisce fondamentalmente. I conservatori accettano un certo coinvolgimento dello Stato nella determinazione dei salari, insistendo però che rimanga minimo e dipendente dal contesto, con attenzione alla competitività. I libertari assumono una posizione morale più forte: un salario minimo è un'imposizione sulla libertà di assumere e fare impresa. Quando i libertari dicono "il mercato", intendono il contratto, negoziato liberamente tra due parti senza interferenze dello Stato.
