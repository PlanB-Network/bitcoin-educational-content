question: "2차원 모델은 왜 대부분의 정치 쟁점을 경제적 범주와 개인적 범주로 나눌 수 있다고 주장하나요?"
answer: "경제적 쟁점은 생산자와 소비자로서 하는 일에 관한 것이고, 개인적 쟁점은 사적 관계, 신념, 신체적 자율성에 관한 것이기 때문입니다"
wrong_answers:
  - "모든 정치 논쟁은 결국 세금 수준과 종교 관행에 대한 의견 차이로 환원되기 때문입니다"
  - "정부가 역사적으로 시장과 군대라는 두 가지만 규제해 왔기 때문입니다"
  - "정치철학자들이 고대부터 물질적 관심사와 영적 관심사를 항상 분리해 왔기 때문입니다"
explanation: >-
  2차원 모델은 정치 쟁점이 두 개의 넓은 범주로 나뉜다는 생각에 기반합니다. 경제적 자유는 생산, 소비, 거래, 고용, 돈 관리를 포괄합니다. 개인적 자유는 사적 관계, 의견, 신념, 그리고 자신의 몸과 마음에 관한 선택을 포괄합니다. 이러한 분리는 단일한 좌우 축보다 훨씬 더 섬세하게 정치적 입장을 지도화할 수 있게 합니다.
