question: "چرا سایفرپانک‌ها استدلال می‌کردند که ارزی دیجیتال با ویژگی‌های ناشناس‌بودن ضروری است؟"
answer: "زیرا پول نقد، نظام اصلی تراکنش ناشناس، در جامعه دیجیتال در حال ناپدید شدن است، و باید جایگزینی دیجیتال با همان ویژگی‌های حریم خصوصی اختراع شود"
wrong_answers:
  - "زیرا نظام‌های پرداخت دیجیتال موجود بیش از حد کند و پرهزینه بودند و برای تجارت آنلاین جایگزینی سریع‌تر و ارزان‌تر لازم بود"
  - "زیرا دولت‌ها از پیش همه شکل‌های تراکنش ناشناس را ممنوع کرده بودند و تنها فناوری‌ای تازه می‌توانست این قوانین را دور بزند"
  - "زیرا بانک‌های سنتی از خدمت‌رسانی به برخی جمعیت‌ها خودداری می‌کردند و این امر یک نظام پرداخت دیجیتال با دسترسی همگانی را به ضرورتی اقتصادی تبدیل می‌کرد"
explanation: >-
  مانیفست سایفرپانک‌ها می‌گوید محرمانگی در جامعه‌ای باز مستلزم نظام‌های تراکنش ناشناس است. تا عصر دیجیتال، پول نقد نظام اصلی از این نوع بود. اما در جامعه‌ای دیجیتال که پول نقد در آن رو به ناپدید شدن است، باید ارزی دیجیتال با همان ویژگی‌های ناشناس‌بودن اختراع شود. این چشم‌انداز مستقیماً آنچه Bitcoin بعدها محقق کرد را پیش‌بینی می‌کرد.
reviewed: false
