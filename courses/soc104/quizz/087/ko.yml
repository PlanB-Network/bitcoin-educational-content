question: "Ludwig von Mises가 오직 개인만이 생각하고, 추론하며, 행동한다고 썼을 때 그는 무엇을 의미했나요?"
answer: "국가나 민족 같은 집합체는 그것을 이루는 개별 구성원들의 행동을 넘어서는 그 자체의 존재를 갖지 않는다는 것입니다"
wrong_answers:
  - "집단행동은 항상 해롭기 때문에 개인은 집단이나 결사를 형성하지 말아야 한다는 것입니다"
  - "오직 특정한 재능 있는 개인들만이 합리적 사고를 할 수 있고, 대부분의 사람들은 본능을 따른다는 것입니다"
  - "생각과 추론은 결코 공개적으로 공유되거나 논의되어서는 안 되는 사적 활동이라는 것입니다"
explanation: >-
  Mises는 개인주의가 사회나 민족 같은 사회적 실체가 그것을 구성하는 개인들과 독립적으로 존재할 수 있다는 관념에 반대한다는 점을 명확히 했습니다. 집합체는 개별 구성원들의 행동을 넘어서는 그 자체의 존재를 갖지 않습니다. 이러한 실체들은 자기 자신의 의지나 생각을 갖지 않고 오직 개인을 통해서만 행동하므로, 우리는 국가나 회사의 행동을 의미 있게 말할 수 없습니다.
