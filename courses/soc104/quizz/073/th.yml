question: "จุดยืนสังคมนิยมต่อการดูแลสุขภาพคืออะไร?"
answer: "การเข้าถึงการดูแลสุขภาพเป็นสิทธิพื้นฐาน และรัฐต้องรับประกันระบบสากลที่ได้รับทุนสาธารณะสำหรับทุกคนโดยไม่คำนึงถึงรายได้"
wrong_answers:
  - "การดูแลสุขภาพควรเป็นระบบผสมที่มีความคุ้มครองพื้นฐานจากรัฐ เสริมด้วยตัวเลือกประกันเอกชน"
  - "ตลาดเอกชนให้การดูแลสุขภาพที่มีนวัตกรรมมากกว่า ดังนั้นปัจเจกบุคคลควรเลือกระบบของตนเองได้อย่างเสรี"
  - "รัฐควรให้การดูแลสุขภาพเฉพาะแก่พลเมืองที่ยากจนที่สุด ขณะที่ประกันเอกชนครอบคลุมคนอื่นทั้งหมด"
explanation: >-
  สำหรับสังคมนิยม การเข้าถึงการดูแลสุขภาพเป็นสิทธิพื้นฐาน ไม่ใช่สินค้า รัฐต้องรับประกันระบบการดูแลสุขภาพสากลที่ได้รับทุนสาธารณะ เพื่อให้ทุกคนเข้าถึงการรักษาได้ ไม่ว่ารายได้เท่าใด สิ่งนี้สะท้อนความกังวลแบบสังคมนิยมต่อความเท่าเทียม ความยุติธรรมทางสังคม และความสำคัญของรัฐในการจัดระเบียบบริการเพื่อผลประโยชน์ทั่วไป ระบบผสมอธิบายมุมมองสายกลาง ขณะที่แนวทางที่ตั้งอยู่บนการเลือกสะท้อนจุดยืนลิเบอร์ทาเรียนและอนุรักษนิยม
reviewed: false
