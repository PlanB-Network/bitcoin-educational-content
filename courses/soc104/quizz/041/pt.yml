question: "Como a abordagem estrutural define a diferença fundamental entre socialismo e libertarianismo?"
answer: "O socialismo dá primazia ao Estado por meio da regulação, do planejamento e do controle, enquanto o libertarianismo dá primazia ao indivíduo por meio de intervenção estatal mínima"
wrong_answers:
  - "O socialismo prioriza comunidades agrícolas rurais, enquanto o libertarianismo favorece o desenvolvimento industrial urbano"
  - "O socialismo é definido por seu apoio a eleições democráticas, enquanto o libertarianismo rejeita todas as formas de participação política"
  - "O socialismo se concentra na política externa e na cooperação internacional, enquanto o libertarianismo se preocupa apenas com questões econômicas domésticas"
explanation: >-
  Estruturalmente, o socialismo é caracterizado pela onipresença do Estado, que regula, planeja e controla. O libertarianismo é definido pela intervenção estatal mínima na economia e na vida privada, tendendo à primazia da liberdade individual e do livre mercado. Essa distinção estrutural é muito mais útil analiticamente do que comparar as intenções declaradas de cada sistema.
