question: Simplicity の型システムでは、可変長バッファはどのように表現されますか？
answer: ネストした option 型の直積として表現され、各層が2のべき乗サイズのブロックを示します。
wrong_answers:
  - 言語に直接組み込まれた特別な動的配列型を使う。
  - 各関数呼び出しごとに大きくなる再帰的な直和型を通じて表現する。
  - 末尾にゼロ値を追加して埋めた固定長ベクトルとして表現する。
explanation: >-
  バッファはネストした option 型を使います。たとえば、Xᑉ⁸ は
  (1 + X⁴) × ((1 + X²) × (1 + X)) に展開され、多項式としては
  1 + X + X² + ... + X⁷ となり、0個から7個までの要素の集合を表します。
  各 option 層は、2のべき乗サイズのブロックが存在するかどうかを示し、
  実質的に長さを2進数でエンコードしています。
reviewed: false
