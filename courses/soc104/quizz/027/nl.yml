question: "Waarom begonnen klassieke liberalen in de Verenigde Staten zichzelf vanaf de jaren 1960 'libertarians' te noemen?"
answer: "Om zich te onderscheiden van Amerikaanse liberals, waarvan de betekenis was verschoven richting staatsinterventionisme"
wrong_answers:
  - "Om zich aan te sluiten bij de Democratische Partij en haar progressieve sociale programma's"
  - "Om hun steun voor Lyndon B. Johnsons Great Society-hervormingen te tonen"
  - "Om een radicalere revolutionaire identiteit aan te nemen, geïnspireerd door Europese socialistische bewegingen"
explanation: >-
  In de Verenigde Staten verschoof het woord 'liberal' naar de betekenis van aanhangers van Big Government en staatsinterventie, vooral na de New Deal en de Great Society. Klassieke liberalen namen het label 'libertarian' aan om de oorspronkelijke betekenis van hun filosofie te behouden. Ze namen afstand van Amerikaanse liberals, sloten zich niet bij hen aan.
reviewed: false
