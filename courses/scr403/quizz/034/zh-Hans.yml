question: 全加器对其两个半加器的进位位执行 OR，而不是 XOR。为什么 OR 是正确的？
answer: 对任意输入，最多只有一个半加器会产生进位，因此 OR 能精确合并两个互斥情形。
wrong_answers:
  - 两个进位位必须相加，而 OR 就是在 Simplicity 中执行单比特二进制加法的方式。
  - 分支之后，OR 是唯一类型仍然匹配环境的布尔运算符。
  - OR 对进位做过度近似；任何虚假的进位都会在最后的投影中被丢弃。
explanation: >-
  如果第一个半加器产生进位，那么它的两个输入位都是 1，
  所以它的和位是 0 —— 而输入 0 的半加器永远不会产生进位。
  因此这两个进位位永远不会同时为 1，OR 会精确地合并它们
  （在可达输入上，它甚至与 XOR 重合）。这种互斥性
  正是用两个半加器分解全加器之所以正确的原因。
reviewed: false
