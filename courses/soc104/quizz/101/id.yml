question: "Apa yang diidentifikasi kursus ini sebagai pembelahan politik yang sesungguhnya, melampaui spektrum kiri-kanan-tengah tradisional?"
answer: "Pembelahan antara prinsip filosofis fundamental: kebebasan atau koersi, persetujuan sukarela atau paksaan, individu yang bertanggung jawab atau kolektif"
wrong_answers:
  - "Pembelahan antara negara kaya dan miskin atas kendali perjanjian perdagangan internasional dan institusi keuangan global"
  - "Pembelahan antara populasi perkotaan dan pedesaan atas prioritas belanja pemerintah dan investasi infrastruktur"
  - "Pembelahan antara budaya progresif dan tradisional atas norma sosial, nilai keluarga, dan pendidikan agama"
explanation: >-
  Kursus ini berargumen bahwa pembelahan politik yang sesungguhnya tidak terletak pada label kiri-kanan-tengah tradisional, tetapi pada prinsip filosofis fundamental: kebebasan atau koersi, persetujuan sukarela atau paksaan, individu yang bertanggung jawab atau kolektif. Cara yang benar untuk memikirkan politik adalah memulai dari prinsip etis, bukan dari label.
reviewed: false
