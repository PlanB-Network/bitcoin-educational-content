question: Почему Simplicity использует статический анализ вместо динамической модели газа, как в Ethereum?
answer: Чтобы определить границы использования ресурсов до начала выполнения, обеспечивая предсказуемые затраты.
wrong_answers:
  - Потому что статический анализ просто гораздо быстрее реализовать разработчикам.
  - Потому что собственная модель газа Ethereum была запатентована и потому недоступна.
  - Потому что программы Simplicity слишком короткие, чтобы им вообще требовался учёт ресурсов.
explanation: >-
  Статический анализ Simplicity позволяет сети точно знать, сколько
  вычислений потребует программа, ещё до её запуска. Это устраняет
  непредсказуемость динамического учёта, предотвращает отказ в
  обслуживании через исчерпание ресурсов и позволяет узлам отклонять
  программы, превышающие лимиты, не тратя вычисления впустую.
reviewed: false
