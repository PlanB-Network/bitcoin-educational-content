question: "Какова либертарианская позиция по вопросу однополого брака?"
answer: "Государство не должно определять брак; его следует приватизировать и оставить индивидам, ассоциациям и религиозным институтам"
wrong_answers:
  - "Однополый брак следует легализовать, потому что все граждане заслуживают равного обращения перед законом"
  - "Однополый брак следует запретить, потому что традиционный брак является фундаментальным институтом для продолжения рода"
  - "Однополый брак следует легализовать, но только через отдельную правовую рамку, отличную от традиционного брака"
explanation: >-
  Либертарианцы утверждают, что вопрос брака изначально поставлен неверно, потому что он сформулирован в этатистских терминах. Они считают, что государству нечего вмешиваться в частную жизнь, поэтому решение состоит в полном отделении брака от государства. Навязывая единое определение, государство создаёт конфликты. Первый неверный ответ отражает социалистическую или центристскую позицию, а второй — консервативную позицию.
