question: "Mis on etatismi määratlus Nolani raamistikus?"
answer: "Seadusandluse kasutamine ühiskonna kontrollimiseks ja kujundamiseks, olgu seda tehtud tsivilisatsiooni, töölisklassi, looduse või rõhutute kaitsmise nimel"
wrong_answers:
  - "Valitsemissüsteem, kus valitud ametnikud teenivad kindlaksmääratud ametiaegu ja võim vahetub demokraatlike valimiste kaudu"
  - "Uskumus, et ainult tugev sõjavägi suudab kaitsta riigi suveräänsust ja territoriaalset terviklikkust"
  - "Majandusfilosoofia, mis seab tariifide ja kvootide kaudu riiklikud tööstusharud väliskonkurentsist ettepoole"
explanation: >-
  Etatismi määratletakse kui seadusandluse kasutamist ühiskonna kontrollimiseks ja kujundamiseks. Seda praktiseerivad nii vasak- kui ka parempoolsed: ühed tsivilisatsiooni kaitsmise nimel, teised töölisklassi, looduse või rõhutute kaitsmise nimel. Isegi tsentristid kiidavad selle heaks, kui see neile sobib. Etatism ei piirdu sõjanduspoliitika, kaubandusliku protektsionismi või lihtsalt valitud valitsuste olemasoluga.
