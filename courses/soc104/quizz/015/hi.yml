question: "दो-आयामी मॉडल यह क्यों तर्क देता है कि अधिकांश राजनीतिक मुद्दों को आर्थिक और व्यक्तिगत श्रेणियों में विभाजित किया जा सकता है?"
answer: "क्योंकि आर्थिक मुद्दे इस बात से संबंधित हैं कि आप उत्पादक और उपभोक्ता के रूप में क्या करते हैं, जबकि व्यक्तिगत मुद्दे आपके निजी संबंधों, विश्वासों, और शारीरिक स्वायत्तता से संबंधित हैं"
wrong_answers:
  - "क्योंकि सभी राजनीतिक बहसें अंततः कराधान स्तरों और धार्मिक प्रथाओं पर असहमतियों तक सिमट जाती हैं"
  - "क्योंकि सरकारें ऐतिहासिक रूप से केवल दो चीज़ों को विनियमित करती रही हैं: बाज़ार और सेना"
  - "क्योंकि राजनीतिक दार्शनिकों ने प्राचीन काल से हमेशा भौतिक चिंताओं को आध्यात्मिक चिंताओं से अलग किया है"
explanation: >-
  दो-आयामी मॉडल इस विचार पर आधारित है कि राजनीतिक मुद्दे दो व्यापक श्रेणियों में विभाजित होते हैं। आर्थिक स्वतंत्रताएँ उत्पादन, उपभोग, व्यापार, रोज़गार, और धन प्रबंधन को कवर करती हैं। व्यक्तिगत स्वतंत्रताएँ निजी संबंधों, राय, विश्वासों, और अपने शरीर तथा मन के बारे में विकल्पों को कवर करती हैं। यह विभाजन राजनीतिक स्थितियों का एकल बाएँ-दाएँ अक्ष की तुलना में कहीं अधिक सूक्ष्म मानचित्रण संभव बनाता है।
reviewed: false
