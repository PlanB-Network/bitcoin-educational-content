question: "在槍械管制問題上，保守主義者與自由至上主義者立場的關鍵差異是什麼？"
answer: "兩者都接受某種管制，但保守主義者希望規則來自正當的公共權威，而自由至上主義者希望規則由直接相關者產生，例如公民協會與市場競爭"
wrong_answers:
  - "保守主義者反對所有槍械管制，而自由至上主義者為了公共安全接受嚴格政府控制"
  - "保守主義者希望完全禁止槍械，而自由至上主義者支持對所有武器不受限制的取得"
  - "保守主義者將其立場建立在個人權利上，而自由至上主義者將其立場建立在集體責任上"
explanation: >-
  保守主義者與自由至上主義者都同意，攜帶武器需要某種形式的規範。關鍵差異在於誰建立這些規則。保守主義者堅持，管制必須來自負責守護共同善的公共權威（自上而下）。自由至上主義者則主張，規範應由直接相關者產生：安全專業人士、公民協會與市場競爭（自下而上）。
reviewed: false
