question: "ใครมักถูกอ้างว่าเป็นผู้ก่อตั้งอนุรักษนิยมสมัยใหม่?"
answer: "Edmund Burke ผู้สนับสนุนการรักษาสถาบันและจารีตไว้เพื่อต้านการเปลี่ยนแปลงแบบถอนรากของการปฏิวัติฝรั่งเศส"
wrong_answers:
  - "Karl Marx ผู้พัฒนาทฤษฎีการต่อสู้ทางชนชั้นและวัตถุนิยมประวัติศาสตร์ในศตวรรษที่สิบเก้า"
  - "John Locke ผู้วางทฤษฎีสิทธิตามธรรมชาติและสัญญาประชาคมในศตวรรษที่สิบเจ็ด"
  - "Adam Smith ผู้เขียน The Wealth of Nations และวางรากฐานสาขาเศรษฐศาสตร์คลาสสิก"
explanation: >-
  Edmund Burke มักถูกอ้างว่าเป็นผู้ก่อตั้งอนุรักษนิยมจากการคัดค้านการปฏิวัติฝรั่งเศส งาน Reflections on the Revolution in France (1790) ของเขาเชิดชูความรอบคอบและการปฏิรูปแบบค่อยเป็นค่อยไปเหนือการเปลี่ยนแปลงแบบถอนราก เขาเชื่อว่าสังคมควรก้าวหน้าไม่ใช่ด้วยการล้างกระดานใหม่ แต่ผ่านการปฏิรูปทีละขั้นที่รักษาสถาบันและจารีตที่ผ่านการทดสอบมาแล้ว
reviewed: false
