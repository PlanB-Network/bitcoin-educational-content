question: "Apa ketidaksepakatan utama antara kaum libertarian dan keluarga politik lain ketika mereka berbagi tujuan yang sama?"
answer: "Ketidaksepakatan itu mengenai sarana: kaum libertarian menolak solusi koersif dan memilih pertukaran sukarela melalui proses pasar"
wrong_answers:
  - "Ketidaksepakatan itu mengenai tujuan akhir: kaum libertarian mengejar tujuan yang berbeda seperti kekayaan individu alih-alih kesejahteraan sosial"
  - "Ketidaksepakatan itu mengenai waktu: kaum libertarian ingin mencapai tujuan yang sama secara lebih lambat melalui reformasi bertahap"
  - "Ketidaksepakatan itu mengenai cakupan: kaum libertarian ingin menerapkan kebijakan yang sama hanya pada tingkat lokal alih-alih nasional"
explanation: >-
  Kaum libertarian dapat sepakat dengan sosialis, konservatif, dan sentris mengenai tujuan tertentu seperti membela yang tertindas atau mempromosikan kohesi sosial. Ketidaksepakatan tidak terletak pada tujuan akhir melainkan pada sarana. Kaum libertarian menolak semua solusi koersif yang berupaya menyeragamkan praktik dan regulasi, dan sebaliknya membela kekuatan pilihan serta kebebasan yang bertanggung jawab melalui pertukaran bebas dan terdesentralisasi yang berlandaskan kontrak sukarela.
