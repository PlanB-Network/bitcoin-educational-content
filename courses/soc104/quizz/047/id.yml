question: "Siapa yang sering disebut sebagai figur pendiri konservatisme modern?"
answer: "Edmund Burke, yang menganjurkan pelestarian institusi dan tradisi melawan perubahan radikal Revolusi Prancis"
wrong_answers:
  - "Karl Marx, yang mengembangkan teori perjuangan kelas dan materialisme historis pada abad kesembilan belas"
  - "John Locke, yang merumuskan teori hak kodrati dan kontrak sosial pada abad ketujuh belas"
  - "Adam Smith, yang menulis The Wealth of Nations dan mendirikan disiplin ekonomi klasik"
explanation: >-
  Edmund Burke sering disebut sebagai figur pendiri konservatisme karena penentangannya terhadap Revolusi Prancis. Karyanya Reflections on the Revolution in France (1790) mengunggulkan kehati-hatian dan reformasi bertahap dibanding perubahan radikal. Ia percaya masyarakat seharusnya maju bukan dengan membuat papan tulis bersih, melainkan melalui reformasi inkremental yang mempertahankan institusi dan tradisi yang telah teruji.
