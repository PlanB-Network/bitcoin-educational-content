question: "راهبردهای برچیدن دولت میان لیبرتِرها و لیبرترین‌ها چه تفاوتی دارد؟"
answer: "لیبرتِرها از نظر تاریخی طرفدار نابودی خشونت‌آمیز بوده‌اند، در حالی که لیبرترین‌ها می‌کوشند دولت را از راه آموزش و نافرمانی مدنی از مشروعیت بیندازند"
wrong_answers:
  - "لیبرتِرها از انتخابات دموکراتیک برای برچیدن دولت استفاده می‌کنند، در حالی که لیبرترین‌ها انقلاب مسلحانه و اقدام مستقیم را ترجیح می‌دهند"
  - "لیبرتِرها بر ساختن جوامع جایگزین تمرکز می‌کنند، در حالی که لیبرترین‌ها در چارچوب نظام سیاسی موجود برای تصویب اصلاحات کار می‌کنند"
  - "هم لیبرتِرها و هم لیبرترین‌ها توافق دارند که اعتراض مسالمت‌آمیز تنها ابزار مشروع دگرگونی اجتماعی است"
explanation: >-
  لیبرتِرها از نظر تاریخی از نابود کردن دولت و سرمایه‌داری از راه خشونت، از جمله ترور و حملات هدفمند، دفاع کرده‌اند. در مقابل، لیبرترین‌ها خشونت تهاجمی را نامشروع می‌دانند. راهبرد آنان بر از مشروعیت انداختن دولت از راه استدلال، مناظره، آموزش و نافرمانی مدنی استوار است. این رویکردهای اساساً متفاوت به تغییر، اختلافات فلسفی عمیق‌تر آنان را بازتاب می‌دهد.
reviewed: false
