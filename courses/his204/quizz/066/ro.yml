question: În ce domeniu de activitate operează Dupont de Nemours et Cie, companie fondată de fiul economistului francez?
answer: Chimie și biologie
wrong_answers:
  - Bancă și asigurări
  - Textile
  - Industria alimentară
explanation: |
  Dupont de Nemours este o companie de chimie și biologie fondată de fiul economistului Pierre-Samuel Dupont de Nemours.
