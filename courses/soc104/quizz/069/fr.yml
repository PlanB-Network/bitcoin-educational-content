question: "Pourquoi la position libertarienne sur la légalisation des drogues s'accompagne-t-elle de la condition que le rôle de l'État dans la société soit réduit ?"
answer: "Parce qu'une libéralisation prise en charge par l'État remplacerait la responsabilité individuelle par une prise en charge gérée par le gouvernement, alors que les libertariens veulent que les citoyens assument les conséquences de leurs choix avec le soutien d'associations privées"
wrong_answers:
  - "Parce qu'une légalisation contrôlée par l'État générerait trop de recettes fiscales, rendant le gouvernement excessivement puissant et corrompu"
  - "Parce que l'État imposerait des normes de qualité qui feraient monter les prix et recréeraient des marchés noirs"
  - "Parce que la réglementation gouvernementale des drogues violerait les accords commerciaux internationaux et les relations diplomatiques"
explanation: >-
  Les libertariens soutiennent la libéralisation des drogues, mais insistent pour que le rôle de l'État soit réduit, car leur objectif est de restaurer la responsabilité individuelle, non d'étendre la gestion étatique. Si quelqu'un devient dépendant, il doit en assumer la responsabilité plutôt que demander à l'État de fournir une prise en charge. La solution à l'addiction réside dans l'initiative privée : soutien volontaire d'individus, de familles et d'associations caritatives. Une légalisation gérée par l'État contredirait le principe libertarien fondamental de responsabilité personnelle.
reviewed: false
