question: "چرا مقادیر witness از Commitment Merkle Root (CMR) کنار گذاشته می‌شوند؟"
answer: تا آدرس‌ها پیش از معلوم بودن witnessها شکل بگیرند، و شاخه‌های استفاده‌نشده به‌صورت خصوصی هرس شوند.
wrong_answers:
  - چون مقادیر witness به‌سادگی بیش از حد بزرگ‌اند که در یک hash 256 بیتی گنجانده شوند.
  - چون مقادیر witness کاملاً جداگانه توسط اثر Failure اعتبارسنجی می‌شوند.
  - چون گنجاندن مقادیر witness، CMR را غیرقطعی می‌کند.
explanation: >-
  عبارت‌های witness (مانند امضاها) در زمان خرج کردن ارائه می‌شوند، نه در زمان ایجاد آدرس.
  کنار گذاشتن آن‌ها از CMR دو ویژگی مهم را ممکن می‌سازد: آدرس‌ها می‌توانند پیش از
  وجود داشتن تراکنش خرج ساخته شوند، و شاخه‌های شرطی اجرا‌نشده می‌توانند از داده
  on-chain هرس شوند، بدون اینکه مقادیر witness وابسته به آن‌ها فاش شود.
reviewed: true
