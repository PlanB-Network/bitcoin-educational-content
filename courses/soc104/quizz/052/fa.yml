question: "اصل عدم تجاوز چه می‌گوید؟"
answer: "شخص آزاد است هرگونه که می‌خواهد عمل کند، تا زمانی که علیه جان، آزادی، یا مالکیت دیگری خشونتی مرتکب نشود"
wrong_answers:
  - "دولت برای حفظ نظم اجتماعی حق انحصاری استفاده از زور را دارد"
  - "شهروندان باید از حکم اکثریت تبعیت کنند، حتی زمانی که آزادی‌های فردی را محدود می‌کند"
  - "آزادی عمل فقط زمانی مجاز است که به خیر جمعی جامعه سود برساند"
explanation: >-
  اصل عدم تجاوز سنگ‌بنای سیاست لیبرتارین است و بیان می‌کند که افراد می‌توانند آزادانه عمل کنند، به شرط آن‌که علیه جان، آزادی، یا مالکیت دیگران خشونت مرتکب نشوند. این اصل قاعده طلاییِ موجود در تمدن‌های گوناگون را به یاد می‌آورد. برخلاف گزینه‌های دیگر، به دولت اقتدار اخلاقی ویژه‌ای نمی‌دهد و حقوق فردی را تابع منفعت جمعی نمی‌کند.
reviewed: false
