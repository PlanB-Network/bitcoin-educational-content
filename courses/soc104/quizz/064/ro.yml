question: "Cum au diferit abordările economice ale Germaniei lui Hitler și ale Uniunii Sovietice a lui Stalin, în ciuda metodelor lor totalitare comune?"
answer: "Germania nazistă a păstrat aparența proprietății private, subordonând sectorul privat obiectivelor statului, în timp ce stalinismul a abolit orice proprietate privată și a planificat complet economia"
wrong_answers:
  - "Germania nazistă a naționalizat complet toate industriile, în timp ce regimul lui Stalin a permis întreprinderea privată limitată în agricultură"
  - "Germania nazistă a promovat comerțul internațional liber pentru a finanța reînarmarea, în timp ce stalinismul a impus izolarea economică totală"
  - "Germania nazistă s-a bazat pe cooperarea voluntară a corporațiilor cu statul, în timp ce stalinismul a folosit doar munca forțată"
explanation: >-
  Deși ambele regimuri au folosit metode politice identice (cultul personalității, supravegherea totală, eliminarea sistematică a opoziției), modelele lor economice au diferit ca formă. Germania nazistă nu a abolit formal proprietatea privată, dar a subordonat complet sectorul privat obiectivelor statului, precum războiul și reînarmarea, impunând autarhie economică. Stalinismul a mers mai departe, abolind orice proprietate privată, implementând planuri cincinale și controlând direct întreaga producție și distribuție.
reviewed: false
