question: "Koja je definicija etatizma kako je predstavljena u Nolanovom okviru?"
answer: "Korišćenje zakonodavstva za kontrolu i oblikovanje društva, bilo u ime odbrane civilizacije, radničke klase, prirode ili potlačenih"
wrong_answers:
  - "Sistem vlasti u kojem izabrani zvaničnici služe fiksne mandate, a vlast se prenosi demokratskim izborima"
  - "Uverenje da samo snažna vojska može zaštititi suverenitet i teritorijalni integritet nacije"
  - "Ekonomska filozofija koja daje prednost nacionalnim industrijama nad stranom konkurencijom kroz carine i kvote"
explanation: >-
  Etatizam se definiše kao korišćenje zakonodavstva za kontrolu i oblikovanje društva. I levica i desnica ga praktikuju: jedni u ime odbrane civilizacije, drugi u ime odbrane radničke klase, prirode ili potlačenih. Čak ga i centristi odobravaju kada im odgovara. Etatizam nije ograničen na vojnu politiku, trgovinski protekcionizam ili puko postojanje izabranih vlada.
reviewed: false
