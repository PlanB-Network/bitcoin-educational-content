question: "Какое фундаментальное разделение отделило социалистов друг от друга с начала XX века?"
answer: "Революционные социалисты, стремившиеся захватить власть через насилие, против социалистов-реформистов, добивавшихся изменений через демократические выборы"
wrong_answers:
  - "Городские социалисты, сосредоточенные на промышленных рабочих, против сельских социалистов, организовывавших аграрные коммуны"
  - "Националистические социалисты, ставившие в приоритет собственную страну, против интернационалистских социалистов, выступавших за мировую революцию"
  - "Интеллектуальные социалисты, писавшие теоретические тексты, против социалистов-активистов, организовывавших рабочие забастовки"
explanation: >-
  С начала XX века фундаментальное разделение отделило революционных социалистов, которые выступали против прав собственности и стремились уничтожить капиталистическое общество через насилие или диктатуру пролетариата, от социалистов-реформистов, которые добивались социальной справедливости через демократические выборы и налогообложение, временно принимая капитализм. Этот раскол сформировал всю последующую историю социалистических движений.
