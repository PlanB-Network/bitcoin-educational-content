question: ආර්ථික විද්‍යාවේ ආරම්භකයා ලෙස Cantillon හැඳින්වූයේ කවුද?
answer: Murray Rothbard
wrong_answers:
  - Joseph A. Schumpeter
  - Mark Blaug
  - Adam Smith
explanation: |
  Austrian schoolහි ආර්ථික විද්‍යාඥයෙකු වූ Murray Rothbard, Richard Cantillon ආර්ථික විද්‍යාවේ ආරම්භකයා ලෙස හැඳින්වූයේ ඔහුගේ නවෝත්පාදක ප්‍රවේශය සහ ආර්ථික න්‍යායට කළ වැදගත් දායකත්වය නිසාය.