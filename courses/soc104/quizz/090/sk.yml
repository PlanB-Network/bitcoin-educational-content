question: "Prečo Popper tvrdí, že otvorená spoločnosť zostáva napriek svojim výhodám vo svojej podstate krehká?"
answer: "Pretože zodpovednosť, ktorú individualizmus predpokladá, sa môže zdať desivá a vytvára pokušenie hľadať útočisko v komunitnej ochrane, autorite alebo nostalgii za idealizovanou minulosťou"
wrong_answers:
  - "Pretože otvorené spoločnosti nemajú vojenskú silu a nedokážu sa brániť proti invázii uzavretých spoločností"
  - "Pretože demokratické inštitúcie sú vo svojej podstate neefektívne a napokon sa zrútia pod ťarchou byrokratickej zložitosti"
  - "Pretože otvorené spoločnosti umožňujú príliš veľkú ekonomickú nerovnosť, čo nevyhnutne vedie k revolúcii a nastoleniu autoritárskych režimov"
explanation: >-
  Popper zdôrazňuje, že krehkosť otvorenej spoločnosti pramení z psychologickej zraniteľnosti. Zodpovednosť, ktorú individualizmus predpokladá, sa môže zdať desivá a riskantná, pretože človek musí robiť vlastné rozhodnutia a môže zlyhať. To vytvára pokušenie hľadať útočisko v komunitnej ochrane alebo nostalgických tendenciách k idealizovanej minulosti. Otvorená spoločnosť čelí pretrvávajúcim výzvam zo strany komunitaristických impulzov a opakujúceho sa pokušenia násilia.
