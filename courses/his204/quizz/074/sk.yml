question: V ktorej otázke získal Turgot Diderotovu podporu?
answer: Sloboda práce a zrušenie cechov
wrong_answers:
  - Sloboda obchodu s obilím
  - Sloboda úročených pôžičiek
  - Reforma školstva
explanation: |
  Diderot podporil Turgota v otázke slobody práce a zrušenia cechov, pretože veril, že tieto opatrenia sú potrebné na stimuláciu hospodárstva a podporu spoločenského pokroku.
