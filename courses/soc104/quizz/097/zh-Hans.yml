question: "Eric Hughes 1993 年 Cypherpunk 宣言关于隐私的核心信息是什么？"
answer: "在电子时代，隐私对于一个开放社会至关重要，个人必须自己构建隐私，而不是期待政府或公司来保障它"
wrong_answers:
  - "隐私是一种奢侈品，必须为了国家安全和保护民主制度而牺牲"
  - "隐私应由国际条约监管，以在所有国家之间建立统一的数据保护标准"
  - "隐私只对犯罪分子和异见者重要，而守法公民会从透明监控系统中受益"
explanation: >-
  Eric Hughes 1993 年的宣言指出，在电子时代，隐私对于一个开放社会至关重要，而且我们不能期待政府、公司或其他大型组织来保障它。根本动机是，机密性是自由的关键要素，必须由个人自己构建，而不是作为来自制度的礼物来等待。
reviewed: false
