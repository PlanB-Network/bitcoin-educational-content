bio: |
  MIT Bitcoin Club este unul dintre primele cluburi de blockchain din lume, fondat pentru a-i educa pe membri despre fundamentele și cele mai recente inovații din tehnologia blockchain. Condus de studenți de licență și master de la MIT, clubul se concentrează pe sistemele distribuite cu minimizarea încrederii, efectele lor socioeconomice și aplicațiile practice. Clubul organizează MIT Bitcoin Expo, una dintre cele mai mari conferințe academice despre blockchain, și un Hackathon Bitcoin anual.

short_bio: Organizație studențească de Bitcoin și blockchain la MIT
