question: "最低賃金について、保守主義者とリバタリアンはいずれも廃止に賛成しているにもかかわらず、その理由づけはどのように異なりますか？"
answer: "保守主義者は競争力を妨げない限り賃金設定への国家の関与をある程度受け入れる一方、リバタリアンは最低賃金を雇用と事業活動の自由に対する道徳的な押しつけと見なす"
wrong_answers:
  - "保守主義者は最低賃金がインフレを生むため反対し、リバタリアンは労働組合に過大な力を与えるため反対する"
  - "保守主義者は賃金を宗教団体と地域共同体が決めることを望み、リバタリアンは政府承認の市場調査によって賃金を決めることを望む"
  - "保守主義者は最低賃金は地域ごとに異なるべきだと考え、リバタリアンは全国で単一の固定賃金が適用されるべきだと考える"
explanation: >-
  両者はいずれも最低賃金の削減または廃止に賛成しますが、その理由づけは根本的に異なります。保守主義者は、賃金設定への国家の関与をある程度受け入れつつ、それが最小限で文脈に依存したものにとどまるべきだと主張し、競争力に焦点を当てます。リバタリアンはより強い道徳的立場を取ります。最低賃金は、雇用と事業活動の自由への押しつけです。リバタリアンが「市場」と言うとき、それは国家の干渉なしに、二者間で自由に交渉された契約を意味します。
reviewed: false
