question: "Co odhaluje Mussoliniho prohlášení z roku 1920 ‚Všechno ve státě, nic mimo stát, nic proti státu‘ o totalitarismu?"
answer: "Už neexistuje žádné oddělení mezi veřejným a soukromým prostorem, protože stát zcela pohlcuje společnost"
wrong_answers:
  - "Stát se soustředí výhradně na vojenskou moc, zatímco ekonomiku ponechává soukromému podnikání"
  - "Občané se mohou svobodně soukromě organizovat, pokud otevřeně nekritizují vládu"
  - "Vláda kontroluje pouze politickou činnost, zatímco kulturní a náboženský život zůstávají autonomní"
explanation: >-
  Mussoliniho prohlášení vystihuje podstatu totalitarismu: totalitu. Všechno je pohlceno státem, což znamená, že neexistuje oddělení mezi veřejným a soukromým prostorem. Společnost ztrácí veškerou formu autonomie, až po ty nejvšednější činnosti, jako je otevření sportovního klubu. To jde daleko za kontrolu pouze vojenské, politické nebo ekonomické sféry.
