question: "Prečo sa klasickí liberáli v Spojených štátoch začali od 60. rokov nazývať 'libertarians'?"
answer: "Aby sa odlíšili od amerických liberals, pri ktorých sa význam pojmu posunul smerom k štátnemu intervencionizmu"
wrong_answers:
  - "Aby sa zosúladili s Demokratickou stranou a jej progresívnymi sociálnymi programami"
  - "Aby signalizovali podporu reformám Great Society Lyndona B. Johnsona"
  - "Aby prijali radikálnejšiu revolučnú identitu inšpirovanú európskymi socialistickými hnutiami"
explanation: >-
  V Spojených štátoch sa slovo 'liberal' posunulo k významu zástancov Big Government a štátneho zásahu, najmä po New Deal a Great Society. Klasickí liberáli prijali nálepku 'libertarian', aby zachovali pôvodný význam svojej filozofie. Od amerických liberals sa dištancovali, nie sa s nimi zosúlaďovali.
reviewed: false
