question: "Welk consistente patroon onderscheidt in alle vijf economische debatten (belastingen, minimumloon, gezondheidszorg, milieu, subsidies) de centristische methode van de standpunten van andere politieke families?"
answer: "Centristen weigeren zich vast te leggen op een vast principe en eisen in plaats daarvan empirische analyse en deskundige evaluatie om beleid per geval te bepalen, waardoor hun benadering inherent technocratisch is"
wrong_answers:
  - "Centristen nemen altijd een middenpositie in tussen de socialistische en conservatieve standpunten, waarbij ze bij elk onderwerp het verschil gelijk verdelen"
  - "Centristen geven consequent prioriteit aan economische groei boven sociaal welzijn, waarbij ze zich bij fiscaal beleid aansluiten bij libertariërs en het bij regulering eens zijn met socialisten"
  - "Centristen laten alle economische beslissingen over aan internationale organisaties en handelsovereenkomsten in plaats van onafhankelijk nationaal beleid te maken"
explanation: >-
  In alle vijf economische debatten volgt de centristische benadering hetzelfde patroon: in plaats van zich vast te leggen op een vast ideologisch principe, eisen centristen empirisch bewijs en deskundige evaluatie voordat ze beslissingen nemen. Bij belastingen moet het juiste niveau door analyse worden bepaald. Bij het minimumloon moet het niveau pragmatisch worden aangepast. Bij gezondheidszorg is een door experts gekalibreerde mengvorm ideaal. Bij milieu moet beleid concurrentievermogen in evenwicht houden. Bij subsidies moet elk geval op zijn eigen merites worden geëvalueerd. Dit maakt centrisme inherent technocratisch, wat verschilt van simpelweg het verschil delen of zich voegen naar internationale organen.
reviewed: false
