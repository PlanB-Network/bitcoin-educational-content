question: "Vad säger icke-aggressionsprincipen?"
answer: "En person är fri att handla som den vill så länge inget våld begås mot en annans liv, frihet eller egendom"
wrong_answers:
  - "Staten har ensamrätt att använda våld för att upprätthålla social ordning"
  - "Medborgare måste underkasta sig majoritetsstyre även när det begränsar individuella friheter"
  - "Handlingsfrihet är tillåten endast när den gynnar samhällets kollektiva bästa"
explanation: >-
  Icke-aggressionsprincipen är en hörnsten i libertariansk politik och säger att individer får handla fritt förutsatt att de inte begår våld mot andras liv, frihet eller egendom. Den påminner om den gyllene regeln som finns i civilisationer världen över. Till skillnad från de andra alternativen ger den inte staten någon särskild moralisk auktoritet och underordnar inte individuella rättigheter kollektiv nytta.
reviewed: false
