question: Ce națiuni propune Vincent de Gournay drept modele?
answer: Anglia și Olanda
wrong_answers:
  - Olanda și Elveția
  - Scoția și Anglia
  - Spania și Portugalia
explanation: |
  Gournay admira sistemele economice ale Angliei și Olandei, care erau mai liberale și mai favorabile comerțului decât cel al Franței.
