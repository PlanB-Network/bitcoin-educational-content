question: "Почему либертарианцы выступают против налогообложения?"
answer: "Потому что это моральное нарушение прав собственности, форма государственного воровства, при которой чужая собственность изымается без согласия"
wrong_answers:
  - "Потому что налоги экономически неэффективны и всегда приводят к более высоким уровням безработицы"
  - "Потому что налогообложение сдерживает иностранные инвестиции и ослабляет конкурентную позицию страны"
  - "Потому что прогрессивные налоговые системы несправедливо нацелены на богатых людей, которые создают больше всего рабочих мест"
explanation: >-
  Либертарианское возражение против налогообложения является моральным прежде, чем экономическим. Либертарианцы рассматривают налогообложение как форму государственного воровства и препятствие частной собственности, потому что оно состоит в изъятии чужой собственности без согласия. Хотя против налогообложения могут существовать экономические аргументы, фундаментальный либертарианский аргумент опирается на принцип, что оно нарушает права собственности, а не на расчёты эффективности или конкурентоспособности.
