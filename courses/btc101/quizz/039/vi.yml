question: Mục đích đằng sau việc tạo ra Bitcoin là gì?
answer: Tách tiền tệ khỏi Nhà nước.
wrong_answers:
  - Loại bỏ tiêu chuẩn vàng.
  - Làm cho giao dịch nhanh chóng và rẻ hơn.
  - Làm cho mọi người trở nên giàu có.
explanation: |
  Bitcoin được tạo ra với mục tiêu tách tiền tệ khỏi Nhà nước. Đây là một phản ứng đối với những thách thức hệ thống của hệ thống tài chính hiện tại, nơi mà Nhà nước có quyền kiểm soát hoàn toàn nguồn tiền tệ và có thể thao túng tiền tệ để phục vụ mục tiêu chính trị của mình.
reviewed: true