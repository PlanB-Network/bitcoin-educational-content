question: "En quoi les approches économiques de l'Allemagne de Hitler et de l'Union soviétique de Staline différaient-elles, malgré leurs méthodes totalitaires communes ?"
answer: "L'Allemagne nazie maintenait une apparence de propriété privée tout en subordonnant le secteur privé aux objectifs de l'État, tandis que le stalinisme abolissait toute propriété privée et planifiait entièrement l'économie"
wrong_answers:
  - "L'Allemagne nazie a entièrement nationalisé toutes les industries, tandis que le régime de Staline a autorisé une entreprise privée limitée dans l'agriculture"
  - "L'Allemagne nazie a promu le libre-échange international pour financer le réarmement, tandis que le stalinisme a imposé un isolement économique complet"
  - "L'Allemagne nazie s'appuyait sur une coopération volontaire des entreprises avec l'État, tandis que le stalinisme n'utilisait que le travail forcé"
explanation: >-
  Bien que les deux régimes aient utilisé des méthodes politiques identiques (culte de la personnalité, surveillance totale, élimination systématique de l'opposition), leurs modèles économiques différaient par la forme. L'Allemagne nazie n'a pas formellement aboli la propriété privée, mais elle a complètement subordonné le secteur privé aux objectifs de l'État, comme la guerre et le réarmement, en imposant l'autarcie économique. Le stalinisme est allé plus loin en abolissant toute propriété privée, en mettant en œuvre des plans quinquennaux et en contrôlant directement toute la production et la distribution.
