question: "Hoe gaat een cultureel conservatieve libertariër om met gedragingen die hij moreel afkeurt?"
answer: "Hij verzet zich tegen die gedragingen en ontmoedigt ze via overtuiging en voorbeeld, maar zonder zijn toevlucht te nemen tot de dwingende kracht van de wet"
wrong_answers:
  - "Hij steunt lokale overheidsverboden op die gedragingen, terwijl hij verboden op federaal niveau afwijst"
  - "Hij zwijgt volledig over die gedragingen, omdat hij gelooft dat elke vorm van afkeuring individuele vrijheid schendt"
  - "Hij pleit voor gemeenschapstribunalen die die gedragingen buiten het formele rechtssysteem kunnen bestraffen"
explanation: >-
  De cultureel conservatieve libertariër kan bepaalde gedragingen moreel afkeuren, maar pleit niet voor een wettelijk verbod op vrijwillige, niet-agressieve handelingen. Hij kan zulke handelingen afkeuren, zich ertegen verzetten en ze actief ontmoedigen, maar altijd via overtuiging, onderwijs en voorbeeld in plaats van via de dwingende kracht van de wet. Dit gaat niet over zwijgen of het creëren van alternatieve handhavingsmechanismen.
reviewed: false
