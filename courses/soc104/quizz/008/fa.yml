question: "دستهٔ آزادی شخصی شامل چه چیزهایی می‌شود؟"
answer: "آنچه در روابط خصوصی خود، با نظرات، باورها، و هر چیزی که به بدن و ذهن خودتان مربوط است انجام می‌دهید"
wrong_answers:
  - "آنچه به عنوان تولیدکننده انجام می‌دهید، از جمله راه‌اندازی کسب‌وکار، استخدام کارکنان، و تجارت کالاها"
  - "اینکه چقدر مالیات می‌پردازید، چه سرمایه‌گذاری‌هایی انجام می‌دهید، و چگونه دارایی‌های مالی خود را مدیریت می‌کنید"
  - "توانایی شما برای رقابت در بازار، تعیین قیمت محصولاتتان، و انتخاب تأمین‌کنندگانتان"
explanation: >-
  آزادی شخصی شامل آنچه در روابط خصوصی خود، با نظرات و باورهایتان، و هر چیزی که به بدن و ذهن خودتان مربوط است انجام می‌دهید می‌شود. این شامل ازدواج، انتخاب‌های مطالعه، اعمال دینی، انتخاب‌های غذایی و دارویی، و اینکه با چه کسانی معاشرت می‌کنید است. فعالیت‌های کسب‌وکار، مالیات‌ها، و تصمیم‌های بازار ذیل آزادی اقتصادی قرار می‌گیرند.
reviewed: false
