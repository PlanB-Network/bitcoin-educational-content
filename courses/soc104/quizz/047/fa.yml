question: "اغلب چه کسی به‌عنوان چهره بنیان‌گذار محافظه‌کاری مدرن ذکر می‌شود؟"
answer: "ادموند برک، که از حفظ نهادها و سنت‌ها در برابر تغییرات رادیکال انقلاب فرانسه دفاع می‌کرد"
wrong_answers:
  - "کارل مارکس، که نظریه مبارزه طبقاتی و ماتریالیسم تاریخی را در سده نوزدهم توسعه داد"
  - "جان لاک، که نظریه حقوق طبیعی و قرارداد اجتماعی را در سده هفدهم صورت‌بندی کرد"
  - "آدام اسمیت، که ثروت ملل را نوشت و رشته اقتصاد کلاسیک را بنیان گذاشت"
explanation: >-
  ادموند برک اغلب به‌سبب مخالفتش با انقلاب فرانسه به‌عنوان چهره بنیان‌گذار محافظه‌کاری ذکر می‌شود. کتاب او، تأملاتی درباره انقلاب در فرانسه (1790)، از دوراندیشی و اصلاح تدریجی در برابر تغییر رادیکال دفاع می‌کرد. او باور داشت جامعه نباید با پاک کردن کامل گذشته، بلکه از طریق اصلاحات تدریجی‌ای پیش برود که نهادها و سنت‌های آزموده‌شده را حفظ می‌کنند.
