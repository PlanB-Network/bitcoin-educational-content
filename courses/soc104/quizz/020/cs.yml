question: "Co svislá osa Nolanova diagramu odhaluje o skutečné politické otázce?"
answer: "Odhaluje, zda chcete své vlastní citlivosti vnucovat druhým prostřednictvím státu, nebo zda dáváte přednost tomu, aby každý člověk mohl svobodně rozhodovat sám za sebe"
wrong_answers:
  - "Odhaluje, zda podporujete demokratickou vládu, nebo dáváte přednost autoritářské vládě jediného vůdce"
  - "Odhaluje, zda se ztotožňujete s progresivními sociálními hnutími, nebo s tradičními náboženskými institucemi"
  - "Odhaluje, zda je vaší hlavní starostí národní bezpečnost, nebo ekonomická prosperita"
explanation: >-
  Svislá osa odkrývá skutečnou politickou otázku: nikoli to, zda jste levice, nebo pravice, ale do jaké míry chcete, aby stát zasahoval do utváření společnosti podle vašich hodnot. Přejete si vnucovat své citlivosti druhým, nebo dáváte přednost tomu, aby každý člověk mohl svobodně rozhodovat sám za sebe? Tento rámec překračuje dělení levice–pravice a ukazuje, že oba tábory mohou být stejně etatistické.
reviewed: false
