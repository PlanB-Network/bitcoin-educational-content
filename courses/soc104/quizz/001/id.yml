question: "Dari mana asal-usul pembagian politik kiri-kanan?"
answer: "Dari susunan tempat duduk selama perdebatan Revolusi Prancis tahun 1789"
wrong_answers:
  - "Dari tulisan Karl Marx dan Adam Smith pada abad kesembilan belas"
  - "Dari Perang Saudara Amerika antara negara-negara bagian Utara dan Selatan"
  - "Dari para filsuf Pencerahan yang memisahkan akal dari tradisi"
explanation: >-
  Pembagian kiri-kanan berasal dari tahun 1789, ketika para deputi di Majelis Nasional Prancis yang mendukung dipertahankannya kekuasaan raja duduk di sebelah kanan presiden, sementara mereka yang ingin membatasi kekuasaannya duduk di sebelah kiri. Pembagian ini tidak berasal dari Marx dan Smith, Perang Saudara Amerika, atau filsafat Pencerahan.
reviewed: false
