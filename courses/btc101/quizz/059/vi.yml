question: Điều nào sau đây không phải là đặc điểm của Bitcoin?
answer: Bitcoin dễ bị kiểm duyệt.
wrong_answers:
  - Bitcoin có thể được vận chuyển tức thì.
  - Bitcoin có chi phí xác minh không đáng kể.
  - Bitcoin có một chính sách tiền tệ cố định.
explanation: |
  Bitcoin có tất cả các đặc điểm cần thiết để trở thành một loại tiền tệ hữu hiệu và không bị lũng đoạn: có thể chia nhỏ, có thể vận chuyển tức thì, không thể kiểm duyệt, chi phí xác minh không đáng kể, và với một chính sách tiền tệ đã được thiết lập cho hàng thế kỷ tới với 21 triệu đơn vị.
reviewed: true