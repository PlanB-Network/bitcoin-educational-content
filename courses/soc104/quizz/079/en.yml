question: "What is the key disagreement between libertarians and other political families when they share the same objectives?"
answer: "The disagreement is about means: libertarians reject coercive solutions and favor voluntary exchange through the market process"
wrong_answers:
  - "The disagreement is about ends: libertarians pursue different goals such as individual wealth rather than social welfare"
  - "The disagreement is about timing: libertarians want to achieve the same goals more slowly through gradual reform"
  - "The disagreement is about scope: libertarians want to apply the same policies only at local rather than national levels"
explanation: >-
  Libertarians can agree with socialists, conservatives, and centrists on certain objectives like defending the oppressed or promoting social cohesion. The disagreement lies not in ends but in means. Libertarians reject all coercive solutions that seek to uniformize practices and regulations, instead defending the power of choice and responsible freedom through free, decentralized exchange founded on voluntary contracts.
reviewed: false
