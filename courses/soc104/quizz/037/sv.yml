question: "Vad fokuserar en strukturell definition av ett politiskt system på?"
answer: "Hur systemet faktiskt fungerar och dess observerbara kännetecken, såsom graden av statlig kontroll"
wrong_answers:
  - "De uttalade mål och ädla intentioner som systemets grundare och ledare deklarerat"
  - "Den politiska rörelsens historiska ursprung och biografierna över dess viktigaste tänkare"
  - "Antalet tillåtna politiska partier och frekvensen av demokratiska val"
explanation: >-
  Strukturella definitioner fokuserar på hur politiska system faktiskt fungerar och på deras observerbara kännetecken. Socialismen kännetecknas till exempel strukturellt av statens allestädesnärvaro. Detta förhållningssätt står i kontrast till intentionella definitioner, som bygger på uttalade motiv och mål. Det strukturella förhållningssättet möjliggör en mer objektiv utvärdering baserad på mätbara resultat.
reviewed: false
