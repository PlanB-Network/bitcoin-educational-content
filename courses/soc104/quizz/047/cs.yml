question: "Kdo je často uváděn jako zakladatelská postava moderního konzervatismu?"
answer: "Edmund Burke, který prosazoval zachování institucí a tradic proti radikálním změnám Francouzské revoluce"
wrong_answers:
  - "Karl Marx, který v devatenáctém století rozvinul teorii třídního boje a historického materialismu"
  - "John Locke, který v sedmnáctém století formuloval teorii přirozených práv a společenské smlouvy"
  - "Adam Smith, který napsal Bohatství národů a založil disciplínu klasické ekonomie"
explanation: >-
  Edmund Burke je často uváděn jako zakladatelská postava konzervatismu kvůli svému odporu vůči Francouzské revoluci. Jeho Úvahy o revoluci ve Francii (1790) hájily obezřetnost a postupnou reformu před radikální změnou. Věřil, že společnost by neměla postupovat tím, že začne od nuly, ale prostřednictvím postupných reforem, které zachovávají prověřené instituce a tradice.
