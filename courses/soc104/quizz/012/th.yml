question: "หมวดเสรีภาพทางเศรษฐกิจรวมถึงอะไร?"
answer: "สิ่งที่คุณทำในฐานะผู้ผลิตและผู้บริโภค: การซื้อ การขาย การผลิต การทำงาน การจ้างงาน และการจัดการเงินของคุณ"
wrong_answers:
  - "ความเชื่อทางศาสนา ความสัมพันธ์ส่วนตัว และเสรีภาพในการแสดงออกของคุณ"
  - "สิทธิของคุณในการลงคะแนนเสียง เข้าร่วมการเลือกตั้ง และเข้าร่วมพรรคการเมือง"
  - "ความสามารถของคุณในการเดินทางอย่างเสรี เลือกที่อยู่อาศัย และข้ามพรมแดนประเทศ"
explanation: >-
  เสรีภาพทางเศรษฐกิจครอบคลุมสิ่งที่คุณทำในฐานะผู้ผลิตและผู้บริโภค: สิ่งที่คุณสามารถซื้อ ขาย หรือผลิตได้; ที่ที่คุณทำงาน; คนที่คุณจ้าง; และสิ่งที่คุณทำกับเงินของคุณ ความสัมพันธ์ส่วนตัว ความเชื่อทางศาสนา และเสรีภาพในการเคลื่อนย้ายอยู่ภายใต้หมวดเสรีภาพส่วนบุคคล ไม่ใช่หมวดเศรษฐกิจ
reviewed: false
