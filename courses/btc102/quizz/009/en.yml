question: Why is online security so important for Bitcoin users?
answer: Because piracy leads to irrecoverable loss of bitcoins
wrong_answers:
  - Because banks insure funds in the event of total loss of bitcoins
  - Because you can go to jail for losing bitcoins
  - Because attacks entail very heavy administrative constraints
explanation: |
  Without an intermediary, a hack means a definitive loss of bitcoins.
reviewed: false