question: "Welche emblematischen Figuren werden im Nolan-Diagramm mit maximaler wirtschaftlicher Freiheit verbunden?"
answer: "Margaret Thatcher, Ronald Reagan und Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures und Bernie Sanders"
  - "Nelson Mandela, Simone Veil und Noam Chomsky"
  - "Vladimir Putin, Xi Jinping und Joseph de Maistre"
explanation: >-
  Thatcher, Reagan und Milei werden als emblematische Figuren maximaler wirtschaftlicher Freiheit angeführt, da sie weniger staatliche Intervention, weniger Vorschriften und niedrigere Steuern befürworten. Roosevelt, Jaures und Sanders repräsentieren das entgegengesetzte Ende, das staatliche Kontrolle der Wirtschaft bevorzugt. Mandela, Veil und Chomsky repräsentieren maximale persönliche Freiheit. Putin, Xi Jinping und de Maistre repräsentieren maximale staatliche Kontrolle des persönlichen Lebens.
reviewed: false
