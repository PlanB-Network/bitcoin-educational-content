question: "為什麼自由至上主義者反對稅收？"
answer: "因為稅收是對財產權的道德侵犯，是一種未經同意奪取他人財產的國家偷竊形式"
wrong_answers:
  - "因為稅收在經濟上無效率，並且總會導致更高的失業率"
  - "因為稅收會阻礙外國投資，並削弱一個國家的競爭地位"
  - "因為累進稅制不公平地針對創造最多工作的富裕個人"
explanation: >-
  自由至上主義者對稅收的反對，在經濟之前首先是道德性的。自由至上主義者把稅收視為一種國家偷竊形式，也是對私有財產的阻礙，因為它由未經同意奪取他人財產構成。雖然可能存在反對稅收的經濟論點，但自由至上主義的基礎論點建立在它侵犯財產權這項原則上，而不是效率或競爭力的計算上。
reviewed: false
