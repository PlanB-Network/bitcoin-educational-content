question: Vydanie ktorej slávnej knihy umožnila skupina de Gournay?
answer: Esej o povahe obchodu vo všeobecnosti od Richarda Cantillona
wrong_answers:
  - Politické rozpravy Davida Huma
  - Obchodné zmluvy Josiaha Childa
  - Machiavelliho Vladár
explanation: |
  Le cercle de Gournay prispel k posmrtnému vydaniu Cantillonovej "Essai", významného diela ekonomického myslenia.
