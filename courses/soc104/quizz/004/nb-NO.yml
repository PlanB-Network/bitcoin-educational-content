question: "Hvordan forsterker fiatpengesystemet skillet mellom de styrende og de styrte?"
answer: "Det lar regjeringer finansiere ubegrensede utgifter gjennom pengeskaping, noe som devaluerer sparing gjennom inflasjon"
wrong_answers:
  - "Det gir borgere direkte kontroll over pengepolitikken gjennom demokratiske valg og folkeavstemninger"
  - "Det hindrer regjeringer i å låne, og tvinger dem til å basere seg utelukkende på skattlegging for inntekter"
  - "Det fordeler nyskapte penger likt blant alle borgere for å stimulere økonomisk vekst"
explanation: >-
  Fiatvaluta beskrives som hjørnesteinen i utvidelsen av statsmakten fordi den lar regjeringer låne og presse banker til å trykke nye penger. Den resulterende inflasjonen devaluerer folks sparing, til fordel for de rikeste og mektigste aktørene. Den gir ikke borgere monetær kontroll, og den hindrer heller ikke låneopptak eller fordeler penger likt.
reviewed: false
