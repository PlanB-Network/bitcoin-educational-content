question: "ลิเบอร์ทาเรียนมองความสัมพันธ์ระหว่างทรัพย์สินส่วนตัวกับเสรีภาพอย่างไร?"
answer: "ทรัพย์สินส่วนตัวเป็นสิทธิตามธรรมชาติที่มาก่อนกฎหมายและรัฐ และเป็นรากฐานแท้จริงของเสรีภาพ"
wrong_answers:
  - "ทรัพย์สินส่วนตัวเป็นขนบทางสังคมที่รัฐสร้างขึ้น และสามารถเพิกถอนได้เมื่อมันก่อให้เกิดความเหลื่อมล้ำ"
  - "ทรัพย์สินส่วนตัวมีประโยชน์ต่อประสิทธิภาพทางเศรษฐกิจ แต่ไม่มีนัยสำคัญทางศีลธรรมหรือปรัชญาในตัวเอง"
  - "ทรัพย์สินส่วนตัวควรมีอยู่เฉพาะสำหรับทรัพย์สินใช้สอยส่วนบุคคล ไม่ใช่สำหรับสินทรัพย์เพื่อการผลิตหรือที่ดิน"
explanation: >-
  ลิเบอร์ทาเรียนปกป้องทรัพย์สินส่วนตัวในฐานะสิทธิตามธรรมชาติที่มาก่อนกฎหมายและรัฐ พวกเขาโต้แย้งว่าหากปัจเจกบุคคลเป็นเจ้าของร่างกายของตนเอง เขาก็เป็นเจ้าของแรงงานของตนและผลของแรงงานของตนด้วย การถือครองสินทรัพย์วัตถุเป็นส่วนขยายของ self-ownership สิ่งนี้แตกต่างอย่างชัดเจนจากมุมมอง libertaire ที่มองทรัพย์สินว่าเป็นขนบทางสังคมหรือแหล่งของการกดขี่
reviewed: false
