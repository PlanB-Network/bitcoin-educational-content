question: "Vilken är den socialistiska positionen om sjukvård?"
answer: "Tillgång till sjukvård är en grundläggande rättighet, och staten måste garantera ett universellt, offentligt finansierat system för alla oavsett inkomst"
wrong_answers:
  - "Sjukvård bör vara ett blandat system med grundläggande statlig täckning kompletterad av privata försäkringsalternativ"
  - "Privata marknader levererar mer innovativ sjukvård, så individer bör fritt välja sitt eget system"
  - "Staten bör tillhandahålla sjukvård endast för de fattigaste medborgarna medan privata försäkringar täcker alla andra"
explanation: >-
  För socialister är tillgång till sjukvård en grundläggande rättighet, inte en vara. Staten måste garantera ett universellt, offentligt finansierat sjukvårdssystem så att alla har tillgång till vård, oavsett inkomst. Detta återspeglar den socialistiska omsorgen om jämlikhet, social rättvisa och statens betydelse för att organisera tjänster i det allmännas intresse. Det blandade systemet beskriver den centristiska synen, medan valbaserade angreppssätt återspeglar libertarianska och konservativa positioner.
