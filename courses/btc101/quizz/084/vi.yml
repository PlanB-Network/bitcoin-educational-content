question: Điều gì sẽ là mối quan tâm chính khi bạn sở hữu bitcoin?
answer: Sự an toàn cho quỹ tài sản của bạn.
wrong_answers:
  - Giá trị của Bitcoin theo đô la.
  - Tính hợp pháp của việc sở hữu bitcoin.
  - Quyền được chi tiêu quỹ của bạn.
explanation: |
  Khi bạn sở hữu bitcoin, mối quan tâm chính là sự an toàn
  cho quỹ tài sản của bạn. Điều này là bởi vì Bitcoin, giống như bất kỳ hình thức
  tiền tệ nào khác, có thể bị đánh cắp hoặc mất nếu không được bảo vệ đúng cách.
reviewed: true