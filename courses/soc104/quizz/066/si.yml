question: "gay marriage ප්‍රශ්නය පිළිබඳ libertarian position එක කුමක්ද?"
answer: "marriage define කිරීම state එකේ කාර්යයක් නොවේ; එය privatize කර individuals, associations, සහ religious institutions වෙත භාර දිය යුතුය"
wrong_answers:
