question: "Jaká je klíčová neshoda mezi libertariány a ostatními politickými rodinami, když sdílejí stejné cíle?"
answer: "Neshoda se týká prostředků: libertariáni odmítají donucovací řešení a upřednostňují dobrovolnou směnu prostřednictvím tržního procesu"
wrong_answers:
  - "Neshoda se týká cílů: libertariáni sledují jiné cíle, například individuální bohatství namísto společenského blahobytu"
  - "Neshoda se týká načasování: libertariáni chtějí stejných cílů dosáhnout pomaleji prostřednictvím postupné reformy"
  - "Neshoda se týká rozsahu: libertariáni chtějí uplatňovat stejné politiky pouze na místní, nikoli národní úrovni"
explanation: >-
  Libertariáni se mohou shodnout se socialisty, konzervativci a centristy na určitých cílech, jako je obrana utlačovaných nebo podpora sociální soudržnosti. Neshoda neleží v cílech, ale v prostředcích. Libertariáni odmítají všechna donucovací řešení, která se snaží uniformizovat praktiky a regulace, a místo toho hájí sílu volby a odpovědnou svobodu prostřednictvím svobodné, decentralizované směny založené na dobrovolných smlouvách.
