question: "Hur kom alla totalitära regimer till makten?"
answer: "Genom våldsam revolution som rättfärdigade att göra rent hus med det tidigare systemet"
wrong_answers:
  - "Genom gradvis lagstiftningsreform inom befintliga demokratiska institutioner"
  - "Genom militärkupper organiserade av främmande makter som sökte regional kontroll"
  - "Genom fredliga massrörelser som vann folkval med bred marginal"
explanation: >-
  Alla totalitära regimer kom till makten genom våldsam revolution. Denna revolution tjänar ett dubbelt syfte: den förstör fysiskt den gamla ordningen och rättfärdigar ideologiskt användningen av våld som nödvändig för att bygga det nya samhället. Detta skiljer totalitära maktövertaganden från demokratiska övergångar, utlandsstödda kupper eller fredliga valsegrar.
