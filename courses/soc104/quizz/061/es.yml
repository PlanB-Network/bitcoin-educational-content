question: "¿Qué revela sobre el totalitarismo la declaración de Mussolini de 1920: 'Todo en el Estado, nada fuera del Estado, nada contra el Estado'?"
answer: "Ya no hay separación entre el espacio público y el privado, porque el Estado absorbe por completo a la sociedad"
wrong_answers:
  - "El Estado se centra exclusivamente en el poder militar mientras deja la economía a la empresa privada"
  - "Los ciudadanos son libres de organizarse en privado siempre que no critiquen abiertamente al gobierno"
  - "El gobierno controla solo la actividad política mientras la vida cultural y religiosa sigue siendo autónoma"
explanation: >-
  La declaración de Mussolini capta la esencia del totalitarismo: la totalidad. Todo queda absorbido por el Estado, lo que significa que no hay separación entre el espacio público y el privado. La sociedad pierde toda forma de autonomía, hasta en las actividades más cotidianas, como abrir un club deportivo. Esto va mucho más allá de controlar solo las esferas militar, política o económica.
