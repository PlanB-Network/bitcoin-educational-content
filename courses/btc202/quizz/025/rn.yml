question: Ni ryari pruned node ishobora kuba ikibazo kuri wallet?
answer: Igihe basubijeho Wallet ya kera.
wrong_answers:
  - Iyo uriko urarema aderesi nshasha yo kwakira.
  - Igihe wohereje amafaranga aherutse gukoreshwa
  - Igihe uhisemwo amafaranga
explanation: Pruned node ntibika old blocks zose za kera.
  Ivyo bishobora gutuma transactions za kera zitaboneka igihe uriko urasubiza kugarura wallet.
reviewed: true
