question: "Wie behandelt der Sozialismus Freiheiten in der gesellschaftlichen und der wirtschaftlichen Sphäre unterschiedlich?"
answer: "Sozialismus begünstigt starke Freiheiten in der gesellschaftlichen Sphäre, aber schwache Freiheiten in der wirtschaftlichen Sphäre"
wrong_answers:
  - "Sozialismus schränkt alle Freiheiten in der gesellschaftlichen und der wirtschaftlichen Sphäre gleichermaßen ein"
  - "Sozialismus begünstigt starke wirtschaftliche Freiheiten, schränkt aber gesellschaftliche Freiheiten ein, um soziale Ordnung aufrechtzuerhalten"
  - "Sozialismus gewährt unbegrenzte Freiheiten in beiden Sphären und stützt sich auf freiwillige Kooperation, um das Gleichgewicht zu erhalten"
explanation: >-
  Im sozialistischen Denken gibt es eine grundlegende Dichotomie zwischen gesellschaftlichen und wirtschaftlichen Freiheiten. Gesellschaftliche Freiheiten sind stark, wirtschaftliche Freiheiten dagegen schwach, aufgrund der Betonung staatlicher Kontrolle, Planung und Umverteilung von Wohlstand. Die dritte falsche Antwort beschreibt das libertäre Ideal, während die zweite das konservative Muster beschreibt, das das Spiegelbild des Sozialismus ist.
