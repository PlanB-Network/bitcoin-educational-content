question: "اصل سایفرپانکی «Cypherpunks write code» درباره رویکرد این جنبش برای دستیابی به آزادی چه چیزی را آشکار می‌کند؟"
answer: "اینکه مسیر آزادی از ساخت فعالانه نظام‌های ناشناس می‌گذرد، با استفاده از کد به‌عنوان ابزار بنیادی برای تبدیل ایده‌های انتزاعی آزادی به واقعیت"
wrong_answers:
  - "اینکه سایفرپانک‌ها عمدتاً توسعه‌دهندگان نرم‌افزارند که برای تأمین مالی کارزارهای کنشگری سیاسی خود برنامه‌های تجاری می‌نویسند"
  - "اینکه جنبش به‌جای کنش مستقیم، به آموزش عموم از طریق مانیفست‌های مکتوب و نشریات دانشگاهی باور دارد"
  - "اینکه سایفرپانک‌ها بر هک کردن نظام‌های دولتی موجود تمرکز می‌کنند تا برنامه‌های نظارتی را افشا کنند و اصلاحات قانون‌گذاری را تحمیل نمایند"
explanation: >-
  فرمول «Cypherpunks write code» تعهد این جنبش به مداخله فعال را بازتاب می‌دهد، نه صرفاً امید داشتن. برای Eric Hughes، مسیر آزادی از ساخت فعالانه نظام‌های ناشناسی می‌گذرد که تقسیم‌بندی‌های سیاسی خودسرانه را بی‌ربط می‌کنند. کد به ابزار بنیادی تبدیل ایده‌های انتزاعی آزادی به واقعیت بدل می‌شود؛ به همین دلیل Satoshi Nakamoto کل کد Bitcoin را حتی پیش از نوشتن وایت‌پیپر نوشت.
reviewed: false
