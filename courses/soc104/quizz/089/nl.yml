question: "Hoe houdt Karl Poppers onderscheid tussen open en gesloten samenlevingen verband met het debat tussen individualisme en collectivisme?"
answer: "De open samenleving erkent het recht van het individu om zelf te oordelen via persoonlijke beslissingen, terwijl de gesloten samenleving collectivistisch is en berust op tribale mentaliteit en de weigering van kritische vrijheid"
wrong_answers:
  - "De open samenleving is een samenleving die vrije handel over nationale grenzen toestaat, terwijl de gesloten samenleving tarieven en protectionistisch economisch beleid oplegt"
  - "De open samenleving wordt bestuurd door directe democratie waarin elke burger stemt, terwijl de gesloten samenleving wordt geregeerd door één erfelijke monarch"
  - "De open samenleving publiceert alle overheidsdocumenten transparant, terwijl de gesloten samenleving informatie classificeert als staatsgeheimen"
explanation: >-
  Popper definieerde de gesloten samenleving als de magische of tribale samenleving en de open samenleving als een samenleving waarin individuen worden geconfronteerd met persoonlijke beslissingen. De gesloten samenleving is collectivistisch en berust op tribale mentaliteit met een weigering van kritische vrijheid en de idealisering van een statische orde. De open samenleving geeft voorrang aan vrije keuze van waarden, overtuigingen en relaties, en belichaamt daarmee rechtstreeks individualistische principes.
reviewed: false
