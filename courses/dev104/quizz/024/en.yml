question: Which media query approach would implement a mobile-first responsive design strategy for a navigation menu?
answer: Start with mobile styles as default, then use min-width media queries to add desktop features
wrong_answers:
  - Start with desktop styles as default, then use max-width media queries to remove features for mobile
  - Use only max-width media queries with decreasing pixel values from largest to smallest screens
  - Apply separate media queries for each device type using device-specific pixel dimensions
explanation: |
  Mobile-first design starts with styles for the smallest screens as the base CSS, then progressively enhances the design using min-width media queries as screen size increases. This approach is more efficient because mobile styles are typically simpler, and you build up complexity rather than stripping it down. The wrong answers represent desktop-first approaches or overly specific device targeting, which are less flexible and maintainable than the progressive enhancement strategy of mobile-first design.
