question: "Mikä on libertarismin sisällä keskeinen ero minarkistien ja anarkokapitalistien välillä?"
answer: "Minarkistit hyväksyvät minimaalisen valtion puolustusta, oikeuslaitosta ja poliisia varten, kun taas anarkokapitalistit haluavat yksityistää kaikki valtion tehtävät"
wrong_answers:
  - "Minarkistit torjuvat kaikki hallinnon muodot, kun taas anarkokapitalistit hyväksyvät markkinoiden rajatun valtiollisen sääntelyn"
  - "Minarkistit kannattavat progressiivista verotusta välttämättömien palvelujen rahoittamiseksi, kun taas anarkokapitalistit vastustavat kaikkea verotusta"
  - "Minarkistit keskittyvät vain taloudelliseen vapauteen, kun taas anarkokapitalistit puolustavat sekä taloudellisia että yhteiskunnallisia vapauksia"
explanation: >-
  Minarkistit uskovat, että valtion tulisi rajoittua ydintehtäviin, kuten puolustukseen, oikeuslaitokseen ja poliisiin ("yövartijavaltio"), kun taas anarkokapitalistit väittävät, että jopa nämä tehtävät tulisi yksityistää ja järjestää vapaaehtoisen markkinakilpailun kautta. Heidän erimielisyytensä koskee enemmän käytännön toteutusta kuin perustavia eettisiä periaatteita. Molemmat suuntaukset jakavat samat libertaariset arvot: itseomistuksen ja hyökkäämättömyyden.
