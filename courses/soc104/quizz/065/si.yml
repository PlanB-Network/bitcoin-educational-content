question: "ඔවුන්ගේ shared totalitarian methods තිබියදීත්, Hitlerගේ Germany සහ Stalinගේ Soviet Union හි economic approaches වෙනස් වූයේ කෙසේද?"
answer: "Nazi Germany private property හි appearance එකක් පවත්වාගෙන private sector එක state objectives වලට යටත් කළ අතර, Stalinism සියලු private ownership අහෝසි කර economy සම්පූර්ණයෙන් plan කළේය"
wrong_answers:
  - "Nazi Germany සියලු industries සම්පූර්ණයෙන් nationalize කළ අතර, Stalinගේ regime එක agriculture තුළ සීමිත private enterprise ඉඩ දුන්නේය"
  - "Nazi Germany rearmament fund කිරීමට free international trade ප්‍රවර්ධනය කළ අතර, Stalinism complete economic isolation පැනවීය"
  - "Nazi Germany state සමඟ voluntary corporate cooperation මත රඳා පැවති අතර, Stalinism forced labor පමණක් භාවිත කළේය"
explanation: >-
  regimes දෙකම identical political methods (cult of personality, total surveillance, opposition systematic elimination) භාවිත කළ නමුත්, ඔවුන්ගේ economic models form එකෙන් වෙනස් විය. Nazi Germany private property formal ලෙස අහෝසි කළේ නැත, නමුත් private sector එක war සහ rearmament වැනි state goals වලට සම්පූර්ණයෙන් subordinated කර, economic autarky imposed කළේය. Stalinism සියලු private ownership අහෝසි කර, five-year plans ක්‍රියාත්මක කර, production සහ distribution සියල්ල direct ලෙස පාලනය කිරීමෙන් තවත් ඉදිරියට ගියේය.
reviewed: false
