question: "Varför visade sig Molinaris förutsägelse från 1849 vara profetisk när det gäller relationen mellan frihet och politisk makt?"
answer: "Eftersom konservativa och socialister har turats om vid makten och instrumentaliserat friheten i sina respektive politiska måls tjänst, precis som han beskrev"
wrong_answers:
  - "Eftersom ekonomkaraktären han beskrev till slut fick politisk makt och genomförde libertariansk politik i hela Europa"
  - "Eftersom hans förutsägelse att alla tre politiska familjer skulle smälta samman till en enda centristisk rörelse slog in under nittonhundratalet"
  - "Eftersom friheten gradvis utvidgades av på varandra följande regeringar tills den blev den primära organiserande principen i moderna demokratier"
explanation: >-
  Molinaris vision visade sig vara profetisk eftersom konservativa och socialister sedan mitten av artonhundratalet har turats om vid makten och gjort just det han beskrev: instrumentaliserat friheten i politiska måls tjänst. Båda familjerna är villiga att begränsa friheter och kalla på staten för att påtvinga sina respektive agendor, medan ekonomens ståndpunkt om ovillkorlig frihet förblev marginaliserad.
reviewed: false
