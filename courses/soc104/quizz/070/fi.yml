question: "Miksi totalitaarisia hallintoja on kuvattu 'maallisiksi uskonnoiksi', ja mitä tämä paljastaa totalitarismin olemassaolon välttämättömistä ehdoista?"
answer: "Ne vaativat kannattajilta lähes uskonnollista uskoa ja käyttävät pelkoa vastustajia vastaan, ja totalitarismi edellyttää kaikkia piirteitä samanaikaisesti: tukahdutettuja vapauksia, yksipuoluevaltaa, väkivaltaista vallankumousta ja ohjattua taloutta"
wrong_answers:
  - "Ne korvaavat perinteisen jumalanpalveluksen valtion seremonioilla, ja totalitarismi edellyttää vain karismaattista johtajaa ja sotilaallista kontrollia"
  - "Ne käyttävät uskonnollisia instituutioita valtion ideologian toimeenpanemiseen, ja totalitarismi voi syntyä aina, kun yksi poliittinen puolue hallitsee parlamenttia"
  - "Ne lupaavat hengellistä pelastusta poliittisen toiminnan kautta, ja totalitarismi on olemassa aina, kun valtio kontrolloi taloutta poliittisista vapauksista riippumatta"
explanation: >-
  Raymond Aron havaitsi, että totalitaariset hallinnot toimivat kahden periaatteen varassa: kannattajien uskon ja vastustajien pelon. Tämä lähes uskonnollinen fanaattisuus luonnehtii niitä niiden erilaisista motiiveista riippumatta ja on tuonut niille maallisten uskontojen nimityksen. Ratkaisevaa on, että totalitarismi edellyttää kaikkia määrittäviä piirteitä samanaikaisesti: tukahdutettuja vapauksia, yhden puolueen kautta toteutuvaa rajatonta auktoriteettia, väkivaltaista vallankumousta ja ohjattua taloutta. Nykyaikaisissa demokratioissa voi ilmetä joitakin näistä piirteistä, mutta totalitarismi on läsnä vain silloin, kun ne kaikki esiintyvät yhdessä.
