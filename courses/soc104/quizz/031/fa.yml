question: "لیبرترین‌ها رابطه میان مالکیت خصوصی و آزادی را چگونه می‌بینند؟"
answer: "مالکیت خصوصی حقی طبیعی است که مقدم بر قانون و دولت است و خودِ بنیاد آزادی به شمار می‌رود"
wrong_answers:
  - "مالکیت خصوصی قراردادی اجتماعی است که دولت آن را ایجاد کرده و وقتی باعث نابرابری شود می‌تواند آن را لغو کند"
  - "مالکیت خصوصی برای کارایی اقتصادی مفید است، اما هیچ اهمیت اخلاقی یا فلسفی ذاتی ندارد"
  - "مالکیت خصوصی باید فقط برای دارایی‌های شخصی وجود داشته باشد، نه برای دارایی‌های مولد یا زمین"
explanation: >-
  لیبرترین‌ها از مالکیت خصوصی به‌عنوان حقی طبیعی دفاع می‌کنند که مقدم بر قانون و دولت است. آنان استدلال می‌کنند که اگر فرد مالک بدن خود باشد، مالک کار خود و ثمرات آن نیز هست. مالکیت کالاهای مادی امتدادی از مالکیت بر خویشتن است. این با دیدگاه لیبرتِر که مالکیت را قراردادی اجتماعی یا سرچشمه‌ای برای ستم می‌داند، تضاد شدیدی دارد.
reviewed: false
