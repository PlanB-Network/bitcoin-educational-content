question: "Vilka emblematiska personer förknippas med maximal ekonomisk frihet i Nolan-diagrammet?"
answer: "Margaret Thatcher, Ronald Reagan och Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures och Bernie Sanders"
  - "Nelson Mandela, Simone Veil och Noam Chomsky"
  - "Vladimir Putin, Xi Jinping och Joseph de Maistre"
explanation: >-
  Thatcher, Reagan och Milei nämns som emblematiska personer för maximal ekonomisk frihet, med stöd för mindre statlig intervention, färre regleringar och lägre skatter. Roosevelt, Jaures och Sanders representerar den motsatta änden som förespråkar statlig kontroll över ekonomin. Mandela, Veil och Chomsky representerar maximal personlig frihet. Putin, Xi Jinping och de Maistre representerar maximal statlig kontroll över privatlivet.
reviewed: false
