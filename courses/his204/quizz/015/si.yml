question: 1696දී Boisguilbert තම Détail de la France නැවත ප්‍රකාශයට පත් කළේ කුමන මාතෘකාව යටතේද?
answer: Louis XIVගේ පාලන සමයේදී විනාශ වූ ප්‍රංශය, කවුරුන් විසින් සහ කෙසේද, එය නැවත පිහිටුවීමට ඇති ක්‍රම සමඟ
wrong_answers:
  - Louis XIVගේ පාලන සමයේදී විනාශ වූ ප්‍රංශය, ඇයි සහ කෙසේද, සහායක සංඛ්‍යාලේඛන සමඟ
  - Louis XIVගේ පාලන සමයේදී බෙදී ගිය ප්‍රංශය, කුමන කණ්ඩායම් විසින් සහ ඇයි, සහ එය නැවත එක්සත් කරන්නේ කෙසේද
  - Louis XIVගේ පාලන සමයේදී සමෘද්ධිමත් වූ ප්‍රංශය, කවුරුන්ගේ උපකාරයෙන් සහ කෙසේද, ස්පර්ශනීය උදාහරණ සමඟ
explanation: |
  1696දී ඔහුගේ කෘතිය නැවත ප්‍රකාශයට පත් වූ සම්පූර්ණ මාතෘකාව සැබවින්ම "La France ruinée sous le règne de Louis XIV, par qui et comment, avec les moyens de la rétablir" යන්නයි. මෙම මාතෘකාව Louis XIVගේ ආර්ථික ප්‍රතිපත්තිය පිළිබඳ Boisguilbertගේ දැඩි විවේචනය පිළිබිඹු කරයි.
