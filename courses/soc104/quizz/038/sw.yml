question: "Kwa nini ufafanuzi wa kimakusudi wa mifumo ya kisiasa huchukuliwa kuwa wenye matatizo kwa madhumuni ya uchambuzi?"
answer: "Huunda mkanganyiko wa dhana kwa sababu mifumo yote hudai kufuatilia malengo yanayofanana kama haki, usawa, na uhuru"
wrong_answers:
  - "Ni sahihi na migumu kupita kiasi, bila kuacha nafasi kwa mageuzi ya asili ya harakati za kisiasa kadiri muda unavyopita"
  - "Hujikita kupita kiasi katika matokeo ya kiuchumi na hupuuza vipengele vya kitamaduni na kijamii vya maisha ya kisiasa"
  - "Hutegemea nyaraka za serikali zilizoainishwa siri ambazo ni nadra kupatikana kwa watafiti huru"
explanation: >-
  Ufafanuzi wa kimakusudi hutegemea motisha na malengo yaliyotajwa, lakini kila mfumo wa kisiasa hudai kufuatilia haki, usawa, na uhuru. Hili hufanya isiwezekane kutofautisha mfumo mmoja na mwingine. Uchambuzi wa kimuundo, kwa upande mwingine, hutathmini mifumo kwa matokeo yake ya kiempiria, yanayopimika na njia inazotumia, ukifichua asili yake ya kweli zaidi ya balagha.
reviewed: false
