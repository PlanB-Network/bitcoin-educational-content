question: "Hệ thống tiền pháp định (Fiat) củng cố sự phân chia giữa người cai trị và người bị cai trị như thế nào?"
answer: "Nó cho phép các chính phủ tài trợ cho chi tiêu không giới hạn thông qua việc tạo tiền, làm mất giá tiền tiết kiệm qua lạm phát"
wrong_answers:
  - "Nó trao cho công dân quyền kiểm soát trực tiếp chính sách tiền tệ thông qua bầu cử dân chủ và trưng cầu dân ý"
  - "Nó ngăn chính phủ vay nợ, buộc họ chỉ dựa vào thuế để có nguồn thu"
  - "Nó phân phối số tiền mới được tạo ra một cách bình đẳng cho mọi công dân để kích thích tăng trưởng kinh tế"
explanation: >-
  Tiền pháp định (Fiat) được mô tả là nền tảng của sự mở rộng quyền lực nhà nước vì nó cho phép chính phủ vay và thúc đẩy các ngân hàng in tiền mới. Lạm phát phát sinh từ đó làm mất giá tiền tiết kiệm của người dân, mang lại lợi ích cho các thực thể giàu có và quyền lực nhất. Nó không trao cho công dân quyền kiểm soát tiền tệ, cũng không ngăn việc vay nợ hay phân phối tiền một cách bình đẳng.
