question: "แนวทางเศรษฐกิจของเยอรมนีภายใต้ Hitler และสหภาพโซเวียตภายใต้ Stalin แตกต่างกันอย่างไร แม้ใช้วิธีเบ็ดเสร็จร่วมกัน?"
answer: "Nazi Germany รักษาภาพลักษณ์ของทรัพย์สินส่วนตัวไว้ ขณะทำให้ภาคเอกชนอยู่ใต้เป้าหมายของรัฐ ส่วน Stalinism ยกเลิกกรรมสิทธิ์เอกชนทั้งหมดและวางแผนเศรษฐกิจอย่างเต็มรูปแบบ"
wrong_answers:
  - "Nazi Germany ทำให้อุตสาหกรรมทั้งหมดเป็นของชาติอย่างเต็มรูปแบบ ขณะที่ระบอบของ Stalin อนุญาตกิจการเอกชนจำกัดในภาคเกษตร"
  - "Nazi Germany ส่งเสริมการค้าเสรีระหว่างประเทศเพื่อจัดหาเงินให้การติดอาวุธใหม่ ขณะที่ Stalinism บังคับใช้การโดดเดี่ยวทางเศรษฐกิจโดยสมบูรณ์"
  - "Nazi Germany พึ่งความร่วมมือโดยสมัครใจของบริษัทกับรัฐ ขณะที่ Stalinism ใช้เพียงแรงงานบังคับ"
explanation: >-
  แม้ทั้งสองระบอบใช้วิธีทางการเมืองแบบเดียวกัน (ลัทธิบูชาบุคคล การเฝ้าระวังทั้งหมด การกำจัดฝ่ายตรงข้ามอย่างเป็นระบบ) แต่แบบจำลองเศรษฐกิจของพวกเขาต่างกันในรูปแบบ Nazi Germany ไม่ได้ยกเลิกทรัพย์สินส่วนตัวอย่างเป็นทางการ แต่ทำให้ภาคเอกชนอยู่ใต้เป้าหมายของรัฐอย่างสมบูรณ์ เช่น สงครามและการติดอาวุธใหม่ พร้อมบังคับใช้ economic autarky ส่วน Stalinism ไปไกลกว่านั้นด้วยการยกเลิกกรรมสิทธิ์เอกชนทั้งหมด ใช้แผนห้าปี และควบคุมการผลิตกับการกระจายทั้งหมดโดยตรง
reviewed: false
