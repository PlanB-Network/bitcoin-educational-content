question: Quesnay තම ශිෂ්‍යයන්ට එල්ල කළ විවේචනය කුමක්ද?
answer: ඔවුන්ගේ සංප්‍රදායික කණ්ඩායම්වාදී ස්වභාවය
wrong_answers:
  - ඔවුන්ගේ අධික ලිබරල්වාදය
  - Louis XVගේ බලයට ඔවුන්ගේ අනුගතකම
  - ඔවුන්ගේ විද්‍යාත්මක දැඩිභාවයේ හිඟය
explanation: |
  Quesnay තම අනුගාමිකයන් ඔවුන්ගේ සංප්‍රදායික කණ්ඩායම්වාදය සහ වෙනත් අදහස්වලට විවෘත නොවීම නිසා විවේචනය කළේය. ඔවුන්ගේ දෘඪමතවාදය physiocracy පැතිරීමට බාධා කරනු ඇතැයි ඔහු බිය විය.