question: În ce chestiune a primit Turgot sprijinul lui Diderot?
answer: Libertatea muncii și abolirea breslelor
wrong_answers:
  - Libertatea comerțului cu cereale
  - Libertatea împrumuturilor cu dobândă
  - Reforma educației
explanation: |
  Diderot l-a susținut pe Turgot în chestiunea libertății muncii și a abolirii breslelor, considerând că aceste măsuri erau necesare pentru a stimula economia și a promova progresul social.
