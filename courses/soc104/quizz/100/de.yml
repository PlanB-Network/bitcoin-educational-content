question: "Was identifiziert der Kurs als die wirkliche politische Spaltung jenseits des traditionellen Links-rechts-Mitte-Spektrums?"
answer: "Die Spaltung zwischen grundlegenden philosophischen Prinzipien: Freiheit oder Zwang, freiwillige Zustimmung oder Erzwingung, das verantwortliche Individuum oder das Kollektiv"
wrong_answers:
  - "Die Spaltung zwischen reichen und armen Nationen über die Kontrolle internationaler Handelsabkommen und globaler Finanzinstitutionen"
  - "Die Spaltung zwischen städtischen und ländlichen Bevölkerungen über Prioritäten staatlicher Ausgaben und Infrastrukturinvestitionen"
  - "Die Spaltung zwischen progressiven und traditionellen Kulturen über soziale Normen, Familienwerte und religiöse Bildung"
explanation: >-
  Der Kurs argumentiert, dass die wirkliche politische Spaltung nicht in den traditionellen Etiketten links, rechts und Mitte liegt, sondern in grundlegenden philosophischen Prinzipien: Freiheit oder Zwang, freiwillige Zustimmung oder Erzwingung, das verantwortliche Individuum oder das Kollektiv. Die richtige Art, über Politik nachzudenken, besteht darin, von ethischen Prinzipien statt von Etiketten auszugehen.
reviewed: false
