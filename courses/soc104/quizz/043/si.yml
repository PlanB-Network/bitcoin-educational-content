question: "socialist philosophy සන්දර්භයේ 'holism' යන term එකෙන් අදහස් කරන්නේ කුමක්ද?"
answer: "collective එක individual එකට වඩා primacy ගන්නා, society indivisible whole එකක් ලෙස දකින vision එකක්"
wrong_answers:
  - "කිසිදු group එකකට override කළ නොහැකි rights ඇති self-contained unit එකක් ලෙස එක් එක් individual සලකන philosophy එකක්"
  - "public සහ private sectors සමාන measure එකකින් balance කිරීමට advocate කරන economic theory එකක්"
  - "සියලු minority viewpoints එක් consensus-based platform එකකට integrate කරන political strategy එකක්"
explanation: >-
  Holism ග්‍රීක 'holos' යන, 'the whole' අර්ථය දෙන වචනයෙන් පැමිණේ. Socialist thought තුළ, එය individuals හි simple sum එකක් වෙනුවට indivisible whole එකක් ලෙස society දකින vision එකක් වෙත යොමු කරයි. Socialist state එක human activity උපරිම ලෙස take charge of සහ direct කිරීමට අරමුණු කරයි. මෙම collective එක social class, nation, race, හෝ gender එකක් ලෙස represent කළ හැකි නමුත්, සෑම අවස්ථාවකම individual එක group belonging මගින් define වේ.
reviewed: false
