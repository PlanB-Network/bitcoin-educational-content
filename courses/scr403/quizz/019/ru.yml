question: Что такое SimplicityHL и зачем он нужен?
answer: Язык более высокого уровня, компилируемый в Simplicity, который управляет именованием и областью видимости.
wrong_answers:
  - Язык описания аппаратуры для производства ASIC-майнеров, выполняющих Simplicity.
  - Графическая среда разработки с перетаскиванием для соединения комбинаторов Simplicity.
  - Фреймворк для тестирования, запускающий программы Simplicity в безопасной песочнице.
explanation: >-
  Необработанная Simplicity становится непонятной на уровне сложности
  производственного кода, поскольку весь доступ к данным должен
  осуществляться через вложенные комбинаторы take/drop. SimplicityHL
  предоставляет привычные конструкции программирования — именованные
  переменные, области видимости, импорт библиотек и управляющие
  конструкции, — которые компилируются в выражения комбинаторов
  Simplicity. Конечные пользователи пишут на SimplicityHL, в то время как
  Simplicity служит формально верифицированной целью компиляции.
reviewed: false
