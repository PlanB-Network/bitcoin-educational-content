question: "Во всех пяти экономических дебатах (налоги, минимальная заработная плата, здравоохранение, окружающая среда, субсидии) какой последовательный паттерн отличает центристский метод от позиций других политических семей?"
answer: "Центристы отказываются придерживаться фиксированного принципа и вместо этого требуют эмпирического анализа и экспертной оценки для определения политики в каждом конкретном случае, что делает их подход по своей природе технократическим"
wrong_answers:
  - "Центристы всегда занимают среднюю позицию между социалистической и консервативной точками зрения, поровну деля разницу по каждому вопросу"
  - "Центристы последовательно ставят экономический рост выше социального благополучия, соглашаясь с либертарианцами в фискальной политике и с социалистами в регулировании"
  - "Центристы передают все экономические решения международным организациям и торговым соглашениям, вместо того чтобы проводить независимую национальную политику"
explanation: >-
  Во всех пяти экономических дебатах центристский подход следует одному и тому же паттерну: вместо приверженности фиксированному идеологическому принципу центристы требуют эмпирических данных и экспертной оценки перед принятием решений. По налогам правильный уровень должен определяться анализом. По минимальной заработной плате уровень должен прагматически корректироваться. В здравоохранении идеальна комбинация, откалиброванная экспертами. По окружающей среде политика должна уравновешивать конкурентоспособность. По субсидиям каждый случай должен оцениваться по существу. Это делает центризм по своей природе технократическим, что отличается от простого деления разницы пополам или передачи решений международным органам.
