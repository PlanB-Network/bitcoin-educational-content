question: "Kako se razlika Karla Poppera između otvorenih i zatvorenih društava odnosi na raspravu individualizam naspram kolektivizma?"
answer: "Otvoreno društvo priznaje pravo pojedinca da sudi za sebe kroz lične odluke, dok je zatvoreno društvo kolektivističko, počiva na plemenskom mentalitetu i odbijanju kritičke slobode"
wrong_answers:
  - "Otvoreno društvo je ono koje dopušta slobodnu trgovinu preko nacionalnih granica, dok zatvoreno društvo nameće carine i protekcionističke ekonomske politike"
  - "Otvoreno društvo vodi direktna demokratija u kojoj svaki građanin glasa, dok zatvorenim društvom vlada jedan nasledni monarh"
  - "Otvoreno društvo transparentno objavljuje sve državne dokumente, dok zatvoreno društvo klasifikuje informacije kao državne tajne"
explanation: >-
  Popper je zatvoreno društvo definisao kao magijsko ili plemensko društvo, a otvoreno društvo kao ono u kojem se pojedinci suočavaju sa ličnim odlukama. Zatvoreno društvo je kolektivističko, počiva na plemenskom mentalitetu, uz odbijanje kritičke slobode i idealizaciju statičnog poretka. Otvoreno društvo daje prvenstvo slobodnom izboru vrednosti, uverenja i odnosa, direktno otelotvorujući individualističke principe.
