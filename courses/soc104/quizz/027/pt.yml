question: "O que o termo 'liberal' significa na tradição política europeia?"
answer: "Um defensor da economia laissez-faire, da redução da intervenção estatal e das liberdades individuais"
wrong_answers:
  - "Um defensor da intervenção estatal, do seguro público de saúde e de programas contra a pobreza"
  - "Um anarquista radical que busca a abolição completa do governo e da propriedade privada"
  - "Um centrista que equilibra posições socialistas e conservadoras igualmente em todas as áreas de política pública"
explanation: >-
  Na Europa, o liberalismo permaneceu associado a políticas econômicas laissez-faire, à redução da intervenção estatal e à defesa das liberdades individuais. A primeira resposta errada descreve os liberals americanos, que deslocaram o significado do termo para o intervencionismo. O liberalismo europeu não é nem anarquismo nem centrismo.
