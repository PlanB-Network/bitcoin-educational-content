question: "What limitation applies even to the 'night-watchman state'?"
answer: "Its remaining services (courts, police, prisons) are still monopolies, with the usual monopoly degradation of quality and cost."
wrong_answers:
  - "It cannot collect any taxes at all."
  - "It is forbidden under international law."
  - "It requires direct democracy to function."
explanation: |
  Molinari asked already in the 19th century whether even security could be produced on the market. A minimal state leaves a free market in everything else — but the monopoly critique still applies to the regalian core.
reviewed: false
