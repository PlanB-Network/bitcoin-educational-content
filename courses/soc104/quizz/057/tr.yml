question: "İş dünyası yanlısı olmak ile piyasa yanlısı olmak arasındaki önemli ayrım nedir?"
answer: "İş dünyası yanlısı olmak, büyük işletmeler ile devlet arasındaki bir ittifakı desteklemek anlamına gelirken; piyasa yanlısı olmak, devlet kayırmacılığı olmadan serbest rekabeti desteklemek anlamına gelir"
wrong_answers:
  - "İş dünyası yanlısı olmak küçük işletmeleri desteklemek anlamına gelirken, piyasa yanlısı olmak çok uluslu şirketleri desteklemek anlamına gelir"
  - "İş dünyası yanlısı olmak düzenlemeye tamamen karşı çıkmak anlamına gelirken, piyasa yanlısı olmak ılımlı düzenlemeyi kabul etmek anlamına gelir"
  - "İş dünyası yanlısı olmak yerli sanayiye odaklanırken, piyasa yanlısı olmak uluslararası ticarete odaklanır"
explanation: >-
  Merkezciler iş dünyası yanlısı olma eğilimindedir; bu, büyük işletmeler ile devlet arasında bir tür ittifakı destekledikleri anlamına gelir ve piyasa yanlısı olmaktan farklıdır. Piyasa yanlısı olmak, devlet kayırmacılığı veya kurumsal korumacılık olmadan serbest rekabeti destekler. Bu ayrım kritik önemdedir, çünkü iş dünyası yanlısı politikalar tekeller ve serbest piyasa rekabetini fiilen zayıflatan düzenleyici korumalar yaratabilir.
