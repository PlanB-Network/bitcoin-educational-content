question: "Koji je vodeći princip usmeravao glasove Frederica Bastiata u Nacionalnoj skupštini?"
answer: "Promovisanje individualnih i ekonomskih sloboda i smanjenje mešanja države"
wrong_answers:
  - "Odbrana kraljevske vlasti i očuvanje monarhističkih tradicija"
  - "Unapređenje socijalističkih politika radi ravnomernije preraspodele bogatstva"
  - "Centristička strategija kompromisa između levih i desnih frakcija"
explanation: >-
  Bastiat je glasao na osnovu temeljnog principa: promovisanja individualnih i ekonomskih sloboda uz smanjenje mešanja države. Nije bio centristički oportunista, niti rojalista ili socijalista. Glasao je sa onom stranom koja je predlagala mere usklađene sa slobodom i ograničenom vlašću.
reviewed: false
