question: "Perché la posizione libertaria sulla legalizzazione delle droghe comporta la condizione che il ruolo dello Stato nella società debba essere ridotto?"
answer: "Perché una liberalizzazione presa in carico dallo Stato sostituirebbe la responsabilità individuale con un'assistenza gestita dal governo, mentre i libertari vogliono che i cittadini sopportino le conseguenze delle proprie scelte con il sostegno di associazioni private"
wrong_answers:
  - "Perché una legalizzazione controllata dallo Stato genererebbe troppe entrate fiscali, rendendo il governo eccessivamente potente e corrotto"
  - "Perché lo Stato imporrebbe standard di qualità che farebbero salire i prezzi e ricreerebbero mercati neri"
  - "Perché la regolamentazione governativa delle droghe violerebbe gli accordi commerciali internazionali e le relazioni diplomatiche"
explanation: >-
  I libertari sostengono la liberalizzazione delle droghe, ma insistono che il ruolo dello Stato debba essere ridotto perché il loro obiettivo è ripristinare la responsabilità individuale, non espandere la gestione statale. Se qualcuno diventa dipendente, deve assumersene la responsabilità invece di chiedere allo Stato di fornire assistenza. La soluzione alla dipendenza risiede nell'iniziativa privata: sostegno volontario da individui, famiglie e associazioni caritative. Una legalizzazione gestita dallo Stato contraddirebbe il principio libertario fondamentale della responsabilità personale.
reviewed: false
