question: push-<n имеет тип Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ. Почему его выход обязательно должен быть суммой, включающей полный тип вектора Aⁿ?
answer: Буфер Aᑉⁿ вмещает не более n−1 элементов, поэтому добавление элемента в полный буфер даёт n элементов — представить это может только Aⁿ.
wrong_answers:
  - Сумма позволяет вызывающей стороне выбрать более дешёвое кодирование, поскольку векторы сериализуются компактнее, чем произведения опций.
  - Push может завершиться неудачей на пустом буфере, и ветвь Aⁿ — это случай ошибки, несущий старое содержимое.
  - case требует, чтобы любая функция, потребляющая буфер типа-суммы, также производила выход типа-суммы.
explanation: >-
  Aᑉⁿ — это в точности тип списков, длина которых строго меньше n,
  поэтому буфер с максимальной ёмкостью содержит n−1 элементов.
  Добавление ещё одного элемента даёт ровно n элементов, что Aᑉⁿ
  представить не может; слагаемое Aⁿ возвращает этот переполненный
  результат в виде полного вектора. Кодирование переполнения в типе
  выхода делает push-<n тотальной, а не частичной функцией — случай
  отказа на пустом буфере относится к pop-<n, а не к push.
