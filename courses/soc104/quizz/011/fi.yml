question: "Mikä sisäinen jännite Nolanin kaaviossa ilmenee libertaarien keskuudessa?"
answer: "Osa haluaa poistaa valtion kokonaan (anarkokapitalistit), kun taas toiset suosivat minimaalista valtiota, jolla säilyy keskeisiä suvereniteettitoimintoja (minarkistit)"
wrong_answers:
  - "Osa haluaa vahvaa taloudellista sääntelyä, kun taas toiset suosivat kaikkien toimialojen täydellistä sääntelyn purkamista"
  - "Osa kannattaa demokraattisia vaaleja, kun taas toiset suosivat perinnöllistä hallintojärjestelmää"
  - "Osa kannattaa edistyksellisiä sosiaalipolitiikkoja, kun taas toiset puolustavat tiukasti perinteisiä moraaliarvoja"
explanation: >-
  Libertaarisen ajatteluperheen sisällä on perustavanlaatuinen erimielisyys valtion roolista. Anarkokapitalistit haluavat korvata kaikki valtion toiminnot yksityisillä palveluilla, kun taas minarkistit hyväksyvät minimaalisen valtion, jolla säilyy keskeisiä suvereniteettitoimintoja, kuten puolustus ja tuomioistuimet. Molemmat ryhmät jakavat libertaarisen huipun, mutta eroavat siinä, pitäisikö minkäänlaista valtiota olla lainkaan.
