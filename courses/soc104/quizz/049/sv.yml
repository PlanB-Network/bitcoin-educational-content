question: "Vad skiljer neokonservativa från paleokonservativa i deras syn på utrikespolitik?"
answer: "Neokonservativa rättfärdigar militär interventionism för att sprida demokrati, medan paleokonservativa försvarar en mer isolationistisk utrikespolitik"
wrong_answers:
  - "Neokonservativa motsätter sig alla militära åtgärder och föredrar diplomati, medan paleokonservativa stöder förebyggande angrepp mot potentiella hot"
  - "Neokonservativa fokuserar uteslutande på ekonomiska sanktioner, medan paleokonservativa förespråkar att bygga internationella koalitioner för gemensamma militära operationer"
  - "Neokonservativa och paleokonservativa är överens om utrikespolitik men skiljer sig kraftigt åt om inhemsk ekonomisk reglering"
explanation: >-
  Från 2000-talet och framåt blev neokonservativa alltmer engagerade i att rättfärdiga militär interventionism för att inplantera demokrati runt om i världen, särskilt efter den 11 september 2001. Som reaktion gjorde traditionella konservativa anspråk på etiketten 'paleokonservativ' för att särskilja sig. Paleokonservativa kritiserar militär interventionism, försvarar en mer isolationistisk utrikespolitik och lägger större vikt vid nationell och kulturell identitet.
reviewed: false
