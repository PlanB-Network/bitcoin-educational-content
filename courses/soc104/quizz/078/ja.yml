question: "保守主義の政治哲学では、自由よりも何が優先されるか？"
answer: "秩序と伝統であり、それらが堅固に確立されてから初めて自由に価値を認めることができる"
wrong_answers:
  - "社会正義と平等であり、それらが保証されてから初めて個人は真に自由になれる"
  - "経済効率と実用的成果であり、それらが自由が適切な時期を決定する"
  - "個人の財産権であり、他のいかなる自由が与えられる前にも保護されなければならない"
explanation: >-
  保守主義者にとって、秩序と伝統は自由よりも優先される。彼らは、過度の自由は混沌と社会的無秩序を生むため、自由は秩序が堅固に確立された後にのみ価値を認められると論じる。これは、正義を優先する社会主義の見方や、効率性に焦点を当てる中道主義とは対照的である。
reviewed: false
