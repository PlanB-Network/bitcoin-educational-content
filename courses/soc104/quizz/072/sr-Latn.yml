question: "Koja je socijalistička pozicija o zdravstvenoj zaštiti?"
answer: "Pristup zdravstvenoj zaštiti je fundamentalno pravo, a država mora garantovati univerzalni, javno finansirani sistem za svakoga bez obzira na prihod"
wrong_answers:
  - "Zdravstvena zaštita treba da bude mešovit sistem sa osnovnim državnim pokrićem dopunjenim opcijama privatnog osiguranja"
  - "Privatna tržišta pružaju inovativniju zdravstvenu zaštitu, pa pojedinci treba slobodno da biraju sopstveni sistem"
  - "Država treba da obezbeđuje zdravstvenu zaštitu samo najsiromašnijim građanima, dok privatno osiguranje pokriva sve ostale"
explanation: >-
  Za socijaliste, pristup zdravstvenoj zaštiti je fundamentalno pravo, a ne roba. Država mora garantovati univerzalni, javno finansirani zdravstveni sistem kako bi svako imao pristup nezi, bez obzira na prihod. To odražava socijalističku brigu za jednakost, socijalnu pravdu i važnost države u organizovanju usluga u opštem interesu. Mešoviti sistem opisuje centristički pogled, dok pristupi zasnovani na izboru odražavaju libertarijanske i konzervativne pozicije.
