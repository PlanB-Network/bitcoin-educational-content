question: "통화 인플레이션은 왜 시민의 동의 없이 부과되는 숨겨진 세금으로 묘사되나요?"
answer: "정부의 화폐 창출이 통화 가치를 떨어뜨려 사람들이 같은 금액으로 더 적게 살 수 있게 만들지만, 대부분은 가격 상승이 자연스러운 시장의 힘이 아니라 정부 정책을 반영한다는 사실을 깨닫지 못하기 때문입니다"
wrong_answers:
  - "중앙은행이 은행 시스템을 통해 처리되는 모든 트랜잭션에 대해 계좌 보유자에게 공개하지 않고 몰래 수수료를 부과하기 때문입니다"
  - "정부가 돈을 찍어 부유한 개인들에게만 배분하면서 필수재에 대한 더 높은 판매세로 가난한 사람들에게 세금을 매기기 때문입니다"
  - "인플레이션은 민간 기업이 이윤을 늘리기 위해 가격을 올려 발생하며, 이것이 소비자에게 비공식 세금으로 기능하기 때문입니다"
explanation: >-
  시스템에 돈을 주입하면 통화 가치 하락으로 이어지며, 새로운 돈이 진정한 경제성장을 반영하지 않기 때문에 같은 양의 돈으로 더 적게 살 수 있게 됩니다. 대부분의 사람들은 가격 상승을 낳은 것이 정부 정책이라는 사실, 즉 그것이 단순히 통화 가치 하락의 반영이라는 사실을 보지 못합니다. 이는 합법적 절도와 제도화된 수탈에 해당하며, 부유층이 투기 자산을 통해 새로운 돈을 포착하는 동안 중산층을 빈곤하게 만듭니다.
