question: یک نیم‌جمع‌کننده چه چیزی را محاسبه می‌کند؟
answer: carry (AND) و sum (XOR) دو بیت ورودی را.
wrong_answers:
  - مجموع دو عدد چندبیتی را همراه با انتشار carry.
  - میانگین دو بیت را که رو به پایین گرد شده است.
  - OR بیتی و AND دو بیت ورودی را.
explanation: >-
  یک نیم‌جمع‌کننده دو بیت منفرد را می‌گیرد و با استفاده از ترکیب موازی دو
  خروجی تولید می‌کند: بیت carry (AND ورودی‌ها) و بیت sum (XOR ورودی‌ها).
  در Simplicity این به‌صورت and ▵ xor تعریف می‌شود و هر دو عملیات را روی
  همان جفت ورودی اجرا می‌کند.
reviewed: false
