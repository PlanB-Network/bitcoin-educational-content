question: "Какое внутреннее напряжение существует среди либертарианцев на диаграмме Нолана?"
answer: "Одни хотят полностью отменить государство (анархо-капиталисты), тогда как другие предпочитают минимальное государство, сохраняющее ключевые суверенные функции (минархисты)"
wrong_answers:
  - "Одни хотят жесткого экономического регулирования, тогда как другие предпочитают полную дерегуляцию всех отраслей"
  - "Одни поддерживают демократические выборы, тогда как другие выступают за наследственную систему управления"
  - "Одни выступают за прогрессивную социальную политику, тогда как другие защищают строго традиционные моральные ценности"
explanation: >-
  Внутри либертарианской семьи есть фундаментальное разногласие о роли государства. Анархо-капиталисты хотят заменить все функции государства частными услугами, тогда как минархисты принимают минимальное государство, сохраняющее ключевые суверенные функции, такие как оборона и суды. Обе группы разделяют либертарианскую вершину, но расходятся в вопросе о том, должно ли вообще существовать какое-либо государство.
