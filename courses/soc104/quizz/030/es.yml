question: "¿Qué es el paleo-libertarismo?"
answer: "Una síntesis que combina el rechazo del Estado como fuente de coacción con un refuerzo de las instituciones tradicionales y las estructuras sociales voluntarias"
wrong_answers:
  - "Un movimiento libertario que rechaza todos los valores tradicionales y promueve un progresismo social radical"
  - "Una ideología conservadora que usa el poder del Estado para imponer valores tradicionales mientras permite cierta libertad económica"
  - "Una filosofía centrista que busca un compromiso equilibrado entre la economía socialista y la política social conservadora"
explanation: >-
  El paleo-libertarismo combina el rechazo del Estado como fuente institucional de coacción con un refuerzo de las instituciones tradicionales y una preferencia por estructuras sociales voluntarias frente a la autoridad estatal. Se distingue del neo-libertarismo por ser más simpatizante de los valores tradicionales. El paleo-libertario no se opone a que las comunidades se organicen en torno a principios socialistas o comunitarios; solo rechaza que esas comunidades impongan sus valores a todos por la fuerza de la ley.
