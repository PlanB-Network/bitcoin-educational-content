question: "Iciyumviro ca 'spontaneous order' nk'uko Friedrich Hayek agisigura ni iki?"
answer: "Amategeko n'ingingo ngenderwako z'ikibano bikwiye kuva mu mikoranire yidegemvya y'abantu aho guhatirwa n'itegura ry'ubutegetsi bw'agahotoro"
wrong_answers:
  - "Amasoko ubwayo yama agana ku monopoly kiretse Leta yinjiye kugira ngo izigame uburinganire bw'ihiganwa"
  - "Amatora ya demokarasi ni yo nzira yonyene yemewe yo gushinga amategeko agenga ikibano"
  - "Ibibazo vy'ubutunzi bivuka ubwavyo kandi bisaba ko Leta yinjira ubwo nyene kugira ngo isubize ugushikama"
explanation: >-
  Iciyumviro ca Hayek ca spontaneous order kivuga ko amategeko agenga ikibano adakwiye guhatirwa avuye hejuru biciye mu itegura ryo hagati, ahubwo akwiye kuva mu rukino rwidegemvya rw'ubushake bw'abantu, amasezerano, n'imigenderanire y'ubushake. Ico ni inkingi nyamukuru y'ivyiyumviro vy'abaharanira umwidegemvyo. Ntibisigura ko amasoko agana ku monopoly canke ko ibibazo bisaba ko Leta yinjira.
