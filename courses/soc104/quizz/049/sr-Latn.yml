question: "Kako odgovor George W. Bush-a na finansijsku krizu iz 2008. ilustruje 'problematičnu fleksibilnost' konzervativnih principa?"
answer: "Tako što je napustio principe slobodnog tržišta da bi spasao velike banke, otkrivajući konzervativno shvatanje države kao krajnjeg garanta nacionalne ekonomske stabilnosti"
wrong_answers:
  - "Odbio je svako državno mešanje i pustio banke da propadnu, strogo se držeći ideologije slobodnog tržišta bez obzira na posledice"
  - "Trajno je nacionalizovao bankarski sektor i uveo progresivno oporezivanje, prelazeći iz konzervativizma u demokratski socijalizam"
  - "Odgovorio je smanjenjem sve državne potrošnje i ukidanjem finansijskih propisa kako bi tržištu prepustio da se samo ispravi"
explanation: >-
  Bush je izjavio da je 'napustio principe slobodnog tržišta da bi spasao sistem slobodnog tržišta' intervenišući kako bi spasao velike banke. To pokazuje kako konzervativci mogu dati prednost moći i kontinuitetu nacije nad apstraktnim tržišnim principima. Ista fleksibilna logika pojavljuje se u Trump-ovim protekcionističkim trgovinskim politikama, sprovođenim u ime nacionalnog interesa uz rizik podsticanja korporativizma i ortačkog kapitalizma.
