question: "Hayek 关于中央计划为何失败的根本论证是什么？"
answer: "知识只以分散碎片的形式存在，由不同个人拥有，无法被中央权威集中或整合"
wrong_answers:
  - "中央计划者在道德上腐败，总是为自身利益而非公共利益行动"
  - "民主制度对经济变化反应过慢，使中央化决策总是过时"
  - "中央计划失败是因为公民故意抵制政府命令，并拒绝遵守监管"
explanation: >-
  Hayek 的根本论证建立在信息的性质之上。他证明，知识从不存在于集中或整合的形式中，而只存在为所有不同个人所拥有的分散碎片。价值是主观的，只能以本地化且不完整的方式被知晓。坐在办公室里的中央计划者，并不知道事物的真实价格，因为他没有参与互动和交换。
reviewed: false
