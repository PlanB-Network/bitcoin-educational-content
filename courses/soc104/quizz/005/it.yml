question: "Perché l'asse sinistra-destra è considerato inadeguato per collocare pensatori liberali classici come Bastiat o Ron Paul?"
answer: "Perché il liberalismo classico valorizza sia le libertà economiche sia quelle personali, che né la sinistra né la destra abbracciano pienamente"
wrong_answers:
  - "Perché i liberali classici si allineano sempre con le politiche economiche di destra e rifiutano tutte le posizioni di sinistra"
  - "Perché i liberali classici sono centristi che adottano versioni moderate delle ideologie sia di sinistra sia di destra"
  - "Perché i liberali classici si oppongono a ogni forma di governo, rendendoli anarchici piuttosto che pensatori politici"
explanation: >-
  L'asse sinistra-destra fallisce con i liberali classici perché non può accogliere una posizione che difende simultaneamente la libertà economica (tipicamente di destra) e la libertà personale (tipicamente di sinistra). I liberali classici non sono centristi in cerca di compromesso, né sono anarchici o puramente di destra. Semplicemente non si adattano a uno spettro unidimensionale.
reviewed: false
