question: V čom spočívala jeho kritika zákona o Caisse d'Escompte z novembra 1789?
answer: Je to monopolná inštitúcia, ktorá sa musí podriadiť pravidlám voľnej súťaže
wrong_answers:
  - Zriaďuje inštitúciu, ktorá bude podporovať financovanie útočných vojen
  - Narúša vydávanie asignátov
  - Zvýhodňuje bohatých
explanation: |
  Dupont de Nemours kritizoval monopol udelený Caisse d'Escompte, pretože podľa neho bránil voľnej súťaži a škodil hospodárstvu.
