question: "O que caracteriza a parte inferior do eixo de liberdade pessoal no diagrama de Nolan?"
answer: "Preferência por ordem, segurança, valores tradicionais e pelo Estado regulando a moral e mantendo a ordem pública"
wrong_answers:
  - "Preferência por autonomia individual, tolerância e mínima interferência estatal nas escolhas de vida pessoal"
  - "Preferência por desregulamentação econômica, livre comércio e abolição de tarifas e subsídios"
  - "Preferência por redistribuição de riqueza, impostos elevados e nacionalização de setores-chave"
explanation: >-
  A parte inferior do eixo de liberdade pessoal representa o controle estatal máximo sobre a vida pessoal, caracterizado por uma preferência por ordem, segurança e valores tradicionais. O Estado regula a moral, mantém a ordem pública e pode defender uma visão específica de moralidade ou tradição. O topo do eixo representa o oposto: liberdade individual e tolerância. As políticas econômicas são medidas no eixo horizontal separado.
reviewed: false
