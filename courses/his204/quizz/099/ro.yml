question: Care a fost critica sa la adresa Legii privind Caisse d'Escompte din noiembrie 1789?
answer: Este o instituție cu monopol care trebuie să respecte regulile liberei concurențe
wrong_answers:
  - Instituie un organism care va încuraja finanțarea războaielor ofensive
  - Perturbă emiterea asignatelor
  - Favorizează bogații
explanation: |
  Dupont de Nemours a criticat monopolul acordat Caisse d'Escompte, considerând că acesta împiedica libera concurență și dăuna economiei.
