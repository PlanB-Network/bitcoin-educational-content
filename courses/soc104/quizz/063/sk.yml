question: "Aké je kľúčové rozlíšenie Hannah Arendtovej medzi klasickým despotizmom a totalitarizmom?"
answer: "Totalitarizmus ľudí nielen podrobuje tyranským pravidlám, ale robí ľudské bytosti neschopnými nezávislého konania, čím neguje samotnú politiku"
wrong_answers:
  - "Klasický despotizmus kontroluje ekonomiku, zatiaľ čo totalitarizmus kontroluje iba politické a vojenské inštitúcie"
  - "Totalitarizmus je jednoducho extrémnejšia verzia despotizmu, líšiaca sa iba rozsahom represie"
  - "Klasický despotizmus používa ideológiu na ospravedlnenie svojej vlády, zatiaľ čo totalitarizmus sa spolieha čisto na vojenskú silu"
explanation: >-
  Arendtová tvrdí, že totalitarizmus sa zásadne líši od klasického despotizmu. Nie je to jednoducho extrémnejšia tyrania, ale systém, ktorý robí ľudské bytosti nadbytočnými a ničí ich schopnosť nezávislého konania. Pre Arendtovú je politika schopnosťou ľudu vziať svoj osud do vlastných rúk a totalitarizmus je priamou negáciou tejto schopnosti, čo ho kvalitatívne odlišuje od despotizmu.
