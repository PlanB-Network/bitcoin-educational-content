question: "Ai thường được trích dẫn như nhân vật sáng lập của chủ nghĩa bảo thủ hiện đại?"
answer: "Edmund Burke, người ủng hộ việc bảo tồn các định chế và truyền thống trước những thay đổi cấp tiến của Cách mạng Pháp"
wrong_answers:
  - "Karl Marx, người phát triển lý thuyết đấu tranh giai cấp và chủ nghĩa duy vật lịch sử trong thế kỷ XIX"
  - "John Locke, người trình bày lý thuyết về quyền tự nhiên và khế ước xã hội trong thế kỷ XVII"
  - "Adam Smith, người viết The Wealth of Nations và sáng lập ngành kinh tế học cổ điển"
explanation: >-
  Edmund Burke thường được trích dẫn như nhân vật sáng lập của chủ nghĩa bảo thủ vì sự phản đối của ông đối với Cách mạng Pháp. Reflections on the Revolution in France (1790) của ông đề cao sự thận trọng và cải cách dần dần thay vì thay đổi cấp tiến. Ông tin rằng xã hội nên tiến lên không phải bằng cách xóa sạch quá khứ mà thông qua các cải cách từng bước bảo tồn các định chế và truyền thống đã được thử thách.
