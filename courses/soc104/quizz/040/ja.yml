question: "国家資金による社会扶助プログラムは、意図だけに頼ることの危険を示すものとして、どのように逆効果を生み得ますか？"
answer: "依存を生み、働くインセンティブを取り除き、その資金はまず富を生産した人々から取られなければならないため、収奪に等しくなり得る"
wrong_answers:
  - "過度の個人貯蓄を促し、消費支出を減らし、より広い経済にデフレを引き起こす"
  - "労働コストを政府へ移し、競争的賃金の必要性を減らすことで、民間企業を強化する"
  - "階級の区別を徹底的に排除するため、社会的流動性が不要になり、イノベーションが停滞する"
explanation: >-
  フリードマンは、人間のインセンティブに関する厳密な分析を怠ると、寛大な意図が有害な結果を生み得ると警告する。国家資金による扶助プログラムは、依存を生み、働くインセンティブをなくし、資金がまず富の生産者から取られなければならないため一種の収奪を構成するリスクがある。貧困削減や効率性のような測定可能な結果は、高尚な意図より優先されなければならない。
reviewed: false
