question: "Какво предупреждение отправя Milton Friedman относно оценяването на политическите политики?"
answer: "Политиките трябва да бъдат оценявани по резултатите им, а не по намеренията им"
wrong_answers:
  - "Политиките трябва да бъдат оценявани според моралния характер на политиците, които ги предлагат"
  - "Политиките трябва да бъдат оценявани според това колко популярни са сред широката гласуваща публика"
  - "Политиките трябва да бъдат оценявани според това дали съответстват на първоначалната конституция на страната"
explanation: >-
  Friedman пише, че една от най-големите грешки е да се съди за политики по намеренията им, а не по резултатите им, като отбелязва, че програмите, обозначени като предназначени за бедните, почти винаги произвеждат ефекти, противоположни на онова, което техните спонсори са възнамерявали. Това отеква в учението на Bastiat, че добрият икономист взема предвид както краткосрочните, така и дългосрочните ефекти върху цялото население.
reviewed: false
