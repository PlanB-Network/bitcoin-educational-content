question: "Čo kurz označuje za skutočné politické delenie, ktoré presahuje tradičné spektrum ľavica-pravica-stred?"
answer: "Delenie medzi základnými filozofickými princípmi: sloboda alebo nátlak, dobrovoľný súhlas alebo donútenie, zodpovedný jednotlivec alebo kolektív"
wrong_answers:
  - "Delenie medzi bohatými a chudobnými krajinami o kontrolu nad medzinárodnými obchodnými dohodami a globálnymi finančnými inštitúciami"
  - "Delenie medzi mestským a vidieckym obyvateľstvom o priority vládnych výdavkov a investície do infraštruktúry"
  - "Delenie medzi progresívnymi a tradičnými kultúrami o spoločenské normy, rodinné hodnoty a náboženské vzdelávanie"
explanation: >-
  Kurz tvrdí, že skutočné politické delenie nespočíva v tradičných nálepkách ľavica-pravica-stred, ale v základných filozofických princípoch: sloboda alebo nátlak, dobrovoľný súhlas alebo donútenie, zodpovedný jednotlivec alebo kolektív. Správny spôsob uvažovania o politike je začať od etických princípov, nie od nálepiek.
