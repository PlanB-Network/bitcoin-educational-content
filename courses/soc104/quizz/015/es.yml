question: "¿Por qué sostiene el modelo bidimensional que la mayoría de las cuestiones políticas pueden dividirse en categorías económicas y personales?"
answer: "Porque las cuestiones económicas tratan de lo que haces como productor y consumidor, mientras que las cuestiones personales tratan de tus relaciones privadas, creencias y autonomía corporal"
wrong_answers:
  - "Porque todos los debates políticos se reducen en última instancia a desacuerdos sobre niveles de impuestos y prácticas religiosas"
  - "Porque históricamente los gobiernos solo regulan dos cosas: el mercado y el ejército"
  - "Porque los filósofos políticos siempre han separado las preocupaciones materiales de las espirituales desde la Antigüedad"
explanation: >-
  El modelo bidimensional se basa en la idea de que las cuestiones políticas se dividen en dos grandes categorías. Las libertades económicas cubren producción, consumo, comercio, empleo y gestión del dinero. Las libertades personales cubren relaciones privadas, opiniones, creencias y elecciones sobre tu propio cuerpo y mente. Esta separación permite un mapeo mucho más matizado de las posiciones políticas que un único eje izquierda-derecha.
