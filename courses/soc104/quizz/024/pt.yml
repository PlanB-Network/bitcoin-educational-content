question: "Como Ron Paul ilustrou a posição paleo-libertária sobre questões como o uso de drogas e o aborto?"
answer: "Ele pessoalmente desaconselhava o uso de drogas e se opunha ao aborto, mas politicamente lutava contra a proibição federal e argumentava que as escolhas deveriam ser deixadas aos indivíduos ou aos estados"
wrong_answers:
  - "Ele apoiava a legalização federal de todas as drogas e do aborto como questão de direitos individuais absolutos"
  - "Ele fez campanha por proibições federais rígidas tanto das drogas quanto do aborto com base em suas convicções morais pessoais"
  - "Ele se recusava a expressar qualquer opinião pessoal sobre essas questões, argumentando que políticos deveriam permanecer moralmente neutros"
explanation: >-
  Ron Paul exemplifica a síntese paleo-libertária ao separar convicções morais pessoais de coerção política. Ele sempre desaconselhou o uso de drogas, mas simultaneamente se opôs à proibição das drogas. Ele era pessoalmente contrário ao aborto, mas argumentava que a escolha deveria ser deixada aos estados federados em vez de imposta de cima. Isso demonstra como alguém pode sustentar fortes valores tradicionais enquanto se recusa a usar o poder coercitivo do governo federal para impô-los.
reviewed: false
