question: Simplicity と Gentzen のシーケント計算の関係は何ですか？
answer: 9つのコンビネータは、シーケント計算の連言・選言フラグメントを反映しています。
wrong_answers:
  - Simplicity は、シーケント計算の証明から動作するコードへ直接翻訳されたものである。
  - Gentzen のシーケント計算は、Simplicity プログラムの型検査に実行時に使われる。
  - 両者はまったく無関係であり、表面的な類似は純粋な偶然である。
explanation: >-
  Simplicity の9つのコアルールは、Gentzen のシーケント計算における規則に
  よく似ています。これは、ラムダ計算と自然演繹の間にある Curry-Howard 対応に
  類似しています。このつながりにより、前提における型は結論における型より小さくなり、
  Bit Machine はこれを利用して、データコピーを最小限に抑えた効率的な実行を行います。
reviewed: false
