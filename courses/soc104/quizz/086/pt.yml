question: "Como as três funções essenciais do mercado livre, conforme descritas pelos libertários, constituem juntas um sistema de organização social ao mesmo tempo eficiente e ético?"
answer: "Os preços fornecem uma bússola para decisões, o mercado revela preferências autênticas por meio da oferta e da demanda, e a troca livre permite que os indivíduos determinem seus próprios assuntos de acordo com valores pessoais, combinando eficiência informacional com autonomia moral"
wrong_answers:
  - "O mercado maximiza a riqueza total, impede monopólios por meio da concorrência natural e garante distribuição igual de recursos, combinando produtividade com justiça social"
  - "Mercados livres reduzem os gastos governamentais, estimulam a inovação tecnológica e criam oportunidades de emprego, combinando responsabilidade fiscal com crescimento econômico"
  - "Mercados reduzem os preços ao consumidor, aumentam a qualidade dos produtos por meio da concorrência e expandem o comércio internacional, combinando prosperidade doméstica com cooperação global"
explanation: >-
  A defesa libertária do mercado livre repousa em três funções interconectadas. Primeiro, os preços servem como indicadores confiáveis que orientam decisões econômicas e sociais (a bússola). Segundo, o mercado revela preferências individuais autênticas por meio da oferta e da demanda. Terceiro, a troca livre permite que os atores determinem seus próprios assuntos de acordo com valores pessoais. Hayek mostrou que mercados livres coordenam informações dispersas melhor do que o planejamento central (eficiência), enquanto o consentimento mútuo respeita a dignidade humana mais do que a coerção (justiça).
