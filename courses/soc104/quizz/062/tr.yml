question: "Tüm totaliter rejimler iktidara nasıl geldi?"
answer: "Önceki sistemi silip temiz bir sayfa açmayı haklı gösteren şiddet içeren devrim yoluyla"
wrong_answers:
  - "Mevcut demokratik kurumlar içinde kademeli yasama reformu yoluyla"
  - "Bölgesel kontrol arayan yabancı güçlerin örgütlediği askerî darbeler yoluyla"
  - "Geniş farklarla halk seçimlerini kazanan barışçıl kitle hareketleri yoluyla"
explanation: >-
  Tüm totaliter rejimler iktidara şiddet içeren devrim yoluyla geldi. Bu devrim ikili bir amaca hizmet eder: eski düzeni fiziksel olarak yıkar ve yeni toplumu inşa etmek için şiddet kullanımını ideolojik olarak gerekli gösterir. Bu, totaliter iktidar ele geçirmelerini demokratik geçişlerden, dış destekli darbelerden veya barışçıl seçim zaferlerinden ayırır.
reviewed: false
