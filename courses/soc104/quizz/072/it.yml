question: "Qual è la posizione socialista sulla sanità?"
answer: "L'accesso alla sanità è un diritto fondamentale e lo Stato deve garantire un sistema universale, finanziato pubblicamente, per tutti indipendentemente dal reddito"
wrong_answers:
  - "La sanità dovrebbe essere un sistema misto con una copertura statale di base integrata da opzioni assicurative private"
  - "I mercati privati offrono una sanità più innovativa, quindi gli individui dovrebbero scegliere liberamente il proprio sistema"
  - "Lo Stato dovrebbe fornire assistenza sanitaria solo ai cittadini più poveri, mentre l'assicurazione privata copre tutti gli altri"
explanation: >-
  Per i socialisti, l'accesso alla sanità è un diritto fondamentale, non una merce. Lo Stato deve garantire un sistema sanitario universale finanziato pubblicamente, affinché tutti abbiano accesso alle cure, indipendentemente dal reddito. Ciò riflette l'attenzione socialista per l'uguaglianza, la giustizia sociale e l'importanza dello Stato nell'organizzare i servizi nell'interesse generale. Il sistema misto descrive la visione centrista, mentre gli approcci basati sulla scelta riflettono posizioni libertarie e conservatrici.
