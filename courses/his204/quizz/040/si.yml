question: de Gournay කණ්ඩායම ප්‍රකාශයට පත් කිරීමට හැකි කළ ප්‍රසිද්ධ පොත කුමක්ද?
answer: Richard Cantillon විසින් රචිත සාමාන්‍ය වාණිජයේ ස්වභාවය පිළිබඳ රචනය
wrong_answers:
  - David Humeගේ දේශපාලන සංවාද
  - Josiah Childගේ වාණිජ නිබන්ධන
  - Machiavelliගේ කුමාරයා
explanation: |
  Gournay කවය Cantillonගේ "Essai" මරණින් පසු ප්‍රකාශයට පත් කිරීමට දායක විය. එය ආර්ථික චින්තනයේ ප්‍රධාන කෘතියකි.
