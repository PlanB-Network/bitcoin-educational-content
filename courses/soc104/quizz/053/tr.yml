question: "Liberteryenizm içinde minarşistler ile anarko-kapitalistler arasındaki temel fark nedir?"
answer: "Minarşistler savunma, adalet ve polis için asgari bir devleti kabul ederken, anarko-kapitalistler tüm devlet işlevlerinin özelleştirilmesini ister"
wrong_answers:
  - "Minarşistler her tür devleti reddederken, anarko-kapitalistler piyasaların sınırlı devlet düzenlemesini kabul eder"
  - "Minarşistler temel hizmetler için artan oranlı vergilendirmeyi desteklerken, anarko-kapitalistler tüm vergilendirmeye karşı çıkar"
  - "Minarşistler yalnızca ekonomik özgürlüğe odaklanırken, anarko-kapitalistler hem ekonomik hem de toplumsal özgürlükleri savunur"
explanation: >-
  Minarşistler devletin savunma, adalet ve polis gibi temel işlevlerle sınırlı olması gerektiğine inanır ("gece bekçisi devleti"), anarko-kapitalistler ise bu işlevlerin bile özelleştirilmesi ve gönüllü piyasa rekabeti yoluyla yönetilmesi gerektiğini savunur. Aralarındaki anlaşmazlık, temel etik ilkelerden çok pratik uygulama üzerinedir. Her iki eğilim de kişinin kendine sahip olması ve saldırmazlık şeklindeki aynı liberteryen değerleri paylaşır.
