question: "Apa posisi sosialis tentang layanan kesehatan?"
answer: "Akses ke layanan kesehatan adalah hak fundamental, dan negara harus menjamin sistem universal yang didanai publik untuk semua orang tanpa memandang pendapatan"
wrong_answers:
  - "Layanan kesehatan harus berupa sistem campuran dengan cakupan dasar dari negara yang dilengkapi oleh opsi asuransi swasta"
  - "Pasar privat menyediakan layanan kesehatan yang lebih inovatif, sehingga individu harus memilih sistem mereka sendiri secara bebas"
  - "Negara harus menyediakan layanan kesehatan hanya untuk warga termiskin sementara asuransi swasta menanggung semua orang lainnya"
explanation: >-
  Bagi sosialis, akses ke layanan kesehatan adalah hak fundamental, bukan komoditas. Negara harus menjamin sistem layanan kesehatan universal yang didanai publik sehingga semua orang memiliki akses ke perawatan, tanpa memandang pendapatan. Ini mencerminkan perhatian sosialis pada kesetaraan, keadilan sosial, dan pentingnya negara dalam mengorganisasi layanan demi kepentingan umum. Sistem campuran menggambarkan pandangan sentris, sementara pendekatan berbasis pilihan mencerminkan posisi libertarian dan konservatif.
