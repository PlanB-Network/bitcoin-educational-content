question: "Quelles figures emblématiques sont associées à la liberté économique maximale sur le diagramme de Nolan ?"
answer: "Margaret Thatcher, Ronald Reagan et Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaurès et Bernie Sanders"
  - "Nelson Mandela, Simone Veil et Noam Chomsky"
  - "Vladimir Poutine, Xi Jinping et Joseph de Maistre"
explanation: >-
  Thatcher, Reagan et Milei sont cités comme des figures emblématiques de la liberté économique maximale, favorisant moins d'intervention de l'État, moins de réglementations et des impôts plus bas. Roosevelt, Jaurès et Sanders représentent l'extrémité opposée, favorable au contrôle étatique de l'économie. Mandela, Veil et Chomsky représentent la liberté personnelle maximale. Poutine, Xi Jinping et de Maistre représentent le contrôle étatique maximal de la vie personnelle.
reviewed: false
