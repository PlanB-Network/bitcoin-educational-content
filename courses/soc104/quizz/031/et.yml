question: "Mida usuvad prantsuse libertäärid (sotsialistlikud anarhistid) eraomandi kohta?"
answer: "Eraomand ja kapitalism tuleb kaotada, sest need on rõhumise allikad"
wrong_answers:
  - "Eraomand on loomulik õigus, mis eelneb riigile ja mida tuleb iga hinna eest kaitsta"
  - "Eraomandit peaks reguleerima riik, kuid seda ei tohiks ühiskonnast kunagi täielikult kõrvaldada"
  - "Eraomand on vastuvõetav ainult siis, kui see jaotatakse võrdselt kõigi kommuuni liikmete vahel"
explanation: >-
  Prantsuse libertäärid, sotsialistliku anarhismi pärijad selliste mõtlejate nagu Proudhon ja Bakunin kaudu, leiavad, et nii riik kui ka eraomand tuleb kaotada kui kaksikallikad rõhumisele. Seda väljendab Proudhoni kuulus vormel "Omand on vargus." Esimene vale vastus kirjeldab libertariaanlikku positsiooni, mis on libertääride vaatega põhimõtteliselt vastuolus.
