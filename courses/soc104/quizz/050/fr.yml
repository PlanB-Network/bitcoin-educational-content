question: "Qu'est-ce qui distingue les néoconservateurs des paléoconservateurs dans leur approche de la politique étrangère ?"
answer: "Les néoconservateurs justifient l'interventionnisme militaire pour diffuser la démocratie, tandis que les paléoconservateurs défendent une politique étrangère plus isolationniste"
wrong_answers:
  - "Les néoconservateurs s'opposent à toute action militaire et privilégient la diplomatie, tandis que les paléoconservateurs soutiennent des frappes préventives contre les menaces potentielles"
  - "Les néoconservateurs se concentrent exclusivement sur les sanctions économiques, tandis que les paléoconservateurs préconisent la constitution de coalitions internationales pour des opérations militaires conjointes"
  - "Les néoconservateurs et les paléoconservateurs sont d'accord sur la politique étrangère mais divergent fortement sur la réglementation économique intérieure"
explanation: >-
  À partir des années 2000, les néoconservateurs se sont de plus en plus impliqués dans la justification de l'interventionnisme militaire visant à implanter la démocratie dans le monde, en particulier après le 11 septembre 2001. En réaction, les conservateurs traditionnels ont revendiqué l'étiquette de « paléoconservateur » pour se distinguer. Les paléoconservateurs critiquent l'interventionnisme militaire, défendent une politique étrangère plus isolationniste et accordent une plus grande importance à l'identité nationale et culturelle.
reviewed: false
