question: "Какая общая черта есть у левых и правых политических партий, несмотря на их внешнее противостояние?"
answer: "Обе защищают право государства управлять жизнью людей через регулирование и налоги"
wrong_answers:
  - "Обе выступают за полную отмену государственного вмешательства в экономические вопросы"
  - "Обе ставят индивидуальную свободу выше коллективной организации общества"
  - "Обе отвергают использование денежно-кредитной политики как инструмента государственных расходов"
explanation: >-
  Несмотря на кажущееся противостояние, левые и правые разделяют предпочтение государственного вмешательства. И те и другие критикуют свободный рынок и защищают право государства управлять жизнью людей через регулирование и налоги. Левые критикуют рынки как источник неравенства, а правые видят в них угрозу суверенитету, но обе стороны обращаются к государству за решениями.
reviewed: false
