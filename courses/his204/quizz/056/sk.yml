question: Aký je pre fyziokratov rozdiel medzi produkciou a ziskom?
answer: Priemyselník a obchodník môžu získať, ale produkuje iba farmár, pretože produkcia je tvorba užitočnej hmoty
wrong_answers:
  - Priemyselníci a obchodníci nemusia dosiahnuť zisk. Iba poľnohospodárstvo nevyhnutne prináša zisky.
  - Farmár môže zarobiť, ale produkujú iba priemyselník a obchodník, pretože produkovať znamená poskytovať službu
  - Produkcia a zisk sú to isté
explanation: |
  Fyziokrati verili, že produktívne je iba poľnohospodárstvo, pretože vytvára novú hmotu. Priemysel a obchod považovali za neplodné činnosti, keďže existujúce bohatstvo len pretvárajú alebo presúvajú.
