question: "Quali sono i valori cardinali del centrismo?"
answer: "Moderazione, compromesso, adattamento e utilità pubblica"
wrong_answers:
  - "Tradizione, ordine, autorità e identità nazionale"
  - "Libertà, proprietà privata, consenso e responsabilità individuale"
  - "Uguaglianza, giustizia sociale, solidarietà e proprietà collettiva"
explanation: >-
  I valori cardinali del centrismo sono moderazione, compromesso, adattamento e utilità pubblica. Riflettono l'enfasi centrista sull'equilibrio pragmatico piuttosto che sull'impegno ideologico. Le altre opzioni descrivono rispettivamente i valori cardinali del conservatorismo, del libertarismo e del socialismo.
