question: "Welke van de volgende is een voorbeeld van spontane orde zoals beschreven door Hayek?"
answer: "Taal, die zich organisch ontwikkelde door historische interacties in plaats van te zijn ontworpen door intellectuelen in een bureau"
wrong_answers:
  - "Een nationale grondwet, die zorgvuldig werd opgesteld door gekozen vertegenwoordigers om sociale regels vast te leggen"
  - "Een stimuleringsplan van de overheid, dat door economen werd ontworpen om economische activiteit te coördineren"
  - "Een openbaar onderwijssysteem, dat door wetgevers werd gecreëerd om universele toegang tot kennis te waarborgen"
explanation: >-
  Hayek beschrijft spontane orde als het product van vrije interacties in de samenleving, voortkomend uit menselijk handelen maar niet uit bewust menselijk ontwerp. Taal is een uitstekend voorbeeld: Frans, Engels en Duits zijn niet geconstrueerd door intellectuelen die grammaticaregels vastlegden, maar ontstonden als de vrucht van langzame, organische organisatie opgebouwd door historische interacties.
reviewed: false
