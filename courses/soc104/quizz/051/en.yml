question: "What do libertarians place at the center of their political philosophy?"
answer: "Ethics and law"
wrong_answers:
  - "Economic growth and wealth creation"
  - "Social equality and collective welfare"
  - "National identity and cultural preservation"
explanation: >-
  Libertarians distinguish themselves from all other political families by placing ethics and law at the center of their philosophy, not the economy. When they defend the market economy, it is less for its capacity to produce wealth than for its promotion of individual freedom and responsibility. Economic growth is a secondary benefit, not the foundational principle.
reviewed: false
