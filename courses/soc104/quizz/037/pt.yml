question: "Que alerta Milton Friedman fez sobre julgar políticas públicas?"
answer: "As políticas devem ser julgadas por seus resultados, e não por suas intenções"
wrong_answers:
  - "As políticas devem ser julgadas pelo caráter moral dos políticos que as propõem"
  - "As políticas devem ser julgadas por sua popularidade junto ao público eleitor em geral"
  - "As políticas devem ser julgadas por estarem alinhadas ou não à constituição original do país"
explanation: >-
  Friedman escreveu que um dos maiores erros é julgar políticas por suas intenções, e não por seus resultados, observando que programas rotulados como sendo para os pobres quase sempre produzem efeitos opostos aos que seus patrocinadores pretendiam. Isso ecoa o ensinamento de Bastiat de que um bom economista considera tanto os efeitos de curto prazo quanto os de longo prazo sobre toda a população.
reviewed: false
