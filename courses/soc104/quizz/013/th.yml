question: "ทำไมแบบจำลองสองมิติจึงโต้แย้งว่าประเด็นทางการเมืองส่วนใหญ่สามารถแบ่งเป็นหมวดเศรษฐกิจและหมวดส่วนบุคคลได้?"
answer: "เพราะประเด็นเศรษฐกิจเกี่ยวข้องกับสิ่งที่คุณทำในฐานะผู้ผลิตและผู้บริโภค ขณะที่ประเด็นส่วนบุคคลเกี่ยวข้องกับความสัมพันธ์ส่วนตัว ความเชื่อ และอัตตาณัติทางร่างกายของคุณ"
wrong_answers:
  - "เพราะการถกเถียงทางการเมืองทั้งหมดท้ายที่สุดลดรูปลงเป็นความไม่เห็นพ้องเรื่องระดับภาษีและการปฏิบัติทางศาสนา"
  - "เพราะในประวัติศาสตร์รัฐบาลกำกับเพียงสองสิ่งเท่านั้น: ตลาดและกองทัพ"
  - "เพราะนักปรัชญาการเมืองแยกประเด็นทางวัตถุออกจากประเด็นทางจิตวิญญาณมาตลอดตั้งแต่สมัยโบราณ"
explanation: >-
  แบบจำลองสองมิติตั้งอยู่บนแนวคิดที่ว่าประเด็นทางการเมืองแบ่งออกเป็นสองหมวดกว้าง ๆ เสรีภาพทางเศรษฐกิจครอบคลุมการผลิต การบริโภค การค้า การจ้างงาน และการจัดการเงิน เสรีภาพส่วนบุคคลครอบคลุมความสัมพันธ์ส่วนตัว ความเห็น ความเชื่อ และการเลือกเกี่ยวกับร่างกายและจิตใจของคุณเอง การแยกนี้ทำให้การทำแผนที่จุดยืนทางการเมืองละเอียดอ่อนกว่าแกนซ้าย-ขวาแกนเดียวมาก
reviewed: false
