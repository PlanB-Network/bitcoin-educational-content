question: "Waarom komt het libertarische standpunt over druglegalisering met de voorwaarde dat de rol van de staat in de samenleving moet worden verkleind?"
answer: "Omdat liberalisering die door de staat wordt overgenomen individuele verantwoordelijkheid zou vervangen door door de overheid beheerde zorg, terwijl libertariërs willen dat burgers de gevolgen van hun keuzes dragen met steun van private verenigingen"
wrong_answers:
  - "Omdat door de staat gecontroleerde legalisering te veel belastinginkomsten zou genereren, waardoor de overheid te machtig en corrupt zou worden"
  - "Omdat de staat kwaliteitsnormen zou opleggen die de prijzen zouden opdrijven en zwarte markten opnieuw zouden creëren"
  - "Omdat overheidsregulering van drugs internationale handelsovereenkomsten en diplomatieke relaties zou schenden"
explanation: >-
  Libertariërs steunen drugsliberalisering, maar benadrukken dat de rol van de staat moet worden verkleind omdat hun doel het herstellen van individuele verantwoordelijkheid is, niet het uitbreiden van staatsbeheer. Als iemand afhankelijk wordt, moet die persoon verantwoordelijkheid nemen in plaats van de staat om zorg te vragen. De oplossing voor verslaving ligt in particulier initiatief: vrijwillige steun van individuen, families en liefdadigheidsverenigingen. Door de staat beheerde legalisering zou in strijd zijn met het fundamentele libertarische principe van persoonlijke verantwoordelijkheid.
