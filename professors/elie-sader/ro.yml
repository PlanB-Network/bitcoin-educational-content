bio: |
  Cu peste 20 de ani de experiență în implementarea de rețele critice cu latență redusă, am trăit direct implementarea noilor tehnologii și superioritatea protocoalelor cu standarde deschise datorită efectelor lor de rețea. Înțeleg provocările construirii de produse noi, de modele de afaceri și soluții noi, precum și evanghelizarea pieței și a clienților. Ca business angel part-time, ajut companiile să aducă tehnologie inovatoare pe piață. Am lansat Network Effect pentru a ajuta companiile să înțeleagă valoarea pe care Bitcoin le-o poate aduce, precum și pentru a detalia cazuri de utilizare practice pentru toate tipurile de afaceri de bază. Rețeaua Bitcoin este o autostradă de schimb de valoare supraalimentată, iar protocoalele de layer 2 precum Lightning vor perturba profund nu doar intermediarii și structurile de comisioane, ci vor și inaugura o eră a unor modele de afaceri mai puternice și mai respectuoase față de intimitatea individului.

short_bio: Toate companiile de internet vor deveni companii bitcoin, noi suntem aici să ajutăm
