description: |
  Der "zk" in zkSNACKs steht für Zero Knowledge, was bedeutet, dass wir in unseren Produkten keine persönlichen Benutzerinformationen sammeln können und auch nicht sammeln.

  zkSNACKs hat seinen Coinjoin-Koordinator am 1. Juni 2024 abgeschaltet, und die Website ist offline. Wasabi Wallet besteht als Open-Source-Software weiter.
