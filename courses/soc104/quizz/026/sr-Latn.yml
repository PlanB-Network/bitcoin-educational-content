question: "Šta je paleo-libertarijanizam?"
answer: "Sinteza koja kombinuje odbacivanje države kao izvora prinude sa jačanjem tradicionalnih institucija i dobrovoljnih društvenih struktura"
wrong_answers:
  - "Libertarijanski pokret koji odbacuje sve tradicionalne vrednosti i promoviše radikalni društveni progresivizam"
  - "Konzervativna ideologija koja koristi državnu moć da sprovodi tradicionalne vrednosti, uz dopuštanje izvesne ekonomske slobode"
  - "Centristička filozofija koja traži uravnotežen kompromis između socijalističke ekonomije i konzervativne društvene politike"
explanation: >-
  Paleo-libertarijanizam kombinuje odbacivanje države kao institucionalnog izvora prinude sa jačanjem tradicionalnih institucija i preferiranjem dobrovoljnih društvenih struktura nad državnim autoritetom. Od neo-libertarijanizma se razlikuje time što je skloniji tradicionalnim vrednostima. Paleo-libertarijanac se ne protivi tome da se zajednice organizuju oko socijalističkih ili komunitarističkih principa; samo odbija da takve zajednice silom zakona nametnu svoje vrednosti svima.
