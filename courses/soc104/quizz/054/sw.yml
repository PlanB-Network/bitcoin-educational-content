question: "Wafuasi wa ulibertaria huweka nini katikati ya falsafa yao ya kisiasa?"
answer: "Maadili na sheria"
wrong_answers:
  - "Ukuaji wa uchumi na uundaji wa utajiri"
  - "Usawa wa kijamii na ustawi wa pamoja"
  - "Utambulisho wa kitaifa na uhifadhi wa kitamaduni"
explanation: >-
  Wafuasi wa ulibertaria hujitofautisha na familia nyingine zote za kisiasa kwa kuweka maadili na sheria katikati ya falsafa yao, si uchumi. Wanapotetea uchumi wa soko, huwa si sana kwa uwezo wake wa kuzalisha utajiri bali kwa kukuza kwake uhuru wa mtu binafsi na wajibu. Ukuaji wa uchumi ni faida ya pili, si kanuni ya msingi.
