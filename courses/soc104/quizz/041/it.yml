question: "Che cos'è il principio di non aggressione teorizzato da Murray Rothbard?"
answer: "È illegittimo iniziare l'uso della forza fisica contro un altro individuo o la sua proprietà, sebbene la violenza difensiva sia permessa"
wrong_answers:
  - "Tutte le forme di violenza sono sempre sbagliate, inclusa l'autodifesa e la resistenza all'oppressione"
  - "La violenza è accettabile quando è diretta contro istituzioni oppressive ma mai contro altri individui"
  - "Solo lo Stato ha il diritto legittimo di usare la forza, e gli individui non devono mai ricorrere alla violenza"
explanation: >-
  Il principio di non aggressione di Rothbard sostiene che iniziare l'uso della forza fisica contro un'altra persona o la sua proprietà è illegittimo. È una traduzione filosofica della regola aurea. Tuttavia, non proibisce ogni violenza: la violenza difensiva, inclusa l'autodifesa e la resistenza all'oppressione, è considerata legittima. Questo lo distingue dal pacifismo puro e dal monopolio della forza rivendicato dallo Stato.
reviewed: false
