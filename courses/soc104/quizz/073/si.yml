question: "libertarians taxation ට විරුද්ධ වන්නේ ඇයි?"
answer: "එය property rights හි moral violation එකක් වන නිසා, consent නොමැතිව වෙනත් කෙනෙකුගේ property seize කරන state theft ආකාරයක් වන නිසා"
