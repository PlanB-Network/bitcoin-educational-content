question: "subsidies debate සන්දර්භය තුළ 'moral hazard' සංකල්පය කුමක්ද, සහ මෙම concern එක මතු කරන political family එක කුමක්ද?"
answer: "Moral hazard යනු companies subsidies හරහා fail වීමෙන් prevent කරන විට irresponsibility දෙසට ඇති incentive එකයි, මන්ද අවසානයේ taxpayer ගෙවන නිසාය; මෙම concern එක libertarians මතු කරයි"
wrong_answers:
  - "Moral hazard යනු subsidized companies අඩු taxes ඇති රටවලට relocate වී jobs රැගෙන යාමේ risk එකයි; මෙම concern එක conservatives මතු කරයි"
  - "Moral hazard යනු subsidies ලබන companies කුමනද යන්න තේරීමෙන් government officials corrupt වීමේ danger එකයි; මෙම concern එක centrists මතු කරයි"
  - "Moral hazard යනු public funds ලැබීමෙන් පසුව companies workers exploit කිරීමේ ethical problem එකයි; මෙම concern එක socialists මතු කරයි"
explanation: >-
  Libertarians තර්ක කරන්නේ subsidies සහ bailouts moral hazard නිර්මාණය කරන බවයි: companies fail වීමෙන් prevent කරන විට, poor decisions සඳහා consequences නොමැති නිසා එය irresponsibility සහ recklessness incentivize කරයි. අවසානයේ ගෙවන්නේ taxpayer වන අතර, libertarians එය ගැඹුරින් unjust ලෙස සලකති. මෙම concept එක other political families මගින් මතු කරන corporate relocation, official corruption, හෝ worker exploitation පිළිබඳ concerns වලින් distinct වේ.
