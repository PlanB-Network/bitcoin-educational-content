question: "احزاب سیاسی چپ‌گرا و راست‌گرا با وجود مخالفت ظاهری‌شان چه نقطهٔ مشترکی دارند؟"
answer: "هر دو از حق دولت برای ادارهٔ زندگی مردم از طریق مقررات و مالیات‌ها دفاع می‌کنند"
wrong_answers:
  - "هر دو از لغو کامل مداخلهٔ دولت در امور اقتصادی دفاع می‌کنند"
  - "هر دو آزادی فردی را بر سازمان‌دهی جمعی جامعه اولویت می‌دهند"
  - "هر دو استفاده از سیاست پولی را به عنوان ابزاری برای هزینه‌کرد دولت رد می‌کنند"
explanation: >-
  با وجود اینکه مخالف یکدیگر به نظر می‌رسند، چپ و راست ترجیحی مشترک برای مداخلهٔ دولت دارند. هر دو از بازار آزاد انتقاد می‌کنند و از حق دولت برای ادارهٔ زندگی مردم از طریق مقررات و مالیات‌ها دفاع می‌کنند. چپ بازارها را به عنوان منبع نابرابری نقد می‌کند، در حالی که راست آن‌ها را تهدیدی برای حاکمیت می‌بیند، اما هر دو برای راه‌حل‌ها به دولت رو می‌آورند.
reviewed: false
