question: Potrivit lui Quesnay și fiziocraților, ce stimulează efortul și munca?
answer: Siguranța proprietății private
wrong_answers:
  - Legile represive
  - Moravurile favorabile îmbogățirii meșteșugarilor și industriașilor
  - Frica de foamete
explanation: |
  Siguranța proprietății private era esențială pentru a încuraja investițiile și munca, potrivit fiziocraților. Ei credeau că indivizii erau mai înclinați să muncească și să investească dacă aveau garanția că vor putea păstra roadele muncii lor.
