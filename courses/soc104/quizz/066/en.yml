question: "What is the libertarian position on the question of gay marriage?"
answer: "The state has no business defining marriage; it should be privatized and left to individuals, associations, and religious institutions"
wrong_answers:
  - "Gay marriage should be legalized because all citizens deserve equal treatment under the law"
  - "Gay marriage should be prohibited because traditional marriage is a fundamental institution for procreation"
  - "Gay marriage should be legalized but only through a separate legal framework distinct from traditional marriage"
explanation: >-
  Libertarians argue that the marriage question is fundamentally misframed because it is posed in statist terms. They believe the state has no business interfering in private lives, so the solution is to separate marriage from the state entirely. By imposing a single definition, the state creates conflicts. The first wrong answer reflects the socialist or centrist position, and the second reflects the conservative position.
