description: |
  Il corso bitcoin all'interno della piattaforma "Trovarsi Ora" è un'importante novità per coloro che sono interessati a comprendere meglio bitcoin sia come strumento che come filosofia. Nel corso si imparerà a gestire i bitcoin senza intermediari, ad acquistarli in maniera anonima e sicura. Infine sarà importante gestire due tipi di "conto", uno sicuro e riservato, una specie di piccola cassaforte in cui si conserverà il valore, mentre il secondo, gestito dal telefono, sarà il "portafogli dei contanti" per i piccoli pagamenti istantanei di tutti i giorni.
  Le motivazioni del corso risiede negli scopi della piattaforma "Trovarsi Ora" all'interno delle parole del suo fondatore, il divulgatore Matteo Bordini. Bitcoin è presentato come una soluzione ad alcune forze odierne che tendono a limitare la libertà degli individui. Con le tecniche illustrate si potrà migliorare le proprie difese, imparando ad utilizzare uno degli strumenti più importanti dei nostri tempi.
  L'insegnante del corso è Michele Gandolfi, esperto in materia di cybersicurezza, nonché uno tra i più influenti membri all'interno della community bitcoin italiana.
