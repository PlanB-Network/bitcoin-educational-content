question: "Welk leidend principe bepaalde de stemmen van Frederic Bastiat in de Nationale Vergadering?"
answer: "De bevordering van individuele en economische vrijheden en de vermindering van overheidsinmenging"
wrong_answers:
  - "De verdediging van koninklijk gezag en het behoud van monarchale tradities"
  - "De bevordering van socialistisch beleid om rijkdom gelijker te herverdelen"
  - "Een centristische compromisstrategie tussen de linker- en rechterfracties"
explanation: >-
  Bastiat stemde op basis van een fundamenteel principe: individuele en economische vrijheden bevorderen en overheidsinmenging verminderen. Hij was geen centristische opportunist, en ook geen royalist of socialist. Hij stemde met de kant die maatregelen voorstelde die aansloten bij vrijheid en beperkte overheid.
reviewed: false
