question: "Care este poziția conservatoare privind imigrația?"
answer: "Statul are dreptul suveran de a-și controla frontierele pentru a proteja securitatea națională și identitatea culturală"
wrong_answers:
  - "Frontierele ar trebui să fie deschise necondiționat, deoarece restricțiile discriminatorii încalcă drepturile omului"
  - "Imigrația ar trebui determinată de cererea pieței, cetățenii hotărând contractual relațiile lor cu străinii"
  - "Politica de imigrație ar trebui să echilibreze nevoile economice cu integrarea reușită, pe baza evaluării experților"
explanation: >-
  Conservatorii consideră că ordinea, identitatea și suveranitatea națională trebuie să aibă prioritate față de primirea nerestricționată a străinilor sau refugiaților. Frontierele și o populație bine definită fac parte din valorile civilizate. Răspunsurile greșite reprezintă poziția socialistă (frontiere deschise ca drepturi ale omului), poziția libertariană (imigrație bazată pe piață) și poziția centristă (abordare echilibrată, ghidată de experți).
