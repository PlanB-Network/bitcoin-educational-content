question: ในการประกอบแบบขนาน เกิดอะไรขึ้นกับอินพุต?
answer: ปฏิบัติการทั้งสองรับอินพุตเดียวกัน และเอาต์พุตของพวกมันก่อเป็น product (คู่).
wrong_answers:
  - อินพุตถูกแบ่งครึ่ง โดยแต่ละปฏิบัติการรับคนละส่วน.
  - ปฏิบัติการหนึ่งประมวลผลอินพุตก่อน แล้วอีกปฏิบัติการรับผลลัพธ์ที่ถูกแก้ไข.
  - อินพุตถูกติด tag และส่งไปยังปฏิบัติการเพียงตัวเดียวเพื่อประมวลผล.
explanation: >-
  การประกอบแบบขนานส่งอินพุตเดิมที่ไม่ถูกแก้ไขไปให้ปฏิบัติการทั้งสองพร้อมกัน
  ผลลัพธ์จะถูกรวมเป็น product type (คู่) ใน Simplicity สิ่งนี้ใช้ pair
  combinator ซึ่งเขียนเป็น f ▵ g และให้ผลลัพธ์เป็น ⟨f(a), g(a)⟩ สำหรับ
  อินพุต a.
reviewed: false
