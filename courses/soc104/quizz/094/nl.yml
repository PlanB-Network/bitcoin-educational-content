question: "Waarom wordt monetaire inflatie beschreven als een verborgen belasting die zonder instemming van burgers wordt opgelegd?"
answer: "Omdat geldcreatie door de overheid de valuta devalueert, zodat mensen met hetzelfde bedrag minder kunnen kopen, maar de meesten niet beseffen dat stijgende prijzen overheidsbeleid weerspiegelen in plaats van natuurlijke marktkrachten"
wrong_answers:
  - "Omdat centrale banken stiekem kosten rekenen op elke transactie die via het banksysteem wordt verwerkt zonder die aan rekeninghouders bekend te maken"
  - "Omdat overheden geld drukken en het alleen aan rijke individuen uitdelen terwijl ze de armen belasten via hogere verkoopbelastingen op essentiële goederen"
  - "Omdat inflatie wordt veroorzaakt door private bedrijven die prijzen verhogen om winst te vergroten, wat functioneert als een onofficiële belasting op consumenten"
explanation: >-
  De injectie van geld in het systeem vertaalt zich in valutadevaluatie, waarbij hetzelfde bedrag minder koopt omdat het nieuwe geld geen echte economische groei weerspiegelt. De meeste mensen zien niet dat overheidsbeleid tot stijgende prijzen heeft geleid, die simpelweg de weerspiegeling zijn van valutadevaluatie. Dit komt neer op legale diefstal en geïnstitutionaliseerde plundering, die de middenklasse verarmt terwijl de rijken nieuw geld binnenhalen via speculatieve activa.
reviewed: false
