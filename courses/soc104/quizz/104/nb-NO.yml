question: "Når man ser på hele argumentet i dette kurset, hvordan legemliggjør Bitcoin samtidig den libertarianske kritikken av konstruktivisme, cypherpunk-forpliktelsen til handling og det individualistiske forsvaret av moralsk autonomi?"
answer: "Bitcoin erstatter sentralt planlagte penger med en spontan markedsorden (anti-konstruktivisme), omformer det abstrakte idealet om finansiell frihet til fungerende kode (cypherpunk-handling), og gjenoppretter suveren eiendom og personvern for individet (moralsk autonomi)"
wrong_answers:
  - "Bitcoin bruker demokratisk styring til å fastsette pengepolitikk (anti-konstruktivisme), publiserer utdanningsinnhold om finansiell frihet (cypherpunk-handling), og lar individer stemme over protokollendringer (moralsk autonomi)"
  - "Bitcoin eliminerer all finansiell regulering (anti-konstruktivisme), skaper et utviklerfellesskap som driver lobbyvirksomhet for deregulering (cypherpunk-handling), og gir velstående individer mer kontroll over pengepolitikken (moralsk autonomi)"
  - "Bitcoin desentraliserer serverinfrastruktur på tvers av flere land (anti-konstruktivisme), bruker åpen kildekode-lisensiering til å dele teknologi fritt (cypherpunk-handling), og tilbyr anonyme sosiale medieplattformer for politisk dissens (moralsk autonomi)"
explanation: >-
  Bitcoin befinner seg i skjæringspunktet mellom tre intellektuelle tradisjoner som utforskes i kurset. Det legemliggjør det anti-konstruktivistiske argumentet ved å erstatte sentralt planlagte fiatpenger med en spontan, desentralisert monetær orden som ingen sentral planlegger kan kontrollere. Det oppfyller cypherpunk-imperativet om å skrive kode ved å gjøre abstrakte idealer om finansiell frihet og personvern til fungerende teknologi. Og det tjener det individualistiske forsvaret av moralsk autonomi ved å muliggjøre suveren eiendom, beskytte arbeidets frukter og bevare personvernet, slik at hver person kan være herre over sitt eget liv.
reviewed: false
