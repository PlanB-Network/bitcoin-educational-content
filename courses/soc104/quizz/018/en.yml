question: "What is the definition of statism as presented in the Nolan framework?"
answer: "Using legislation to control and shape society, whether in the name of defending civilization, the working class, nature, or the oppressed"
wrong_answers:
  - "A system of government where elected officials serve fixed terms and power transitions through democratic elections"
  - "The belief that only a strong military can protect a nation's sovereignty and territorial integrity"
  - "An economic philosophy that prioritizes national industries over foreign competition through tariffs and quotas"
explanation: >-
  Statism is defined as using legislation to control and shape society. Both left and right practice it: some in the name of defending civilization, others in the name of defending the working class, nature, or the oppressed. Even centrists approve of it when it suits them. Statism is not limited to military policy, trade protectionism, or simply having elected governments.
reviewed: false
