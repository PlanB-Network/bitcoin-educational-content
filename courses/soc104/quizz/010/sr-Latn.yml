question: "Šta obuhvata kategorija lične slobode?"
answer: "Ono što radite u svojim privatnim odnosima, sa svojim mišljenjima, uverenjima i svime što uključuje vaše sopstveno telo i um"
wrong_answers:
  - "Ono što radite kao proizvođač, uključujući pokretanje preduzeća, zapošljavanje radnika i trgovinu robom"
  - "Koliko poreza plaćate, kakva ulaganja pravite i kako upravljate svojom finansijskom imovinom"
  - "Vašu sposobnost da se takmičite na tržištu, određujete cene svojih proizvoda i birate svoje dobavljače"
explanation: >-
  Lična sloboda obuhvata ono što radite u svojim privatnim odnosima, sa svojim mišljenjima i uverenjima, i sve što uključuje vaše sopstveno telo i um. To uključuje brak, izbor šta ćete čitati, verske prakse, izbor hrane i lekova, i sa kim se družite. Poslovne aktivnosti, porezi i tržišne odluke spadaju u ekonomsku slobodu.
