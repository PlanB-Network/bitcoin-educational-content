question: Physiocracy යන පදය පැමිණෙන්නේ කොහෙන්ද?
answer: ස්වභාවයේ පාලනය යන අර්ථය ඇති එය, Quesnayගේ ලිපි එකතුවක මාතෘකාව ලෙස මුලින් භාවිතා විය
wrong_answers:
  - ස්වභාවයට ආදරය යන අර්ථය ඇති එය, ඉක්මනින් ආර්ථික විද්‍යාඥයන් වීමට නියමිත වූ කෘෂි විද්‍යාඥ කණ්ඩායමක් විසින් තෝරාගත් නම විය
  - ආර්ථික ප්‍රතිපත්තිය හඳුන්වීමට ග්‍රීකයන් දුන් නමක් වූ එය, ආර්ථික විද්‍යාවේ නව විද්‍යාව නම් කිරීමට Quesnay විසින් යළි භාවිතා කරන ලදී
  - Quesnayගේ අදහස් විහිළුවට ලක් කිරීමට Voltaire මෙම පදය නිර්මාණය කළේය
explanation: |
  "Physiocracy" යන පදයේ අර්ථය "ස්වභාවයේ පාලනය" වන අතර, කෘෂිකර්මයේ සහ ස්වභාවික පිළිවෙළේ වැදගත්කම අවධාරණය කළ තම ආර්ථික මූලධර්මය හඳුන්වීමට Quesnay එය භාවිතා කළේය.