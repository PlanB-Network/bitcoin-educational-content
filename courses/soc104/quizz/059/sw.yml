question: "Kanuni mbili za John Rawls za haki ni zipi?"
answer: "Uhuru sawa kwa wote, na kanuni ya tofauti inayoruhusu ukosefu wa usawa tu ikiwa unawanufaisha walio katika hali mbaya zaidi"
wrong_answers:
  - "Haki ya kupiga kura kwa wote kwa raia wote, na ushuru endelevu kufadhili huduma za umma"
  - "Uhuru wa kujieleza bila kizuizi, na ugawaji upya wa utajiri wa lazima ili kufikia usawa"
  - "Ulinzi wa haki za mali binafsi, na kanuni ya kutoshambulia ikitumika kwa hatua zote za dola"
explanation: >-
  Rawls anapendekeza kanuni mbili: kwanza, uhuru sawa kwa wote (msingi wa demokrasia), na pili, kanuni ya tofauti, inayoruhusu ukosefu wa usawa tu ikiwa unawanufaisha wanajamii walio katika hali mbaya zaidi. Hii ina maana kwamba mtu ana haki ya kutajirika, mradi ugawaji upya unawawezesha pia walio na bahati ndogo zaidi kunufaika. Chaguo nyingine huchanganya vipengele kutoka falsafa tofauti za kisiasa.
