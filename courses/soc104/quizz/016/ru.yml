question: "Что левые хотят законодательно оформлять и регулировать?"
answer: "Экономику — из-за враждебности к экономической свободе, капитализму и свободному рынку"
wrong_answers:
  - "Личную мораль и религиозные практики — из-за желания сохранить традиционные институты"
  - "Иммиграцию и национальные границы — из-за опасений за культурную идентичность и суверенитет"
  - "Технологии и инновации — из-за страхов, что автоматизация заменит работников-людей"
explanation: >-
  Левые отдают приоритет социальной справедливости и равенству, особенно на экономическом уровне. Отсюда их враждебность к экономической свободе, капитализму и свободному рынку, а также желание законодательно оформлять и регулировать экономику. Правые, напротив, хотят законодательного регулирования морали и религии. Регулирование иммиграции и технологий не является основным фокусом, описанным здесь.
reviewed: false
