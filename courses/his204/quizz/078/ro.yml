question: Care este argumentul lui Turgot în Valeurs et monnaie?
answer: Valoarea lucrurilor depinde de aprecierea subiectivă a oamenilor
wrong_answers:
  - Valoarea lucrurilor depinde de calitățile lor intrinseci
  - Putem măsura valoarea lucrurilor doar cu bani
  - Valoarea este determinată de muncă
explanation: |
  Turgot susține o teorie subiectivă a valorii, potrivit căreia valoarea unui bun depinde de utilitatea pe care aceasta o oferă individului și de aprecierea sa personală.
