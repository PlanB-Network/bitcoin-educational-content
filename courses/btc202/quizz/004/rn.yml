question: None Bitcoin ni iki?
answer: Inyabwonko ikoresha porogarama ishira mu ngiro amasezerano ya Bitcoin
wrong_answers:
  - Hardware Wallet ishira mu ngiro urubuga rwa Bitcoin
  - Miner ikora amabuye mashasha ya Bitcoin.
  - Serveri nyamukuru icungera urubuga rwa Bitcoin n'ukwemeza ibikorwa
explanation: |
  Node ya Bitcoin ni porogarama ikoresha inyabwonko, nka Bitcoin core, ishira mu ngiro iyo protocole kandi y'ifatanya n’urubuga rwa Bitcoin.
reviewed: true
