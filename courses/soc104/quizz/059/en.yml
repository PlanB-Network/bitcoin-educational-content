question: "What are John Rawls's two principles of justice?"
answer: "Equal liberty for all, and the difference principle allowing inequalities only if they benefit the most disadvantaged"
wrong_answers:
  - "Universal suffrage for all citizens, and progressive taxation to fund public services"
  - "Freedom of speech without restriction, and mandatory wealth redistribution to achieve equality"
  - "Protection of private property rights, and the non-aggression principle applied to all state actions"
explanation: >-
  Rawls proposes two principles: first, equal liberty for all (the foundation of democracy), and second, the difference principle, which allows inequalities only if they benefit the most disadvantaged members of society. This means one has the right to grow rich, provided that redistribution allows the least favored to benefit as well. The other options mix elements from different political philosophies.
