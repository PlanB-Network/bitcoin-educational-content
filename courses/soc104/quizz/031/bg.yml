question: "Какво вярват френските libertaires (социалистически анархисти) относно частната собственост?"
answer: "Частната собственост и капитализмът трябва да бъдат премахнати, защото са източници на потисничество"
wrong_answers:
  - "Частната собственост е естествено право, което предхожда държавата, и трябва да бъде защитавана на всяка цена"
  - "Частната собственост трябва да бъде регулирана от държавата, но никога напълно премахвана от обществото"
  - "Частната собственост е приемлива само когато е разпределена поравно между всички членове на една комуна"
explanation: >-
  Френските libertaires, наследници на социалистическия анархизъм чрез мислители като Proudhon и Bakunin, смятат, че както държавата, така и частната собственост трябва да бъдат премахнати като двойни източници на потисничество. Това е уловено в прочутата формула на Proudhon "Собствеността е кражба." Първият грешен отговор описва либертарианската позиция, която е фундаментално противоположна на възгледа на libertaires.
reviewed: false
