question: push-<n มีชนิด Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ ทำไมเอาต์พุตของมันต้องเป็น sum ที่รวมชนิดเวกเตอร์เต็ม Aⁿ ไว้ด้วย?
answer: บัฟเฟอร์ Aᑉⁿ เก็บได้มากที่สุด n−1 รายการ ดังนั้นการ push ลงในบัฟเฟอร์ที่เต็มจะได้ n รายการ — มีเพียง Aⁿ เท่านั้นที่แทนสิ่งนั้นได้
wrong_answers:
  - sum ให้ callers เลือกการเข้ารหัสที่ถูกกว่าได้ เพราะ vectors serialize ได้กะทัดรัดกว่า option products
  - Push อาจล้มเหลวบนบัฟเฟอร์ว่าง และสาขา Aⁿ คือกรณี error ที่พกเนื้อหาเดิมไว้
  - case บังคับให้ฟังก์ชันใด ๆ ที่บริโภคบัฟเฟอร์ชนิด sum ต้องสร้างเอาต์พุตชนิด sum ด้วย
explanation: >-
  Aᑉⁿ คือชนิดของ lists ที่มีความยาวน้อยกว่า n อย่างเคร่งครัดพอดี
  ดังนั้นบัฟเฟอร์ที่ความจุสูงสุดจึงมี n−1 องค์ประกอบ การ push เพิ่มอีกหนึ่ง
  จะสร้าง n องค์ประกอบพอดี ซึ่ง Aᑉⁿ แทนไม่ได้; summand Aⁿ
  คืนผลลัพธ์ที่ overflow นี้ในฐานะเวกเตอร์เต็ม การเข้ารหัส overflow ไว้ใน
  ชนิดเอาต์พุตทำให้ push-<n เป็นฟังก์ชัน total แทนที่จะเป็น partial
  — กรณีล้มเหลวของบัฟเฟอร์ว่างเป็นของ pop-<n ไม่ใช่ push
