question: "企業寄りであることと市場寄りであることの重要な違いは何か？"
answer: "企業寄りであることは、大企業と国家の同盟を好むことを意味し、市場寄りであることは、国家のえこひいきのない自由競争を支持することを意味する"
wrong_answers:
  - "企業寄りであることは中小企業を支援することを意味し、市場寄りであることは多国籍企業を支援することを意味する"
  - "企業寄りであることは規制に全面的に反対することを意味し、市場寄りであることは穏健な規制を受け入れることを意味する"
  - "企業寄りであることは国内産業に焦点を当て、市場寄りであることは国際貿易に焦点を当てる"
explanation: >-
  中道主義者は企業寄りである傾向がある。つまり、大企業と国家の一種の同盟を好むということであり、これは市場寄りであることとは異なる。市場寄りであることは、国家のえこひいきや企業保護主義のない自由競争を支持する。この区別は重要である。なぜなら、企業寄りの政策は、自由市場競争を実際には損なう独占や規制上の保護を生み出し得るからである。
