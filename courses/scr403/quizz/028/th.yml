question: การประกอบแบบมีเงื่อนไขเป็น dual ของการประกอบแบบขนานในแง่ใด?
answer: การประกอบแบบขนานป้อนอินพุตหนึ่งเดียวให้ทั้งสองปฏิบัติการและจับคู่เอาต์พุตของพวกมัน (เป็น product) ส่วนการประกอบแบบมีเงื่อนไขรับ sum ของอินพุต และทั้งสอง branch ใช้ชนิดเอาต์พุตเดียวกันร่วมกัน
wrong_answers:
  - การประกอบแบบขนานต้องเรียกใช้ปฏิบัติการทั้งสองพร้อมกัน ส่วนแบบมีเงื่อนไขเรียกใช้พวกมันตามลำดับและคืนค่าเฉพาะ branch ที่ tag เลือก
  - ทั้งสองแบบทำงานบนอินพุตร่วมตัวเดียว การประกอบแบบขนานเก็บคู่เอาต์พุตไว้ ขณะที่แบบมีเงื่อนไขเรียกใช้ทั้งสอง branch แล้วทิ้ง branch ที่ไม่ถูกเลือก
  - การประกอบแบบขนาน duplicate อินพุตของมันไว้ก่อน ขณะที่แบบมีเงื่อนไข duplicate เอาต์พุตของมันภายหลัง โดยสลับตำแหน่งที่การคัดลอกเกิดขึ้น
explanation: >-
  ความเป็นคู่ (duality) นี้คือการแลกเปลี่ยนระหว่าง product กับ sum โดยชนิดที่ใช้ร่วมกันสลับฝั่งกัน
  การประกอบแบบขนานให้ชนิดอินพุตเดียวกันแก่ทั้งสองปฏิบัติการและจับคู่เอาต์พุตของพวกมันเป็น product
  ขณะที่การประกอบแบบมีเงื่อนไขรับ sum (tagged union) ของชนิดอินพุตทั้งสอง และทั้งสอง branch
  ต้องให้ชนิดเอาต์พุตเดียวกัน ความพร้อมกัน (simultaneity) ไม่เกี่ยวข้อง — บทความเน้นว่า
  การประกอบแบบขนานอาจถูก implement แบบตามลำดับก็ได้ — และการประกอบแบบมีเงื่อนไขเรียกใช้เพียง
  branch เดียวเท่านั้นซึ่งถูกเลือกโดย tag แทนที่จะเรียกใช้ทั้งสอง branch แล้วทิ้งอันหนึ่ง
reviewed: false
