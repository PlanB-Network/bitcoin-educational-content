question: "Como Michael Oakeshott caracterizou o conservadorismo em sua obra filosófica?"
answer: "Como um temperamento e uma disposição em relação à vida, em vez de uma ideologia sistemática rígida"
wrong_answers:
  - "Como uma teoria econômica abrangente, com prescrições políticas precisas para cada área do governo"
  - "Como um movimento revolucionário que busca desmantelar instituições modernas e retornar à sociedade pré-industrial"
  - "Como uma doutrina puramente religiosa fundamentada na teologia cristã e na autoridade eclesiástica"
explanation: >-
  Michael Oakeshott, um filósofo britânico, defendeu uma concepção do conservadorismo como temperamento, e não como ideologia sistemática. Seu ensaio On Being Conservative (1956) continua sendo uma referência essencial. Essa visão do conservadorismo como disposição também influenciou Friedrich Hayek. A abordagem de Oakeshott é notável por sua crítica ao racionalismo na política, rejeitando a ideia de que a política possa ser reduzida a um sistema.
