question: "رویکردهای اقتصادی آلمان هیتلری و اتحاد شوروی استالین، با وجود روش‌های تمامیت‌خواه مشترکشان، چگونه با هم تفاوت داشتند؟"
answer: "آلمان نازی ظاهر مالکیت خصوصی را حفظ کرد و در عین حال بخش خصوصی را تابع اهداف دولت ساخت، در حالی که استالینیسم همه مالکیت خصوصی را لغو کرد و اقتصاد را به‌طور کامل برنامه‌ریزی نمود"
wrong_answers:
  - "آلمان نازی همه صنایع را کاملاً ملی کرد، در حالی که رژیم استالین در کشاورزی بنگاه خصوصی محدودی را مجاز می‌دانست"
  - "آلمان نازی تجارت آزاد بین‌المللی را برای تأمین مالی تسلیح مجدد ترویج کرد، در حالی که استالینیسم انزوای اقتصادی کامل را تحمیل نمود"
  - "آلمان نازی بر همکاری داوطلبانه شرکت‌ها با دولت تکیه داشت، در حالی که استالینیسم فقط از کار اجباری استفاده می‌کرد"
explanation: >-
  هرچند هر دو رژیم از روش‌های سیاسی یکسانی استفاده کردند (کیش شخصیت، نظارت کامل، حذف نظام‌مند مخالفان)، مدل‌های اقتصادی آن‌ها از نظر شکل متفاوت بود. آلمان نازی مالکیت خصوصی را رسماً لغو نکرد، اما بخش خصوصی را کاملاً تابع اهداف دولتی مانند جنگ و تسلیح مجدد ساخت و خودکفایی اقتصادی را تحمیل کرد. استالینیسم با لغو همه مالکیت خصوصی، اجرای برنامه‌های پنج‌ساله و کنترل مستقیم همه تولید و توزیع، از این هم فراتر رفت.
reviewed: false
