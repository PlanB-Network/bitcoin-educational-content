question: "Ukwigabura kwa politike hagati y'ibubamfu n'iburyo gukomoka hehe?"
answer: "Ku kuntu abantu bicara mu biganiro vyo mu Revolisiyo y'Abafaransa yo mu 1789"
wrong_answers:
  - "Ku vyanditswe na Karl Marx na Adam Smith mu kinjana ca cumi n'icenda"
  - "Ku Ntambara y'Abanyagihugu ya Amerika hagati y'intara zo mu Buraruko n'izo mu Bumanuko"
  - "Ku bafilosofe bo mu Gihe c'Umuco batandukanya ubwenge n'imigenzo"
explanation: >-
  Ukwigabura hagati y'ibubamfu n'iburyo kwatanguye mu 1789, igihe abadepite bo mu Nama Nshingamateka y'Igihugu y'Ubufaransa bashigikira kugumana ububasha bw'umwami bicara iburyo bw'umukuru w'inama, mu gihe abashaka kugabanya ububasha bwiwe bicara ibubamfu. Ntikwakomotse kuri Marx na Smith, ku Ntambara y'Abanyagihugu ya Amerika, canke kuri filozofiya yo mu Gihe c'Umuco.
