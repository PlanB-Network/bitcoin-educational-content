question: "Откъде произхожда политическото разделение ляво-дясно?"
answer: "От разположението на местата по време на дебатите във Френската революция от 1789 г."
wrong_answers:
  - "От трудовете на Karl Marx и Adam Smith през XIX век"
  - "От Американската гражданска война между северните и южните щати"
  - "От философите на Просвещението, които отделили разума от традицията"
explanation: >-
  Разделението ляво-дясно датира от 1789 г., когато депутатите във Френското национално събрание, които подкрепяли запазването на властта на краля, седели вдясно от председателя, докато онези, които искали да ограничат правомощията му, седели вляво. То не произхожда от Marx и Smith, Американската гражданска война или философията на Просвещението.
reviewed: false
