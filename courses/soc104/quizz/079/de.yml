question: "Worin besteht die zentrale Meinungsverschiedenheit zwischen Libertären und anderen politischen Familien, wenn sie dieselben Ziele teilen?"
answer: "Die Meinungsverschiedenheit betrifft die Mittel: Libertäre lehnen zwangsförmige Lösungen ab und bevorzugen freiwilligen Austausch durch den Marktprozess"
wrong_answers:
  - "Die Meinungsverschiedenheit betrifft die Zwecke: Libertäre verfolgen andere Ziele wie individuellen Reichtum statt sozialem Wohlergehen"
  - "Die Meinungsverschiedenheit betrifft den Zeitplan: Libertäre wollen dieselben Ziele langsamer durch schrittweise Reformen erreichen"
  - "Die Meinungsverschiedenheit betrifft den Umfang: Libertäre wollen dieselben Politiken nur auf lokaler statt auf nationaler Ebene anwenden"
explanation: >-
  Libertäre können mit Sozialisten, Konservativen und Zentristen bei bestimmten Zielen übereinstimmen, etwa der Verteidigung der Unterdrückten oder der Förderung des sozialen Zusammenhalts. Die Meinungsverschiedenheit liegt nicht in den Zwecken, sondern in den Mitteln. Libertäre lehnen alle zwangsförmigen Lösungen ab, die Praktiken und Vorschriften vereinheitlichen wollen, und verteidigen stattdessen die Macht der Wahl und verantwortliche Freiheit durch freien, dezentralen Austausch auf Grundlage freiwilliger Verträge.
reviewed: false
