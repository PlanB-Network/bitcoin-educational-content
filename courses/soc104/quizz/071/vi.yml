question: "Vì sao lập trường tự do cá nhân về hợp pháp hóa ma túy đi kèm điều kiện rằng vai trò của nhà nước trong xã hội phải được giảm bớt?"
answer: "Vì tự do hóa do nhà nước tiếp quản sẽ thay thế trách nhiệm cá nhân bằng sự chăm sóc do chính phủ quản lý, trong khi những người theo chủ nghĩa tự do cá nhân muốn công dân gánh chịu hệ quả từ lựa chọn của mình với sự hỗ trợ từ các hiệp hội tư nhân"
wrong_answers:
  - "Vì hợp pháp hóa do nhà nước kiểm soát sẽ tạo ra quá nhiều doanh thu thuế, khiến chính phủ trở nên quá quyền lực và tham nhũng"
  - "Vì nhà nước sẽ áp đặt các tiêu chuẩn chất lượng làm giá tăng lên và tái tạo thị trường chợ đen"
  - "Vì việc chính phủ quản lý ma túy sẽ vi phạm các hiệp định thương mại quốc tế và quan hệ ngoại giao"
explanation: >-
  Những người theo chủ nghĩa tự do cá nhân ủng hộ tự do hóa ma túy nhưng nhấn mạnh rằng vai trò của nhà nước phải được giảm bớt vì mục tiêu của họ là khôi phục trách nhiệm cá nhân, chứ không phải mở rộng sự quản lý của nhà nước. Nếu ai đó trở nên lệ thuộc, họ phải chịu trách nhiệm thay vì yêu cầu nhà nước cung cấp chăm sóc. Giải pháp cho nghiện ngập nằm ở sáng kiến tư nhân: sự hỗ trợ tự nguyện từ các cá nhân, gia đình và hiệp hội từ thiện. Hợp pháp hóa do nhà nước quản lý sẽ mâu thuẫn với nguyên tắc tự do cá nhân nền tảng về trách nhiệm cá nhân.
