question: "Aba libertarian babona gute isano riri hagati y'umutungo bwite n'umwidegemvyo?"
answer: "Umutungo bwite ni uburenganzira mvukanwa bubanza amategeko na Leta, kandi ni wo mushinge nyawo w'umwidegemvyo"
wrong_answers:
  - "Umutungo bwite ni umugenzo wo mu kibano washizweho na Leta ushobora gukurwaho igihe uteye ubusumbasumbane"
  - "Umutungo bwite urafasha mu gukora ubutunzi neza, ariko nta gaciro k'imbere mu vy'inyifato canke mu vy'ubufilosofi ufise"
  - "Umutungo bwite ukwiye kubaho gusa ku bintu umuntu yitunze ubwiwe, atari ku bikoresho vy'uguhingura canke ku matongo"
explanation: >-
  Aba libertarian barwanira umutungo bwite nk'uburenganzira mvukanwa bubanza amategeko na Leta. Bavuga ko iyo umuntu yifitiye umubiri wiwe, aba yifitiye n'igikorwa ciwe n'ivyamwa vyaco. Ugutunga ibintu bifatika ni ukwaguka kw'ukwiyegukira kw'umuntu. Ivyo birahushanye cane n'uko aba libertaires babona umutungo nk'umugenzo wo mu kibano canke isoko y'agahahazo.
