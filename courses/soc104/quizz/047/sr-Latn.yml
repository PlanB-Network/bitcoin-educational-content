question: "Kako konzervativizam tretira slobode u ekonomskoj i društvenoj sferi?"
answer: "Snažne slobode u ekonomskoj sferi, ali slabe slobode u društvenoj sferi"
wrong_answers:
  - "Slabe slobode i u ekonomskoj i u društvenoj sferi radi održavanja tradicionalnog društvenog poretka"
  - "Snažne slobode u društvenoj sferi, ali slabe slobode u ekonomskoj sferi"
  - "Jednake i neograničene slobode u obe sfere uz minimalno mešanje države bilo koje vrste"
explanation: >-
  Konzervativizam pokazuje dihotomiju koja je ogledalska slika socijalizma. U ekonomskoj oblasti konzervativci brane slobodno tržište, preduzetništvo i privatnu svojinu. U društvenoj oblasti ograničenja se opravdavaju očuvanjem tradicionalnih moralnih normi i društvene stabilnosti. Treći pogrešan odgovor opisuje socijalistički obrazac, koji je suprotan.
