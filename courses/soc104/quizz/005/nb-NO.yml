question: "Hvorfor anses venstre-høyre-aksen som utilstrekkelig for å plassere klassisk liberale tenkere som Bastiat eller Ron Paul?"
answer: "Fordi klassisk liberalisme verdsetter både økonomiske og personlige friheter, noe verken venstresiden eller høyresiden fullt ut omfavner"
wrong_answers:
  - "Fordi klassiske liberalere alltid slutter seg til høyreorientert økonomisk politikk og avviser alle venstreorienterte posisjoner"
  - "Fordi klassiske liberalere er sentrister som adopterer moderate versjoner av både venstre- og høyreideologier"
  - "Fordi klassiske liberalere motsetter seg alle former for regjering, noe som gjør dem til anarkister snarere enn politiske tenkere"
explanation: >-
  Venstre-høyre-aksen svikter klassiske liberalere fordi den ikke kan romme en posisjon som samtidig forsvarer økonomisk frihet (typisk høyre) og personlig frihet (typisk venstre). Klassiske liberalere er ikke sentrister som søker kompromiss, og de er heller ikke anarkister eller rent høyreorienterte. De passer ganske enkelt ikke på et endimensjonalt spektrum.
reviewed: false
