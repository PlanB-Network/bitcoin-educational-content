question: "Milton Friedman alitoa onyo gani kuhusu kuhukumu sera za kisiasa?"
answer: "Sera zinapaswa kuhukumiwa kwa matokeo yake badala ya nia zake"
wrong_answers:
  - "Sera zinapaswa kuhukumiwa kwa tabia ya kimaadili ya wanasiasa wanaozipendekeza"
  - "Sera zinapaswa kuhukumiwa kwa jinsi zilivyo maarufu kwa umma mpiga kura kwa ujumla"
  - "Sera zinapaswa kuhukumiwa kwa ikiwa zinaendana na katiba ya awali ya nchi"
explanation: >-
  Friedman aliandika kwamba mojawapo ya makosa makubwa zaidi ni kuhukumu sera kwa nia zake badala ya matokeo yake, akibainisha kwamba programu zinazopewa lebo kuwa za kuwasaidia maskini karibu kila mara huzalisha athari zilizo kinyume na kile wafadhili wake walichokusudia. Hili linaakisi fundisho la Bastiat kwamba mwanauchumi mzuri huzingatia athari za muda mfupi na za muda mrefu kwa idadi yote ya watu.
