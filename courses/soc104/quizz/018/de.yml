question: "Was ist politischer Konservatismus?"
answer: "Eine Ideologie, die darauf abzielt, etablierte politische Institutionen und die gesellschaftliche Ordnung zu bewahren, und größere strukturelle Umwälzungen ablehnt"
wrong_answers:
  - "Ein persönliches Bekenntnis zu traditionellen Familienwerten und religiösen Praktiken, ohne sie anderen aufzwingen zu wollen"
  - "Eine Philosophie, die schnellen gesellschaftlichen Wandel durch demokratische Reformen und progressive Gesetzgebung fördert"
  - "Eine Wirtschaftstheorie, die freie Märkte, minimale Besteuerung und die Abschaffung von Handelsbarrieren befürwortet"
explanation: >-
  Politischer Konservatismus ist eine Ideologie, die häufig in rechten oder rechtsextremen Parteien vertreten ist und darauf abzielt, etablierte politische Institutionen und die gesellschaftliche Ordnung zu bewahren, während sie größere strukturelle Umwälzungen ablehnt. Seine Befürworter wollen Macht und Gesetz nutzen, um ihr Erbe zu schützen. Das unterscheidet ihn vom kulturellen Konservatismus, der eine persönliche Lebensentscheidung und kein politisches Programm ist.
