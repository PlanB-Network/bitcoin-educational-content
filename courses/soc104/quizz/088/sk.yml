question: "Ako súvisí rozlíšenie Karla Poppera medzi otvorenými a uzavretými spoločnosťami s debatou individualizmus verzus kolektivizmus?"
answer: "Otvorená spoločnosť uznáva právo jednotlivca posudzovať sám za seba prostredníctvom osobných rozhodnutí, zatiaľ čo uzavretá spoločnosť je kolektivistická, stojí na kmeňovej mentalite a odmietaní kritickej slobody"
wrong_answers:
  - "Otvorená spoločnosť je taká, ktorá umožňuje voľný obchod cez národné hranice, zatiaľ čo uzavretá spoločnosť zavádza clá a protekcionistické ekonomické politiky"
  - "Otvorená spoločnosť je riadená priamou demokraciou, v ktorej hlasuje každý občan, zatiaľ čo uzavretej spoločnosti vládne jediný dedičný monarcha"
  - "Otvorená spoločnosť transparentne zverejňuje všetky vládne dokumenty, zatiaľ čo uzavretá spoločnosť klasifikuje informácie ako štátne tajomstvá"
explanation: >-
  Popper definoval uzavretú spoločnosť ako magickú alebo kmeňovú spoločnosť a otvorenú spoločnosť ako takú, v ktorej sú jednotlivci konfrontovaní s osobnými rozhodnutiami. Uzavretá spoločnosť je kolektivistická, stojí na kmeňovej mentalite s odmietaním kritickej slobody a idealizáciou statického poriadku. Otvorená spoločnosť dáva prvenstvo slobodnej voľbe hodnôt, presvedčení a vzťahov, čím priamo stelesňuje individualistické princípy.
reviewed: false
