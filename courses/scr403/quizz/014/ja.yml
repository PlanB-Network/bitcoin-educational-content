question: unit型（𝟙）とは何であり、情報を持たないにもかかわらずなぜ有用なのですか？
answer: それは1つの値（空タプル）を保持し、他のすべての型の基礎です。
wrong_answers:
  - それは数値1を表し、算術演算に直接使用されます。
  - それは実行トレースをファイルに出力する特別なデバッグ型です。
  - それはboolean操作に使われるちょうど1ビットのデータを格納します。
explanation: >-
  unit型𝟙は、ちょうど1つの値、すなわち空タプル⟨⟩を持つ。
  情報量としては0ビットしか持たないが、和型と積型がすべての有用な
  データ型を組み立てるための種として不可欠である。たとえば、
  boolean型𝟚は𝟙 + 𝟙であり、完全にunit型から構築される。
