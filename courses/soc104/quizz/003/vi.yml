question: "Vì sao trục tả-hữu bị xem là không đủ để định vị các nhà tư tưởng tự do cổ điển như Bastiat hay Ron Paul?"
answer: "Vì chủ nghĩa tự do cổ điển coi trọng cả tự do kinh tế lẫn tự do cá nhân, những điều mà cả cánh tả lẫn cánh hữu đều không hoàn toàn chấp nhận"
wrong_answers:
  - "Vì các nhà tự do cổ điển luôn đứng cùng các chính sách kinh tế cánh hữu và bác bỏ mọi lập trường cánh tả"
  - "Vì các nhà tự do cổ điển là những người trung dung, tiếp nhận các phiên bản ôn hòa của cả hệ tư tưởng cánh tả lẫn cánh hữu"
  - "Vì các nhà tự do cổ điển phản đối mọi hình thức chính phủ, khiến họ là những người vô chính phủ chứ không phải các nhà tư tưởng chính trị"
explanation: >-
  Trục tả-hữu không phù hợp với các nhà tự do cổ điển vì nó không thể chứa một lập trường đồng thời bảo vệ tự do kinh tế (thường là cánh hữu) và tự do cá nhân (thường là cánh tả). Các nhà tự do cổ điển không phải là những người trung dung tìm kiếm thỏa hiệp, cũng không phải là những người vô chính phủ hay thuần túy cánh hữu. Họ đơn giản là không nằm vừa trên một phổ một chiều.
reviewed: false
