question: "foreign policy පිළිබඳ ඔවුන්ගේ approach එකේදී neoconservatives සහ paleoconservatives වෙන් කරන්නේ කුමක්ද?"
answer: "Neoconservatives democracy පැතිරවීමට military interventionism සාධාරණීකරණය කරන අතර, paleoconservatives වඩා isolationist foreign policy එකක් ආරක්ෂා කරති"
wrong_answers:
  - "Neoconservatives සියලු military action වලට විරුද්ධ වී diplomacy කැමති වන අතර, paleoconservatives potential threats වලට එරෙහි preemptive strikes සඳහා සහාය දක්වති"
  - "Neoconservatives economic sanctions වලට පමණක් අවධානය යොමු කරන අතර, paleoconservatives joint military operations සඳහා international coalitions ගොඩනැගීමට පෙනී සිටිති"
  - "Neoconservatives සහ paleoconservatives foreign policy පිළිබඳ එකඟ වන නමුත් domestic economic regulation පිළිබඳ දැඩි ලෙස වෙනස් වෙති"
explanation: >-
  2000s සිට, විශේෂයෙන් September 11, 2001 න් පසුව, ලෝකය පුරා democracy ස්ථාපිත කිරීමට military interventionism සාධාරණීකරණය කිරීමේදී neoconservatives වැඩි වැඩියෙන් සම්බන්ධ විය. ප්‍රතිචාරයක් ලෙස, traditional conservatives තමන්ව වෙන් කර දැක්වීමට 'paleoconservative' label එක භාර ගත්තේය. Paleoconservatives military interventionism විවේචනය කරති, වඩා isolationist foreign policy එකක් ආරක්ෂා කරති, සහ national සහ cultural identity වෙත වැඩි අවධානයක් දෙති.
reviewed: false
