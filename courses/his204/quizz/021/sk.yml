question: Ktorý francúzsky ekonóm 19. storočia venoval knihu abbému de Saint-Pierre?
answer: Gustave de Molinari
wrong_answers:
  - Frédéric Bastiat
  - Jean-Baptiste Say
  - Léon Walras
explanation: |
  Gustave de Molinari, liberálny ekonóm 19. storočia, napísal knihu o abbém de Saint-Pierre, v ktorej vyzdvihol jeho úlohu predchodcu liberálneho myslenia a obhajoby mieru.
