question: "Bitcoin은 복지국가의 어떤 세 기둥에 도전하나요?"
answer: "재정 시스템, 부채를 통해 지출을 재원 조달하기 위한 통화 독점, 그리고 대체 통화 사용을 막기 위한 트랜잭션 감시입니다"
wrong_answers:
  - "군사 예산, 공교육 시스템, 정부가 통제하는 의료 인프라입니다"
  - "사법 시스템, 입법 과정, 기업에 대한 규제의 행정적 집행입니다"
  - "사회보장 제도, 최저임금 법제, 누진소득세 구조입니다"
explanation: >-
  Bitcoin은 복지국가가 의존하는 세 기둥에 도전합니다. 첫째, 지출을 충당하기에 불충분한 재정 시스템입니다. 둘째, 부채를 통해 지출을 재원 조달하기 위해 돈을 발행할 능력인 통화 독점입니다. 셋째, 사람들이 국가가 부과한 법정화폐 이외의 어떤 통화도 사용하지 못하게 막을 능력인 트랜잭션 감시입니다. Bitcoin은 이 세 가지를 동시에 약화시킵니다.
reviewed: false
