question: "중도주의는 어떤 형태의 통치로 기울어지는 경향이 있나요?"
answer: "경제와 통화 정책을 이끄는 전문가들에게 권력이 맡겨지는 기술관료제"
wrong_answers:
  - "시민들이 모든 주요 정책 결정에 투표하는 직접 민주주의"
  - "전통적 지배 계급이 권력을 보유하는 귀족정"
  - "국가 개입 없이 시장이 스스로를 규제하는 자유방임 통치"
explanation: >-
  중도주의는 효율성과 실용주의를 우선시하며 기술관료제로 기울어지는 경향이 있는데, 이는 경제를 이끌고 통화 정책을 운용하는 전문가들에게 권력이 맡겨져야 한다는 뜻입니다. 이는 직접 민주주의, 귀족정, 자유방임과 근본적으로 다르며, 각각은 완전히 다른 원칙에 따라 권력을 분배합니다.
