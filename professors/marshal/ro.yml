bio: |
  Bună!! Ca avocat și producător de conținut audiovizual, sunt o minte curioasă căreia îi place să învețe lucruri noi. Din 2020 sunt interesat de finanțe, blockchain și Bitcoin. Următorul pas: acum vreau să îmi împărtășesc cunoștințele.

short_bio: Avocat și producător de conținut audiovizual
