question: "Vad är konstruktivism som en gemensam politisk övertygelse?"
answer: "Tron att en central regering genom lagens tvång kan skapa en samhällsordning som är god för det största antalet"
wrong_answers:
  - "Tron att samhället bör organiseras genom frivilligt samarbete mellan individer utan statlig inblandning"
  - "Tron att endast fria marknader kan avgöra den optimala fördelningen av resurser i samhället"
  - "Tron att politisk auktoritet bör fördelas lika mellan alla medborgare genom direktdemokrati"
explanation: >-
  Konstruktivism förenar centrister, konservativa och socialister kring en gemensam övertygelse: den politiska processens överlägsenhet över marknadsprocessen. Det är tron att en central regering genom lagens tvång kan skapa en samhällsordning som är god för det största antalet. Detta står i direkt motsats till det libertarianska försvaret av spontan ordning som uppstår ur frivilliga interaktioner.
reviewed: false
