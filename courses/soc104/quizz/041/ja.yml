question: "社会主義は、社会的領域と経済的領域で自由をどのように異なって扱いますか？"
answer: "社会主義は社会的領域では強い自由を支持するが、経済的領域では弱い自由を支持する"
wrong_answers:
  - "社会主義は、社会的領域と経済的領域の双方で、すべての自由を同じように制限する"
  - "社会主義は強い経済的自由を支持するが、社会秩序を維持するために社会的自由を制限する"
  - "社会主義は双方の領域で無制限の自由を与え、均衡を維持するために自発的協力に依拠する"
explanation: >-
  社会主義思想には、社会的自由と経済的自由の間に根本的な二分法がある。社会的自由は強いが、国家統制、計画、富の再分配を重視するため、経済的自由は弱い。三つ目の誤答はリバタリアンの理想を説明しており、二つ目は社会主義の鏡像である保守主義の型を説明している。
reviewed: false
