question: "Ubugumyabanga bwa politike ni iki?"
answer: "Ingengabitekerezo igamije kuzigama inzego za politike zisanzweho n'urutonde rw'ikibano, ikarwanya ihinduka rikomeye ry'imiterere"
wrong_answers:
  - "Ukwiyemeza ku giti cawe indangagaciro za kera z'umuryango n'imigenzo y'idini atari ukurondera kuzihatira abandi"
  - "Filozofiya ishigikira ihinduka ryihuta ry'ikibano biciye mu mavugurura ya demokarasi no mu mategeko y'iterambere"
  - "Inyigisho y'ubutunzi isaba amasoko yidegemvya, imisoro mito cane, n'ugukuraho inzitizi z'ubudandaji"
explanation: >-
  Ubugumyabanga bwa politike ni ingengabitekerezo, kenshi iserukirwa n'imigambwe y'iburyo canke y'iburyo bukabije, igamije kuzigama inzego za politike zisanzweho n'urutonde rw'ikibano mu gihe irwanya ihinduka rikomeye ry'imiterere. Abayishigikira bipfuza gukoresha ubutegetsi n'itegeko kugira ngo barinde iragi ryabo. Ivyo biratandukanye n'ubugumyabanga bw'umuco, ari ihitamwo ry'ubuzima bw'umuntu ku giti ciwe aho kuba umugambi wa politike.
