question: "Mikä on sosialistinen kanta terveydenhuoltoon?"
answer: "Pääsy terveydenhuoltoon on perusoikeus, ja valtion on taattava kaikille universaali, julkisesti rahoitettu järjestelmä tuloista riippumatta"
wrong_answers:
  - "Terveydenhuollon tulisi olla sekajärjestelmä, jossa valtion peruskattavuutta täydentävät yksityiset vakuutusvaihtoehdot"
  - "Yksityiset markkinat tuottavat innovatiivisempaa terveydenhuoltoa, joten yksilöiden tulisi valita oma järjestelmänsä vapaasti"
  - "Valtion tulisi tarjota terveydenhuoltoa vain köyhimmille kansalaisille, kun taas yksityinen vakuutus kattaisi kaikki muut"
explanation: >-
  Sosialisteille pääsy terveydenhuoltoon on perusoikeus, ei hyödyke. Valtion on taattava universaali, julkisesti rahoitettu terveydenhuoltojärjestelmä, jotta kaikilla on pääsy hoitoon tuloista riippumatta. Tämä heijastaa sosialistista huolta tasa-arvosta, sosiaalisesta oikeudenmukaisuudesta ja valtion merkityksestä palvelujen järjestämisessä yleisen edun mukaisesti. Sekajärjestelmä kuvaa keskustalaista näkemystä, kun taas valinnanvapauteen perustuvat lähestymistavat heijastavat libertaarisia ja konservatiivisia kantoja.
