question: Каква е връзката между Simplicity и секвенциалното смятане на Gentzen?
answer: Неговите девет комбинатора отразяват конюнктивно-дизюнктивния фрагмент на секвенциалното смятане.
wrong_answers:
  - Simplicity е директно преведен от доказателства в секвенциалното смятане в работещ код.
  - Секвенциалното смятане на Gentzen се използва по време на изпълнение за проверка на типовете на програмите на Simplicity.
  - Те са напълно несвързани, а повърхностната прилика е чисто случайна.
explanation: >-
  Деветте основни правила на Simplicity силно наподобяват правила в секвенциалното
  смятане на Gentzen, аналогично на съответствието Curry-Howard между
  ламбда-смятането и естествената дедукция. Тази връзка гарантира, че
  типовете в предпоставките са по-малки от тези в заключенията, което Bit
  Machine използва за ефективно изпълнение с минимално копиране на данни.
