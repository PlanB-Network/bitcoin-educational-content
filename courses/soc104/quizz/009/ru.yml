question: "Почему вертикальная ось (верх–низ) считается более фундаментальной, чем горизонтальная ось (левые–правые) в диаграмме Нолана?"
answer: "Потому что она раскрывает истинное разделение между теми, кто защищает максимальные индивидуальные свободы, и теми, кто предпочитает максимальный государственный контроль"
wrong_answers:
  - "Потому что она измеряет экономический выпуск точнее, чем горизонтальная ось измеряет социальную политику"
  - "Потому что большинство политических конфликтов в истории касались культурной идентичности, а не управления"
  - "Потому что горизонтальная ось применима только к современным демократиям, тогда как вертикальная ось универсальна"
explanation: >-
  Фундаментальной является вертикальная ось, потому что она фиксирует главный политический вопрос: в какой степени государство должно контролировать человеческое действие? Ось левые–правые лишь отражает разные чувствительности (социальная справедливость против традиции), но обе стороны могут занимать одну и ту же позицию на вертикальной оси как этатисты. Вертикальная ось показывает, хочет ли человек навязывать свое видение силой или уважает индивидуальную свободу.
reviewed: false
