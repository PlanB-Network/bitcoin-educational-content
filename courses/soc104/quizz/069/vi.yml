question: "Vì sao những người theo chủ nghĩa tự do cá nhân phản đối thuế?"
answer: "Vì đó là một vi phạm đạo đức đối với quyền sở hữu, một hình thức trộm cắp của nhà nước khi tước đoạt tài sản của người khác mà không có sự đồng ý"
wrong_answers:
  - "Vì thuế kém hiệu quả về kinh tế và luôn dẫn đến tỷ lệ thất nghiệp cao hơn"
  - "Vì thuế làm nản lòng đầu tư nước ngoài và làm suy yếu vị thế cạnh tranh của một quốc gia"
  - "Vì các hệ thống thuế lũy tiến nhắm mục tiêu bất công vào những người giàu có, những người tạo ra nhiều việc làm nhất"
explanation: >-
  Sự phản đối của những người theo chủ nghĩa tự do cá nhân đối với thuế trước hết là đạo đức, rồi mới là kinh tế. Họ xem thuế như một hình thức trộm cắp của nhà nước và một trở ngại đối với sở hữu tư nhân, vì nó bao gồm việc tước đoạt tài sản của người khác mà không có sự đồng ý. Dù có thể có các lập luận kinh tế chống lại thuế, lập luận tự do cá nhân nền tảng dựa trên nguyên tắc rằng thuế vi phạm quyền sở hữu, chứ không dựa trên các tính toán về hiệu quả hay năng lực cạnh tranh.
