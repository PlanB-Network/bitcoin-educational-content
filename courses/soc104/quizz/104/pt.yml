question: "Por que o curso descreve o Bitcoin como uma moeda de mercado oposta ao dinheiro estatal, em vez de um projeto de direita ou de esquerda?"
answer: "Porque o Bitcoin é uma moeda adotada voluntariamente, difícil de produzir e descentralizada, que retém valor, contrastando com o dinheiro fiat coercitivo e centralizado que perde valor, tornando a divisão uma questão de mercado versus Estado, e não de ideologia política"
wrong_answers:
  - "Porque o Bitcoin foi criado por um desenvolvedor anônimo que evitou deliberadamente fazer qualquer declaração política sobre seu propósito ou filosofia pretendidos"
  - "Porque o algoritmo de mineração do Bitcoin garante distribuição igual de novas moedas a todos os partidos políticos, impedindo qualquer viés ideológico no sistema monetário"
  - "Porque o Bitcoin funciona de modo idêntico às moedas fiat existentes, mas opera em uma rede de pagamentos mais rápida, tornando as distinções políticas irrelevantes"
explanation: >-
  O Bitcoin é descrito como uma revolta pacífica contra a politização do dinheiro. O dinheiro estatal ou fiat é um sistema coercitivo e centralizado que tende a perder valor. O dinheiro de mercado, historicamente o ouro e atualmente o Bitcoin, é uma moeda saudável, difícil de produzir, que surge voluntariamente e retém seu valor no longo prazo. A oposição real não é esquerda versus direita, mas mercado versus Estado, tornando o Bitcoin uma ruptura política que transcende campos ideológicos tradicionais.
