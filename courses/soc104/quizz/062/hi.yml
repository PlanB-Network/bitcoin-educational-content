question: "मुसोलिनी की 1920 की घोषणा 'राज्य में सब कुछ, राज्य के बाहर कुछ नहीं, राज्य के विरुद्ध कुछ नहीं' सर्वसत्तावाद के बारे में क्या बताती है?"
answer: "सार्वजनिक और निजी क्षेत्र के बीच अब कोई विभाजन नहीं रह जाता, क्योंकि राज्य समाज को पूरी तरह अपने भीतर समाहित कर लेता है"
wrong_answers:
  - "राज्य केवल सैन्य शक्ति पर ध्यान देता है, जबकि अर्थव्यवस्था को निजी उद्यम के लिए छोड़ देता है"
  - "नागरिक निजी रूप से संगठन बनाने के लिए स्वतंत्र हैं, बशर्ते वे सरकार की खुलकर आलोचना न करें"
  - "सरकार केवल राजनीतिक गतिविधि को नियंत्रित करती है, जबकि सांस्कृतिक और धार्मिक जीवन स्वायत्त रहते हैं"
explanation: >-
  मुसोलिनी की घोषणा सर्वसत्तावाद के सार को पकड़ती है: समग्रता। सब कुछ राज्य में समाहित हो जाता है, जिसका अर्थ है कि सार्वजनिक और निजी क्षेत्र के बीच कोई विभाजन नहीं रहता। समाज अपनी हर प्रकार की स्वायत्तता खो देता है, यहां तक कि खेल क्लब खोलने जैसी सबसे साधारण गतिविधियों तक। यह केवल सैन्य, राजनीतिक या आर्थिक क्षेत्रों को नियंत्रित करने से बहुत आगे की बात है।
reviewed: false
