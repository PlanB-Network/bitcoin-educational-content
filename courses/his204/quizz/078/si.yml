question: Valeurs et monnaie තුළ Turgotගේ තර්කය කුමක්ද?
answer: දේවල්වල වටිනාකම පුද්ගලයන්ගේ ආත්මීය ඇගයීම මත රඳා පවතී
wrong_answers:
  - දේවල්වල වටිනාකම ඒවායේ අන්තර්ගත ගුණාංග මත රඳා පවතී
  - දේවල්වල වටිනාකම මැනිය හැක්කේ මුදල් මගින් පමණි
  - වටිනාකම තීරණය වන්නේ ශ්‍රමයෙන්ය
explanation: |
  Turgot වටිනාකමේ ආත්මීය න්‍යායක් ආරක්ෂා කරයි. එම න්‍යාය අනුව භාණ්ඩයක වටිනාකම එය පුද්ගලයාට ලබා දෙන ප්‍රයෝජනවත් බව සහ ඔහුගේ පෞද්ගලික ඇගයීම මත රඳා පවතී.