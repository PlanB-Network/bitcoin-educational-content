question: "為什麼在 Nolan diagram 中，縱軸（上—下）被認為比橫軸（左—右）更根本？"
answer: "因為它揭示了捍衛最大個人自由的人，與偏好最大國家控制的人之間的真正分野"
wrong_answers:
  - "因為它比橫軸衡量社會政策更準確地衡量經濟產出"
  - "因為歷史上大多數政治衝突都關乎文化認同，而非治理"
  - "因為橫軸只適用於現代民主國家，而縱軸是普遍適用的"
explanation: >-
  根本軸線是縱軸，因為它捕捉到核心政治問題：國家應在多大程度上控制人的行動？左右軸只是反映不同的感性傾向（社會正義 vs. 傳統），但雙方作為國家主義者時，可能在縱軸上占據相同位置。縱軸揭示一個人是想以強制力施加自己的願景，還是尊重個人自由。
reviewed: false
