question: "ノーラン・チャートの2つの軸は何ですか？"
answer: "個人的自由を測る垂直軸と、経済的自由を測る水平軸"
wrong_answers:
  - "左から右への水平軸と、権威主義から民主主義への垂直軸"
  - "富を測る垂直軸と、教育水準を測る水平軸"
  - "社会主義から資本主義への水平軸と、伝統から進歩への垂直軸"
explanation: >-
  デイヴィッド・ノーランは、個人的自由（垂直）と経済的自由（水平）という2つの明確な軸で彼のチャートを設計しました。この二次元のアプローチは、単純化されすぎた左右の線に代わるものであり、自由の2つの主要カテゴリを分けることで、政治的イデオロギーの複雑さをよりよく捉えます。
reviewed: false
