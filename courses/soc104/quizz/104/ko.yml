question: "이 강의의 전체 논증을 고려할 때, Bitcoin은 리버테리언의 구성주의 비판, 행동에 대한 사이퍼펑크의 헌신, 그리고 도덕적 자율성에 대한 개인주의적 방어를 어떻게 동시에 구현하나요?"
answer: "Bitcoin은 중앙계획된 돈을 자생적 시장 질서로 대체하고(반구성주의), 금융 자유라는 추상적 이상을 작동하는 코드로 바꾸며(사이퍼펑크 행동), 개인에게 주권적 재산과 프라이버시를 회복시킵니다(도덕적 자율성)"
wrong_answers:
  - "Bitcoin은 민주적 거버넌스를 사용해 통화 정책을 정하고(반구성주의), 금융 자유에 관한 교육 콘텐츠를 발행하며(사이퍼펑크 행동), 개인이 프로토콜 변경에 투표할 수 있게 합니다(도덕적 자율성)"
  - "Bitcoin은 모든 금융 규제를 제거하고(반구성주의), 규제 완화를 위해 로비하는 개발자 공동체를 만들며(사이퍼펑크 행동), 부유한 개인에게 통화 정책에 대한 더 큰 통제권을 줍니다(도덕적 자율성)"
  - "Bitcoin은 여러 국가에 걸쳐 서버 인프라를 탈중앙화하고(반구성주의), open-source 라이선스를 사용해 기술을 자유롭게 공유하며(사이퍼펑크 행동), 정치적 반대를 위한 익명 소셜 미디어 플랫폼을 제공합니다(도덕적 자율성)"
explanation: >-
  Bitcoin은 이 강의에서 탐구한 세 지적 전통의 교차점에 있습니다. 그것은 중앙계획된 법정화폐를 어떤 중앙 계획자도 통제할 수 없는 자생적이고 탈중앙화된 통화 질서로 대체함으로써 반구성주의 논증을 구현합니다. 그것은 금융 자유와 프라이버시라는 추상적 이상을 작동하는 기술로 바꿈으로써 코드를 쓰라는 사이퍼펑크의 명령을 실현합니다. 그리고 주권적 재산을 가능하게 하고, 노동의 결실을 보호하며, 프라이버시를 보존해 각 사람이 자기 삶의 주인이 되게 함으로써 도덕적 자율성에 대한 개인주의적 방어에 기여합니다.
