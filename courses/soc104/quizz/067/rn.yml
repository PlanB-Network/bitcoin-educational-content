question: "Ikibanza c'abakonservateur ku bijanye n'ukwimuka ni ikihe?"
answer: "Leta ifise uburenganzira bwigenga bwo kugenzura imbibe zayo kugira ikingire umutekano w'igihugu n'akaranga k'umuco"
wrong_answers:
  - "Imbibe zikwiye kwugururwa ata gisabwa kuko inzitizi zirobanura abantu zirenga ku burenganzira bwa muntu"
  - "Ukwimuka gukwiye kugenwa n'ivyo isoko risaba, abanyagihugu bagafata ingingo biciye mu masezerano ku migenderanire yabo n'abanyamahanga"
  - "Politiki y'ukwimuka ikwiye kuringaniza ivyipfuzo vy'ubukungu n'ukwinjira neza mu kibano gushingiye kw'isuzuma ry'abahinga"
explanation: >-
  Abakonservateur babona ko urutonde, akaranga, n'ubwigenge bw'igihugu bikwiye kuza imbere yo kwakira abanyamahanga canke impunzi ata mbibe. Imbibe n'abanyagihugu basobanuwe neza biri mu ndangagaciro z'ikibano giteye imbere. Inyishu zitari zo ziserukira ikibanza c'abasosiyalisite (imbibe zuguruye nk'uburenganzira bwa muntu), ikibanza c'aba-libertarian (ukwimuka gushingiye kw'isoko), n'ikibanza c'abari hagati (uburyo buringaniza kandi burongowe n'abahinga).
reviewed: false
