question: "Apa itu paleo-libertarianisme?"
answer: "Sintesis yang menggabungkan penolakan terhadap negara sebagai sumber koersi dengan penguatan institusi tradisional dan struktur sosial sukarela"
wrong_answers:
  - "Gerakan libertarian yang menolak semua nilai tradisional dan mempromosikan progresivisme sosial radikal"
  - "Ideologi konservatif yang menggunakan kekuasaan negara untuk menegakkan nilai-nilai tradisional sambil mengizinkan sebagian kebebasan ekonomi"
  - "Filsafat sentris yang mencari kompromi seimbang antara ekonomi sosialis dan kebijakan sosial konservatif"
explanation: >-
  Paleo-libertarianisme menggabungkan penolakan terhadap negara sebagai sumber institusional koersi dengan penguatan institusi tradisional dan preferensi terhadap struktur sosial sukarela dibanding otoritas negara. Ia membedakan diri dari neo-libertarianisme karena lebih simpatik terhadap nilai-nilai tradisional. Paleo-libertarian tidak menentang komunitas yang mengorganisasi diri di sekitar prinsip sosialis atau komunitarian; mereka hanya menolak komunitas semacam itu memaksakan nilai-nilainya kepada semua orang melalui kekuatan hukum.
