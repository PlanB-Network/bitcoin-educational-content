question: "การตอบสนองของ George W. Bush ต่อวิกฤตการเงินปี 2008 แสดง 'ความยืดหยุ่นที่เป็นปัญหา' ของหลักการอนุรักษนิยมอย่างไร?"
answer: "เขาละทิ้งหลักการตลาดเสรีเพื่อช่วยเหลือธนาคารใหญ่ ๆ เผยให้เห็นมุมมองอนุรักษนิยมต่อรัฐในฐานะผู้ค้ำประกันสูงสุดของเสถียรภาพเศรษฐกิจชาติ"
wrong_answers:
  - "เขาปฏิเสธการแทรกแซงของรัฐบาลทั้งหมดและปล่อยให้ธนาคารล้มละลาย โดยยึดมั่นอุดมการณ์ตลาดเสรีอย่างเคร่งครัดไม่ว่าผลจะเป็นอย่างไร"
  - "เขาโอนภาคธนาคารเป็นของรัฐอย่างถาวรและนำภาษีก้าวหน้าเข้ามาใช้ เปลี่ยนจากอนุรักษนิยมไปสู่สังคมนิยมประชาธิปไตย"
  - "เขาตอบสนองด้วยการตัดรายจ่ายรัฐบาลทั้งหมดและยกเลิกกฎระเบียบทางการเงิน เพื่อปล่อยให้ตลาดปรับแก้ตนเอง"
explanation: >-
  Bush ประกาศว่าเขาได้ 'ละทิ้งหลักการตลาดเสรีเพื่อช่วยระบบตลาดเสรี' ด้วยการแทรกแซงเพื่อช่วยเหลือธนาคารใหญ่ สิ่งนี้แสดงให้เห็นว่าอนุรักษนิยมสามารถให้ความสำคัญกับอำนาจและความต่อเนื่องของชาติเหนือหลักการนามธรรมของตลาดได้อย่างไร ตรรกะยืดหยุ่นเดียวกันนี้ปรากฏในนโยบายการค้าปกป้องนิยมของ Trump ซึ่งดำเนินในนามผลประโยชน์ชาติ แม้เสี่ยงเติมเชื้อ corporatism และ crony capitalism
reviewed: false
