question: 条件付き合成は、どのような意味で並列合成の双対なのですか？
answer: 並列合成は両方の操作に1つの入力を与え、それらの出力をペア（積）にします。一方、条件付き合成は入力の和を取り、両方の分岐が1つの出力型を共有します。
wrong_answers:
  - 並列合成は2つの操作を同時に実行しなければなりません。一方、条件付き合成はそれらを逐次的に実行し、タグが選んだ分岐だけを返します。
  - どちらも1つの共有入力で実行されます。並列合成は出力のペアを保持し、条件付き合成は両方の分岐を実行して、選ばれなかった方を破棄します。
  - 並列合成は事前に入力を複製し、条件付き合成は事後に出力を複製することで、複製が起こる場所を入れ替えます。
explanation: >-
  この双対性は、共有される型が反対側に移る、積と和の入れ替えです。
  並列合成は両方の操作に同じ入力型を与え、それらの出力を1つの積にまとめます。
  一方、条件付き合成は2つの入力型の和（タグ付き共用体）を取り、
  両方の分岐が同じ出力型を生成しなければなりません。
  同時性は関係ありません——記事は、並列合成が逐次的に実装され得ることを強調しています——
  そして条件付き合成は、両方を実行して一方を破棄するのではなく、
  タグによって選ばれたちょうど1つの分岐を実行します。
