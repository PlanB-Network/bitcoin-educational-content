question: "Jak se liší strategie zrušení státu u libertaires a libertariánů?"
answer: "Libertaires historicky prosazují násilné zničení, zatímco libertariáni se snaží stát delegitimizovat prostřednictvím vzdělávání a občanské neposlušnosti"
wrong_answers:
  - "Libertaires používají demokratické volby k demontáži státu, zatímco libertariáni upřednostňují ozbrojenou revoluci a přímou akci"
  - "Libertaires se soustředí na budování alternativních komunit, zatímco libertariáni pracují v rámci existujícího politického systému na prosazení reforem"
  - "Libertaires i libertariáni souhlasí, že pokojný protest je jediným legitimním prostředkem společenské transformace"
explanation: >-
  Libertaires historicky prosazují zničení státu a kapitalismu násilím, včetně teroru a cílených útoků. Libertariáni naproti tomu odmítají agresivní násilí jako nelegitimní. Jejich strategie spočívá v delegitimizaci státu prostřednictvím argumentace, debaty, vzdělávání a občanské neposlušnosti. Tyto zásadně odlišné přístupy ke změně odrážejí jejich hlubší filozofické neshody.
