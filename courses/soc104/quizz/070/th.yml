question: "ในคำถามเรื่องการกำกับอาวุธปืน ความแตกต่างสำคัญระหว่างจุดยืนอนุรักษนิยมกับลิเบอร์ทาเรียนคืออะไร?"
answer: "ทั้งสองยอมรับกฎระเบียบบางอย่าง แต่อนุรักษนิยมต้องการกฎจากอำนาจสาธารณะที่ชอบธรรม ส่วนลิเบอร์ทาเรียนต้องการให้กฎเกิดจากผู้ที่เกี่ยวข้องโดยตรง เช่น สมาคมพลเมืองและการแข่งขันในตลาด"
wrong_answers:
  - "อนุรักษนิยมคัดค้านการกำกับอาวุธปืนทั้งหมด ขณะที่ลิเบอร์ทาเรียนยอมรับการควบคุมของรัฐบาลอย่างเข้มงวดเพื่อความปลอดภัยสาธารณะ"
  - "อนุรักษนิยมต้องการห้ามอาวุธปืนทั้งหมด ขณะที่ลิเบอร์ทาเรียนสนับสนุนการเข้าถึงอาวุธทุกชนิดโดยไร้ข้อจำกัด"
  - "อนุรักษนิยมตั้งจุดยืนบนสิทธิส่วนบุคคล ขณะที่ลิเบอร์ทาเรียนตั้งอยู่บนความรับผิดชอบส่วนรวม"
explanation: >-
  ทั้งอนุรักษนิยมและลิเบอร์ทาเรียนเห็นพ้องว่าจำเป็นต้องมีกฎระเบียบบางรูปแบบสำหรับการพกพาอาวุธ ความแตกต่างสำคัญอยู่ที่ว่าใครเป็นผู้กำหนดกฎเหล่านั้น อนุรักษนิยมยืนกรานว่ากฎระเบียบต้องมาจากอำนาจสาธารณะที่ได้รับมอบหมายให้ปกป้องประโยชน์ส่วนรวม (จากบนลงล่าง) ลิเบอร์ทาเรียนโต้แย้งว่ากฎระเบียบควรเกิดจากผู้ที่เกี่ยวข้องโดยตรง: ผู้เชี่ยวชาญด้านความปลอดภัย สมาคมพลเมือง และการแข่งขันในตลาด (จากล่างขึ้นบน)
reviewed: false
