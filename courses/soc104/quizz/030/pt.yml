question: "Como diferem os papéis do Cato Institute, do Mises Institute e do Libertarian Party dentro do movimento libertário?"
answer: "O Cato Institute concentra-se em propostas de política pública, o Mises Institute em educação e publicação acadêmica, e o Libertarian Party em política eleitoral"
wrong_answers:
  - "O Cato Institute financia campanhas políticas, o Mises Institute faz lobby diretamente no Congresso, e o Libertarian Party organiza conferências acadêmicas"
  - "O Cato Institute publica livros-texto de economia, o Mises Institute conduz campanhas de registro de eleitores, e o Libertarian Party redige projetos de lei"
  - "O Cato Institute organiza protestos de base, o Mises Institute fornece defesa jurídica para libertários, e o Libertarian Party gerencia pesquisas de think tanks"
explanation: >-
  O Cato Institute (fundado em 1977) é um think tank sediado em Washington que trabalha em propostas de política pública. O Mises Institute (fundado em 1982) concentra-se em educação em vez de lobby político, funcionando como uma espécie de universidade online com conferências e obras republicadas. O Libertarian Party (fundado em 1971) é o terceiro maior partido político americano, participando de eleições nas quais até mesmo sua parcela de votos de cerca de 2% pode decidir resultados.
