question: "Miten Michael Oakeshott luonnehti konservatismia filosofisessa työssään?"
answer: "Temperamenttina ja suhtautumistapana elämään pikemminkin kuin jäykkänä systemaattisena ideologiana"
wrong_answers:
  - "Kattavana talousteoriana, jolla on täsmälliset politiikkasuositukset jokaiselle hallinnon alueelle"
  - "Vallankumouksellisena liikkeenä, joka pyrkii purkamaan modernit instituutiot ja palaamaan esiteolliseen yhteiskuntaan"
  - "Puhtaasti uskonnollisena oppina, joka perustuu kristilliseen teologiaan ja kirkolliseen auktoriteettiin"
explanation: >-
  Brittiläinen filosofi Michael Oakeshott puolusti käsitystä konservatismista temperamenttina eikä systemaattisena ideologiana. Hänen esseensä On Being Conservative (1956) on edelleen olennainen viitekohta. Tämä näkemys konservatismista suhtautumistapana vaikutti myös Friedrich Hayekiin. Oakeshottin lähestymistapa on merkittävä politiikan rationalismin kritiikistään, sillä se torjuu ajatuksen, että politiikka voitaisiin palauttaa järjestelmäksi.
