question: "Каква е консервативната позиция относно имиграцията?"
answer: "Държавата има суверенното право да контролира границите си, за да защити националната сигурност и културната идентичност"
wrong_answers:
  - "Границите трябва да бъдат отворени безусловно, защото дискриминационните ограничения нарушават човешките права"
  - "Имиграцията трябва да се определя от пазарното търсене, като гражданите решават договорно отношенията си с чужденци"
  - "Имиграционната политика трябва да балансира икономическите нужди с успешната интеграция въз основа на експертна оценка"
explanation: >-
  Консерваторите смятат, че редът, идентичността и националният суверенитет трябва да имат предимство пред неограничения прием на чужденци или бежанци. Границите и добре дефинираното население са част от цивилизованите ценности. Грешните отговори представляват социалистическата позиция (отворени граници като човешки права), либертарианската позиция (пазарно базирана имиграция) и центристката позиция (балансиран подход, воден от експерти).
reviewed: false
