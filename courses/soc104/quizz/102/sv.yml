question: "Vad identifierar kursen som den verkliga politiska skiljelinjen, bortom det traditionella vänster-höger-mitten-spektrumet?"
answer: "Skiljelinjen mellan grundläggande filosofiska principer: frihet eller tvång, frivilligt samtycke eller påtvingande, den ansvariga individen eller kollektivet"
wrong_answers:
  - "Skiljelinjen mellan rika och fattiga nationer om kontrollen över internationella handelsavtal och globala finansinstitutioner"
  - "Skiljelinjen mellan urbana och rurala befolkningar om prioriteringar för statliga utgifter och infrastrukturinvesteringar"
  - "Skiljelinjen mellan progressiva och traditionella kulturer om sociala normer, familjevärderingar och religiös utbildning"
explanation: >-
  Kursen hävdar att den verkliga politiska skiljelinjen inte ligger i de traditionella etiketterna vänster-höger-mitten utan i grundläggande filosofiska principer: frihet eller tvång, frivilligt samtycke eller påtvingande, den ansvariga individen eller kollektivet. Det rätta sättet att tänka om politik är att utgå från etiska principer snarare än etiketter.
reviewed: false
