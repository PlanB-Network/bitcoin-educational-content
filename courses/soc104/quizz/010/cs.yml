question: "Kde se v Nolanově diagramu nacházejí Zelení a proč?"
answer: "Velmi nízko v diagramu, protože se domnívají, že individuální zájem nesmí mít přednost před kolektivním zájmem planety"
wrong_answers:
  - "Na vrcholu diagramu, protože stejně upřednostňují osobní svobodu i environmentální uvědomění"
  - "Ve středu diagramu, protože vyvažují ekonomický růst s ochranou životního prostředí"
  - "Na krajní pravici, protože podporují tržní řešení environmentálních výzev"
explanation: >-
  Zelení se v Nolanově diagramu nacházejí velmi nízko, protože ve jménu planetárního blaha upřednostňují silnou státní kontrolu nad ekonomickými i osobními rozhodnutími. Nahradili marxistický třídní boj bojem mezi člověkem a přírodou a mají sklon hájit ekonomickou kontrolu, a dokonce i zrušení soukromého vlastnictví. To je řadí do autoritářského sektoru, nikoli na vrchol nebo do středu.
