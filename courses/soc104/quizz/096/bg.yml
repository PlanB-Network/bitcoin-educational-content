question: "Кои три стълба на социалната държава Bitcoin поставя под въпрос?"
answer: "Фискалната система, паричният монопол за финансиране на разходи чрез дълг и наблюдението на транзакциите, за да се предотврати използването на алтернативни валути"
wrong_answers:
  - "Военният бюджет, системата за публично образование и контролираната от правителството здравна инфраструктура"
  - "Съдебната система, законодателният процес и изпълнителното прилагане на регулации върху бизнесите"
  - "Системата за социално осигуряване, законодателството за минималната заплата и прогресивната структура на данъка върху доходите"
explanation: >-
  Bitcoin поставя под въпрос трите стълба, върху които почива социалната държава. Първо, фискалната система, която е недостатъчна да покрие разходите. Второ, паричният монопол, тоест способността да се емитират пари, за да се финансират разходи чрез дълг. Трето, наблюдението на транзакциите, способността да се попречи на хората да използват друга валута освен наложената от държавата фиатна валута. Bitcoin подкопава и трите едновременно.
reviewed: false
