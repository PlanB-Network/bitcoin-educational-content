question: "Che cosa ha precedenza sulla libertà nella filosofia politica conservatrice?"
answer: "Ordine e tradizione, che devono essere saldamente stabiliti prima che la libertà possa essere valorizzata"
wrong_answers:
  - "Giustizia sociale e uguaglianza, che devono essere garantite prima che gli individui possano essere davvero liberi"
  - "Efficienza economica e risultati pragmatici, che determinano quando la libertà è appropriata"
  - "Diritti di proprietà individuale, che devono essere protetti prima che sia concessa qualsiasi altra libertà"
explanation: >-
  Per i conservatori, ordine e tradizione hanno precedenza sulla libertà. Sostengono che troppa libertà generi caos e disordine sociale, quindi la libertà può essere valorizzata solo una volta che l'ordine è stato saldamente stabilito. Questo contrasta con la visione socialista che dà priorità alla giustizia, o con l'attenzione centrista all'efficienza.
