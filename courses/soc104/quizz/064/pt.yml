question: "Por que os regimes totalitários foram descritos como 'religiões seculares', e o que isso revela sobre as condições necessárias para que o totalitarismo exista?"
answer: "Eles exigem uma fé quase religiosa dos militantes e usam o medo contra os opositores, e o totalitarismo exige todas as características simultaneamente: liberdades suprimidas, governo de partido único, revolução violenta e uma economia dirigida"
wrong_answers:
  - "Eles substituem o culto tradicional por cerimônias de Estado, e o totalitarismo exige apenas um líder carismático e controle militar"
  - "Eles usam instituições religiosas para impor a ideologia do Estado, e o totalitarismo pode surgir sempre que um único partido político domina o parlamento"
  - "Eles prometem salvação espiritual por meio da ação política, e o totalitarismo existe sempre que o Estado controla a economia, independentemente das liberdades políticas"
explanation: >-
  Raymond Aron observou que os regimes totalitários funcionam com base em dois princípios: a fé dos militantes e o medo dos opositores. Esse fanatismo quase religioso os caracteriza para além de suas diferentes motivações, rendendo-lhes o rótulo de religiões seculares. Crucialmente, o totalitarismo exige todas as características definidoras simultaneamente: liberdades suprimidas, autoridade ilimitada por meio de um partido único, revolução violenta e uma economia dirigida. Democracias modernas podem exibir alguns desses traços, mas o totalitarismo está presente apenas quando todos são reunidos.
