question: "Liberteryenler ile diğer siyasi aileler aynı hedefleri paylaştıklarında aralarındaki temel anlaşmazlık nedir?"
answer: "Anlaşmazlık araçlar üzerinedir: liberteryenler zorlayıcı çözümleri reddeder ve piyasa süreci yoluyla gönüllü mübadeleyi tercih eder"
wrong_answers:
  - "Anlaşmazlık amaçlar üzerinedir: liberteryenler toplumsal refah yerine bireysel servet gibi farklı hedefler peşinde koşar"
  - "Anlaşmazlık zamanlama üzerinedir: liberteryenler aynı hedeflere kademeli reform yoluyla daha yavaş ulaşmak ister"
  - "Anlaşmazlık kapsam üzerinedir: liberteryenler aynı politikaları ulusal düzey yerine yalnızca yerel düzeyde uygulamak ister"
explanation: >-
  Liberteryenler ezilenleri savunmak ya da toplumsal uyumu teşvik etmek gibi belirli hedeflerde sosyalistler, muhafazakârlar ve merkezcilerle aynı fikirde olabilir. Anlaşmazlık amaçlarda değil, araçlardadır. Liberteryenler pratikleri ve düzenlemeleri tek biçimli hâle getirmeye çalışan tüm zorlayıcı çözümleri reddeder; bunun yerine gönüllü sözleşmelere dayalı özgür, merkezsiz mübadele yoluyla seçim gücünü ve sorumlu özgürlüğü savunur.
reviewed: false
