question: Выход Simplicity использует фиксированную точку NUMS из BIP-0341 в качестве внутреннего ключа. Почему трата по ключу доказуемо невозможна, и что даёт рандомизация точки NUMS?
answer: Никто не знает дискретный логарифм точки NUMS, поэтому подпись по пути ключа существовать не может; рандомизация лишь добавляет приватность.
wrong_answers:
  - Точка NUMS лежит вне кривой, поэтому подписи по пути ключа не проходят; рандомизация возвращает её на кривую.
  - Приватный ключ точки NUMS равен нулю, что отвергается консенсусом; рандомизация защищает модификацию (tweak) от атак по побочным каналам.
  - Модификация точки NUMS даёт ключ вне допустимого диапазона, что делает трату по ключу нестандартной; рандомизация позволяет избежать повторного использования адреса.
explanation: >-
  Точка NUMS («Nothing-Up-My-Sleeve», «без потайного смысла») — это
  вполне корректная точка кривой, построенная так, что никто не знает
  соответствующего приватного ключа — её дискретный логарифм неизвестен.
  Поскольку трата по пути ключа требует подписи Шнорра под внутренним
  ключом, а без приватного ключа такую подпись создать невозможно, путь
  траты по ключу доказуемо непригоден к использованию, и средства могут
  быть потрачены только через закреплённый путь скрипта. Рандомизация
  точки NUMS ничего в этом не меняет; она лишь скрывает тот факт, что
  трата по ключу отключена, из-за чего выход выглядит как любой другой
  Taproot-выход — что даёт преимущество для приватности.
