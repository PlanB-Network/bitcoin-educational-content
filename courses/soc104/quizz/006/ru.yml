question: "Каковы две оси диаграммы Нолана?"
answer: "Вертикальная ось, измеряющая личные свободы, и горизонтальная ось, измеряющая экономические свободы"
wrong_answers:
  - "Горизонтальная ось от левых к правым и вертикальная ось от авторитарного к демократическому"
  - "Вертикальная ось, измеряющая богатство, и горизонтальная ось, измеряющая уровень образования"
  - "Горизонтальная ось от социализма к капитализму и вертикальная ось от традиции к прогрессу"
explanation: >-
  Дэвид Нолан построил свою диаграмму на двух конкретных осях: личные свободы (вертикальная) и экономические свободы (горизонтальная). Этот двумерный подход заменяет чрезмерно упрощенную линию левые–правые и лучше отражает сложность политических идеологий, разделяя две основные категории свободы.
