question: Liquidのネイティブアセットの仕組みで、規制対象アセットと非規制アセットの違いは何ですか？
answer: 規制対象アセットは、移動の前に認可サーバーによる2つ目の署名を必要とし、KYC/AMLへの準拠を可能にしている
wrong_answers:
  - 規制対象アセットはスマートコントラクトで発行され、非規制アセットは簡単なRPCコールで発行される
  - 規制対象アセットはBitcoinの準備金に裏付けられ、非規制アセットはサイドチェーン上にしか存在しない
  - 規制対象アセットの発行にはファンクショナリーの承認が必要だが、非規制アセットは誰でも許可なく発行できる
explanation: |
  Liquidのアーキテクチャでは、規制対象アセットも非規制アセットも、スマートコントラクトを使わずに簡単なRPCコールで、許可なく発行できます。大きな違いは移動の扱いにあります。規制対象アセットはBlockstreamのAsset Management Platform（AMP）を利用し、送付の前に追加の認可署名を求めることでコンプライアンスを確保します。一方、非規制アセットはそのような制限なしに自由に移動できます。