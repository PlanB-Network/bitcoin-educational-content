question: "Comment l'approche structurelle définit-elle la différence fondamentale entre socialisme et libertarianisme ?"
answer: "Le socialisme donne la primauté à l'État par la régulation, la planification et le contrôle, tandis que le libertarianisme donne la primauté à l'individu par une intervention minimale de l'État"
wrong_answers:
  - "Le socialisme privilégie les communautés agricoles rurales, tandis que le libertarianisme favorise le développement industriel urbain"
  - "Le socialisme se définit par son soutien aux élections démocratiques, tandis que le libertarianisme rejette toute forme de participation politique"
  - "Le socialisme se concentre sur la politique étrangère et la coopération internationale, tandis que le libertarianisme ne concerne que les questions économiques intérieures"
explanation: >-
  Structurellement, le socialisme se caractérise par l'omniprésence de l'État, qui régule, planifie et contrôle. Le libertarianisme se définit par une intervention minimale de l'État dans l'économie et la vie privée, tendant vers la primauté de la liberté individuelle et du marché libre. Cette distinction structurelle est beaucoup plus utile analytiquement que la comparaison des intentions déclarées de chaque système.
