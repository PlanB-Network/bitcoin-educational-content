question: "Что правые хотят законодательно регулировать?"
answer: "Мораль и религию — из-за желания сохранить традиционные институты и социальные иерархии"
wrong_answers:
  - "Экономику и финансовые рынки — из-за желания сократить неравенство и перераспределить богатство"
  - "Науку и образование — из-за желания контролировать то, чему учат в государственных школах"
  - "Международную торговлю и дипломатию — из-за желания расширить национальное влияние за рубежом"
explanation: >-
  Правые отдают приоритет личной морали и традиционным ценностям. Они считают, что цивилизация построена на определенных традиционных институтах и социальных иерархиях, которые необходимо сохранять, и хотят законодательно регулировать мораль и религию. Левые, а не правые, сосредоточены на законодательном регулировании экономики. Наука, образование и торговая политика не являются основным фокусом, описанным для правых.
reviewed: false
