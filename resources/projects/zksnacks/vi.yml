description: |
  "zk" trong zkSNACKs đại diện cho zero knowledge (kiến thức không), nghĩa là chúng tôi không thu thập và không thể thu thập bất kỳ thông tin cá nhân nào của người dùng trong sản phẩm của mình.

  zkSNACKs đã đóng bộ điều phối coinjoin của mình vào ngày 1 tháng 6 năm 2024, và trang web của công ty không còn truy cập được. Wasabi Wallet vẫn tiếp tục dưới dạng phần mềm mã nguồn mở.

