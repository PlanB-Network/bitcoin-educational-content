question: "¿Qué significa el término 'holismo' en el contexto de la filosofía socialista?"
answer: "Una visión de la sociedad como un todo indivisible donde lo colectivo tiene primacía sobre el individuo"
wrong_answers:
  - "Una filosofía que trata a cada individuo como una unidad autosuficiente cuyos derechos no pueden ser anulados por ningún grupo"
  - "Una teoría económica que defiende equilibrar los sectores público y privado en igual medida"
  - "Una estrategia política que integra todos los puntos de vista minoritarios en una única plataforma basada en el consenso"
explanation: >-
  Holismo viene del griego 'holos', que significa 'el todo'. En el pensamiento socialista, se refiere a una visión de la sociedad como un todo indivisible y no como una simple suma de individuos. El Estado socialista pretende hacerse cargo de la actividad humana y dirigirla al máximo. Este colectivo puede representarse como una clase social, una nación, una raza o un género, pero en cada caso el individuo queda definido por su pertenencia al grupo.
