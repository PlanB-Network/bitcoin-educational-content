question: "Почему Рон Пол утверждает, что Федеральная резервная система вредна, и как Bitcoin связан с его позицией?"
answer: "Федеральная резервная система вызывает инфляцию и экономические циклы через манипулирование фиатными деньгами, а Bitcoin представляет собой форму твёрдых денег, которая могла бы заменить золотой стандарт"
wrong_answers:
  - "Федеральная резервная система ограничивает банковскую конкуренцию, а Bitcoin децентрализует банковские услуги для улучшения финансовой инклюзии"
  - "Федеральная резервная система препятствует свободной торговле между странами, а Bitcoin обеспечивает трансграничные транзакции без государственного разрешения"
  - "Федеральная резервная система создаёт чрезмерный государственный долг, а Bitcoin предлагает дефляционную валюту, которая устраняет национальный долг"
explanation: >-
  Рон Пол, минархист, утверждает, что Федеральная резервная система ответственна за инфляцию и экономические циклы, потому что она манипулирует фиатными деньгами. Он отстаивает денационализацию денег — идею, которую продвигал Фридрих Хайек, — и рассматривает Bitcoin как форму твёрдых денег, способную заменить золотой стандарт. Его критика укоренена в либертарианской денежной теории, а не главным образом в банковской конкуренции, торговых барьерах или государственном долге.
reviewed: false
