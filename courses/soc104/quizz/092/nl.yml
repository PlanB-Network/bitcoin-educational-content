question: "Welke drie pijlers van de verzorgingsstaat daagt Bitcoin uit?"
answer: "Het fiscale systeem, het monetaire monopolie om uitgaven via schuld te financieren, en de surveillance van transacties om het gebruik van alternatieve valuta's te verhinderen"
wrong_answers:
  - "Het militaire budget, het openbaar onderwijssysteem en de door de overheid gecontroleerde zorginfrastructuur"
  - "Het gerechtelijk systeem, het wetgevingsproces en de uitvoerende handhaving van regels voor bedrijven"
  - "Het socialezekerheidsstelsel, de minimumloonwetgeving en de progressieve inkomstenbelastingstructuur"
explanation: >-
  Bitcoin daagt de drie pijlers uit waarop de verzorgingsstaat rust. Ten eerste het fiscale systeem, dat onvoldoende is om uitgaven te dekken. Ten tweede het monetaire monopolie, oftewel het vermogen om geld uit te geven om uitgaven via schuld te financieren. Ten derde de surveillance van transacties, het vermogen om te voorkomen dat mensen een andere valuta gebruiken dan de door de staat opgelegde fiatvaluta. Bitcoin ondermijnt alle drie tegelijk.
reviewed: false
