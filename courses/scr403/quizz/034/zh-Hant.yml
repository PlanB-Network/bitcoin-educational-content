question: 全加器對它兩個半加器的進位位元取 OR，而非取 XOR。為什麼 OR 是正確的？
answer: 對任何輸入而言，至多只有一個半加器會進位，因此 OR 恰好合併了兩個互斥的情況。
wrong_answers:
  - 這兩個進位位元必須相加，而 OR 正是 Simplicity 中進行單位元二進位加法的方式。
  - 在分支之後，OR 是唯一其型別仍與環境相符的布林運算子。
  - OR 會過度近似進位；任何虛假的進位之後都會被最終的投影捨棄。
explanation: >-
  如果第一個半加器進位了，那麼它的兩個輸入位元都是 1，所以它的和位元是 0 —— 而一個被餵入 0 的半加器永遠不可能進位。因此這兩個進位位元絕不會同時為 1，OR 便恰好將它們合併（在可達的輸入上它甚至與 XOR 一致）。正是這種互斥性，使得將全加器分解為兩個半加器的做法得以正確。
reviewed: false
