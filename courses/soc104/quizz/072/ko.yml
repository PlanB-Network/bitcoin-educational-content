question: "의료에 대한 사회주의자의 입장은 무엇인가요?"
answer: "의료 접근은 기본권이며, 국가는 소득과 무관하게 모두를 위한 보편적 공공재정 의료 시스템을 보장해야 합니다"
wrong_answers:
  - "의료는 기본적인 국가 보장에 민간 보험 선택지를 보완하는 혼합 시스템이어야 합니다"
  - "민간 시장은 더 혁신적인 의료를 제공하므로, 개인은 자신의 시스템을 자유롭게 선택해야 합니다"
  - "국가는 가장 가난한 시민에게만 의료를 제공하고, 그 밖의 모든 사람은 민간 보험이 보장해야 합니다"
explanation: >-
  사회주의자들에게 의료 접근은 상품이 아니라 기본권입니다. 국가는 소득과 무관하게 모든 사람이 돌봄에 접근할 수 있도록 보편적 공공재정 의료 시스템을 보장해야 합니다. 이는 평등, 사회 정의, 그리고 일반 이익을 위해 서비스를 조직하는 데서 국가의 중요성을 중시하는 사회주의자의 관심을 반영합니다. 혼합 시스템은 중도주의자의 관점을 설명하며, 선택 기반 접근은 리버테리언과 보수주의자의 입장을 반영합니다.
