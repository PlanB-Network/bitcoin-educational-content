question: "Varför motsätter sig libertarianer beskattning?"
answer: "Därför att den är en moralisk kränkning av äganderätten, en form av statlig stöld som tar någon annans egendom utan samtycke"
wrong_answers:
  - "Därför att skatter är ekonomiskt ineffektiva och alltid leder till högre arbetslöshet"
  - "Därför att beskattning avskräcker utländska investeringar och försvagar ett lands konkurrenskraft"
  - "Därför att progressiva skattesystem orättvist riktar in sig på förmögna individer som skapar flest jobb"
explanation: >-
  Den libertarianska invändningen mot beskattning är moralisk innan den är ekonomisk. Libertarianer ser beskattning som en form av statlig stöld och ett hinder för privat egendom eftersom den består i att ta någon annans egendom utan samtycke. Även om det kan finnas ekonomiska argument mot beskattning vilar det grundläggande libertarianska argumentet på principen att den kränker äganderätten, inte på beräkningar av effektivitet eller konkurrenskraft.
reviewed: false
