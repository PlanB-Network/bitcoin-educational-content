question: "Murray Rothbard 所理论化的非侵害原则是什么？"
answer: "主动对另一个个人或其财产使用身体强力是不正当的，但防御性暴力是被允许的"
wrong_answers:
  - "一切形式的暴力始终都是错误的，包括自卫和反抗压迫"
  - "暴力在针对压迫性制度时可以接受，但绝不能针对其他个人"
  - "只有国家拥有使用武力的正当权利，个人绝不应诉诸暴力"
explanation: >-
  Rothbard 的非侵害原则认为，主动对另一个人或其财产使用身体强力是不正当的。这是黄金法则的一种哲学转译。不过，它并不禁止一切暴力：防御性暴力，包括自卫和反抗压迫，被认为是正当的。这使它区别于纯粹的和平主义，也区别于国家所宣称的武力垄断。
