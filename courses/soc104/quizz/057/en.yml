question: "What are the cardinal values of centrism?"
answer: "Moderation, compromise, adaptation, and public utility"
wrong_answers:
  - "Tradition, order, authority, and national identity"
  - "Freedom, private property, consent, and individual responsibility"
  - "Equality, social justice, solidarity, and collective ownership"
explanation: >-
  The cardinal values of centrism are moderation, compromise, adaptation, and public utility. These reflect the centrist emphasis on pragmatic balance rather than ideological commitment. The other options describe the cardinal values of conservatism, libertarianism, and socialism respectively.
