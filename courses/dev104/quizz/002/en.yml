question: What is the main difference between block elements and inline elements in HTML?
answer: Block elements cover the full width of the page and force new lines, while inline elements have variable width and can appear side by side
wrong_answers:
  - Block elements are used for text content while inline elements are used for images and multimedia content only
  - Block elements can only contain other block elements while inline elements can only contain text and no other elements
  - Block elements are displayed in red boxes while inline elements are displayed in yellow boxes by default
explanation: |
  Block elements like div, p, and headings take up the full width available and create line breaks before and after themselves, stacking vertically. Inline elements like span, a, and img only take up as much width as their content needs and can sit next to each other on the same line. The other options are incorrect because both element types can contain various content, nesting rules are more complex than described, and elements have no default colored boxes.
