question: Ba chức năng chính của ví Bitcoin là gì?
answer: Nhận Bitcoin, gửi Bitcoin, bảo vệ phòng ngừa Bitcoin khỏi các nỗ lực trộm cắp (hack).
wrong_answers:
  - Lưu trữ Bitcoin, gửi Bitcoin, bảo vệ chúng khỏi các nỗ lực trộm cắp (hack).
  - Cho phép nhận Bitcoin, lưu trữ Bitcoin, bảo vệ chúng khỏi các nỗ lực trộm cắp (hack).
  - Cho phép nhận Bitcoin, cho phép gửi Bitcoin, bán Bitcoin.
explanation: |
  Ví Bitcoin được sử dụng để tương tác với mạng Bitcoin. Ba chức năng chính của nó là cho phép nhận Bitcoin, cho phép gửi Bitcoin và bảo vệ chúng khỏi các nỗ lực trộm cắp (hack).
reviewed: true