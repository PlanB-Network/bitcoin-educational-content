question: "诺兰图上的自由意志主义者之间存在什么内部张力？"
answer: "有些人想完全废除国家（无政府资本主义者），另一些人则偏好保留核心主权职能的最小国家（最小国家主义者）"
wrong_answers:
  - "有些人想要强力的经济监管，另一些人则偏好完全解除所有产业的监管"
  - "有些人支持民主选举，另一些人则偏好世袭治理制度"
  - "有些人主张进步社会政策，另一些人则捍卫严格的传统道德价值观"
explanation: >-
  在自由意志主义家族内部，对国家角色存在根本分歧。无政府资本主义者想用私人服务取代所有国家职能，而最小国家主义者接受保留国防与法院等核心主权职能的最小国家。两个群体同处自由意志主义的顶点，但在是否应存在任何国家这一点上有所不同。
reviewed: false
