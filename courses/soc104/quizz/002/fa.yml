question: "چرا محور چپ-راست برای جای‌دادن متفکران لیبرال کلاسیک مانند باستیا یا ران پال ناکافی دانسته می‌شود؟"
answer: "زیرا لیبرالیسم کلاسیک هم برای آزادی‌های اقتصادی و هم آزادی‌های شخصی ارزش قائل است، در حالی که نه چپ و نه راست هر دو را به‌طور کامل نمی‌پذیرند"
wrong_answers:
  - "زیرا لیبرال‌های کلاسیک همیشه با سیاست‌های اقتصادی راست‌گرا همسو هستند و همهٔ مواضع چپ‌گرا را رد می‌کنند"
  - "زیرا لیبرال‌های کلاسیک میانه‌گراهایی هستند که نسخه‌های معتدل ایدئولوژی‌های چپ و راست را می‌پذیرند"
  - "زیرا لیبرال‌های کلاسیک با همهٔ شکل‌های حکومت مخالف‌اند، و این آن‌ها را به جای متفکر سیاسی به آنارشیست تبدیل می‌کند"
explanation: >-
  محور چپ-راست برای لیبرال‌های کلاسیک ناکام می‌ماند، زیرا نمی‌تواند جایگاهی را در خود جا دهد که هم‌زمان از آزادی اقتصادی (معمولاً راست) و آزادی شخصی (معمولاً چپ) دفاع می‌کند. لیبرال‌های کلاسیک میانه‌گراهایی در جست‌وجوی سازش نیستند، و آنارشیست یا صرفاً راست‌گرا هم نیستند. آن‌ها به‌سادگی در یک طیف تک‌بعدی جا نمی‌گیرند.
reviewed: false
