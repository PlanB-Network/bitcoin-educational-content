question: "Varför kommer den libertarianska positionen om legalisering av droger med villkoret att statens roll i samhället måste minskas?"
answer: "Därför att liberalisering som tas över av staten skulle ersätta individuellt ansvar med statligt administrerad vård, medan libertarianer vill att medborgarna ska bära konsekvenserna av sina val med stöd från privata sammanslutningar"
wrong_answers:
  - "Därför att statskontrollerad legalisering skulle generera för mycket skatteintäkter, vilket skulle göra staten alltför mäktig och korrupt"
  - "Därför att staten skulle införa kvalitetsstandarder som skulle driva upp priserna och återskapa svarta marknader"
  - "Därför att statlig reglering av droger skulle bryta mot internationella handelsavtal och diplomatiska relationer"
explanation: >-
  Libertarianer stödjer drogliberalisering men insisterar på att statens roll måste minskas eftersom deras mål är att återupprätta individuellt ansvar, inte att utvidga statlig administration. Om någon blir beroende måste personen ta ansvar i stället för att be staten tillhandahålla vård. Lösningen på beroende ligger i privat initiativ: frivilligt stöd från individer, familjer och välgörenhetssammanslutningar. Statligt administrerad legalisering skulle motsäga den grundläggande libertarianska principen om personligt ansvar.
