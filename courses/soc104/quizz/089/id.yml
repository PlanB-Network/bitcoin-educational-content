question: "Apa argumen fundamental Hayek tentang mengapa perencanaan pusat gagal?"
answer: "Pengetahuan hanya ada sebagai fragmen tersebar yang dimiliki oleh individu-individu berbeda dan tidak dapat dikonsentrasikan atau diintegrasikan oleh otoritas pusat"
wrong_answers:
  - "Perencana pusat secara moral korup dan selalu bertindak demi kepentingan diri sendiri alih-alih kebaikan publik"
  - "Institusi demokratis terlalu lambat merespons perubahan ekonomi, sehingga keputusan tersentralisasi selalu ketinggalan zaman"
  - "Perencanaan pusat gagal karena warga sengaja menolak mandat pemerintah dan menolak mematuhi regulasi"
explanation: >-
  Argumen fundamental Hayek bertumpu pada sifat informasi. Ia menunjukkan bahwa pengetahuan tidak pernah ada dalam bentuk terkonsentrasi atau terintegrasi, melainkan hanya sebagai fragmen tersebar yang dimiliki oleh semua individu berbeda. Nilai bersifat subjektif dan hanya diketahui secara lokal serta tidak lengkap. Perencana pusat, yang duduk di kantor, tidak memiliki pengetahuan tentang harga sebenarnya dari berbagai hal karena ia tidak terlibat dalam interaksi dan pertukaran.
reviewed: false
