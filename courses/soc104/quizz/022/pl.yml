question: "Czym jest konserwatyzm polityczny?"
answer: "Ideologią, która dąży do zachowania ustanowionych instytucji politycznych i ładu społecznego, sprzeciwiając się poważnym wstrząsom strukturalnym"
wrong_answers:
  - "Osobistym zobowiązaniem do tradycyjnych wartości rodzinnych i praktyk religijnych bez dążenia do narzucania ich innym"
  - "Filozofią, która promuje szybką zmianę społeczną poprzez reformy demokratyczne i postępowe ustawodawstwo"
  - "Teorią gospodarczą, która opowiada się za wolnymi rynkami, minimalnym opodatkowaniem i zniesieniem barier handlowych"
explanation: >-
  Konserwatyzm polityczny jest ideologią, często reprezentowaną w partiach prawicowych lub skrajnie prawicowych, która dąży do zachowania ustanowionych instytucji politycznych i ładu społecznego, sprzeciwiając się poważnym wstrząsom strukturalnym. Jego zwolennicy chcą używać władzy i prawa, aby chronić swoje dziedzictwo. Różni się to od konserwatyzmu kulturowego, który jest osobistym wyborem życiowym, a nie programem politycznym.
