question: "වමට නීති සම්පාදනය කර නියාමනය කිරීමට අවශ්‍ය වන්නේ කුමක්ද?"
answer: "ආර්ථික නිදහස, capitalism, සහ free market වෙත ඇති විරෝධයෙන් මෙහෙයවන ආර්ථිකය"
wrong_answers:
  - "සම්ප්‍රදායික ආයතන රැක ගැනීමේ කැමැත්තෙන් මෙහෙයවන පුද්ගලික සදාචාරය සහ ආගමික චාරිත්‍ර"
  - "සංස්කෘතික අනන්‍යතාවය සහ ස්වාධිපත්‍යය පිළිබඳ කනස්සල්ලෙන් මෙහෙයවන සංක්‍රමණය සහ ජාතික දේශසීමා"
  - "automation මිනිස් සේවකයන් වෙනුවට පැමිණෙනු ඇතැයි ඇති බියෙන් මෙහෙයවන තාක්ෂණය සහ නවෝත්පාදනය"
explanation: >-
  වම සමාජ සාධාරණත්වයට සහ සමානත්වයට, විශේෂයෙන් ආර්ථික මට්ටමින්, ප්‍රමුඛතාවය දෙයි. මෙය ආර්ථික නිදහස, capitalism, සහ free market වෙත එහි විරෝධයටත්, ආර්ථිකය පිළිබඳ නීති සම්පාදනය කර එය නියාමනය කිරීමට ඇති කැමැත්තටත් මඟ පාදයි. ඊට විරුද්ධව, දකුණට සදාචාරය සහ ආගම පිළිබඳ නීති සම්පාදනය කිරීමට අවශ්‍ය වේ. සංක්‍රමණය සහ තාක්ෂණ නියාමනය මෙහි විස්තර කරන ප්‍රධාන අවධානය නොවේ.
