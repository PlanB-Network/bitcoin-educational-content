question: "Kubera iki iri somo ridondora Bitcoin nk'ifaranga ry'isoko rirwanya amahera ya leta aho kuba umugambi w'iburyo canke w'ibumoso?"
answer: "Kuko Bitcoin ari ifaranga ryemerwa ku bushake, rigoye guhingura, ritagizwe n'ikigo kimwe kandi rigumana agaciro, bikaritandukanya n'amafaranga ya Fiat y'agahato, ashizwe hamwe kandi atakaza agaciro, bigatuma umugabane uba isoko rihanganye na leta aho kuba ivyiyumviro vya politike"
wrong_answers:
  - "Kuko Bitcoin yaremwe n'umuhinguzi atazwi yanse n'ibigirankana kugira ico avuze ca politike ku ntumbero canke filozofiya yayo"
  - "Kuko algorithm ya mining ya Bitcoin ituma ibiceri bishasha bigaburwa kimwe ku migambwe yose ya politike, bigakingira ko uburyo bw'amahera bugira aho buhengamiye mu vyiyumviro"
  - "Kuko Bitcoin ikora cokimwe n'amafaranga ya Fiat asanzwe ariko igakorera ku buryo bwo kwishura bwihuta, bigatuma itandukaniro rya politike ritaba rigihambaye"
explanation: >-
  Bitcoin idondorwa nk'ukwiyamiriza mu mahoro ugushira amahera muri politike. Amahera ya leta canke ya Fiat ni uburyo bw'agahato, bushizwe hamwe, bukunze gutakaza agaciro. Amahera y'isoko, muri kahise akaba yari zahabu kandi ubu akaba ari Bitcoin, ni ifaranga ryiza, rigoye guhingura, rivuka ku bushake kandi rigumana agaciro karyo mu gihe kirekire. Uguhangana nyakuri si ibumoso n'iburyo, ahubwo ni isoko na leta, bigatuma Bitcoin iba ugucika kwa politike kurenga imigwi y'ivyiyumviro isanzwe.
