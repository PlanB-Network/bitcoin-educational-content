question: "conservative political philosophy තුළ නිදහසට වඩා ප්‍රමුඛතාව ගන්නේ කුමක්ද?"
answer: "Order සහ tradition, නිදහසට වටිනාකමක් දීමට පෙර ඒවා ස්ථිරව ස්ථාපිත විය යුතුය"
wrong_answers:
  - "Social justice සහ equality, පුද්ගලයන් සත්‍ය ලෙස නිදහස් වීමට පෙර ඒවා සහතික කළ යුතුය"
  - "Economic efficiency සහ pragmatic results, නිදහස සුදුසු වන අවස්ථාව ඒවා තීරණය කරයි"
  - "Individual property rights, වෙනත් ඕනෑම නිදහසක් ලබාදීමට පෙර ඒවා ආරක්ෂා කළ යුතුය"
explanation: >-
  conservatives සඳහා, order සහ tradition නිදහසට වඩා ප්‍රමුඛත්වය ගනී. අධික නිදහස chaos සහ සමාජ disorder ජනනය කරන බැවින්, order ස්ථිරව ස්ථාපිත වූ පසු පමණක් නිදහසට වටිනාකමක් දිය හැකි බව ඔවුන් තර්ක කරයි. මෙය justice ප්‍රමුඛ කරන socialist දෘෂ්ටියටත්, efficiency මත කේන්ද්‍රගත වන centrist අවධානයටත් විරුද්ධ වේ.
reviewed: false
