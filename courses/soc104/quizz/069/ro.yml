question: "De ce au fost descrise regimurile totalitare drept «religii seculare» și ce dezvăluie acest lucru despre condițiile necesare pentru existența totalitarismului?"
answer: "Ele cer de la militanți o credință cvasi-religioasă și folosesc frica împotriva opozanților, iar totalitarismul necesită simultan toate caracteristicile: libertăți suprimate, dominație a partidului unic, revoluție violentă și economie dirijată"
wrong_answers:
  - "Ele înlocuiesc cultul tradițional cu ceremonii de stat, iar totalitarismul necesită doar un lider carismatic și control militar"
  - "Ele folosesc instituții religioase pentru a impune ideologia de stat, iar totalitarismul poate apărea ori de câte ori un singur partid politic domină parlamentul"
  - "Ele promit mântuire spirituală prin acțiune politică, iar totalitarismul există ori de câte ori statul controlează economia, indiferent de libertățile politice"
explanation: >-
  Raymond Aron a observat că regimurile totalitare funcționează pe două principii: credința militanților și frica opozanților. Acest fanatism cvasi-religios le caracterizează dincolo de motivațiile lor diferite, aducându-le eticheta de religii seculare. În mod crucial, totalitarismul necesită simultan toate caracteristicile definitorii: libertăți suprimate, autoritate nelimitată printr-un partid unic, revoluție violentă și economie dirijată. Democrațiile moderne pot manifesta unele dintre aceste trăsături, dar totalitarismul este prezent numai atunci când toate sunt reunite.
reviewed: false
