question: "Avrupa siyasi geleneğinde 'liberal' terimi ne anlama gelir?"
answer: "Laissez-faire ekonomisinin, azaltılmış devlet müdahalesinin ve bireysel özgürlüklerin destekçisi"
wrong_answers:
  - "Devlet müdahalesinin, kamu sağlık sigortasının ve yoksulluk karşıtı programların savunucusu"
  - "Hükümetin ve özel mülkiyetin tamamen kaldırılmasını isteyen radikal bir anarşist"
  - "Tüm politika alanlarında sosyalist ve muhafazakâr pozisyonları eşit şekilde dengeleyen bir merkezci"
explanation: >-
  Avrupa'da liberalizm, laissez-faire ekonomi politikaları, azaltılmış devlet müdahalesi ve bireysel özgürlüklerin savunulmasıyla ilişkilendirilmeye devam etmiştir. İlk yanlış cevap, terimin anlamını müdahaleciliğe doğru kaydırmış olan Amerikan liberallerini tanımlar. Avrupa liberalizmi ne anarşizm ne de merkezciliktir.
