question: "Jak Ron Paul ilustroval paleo-libertariánský postoj k otázkám, jako je užívání drog a potraty?"
answer: "Osobně nedoporučoval užívání drog a stavěl se proti potratům, ale politicky bojoval proti federální prohibici a tvrdil, že volby mají být ponechány jednotlivcům nebo státům"
wrong_answers:
  - "Podporoval federální legalizaci všech drog a potratů jako otázku absolutních individuálních práv"
  - "Vedl kampaň za přísné federální zákazy drog i potratů na základě svého osobního morálního přesvědčení"
  - "Odmítal vyjadřovat jakýkoli osobní názor na tyto otázky a tvrdil, že politici mají zůstat morálně neutrální"
explanation: >-
  Ron Paul ztělesňuje paleo-libertariánskou syntézu tím, že odděluje osobní morální přesvědčení od politického donucení. Vždy nedoporučoval užívání drog, ale zároveň se stavěl proti prohibici drog. Osobně byl proti potratům, přesto tvrdil, že volba by měla být ponechána federálním státům, nikoli vnucena shora. To ukazuje, jak lze zastávat silné tradiční hodnoty a zároveň odmítat použití donucovací moci federální vlády k jejich vymáhání.
