question: "社会主義哲学の文脈で「全体論」という用語は何を意味しますか？"
answer: "社会を不可分の全体として見る見方であり、集団が個人に優先する"
wrong_answers:
  - "各個人を、いかなる集団にも覆すことのできない権利を持つ自己完結した単位として扱う哲学"
  - "公共部門と民間部門を同程度に均衡させることを主張する経済理論"
  - "すべての少数派の見解を、単一の合意ベースの綱領に統合する政治戦略"
explanation: >-
  全体論は「全体」を意味するギリシア語の 'holos' に由来する。社会主義思想では、それは社会を個人の単純な総和ではなく、不可分の全体として見る見方を指す。社会主義国家は、人間活動を最大限に引き受け、方向づけることを目指す。この集団は社会階級、国民、人種、またはジェンダーとして表され得るが、いずれの場合も個人は集団への帰属によって定義される。
reviewed: false
