question: "موضع محافظه‌کارانه درباره مهاجرت چیست؟"
answer: "دولت حق حاکمیتی دارد که برای حفاظت از امنیت ملی و هویت فرهنگی، مرزهای خود را کنترل کند"
wrong_answers:
  - "مرزها باید بی‌قیدوشرط باز باشند، زیرا محدودیت‌های تبعیض‌آمیز حقوق بشر را نقض می‌کنند"
  - "مهاجرت باید با تقاضای بازار تعیین شود، به‌طوری که شهروندان درباره روابط خود با خارجیان به‌صورت قراردادی تصمیم بگیرند"
  - "سیاست مهاجرت باید بر اساس ارزیابی کارشناسان، نیازهای اقتصادی را با ادغام موفق متوازن کند"
explanation: >-
  محافظه‌کاران معتقدند که نظم، هویت و حاکمیت ملی باید بر پذیرش نامحدود خارجیان یا پناهندگان اولویت داشته باشد. مرزها و جمعیتی به‌خوبی تعریف‌شده بخشی از ارزش‌های متمدنانه‌اند. پاسخ‌های نادرست به‌ترتیب موضع سوسیالیستی (مرزهای باز به‌عنوان حقوق بشر)، موضع لیبرتارین (مهاجرت مبتنی بر بازار) و موضع میانه‌رو (رویکرد متوازن و کارشناس‌محور) را نشان می‌دهند.
reviewed: false
