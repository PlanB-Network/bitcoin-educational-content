question: Какова связь между Simplicity и секвенциальным исчислением Генцена?
answer: Её девять комбинаторов отражают конъюнктивно-дизъюнктивный фрагмент секвенциального исчисления.
wrong_answers:
  - Simplicity была напрямую переведена из доказательств секвенциального исчисления в рабочий код.
  - Секвенциальное исчисление Генцена используется во время выполнения для проверки типов программ Simplicity.
  - Они совершенно не связаны, а внешнее сходство — чистое совпадение.
explanation: >-
  Девять базовых правил Simplicity близко напоминают правила
  секвенциального исчисления Генцена — по аналогии с соответствием
  Карри-Ховарда между лямбда-исчислением и естественным выводом. Эта
  связь гарантирует, что типы в посылках меньше, чем в заключениях, —
  свойство, которое Bit Machine использует для эффективного выполнения с
  минимальным копированием данных.
reviewed: false
