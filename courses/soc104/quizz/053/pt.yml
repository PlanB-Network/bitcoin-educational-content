question: "Qual é a diferença-chave entre minarquistas e anarcocapitalistas dentro do libertarianismo?"
answer: "Minarquistas aceitam um Estado mínimo para defesa, justiça e polícia, enquanto anarcocapitalistas querem que todas as funções do Estado sejam privatizadas"
wrong_answers:
  - "Minarquistas rejeitam todas as formas de governo, enquanto anarcocapitalistas aceitam regulação estatal limitada dos mercados"
  - "Minarquistas favorecem tributação progressiva para serviços essenciais, enquanto anarcocapitalistas se opõem a toda tributação"
  - "Minarquistas se concentram apenas na liberdade econômica, enquanto anarcocapitalistas defendem tanto liberdades econômicas quanto sociais"
explanation: >-
  Minarquistas acreditam que o Estado deve ser limitado a funções centrais como defesa, justiça e polícia (o "Estado vigia-noturno"), enquanto anarcocapitalistas argumentam que até essas funções devem ser privatizadas e geridas por meio da competição voluntária de mercado. A discordância deles diz mais respeito à implementação prática do que a princípios éticos fundamentais. Ambas as tendências compartilham os mesmos valores libertários de autopropriedade e não agressão.
