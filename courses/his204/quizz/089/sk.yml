question: Prečo Condillacova teória poskytuje značnú podporu princípu voľného obchodu?
answer: Pretože ak je obchod vždy vzájomne prospešný, nemá zmysel obmedzovať ho ani zakazovať colnými opatreniami
wrong_answers:
  - Pretože Condillac výpočtom ukázal, že voľný obchod obohacuje národ viac než protekcionizmus
  - Pretože Condillac dokázal, že voľný obchod je dobrý pre mier
  - Pretože Condillac bol priateľom Adama Smitha
explanation: |
  Condillacova teória tvrdí, že výmena je vzájomne prospešná, pretože každá strana sa vzdáva toho, čo si cení najmenej, aby získala to, čo si cení najviac. Preto niet potreby obmedzovať alebo zakazovať obchod colnými opatreniami či inými obmedzeniami.
