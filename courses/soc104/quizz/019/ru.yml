question: "Что вертикальная ось диаграммы Нолана раскрывает об истинном политическом вопросе?"
answer: "Она раскрывает, хотите ли вы навязать другим собственные предпочтения через государство или предпочитаете, чтобы каждый человек был свободен решать за себя"
wrong_answers:
  - "Она раскрывает, поддерживаете ли вы демократическое управление или предпочитаете авторитарное правление одного лидера"
  - "Она раскрывает, отождествляете ли вы себя с прогрессивными общественными движениями или с традиционными религиозными институтами"
  - "Она раскрывает, является ли вашей главной заботой национальная безопасность или экономическое процветание"
explanation: >-
  Вертикальная ось раскрывает истинный политический вопрос: не в том, левый вы или правый, а в том, в какой мере вы хотите, чтобы государство вмешивалось в формирование общества согласно вашим ценностям. Хотите ли вы навязать свои предпочтения другим или предпочитаете, чтобы каждый человек был свободен решать за себя? Такая рамка выходит за пределы разделения на левых и правых и показывает, что оба лагеря могут быть в равной степени этатистскими.
reviewed: false
