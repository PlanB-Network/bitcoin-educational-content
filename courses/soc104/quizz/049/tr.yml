question: "Liberteryenler siyaset felsefelerinin merkezine neyi yerleştirir?"
answer: "Etik ve hukuk"
wrong_answers:
  - "Ekonomik büyüme ve servet yaratımı"
  - "Toplumsal eşitlik ve kolektif refah"
  - "Ulusal kimlik ve kültürel koruma"
explanation: >-
  Liberteryenler, ekonomiyi değil etik ve hukuku felsefelerinin merkezine yerleştirerek diğer tüm siyasi ailelerden ayrılır. Piyasa ekonomisini savunduklarında, bunu servet üretme kapasitesinden çok bireysel özgürlüğü ve sorumluluğu teşvik ettiği için yaparlar. Ekonomik büyüme ikincil bir faydadır, temel ilke değildir.
reviewed: false
