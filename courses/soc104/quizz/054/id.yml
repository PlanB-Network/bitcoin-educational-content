question: "Apa yang dinyatakan oleh prinsip non-agresi?"
answer: "Seseorang bebas bertindak sesuai kehendaknya selama tidak ada kekerasan yang dilakukan terhadap hidup, kebebasan, atau properti orang lain"
wrong_answers:
  - "Negara memiliki hak tunggal untuk menggunakan kekuatan demi mempertahankan tatanan sosial"
  - "Warga negara harus tunduk pada kekuasaan mayoritas bahkan ketika itu membatasi kebebasan individu"
  - "Kebebasan bertindak diizinkan hanya ketika bermanfaat bagi kebaikan kolektif masyarakat"
explanation: >-
  Prinsip non-agresi adalah landasan politik libertarian, yang menyatakan bahwa individu boleh bertindak bebas asalkan mereka tidak melakukan kekerasan terhadap hidup, kebebasan, atau properti orang lain. Ini mengingatkan pada aturan emas yang ditemukan di berbagai peradaban. Berbeda dari opsi lain, prinsip ini tidak memberi negara otoritas moral khusus atau menundukkan hak individu pada manfaat kolektif.
reviewed: false
