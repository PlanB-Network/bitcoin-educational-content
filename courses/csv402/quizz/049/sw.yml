question: RGB inahakikishaje usiri katika usimamizi wa mali dijitali?
answer: Kwa kusajili ahadi za cryptography pekee kwenye Blockchain
wrong_answers:
  - Kwa kusimba miamala yote za mwisho hadi mwisho kwenye Blockchain
  - Kwa kuficha utambulisho wa watumiaji kupitia vichanganyaji vilivyogatuliwa
  - Kwa kutumia address za muda za Bitcoin pekee kwa kila uhamishaji
explanation: |
  Kwa kuhifadhi ushahidi wa cryptography wa On-Chain pekee, RGB huweka Contract nyeti na uhamishaji wa taarifa kuwa siri.
reviewed: true
