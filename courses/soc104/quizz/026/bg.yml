question: "Защо класическите либерали в Съединените щати започват да се наричат „либертарианци“ от 60-те години нататък?"
answer: "За да се разграничат от американските „liberals“, чието значение се е изместило към държавен интервенционизъм"
wrong_answers:
  - "За да се подравнят с Демократическата партия и нейните прогресивни социални програми"
  - "За да заявят подкрепата си за реформите Great Society на Lyndon B. Johnson"
  - "За да възприемат по-радикална революционна идентичност, вдъхновена от европейски социалистически движения"
explanation: >-
  В Съединените щати думата „liberal“ се измества към значение на поддръжници на Big Government и държавна намеса, особено след New Deal и Great Society. Класическите либерали приемат етикета „либертарианец“, за да запазят първоначалното значение на своята философия. Те се разграничават от американските „liberals“, а не се подравняват с тях.
reviewed: false
