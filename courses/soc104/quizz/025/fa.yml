question: "مفهوم 'نظم خودجوش'، آن‌گونه که Friedrich Hayek توصیف کرده، چیست؟"
answer: "قواعد و هنجارهای اجتماعی باید از تعاملات آزاد افراد پدیدار شوند، نه اینکه با برنامه‌ریزی اقتدارگرایانه تحمیل شوند"
wrong_answers:
  - "بازارها به‌طور طبیعی به سوی انحصار میل می‌کنند مگر اینکه دولت برای حفظ تعادل رقابتی مداخله کند"
  - "انتخابات دموکراتیک تنها سازوکار مشروع برای وضع قوانینی است که جامعه را اداره می‌کنند"
  - "بحران‌های اقتصادی خودبه‌خود پدید می‌آیند و برای بازگرداندن ثبات به مداخلهٔ فوری دولت نیاز دارند"
explanation: >-
  مفهوم نظم خودجوش نزد Hayek می‌گوید قواعد اداره‌کنندهٔ جامعه نباید از بالا و از طریق برنامه‌ریزی مرکزی تحمیل شوند، بلکه باید از بازی آزاد اراده‌های فردی، قراردادها و روابط داوطلبانه پدیدار شوند. این یکی از محورهای بنیادین اندیشهٔ لیبرتارین است. این مفهوم دلالت نمی‌کند که بازارها به سوی انحصار میل دارند یا بحران‌ها به مداخلهٔ دولت نیازمندند.
reviewed: false
