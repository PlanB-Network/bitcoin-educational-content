question: "为什么货币通胀被描述为一种未经公民同意而强加的隐藏税？"
answer: "因为政府创造货币会使货币贬值，使人们用同样金额能买到的东西更少，但大多数人没有意识到价格上涨反映的是政府政策，而不是自然市场力量"
wrong_answers:
  - "因为中央银行会秘密地对通过银行系统处理的每笔交易收取费用，而不向账户持有人披露"
  - "因为政府印钞并只把钱分配给富人，同时通过提高必需品销售税来向穷人征税"
  - "因为通胀是由私人公司为了增加利润而提高价格造成的，这相当于对消费者征收一种非官方税"
explanation: >-
  向体系中注入货币会转化为货币贬值，同样金额能买到的东西更少，因为新货币并不反映真实经济增长。大多数人看不到，是政府政策导致了价格上涨，而价格上涨只是货币贬值的反映。这等同于合法盗窃和制度化掠夺，使中产阶级贫困化，而富人则通过投机资产捕获新货币。
reviewed: false
