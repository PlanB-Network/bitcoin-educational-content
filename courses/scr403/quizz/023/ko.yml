question: "일반적으로 예외는 교환 가능하지 않은데, Simplicity에서 Failure 효과는 왜 교환 가능한가요?"
answer: 예외 타입이 값이 하나뿐인 유닛(1)이므로, 던지는 순서가 중요하지 않기 때문입니다.
wrong_answers:
  - Simplicity가 컴비네이터 tree에 의해 정의된 결정적 순서로 모든 표현식을 실행하기 때문입니다.
  - Failure 효과는 항상 case 컴비네이터에 의해 잡힌 다음 다시 던져지기 때문입니다.
  - Simplicity가 배치 검증을 사용하여 던져진 모든 예외를 동등하게 만들기 때문입니다.
explanation: >-
  일반적으로 예외는 교환 가능하지 않습니다. 서로 다른 표현식이 서로 다른
  예외 값을 던질 수 있기 때문입니다. 그러나 Simplicity는 예외를 유닛 타입(가능한 값이 하나뿐임)으로 제한하므로,
  실패할 수 있는 두 표현식의 순서를 바꾸어도 실제로 어느 쪽이 실패하든 같은 예외가 생성됩니다.
  이 교환 가능성 속성은 중요한 프로그램 최적화를 가능하게 합니다.
reviewed: true
