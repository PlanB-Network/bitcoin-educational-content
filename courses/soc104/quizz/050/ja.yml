question: "外交政策へのアプローチにおいて、ネオ保守主義者とパレオ保守主義者を区別するものは何か？"
answer: "ネオ保守主義者は民主主義を広めるための軍事介入主義を正当化する一方、パレオ保守主義者はより孤立主義的な外交政策を擁護する"
wrong_answers:
  - "ネオ保守主義者はあらゆる軍事行動に反対して外交を好む一方、パレオ保守主義者は潜在的脅威への先制攻撃を支持する"
  - "ネオ保守主義者は経済制裁だけに集中する一方、パレオ保守主義者は共同軍事作戦のための国際連合の構築を主張する"
  - "ネオ保守主義者とパレオ保守主義者は外交政策では一致するが、国内の経済規制をめぐって鋭く対立する"
explanation: >-
  2000 年代以降、ネオ保守主義者は、世界中に民主主義を植え付けるための軍事介入主義の正当化にますます関与するようになった。とりわけ 2001 年 9 月 11 日以後である。これに反応して、伝統的保守主義者は自分たちを区別するために「パレオ保守主義者」というラベルを主張した。パレオ保守主義者は軍事介入主義を批判し、より孤立主義的な外交政策を擁護し、国民的・文化的アイデンティティをより重視する。
reviewed: false
