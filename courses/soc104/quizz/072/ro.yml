question: "Ce este conceptul de «hazard moral» în contextul dezbaterii despre subvenții și ce familie politică ridică această preocupare?"
answer: "Hazardul moral este stimulentul către iresponsabilitate atunci când companiile sunt împiedicate să eșueze prin subvenții, deoarece contribuabilul plătește în cele din urmă; această preocupare este ridicată de libertarieni"
wrong_answers:
  - "Hazardul moral este riscul ca firmele subvenționate să se relocheze în țări cu taxe mai mici, luând locurile de muncă cu ele; această preocupare este ridicată de conservatori"
  - "Hazardul moral este pericolul ca oficialii guvernamentali să devină corupți alegând ce companii primesc subvenții; această preocupare este ridicată de centriști"
  - "Hazardul moral este problema etică a companiilor care exploatează lucrătorii după ce primesc fonduri publice; această preocupare este ridicată de socialiști"
explanation: >-
  Libertarienii susțin că subvențiile și salvările financiare creează hazard moral: atunci când companiile sunt împiedicate să eșueze, acest lucru stimulează iresponsabilitatea și nesăbuința, deoarece nu există consecințe pentru deciziile proaste. În cele din urmă, contribuabilul este cel care plătește, ceea ce libertarienii consideră profund nedrept. Acest concept este distinct de preocupările privind relocarea companiilor, corupția oficială sau exploatarea lucrătorilor ridicate de alte familii politice.
