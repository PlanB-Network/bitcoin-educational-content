question: De ce oferă teoria lui Condillac un sprijin considerabil principiului liberului schimb?
answer: Pentru că, dacă schimbul este întotdeauna reciproc avantajos, nu are rost să fie limitat sau interzis prin taxe vamale
wrong_answers:
  - Pentru că Condillac a demonstrat prin calcul că liberul schimb îmbogățește o națiune mai mult decât protecționismul
  - Pentru că Condillac a demonstrat că liberul schimb este bun pentru pace
  - Pentru că Condillac era prieten cu Adam Smith
explanation: |
  Teoria lui Condillac susține că schimbul este reciproc avantajos, deoarece fiecare parte renunță la ceea ce prețuiește mai puțin pentru a obține ceea ce prețuiește mai mult. În consecință, nu este nevoie să se limiteze sau să se interzică comerțul prin taxe vamale sau alte restricții.
