question: "تمایز کلیدی میان حامی کسب‌وکار بودن و حامی بازار بودن چیست؟"
answer: "حامیان کسب‌وکار به‌دنبال مداخلهٔ دولت برای محافظت از شرکت‌های مشخص در برابر شکست هستند، در حالی که حامیان بازار از مقررات‌زدایی حمایت می‌کنند و اجازه می‌دهند کسب‌وکارها شکست بخورند تا بازار بتواند به‌طور طبیعی بازسازمان یابد"
wrong_answers:
  - "حامیان کسب‌وکار بر شرکت‌های بزرگ تمرکز می‌کنند، در حالی که حامیان بازار منحصراً بر حمایت از کسب‌وکارهای کوچک و استارتاپ‌ها تمرکز دارند"
  - "حامی کسب‌وکار بودن موضعی چپ‌گراست که به نفع تعاونی‌های کارگری است، در حالی که حامی بازار بودن موضعی راست‌گراست که به نفع مالکیت خصوصی است"
  - "حامیان کسب‌وکار هرگونه رقابت را رد می‌کنند، در حالی که حامیان بازار از رقابتِ تحت تنظیم دولت میان بنگاه‌های تأییدشده حمایت می‌کنند"
explanation: >-
  موضع حامی کسب‌وکار، رقابت را ابزاری برای حکمرانی می‌بیند که از طریق مقررات به دست می‌آید، و یارانه‌ها و نجات‌های مالی را برای جلوگیری از از دست رفتن شغل‌ها توجیه می‌کند. در نگاه حامی کسب‌وکار، بازار شکننده است و به نجات دولت نیاز دارد. حامیان بازار رقابت را نتیجهٔ طبیعی بنگاه‌داری آزاد می‌دانند؛ نتیجه‌ای که مستلزم مقررات‌زدایی و اجازه‌دادن به شکست کسب‌وکارهاست، زیرا شکست به بازار امکان می‌دهد به‌طور طبیعی بازسازمان یابد و میدان را برای کنشگران توانمندتر باز کند.
reviewed: false
