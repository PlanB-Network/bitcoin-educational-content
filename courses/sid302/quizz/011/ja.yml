question: HTLCを使ったLiquidからLightningへのスワップで、サービスプロバイダーがLightningインボイスを支払うと何が起こりますか？
answer: プロバイダーはLightningの支払いからプリイメージを得て、それを使ってHTLCのロックを解除し、L-BTCを受け取れる
wrong_answers:
  - プロバイダーは、タイムロックの期限が切れるまで、HTLCコントラクトにロックされたL-BTCにアクセスできない
  - "クライアントが自動的にプリイメージを受け取り、それを使ってL-BTCをプロバイダーのLiquidウォレットに直接送る"
  - HTLCコントラクトが自動的に実行され、追加の暗号学的な証明なしにL-BTCがプロバイダーに移される
explanation: |
  HTLCは、両方のネットワークで同じハッシュロックを使って暗号学的に結び付けることで、アトミックスワップを実現します。プロバイダーはLightningインボイスの支払いに成功すると、ハッシュロックに一致するプリイメージ（秘密）を手に入れます。このプリイメージが暗号学的な鍵となり、あらかじめHTLCにロックされていたL-BTCのロックを解除できます。他の選択肢は、HTLCのアトミックな性質を正しく表していないため誤りです。タイムロックはあくまで予備の仕組みであり、クライアントがプリイメージを配るわけではなく、HTLCは自動実行ではなく能動的な暗号学的証明を必要とします。