question: 在 Simplicity 中，和类型（A + B）是什么？
answer: "带标签联合：一个值要么是带左标签的 A，要么是带右标签的 B。"
wrong_answers:
  - 一种同时包含来自 A 和 B 的所有值的类型。
  - 两个组成类型的位大小的算术相加。
  - 一种把来自 A 的每个输入映射到 B 中某个输出的函数类型。
explanation: >-
  和类型 A + B 是一个带标签联合。每个值都携带一个一位标签，
  表明它是左变体（类型为 A）还是右变体（类型为 B）。即使 A 和 B
  是同一种类型，带左标签的值和带右标签的值仍然是不同的。
reviewed: false
