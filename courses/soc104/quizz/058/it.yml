question: "Qual è la differenza chiave tra minarchisti e anarco-capitalisti all'interno del libertarismo?"
answer: "I minarchisti accettano uno Stato minimo per difesa, giustizia e polizia, mentre gli anarco-capitalisti vogliono privatizzare tutte le funzioni dello Stato"
wrong_answers:
  - "I minarchisti rifiutano ogni forma di governo, mentre gli anarco-capitalisti accettano una regolazione statale limitata dei mercati"
  - "I minarchisti favoriscono la tassazione progressiva per i servizi essenziali, mentre gli anarco-capitalisti si oppongono a ogni tassazione"
  - "I minarchisti si concentrano solo sulla libertà economica, mentre gli anarco-capitalisti difendono sia le libertà economiche sia quelle sociali"
explanation: >-
  I minarchisti credono che lo Stato debba essere limitato a funzioni centrali come difesa, giustizia e polizia (lo "Stato guardiano notturno"), mentre gli anarco-capitalisti sostengono che anche queste funzioni dovrebbero essere privatizzate e gestite attraverso la concorrenza volontaria di mercato. Il loro disaccordo riguarda più l'implementazione pratica che i principi etici fondamentali. Entrambe le tendenze condividono gli stessi valori libertari di auto-proprietà e non aggressione.
