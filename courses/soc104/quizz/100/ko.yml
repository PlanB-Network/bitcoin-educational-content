question: "사이퍼펑크 원칙 'Cypherpunks write code'는 자유를 달성하는 운동의 접근 방식에 대해 무엇을 드러내나요?"
answer: "자유로 가는 길은 익명 시스템을 적극적으로 구축하는 것을 통과하며, 코드를 자유라는 추상적 아이디어를 현실로 바꾸는 근본 도구로 사용한다는 점입니다"
wrong_answers:
  - "사이퍼펑크가 주로 정치적 행동주의 캠페인의 자금을 마련하기 위해 상업용 애플리케이션을 작성하는 소프트웨어 개발자라는 점입니다"
  - "그 운동이 직접 행동보다 글로 된 선언문과 학술 출판을 통해 대중을 교육하는 것을 믿는다는 점입니다"
  - "사이퍼펑크가 감시 프로그램을 폭로하고 입법 개혁을 강제하기 위해 기존 정부 시스템을 해킹하는 데 집중한다는 점입니다"
explanation: >-
  "Cypherpunks write code"라는 공식은 단순한 희망이 아니라 적극적 개입에 대한 운동의 헌신을 반영합니다. Eric Hughes에게 자유로 가는 길은 임의의 정치적 분할을 무의미하게 만드는 익명 시스템의 능동적 구축을 통과합니다. 코드는 자유라는 추상적 아이디어를 현실로 바꾸는 근본 도구가 되며, 이것이 Satoshi Nakamoto가 백서를 쓰기도 전에 전체 Bitcoin 코드를 작성한 이유입니다.
