question: "دولت‌گرایان چپ‌گرا و راست‌گرا چه هدف سیاسی مشترکی دارند؟"
answer: "به‌دست‌آوردن قدرت برای سازمان‌دهی جامعه مطابق با تصور خود از جهان و تحمیل آن به همه"
wrong_answers:
  - "کاهش اندازهٔ دولت و بازگرداندن قدرت تصمیم‌گیری به شهروندان منفرد"
  - "ایجاد دموکراسی مستقیم که در آن هر شهروند دربارهٔ هر تصمیم قانون‌گذاری رأی دهد"
  - "حذف احزاب سیاسی و جایگزینی آن‌ها با حکمرانی تکنوکراتیک مستقل"
explanation: >-
  دولت‌گرایان چپ و راست هدف سیاسی یکسانی دارند: به‌دست‌آوردن قدرت برای سازمان‌دهی جامعه مطابق با جهان‌بینی خود و تحمیل آن به همه از طریق قانون‌گذاری. تفاوت فقط در ارزش‌های آنان است: راست به دفاع از تمدن استناد می‌کند، در حالی که چپ به دفاع از طبقهٔ کارگر یا ستمدیدگان استناد می‌کند. هیچ‌کدام به‌دنبال کاهش دولت یا حذف احزاب نیستند.
reviewed: false
