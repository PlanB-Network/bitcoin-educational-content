question: "Sự phân chia nền tảng nào đã tách biệt những người xã hội chủ nghĩa từ đầu thế kỷ XX trở đi?"
answer: "Những người xã hội chủ nghĩa cách mạng tìm cách giành quyền lực bằng bạo lực đối lập với những người xã hội chủ nghĩa cải cách theo đuổi thay đổi thông qua bầu cử dân chủ"
wrong_answers:
  - "Những người xã hội chủ nghĩa đô thị tập trung vào công nhân công nghiệp đối lập với những người xã hội chủ nghĩa nông thôn tổ chức các công xã nông nghiệp"
  - "Những người xã hội chủ nghĩa dân tộc đặt ưu tiên cho quốc gia của mình đối lập với những người xã hội chủ nghĩa quốc tế ủng hộ cách mạng toàn cầu"
  - "Những nhà xã hội chủ nghĩa trí thức viết các văn bản lý thuyết đối lập với những nhà xã hội chủ nghĩa hoạt động tổ chức đình công lao động"
explanation: >-
  Từ đầu thế kỷ XX, một sự phân chia nền tảng đã tách biệt những người xã hội chủ nghĩa cách mạng, những người phản đối quyền sở hữu và tìm cách phá hủy xã hội tư bản bằng bạo lực hoặc chuyên chính vô sản, với những người xã hội chủ nghĩa cải cách, những người theo đuổi công bằng xã hội thông qua bầu cử dân chủ và thuế khóa trong khi tạm thời chấp nhận chủ nghĩa tư bản. Sự chia rẽ này đã định hình toàn bộ lịch sử sau đó của các phong trào xã hội chủ nghĩa.
