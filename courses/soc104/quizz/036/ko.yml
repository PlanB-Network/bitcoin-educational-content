question: "프랑스의 libertaires(사회주의적 아나키스트)는 사유 재산에 대해 무엇을 믿나요?"
answer: "사유 재산과 자본주의는 억압의 원천이므로 폐지되어야 합니다"
wrong_answers:
  - "사유 재산은 국가에 선행하는 자연권이며 어떤 대가를 치르더라도 보호되어야 합니다"
  - "사유 재산은 국가가 규제해야 하지만 사회에서 완전히 제거되어서는 안 됩니다"
  - "사유 재산은 코뮌의 모든 구성원에게 평등하게 분배될 때에만 허용됩니다"
explanation: >-
  Proudhon과 Bakunin 같은 사상가들을 통해 사회주의적 아나키즘을 계승한 프랑스의 libertaires는 국가와 사유 재산 모두가 억압의 쌍둥이 원천으로서 폐지되어야 한다고 봅니다. 이는 Proudhon의 유명한 공식 "재산은 도둑질이다"에 담겨 있습니다. 첫 번째 오답은 리버테리언의 입장을 설명하며, 이는 libertaire 관점과 근본적으로 대립합니다.
reviewed: false
