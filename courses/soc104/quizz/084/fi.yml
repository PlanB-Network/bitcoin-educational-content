question: "Millä on konservatiivisessa poliittisessa filosofiassa etusija vapauteen nähden?"
answer: "Järjestys ja perinne, jotka on vakiinnutettava lujasti ennen kuin vapautta voidaan arvostaa"
wrong_answers:
  - "Sosiaalinen oikeudenmukaisuus ja tasa-arvo, jotka on taattava ennen kuin yksilöt voivat olla todella vapaita"
  - "Taloudellinen tehokkuus ja pragmaattiset tulokset, jotka määrittävät, milloin vapaus on sopivaa"
  - "Yksilölliset omistusoikeudet, jotka on suojattava ennen kuin mitään muuta vapautta myönnetään"
explanation: >-
  Konservatiiveille järjestys ja perinne ovat etusijalla vapauteen nähden. He väittävät, että liiallinen vapaus synnyttää kaaosta ja yhteiskunnallista epäjärjestystä, joten vapautta voidaan arvostaa vasta, kun järjestys on vakiinnutettu lujasti. Tämä eroaa sosialistisesta näkemyksestä, joka asettaa oikeudenmukaisuuden etusijalle, tai sentristisestä tehokkuuden painotuksesta.
