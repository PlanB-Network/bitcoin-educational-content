question: "Hur ser libertarianer på förhållandet mellan privat egendom och frihet?"
answer: "Privat egendom är en naturlig rätt som föregår lagen och staten, och är själva grunden för frihet"
wrong_answers:
  - "Privat egendom är en social konvention skapad av staten som kan upphävas när den orsakar ojämlikhet"
  - "Privat egendom är användbar för ekonomisk effektivitet men har ingen inneboende moralisk eller filosofisk betydelse"
  - "Privat egendom bör endast finnas för personliga ägodelar, inte för produktiva tillgångar eller mark"
explanation: >-
  Libertarianer försvarar privat egendom som en naturlig rätt som föregår lagen och staten. De hävdar att om en individ äger sin egen kropp, äger individen också sitt arbete och frukterna av det. Ägandet av materiella varor är en förlängning av självägande. Detta står i skarp kontrast till den libertära synen att egendom är en social konvention eller en källa till förtryck.
reviewed: false
