question: "綜合本課程的完整論證，Bitcoin 如何同時體現自由意志主義對建構主義的批判、Cypherpunk 對行動的承諾，以及個人主義對道德自主的捍衛？"
answer: "Bitcoin 以自發的市場秩序取代中央計畫的貨幣（反建構主義），把金融自由的抽象理想轉化為可運作的程式碼（Cypherpunk 行動），並將主權財產與隱私歸還給個人（道德自主）"
wrong_answers:
  - "Bitcoin 使用民主治理來設定貨幣政策（反建構主義）、發布有關金融自由的教育內容（Cypherpunk 行動），並允許個人對協議變更投票（道德自主）"
  - "Bitcoin 消除所有金融監管（反建構主義）、創造一個遊說放鬆監管的開發者社群（Cypherpunk 行動），並讓富裕個人在貨幣政策上擁有更多控制權（道德自主）"
  - "Bitcoin 將伺服器基礎設施去中心化到多個國家（反建構主義）、使用開源授權自由分享技術（Cypherpunk 行動），並為政治異議提供匿名社群媒體平台（道德自主）"
explanation: >-
  Bitcoin 位於本課程探討的三種思想傳統交會處。它透過以自發、去中心化且沒有中央計畫者能夠控制的貨幣秩序，取代中央計畫的法定貨幣，體現了反建構主義論證。它透過把金融自由與隱私的抽象理想轉化為可運作的技術，履行了 Cypherpunk 寫程式碼的命令。它也透過使主權財產成為可能、保護勞動成果並維護隱私，讓每個人成為自己生命的主人，從而服務於個人主義對道德自主的捍衛。
reviewed: false
