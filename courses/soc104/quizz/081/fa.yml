question: "چرا پیش‌بینی مولیناری در سال ۱۸۴۹ دربارهٔ رابطهٔ میان آزادی و قدرت سیاسی پیامبرانه از کار درآمد؟"
answer: "زیرا محافظه‌کاران و سوسیالیست‌ها به‌نوبت به قدرت رسیده‌اند و آزادی را دقیقاً همان‌طور که او توصیف کرد، در خدمت اهداف سیاسی مربوط به خود ابزارسازی کرده‌اند"
wrong_answers:
  - "زیرا شخصیت اقتصاددانی که او توصیف کرد سرانجام به قدرت سیاسی رسید و سیاست‌های لیبرتارین را در سراسر اروپا اجرا کرد"
  - "زیرا پیش‌بینی او مبنی بر اینکه هر سه خانوادهٔ سیاسی در یک جنبش میانه‌روی واحد ادغام می‌شوند، در قرن بیستم محقق شد"
  - "زیرا آزادی به‌تدریج توسط دولت‌های پیاپی گسترش یافت تا آنکه به اصل سازمان‌دهندهٔ اصلی دموکراسی‌های مدرن تبدیل شد"
explanation: >-
  چشم‌انداز مولیناری پیامبرانه از کار درآمد، زیرا از میانهٔ قرن نوزدهم، محافظه‌کاران و سوسیالیست‌ها به‌نوبت به قدرت رسیده‌اند و دقیقاً همان کاری را انجام داده‌اند که او توصیف کرده بود: ابزارسازی آزادی در خدمت اهداف سیاسی. هر دو خانواده حاضرند آزادی‌ها را محدود کنند و از دولت بخواهند برنامه‌های مربوط به خود را تحمیل کند، در حالی که موضع اقتصاددان دربارهٔ آزادی بی‌قیدوشرط در حاشیه باقی ماند.
reviewed: false
