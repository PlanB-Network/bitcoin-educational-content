question: "Какво идентифицира курсът като истинското политическо разделение отвъд традиционния спектър ляво-дясно-център?"
answer: "Разделението между фундаментални философски принципи: свобода или принуда, доброволно съгласие или принуждение, отговорният индивид или колективът"
wrong_answers:
  - "Разделението между богати и бедни държави относно контрола върху международните търговски споразумения и глобалните финансови институции"
  - "Разделението между градско и селско население относно приоритетите на правителствените разходи и инфраструктурните инвестиции"
  - "Разделението между прогресивни и традиционни култури относно социалните норми, семейните ценности и религиозното образование"
explanation: >-
  Курсът твърди, че истинското политическо разделение не се намира в традиционните етикети ляво-дясно-център, а във фундаментални философски принципи: свобода или принуда, доброволно съгласие или принуждение, отговорният индивид или колективът. Правилният начин да се мисли за политика е да се започне от етични принципи, а не от етикети.
reviewed: false
