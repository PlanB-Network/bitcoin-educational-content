question: Phương pháp chuẩn để khôi phục ví của bạn là gì?
answer: Nhập cụm từ khóa của bạn vào bất kỳ phần mềm ví nào.
wrong_answers:
  - Lưu cụm từ khóa của bạn trong một tệp số.
  - Viết cụm từ khóa của bạn lên bảng trắng.
  - Chia sẻ cụm từ khóa của bạn với một người bạn đáng tin cậy.
explanation:
  Phương pháp chuẩn để sao lưu khóa riêng trong một ví Bitcoin là bằng cách nhập cụm từ khóa của bạn vào bất kỳ phần mềm ví nào. Điều này cho phép bạn khôi phục ví của mình.