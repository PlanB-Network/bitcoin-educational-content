bio: |
  A studiat Inginerie Fizică la The Hague University for Applied Sciences. În prezent lucrează ca Asistent de Cercetare în Fizică la SRON. Interesat de banii digitali suverani și descentralizați (de ex. bitcoin) ca o treaptă către o civilizație a abundenței, în care guvernele orwelliene și moneda fiat controlată corporatist devin depășite. Operator de nod Bitcoin și Lightning Network.

short_bio: Cercetător spațial și operator de nod Bitcoin/Lightning.
