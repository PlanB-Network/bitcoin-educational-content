question: Quel est le but de ce cours ?
answer: Comprendre la relation entre les idées et les événements pour mieux agir aujourd'hui
wrong_answers:
  - Étudier les événements historiques qui ont marqué la lutte pour la liberté.
  - Mémoriser les dates clés des révolutions politiques à travers l'histoire.
  - Définir les concepts philosophiques liés à la liberté.
explanation: |
  L'objectif central de ce cours est de comprendre la relation entre les idées et les événements afin de mieux juger notre époque et agir avec discernement, comme cela est énoncé dès le premier chapitre.
