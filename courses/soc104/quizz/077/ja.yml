question: "リバタリアンの自由概念は、中道主義の自由概念とどのように異なるか？"
answer: "リバタリアンは自由を無条件の公理として扱う一方、中道主義者は文脈と効率性に応じて機会主義的に自由を擁護する"
wrong_answers:
  - "リバタリアンは国家が自由を選択的に保護することを認める一方、中道主義者は個人の権利を保護するための国家関与を一切拒否する"
  - "リバタリアンは自由を経済問題だけに集中させる一方、中道主義者は社会的・文化的領域全体に広く自由を適用する"
  - "リバタリアンと中道主義者は自由について同じ見方を共有しているが、それを執行するのに必要な政府の規模について意見が異なる"
explanation: >-
  リバタリアンは、自由を公理として機能する一般的で無条件の原理として定義する。対照的に、中道主義者は、一般原理を適用することなく、機会主義的かつ文脈依存的な方法で特定の自由を擁護する。中道主義のアプローチは、効率性のような実用的目標に常に従属する、自由の道具的概念を明らかにしており、リバタリアンはこれを根本的に拒否する。
reviewed: false
