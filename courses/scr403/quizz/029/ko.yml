question: Simplicity는 무제한 재귀를 제외합니다. 무제한 반복을 위한 의도된 대체물은 무엇인가요?
answer: 계산을 여러 트랜잭션에 나누어 각 트랜잭션의 비용을 예측 가능하게 유지하는 재귀적 커버넌트입니다.
wrong_answers:
  - 단일 트랜잭션 안에서 계량된 형태의 무제한 재귀를 제공하도록 특별히 설계된 delegation 기능입니다.
  - 고정점 구성을 통해 임의의 재귀 함수를 인코딩할 수 있게 하는, 완전성을 가진 아홉 핵심 컴비네이터입니다.
  - 정적 분석이 최대 반복 횟수를 추론하고 본문을 복제하는 컴파일 시점 loop unrolling입니다.
explanation: >-
  글의 논지는 무제한 반복이 여러 트랜잭션에 걸쳐 계산하는 재귀적 커버넌트로 구현되는 것이 더 낫다는 것입니다.
  이는 블록 공간과 standardness 제약을 피하고 트랜잭션 비용을 예측 가능하게 합니다.
  Delegation은 무제한 재귀와 비슷한 것을 만들어 내도록 남용될 수 있을 뿐이며,
  의도된 메커니즘이 아닙니다. 또한 아홉 핵심 컴비네이터는 유한 계산에 대해서만 완전하므로,
  단일 프로그램 안에는 고정점 구성이 존재하지 않습니다.
reviewed: false
