question: "Welches gemeinsame politische Ziel haben linke und rechte Etatisten?"
answer: "Macht zu gewinnen, um die Gesellschaft gemäß ihrer Weltsicht zu organisieren und sie allen aufzuzwingen"
wrong_answers:
  - "Den Umfang der Regierung zu verringern und die Entscheidungsgewalt an die einzelnen Bürger zurückzugeben"
  - "Eine direkte Demokratie einzurichten, in der jeder Bürger über jede legislative Entscheidung abstimmt"
  - "Politische Parteien abzuschaffen und sie durch unabhängige technokratische Regierungsführung zu ersetzen"
explanation: >-
  Linke wie rechte Etatisten teilen dasselbe politische Ziel: Macht zu gewinnen, um die Gesellschaft gemäß ihrer Weltsicht zu organisieren und sie allen durch Gesetzgebung aufzuzwingen. Der Unterschied liegt nur in ihren Werten: Die Rechte beruft sich auf die Verteidigung der Zivilisation, während die Linke sich auf die Verteidigung der Arbeiterklasse oder der Unterdrückten beruft. Keine von beiden will die Regierung verkleinern oder Parteien abschaffen.
