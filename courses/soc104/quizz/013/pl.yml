question: "Co obejmuje kategoria wolności gospodarczej?"
answer: "To, co robisz jako producent i konsument: kupowanie, sprzedawanie, produkowanie, praca, zatrudnianie i zarządzanie swoimi pieniędzmi"
wrong_answers:
  - "Twoje przekonania religijne, relacje osobiste i wolność wypowiedzi"
  - "Twoje prawo do głosowania, uczestnictwa w wyborach i wstępowania do partii politycznych"
  - "Twoją możliwość swobodnego podróżowania, wyboru miejsca zamieszkania i przekraczania granic państwowych"
explanation: >-
  Wolność gospodarcza obejmuje to, co robisz jako producent i konsument: co możesz kupować, sprzedawać albo produkować; gdzie pracujesz; kogo zatrudniasz; i co robisz ze swoimi pieniędzmi. Relacje osobiste, przekonania religijne i swoboda przemieszczania się należą do kategorii wolności osobistej, a nie gospodarczej.
