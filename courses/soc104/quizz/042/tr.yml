question: "Sosyalist felsefe bağlamında 'holism' terimi ne anlama gelir?"
answer: "Kolektifin birey üzerinde öncelik kazandığı, toplumun bölünmez bir bütün olarak görüldüğü bir vizyon"
wrong_answers:
  - "Her bireyi, hakları herhangi bir grup tarafından geçersiz kılınamayacak kendi içine kapalı bir birim olarak ele alan bir felsefe"
  - "Kamusal ve özel sektörleri eşit ölçüde dengelemeyi savunan bir ekonomik teori"
  - "Tüm azınlık bakış açılarını tek bir uzlaşı temelli platforma entegre eden bir siyasi strateji"
explanation: >-
  Holism, 'bütün' anlamına gelen Yunanca 'holos'tan gelir. Sosyalist düşüncede, toplumun bireylerin basit bir toplamı olmaktan ziyade bölünmez bir bütün olarak görülmesini ifade eder. Sosyalist devlet, insan faaliyetini azami ölçüde üstlenmeyi ve yönlendirmeyi amaçlar. Bu kolektif bir sosyal sınıf, bir ulus, bir ırk veya bir toplumsal cinsiyet olarak temsil edilebilir; ancak her durumda birey, grup aidiyetiyle tanımlanır.
