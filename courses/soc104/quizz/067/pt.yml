question: "Como as abordagens econômicas da Alemanha de Hitler e da União Soviética de Stalin diferiam, apesar de seus métodos totalitários compartilhados?"
answer: "A Alemanha nazista manteve uma aparência de propriedade privada enquanto subordinava o setor privado aos objetivos do Estado, ao passo que o stalinismo aboliu toda propriedade privada e planejou integralmente a economia"
wrong_answers:
  - "A Alemanha nazista nacionalizou integralmente todas as indústrias, ao passo que o regime de Stalin permitiu iniciativa privada limitada na agricultura"
  - "A Alemanha nazista promoveu o livre comércio internacional para financiar o rearmamento, ao passo que o stalinismo impôs isolamento econômico completo"
  - "A Alemanha nazista dependia da cooperação corporativa voluntária com o Estado, ao passo que o stalinismo usava apenas trabalho forçado"
explanation: >-
  Embora ambos os regimes usassem métodos políticos idênticos (culto à personalidade, vigilância total, eliminação sistemática da oposição), seus modelos econômicos diferiam na forma. A Alemanha nazista não aboliu formalmente a propriedade privada, mas subordinou completamente o setor privado a objetivos do Estado como guerra e rearmamento, impondo autarquia econômica. O stalinismo foi além ao abolir toda propriedade privada, implementar planos quinquenais e controlar diretamente toda a produção e distribuição.
