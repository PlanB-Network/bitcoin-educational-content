question: Boisguilbert සහ Physiocrats අතර අතුරුදන් සම්බන්ධය නියෝජනය කරන පුද්ගලයා කවුද?
answer: Vincent de Gournay
wrong_answers:
  - Voltaire
  - Turgot
  - Colbert
explanation: |
  Vincent de Gournay Boisguilbert සහ Physiocrats දෙපාර්ශවයටම බලපෑම් කළ අතර, ලිබරල් අදහස් පැතිරවූ සහ ආර්ථිකයට රාජ්‍යයේ අධික මැදිහත්වීම විවේචනය කළේය.