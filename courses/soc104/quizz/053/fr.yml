question: "Quelle est la différence clé entre les minarchistes et les anarcho-capitalistes au sein du libertarianisme ?"
answer: "Les minarchistes acceptent un État minimal pour la défense, la justice et la police, tandis que les anarcho-capitalistes veulent que toutes les fonctions de l'État soient privatisées"
wrong_answers:
  - "Les minarchistes rejettent toute forme de gouvernement, tandis que les anarcho-capitalistes acceptent une réglementation limitée des marchés par l'État"
  - "Les minarchistes favorisent une fiscalité progressive pour les services essentiels, tandis que les anarcho-capitalistes s'opposent à toute fiscalité"
  - "Les minarchistes se concentrent uniquement sur la liberté économique, tandis que les anarcho-capitalistes défendent à la fois les libertés économiques et sociétales"
explanation: >-
  Les minarchistes estiment que l'État devrait être limité à des fonctions essentielles telles que la défense, la justice et la police (l'« État veilleur de nuit »), tandis que les anarcho-capitalistes soutiennent que même ces fonctions devraient être privatisées et gérées par une concurrence volontaire de marché. Leur désaccord porte davantage sur la mise en œuvre pratique que sur les principes éthiques fondamentaux. Les deux tendances partagent les mêmes valeurs libertariennes de propriété de soi et de non-agression.
