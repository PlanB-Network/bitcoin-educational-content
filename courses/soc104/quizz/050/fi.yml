question: "Miksi klassiset liberaalit Yhdysvalloissa alkoivat kutsua itseään 'libertaareiksi' 1900-luvulla?"
answer: "Koska amerikkalainen 'liberalismi' oli omittu kasvavan valtiollisen interventionismin ja hyvinvointivaltion käyttöön"
wrong_answers:
  - "Koska he halusivat ottaa etäisyyttä eurooppalaisiin monarkistisiin perinteisiin"
  - "Koska termi 'liberaali' alettiin yhdistää anarkismiin ja poliittiseen väkivaltaan"
  - "Koska uudet kauppasopimukset edellyttivät vapaiden markkinoiden kannattajille erillistä poliittista identiteettiä"
explanation: >-
  1900-luvulla tapahtui perustavanlaatuinen muutos, kun laissez-faire-periaatteista luovuttiin asteittain hyvinvointivaltion hyväksi. Amerikkalainen "liberalismi" alkoi merkitä jotakin hyvin erilaista kuin klassinen liberalismi, omaksuen valtiollisen interventionismin. Klassiset liberaalit ottivat käyttöön termin "libertaari" säilyttääkseen eron. Tällä uudelleenbrändäyksellä ei ollut mitään tekemistä eurooppalaisen monarkismin, anarkistisen väkivallan tai kauppasopimusten kanssa.
