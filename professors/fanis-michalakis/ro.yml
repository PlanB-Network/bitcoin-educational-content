bio: |
  Am căzut în gaura de iepure a Bitcoin în 2017. Bitcoin mă fascinează. Este o tehnologie inovatoare și foarte complexă, dar plină de promisiuni. Sunt un bitcoiner pasionat care a decis să își dedice timpul educației despre Bitcoin! Sunt creatorul cursului LN 201 și lucrez la LN Markets.

short_bio: Vrăjitorul LN
