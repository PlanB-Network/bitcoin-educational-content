question: "Hva er ikke-aggresjonsprinsippet slik det er teoretisert av Murray Rothbard?"
answer: "Det er illegitimt å initiere fysisk makt mot et annet individ eller deres eiendom, selv om defensiv vold er tillatt"
wrong_answers:
  - "Alle former for vold er alltid gale, inkludert selvforsvar og motstand mot undertrykkelse"
  - "Vold er akseptabel når den rettes mot undertrykkende institusjoner, men aldri mot andre individer"
  - "Staten alene har den legitime retten til å bruke makt, og individer må aldri ty til vold"
explanation: >-
  Rothbards ikke-aggresjonsprinsipp hevder at det å initiere fysisk makt mot en annen person eller deres eiendom er illegitimt. Det er en filosofisk oversettelse av den gylne regel. Det forbyr imidlertid ikke all vold: defensiv vold, inkludert selvforsvar og motstand mot undertrykkelse, regnes som legitim. Dette skiller det fra ren pasifisme og fra statens påståtte monopol på makt.
reviewed: false
