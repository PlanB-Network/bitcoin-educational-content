question: "Welche innere Spannung besteht unter Libertären im Nolan-Diagramm?"
answer: "Einige wollen den Staat vollständig abschaffen (Anarchokapitalisten), während andere einen Minimalstaat bevorzugen, der zentrale Souveränitätsfunktionen beibehält (Minarchisten)"
wrong_answers:
  - "Einige wollen starke Wirtschaftsregulierung, während andere eine vollständige Deregulierung aller Branchen bevorzugen"
  - "Einige unterstützen demokratische Wahlen, während andere ein erbliches Regierungssystem bevorzugen"
  - "Einige setzen sich für progressive Sozialpolitik ein, während andere strikt traditionelle moralische Werte verteidigen"
explanation: >-
  Innerhalb der libertären Familie gibt es eine grundlegende Uneinigkeit über die Rolle des Staates. Anarchokapitalisten wollen alle staatlichen Funktionen durch private Dienste ersetzen, während Minarchisten einen Minimalstaat akzeptieren, der zentrale Souveränitätsfunktionen wie Verteidigung und Gerichte beibehält. Beide Gruppen teilen den libertären Gipfel, unterscheiden sich aber darin, ob überhaupt irgendein Staat existieren sollte.
reviewed: false
