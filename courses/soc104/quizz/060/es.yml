question: "¿Cuál es la distinción importante entre ser pro-empresa y ser pro-mercado?"
answer: "Ser pro-empresa significa favorecer una alianza entre grandes empresas y el Estado, mientras que ser pro-mercado significa apoyar la libre competencia sin favoritismo estatal"
wrong_answers:
  - "Ser pro-empresa significa apoyar a las pequeñas empresas, mientras que ser pro-mercado significa apoyar a las corporaciones multinacionales"
  - "Ser pro-empresa significa oponerse por completo a la regulación, mientras que ser pro-mercado significa aceptar una regulación moderada"
  - "Ser pro-empresa se centra en la industria nacional, mientras que ser pro-mercado se centra en el comercio internacional"
explanation: >-
  Los centristas tienden a ser pro-empresa, lo que significa que favorecen una especie de alianza entre las grandes empresas y el Estado, algo distinto de ser pro-mercado. Ser pro-mercado apoya la libre competencia sin favoritismo estatal ni proteccionismo corporativo. Esta distinción es crucial porque las políticas pro-empresa pueden crear monopolios y protecciones regulatorias que en realidad socavan la competencia de libre mercado.
