question: "Missä Vihreät sijaitsevat Nolanin kaaviossa ja miksi?"
answer: "Hyvin alhaalla kaaviossa, koska heidän mielestään yksilön etu ei saa mennä planeetan kollektiivisen edun edelle"
wrong_answers:
  - "Kaavion huipulla, koska he asettavat henkilökohtaisen vapauden ja ympäristötietoisuuden yhtä tärkeiksi"
  - "Kaavion keskellä, koska he tasapainottavat talouskasvua ympäristönsuojelun kanssa"
  - "Äärioikealla, koska he kannattavat markkinapohjaisia ratkaisuja ympäristöhaasteisiin"
explanation: >-
  Vihreät sijaitsevat hyvin alhaalla Nolanin kaaviossa, koska he kannattavat vahvaa valtion kontrollia sekä taloudellisissa että henkilökohtaisissa päätöksissä planeetan hyvinvoinnin nimissä. He ovat korvanneet marxilaisen luokkataistelun ihmisen ja luonnon välisellä taistelulla ja taipuvat puolustamaan taloudellista kontrollia ja jopa yksityisomistuksen poistamista. Tämä sijoittaa heidät autoritaariseen sektoriin, ei huipulle tai keskelle.
