question: "How many endpoints are involved in the API workflow for sending Taproot Assets?"
answer: "Three endpoints"
wrong_answers:
  - "One endpoint that handles everything in a single request"
  - "Two endpoints: one for address generation and one for sending"
  - "Five endpoints covering verification, address creation, signing, sending, and confirmation"
explanation: >-
  The API workflow for sending Taproot Assets uses three endpoints: a GET endpoint to verify available assets, a POST endpoint to generate a receiving address, and a POST endpoint to execute the transfer. This three-step process mirrors the CLI workflow but through HTTP requests.
