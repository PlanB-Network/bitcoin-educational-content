description: |
  „zk“ u zkSNACKs označava zero knowledge, što znači da ne prikupljamo niti možemo prikupljati bilo kakve lične informacije korisnika u našim proizvodima.

  zkSNACKs je ugasio svoj coinjoin koordinator 1. juna 2024, a njegov veb-sajt je van mreže. Wasabi Wallet nastavlja da postoji kao softver otvorenog koda.