question: "Как социализмът третира свободите различно в обществената и икономическата сфера?"
answer: "Социализмът предпочита силни свободи в обществената сфера, но слаби свободи в икономическата сфера"
wrong_answers:
  - "Социализмът ограничава всички свободи еднакво както в обществената, така и в икономическата сфера"
  - "Социализмът предпочита силни икономически свободи, но ограничава обществените свободи, за да поддържа социален ред"
  - "Социализмът предоставя неограничени свободи и в двете сфери и разчита на доброволно сътрудничество, за да поддържа баланс"
explanation: >-
  В социалистическата мисъл има фундаментална дихотомия между обществените и икономическите свободи. Обществените свободи са силни, но икономическите свободи са слаби поради акцента върху държавния контрол, планирането и преразпределението на богатството. Третият грешен отговор описва либертарианския идеал, докато вторият описва консервативния модел, който е огледален образ на социализма.
reviewed: false
