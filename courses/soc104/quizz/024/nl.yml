question: "Wat is paleo-libertarisme?"
answer: "Een synthese die de afwijzing van de staat als bron van dwang combineert met een versterking van traditionele instellingen en vrijwillige sociale structuren"
wrong_answers:
  - "Een libertaire beweging die alle traditionele waarden afwijst en radicaal sociaal progressivisme bevordert"
  - "Een conservatieve ideologie die staatsmacht gebruikt om traditionele waarden af te dwingen, terwijl ze enige economische vrijheid toestaat"
  - "Een centristische filosofie die een evenwichtig compromis zoekt tussen socialistische economie en conservatief sociaal beleid"
explanation: >-
  Paleo-libertarisme combineert de afwijzing van de staat als institutionele bron van dwang met een versterking van traditionele instellingen en een voorkeur voor vrijwillige sociale structuren boven staatsgezag. Het onderscheidt zich van neo-libertarisme doordat het sympathieker staat tegenover traditionele waarden. De paleo-libertariër verzet zich niet tegen gemeenschappen die zich rond socialistische of communitaristische principes organiseren; hij weigert alleen dat zulke gemeenschappen hun waarden via de kracht van de wet aan iedereen opleggen.
