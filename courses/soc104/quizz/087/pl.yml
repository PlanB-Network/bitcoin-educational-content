question: "W jaki sposób trzy zasadnicze funkcje wolnego rynku, opisane przez libertarian, razem tworzą zarazem efektywny i etyczny system organizacji społecznej?"
answer: "Ceny dostarczają kompasu dla decyzji, rynek ujawnia autentyczne preferencje poprzez podaż i popyt, a wolna wymiana pozwala jednostkom określać własne sprawy zgodnie z osobistymi wartościami, łącząc efektywność informacyjną z autonomią moralną"
wrong_answers:
  - "Rynek maksymalizuje całkowite bogactwo, zapobiega monopolom przez naturalną konkurencję i zapewnia równą dystrybucję zasobów, łącząc produktywność ze sprawiedliwością społeczną"
  - "Wolne rynki ograniczają wydatki rządowe, pobudzają innowacje technologiczne i tworzą możliwości zatrudnienia, łącząc odpowiedzialność fiskalną ze wzrostem gospodarczym"
  - "Rynki obniżają ceny konsumenckie, zwiększają jakość produktów przez konkurencję i rozszerzają handel międzynarodowy, łącząc krajowy dobrobyt z globalną współpracą"
explanation: >-
  Libertariańska obrona wolnego rynku opiera się na trzech połączonych funkcjach. Po pierwsze, ceny służą jako wiarygodne wskaźniki kierujące decyzjami gospodarczymi i społecznymi (kompas). Po drugie, rynek ujawnia autentyczne indywidualne preferencje poprzez podaż i popyt. Po trzecie, wolna wymiana pozwala aktorom określać własne sprawy zgodnie z osobistymi wartościami. Hayek pokazał, że wolne rynki koordynują rozproszone informacje lepiej niż centralne planowanie (efektywność), podczas gdy wzajemna zgoda szanuje ludzką godność bardziej niż przymus (sprawiedliwość).
reviewed: false
