question: "Mihin poliittisen järjestelmän rakenteellinen määritelmä keskittyy?"
answer: "Siihen, miten järjestelmä tosiasiallisesti toimii ja millaisia havaittavia ominaisuuksia sillä on, kuten valtion kontrollin asteeseen"
wrong_answers:
  - "Järjestelmän perustajien ja johtajien ilmoittamiin tavoitteisiin ja jaloihin aikomuksiin"
  - "Poliittisen liikkeen historialliseen alkuperään ja sen keskeisten ajattelijoiden elämäkertoihin"
  - "Sallittujen poliittisten puolueiden määrään ja järjestettyjen demokraattisten vaalien tiheyteen"
explanation: >-
  Rakenteelliset määritelmät keskittyvät siihen, miten poliittiset järjestelmät tosiasiallisesti toimivat, ja niiden havaittaviin ominaisuuksiin. Esimerkiksi sosialismia luonnehtii rakenteellisesti valtion kaikkialla läsnäolo. Tämä lähestymistapa eroaa intentionaalisista määritelmistä, jotka perustuvat ilmoitettuihin motiiveihin ja tavoitteisiin. Rakenteellinen lähestymistapa mahdollistaa objektiivisemman arvioinnin mitattavien tulosten perusteella.
