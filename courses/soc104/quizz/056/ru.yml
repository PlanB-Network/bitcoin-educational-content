question: "В чём ключевое различие между минархистами и анархо-капиталистами внутри либертарианства?"
answer: "Минархисты принимают минимальное государство для обороны, правосудия и полиции, тогда как анархо-капиталисты хотят приватизировать все функции государства"
wrong_answers:
  - "Минархисты отвергают любые формы государства, тогда как анархо-капиталисты принимают ограниченное государственное регулирование рынков"
  - "Минархисты поддерживают прогрессивное налогообложение для основных услуг, тогда как анархо-капиталисты выступают против любого налогообложения"
  - "Минархисты сосредоточены только на экономической свободе, тогда как анархо-капиталисты защищают как экономические, так и общественные свободы"
explanation: >-
  Минархисты считают, что государство должно быть ограничено базовыми функциями, такими как оборона, правосудие и полиция («государство — ночной сторож»), тогда как анархо-капиталисты утверждают, что даже эти функции должны быть приватизированы и управляться через добровольную рыночную конкуренцию. Их разногласие касается скорее практической реализации, чем фундаментальных этических принципов. Обе тенденции разделяют одни и те же либертарианские ценности самовладения и ненападения.
