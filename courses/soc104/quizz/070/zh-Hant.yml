question: "在五項社會辯論（婚姻、移民、槍械、毒品、含糖飲料）中，哪一種反覆出現的分析框架塑造了社會主義者在每個議題上的立場？"
answer: "支配者與被支配者之間的衝突框架，其中社會被壓迫所結構化，而國家必須介入以保護脆弱群體"
wrong_answers:
  - "一種功利主義框架，著重於為最大多數公民最大化整體幸福與經濟生產力"
  - "一種自然權利框架，其中個人自由必須免受國家與企業干預"
  - "一種傳統主義框架，其中既有社會制度必須被保存，以抵禦破壞性的現代變化"
explanation: >-
  社會主義者在社會辯論中的立場，始終由支配／被支配的衝突框架所塑造。在婚姻問題上，是異性戀多數壓迫同性戀少數。在移民問題上，基於國籍的限制是壓迫形式。在槍械問題上，只有國家應該持有武力，以保護脆弱者。在含糖飲料問題上，工業家從最少受保護者的脆弱性中獲利。這種壓迫者／被壓迫者的視角，在包括性別、種族，甚至人類與自然之間關係在內的眾多領域中被重製。
reviewed: false
