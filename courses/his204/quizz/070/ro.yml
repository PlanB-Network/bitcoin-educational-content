question: Potrivit lui Schumpeter, ce l-a caracterizat pe Dupont de Nemours de-a lungul carierei sale?
answer: A rămas fidel fiziocrației, în ciuda numeroaselor ocazii de a renunța la ea
wrong_answers:
  - Și-a adaptat constant ideile pentru a rămâne pe placul celor aflați la putere
  - A abandonat treptat fiziocrația în favoarea teoriilor lui Adam Smith
  - I-a lipsit recunoașterea din partea colegilor săi de-a lungul întregii vieți
explanation: |
  Schumpeter a scris că Dupont de Nemours „a rămas fidel fiziocrației de-a lungul unei cariere în care a avut numeroase ocazii de a renunța la ea”. A fost un om cu convingeri, care nu și-a renegat niciodată credințele, nici chiar atunci când acest lucru ar fi fost avantajos din punct de vedere politic.
