question: "Hvilket skjult paradoks ligger i sentristisk pragmatisme?"
answer: "Pragmatismen selv hviler på en form for dogmatisme, nemlig den uuttrykte overbevisningen om at bare eksperter er kompetente til å styre samfunnet"
wrong_answers:
  - "Sentrister hevder å være moderate, men allierer seg konsekvent med venstreorienterte partier i koalisjonsregjeringer"
  - "Sentristisk politikk virker balansert, men favoriserer alltid økonomisk vekst fremfor miljøvern"
  - "Sentrister avviser ideologi, men adopterer rigide frimarkedsprinsipper når de tar økonomiske beslutninger"
explanation: >-
  Paradokset ved sentristisk pragmatisme er at den hevder å avvise ideologi til fordel for rasjonell ekspertise, men at nettopp denne påstanden hviler på et usynlig og uuttrykt dogme: at bare teknokrater er i stand til å ta de riktige beslutningene. Denne overbevisningen om at eksperter alene bør styre samfunnet, er i seg selv en ideologisk forpliktelse, selv om sentrister ikke erkjenner den som sådan.
reviewed: false
