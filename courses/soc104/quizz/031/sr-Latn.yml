question: "Šta francuski libertaires (socijalistički anarhisti) veruju o privatnoj svojini?"
answer: "Privatna svojina i kapitalizam moraju biti ukinuti jer su izvori ugnjetavanja"
wrong_answers:
  - "Privatna svojina je prirodno pravo koje prethodi državi i mora biti zaštićena po svaku cenu"
  - "Privatnu svojinu država treba da reguliše, ali je nikada ne treba potpuno eliminisati iz društva"
  - "Privatna svojina je prihvatljiva samo kada je jednako raspodeljena među svim članovima komune"
explanation: >-
  Francuski libertaires, naslednici socijalističkog anarhizma preko mislilaca poput Proudhona i Bakunina, smatraju da i država i privatna svojina moraju biti ukinute kao blizanački izvori ugnjetavanja. To je sažeto u Proudhonovoj čuvenoj formuli „Svojina je krađa.” Prvi pogrešan odgovor opisuje libertarijansku poziciju, koja je fundamentalno suprotna libertaire gledištu.
