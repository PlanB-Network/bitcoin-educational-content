question: "Bitcoin چگونه به‌جای پروژه‌ای سیاسی با ادعاهای اخلاقی، به‌صورت پروژه‌ای اخلاقی با پیامدهای سیاسی عمل می‌کند؟"
answer: "Bitcoin برای آزاد کردن مردم طراحی شد نه ثروتمند کردن آن‌ها، با ممکن کردن مالکیت مؤثر، حفاظت از ارزش کار، و حفظ حریم خصوصی؛ این‌ها دستاوردهای اخلاقی‌اند که بدون ادعای تعلق به هیچ اردوگاه سیاسی، آثار سیاسی پدید می‌آورند"
wrong_answers:
  - "Bitcoin پروژه‌ای اخلاقی است زیرا کد آن قواعد اخلاقی‌ای را اعمال می‌کند که از تقلب جلوگیری می‌کنند، و پیامد سیاسی آن جایگزین کردن حکمرانی دموکراتیک با تصمیم‌گیری الگوریتمی است"
  - "Bitcoin به‌عنوان پروژه‌ای اخلاقی عمل می‌کند چون ثروت را از ثروتمندان به پذیرندگان اولیه بازتوزیع می‌کند و جامعه‌ای عادلانه‌تر با پیامدهای سیاسی برای سیاست مالیاتی می‌سازد"
  - "Bitcoin اخلاقی است زیرا Satoshi Nakamoto فرمان‌های اخلاقی را در پروتکل گنجاند، و پیامد سیاسی آن متحد کردن همه خانواده‌های سیاسی زیر یک نظام پولی مشترک است"
explanation: >-
  Bitcoin برای ثروتمند کردن مردم طراحی نشد، بلکه برای آزاد کردن آن‌ها طراحی شد. سه نتیجه اخلاقی به دست می‌آورد: ممکن کردن مالکیت مؤثر (تشویق مسئولیت‌پذیری)، حفاظت از ارزشی که با کار خلق می‌شود (تشویق تلاش مولد)، و حفظ حریم خصوصی (اجازه دادن به مردم برای زندگی بدون ترس). این‌ها دستاوردهای اخلاقی‌اند که بدون تعلق به هیچ اردوگاه سیاسی، پیامدهای سیاسی دارند؛ از همین رو Bitcoin نخست پروژه‌ای اخلاقی و سپس سیاسی است.
reviewed: false
