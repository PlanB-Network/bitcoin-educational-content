question: "보조금 논쟁의 맥락에서 '도덕적 해이' 개념은 무엇이며, 어느 정치 가족이 이 우려를 제기하나요?"
answer: "도덕적 해이는 보조금을 통해 기업이 실패하지 않도록 막을 때 무책임을 향한 유인이 생기는 것이며, 결국 납세자가 비용을 부담하기 때문입니다. 이 우려는 리버테리언들이 제기합니다"
wrong_answers:
  - "도덕적 해이는 보조금을 받은 기업이 더 낮은 세금을 가진 나라로 이전하면서 일자리도 함께 가져갈 위험이며, 이 우려는 보수주의자들이 제기합니다"
  - "도덕적 해이는 정부 관료들이 어떤 기업이 보조금을 받을지 선택하면서 부패하게 될 위험이며, 이 우려는 중도주의자들이 제기합니다"
  - "도덕적 해이는 기업이 공적 자금을 받은 뒤 노동자를 착취하는 윤리적 문제이며, 이 우려는 사회주의자들이 제기합니다"
explanation: >-
  리버테리언들은 보조금과 구제금융이 도덕적 해이를 만든다고 주장합니다. 기업이 실패하지 않도록 막으면, 잘못된 결정에 대한 결과가 없기 때문에 무책임과 무모함을 유인한다는 것입니다. 결국 비용을 부담하는 것은 납세자이며, 리버테리언들은 이를 깊이 부당하다고 봅니다. 이 개념은 다른 정치 가족들이 제기하는 기업 이전, 관료 부패, 노동자 착취에 대한 우려와 구별됩니다.
