question: "How does conservatism treat freedoms in the economic and societal spheres?"
answer: "Strong freedoms in the economic sphere but weak freedoms in the societal sphere"
wrong_answers:
  - "Weak freedoms in both the economic and societal spheres to maintain traditional social order"
  - "Strong freedoms in the societal sphere but weak freedoms in the economic sphere"
  - "Equal and unlimited freedoms in both spheres with minimal government intervention of any kind"
explanation: >-
  Conservatism exhibits a dichotomy that is the mirror image of socialism. In the economic domain, conservatives defend the free market, entrepreneurship, and private property. In the societal domain, restrictions are justified by the preservation of traditional moral norms and social stability. The third wrong answer describes the socialist pattern, which is the opposite.
reviewed: false
