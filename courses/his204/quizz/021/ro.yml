question: Care economist francez din secolul al XIX-lea a dedicat o carte abatelui de Saint-Pierre?
answer: Gustave de Molinari
wrong_answers:
  - Frédéric Bastiat
  - Jean-Baptiste Say
  - Léon Walras
explanation: |
  Gustave de Molinari, economist liberal din secolul al XIX-lea, a scris o carte despre abatele de Saint-Pierre, evidențiindu-i rolul de precursor al gândirii liberale și al apărării păcii.
