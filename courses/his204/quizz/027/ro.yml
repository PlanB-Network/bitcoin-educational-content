question: Care sunt principiile marchizului d'Argenson pe care Adam Smith le împărtășește?
answer: Diviziunea muncii și interesul personal
wrong_answers:
  - Laissez-faire și interesul personal
  - Laissez-faire și diviziunea muncii
  - Diviziunea muncii și protecționismul
explanation: |
  Marchizul d'Argenson a anticipat unele dintre ideile-cheie ale lui Adam Smith, precum diviziunea muncii și rolul interesului personal în funcționarea economiei. Smith a dezvoltat aceste idei într-un mod mai sistematic în "Avuția națiunilor".
