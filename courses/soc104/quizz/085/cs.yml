question: "Jak tři základní funkce volného trhu, jak je popisují libertariáni, společně tvoří efektivní i etický systém společenské organizace?"
answer: "Ceny poskytují kompas pro rozhodování, trh odhaluje autentické preference prostřednictvím nabídky a poptávky a svobodná směna umožňuje jednotlivcům určovat vlastní záležitosti podle osobních hodnot, čímž kombinuje informační efektivitu s morální autonomií"
wrong_answers:
  - "Trh maximalizuje celkové bohatství, brání monopolům prostřednictvím přirozené konkurence a zajišťuje rovné rozdělení zdrojů, čímž kombinuje produktivitu se sociální spravedlností"
  - "Volné trhy snižují vládní výdaje, stimulují technologické inovace a vytvářejí pracovní příležitosti, čímž kombinují fiskální odpovědnost s ekonomickým růstem"
  - "Trhy snižují spotřebitelské ceny, zvyšují kvalitu produktů prostřednictvím konkurence a rozšiřují mezinárodní obchod, čímž kombinují domácí prosperitu s globální spoluprací"
explanation: >-
  Libertariánská obhajoba volného trhu spočívá na třech propojených funkcích. Zaprvé, ceny slouží jako spolehlivé ukazatele vedoucí ekonomická a společenská rozhodnutí (kompas). Zadruhé, trh odhaluje autentické individuální preference prostřednictvím nabídky a poptávky. Zatřetí, svobodná směna umožňuje aktérům určovat vlastní záležitosti podle osobních hodnot. Hayek ukázal, že volné trhy koordinují rozptýlené informace lépe než centrální plánování (efektivita), zatímco vzájemný souhlas respektuje lidskou důstojnost více než donucení (spravedlnost).
reviewed: false
