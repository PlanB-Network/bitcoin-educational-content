question: "Kişisel özgürlük kategorisi neleri içerir?"
answer: "Özel ilişkilerinizde, görüşleriniz ve inançlarınızla yaptıklarınızı ve kendi bedeniniz ile zihninizi ilgilendiren her şeyi"
wrong_answers:
  - "Üretici olarak yaptıklarınızı; işletme kurmayı, çalışan işe almayı ve mal ticareti yapmayı"
  - "Ne kadar vergi ödediğinizi, hangi yatırımları yaptığınızı ve finansal varlıklarınızı nasıl yönettiğinizi"
  - "Piyasada rekabet etme, ürünlerinizin fiyatlarını belirleme ve tedarikçilerinizi seçme yeteneğinizi"
explanation: >-
  Kişisel özgürlük, özel ilişkilerinizde, görüşleriniz ve inançlarınızla yaptıklarınızı ve kendi bedeniniz ile zihninizi ilgilendiren her şeyi kapsar. Buna evlilik, okuma tercihleri, dini uygulamalar, yiyecek ve ilaç tercihleri ve kimlerle bir araya geldiğiniz dahildir. Ticari faaliyetler, vergiler ve piyasa kararları ekonomik özgürlük kapsamına girer.
