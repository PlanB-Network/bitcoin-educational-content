question: "Ce îi deosebește pe neoconservatori de paleoconservatori în abordarea lor față de politica externă?"
answer: "Neoconservatorii justifică intervenționismul militar pentru a răspândi democrația, în timp ce paleoconservatorii apără o politică externă mai izolaționistă"
wrong_answers:
  - "Neoconservatorii se opun oricărei acțiuni militare și favorizează diplomația, în timp ce paleoconservatorii susțin lovituri preventive împotriva amenințărilor potențiale"
  - "Neoconservatorii se concentrează exclusiv pe sancțiuni economice, în timp ce paleoconservatorii pledează pentru construirea de coaliții internaționale pentru operațiuni militare comune"
  - "Neoconservatorii și paleoconservatorii sunt de acord asupra politicii externe, dar diferă puternic în privința reglementării economice interne"
explanation: >-
  Începând cu anii 2000, neoconservatorii s-au implicat tot mai mult în justificarea intervenționismului militar pentru a implanta democrația în lume, în special după 11 septembrie 2001. Ca reacție, conservatorii tradiționali au revendicat eticheta de 'paleoconservator' pentru a se distinge. Paleoconservatorii critică intervenționismul militar, apără o politică externă mai izolaționistă și pun un accent mai mare pe identitatea națională și culturală.
reviewed: false
