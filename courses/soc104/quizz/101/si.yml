question: "traditional left-right-center spectrum එකෙන් එහා ගිය real political divide ලෙස course එක හඳුනාගන්නේ කුමක්ද?"
answer: "fundamental philosophical principles අතර divide එක: freedom හෝ coercion, voluntary consent හෝ compulsion, responsible individual හෝ collective"
wrong_answers:
  - "international trade agreements සහ global financial institutions මත control පිළිබඳ rich සහ poor nations අතර divide එක"
  - "government spending priorities සහ infrastructure investment පිළිබඳ urban සහ rural populations අතර divide එක"
  - "social norms, family values, සහ religious education පිළිබඳ progressive සහ traditional cultures අතර divide එක"
explanation: >-
  course එක තර්ක කරන්නේ real political divide එක traditional left-right-center labels තුළ නොව fundamental philosophical principles තුළ ඇති බවයි: freedom හෝ coercion, voluntary consent හෝ compulsion, responsible individual හෝ collective. politics ගැන සිතීමට නිවැරදි ක්‍රමය labels වලින් නොව ethical principles වලින් ආරම්භ කිරීමයි.
reviewed: false
