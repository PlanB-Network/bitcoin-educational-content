question: "Một định nghĩa cấu trúc về một hệ thống chính trị tập trung vào điều gì?"
answer: "Cách hệ thống thực sự vận hành và các đặc điểm có thể quan sát được của nó, chẳng hạn như mức độ kiểm soát của nhà nước"
wrong_answers:
  - "Các mục tiêu được tuyên bố và những ý định cao đẹp do những người sáng lập và lãnh đạo hệ thống công bố"
  - "Nguồn gốc lịch sử của phong trào chính trị và tiểu sử của các nhà tư tưởng chủ chốt của nó"
  - "Số lượng đảng phái chính trị được phép hoạt động và tần suất tổ chức các cuộc bầu cử dân chủ"
explanation: >-
  Các định nghĩa cấu trúc tập trung vào cách các hệ thống chính trị thực sự vận hành và vào các đặc điểm có thể quan sát được của chúng. Ví dụ, chủ nghĩa xã hội về mặt cấu trúc được đặc trưng bởi sự hiện diện khắp nơi của nhà nước. Cách tiếp cận này tương phản với các định nghĩa theo ý định, vốn dựa vào các động cơ và mục tiêu được tuyên bố. Cách tiếp cận cấu trúc cho phép đánh giá khách quan hơn dựa trên các kết quả có thể đo lường.
