question: "फ्रांसीसी libertaires (समाजवादी अराजकतावादी) निजी संपत्ति के बारे में क्या मानते हैं?"
answer: "निजी संपत्ति और पूंजीवाद को समाप्त किया जाना चाहिए क्योंकि वे उत्पीड़न के स्रोत हैं"
wrong_answers:
  - "निजी संपत्ति एक प्राकृतिक अधिकार है जो राज्य से पहले आता है और जिसकी हर कीमत पर रक्षा की जानी चाहिए"
  - "निजी संपत्ति को राज्य द्वारा विनियमित किया जाना चाहिए लेकिन समाज से कभी पूरी तरह समाप्त नहीं किया जाना चाहिए"
  - "निजी संपत्ति तभी स्वीकार्य है जब उसे किसी कम्यून के सभी सदस्यों में समान रूप से वितरित किया जाए"
explanation: >-
  फ्रांसीसी libertaires, Proudhon और Bakunin जैसे विचारकों के माध्यम से समाजवादी अराजकतावाद के उत्तराधिकारी, मानते हैं कि राज्य और निजी संपत्ति दोनों को उत्पीड़न के जुड़वां स्रोतों के रूप में समाप्त किया जाना चाहिए। यह Proudhon के प्रसिद्ध सूत्र "Property is theft." में व्यक्त है। पहला गलत उत्तर libertarian स्थिति का वर्णन करता है, जो libertaire दृष्टिकोण के मूलतः विपरीत है।
reviewed: false
