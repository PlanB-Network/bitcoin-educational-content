question: "What is the important distinction between being pro-business and being pro-market?"
answer: "Being pro-business means favoring an alliance between large enterprises and the state, while being pro-market means supporting free competition without state favoritism"
wrong_answers:
  - "Being pro-business means supporting small businesses, while being pro-market means supporting multinational corporations"
  - "Being pro-business means opposing regulation entirely, while being pro-market means accepting moderate regulation"
  - "Being pro-business focuses on domestic industry, while being pro-market focuses on international trade"
explanation: >-
  Centrists tend to be pro-business, meaning they favor a kind of alliance between large enterprises and the state, which differs from being pro-market. Being pro-market supports free competition without state favoritism or corporate protectionism. This distinction is crucial because pro-business policies can create monopolies and regulatory protections that actually undermine free-market competition.
