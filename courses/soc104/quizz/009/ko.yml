question: "녹색당은 놀런 도표에서 어디에 위치하며, 그 이유는 무엇인가요?"
answer: "도표의 매우 낮은 곳에 위치합니다. 그들은 개인의 이익이 지구의 집단적 이익보다 우선해서는 안 된다고 보기 때문입니다"
wrong_answers:
  - "도표의 꼭대기에 위치합니다. 개인적 자유와 환경 의식을 동등하게 우선시하기 때문입니다"
  - "도표의 중앙에 위치합니다. 경제 성장과 환경 보호의 균형을 맞추기 때문입니다"
  - "가장 오른쪽에 위치합니다. 환경 문제에 대한 시장 기반 해결책을 지지하기 때문입니다"
explanation: >-
  녹색당은 지구의 안녕이라는 명분으로 경제적 결정과 개인적 결정 모두에 대해 강한 국가 통제를 선호하기 때문에 놀런 도표에서 매우 낮은 곳에 위치합니다. 그들은 마르크스주의적 계급 투쟁을 인간과 자연 사이의 투쟁으로 대체했으며, 경제 통제와 심지어 사유재산의 폐지까지 옹호하는 경향이 있습니다. 이는 그들을 꼭대기나 중앙이 아니라 권위주의 영역에 놓습니다.
