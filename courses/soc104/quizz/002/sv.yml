question: "Vilken vägledande princip styrde Frederic Bastiats röster i nationalförsamlingen?"
answer: "Främjandet av individuella och ekonomiska friheter och minskningen av statlig inblandning"
wrong_answers:
  - "Försvaret av kunglig auktoritet och bevarandet av monarkiska traditioner"
  - "Främjandet av socialistisk politik för att omfördela välstånd mer jämlikt"
  - "En centristisk kompromissstrategi mellan vänster- och högerfraktionerna"
explanation: >-
  Bastiat röstade utifrån en grundläggande princip: att främja individuella och ekonomiska friheter samtidigt som statlig inblandning minskades. Han var inte en centristisk opportunist, och inte heller rojalist eller socialist. Han röstade med den sida som föreslog åtgärder i linje med frihet och begränsad statsmakt.
reviewed: false
