question: "Wat is de definitie van statisme zoals die in het Nolan-kader wordt gepresenteerd?"
answer: "Wetgeving gebruiken om de samenleving te controleren en vorm te geven, hetzij in naam van de verdediging van beschaving, de arbeidersklasse, de natuur of de onderdrukten"
wrong_answers:
  - "Een regeringssysteem waarin gekozen functionarissen vaste termijnen dienen en machtsoverdracht via democratische verkiezingen verloopt"
  - "De overtuiging dat alleen een sterk leger de soevereiniteit en territoriale integriteit van een natie kan beschermen"
  - "Een economische filosofie die nationale industrieën prioriteit geeft boven buitenlandse concurrentie via tarieven en quota"
explanation: >-
  Statisme wordt gedefinieerd als het gebruik van wetgeving om de samenleving te controleren en vorm te geven. Zowel links als rechts past het toe: sommigen in naam van de verdediging van beschaving, anderen in naam van de verdediging van de arbeidersklasse, de natuur of de onderdrukten. Zelfs centristen keuren het goed wanneer het hun uitkomt. Statisme is niet beperkt tot militair beleid, handelsprotectionisme of simpelweg het hebben van gekozen regeringen.
reviewed: false
