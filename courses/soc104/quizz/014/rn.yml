question: "Kubera iki uburyo bw'ibipimo bibiri buvuga ko ibibazo vyinshi vya politike bishobora kugaburwa mu migwi y'ubutunzi n'uw'umuntu ku giti ciwe?"
answer: "Kubera ko ibibazo vy'ubutunzi vyerekeye ivyo ukora nk'umuhinguzi n'umuguzi, mu gihe ibibazo vy'umuntu ku giti ciwe vyerekeye imigenderanire yawe y'ubuzima bwite, ukwemera kwawe, n'ubwigenge bw'umubiri wawe"
wrong_answers:
  - "Kubera ko ibiganiro vyose vya politike amaherezo bigaruka ku kutumvikana ku rugero rw'amakori no ku bikorwa vy'idini"
  - "Kubera ko muri kahise leta zigenzura ibintu bibiri gusa: isoko n'igisirikare"
  - "Kubera ko kuva kera abafilozofe ba politike bama batandukanya ivyitwarariko vy'umubiri n'ivyitwarariko vy'impwemu"
explanation: >-
  Uburyo bw'ibipimo bibiri bushingiye ku ciyumviro c'uko ibibazo vya politike bigaburamwo imigwi ibiri minini. Umwidegemvyo w'ubutunzi ukwirikira uguhingura, ugukoresha, ubudandaji, akazi, n'ugucunga amahera. Umwidegemvyo w'umuntu ku giti ciwe ukwirikira imigenderanire y'ubuzima bwite, ivyiyumviro, ukwemera, n'amahitamo yerekeye umubiri wawe n'ubwenge bwawe. Iryo tandukaniro rituma habaho gushira ibibanza vya politike ku karata mu buryo burimwo utuntu twinshi kuruta umurongo umwe ibubamfu-iburyo.
