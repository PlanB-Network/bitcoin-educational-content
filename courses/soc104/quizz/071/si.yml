question: "healthcare පිළිබඳ socialist position එක කුමක්ද?"
answer: "healthcare වෙත access fundamental right එකක් වන අතර, income නොසලකා සැමට universal, publicly funded system එකක් state එක guarantee කළ යුතුය"
wrong_answers:
