question: "pro-business වීම සහ pro-market වීම අතර ප්‍රධාන distinction එක කුමක්ද?"
answer: "Pro-business advocates failure වෙතින් specific companies ආරක්ෂා කිරීමට state intervention සොයන අතර, pro-market advocates deregulation සඳහා සහය දී market එකට naturally reorganize වීමට businesses fail වීමට ඉඩ දෙයි"
wrong_answers:
  - "Pro-business advocates large corporations මත focus කරන අතර pro-market advocates exclusively small businesses සහ startups සඳහා සහය දීමට focus කරයි"
  - "Pro-business යනු worker cooperativesට ප්‍රමුඛතාව දෙන left-wing position එකක් වන අතර pro-market යනු private ownershipට ප්‍රමුඛතාව දෙන right-wing position එකකි"
  - "Pro-business advocates සියලු competition ප්‍රතික්ෂේප කරන අතර pro-market advocates approved enterprises අතර government-regulated competition සඳහා සහය දක්වයි"
explanation: >-
  pro-business position එක competition දකින්නේ regulations හරහා ලබාගන්නා governance instrument එකක් ලෙස වන අතර job losses වළක්වීමට subsidies සහ bailouts සාධාරණීකරණය කරයි. pro-business දෘෂ්ටිය තුළ, market එක fragile වන අතර state rescue අවශ්‍ය වේ. Pro-market advocates competition දකින්නේ free enterprise හි natural result එක ලෙසය; එයින් deregulation සහ businesses fail වීමට ඉඩදීම අදහස් වේ, මන්ද failure market එකට naturally reorganize වීමට ඉඩ දී වඩා capable actors සඳහා field එක විවෘත කරන නිසාය.
reviewed: false
