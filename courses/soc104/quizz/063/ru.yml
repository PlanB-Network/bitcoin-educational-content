question: "Как все тоталитарные режимы приходили к власти?"
answer: "Через насильственную революцию, которая оправдывала необходимость начисто обнулить прежнюю систему"
wrong_answers:
  - "Через постепенную законодательную реформу внутри существующих демократических институтов"
  - "Через военные перевороты, организованные иностранными державами, стремившимися к региональному контролю"
  - "Через мирные массовые движения, которые с большим отрывом выигрывали народные выборы"
explanation: >-
  Все тоталитарные режимы приходили к власти через насильственную революцию. Эта революция служит двойной цели: она физически разрушает старый порядок и идеологически оправдывает применение насилия как необходимое для построения нового общества. Это отличает тоталитарные захваты власти от демократических переходов, переворотов при иностранной поддержке или мирных электоральных побед.
reviewed: false
