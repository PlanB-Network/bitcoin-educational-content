question: "Hva har forrang fremfor frihet i den konservative politiske filosofien?"
answer: "Orden og tradisjon, som må være fast etablert før frihet kan verdsettes"
wrong_answers:
  - "Sosial rettferdighet og likhet, som må garanteres før individer kan være virkelig frie"
  - "Økonomisk effektivitet og pragmatiske resultater, som avgjør når frihet er passende"
  - "Individuelle eiendomsrettigheter, som må beskyttes før noen annen frihet gis"
explanation: >-
  For konservative har orden og tradisjon forrang fremfor frihet. De hevder at for mye frihet skaper kaos og sosial uorden, så frihet kan først verdsettes når orden er fast etablert. Dette står i kontrast til det sosialistiske synet som prioriterer rettferdighet, eller det sentristiske fokuset på effektivitet.
reviewed: false
