question: "Если учитывать всю аргументацию этого курса, как Bitcoin одновременно воплощает либертарианскую критику конструктивизма, шифропанковскую приверженность действию и индивидуалистическую защиту моральной автономии?"
answer: "Bitcoin заменяет централизованно планируемые деньги спонтанным рыночным порядком (антиконструктивизм), превращает абстрактный идеал финансовой свободы в работающий код (шифропанковское действие) и возвращает индивиду суверенную собственность и приватность (моральная автономия)"
wrong_answers:
  - "Bitcoin использует демократическое управление для установления денежной политики (антиконструктивизм), публикует образовательный контент о финансовой свободе (шифропанковское действие) и позволяет людям голосовать за изменения протокола (моральная автономия)"
  - "Bitcoin устраняет всё финансовое регулирование (антиконструктивизм), создаёт сообщество разработчиков, лоббирующих дерегулирование (шифропанковское действие), и даёт богатым людям больше контроля над денежной политикой (моральная автономия)"
  - "Bitcoin децентрализует серверную инфраструктуру по нескольким странам (антиконструктивизм), использует лицензирование open-source для свободного распространения технологии (шифропанковское действие) и предоставляет анонимные социальные платформы для политического инакомыслия (моральная автономия)"
explanation: >-
  Bitcoin находится на пересечении трёх интеллектуальных традиций, рассмотренных в курсе. Он воплощает антиконструктивистский аргумент, заменяя централизованно планируемые фиатные деньги спонтанным децентрализованным денежным порядком, который не может контролировать ни один центральный планировщик. Он исполняет шифропанковский императив писать код, превращая абстрактные идеалы финансовой свободы и приватности в работающую технологию. И он служит индивидуалистической защите моральной автономии, обеспечивая суверенную собственность, защищая плоды труда и сохраняя приватность, позволяя каждому человеку быть хозяином собственной жизни.
