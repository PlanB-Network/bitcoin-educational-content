question: "คำนิยามเชิงโครงสร้างของระบบการเมืองมุ่งเน้นอะไร?"
answer: "ระบบทำงานจริงอย่างไรและคุณลักษณะที่สังเกตได้ของมัน เช่น ระดับการควบคุมของรัฐ"
wrong_answers:
  - "เป้าหมายที่ประกาศและเจตนาอันสูงส่งที่ผู้ก่อตั้งและผู้นำของระบบแถลงไว้"
  - "ต้นกำเนิดทางประวัติศาสตร์ของขบวนการการเมืองและชีวประวัติของนักคิดหลัก"
  - "จำนวนพรรคการเมืองที่ได้รับอนุญาตและความถี่ของการเลือกตั้งประชาธิปไตยที่จัดขึ้น"
explanation: >-
  คำนิยามเชิงโครงสร้างมุ่งดูว่าระบบการเมืองทำงานจริงอย่างไร และคุณลักษณะที่สังเกตได้ของมัน ตัวอย่างเช่น สังคมนิยมถูกกำหนดลักษณะเชิงโครงสร้างด้วยการมีอยู่ทุกหนทุกแห่งของรัฐ แนวทางนี้ตรงข้ามกับคำนิยามเชิงเจตนา ซึ่งอาศัยแรงจูงใจและเป้าหมายที่ประกาศไว้ แนวทางเชิงโครงสร้างทำให้ประเมินได้อย่างเป็นวัตถุวิสัยมากขึ้นบนฐานของผลลัพธ์ที่วัดได้
reviewed: false
