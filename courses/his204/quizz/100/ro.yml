question: Care instituție bancară este consecința finală a alegerilor făcute în 1789, împotriva căreia s-a exprimat Dupont de Nemours?
answer: Banca Franței
wrong_answers:
  - Casa de Economii
  - Crédit Agricole
  - Banca Centrală Europeană
explanation: |
  Banca Franței este o consecință a alegerilor făcute în 1789, pe care Dupont de Nemours le-a criticat pentru că au dus la o centralizare excesivă a puterii financiare și la o intervenție excesivă a statului în economie.
