question: "سه کارکرد اساسی بازار آزاد، به توصیف لیبرتارین‌ها، چگونه در کنار هم نظامی هم کارآمد و هم اخلاقی برای سازمان‌دهی اجتماعی می‌سازند؟"
answer: "قیمت‌ها قطب‌نمایی برای تصمیم‌ها فراهم می‌کنند، بازار ترجیحات اصیل را از طریق عرضه و تقاضا آشکار می‌کند، و مبادلهٔ آزاد به افراد امکان می‌دهد امور خود را مطابق ارزش‌های شخصی تعیین کنند؛ بدین‌سان کارایی اطلاعاتی با خودمختاری اخلاقی ترکیب می‌شود"
wrong_answers:
  - "بازار ثروت کل را بیشینه می‌کند، از طریق رقابت طبیعی از انحصارها جلوگیری می‌کند، و توزیع برابر منابع را تضمین می‌کند؛ بدین‌سان بهره‌وری را با عدالت اجتماعی ترکیب می‌کند"
  - "بازارهای آزاد هزینه‌های دولت را کاهش می‌دهند، نوآوری فناورانه را تحریک می‌کنند، و فرصت‌های اشتغال ایجاد می‌کنند؛ بدین‌سان مسئولیت مالی را با رشد اقتصادی ترکیب می‌کنند"
  - "بازارها قیمت‌های مصرف‌کننده را پایین می‌آورند، کیفیت محصول را از طریق رقابت افزایش می‌دهند، و تجارت بین‌المللی را گسترش می‌دهند؛ بدین‌سان شکوفایی داخلی را با همکاری جهانی ترکیب می‌کنند"
explanation: >-
  دفاع لیبرتارین از بازار آزاد بر سه کارکرد به‌هم‌پیوسته تکیه دارد. نخست، قیمت‌ها به‌عنوان شاخص‌های قابل اتکایی عمل می‌کنند که تصمیم‌های اقتصادی و اجتماعی را هدایت می‌کنند (قطب‌نما). دوم، بازار ترجیحات اصیل افراد را از طریق عرضه و تقاضا آشکار می‌کند. سوم، مبادلهٔ آزاد به کنشگران امکان می‌دهد امور خود را مطابق ارزش‌های شخصی تعیین کنند. هایک نشان داد که بازارهای آزاد اطلاعات پراکنده را بهتر از برنامه‌ریزی مرکزی هماهنگ می‌کنند (کارایی)، در حالی که رضایت متقابل بیش از اجبار به کرامت انسانی احترام می‌گذارد (عدالت).
reviewed: false
