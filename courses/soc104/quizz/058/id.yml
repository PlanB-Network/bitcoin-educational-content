question: "Apa pembedaan penting antara pro-bisnis dan pro-pasar?"
answer: "Pro-bisnis berarti mendukung aliansi antara perusahaan besar dan negara, sementara pro-pasar berarti mendukung kompetisi bebas tanpa favoritisme negara"
wrong_answers:
  - "Pro-bisnis berarti mendukung usaha kecil, sementara pro-pasar berarti mendukung korporasi multinasional"
  - "Pro-bisnis berarti menentang regulasi sepenuhnya, sementara pro-pasar berarti menerima regulasi moderat"
  - "Pro-bisnis berfokus pada industri domestik, sementara pro-pasar berfokus pada perdagangan internasional"
explanation: >-
  Kaum sentris cenderung pro-bisnis, artinya mereka mendukung semacam aliansi antara perusahaan besar dan negara, yang berbeda dari sikap pro-pasar. Sikap pro-pasar mendukung kompetisi bebas tanpa favoritisme negara atau proteksionisme korporat. Pembedaan ini krusial karena kebijakan pro-bisnis dapat menciptakan monopoli dan proteksi regulatif yang justru merusak kompetisi pasar bebas.
