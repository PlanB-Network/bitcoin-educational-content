question: "¿Cuál es el mensaje central del Manifiesto Cypherpunk de Eric Hughes de 1993 respecto a la privacidad?"
answer: "La privacidad es esencial para una sociedad abierta en la era electrónica, y los individuos deben construirla por sí mismos en lugar de esperar que los gobiernos o las corporaciones la garanticen"
wrong_answers:
  - "La privacidad es un lujo que debe sacrificarse a cambio de la seguridad nacional y la protección de las instituciones democráticas"
  - "La privacidad debe regularse mediante tratados internacionales que establezcan estándares uniformes de protección de datos en todos los países"
  - "La privacidad solo es importante para criminales y disidentes, mientras que los ciudadanos respetuosos de la ley se benefician de sistemas de vigilancia transparentes"
explanation: >-
  El manifiesto de Eric Hughes de 1993 afirma que la privacidad es esencial para una sociedad abierta en la era electrónica y que no podemos esperar que gobiernos, corporaciones u otras grandes organizaciones la garanticen. La motivación fundamental es que la confidencialidad es un elemento clave de la libertad y debe ser construida por los propios individuos, no esperada como un regalo de las instituciones.
