question: "社会主义如何在社会领域和经济领域中区别对待自由？"
answer: "社会主义在社会领域支持强自由，但在经济领域支持弱自由"
wrong_answers:
  - "社会主义在社会和经济两个领域同等限制一切自由"
  - "社会主义支持强经济自由，但限制社会自由以维持社会秩序"
  - "社会主义在两个领域都赋予无限自由，并依靠自愿合作来维持平衡"
explanation: >-
  在社会主义思想中，社会自由与经济自由之间存在根本二分。社会自由是强的，但由于强调国家控制、规划和财富再分配，经济自由是弱的。第三个错误答案描述的是自由意志主义理想，而第二个描述的是保守主义模式，它是社会主义的镜像。
reviewed: false
