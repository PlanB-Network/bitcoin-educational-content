question: "Във всичките пет икономически дебата (данъци, минимална заплата, здравеопазване, околна среда, субсидии) какъв последователен модел отличава центристкия метод от позициите на другите политически семейства?"
answer: "Центристите отказват да се обвържат с фиксиран принцип и вместо това изискват емпиричен анализ и експертна оценка, за да определят политиката за всеки отделен случай, което прави подхода им по същество технократичен"
wrong_answers:
  - "Центристите винаги заемат средна позиция между социалистическата и консервативната позиция, разделяйки разликата поравно по всеки въпрос"
  - "Центристите последователно приоритизират икономическия растеж пред социалното благосъстояние, заставайки на страната на либертарианците във фискалната политика, докато се съгласяват със социалистите относно регулацията"
  - "Центристите отлагат всички икономически решения на международни организации и търговски споразумения, вместо да правят независима национална политика"
explanation: >-
  Във всичките пет икономически дебата центристкият подход следва един и същ модел: вместо да се обвързват с фиксиран идеологически принцип, центристите изискват емпирични доказателства и експертна оценка, преди да вземат решения. При данъците правилното ниво трябва да се определи чрез анализ. При минималната заплата нивото трябва да се коригира прагматично. При здравеопазването идеална е смес, калибрирана от експерти. При околната среда политиката трябва да балансира конкурентоспособността. При субсидиите всеки случай трябва да се оценява според собствените му достойнства. Това прави центризма по същество технократичен, което е различно от простото разделяне на разликата или отлагане на решенията на международни органи.
