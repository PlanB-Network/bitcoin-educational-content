question: "Ingingo zibiri za John Rawls z'ubutungane ni izihe?"
answer: "Umwidegemvyo ungana kuri bose, n'ingingo y'itandukaniro yemera ubusumbasumbane gusa iyo bugirira akamaro abafise ibibazo kurusha abandi"
wrong_answers:
  - "Uburenganzira bwo gutora kuri bose ku banyagihugu, n'amakori yiyongera uko umuntu aronka menshi kugira ngo yishure serivisi za Leta"
  - "Umwidegemvyo wo kuvuga ata gukumirwa, n'ukugabura ubutunzi ku nguvu kugira ngo hashikwe ku bungane"
  - "Kurengera uburenganzira ku mutungo bwite, n'ingingo ngenderwako yo kudatera abandi ikoreshwa ku bikorwa vyose vya Leta"
explanation: >-
  Rawls ashikiriza ingingo zibiri: iya mbere, umwidegemvyo ungana kuri bose (ishingiro rya demokarasi), n'iya kabiri, ingingo y'itandukaniro, yemera ubusumbasumbane gusa iyo bugirira akamaro abari mu bihe bibi kurusha abandi mu kibano. Ivyo bisigura ko umuntu afise uburenganzira bwo gutunga cane, mu gihe ugusubiramwo igabanywa ry'ubutunzi gutuma abatoneshejwe make na bo bunguka. Ayandi mahitamwo avanga ibintu biva mu mafilozofiya ya politike atandukanye.
