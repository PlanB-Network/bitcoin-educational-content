question: "Mengapa prediksi Molinari tahun 1849 terbukti profetik terkait hubungan antara kebebasan dan kekuasaan politik?"
answer: "Karena kaum konservatif dan sosialis telah bergantian berkuasa dan menginstrumentalisasi kebebasan demi tujuan politik masing-masing, persis seperti yang ia gambarkan"
wrong_answers:
  - "Karena tokoh ekonom yang ia gambarkan akhirnya memperoleh kekuasaan politik dan menerapkan kebijakan libertarian di seluruh Eropa"
  - "Karena prediksinya bahwa ketiga keluarga politik akan bergabung menjadi satu gerakan sentris menjadi kenyataan pada abad kedua puluh"
  - "Karena kebebasan secara bertahap diperluas oleh pemerintahan berturut-turut hingga menjadi prinsip pengorganisasian utama demokrasi modern"
explanation: >-
  Visi Molinari terbukti profetik karena, sejak pertengahan abad kesembilan belas, kaum konservatif dan sosialis telah bergantian berkuasa dan menjalankan persis apa yang ia gambarkan: instrumentalisasi kebebasan demi tujuan politik. Kedua keluarga ini bersedia membatasi kebebasan dan memanggil negara untuk memaksakan agenda masing-masing, sementara posisi ekonom tentang kebebasan tanpa syarat tetap terpinggirkan.
reviewed: false
