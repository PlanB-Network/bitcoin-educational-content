question: Какво представлява unit типът (𝟙) и защо е полезен, въпреки че не носи информация?
answer: Той съдържа една стойност (празния кортеж) и е основата за всички други типове.
wrong_answers:
  - Той представлява числото 1 и се използва директно за аритметични операции.
  - Той е специален тип за дебъгване, който записва следи от изпълнението във файл.
  - Той съхранява точно един бит данни, използван за булеви операции.
explanation: >-
  Unit типът 𝟙 има точно една стойност — празния кортеж ⟨⟩. Макар
  да носи нула бита информация, той е съществен като семето, от което
  sum и product типовете изграждат всички полезни типове данни.
  Например булевият тип 𝟚 е 𝟙 + 𝟙, конструиран изцяло от unit типове.
reviewed: false
