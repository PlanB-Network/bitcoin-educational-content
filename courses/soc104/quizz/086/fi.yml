question: "Miten vapaan markkinan kolme olennaista funktiota, libertaarien kuvaamina, yhdessä muodostavat sekä tehokkaan että eettisen yhteiskunnallisen organisoitumisen järjestelmän?"
answer: "Hinnat tarjoavat kompassin päätöksille, markkina paljastaa aidot preferenssit kysynnän ja tarjonnan kautta, ja vapaa vaihto antaa yksilöille mahdollisuuden päättää omista asioistaan henkilökohtaisten arvojen mukaan, yhdistäen informaatiotehokkuuden moraaliseen autonomiaan"
wrong_answers:
  - "Markkina maksimoi kokonaisvarallisuuden, estää monopolit luonnollisen kilpailun kautta ja varmistaa resurssien tasaisen jakautumisen, yhdistäen tuottavuuden sosiaaliseen oikeudenmukaisuuteen"
  - "Vapaat markkinat vähentävät julkisia menoja, edistävät teknologista innovaatiota ja luovat työllisyysmahdollisuuksia, yhdistäen julkistaloudellisen vastuullisuuden talouskasvuun"
  - "Markkinat laskevat kuluttajahintoja, parantavat tuotteiden laatua kilpailun kautta ja laajentavat kansainvälistä kauppaa, yhdistäen kotimaisen vaurauden globaaliin yhteistyöhön"
explanation: >-
  Libertaarinen perustelu vapaan markkinan puolesta nojaa kolmeen toisiinsa liittyvään funktioon. Ensinnäkin hinnat toimivat luotettavina indikaattoreina, jotka ohjaavat taloudellisia ja sosiaalisia päätöksiä (kompassi). Toiseksi markkina paljastaa aidot yksilölliset preferenssit kysynnän ja tarjonnan kautta. Kolmanneksi vapaa vaihto antaa toimijoille mahdollisuuden päättää omista asioistaan henkilökohtaisten arvojen mukaan. Hayek osoitti, että vapaat markkinat koordinoivat hajautunutta informaatiota paremmin kuin keskussuunnittelu (tehokkuus), kun taas keskinäinen suostumus kunnioittaa ihmisarvoa enemmän kuin pakko (oikeudenmukaisuus).
reviewed: false
