question: "Vad är kulturell konservatism?"
answer: "En personlig anslutning till familjära, moraliska, estetiska och metafysiska värden som ärvts från det förflutna, inte en politisk filosofi"
wrong_answers:
  - "En politisk ideologi som använder statsmakt för att genom lagstiftning påtvinga traditionella värden på hela samhället"
  - "En rörelse som avvisar alla former av modernitet och försöker återföra samhället till ett förindustriellt levnadssätt"
  - "En ekonomisk doktrin som skyddar nationella industrier och motsätter sig frihandel med främmande länder"
explanation: >-
  Kulturell konservatism definieras som en livsvisdom: den personliga anslutningen till familjära, moraliska, estetiska och metafysiska värden som ärvts från det förflutna, vare sig de är grekisk-romerska eller judisk-kristna. Den är uttryckligen inte en politisk filosofi. Den skiljer sig från politisk konservatism, som syftar till att bevara politiska institutioner och social ordning genom statsmakt. Den handlar inte heller om att avvisa modernitet eller om ekonomisk protektionism.
reviewed: false
