question: Pod akým názvom Boisguilbert v roku 1696 znovu vydal svoj Détail de la France?
answer: Francúzsko zničené za vlády Ľudovíta XIV., kým a ako, s prostriedkami na jeho obnovu
wrong_answers:
  - Francúzsko zničené za vlády Ľudovíta XIV., prečo a ako, s číselnými dokladmi
  - Francúzsko rozdelené za vlády Ľudovíta XIV., ktorými frakciami a prečo, a ako ho znovu zjednotiť
  - Francúzsko prosperujúce za vlády Ľudovíta XIV., vďaka komu a ako, s konkrétnymi príkladmi
explanation: |
  Úplný názov nového vydania jeho diela z roku 1696 je skutočne "La France ruinée sous le règne de Louis XIV, par qui et comment, avec les moyens de la rétablir". Tento názov odráža Boisguilbertovu ostrú kritiku hospodárskej politiky Ľudovíta XIV.
