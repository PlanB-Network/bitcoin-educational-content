question: "Mis on poliitiline konservatism?"
answer: "Ideoloogia, mille eesmärk on säilitada väljakujunenud poliitilised institutsioonid ja ühiskonnakord ning mis vastustab suuri struktuurseid murranguid"
wrong_answers:
  - "Isiklik pühendumus traditsioonilistele pereväärtustele ja religioossetele praktikatele ilma soovita neid teistele peale suruda"
  - "Filosoofia, mis edendab kiireid sotsiaalseid muutusi demokraatliku reformi ja progressiivse seadusandluse kaudu"
  - "Majandusteooria, mis pooldab vabu turge, minimaalset maksustamist ja kaubandusbarjääride kaotamist"
explanation: >-
  Poliitiline konservatism on ideoloogia, mida sageli esindavad parempoolsed või paremäärmuslikud erakonnad ning mille eesmärk on säilitada väljakujunenud poliitilised institutsioonid ja ühiskonnakord, vastustades samal ajal suuri struktuurseid murranguid. Selle pooldajad soovivad kasutada võimu ja õigust oma pärandi kaitsmiseks. See erineb kultuurilisest konservatismist, mis on isiklik eluvalik, mitte poliitiline programm.
reviewed: false
