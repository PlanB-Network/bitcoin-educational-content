question: Čo podľa Schumpetera charakterizovalo Duponta de Nemours počas celej jeho kariéry?
answer: Zostal verný fyziokracii napriek mnohým príležitostiam zaprieť ju
wrong_answers:
  - Neustále prispôsoboval svoje myšlienky, aby zostal v priazni mocných
  - Postupne opustil fyziokraciu v prospech teórií Adama Smitha
  - Celý život mu chýbalo uznanie od jeho kolegov
explanation: |
  Schumpeter napísal, že Dupont de Nemours "zostal verný fyziokracii počas celej kariéry, v ktorej mal mnoho príležitostí zaprieť ju." Bol to muž pevného presvedčenia, ktorý svoju vieru nikdy nezaprel, ani keď by to preň bolo politicky výhodné.
