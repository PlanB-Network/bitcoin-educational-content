question: "چه چیزی نومحافظه‌کاران را از پالئومحافظه‌کاران در رویکردشان به سیاست خارجی متمایز می‌کند؟"
answer: "نومحافظه‌کاران مداخله‌گری نظامی را برای گسترش دموکراسی توجیه می‌کنند، در حالی که پالئومحافظه‌کاران از سیاست خارجی انزواگرایانه‌تر دفاع می‌کنند"
wrong_answers:
  - "نومحافظه‌کاران با هرگونه اقدام نظامی مخالف‌اند و دیپلماسی را ترجیح می‌دهند، در حالی که پالئومحافظه‌کاران از حملات پیش‌دستانه علیه تهدیدهای بالقوه حمایت می‌کنند"
  - "نومحافظه‌کاران منحصراً بر تحریم‌های اقتصادی تمرکز می‌کنند، در حالی که پالئومحافظه‌کاران از ساختن ائتلاف‌های بین‌المللی برای عملیات نظامی مشترک دفاع می‌کنند"
  - "نومحافظه‌کاران و پالئومحافظه‌کاران درباره سیاست خارجی توافق دارند اما درباره تنظیم‌گری اقتصادی داخلی به‌شدت اختلاف دارند"
explanation: >-
  از دهه 2000 به بعد، نومحافظه‌کاران به‌طور فزاینده‌ای در توجیه مداخله‌گری نظامی برای استقرار دموکراسی در سراسر جهان درگیر شدند، به‌ویژه پس از 11 سپتامبر 2001. در واکنش، محافظه‌کاران سنتی برای متمایز کردن خود برچسب 'paleoconservative' را برای خود برگزیدند. پالئومحافظه‌کاران از مداخله‌گری نظامی انتقاد می‌کنند، از سیاست خارجی انزواگرایانه‌تر دفاع می‌کنند، و بر هویت ملی و فرهنگی تأکید بیشتری می‌گذارند.
reviewed: false
