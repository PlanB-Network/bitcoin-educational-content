question: "Waarom begonnen klassieke liberalen in de Verenigde Staten zich in de twintigste eeuw 'libertariërs' te noemen?"
answer: "Omdat het Amerikaanse 'liberalism' was gekaapt door groeiend staatsinterventionisme en de verzorgingsstaat"
wrong_answers:
  - "Omdat zij afstand wilden nemen van Europese monarchistische tradities"
  - "Omdat de term 'liberal' werd geassocieerd met anarchisme en politiek geweld"
  - "Omdat nieuwe handelsakkoorden een afzonderlijke politieke identiteit voor voorstanders van de vrije markt vereisten"
explanation: >-
  In de twintigste eeuw vond een fundamentele verschuiving plaats doordat laissez-faire-principes geleidelijk werden losgelaten ten gunste van de verzorgingsstaat. Amerikaans "liberalism" ging iets heel anders betekenen dan klassiek liberalisme en omarmde staatsinterventionisme. Klassieke liberalen namen de term "libertarian" aan om het onderscheid te bewaren. Deze herbranding had niets te maken met Europees monarchisme, anarchistisch geweld of handelsakkoorden.
reviewed: false
