question: "Bagaimana konsepsi libertarian tentang kebebasan berbeda dari konsepsi sentris?"
answer: "Kaum libertarian memperlakukan kebebasan sebagai aksioma tanpa syarat, sementara kaum sentris membela kebebasan secara oportunistis tergantung konteks dan efisiensi"
wrong_answers:
  - "Kaum libertarian mengizinkan negara melindungi kebebasan secara selektif, sementara kaum sentris menolak keterlibatan negara apa pun dalam melindungi hak individu"
  - "Kaum libertarian memusatkan kebebasan hanya pada urusan ekonomi, sementara kaum sentris menerapkan kebebasan secara luas di ranah sosial dan budaya"
  - "Kaum libertarian dan sentris memiliki pandangan yang sama tentang kebebasan tetapi tidak sepakat tentang ukuran pemerintah yang dibutuhkan untuk menegakkannya"
explanation: >-
  Kaum libertarian mendefinisikan kebebasan sebagai prinsip umum tanpa syarat yang berfungsi sebagai aksioma. Sebaliknya, kaum sentris membela kebebasan tertentu secara oportunistis dan kontekstual tanpa menerapkan prinsip umum apa pun. Pendekatan sentris mengungkap konsepsi instrumental tentang kebebasan, yang selalu ditundukkan pada tujuan pragmatis seperti efisiensi, yang pada dasarnya ditolak oleh kaum libertarian.
