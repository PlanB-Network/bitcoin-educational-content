question: Cum a răspuns marchizul d'Argenson miniștrilor vremii sale, care propuneau reglementarea cutărei sau cutărei activități economice?
answer: Mai întâi, trebuia să ne asigurăm că reglementarea era mai bună decât libertatea
wrong_answers:
  - Că această activitate trebuia mai întâi lăsată să se maturizeze înainte de a fi reglementată
  - Că trebuiau urmate reglementările făcute de englezi și de olandezi
  - Că poporul trebuie consultat înainte de luarea unei decizii
explanation: |
  Marchizul d'Argenson insista să se demonstreze că reglementarea era preferabilă libertății. El credea că libertatea era principiul de bază și că orice restricție trebuia justificată prin argumente solide.
