question: "정치 시스템의 구조적 정의는 무엇에 초점을 맞추나요?"
answer: "그 시스템이 실제로 어떻게 기능하는지와 국가 통제의 정도 같은 관찰 가능한 특징에 초점을 맞춥니다"
wrong_answers:
  - "그 시스템의 창설자와 지도자들이 선언한 표방된 목표와 고귀한 의도"
  - "정치 운동의 역사적 기원과 핵심 사상가들의 전기"
  - "허용되는 정당 수와 민주적 선거가 치러지는 빈도"
explanation: >-
  구조적 정의는 정치 시스템이 실제로 어떻게 기능하는지와 그 관찰 가능한 특징에 초점을 맞춥니다. 예를 들어 사회주의는 구조적으로 국가의 편재성으로 특징지어집니다. 이 접근은 표방된 동기와 목표에 의존하는 의도적 정의와 대비됩니다. 구조적 접근은 측정 가능한 결과에 기반한 더 객관적인 평가를 가능하게 합니다.
