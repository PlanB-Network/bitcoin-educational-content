question: "دوره چگونه استدلال می‌کند که آزادی اجازه می‌دهد ارزش‌های چپ‌گرا و راست‌گرا هر دو در صلح همزیستی کنند؟"
answer: "در رژیمی از آزادی واقعی، کسانی با آرمان‌های چپ‌گرا می‌توانند داوطلبانه دارایی‌هایشان را به اشتراک بگذارند و منابع را بازتوزیع کنند، در حالی که کسانی با ارزش‌های راست‌گرا می‌توانند پس‌انداز کنند و سنت‌ها را منتقل کنند، بی‌آنکه هیچ‌یک شیوه زندگی خود را بر دیگری تحمیل کند"
wrong_answers:
  - "آزادی مستلزم آن است که هر دو طرف با پذیرش موضعی میانه‌رو مصالحه کنند که در آن دولت ارزش‌های رقیب را از طریق مقررات معتدل متوازن می‌کند"
  - "آزادی یعنی جوامع چپ‌گرا و راست‌گرا باید در قلمروهای جغرافیایی جداگانه با دولت‌های مستقل خود زندگی کنند"
  - "آزادی از طریق اجازه دادن به شهروندان برای رأی دادن درباره ارزش‌هایی که باید در هر منطقه اجرا شوند عمل می‌کند و در هر چرخه انتخاباتی میان سیاست‌های چپ‌گرا و راست‌گرا چرخش می‌کند"
explanation: >-
  دوره نشان می‌دهد که در رژیمی واقعی از آزادی، کسانی که به آرمان‌های چپ‌گرا پایبندند می‌توانند داوطلبانه از دارایی‌های خود بگذرند، ابزار تولید را به اشتراک بگذارند، یا دستمزدهایشان را به سازمان‌های بازتوزیعی اهدا کنند. کسانی با ارزش‌های راست‌گرا می‌توانند سخت کار کنند، پس‌انداز کنند، و ارزش‌های خانوادگی را منتقل کنند. هیچ‌کس نباید شیوه زندگی خود را بر دیگران تحمیل کند. از طریق آزادی بازار و قدرت انتخاب است که هدف‌ها می‌توانند به‌صورت مسالمت‌آمیز محقق شوند.
reviewed: false
