question: "Pourquoi l'axe vertical (haut-bas) est-il considéré comme plus fondamental que l'axe horizontal (gauche-droite) dans le diagramme de Nolan ?"
answer: "Parce qu'il révèle le véritable clivage entre ceux qui défendent le maximum de libertés individuelles et ceux qui favorisent le maximum de contrôle étatique"
wrong_answers:
  - "Parce qu'il mesure la production économique plus précisément que l'axe horizontal ne mesure les politiques sociales"
  - "Parce que la plupart des conflits politiques au cours de l'histoire ont porté sur l'identité culturelle plutôt que sur la gouvernance"
  - "Parce que l'axe horizontal ne s'applique qu'aux démocraties modernes tandis que l'axe vertical est universel"
explanation: >-
  L'axe fondamental est l'axe vertical parce qu'il saisit la question politique essentielle : dans quelle mesure l'État doit-il contrôler l'action humaine ? L'axe gauche-droite ne reflète que différentes sensibilités (justice sociale contre tradition), mais les deux camps peuvent occuper la même position sur l'axe vertical en tant qu'étatistes. L'axe vertical révèle si quelqu'un veut imposer sa vision par la force ou respecte la liberté individuelle.
reviewed: false
