question: "Proč se klasičtí liberálové ve Spojených státech začali během dvacátého století nazývat „libertariány“?"
answer: "Protože americký „liberalismus“ si přivlastnil rostoucí státní intervencionismus a sociální stát"
wrong_answers:
  - "Protože se chtěli distancovat od evropských monarchistických tradic"
  - "Protože se termín „liberál“ začal spojovat s anarchismem a politickým násilím"
  - "Protože nové obchodní dohody vyžadovaly odlišnou politickou identitu pro zastánce volného trhu"
explanation: >-
  Během dvacátého století došlo k zásadnímu posunu, protože principy laissez-faire byly postupně opouštěny ve prospěch sociálního státu. Americký „liberalismus“ začal znamenat něco zcela odlišného od klasického liberalismu a přijal státní intervencionismus. Klasičtí liberálové přijali termín „libertarián“, aby toto rozlišení zachovali. Tento rebranding neměl nic společného s evropským monarchismem, anarchistickým násilím ani obchodními dohodami.
reviewed: false
