question: "Comment le Green New Deal représente-t-il une évolution contemporaine du socialisme démocratique ?"
answer: "Il utilise les préoccupations environnementales comme une nouvelle justification de l'intervention de l'État et de la confiscation des revenus privés, en subordonnant l'intérêt individuel à la santé planétaire collective"
wrong_answers:
  - "Il abandonne entièrement l'économie socialiste traditionnelle au profit de solutions de marché libre aux problèmes environnementaux par l'échange de quotas carbone"
  - "Il rejette l'intervention de l'État et s'appuie plutôt sur l'action individuelle volontaire et l'innovation du secteur privé pour répondre au changement climatique"
  - "Il représente une rupture avec le socialisme en donnant la priorité à la protection de l'environnement sur toutes les préoccupations de justice sociale et d'emploi"
explanation: >-
  Le Green New Deal fusionne les préoccupations environnementales avec les objectifs sociaux, combinant transition écologique, justice sociale, garanties d'emploi et services publics renforcés. L'intérêt individuel est subordonné à l'intérêt collectif défini par la santé planétaire. Au fond, il fournit une nouvelle enveloppe rhétorique justifiant l'intervention de l'État et la confiscation des revenus privés, non plus seulement au nom de la justice sociale mais aussi au nom de l'environnement.
reviewed: false
