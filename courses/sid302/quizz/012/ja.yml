question: レイヤー間のスワップにTaprootとMuSig2を使うと、従来のSegWit v0のHTLCと比べてどのような利点がありますか？
answer: 協調的なスワップが通常のシングルシグのトランザクションと同じに見え、高いプライバシーを保ちながらブロックスペースの使用も最小限に抑えられる
wrong_answers:
  - Taprootによってタイムロックが不要になり、従来のHTLCよりもスワップが速く効率的になる
  - MuSig2によって複数のハッシュロックを同時に使えるようになり、より複雑な複数当事者間のスワップが可能になる
  - 常にプリイメージを公開する従来のHTLCと異なり、Taprootのスワップは暗号学的な秘密を一切明かさずに完了できる
explanation: |
  TaprootとMuSig2は、鍵の集約によってHTLCのプライバシーを大きく向上させます。協調的な「ハッピーパス」では、両者がそれぞれの鍵を1つの集約公開鍵にまとめ、トランザクションに共同で署名します。そのためスワップは通常の支払いと見分けがつかず、ブロックスペースの消費も最小限で、スワップの条件も明かされません。従来のSegWit v0のHTLCではスクリプトのロジック全体をオンチェーンで公開する必要があったため、簡単に識別でき、手数料も高くなっていました。他の選択肢は誤りです。タイムロックは安全性のために今も不可欠であり、複数のハッシュロックが重要な革新というわけではなく、資金を受け取る際にはプリイメージが今も明かされます。