question: Quelle est la critique principale adressée à l'analyse de Marx ?
answer: Marx a une vision erronée de la nature du profit et de l'exploitation.
wrong_answers:
  - Marx ne prend pas en compte le rôle des institutions politiques dans l'histoire.
  - Marx sous-estime l'importance de l'innovation et du progrès technique.
  - Marx surestime l'influence de la religion sur les structures économiques.
explanation: |
  La critique principale de l'analyse de Marx porte sur sa compréhension erronée du profit et de l'exploitation. Le profit compense l'entrepreneur pour le risque pris, et dans un marché concurrentiel, l'emploi repose sur un accord volontaire, non sur la coercition.
reviewed: true
