question: "ارزش‌های محوری میانه‌گرایی چیستند؟"
answer: "اعتدال، مصالحه، انطباق، و منفعت عمومی"
wrong_answers:
  - "سنت، نظم، اقتدار، و هویت ملی"
  - "آزادی، مالکیت خصوصی، رضایت، و مسئولیت فردی"
  - "برابری، عدالت اجتماعی، همبستگی، و مالکیت جمعی"
explanation: >-
  ارزش‌های محوری میانه‌گرایی عبارت‌اند از اعتدال، مصالحه، انطباق، و منفعت عمومی. این‌ها تأکید میانه‌گرایانه بر توازن عمل‌گرایانه را بازتاب می‌دهند، نه تعهد ایدئولوژیک. گزینه‌های دیگر به‌ترتیب ارزش‌های محوری محافظه‌کاری، لیبرتارینیسم، و سوسیالیسم را توصیف می‌کنند.
reviewed: false
