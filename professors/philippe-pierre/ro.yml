bio: |
  Philippe Pierre a lucrat mulți ani ca administrator de baze de date și administrator de sisteme Unix/Linux. A predat rețele la CNAM (Paris). A fost, de asemenea, angajat ca inginer de infrastructură într-un laborator farmaceutic și administrator al unui cluster de calcul HPC. Era foarte familiarizat cu mediile GNU/Linux în context corporativ și cu sistemele de înaltă disponibilitate. Îi plăcea să își împărtășească experiența.
  
short_bio: Administrator de baze de date și administrator de sisteme Unix/Linux
