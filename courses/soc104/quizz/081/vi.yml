question: "Bất đồng then chốt giữa những người libertarian và các họ chính trị khác là gì khi họ chia sẻ cùng các mục tiêu?"
answer: "Bất đồng nằm ở phương tiện: những người libertarian bác bỏ các giải pháp cưỡng chế và ủng hộ trao đổi tự nguyện thông qua tiến trình thị trường"
wrong_answers:
  - "Bất đồng nằm ở mục đích: những người libertarian theo đuổi các mục tiêu khác như của cải cá nhân thay vì phúc lợi xã hội"
  - "Bất đồng nằm ở thời điểm: những người libertarian muốn đạt cùng các mục tiêu đó chậm hơn thông qua cải cách dần dần"
  - "Bất đồng nằm ở phạm vi: những người libertarian muốn áp dụng cùng các chính sách đó chỉ ở cấp địa phương thay vì cấp quốc gia"
explanation: >-
  Những người libertarian có thể đồng ý với những người xã hội chủ nghĩa, bảo thủ và trung dung về một số mục tiêu như bảo vệ người bị áp bức hoặc thúc đẩy gắn kết xã hội. Bất đồng không nằm ở mục đích mà nằm ở phương tiện. Những người libertarian bác bỏ mọi giải pháp cưỡng chế tìm cách đồng nhất hóa các thực hành và quy định, thay vào đó bảo vệ quyền lựa chọn và tự do có trách nhiệm thông qua trao đổi tự do, phi tập trung, dựa trên các hợp đồng tự nguyện.
