question: Comment l'industrialisation a-t-elle affecté les conditions de vie des travailleurs ?
answer: Elle a créé de nouvelles opportunités et amélioré leur niveau de vie.
wrong_answers:
  - Elle a entraîné une dégradation générale de leurs conditions de vie.
  - Elle a eu des effets différents selon les régions et les secteurs d'activité.
  - L'impact de l'industrialisation sur les travailleurs est trop complexe pour être jugé.
explanation: |
  Selon Mises et Hayek (Capitalisme et historiens), l'industrialisation a créé de nouvelles opportunités et élevé le niveau de vie : les emplois en usine, bien que misérables selon nos critères, représentaient la meilleure option disponible et ont sorti la population excédentaire de la pauvreté préindustrielle. La "légende noire" marxiste d'une dégradation générale est contredite par les faits historiques.
reviewed: true
