question: "Itandukaniro Karl Popper ashiraho hagati y'ibibano vyuguruye n'ivyugarijwe rifitaniye isano gute n'impaka za individualism na collectivism?"
answer: "Ikibano cuguruye cemera uburenganzira bw'umuntu bwo kwicira urubanza biciye mu ngingo ziwe bwite, mu gihe ikibano cugarijwe ari collectivist, gishingiye ku vyiyumviro vy'umuryango wa kera no ku kwanka ubwisanzure bwo kunegura"
wrong_answers:
  - "Ikibano cuguruye ni icemerera urudandazwa rwisanzuye kurenga imbibe z'ibihugu, mu gihe ikibano cugarijwe gishiraho amahoro y'ibicuruzwa biva hanze n'amapolitike y'ubutunzi akingira isoko ryaco"
  - "Ikibano cuguruye gitwarwa na demokarasi itaziguye aho umunyagihugu wese atora, mu gihe ikibano cugarijwe gitwarwa n'umwami umwe aragwa ingoma"
  - "Ikibano cuguruye gisohora ku mugaragaro inyandiko zose za leta, mu gihe ikibano cugarijwe kigira amakuru amabanga ya leta"
explanation: >-
  Popper yasiguye ikibano cugarijwe nk'ikibano c'ubumaji canke c'umuryango wa kera, ikibano cuguruye na co nk'ico abantu bahura n'ingingo zabo bwite. Ikibano cugarijwe ni collectivist, gishingiye ku vyiyumviro vy'umuryango wa kera hamwe no kwanka ubwisanzure bwo kunegura no gushira hejuru urutonde rudahinduka. Ikibano cuguruye giha ubukuru uguhitamwo kwidegemvya kw'indangagaciro, ivyizerwa, n'imigenderanire, kigashira mu ngiro ku buryo butaziguye ingingo za individualist.
