question: "Rothbard는 왜 libertaires의 인간 본성관을 비판했으며, 어떤 대안을 제시했나요?"
answer: "그들이 순진한 '고결한 야만인' 관점을 지녔다고 비판하며, 사회는 사유 재산과 좋은 인센티브를 사용해 자기이익적 행동을 이끌어야 한다고 주장했습니다"
wrong_answers:
  - "그들의 인간 협력 이해를 칭찬했지만, 계약 집행을 위해 최소국가는 여전히 필요하다고 주장했습니다"
  - "인간이 본래 선하다는 데 동의했지만, 자유시장만이 그 선함을 생산적 활동으로 연결할 수 있다고 고집했습니다"
  - "개인 권리에 대한 그들의 강조를 거부하고, 대신 공동체가 도덕 기준을 집단적으로 정의해야 한다고 주장했습니다"
explanation: >-
  Rothbard는 libertaires가 인간 본성을 본래 선한 것으로 보는 순진하고 Rousseau식인 비전을 채택했다고 비판했습니다. 그는 대신 사람들이 자기이익에 의해 이끌리며, 사회는 좋은 인센티브가 행동을 이끌도록 조직되어야 한다고 주장했습니다. 이를 위해서는 사유 재산을 인정하고 보장해야 합니다. 국가를 폐지한다는 것은 국가의 기능을 폐지한다는 뜻이 아닙니다. 경찰과 사법은 경쟁을 통해 자유시장이 관리해야 합니다.
