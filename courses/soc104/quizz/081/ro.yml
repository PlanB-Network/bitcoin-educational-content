question: "De ce s-a dovedit profetică predicția lui Molinari din 1849 privind relația dintre libertate și puterea politică?"
answer: "Pentru că conservatorii și socialiștii au alternat la putere și au instrumentalizat libertatea în serviciul obiectivelor lor politice respective, exact așa cum a descris el"
wrong_answers:
  - "Pentru că personajul economist pe care l-a descris a ajuns în cele din urmă la putere politică și a implementat politici libertariene în toată Europa"
  - "Pentru că predicția sa că toate cele trei familii politice vor fuziona într-o singură mișcare centristă s-a adeverit în secolul al XX-lea"
  - "Pentru că libertatea a fost extinsă treptat de guverne succesive până când a devenit principiul organizator principal al democrațiilor moderne"
explanation: >-
  Viziunea lui Molinari s-a dovedit profetică deoarece, de la mijlocul secolului al XIX-lea, conservatorii și socialiștii au alternat la putere și au realizat exact ceea ce a descris el: instrumentalizarea libertății în serviciul obiectivelor politice. Ambele familii sunt dispuse să restrângă libertățile și să apeleze la stat pentru a-și impune agendele respective, în timp ce poziția economistului, a libertății necondiționate, a rămas marginalizată.
reviewed: false
