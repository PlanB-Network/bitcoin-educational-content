question: Ktorý minister sa na konci 17. storočia stal pre štátnikov vzorom v ekonomických otázkach?
answer: Colbert
wrong_answers:
  - Turgot
  - Sully
  - Mazarin
explanation: |
  Colbert, minister financií Ľudovíta XIV., vtlačil svojej dobe pečať intervencionistickou hospodárskou politikou známou ako colbertizmus, ktorej cieľom bolo rozvíjať francúzsky priemysel a obchod. Jeho konanie slúžilo ako vzor mnohým európskym štátnikom.
