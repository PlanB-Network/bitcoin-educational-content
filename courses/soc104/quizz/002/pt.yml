question: "Por que o eixo esquerda-direita é considerado inadequado para situar pensadores liberais clássicos como Bastiat ou Ron Paul?"
answer: "Porque o liberalismo clássico valoriza tanto as liberdades econômicas quanto as pessoais, que nem a esquerda nem a direita abraçam plenamente"
wrong_answers:
  - "Porque os liberais clássicos sempre se alinham com políticas econômicas de direita e rejeitam todas as posições de esquerda"
  - "Porque os liberais clássicos são centristas que adotam versões moderadas das ideologias de esquerda e de direita"
  - "Porque os liberais clássicos se opõem a todas as formas de governo, o que os torna anarquistas em vez de pensadores políticos"
explanation: >-
  O eixo esquerda-direita falha para os liberais clássicos porque não consegue acomodar uma posição que defende simultaneamente a liberdade econômica (tipicamente de direita) e a liberdade pessoal (tipicamente de esquerda). Os liberais clássicos não são centristas em busca de compromisso, nem são anarquistas ou puramente de direita. Eles simplesmente não se encaixam em um espectro unidimensional.
