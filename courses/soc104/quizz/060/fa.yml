question: "چه پارادوکس پنهانی در عمل‌گرایی میانه‌گرایانه نهفته است؟"
answer: "خود عمل‌گرایی بر شکلی از جزم‌گرایی استوار است، یعنی این باور ناگفته که تنها کارشناسان صلاحیت هدایت جامعه را دارند"
wrong_answers:
  - "میانه‌گرایان ادعا می‌کنند معتدل‌اند اما در دولت‌های ائتلافی همواره با احزاب چپ‌گرا همسو می‌شوند"
  - "سیاست‌های میانه‌گرا متوازن به نظر می‌رسند اما همیشه رشد اقتصادی را بر حفاظت از محیط زیست ترجیح می‌دهند"
  - "میانه‌گرایان ایدئولوژی را رد می‌کنند اما هنگام تصمیم‌گیری اقتصادی اصول سخت‌گیرانه بازار آزاد را می‌پذیرند"
explanation: >-
  پارادوکس عمل‌گرایی میانه‌گرایانه این است که ادعا می‌کند ایدئولوژی را به نفع تخصص عقلانی رد می‌کند، اما همین ادعا بر جزمی نامرئی و ناگفته استوار است: این‌که فقط تکنوکرات‌ها قادر به گرفتن تصمیم‌های درست‌اند. این باور که فقط کارشناسان باید جامعه را هدایت کنند، خود یک تعهد ایدئولوژیک است، حتی اگر میانه‌گرایان آن را چنین نشناسند.
reviewed: false
