question: "Miten kulttuurisesti konservatiivinen libertaristi suhtautuu käyttäytymiseen, jota hän moraalisesti paheksuu?"
answer: "Hän vastustaa ja hillitsee tällaista käyttäytymistä suostuttelun ja esimerkin avulla, mutta turvautumatta lain pakkovoimaan"
wrong_answers:
  - "Hän kannattaa paikallishallinnon kieltoja tällaiselle käyttäytymiselle mutta vastustaa liittovaltiotason kieltoja"
  - "Hän vaikenee tällaisesta käyttäytymisestä täysin, koska uskoo kaiken paheksunnan rikkovan yksilönvapautta"
  - "Hän kannattaa yhteisötribunaaleja, jotka voivat rangaista tällaisesta käyttäytymisestä muodollisen oikeusjärjestelmän ulkopuolella"
explanation: >-
  Kulttuurisesti konservatiivinen libertaristi voi paheksua moraalisesti tiettyä käyttäytymistä, mutta ei kannata yhteisymmärrykseen perustuvien, ei-aggressiivisten tekojen laillista kieltoa. Hän voi inhota tällaisia tekoja, vastustaa niitä ja aktiivisesti hillitä niitä, mutta aina suostuttelun, kasvatuksen ja esimerkin kautta eikä lain pakkovoiman avulla. Tässä ei ole kyse vaikenemisesta tai vaihtoehtoisten täytäntöönpanomekanismien luomisesta.
