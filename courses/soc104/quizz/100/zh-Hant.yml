question: "本課程指出，超越傳統左—右—中光譜的真正政治分歧是什麼？"
answer: "基本哲學原則之間的分歧：自由或強制、自願同意或脅迫、負責任的個人或集體"
wrong_answers:
  - "富裕國家與貧窮國家之間，圍繞國際貿易協定與全球金融機構控制權的分歧"
  - "都市人口與農村人口之間，圍繞政府支出優先事項與基礎設施投資的分歧"
  - "進步文化與傳統文化之間，圍繞社會規範、家庭價值與宗教教育的分歧"
explanation: >-
  本課程主張，真正的政治分歧不在於傳統的左、右、中標籤，而在於基本哲學原則：自由或強制、自願同意或脅迫、負責任的個人或集體。思考政治的正確方式，是從倫理原則出發，而不是從標籤出發。
reviewed: false
