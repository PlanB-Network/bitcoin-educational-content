question: Quelle est la portée de la révolution éthique apportée par la Bible ?
answer: Elle pose les fondements d'un universalisme moral reconnaissant la valeur égale de chaque être humain.
wrong_answers:
  - Elle conduit à une nouvelle conception de la justice basée sur l'égalité et la compassion.
  - Elle établit un ensemble de lois alimentaires et rituelles régissant la vie quotidienne.
  - Elle remet en question l'acceptation passive de la souffrance et encourage l'action pour la soulager.
explanation: |
  La Bible a introduit un universalisme moral reconnaissant la valeur égale de chaque être humain, fondé sur l'idée que tous sont créés à l'image de Dieu, ce qui a transformé le rapport au mal et à la souffrance et posé les bases des droits de l'homme universels.
reviewed: true
