question: "O que é conservadorismo cultural?"
answer: "Uma adesão pessoal a valores familiares, morais, estéticos e metafísicos herdados do passado, não uma filosofia política"
wrong_answers:
  - "Uma ideologia política que usa o poder do Estado para impor valores tradicionais a toda a sociedade por meio da legislação"
  - "Um movimento que rejeita todas as formas de modernidade e busca devolver a sociedade a um modo de vida pré-industrial"
  - "Uma doutrina econômica que protege indústrias nacionais e se opõe ao livre comércio com países estrangeiros"
explanation: >-
  O conservadorismo cultural é definido como uma sabedoria de vida: a adesão pessoal a valores familiares, morais, estéticos e metafísicos herdados do passado, sejam greco-romanos ou judaico-cristãos. Ele explicitamente não é uma filosofia política. Difere do conservadorismo político, que visa preservar instituições políticas e a ordem social por meio do poder estatal. Também não se trata de rejeitar a modernidade nem de protecionismo econômico.
