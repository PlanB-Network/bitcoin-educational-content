question: "موضع سوسیالیستی درباره مراقبت سلامت چیست؟"
answer: "دسترسی به مراقبت سلامت یک حق بنیادی است، و دولت باید نظامی همگانی و با تأمین مالی عمومی را برای همه، فارغ از درآمد، تضمین کند"
wrong_answers:
  - "مراقبت سلامت باید نظامی مختلط باشد که در آن پوشش پایه دولتی با گزینه‌های بیمه خصوصی تکمیل شود"
  - "بازارهای خصوصی مراقبت سلامت نوآورانه‌تری ارائه می‌دهند، بنابراین افراد باید آزادانه نظام خود را انتخاب کنند"
  - "دولت باید مراقبت سلامت را فقط برای فقیرترین شهروندان فراهم کند، در حالی که بیمه خصوصی بقیه را پوشش می‌دهد"
explanation: >-
  برای سوسیالیست‌ها، دسترسی به مراقبت سلامت یک حق بنیادی است، نه یک کالا. دولت باید نظام مراقبت سلامت همگانی و با تأمین مالی عمومی را تضمین کند تا همه، فارغ از درآمد، به مراقبت دسترسی داشته باشند. این امر دغدغه سوسیالیستی برای برابری، عدالت اجتماعی و اهمیت دولت در سازمان‌دهی خدمات در راستای منفعت عمومی را بازتاب می‌دهد. نظام مختلط دیدگاه میانه‌رو را توصیف می‌کند، در حالی که رویکردهای مبتنی بر انتخاب بازتاب‌دهنده مواضع لیبرتارین و محافظه‌کارانه‌اند.
reviewed: false
