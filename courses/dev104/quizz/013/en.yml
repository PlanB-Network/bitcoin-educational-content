question: Which HTML element is specifically mentioned as the appropriate choice for navigation sections in the Bitcoin blog project?
answer: <nav>
wrong_answers:
  - <menu>
  - <header>
  - <section>
explanation: |
  The <nav> element is the correct semantic HTML element for navigation sections. In the Bitcoin blog project, it's specifically used to contain the navigation link back to more articles. While <header>, <section>, and <menu> are valid HTML elements, they serve different purposes. <header> is for introductory content, <section> is for thematic groupings of content, and <menu> is for interactive lists. Using <nav> for navigation follows semantic HTML best practices, making the code more meaningful and accessible.
