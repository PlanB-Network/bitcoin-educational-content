question: Dove viene spesso messo il focus nei libri di testo di storia tradizionali?
answer: Sulle conquiste militari e sulle biografie dei leader
wrong_answers:
  - Sullo sviluppo di idee e dei movimenti filosofici
  - Sulle lotte per la libertà e i sui diritti individuali
  - Sugli avanzamenti scientifici e tecnologici
explanation: |
  Nei libri di testo di storia tradizionali, l'accento è spesso posto sulle conquiste militari e le biografie dei leader, trascurando così l'impatto delle idee, dei movimenti sociali e degli avanzamenti in altri settori.
reviewed: false
