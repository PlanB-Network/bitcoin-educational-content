question: "Wat is het concept van 'moreel risico' in de context van het debat over subsidies, en welke politieke familie brengt deze zorg naar voren?"
answer: "Moreel risico is de prikkel tot onverantwoordelijkheid wanneer bedrijven via subsidies worden verhinderd failliet te gaan, omdat uiteindelijk de belastingbetaler betaalt; deze zorg wordt door libertariërs naar voren gebracht"
wrong_answers:
  - "Moreel risico is het risico dat gesubsidieerde bedrijven verhuizen naar landen met lagere belastingen en banen meenemen; deze zorg wordt door conservatieven naar voren gebracht"
  - "Moreel risico is het gevaar dat overheidsfunctionarissen corrupt worden door te kiezen welke bedrijven subsidies krijgen; deze zorg wordt door centristen naar voren gebracht"
  - "Moreel risico is het ethische probleem dat bedrijven werknemers uitbuiten nadat ze publieke middelen hebben ontvangen; deze zorg wordt door socialisten naar voren gebracht"
explanation: >-
  Libertariërs stellen dat subsidies en bailouts moreel risico creëren: wanneer bedrijven worden verhinderd failliet te gaan, stimuleert dit onverantwoordelijkheid en roekeloosheid omdat er geen gevolgen zijn voor slechte beslissingen. Uiteindelijk is het de belastingbetaler die betaalt, wat libertariërs diep onrechtvaardig vinden. Dit concept verschilt van zorgen over bedrijfsverplaatsing, ambtelijke corruptie of uitbuiting van werknemers die door andere politieke families naar voren worden gebracht.
reviewed: false
