question: Vo svojej lettre sur la marque des fers Turgot vyjadruje myšlienku, že nie je možné vedieť to lepšie ako trh. Ktorý rakúsky ekonóm ju rozvinul v 20. storočí?
answer: Friedrich Hayek
wrong_answers:
  - Carl Menger
  - Murray Rothbard
  - Ludwig von Mises
explanation: |
  Hayek rozvinul myšlienku "price discovery" trhom, podľa ktorej je trh procesom objavovania informácií a ceny sú výsledkom interakcie ponuky a dopytu.
