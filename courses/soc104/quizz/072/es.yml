question: "¿Por qué la postura libertaria sobre la legalización de las drogas viene acompañada de la condición de que debe reducirse el papel del Estado en la sociedad?"
answer: "Porque una liberalización asumida por el Estado reemplazaría la responsabilidad individual por una atención gestionada por el gobierno, mientras que los libertarios quieren que los ciudadanos asuman las consecuencias de sus elecciones con apoyo de asociaciones privadas"
wrong_answers:
  - "Porque una legalización controlada por el Estado generaría demasiados ingresos fiscales, haciendo al gobierno excesivamente poderoso y corrupto"
  - "Porque el Estado impondría estándares de calidad que elevarían los precios y recrearían mercados negros"
  - "Porque la regulación gubernamental de las drogas violaría acuerdos comerciales internacionales y relaciones diplomáticas"
explanation: >-
  Los libertarios apoyan la liberalización de las drogas, pero insisten en que el papel del Estado debe reducirse porque su objetivo es restaurar la responsabilidad individual, no ampliar la gestión estatal. Si alguien se vuelve dependiente, debe asumir la responsabilidad en lugar de pedir al Estado que proporcione atención. La solución a la adicción reside en la iniciativa privada: apoyo voluntario de individuos, familias y asociaciones caritativas. Una legalización gestionada por el Estado contradiría el principio libertario fundamental de responsabilidad personal.
