question: "Hva mente Ludwig von Mises da han skrev at bare individet tenker, resonnerer og handler?"
answer: "At kollektiver som staten eller en nasjon ikke har noen egen eksistens utover handlingene til sine individuelle medlemmer"
wrong_answers:
  - "At individer bør unngå å danne grupper eller foreninger fordi kollektiv handling alltid er skadelig"
  - "At bare visse begavede individer er i stand til rasjonell tanke, mens de fleste mennesker følger instinkt"
  - "At tenkning og resonnering er private aktiviteter som aldri bør deles eller diskuteres offentlig"
explanation: >-
  Mises klargjorde at individualisme står i motsetning til forestillingen om at sosiale enheter som samfunnet eller nasjonen kan eksistere uavhengig av individene som utgjør dem. Et kollektiv har ingen egen eksistens utover handlingene til sine individuelle medlemmer. Vi kan ikke meningsfullt snakke om statens eller et selskaps handling fordi disse enhetene ikke har egen vilje eller tanke og handler bare gjennom individer.
reviewed: false
