question: "W pięciu debatach społecznych (małżeństwo, imigracja, broń palna, narkotyki, słodzone napoje), jaki powtarzający się schemat analityczny kształtuje stanowisko socjalistyczne w każdej kwestii?"
answer: "Schemat konfliktu między dominującymi a zdominowanymi, w którym społeczeństwo jest ustrukturyzowane przez opresję, a państwo musi interweniować, aby chronić grupę szczególnie narażoną"
wrong_answers:
  - "Schemat utylitarny skoncentrowany na maksymalizacji ogólnego szczęścia i produktywności gospodarczej dla jak największej liczby obywateli"
  - "Schemat praw naturalnych, w którym wolności jednostki muszą być chronione zarówno przed ingerencją państwa, jak i korporacji"
  - "Schemat tradycjonalistyczny, w którym utrwalone instytucje społeczne muszą być zachowane przed destabilizującymi nowoczesnymi zmianami"
explanation: >-
  Stanowisko socjalistyczne w debatach społecznych jest konsekwentnie kształtowane przez schemat konfliktu dominujących i zdominowanych. W sprawie małżeństwa chodzi o heteroseksualną większość uciskającą homoseksualną mniejszość. W sprawie imigracji ograniczenia oparte na narodowości są formami opresji. W sprawie broni palnej tylko państwo powinno dysponować siłą, aby chronić osoby szczególnie narażone. W sprawie słodzonych napojów przemysłowcy czerpią zysk ze szczególnej podatności najmniej chronionych. Ta perspektywa uciskającego i uciskanego powtarza się w licznych dziedzinach, w tym płci, rasie, a nawet relacji między ludzkością a naturą.
reviewed: false
