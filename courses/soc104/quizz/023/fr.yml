question: "Que signifie le terme 'libéral' dans la tradition politique européenne ?"
answer: "Un partisan de l'économie du laissez-faire, de la réduction de l'intervention de l'État et des libertés individuelles"
wrong_answers:
  - "Un défenseur de l'intervention de l'État, de l'assurance maladie publique et des programmes de lutte contre la pauvreté"
  - "Un anarchiste radical qui cherche l'abolition complète du gouvernement et de la propriété privée"
  - "Un centriste qui équilibre également les positions socialistes et conservatrices dans tous les domaines politiques"
explanation: >-
  En Europe, le libéralisme est resté associé aux politiques économiques de laissez-faire, à la réduction de l'intervention de l'État et à la défense des libertés individuelles. La première mauvaise réponse décrit les liberals américains, qui ont déplacé le sens du terme vers l'interventionnisme. Le libéralisme européen n'est ni l'anarchisme ni le centrisme.
reviewed: false
