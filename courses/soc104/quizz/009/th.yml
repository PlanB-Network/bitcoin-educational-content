question: "ทำไมแกนตั้ง (บน-ล่าง) จึงถือว่าพื้นฐานกว่าแกนนอน (ซ้าย-ขวา) ใน Nolan diagram?"
answer: "เพราะมันเผยเส้นแบ่งที่แท้จริงระหว่างผู้ที่ปกป้องเสรีภาพส่วนบุคคลสูงสุดกับผู้ที่สนับสนุนการควบคุมโดยรัฐสูงสุด"
wrong_answers:
  - "เพราะมันวัดผลผลิตทางเศรษฐกิจได้แม่นยำกว่าแกนนอนที่วัดนโยบายสังคม"
  - "เพราะความขัดแย้งทางการเมืองส่วนใหญ่ตลอดประวัติศาสตร์เป็นเรื่องอัตลักษณ์ทางวัฒนธรรมมากกว่าการปกครอง"
  - "เพราะแกนนอนใช้ได้เฉพาะกับประชาธิปไตยสมัยใหม่ ขณะที่แกนตั้งเป็นสากล"
explanation: >-
  แกนพื้นฐานคือแกนตั้ง เพราะมันจับคำถามทางการเมืองที่สำคัญที่สุด: รัฐควรควบคุมการกระทำของมนุษย์ในระดับใด? แกนซ้าย-ขวาเพียงสะท้อนความโน้มเอียงที่แตกต่างกัน (ความยุติธรรมทางสังคมเทียบกับจารีต) แต่ทั้งสองฝ่ายสามารถอยู่ในตำแหน่งเดียวกันบนแกนตั้งในฐานะรัฐนิยมได้ แกนตั้งเผยให้เห็นว่าบางคนต้องการบังคับใช้วิสัยทัศน์ของตนด้วยกำลัง หรือเคารพเสรีภาพส่วนบุคคล
reviewed: false
