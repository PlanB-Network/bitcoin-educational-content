question: "Kant의 표어 'Sapere aude'는 사람들에게 무엇을 하라고 격려하나요?"
answer: "스스로 생각할 용기를 내고, 우월한 권위의 지시에 의존하는 미성년 상태에서 벗어나라고 격려합니다"
wrong_answers:
  - "공식 교육기관에 등록하고 자격증을 취득함으로써 학문적 지식을 추구하라고 격려합니다"
  - "모든 형태의 도덕에 도전하고 개인적 욕망에 기초한 완전히 새로운 윤리 체계를 만들라고 격려합니다"
  - "종교적 헌신과 교회의 가르침에 대한 복종을 통해 지혜를 찾으라고 격려합니다"
explanation: >-
  Sapere aude는 "스스로 생각할 용기를 가져라"라는 뜻으로, Kant가 시인 Horace에게서 가져와 계몽주의의 표어로 삼은 말입니다. 그것은 미성년 상태, 즉 사람들이 우월한 계급이나 권위의 지시 없이 자신의 이해력을 사용할 수 없는 상태에서 벗어남을 상징합니다. Kant는 해방과 자기 자신의 생각에 대한 완전한 책임을 격려합니다.
reviewed: false
