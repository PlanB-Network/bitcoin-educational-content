question: De ce a fost în cele din urmă abandonată aplicarea ideilor fiziocratice în Germania?
answer: Funcționarii publici existenți s-au arătat reticenți
wrong_answers:
  - Populația nu a fost foarte susținătoare
  - Margraful de Baden, inițial adept al fiziocrației, și-a retras în cele din urmă sprijinul
  - Clima nu era favorabilă agriculturii
explanation: |
  Opoziția funcționarilor publici în funcție, atașați de privilegiile și obiceiurile lor, a împiedicat aplicarea ideilor fiziocratice în Germania. Aceștia se temeau că reformele propuse le vor amenința puterea și influența.
