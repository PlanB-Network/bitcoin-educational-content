question: "Prinsip panduan apa yang mendorong suara Frederic Bastiat di Majelis Nasional?"
answer: "Promosi kebebasan individu dan ekonomi serta pengurangan campur tangan pemerintah"
wrong_answers:
  - "Pembelaan terhadap otoritas kerajaan dan pelestarian tradisi monarki"
  - "Pemajuan kebijakan sosialis untuk mendistribusikan kembali kekayaan secara lebih merata"
  - "Strategi sentris berupa kompromi antara faksi kiri dan kanan"
explanation: >-
  Bastiat memberikan suara berdasarkan satu prinsip mendasar: mempromosikan kebebasan individu dan ekonomi sambil mengurangi campur tangan pemerintah. Ia bukan oportunis sentris, bukan pula royalis atau sosialis. Ia memberikan suara bersama pihak mana pun yang mengusulkan langkah-langkah yang selaras dengan kebebasan dan pemerintahan terbatas.
