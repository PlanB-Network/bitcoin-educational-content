question: Pe care economist l-a lăudat Turgot?
answer: Vincent de Gournay
wrong_answers:
  - François Quesnay
  - Marchizul d'Argenson
  - Adam Smith
explanation: |
  Turgot a scris un elogiu al lui Vincent de Gournay, subliniind rolul acestuia de pionier al liberalismului economic și influența sa asupra gândirii economice franceze.
