question: "What distinguishes neoconservatives from paleoconservatives in their approach to foreign policy?"
answer: "Neoconservatives justify military interventionism to spread democracy, while paleoconservatives defend a more isolationist foreign policy"
wrong_answers:
  - "Neoconservatives oppose all military action and favor diplomacy, while paleoconservatives support preemptive strikes against potential threats"
  - "Neoconservatives focus exclusively on economic sanctions, while paleoconservatives advocate building international coalitions for joint military operations"
  - "Neoconservatives and paleoconservatives agree on foreign policy but differ sharply on domestic economic regulation"
explanation: >-
  From the 2000s onward, neoconservatives became increasingly involved in justifying military interventionism to implant democracy around the world, particularly after September 11, 2001. In reaction, traditional conservatives claimed the label 'paleoconservative' to distinguish themselves. Paleoconservatives criticize military interventionism, defend a more isolationist foreign policy, and place greater emphasis on national and cultural identity.
reviewed: false
