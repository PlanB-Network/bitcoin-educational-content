question: "Какво характеризира долната част на оста на личната свобода върху диаграмата на Нолан?"
answer: "Предпочитание към ред, сигурност, традиционни ценности и държавата да регулира морала и да поддържа обществения ред"
wrong_answers:
  - "Предпочитание към индивидуална автономия, толерантност и минимална държавна намеса в изборите в личния живот"
  - "Предпочитание към икономическа дерегулация, свободна търговия и премахване на мита и субсидии"
  - "Предпочитание към преразпределение на богатството, високи данъци и национализация на ключови индустрии"
explanation: >-
  Долната част на оста на личната свобода представлява максимален държавен контрол върху личния живот, характеризиращ се с предпочитание към ред, сигурност и традиционни ценности. Държавата регулира морала, поддържа обществения ред и може да защитава конкретна визия за морал или традиция. Горната част на оста представлява противоположното: индивидуална свобода и толерантност. Икономическите политики се измерват върху отделната хоризонтална ос.
