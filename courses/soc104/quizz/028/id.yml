question: "Apa itu konservatisme politik?"
answer: "Ideologi yang bertujuan mempertahankan institusi politik yang mapan dan tatanan sosial, serta menentang pergolakan struktural besar"
wrong_answers:
  - "Komitmen pribadi pada nilai-nilai keluarga tradisional dan praktik keagamaan tanpa berupaya memaksakannya kepada orang lain"
  - "Filsafat yang mempromosikan perubahan sosial cepat melalui reformasi demokratis dan legislasi progresif"
  - "Teori ekonomi yang menganjurkan pasar bebas, pajak minimal, dan penghapusan hambatan perdagangan"
explanation: >-
  Konservatisme politik adalah ideologi, sering diwakili oleh partai kanan atau kanan jauh, yang bertujuan mempertahankan institusi politik yang mapan dan tatanan sosial sambil menentang pergolakan struktural besar. Para pendukungnya ingin menggunakan kekuasaan dan hukum untuk melindungi warisan mereka. Ini berbeda dari konservatisme budaya, yang merupakan pilihan hidup pribadi, bukan program politik.
