question: "В петте обществени дебата (брак, имиграция, огнестрелни оръжия, наркотици, сладки напитки) каква повтаряща се аналитична рамка оформя социалистическата позиция по всеки въпрос?"
answer: "Рамка на конфликт между доминиращи и доминирани, при която обществото е структурирано от потисничество и държавата трябва да се намеси, за да защити уязвимата група"
wrong_answers:
  - "Утилитаристка рамка, фокусирана върху максимизирането на общото щастие и икономическата продуктивност за най-голям брой граждани"
  - "Рамка на естествените права, при която индивидуалните свободи трябва да бъдат защитавани както от държавна, така и от корпоративна намеса"
  - "Традиционалистка рамка, при която установените социални институции трябва да бъдат запазени срещу разрушителни модерни промени"
explanation: >-
  Социалистическата позиция в обществените дебати последователно се оформя от конфликтна рамка доминиращи/доминирани. При брака това е хетеросексуално мнозинство, потискащо хомосексуално малцинство. При имиграцията ограниченията въз основа на националност са форми на потисничество. При огнестрелните оръжия само държавата трябва да държи силата, за да защитава уязвимите. При сладките напитки индустриалците печелят от уязвимостта на най-слабо защитените. Тази призма потисник/потиснат се възпроизвежда в множество области, включително пол, раса и дори отношението между човечеството и природата.
reviewed: false
