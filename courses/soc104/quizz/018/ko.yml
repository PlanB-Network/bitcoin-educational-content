question: "놀런 프레임워크에서 제시되는 국가주의의 정의는 무엇인가요?"
answer: "문명, 노동자 계급, 자연, 또는 억압받는 이들을 방어한다는 명목이든, 입법을 사용해 사회를 통제하고 형성하는 것입니다"
wrong_answers:
  - "선출직 공직자가 정해진 임기를 수행하고 권력이 민주적 선거를 통해 이양되는 정부 체제입니다"
  - "강한 군대만이 한 국가의 주권과 영토 보전을 지킬 수 있다는 믿음입니다"
  - "관세와 할당량을 통해 외국 경쟁보다 국내 산업을 우선시하는 경제 철학입니다"
explanation: >-
  국가주의는 입법을 사용해 사회를 통제하고 형성하는 것으로 정의됩니다. 좌파와 우파 모두 이를 실천합니다. 어떤 이들은 문명을 방어한다는 명목으로, 다른 이들은 노동자 계급, 자연, 또는 억압받는 이들을 방어한다는 명목으로 그렇게 합니다. 중도주의자들조차 자신에게 맞을 때는 이를 승인합니다. 국가주의는 군사 정책, 무역 보호주의, 또는 단순히 선출된 정부를 갖는 것에 한정되지 않습니다.
reviewed: false
