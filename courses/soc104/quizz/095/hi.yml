question: "Course Bitcoin को right-wing या left-wing project के बजाय state money के opposed market currency के रूप में क्यों describe करता है?"
answer: "क्योंकि Bitcoin voluntarily adopted, hard-to-produce, decentralized currency है जो value retain करती है, coercive, centralized fiat money के contrast में जो value lose करती है; इसलिए divide political ideology के बजाय market versus state के बारे में है"
wrong_answers:
  - "क्योंकि Bitcoin एक anonymous developer द्वारा बनाया गया था जिसने उसके intended purpose या philosophy के बारे में कोई political statements देने से deliberately avoid किया"
  - "क्योंकि Bitcoin का mining algorithm सभी political parties को new coins की equal distribution ensure करता है, monetary system में किसी भी ideological bias को prevent करता है"
  - "क्योंकि Bitcoin existing fiat currencies की तरह ही function करता है लेकिन faster payment network पर operate करता है, जिससे political distinctions irrelevant हो जाते हैं"
explanation: >-
  Bitcoin को money की politicization के खिलाफ peaceful revolt के रूप में describe किया गया है। State या fiat money एक coercive, centralized system है जो value lose करने की tendency रखता है। Market money, historically gold और currently Bitcoin, healthy, hard-to-produce currency है जो voluntarily emerge होती है और long term में अपनी value retain करती है। Real opposition left versus right नहीं, बल्कि market versus state है, जिससे Bitcoin एक political rupture बनता है जो traditional ideological camps को transcend करता है।
reviewed: false
