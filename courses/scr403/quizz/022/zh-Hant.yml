question: "為什麼 bip0340-verify 使用 Failure 副作用，而不是回傳一個布林值（true/false）？"
answer: 為了實現 Schnorr 簽章的批次驗證，在其中只要有一次檢查失敗，整批就失敗。
wrong_answers:
  - 因為布林型別在區塊空間上的成本相較於單位型別太過昂貴。
  - 因為 Simplicity 的型別系統無法表示來自 jet 的布林回傳值。
  - 因為回傳一個普通的布林值會直接違反完備性定理。
explanation: >-
  如果 bip0340-verify 回傳一個布林值，即使簽章檢查失敗，仍可能導向一個腳本成功的分支。在那種情況下，驗證者就必須知道究竟是哪一個特定的簽章失敗了，這將妨礙批次驗證。透過使用 Failure 副作用，一次失敗的檢查總是會中止整個運算，從而實現高效的批次驗證，把許多簽章集中在一起處理。
reviewed: true
