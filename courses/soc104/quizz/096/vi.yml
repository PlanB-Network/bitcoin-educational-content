question: "Vì sao lạm phát tiền tệ được mô tả như một loại thuế ẩn áp đặt mà không có sự đồng thuận của công dân?"
answer: "Vì việc chính phủ tạo tiền làm mất giá đồng tiền khiến người dân mua được ít hơn với cùng một số tiền, nhưng phần lớn không nhận ra rằng giá cả tăng phản ánh chính sách của chính phủ chứ không phải các lực lượng thị trường tự nhiên"
wrong_answers:
  - "Vì các ngân hàng trung ương bí mật thu phí trên mọi giao dịch được xử lý qua hệ thống ngân hàng mà không tiết lộ cho chủ tài khoản"
  - "Vì các chính phủ in tiền và chỉ phân phối cho những cá nhân giàu có, trong khi đánh thuế người nghèo thông qua thuế bán hàng cao hơn trên các hàng hóa thiết yếu"
  - "Vì lạm phát do các tập đoàn tư nhân tăng giá để gia tăng lợi nhuận, điều này vận hành như một loại thuế phi chính thức đánh vào người tiêu dùng"
explanation: >-
  Việc bơm tiền vào hệ thống chuyển hóa thành sự mất giá tiền tệ, trong đó cùng một số tiền mua được ít hơn vì lượng tiền mới không phản ánh tăng trưởng kinh tế thực sự. Phần lớn mọi người không thấy rằng chính sách của chính phủ đã dẫn đến giá cả tăng, vốn đơn giản là phản ánh sự mất giá tiền tệ. Điều này tương đương với trộm cắp hợp pháp và sự tước đoạt được định chế hóa, làm tầng lớp trung lưu nghèo đi trong khi người giàu thu gom lượng tiền mới thông qua các tài sản đầu cơ.
