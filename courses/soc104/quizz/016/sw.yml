question: "Mrengo wa kushoto unataka kutunga sheria na kudhibiti nini?"
answer: "Uchumi, ukichochewa na uhasama dhidi ya uhuru wa kiuchumi, ubepari, na soko huru"
wrong_answers:
  - "Maadili ya binafsi na mazoea ya kidini, yakichochewa na hamu ya kuhifadhi taasisi za jadi"
  - "Uhamiaji na mipaka ya kitaifa, vikichochewa na wasiwasi kuhusu utambulisho wa kitamaduni na mamlaka ya kujitawala"
  - "Teknolojia na uvumbuzi, vikichochewa na hofu kwamba uotomatishaji utachukua nafasi ya wafanyakazi binadamu"
explanation: >-
  Mrengo wa kushoto huipa kipaumbele haki ya kijamii na usawa, hasa katika ngazi ya kiuchumi. Hili hupelekea uhasama wake dhidi ya uhuru wa kiuchumi, ubepari, na soko huru, pamoja na hamu yake ya kutunga sheria na kudhibiti uchumi. Kinyume chake, mrengo wa kulia unataka kutunga sheria kuhusu maadili na dini. Udhibiti wa uhamiaji na teknolojia si lengo kuu lililoelezwa hapa.
