question: "ทำไมจุดยืนลิเบอร์ทาเรียนเรื่องการทำให้ยาเสพติดถูกกฎหมายจึงมาพร้อมเงื่อนไขว่าบทบาทของรัฐในสังคมต้องถูกลดลง?"
answer: "เพราะการเปิดเสรีที่รัฐเข้ายึดครองจะแทนที่ความรับผิดชอบส่วนบุคคลด้วยการดูแลที่รัฐบาลจัดการ ขณะที่ลิเบอร์ทาเรียนต้องการให้พลเมืองแบกรับผลของการเลือกของตน โดยมีการสนับสนุนจากสมาคมเอกชน"
wrong_answers:
  - "เพราะการทำให้ถูกกฎหมายภายใต้การควบคุมของรัฐจะสร้างรายได้ภาษีมากเกินไป ทำให้รัฐบาลมีอำนาจมากเกินและคอร์รัปชัน"
  - "เพราะรัฐจะกำหนดมาตรฐานคุณภาพที่ทำให้ราคาสูงขึ้นและสร้างตลาดมืดขึ้นมาใหม่"
  - "เพราะการกำกับยาเสพติดโดยรัฐบาลจะละเมิดข้อตกลงการค้าระหว่างประเทศและความสัมพันธ์ทางการทูต"
explanation: >-
  ลิเบอร์ทาเรียนสนับสนุนการเปิดเสรียาเสพติด แต่ยืนยันว่าบทบาทของรัฐต้องถูกลดลง เพราะเป้าหมายของพวกเขาคือการฟื้นความรับผิดชอบส่วนบุคคล ไม่ใช่การขยายการจัดการของรัฐ หากใครกลายเป็นผู้พึ่งพา เขาต้องรับผิดชอบแทนที่จะขอให้รัฐให้การดูแล ทางออกต่อการเสพติดอยู่ในความริเริ่มของเอกชน: การสนับสนุนโดยสมัครใจจากปัจเจก ครอบครัว และสมาคมการกุศล การทำให้ถูกกฎหมายแบบรัฐจัดการจะขัดกับหลักลิเบอร์ทาเรียนพื้นฐานเรื่องความรับผิดชอบส่วนบุคคล
reviewed: false
