question: "Что характеризует нижнюю часть оси личной свободы на диаграмме Нолана?"
answer: "Предпочтение порядка, безопасности, традиционных ценностей и государства, регулирующего нравы и поддерживающего общественный порядок"
wrong_answers:
  - "Предпочтение индивидуальной автономии, терпимости и минимального государственного вмешательства в личные жизненные выборы"
  - "Предпочтение экономической дерегуляции, свободной торговли и отмены тарифов и субсидий"
  - "Предпочтение перераспределения богатства, высоких налогов и национализации ключевых отраслей"
explanation: >-
  Нижняя часть оси личной свободы представляет максимальный государственный контроль над личной жизнью, характеризуемый предпочтением порядка, безопасности и традиционных ценностей. Государство регулирует нравы, поддерживает общественный порядок и может защищать определенное видение морали или традиции. Верхняя часть оси представляет противоположное: индивидуальную свободу и терпимость. Экономическая политика измеряется на отдельной горизонтальной оси.
