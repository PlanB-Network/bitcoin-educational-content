question: Aký dôvod uvádza Dupont de Nemours na odloženie vytvorenia asignátov?
answer: Asignáty zvýšia ceny
wrong_answers:
  - Asignáty sa použijú na vedenie útočných vojen
  - Asignáty zničia zahraničný kapitál
  - Asignáty sú porušením vlastníckych práv
explanation: |
  Dupont de Nemours sa obával inflácie, ktorú spôsobia asignáty, papierová mena vydávaná Národným zhromaždením. Veril, že táto inflácia zničí francúzske hospodárstvo.
