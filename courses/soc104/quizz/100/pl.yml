question: "Co kurs wskazuje jako prawdziwy podział polityczny poza tradycyjnym spektrum lewica-prawica-centrum?"
answer: "Podział między fundamentalnymi zasadami filozoficznymi: wolność albo przymus, dobrowolna zgoda albo nakaz, odpowiedzialna jednostka albo kolektyw"
wrong_answers:
  - "Podział między narodami bogatymi i biednymi o kontrolę nad międzynarodowymi umowami handlowymi i globalnymi instytucjami finansowymi"
  - "Podział między populacjami miejskimi i wiejskimi dotyczący priorytetów wydatków rządowych oraz inwestycji infrastrukturalnych"
  - "Podział między kulturami progresywnymi i tradycyjnymi dotyczący norm społecznych, wartości rodzinnych oraz edukacji religijnej"
explanation: >-
  Kurs argumentuje, że prawdziwy podział polityczny nie leży w tradycyjnych etykietach lewicy, prawicy i centrum, lecz w fundamentalnych zasadach filozoficznych: wolność albo przymus, dobrowolna zgoda albo nakaz, odpowiedzialna jednostka albo kolektyw. Właściwym sposobem myślenia o polityce jest zaczynanie od zasad etycznych, a nie etykiet.
reviewed: false
