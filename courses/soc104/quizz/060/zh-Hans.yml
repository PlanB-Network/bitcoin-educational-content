question: "约翰·罗尔斯的两项正义原则是什么？"
answer: "所有人享有平等自由，以及差别原则：只有当不平等使最弱势者受益时，才允许这种不平等"
wrong_answers:
  - "所有公民享有普选权，以及通过累进税制为公共服务提供资金"
  - "不受限制的言论自由，以及为实现平等而强制重新分配财富"
  - "保护私有财产权，以及将非侵略原则适用于所有国家行动"
explanation: >-
  罗尔斯提出两项原则：第一，所有人享有平等自由（民主的基础）；第二，差别原则，即只有当不平等使社会中最弱势成员受益时，才允许这种不平等。这意味着一个人有权变得富有，前提是再分配也能让处境最不利者受益。其他选项混合了不同政治哲学中的元素。
