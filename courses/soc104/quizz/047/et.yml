question: "Keda nimetatakse sageli modernse konservatismi rajajaks?"
answer: "Edmund Burke'i, kes pooldas institutsioonide ja traditsioonide säilitamist Prantsuse revolutsiooni radikaalsete muutuste vastu"
wrong_answers:
  - "Karl Marxi, kes töötas üheksateistkümnendal sajandil välja klassivõitluse ja ajaloolise materialismi teooria"
  - "John Locke'i, kes sõnastas seitsmeteistkümnendal sajandil loomulike õiguste ja ühiskondliku lepingu teooria"
  - "Adam Smithi, kes kirjutas teose The Wealth of Nations ja rajas klassikalise majandusteaduse distsipliini"
explanation: >-
  Edmund Burke'i nimetatakse sageli konservatismi rajajaks tema vastuseisu tõttu Prantsuse revolutsioonile. Tema teos Reflections on the Revolution in France (1790) kaitses ettevaatlikkust ja järkjärgulist reformi radikaalsete muutuste asemel. Ta uskus, et ühiskond ei peaks edenema puhtalt lehelt alustades, vaid samm-sammuliste reformide kaudu, mis säilitavad läbiproovitud institutsioonid ja traditsioonid.
reviewed: false
