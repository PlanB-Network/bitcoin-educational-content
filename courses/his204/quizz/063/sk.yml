question: Po akej udalosti zaznamenali fyziokrati v roku 1774 veľký úspech?
answer: Turgotov príchod na ministerstvo
wrong_answers:
  - Príchod Duponta de Nemours do zhromaždenia
  - Príchod Duponta de Nemours na ministerstvo
  - Turgotov príchod do zhromaždenia
explanation: |
  Turgotov príchod na ministerstvo v roku 1774 znamenal pre fyziokratov úspech, keďže bol horlivým zástancom ich myšlienok a niektoré z ich odporúčaní zaviedol do praxe.
