question: "銃器規制の問題において、保守主義とリバタリアンの立場の決定的な違いは何ですか？"
answer: "どちらも一定の規制を認めるが、保守主義者は正当な公的権威からのルールを望み、リバタリアンは市民団体や市場競争など、直接関係する人々からルールが生じることを望む"
wrong_answers:
  - "保守主義者はあらゆる銃器規制に反対し、リバタリアンは公共の安全のために厳格な政府統制を受け入れる"
  - "保守主義者は銃器の全面禁止を望み、リバタリアンはすべての武器への無制限のアクセスを支持する"
  - "保守主義者は個人の権利に基づいて立場を取り、リバタリアンは集団的責任に基づいて立場を取る"
explanation: >-
  保守主義者とリバタリアンはどちらも、武器の携帯には何らかの規制が必要であることに同意します。決定的な違いは、そのルールを誰が定めるかにあります。保守主義者は、規制は公共の利益を守る責任を負う公的権威から来なければならないと主張します（トップダウン）。リバタリアンは、規制は直接関係する人々、すなわちセキュリティ専門家、市民団体、市場競争から生じるべきだと論じます（ボトムアップ）。
reviewed: false
