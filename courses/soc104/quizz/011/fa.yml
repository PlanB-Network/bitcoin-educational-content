question: "پایینِ محور آزادی شخصی در نمودار نولان با چه چیزی مشخص می‌شود؟"
answer: "ترجیح نظم، امنیت، ارزش‌های سنتی، و اینکه دولت اخلاقیات را تنظیم کند و نظم عمومی را حفظ کند"
wrong_answers:
  - "ترجیح خودمختاری فردی، مدارا، و حداقل مداخلهٔ دولت در انتخاب‌های زندگی شخصی"
  - "ترجیح مقررات‌زدایی اقتصادی، تجارت آزاد، و لغو تعرفه‌ها و یارانه‌ها"
  - "ترجیح بازتوزیع ثروت، مالیات‌های بالا، و ملی‌سازی صنایع کلیدی"
explanation: >-
  پایینِ محور آزادی شخصی نمایندهٔ بیشترین کنترل دولت بر زندگی شخصی است، که با ترجیح نظم، امنیت، و ارزش‌های سنتی مشخص می‌شود. دولت اخلاقیات را تنظیم می‌کند، نظم عمومی را حفظ می‌کند، و ممکن است از چشم‌اندازی خاص از اخلاق یا سنت دفاع کند. بالای محور نمایندهٔ نقطهٔ مقابل است: آزادی فردی و مدارا. سیاست‌های اقتصادی روی محور افقی جداگانه سنجیده می‌شوند.
reviewed: false
