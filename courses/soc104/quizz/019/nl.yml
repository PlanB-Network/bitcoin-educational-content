question: "Welke gedeelde politieke doelstelling hebben linkse en rechtse statisten?"
answer: "De macht winnen om de samenleving volgens hun wereldbeeld te organiseren en dat aan iedereen op te leggen"
wrong_answers:
  - "De omvang van de overheid verkleinen en beslissingsmacht teruggeven aan individuele burgers"
  - "Een directe democratie instellen waarin elke burger over elke wetgevende beslissing stemt"
  - "Politieke partijen afschaffen en vervangen door onafhankelijk technocratisch bestuur"
explanation: >-
  Zowel linkse als rechtse statisten delen dezelfde politieke doelstelling: de macht winnen om de samenleving volgens hun wereldbeeld te organiseren en dat via wetgeving aan iedereen op te leggen. Het verschil zit alleen in hun waarden: rechts beroept zich op de verdediging van beschaving, terwijl links zich beroept op de verdediging van de arbeidersklasse of de onderdrukten. Geen van beide streeft ernaar de overheid te verkleinen of partijen af te schaffen.
reviewed: false
