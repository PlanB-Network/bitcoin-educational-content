question: "John Rawls 的兩項正義原則是什麼？"
answer: "所有人的平等自由，以及只在不平等有利於最弱勢者時才允許不平等的差異原則"
wrong_answers:
  - "所有公民的普選權，以及用於資助公共服務的累進稅"
  - "不受限制的言論自由，以及為實現平等而強制財富再分配"
  - "保護私有財產權，以及適用於所有國家行動的非侵略原則"
explanation: >-
  Rawls 提出兩項原則：第一，所有人的平等自由（民主的基礎）；第二，差異原則，只有在不平等有利於社會中最弱勢成員時，才允許不平等。這表示一個人有權致富，前提是再分配也讓最不利者受益。其他選項混合了不同政治哲學的元素。
reviewed: false
