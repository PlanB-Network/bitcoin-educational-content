question: "Mu biganiro vya Gustave de Molinari vyo mu 1849, ni uwuhe muntu aburanira ubwisanzure nk'ingingo ngenderwako y'ishimikiro aho kubushira munsi y'izindi ntumbero?"
answer: "Umuhinga w'ubutunzi, abona ubwisanzure nk'ingingo ngenderwako idashirwa munsi y'iyindi ntumbero iyo ari yo yose"
wrong_answers:
  - "Umusosiyaliste, aburanira ubwisanzure biciye mu mavugurura ateza imbere uburinganire bw'imibano"
  - "Umukonserevateri, ashigikira ubwisanzure mu kuzigama urutonde rw'imibano n'ugutekana vya kera"
  - "Abo bantu bose batatu baburanira ubwisanzure ku rugero rumwe ariko ntibumvikana ku kuntu bwoshirwa mu ngiro"
explanation: >-
  Mu biganiro vya Molinari vyo muri Les Soirees de la rue Saint-Lazare, umuhinga w'ubutunzi aguma atavuga rumwe n'umusosiyaliste hamwe n'umukonserevateri. Ni we wenyene aburanira ubwisanzure nk'ingingo ngenderwako y'ishimikiro. Umusosiyaliste ashira ubwisanzure munsi y'ivyiyumviro vy'iterambere, umukonserevateri na we akabushira munsi yo kuzigama urutonde, bigatuma umuhinga w'ubutunzi aba uwudasanzwe mu kuburanira ubwisanzure ata co abuharirako.
reviewed: false
