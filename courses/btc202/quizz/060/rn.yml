question: Ni uruhara uruhe rw’umuyagankuba wa Nostr ushizwe kuri Umbrel?
answer: Kubika publications zawe kuri serveur yawe
wrong_answers:
  - Suzuma ubucuruzi bwa Bitcoin
  - Rema imirongo ya Nostr n'abo muvugana
  - Kubika Blockchain ya Nostr kuri local
explanation: |
Nostr relay iri kuri Umbrel ituma amakuru yawe abikwa kuri serveur yawe bwite, bikagufasha kugira ubwigenge no gutuma amakuru yawe aboneka igihe cose.
reviewed: true
