question: "کارل مارکس میان سوسیالیسم آرمان‌شهری و سوسیالیسم علمی چه تمایزی قائل شد؟"
answer: "او سوسیالیست‌های اولیه فرانسوی را متهم کرد که راه‌حل‌های خیالی پیشنهاد می‌کنند، در حالی که سوسیالیسم علمی او بر ماتریالیسم تاریخی و مبارزه طبقاتی استوار بود"
wrong_answers:
  - "او استدلال کرد که سوسیالیسم آرمان‌شهری بیش از حد بر اقتصاد تمرکز داشت، در حالی که سوسیالیسم علمی دگرگونی فرهنگی و هنری را در اولویت می‌گذاشت"
  - "او سوسیالیست‌های آرمان‌شهری را به خاطر آزمایش‌های عملی‌شان ستود و از سوسیالیسم علمی به دلیل انتزاعی و نظری بودن بیش از حد انتقاد کرد"
  - "او ادعا کرد سوسیالیسم آرمان‌شهری خشونت‌آمیز و انقلابی بود، در حالی که سوسیالیسم علمی اصلاح دموکراتیک مسالمت‌آمیز را ترجیح می‌داد"
explanation: >-
  مارکس سوسیالیست‌های اولیه فرانسوی مانند پرودون، سن‌سیمون و فوریه را متهم کرد که آرمان‌شهرگرایانی بودند که راه‌حل‌هایی کاملاً خیالی پیشنهاد می‌کردند. سوسیالیسم علمی او بر ماتریالیسم تاریخی تکیه داشت: این ایده که تاریخ از راه مبارزه طبقاتی و تصاحب ابزارهای تولید پیش می‌رود، جایی که همه بازنمایی‌های فرهنگی توسط نیروهای مولد و روابط تولید مشروط می‌شوند.
