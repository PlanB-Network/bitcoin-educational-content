question: "แกนตั้งของ Nolan diagram เผยให้เห็นอะไรเกี่ยวกับคำถามทางการเมืองที่แท้จริง?"
answer: "มันเผยให้เห็นว่าคุณต้องการบังคับความรู้สึกนึกคิดของตนเองต่อผู้อื่นผ่านรัฐ หรือชอบให้แต่ละคนมีอิสระตัดสินใจด้วยตนเอง"
wrong_answers:
  - "มันเผยให้เห็นว่าคุณสนับสนุนการปกครองแบบประชาธิปไตย หรือชอบการปกครองแบบอำนาจนิยมโดยผู้นำคนเดียว"
  - "มันเผยให้เห็นว่าคุณระบุตัวเองกับขบวนการสังคมก้าวหน้า หรือกับสถาบันศาสนาดั้งเดิม"
  - "มันเผยให้เห็นว่าความกังวลหลักของคุณคือความมั่นคงแห่งชาติหรือความมั่งคั่งทางเศรษฐกิจ"
explanation: >-
  แกนตั้งเผยคำถามทางการเมืองที่แท้จริง: ไม่ใช่ว่าคุณเป็นฝ่ายซ้ายหรือฝ่ายขวา แต่คือคุณต้องการให้รัฐแทรกแซงการปั้นแต่งสังคมตามคุณค่าของคุณมากเพียงใด คุณต้องการบังคับความรู้สึกนึกคิดของตนเองต่อผู้อื่น หรือคุณต้องการให้แต่ละคนมีอิสระตัดสินใจด้วยตนเอง? กรอบคิดนี้ก้าวข้ามการแบ่งซ้าย-ขวา และแสดงให้เห็นว่าทั้งสองค่ายสามารถเป็นรัฐนิยมได้เท่า ๆ กัน
reviewed: false
