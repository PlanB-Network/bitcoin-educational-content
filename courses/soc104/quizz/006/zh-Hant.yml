question: "Nolan diagram 的兩條軸是什麼？"
answer: "一條衡量個人自由的縱軸，以及一條衡量經濟自由的橫軸"
wrong_answers:
  - "一條從左到右的橫軸，以及一條從威權到民主的縱軸"
  - "一條衡量財富的縱軸，以及一條衡量教育程度的橫軸"
  - "一條從社會主義到資本主義的橫軸，以及一條從傳統到進步的縱軸"
explanation: >-
  David Nolan 設計的圖表有兩條特定軸：個人自由（縱軸）與經濟自由（橫軸）。這種二維方法取代了過度簡化的左右直線，並透過分離兩大類自由，更好地呈現政治意識形態的複雜性。
reviewed: false
