question: "Mussolini 1920 年的宣言“一切都在国家之内，国家之外无一物，任何东西都不得反对国家”揭示了极权主义的什么？"
answer: "公共空间与私人空间之间不再有任何分离，因为国家完全吸纳了社会"
wrong_answers:
  - "国家只专注于军事力量，同时把经济留给私营企业"
  - "只要公民不公开批评政府，就可以自由地私下组织起来"
  - "政府只控制政治活动，而文化和宗教生活仍保持自治"
explanation: >-
  Mussolini 的宣言抓住了极权主义的本质：总体性。一切都被吸收到国家之中，这意味着公共空间与私人空间之间没有分离。社会失去了所有形式的自治，甚至包括开设体育俱乐部这样最日常的活动。这远远超出了仅仅控制军事、政治或经济领域。
reviewed: false
