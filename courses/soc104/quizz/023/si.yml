  - "එය ඔබ progressive social movements සමඟද, නැතහොත් traditional religious institutions සමඟද තමන් හඳුනාගන්නේ යන්න අනාවරණය කරයි"
  - "එය ඔබේ ප්‍රධාන කනස්සල්ල national security ද economic prosperity ද යන්න අනාවරණය කරයි"
explanation: >-
  vertical axis සැබෑ දේශපාලන ප්‍රශ්නය නිරාවරණය කරයි: ඔබ වමද දකුණද යන්න නොව, ඔබේ වටිනාකම් අනුව සමාජය හැඩගැස්වීමට state කොපමණ දුරට මැදිහත් විය යුතු යැයි ඔබට අවශ්‍යද යන්නයි. ඔබේ සංවේදීතාවන් අන් අය මත පැනවීමට ඔබ කැමතිද, නැතහොත් සෑම පුද්ගලයෙකුම තමන් විසින් තීරණය කිරීමට නිදහස් විය යුතු යැයි ඔබ කැමතිද? මෙම framing එක left-right divide ඉක්මවා යමින්, camps දෙකම සමානව statist විය හැකි බව පෙන්වයි.
