question: "¿Qué objetivo político comparten los estatistas de izquierda y de derecha?"
answer: "Ganar el poder para organizar la sociedad según su visión del mundo e imponerla a todos"
wrong_answers:
  - "Reducir el tamaño del gobierno y devolver el poder de decisión a los ciudadanos individuales"
  - "Establecer una democracia directa en la que cada ciudadano vote sobre cada decisión legislativa"
  - "Eliminar los partidos políticos y sustituirlos por una gobernanza tecnocrática independiente"
explanation: >-
  Los estatistas de izquierda y de derecha comparten el mismo objetivo político: ganar el poder para organizar la sociedad según su visión del mundo e imponerla a todos mediante la legislación. La diferencia está solo en sus valores: la derecha invoca la defensa de la civilización, mientras que la izquierda invoca la defensa de la clase trabajadora o de los oprimidos. Ninguna busca reducir el gobierno ni eliminar los partidos.
