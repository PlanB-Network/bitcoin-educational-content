question: Ni izihe server options zitatu ziri muri Sparrow?
answer: Public Server, Bitcoin Core, Private Electrum
wrong_answers:
  - RPC Direct, VPN, Tor
  - Full node, Light Node, Mobile Node
  - Core RPC, Lightning, ElectrumX
explanation: |
  Sparrow itanga amahitamwo atatu y’amaserveri: Serveri ya Leta, Bitcoin core (RPC), na  Private Electrum.
reviewed: true
