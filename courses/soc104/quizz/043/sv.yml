question: "Vilken grundläggande skiljelinje delade socialister från början av 1900-talet och framåt?"
answer: "Revolutionära socialister som försökte ta makten genom våld kontra reformistiska socialister som eftersträvade förändring genom demokratiska val"
wrong_answers:
  - "Urbana socialister som fokuserade på industriarbetare kontra rurala socialister som organiserade jordbrukskommuner"
  - "Nationalistiska socialister som prioriterade sitt eget land kontra internationalistiska socialister som förespråkade global revolution"
  - "Intellektuella socialister som skrev teoretiska texter kontra aktivistiska socialister som organiserade arbetarstrejker"
explanation: >-
  Från början av 1900-talet skilde en grundläggande skiljelinje revolutionära socialister, som motsatte sig äganderätt och försökte förstöra det kapitalistiska samhället genom våld eller proletariatets diktatur, från reformistiska socialister, som eftersträvade social rättvisa genom demokratiska val och beskattning samtidigt som de tillfälligt accepterade kapitalismen. Denna splittring formade hela den efterföljande historien för socialistiska rörelser.
