question: "Uhifadhi wa kitamaduni ni nini?"
answer: "Kushikamana binafsi na thamani za kifamilia, kimaadili, kiestetiki, na kimetafizikia zilizorithiwa kutoka zamani, si falsafa ya kisiasa"
wrong_answers:
  - "Itikadi ya kisiasa inayotumia nguvu ya dola kulazimisha thamani za jadi kwa jamii yote kupitia sheria"
  - "Harakati inayokataa aina zote za usasa na kutafuta kuirudisha jamii kwenye namna ya maisha ya kabla ya viwanda"
  - "Fundisho la kiuchumi linalolinda sekta za kitaifa na kupinga biashara huru na nchi za kigeni"
explanation: >-
  Uhifadhi wa kitamaduni unafafanuliwa kama hekima ya maisha: kushikamana binafsi na thamani za kifamilia, kimaadili, kiestetiki, na kimetafizikia zilizorithiwa kutoka zamani, ziwe za Kigiriki-Kirumi au Kiyahudi-Kikristo. Kwa wazi si falsafa ya kisiasa. Unatofautiana na uhifadhi wa kisiasa, ambao hulenga kuhifadhi taasisi za kisiasa na mpangilio wa kijamii kupitia nguvu ya dola. Pia hauhusu kukataa usasa au ulinzi wa kiuchumi.
