question: "Kant 的座右銘『Sapere aude』鼓勵人們做什麼？"
answer: "敢於自行思考，並走出依賴上級權威指導的未成年狀態"
wrong_answers:
  - "透過就讀正式教育機構並取得文憑，追求學術知識"
  - "挑戰一切形式的道德，並根據個人欲望創造全新的倫理系統"
  - "透過宗教虔敬與服從教會教導來尋求智慧"
explanation: >-
  Sapere aude，意思是「敢於自行思考」，由 Kant 取自詩人 Horace，並成為 Enlightenment 的座右銘。它象徵走出未成年狀態，也就是人們若沒有上層階級或權威指導，就無法運用自身理解力的狀態。Kant 鼓勵解放，並對自己的思維承擔全部責任。
reviewed: false
