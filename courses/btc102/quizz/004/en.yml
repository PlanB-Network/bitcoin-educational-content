question: What is the main mechanism of a Ponzi scheme?
answer: Early investors are paid with new investors' money
wrong_answers:
  - Returns come from a real product on the market
  - Investors receive dividends from companies
  - Earnings generated by smart contracts on Blockchain
explanation: |
  In a Ponzi scheme, no real product is created, and payments depend solely on the arrival of new participants.
reviewed: false