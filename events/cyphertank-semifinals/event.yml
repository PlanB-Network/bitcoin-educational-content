description: |
    CypherTank is a Bitcoin-focused pitch competition that will be held in Lugano during the Plan ₿ Forum. This first edition is designed to showcase innovation, attract global talent and attention to Lugano as a Bitcoin hub, and connect promising founders with world-class investors and advocates.

    The format, a first in the Bitcoin ecosystem, will be published/distributed online at the end of 2025. It is promoted, funded, and sponsored by Plan ₿ Network and the Plan ₿ VC Fund.

    ⚡ Important: The fee listed here is only for spectators who want to attend the event live in Lugano.

    ➡️ If you are a founder and want to pitch your project, participation is completely FREE.
    Find more information and sign up under the founder application form.
