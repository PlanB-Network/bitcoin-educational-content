question: half-agg-verify jet は、タプルの集合を Writer 効果としてログに記録します。可換/冪等/単位的テストの下で、この集合設計は何を達成し、何がまだ欠けていますか？
answer: "可換かつ冪等（Simplicity が要求する通り）だが、単位的ではない: 呼び出しを破棄すると、そのタプルが落ち、署名をスキップしてしまう。"
wrong_answers:
  - 冪等かつ単位的だが、集約は署名順に r 成分を結合しなければならないため、可換ではない。
  - 3 つすべてを満たすので、オプティマイザはリスクなく呼び出しを自由に複製、並べ替え、破棄できる。
  - 可換だが冪等ではない。同じタプルを 2 回ログに記録すると、2 つの集約 s 成分が要求されるためである。
explanation: >-
  writer ログを集合として扱うと、その効果は冪等かつ可換になります。集合への挿入自体が
  その両方の性質を持つからです。これは Simplicity がすべての効果に要求する 2 つの性質と
  まさに一致します。単位性はまだ手の届かないところにあります。Failure と同様、write は
  トランザクションの有効性に影響します。なぜなら、ログに記録されたすべてのタプルを
  集約 s 成分がカバーしている場合にのみ、トランザクションは有効だからです。したがって、
  write を行う式は、その unit 出力が使われていないというだけでは破棄できません。破棄すると、
  そのタプルが半集約検証から静かに消えてしまうからです。
reviewed: false
