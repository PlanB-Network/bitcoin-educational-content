question: "Điều gì được đặt lên trên tự do trong triết lý chính trị bảo thủ?"
answer: "Trật tự và truyền thống, những thứ phải được thiết lập vững chắc trước khi tự do có thể được coi trọng"
wrong_answers:
  - "Công bằng xã hội và bình đẳng, những thứ phải được bảo đảm trước khi các cá nhân có thể thật sự tự do"
  - "Hiệu quả kinh tế và các kết quả thực dụng, những thứ quyết định khi nào tự do là phù hợp"
  - "Quyền tài sản cá nhân, những thứ phải được bảo vệ trước khi bất kỳ quyền tự do nào khác được trao"
explanation: >-
  Đối với những người bảo thủ, trật tự và truyền thống được đặt lên trên tự do. Họ lập luận rằng quá nhiều tự do tạo ra hỗn loạn và rối loạn xã hội, vì vậy tự do chỉ có thể được coi trọng một khi trật tự đã được thiết lập vững chắc. Điều này tương phản với quan điểm xã hội chủ nghĩa ưu tiên công lý, hoặc trọng tâm của chủ nghĩa trung dung vào hiệu quả.
