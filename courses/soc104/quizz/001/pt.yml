question: "De onde se origina a divisão política esquerda-direita?"
answer: "Da disposição dos assentos durante os debates da Revolução Francesa de 1789"
wrong_answers:
  - "Dos escritos de Karl Marx e Adam Smith no século XIX"
  - "Da Guerra Civil Americana entre os estados do Norte e do Sul"
  - "Dos filósofos do Iluminismo que separaram a razão da tradição"
explanation: >-
  A divisão esquerda-direita remonta a 1789, quando os deputados da Assembleia Nacional francesa que eram favoráveis a manter o poder do rei sentaram-se à direita do presidente, enquanto aqueles que queriam limitar seus poderes sentaram-se à esquerda. Ela não se originou de Marx e Smith, da Guerra Civil Americana ou da filosofia do Iluminismo.
reviewed: false
