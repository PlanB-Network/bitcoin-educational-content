question: "Co charakteryzuje dół osi wolności osobistej na diagramie Nolana?"
answer: "Preferencja dla porządku, bezpieczeństwa, tradycyjnych wartości oraz dla państwa regulującego obyczaje i utrzymującego porządek publiczny"
wrong_answers:
  - "Preferencja dla autonomii jednostki, tolerancji i minimalnej ingerencji państwa w osobiste wybory życiowe"
  - "Preferencja dla deregulacji gospodarczej, wolnego handlu oraz zniesienia ceł i dotacji"
  - "Preferencja dla redystrybucji bogactwa, wysokich podatków i nacjonalizacji kluczowych gałęzi przemysłu"
explanation: >-
  Dół osi wolności osobistej reprezentuje maksymalną kontrolę państwa nad życiem osobistym, charakteryzującą się preferencją dla porządku, bezpieczeństwa i tradycyjnych wartości. Państwo reguluje obyczaje, utrzymuje porządek publiczny i może bronić określonej wizji moralności albo tradycji. Góra osi reprezentuje przeciwieństwo: wolność jednostki i tolerancję. Polityki gospodarcze mierzone są na oddzielnej osi poziomej.
