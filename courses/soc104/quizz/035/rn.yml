question: "Ni kubera iki Rothbard yaneguye uko aba libertaires babona kamere muntu, kandi ni iyihe nzira yindi yashikirije?"
answer: "Yabagirije kugira iciyumviro c'ubwana c'umuntu 'w'ishamba mwiza' avuga ko ikibano gitegerezwa gukoresha umutungo bwite n'ibituma abantu bakora neza kugira kiyobore inyifato ishingiye ku nyungu z'umuntu"
wrong_answers:
  - "Yarashimagije uko batahura ugukorana kw'abantu, ariko avuga ko Leta ntoyi yari igikenewe kugira ikurikize amasezerano"
  - "Yaremeje ko abantu ari beza ku kavukire, ariko ashimika ko amasoko yidegemvya yonyene ari yo yoshobora kuyobora ubwo bwiza mu bikorwa vyimbuka"
  - "Yaranse ukuntu bashira imbere uburenganzira bw'umuntu ku giti ciwe, avuga aho ko ibibano bikwiye gusobanura hamwe ingingo ngenderwako z'inyifato"
explanation: >-
  Rothbard yaneguye aba libertaires kubera bafashe iciyumviro c'ubwana gisa n'ica Rousseau kivuga ko umuntu ari mwiza ku kavukire, nk'umuntu 'w'ishamba mwiza'. We yavuze aho ko abantu bayoborwa n'inyungu zabo bwite, kandi ko ikibano gitegerezwa gutunganywa ku buryo ibituma abantu bakora neza biyobora inyifato. Ivyo bisaba kwemera no gukingira umutungo bwite. Gukuraho Leta ntibisigura gukuraho ibikorwa vyayo; igipolisi n'ubutungane bikwiye gucungwa n'isoko yidegemvya biciye mw'ihiganwa.
