question: "Čo libertariáni kladú do stredu svojej politickej filozofie?"
answer: "Etiku a právo"
wrong_answers:
  - "Ekonomický rast a tvorbu bohatstva"
  - "Sociálnu rovnosť a kolektívny blahobyt"
  - "Národnú identitu a zachovanie kultúry"
explanation: >-
  Libertariáni sa od všetkých ostatných politických rodín odlišujú tým, že do stredu svojej filozofie kladú etiku a právo, nie ekonomiku. Keď obhajujú trhové hospodárstvo, robia to menej pre jeho schopnosť vytvárať bohatstvo než pre podporu individuálnej slobody a zodpovednosti. Ekonomický rast je sekundárny prínos, nie zakladajúci princíp.
