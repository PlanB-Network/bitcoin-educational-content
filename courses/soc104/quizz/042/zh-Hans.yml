question: "在社会主义哲学语境中，“整体论”（holism）一词是什么意思？"
answer: "一种把社会视为不可分割整体的愿景，其中集体优先于个人"
wrong_answers:
  - "一种把每个个人视为自足单位的哲学，其权利不能被任何群体凌驾"
  - "一种主张以相等程度平衡公共部门和私营部门的经济理论"
  - "一种把所有少数派观点整合进单一共识型纲领的政治策略"
explanation: >-
  “整体论”（Holism）来自希腊语 'holos'，意为“整体”。在社会主义思想中，它指的是一种把社会视为不可分割整体的愿景，而不是个人的简单总和。社会主义国家旨在最大限度接管并指挥人类活动。这个集体可以表现为社会阶级、民族、种族或性别，但在每一种情况下，个人都由群体归属来定义。
reviewed: false
