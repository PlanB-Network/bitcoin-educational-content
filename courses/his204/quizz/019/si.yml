question: Cantillon අනුව, ව්‍යවසායකයෙකුගේ ප්‍රධාන ලක්ෂණය කුමක්ද?
answer: ඔහු අවිනිශ්චිතතාව තුළ ක්‍රියා කරයි
wrong_answers:
  - ඔහුට ප්‍රාග්ධනය ඇත
  - ඔහු නවෝත්පාදකයෙකි
  - ඔහු ධනවත් පවුලකින් පැමිණෙයි
explanation: |
  Cantillon අවිනිශ්චිතතාව සහ අවදානම හමුවේ ව්‍යවසායකයාගේ භූමිකාව අවධාරණය කරයි. ව්‍යවසායකයා යනු අවිනිශ්චිත පරිසරයක තීරණ ගන්නා සහ තම තේරීම්වල ප්‍රතිඵල භාර ගන්නා පුද්ගලයාය.