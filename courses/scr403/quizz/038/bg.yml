question: Ефектите на Simplicity са комутативни и идемпотентни, но не унитарни. Коя оптимизаторска трансформация следователно трябва да бъде отказана като общо правило?
answer: Замяна на привидно мъртъв израз с unit — Failure не е унитарен, така че това може да скрие проваляща се проверка, която трябва да прекъсне изпълнението.
wrong_answers:
  - Размяна на два независими подизраза, тъй като sig-all-hash може да наблюдава различно състояние на средата.
  - Сливане на две идентични verify извиквания, тъй като дублиран Failure би хвърлил два пъти и би прекъснал погрешно.
  - Пренареждане на изрази, които може да хвърлят, тъй като разпространеното изключение зависи от това коя страна се изпълнява първа.
explanation: >-
  Тъй като ефектите на Simplicity са гарантирано комутативни и идемпотентни,
  размяната на независими подизрази и дублирането или сливането на идентични
  такива винаги са безопасни; Reader средата е фиксирана, а изключението с
  unit тип на Failure е идентично, независимо коя страна хвърля първа или
  колко пъти. Трансформацията за изхвърляне `f ⨾ unit = unit` обаче
  изисква унитарност, която Failure няма: ако `f` съдържа
  `bip0340-verify` върху невалиден подпис, елиминирането на „мъртвия“ код
  би премахнало прекъсването чрез оптимизация и би валидирало транзакция, която трябва
  да се провали.
reviewed: false
