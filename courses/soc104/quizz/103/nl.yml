question: "Waarom beschrijft de cursus Bitcoin als een marktvaluta tegenover staatsgeld in plaats van als een rechts of links project?"
answer: "Omdat Bitcoin een vrijwillig aangenomen, moeilijk te produceren, gedecentraliseerde valuta is die waarde behoudt, in contrast met dwingend, gecentraliseerd fiatgeld dat waarde verliest, waardoor de scheidslijn gaat over markt versus staat in plaats van politieke ideologie"
wrong_answers:
  - "Omdat Bitcoin werd gecreëerd door een anonieme ontwikkelaar die bewust vermeed politieke uitspraken te doen over het beoogde doel of de filosofie ervan"
  - "Omdat Bitcoins mining-algoritme een gelijke verdeling van nieuwe coins over alle politieke partijen garandeert, waardoor elke ideologische bias in het monetaire systeem wordt voorkomen"
  - "Omdat Bitcoin identiek functioneert aan bestaande fiatvaluta's maar op een sneller betaalnetwerk draait, waardoor politieke verschillen irrelevant worden"
explanation: >-
  Bitcoin wordt beschreven als een vreedzame opstand tegen de politisering van geld. Staatsgeld of fiatgeld is een dwingend, gecentraliseerd systeem dat de neiging heeft waarde te verliezen. Marktgeld, historisch goud en momenteel Bitcoin, is gezonde, moeilijk te produceren valuta die vrijwillig ontstaat en haar waarde op lange termijn behoudt. De echte tegenstelling is niet links versus rechts, maar markt versus staat, waardoor Bitcoin een politieke breuk is die traditionele ideologische kampen overstijgt.
