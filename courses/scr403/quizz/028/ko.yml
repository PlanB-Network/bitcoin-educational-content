question: 어떤 의미에서 조건부 합성은 병렬 합성의 쌍대인가요?
answer: 병렬은 하나의 입력을 두 연산에 공급하고 출력들을 쌍으로 묶습니다(곱). 조건부는 입력들의 합을 받고 두 분기가 하나의 출력 타입을 공유합니다.
wrong_answers:
  - 병렬은 두 연산을 반드시 동시에 실행해야 하고, 조건부는 두 연산을 순서대로 실행한 뒤 태그가 선택한 분기만 반환합니다.
  - 둘 다 하나의 공유 입력에서 실행됩니다. 병렬은 출력 쌍을 유지하고, 조건부는 두 분기를 모두 실행한 뒤 선택되지 않은 것을 버립니다.
  - 병렬은 입력을 미리 복제하고 조건부는 출력을 나중에 복제하여, 복사가 일어나는 위치를 서로 바꿉니다.
explanation: >-
  이 쌍대성은 공유 타입이 위치를 바꾸는 곱/합 교환입니다.
  병렬 합성은 두 연산에 같은 입력 타입을 주고 그 출력들을 곱으로 쌍지으며,
  조건부 합성은 두 입력 타입의 합(태그가 붙은 union)을 받고 두 분기가 반드시
  같은 출력 타입을 산출해야 합니다. 동시성은 관련이 없습니다. 글은
  병렬 합성이 순차적으로 구현될 수 있음을 강조합니다. 또한
  조건부 합성은 두 분기를 모두 실행하고 하나를 버리는 것이 아니라, 태그가 선택한
  정확히 하나의 분기만 실행합니다.
