question: "Kubera iki aba-libertarian barwanya amakori?"
answer: "Kuko ari ukurenga ku burenganzira bw'umutungo mu nyifato runtu, uburyo bwa Leta bwo kwiba bufata umutungo w'uwundi ata kwemera kwiwe"
wrong_answers:
  - "Kuko amakori atuma ubukungu budakora neza kandi yama ashikana ku rugero rwo hejuru rw'ubushomeri"
  - "Kuko amakori aca intege ishoramari ryo hanze kandi agabanya ubushobozi bw'igihugu bwo guhiganwa"
  - "Kuko uburyo bw'amakori agenda aduga burenganya abatunzi barema akazi kenshi kuruta abandi"
explanation: >-
  Ukwanka amakori kw'aba-libertarian gushingiye ku nyifato runtu imbere y'uko kuba iciyumviro c'ubukungu. Aba-libertarian babona amakori nk'uburyo bwa Leta bwo kwiba n'intambamyi ku mutungo w'abikorera ku giti cabo, kuko agizwe no gufata umutungo w'uwundi ata kwemera kwiwe. Naho hoshobora kuba hariho ivyiyumviro vy'ubukungu birwanya amakori, iciyumviro shingiro c'aba-libertarian gishingiye ku ngingo ngenderwako y'uko arenga ku burenganzira bw'umutungo, si ku mibare y'uko akora neza canke y'ubushobozi bwo guhiganwa.
