question: Liquid Networkで使われている主なコンセンサスメカニズムは何ですか？
answer: フェデレーテッド・コンセンサス
wrong_answers:
  - Proof-of-Work
  - Proof-of-Stake
  - Delegated Proof-of-Stake
explanation: |
  Liquid Networkは、BitcoinのProof-of-Workとは根本的に異なる、フェデレーテッド・コンセンサスモデルで運用されています。このモデルでは、選ばれた15人のファンクショナリーがブロックの署名者となり、ラウンドロビン方式で順番にブロックを生成します。Proof-of-WorkはマイニングをともなうBitcoinのコンセンサスメカニズムで、Proof-of-StakeとDelegated Proof-of-Stakeは他のブロックチェーンで使われているものです。いずれもLiquidでは使われていません。