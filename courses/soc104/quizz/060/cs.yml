question: "Jaký je důležitý rozdíl mezi tím být pro-business a být pro-market?"
answer: "Být pro-business znamená upřednostňovat spojenectví mezi velkými podniky a státem, zatímco být pro-market znamená podporovat svobodnou konkurenci bez státního zvýhodňování"
wrong_answers:
  - "Být pro-business znamená podporovat malé podniky, zatímco být pro-market znamená podporovat nadnárodní korporace"
  - "Být pro-business znamená zcela odmítat regulaci, zatímco být pro-market znamená přijímat umírněnou regulaci"
  - "Být pro-business se soustředí na domácí průmysl, zatímco být pro-market se soustředí na mezinárodní obchod"
explanation: >-
  Centristé mají sklon být pro-business, což znamená, že upřednostňují určitý druh spojenectví mezi velkými podniky a státem, což se liší od postoje pro-market. Být pro-market znamená podporovat svobodnou konkurenci bez státního zvýhodňování nebo korporátního protekcionismu. Toto rozlišení je zásadní, protože pro-business politiky mohou vytvářet monopoly a regulatorní ochrany, které ve skutečnosti podkopávají konkurenci volného trhu.
reviewed: false
