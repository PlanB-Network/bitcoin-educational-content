question: "În privința a ce vrea dreapta să legifereze?"
answer: "Morala și religia, motivată de dorința de a păstra instituțiile tradiționale și ierarhiile sociale"
wrong_answers:
  - "Economia și piețele financiare, motivate de dorința de a reduce inegalitatea și de a redistribui bogăția"
  - "Știința și educația, motivate de dorința de a controla ce se predă în școlile publice"
  - "Comerțul internațional și diplomația, motivate de dorința de a extinde influența națională în străinătate"
explanation: >-
  Dreapta acordă prioritate moralei personale și valorilor tradiționale. Ea consideră că civilizația este construită pe anumite instituții tradiționale și ierarhii sociale care trebuie păstrate și vrea să legifereze în materie de morală și religie. Stânga, nu dreapta, se concentrează pe legiferarea economiei. Știința, educația și politica comercială nu sunt principalul obiectiv descris pentru dreapta.
reviewed: false
