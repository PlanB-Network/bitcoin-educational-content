  - "අසම්මතිය තිබෙන්නේ timing පිළිබඳවය: libertarians gradual reform හරහා එම ඉලක්කම වඩා සෙමින් සාක්ෂාත් කරගැනීමට කැමතිය"
  - "අසම්මතිය තිබෙන්නේ scope පිළිබඳවය: libertarians එම policies ජාතික මට්ටමට නොව local මට්ටමට පමණක් යෙදීමට කැමතිය"
explanation: >-
  පීඩිතයන් ආරක්ෂා කිරීම හෝ සමාජ ඒකාබද්ධතාව ප්‍රවර්ධනය කිරීම වැනි ඇතැම් objectives පිළිබඳ libertariansට socialists, conservatives, සහ centrists සමඟ එකඟ විය හැක. අසම්මතිය තිබෙන්නේ ends තුළ නොව means තුළය. libertarians practices සහ regulations එකසේ කිරීමට උත්සාහ කරන සියලු බලහත්කාර විසඳුම් ප්‍රතික්ෂේප කර, ස්වේච්ඡා contracts මත පදනම් වූ නිදහස්, විමධ්‍යගත හුවමාරුව හරහා තේරීමේ බලය සහ වගකිවයුතු නිදහස ආරක්ෂා කරයි.
