question: "Jaká je definice etatismu představená v Nolanově rámci?"
answer: "Používání zákonodárství ke kontrole a formování společnosti, ať už ve jménu obrany civilizace, dělnické třídy, přírody, nebo utlačovaných"
wrong_answers:
  - "Systém vlády, v němž volení představitelé slouží pevně stanovená období a moc se předává prostřednictvím demokratických voleb"
  - "Přesvědčení, že pouze silná armáda může chránit suverenitu a územní celistvost národa"
  - "Ekonomická filozofie, která upřednostňuje národní průmysl před zahraniční konkurencí prostřednictvím cel a kvót"
explanation: >-
  Etatismus je definován jako používání zákonodárství ke kontrole a formování společnosti. Praktikuje jej levice i pravice: někteří ve jménu obrany civilizace, jiní ve jménu obrany dělnické třídy, přírody nebo utlačovaných. I centristé jej schvalují, když se jim to hodí. Etatismus se neomezuje na vojenskou politiku, obchodní protekcionismus ani na pouhou existenci volených vlád.
