question: "Что имел в виду Людвиг фон Мизес, когда писал, что только индивид мыслит, рассуждает и действует?"
answer: "Что коллективности вроде государства или нации не имеют собственного существования помимо действий их отдельных членов"
wrong_answers:
  - "Что индивиды должны избегать формирования групп или ассоциаций, потому что коллективное действие всегда вредно"
  - "Что только некоторые одаренные индивиды способны к рациональному мышлению, тогда как большинство людей следует инстинкту"
  - "Что мышление и рассуждение — это частные занятия, которыми никогда не следует делиться или обсуждать публично"
explanation: >-
  Мизес пояснял, что индивидуализм противостоит представлению о том, что социальные сущности, такие как общество или нация, могут существовать независимо от индивидов, которые их составляют. Коллективность не имеет собственного существования помимо действий ее отдельных членов. Мы не можем осмысленно говорить о действии государства или компании, потому что эти сущности не имеют собственной воли или мысли и действуют только через индивидов.
reviewed: false
