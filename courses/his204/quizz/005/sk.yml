question: Akú podobu malo za ancien régime regulovanie práce a priemyslu?
answer: Stovky predpisov pre každý druh priemyslu
wrong_answers:
  - Všeobecný kódex pre hospodársku činnosť
  - Niekoľko dosť pružných ustanovení, ktoré ponechávali práci a priemyslu veľa slobody
  - Úplná absencia pravidiel, ktorá dávala voľnú ruku individuálnej iniciatíve
explanation: |
  Ancien régime sa vyznačoval systémom cechov a prísnych predpisov, ktoré riadili prácu a priemysel. Každé remeslo podliehalo osobitným, často veľmi podrobným pravidlám, ktoré obmedzovali konkurenciu a inovácie.
