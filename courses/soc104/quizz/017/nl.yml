question: "Waarover wil rechts wetgeving maken?"
answer: "Moraliteit en religie, gedreven door de wens om traditionele instellingen en sociale hiërarchieën te behouden"
wrong_answers:
  - "De economie en financiële markten, gedreven door de wens om ongelijkheid te verminderen en rijkdom te herverdelen"
  - "Wetenschap en onderwijs, gedreven door de wens om te controleren wat op openbare scholen wordt onderwezen"
  - "Internationale handel en diplomatie, gedreven door de wens om nationale invloed in het buitenland uit te breiden"
explanation: >-
  Rechts geeft prioriteit aan persoonlijke moraliteit en traditionele waarden. Het beschouwt beschaving als gebouwd op bepaalde traditionele instellingen en sociale hiërarchieën die behouden moeten blijven, en wil wetgeving maken over moraliteit en religie. Links, niet rechts, richt zich op het maken van wetgeving over de economie. Wetenschap, onderwijs en handelsbeleid zijn niet de primaire focus die voor rechts wordt beschreven.
reviewed: false
