question: "Hva er begrepet 'spontan orden' slik Friedrich Hayek beskriver det?"
answer: "Sosiale regler og normer bør vokse frem fra frie individuelle interaksjoner snarere enn bli påtvunget gjennom autoritær planlegging"
wrong_answers:
  - "Markeder tenderer naturlig mot monopol med mindre staten griper inn for å opprettholde konkurransebalanse"
  - "Demokratiske valg er den eneste legitime mekanismen for å etablere lovene som styrer samfunnet"
  - "Økonomiske kriser oppstår spontant og krever umiddelbar statlig inngripen for å gjenopprette stabilitet"
explanation: >-
  Hayeks begrep spontan orden hevder at reglene som styrer samfunnet, ikke bør påtvinges ovenfra gjennom sentral planlegging, men bør vokse frem fra det frie spillet mellom individuelle viljer, kontrakter og frivillige relasjoner. Dette er en grunnleggende akse i libertariansk tenkning. Det innebærer ikke at markeder tenderer mot monopol eller at kriser krever statlig inngripen.
reviewed: false
