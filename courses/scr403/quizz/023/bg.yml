question: "Какво представлява Commitment Merkle Root (CMR) в Simplicity?"
answer: 256-битов хеш, който се ангажира към структурата на програма на Simplicity чрез тагнат SHA-256.
wrong_answers:
  - Двоично дърво, съдържащо всички възможни пътища на изпълнение на програма на Simplicity.
  - Хеш на типовете на програмата и свидетелските стойности, използван за проверка на адреса.
  - Merkle корен на транзакционните данни, до които програмата има право на достъп.
explanation: >-
  Всеки комбинатор на Simplicity има уникален SHA-256 таг (напр. Simplicity␟Commitment␟iden), а
  CMR се изчислява чрез рекурсивно хеширане на дървото на комбинаторите на програмата, използвайки тези тагнати midstates.
  Важно е, че CMR не се ангажира към типовете на изразите, а разчита на извеждане на типове
  по време на осребряване. CMR-ите се използват за ангажиране на програми в Taproot адреси.
reviewed: true
