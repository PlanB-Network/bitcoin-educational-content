question: "Почему эффект Failure коммутативен в Simplicity, хотя исключения в общем случае не коммутативны?"
answer: Потому что тип исключения — unit (1) с единственным значением, поэтому порядок выброса не имеет значения.
wrong_answers:
  - Потому что Simplicity выполняет все выражения в детерминированном порядке, заданном деревом комбинаторов.
  - Потому что эффект Failure всегда перехватывается и повторно выбрасывается комбинатором case.
  - Потому что Simplicity использует пакетную проверку (batch verification), из-за которой все выброшенные исключения эквивалентны.
explanation: >-
  В общем случае исключения не коммутативны, потому что разные выражения
  могут выбрасывать разные значения исключений. Однако Simplicity
  ограничивает исключения типом unit (только одно возможное значение),
  поэтому перестановка порядка двух потенциально неудачных выражений
  даёт одно и то же исключение независимо от того, какое из них
  фактически не выполнилось. Это свойство коммутативности позволяет
  выполнять важные оптимизации программ.
reviewed: true
