question: "විසිවන සියවස තුළ United States හි classical liberals තමන්ව 'libertarians' ලෙස හැඳින්වීමට පටන් ගත්තේ ඇයි?"
answer: "American 'liberalism' වැඩිවන state interventionism සහ welfare state මගින් co-opt කර තිබූ නිසා"
wrong_answers:
  - "European monarchist traditions ගෙන් තමන් ඈත් කර දැක්වීමට ඔවුන්ට අවශ්‍ය වූ නිසා"
  - "'liberal' යන පදය anarchism සහ political violence සමඟ සම්බන්ධ වූ නිසා"
  - "නව trade agreements නිසා free-market advocates සඳහා වෙනම political identity එකක් අවශ්‍ය වූ නිසා"
explanation: >-
  විසිවන සියවස තුළ, welfare state වෙනුවෙන් laissez-faire principles ක්‍රමයෙන් අත්හැරීමත් සමඟ මූලික shift එකක් සිදුවිය. American "liberalism" classical liberalism වලට වඩා බෙහෙවින් වෙනස් දෙයක් අදහස් කිරීමට පටන් ගත් අතර, state interventionism වැළඳ ගත්තේය. වෙනස රැක ගැනීමට classical liberals "libertarian" යන පදය භාර ගත්තේය. මෙම rebranding එක European monarchism, anarchist violence, හෝ trade agreements සමඟ කිසිදු සම්බන්ධයක් නොතිබුණි.
reviewed: false
