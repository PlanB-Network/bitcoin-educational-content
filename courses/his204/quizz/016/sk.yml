question: Kto označil Cantillona za zakladateľa ekonómie?
answer: Murray Rothbard
wrong_answers:
  - Joseph A. Schumpeter
  - Mark Blaug
  - Adam Smith
explanation: |
  Murray Rothbard, ekonóm rakúskej školy, označil Richarda Cantillona za zakladateľa ekonómie pre jeho novátorský prístup a významné prínosy k ekonomickej teórii.
