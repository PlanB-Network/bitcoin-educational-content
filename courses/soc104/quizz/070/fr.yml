question: "À travers les cinq débats sociétaux (mariage, immigration, armes à feu, drogues, boissons sucrées), quel cadre d'analyse récurrent façonne la position socialiste sur chaque sujet ?"
answer: "Un cadre de conflit entre dominants et dominés, où la société est structurée par l'oppression et où l'État doit intervenir pour protéger le groupe vulnérable"
wrong_answers:
  - "Un cadre utilitariste centré sur la maximisation du bonheur global et de la productivité économique pour le plus grand nombre de citoyens"
  - "Un cadre de droits naturels où les libertés individuelles doivent être protégées à la fois de l'ingérence de l'État et des entreprises"
  - "Un cadre traditionaliste où les institutions sociales établies doivent être préservées contre les changements modernes perturbateurs"
explanation: >-
  La position socialiste dans les débats sociétaux est constamment façonnée par un cadre conflictuel dominant/dominé. Sur le mariage, il s'agit de la majorité hétérosexuelle opprimant une minorité homosexuelle. Sur l'immigration, les restrictions fondées sur la nationalité sont des formes d'oppression. Sur les armes à feu, seul l'État devrait détenir la force pour protéger les vulnérables. Sur les boissons sucrées, les industriels tirent profit de la vulnérabilité des moins protégés. Cette grille oppresseur/opprimé se reproduit dans de nombreux domaines, y compris le genre, la race et même la relation entre l'humanité et la nature.
reviewed: false
