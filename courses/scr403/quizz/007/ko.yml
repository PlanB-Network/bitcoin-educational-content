question: Simplicity에서 불리언 타입(𝟚)은 어떻게 정의되나요?
answer: 정확히 두 값(false와 true)을 담는 합 타입 𝟙 + 𝟙로 정의됩니다.
wrong_answers:
  - 그러면 하나의 값만 담게 되는 곱 타입 𝟙 × 𝟙로 정의됩니다.
  - 언어에 직접 내장된 특별한 원시 타입으로 정의됩니다.
  - 값 0과 1만 허용하도록 제한된 32비트 정수 타입으로 정의됩니다.
explanation: >-
  불리언 타입 𝟚은 두 유닛 타입의 합인 𝟙 + 𝟙로 정의됩니다. 왼쪽 태그가 붙은
  값 σᴸ⟨⟩는 false(0)를 나타내고, 오른쪽 태그가 붙은 값 σᴿ⟨⟩는 true(1)를
  나타냅니다. 이는 유닛 타입과 합 타입 형성자만으로 만들어진 1비트 데이터
  타입이며, 곱 타입 형성자는 필요하지 않습니다.
reviewed: false
