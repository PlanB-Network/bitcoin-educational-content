question: "Co znamená termín 'liberál' v evropské politické tradici?"
answer: "Zastánce ekonomiky laissez-faire, omezených státních zásahů a individuálních svobod"
wrong_answers:
  - "Zastánce státních zásahů, veřejného zdravotního pojištění a programů proti chudobě"
  - "Radikální anarchista, který usiluje o úplné zrušení vlády a soukromého vlastnictví"
  - "Centrista, který ve všech oblastech politiky vyvažuje socialistické a konzervativní postoje rovným dílem"
explanation: >-
  V Evropě zůstal liberalismus spojován s ekonomickou politikou laissez-faire, omezenými státními zásahy a obranou individuálních svobod. První chybná odpověď popisuje americké liberals, u nichž se význam termínu posunul k intervencionismu. Evropský liberalismus není ani anarchismus, ani centrismus.
