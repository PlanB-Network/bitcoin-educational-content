question: ප්‍රංශ විප්ලවය අතරතුර Dupont de Nemours සහභාගී වූයේ මේ සිදුවීම්වලින් කුමන එකකටද?
answer: ව්‍යවස්ථාදායක මණ්ඩලය සහ "cahiers de doléances සකස් කිරීම
wrong_answers:
  - cahiers de doléances සකස් කිරීම සහ Bastille අල්ලා ගැනීම
  - Bastille අල්ලා ගැනීම සහ ව්‍යවස්ථාදායක මණ්ඩලය
  - රජු පලා යාම සහ ව්‍යවස්ථාදායක මණ්ඩලය
explanation: |
  Dupont de Nemours ව්‍යවස්ථාදායක මණ්ඩලයට සහ cahiers de doléances සකස් කිරීමට සහභාගී වූ අතර, ප්‍රංශ විප්ලවයේ මුල් දිනවල වැදගත් භූමිකාවක් ඉටු කළේය.