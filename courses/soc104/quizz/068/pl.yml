question: "Jakie jest konserwatywne stanowisko w sprawie imigracji?"
answer: "Państwo ma suwerenne prawo kontrolować swoje granice, aby chronić bezpieczeństwo narodowe i tożsamość kulturową"
wrong_answers:
  - "Granice powinny być bezwarunkowo otwarte, ponieważ dyskryminacyjne ograniczenia naruszają prawa człowieka"
  - "Imigracja powinna być określana przez popyt rynkowy, a obywatele powinni kontraktowo decydować o swoich relacjach z cudzoziemcami"
  - "Polityka imigracyjna powinna równoważyć potrzeby gospodarcze ze skuteczną integracją na podstawie oceny ekspertów"
explanation: >-
  Konserwatyści uważają, że porządek, tożsamość i suwerenność narodowa muszą mieć pierwszeństwo przed nieograniczonym przyjmowaniem cudzoziemców lub uchodźców. Granice i dobrze zdefiniowana ludność są częścią wartości cywilizowanych. Błędne odpowiedzi reprezentują stanowisko socjalistyczne (otwarte granice jako prawa człowieka), stanowisko libertariańskie (imigracja oparta na rynku) oraz stanowisko centrowe (zrównoważone podejście kierowane przez ekspertów).
