question: "¿Cómo refuerza el sistema de dinero fiat la división entre gobernantes y gobernados?"
answer: "Permite a los gobiernos financiar gasto ilimitado mediante la creación de dinero, lo que devalúa los ahorros a través de la inflación"
wrong_answers:
  - "Da a los ciudadanos control directo sobre la política monetaria mediante elecciones democráticas y referéndums"
  - "Impide que los gobiernos se endeuden, obligándolos a depender únicamente de los impuestos para obtener ingresos"
  - "Distribuye el dinero recién creado por igual entre todos los ciudadanos para estimular el crecimiento económico"
explanation: >-
  La moneda fiat se describe como la piedra angular de la expansión del poder estatal porque permite a los gobiernos endeudarse y empujar a los bancos a imprimir dinero nuevo. La inflación resultante devalúa los ahorros de la gente, beneficiando a las entidades más ricas y poderosas. No da a los ciudadanos control monetario, ni impide el endeudamiento ni distribuye el dinero por igual.
