question: "Twentieth century के दौरान United States में classical liberals ने स्वयं को 'libertarians' कहना क्यों शुरू किया?"
answer: "क्योंकि American 'liberalism' को growing state interventionism और welfare state ने co-opt कर लिया था"
wrong_answers:
