question: "Hayek 關於中央規劃為何失敗的根本論點是什麼？"
answer: "知識只以不同個人所擁有的分散碎片形式存在，無法由中央權威集中或整合"
wrong_answers:
  - "中央規劃者在道德上腐敗，總是為自身利益而非公共善行動"
  - "民主制度對經濟變化反應太慢，使集中化決策總是過時"
  - "中央規劃失敗是因為公民故意抵抗政府命令，並拒絕遵守法規"
explanation: >-
  Hayek 的根本論點建立在資訊的性質上。他證明知識從不以集中或整合形式存在，而只以所有不同個人所擁有的分散碎片形式存在。價值是主觀的，而且只以地方性且不完整的方式被知道。坐在辦公室裡的中央規劃者，不知道事物的真實價格，因為他沒有參與互動與交換。
reviewed: false
