question: "برداشت لیبرتارین از آزادی چه تفاوتی با برداشت میانه‌رو دارد؟"
answer: "لیبرتارین‌ها آزادی را یک اصل موضوعهٔ بی‌قیدوشرط می‌دانند، در حالی که میانه‌روها بسته به زمینه و کارایی، از آزادی‌ها به‌صورت فرصت‌طلبانه دفاع می‌کنند"
wrong_answers:
  - "لیبرتارین‌ها به دولت اجازه می‌دهند آزادی را به‌صورت گزینشی محافظت کند، در حالی که میانه‌روها هرگونه دخالت دولت در حفاظت از حقوق فردی را رد می‌کنند"
  - "لیبرتارین‌ها آزادی را فقط بر امور اقتصادی متمرکز می‌کنند، در حالی که میانه‌روها آزادی را به‌طور گسترده در حوزه‌های اجتماعی و فرهنگی به‌کار می‌گیرند"
  - "لیبرتارین‌ها و میانه‌روها برداشت یکسانی از آزادی دارند، اما دربارهٔ اندازهٔ دولتی که برای اجرای آن لازم است اختلاف دارند"
explanation: >-
  لیبرتارین‌ها آزادی را اصلی عمومی و بی‌قیدوشرط تعریف می‌کنند که مانند یک اصل موضوعه عمل می‌کند. در مقابل، میانه‌روها از برخی آزادی‌ها به شیوه‌ای فرصت‌طلبانه و وابسته به زمینه دفاع می‌کنند، بی‌آنکه هیچ اصل عمومی‌ای را به‌کار گیرند. رویکرد میانه‌روها برداشتی ابزاری از آزادی را آشکار می‌کند؛ آزادی‌ای که همیشه تابع اهداف عمل‌گرایانه‌ای مانند کارایی است، و لیبرتارین‌ها اساساً آن را رد می‌کنند.
reviewed: false
