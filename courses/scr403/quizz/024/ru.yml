question: "Какой тип имеет программа Simplicity?"
answer: 1 ⊢ 1 (unit в unit) — нет значимого входа или выхода; ввод-вывод обеспечивают побочные эффекты.
wrong_answers:
  - TxEnv ⊢ Bool — она принимает данные транзакции и возвращает булево значение валидности.
  - 2^256 ⊢ 2^256 — она принимает хеш на входе и возвращает новое хеш-значение на выходе.
  - Любой тип A ⊢ B — программы могут иметь совершенно произвольные типы входа и выхода.
explanation: >-
  Программа Simplicity определяется как выражение типа 1 ⊢ 1. Эффект
  Reader захватывает вход в виде окружения транзакции, а эффект Failure
  определяет успех или неудачу. Именно эти побочные эффекты обеспечивают
  весь ввод-вывод, а не сами типы Simplicity.
reviewed: true
