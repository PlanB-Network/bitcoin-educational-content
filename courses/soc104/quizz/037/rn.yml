question: "Porogarama z'imfashanyo z'imibano zifashwe mu mafaranga na Leta zishobora gute kuvyara ingaruka mbi, bikerekana akaga ko kwizigira imigambi gusa?"
answer: "Zishobora kurema ukwizigira abandi, gukuraho ibituma abantu bakora, kandi zikaba ubunyazi kuko amahera ategerezwa kubanza gukurwa ku bakoze ubwo butunzi"
wrong_answers:
  - "Ziremesha abantu kuziganya birenze urugero, zikagabanya ugukoresha amahera, maze zigatera igabanuka ry'ibiciro mu butunzi muri rusangi"
  - "Zikomeza amashirahamwe yigenga mu kwimurira Leta ibiciro vy'abakozi no mu kugabanya igikenewe c'imishahara ihiganwa"
  - "Zikuraho cane itandukaniro ry'imigwi ku buryo ukuduga canke ukumanuka mu kibano biba bitagikenewe, maze guhanga udushasha bigahagarara"
explanation: >-
  Friedman agabisha ko imigambi myiza ishobora kuvyara ingaruka mbi iyo yirengagije isesengura rikomeye ry'ibituma abantu bakora. Porogarama z'imfashanyo zifashwe mu mafaranga na Leta zishobora kurema ukwizigira abandi, ntizitange ikintu gituma abantu bakora, kandi zigakora nk'ubunyazi kuko amahera ategerezwa kubanza gukurwa ku baremye ubutunzi. Ibivamwo bipimika nk'ukugabanya ubukene n'ubushobozi bwo gukora neza bitegerezwa kuza imbere y'imigambi myiza.
