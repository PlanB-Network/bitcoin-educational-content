question: "Bitcoin 如何作為一個帶有政治後果的道德計畫，而不是一個帶有道德主張的政治計畫？"
answer: "Bitcoin 的設計目的是讓人自由，而不是讓人富有；它使有效財產成為可能、保護工作的價值並維護隱私，這些都是產生政治效果的道德成就，卻不宣稱屬於任何政治陣營"
wrong_answers:
  - "Bitcoin 是道德計畫，因為其程式碼強制執行防止詐欺的倫理規則，而其政治後果是以演算法決策取代民主治理"
  - "Bitcoin 作為道德計畫，是因為它把財富從富人重新分配給早期採用者，創造一個更公平的社會，並對稅收政策產生政治影響"
  - "Bitcoin 是道德的，因為 Satoshi Nakamoto 在協議中嵌入了倫理戒律，而其政治後果是將所有政治家族團結在一套共同貨幣系統之下"
explanation: >-
  Bitcoin 的設計不是為了讓人富有，而是為了讓人自由。它實現了三項道德結果：使有效財產成為可能（激勵責任）、保護由工作創造的價值（鼓勵生產性努力），以及維護隱私（讓人們能夠無懼地生活）。這些都是帶有政治後果的道德成就，卻不屬於任何政治陣營，因此它首先是一個道德計畫，其次才是政治計畫。
reviewed: false
