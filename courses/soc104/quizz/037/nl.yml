question: "Waarom bekritiseerde Rothbard de visie van de libertaires op de menselijke natuur, en welk alternatief stelde hij voor?"
answer: "Hij beschuldigde hen van een naïeve 'nobele wilde'-visie en betoogde dat de samenleving privé-eigendom en goede prikkels moet gebruiken om door eigenbelang gestuurd gedrag te leiden"
wrong_answers:
  - "Hij prees hun begrip van menselijke samenwerking, maar betoogde dat een minimale staat nog steeds nodig was om contracten af te dwingen"
  - "Hij was het ermee eens dat mensen van nature goed zijn, maar hield vol dat alleen vrije markten die goedheid in productieve activiteit konden kanaliseren"
  - "Hij verwierp hun nadruk op individuele rechten en betoogde in plaats daarvan dat gemeenschappen collectief morele normen zouden moeten definiëren"
explanation: >-
  Rothbard bekritiseerde de libertaires omdat zij een naïeve, Rousseau-achtige visie op de menselijke natuur aannamen als van nature goed. Hij betoogde in plaats daarvan dat mensen door eigenbelang worden geleid, en dat de samenleving zo moet worden georganiseerd dat goede prikkels gedrag sturen. Dit vereist het erkennen en garanderen van privé-eigendom. De staat afschaffen betekent niet zijn functies afschaffen; politie en justitie zouden door de vrije markt via concurrentie moeten worden beheerd.
reviewed: false
