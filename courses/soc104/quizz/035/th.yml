question: "หลักการไม่รุกรานตามที่ Murray Rothbard วางทฤษฎีไว้คืออะไร?"
answer: "การริเริ่มใช้กำลังทางกายต่อปัจเจกบุคคลอื่นหรือทรัพย์สินของเขาเป็นสิ่งไม่ชอบธรรม แม้ความรุนแรงเชิงป้องกันจะได้รับอนุญาต"
wrong_answers:
  - "ความรุนแรงทุกรูปแบบผิดเสมอ รวมถึงการป้องกันตนเองและการต่อต้านการกดขี่"
  - "ความรุนแรงยอมรับได้เมื่อมุ่งต่อสถาบันที่กดขี่ แต่ไม่เคยมุ่งต่อปัจเจกบุคคลอื่น"
  - "รัฐเท่านั้นที่มีสิทธิชอบธรรมในการใช้กำลัง และปัจเจกบุคคลต้องไม่หันไปใช้ความรุนแรงเลย"
explanation: >-
  หลักการไม่รุกรานของ Rothbard ถือว่าการริเริ่มใช้กำลังทางกายต่อบุคคลอื่นหรือทรัพย์สินของเขาเป็นสิ่งไม่ชอบธรรม มันเป็นการแปลทางปรัชญาของกฎทอง อย่างไรก็ตาม มันไม่ได้ห้ามความรุนแรงทั้งหมด: ความรุนแรงเชิงป้องกัน รวมถึงการป้องกันตนเองและการต่อต้านการกดขี่ ถือว่าชอบธรรม สิ่งนี้ทำให้มันแตกต่างจากสันตินิยมบริสุทธิ์ และจากการผูกขาดการใช้กำลังที่รัฐกล่าวอ้าง
reviewed: false
