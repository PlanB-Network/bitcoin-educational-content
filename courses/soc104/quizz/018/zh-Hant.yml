question: "Nolan 框架中呈現的國家主義定義是什麼？"
answer: "使用立法來控制並塑造社會，無論是以捍衛文明、工人階級、自然或受壓迫者之名"
wrong_answers:
  - "一種政府制度，其中民選官員任期固定，權力透過民主選舉交接"
  - "相信只有強大的軍隊才能保護一個國家的主權與領土完整"
  - "一種經濟哲學，透過關稅與配額優先保護本國產業而非外國競爭"
explanation: >-
  國家主義被定義為使用立法來控制並塑造社會。左翼與右翼都會實踐它：有些人以捍衛文明之名，另一些人以捍衛工人階級、自然或受壓迫者之名。即使是中間主義者，只要符合自身利益，也會認可它。國家主義並不限於軍事政策、貿易保護主義，或單純擁有民選政府。
reviewed: false
