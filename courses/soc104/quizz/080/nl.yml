question: "Waarom bleek Molinari's voorspelling uit 1849 profetisch wat betreft de relatie tussen vrijheid en politieke macht?"
answer: "Omdat conservatieven en socialisten elkaar aan de macht hebben afgewisseld en vrijheid hebben geïnstrumentaliseerd ten dienste van hun respectieve politieke doelen, precies zoals hij beschreef"
wrong_answers:
  - "Omdat het door hem beschreven personage van de econoom uiteindelijk politieke macht verwierf en libertarisch beleid in heel Europa invoerde"
  - "Omdat zijn voorspelling dat alle drie de politieke families zouden samensmelten tot één centristische beweging in de twintigste eeuw uitkwam"
  - "Omdat vrijheid geleidelijk door opeenvolgende regeringen werd uitgebreid totdat zij het primaire organiserende principe van moderne democratieën werd"
explanation: >-
  Molinari's visie bleek profetisch omdat conservatieven en socialisten sinds het midden van de negentiende eeuw elkaar aan de macht hebben afgewisseld en precies hebben uitgevoerd wat hij beschreef: de instrumentalisering van vrijheid ten dienste van politieke doelen. Beide families zijn bereid vrijheden te beperken en een beroep te doen op de staat om hun respectieve agenda's op te leggen, terwijl de positie van de econoom van onvoorwaardelijke vrijheid gemarginaliseerd bleef.
reviewed: false
