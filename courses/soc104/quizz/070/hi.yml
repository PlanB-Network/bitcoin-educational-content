question: "न्यूनतम वेतन पर कंजरवेटिव और लिबर्टेरियन स्थितियां अपने तर्क में कैसे भिन्न हैं, जबकि दोनों इसके उन्मूलन के पक्ष में हैं?"
answer: "कंजरवेटिव वेतन-निर्धारण में राज्य की कुछ भूमिका स्वीकार करते हैं यदि वह प्रतिस्पर्धात्मकता में बाधा न डाले, जबकि लिबर्टेरियन न्यूनतम वेतन को नियुक्ति और व्यवसाय करने की स्वतंत्रता पर नैतिक थोपना मानते हैं"
wrong_answers:
  - "कंजरवेटिव न्यूनतम वेतन का विरोध इसलिए करते हैं क्योंकि यह मुद्रास्फीति पैदा करता है, जबकि लिबर्टेरियन इसका विरोध इसलिए करते हैं क्योंकि यह श्रमिक संघों को बहुत अधिक शक्ति देता है"
  - "कंजरवेटिव चाहते हैं कि वेतन धार्मिक और सामुदायिक संस्थाएं तय करें, जबकि लिबर्टेरियन चाहते हैं कि वेतन सरकार-स्वीकृत बाज़ार अध्ययनों से निर्धारित हो"
  - "कंजरवेटिव मानते हैं कि न्यूनतम वेतन क्षेत्र के अनुसार अलग-अलग होना चाहिए, जबकि लिबर्टेरियन मानते हैं कि पूरे देश में एक ही समान वेतन लागू होना चाहिए"
explanation: >-
  दोनों न्यूनतम वेतन को घटाने या समाप्त करने के पक्ष में हैं, लेकिन उनके तर्क मूलतः अलग हैं। कंजरवेटिव वेतन-निर्धारण में राज्य की कुछ भूमिका स्वीकार करते हैं, पर जोर देते हैं कि वह न्यूनतम और संदर्भ-निर्भर रहे, और प्रतिस्पर्धात्मकता पर ध्यान केंद्रित करते हैं। लिबर्टेरियन अधिक मजबूत नैतिक स्थिति लेते हैं: न्यूनतम वेतन नियुक्ति और व्यवसाय करने की स्वतंत्रता पर थोपना है। जब लिबर्टेरियन ‘बाज़ार’ कहते हैं, तो उनका अर्थ अनुबंध से होता है, जो राज्य के हस्तक्षेप के बिना दो पक्षों के बीच स्वतंत्र रूप से तय किया गया हो।
