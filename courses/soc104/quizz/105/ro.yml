question: "Luând în considerare întregul argument al acestui curs, cum întruchipează Bitcoin simultan critica libertariană a constructivismului, angajamentul cypherpunk față de acțiune și apărarea individualistă a autonomiei morale?"
answer: "Bitcoin înlocuiește banii planificați central cu o ordine spontană de piață (anti-constructivism), transformă idealul abstract al libertății financiare în cod funcțional (acțiune cypherpunk) și redă individului proprietatea suverană și confidențialitatea (autonomie morală)"
wrong_answers:
  - "Bitcoin folosește guvernarea democratică pentru a stabili politica monetară (anti-constructivism), publică conținut educațional despre libertatea financiară (acțiune cypherpunk) și permite indivizilor să voteze asupra schimbărilor de protocol (autonomie morală)"
  - "Bitcoin elimină toate reglementările financiare (anti-constructivism), creează o comunitate de dezvoltatori care fac lobby pentru dereglementare (acțiune cypherpunk) și oferă indivizilor bogați mai mult control asupra politicii monetare (autonomie morală)"
  - "Bitcoin descentralizează infrastructura de servere în mai multe țări (anti-constructivism), folosește licențierea open-source pentru a împărtăși tehnologia liber (acțiune cypherpunk) și oferă platforme de social media anonime pentru disidență politică (autonomie morală)"
explanation: >-
  Bitcoin se află la intersecția a trei tradiții intelectuale explorate în curs. El întruchipează argumentul anti-constructivist prin înlocuirea banilor fiat planificați central cu o ordine monetară spontană, descentralizată, pe care niciun planificator central nu o poate controla. El îndeplinește imperativul cypherpunk de a scrie cod, transformând idealurile abstracte de libertate financiară și confidențialitate în tehnologie funcțională. Și servește apărarea individualistă a autonomiei morale, permițând proprietatea suverană, protejând roadele muncii și păstrând confidențialitatea, lăsând fiecare persoană să fie stăpâna propriei vieți.
reviewed: false
