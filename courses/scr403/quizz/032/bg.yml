question: Доказателството за пълнота изгражда всяка функция чрез влагане на case за декомпозиране на входа и scribe за всеки изход. Защо това е само теоретичен инструмент?
answer: Полученият израз е гигантска таблица за търсене, чийто размер расте експоненциално — 256-битов вход би изисквал около 2²⁵⁶ записа.
wrong_answers:
  - scribe е макрос, а не основен комбинатор, така че изразът излиза извън формално верифицирания език.
  - Bit Machine го оценява за експоненциално време, въпреки че самият израз остава компактен чрез споделяне.
  - Вложен case може да декомпозира само sum типове, така че конструкцията се проваля при всеки вход с product тип.
explanation: >-
  Конструкцията изброява всеки възможен вход чрез вложена case
  декомпозиция и твърдо кодира всеки изход със scribe, така че размерът на
  израза експлодира експоненциално — астрономически за реалистични типове като
  256-битови думи. Раздуването е в размера на израза, а не във времето за
  изпълнение на иначе компактен израз. scribe се разгръща в истински основни
  комбинатори (unit, injl, injr, pair), така че резултатът остава вътре в
  основния език, чиято теорема за пълнота е формално верифицирана в Rocq;
  а декомпозицията обработва входове от всякакъв тип, включително product типове.
reviewed: false
