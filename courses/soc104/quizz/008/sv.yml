question: "Vilken intern spänning finns bland libertarianer i Nolan-diagrammet?"
answer: "Vissa vill avskaffa staten helt (anarkokapitalister) medan andra föredrar en minimal stat som behåller centrala suveräna funktioner (minarkister)"
wrong_answers:
  - "Vissa vill ha stark ekonomisk reglering medan andra föredrar fullständig avreglering av alla industrier"
  - "Vissa stödjer demokratiska val medan andra föredrar ett ärftligt styrelseskick"
  - "Vissa förespråkar progressiv socialpolitik medan andra försvarar strikt traditionella moraliska värden"
explanation: >-
  Inom den libertarianska familjen finns en grundläggande oenighet om statens roll. Anarkokapitalister vill ersätta alla statliga funktioner med privata tjänster, medan minarkister accepterar en minimal stat som behåller centrala suveräna funktioner som försvar och domstolar. Båda grupperna delar den libertarianska toppen men skiljer sig åt i frågan om någon stat över huvud taget bör finnas.
reviewed: false
