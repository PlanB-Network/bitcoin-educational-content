question: "Miksi klassiset liberaalit Yhdysvalloissa alkoivat kutsua itseään 'libertaristeiksi' 1960-luvulta lähtien?"
answer: "Erottuakseen amerikkalaisista liberaaleista, joiden käyttämän termin merkitys oli siirtynyt kohti valtion interventionismia"
wrong_answers:
  - "Liittyäkseen demokraattiseen puolueeseen ja sen edistyksellisiin sosiaaliohjelmiin"
  - "Ilmaistakseen tukensa Lyndon B. Johnsonin Great Society -uudistuksille"
  - "Omaksuakseen radikaalimman vallankumouksellisen identiteetin, joka oli saanut vaikutteita eurooppalaisista sosialistisista liikkeistä"
explanation: >-
  Yhdysvalloissa sana 'liberal' siirtyi tarkoittamaan suuren valtion ja valtion puuttumisen kannattajia, erityisesti New Dealin ja Great Societyn jälkeen. Klassiset liberaalit omaksuivat nimikkeen 'libertaristi' säilyttääkseen filosofiansa alkuperäisen merkityksen. He ottivat etäisyyttä amerikkalaisiin liberaaleihin eivätkä liittoutuneet heidän kanssaan.
