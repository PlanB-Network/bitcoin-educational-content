question: "Ce teren comun împărtășesc libertarienii și conservatorii și ce îi desparte?"
answer: "Împărtășesc atașamentul față de guvernarea limitată și respingerea egalitarismului forțat, dar nu sunt de acord asupra intervenționismului militar și a politicilor sociale"
wrong_answers:
  - "Împărtășesc sprijinul pentru politici comerciale protecționiste și apărare națională, dar nu sunt de acord asupra rolului religiei în viața publică"
  - "Împărtășesc un angajament față de impozitarea progresivă și programele de asistență socială, dar nu sunt de acord asupra politicii de imigrație"
  - "Împărtășesc opoziția față de comerțul liber și legalizarea drogurilor, dar nu sunt de acord asupra dimensiunii guvernului federal"
explanation: >-
  Libertarienii și conservatorii susțin amândoi guvernarea limitată, resping egalitarismul forțat, se opun datoriei publice și apără drepturile statelor federale. Totuși, libertarienii resping intervenționismul militar al neoconservatorilor, se opun politicilor sociale conservatoare și subvențiilor, condamnă interdicția drogurilor și resping protecționismul. Alianța este reală, dar inerent tensionată.
reviewed: false
