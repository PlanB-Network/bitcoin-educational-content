question: "V čom spočíva kľúčová nezhoda medzi libertariánmi a inými politickými rodinami, keď zdieľajú rovnaké ciele?"
answer: "Nezhoda sa týka prostriedkov: libertariáni odmietajú nátlakové riešenia a uprednostňujú dobrovoľnú výmenu prostredníctvom trhového procesu"
wrong_answers:
  - "Nezhoda sa týka cieľov: libertariáni sledujú odlišné ciele, napríklad individuálne bohatstvo namiesto spoločenského blahobytu"
  - "Nezhoda sa týka načasovania: libertariáni chcú dosiahnuť rovnaké ciele pomalšie prostredníctvom postupnej reformy"
  - "Nezhoda sa týka rozsahu: libertariáni chcú uplatňovať rovnaké politiky iba na miestnej, a nie národnej úrovni"
explanation: >-
  Libertariáni sa môžu so socialistami, konzervatívcami a centristami zhodnúť na určitých cieľoch, ako je obrana utláčaných alebo podpora sociálnej súdržnosti. Nezhoda nespočíva v cieľoch, ale v prostriedkoch. Libertariáni odmietajú všetky nátlakové riešenia, ktoré sa snažia uniformizovať praktiky a regulácie, a namiesto toho obhajujú moc voľby a zodpovednú slobodu prostredníctvom slobodnej, decentralizovanej výmeny založenej na dobrovoľných zmluvách.
