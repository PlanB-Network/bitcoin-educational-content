question: "Dove si collocano i Verdi nel diagramma di Nolan, e perché?"
answer: "Molto in basso nel diagramma, perché ritengono che l'interesse individuale non debba prevalere sull'interesse collettivo del pianeta"
wrong_answers:
  - "In cima al diagramma, perché danno pari priorità alla libertà personale e alla consapevolezza ambientale"
  - "Al centro del diagramma, perché bilanciano la crescita economica con la protezione dell'ambiente"
  - "All'estrema destra, perché sostengono soluzioni basate sul mercato alle sfide ambientali"
explanation: >-
  I Verdi si collocano molto in basso nel diagramma di Nolan perché favoriscono un forte controllo statale sia sulle decisioni economiche sia su quelle personali in nome del benessere planetario. Hanno sostituito la lotta di classe marxista con una lotta tra uomo e natura, e tendono a difendere il controllo economico e persino l'abolizione della proprietà privata. Questo li colloca nel settore autoritario, non in cima o al centro.
reviewed: false
