question: "为什么在诺兰图中，纵轴（上—下）被认为比横轴（左—右）更根本？"
answer: "因为它揭示了捍卫最大个人自由的人，与偏好最大国家控制的人之间的真正分野"
wrong_answers:
  - "因为它比横轴衡量社会政策更准确地衡量经济产出"
  - "因为历史上大多数政治冲突都关乎文化认同，而非治理"
  - "因为横轴只适用于现代民主国家，而纵轴是普遍适用的"
explanation: >-
  根本轴线是纵轴，因为它捕捉到核心政治问题：国家应在多大程度上控制人的行动？左右轴只是反映不同的感性倾向（社会正义 vs. 传统），但双方作为国家主义者时，可能在纵轴上占据相同位置。纵轴揭示一个人是想以强制力施加自己的愿景，还是尊重个人自由。
reviewed: false
