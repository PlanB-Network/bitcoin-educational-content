question: "Hayek විස්තර කළ spontaneous order සඳහා පහත දේවල් අතරින් උදාහරණයක් වන්නේ කුමක්ද?"
answer: "Language, එය bureau එකක intellectuals විසින් design කිරීම වෙනුවට historical interactions හරහා organic ලෙස වර්ධනය විය"
wrong_answers:
  - "A national constitution, එය සමාජ rules ස්ථාපිත කිරීමට elected representatives විසින් සැලකිල්ලෙන් draft කරන ලදී"
  - "A government stimulus plan, එය economic activity සම්බන්ධීකරණය කිරීමට economists විසින් design කරන ලදී"
  - "A public education system, එය knowledge වෙත universal access සහතික කිරීමට legislators විසින් නිර්මාණය කරන ලදී"
explanation: >-
  Hayek spontaneous order විස්තර කරන්නේ සමාජයේ නිදහස් interactions වල නිෂ්පාදනයක් ලෙසය; එය human action වෙතින් ලැබෙන නමුත් deliberate human design වෙතින් නොවේ. Language ප්‍රධාන උදාහරණයකි: French, English, සහ German යනු grammar rules තීරණය කරන intellectuals විසින් constructed කරන ලද දේවල් නොව, historical interactions හරහා ඉදි වූ මන්දගාමී, organic organization එකක ඵලය ලෙස මතුවූ දේවල්ය.
reviewed: false
