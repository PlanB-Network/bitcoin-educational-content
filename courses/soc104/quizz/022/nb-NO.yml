question: "Hva er politisk konservatisme?"
answer: "En ideologi som tar sikte på å bevare etablerte politiske institusjoner og sosial orden, og motsetter seg større strukturelle omveltninger"
wrong_answers:
  - "En personlig forpliktelse til tradisjonelle familieverdier og religiøs praksis uten å søke å påtvinge dem andre"
  - "En filosofi som fremmer rask sosial endring gjennom demokratisk reform og progressiv lovgivning"
  - "En økonomisk teori som tar til orde for frie markeder, minimal beskatning og avskaffelse av handelshindringer"
explanation: >-
  Politisk konservatisme er en ideologi, ofte representert i høyreorienterte eller ytre høyre-partier, som tar sikte på å bevare etablerte politiske institusjoner og sosial orden, samtidig som den motsetter seg større strukturelle omveltninger. Tilhengerne ønsker å bruke makt og lov til å verne om sin arv. Dette skiller seg fra kulturell konservatisme, som er et personlig livsvalg snarere enn et politisk program.
