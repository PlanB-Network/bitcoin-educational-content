question: "Wat onthult de verticale as van het Nolan-diagram over de echte politieke vraag?"
answer: "Ze onthult of je je eigen gevoeligheden via de staat aan anderen wilt opleggen, of liever hebt dat ieder persoon vrij is om zelf te beslissen"
wrong_answers:
  - "Ze onthult of je democratisch bestuur steunt of de voorkeur geeft aan autoritair bewind door één leider"
  - "Ze onthult of je je identificeert met progressieve sociale bewegingen of met traditionele religieuze instellingen"
  - "Ze onthult of je belangrijkste zorg nationale veiligheid of economische welvaart is"
explanation: >-
  De verticale as legt de echte politieke vraag bloot: niet of je links of rechts bent, maar in welke mate je wilt dat de staat ingrijpt om de samenleving volgens jouw waarden vorm te geven. Wil je je gevoeligheden aan anderen opleggen, of heb je liever dat ieder persoon vrij is om zelf te beslissen? Dit kader overstijgt de links-rechtsverdeling en laat zien dat beide kampen evenzeer statisten kunnen zijn.
reviewed: false
