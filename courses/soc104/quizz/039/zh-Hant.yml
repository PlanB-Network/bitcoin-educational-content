question: "為什麼政治制度的意圖性定義在分析用途上被認為有問題？"
answer: "它們造成概念混淆，因為所有制度都宣稱追求正義、平等與自由等相似目標"
wrong_answers:
  - "它們過於精確且僵硬，沒有為政治運動隨時間自然演變留下空間"
  - "它們過度聚焦於經濟結果，而忽略政治生活的文化與社會面向"
  - "它們依賴機密政府文件，而獨立研究者很少能取得這些文件"
explanation: >-
  意圖性定義依賴所宣稱的動機與目標，但每一種政治制度都宣稱追求正義、平等與自由。這使各制度彼此之間無法區分。相較之下，結構性分析會依制度的經驗性、可衡量後果及其所採用的手段來評估制度，揭示超越修辭之外的真實本質。
reviewed: false
