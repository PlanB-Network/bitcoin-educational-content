question: "ทำไมคำนิยามเชิงเจตนาของระบบการเมืองจึงถือว่าเป็นปัญหาสำหรับการวิเคราะห์?"
answer: "มันสร้างความสับสนเชิงมโนทัศน์ เพราะทุกระบบอ้างว่าไล่ตามวัตถุประสงค์คล้ายกัน เช่น ความยุติธรรม ความเสมอภาค และเสรีภาพ"
wrong_answers:
  - "มันแม่นยำและแข็งตัวเกินไป จึงไม่เหลือพื้นที่ให้ขบวนการการเมืองวิวัฒน์ตามธรรมชาติเมื่อเวลาผ่านไป"
  - "มันมุ่งเน้นผลลัพธ์ทางเศรษฐกิจมากเกินไป และละเลยมิติทางวัฒนธรรมและสังคมของชีวิตการเมือง"
  - "มันอาศัยเอกสารลับของรัฐบาลที่แทบไม่เคยมีให้แก่นักวิจัยอิสระ"
explanation: >-
  คำนิยามเชิงเจตนาอาศัยแรงจูงใจและเป้าหมายที่ประกาศไว้ แต่ทุกระบบการเมืองต่างอ้างว่าไล่ตามความยุติธรรม ความเสมอภาค และเสรีภาพ สิ่งนี้ทำให้ไม่อาจแยกแยะระบบต่าง ๆ ออกจากกันได้ ในทางตรงกันข้าม การวิเคราะห์เชิงโครงสร้างประเมินระบบจากผลลัพธ์เชิงประจักษ์ที่วัดได้และวิธีการที่มันใช้ ซึ่งเผยให้เห็นธรรมชาติที่แท้จริงเหนือกว่าวาทกรรม
reviewed: false
