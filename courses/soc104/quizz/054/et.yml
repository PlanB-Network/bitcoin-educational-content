question: "Millise valitsemisvormi poole tsentrism kaldub?"
answer: "Tehnokraatia poole, kus võim usaldatakse ekspertidele, kes juhivad majandust ja rahapoliitikat"
wrong_answers:
  - "Otsedemokraatia poole, kus kodanikud hääletavad iga suurema poliitilise otsuse üle"
  - "Aristokraatia poole, kus võim kuulub traditsioonilisele valitsevale klassile"
  - "Laissez-faire-valitsemise poole, kus turg reguleerib ennast ilma riigi sekkumiseta"
explanation: >-
  Tsentrism eelistab tõhusust ja pragmatismi ning kaldub tehnokraatia poole, mis tähendab, et võim tuleks usaldada ekspertidele, kes juhivad majandust ja suunavad rahapoliitikat. See erineb põhimõtteliselt otsedemokraatiast, aristokraatiast või laissez-faire'ist, millest igaüks jaotab võimu täiesti erinevate põhimõtete järgi.
