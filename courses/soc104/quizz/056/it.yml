question: "Che cosa pongono i libertari al centro della loro filosofia politica?"
answer: "Etica e diritto"
wrong_answers:
  - "Crescita economica e creazione di ricchezza"
  - "Uguaglianza sociale e benessere collettivo"
  - "Identità nazionale e preservazione culturale"
explanation: >-
  I libertari si distinguono da tutte le altre famiglie politiche ponendo etica e diritto al centro della loro filosofia, non l'economia. Quando difendono l'economia di mercato, lo fanno meno per la sua capacità di produrre ricchezza che per la sua promozione della libertà e della responsabilità individuali. La crescita economica è un beneficio secondario, non il principio fondante.
