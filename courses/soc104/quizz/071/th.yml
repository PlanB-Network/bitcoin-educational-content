question: "ทำไมลิเบอร์ทาเรียนจึงคัดค้านภาษี?"
answer: "เพราะมันเป็นการละเมิดทางศีลธรรมต่อสิทธิในทรัพย์สิน เป็นรูปแบบหนึ่งของการขโมยโดยรัฐที่ยึดทรัพย์สินของผู้อื่นโดยปราศจากความยินยอม"
wrong_answers:
  - "เพราะภาษีไม่มีประสิทธิภาพทางเศรษฐกิจและนำไปสู่อัตราการว่างงานที่สูงขึ้นเสมอ"
  - "เพราะภาษีบั่นทอนการลงทุนจากต่างประเทศและทำให้ตำแหน่งแข่งขันของประเทศอ่อนแอลง"
  - "เพราะระบบภาษีก้าวหน้ามุ่งเป้าไปที่คนมั่งคั่งซึ่งสร้างงานมากที่สุดอย่างไม่เป็นธรรม"
explanation: >-
  ข้อคัดค้านของลิเบอร์ทาเรียนต่อภาษีเป็นเรื่องศีลธรรมก่อนเป็นเรื่องเศรษฐกิจ ลิเบอร์ทาเรียนมองภาษีเป็นรูปแบบหนึ่งของการขโมยโดยรัฐและเป็นอุปสรรคต่อทรัพย์สินส่วนตัว เพราะมันประกอบด้วยการยึดทรัพย์สินของผู้อื่นโดยปราศจากความยินยอม แม้อาจมีข้อโต้แย้งทางเศรษฐกิจต่อภาษี แต่ข้อโต้แย้งลิเบอร์ทาเรียนฐานรากตั้งอยู่บนหลักการว่ามันละเมิดสิทธิในทรัพย์สิน ไม่ใช่บนการคำนวณเรื่องประสิทธิภาพหรือความสามารถในการแข่งขัน
reviewed: false
