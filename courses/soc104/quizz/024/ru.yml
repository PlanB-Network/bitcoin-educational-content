question: "Что такое палеолибертарианство?"
answer: "Синтез, сочетающий отвержение государства как источника принуждения с укреплением традиционных институтов и добровольных социальных структур"
wrong_answers:
  - "Либертарианское движение, которое отвергает все традиционные ценности и продвигает радикальный социальный прогрессивизм"
  - "Консервативная идеология, которая использует государственную власть для принудительного утверждения традиционных ценностей, допуская при этом некоторую экономическую свободу"
  - "Центристская философия, которая ищет сбалансированный компромисс между социалистической экономикой и консервативной социальной политикой"
explanation: >-
  Палеолибертарианство сочетает отвержение государства как институционального источника принуждения с укреплением традиционных институтов и предпочтением добровольных социальных структур государственной власти. Оно отличается от неолибертарианства большей симпатией к традиционным ценностям. Палеолибертарианец не выступает против того, чтобы сообщества организовывались вокруг социалистических или коммунитарных принципов; он лишь отвергает то, что такие сообщества силой закона навязывают свои ценности всем.
