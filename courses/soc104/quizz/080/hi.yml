question: "रूढ़िवादी राजनीतिक दर्शन में स्वतंत्रता से ऊपर किसे प्राथमिकता मिलती है?"
answer: "व्यवस्था और परंपरा को, जिन्हें स्वतंत्रता को मूल्यवान मानने से पहले दृढ़ता से स्थापित होना चाहिए"
wrong_answers:
  - "सामाजिक न्याय और समानता को, जिन्हें व्यक्तियों के सचमुच स्वतंत्र होने से पहले सुनिश्चित किया जाना चाहिए"
  - "आर्थिक दक्षता और व्यावहारिक परिणामों को, जो तय करते हैं कि स्वतंत्रता कब उपयुक्त है"
  - "व्यक्तिगत संपत्ति अधिकारों को, जिन्हें किसी भी अन्य स्वतंत्रता से पहले संरक्षित किया जाना चाहिए"
explanation: >-
  रूढ़िवादियों के लिए, व्यवस्था और परंपरा स्वतंत्रता से ऊपर प्राथमिकता रखती हैं। वे तर्क देते हैं कि बहुत अधिक स्वतंत्रता अराजकता और सामाजिक अव्यवस्था पैदा करती है, इसलिए स्वतंत्रता को तभी मूल्यवान माना जा सकता है जब व्यवस्था दृढ़ता से स्थापित हो चुकी हो। यह उस समाजवादी दृष्टिकोण से भिन्न है जो न्याय को प्राथमिकता देता है, या उस केंद्रवादी दृष्टिकोण से जो दक्षता पर केंद्रित है।
