question: LiquidのDynamic Federation（Dynafed）で、ファンクショナリーを入れ替える必要が生じた場合、移行の過程でネットワークの構成はどうなりますか？
answer: ネットワークが移行トランザクションをブロードキャストし、2週間の重複期間を経てから新しい構成に切り替わる
wrong_answers:
  - ネットワークが移行トランザクションをブロードキャストした直後に、新しいファンクショナリー構成に切り替わる
  - 構成を変更する前に、すべてのファンクショナリーが同時に投票して入れ替えを承認しなければならない
  - ファンクショナリーのリストを更新して運用を再開するために、ハードフォークと一時的な停止が必要になる
explanation: |
  Dynamic Federationによって、Liquidは綿密に設計された移行の手順を通じ、ハードフォークなしで進化できます。ファンクショナリーの入れ替えが必要になると、ネットワークは今後の変更を知らせる移行トランザクションをブロードキャストします。その後、新旧の構成が共存する2週間の重複期間が必ず設けられ、途切れのない継続性が確保されます。他の選択肢が誤りなのは、即時の切り替えはネットワークを不安定にするおそれがあり、同時投票は使われている仕組みではなく、そしてハードフォークこそDynafedが避けるために設計されたものだからです。