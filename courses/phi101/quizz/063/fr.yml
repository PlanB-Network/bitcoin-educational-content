question: Quel était le principal argument de Nicolas Oresme contre les altérations monétaires ?
answer: Elles profitent aux dirigeants aux dépens de la communauté.
wrong_answers:
  - Elles empêchent le commerce international.
  - Elles violent la loi divine telle qu'énoncée dans les Écritures.
  - Elles sont trop complexes techniquement pour les ateliers monétaires médiévaux.
explanation: |
  Nicolas Oresme soutenait que les altérations monétaires profitent principalement au prince aux dépens de la communauté, constituant une forme injuste d'appropriation. Il soulignait que ces manipulations entraînent des pénuries, des marchés noirs et une instabilité économique.
reviewed: true
