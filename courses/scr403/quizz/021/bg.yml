question: "Защо ефектът Failure е комутативен в Simplicity, въпреки че изключенията по принцип не са комутативни?"
answer: Защото типът на изключението е unit (1) само с една стойност, така че редът на хвърляне няма значение.
wrong_answers:
  - Защото Simplicity изпълнява всички изрази в детерминиран ред, дефиниран от дървото на комбинаторите.
  - Защото ефектът Failure винаги се прихваща и след това се хвърля повторно от комбинатора case.
  - Защото Simplicity използва пакетна верификация, която прави всички хвърлени изключения еквивалентни.
explanation: >-
  По принцип изключенията не са комутативни, защото различни изрази могат да хвърлят различни
  стойности на изключения. Simplicity обаче ограничава изключенията до unit тип (само една възможна стойност),
  така че размяната на реда на два потенциално провалящи се израза произвежда едно и също изключение независимо
  кой от тях действително се проваля. Това свойство на комутативност позволява важни оптимизации на програмите.
reviewed: true
