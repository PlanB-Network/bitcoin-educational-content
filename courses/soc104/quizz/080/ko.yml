question: "리버테리언과 다른 정치 가족들이 같은 목표를 공유할 때 핵심 의견 차이는 무엇인가요?"
answer: "의견 차이는 수단에 관한 것입니다: 리버테리언은 강제적 해법을 거부하고 시장 과정을 통한 자발적 교환을 선호합니다"
wrong_answers:
  - "의견 차이는 목적에 관한 것입니다: 리버테리언은 사회복지가 아니라 개인의 부와 같은 다른 목표를 추구합니다"
  - "의견 차이는 시기에 관한 것입니다: 리버테리언은 점진적 개혁을 통해 같은 목표를 더 천천히 달성하고자 합니다"
  - "의견 차이는 범위에 관한 것입니다: 리버테리언은 같은 정책을 전국 수준이 아니라 오직 지역 수준에만 적용하고자 합니다"
explanation: >-
  리버테리언은 억압받는 사람들을 옹호하거나 사회적 결속을 촉진하는 것 같은 특정 목표에 관해서는 사회주의자, 보수주의자, 중도주의자와 동의할 수 있습니다. 의견 차이는 목적이 아니라 수단에 있습니다. 리버테리언은 관행과 규제를 획일화하려는 모든 강제적 해법을 거부하고, 대신 자발적 계약에 기반한 자유롭고 탈중앙화된 교환을 통해 선택의 힘과 책임 있는 자유를 옹호합니다.
