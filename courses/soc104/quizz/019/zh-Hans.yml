question: "政治保守主义是什么？"
answer: "一种旨在保存既有政治制度和社会秩序、反对重大结构性动荡的意识形态"
wrong_answers:
  - "一种对传统家庭价值和宗教实践的个人承诺，但并不寻求把它们强加给他人"
  - "一种通过民主改革和进步立法促进快速社会变革的哲学"
  - "一种主张自由市场、最低税收和废除贸易壁垒的经济理论"
explanation: >-
  政治保守主义是一种意识形态，常由右翼或极右翼政党代表，旨在保存既有政治制度和社会秩序，同时反对重大结构性动荡。它的支持者希望使用权力和法律来维护自己的遗产。这不同于文化保守主义，后者是一种个人生活选择，而不是政治纲领。
reviewed: false
