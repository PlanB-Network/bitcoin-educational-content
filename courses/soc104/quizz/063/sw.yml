question: "Mbinu za kiuchumi za Ujerumani ya Hitler na Umoja wa Kisovieti wa Stalin zilitofautianaje, licha ya kushiriki mbinu zilezile za kitotalitari?"
answer: "Ujerumani ya Nazi iliendeleza mwonekano wa mali binafsi huku ikiitiisha sekta binafsi kwa malengo ya dola, ilhali Ustalinisti ulifuta umiliki wote binafsi na kupanga uchumi kikamilifu"
wrong_answers:
  - "Ujerumani ya Nazi ilitaifisha viwanda vyote kikamilifu, ilhali utawala wa Stalin uliruhusu biashara binafsi yenye mipaka katika kilimo"
  - "Ujerumani ya Nazi ilihimiza biashara huru ya kimataifa kufadhili kujihami upya kijeshi, ilhali Ustalinisti uliweka kujitenga kamili kiuchumi"
  - "Ujerumani ya Nazi ilitegemea ushirikiano wa hiari wa mashirika na dola, ilhali Ustalinisti ulitumia kazi ya kulazimishwa pekee"
explanation: >-
  Ingawa tawala zote mbili zilitumia mbinu za kisiasa zinazofanana (ibada ya utu, ufuatiliaji wa jumla, uondoaji wa kimfumo wa upinzani), miundo yao ya kiuchumi ilitofautiana kwa namna. Ujerumani ya Nazi haikufuta rasmi mali binafsi bali iliitiisha kabisa sekta binafsi kwa malengo ya dola kama vita na kujihami upya kijeshi, ikiweka sera ya kujitegemea kiuchumi. Ustalinisti ulienda mbali zaidi kwa kufuta umiliki wote binafsi, kutekeleza mipango ya miaka mitano, na kudhibiti moja kwa moja uzalishaji na usambazaji wote.
