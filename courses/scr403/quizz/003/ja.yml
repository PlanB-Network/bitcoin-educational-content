question: Simplicityにおける和型（A + B）とは何ですか？
answer: "タグ付き共用体です。値は左タグ付きのA、または右タグ付きのBのどちらかです。"
wrong_answers:
  - AとBの両方のすべての値を同時に含む型です。
  - 2つの構成型のビットサイズを算術的に足し合わせたものです。
  - Aからのすべての入力をBの出力に写す関数型です。
explanation: >-
  和型A + Bはタグ付き共用体である。各値は、それが左バリアント（型A）
  なのか右バリアント（型B）なのかを示す1ビットのタグを持つ。
  AとBが同じ型であっても、左タグ付きの値と右タグ付きの値は区別されたままである。
reviewed: false
