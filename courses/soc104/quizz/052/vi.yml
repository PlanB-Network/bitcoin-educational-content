question: "Sự khác biệt then chốt giữa minarchists và những người theo chủ nghĩa tư bản vô chính phủ trong chủ nghĩa libertarian là gì?"
answer: "Minarchists chấp nhận một nhà nước tối thiểu cho quốc phòng, tư pháp và cảnh sát, trong khi những người theo chủ nghĩa tư bản vô chính phủ muốn tư nhân hóa mọi chức năng của nhà nước"
wrong_answers:
  - "Minarchists bác bỏ mọi hình thức chính phủ, trong khi những người theo chủ nghĩa tư bản vô chính phủ chấp nhận điều tiết nhà nước giới hạn đối với thị trường"
  - "Minarchists ủng hộ thuế lũy tiến cho các dịch vụ thiết yếu, trong khi những người theo chủ nghĩa tư bản vô chính phủ phản đối mọi loại thuế"
  - "Minarchists chỉ tập trung vào tự do kinh tế, trong khi những người theo chủ nghĩa tư bản vô chính phủ bảo vệ cả tự do kinh tế lẫn xã hội"
explanation: >-
  Minarchists tin rằng nhà nước nên được giới hạn vào các chức năng cốt lõi như quốc phòng, tư pháp và cảnh sát ("nhà nước gác đêm"), trong khi những người theo chủ nghĩa tư bản vô chính phủ lập luận rằng ngay cả các chức năng này cũng nên được tư nhân hóa và quản lý thông qua cạnh tranh thị trường tự nguyện. Bất đồng của họ nằm ở triển khai thực tế nhiều hơn là ở các nguyên tắc đạo đức nền tảng. Cả hai khuynh hướng đều chia sẻ cùng các giá trị libertarian về quyền tự sở hữu và bất xâm phạm.
