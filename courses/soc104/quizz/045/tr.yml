question: "Green New Deal, demokratik sosyalizmin çağdaş bir evrimini nasıl temsil eder?"
answer: "Çevresel kaygıları devlet müdahalesi ve özel gelirin müsaderesi için yeni bir gerekçe olarak kullanır; bireysel çıkarı kolektif gezegensel sağlığa tabi kılar"
wrong_answers:
  - "Karbon ticareti yoluyla çevre sorunlarına serbest piyasa çözümleri lehine geleneksel sosyalist ekonomiyi tamamen terk eder"
  - "Devlet müdahalesini reddeder ve bunun yerine iklim değişikliğiyle mücadele etmek için gönüllü bireysel eyleme ve özel sektör inovasyonuna dayanır"
  - "Çevre korumayı tüm sosyal adalet ve istihdam kaygılarının önüne koyarak sosyalizmden bir kopuşu temsil eder"
explanation: >-
  Green New Deal, çevresel kaygıları sosyal hedeflerle kaynaştırır; ekolojik geçişi sosyal adalet, istihdam güvenceleri ve güçlendirilmiş kamu hizmetleriyle birleştirir. Bireysel çıkar, gezegensel sağlıkla tanımlanan kolektif çıkara tabi kılınır. Özünde, artık yalnızca sosyal adalet adına değil, aynı zamanda çevre adına da devlet müdahalesini ve özel gelirin müsaderesini gerekçelendiren yeni bir retorik kılıf sağlar.
reviewed: false
