question: "Care este poziția libertariană privind chestiunea căsătoriei între persoane de același sex?"
answer: "Statul nu are ce căuta în definirea căsătoriei; aceasta ar trebui privatizată și lăsată indivizilor, asociațiilor și instituțiilor religioase"
wrong_answers:
  - "Căsătoria între persoane de același sex ar trebui legalizată, deoarece toți cetățenii merită tratament egal în fața legii"
  - "Căsătoria între persoane de același sex ar trebui interzisă, deoarece căsătoria tradițională este o instituție fundamentală pentru procreare"
  - "Căsătoria între persoane de același sex ar trebui legalizată, dar numai printr-un cadru juridic separat, distinct de căsătoria tradițională"
explanation: >-
  Libertarienii susțin că întrebarea despre căsătorie este fundamental formulată greșit, deoarece este pusă în termeni etatiști. Ei cred că statul nu are ce căuta în interferența cu viețile private, astfel că soluția este separarea completă a căsătoriei de stat. Impunând o singură definiție, statul creează conflicte. Primul răspuns greșit reflectă poziția socialistă sau centristă, iar al doilea reflectă poziția conservatoare.
reviewed: false
