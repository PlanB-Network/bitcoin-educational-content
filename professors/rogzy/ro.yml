bio: |
  Pasionat de Bitcoin încă de la descoperirea sa, am decis să dedic o parte din viața mea sprijinirii adopției acestuia prin educație. Prin numeroasele mele cursuri, voi încerca să te ghidez în călătoria ta prin rabbit hole. În rest, îmi plac biliardul și drumețiile.

short_bio: Antreprenor Bitcoin
