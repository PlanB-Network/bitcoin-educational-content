question: "تمایز مهم میان طرفدار کسب‌وکار بودن و طرفدار بازار بودن چیست؟"
answer: "طرفدار کسب‌وکار بودن یعنی ترجیح دادن ائتلافی میان بنگاه‌های بزرگ و دولت، در حالی که طرفدار بازار بودن یعنی حمایت از رقابت آزاد بدون جانبداری دولت"
wrong_answers:
  - "طرفدار کسب‌وکار بودن یعنی حمایت از کسب‌وکارهای کوچک، در حالی که طرفدار بازار بودن یعنی حمایت از شرکت‌های چندملیتی"
  - "طرفدار کسب‌وکار بودن یعنی مخالفت کامل با تنظیم‌گری، در حالی که طرفدار بازار بودن یعنی پذیرش تنظیم‌گری معتدل"
  - "طرفدار کسب‌وکار بودن بر صنعت داخلی تمرکز دارد، در حالی که طرفدار بازار بودن بر تجارت بین‌المللی تمرکز دارد"
explanation: >-
  میانه‌گرایان گرایش دارند طرفدار کسب‌وکار باشند، یعنی نوعی ائتلاف میان بنگاه‌های بزرگ و دولت را ترجیح می‌دهند، که با طرفدار بازار بودن متفاوت است. طرفدار بازار بودن از رقابت آزاد بدون جانبداری دولت یا حمایت‌گرایی شرکتی پشتیبانی می‌کند. این تمایز حیاتی است، زیرا سیاست‌های طرفدار کسب‌وکار می‌توانند انحصارها و حمایت‌های مقرراتی‌ای ایجاد کنند که در عمل رقابت بازار آزاد را تضعیف می‌کنند.
reviewed: false
