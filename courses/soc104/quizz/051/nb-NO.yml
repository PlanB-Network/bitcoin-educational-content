question: "Hvordan illustrerer George W. Bushs respons på finanskrisen i 2008 den 'problematiske fleksibiliteten' i konservative prinsipper?"
answer: "Han forlot frimarkedsprinsipper for å redde store banker, noe som avdekket det konservative synet på staten som den endelige garantisten for nasjonal økonomisk stabilitet"
wrong_answers:
  - "Han avviste all statlig inngripen og lot bankene gå over ende, i streng etterlevelse av frimarkedsideologien uansett konsekvenser"
  - "Han nasjonaliserte banksektoren permanent og innførte progressiv beskatning, noe som flyttet ham fra konservatisme til demokratisk sosialisme"
  - "Han svarte med å kutte alle offentlige utgifter og fjerne finansreguleringer for å la markedet korrigere seg selv"
explanation: >-
  Bush erklærte at han hadde 'forlatt frimarkedsprinsipper for å redde frimarkedssystemet' ved å gripe inn for å redde de store bankene. Dette illustrerer hvordan konservative kan prioritere nasjonens makt og kontinuitet over abstrakte markedsprinsipper. Den samme fleksible logikken vises i Trumps proteksjonistiske handelspolitikk, ført i den nasjonale interessens navn med risiko for å gi næring til korporatisme og kompis-kapitalisme.
reviewed: false
