question: In responsive web design for the Pleb Wallet, what CSS technique allows the layout to automatically adapt different screen sizes by changing from horizontal to vertical arrangement?
answer: Media queries with flex-direction property changes
wrong_answers:
  - CSS Grid with auto-fit and minmax functions
  - Viewport units with percentage-based positioning
  - Transform properties with scale and translate values
explanation: |
  Media queries combined with flex-direction property changes are the correct technique used in the Pleb Wallet for responsive design. The project uses @media queries to detect screen width breakpoints (876px and 615px), then changes flex-direction from 'row' to 'column' to stack elements vertically on smaller screens. CSS Grid with auto-fit is useful for responsive layouts but isn't the primary method used in this wallet project. Viewport units help with sizing but don't control layout direction. Transform properties are used for animations and positioning effects, not for fundamental layout restructuring across different screen sizes.
