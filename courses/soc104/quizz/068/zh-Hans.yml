question: "保守主义者在移民问题上的立场是什么？"
answer: "国家拥有控制其边境的主权权利，以保护国家安全和文化身份"
wrong_answers:
  - "边境应当无条件开放，因为歧视性限制侵犯人权"
  - "移民应当由市场需求决定，由公民以契约方式决定他们与外国人的关系"
  - "移民政策应当基于专家评估，在经济需求与成功融入之间取得平衡"
explanation: >-
  保守主义者认为，秩序、身份和国家主权必须优先于不受限制地接纳外国人或难民。边境和一个明确界定的人口是文明价值的一部分。错误答案分别代表社会主义立场（把开放边境视为人权）、自由意志主义立场（基于市场的移民），以及中间主义立场（由专家驱动的平衡方法）。
reviewed: false
