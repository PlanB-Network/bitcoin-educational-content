question: "Ce dezvăluie axa verticală a diagramei Nolan despre adevărata întrebare politică?"
answer: "Dezvăluie dacă vrei să îți impui propriile sensibilități asupra altora prin intermediul statului sau preferi ca fiecare persoană să fie liberă să decidă pentru sine"
wrong_answers:
  - "Dezvăluie dacă susții guvernarea democratică sau preferi conducerea autoritară de către un singur lider"
  - "Dezvăluie dacă te identifici cu mișcările sociale progresiste sau cu instituțiile religioase tradiționale"
  - "Dezvăluie dacă principala ta preocupare este securitatea națională sau prosperitatea economică"
explanation: >-
  Axa verticală expune adevărata întrebare politică: nu dacă ești de stânga sau de dreapta, ci în ce măsură vrei ca statul să intervină în modelarea societății potrivit valorilor tale. Dorești să îți impui sensibilitățile asupra altora sau preferi ca fiecare persoană să fie liberă să decidă pentru sine? Această încadrare transcende diviziunea stânga-dreapta și arată că ambele tabere pot fi la fel de etatiste.
reviewed: false
