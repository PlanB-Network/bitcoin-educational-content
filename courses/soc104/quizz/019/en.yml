question: "What shared political objective do left-wing and right-wing statists have?"
answer: "To win power in order to organize society according to their vision of the world and impose it on everyone"
wrong_answers:
  - "To reduce the size of government and return decision-making power to individual citizens"
  - "To establish a direct democracy where every citizen votes on every legislative decision"
  - "To eliminate political parties and replace them with independent technocratic governance"
explanation: >-
  Both left and right statists share the same political objective: winning power to organize society according to their worldview and imposing it on everyone through legislation. The difference is only in their values: the right invokes defending civilization, while the left invokes defending the working class or the oppressed. Neither seeks to reduce government or eliminate parties.
reviewed: false
