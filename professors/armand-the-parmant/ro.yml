bio: |
  Misiunea mea este să aduc hyperbitcoinizarea cât mai repede posibil. Cred că oricum este inevitabilă, dar vreau să vină mai devreme. Bitcoin este deja suficient de bun; ceea ce trebuie să se schimbe este acceptarea oamenilor. Iar aceasta vine odată cu cunoașterea. Așa că fac tot ce pot pentru a răspândi cunoașterea – din momentul în care mă trezesc, până în momentul în care adorm, și chiar și în somn, servesc.

short_bio: Creatorul Parmanode Software și educator Bitcoin
