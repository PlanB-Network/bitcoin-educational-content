question: "Apa yang diyakini libertarian tentang kapasitas individu untuk membuat keputusan?"
answer: "Individu memiliki hak sekaligus tanggung jawab untuk membuat keputusan mereka sendiri tentang hidup mereka"
wrong_answers:
  - "Individu seharusnya membuat keputusan hanya setelah berkonsultasi dengan wakil terpilih yang memahami implikasi kebijakan"
  - "Individu umumnya tidak mampu membuat keputusan yang baik dan membutuhkan bimbingan ahli dari institusi pemerintah"
  - "Individu seharusnya bebas membuat keputusan ekonomi tetapi tunduk kepada negara dalam semua urusan sosial dan budaya"
explanation: >-
  Dari sudut pandang libertarian, individu memiliki hak sekaligus tanggung jawab untuk membuat keputusan mereka sendiri. Ini kontras dengan keluarga politik konvensional dari kiri hingga kanan, yang meyakini bahwa pemerintah seharusnya membuat sebagian atau banyak keputusan penting dalam kehidupan seorang individu dan dalam kehidupan ekonomi secara umum.
