question: 支出時に case の分岐が刈り取られます。検証者は、それでもどのようにして公開されたプログラムをコミット済みの CMR と照合できるのでしょうか？
answer: CMR はマークルルートなので、支出者は刈り取られた分岐の CMR だけを提供し、検証者はそれを畳み込んでルートを再計算します。
wrong_answers:
  - 検証者は実行された分岐だけを使用する。実行されない case 分岐は CMR には含まれていなかったためである。
  - 刈り取られた分岐は正規のプレースホルダーになり、その固定 CMR がルート再計算時に代わりに使われる。
  - 刈り取られた分岐の完全なコードは witness に残り、検証者はそれをハッシュするが実行しない。
explanation: >-
  case f g の CMR は、両方の子の CMR に対するタグ付きハッシュなので、実行されるかどうかに
  かかわらず、すべての分岐がアドレス作成時にコミットされます。この構造はマークルツリーなので、
  刈り取られた分岐はその 32 バイトの CMR だけで要約できます。検証者はそのハッシュを
  再帰的な計算に差し込み、刈り取られたコードを一切見ることなく、ルートが UTXO の
  コミットメントと一致することを確認します。これこそが、コミットメントにマークルルートが
  使われる理由であり、刈り取られた分岐内の witness 式がオンチェーンに決して現れない理由です。
reviewed: false
