question: "Trục dọc của biểu đồ Nolan tiết lộ điều gì về câu hỏi chính trị thật sự?"
answer: "Nó tiết lộ liệu bạn muốn áp đặt cảm quan riêng của mình lên người khác thông qua nhà nước, hay muốn mỗi người được tự do tự quyết định cho chính mình"
wrong_answers:
  - "Nó tiết lộ liệu bạn ủng hộ quản trị dân chủ hay thích sự cai trị độc đoán của một lãnh đạo duy nhất"
  - "Nó tiết lộ liệu bạn đồng nhất mình với các phong trào xã hội tiến bộ hay với các thiết chế tôn giáo truyền thống"
  - "Nó tiết lộ liệu mối quan tâm chính của bạn là an ninh quốc gia hay thịnh vượng kinh tế"
explanation: >-
  Trục dọc phơi bày câu hỏi chính trị thật sự: không phải bạn là cánh tả hay cánh hữu, mà là bạn muốn nhà nước can thiệp đến mức nào vào việc định hình xã hội theo các giá trị của bạn. Bạn có muốn áp đặt cảm quan của mình lên người khác, hay bạn muốn mỗi người được tự do tự quyết định cho chính mình? Cách đặt vấn đề này vượt qua sự phân chia tả-hữu và cho thấy cả hai phe đều có thể mang tính nhà nước ngang nhau.
