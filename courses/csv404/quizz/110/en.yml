question: "What must both the sender and receiver be part of before a Taproot Asset transfer can take place?"
answer: "A common universe federation"
wrong_answers:
  - "The same Lightning Network payment channel"
  - "A shared Bitcoin multisig wallet"
  - "A mutual peer-to-peer connection over Tor"
explanation: >-
  Before any Taproot Asset transfer can take place, both nodes must be part of a common universe federation. The receiver's node needs to know the asset exists, understand its genesis data, and be able to validate incoming proofs. Without proper federation, the transfer will fail.
reviewed: false
