question: "Mitä Mussolinin vuoden 1920 julistus 'Kaikki valtiossa, ei mitään valtion ulkopuolella, ei mitään valtiota vastaan' paljastaa totalitarismista?"
answer: "Julkisen ja yksityisen tilan välillä ei enää ole eroa, koska valtio sulauttaa yhteiskunnan kokonaan itseensä"
wrong_answers:
  - "Valtio keskittyy yksinomaan sotilaalliseen voimaan ja jättää talouden yksityiselle yritystoiminnalle"
  - "Kansalaiset voivat järjestäytyä yksityisesti vapaasti, kunhan he eivät arvostele hallitusta avoimesti"
  - "Hallitus kontrolloi vain poliittista toimintaa, kun taas kulttuurinen ja uskonnollinen elämä pysyvät autonomisina"
explanation: >-
  Mussolinin julistus tiivistää totalitarismin ytimen: totaalisuuden. Kaikki sulautetaan valtioon, mikä tarkoittaa, ettei julkisen ja yksityisen tilan välillä ole eroa. Yhteiskunta menettää kaiken autonomian muodon aina arkisimpiin toimintoihin, kuten urheiluseuran perustamiseen, asti. Tämä menee paljon pidemmälle kuin pelkkien sotilaallisten, poliittisten tai taloudellisten alueiden kontrollointi.
