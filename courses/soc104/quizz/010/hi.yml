question: "Nolan diagram में ऊर्ध्वाधर अक्ष (ऊपर-नीचे) को क्षैतिज अक्ष (बाएँ-दाएँ) से अधिक मौलिक क्यों माना जाता है?"
answer: "क्योंकि यह अधिकतम व्यक्तिगत स्वतंत्रताओं की रक्षा करने वालों और अधिकतम राज्य नियंत्रण को पसंद करने वालों के बीच वास्तविक विभाजन को उजागर करता है"
wrong_answers:
  - "क्योंकि यह आर्थिक उत्पादन को क्षैतिज अक्ष द्वारा सामाजिक नीतियों को मापने की तुलना में अधिक सटीक रूप से मापता है"
  - "क्योंकि इतिहास में अधिकांश राजनीतिक संघर्ष शासन के बजाय सांस्कृतिक पहचान के बारे में रहे हैं"
  - "क्योंकि क्षैतिज अक्ष केवल आधुनिक लोकतंत्रों पर लागू होता है, जबकि ऊर्ध्वाधर अक्ष सार्वभौमिक है"
explanation: >-
  मौलिक अक्ष ऊर्ध्वाधर है क्योंकि यह आवश्यक राजनीतिक प्रश्न को पकड़ता है: राज्य को मानव क्रिया को किस हद तक नियंत्रित करना चाहिए? बाएँ-दाएँ अक्ष केवल अलग-अलग संवेदनशीलताओं (सामाजिक न्याय बनाम परंपरा) को दर्शाता है, लेकिन दोनों पक्ष statists के रूप में ऊर्ध्वाधर अक्ष पर समान स्थिति ले सकते हैं। ऊर्ध्वाधर अक्ष दिखाता है कि कोई व्यक्ति अपनी दृष्टि को बल से थोपना चाहता है या व्यक्तिगत स्वतंत्रता का सम्मान करता है।
reviewed: false
