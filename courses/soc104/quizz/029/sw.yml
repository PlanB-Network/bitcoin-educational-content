question: "Libertarians na conservatives wana msingi gani wa pamoja, na ni nini kinachowatenganisha?"
answer: "Wanashiriki kushikamana na serikali yenye mipaka na kukataa usawa wa kulazimishwa, lakini hutofautiana kuhusu uingiliaji wa kijeshi na sera za kijamii"
wrong_answers:
  - "Wanashiriki kuunga mkono sera za biashara za ulinzi na ulinzi wa taifa, lakini hutofautiana kuhusu nafasi ya dini katika maisha ya umma"
  - "Wanashiriki ahadi kwa utozaji kodi wa kimaendeleo na programu za ustawi, lakini hutofautiana kuhusu sera ya uhamiaji"
  - "Wanashiriki upinzani dhidi ya biashara huru na uhalalishaji wa dawa za kulevya, lakini hutofautiana kuhusu ukubwa wa serikali ya shirikisho"
explanation: >-
  Libertarians na conservatives wote hutetea serikali yenye mipaka, hukataa usawa wa kulazimishwa, hupinga deni la umma, na hutetea haki za majimbo. Hata hivyo, libertarians hukataa uingiliaji wa kijeshi wa neoconservatives, hupinga sera za kijamii za conservatives na ruzuku, hulaani marufuku ya dawa za kulevya, na hukataa ulinzi wa kibiashara. Muungano huo ni halisi lakini kiasili una mvutano.
reviewed: false
