question: "Как се различават консервативната и либертарианската позиция относно минималната заплата в своите аргументи, въпреки че и двете подкрепят премахването ѝ?"
answer: "Консерваторите приемат известно държавно участие в определянето на заплатите, ако то не пречи на конкурентоспособността, докато либертарианците разглеждат минималната заплата като морално налагане върху свободата да наемаш и да правиш бизнес"
wrong_answers:
  - "Консерваторите се противопоставят на минималната заплата, защото тя създава инфлация, докато либертарианците се противопоставят, защото дава твърде много власт на синдикатите"
  - "Консерваторите искат заплатите да се определят от религиозни и общностни институции, докато либертарианците искат заплати, определяни от одобрени от правителството пазарни проучвания"
  - "Консерваторите вярват, че минималните заплати трябва да варират според региона, докато либертарианците вярват, че единна фиксирана заплата трябва да се прилага на национално ниво"
explanation: >-
  И двете подкрепят намаляването или премахването на минималната заплата, но аргументите им се различават фундаментално. Консерваторите приемат известно държавно участие в определянето на заплатите, като настояват то да остане минимално и зависимо от контекста, фокусирайки се върху конкурентоспособността. Либертарианците заемат по-силна морална позиция: минималната заплата е налагане върху свободата да наемаш и да правиш бизнес. Когато либертарианците казват "пазарът", те имат предвид договора, свободно договорен между две страни без държавна намеса.
reviewed: false
