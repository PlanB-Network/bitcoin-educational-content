question: "centrist pragmatism තුළ සැඟවී ඇති paradox එක කුමක්ද?"
answer: "pragmatism ම dogmatism ආකාරයක් මත පදනම් වේ, එනම් society steer කිරීමට competent වන්නේ experts පමණක් යන නොප්‍රකාශිත conviction එක"
wrong_answers:
  - "Centrists තමන් moderate බව කියන නමුත් coalition governments තුළ left-wing parties සමඟ නිරන්තරයෙන් align වෙති"
  - "Centrist policies balanced ලෙස පෙනෙන නමුත් environmental protection ට වඩා economic growth සෑම විටම favor කරයි"
  - "Centrists ideology ප්‍රතික්ෂේප කරන නමුත් economic decisions ගන්නා විට rigid free-market principles භාර ගනිති"
explanation: >-
  Centrist pragmatism හි paradox එක වන්නේ එය rational expertise වෙනුවෙන් ideology ප්‍රතික්ෂේප කරන බව කියා සිටින නමුත්, එම claim එකම invisible සහ unexpressed dogma එකක් මත පදනම් වීමයි: නිවැරදි decisions ගැනීමට හැකියාව ඇත්තේ technocrats පමණක් බව. Experts පමණක් society steer කළ යුතුය යන මෙම conviction එක centrists එය එසේ හඳුනා නොගත්තද, එයම ideological commitment එකකි.
reviewed: false
