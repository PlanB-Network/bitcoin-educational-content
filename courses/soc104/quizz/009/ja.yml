question: "緑の党はノーラン・チャート上のどこに位置し、それはなぜですか？"
answer: "チャートの非常に低い位置。なぜなら、個人の利益は地球全体の集団的利益に優先してはならないと考えるから"
wrong_answers:
  - "チャートの最上部。なぜなら、個人的自由と環境意識を等しく優先するから"
  - "チャートの中央。なぜなら、経済成長と環境保護の均衡を取るから"
  - "最右端。なぜなら、環境問題への市場ベースの解決策を支持するから"
explanation: >-
  緑の党はノーラン・チャート上で非常に低い位置にあります。なぜなら、地球のウェルビーイングの名のもとに、経済的決定と個人的決定の両方に対する強い国家統制を支持するからです。彼らはマルクス主義的な階級闘争を、人間と自然の間の闘争に置き換えており、経済統制、さらには私有財産の廃止を擁護する傾向があります。このため、彼らは最上部や中央ではなく、権威主義のセクターに位置します。
reviewed: false
