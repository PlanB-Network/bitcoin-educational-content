question: "Rothbard 为什么批评 libertaires 的人性观，而他提出了什么替代方案？"
answer: "他指责他们持有一种天真的“高贵的野蛮人”观点，并主张社会必须利用私有财产和良好激励来引导自利行为"
wrong_answers:
  - "他赞扬他们对人类合作的理解，但认为仍然需要一个最小国家来执行契约"
  - "他同意人类天生善良，但坚持只有自由市场才能把这种善良导向生产性活动"
  - "他拒绝他们对个人权利的强调，转而主张共同体应集体定义道德标准"
explanation: >-
  Rothbard 批评 libertaires 采纳了一种天真、类似 Rousseau 的人性观，把人视为天生善良。他反而认为，人们受自身利益引导，社会必须被组织成由良好激励来引导行为。这要求承认并保障私有财产。废除国家并不意味着废除国家的功能；警察和司法应由自由市场通过竞争来管理。
reviewed: false
