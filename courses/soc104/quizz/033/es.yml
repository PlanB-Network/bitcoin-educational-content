question: "¿En qué difieren las estrategias para abolir el Estado entre libertaires y libertarianos?"
answer: "Los libertaires han defendido históricamente la destrucción violenta, mientras que los libertarianos buscan deslegitimar el Estado mediante la educación y la desobediencia civil"
wrong_answers:
  - "Los libertaires usan elecciones democráticas para desmantelar el Estado, mientras que los libertarianos favorecen la revolución armada y la acción directa"
  - "Los libertaires se centran en construir comunidades alternativas, mientras que los libertarianos trabajan dentro del sistema político existente para aprobar reformas"
  - "Tanto libertaires como libertarianos están de acuerdo en que la protesta pacífica es el único medio legítimo de transformación social"
explanation: >-
  Los libertaires han defendido históricamente la destrucción del Estado y del capitalismo mediante la violencia, incluido el terror y los ataques selectivos. Los libertarianos, en cambio, rechazan la violencia agresiva por considerarla ilegítima. Su estrategia se basa en deslegitimar el Estado mediante la argumentación, el debate, la educación y la desobediencia civil. Estos enfoques del cambio, fundamentalmente distintos, reflejan sus desacuerdos filosóficos más profundos.
