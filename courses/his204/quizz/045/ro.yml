question: Ce idee NU se regăsește în L'Ami des Hommes?
answer: Manufactura lâncezește pentru că agricultura îi ia locul
wrong_answers:
  - Națiunile au interese armonioase
  - Comerțul trebuie să fie liber între toate popoarele
  - Populația este adevărata sursă a bogăției unei națiuni
explanation: |
  L'Ami des Hommes laudă agricultura, apără comerțul liber și susține că populația constituie bogăția unei națiuni. Totuși, nu susține că agricultura ar înlocui manufactura. Mirabeau vede agricultura ca sursă a bogăției reale, nu ca rivală a industriei.
