question: What happens when you perform the operation String(3) + 2 in JavaScript?
answer: It results in '32' because the number 2 is converted to a string and concatenated
wrong_answers:
  - It results in 5 because JavaScript automatically converts the string to a number for arithmetic
  - It throws an error because you cannot add a string and a number together in JavaScript
  - It results in NaN because the string cannot be converted to a valid number for calculation
explanation: |
  When you use String(3) + 2, JavaScript performs string concatenation, not arithmetic addition. The String(3) creates the string '3', and when you use the + operator with a string and a number, JavaScript converts the number 2 to the string '2' and concatenates them, resulting in '32'. This demonstrates why explicit data typing is important - if you wanted arithmetic, you'd need Number(3) + 2 = 5 instead.
