question: "ミルトン・フリードマンは、政治政策を評価することについてどのような警告をしましたか？"
answer: "政策はその意図ではなく、その結果によって評価されるべきである"
wrong_answers:
  - "政策は、それを提案する政治家の道徳的人格によって評価されるべきである"
  - "政策は、一般の有権者にどれほど人気があるかによって評価されるべきである"
  - "政策は、その国の当初の憲法に沿っているかどうかによって評価されるべきである"
explanation: >-
  フリードマンは、最大の誤りの一つは政策をその結果ではなく意図によって評価することだと書き、貧困層のためと銘打たれたプログラムは、ほとんど常にその提唱者が意図したものとは反対の効果を生むと指摘した。これは、優れた経済学者は全人口に対する短期的効果と長期的効果の両方を考慮するというバスティアの教えと響き合っている。
reviewed: false
