question: "Bagaimana strategi untuk menghapuskan negara berbeda antara libertaires dan libertarian?"
answer: "Libertaires secara historis menganjurkan penghancuran dengan kekerasan, sementara libertarian berusaha mendelegitimasi negara melalui pendidikan dan pembangkangan sipil"
wrong_answers:
  - "Libertaires menggunakan pemilihan demokratis untuk membongkar negara, sementara libertarian mendukung revolusi bersenjata dan aksi langsung"
  - "Libertaires berfokus membangun komunitas alternatif, sementara libertarian bekerja di dalam sistem politik yang ada untuk meloloskan reformasi"
  - "Baik libertaires maupun libertarian sepakat bahwa protes damai adalah satu-satunya sarana transformasi sosial yang sah"
explanation: >-
  Libertaires secara historis menganjurkan penghancuran negara dan kapitalisme melalui kekerasan, termasuk teror dan serangan terarah. Sebaliknya, libertarian menolak kekerasan agresif sebagai tidak sah. Strategi mereka bertumpu pada pendelegitimasian negara melalui argumentasi, debat, pendidikan, dan pembangkangan sipil. Pendekatan yang secara fundamental berbeda terhadap perubahan ini mencerminkan perbedaan filosofis mereka yang lebih dalam.
