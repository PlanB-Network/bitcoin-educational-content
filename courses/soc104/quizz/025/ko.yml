question: "유럽 정치 전통에서 'liberal'이라는 용어는 무엇을 뜻하나요?"
answer: "자유방임 경제, 축소된 국가 개입, 개인의 자유를 지지하는 사람입니다"
wrong_answers:
  - "국가 개입, 공공 건강보험, 빈곤 퇴치 프로그램을 옹호하는 사람입니다"
  - "정부와 사유재산의 완전한 폐지를 추구하는 급진적 아나키스트입니다"
  - "모든 정책 영역에서 사회주의와 보수주의 입장을 똑같이 균형 맞추는 중도주의자입니다"
explanation: >-
  유럽에서 자유주의는 자유방임 경제 정책, 축소된 국가 개입, 개인의 자유 수호와 계속 연결되어 왔습니다. 첫 번째 오답은 그 용어의 의미를 개입주의 쪽으로 이동시킨 미국식 liberals를 설명합니다. 유럽식 자유주의는 아나키즘도 중도주의도 아닙니다.
reviewed: false
