question: "¿Cuál es la postura libertaria sobre la cuestión del matrimonio homosexual?"
answer: "El Estado no tiene por qué definir el matrimonio; debería privatizarse y dejarse a los individuos, las asociaciones y las instituciones religiosas"
wrong_answers:
  - "El matrimonio homosexual debería legalizarse porque todos los ciudadanos merecen igualdad de trato ante la ley"
  - "El matrimonio homosexual debería prohibirse porque el matrimonio tradicional es una institución fundamental para la procreación"
  - "El matrimonio homosexual debería legalizarse, pero solo mediante un marco jurídico separado y distinto del matrimonio tradicional"
explanation: >-
  Los libertarios sostienen que la cuestión del matrimonio está fundamentalmente mal planteada porque se formula en términos estatistas. Creen que el Estado no tiene por qué interferir en la vida privada, de modo que la solución es separar por completo el matrimonio del Estado. Al imponer una definición única, el Estado crea conflictos. La primera respuesta incorrecta refleja la postura socialista o centrista, y la segunda refleja la postura conservadora.
