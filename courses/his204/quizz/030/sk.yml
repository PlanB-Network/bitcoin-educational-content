question: Ako markíz d'Argenson odpovedal ministrom svojej doby, ktorí navrhovali regulovať tú či onú hospodársku činnosť?
answer: Že sa najprv treba uistiť, že regulácia je lepšia ako sloboda
wrong_answers:
  - Že túto činnosť treba najprv nechať dozrieť, a až potom ju regulovať
  - Že treba nasledovať regulácie, ktoré prijali Angličania a Holanďania
  - Že pred prijatím rozhodnutia treba konzultovať ľud
explanation: |
  Markíz d'Argenson trval na tom, aby sa najprv dokázalo, že regulácia je lepšia ako sloboda. Veril, že sloboda je základným princípom a že akékoľvek obmedzenia musia byť odôvodnené pádnymi argumentmi.
