question: "Sự phân chia chính trị tả-hữu bắt nguồn từ đâu?"
answer: "Từ cách sắp xếp chỗ ngồi trong các cuộc tranh luận của Cách mạng Pháp năm 1789"
wrong_answers:
  - "Từ các tác phẩm của Karl Marx và Adam Smith vào thế kỷ XIX"
  - "Từ Nội chiến Hoa Kỳ giữa các bang miền Bắc và miền Nam"
  - "Từ các triết gia Khai sáng, những người tách lý trí khỏi truyền thống"
explanation: >-
  Sự phân chia tả-hữu có từ năm 1789, khi các đại biểu trong Quốc hội Pháp ủng hộ duy trì quyền lực của nhà vua ngồi bên phải chủ tịch, trong khi những người muốn hạn chế quyền lực của vua ngồi bên trái. Nó không bắt nguồn từ Marx và Smith, Nội chiến Hoa Kỳ, hay triết học Khai sáng.
reviewed: false
