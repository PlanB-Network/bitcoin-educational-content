question: 固定長度向量在 Simplicity 的型別系統中如何建構？
answer: 透過長度為二次冪的巢狀積型別（例如 A⁴ = A² × A²）。
wrong_answers:
  - 使用一種內建於語言中的特殊陣列型別建構子。
  - 透過遞迴的和型別，把元素串接成一個串列。
  - 使用具有固定最大大小的可變長度緩衝區。
explanation: >-
  Simplicity 由巢狀積型別建構向量。A² 是 A × A，A⁴ 是 A² × A²，A⁸ 是 A⁴ × A⁴，依此類推。這產生大小為二次冪的集合。例如，𝟚²⁵⁶（一個 256 位元雜湊）是從布林型別開始巢狀積 8 層深建構而成。
