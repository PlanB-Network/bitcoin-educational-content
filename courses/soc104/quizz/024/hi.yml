question: "राजनीतिक रूढ़िवाद क्या है?"
answer: "एक विचारधारा जिसका लक्ष्य स्थापित राजनीतिक संस्थाओं और सामाजिक व्यवस्था को संरक्षित रखना है, और जो बड़े संरचनात्मक उथल-पुथल का विरोध करती है"
wrong_answers:
  - "दूसरों पर उन्हें थोपने की कोशिश किए बिना पारंपरिक पारिवारिक मूल्यों और धार्मिक आचरणों के प्रति व्यक्तिगत प्रतिबद्धता"
  - "एक दर्शन जो लोकतांत्रिक सुधार और प्रगतिशील कानूनों के माध्यम से तेज़ सामाजिक परिवर्तन को बढ़ावा देता है"
  - "एक आर्थिक सिद्धांत जो मुक्त बाज़ार, न्यूनतम कराधान और व्यापार बाधाओं के उन्मूलन का समर्थन करता है"
explanation: >-
  राजनीतिक रूढ़िवाद एक विचारधारा है, जिसे अक्सर दक्षिणपंथी या अति-दक्षिणपंथी दलों में प्रतिनिधित्व मिलता है, जिसका लक्ष्य स्थापित राजनीतिक संस्थाओं और सामाजिक व्यवस्था को संरक्षित रखना है और जो बड़े संरचनात्मक उथल-पुथल का विरोध करती है। इसके समर्थक अपनी विरासत की रक्षा के लिए सत्ता और कानून का उपयोग करना चाहते हैं। यह सांस्कृतिक रूढ़िवाद से अलग है, जो राजनीतिक कार्यक्रम के बजाय व्यक्तिगत जीवन-चयन है।
