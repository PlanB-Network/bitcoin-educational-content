question: "Por que Mises enfatiza que o individualismo não deve ser confundido com autossuficiência ou misantropia?"
answer: "Porque o individualismo promove cooperação e associação, desde que elas repousem no livre consentimento dos participantes, reconhecendo que os humanos desenvolvem seu pleno potencial por meio de relações voluntárias com outros"
wrong_answers:
  - "Porque o individualismo exige que as pessoas se juntem a organizações cívicas obrigatórias para garantir que contribuam para o bem comum"
  - "Porque o individualismo significa que cada pessoa deve depender inteiramente do estado para serviços que não consegue fornecer por si mesma"
  - "Porque o individualismo exige que as pessoas compitam umas contra as outras em todos os domínios para provar sua superioridade pessoal"
explanation: >-
  Mises enfatiza que o ser humano é uma criatura social. O individualismo não significa isolamento. Ele promove cooperação e associação sob a condição de que repousem no livre consentimento dos participantes. O ser humano só pode desenvolver seu pleno potencial em relação com outros, mas essa cooperação deve ser voluntária, e não imposta pela autoridade coletiva.
