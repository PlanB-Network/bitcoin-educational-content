question: "Co odróżnia neokonserwatystów od paleokonserwatystów w podejściu do polityki zagranicznej?"
answer: "Neokonserwatyści uzasadniają interwencjonizm wojskowy szerzeniem demokracji, podczas gdy paleokonserwatyści bronią bardziej izolacjonistycznej polityki zagranicznej"
wrong_answers:
  - "Neokonserwatyści sprzeciwiają się wszelkim działaniom wojskowym i preferują dyplomację, podczas gdy paleokonserwatyści popierają uderzenia prewencyjne przeciw potencjalnym zagrożeniom"
  - "Neokonserwatyści skupiają się wyłącznie na sankcjach gospodarczych, podczas gdy paleokonserwatyści opowiadają się za budowaniem międzynarodowych koalicji do wspólnych operacji wojskowych"
  - "Neokonserwatyści i paleokonserwatyści zgadzają się w polityce zagranicznej, ale ostro różnią się w sprawie krajowej regulacji gospodarczej"
explanation: >-
  Od lat 2000. neokonserwatyści coraz bardziej angażowali się w uzasadnianie interwencjonizmu wojskowego mającego zaszczepiać demokrację na całym świecie, szczególnie po 11 września 2001 roku. W reakcji tradycyjni konserwatyści przyjęli etykietę 'paleokonserwatystów', aby się od nich odróżnić. Paleokonserwatyści krytykują interwencjonizm wojskowy, bronią bardziej izolacjonistycznej polityki zagranicznej i kładą większy nacisk na tożsamość narodową i kulturową.
