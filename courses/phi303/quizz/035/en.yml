question: "Who drives each half of the 'twin problem' of democracy?"
answer: "The ruling minority drives the political self-undermining; the ruled majority drives the economic self-undermining."
wrong_answers:
  - "Foreign powers drive both halves."
  - "The majority drives both halves through voting."
  - "The minority drives both halves through propaganda."
explanation: |
  The minority stifles the openness democracy requires; the majority is trapped in the tragedy of the commons. Responsibility is shared — which is why swapping the elite would not solve the problem: it is rooted in human nature.
