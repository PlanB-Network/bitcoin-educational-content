question: "Hvordan skiller de konservative og libertarianske posisjonene om minstelønn seg i sin begrunnelse, til tross for at begge går inn for å avskaffe den?"
answer: "Konservative aksepterer en viss statlig involvering i lønnsfastsettelse hvis den ikke hemmer konkurranseevnen, mens libertarianere ser minstelønnen som en moralsk påtvungen begrensning på friheten til å ansette og drive næringsvirksomhet"
wrong_answers:
  - "Konservative motsetter seg minstelønnen fordi den skaper inflasjon, mens libertarianere motsetter seg den fordi den gir fagforeninger for mye makt"
  - "Konservative ønsker at lønn skal fastsettes av religiøse og lokale institusjoner, mens libertarianere ønsker at lønn skal bestemmes av statlig godkjente markedsstudier"
  - "Konservative mener minstelønn bør variere etter region, mens libertarianere mener én flat lønn bør gjelde nasjonalt"
explanation: >-
  Begge går inn for å redusere eller avskaffe minstelønnen, men begrunnelsen deres er fundamentalt forskjellig. Konservative aksepterer en viss statlig involvering i lønnsfastsettelse, samtidig som de insisterer på at den skal forbli minimal og kontekstavhengig, med fokus på konkurranseevne. Libertarianere inntar en sterkere moralsk posisjon: en minstelønn er en påtvungen begrensning på friheten til å ansette og drive næringsvirksomhet. Når libertarianere sier «markedet», mener de kontrakten, fritt forhandlet mellom to parter uten statlig innblanding.
reviewed: false
