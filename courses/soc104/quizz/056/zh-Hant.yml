question: "親商與親市場之間的重要區別是什麼？"
answer: "親商意味著偏好大型企業與國家之間的聯盟，而親市場意味著支持沒有國家偏袒的自由競爭"
wrong_answers:
  - "親商意味著支持小企業，而親市場意味著支持跨國企業"
  - "親商意味著完全反對管制，而親市場意味著接受溫和管制"
  - "親商專注於國內產業，而親市場專注於國際貿易"
explanation: >-
  中間派傾向於親商，意思是他們偏好大型企業與國家之間的某種聯盟，這不同於親市場。親市場支持沒有國家偏袒或企業保護主義的自由競爭。這項區別至關重要，因為親商政策可能製造壟斷與監管保護，實際上削弱自由市場競爭。
reviewed: false
