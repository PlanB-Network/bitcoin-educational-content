question: 為什麼 'case' 組合子的簽名中會包含一個共用環境型別 C？
answer: 為了讓兩個分支都能在讀取帶標記的輸入的同時，一併讀取共用的情境資料。
wrong_answers:
  - 為了限制輸入的大小，以防止堆疊溢位。
  - 為了讓兩個分支之間能來回進行遞迴呼叫。
  - 為了儲存鏈中先前那個組合子的輸出。
explanation: >-
  case 組合子的簽名為 (A + B) × C ⊢ D。額外的型別 C 扮演共用環境的角色，讓左分支（f : A × C ⊢ D）與右分支（g : B × C ⊢ D）都能加以存取。這比單純的 if-then-else 更強大，因為各分支同時收到自己專屬的資料，以及運算所需的情境資訊。
