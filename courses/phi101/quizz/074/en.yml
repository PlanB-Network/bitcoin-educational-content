question: What was the contribution of the Physiocrats to liberal thought?
answer: They developed the theory of the free market.
wrong_answers:
  - They advocated for individual freedom and private property.
  - They designed the first centralized economic planning models.
  - They criticized mercantilism and state intervention.
explanation: |
  The Physiocrats' central contribution to liberal thought was developing the theory of the free market, arguing that economic laws are natural and should not be disturbed by state intervention, encapsulated in their motto "Laissez-faire, laissez passer."
reviewed: true
