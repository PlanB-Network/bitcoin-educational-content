question: "Kubera iki abarwanira liberalism ya kera muri United States batanguye kwiyita 'libertarians' mu kinjana ca twentieth century?"
answer: "Kubera ko 'liberalism' y'Abanyamerika yari yarigaruriwe n'ukwivanga kwa Leta kwariko kurakura hamwe na Leta yitwararika imibereho y'abanyagihugu"
wrong_answers:
  - "Kubera ko bashaka kwitandukanya n'imigenzo y'ubwami bwo mu Buraya"
  - "Kubera ko ijambo 'liberal' ryatanguye gufatanywa na anarchism hamwe n'ubukazi bwa politike"
  - "Kubera ko amasezerano mashasha y'ubudandaji yasaba ko abaharanira isoko ryigenga bagira akaranga ka politike kihariye"
explanation: >-
  Mu kinjana ca twentieth century, habaye ihinduka ry'ishingiro aho ingingo za laissez-faire zahebwa buhorobuhoro hagashigikirwa Leta yitwararika imibereho y'abanyagihugu. "Liberalism" y'Abanyamerika yaje gusigura ikintu gitandukanye cane na liberalism ya kera, yemera ukwivanga kwa Leta. Abarwanira liberalism ya kera bafashe ijambo "libertarian" kugira ngo bazigame iryo tandukaniro. Ukwo guhindura izina ntikwari gufitaniye isano n'ubwami bwo mu Buraya, ubukazi bwa anarchism, canke amasezerano y'ubudandaji.
reviewed: false
