question: "central planning අසාර්ථක වන්නේ ඇයි යන්න පිළිබඳ Hayekගේ fundamental argument එක කුමක්ද?"
answer: "Knowledge පවතින්නේ distinct individuals සතුව ඇති dispersed fragments ලෙස පමණක් වන අතර එය central authority එකක් විසින් concentrate හෝ integrate කළ නොහැක"
