question: "Muhafazakârlık ekonomik ve toplumsal alanlardaki özgürlüklere nasıl yaklaşır?"
answer: "Ekonomik alanda güçlü özgürlükler, ancak toplumsal alanda zayıf özgürlükler"
wrong_answers:
  - "Geleneksel toplumsal düzeni korumak için hem ekonomik hem de toplumsal alanlarda zayıf özgürlükler"
  - "Toplumsal alanda güçlü özgürlükler, ancak ekonomik alanda zayıf özgürlükler"
  - "Her türden asgari devlet müdahalesiyle her iki alanda da eşit ve sınırsız özgürlükler"
explanation: >-
  Muhafazakârlık, sosyalizmin ayna görüntüsü olan bir ikilik sergiler. Ekonomik alanda muhafazakârlar serbest piyasayı, girişimciliği ve özel mülkiyeti savunur. Toplumsal alanda ise kısıtlamalar, geleneksel ahlaki normların ve toplumsal istikrarın korunmasıyla gerekçelendirilir. Üçüncü yanlış cevap, bunun karşıtı olan sosyalist örüntüyü betimler.
reviewed: false
