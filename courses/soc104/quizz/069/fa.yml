question: "چرا موضع لیبرتارین درباره قانونی‌سازی مواد مخدر با این شرط همراه است که نقش دولت در جامعه باید کاهش یابد؟"
answer: "زیرا آزادسازی‌ای که دولت آن را در اختیار بگیرد، مسئولیت فردی را با مراقبت مدیریت‌شده دولتی جایگزین می‌کند، در حالی که لیبرتارین‌ها می‌خواهند شهروندان پیامدهای انتخاب‌های خود را با پشتیبانی انجمن‌های خصوصی بر عهده بگیرند"
wrong_answers:
  - "زیرا قانونی‌سازی تحت کنترل دولت درآمد مالیاتی بیش از حدی ایجاد می‌کند و دولت را بیش از اندازه قدرتمند و فاسد می‌سازد"
  - "زیرا دولت استانداردهای کیفیتی تحمیل می‌کند که قیمت‌ها را بالا می‌برد و بازارهای سیاه را دوباره ایجاد می‌کند"
  - "زیرا مقررات‌گذاری دولتی بر مواد مخدر توافق‌های تجاری بین‌المللی و روابط دیپلماتیک را نقض می‌کند"
explanation: >-
  لیبرتارین‌ها از آزادسازی مواد مخدر حمایت می‌کنند، اما اصرار دارند که نقش دولت باید کاهش یابد، زیرا هدف آن‌ها بازگرداندن مسئولیت فردی است، نه گسترش مدیریت دولتی. اگر کسی وابسته شود، باید مسئولیت بپذیرد، نه اینکه از دولت بخواهد مراقبت فراهم کند. راه‌حل اعتیاد در ابتکار خصوصی نهفته است: پشتیبانی داوطلبانه از سوی افراد، خانواده‌ها و انجمن‌های خیریه. قانونی‌سازی مدیریت‌شده توسط دولت با اصل بنیادی لیبرتارینِ مسئولیت شخصی در تضاد خواهد بود.
reviewed: false
