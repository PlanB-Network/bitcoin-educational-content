question: "Ni ingingo ngenderwako iyihe yayobora amajwi ya Frederic Bastiat mu Nama Nshingamateka y'Igihugu?"
answer: "Guteza imbere umwidegemvyo w'umuntu ku giti ciwe n'uw'ubutunzi no kugabanya ukwivanga kwa leta"
wrong_answers:
  - "Gukingira ububasha bw'umwami no kuzigama imigenzo y'ubwami"
  - "Guteza imbere politike za sosiyalisiti kugira ngo ubutunzi busangirwe ku rugero rungana kuruta"
  - "Ingendo yo hagati yo kwumvikanisha imigwi y'ibubamfu n'iy'iburyo"
explanation: >-
  Bastiat yatoye yisunze ingingo ngenderwako y'ishimikiro: guteza imbere umwidegemvyo w'umuntu ku giti ciwe n'uw'ubutunzi, mu gihe agabanya ukwivanga kwa leta. Ntiyari umuntu wo hagati arondera akaryo, canke uwushigikiye ubwami, canke umusosiyalisiti. Yatora uruhande urwo ari rwo rwose rwaba rutanze ingingo zihuye n'umwidegemvyo hamwe na leta ifise ububasha bugarukiye.
