question: "자유지상주의 안에서 최소국가주의자들과 아나코-자본주의자들의 핵심 차이는 무엇인가요?"
answer: "최소국가주의자들은 국방, 사법, 경찰을 위한 최소한의 국가를 받아들이는 반면, 아나코-자본주의자들은 모든 국가 기능이 민영화되기를 원합니다"
wrong_answers:
  - "최소국가주의자들은 모든 형태의 정부를 거부하는 반면, 아나코-자본주의자들은 시장에 대한 제한적 국가 규제를 받아들입니다"
  - "최소국가주의자들은 필수 서비스에 대한 누진세를 선호하는 반면, 아나코-자본주의자들은 모든 과세에 반대합니다"
  - "최소국가주의자들은 경제적 자유에만 집중하는 반면, 아나코-자본주의자들은 경제적 자유와 사회적 자유를 모두 옹호합니다"
explanation: >-
  최소국가주의자들은 국가가 국방, 사법, 경찰 같은 핵심 기능(이른바 "야경국가")으로 제한되어야 한다고 믿는 반면, 아나코-자본주의자들은 이러한 기능조차 민영화되어 자발적 시장 경쟁을 통해 관리되어야 한다고 주장합니다. 이들의 의견 차이는 근본적 윤리 원칙보다 실제 구현 방식에 더 가깝습니다. 두 경향 모두 자기소유와 비침해라는 같은 자유지상주의 가치를 공유합니다.
