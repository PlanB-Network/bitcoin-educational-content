question: "Hvorfor anses den vertikale aksen (topp-bunn) som mer grunnleggende enn den horisontale aksen (venstre-høyre) i Nolan-diagrammet?"
answer: "Fordi den avslører det egentlige skillet mellom dem som forsvarer maksimal individuell frihet og dem som favoriserer maksimal statlig kontroll"
wrong_answers:
  - "Fordi den måler økonomisk produksjon mer presist enn den horisontale aksen måler sosialpolitikk"
  - "Fordi de fleste politiske konflikter gjennom historien har handlet om kulturell identitet snarere enn styring"
  - "Fordi den horisontale aksen bare gjelder moderne demokratier, mens den vertikale aksen er universell"
explanation: >-
  Den grunnleggende aksen er den vertikale fordi den fanger det essensielle politiske spørsmålet: i hvilken grad bør staten kontrollere menneskelig handling? Venstre-høyre-aksen reflekterer bare ulike sensibiliteter (sosial rettferdighet vs. tradisjon), men begge sider kan innta samme posisjon på den vertikale aksen som statister. Den vertikale aksen avslører om noen ønsker å påtvinge sin visjon med makt eller respekterer individuell frihet.
reviewed: false
