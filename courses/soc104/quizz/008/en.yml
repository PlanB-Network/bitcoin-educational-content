question: "What internal tension exists among libertarians on the Nolan diagram?"
answer: "Some want to abolish the state entirely (anarcho-capitalists) while others prefer a minimal state retaining core sovereign functions (minarchists)"
wrong_answers:
  - "Some want strong economic regulation while others prefer complete deregulation of all industries"
  - "Some support democratic elections while others favor a hereditary system of governance"
  - "Some advocate for progressive social policies while others defend strictly traditional moral values"
explanation: >-
  Within the libertarian family, there is a fundamental disagreement about the role of the state. Anarcho-capitalists want to replace all state functions with private services, while minarchists accept a minimal state that retains core sovereign functions like defense and courts. Both groups share the libertarian summit but differ on whether any state should exist at all.
reviewed: false
