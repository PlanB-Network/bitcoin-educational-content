question: "Khẩu hiệu 'Sapere aude' của Kant khuyến khích con người làm gì?"
answer: "Dám tự mình suy nghĩ và thoát khỏi tình trạng chưa trưởng thành, nơi họ phụ thuộc vào sự chỉ dẫn của một quyền uy cấp trên"
wrong_answers:
  - "Theo đuổi tri thức học thuật bằng cách ghi danh vào các cơ sở giáo dục chính quy và đạt được văn bằng"
  - "Thách thức mọi hình thức đạo đức và tạo ra các hệ thống đạo đức hoàn toàn mới dựa trên ham muốn cá nhân"
  - "Tìm kiếm sự khôn ngoan thông qua lòng sùng đạo và sự quy phục trước giáo huấn của giáo hội"
explanation: >-
  Sapere aude, nghĩa là "Dám tự mình suy nghĩ," được Kant lấy từ nhà thơ Horace và biến thành khẩu hiệu của Khai sáng. Nó tượng trưng cho việc thoát khỏi tình trạng chưa trưởng thành, một trạng thái trong đó con người không có khả năng sử dụng hiểu biết của mình nếu không có sự chỉ dẫn của một tầng lớp hay quyền uy cấp trên. Kant khuyến khích sự giải phóng và trách nhiệm đầy đủ đối với tư duy của chính mình.
