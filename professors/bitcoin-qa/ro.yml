bio: |
  Numele meu este QnA. Sunt un Bitcoiner și îmi place să îi ajut pe alți Bitcoineri. Îmi petrec zilele construind instrumente de suveranitate centrate pe Bitcoin la Foundation. Acest site este o colecție a contribuțiilor mele către care pot îndruma oamenii pentru a-i ajuta în călătoria lor. Dacă îl consideri valoros, te rog să îl împărtășești cu colegii tăi și să iei în considerare să contribui sau să trimiți un bacșiș.

short_bio: Educator Bitcoin
