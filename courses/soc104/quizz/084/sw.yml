question: "Tofauti muhimu kati ya kuwa pro-business na kuwa pro-market ni ipi?"
answer: "Watetezi wa pro-business hutafuta uingiliaji wa dola ili kulinda kampuni mahususi dhidi ya kushindwa, ilhali watetezi wa pro-market huunga mkono kuondoa udhibiti na kuruhusu biashara zishindwe ili soko lijipange upya kiasili"
wrong_answers:
  - "Watetezi wa pro-business hujikita kwenye makampuni makubwa ilhali watetezi wa pro-market hujikita pekee katika kusaidia biashara ndogo na startups"
  - "Pro-business ni msimamo wa mrengo wa kushoto unaopendelea vyama vya ushirika vya wafanyakazi ilhali pro-market ni msimamo wa mrengo wa kulia unaopendelea umiliki binafsi"
  - "Watetezi wa pro-business hukataa ushindani wote ilhali watetezi wa pro-market huunga mkono ushindani unaodhibitiwa na serikali kati ya makampuni yaliyoidhinishwa"
explanation: >-
  Msimamo wa pro-business huona ushindani kama chombo cha utawala kinachopatikana kupitia kanuni na huhalalisha ruzuku na uokoaji wa kifedha ili kuzuia upotevu wa ajira. Katika mtazamo wa pro-business, soko ni dhaifu na linahitaji uokoaji wa dola. Watetezi wa pro-market huona ushindani kama matokeo ya kiasili ya biashara huru, wakimaanisha kuondoa udhibiti na kuruhusu biashara zishindwe, kwa sababu kushindwa huliruhusu soko kujipanga upya kiasili na kufungua nafasi kwa watendaji wenye uwezo zaidi.
