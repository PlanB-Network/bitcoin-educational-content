question: "Как реакция Джорджа У. Буша на финансовый кризис 2008 года иллюстрирует «проблематичную гибкость» консервативных принципов?"
answer: "Он отказался от принципов свободного рынка, чтобы спасти крупные банки, показав консервативное понимание государства как последнего гаранта национальной экономической стабильности"
wrong_answers:
  - "Он отказался от любого государственного вмешательства и позволил банкам обанкротиться, строго придерживаясь идеологии свободного рынка независимо от последствий"
  - "Он навсегда национализировал банковский сектор и ввёл прогрессивное налогообложение, перейдя от консерватизма к демократическому социализму"
  - "Он ответил сокращением всех государственных расходов и отменой финансового регулирования, чтобы позволить рынку самокорректироваться"
explanation: >-
  Буш заявил, что он 'отказался от принципов свободного рынка, чтобы спасти систему свободного рынка', вмешавшись ради спасения крупных банков. Это показывает, как консерваторы могут ставить власть и преемственность нации выше абстрактных рыночных принципов. Та же гибкая логика проявляется в протекционистской торговой политике Трампа, проводимой во имя национального интереса с риском усиления корпоратизма и кумовского капитализма.
reviewed: false
