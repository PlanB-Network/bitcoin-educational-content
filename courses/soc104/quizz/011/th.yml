question: "หมวดเสรีภาพส่วนบุคคลรวมถึงอะไร?"
answer: "สิ่งที่คุณทำในความสัมพันธ์ส่วนตัวของคุณ กับความเห็น ความเชื่อ และทุกสิ่งที่เกี่ยวข้องกับร่างกายและจิตใจของคุณเอง"
wrong_answers:
  - "สิ่งที่คุณทำในฐานะผู้ผลิต รวมถึงการเริ่มธุรกิจ การจ้างพนักงาน และการค้าสินค้า"
  - "คุณจ่ายภาษีเท่าไร ลงทุนอะไร และจัดการสินทรัพย์ทางการเงินของคุณอย่างไร"
  - "ความสามารถของคุณในการแข่งขันในตลาด ตั้งราคาสินค้าของคุณ และเลือกซัพพลายเออร์ของคุณ"
explanation: >-
  เสรีภาพส่วนบุคคลครอบคลุมสิ่งที่คุณทำในความสัมพันธ์ส่วนตัวของคุณ กับความเห็นและความเชื่อ และทุกสิ่งที่เกี่ยวข้องกับร่างกายและจิตใจของคุณเอง สิ่งนี้รวมถึงการแต่งงาน การเลือกอ่านหนังสือ การปฏิบัติทางศาสนา การเลือกอาหารและยา และผู้ที่คุณเลือกคบหา กิจกรรมทางธุรกิจ ภาษี และการตัดสินใจในตลาดอยู่ภายใต้เสรีภาพทางเศรษฐกิจ
reviewed: false
