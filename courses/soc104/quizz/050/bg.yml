question: "Как отговорът на George W. Bush на финансовата криза от 2008 г. илюстрира 'проблематичната гъвкавост' на консервативните принципи?"
answer: "Той изоставя принципите на свободния пазар, за да спаси големите банки, разкривайки консервативния възглед за държавата като последен гарант на националната икономическа стабилност"
wrong_answers:
  - "Той отказва всякаква правителствена намеса и оставя банките да фалират, стриктно придържайки се към идеологията на свободния пазар независимо от последствията"
  - "Той национализира банковия сектор за постоянно и въвежда прогресивно данъчно облагане, преминавайки от консерватизъм към демократичен социализъм"
  - "Той реагира, като съкращава всички правителствени разходи и премахва финансовите регулации, за да остави пазара да се самокоригира"
explanation: >-
  Bush заявява, че е 'изоставил принципите на свободния пазар, за да спаси системата на свободния пазар', като се намесва, за да спаси големите банки. Това илюстрира как консерваторите могат да поставят властта и приемствеността на нацията над абстрактните пазарни принципи. Същата гъвкава логика се проявява в протекционистките търговски политики на Trump, водени в името на националния интерес с риск да подхранят корпоратизъм и крони капитализъм.
