question: "5 つの社会的論点（結婚、移民、銃器、薬物、砂糖入り飲料）全体を通じて、社会主義の立場を形作る反復的な分析枠組みは何ですか？"
answer: "支配する者と支配される者の対立枠組みであり、社会は抑圧によって構造化されており、国家は脆弱な集団を守るために介入しなければならないという見方である"
wrong_answers:
  - "最大多数の市民の全体的幸福と経済生産性を最大化することに焦点を当てた功利主義的枠組み"
  - "個人の自由は国家と企業の干渉の双方から守られなければならないという自然権の枠組み"
  - "確立された社会制度は破壊的な近代的変化から守られなければならないという伝統主義的枠組み"
explanation: >-
  社会的論点全体における社会主義の立場は、一貫して支配する者／支配される者の対立枠組みによって形作られています。結婚では、異性愛者多数派が同性愛者少数派を抑圧しています。移民では、国籍に基づく制限が抑圧の形態です。銃器では、脆弱な人々を守るために国家だけが力を保持すべきです。砂糖入り飲料では、産業家が最も保護されていない人々の脆弱性から利益を得ています。この抑圧者／被抑圧者というレンズは、ジェンダー、人種、さらには人類と自然の関係を含む多くの領域で再現されます。
reviewed: false
