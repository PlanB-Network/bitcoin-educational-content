question: "Wie wordt vaak genoemd als de grondlegger van het moderne conservatisme?"
answer: "Edmund Burke, die pleitte voor het behoud van instellingen en tradities tegenover de radicale veranderingen van de Franse Revolutie"
wrong_answers:
  - "Karl Marx, die in de negentiende eeuw de theorie van klassenstrijd en historisch materialisme ontwikkelde"
  - "John Locke, die in de zeventiende eeuw de theorie van natuurrechten en het sociaal contract formuleerde"
  - "Adam Smith, die The Wealth of Nations schreef en de discipline van de klassieke economie grondvestte"
explanation: >-
  Edmund Burke wordt vaak genoemd als de grondlegger van het conservatisme vanwege zijn verzet tegen de Franse Revolutie. Zijn Reflections on the Revolution in France (1790) verdedigde voorzichtigheid en geleidelijke hervorming boven radicale verandering. Hij geloofde dat de samenleving niet vooruit moest gaan door een schone lei te maken, maar via incrementele hervormingen die beproefde instellingen en tradities behouden.
