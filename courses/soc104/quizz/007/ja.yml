question: "ノーランのダイヤモンドでは、どの立場が最上部に位置し、最大限の自由を表しますか？"
answer: "最大限の経済的自由と個人的自由を支持するリバタリアニズム"
wrong_answers:
  - "伝統的価値観と経済的自由を支持する保守主義"
  - "すべての政治的立場を実用的に均衡させる中道主義"
  - "個人的自由と社会的平等を支持する社会主義"
explanation: >-
  リバタリアニズムは、国家主義の反対としてノーランのダイヤモンドの最上部を占めます。それは経済的自由と個人的自由の両方について最大限の度合いを支持する人々を表します。保守主義は右側（高い経済的自由、低い個人的自由）に、社会主義は左側（高い個人的自由、低い経済的自由）に、中道主義は中央に位置します。
reviewed: false
