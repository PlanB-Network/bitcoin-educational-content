question: "چه تنش درونی‌ای میان لیبرترین‌ها در نمودار نولان وجود دارد؟"
answer: "برخی می‌خواهند دولت را به‌کلی لغو کنند (آنارکو-کاپیتالیست‌ها)، در حالی که برخی دیگر دولتی حداقلی را ترجیح می‌دهند که کارکردهای حاکمیتی اصلی را حفظ کند (مینارشیست‌ها)"
wrong_answers:
  - "برخی خواهان مقررات‌گذاری اقتصادی شدید هستند، در حالی که برخی دیگر مقررات‌زدایی کامل از همهٔ صنایع را ترجیح می‌دهند"
  - "برخی از انتخابات دموکراتیک پشتیبانی می‌کنند، در حالی که برخی دیگر نظام حکمرانی موروثی را ترجیح می‌دهند"
  - "برخی مدافع سیاست‌های اجتماعی پیشرو هستند، در حالی که برخی دیگر از ارزش‌های اخلاقی کاملاً سنتی دفاع می‌کنند"
explanation: >-
  درون خانوادهٔ لیبرترین، اختلافی بنیادین دربارهٔ نقش دولت وجود دارد. آنارکو-کاپیتالیست‌ها می‌خواهند همهٔ کارکردهای دولت را با خدمات خصوصی جایگزین کنند، در حالی که مینارشیست‌ها دولتی حداقلی را می‌پذیرند که کارکردهای حاکمیتی اصلی مانند دفاع و دادگاه‌ها را حفظ می‌کند. هر دو گروه در قلهٔ لیبرترین مشترک‌اند، اما بر سر اینکه آیا اصلاً باید دولتی وجود داشته باشد یا نه اختلاف دارند.
reviewed: false
