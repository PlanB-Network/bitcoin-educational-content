question: "What is the non-aggression principle as theorized by Murray Rothbard?"
answer: "It is illegitimate to initiate physical force against another individual or their property, though defensive violence is permitted"
wrong_answers:
  - "All forms of violence are always wrong, including self-defense and resistance to oppression"
  - "Violence is acceptable when directed against oppressive institutions but never against other individuals"
  - "The state alone has the legitimate right to use force, and individuals must never resort to violence"
explanation: >-
  Rothbard's non-aggression principle holds that initiating physical force against another person or their property is illegitimate. It is a philosophical translation of the golden rule. However, it does not prohibit all violence: defensive violence, including self-defense and resistance to oppression, is considered legitimate. This distinguishes it from pure pacifism and from the state's claimed monopoly on force.
reviewed: false
