description: |
  El "zk" en zkSNACKs significa conocimiento cero, lo que significa que no recopilamos ni podemos recopilar ninguna información personal del usuario en nuestros productos.

  zkSNACKs cerró su coordinador de coinjoin el 1 de junio de 2024, y su sitio web está fuera de línea. Wasabi Wallet continúa como software de código abierto.
