question: "Защо Popper твърди, че отвореното общество остава вътрешно крехко въпреки своите предимства?"
answer: "Защото отговорността, която индивидуализмът предполага, може да изглежда плашеща, създавайки изкушение да се търси убежище в общностна защита, авторитет или носталгия по идеализирано минало"
wrong_answers:
  - "Защото отворените общества нямат военна сила и не могат да се защитят срещу нашествие от затворени общества"
  - "Защото демократичните институции са вътрешно неефективни и в крайна сметка рухват под тежестта на бюрократичната сложност"
  - "Защото отворените общества позволяват твърде голямо икономическо неравенство, което неизбежно води до революция и установяване на авторитарни режими"
explanation: >-
  Popper подчертава, че крехкостта на отвореното общество произтича от психологическа уязвимост. Отговорността, която индивидуализмът предполага, може да изглежда плашеща и рискована, защото човек трябва сам да прави изборите си и може да се провали. Това създава изкушение да се търси убежище в общностна защита или носталгични тенденции към идеализирано минало. Отвореното общество се изправя пред постоянни предизвикателства от комунитарни импулси и повтарящото се изкушение на насилието.
reviewed: false
