question: "존 롤스의 두 정의 원칙은 무엇인가요?"
answer: "모두에게 평등한 자유, 그리고 가장 불리한 처지의 사람들에게 이익이 될 때에만 불평등을 허용하는 차등 원칙"
wrong_answers:
  - "모든 시민을 위한 보통선거권, 그리고 공공 서비스 재원을 마련하기 위한 누진세"
  - "제한 없는 표현의 자유, 그리고 평등을 달성하기 위한 의무적 부의 재분배"
  - "사유재산권의 보호, 그리고 모든 국가 행위에 적용되는 비침해 원칙"
explanation: >-
  롤스는 두 가지 원칙을 제안합니다. 첫째, 모두에게 평등한 자유(민주주의의 토대), 둘째, 차등 원칙으로, 이는 사회에서 가장 불리한 처지에 있는 구성원들에게 이익이 될 때에만 불평등을 허용합니다. 이는 재분배를 통해 가장 불리한 사람들이 함께 이익을 얻을 수 있다면 부유해질 권리가 있다는 뜻입니다. 다른 선택지들은 서로 다른 정치 철학의 요소들을 섞고 있습니다.
reviewed: false
