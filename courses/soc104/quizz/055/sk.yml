question: "Prečo Ron Paul tvrdí, že Federálny rezervný systém je škodlivý, a ako s jeho postojom súvisí Bitcoin?"
answer: "Federálny rezervný systém spôsobuje infláciu a ekonomické cykly manipuláciou s fiat peniazmi a Bitcoin predstavuje formu zdravých peňazí, ktorá by mohla nahradiť zlatý štandard"
wrong_answers:
  - "Federálny rezervný systém obmedzuje bankovú konkurenciu a Bitcoin decentralizuje bankové služby s cieľom zlepšiť finančnú inklúziu"
  - "Federálny rezervný systém bráni voľnému obchodu medzi národmi a Bitcoin umožňuje bezhraničné transakcie bez vládneho schválenia"
  - "Federálny rezervný systém vytvára nadmerný vládny dlh a Bitcoin ponúka deflačnú menu, ktorá odstraňuje národný dlh"
explanation: >-
  Ron Paul, minarchista, tvrdí, že Federálny rezervný systém je zodpovedný za infláciu a ekonomické cykly, pretože manipuluje s fiat peniazmi. Obhajuje odštátnenie peňazí, myšlienku presadzovanú Friedrichom Hayekom, a vidí Bitcoin ako formu zdravých peňazí, ktorá by mohla nahradiť zlatý štandard. Jeho kritika má korene v libertariánskej menovej teórii, nie primárne v bankovej konkurencii, obchodných bariérach ani vládnom dlhu.
