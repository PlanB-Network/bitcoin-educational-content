question: "Ce este paleo-libertarianismul?"
answer: "O sinteză care combină respingerea statului ca sursă de coerciție cu consolidarea instituțiilor tradiționale și a structurilor sociale voluntare"
wrong_answers:
  - "O mișcare libertariană care respinge toate valorile tradiționale și promovează progresivismul social radical"
  - "O ideologie conservatoare care folosește puterea statului pentru a impune valorile tradiționale, permițând în același timp o anumită libertate economică"
  - "O filosofie centristă care caută un compromis echilibrat între economia socialistă și politica socială conservatoare"
explanation: >-
  Paleo-libertarianismul combină respingerea statului ca sursă instituțională de coerciție cu o consolidare a instituțiilor tradiționale și cu o preferință pentru structurile sociale voluntare în locul autorității statului. Se distinge de neo-libertarianism prin faptul că este mai favorabil valorilor tradiționale. Paleo-libertarianul nu se opune comunităților care se organizează în jurul unor principii socialiste sau comunitariste; el refuză doar ca astfel de comunități să își impună valorile tuturor prin forța legii.
