question: "Jaké vnitřní napětí existuje mezi libertariány v Nolanově diagramu?"
answer: "Někteří chtějí stát zcela zrušit (anarchokapitalisté), zatímco jiní dávají přednost minimálnímu státu, který si ponechá základní suverénní funkce (minarchisté)"
wrong_answers:
  - "Někteří chtějí silnou ekonomickou regulaci, zatímco jiní upřednostňují úplnou deregulaci všech odvětví"
  - "Někteří podporují demokratické volby, zatímco jiní dávají přednost dědičnému systému vládnutí"
  - "Někteří prosazují progresivní společenské politiky, zatímco jiní hájí přísně tradiční morální hodnoty"
explanation: >-
  Uvnitř libertariánské rodiny existuje zásadní neshoda ohledně role státu. Anarchokapitalisté chtějí nahradit všechny státní funkce soukromými službami, zatímco minarchisté přijímají minimální stát, který si ponechává základní suverénní funkce, jako je obrana a soudy. Obě skupiny sdílejí libertariánský vrchol, ale liší se v otázce, zda má vůbec nějaký stát existovat.
reviewed: false
