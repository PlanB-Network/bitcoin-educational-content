question: "Jak libertarianie postrzegają relację między własnością prywatną a wolnością?"
answer: "Własność prywatna jest prawem naturalnym, które poprzedza prawo stanowione i państwo, oraz samym fundamentem wolności"
wrong_answers:
  - "Własność prywatna jest konwencją społeczną stworzoną przez państwo, którą można cofnąć, gdy powoduje nierówności"
  - "Własność prywatna jest użyteczna dla efektywności gospodarczej, ale nie ma wrodzonego znaczenia moralnego ani filozoficznego"
  - "Własność prywatna powinna istnieć tylko w odniesieniu do rzeczy osobistych, a nie aktywów produkcyjnych czy ziemi"
explanation: >-
  Libertarianie bronią własności prywatnej jako prawa naturalnego, które poprzedza prawo stanowione i państwo. Twierdzą, że jeśli jednostka posiada własne ciało, posiada także swoją pracę i jej owoce. Własność dóbr materialnych jest przedłużeniem samoposiadania. Kontrastuje to ostro z poglądem libertaire, według którego własność jest konwencją społeczną albo źródłem opresji.
reviewed: false
