question: Kedy Vauban prvýkrát navrhol daňovú reformu?
answer: 1695
wrong_answers:
  - 1693
  - 1697
  - 1700
explanation: |
  Vauban, maršal Francúzska a vojenský inžinier, navrhol v roku 1695 daňovú reformu známu ako "Dîme Royale". Cieľom tohto návrhu bolo zjednodušiť daňový systém a spravodlivejšie rozdeliť daňové zaťaženie.
