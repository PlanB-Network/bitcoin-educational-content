question: "What is one key way that Bitcoin mining can enhance a nation's economic sovereignty, according to the chapter?"
answer: "Converts domestic energy into appreciating digital wealth, independent of global lenders"
wrong_answers:
  - "Enables censorship-resistant control over block participation"
  - Justifies investments in local infrastructure development
  - Reduces reliance on fossil heating systems through heat recovery
explanation: |
  The chapter states that Bitcoin mining allows countries to turn energy into digital reserves with long-term value, breaking cycles of debt and dependency on global lenders.
