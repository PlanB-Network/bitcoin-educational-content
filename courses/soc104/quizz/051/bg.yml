question: "Какво поставят либертарианците в центъра на своята политическа философия?"
answer: "Етиката и правото"
wrong_answers:
  - "Икономическия растеж и създаването на богатство"
  - "Социалното равенство и колективното благосъстояние"
  - "Националната идентичност и културното опазване"
explanation: >-
  Либертарианците се отличават от всички други политически семейства, като поставят етиката и правото в центъра на философията си, а не икономиката. Когато защитават пазарната икономика, това е по-малко заради способността ѝ да произвежда богатство, отколкото заради насърчаването на индивидуална свобода и отговорност. Икономическият растеж е вторична полза, а не основополагащият принцип.
reviewed: false
