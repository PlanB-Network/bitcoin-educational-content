question: "Šta je koncept „moralnog hazarda” u kontekstu rasprave o subvencijama i koja politička porodica iznosi tu brigu?"
answer: "Moralni hazard je podsticaj ka neodgovornosti kada se kompanije sprečavaju da propadnu putem subvencija, jer na kraju plaća poreski obveznik; tu brigu iznose libertarijanci"
wrong_answers:
  - "Moralni hazard je rizik da će se subvencionisane kompanije preseliti u zemlje sa nižim porezima, noseći radna mesta sa sobom; tu brigu iznose konzervativci"
  - "Moralni hazard je opasnost da će vladini službenici postati korumpirani birajući koje kompanije dobijaju subvencije; tu brigu iznose centristi"
  - "Moralni hazard je etički problem kompanija koje iskorišćavaju radnike nakon dobijanja javnih sredstava; tu brigu iznose socijalisti"
explanation: >-
  Libertarijanci tvrde da subvencije i spasavanja stvaraju moralni hazard: kada se kompanije sprečavaju da propadnu, to podstiče neodgovornost i nepromišljenost jer nema posledica za loše odluke. Na kraju plaća poreski obveznik, što libertarijanci smatraju duboko nepravednim. Taj koncept se razlikuje od briga o preseljenju kompanija, korupciji službenika ili iskorišćavanju radnika koje iznose druge političke porodice.
