question: "Mida tahavad parempoolsed seadustega reguleerida?"
answer: "Moraali ja religiooni, ajendatuna soovist säilitada traditsioonilisi institutsioone ja sotsiaalseid hierarhiaid"
wrong_answers:
  - "Majandust ja finantsturge, ajendatuna soovist vähendada ebavõrdsust ja rikkust ümber jaotada"
  - "Teadust ja haridust, ajendatuna soovist kontrollida, mida avalikes koolides õpetatakse"
  - "Rahvusvahelist kaubandust ja diplomaatiat, ajendatuna soovist laiendada riigi mõju välismaal"
explanation: >-
  Parempoolsed seavad esikohale isikliku moraali ja traditsioonilised väärtused. Nad leiavad, et tsivilisatsioon on rajatud teatavatele traditsioonilistele institutsioonidele ja sotsiaalsetele hierarhiatele, mida tuleb säilitada, ning nad tahavad seadustega reguleerida moraali ja religiooni. Majanduse seadustega reguleerimisele keskenduvad vasakpoolsed, mitte parempoolsed. Teadus, haridus ja kaubanduspoliitika ei ole siin parempoolsete puhul kirjeldatud põhifookus.
reviewed: false
