question: "Manakah dari berikut ini yang merupakan contoh tatanan spontan sebagaimana dijelaskan oleh Hayek?"
answer: "Bahasa, yang berkembang secara organik melalui interaksi historis alih-alih dirancang oleh para intelektual di sebuah biro"
wrong_answers:
  - "Konstitusi nasional, yang disusun dengan cermat oleh perwakilan terpilih untuk menetapkan aturan sosial"
  - "Rencana stimulus pemerintah, yang dirancang oleh para ekonom untuk mengoordinasikan aktivitas ekonomi"
  - "Sistem pendidikan publik, yang dibuat oleh para legislator untuk memastikan akses universal ke pengetahuan"
explanation: >-
  Hayek menggambarkan tatanan spontan sebagai produk interaksi bebas dalam masyarakat, yang dihasilkan dari tindakan manusia tetapi bukan dari rancangan manusia yang disengaja. Bahasa adalah contoh utama: bahasa Prancis, Inggris, dan Jerman tidak dibangun oleh para intelektual yang menetapkan aturan tata bahasa, tetapi muncul sebagai buah dari organisasi yang lambat dan organik yang terbentuk melalui interaksi historis.
reviewed: false
