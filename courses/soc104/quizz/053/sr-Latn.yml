question: "Zašto su klasični liberali u Sjedinjenim Državama tokom dvadesetog veka počeli sebe da nazivaju 'libertarijancima'?"
answer: "Zato što je američki 'liberalizam' bio kooptiran rastućim državnim intervencionizmom i državom blagostanja"
wrong_answers:
  - "Zato što su želeli da se distanciraju od evropskih monarhističkih tradicija"
  - "Zato što je termin 'liberal' postao povezan sa anarhizmom i političkim nasiljem"
  - "Zato što su novi trgovinski sporazumi zahtevali poseban politički identitet za zagovornike slobodnog tržišta"
explanation: >-
  Tokom dvadesetog veka dogodio se temeljan pomak, jer su principi laissez-faire-a progresivno napuštani u korist države blagostanja. Američki "liberalizam" počeo je da znači nešto sasvim drugačije od klasičnog liberalizma, prihvatajući državni intervencionizam. Klasični liberali usvojili su termin "libertarijanac" kako bi sačuvali razliku. Ova promena naziva nije imala nikakve veze sa evropskim monarhizmom, anarhističkim nasiljem ili trgovinskim sporazumima.
reviewed: false
