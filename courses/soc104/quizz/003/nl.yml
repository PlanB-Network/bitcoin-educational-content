question: "Waarom wordt de links-rechtsas als ontoereikend beschouwd om klassiek-liberale denkers zoals Bastiat of Ron Paul te plaatsen?"
answer: "Omdat klassiek liberalisme zowel economische als persoonlijke vrijheden waardeert, die noch links noch rechts volledig omarmen"
wrong_answers:
  - "Omdat klassieke liberalen zich altijd aansluiten bij rechts economisch beleid en alle linkse standpunten afwijzen"
  - "Omdat klassieke liberalen centristen zijn die gematigde versies van zowel linkse als rechtse ideologieën overnemen"
  - "Omdat klassieke liberalen zich verzetten tegen alle vormen van overheid, waardoor ze anarchisten zijn in plaats van politieke denkers"
explanation: >-
  De links-rechtsas schiet tekort voor klassieke liberalen omdat ze geen positie kan bevatten die tegelijk economische vrijheid (typisch rechts) en persoonlijke vrijheid (typisch links) verdedigt. Klassieke liberalen zijn geen centristen die naar compromissen zoeken, en ook geen anarchisten of puur rechts. Ze passen simpelweg niet op een eendimensionaal spectrum.
reviewed: false
