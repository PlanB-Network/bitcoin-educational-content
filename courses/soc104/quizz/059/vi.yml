question: "Hai nguyên tắc công lý của John Rawls là gì?"
answer: "Tự do bình đẳng cho tất cả, và nguyên tắc khác biệt chỉ cho phép bất bình đẳng nếu chúng đem lại lợi ích cho những người bất lợi nhất"
wrong_answers:
  - "Phổ thông đầu phiếu cho mọi công dân, và thuế lũy tiến để tài trợ các dịch vụ công"
  - "Tự do ngôn luận không hạn chế, và tái phân phối của cải bắt buộc để đạt bình đẳng"
  - "Bảo vệ quyền tài sản tư nhân, và nguyên tắc bất xâm phạm áp dụng cho mọi hành động của nhà nước"
explanation: >-
  Rawls đề xuất hai nguyên tắc: thứ nhất, tự do bình đẳng cho tất cả (nền tảng của dân chủ), và thứ hai, nguyên tắc khác biệt, chỉ cho phép bất bình đẳng nếu chúng đem lại lợi ích cho những thành viên bất lợi nhất của xã hội. Điều này nghĩa là người ta có quyền làm giàu, miễn là tái phân phối cho phép những người kém may mắn nhất cũng được hưởng lợi. Các lựa chọn khác trộn lẫn các yếu tố từ những triết lý chính trị khác nhau.
