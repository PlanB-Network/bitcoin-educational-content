question: "Iri somo ryemeza gute ko umwidegemvyo utuma agaciro k'ibumoso n'ak'iburyo bibana mu mahoro?"
answer: "Mu buryo bw'umwidegemvyo nyakuri, abantu bafise ivyiyumviro vy'ibumoso barashobora gusangira amatungo no gusubira kugabura amafaranga ku bushake, mu gihe abafise agaciro k'iburyo bashobora kuzigama no kuraga imigenzo, ata ruhande rushira ku rundi uburyo bwarwo bwo kubaho"
wrong_answers:
  - "Umwidegemvyo usaba ko impande zose zompi zemera guhura hagati mu kwemera aho leta iringaniza agaciro gahiganwa biciye mu mategeko aciriritse"
  - "Umwidegemvyo usigura ko imiryango y'ibumoso n'iy'iburyo itegerezwa kuba mu turere dutandukanye tw'isi, ifise leta zayo zigenga"
  - "Umwidegemvyo ukora mu kureka abanyagihugu bagatora agaciro gakwiye gushirwa mu ngiro muri buri karere, politike z'ibumoso n'iz'iburyo zigasimburana buri gihe c'amatora"
explanation: >-
  Iri somo ryerekana ko mu buryo bw'umwidegemvyo nyakuri, abakurikira ivyiyumviro vy'ibumoso bashobora guheba amatungo ku bushake, gusangira uburyo bwo guhingura, canke gutanga imishahara mu mashirahamwe asubira kugabura ubutunzi. Abafise agaciro k'iburyo bashobora gukora cane, kuzigama, no kuraga agaciro k'umuryango. Nta n'umwe akwiye gushira ku bandi uburyo bwiwe bwo kubaho. Biciye mu mwidegemvyo w'isoko n'ububasha bwo guhitamwo ni ho intumbero zishobora gushikwako mu mahoro.
