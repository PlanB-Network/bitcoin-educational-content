question: "Paylaşılan bir siyasi kanaat olarak inşacılık nedir?"
answer: "Merkezi bir hükümetin, yasa gücüyle, en büyük sayı için iyi olan bir toplumsal düzen yaratabileceğine duyulan inanç"
wrong_answers:
  - "Toplumun, devlet müdahalesi olmadan bireyler arasındaki gönüllü işbirliği yoluyla örgütlenmesi gerektiğine duyulan inanç"
  - "Toplumda kaynakların optimal dağılımını yalnızca serbest piyasaların belirleyebileceğine duyulan inanç"
  - "Siyasi otoritenin doğrudan demokrasi yoluyla tüm vatandaşlar arasında eşit biçimde dağıtılması gerektiğine duyulan inanç"
explanation: >-
  İnşacılık, merkezcileri, muhafazakârları ve sosyalistleri ortak bir kanaat etrafında birleştirir: siyasi sürecin piyasa sürecinden üstünlüğü. Merkezi bir hükümetin, yasa gücüyle, en büyük sayı için iyi olan bir toplumsal düzen yaratabileceğine duyulan inançtır. Bu, gönüllü etkileşimlerden doğan kendiliğinden düzenin liberteryen savunusuyla doğrudan karşıtlık içindedir.
reviewed: false
