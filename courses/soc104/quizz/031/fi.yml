question: "Mitä ranskalaiset libertairet (sosialistiset anarkistit) uskovat yksityisomaisuudesta?"
answer: "Yksityisomaisuus ja kapitalismi on lakkautettava, koska ne ovat sorron lähteitä"
wrong_answers:
  - "Yksityisomaisuus on luonnollinen oikeus, joka edeltää valtiota ja jota on suojeltava hinnalla millä hyvänsä"
  - "Valtion tulisi säännellä yksityisomaisuutta, mutta sitä ei saa koskaan poistaa yhteiskunnasta kokonaan"
  - "Yksityisomaisuus on hyväksyttävää vain silloin, kun se jaetaan tasan kaikkien kommuunin jäsenten kesken"
explanation: >-
  Ranskalaiset libertairet, sosialistisen anarkismin perilliset Proudhonin ja Bakuninin kaltaisten ajattelijoiden kautta, katsovat, että sekä valtio että yksityisomaisuus on lakkautettava sorron rinnakkaisina lähteinä. Tämä tiivistyy Proudhonin kuuluisaan kaavaan "Omaisuus on varkautta." Ensimmäinen väärä vastaus kuvaa libertaarista kantaa, joka on perustavanlaatuisesti vastakkainen libertaire-näkemykselle.
