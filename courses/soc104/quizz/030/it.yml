question: "In che cosa differiscono i ruoli del Cato Institute, del Mises Institute e del Libertarian Party all'interno del movimento libertario?"
answer: "Il Cato Institute si concentra su proposte di politica pubblica, il Mises Institute sull'educazione e sulla pubblicazione accademica, e il Libertarian Party sulla politica elettorale"
wrong_answers:
  - "Il Cato Institute finanzia campagne politiche, il Mises Institute fa lobbying diretto presso il Congresso e il Libertarian Party organizza conferenze accademiche"
  - "Il Cato Institute pubblica manuali di economia, il Mises Institute gestisce campagne di registrazione degli elettori e il Libertarian Party redige proposte di legge"
  - "Il Cato Institute organizza proteste di base, il Mises Institute fornisce difesa legale ai libertari e il Libertarian Party gestisce la ricerca dei think tank"
explanation: >-
  Il Cato Institute (fondato nel 1977) è un think tank con sede a Washington che lavora su proposte di politica pubblica. Il Mises Institute (fondato nel 1982) si concentra sull'educazione più che sul lobbying politico, funzionando come una sorta di università online con conferenze e opere ripubblicate. Il Libertarian Party (fondato nel 1971) è il terzo partito politico americano per grandezza e partecipa alle elezioni, dove persino la sua quota di voti di circa il 2% può determinare gli esiti.
