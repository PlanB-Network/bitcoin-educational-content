question: "Merkezciliğin temel değerleri nelerdir?"
answer: "Ilımlılık, uzlaşma, uyum ve kamu yararı"
wrong_answers:
  - "Gelenek, düzen, otorite ve ulusal kimlik"
  - "Özgürlük, özel mülkiyet, rıza ve bireysel sorumluluk"
  - "Eşitlik, toplumsal adalet, dayanışma ve kolektif mülkiyet"
explanation: >-
  Merkezciliğin temel değerleri ılımlılık, uzlaşma, uyum ve kamu yararıdır. Bunlar, ideolojik bağlılıktan ziyade pragmatik dengeye yapılan merkezci vurguyu yansıtır. Diğer seçenekler sırasıyla muhafazakârlığın, liberteryenizmin ve sosyalizmin temel değerlerini betimler.
reviewed: false
