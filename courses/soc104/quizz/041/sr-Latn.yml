question: "Kako strukturni pristup definiše fundamentalnu razliku između socijalizma i libertarijanizma?"
answer: "Socijalizam daje primat državi kroz regulaciju, planiranje i kontrolu, dok libertarijanizam daje primat pojedincu kroz minimalnu državnu intervenciju"
wrong_answers:
  - "Socijalizam daje prioritet ruralnim poljoprivrednim zajednicama, dok libertarijanizam favorizuje urbani industrijski razvoj"
  - "Socijalizam se definiše podrškom demokratskim izborima, dok libertarijanizam odbacuje sve oblike političkog učešća"
  - "Socijalizam se usredsređuje na spoljnu politiku i međunarodnu saradnju, dok se libertarijanizam bavi samo domaćim ekonomskim pitanjima"
explanation: >-
  Strukturno, socijalizam karakteriše sveprisutnost države, koja reguliše, planira i kontroliše. Libertarijanizam se definiše minimalnom državnom intervencijom u ekonomiju i privatni život, težeći primatu individualne slobode i slobodnog tržišta. Ova strukturna razlika daleko je analitički korisnija od poređenja deklarisanih namera svakog sistema.
reviewed: false
