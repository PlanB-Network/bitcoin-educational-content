question: Ancien Régime යටතේ වැඩ සහ කර්මාන්ත නියාමනය කුමන ආකාරයක් ගත්තේද?
answer: සෑම කර්මාන්ත වර්ගයක් සඳහාම රෙගුලාසි සිය ගණනක්
wrong_answers:
  - ආර්ථික ක්‍රියාකාරකම් සඳහා පොදු නීති සංග්‍රහයක්
  - වැඩ හා කර්මාන්ත සඳහා බොහෝ නිදහසක් ඉතිරි කළ, තරමක් නම්‍යශීලී විධිවිධාන කිහිපයක්
  - පුද්ගලික පියවරවලට සම්පූර්ණ නිදහස ලබා දුන්, නීති සම්පූර්ණයෙන්ම නොමැති තත්ත්වයක්
explanation: |
  Ancien Régime වැඩ සහ කර්මාන්ත පාලනය කළ වෘත්තීය සංඝ සහ දැඩි රෙගුලාසි පද්ධතියකින් ලක්ෂණගත විය. සෑම වෘත්තියක්ම තරඟය සහ නවෝත්පාදනය සීමා කළ, බොහෝ විට ඉතා විස්තරාත්මක වූ, විශේෂ නීතිවලට යටත් විය.
