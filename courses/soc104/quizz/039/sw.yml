question: "Mtazamo wa kimuundo unafafanuaje tofauti ya msingi kati ya usoshalisti na libertarianism?"
answer: "Usoshalisti huipa dola kipaumbele kupitia udhibiti, upangaji, na usimamizi, ilhali libertarianism huipa mtu binafsi kipaumbele kupitia uingiliaji mdogo wa dola"
wrong_answers:
  - "Usoshalisti hutanguliza jumuiya za kilimo za vijijini, ilhali libertarianism hupendelea maendeleo ya viwanda mijini"
  - "Usoshalisti hufafanuliwa na kuunga mkono kwake uchaguzi wa kidemokrasia, ilhali libertarianism hukataa aina zote za ushiriki wa kisiasa"
  - "Usoshalisti hujikita katika sera za nje na ushirikiano wa kimataifa, ilhali libertarianism huhusika tu na masuala ya kiuchumi ya ndani ya nchi"
explanation: >-
  Kimuundo, usoshalisti hubainishwa na uwepo wa kila mahali wa dola, ambayo hudhibiti, hupanga, na husimamia. Libertarianism hufafanuliwa na uingiliaji mdogo wa dola katika uchumi na maisha binafsi, ikielekea kwenye kipaumbele cha uhuru wa mtu binafsi na soko huru. Tofauti hii ya kimuundo ina manufaa makubwa zaidi kiuchambuzi kuliko kulinganisha nia zinazotajwa za kila mfumo.
