question: "لیبرتِرهای فرانسوی (آنارشیست‌های سوسیالیست) درباره مالکیت خصوصی چه باور دارند؟"
answer: "مالکیت خصوصی و سرمایه‌داری باید برچیده شوند، زیرا سرچشمه‌های ستم هستند"
wrong_answers:
  - "مالکیت خصوصی حقی طبیعی است که مقدم بر دولت است و باید به هر قیمتی از آن حفاظت شود"
  - "مالکیت خصوصی باید توسط دولت تنظیم شود، اما هرگز به‌طور کامل از جامعه حذف نشود"
  - "مالکیت خصوصی فقط زمانی پذیرفتنی است که به‌طور برابر میان همه اعضای یک کمون توزیع شود"
explanation: >-
  لیبرتِرهای فرانسوی، وارثان آنارشیسم سوسیالیستی از طریق متفکرانی مانند پرودون و باکونین، معتقدند که هم دولت و هم مالکیت خصوصی باید به‌عنوان دو سرچشمه همزاد ستم برچیده شوند. این در فرمول مشهور پرودون خلاصه شده است: «مالکیت دزدی است.» نخستین پاسخ نادرست موضع لیبرترین را توصیف می‌کند، که اساساً با دیدگاه لیبرتِر مخالف است.
reviewed: false
