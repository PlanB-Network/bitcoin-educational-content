question: "समाजवाद सामाजिक और आर्थिक क्षेत्रों में स्वतंत्रताओं के साथ अलग-अलग व्यवहार कैसे करता है?"
answer: "समाजवाद सामाजिक क्षेत्र में मजबूत स्वतंत्रताओं का पक्ष लेता है लेकिन आर्थिक क्षेत्र में कमजोर स्वतंत्रताओं का"
wrong_answers:
  - "समाजवाद सामाजिक और आर्थिक दोनों क्षेत्रों में सभी स्वतंत्रताओं को समान रूप से सीमित करता है"
  - "समाजवाद मजबूत आर्थिक स्वतंत्रताओं का पक्ष लेता है लेकिन सामाजिक व्यवस्था बनाए रखने के लिए सामाजिक स्वतंत्रताओं को सीमित करता है"
  - "समाजवाद दोनों क्षेत्रों में असीमित स्वतंत्रताएँ देता है और संतुलन बनाए रखने के लिए स्वैच्छिक सहयोग पर निर्भर करता है"
explanation: >-
  समाजवादी चिंतन में सामाजिक और आर्थिक स्वतंत्रताओं के बीच एक मूलभूत द्वैत है। सामाजिक स्वतंत्रताएँ मजबूत होती हैं, लेकिन राज्य नियंत्रण, नियोजन और संपदा पुनर्वितरण पर ज़ोर के कारण आर्थिक स्वतंत्रताएँ कमजोर होती हैं। तीसरा गलत उत्तर libertarian आदर्श का वर्णन करता है, जबकि दूसरा रूढ़िवादी पैटर्न का वर्णन करता है, जो समाजवाद की दर्पण-छवि है।
