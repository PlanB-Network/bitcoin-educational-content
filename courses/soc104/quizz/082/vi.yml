question: "Đâu là một ví dụ về trật tự tự phát như Hayek mô tả?"
answer: "Ngôn ngữ, thứ phát triển một cách hữu cơ qua các tương tác lịch sử thay vì được các trí thức trong một văn phòng thiết kế"
wrong_answers:
  - "Một hiến pháp quốc gia, được các đại diện dân cử soạn thảo cẩn trọng để thiết lập các quy tắc xã hội"
  - "Một kế hoạch kích thích kinh tế của chính phủ, được các nhà kinh tế thiết kế để phối hợp hoạt động kinh tế"
  - "Một hệ thống giáo dục công, được các nhà lập pháp tạo ra để bảo đảm quyền tiếp cận tri thức phổ quát"
explanation: >-
  Hayek mô tả trật tự tự phát như sản phẩm của các tương tác tự do trong xã hội, phát sinh từ hành động của con người nhưng không từ thiết kế có chủ ý của con người. Ngôn ngữ là một ví dụ điển hình: tiếng Pháp, tiếng Anh và tiếng Đức không được kiến tạo bởi các trí thức quyết định các quy tắc ngữ pháp, mà xuất hiện như thành quả của một sự tổ chức chậm rãi, hữu cơ được xây dựng qua các tương tác lịch sử.
