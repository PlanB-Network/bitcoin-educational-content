question: Компресията на SHA-256 става джет, но комбинаторите fold и map не могат. Какво обяснява асиметрията?
answer: Джетът заменя един фиксиран израз; fold и map не са единични изрази, а схеми, които дават различен израз за всяка вътрешна функция f.
wrong_answers:
  - Джетовете ускоряват само линеен код, така че итериращите комбинатори първо трябва да бъдат разгънати и тогава не съвпадат с никой джет.
  - Само изрази с машинно проверено доказателство в Rocq отговарят на условията, а такова съществува за SHA-256, но не и за folds.
  - Folds върху къси вектори са твърде евтини, за да имат полза, така че джетовете са запазени за скъпи криптографски операции.
explanation: >-
  Джетът е нативна замяна за един конкретен, напълно оформен израз на Simplicity,
  който възлите могат да заместят, като запазят точната му семантика. fold-right-n,
  map, zip и техните варианти не са единични изрази, а конструкционни схеми: всеки
  избор на вътрешната функция f дава структурно различен израз, така че нито един
  единичен джет не може да замести цялото семейство. Затова тези итерационни модели
  се появяват като истински комбинаторен код в реални програми, обикновено генериран
  от езици от по-високо ниво като SimplicityHL.
reviewed: false
