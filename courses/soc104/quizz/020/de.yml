question: "Was ist Paleo-Libertarismus?"
answer: "Eine Synthese, die die Ablehnung des Staates als Quelle von Zwang mit einer Stärkung traditioneller Institutionen und freiwilliger sozialer Strukturen verbindet"
wrong_answers:
  - "Eine libertäre Bewegung, die alle traditionellen Werte ablehnt und radikalen sozialen Progressivismus fördert"
  - "Eine konservative Ideologie, die Staatsmacht nutzt, um traditionelle Werte durchzusetzen, während sie gewisse wirtschaftliche Freiheit zulässt"
  - "Eine zentristische Philosophie, die einen ausgewogenen Kompromiss zwischen sozialistischer Wirtschaftspolitik und konservativer Sozialpolitik sucht"
explanation: >-
  Paleo-Libertarismus verbindet die Ablehnung des Staates als institutionelle Quelle von Zwang mit einer Stärkung traditioneller Institutionen und einer Präferenz für freiwillige soziale Strukturen gegenüber staatlicher Autorität. Er unterscheidet sich vom Neo-Libertarismus dadurch, dass er traditionellen Werten wohlwollender gegenübersteht. Der Paleo-Libertäre ist nicht dagegen, dass sich Gemeinschaften nach sozialistischen oder gemeinschaftsorientierten Prinzipien organisieren; er lehnt nur ab, dass solche Gemeinschaften ihre Werte allen mit Gesetzeskraft aufzwingen.
