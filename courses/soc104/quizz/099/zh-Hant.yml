question: "Eric Hughes 1993 年《Cypherpunk Manifesto》中關於隱私的核心訊息是什麼？"
answer: "隱私對電子時代的開放社會至關重要，而個人必須自己建構隱私，而不是期待政府或企業來保障它"
wrong_answers:
  - "隱私是一種奢侈品，必須為了國家安全與保護民主制度而犧牲"
  - "隱私應由國際條約監管，為所有國家建立一致的資料保護標準"
  - "隱私只對罪犯與異議人士重要，而守法公民則受益於透明的監控系統"
explanation: >-
  Eric Hughes 1993 年的宣言指出，在電子時代，隱私對開放社會至關重要，而且我們不能期待政府、企業或其他大型組織來保障它。根本動機在於，保密性是自由的一個關鍵要素，必須由個人自己建構，而不是等待制度把它當作禮物賜予。
reviewed: false
