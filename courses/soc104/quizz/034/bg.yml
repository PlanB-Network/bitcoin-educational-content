question: "Как структурният подход дефинира фундаменталната разлика между социализма и либертарианството?"
answer: "Социализмът дава първенство на държавата чрез регулиране, планиране и контрол, докато либертарианството дава първенство на индивида чрез минимална държавна намеса"
wrong_answers:
  - "Социализмът приоритизира селските земеделски общности, докато либертарианството предпочита градското индустриално развитие"
  - "Социализмът се дефинира чрез подкрепата си за демократични избори, докато либертарианството отхвърля всички форми на политическо участие"
  - "Социализмът се фокусира върху външната политика и международното сътрудничество, докато либертарианството се занимава само с вътрешни икономически въпроси"
explanation: >-
  Структурно социализмът се характеризира с вездесъщието на държавата, която регулира, планира и контролира. Либертарианството се дефинира чрез минимална държавна намеса в икономиката и в частния живот, клоняща към първенство на индивидуалната свобода и свободния пазар. Това структурно разграничение е много по-полезно аналитично от сравняването на заявените намерения на всяка система.
