question: "در گفت‌وگوهای ۱۸۴۹ گوستاو دو مولیناری، کدام شخصیت از آزادی به‌عنوان اصلی بنیادین دفاع می‌کند، نه اینکه آن را تابع اهداف دیگر بداند؟"
answer: "اقتصاددان، که آزادی را اصلی می‌داند که تابع هیچ هدف دیگری نیست"
wrong_answers:
  - "سوسیالیست، که از آزادی از راه اصلاحات پیشرو با هدف برابری اجتماعی دفاع می‌کند"
  - "محافظه‌کار، که با حفظ نظم و ثبات اجتماعی سنتی از آزادی حمایت می‌کند"
  - "هر سه شخصیت به‌طور برابر از آزادی دفاع می‌کنند، اما دربارهٔ چگونگی اجرای آن اختلاف دارند"
explanation: >-
  در گفت‌وگوهای مولیناری در Les Soirees de la rue Saint-Lazare، اقتصاددان در اختلافی دائمی با هر دو شخصیت سوسیالیست و محافظه‌کار قرار دارد. او تنها کسی است که از آزادی به‌عنوان اصلی بنیادین دفاع می‌کند. سوسیالیست آزادی را تابع آرمان‌های پیشرو می‌کند، و محافظه‌کار آن را تابع حفظ نظم می‌سازد؛ از همین رو اقتصاددان در دفاع بی‌قیدوشرط خود از آزادی یگانه است.
reviewed: false
