question: В каком смысле условная композиция является дуальной по отношению к параллельной композиции?
answer: Параллельная композиция подаёт обеим операциям один и тот же вход и объединяет их выходы в пару (произведение); условная композиция принимает сумму входов, и обе ветви разделяют один и тот же тип выхода.
wrong_answers:
  - Параллельная композиция обязана выполнять обе операции одновременно; условная выполняет их последовательно и возвращает только ветвь, выбранную тегом.
  - Обе выполняются на одном общем входе; параллельная сохраняет пару выходов, тогда как условная выполняет обе ветви и отбрасывает невыбранную.
  - Параллельная композиция дублирует свой вход заранее, тогда как условная дублирует свой выход постфактум, меняя местами, где происходит копирование.
explanation: >-
  Двойственность заключается в обмене произведения и суммы, при котором
  общий тип меняет сторону: параллельная композиция даёт обеим операциям
  один и тот же тип входа и объединяет их выходы в произведение, тогда
  как условная композиция принимает сумму (помеченное объединение) двух
  типов входа, и обе ветви должны давать один и тот же тип выхода.
  Одновременность несущественна — статья подчёркивает, что параллельная
  композиция может быть реализована последовательно, — а условная
  композиция выполняет ровно одну ветвь, выбранную тегом, а не запускает
  обе с отбрасыванием одной из них.
