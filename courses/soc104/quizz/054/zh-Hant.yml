question: "中間主義傾向於哪種治理形式？"
answer: "技術官僚制，即權力被交給引導經濟與掌控貨幣政策的專家"
wrong_answers:
  - "直接民主，即公民對每項重大政策決定投票"
  - "貴族制，即權力由傳統統治階級掌握"
  - "laissez-faire 治理，即市場在沒有國家干預下自我調節"
explanation: >-
  中間主義優先考慮效率與務實，並傾向於技術官僚制，意思是權力應交給引導經濟並掌控貨幣政策的專家。這與直接民主、貴族制或 laissez-faire 根本不同，因為每一種都依據完全不同的原則分配權力。
reviewed: false
