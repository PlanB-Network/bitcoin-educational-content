question: "Proč je osa levice–pravice považována za nedostatečnou pro zařazení klasických liberálních myslitelů, jako jsou Bastiat nebo Ron Paul?"
answer: "Protože klasický liberalismus si cení ekonomických i osobních svobod, které levice ani pravice plně nepřijímají"
wrong_answers:
  - "Protože klasičtí liberálové se vždy shodují s pravicovými ekonomickými politikami a odmítají všechny levicové postoje"
  - "Protože klasičtí liberálové jsou centristé, kteří přijímají umírněné verze levicových i pravicových ideologií"
  - "Protože klasičtí liberálové odmítají všechny formy vlády, což z nich činí anarchisty, nikoli politické myslitele"
explanation: >-
  Osa levice–pravice u klasických liberálů selhává, protože nedokáže pojmout pozici, která současně hájí ekonomickou svobodu (typicky pravicovou) i osobní svobodu (typicky levicovou). Klasičtí liberálové nejsou centristé hledající kompromis, nejsou ani anarchisté či čistě pravicoví myslitelé. Na jednorozměrné spektrum se jednoduše nevejdou.
reviewed: false
