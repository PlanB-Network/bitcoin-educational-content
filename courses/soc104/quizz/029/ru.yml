question: "Что общего у либертарианцев и консерваторов и что их разделяет?"
answer: "Их объединяют приверженность ограниченному государству и отвержение принудительного эгалитаризма, но они расходятся по вопросам военного интервенционизма и социальной политики"
wrong_answers:
  - "Их объединяет поддержка протекционистской торговой политики и национальной обороны, но они расходятся по вопросу роли религии в общественной жизни"
  - "Их объединяет приверженность прогрессивному налогообложению и программам социального обеспечения, но они расходятся по иммиграционной политике"
  - "Их объединяет противодействие свободной торговле и легализации наркотиков, но они расходятся по размеру федерального правительства"
explanation: >-
  Либертарианцы и консерваторы оба отстаивают ограниченное государство, отвергают принудительный эгалитаризм, выступают против государственного долга и защищают права штатов. Однако либертарианцы отвергают военный интервенционизм неоконсерваторов, выступают против консервативной социальной политики и субсидий, осуждают запрет наркотиков и отвергают протекционизм. Союз реален, но внутренне напряжен.
