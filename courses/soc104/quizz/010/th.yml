question: "มีความตึงเครียดภายในใดในหมู่ลิเบอร์ทาเรียนบน Nolan diagram?"
answer: "บางคนต้องการยกเลิกรัฐทั้งหมด (anarcho-capitalists) ขณะที่บางคนชอบรัฐขั้นต่ำที่คงไว้เฉพาะหน้าที่อธิปไตยแกนกลาง (minarchists)"
wrong_answers:
  - "บางคนต้องการการกำกับเศรษฐกิจอย่างเข้มแข็ง ขณะที่บางคนชอบการยกเลิกกฎระเบียบทั้งหมดในทุกอุตสาหกรรม"
  - "บางคนสนับสนุนการเลือกตั้งประชาธิปไตย ขณะที่บางคนสนับสนุนระบบการปกครองแบบสืบตระกูล"
  - "บางคนสนับสนุนนโยบายสังคมแบบก้าวหน้า ขณะที่บางคนปกป้องค่านิยมศีลธรรมแบบดั้งเดิมอย่างเคร่งครัด"
explanation: >-
  ภายในครอบครัวลิเบอร์ทาเรียน มีความขัดแย้งพื้นฐานเกี่ยวกับบทบาทของรัฐ Anarcho-capitalists ต้องการแทนที่หน้าที่ทั้งหมดของรัฐด้วยบริการเอกชน ขณะที่ minarchists ยอมรับรัฐขั้นต่ำที่คงไว้เฉพาะหน้าที่อธิปไตยแกนกลาง เช่น การป้องกันประเทศและศาล ทั้งสองกลุ่มมีจุดร่วมที่ยอดลิเบอร์ทาเรียน แต่แตกต่างกันว่าควรมีรัฐอยู่เลยหรือไม่
reviewed: false
