question: "非侵略原則主張什麼？"
answer: "一個人只要沒有對另一個人的生命、自由或財產實施暴力，就可以按自己所願行動"
wrong_answers:
  - "國家擁有使用武力以維持社會秩序的唯一權利"
  - "即使多數決限制個人自由，公民也必須服從多數決"
  - "只有在有益於社會集體利益時，行動自由才被允許"
explanation: >-
  非侵略原則是自由至上主義政治的基石，主張個人可以自由行動，前提是不對他人的生命、自由或財產實施暴力。它讓人想起各文明中都可見的黃金律。不同於其他選項，它不賦予國家特殊道德權威，也不把個人權利從屬於集體利益。
reviewed: false
