question: Hệ quả đối với người tham gia Bitcoin sẽ như thế nào nếu các kích thước khối tăng hơn 100 lần?
answer: Việc vận hành một máy chủ Bitcoin sẽ không còn tiếp cận được với người tham gia thông thường, làm suy yếu tính phi tập trung của giao thức và tính bất biến của cả giao dịch lẫn quy tắc đồng thuận.
wrong_answers:
  - Việc vận hành một máy chủ Bitcoin sẽ trở nên dễ dàng hơn đối với người tham gia thông thường, tăng cường tính phi tập trung của giao thức và tính bất biến của cả giao dịch lẫn quy tắc đồng thuận.
  - Khả năng xử lý giao dịch của mạng sẽ giảm.
  - Phần thưởng cho các thợ đào sẽ tăng lên.
explanation: |
  Nếu kích thước các khối tăng hơn 100 lần, việc vận hành một máy chủ Bitcoin sẽ yêu cầu một ổ cứng 50TB, băng thông trên 500GB/tháng, và phần cứng có khả năng xác thực hàng trăm nghìn giao dịch trong ít hơn 10 phút. Điều này sẽ làm cho việc vận hành một máy chủ Bitcoin trở nên không thể tiếp cận được với người tham gia thông thường, làm suy yếu tính phi tập trung của giao thức và tính bất biến của giao dịch và quy tắc đồng thuận.
reviewed: true