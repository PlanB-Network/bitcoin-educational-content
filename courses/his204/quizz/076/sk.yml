question: Ktoré tri faktory vysvetľujú Turgotovu brilantnosť?
answer: Jeho rodinný pôvod, doba, jeho intelektuálna predčasná vyspelosť
wrong_answers:
  - Jeho rodinný pôvod, jeho sieť priateľov, jeho bohatstvo
  - Doba, jeho majetok, reputácia jeho brata
  - Jeho charizma, jeho výrečnosť, jeho odhodlanie
explanation: |
  K jeho brilantnosti prispel Turgotov rodinný pôvod, jeho príslušnosť k šľachtickej a vplyvnej rodine, obdobie poznačené intelektuálnym vzruchom a túžbou po reformách, a jeho intelektuálna predčasná vyspelosť, ktorá mu umožnila rýchlo si osvojiť ekonomické a politické poznatky.
