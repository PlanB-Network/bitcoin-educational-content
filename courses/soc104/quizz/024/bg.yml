question: "Какво е палео-либертарианство?"
answer: "Синтез, съчетаващ отхвърлянето на държавата като източник на принуда с укрепване на традиционните институции и доброволните социални структури"
wrong_answers:
  - "Либертарианско движение, което отхвърля всички традиционни ценности и насърчава радикален социален прогресивизъм"
  - "Консервативна идеология, която използва държавната власт, за да налага традиционни ценности, като допуска известна икономическа свобода"
  - "Центристка философия, която търси балансиран компромис между социалистическа икономика и консервативна социална политика"
explanation: >-
  Палео-либертарианството съчетава отхвърлянето на държавата като институционален източник на принуда с укрепване на традиционните институции и предпочитание към доброволни социални структури пред държавната власт. То се отличава от нео-либертарианството с по-голяма симпатия към традиционните ценности. Палео-либертарианецът не се противопоставя на общности, организирани около социалистически или комунитарни принципи; той само отказва такива общности да налагат ценностите си на всички чрез силата на закона.
