question: "Hur representerar Green New Deal en samtida utveckling av demokratisk socialism?"
answer: "Den använder miljöfrågor som en ny motivering för statlig intervention och konfiskation av privat inkomst, och underordnar individuellt intresse den kollektiva planetära hälsan"
wrong_answers:
  - "Den överger traditionell socialistisk ekonomi helt till förmån för fria marknadslösningar på miljöproblem genom handel med utsläppsrätter"
  - "Den avvisar statlig intervention och förlitar sig i stället på frivilligt individuellt handlande och innovation i den privata sektorn för att hantera klimatförändringar"
  - "Den utgör ett brott med socialismen genom att prioritera miljöskydd framför alla frågor om social rättvisa och sysselsättning"
explanation: >-
  Green New Deal förenar miljöfrågor med sociala mål, genom att kombinera ekologisk omställning med social rättvisa, sysselsättningsgarantier och förstärkta offentliga tjänster. Individuellt intresse underordnas kollektivt intresse definierat av planetär hälsa. I grunden erbjuder den ett nytt retoriskt hölje som rättfärdigar statlig intervention och konfiskation av privat inkomst, inte längre enbart i den sociala rättvisans namn utan också i miljöns namn.
reviewed: false
