question: "По какво либертарианското разбиране за свободата се различава от центристкото разбиране?"
answer: "Либертарианците разглеждат свободата като безусловна аксиома, докато центристите защитават свободите опортюнистично според контекста и ефективността"
wrong_answers:
  - "Либертарианците позволяват на държавата да защитава свободата избирателно, докато центристите отхвърлят всякакво участие на държавата в защитата на индивидуалните права"
  - "Либертарианците съсредоточават свободата само върху икономически въпроси, докато центристите прилагат свободата широко в социални и културни области"
  - "Либертарианците и центристите споделят един и същ възглед за свободата, но не са съгласни относно размера на правителството, нужен за нейното налагане"
explanation: >-
  Либертарианците определят свободата като общ, безусловен принцип, който функционира като аксиома. За разлика от тях центристите защитават определени свободи по опортюнистичен и контекстуален начин, без да прилагат какъвто и да е общ принцип. Центристкият подход разкрива инструментално разбиране за свободата, винаги подчинено на прагматични цели като ефективността, което либертарианците фундаментално отхвърлят.
