question: "Por que as definições intencionais de sistemas políticos são consideradas problemáticas para fins analíticos?"
answer: "Elas criam confusão conceitual porque todos os sistemas afirmam buscar objetivos semelhantes, como justiça, equidade e liberdade"
wrong_answers:
  - "Elas são precisas e rígidas demais, não deixando espaço para a evolução natural dos movimentos políticos ao longo do tempo"
  - "Elas se concentram excessivamente nos resultados econômicos e ignoram as dimensões culturais e sociais da vida política"
  - "Elas dependem de documentos governamentais sigilosos que raramente estão disponíveis para pesquisadores independentes"
explanation: >-
  Definições intencionais se baseiam em motivações e objetivos declarados, mas todo sistema político afirma buscar justiça, equidade e liberdade. Isso torna impossível distinguir os sistemas uns dos outros. A análise estrutural, em contraste, avalia os sistemas por suas consequências empíricas e mensuráveis e pelos meios que empregam, revelando sua verdadeira natureza para além da retórica.
reviewed: false
