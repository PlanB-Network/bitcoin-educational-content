question: How does the access notation (O, I, H) work in Simplicity?
answer: O means 'take' (left), I means 'drop' (right), and H means 'iden' (whole value).
wrong_answers:
  - O means output, I means input, and H means halt the program's execution.
  - They are variable names that the compiler assigns to values automatically.
  - O selects odd-indexed elements, I selects even-indexed elements, H selects the head.
explanation: >-
  The O/I/H shorthand provides a compact way to navigate nested pairs.
  O f is take f (extract left), I f is drop f (extract right), and H is
  iden (the whole value). Sequences like I O H mean drop(take(iden)),
  extracting the first element of the second element. This resembles
  De Bruijn indices with binary digits as tree positions.
