question: "Kuidas seostub Karl Popperi eristus avatud ja suletud ühiskondade vahel individualismi ja kollektivismi debatiga?"
answer: "Avatud ühiskond tunnustab indiviidi õigust ise otsustada isiklike valikute kaudu, samas kui suletud ühiskond on kollektivistlik, tuginedes hõimumentaliteedile ja kriitilise vabaduse eitamisele"
wrong_answers:
  - "Avatud ühiskond on selline, mis lubab vabakaubandust üle riigipiiride, samas kui suletud ühiskond kehtestab tariife ja protektsionistlikke majanduspoliitikaid"
  - "Avatud ühiskonda juhib otsedemokraatia, kus iga kodanik hääletab, samas kui suletud ühiskonda valitseb üks pärilik monarh"
  - "Avatud ühiskond avaldab kõik valitsuse dokumendid läbipaistvalt, samas kui suletud ühiskond salastab informatsiooni riigisaladustena"
explanation: >-
  Popper määratles suletud ühiskonda maagilise või hõimuühiskonnana ja avatud ühiskonda sellisena, milles indiviidid seisavad silmitsi isiklike otsustega. Suletud ühiskond on kollektivistlik, tuginedes hõimumentaliteedile koos kriitilise vabaduse eitamise ja staatilise korra idealiseerimisega. Avatud ühiskond annab esikoha väärtuste, uskumuste ja suhete vabale valikule, kehastades otseselt individualistlikke põhimõtteid.
reviewed: false
