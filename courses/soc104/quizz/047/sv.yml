question: "Vem nämns ofta som den moderna konservatismens grundgestalt?"
answer: "Edmund Burke, som förespråkade att bevara institutioner och traditioner mot den franska revolutionens radikala förändringar"
wrong_answers:
  - "Karl Marx, som utvecklade teorin om klasskamp och historisk materialism under artonhundratalet"
  - "John Locke, som formulerade teorin om naturrättigheter och samhällskontraktet under sextonhundratalet"
  - "Adam Smith, som skrev The Wealth of Nations och grundade den klassiska ekonomins disciplin"
explanation: >-
  Edmund Burke nämns ofta som konservatismens grundgestalt för sitt motstånd mot den franska revolutionen. Hans Reflections on the Revolution in France (1790) försvarade klokhet och gradvisa reformer framför radikal förändring. Han ansåg att samhället inte borde gå framåt genom att börja från ett blankt blad utan genom stegvisa reformer som bevarar prövade institutioner och traditioner.
