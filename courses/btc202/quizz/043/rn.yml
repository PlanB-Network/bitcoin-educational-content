question: Ni itandukaniro irihe riri hagati ya Umbrel Home na umbrelOS?
answer: Umbrel Home ni umukozi mutoyi yashizweho mbere, umbrelOS ni ugushiraho
wrong_answers:
  - Umbrel Home ni ubuntu, umbrelOS si ubuntu
  - Umbrel Home ntishigikira Bitcoin; umbrelOS ni yo iyishigikira
  - Umbrel Home ni inkomoko yuguruye(open source), umbrelOS ni umunyagihugu(proprietary)
explanation: |
 Umbrel Home igurishwa yamaze gutegurwa kandi ifisemwo umbrelOS, mu gihe umbrelOS ushobora kuyishira wewe nyene ku bikoresho vyawe.
reviewed: true
