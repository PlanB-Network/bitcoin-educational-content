question: Ce le reproșează el „sufletelor bune”?
answer: Că provoacă mizerie forțând prețurile să rămână mereu scăzute
wrong_answers:
  - Că sprijină agricultura în detrimentul manufacturii
  - Că cheltuiesc banii publici prea neglijent pentru a-i sprijini pe cei săraci
  - Că nu îi ajută suficient pe cei săraci
explanation: |
  Boisguilbert critica pe cei care căutau să mențină prețurile în mod artificial scăzute, considerând că acest lucru descuraja producția, crea penurie și, în cele din urmă, provoca mizerie. El credea că prețurile ar trebui stabilite de piață, în funcție de cerere și ofertă.
