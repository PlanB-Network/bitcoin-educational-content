question: "Kako su svi totalitarni režimi došli na vlast?"
answer: "Nasilnom revolucijom koja je opravdavala pravljenje čistog lista od prethodnog sistema"
wrong_answers:
  - "Postepenom zakonodavnom reformom unutar postojećih demokratskih institucija"
  - "Vojnim udarima koje su organizovale strane sile radi regionalne kontrole"
  - "Mirnim masovnim pokretima koji su ubedljivom većinom pobedili na izborima"
explanation: >-
  Svi totalitarni režimi došli su na vlast nasilnom revolucijom. Ta revolucija služi dvostrukoj svrsi: fizički uništava stari poredak i ideološki opravdava upotrebu nasilja kao neophodnu za izgradnju novog društva. To totalitarna preuzimanja vlasti razlikuje od demokratskih tranzicija, udara podržanih iz inostranstva ili mirnih izbornih pobeda.
