question: SHA-256 壓縮可以成為一個 jet，但 fold 與 map 組合子卻不行。是什麼解釋了這種不對稱？
answer: 一個 jet 替換的是一個固定的運算式；fold 與 map 並非單一運算式，而是建構方案，會針對每個內層函數 f 產生一個不同的運算式。
wrong_answers:
  - jet 只會加速直線式程式碼，所以進行迭代的組合子必須先被展開，之後便對應不到任何 jet。
  - 只有具備經機器檢查之 Rocq 證明的運算式才符合資格，SHA-256 有這樣的證明，而那些 fold 則沒有。
  - 對短向量進行的 fold 太便宜而無法從中獲益，所以 jet 被保留給成本高昂的密碼學運算。
explanation: >-
  一個 jet 是針對某個特定、完全成形之 Simplicity 運算式的原生替代品，節點可以在保留其確切語義的前提下替換它。fold-right-n、map、zip 及其變體並非單一運算式，而是建構方案：每一種內層函數 f 的選擇都會產生一個結構上不同的運算式，因此沒有任何單一的 jet 能替代整個家族。這就是為什麼這些迭代模式會以真正的組合子程式碼出現在實際的程式中，通常是由像 SimplicityHL 這類高階語言所產生。
reviewed: false
