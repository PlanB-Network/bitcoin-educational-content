question: "Какво представлява понятието „спонтанен ред“, описано от Friedrich Hayek?"
answer: "Социалните правила и норми трябва да възникват от свободни индивидуални взаимодействия, а не да бъдат налагани чрез авторитарно планиране"
wrong_answers:
  - "Пазарите естествено клонят към монопол, освен ако държавата не се намеси, за да поддържа конкурентен баланс"
  - "Демократичните избори са единственият легитимен механизъм за установяване на законите, които управляват обществото"
  - "Икономическите кризи възникват спонтанно и изискват незабавна правителствена намеса за възстановяване на стабилността"
explanation: >-
  Понятието на Hayek за спонтанен ред гласи, че правилата, управляващи обществото, не трябва да се налагат отгоре чрез централно планиране, а трябва да възникват от свободната игра на индивидуални воли, договори и доброволни отношения. Това е фундаментална ос на либертарианската мисъл. То не предполага, че пазарите клонят към монопол или че кризите изискват правителствена намеса.
