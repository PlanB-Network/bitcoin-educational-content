question: "Bitcoin ท้าทายเสาหลักสามประการใดของรัฐสวัสดิการ?"
answer: "ระบบภาษี การผูกขาดทางการเงินเพื่อจัดหาเงินให้การใช้จ่ายผ่านหนี้ และการเฝ้าระวังธุรกรรมเพื่อป้องกันการใช้สกุลเงินทางเลือก"
wrong_answers:
  - "งบประมาณกองทัพ ระบบการศึกษาสาธารณะ และโครงสร้างพื้นฐานด้านสาธารณสุขที่รัฐบาลควบคุม"
  - "ระบบตุลาการ กระบวนการนิติบัญญัติ และการบังคับใช้กฎระเบียบต่อธุรกิจโดยฝ่ายบริหาร"
  - "ระบบประกันสังคม กฎหมายค่าแรงขั้นต่ำ และโครงสร้างภาษีเงินได้แบบก้าวหน้า"
explanation: >-
  Bitcoin ท้าทายเสาหลักสามประการที่รัฐสวัสดิการตั้งอยู่ ประการแรก ระบบภาษีซึ่งไม่เพียงพอที่จะครอบคลุมรายจ่าย ประการที่สอง การผูกขาดทางการเงิน หมายถึงความสามารถในการออกเงินเพื่อจัดหาเงินให้การใช้จ่ายผ่านหนี้ ประการที่สาม การเฝ้าระวังธุรกรรม คือความสามารถในการป้องกันไม่ให้ผู้คนใช้สกุลเงินอื่นนอกจาก fiat ที่รัฐบังคับ Bitcoin บ่อนเซาะทั้งสามอย่างพร้อมกัน
reviewed: false
