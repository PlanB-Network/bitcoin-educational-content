question: "ข้อใดต่อไปนี้เป็นตัวอย่างของระเบียบเกิดเองตามที่ Hayek อธิบาย?"
answer: "ภาษา ซึ่งพัฒนาขึ้นอย่างเป็นอินทรีย์ผ่านปฏิสัมพันธ์ทางประวัติศาสตร์ แทนที่จะถูกออกแบบโดยปัญญาชนในสำนักงาน"
wrong_answers:
  - "รัฐธรรมนูญแห่งชาติ ซึ่งถูกร่างอย่างรอบคอบโดยผู้แทนที่มาจากการเลือกตั้งเพื่อวางกฎทางสังคม"
  - "แผนกระตุ้นเศรษฐกิจของรัฐบาล ซึ่งถูกออกแบบโดยนักเศรษฐศาสตร์เพื่อประสานกิจกรรมทางเศรษฐกิจ"
  - "ระบบการศึกษาสาธารณะ ซึ่งถูกสร้างโดยฝ่ายนิติบัญญัติเพื่อรับประกันการเข้าถึงความรู้ถ้วนหน้า"
explanation: >-
  Hayek อธิบายระเบียบเกิดเองว่าเป็นผลผลิตของปฏิสัมพันธ์เสรีในสังคม ซึ่งเกิดจากการกระทำของมนุษย์ แต่ไม่ได้เกิดจากการออกแบบโดยเจตนาของมนุษย์ ภาษาเป็นตัวอย่างสำคัญ: ภาษาฝรั่งเศส อังกฤษ และเยอรมันไม่ได้ถูกสร้างขึ้นโดยปัญญาชนที่ตัดสินใจกฎไวยากรณ์ แต่เกิดขึ้นในฐานะผลของการจัดระเบียบอย่างช้า ๆ และเป็นอินทรีย์ที่ก่อรูปผ่านปฏิสัมพันธ์ทางประวัติศาสตร์
reviewed: false
