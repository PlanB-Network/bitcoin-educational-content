question: "Kako libertarijanci vide odnos između privatne svojine i slobode?"
answer: "Privatna svojina je prirodno pravo koje prethodi zakonu i državi, i predstavlja sam temelj slobode"
wrong_answers:
  - "Privatna svojina je društvena konvencija koju je stvorila država i koja se može opozvati kada izaziva nejednakost"
  - "Privatna svojina korisna je za ekonomsku efikasnost, ali nema inherentan moralni ili filozofski značaj"
  - "Privatna svojina treba da postoji samo za lične posede, ne za proizvodna sredstva ili zemlju"
explanation: >-
  Libertarijanci brane privatnu svojinu kao prirodno pravo koje prethodi zakonu i državi. Oni tvrde da ako pojedinac poseduje sopstveno telo, poseduje i svoj rad i plodove tog rada. Vlasništvo nad materijalnim dobrima produžetak je samovlasništva. To je u oštrom kontrastu s libertaire gledištem da je svojina društvena konvencija ili izvor ugnjetavanja.
