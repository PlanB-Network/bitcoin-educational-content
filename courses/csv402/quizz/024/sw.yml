question: Ni utaratibu gani katika RGB unaoruhusu mabadiliko mengi kuunganishwa pamoja katika muamala mmoja wa Bitcoin?
answer: Transition Bundle
wrong_answers:
  - Seal Aggregation
  - Multi-Commitment Tree
  - State Consolidation
explanation: |
  Transition Bundle ni seti ya Mipito ya Jimbo la RGB (inayomilikiwa na Contract sawa) ambayo yote yanahusika katika Bitcoin Witness Transaction sawa.
reviewed: true
