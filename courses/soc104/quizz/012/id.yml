question: "Mengapa model dua dimensi berargumen bahwa sebagian besar isu politik dapat dibagi ke dalam kategori ekonomi dan pribadi?"
answer: "Karena isu ekonomi berkaitan dengan apa yang Anda lakukan sebagai produsen dan konsumen, sementara isu pribadi berkaitan dengan hubungan privat, keyakinan, dan otonomi tubuh Anda"
wrong_answers:
  - "Karena semua perdebatan politik pada akhirnya mereduksi diri menjadi ketidaksepakatan tentang tingkat perpajakan dan praktik keagamaan"
  - "Karena secara historis pemerintah hanya mengatur dua hal: pasar dan militer"
  - "Karena para filsuf politik sejak zaman kuno selalu memisahkan urusan material dari urusan spiritual"
explanation: >-
  Model dua dimensi didasarkan pada gagasan bahwa isu politik terbagi menjadi dua kategori luas. Kebebasan ekonomi mencakup produksi, konsumsi, perdagangan, pekerjaan, dan pengelolaan uang. Kebebasan pribadi mencakup hubungan privat, opini, keyakinan, dan pilihan tentang tubuh serta pikiran Anda sendiri. Pemisahan ini memungkinkan pemetaan posisi politik yang jauh lebih bernuansa dibandingkan satu sumbu kiri-kanan.
