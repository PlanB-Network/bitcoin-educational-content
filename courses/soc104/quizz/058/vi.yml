question: "Sự phân biệt quan trọng giữa thân doanh nghiệp và thân thị trường là gì?"
answer: "Thân doanh nghiệp nghĩa là ủng hộ một liên minh giữa các doanh nghiệp lớn và nhà nước, trong khi thân thị trường nghĩa là ủng hộ cạnh tranh tự do không có thiên vị của nhà nước"
wrong_answers:
  - "Thân doanh nghiệp nghĩa là ủng hộ các doanh nghiệp nhỏ, trong khi thân thị trường nghĩa là ủng hộ các tập đoàn đa quốc gia"
  - "Thân doanh nghiệp nghĩa là phản đối hoàn toàn điều tiết, trong khi thân thị trường nghĩa là chấp nhận điều tiết vừa phải"
  - "Thân doanh nghiệp tập trung vào công nghiệp trong nước, trong khi thân thị trường tập trung vào thương mại quốc tế"
explanation: >-
  Những người trung dung có xu hướng thân doanh nghiệp, nghĩa là họ ủng hộ một kiểu liên minh giữa các doanh nghiệp lớn và nhà nước, điều này khác với thân thị trường. Thân thị trường ủng hộ cạnh tranh tự do không có thiên vị của nhà nước hay chủ nghĩa bảo hộ doanh nghiệp. Sự phân biệt này là then chốt vì các chính sách thân doanh nghiệp có thể tạo ra độc quyền và các bảo hộ pháp quy thực ra làm suy yếu cạnh tranh thị trường tự do.
