question: 1789 නොවැම්බර් Caisse d'Escompte පනත පිළිබඳ ඔහුගේ විවේචනය කුමක්ද?
answer: එය නිදහස් තරඟයේ නීතිවලට යටත් විය යුතු ඒකාධිකාරී ආයතනයකි
wrong_answers:
  - එය ආක්‍රමණශීලී යුද්ධ සඳහා මූල්‍යකරණය දිරිමත් කරන ආයතනයක් පිහිටුවයි
  - එය assignats නිකුත් කිරීම කඩාකප්පල් කරයි
  - එය ධනවතුන්ට වාසි සලසයි
explanation: |
  Caisse d'Escompteට ලබා දුන් ඒකාධිකාරය Dupont de Nemours විවේචනය කළේ, එය නිදහස් තරඟයට බාධා කර ආර්ථිකයට හානි කරන බව ඔහු විශ්වාස කළ නිසාය.