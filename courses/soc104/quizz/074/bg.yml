question: "Какво е понятието „морален риск“ в контекста на дебата за субсидиите и кое политическо семейство повдига това опасение?"
answer: "Моралният риск е стимулът към безотговорност, когато на компаниите се пречи да се провалят чрез субсидии, защото в крайна сметка плаща данъкоплатецът; това опасение се повдига от либертарианците"
wrong_answers:
  - "Моралният риск е рискът субсидираните компании да се преместят в страни с по-ниски данъци, отнасяйки работни места със себе си; това опасение се повдига от консерваторите"
  - "Моралният риск е опасността държавните служители да станат корумпирани, избирайки кои компании получават субсидии; това опасение се повдига от центристите"
  - "Моралният риск е етичният проблем компании да експлоатират работници след получаване на публични средства; това опасение се повдига от социалистите"
explanation: >-
  Либертарианците твърдят, че субсидиите и спасителните пакети създават морален риск: когато на компаниите се пречи да се провалят, това стимулира безотговорност и безразсъдство, защото няма последствия за лошите решения. В крайна сметка плаща данъкоплатецът, което либертарианците смятат за дълбоко несправедливо. Това понятие е различно от опасенията за корпоративно преместване, служебна корупция или експлоатация на работници, повдигани от други политически семейства.
reviewed: false
