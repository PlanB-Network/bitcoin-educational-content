question: "Към каква форма на управление клони центризмът?"
answer: "Технокрация, при която властта е поверена на експерти, които направляват икономиката и пилотират паричната политика"
wrong_answers:
  - "Пряка демокрация, при която гражданите гласуват за всяко голямо политическо решение"
  - "Аристокрация, при която властта се държи от традиционна управляваща класа"
  - "Laissez-faire управление, при което пазарът се регулира сам без държавна намеса"
explanation: >-
  Центризмът привилегирова ефективността, прагматизма и клони към технокрация, което означава, че властта трябва да бъде поверена на експерти, които направляват икономиката и пилотират паричната политика. Това е фундаментално различно от пряката демокрация, аристокрацията или laissez-faire, всяко от които разпределя властта според напълно различни принципи.
