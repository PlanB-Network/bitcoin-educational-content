question: "Co obejmuje kategoria wolności osobistej?"
answer: "To, co robisz w swoich prywatnych relacjach, ze swoimi opiniami, przekonaniami oraz wszystkim, co dotyczy twojego własnego ciała i umysłu"
wrong_answers:
  - "To, co robisz jako producent, w tym zakładanie firmy, zatrudnianie pracowników i handel dobrami"
  - "Ile podatku płacisz, jakie inwestycje robisz i jak zarządzasz swoimi aktywami finansowymi"
  - "Twoją zdolność konkurowania na rynku, ustalania cen swoich produktów i wyboru dostawców"
explanation: >-
  Wolność osobista obejmuje to, co robisz w swoich prywatnych relacjach, ze swoimi opiniami i przekonaniami oraz wszystko, co dotyczy twojego własnego ciała i umysłu. Obejmuje to małżeństwo, wybory lektur, praktyki religijne, wybory dotyczące żywności i leków oraz to, z kim się zadajesz. Działalność biznesowa, podatki i decyzje rynkowe należą do wolności gospodarczej.
reviewed: false
