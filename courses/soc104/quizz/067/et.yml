question: "Mis on libertaarne seisukoht samasooliste abielu küsimuses?"
answer: "Riigil ei ole mingit asja abielu määratleda; see tuleks privatiseerida ning jätta üksikisikutele, ühendustele ja religioossetele institutsioonidele"
wrong_answers:
  - "Samasooliste abielu tuleks legaliseerida, sest kõik kodanikud väärivad seaduse ees võrdset kohtlemist"
  - "Samasooliste abielu tuleks keelata, sest traditsiooniline abielu on sigimise jaoks fundamentaalne institutsioon"
  - "Samasooliste abielu tuleks legaliseerida, kuid ainult traditsioonilisest abielust eraldi õigusraamistiku kaudu"
explanation: >-
  Libertaarid väidavad, et abieluküsimus on põhimõtteliselt valesti raamitud, sest see esitatakse etatistlikes mõistetes. Nad usuvad, et riigil ei ole mingit asja sekkuda eraellu, seega on lahendus eraldada abielu riigist täielikult. Üheainsa määratluse kehtestamisega loob riik konflikte. Esimene vale vastus peegeldab sotsialistlikku või tsentristlikku seisukohta, ja teine peegeldab konservatiivset seisukohta.
reviewed: false
