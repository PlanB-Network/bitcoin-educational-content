question: "В чём важное различие между позицией pro-business и позицией pro-market?"
answer: "Быть pro-business означает поддерживать союз между крупными предприятиями и государством, тогда как быть pro-market означает поддерживать свободную конкуренцию без государственного фаворитизма"
wrong_answers:
  - "Быть pro-business означает поддерживать малый бизнес, тогда как быть pro-market означает поддерживать многонациональные корпорации"
  - "Быть pro-business означает полностью выступать против регулирования, тогда как быть pro-market означает принимать умеренное регулирование"
  - "Позиция pro-business сосредоточена на отечественной промышленности, тогда как позиция pro-market сосредоточена на международной торговле"
explanation: >-
  Центристы склонны быть pro-business, то есть поддерживать своего рода союз между крупными предприятиями и государством, что отличается от позиции pro-market. Позиция pro-market поддерживает свободную конкуренцию без государственного фаворитизма или корпоративного протекционизма. Это различие принципиально важно, потому что политика pro-business может создавать монополии и регуляторные защиты, которые на деле подрывают свободную рыночную конкуренцию.
