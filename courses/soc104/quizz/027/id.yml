question: "Bagaimana peran Cato Institute, Mises Institute, dan Libertarian Party berbeda dalam gerakan libertarian?"
answer: "Cato Institute berfokus pada proposal kebijakan publik, Mises Institute pada pendidikan dan penerbitan akademik, dan Libertarian Party pada politik elektoral"
wrong_answers:
  - "Cato Institute mendanai kampanye politik, Mises Institute melobi Kongres secara langsung, dan Libertarian Party menyelenggarakan konferensi akademik"
  - "Cato Institute menerbitkan buku teks ekonomi, Mises Institute menjalankan kampanye pendaftaran pemilih, dan Libertarian Party menyusun rancangan undang-undang"
  - "Cato Institute menyelenggarakan protes akar rumput, Mises Institute menyediakan pembelaan hukum bagi libertarian, dan Libertarian Party mengelola riset think tank"
explanation: >-
  Cato Institute (didirikan 1977) adalah think tank berbasis di Washington yang bekerja pada proposal kebijakan publik. Mises Institute (didirikan 1982) berfokus pada pendidikan alih-alih lobi politik, berfungsi sebagai semacam universitas online dengan konferensi dan karya-karya yang diterbitkan ulang. Libertarian Party (didirikan 1971) adalah partai politik Amerika terbesar ketiga, berpartisipasi dalam pemilihan di mana bahkan perolehan suaranya yang sekitar 2% dapat mengubah hasil.
