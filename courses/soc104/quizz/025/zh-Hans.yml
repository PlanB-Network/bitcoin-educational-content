question: "什么是 paleo-libertarianism？"
answer: "一种综合体，将拒绝国家作为强制来源，与强化传统制度和自愿社会结构结合起来"
wrong_answers:
  - "一种拒绝所有传统价值并推动激进社会进步主义的自由意志主义运动"
  - "一种保守主义意识形态，使用国家权力执行传统价值，同时允许一定经济自由"
  - "一种中间主义哲学，寻求在社会主义经济学和保守主义社会政策之间达成均衡妥协"
explanation: >-
  Paleo-libertarianism 将拒绝国家作为制度性强制来源，与强化传统制度以及偏好自愿社会结构而非国家权威结合起来。它区别于 neo-libertarianism，因为它更同情传统价值。Paleo-libertarian 并不反对围绕社会主义或共同体主义原则组织起来的社区；他们只是拒绝这些社区通过法律强力把自己的价值观强加给所有人。
reviewed: false
