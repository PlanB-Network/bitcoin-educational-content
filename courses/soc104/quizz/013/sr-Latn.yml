question: "Šta obuhvata kategorija ekonomske slobode?"
answer: "Ono što radite kao proizvođač i potrošač: kupovina, prodaja, proizvodnja, rad, zapošljavanje i upravljanje novcem"
wrong_answers:
  - "Vaša verska uverenja, lični odnosi i sloboda izražavanja"
  - "Vaše pravo da glasate, učestvujete na izborima i pristupate političkim partijama"
  - "Vaša sposobnost da slobodno putujete, birate mesto stanovanja i prelazite državne granice"
explanation: >-
  Ekonomska sloboda obuhvata ono što radite kao proizvođač i potrošač: šta možete da kupite, prodate ili proizvedete; gde radite; koga zapošljavate; i šta radite sa svojim novcem. Lični odnosi, verska uverenja i sloboda kretanja spadaju u kategoriju lične slobode, a ne ekonomske.
