question: "Che cosa vuole legiferare e regolare la sinistra?"
answer: "L'economia, spinta dall'ostilità verso la libertà economica, il capitalismo e il libero mercato"
wrong_answers:
  - "La moralità personale e le pratiche religiose, spinte dal desiderio di preservare le istituzioni tradizionali"
  - "L'immigrazione e i confini nazionali, spinti da preoccupazioni riguardo all'identità culturale e alla sovranità"
  - "La tecnologia e l'innovazione, spinte dal timore che l'automazione sostituisca i lavoratori umani"
explanation: >-
  La sinistra dà priorità alla giustizia sociale e all'uguaglianza, in particolare sul piano economico. Questo porta alla sua ostilità verso la libertà economica, il capitalismo e il libero mercato, e al suo desiderio di legiferare e regolare l'economia. La destra, al contrario, vuole legiferare su moralità e religione. La regolazione dell'immigrazione e della tecnologia non è il focus principale descritto qui.
reviewed: false
