question: "리버테리언의 자유 관념은 중도주의자의 관념과 어떻게 다른가요?"
answer: "리버테리언은 자유를 무조건적 공리로 다루는 반면, 중도주의자는 맥락과 효율성에 따라 기회주의적으로 자유를 옹호합니다"
wrong_answers:
  - "리버테리언은 국가가 자유를 선택적으로 보호하도록 허용하는 반면, 중도주의자는 개인 권리 보호에 대한 모든 국가 개입을 거부합니다"
  - "리버테리언은 자유를 경제 문제에만 집중시키는 반면, 중도주의자는 사회적·문화적 영역 전반에 자유를 폭넓게 적용합니다"
  - "리버테리언과 중도주의자는 자유에 대해 같은 견해를 공유하지만, 그것을 집행하는 데 필요한 정부 규모에 대해서만 의견이 다릅니다"
explanation: >-
  리버테리언은 자유를 공리처럼 기능하는 일반적이고 무조건적인 원칙으로 정의합니다. 반대로 중도주의자는 어떤 일반 원칙도 적용하지 않은 채 특정 자유들을 기회주의적이고 맥락적인 방식으로 옹호합니다. 중도주의적 접근은 자유에 대한 도구적 관념을 드러내며, 자유를 항상 효율성 같은 실용적 목표에 종속시키는데, 리버테리언은 이를 근본적으로 거부합니다.
