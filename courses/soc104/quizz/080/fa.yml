question: "سازه‌گرایی به‌عنوان یک باور سیاسی مشترک چیست؟"
answer: "این باور که یک دولت مرکزی می‌تواند، به نیروی قانون، نظمی اجتماعی ایجاد کند که برای بیشترین تعداد مردم خوب باشد"
wrong_answers:
  - "این باور که جامعه باید از طریق همکاری داوطلبانهٔ میان افراد و بدون دخالت دولت سازمان یابد"
  - "این باور که فقط بازارهای آزاد می‌توانند توزیع بهینهٔ منابع در جامعه را تعیین کنند"
  - "این باور که اقتدار سیاسی باید از طریق دموکراسی مستقیم به‌طور برابر میان همهٔ شهروندان توزیع شود"
explanation: >-
  سازه‌گرایی میانه‌روها، محافظه‌کاران و سوسیالیست‌ها را حول یک باور مشترک متحد می‌کند: برتری فرایند سیاسی بر فرایند بازار. این باور است که یک دولت مرکزی می‌تواند، به نیروی قانون، نظمی اجتماعی ایجاد کند که برای بیشترین تعداد مردم خوب باشد. این دیدگاه در تقابل مستقیم با دفاع لیبرتارین از نظم خودجوشی قرار دارد که از تعاملات داوطلبانه پدید می‌آید.
reviewed: false
