question: Điều gì đã xảy ra với đồng Zimbabwe vào tháng 4 năm 2009?
answer: Bộ trưởng Bộ Tài chính đã thông báo về việc tạm ngừng sử dụng đồng Zimbabwe và cho phép sử dụng các loại tiền tệ nước ngoài khác nhau trong giao dịch.
wrong_answers:
  - Đồng Zimbabwe sụp đổ hơn 72%.
  - Chính phủ đồng ý bồi thường cho các cựu chiến binh với số tiền tương đương 450 triệu đô la Mỹ.
  - Chính phủ phải chạy máy in tiền.
explanation:
  Vào tháng 4 năm 2009, Bộ trưởng Bộ Tài chính đã thông báo về việc tạm ngừng sử dụng đồng Zimbabwe và cho phép sử dụng các loại tiền tệ nước ngoài khác nhau trong giao dịch.
reviewed: true