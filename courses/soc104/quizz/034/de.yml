question: "Warum kritisierte Rothbard die Sicht der Libertaires auf die menschliche Natur, und welche Alternative schlug er vor?"
answer: "Er warf ihnen eine naive Sicht des 'edlen Wilden' vor und argumentierte, dass die Gesellschaft Privateigentum und gute Anreize nutzen müsse, um eigennütziges Verhalten zu lenken"
wrong_answers:
  - "Er lobte ihr Verständnis menschlicher Kooperation, argumentierte aber, dass ein Minimalstaat weiterhin notwendig sei, um Verträge durchzusetzen"
  - "Er stimmte zu, dass Menschen von Natur aus gut sind, bestand aber darauf, dass nur freie Märkte diese Güte in produktive Tätigkeit lenken könnten"
  - "Er lehnte ihre Betonung individueller Rechte ab und argumentierte stattdessen, dass Gemeinschaften moralische Standards kollektiv definieren sollten"
explanation: >-
  Rothbard kritisierte die Libertaires dafür, eine naive, Rousseau-ähnliche Sicht der menschlichen Natur als von Natur aus gut zu übernehmen. Stattdessen argumentierte er, dass Menschen von Eigeninteresse geleitet werden und dass die Gesellschaft so organisiert sein muss, dass gute Anreize das Verhalten lenken. Dies erfordert die Anerkennung und Garantie von Privateigentum. Den Staat abzuschaffen bedeutet nicht, seine Funktionen abzuschaffen; Polizei und Justiz sollten durch Wettbewerb vom freien Markt verwaltet werden.
reviewed: false
