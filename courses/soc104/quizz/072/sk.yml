question: "Aký konzistentný vzorec odlišuje centristickú metódu od pozícií iných politických rodín naprieč všetkými piatimi ekonomickými debatami (dane, minimálna mzda, zdravotná starostlivosť, životné prostredie, dotácie)?"
answer: "Centristi sa odmietajú zaviazať k pevnému princípu a namiesto toho požadujú empirickú analýzu a odborné hodnotenie na určenie politiky prípad od prípadu, čím je ich prístup inherentne technokratický"
wrong_answers:
  - "Centristi vždy prijímajú strednú pozíciu medzi socialistickým a konzervatívnym postojom a pri každej otázke rozdelia rozdiel rovnakým dielom"
  - "Centristi dôsledne uprednostňujú ekonomický rast pred sociálnym blahobytom, vo fiškálnej politike sa prikláňajú k libertariánom a v regulácii súhlasia so socialistami"
  - "Centristi prenechávajú všetky ekonomické rozhodnutia medzinárodným organizáciám a obchodným dohodám namiesto tvorby nezávislej národnej politiky"
explanation: >-
  Naprieč všetkými piatimi ekonomickými debatami sa centristický prístup riadi rovnakým vzorcom: namiesto záväzku k pevnému ideologickému princípu centristi požadujú empirické dôkazy a odborné hodnotenie pred prijatím rozhodnutí. Pri daniach musí byť správna úroveň určená analýzou. Pri minimálnej mzde sa úroveň musí pragmaticky upravovať. Pri zdravotnej starostlivosti je ideálom kombinácia kalibrovaná odborníkmi. Pri životnom prostredí musí politika vyvažovať konkurencieschopnosť. Pri dotáciách sa každý prípad musí hodnotiť podľa vlastných zásluh. To robí centrizmus inherentne technokratickým, čo je odlišné od jednoduchého delenia rozdielu alebo podriaďovania sa medzinárodným orgánom.
reviewed: false
