question: "Wie charakterisierte Michael Oakeshott den Konservatismus in seinem philosophischen Werk?"
answer: "Als Temperament und Haltung zum Leben statt als starre systematische Ideologie"
wrong_answers:
  - "Als umfassende Wirtschaftstheorie mit präzisen politischen Vorgaben für jeden Bereich der Regierung"
  - "Als revolutionäre Bewegung, die moderne Institutionen abbauen und zur vorindustriellen Gesellschaft zurückkehren will"
  - "Als rein religiöse Lehre, die in christlicher Theologie und kirchlicher Autorität verankert ist"
explanation: >-
  Michael Oakeshott, ein britischer Philosoph, verteidigte eine Auffassung des Konservatismus als Temperament statt als systematische Ideologie. Sein Essay On Being Conservative (1956) bleibt eine wesentliche Referenz. Diese Sicht des Konservatismus als Haltung beeinflusste auch Friedrich Hayek. Oakeshotts Ansatz ist bemerkenswert für seine Kritik des Rationalismus in der Politik und verwirft die Vorstellung, Politik könne auf ein System reduziert werden.
reviewed: false
