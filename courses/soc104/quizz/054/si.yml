question: "non-aggression principle කියන්නේ කුමක්ද?"
answer: "අන් කෙනෙකුගේ life, liberty, හෝ property ට එරෙහිව violence සිදු නොකරන තාක් පුද්ගලයෙකු තමන් කැමති ලෙස ක්‍රියා කිරීමට නිදහස්ය"
wrong_answers:
  - "social order පවත්වා ගැනීම සඳහා force භාවිත කිරීමට එකම අයිතිය state සතුව ඇත"
  - "individual freedoms සීමා කරන විට පවා citizens majority rule වෙත යටත් විය යුතුය"
  - "ක්‍රියා කිරීමේ freedom ඉඩ දිය යුත්තේ එය සමාජයේ collective good ට benefit කරන විට පමණි"
explanation: >-
  Non-aggression principle යනු libertarian politics හි cornerstone එකක් වන අතර, individuals අන් අයගේ life, liberty, හෝ property ට එරෙහිව violence සිදු නොකරන්නේ නම් freely ක්‍රියා කළ හැකි බව කියයි. එය civilizations පුරා හමුවන golden rule එක සිහිපත් කරයි. අනෙකුත් options වලට වෙනස්ව, එය state ට special moral authority ලබා නොදෙයි, හෝ individual rights collective benefit වෙත යටත් නොකරයි.
reviewed: false
