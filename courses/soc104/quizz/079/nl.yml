question: "Wat is het belangrijkste meningsverschil tussen libertariërs en andere politieke families wanneer zij dezelfde doelstellingen delen?"
answer: "Het meningsverschil gaat over middelen: libertariërs verwerpen dwingende oplossingen en geven de voorkeur aan vrijwillige uitwisseling via het marktproces"
wrong_answers:
  - "Het meningsverschil gaat over doelen: libertariërs streven andere doelen na, zoals individuele rijkdom in plaats van sociaal welzijn"
  - "Het meningsverschil gaat over timing: libertariërs willen dezelfde doelen langzamer bereiken via geleidelijke hervorming"
  - "Het meningsverschil gaat over reikwijdte: libertariërs willen dezelfde beleidsmaatregelen alleen op lokaal in plaats van nationaal niveau toepassen"
explanation: >-
  Libertariërs kunnen het met socialisten, conservatieven en centristen eens zijn over bepaalde doelstellingen, zoals het verdedigen van onderdrukten of het bevorderen van sociale samenhang. Het meningsverschil ligt niet in de doelen, maar in de middelen. Libertariërs verwerpen alle dwingende oplossingen die praktijken en regels willen uniformeren, en verdedigen in plaats daarvan de macht van keuze en verantwoordelijke vrijheid via vrije, gedecentraliseerde uitwisseling gebaseerd op vrijwillige contracten.
reviewed: false
