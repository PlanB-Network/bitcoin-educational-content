question: "우파는 무엇에 대해 입법하려 하나요?"
answer: "도덕과 종교입니다. 이는 전통적 제도와 사회적 위계를 보존하려는 욕구에서 비롯됩니다"
wrong_answers:
  - "경제와 금융 시장입니다. 이는 불평등을 줄이고 부를 재분배하려는 욕구에서 비롯됩니다"
  - "과학과 교육입니다. 이는 공립학교에서 무엇을 가르치는지 통제하려는 욕구에서 비롯됩니다"
  - "국제 무역과 외교입니다. 이는 해외에서 국가 영향력을 확대하려는 욕구에서 비롯됩니다"
explanation: >-
  우파는 개인적 도덕과 전통적 가치를 우선시합니다. 우파는 문명이 보존되어야 할 특정 전통적 제도와 사회적 위계 위에 세워졌다고 보며, 도덕과 종교에 대해 입법하려 합니다. 경제 입법에 초점을 맞추는 것은 우파가 아니라 좌파입니다. 과학, 교육, 무역 정책은 우파에 대해 여기에서 설명하는 주된 초점이 아닙니다.
reviewed: false
