question: 規制対象アセットの送付にAMPの共同署名による認可モデルを使うことで生じる、運用上の重大な弱点は何ですか？
answer: すべての送付にサーバーの共同署名が必要なため、AMPサーバーが利用できなくなると、アセットの流動性が完全に止まってしまう
wrong_answers:
  - 複数の共同署名者が同時に送付を認可しようとすると、取引手数料が指数関数的に増える
  - 共同署名によってブラインディング・ファクターがネットワークの観察者に露出するため、Confidential Transactionsのプライバシーが失われる
  - 共同署名の仕組みによって秘密鍵がAMPサーバーに移されるため、アセットの保有者が資産の管理権を失う
explanation: |
  AMPの認可モデルでは、すべてのアセットの送付にAMPサーバーの共同署名が必要なため、単一障害点が生じます。サーバーがオフラインになるとトランザクションを完了できなくなり、事実上すべてのアセットの流動性が凍結されます。他の選択肢は誤りです。共同署名によって手数料が指数関数的に増えることはなく、Confidential Transactionsのプライバシーは保たれ（見えるようになるのは発行者だけです）、ユーザーは秘密鍵を保持したままで、サーバーは認可のための署名を提供するだけです。