question: Ni iyihe database ikoreshwa muri blocks/index/ mu kubika block metadata?
answer: LevelDB
wrong_answers:
  - SQLite
  - RocksDB
  - Berkeley DB
explanation: |
  Bitcoin Core ikoresha LevelDB muri blocks/index/ kugira ngo itegure (index) blocks, bigafasha kwihutisha gushakisha no gutanga service ku bandi peers.
reviewed: true
