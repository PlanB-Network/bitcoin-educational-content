question: Simplicity의 타입 시스템에서 가변 길이 버퍼는 어떻게 표현되나요?
answer: 중첩된 option 타입의 곱으로, 각 층이 2의 거듭제곱 블록의 존재 여부를 표시합니다.
wrong_answers:
  - 언어에 직접 내장된 특별한 동적 array 타입을 사용합니다.
  - 각 함수 호출마다 더 커지는 재귀 합 타입을 통해 표현합니다.
  - 뒤쪽에 0 값을 채워 넣은 고정 크기 vector로 표현합니다.
explanation: >-
  버퍼는 중첩된 option 타입을 사용합니다. 예를 들어 Xᑉ⁸은
  (1 + X⁴) × ((1 + X²) × (1 + X))로 전개되며, 이를 다항식으로 보면
  1 + X + X² + ... + X⁷이 되어 0개부터 7개까지의 원소 collection을
  나타냅니다. 각 option 층은 2의 거듭제곱 블록이 존재하는지를 표시하여,
  사실상 길이를 이진으로 인코딩합니다.
reviewed: false
