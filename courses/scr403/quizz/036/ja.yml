question: ⟨⟨1,1⟩,1⟩（1+1+1）で全加算器を追跡してください。第 2 段階 O O H ▵ (O I H ▵ I H ⨾ half-adder) は最終段階にどの値を渡しますか？
answer: ⟨1, ⟨0, 1⟩⟩ — 最初の半加算器のキャリー、その後に 2 番目の半加算器のキャリーと和。
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ — 最初の半加算器のキャリー、その後に 2 番目の半加算器の和とキャリー。
  - ⟨0, ⟨0, 1⟩⟩ — 最初の半加算器の和ビット、その後に 2 番目の半加算器のキャリーと和。
  - ⟨1, ⟨1, 1⟩⟩ — 最初の半加算器のキャリー、その後に 2 番目の半加算器の OR ビットと XOR ビット。
explanation: >-
  第 1 段階は half-adder⟨1,1⟩ = ⟨1, 0⟩（キャリー 1、和 0）を計算し、
  キャリー入力を保存して ⟨⟨1,0⟩, 1⟩ を与えます。第 2 段階では、O O H が
  最初のキャリー（1）を取り出し、一方で O I H ▵ I H は ⟨0, 1⟩ — 最初の和と
  キャリー入力 — を 2 番目の半加算器に送り、and(0,1)=0 かつ
  xor(0,1)=1 なので ⟨0, 1⟩ を得ます。最終段階はその後、2 つのキャリーに
  OR を取り、和を保持して ⟨1, 1⟩ を生成します。これは期待通り、2 進数の 3 です。
reviewed: false
