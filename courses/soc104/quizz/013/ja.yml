question: "ノーラン・チャート上で最大限の経済的自由に関連づけられる象徴的な人物は誰ですか？"
answer: "マーガレット・サッチャー、ロナルド・レーガン、ハビエル・ミレイ"
wrong_answers:
  - "フランクリン・D・ルーズベルト、ジャン・ジョレス、バーニー・サンダース"
  - "ネルソン・マンデラ、シモーヌ・ヴェイユ、ノーム・チョムスキー"
  - "ウラジーミル・プーチン、習近平、ジョゼフ・ド・メーストル"
explanation: >-
  サッチャー、レーガン、ミレイは、国家介入の削減、規制の削減、減税を好む、最大限の経済的自由の象徴的な人物として挙げられています。ルーズベルト、ジョレス、サンダースは、経済への国家統制を好む反対側の端を表します。マンデラ、ヴェイユ、チョムスキーは最大限の個人的自由を表します。プーチン、習近平、ド・メーストルは個人生活に対する最大限の国家統制を表します。
reviewed: false
