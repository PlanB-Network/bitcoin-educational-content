question: "Ludwig von Mises का क्या मतलब था जब उन्होंने लिखा कि केवल व्यक्ति ही सोचता है, तर्क करता है और कार्य करता है?"
answer: "कि राज्य या राष्ट्र जैसी सामूहिकताओं का अपने व्यक्तिगत सदस्यों के कार्यों से अलग कोई स्वतंत्र अस्तित्व नहीं होता"
wrong_answers:
  - "कि व्यक्तियों को समूह या संघ बनाने से बचना चाहिए क्योंकि सामूहिक कार्रवाई हमेशा हानिकारक होती है"
  - "कि केवल कुछ प्रतिभाशाली व्यक्ति ही तर्कसंगत विचार करने में सक्षम होते हैं जबकि अधिकांश लोग सहज प्रवृत्ति का अनुसरण करते हैं"
  - "कि सोचना और तर्क करना निजी गतिविधियाँ हैं जिन्हें कभी भी सार्वजनिक रूप से साझा या चर्चा नहीं किया जाना चाहिए"
explanation: >-
  Mises ने स्पष्ट किया कि व्यक्तिवाद इस धारणा का विरोध करता है कि समाज या राष्ट्र जैसी सामाजिक इकाइयाँ उन व्यक्तियों से स्वतंत्र रूप से अस्तित्व रख सकती हैं जो उन्हें बनाते हैं। किसी सामूहिकता का अपने व्यक्तिगत सदस्यों के कार्यों से अलग कोई स्वतंत्र अस्तित्व नहीं होता। हम राज्य या किसी कंपनी की कार्रवाई के बारे में अर्थपूर्ण ढंग से नहीं बोल सकते, क्योंकि इन इकाइयों की अपनी कोई इच्छा या विचार नहीं होता और वे केवल व्यक्तियों के माध्यम से कार्य करती हैं।
