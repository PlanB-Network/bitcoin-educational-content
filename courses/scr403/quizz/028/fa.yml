question: ترکیب شرطی از چه نظر دوگانِ ترکیب موازی است؟
answer: موازی به هر دو عملیات یک ورودی می‌دهد و خروجی‌هایشان را جفت می‌کند (یک حاصل‌ضرب)؛ شرطی یک مجموع از ورودی‌ها می‌گیرد و هر دو شاخه یک نوع خروجی مشترک دارند.
wrong_answers:
  - موازی باید دو عملیات خود را هم‌زمان اجرا کند؛ شرطی آن‌ها را به ترتیب اجرا می‌کند و فقط شاخه‌ای را که برچسب انتخاب می‌کند برمی‌گرداند.
  - هر دو روی یک ورودی مشترک اجرا می‌شوند؛ موازی جفت خروجی را نگه می‌دارد، در حالی که شرطی هر دو شاخه را اجرا می‌کند و شاخه انتخاب‌نشده را دور می‌اندازد.
  - موازی ورودی خود را از پیش تکثیر می‌کند، در حالی که شرطی خروجی خود را پس از آن تکثیر می‌کند، و محل کپی‌کردن را جابه‌جا می‌کند.
explanation: >-
  این دوگانگی یک مبادله حاصل‌ضرب/مجموع است که در آن نوع مشترک جای خود را
  عوض می‌کند: ترکیب موازی به هر دو عملیات نوع ورودی یکسانی می‌دهد
  و خروجی‌های آن‌ها را در یک حاصل‌ضرب جفت می‌کند، در حالی که ترکیب شرطی
  یک مجموع (اجتماع برچسب‌خورده) از دو نوع ورودی می‌گیرد و هر دو شاخه باید
  همان نوع خروجی را تولید کنند. هم‌زمانی بی‌ربط است — مقاله
  تأکید می‌کند که ترکیب موازی ممکن است به صورت ترتیبی پیاده‌سازی شود — و
  ترکیب شرطی دقیقاً یک شاخه را، که با برچسب انتخاب شده، اجرا می‌کند،
  نه اینکه هر دو را اجرا کند و یکی را دور بیندازد.
reviewed: false
