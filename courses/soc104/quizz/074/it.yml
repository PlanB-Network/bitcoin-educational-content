question: "Che cos'è il concetto di 'azzardo morale' nel contesto del dibattito sui sussidi, e quale famiglia politica solleva questa preoccupazione?"
answer: "L'azzardo morale è l'incentivo all'irresponsabilità quando si impedisce alle aziende di fallire tramite sussidi, perché alla fine paga il contribuente; questa preoccupazione è sollevata dai libertari"
wrong_answers:
  - "L'azzardo morale è il rischio che le aziende sovvenzionate si trasferiscano in Paesi con tasse più basse, portando con sé i posti di lavoro; questa preoccupazione è sollevata dai conservatori"
  - "L'azzardo morale è il pericolo che i funzionari governativi diventino corrotti scegliendo quali aziende ricevano sussidi; questa preoccupazione è sollevata dai centristi"
  - "L'azzardo morale è il problema etico delle aziende che sfruttano i lavoratori dopo aver ricevuto fondi pubblici; questa preoccupazione è sollevata dai socialisti"
explanation: >-
  I libertari sostengono che i sussidi e i salvataggi creano azzardo morale: quando si impedisce alle aziende di fallire, si incentivano irresponsabilità e imprudenza perché non ci sono conseguenze per le cattive decisioni. Alla fine, è il contribuente a pagare, cosa che i libertari considerano profondamente ingiusta. Questo concetto è distinto dalle preoccupazioni sulla delocalizzazione delle imprese, sulla corruzione dei funzionari o sullo sfruttamento dei lavoratori sollevate da altre famiglie politiche.
reviewed: false
