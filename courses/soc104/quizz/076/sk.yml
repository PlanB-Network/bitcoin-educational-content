question: "Ktorá postava v dialógoch Gustava de Molinariho z roku 1849 obhajuje slobodu ako základný princíp, namiesto toho, aby ju podriaďovala iným cieľom?"
answer: "Ekonóm, ktorý chápe slobodu ako princíp nepodriadený nijakému inému cieľu"
wrong_answers:
  - "Socialista, ktorý obhajuje slobodu prostredníctvom progresívnych reforiem zameraných na sociálnu rovnosť"
  - "Konzervatívec, ktorý podporuje slobodu zachovávaním tradičného spoločenského poriadku a stability"
  - "Všetky tri postavy obhajujú slobodu rovnako, ale nezhodujú sa v tom, ako ju uskutočniť"
explanation: >-
  V Molinariho dialógoch z diela Les Soirees de la rue Saint-Lazare je ekonóm v trvalom nesúhlase so socialistom aj s konzervatívcom. Je jediný, kto obhajuje slobodu ako základný princíp. Socialista podriaďuje slobodu progresívnym ideálom a konzervatívec ju podriaďuje zachovaniu poriadku, čím je ekonóm jedinečný svojou bezpodmienečnou obhajobou slobody.
reviewed: false
