question: "Wat wil links wetgevend regelen en reguleren?"
answer: "De economie, gedreven door vijandigheid tegenover economische vrijheid, kapitalisme en de vrije markt"
wrong_answers:
  - "Persoonlijke moraliteit en religieuze praktijken, gedreven door de wens om traditionele instellingen te behouden"
  - "Immigratie en nationale grenzen, gedreven door zorgen over culturele identiteit en soevereiniteit"
  - "Technologie en innovatie, gedreven door angst dat automatisering menselijke werknemers vervangt"
explanation: >-
  Links geeft prioriteit aan sociale rechtvaardigheid en gelijkheid, vooral op economisch niveau. Dit leidt tot zijn vijandigheid tegenover economische vrijheid, kapitalisme en de vrije markt, en tot zijn wens om de economie wetgevend te regelen en te reguleren. Rechts wil daarentegen wetgeving maken over moraliteit en religie. Immigratie en technologieregulering zijn niet de primaire focus die hier wordt beschreven.
reviewed: false
