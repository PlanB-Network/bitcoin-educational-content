question: "Karl Marx는 유토피아적 사회주의와 과학적 사회주의를 어떻게 구분했나요?"
answer: "그는 초기 프랑스 사회주의자들이 상상적 해결책을 제안한다고 비난했고, 자신의 과학적 사회주의는 역사적 유물론과 계급투쟁에 기반했습니다"
wrong_answers:
  - "그는 유토피아적 사회주의가 경제에 지나치게 집중한 반면, 과학적 사회주의는 문화적·예술적 변혁을 우선시한다고 주장했습니다"
  - "그는 유토피아적 사회주의자들의 실천적 실험을 칭찬하고, 과학적 사회주의가 너무 추상적이고 이론적이라고 비판했습니다"
  - "그는 유토피아적 사회주의가 폭력적이고 혁명적인 반면, 과학적 사회주의는 평화적 민주 개혁을 선호한다고 주장했습니다"
explanation: >-
  Marx는 Proudhon, Saint-Simon, Fourier 같은 초기 프랑스 사회주의자들이 순전히 상상적인 해결책을 제안한 유토피아주의자라고 비난했습니다. 그의 과학적 사회주의는 역사적 유물론에 기초했습니다. 즉, 역사가 계급투쟁과 생산수단의 전유를 통해 진보하며, 모든 문화적 표상은 생산력과 생산관계에 의해 조건 지어진다는 생각입니다.
