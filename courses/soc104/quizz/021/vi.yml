question: "Chủ nghĩa bảo thủ văn hóa là gì?"
answer: "Sự gắn bó cá nhân với các giá trị gia đình, đạo đức, thẩm mỹ và siêu hình được thừa hưởng từ quá khứ, chứ không phải một triết lý chính trị"
wrong_answers:
  - "Một hệ tư tưởng chính trị sử dụng quyền lực nhà nước để áp đặt các giá trị truyền thống lên toàn xã hội thông qua pháp luật"
  - "Một phong trào bác bỏ mọi hình thức hiện đại và tìm cách đưa xã hội trở lại lối sống tiền công nghiệp"
  - "Một học thuyết kinh tế bảo vệ các ngành công nghiệp quốc gia và phản đối thương mại tự do với nước ngoài"
explanation: >-
  Chủ nghĩa bảo thủ văn hóa được định nghĩa là một sự khôn ngoan trong đời sống: sự gắn bó cá nhân với các giá trị gia đình, đạo đức, thẩm mỹ và siêu hình được thừa hưởng từ quá khứ, dù là Hy-La hay Do Thái-Kitô giáo. Nó rõ ràng không phải là một triết lý chính trị. Nó khác với chủ nghĩa bảo thủ chính trị, vốn nhằm bảo tồn các thiết chế chính trị và trật tự xã hội thông qua quyền lực nhà nước. Nó cũng không nhằm bác bỏ hiện đại hay chủ nghĩa bảo hộ kinh tế.
