question: "Jaki jest fundamentalny argument Hayeka dotyczący tego, dlaczego centralne planowanie zawodzi?"
answer: "Wiedza istnieje tylko jako rozproszone fragmenty posiadane przez odrębne jednostki i nie może zostać skoncentrowana ani zintegrowana przez centralną władzę"
wrong_answers:
  - "Centralni planiści są moralnie skorumpowani i zawsze działają we własnym interesie, a nie w interesie publicznym"
  - "Instytucje demokratyczne reagują zbyt wolno na zmiany gospodarcze, przez co scentralizowane decyzje są zawsze przestarzałe"
  - "Centralne planowanie zawodzi, ponieważ obywatele celowo opierają się nakazom rządu i odmawiają przestrzegania regulacji"
explanation: >-
  Fundamentalny argument Hayeka opiera się na naturze informacji. Wykazał on, że wiedza nigdy nie istnieje w formie skoncentrowanej ani zintegrowanej, lecz tylko jako rozproszone fragmenty posiadane przez wszystkie odrębne jednostki. Wartość jest subiektywna i znana tylko lokalnie oraz niekompletnie. Centralny planista, siedzący w biurze, nie ma wiedzy o prawdziwej cenie rzeczy, ponieważ nie uczestniczy w interakcji i wymianie.
reviewed: false
