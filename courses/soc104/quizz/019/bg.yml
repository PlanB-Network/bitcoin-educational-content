question: "Върху какво иска да законодателства десницата?"
answer: "Върху морала и религията — поради желание да запази традиционните институции и социалните йерархии"
wrong_answers:
  - "Върху икономиката и финансовите пазари — поради желание да намали неравенството и да преразпредели богатството"
  - "Върху науката и образованието — поради желание да контролира какво се преподава в държавните училища"
  - "Върху международната търговия и дипломацията — поради желание да разшири националното влияние в чужбина"
explanation: >-
  Десницата дава приоритет на личния морал и традиционните ценности. Тя смята, че цивилизацията е изградена върху определени традиционни институции и социални йерархии, които трябва да бъдат запазени, и иска да законодателства върху морала и религията. Левицата, а не десницата, се фокусира върху законодателстване върху икономиката. Науката, образованието и търговската политика не са основният фокус, описан за десницата.
