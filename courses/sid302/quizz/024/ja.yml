question: LiquidのAsset Management Platform（AMP）で、トークン化アセットに対する規制上の管理を保ちながら、コンプライアンス上の操作が単一障害点にならないようにしている主な技術的仕組みは何ですか？
answer: 資金の凍結やトークンの再発行といったコンプライアンス上の操作に、複数の当事者の承認を必要とするマルチシグ認可
wrong_answers:
  - コンプライアンスに関するすべての判断と規制の執行を、コミュニティの投票で決められるスマートコントラクトのガバナンストークン
  - あらかじめ決められた待機期間が過ぎると、コンプライアンス上の操作を自動的に実行するタイムロック付きのエスクロー口座
  - コンプライアンス上の操作を実行する前に、バリデーターの過半数の合意を必要とする暗号学的なProof-of-Stakeコンセンサス
explanation: |
  AMPはマルチシグによる管理を用いて、コンプライアンス上の操作に複数の当事者の認可が必要になるようにしており、1人の従業員が独断で操作することを防いでいます。これにより、機関投資家向けのアセットに求められる規制上の監督を保ちながら、慎重さが求められる操作に対して相互チェックの仕組みが働きます。誤った選択肢は、AMPには存在しない仕組みか、規制された金融のコンプライアンスにはふさわしくない仕組みを説明しています。