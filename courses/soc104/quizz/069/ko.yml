question: "마약 합법화에 대한 리버테리언의 입장에는 왜 사회에서 국가의 역할이 축소되어야 한다는 조건이 붙나요?"
answer: "국가가 떠맡는 자유화는 개인 책임을 정부가 관리하는 돌봄으로 대체할 것이기 때문이며, 리버테리언들은 시민들이 사적 결사체의 지원을 받으며 자신의 선택의 결과를 감당하기를 원합니다"
wrong_answers:
  - "국가가 통제하는 합법화는 세수를 지나치게 많이 창출해 정부를 과도하게 강력하고 부패하게 만들 것이기 때문입니다"
  - "국가가 가격을 올리고 암시장을 다시 만들 품질 기준을 부과할 것이기 때문입니다"
  - "정부의 마약 규제가 국제 무역 협정과 외교 관계를 위반할 것이기 때문입니다"
explanation: >-
  리버테리언들은 마약 자유화를 지지하지만 국가의 역할은 축소되어야 한다고 주장합니다. 그들의 목표는 국가 관리를 확대하는 것이 아니라 개인 책임을 회복하는 것이기 때문입니다. 누군가 의존 상태가 된다면, 그는 국가에 돌봄을 요구하기보다 책임을 져야 합니다. 중독에 대한 해결책은 사적 주도에 있습니다. 개인, 가족, 자선 결사체의 자발적 지원입니다. 국가가 관리하는 합법화는 개인 책임이라는 리버테리언의 근본 원칙과 모순될 것입니다.
