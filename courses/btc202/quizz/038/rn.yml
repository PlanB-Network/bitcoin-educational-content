question: Ni kuki HDD idakenewe ku node ya Bitcoin?
answer: Kuko igabanya cane IBD n’ikoreshwa rusangi .
wrong_answers:
  - Kuko idashobora kubika amadosiye ya Blockchain .
  - Kuko ikoresha umuriro muke cane kandi ishobora guturika .
  - Kuko idahuye na Bitcoin core.
explanation: |
  Amadisiki y’ubuhinga aragabanya ubushobozi, ararekura cane IBD, kandi arasaza ningoga iyo afise umuzigo w’ibihimba.
reviewed: true
