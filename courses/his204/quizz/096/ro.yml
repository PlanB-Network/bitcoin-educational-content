question: La care dintre aceste evenimente a luat parte Dupont de Nemours în timpul Revoluției Franceze?
answer: Adunarea Constituantă și redactarea „caietelor de plângeri”
wrong_answers:
  - Redactarea caietelor de plângeri și luarea Bastiliei
  - Luarea Bastiliei și Adunarea Constituantă
  - Fuga regelui și Adunarea Constituantă
explanation: |
  Dupont de Nemours a luat parte la Adunarea Constituantă și la redactarea caietelor de plângeri, jucând un rol important în primele zile ale Revoluției Franceze.
