question: "Popper यह तर्क क्यों देते हैं कि अपने लाभों के बावजूद खुला समाज स्वभावतः नाज़ुक बना रहता है?"
answer: "क्योंकि व्यक्तिवाद जिस जिम्मेदारी को निहित करता है वह भयावह लग सकती है, जिससे सामुदायिक सुरक्षा, प्राधिकरण, या आदर्शीकृत अतीत के मोह में शरण लेने का प्रलोभन पैदा होता है"
wrong_answers:
  - "क्योंकि खुले समाजों में सैन्य शक्ति की कमी होती है और वे बंद समाजों के आक्रमण से स्वयं की रक्षा नहीं कर सकते"
  - "क्योंकि लोकतांत्रिक संस्थाएँ स्वभावतः अप्रभावी होती हैं और अंततः नौकरशाही जटिलता के बोझ तले ढह जाती हैं"
  - "क्योंकि खुले समाज अत्यधिक आर्थिक असमानता की अनुमति देते हैं, जो अनिवार्य रूप से क्रांति और अधिनायकवादी व्यवस्थाओं की स्थापना की ओर ले जाती है"
explanation: >-
  Popper इस बात पर ज़ोर देते हैं कि खुले समाज की नाज़ुकता एक मनोवैज्ञानिक कमज़ोरी से उत्पन्न होती है। व्यक्तिवाद जिस जिम्मेदारी को निहित करता है वह भयावह और जोखिमपूर्ण लग सकती है क्योंकि व्यक्ति को अपने चुनाव स्वयं करने पड़ते हैं और वह असफल हो सकता है। इससे सामुदायिक सुरक्षा में शरण लेने या आदर्शीकृत अतीत की ओर अतीतमुखी प्रवृत्तियों का प्रलोभन पैदा होता है। खुला समाज सामुदायिकतावादी आवेगों और हिंसा के बार-बार लौटने वाले प्रलोभन से निरंतर चुनौतियों का सामना करता है।
reviewed: false
