question: "محاسبهٔ #ᶜ(comp f g) مقدار 128 bytes را هش می‌کند: tag مربوط به comp دو بار، سپس هر دو CMR فرزند. چرا این هنوز حداکثر یک فراخوانی فشرده‌سازی SHA-256 است؟"
answer: نخستین بلوک 64-byte مقدار ثابت tag∥tag است که midstate آن یک‌بار از پیش محاسبه می‌شود؛ فقط بلوکی که CMRهای فرزند را نگه می‌دارد فشرده می‌شود.
wrong_answers:
  - حذفِ صرفِ بلوک نهایی length-padding در SHA-256 باعث می‌شود کل 128 bytes در یک فراخوانی جا شود.
  - دو CMR فرزند با XOR به یک چکیدهٔ 32-byte تبدیل می‌شوند و ورودی را به یک بلوک واحد کوچک می‌کنند.
  - SHA-256-midstate یک گونهٔ بلوک‌عریض است که بلوک‌های پیام 128-byte را در یک گذر جذب می‌کند.
explanation: >-
  تابع فشرده‌سازی SHA-256 بلوک‌های ثابت 64-byte را پردازش می‌کند، پس یک ورودی
  128-byte معمولاً به دو فراخوانی نیاز دارد (به‌علاوهٔ یک فراخوانی دیگر برای
  padding طول در SHA-256 کامل). چون نخستین بلوک هر ترکیب‌گر همان tag∥tag ثابت
  است، midstate آن می‌تواند یک‌بار از پیش محاسبه و کش شود؛ سپس هر عبارت فقط به
  یک فشرده‌سازی تازه از بلوکی نیاز دارد که CMRهای فرزندانش را نگه می‌دارد.
  midstateها بلوک padding نهایی را هم حذف می‌کنند، اما این به‌تنهایی همچنان دو
  فشرده‌سازی باقی می‌گذاشت — midstate ازپیش‌محاسبه‌شدهٔ tag همان چیزی است که آن
  را به حداکثر یک مورد کاهش می‌دهد.
