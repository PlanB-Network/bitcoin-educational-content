question: "Šta levica želi da ozakoni i reguliše?"
answer: "Ekonomiju, zbog neprijateljstva prema ekonomskoj slobodi, kapitalizmu i slobodnom tržištu"
wrong_answers:
  - "Lični moral i verske prakse, zbog želje da se očuvaju tradicionalne institucije"
  - "Imigraciju i nacionalne granice, zbog zabrinutosti oko kulturnog identiteta i suvereniteta"
  - "Tehnologiju i inovacije, zbog strahova da će automatizacija zameniti ljudske radnike"
explanation: >-
  Levica daje prednost socijalnoj pravdi i jednakosti, naročito na ekonomskom nivou. To vodi njenom neprijateljstvu prema ekonomskoj slobodi, kapitalizmu i slobodnom tržištu, kao i njenoj želji da ozakoni i reguliše ekonomiju. Nasuprot tome, desnica želi da donosi zakone o moralu i religiji. Regulacija imigracije i tehnologije nije ovde opisani primarni fokus.
