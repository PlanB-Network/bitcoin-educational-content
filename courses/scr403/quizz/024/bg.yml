question: "Защо bip0340-verify използва ефекта Failure, вместо да връща булева стойност (true/false)?"
answer: За да позволи пакетна верификация на Schnorr подписи, при която една провалена проверка проваля целия пакет.
wrong_answers:
  - Защото булевите типове са твърде скъпи откъм блоково пространство в сравнение с unit типа.
  - Защото типовата система на Simplicity не може да представя булеви връщани стойности, идващи от джетове.
  - Защото връщането на обикновена булева стойност би нарушило директно теоремата за пълнота.
explanation: >-
  Ако bip0340-verify връщаше boolean, провалена проверка на подпис все още би могла да доведе до клон, в който
  скриптът успява. В такъв случай проверяващият би трябвало да знае кой конкретен подпис
  се е провалил, което би попречило на пакетната верификация. Чрез използване на ефекта Failure провалената проверка винаги прекъсва
  цялото изчисление, позволявайки ефективна пакетна верификация, при която много подписи се обединяват заедно.
reviewed: true
