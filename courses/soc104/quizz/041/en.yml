question: "How does socialism treat freedoms differently in the societal and economic spheres?"
answer: "Socialism favors strong freedoms in the societal sphere but weak freedoms in the economic sphere"
wrong_answers:
  - "Socialism restricts all freedoms equally across both the societal and economic spheres"
  - "Socialism favors strong economic freedoms but restricts societal freedoms to maintain social order"
  - "Socialism grants unlimited freedoms in both spheres and relies on voluntary cooperation to maintain balance"
explanation: >-
  In socialist thought, there is a fundamental dichotomy between societal and economic freedoms. Societal freedoms are strong, but economic freedoms are weak due to the emphasis on state control, planning, and wealth redistribution. The third wrong answer describes the libertarian ideal, while the second describes the conservative pattern, which is the mirror image of socialism.
reviewed: false
