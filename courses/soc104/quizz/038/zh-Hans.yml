question: "为什么意向性定义的政治体系对于分析目的而言被认为有问题？"
answer: "它们会制造概念混乱，因为所有体系都声称追求正义、公平和自由等相似目标"
wrong_answers:
  - "它们过于精确和僵硬，无法为政治运动随时间自然演化留下空间"
  - "它们过度关注经济结果，而忽视政治生活的文化和社会维度"
  - "它们依赖很少能被独立研究者获得的机密政府文件"
explanation: >-
  意向性定义依赖宣称的动机和目标，但每一种政治体系都声称追求正义、公平和自由。这使得各体系无法彼此区分。相比之下，结构分析根据体系的经验性、可衡量后果以及它们所使用的手段来评估体系，从而揭示超越修辞之外的真实本质。
reviewed: false
