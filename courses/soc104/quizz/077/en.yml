question: "What takes precedence over freedom in the conservative political philosophy?"
answer: "Order and tradition, which must be firmly established before freedom can be valued"
wrong_answers:
  - "Social justice and equality, which must be guaranteed before individuals can be truly free"
  - "Economic efficiency and pragmatic results, which determine when freedom is appropriate"
  - "Individual property rights, which must be protected before any other freedom is granted"
explanation: >-
  For conservatives, order and tradition take precedence over freedom. They argue that too much freedom generates chaos and social disorder, so freedom can only be valued once order has been firmly established. This contrasts with the socialist view that prioritizes justice, or the centrist focus on efficiency.
reviewed: false
