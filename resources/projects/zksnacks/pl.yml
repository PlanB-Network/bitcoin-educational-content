description: |
  "zk" w zkSNACKs oznacza zero wiedzy, co oznacza, że nie gromadzimy i nie możemy gromadzić żadnych danych osobowych użytkowników w naszych produktach.

  zkSNACKs wyłączył swojego koordynatora coinjoin 1 czerwca 2024 r., a jego strona internetowa jest niedostępna. Wasabi Wallet jest nadal rozwijany jako oprogramowanie open source.
  