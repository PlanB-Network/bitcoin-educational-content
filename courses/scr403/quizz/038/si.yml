question: "#ᶜ(comp f g) ගණනය කිරීම bytes 128 hash කරයි: comp tag එක දෙවරක්, ඉන්පසු child CMRs දෙකම. එය තවමත් උපරිම එක SHA-256 compression call එකක් වන්නේ ඇයි?"
answer: පළමු 64-byte block එක constant tag∥tag ය, එහි midstate එක වරක් precompute කර ඇත; child CMRs තබා ඇති block එක පමණක් compress කරයි.
