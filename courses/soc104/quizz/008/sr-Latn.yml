question: "Koja unutrašnja napetost postoji među libertarijancima na Nolanovom dijagramu?"
answer: "Neki žele da potpuno ukinu državu (anarho-kapitalisti), dok drugi preferiraju minimalnu državu koja zadržava osnovne suverene funkcije (minarhisti)"
wrong_answers:
  - "Neki žele snažnu ekonomsku regulaciju, dok drugi preferiraju potpunu deregulaciju svih industrija"
  - "Neki podržavaju demokratske izbore, dok drugi favorizuju nasledni sistem vladavine"
  - "Neki se zalažu za progresivne društvene politike, dok drugi brane strogo tradicionalne moralne vrednosti"
explanation: >-
  Unutar libertarijanske porodice postoji temeljno neslaganje o ulozi države. Anarho-kapitalisti žele da zamene sve državne funkcije privatnim uslugama, dok minarhisti prihvataju minimalnu državu koja zadržava osnovne suverene funkcije poput odbrane i sudova. Obe grupe dele libertarijanski vrh, ali se razlikuju u tome da li bilo kakva država uopšte treba da postoji.
