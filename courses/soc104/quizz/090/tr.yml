question: "Popper, avantajlarına rağmen açık toplumun neden içsel olarak kırılgan kaldığını savunur?"
answer: "Çünkü bireyciliğin ima ettiği sorumluluk korkutucu görünebilir; bu da topluluk korumasına, otoriteye ya da idealize edilmiş bir geçmişe duyulan nostaljiye sığınma ayartısı yaratır"
wrong_answers:
  - "Çünkü açık toplumlar askeri güçten yoksundur ve kapalı toplumların istilasına karşı kendilerini savunamaz"
  - "Çünkü demokratik kurumlar doğası gereği verimsizdir ve sonunda bürokratik karmaşıklığın ağırlığı altında çöker"
  - "Çünkü açık toplumlar çok fazla ekonomik eşitsizliğe izin verir; bu da kaçınılmaz olarak devrime ve otoriter rejimlerin kurulmasına yol açar"
explanation: >-
  Popper, açık toplumun kırılganlığının psikolojik bir savunmasızlıktan kaynaklandığını vurgular. Bireyciliğin ima ettiği sorumluluk korkutucu ve riskli görünebilir; çünkü kişi kendi seçimlerini yapmak zorundadır ve başarısız olabilir. Bu, topluluk korumasına ya da idealize edilmiş bir geçmişe yönelik nostaljik eğilimlere sığınma ayartısı yaratır. Açık toplum, komünitaryen dürtülerden ve tekrar eden şiddet ayartısından gelen sürekli meydan okumalarla karşı karşıyadır.
