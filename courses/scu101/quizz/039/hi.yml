question: एक अच्छे पासवर्ड की क्या विशेषताएं होती हैं?
answer: लंबा, जटिल, अनोखा, और व्यक्तिगत जानकारी पर आधारित नहीं होता।
wrong_answers:
  - छोटा, सरल, और याद रखने में आसान।
  - जन्म तिथि और नाम जैसी व्यक्तिगत जानकारी पर आधारित।
  - सभी खातों के लिए एक ही पासवर्ड।
explanation: |
  एक अच्छा पासवर्ड लंबा होता है (कम से कम 12 अक्षर), 
  जटिल होता है (अपरकेस और लोअरकेस अक्षरों, संख्याओं और प्रतीकों का मिश्रण)
  अद्वितीय होता है (अलग-अलग खातों के लिए दोबारा इस्तेमाल नहीं किया जाता), 
  और व्यक्तिगत जानकारी पर आधारित नहीं होता।
reviewed: true
