question: "What fundamental division separated socialists from the early twentieth century onward?"
answer: "Revolutionary socialists who sought to seize power through violence versus reformist socialists who pursued change through democratic elections"
wrong_answers:
  - "Urban socialists who focused on industrial workers versus rural socialists who organized agricultural communes"
  - "Nationalist socialists who prioritized their own country versus internationalist socialists who advocated global revolution"
  - "Intellectual socialists who wrote theoretical texts versus activist socialists who organized labor strikes"
explanation: >-
  From the early twentieth century, a fundamental division separated revolutionary socialists, who opposed property rights and sought to destroy capitalist society through violence or the dictatorship of the proletariat, from reformist socialists, who pursued social justice through democratic elections and taxation while temporarily accepting capitalism. This split shaped the entire subsequent history of socialist movements.
