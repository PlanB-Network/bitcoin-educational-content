question: "Miten Ron Paul havainnollisti paleolibertaristista kantaa huumeiden käytön ja abortin kaltaisissa kysymyksissä?"
answer: "Hän neuvoi henkilökohtaisesti huumeiden käyttöä vastaan ja vastusti aborttia, mutta poliittisesti taisteli liittovaltion kieltoa vastaan ja katsoi, että valinnat tulisi jättää yksilöille tai osavaltioille"
wrong_answers:
  - "Hän kannatti kaikkien huumeiden ja abortin liittovaltiotason laillistamista ehdottomien yksilönoikeuksien kysymyksenä"
  - "Hän kampanjoi tiukkojen liittovaltiotason kieltojen puolesta sekä huumeille että abortille henkilökohtaisten moraalisten vakaumustensa perusteella"
  - "Hän kieltäytyi ilmaisemasta henkilökohtaista mielipidettä näistä kysymyksistä ja väitti, että poliitikkojen tulisi pysyä moraalisesti neutraaleina"
explanation: >-
  Ron Paul on esimerkki paleolibertaristisesta synteesistä, koska hän erottaa henkilökohtaiset moraaliset vakaumukset poliittisesta pakottamisesta. Hän neuvoi aina huumeiden käyttöä vastaan mutta vastusti samalla huumekieltoa. Hän vastusti henkilökohtaisesti aborttia, mutta katsoi, että valinta tulisi jättää osavaltioille eikä pakottaa ylhäältä. Tämä osoittaa, miten voi pitää kiinni vahvoista perinteisistä arvoista ja samalla kieltäytyä käyttämästä liittovaltion pakkovaltaa niiden toimeenpanemiseen.
