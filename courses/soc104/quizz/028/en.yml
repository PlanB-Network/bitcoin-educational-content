question: "What is the concept of 'spontaneous order' as described by Friedrich Hayek?"
answer: "Social rules and norms should emerge from free individual interactions rather than be imposed by authoritarian planning"
wrong_answers:
  - "Markets naturally tend toward monopoly unless the state intervenes to maintain competitive balance"
  - "Democratic elections are the only legitimate mechanism for establishing the laws that govern society"
  - "Economic crises arise spontaneously and require immediate government intervention to restore stability"
explanation: >-
  Hayek's concept of spontaneous order holds that the rules governing society should not be imposed from above by central planning but should emerge from the free play of individual wills, contracts, and voluntary relationships. This is a fundamental axis of libertarian thought. It does not imply markets tend toward monopoly or that crises require government intervention.
reviewed: false
