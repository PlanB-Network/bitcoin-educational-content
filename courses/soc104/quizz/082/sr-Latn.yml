question: "Na šta Kantov moto 'Sapere aude' podstiče ljude?"
answer: "Da se usude da misle za sebe i izađu iz stanja maloletnosti u kojem zavise od usmerenja nadređenog autoriteta"
wrong_answers:
  - "Da stiču akademsko znanje upisivanjem u formalne obrazovne ustanove i dobijanjem diploma"
  - "Da izazovu sve oblike moralnosti i stvore potpuno nove etičke sisteme zasnovane na ličnoj želji"
  - "Da traže mudrost kroz versku pobožnost i potčinjavanje učenjima crkve"
explanation: >-
  Sapere aude, što znači "Usudi se da misliš za sebe", Kant je preuzeo od pesnika Horacija i učinio ga motom prosvetiteljstva. Simbolizuje izlazak iz maloletnosti, stanja u kojem ljudi nisu sposobni da koriste sopstveno razumevanje bez usmerenja nadređene klase ili autoriteta. Kant podstiče emancipaciju i punu odgovornost za sopstveno mišljenje.
