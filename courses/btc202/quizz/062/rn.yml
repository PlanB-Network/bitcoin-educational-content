question: Ni iyihe porogarama ya Umbrel ishobora kugufasha gucunga node yawe ya Lightning ukoresheje Interface iteye imbere?
answer: Ride The Lightning
wrong_answers:
  - BTCPay Lightning
  - Nostr Relay
  - Bitfeed
explanation: | 
Ride The Lightning na ThunderHub zitanga interface yuzuye yo kuri web ifasha gucunga node ya Lightning mu buryo bworoshye kandi bwisumbuye.
reviewed: true
