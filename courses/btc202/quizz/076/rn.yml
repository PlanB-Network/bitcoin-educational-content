question: Ni ikihe gipimo c’ubunini bwa Mempool muri Bitcoin core?
answer: MB 300
wrong_answers:
  - 256 MB
  - 512 MB
  - 1024 MB
explanation: |
Ku buryo busanzwe, Bitcoin Core igabanya Mempool kuri 300 MB. Iyo irenze iyo mipaka, itangira gusohora transactions zifite agaciro kari hasi.
reviewed: true
