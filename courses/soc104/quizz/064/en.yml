question: "How did the economic approaches of Hitler's Germany and Stalin's Soviet Union differ, despite their shared totalitarian methods?"
answer: "Nazi Germany maintained an appearance of private property while subordinating the private sector to state objectives, whereas Stalinism abolished all private ownership and fully planned the economy"
wrong_answers:
  - "Nazi Germany fully nationalized all industries, whereas Stalin's regime allowed limited private enterprise in agriculture"
  - "Nazi Germany promoted free international trade to fund rearmament, whereas Stalinism imposed complete economic isolation"
  - "Nazi Germany relied on voluntary corporate cooperation with the state, whereas Stalinism used only forced labor"
explanation: >-
  Although both regimes used identical political methods (cult of personality, total surveillance, systematic elimination of opposition), their economic models differed in form. Nazi Germany did not formally abolish private property but completely subordinated the private sector to state goals like war and rearmament, imposing economic autarky. Stalinism went further by abolishing all private ownership, implementing five-year plans, and controlling all production and distribution directly.
