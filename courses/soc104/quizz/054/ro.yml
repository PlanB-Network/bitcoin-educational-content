question: "De ce au început liberalii clasici din Statele Unite să se numească 'libertarieni' în secolul al XX-lea?"
answer: "Pentru că 'liberalismul' american fusese acaparat de intervenționismul statal tot mai mare și de statul bunăstării"
wrong_answers:
  - "Pentru că voiau să se distanțeze de tradițiile monarhiste europene"
  - "Pentru că termenul 'liberal' a ajuns să fie asociat cu anarhismul și violența politică"
  - "Pentru că noile acorduri comerciale impuneau o identitate politică distinctă pentru susținătorii pieței libere"
explanation: >-
  În secolul al XX-lea, a avut loc o schimbare fundamentală pe măsură ce principiile laissez-faire au fost abandonate progresiv în favoarea statului bunăstării. "Liberalismul" american a ajuns să însemne ceva foarte diferit de liberalismul clasic, îmbrățișând intervenționismul statal. Liberalii clasici au adoptat termenul "libertarian" pentru a păstra distincția. Această rebranduire nu a avut nimic de-a face cu monarhismul european, violența anarhistă sau acordurile comerciale.
reviewed: false
