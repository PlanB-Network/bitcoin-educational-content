question: LiquidのConfidential Transactionsの仕組みで、ECDH鍵交換が果たす主な目的は何ですか？
answer: 送金者が受取人のブラインディング公開鍵を使ってアセットの金額と種類を暗号化し、同時に検証可能なレンジプルーフを生成できるようにすること
wrong_answers:
  - トランザクションの認可の過程で、AMPサーバーとウォレットのクライアントの間に安全な通信チャネルを確立すること
  - ウォレットとAMPサーバーのインフラの間で、マルチシグのディスクリプター登録に使う共有秘密を作ること
  - 元になる秘密鍵の情報を明かさずに、アセットの所有権を証明する暗号署名を生成すること
explanation: |
  LiquidのConfidential TransactionsにおけるECDH（楕円曲線ディフィー・ヘルマン）鍵交換は、送金者が受取人のブラインディング公開鍵を使ってトランザクションの出力の値を暗号化できるようにすることで、プライバシーを守ったアセットの送付を実現します。これにより、受取人だけが自分のブラインディング秘密鍵で復号できる共有秘密が作られ、同時に、ネットワークのバリデーターが実際の金額を見ずにトランザクションの有効性を検証できるレンジプルーフが生成されます。他の選択肢は、ECDHが通信の安全性、ディスクリプターの登録、所有権の証明といった役割を担うと誤って説明していますが、これらはLiquidのエコシステムの別の暗号メカニズムが担っています。