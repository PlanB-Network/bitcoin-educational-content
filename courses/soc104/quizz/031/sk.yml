question: "Ako socializmus zaobchádza so slobodami odlišne v spoločenskej a ekonomickej sfére?"
answer: "Socializmus uprednostňuje silné slobody v spoločenskej sfére, ale slabé slobody v ekonomickej sfére"
wrong_answers:
  - "Socializmus obmedzuje všetky slobody rovnako v spoločenskej aj ekonomickej sfére"
  - "Socializmus uprednostňuje silné ekonomické slobody, ale obmedzuje spoločenské slobody, aby udržal spoločenský poriadok"
  - "Socializmus poskytuje neobmedzené slobody v oboch sférach a spolieha sa na dobrovoľnú spoluprácu, aby udržal rovnováhu"
explanation: >-
  V socialistickom myslení existuje základná dichotómia medzi spoločenskými a ekonomickými slobodami. Spoločenské slobody sú silné, ale ekonomické slobody sú slabé pre dôraz na štátnu kontrolu, plánovanie a prerozdeľovanie bohatstva. Tretia nesprávna odpoveď opisuje libertariánsky ideál, zatiaľ čo druhá opisuje konzervatívny vzorec, ktorý je zrkadlovým obrazom socializmu.
