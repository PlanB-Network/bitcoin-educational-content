question: Simplicity는 왜 실행 중 동적 메모리 할당을 배제하나요?
answer: 정적 분석을 가능하게 하고 버그와 공격의 전체 범주를 배제하기 위해서입니다.
wrong_answers:
  - Liquid Network가 저수준 메모리 연산을 지원하지 않기 때문입니다.
  - 새로운 스마트 컨트랙트 개발자의 프로그래밍 학습 곡선을 낮추기 위해서입니다.
  - Bitcoin Script 자체에도 동적 메모리 할당이 전혀 없기 때문입니다.
explanation: >-
  Simplicity는 실행 전에 모든 리소스 사용량을 정적으로 결정할 수 있도록
  동적 메모리 할당을 피합니다. 이는 예측 가능한 리소스 한계를 가능하게 하고
  메모리 관리와 관련된 취약점을 제거하는데, 이는 블록체인 검증 맥락에서
  매우 중요합니다.
reviewed: false
