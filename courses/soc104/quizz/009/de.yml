question: "Wo befinden sich die Grünen im Nolan-Diagramm, und warum?"
answer: "Sehr weit unten im Diagramm, weil sie der Ansicht sind, dass das individuelle Interesse nicht Vorrang vor dem kollektiven Interesse des Planeten haben darf"
wrong_answers:
  - "Ganz oben im Diagramm, weil sie persönliche Freiheit und Umweltbewusstsein gleichermaßen priorisieren"
  - "In der Mitte des Diagramms, weil sie Wirtschaftswachstum mit Umweltschutz ausbalancieren"
  - "Ganz rechts, weil sie marktbasierte Lösungen für ökologische Herausforderungen unterstützen"
explanation: >-
  Die Grünen befinden sich im Nolan-Diagramm sehr weit unten, weil sie im Namen des Wohlergehens des Planeten eine starke staatliche Kontrolle über wirtschaftliche und persönliche Entscheidungen befürworten. Sie haben den marxistischen Klassenkampf durch einen Kampf zwischen Mensch und Natur ersetzt und neigen dazu, wirtschaftliche Kontrolle und sogar die Abschaffung von Privateigentum zu verteidigen. Das platziert sie im autoritären Bereich, nicht oben oder in der Mitte.
reviewed: false
