question: Blockstream AMPのブラインディングの仕組みで、トランザクションの有効性を検証できる状態を保ちながら、アセットの金額の暗号化を可能にしている暗号メカニズムは何ですか？
answer: 楕円曲線ディフィー・ヘルマン（ECDH）鍵交換と、暗号化された値を明かさずにトランザクションの有効性を検証するレンジプルーフ
wrong_answers:
  - 計算の正しさを証明しながらトランザクションの金額を隠す、コミットメントスキームを用いたゼロ知識SNARK
  - 暗号学的な監査可能性を保ちながら送金者の身元をわかりにくくする、ステルスアドレスを用いたリング署名
  - 暗号化されたトランザクションデータに対して数学的な演算を可能にする、マークルツリーのコミットメントを用いた準同型暗号
explanation: |
  AMPはECDH鍵交換を使っています。送金者は受取人のブラインディング公開鍵を使ってアセットの金額を暗号化し、値を明かさずにトランザクションの有効性を数学的に検証できるレンジプルーフを生成します。これは、SNARK（計算の証明）、リング署名（匿名性が目的）、準同型暗号（暗号化されたデータ上での計算）とは異なります。AMPに必要なのは、秘匿されていながら検証可能なトランザクションです。