question: "Lập trường bảo thủ về nhập cư là gì?"
answer: "Nhà nước có quyền chủ quyền kiểm soát biên giới của mình để bảo vệ an ninh quốc gia và bản sắc văn hóa"
wrong_answers:
  - "Biên giới nên được mở vô điều kiện vì các hạn chế mang tính phân biệt đối xử vi phạm nhân quyền"
  - "Nhập cư nên được quyết định bởi nhu cầu thị trường, trong đó công dân quyết định theo hợp đồng về các mối quan hệ của họ với người nước ngoài"
  - "Chính sách nhập cư nên cân bằng nhu cầu kinh tế với hội nhập thành công dựa trên đánh giá của chuyên gia"
explanation: >-
  Những người bảo thủ cho rằng trật tự, bản sắc và chủ quyền quốc gia phải được ưu tiên hơn việc tiếp nhận không hạn chế người nước ngoài hoặc người tị nạn. Biên giới và một dân cư được xác định rõ là một phần của các giá trị văn minh. Các câu trả lời sai đại diện cho lập trường xã hội chủ nghĩa (biên giới mở như nhân quyền), lập trường tự do cá nhân (nhập cư dựa trên thị trường), và lập trường trung dung (cách tiếp cận cân bằng do chuyên gia dẫn dắt).
reviewed: false
