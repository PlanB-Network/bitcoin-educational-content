question: "Ku jakiej formie rządzenia skłania się centryzm?"
answer: "Ku technokracji, w której władzę powierza się ekspertom sterującym gospodarką i polityką pieniężną"
wrong_answers:
  - "Ku demokracji bezpośredniej, w której obywatele głosują nad każdą ważną decyzją polityczną"
  - "Ku arystokracji, w której władzę sprawuje tradycyjna klasa rządząca"
  - "Ku rządom laissez-faire, w których rynek reguluje się sam bez interwencji państwa"
explanation: >-
  Centryzm uprzywilejowuje efektywność i pragmatyzm oraz skłania się ku technokracji, co oznacza, że władzę należy powierzyć ekspertom sterującym gospodarką i prowadzącym politykę pieniężną. Jest to fundamentalnie odmienne od demokracji bezpośredniej, arystokracji czy laissez-faire, z których każde rozdziela władzę według zupełnie innych zasad.
