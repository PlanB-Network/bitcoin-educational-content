bio: |
  Soy un anatomista humano nigeriano que se convirtió en Bitcoiner. Oí hablar de Bitcoin por primera vez en 2014 y, como era de esperar, en 2017. Mi momento "Ajá" con Bitcoin fue en 2021. Escribiré tutoriales sobre trucos sencillos para la tecnología Bitcoin que a la gente le resulta difícil de usar. Estoy desarrollando Bolta.app, un banco de seguros de Bitcoin.

short_bio: An author of content inside Plan ₿ Network repo
