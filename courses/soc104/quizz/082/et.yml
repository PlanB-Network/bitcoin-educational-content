question: "Milline järgmistest on Hayeki kirjeldatud spontaanse korra näide?"
answer: "Keel, mis arenes orgaaniliselt ajalooliste vastastikmõjude kaudu, mitte intellektuaalide poolt büroos kavandatuna"
wrong_answers:
  - "Riiklik põhiseadus, mille valitud esindajad hoolikalt koostasid ühiskondlike reeglite kehtestamiseks"
  - "Valitsuse stimuleerimiskava, mille majandusteadlased kavandasid majandustegevuse koordineerimiseks"
  - "Avalik haridussüsteem, mille seadusandjad lõid universaalse juurdepääsu tagamiseks teadmistele"
explanation: >-
  Hayek kirjeldab spontaanset korda kui ühiskonna vabade vastastikmõjude saadust, mis tuleneb inimtegevusest, kuid mitte tahtlikust inimlikust kavandamisest. Keel on esmane näide: prantsuse, inglise ja saksa keelt ei konstrueerinud intellektuaalid grammatikareegleid otsustades, vaid need kujunesid ajalooliste vastastikmõjude kaudu üles ehitatud aeglase, orgaanilise korralduse viljana.
reviewed: false
