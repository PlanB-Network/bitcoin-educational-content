question: "Welcher wiederkehrende analytische Rahmen prägt über die fünf gesellschaftlichen Debatten hinweg (Ehe, Einwanderung, Schusswaffen, Drogen, zuckerhaltige Getränke) die sozialistische Position zu jeder Frage?"
answer: "Ein Konfliktrahmen zwischen Herrschenden und Beherrschten, in dem die Gesellschaft durch Unterdrückung strukturiert ist und der Staat eingreifen muss, um die verletzliche Gruppe zu schützen"
wrong_answers:
  - "Ein utilitaristischer Rahmen, der darauf ausgerichtet ist, das allgemeine Glück und die wirtschaftliche Produktivität für die größtmögliche Zahl von Bürgern zu maximieren"
  - "Ein Naturrechtsrahmen, in dem individuelle Freiheiten sowohl vor staatlicher als auch vor unternehmerischer Einmischung geschützt werden müssen"
  - "Ein traditionalistischer Rahmen, in dem etablierte soziale Institutionen gegen störende moderne Veränderungen bewahrt werden müssen"
explanation: >-
  Die sozialistische Position in gesellschaftlichen Debatten wird durchgängig von einem Konfliktrahmen Herrschende/Beherrschte geprägt. Bei der Ehe ist es die heterosexuelle Mehrheit, die eine homosexuelle Minderheit unterdrückt. Bei der Einwanderung sind auf Nationalität beruhende Beschränkungen Formen der Unterdrückung. Bei Schusswaffen sollte nur der Staat Gewalt besitzen, um die Verletzlichen zu schützen. Bei zuckerhaltigen Getränken profitieren Industrielle von der Verwundbarkeit der am wenigsten Geschützten. Diese Unterdrücker/Unterdrückte-Perspektive reproduziert sich in zahlreichen Bereichen, darunter Geschlecht, Rasse und sogar die Beziehung zwischen Menschheit und Natur.
reviewed: false
