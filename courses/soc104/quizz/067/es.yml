question: "¿Cuál es la postura conservadora sobre la inmigración?"
answer: "El Estado tiene el derecho soberano de controlar sus fronteras para proteger la seguridad nacional y la identidad cultural"
wrong_answers:
  - "Las fronteras deberían estar abiertas incondicionalmente porque las restricciones discriminatorias violan los derechos humanos"
  - "La inmigración debería determinarse por la demanda del mercado, con los ciudadanos decidiendo contractualmente sus relaciones con los extranjeros"
  - "La política migratoria debería equilibrar las necesidades económicas con una integración exitosa basada en la evaluación de expertos"
explanation: >-
  Los conservadores sostienen que el orden, la identidad y la soberanía nacional deben tener prioridad sobre la acogida irrestricta de extranjeros o refugiados. Las fronteras y una población bien definida forman parte de los valores civilizados. Las respuestas incorrectas representan la postura socialista (fronteras abiertas como derechos humanos), la postura libertaria (inmigración basada en el mercado) y la postura centrista (enfoque equilibrado guiado por expertos).
