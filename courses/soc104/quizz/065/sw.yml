question: "Msimamo wa kilibertaria kuhusu suala la ndoa za watu wa jinsia moja ni upi?"
answer: "Dola haina kazi ya kufafanua ndoa; inapaswa kubinafsishwa na kuachiwa watu binafsi, vyama, na taasisi za kidini"
wrong_answers:
  - "Ndoa za watu wa jinsia moja zinapaswa kuhalalishwa kwa sababu raia wote wanastahili kutendewa sawa chini ya sheria"
  - "Ndoa za watu wa jinsia moja zinapaswa kupigwa marufuku kwa sababu ndoa ya jadi ni taasisi ya msingi kwa ajili ya uzazi"
  - "Ndoa za watu wa jinsia moja zinapaswa kuhalalishwa lakini kupitia tu mfumo tofauti wa kisheria ulio tofauti na ndoa ya jadi"
explanation: >-
  Walibertaria husema kwamba swali la ndoa limewekwa katika fremu isiyo sahihi kimsingi kwa sababu linaulizwa kwa masharti ya kidola. Wanaamini dola haina kazi ya kuingilia maisha binafsi, kwa hiyo suluhisho ni kuitenganisha ndoa na dola kabisa. Kwa kulazimisha ufafanuzi mmoja, dola huunda migogoro. Jibu la kwanza lisilo sahihi linaonyesha msimamo wa kijamaa au wa kati, na la pili linaonyesha msimamo wa kihafidhina.
