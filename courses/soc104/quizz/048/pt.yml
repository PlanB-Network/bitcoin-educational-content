question: "O que distingue os neoconservadores dos paleoconservadores em sua abordagem à política externa?"
answer: "Os neoconservadores justificam o intervencionismo militar para espalhar a democracia, enquanto os paleoconservadores defendem uma política externa mais isolacionista"
wrong_answers:
  - "Os neoconservadores se opõem a toda ação militar e favorecem a diplomacia, enquanto os paleoconservadores apoiam ataques preventivos contra ameaças potenciais"
  - "Os neoconservadores se concentram exclusivamente em sanções econômicas, enquanto os paleoconservadores defendem a construção de coalizões internacionais para operações militares conjuntas"
  - "Neoconservadores e paleoconservadores concordam sobre política externa, mas divergem fortemente sobre a regulação econômica doméstica"
explanation: >-
  A partir dos anos 2000, os neoconservadores se envolveram cada vez mais na justificação do intervencionismo militar para implantar a democracia pelo mundo, particularmente após 11 de setembro de 2001. Em reação, conservadores tradicionais reivindicaram o rótulo de 'paleoconservador' para se distinguir. Os paleoconservadores criticam o intervencionismo militar, defendem uma política externa mais isolacionista e dão maior ênfase à identidade nacional e cultural.
