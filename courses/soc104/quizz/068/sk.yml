question: "Aký je v otázke regulácie strelných zbraní kľúčový rozdiel medzi konzervatívnou a libertariánskou pozíciou?"
answer: "Obe akceptujú určitú reguláciu, ale konzervatívci chcú pravidlá od legitímnej verejnej autority, zatiaľ čo libertariáni chcú, aby pravidlá vznikali od tých, ktorých sa priamo týkajú, napríklad od občianskych združení a trhovej konkurencie"
wrong_answers:
  - "Konzervatívci odmietajú akúkoľvek reguláciu strelných zbraní, zatiaľ čo libertariáni akceptujú prísnu vládnu kontrolu pre verejnú bezpečnosť"
  - "Konzervatívci chcú úplne zakázať strelné zbrane, zatiaľ čo libertariáni podporujú neobmedzený prístup ku všetkým zbraniam"
  - "Konzervatívci zakladajú svoju pozíciu na individuálnych právach, zatiaľ čo libertariáni ju zakladajú na kolektívnej zodpovednosti"
explanation: >-
  Konzervatívci aj libertariáni súhlasia, že určitá forma regulácie nosenia zbraní je nevyhnutná. Kľúčový rozdiel spočíva v tom, kto tieto pravidlá stanovuje. Konzervatívci trvajú na tom, že regulácie musia pochádzať od verejnej autority poverenej ochranou spoločného dobra (zhora nadol). Libertariáni tvrdia, že regulácia by mala vychádzať od tých, ktorých sa priamo týka: bezpečnostných profesionálov, občianskych združení a trhovej konkurencie (zdola nahor).
