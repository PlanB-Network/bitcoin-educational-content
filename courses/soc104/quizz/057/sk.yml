question: "K akej forme vládnutia má centrizmus sklon?"
answer: "K technokracii, v ktorej je moc zverená odborníkom, ktorí riadia ekonomiku a menovú politiku"
wrong_answers:
  - "K priamej demokracii, v ktorej občania hlasujú o každom významnom politickom rozhodnutí"
  - "K aristokracii, v ktorej moc drží tradičná vládnuca trieda"
  - "K vládnutiu laissez-faire, v ktorom sa trh reguluje sám bez štátnych zásahov"
explanation: >-
  Centrizmus uprednostňuje efektívnosť, pragmatizmus a má sklon k technokracii, čo znamená, že moc má byť zverená odborníkom, ktorí riadia ekonomiku a usmerňujú menovú politiku. To sa zásadne líši od priamej demokracie, aristokracie alebo laissez-faire, pričom každá z týchto foriem rozdeľuje moc podľa úplne odlišných princípov.
