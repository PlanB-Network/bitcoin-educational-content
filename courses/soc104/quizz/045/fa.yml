question: "Green New Deal چگونه نمایانگر تحول معاصر سوسیالیسم دموکراتیک است؟"
answer: "از دغدغه‌های زیست‌محیطی به‌عنوان توجیهی تازه برای مداخله دولت و مصادره درآمد خصوصی استفاده می‌کند و منفعت فردی را تابع سلامت جمعی سیاره می‌سازد"
wrong_answers:
  - "اقتصاد سنتی سوسیالیستی را کاملاً به نفع راه‌حل‌های بازار آزاد برای مشکلات زیست‌محیطی از طریق تجارت کربن کنار می‌گذارد"
  - "مداخله دولت را رد می‌کند و در عوض برای مقابله با تغییرات اقلیمی بر اقدام داوطلبانه فردی و نوآوری بخش خصوصی تکیه دارد"
  - "با اولویت دادن به حفاظت از محیط زیست بر همه دغدغه‌های عدالت اجتماعی و اشتغال، گسستی از سوسیالیسم را نشان می‌دهد"
explanation: >-
  Green New Deal دغدغه‌های زیست‌محیطی را با اهداف اجتماعی درهم می‌آمیزد و گذار بوم‌شناختی را با عدالت اجتماعی، تضمین اشتغال و خدمات عمومی تقویت‌شده ترکیب می‌کند. منفعت فردی تابع منفعت جمعی‌ای می‌شود که با سلامت سیاره تعریف شده است. در هسته خود، این طرح پوششی بلاغی تازه فراهم می‌کند که مداخله دولت و مصادره درآمد خصوصی را توجیه می‌کند؛ دیگر نه فقط به نام عدالت اجتماعی، بلکه به نام محیط زیست نیز.
reviewed: false
