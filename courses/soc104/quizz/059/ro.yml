question: "Care este distincția importantă dintre a fi pro-business și a fi pro-piață?"
answer: "A fi pro-business înseamnă a favoriza o alianță între marile întreprinderi și stat, în timp ce a fi pro-piață înseamnă a susține concurența liberă fără favoritism din partea statului"
wrong_answers:
  - "A fi pro-business înseamnă a susține micile afaceri, în timp ce a fi pro-piață înseamnă a susține corporațiile multinaționale"
  - "A fi pro-business înseamnă a te opune complet reglementării, în timp ce a fi pro-piață înseamnă a accepta reglementarea moderată"
  - "A fi pro-business se concentrează pe industria internă, în timp ce a fi pro-piață se concentrează pe comerțul internațional"
explanation: >-
  Centriștii tind să fie pro-business, ceea ce înseamnă că favorizează un fel de alianță între marile întreprinderi și stat, lucru care diferă de a fi pro-piață. A fi pro-piață susține concurența liberă fără favoritism din partea statului sau protecționism corporatist. Această distincție este crucială deoarece politicile pro-business pot crea monopoluri și protecții de reglementare care subminează de fapt concurența pe piața liberă.
reviewed: false
