question: "What is the fundamental problem with fiat currencies that Satoshi Nakamoto identified?"
answer: "They require trust in the central bank not to devalue the currency, but the history of fiat currencies is full of violations of this trust"
wrong_answers:
  - "They are too difficult to use for everyday transactions because physical cash wears out quickly and is expensive to produce"
  - "They cannot be transferred internationally because each country has incompatible monetary standards and regulations"
  - "They are backed by gold reserves that are insufficient to cover the total money supply in circulation"
explanation: >-
  Satoshi Nakamoto stated that the fundamental problem with conventional currencies is the trust required for them to work. Fiat currencies are not backed by a commodity but rest entirely on institutional authority. When an institution holds total control over money, the temptation to abuse is too strong, and history has shown this repeatedly through currency devaluation.
reviewed: false
