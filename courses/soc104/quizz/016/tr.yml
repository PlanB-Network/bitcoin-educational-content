question: "Sol ne konuda yasa yapmak ve düzenleme getirmek ister?"
answer: "Ekonomik özgürlüğe, kapitalizme ve serbest piyasaya yönelik düşmanlıktan hareketle ekonomiyi"
wrong_answers:
  - "Geleneksel kurumları koruma arzusundan hareketle kişisel ahlakı ve dini uygulamaları"
  - "Kültürel kimlik ve egemenlik konusundaki kaygılardan hareketle göçü ve ulusal sınırları"
  - "Otomasyonun insan çalışanların yerini alacağına dair korkulardan hareketle teknolojiyi ve inovasyonu"
explanation: >-
  Sol, özellikle ekonomik düzeyde sosyal adalete ve eşitliğe öncelik verir. Bu, ekonomik özgürlüğe, kapitalizme ve serbest piyasaya yönelik düşmanlığına ve ekonomi konusunda yasa yapıp onu düzenleme arzusuna yol açar. Buna karşılık sağ, ahlak ve din konusunda yasa yapmak ister. Göç ve teknoloji düzenlemesi burada açıklanan birincil odak değildir.
