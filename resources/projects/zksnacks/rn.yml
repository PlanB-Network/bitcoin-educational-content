description: |
  “zk” iri muri zkSNACKs ihagarariye ubumenyi zero, bisobanura ko tutashobora kandi tutashobora kwegeranya amakuru y’umuntu ku giti ciwe y’abakoresha mu bicuruzwa vyacu.

  zkSNACKs yarahagaritse umuhuza wayo wa coinjoin kw'igenekerezo rya 1 Ruheshi 2024, kandi urubuga rwayo ntirugikora. Wasabi Wallet irabandanya nka porogarama y'inkomoko yuguruye.
  