question: نوع واحد (𝟙) چیست و چرا با وجود اینکه هیچ اطلاعاتی حمل نمی‌کند مفید است؟
answer: یک مقدار (تاپل خالی) را نگه می‌دارد و پایه همه نوع‌های دیگر است.
wrong_answers:
  - عدد 1 را نمایش می‌دهد و مستقیماً برای عملیات حسابی استفاده می‌شود.
  - یک نوع اشکال‌زدایی ویژه است که رد اجرا را در یک فایل ثبت می‌کند.
  - دقیقاً یک بیت داده را ذخیره می‌کند که برای عملیات بولی استفاده می‌شود.
explanation: >-
  نوع واحد 𝟙 دقیقاً یک مقدار دارد — تاپل خالی ⟨⟩. هرچند صفر بیت اطلاعات
  حمل می‌کند، اما به‌عنوان بذری که نوع‌های جمعی و ضربی از آن همه نوع‌های
  داده مفید را می‌سازند ضروری است. برای مثال، نوع بولی 𝟚 برابر 𝟙 + 𝟙 است
  و کاملاً از نوع‌های واحد ساخته شده است.
reviewed: false
