question: "Ron Paul 如何用毒品使用和堕胎等议题说明 paleo-libertarian 立场？"
answer: "他个人建议不要使用毒品并反对堕胎，但在政治上反对联邦禁令，并主张选择应留给个人或各州"
wrong_answers:
  - "他支持以绝对个人权利的名义在联邦层面使所有毒品和堕胎合法化"
  - "他基于个人道德信念，主张对毒品和堕胎实施严格联邦禁令"
  - "他拒绝对这些议题表达任何个人意见，认为政治家应保持道德中立"
explanation: >-
  Ron Paul 通过区分个人道德信念与政治强制，体现了 paleo-libertarian 的综合。他一直建议不要使用毒品，但同时反对禁毒。他个人反对堕胎，却主张这一选择应留给各联邦州，而不是由上而下强加。这说明一个人可以持有强烈的传统价值观，同时拒绝使用联邦政府的强制权力来执行这些价值观。
reviewed: false
