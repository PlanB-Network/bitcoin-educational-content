question: "Какое предупреждение Милтон Фридман дал о том, как судить о политических мерах?"
answer: "О политических мерах следует судить по их результатам, а не по их намерениям"
wrong_answers:
  - "О политических мерах следует судить по моральному характеру политиков, которые их предлагают"
  - "О политических мерах следует судить по тому, насколько они популярны среди широкой голосующей публики"
  - "О политических мерах следует судить по тому, соответствуют ли они первоначальной конституции страны"
explanation: >-
  Фридман писал, что одна из крупнейших ошибок — судить о мерах по их намерениям, а не по их результатам, отмечая, что программы, объявленные предназначенными для бедных, почти всегда производят эффекты, противоположные тому, чего хотели их инициаторы. Это перекликается с учением Бастиа о том, что хороший экономист учитывает как краткосрочные, так и долгосрочные последствия для всего населения.
reviewed: false
