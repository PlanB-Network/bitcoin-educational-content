question: "Msimamo wa kati huwa unaelekea aina gani ya utawala?"
answer: "Teknokrasia, ambapo mamlaka hukabidhiwa kwa wataalamu wanaoongoza uchumi na sera ya fedha"
wrong_answers:
  - "Demokrasia ya moja kwa moja, ambapo raia hupiga kura kuhusu kila uamuzi mkuu wa kisera"
  - "Aristokrasia, ambapo mamlaka hushikiliwa na tabaka la jadi linalotawala"
  - "Utawala wa laissez-faire, ambapo soko hujidhibiti bila uingiliaji wa serikali"
explanation: >-
  Msimamo wa kati huipa kipaumbele ufanisi, pragmatism, na huelekea kwenye teknokrasia, ikimaanisha kwamba mamlaka yanapaswa kukabidhiwa kwa wataalamu wanaoongoza uchumi na kuendesha sera ya fedha. Hii kimsingi ni tofauti na demokrasia ya moja kwa moja, aristokrasia, au laissez-faire, ambapo kila mojawapo husambaza mamlaka kulingana na kanuni tofauti kabisa.
