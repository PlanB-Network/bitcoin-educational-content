question: "Čo je konštruktivizmus ako spoločné politické presvedčenie?"
answer: "Presvedčenie, že centrálna vláda môže silou zákona vytvoriť spoločenský poriadok, ktorý je dobrý pre čo najväčší počet ľudí"
wrong_answers:
  - "Presvedčenie, že spoločnosť by mala byť organizovaná prostredníctvom dobrovoľnej spolupráce medzi jednotlivcami bez zásahov štátu"
  - "Presvedčenie, že iba slobodné trhy môžu určiť optimálne rozdelenie zdrojov v spoločnosti"
  - "Presvedčenie, že politická autorita by mala byť rovnomerne rozdelená medzi všetkých občanov prostredníctvom priamej demokracie"
explanation: >-
  Konštruktivizmus spája centristov, konzervatívcov a socialistov okolo spoločného presvedčenia: nadradenosti politického procesu nad trhovým procesom. Je to presvedčenie, že centrálna vláda môže silou zákona vytvoriť spoločenský poriadok dobrý pre čo najväčší počet ľudí. To stojí v priamom protiklade k libertariánskej obhajobe spontánneho poriadku vznikajúceho z dobrovoľných interakcií.
