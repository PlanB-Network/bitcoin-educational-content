question: "Onde os Verdes se situam no diagrama de Nolan, e por quê?"
answer: "Muito abaixo no diagrama, porque consideram que o interesse individual não deve prevalecer sobre o interesse coletivo do planeta"
wrong_answers:
  - "No topo do diagrama, porque priorizam igualmente a liberdade pessoal e a consciência ambiental"
  - "No centro do diagrama, porque equilibram crescimento econômico com proteção ambiental"
  - "Na extrema direita, porque apoiam soluções baseadas no mercado para desafios ambientais"
explanation: >-
  Os Verdes se situam muito abaixo no diagrama de Nolan porque favorecem forte controle estatal sobre decisões econômicas e pessoais em nome do bem-estar planetário. Eles substituíram a luta de classes marxista por uma luta entre o homem e a natureza, e tendem a defender o controle econômico e até mesmo a abolição da propriedade privada. Isso os coloca no setor autoritário, não no topo ou no centro.
