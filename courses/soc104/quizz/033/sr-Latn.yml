question: "Kako se strategije za ukidanje države razlikuju između libertaires i libertarijanaca?"
answer: "Libertaires su istorijski zagovarali nasilno uništenje, dok libertarijanci nastoje da delegitimišu državu kroz obrazovanje i građansku neposlušnost"
wrong_answers:
  - "Libertaires koriste demokratske izbore da razmontiraju državu, dok libertarijanci favorizuju oružanu revoluciju i direktnu akciju"
  - "Libertaires se usredsređuju na izgradnju alternativnih zajednica, dok libertarijanci rade unutar postojećeg političkog sistema kako bi usvojili reforme"
  - "I libertaires i libertarijanci se slažu da je miran protest jedino legitimno sredstvo društvene transformacije"
explanation: >-
  Libertaires su istorijski zagovarali uništenje države i kapitalizma nasiljem, uključujući teror i ciljane napade. Libertarijanci, nasuprot tome, odbacuju agresivno nasilje kao nelegitimno. Njihova strategija počiva na delegitimisanju države kroz argumentaciju, debatu, obrazovanje i građansku neposlušnost. Ovi fundamentalno različiti pristupi promeni odražavaju njihova dublja filozofska neslaganja.
