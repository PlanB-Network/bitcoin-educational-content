question: take 컴비네이터는 무엇을 하나요?
answer: 곱의 왼쪽 원소를 추출하고 오른쪽은 버립니다.
wrong_answers:
  - 합 타입에서 한 원소를 제거하고 태그 비트를 버립니다.
  - 두 개의 별도 연산을 끝에서 끝으로 순차 합성합니다.
  - 새 합 타입을 만들기 위해 값에 왼쪽 태그를 붙여 감쌉니다.
explanation: >-
  take 컴비네이터는 곱 타입을 위한 추출자입니다. 쌍 ⟨a, b⟩에 take f를
  적용하면, b를 버리고 f를 a에 적용합니다. iden과 결합하면, take iden은
  어떤 쌍에서든 첫 번째 원소를 추출합니다.
reviewed: false
