question: Potrivit lui Cantillon, care este principala caracteristică a unui antreprenor?
answer: Acționează în incertitudine
wrong_answers:
  - Deține capital
  - Este un inovator
  - Provine dintr-o familie înstărită
explanation: |
  Cantillon subliniază rolul antreprenorului în fața incertitudinii și a riscului. Antreprenorul este cel care ia decizii într-un mediu incert și își asumă consecințele alegerilor sale.
