question: "Какую фундаментальную проблему фиатных валют выявил Сатоши Накамото?"
answer: "Они требуют доверия к центральному банку в том, что он не обесценит валюту, но история фиатных валют полна нарушений этого доверия"
wrong_answers:
  - "Ими слишком трудно пользоваться для повседневных транзакций, потому что физические наличные быстро изнашиваются и дороги в производстве"
  - "Их нельзя переводить за границу, потому что у каждой страны несовместимые денежные стандарты и правила"
  - "Они обеспечены золотыми резервами, которых недостаточно для покрытия всей денежной массы в обращении"
explanation: >-
  Сатоши Накамото утверждал, что фундаментальная проблема традиционных валют состоит в доверии, необходимом для их работы. Фиатные валюты не обеспечены товаром, а полностью опираются на институциональный авторитет. Когда институт получает полный контроль над деньгами, искушение злоупотребить им слишком велико, и история многократно показывала это через обесценение валют.
