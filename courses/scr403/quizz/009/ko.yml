question: Simplicity에서 논리 AND 연산은 어떻게 동작하나요?
answer: 첫 번째 비트로 분기합니다. false이면 false를 반환하고, 아니면 두 번째 비트를 반환합니다.
wrong_answers:
  - 곱 타입을 사용해 두 불리언 값을 서로 곱합니다.
  - 가능한 네 가지 입력 조합을 모두 담은 lookup table을 사용합니다.
  - XOR 컴비네이터를 적용한 다음 그 결과에 NOT 컴비네이터를 적용합니다.
explanation: >-
  AND는 case (injl unit) (drop iden)으로 정의됩니다. case 컴비네이터는
  첫 번째 비트로 분기합니다. 그것이 false(왼쪽 태그)라면 injl unit이
  두 번째 비트와 무관하게 false를 반환합니다. 그것이 true(오른쪽 태그)라면
  drop iden이 두 번째 비트를 변경하지 않고 반환합니다. 이는 AND 진리표와
  일치합니다.
reviewed: false
