question: "文化的保守主義とは何か？"
answer: "過去から受け継がれた家族的、道徳的、美的、形而上学的価値への個人的な支持であり、政治哲学ではない"
wrong_answers:
  - "国家権力を用いて、立法を通じて伝統的価値を社会全体に押し付ける政治イデオロギー"
  - "あらゆる形態の近代性を拒否し、社会を産業化以前の生活様式へ戻そうとする運動"
  - "国内産業を保護し、外国との自由貿易に反対する経済教義"
explanation: >-
  文化的保守主義は、生の知恵として定義される。
  それは、ギリシア・ローマ的であれユダヤ・キリスト教的であれ、過去から受け継がれた家族的、道徳的、美的、形而上学的価値への個人的な支持である。
  それは明示的に政治哲学ではない。
  国家権力を通じて政治制度と社会秩序を維持しようとする政治的保守主義とは異なる。
  また、近代性の拒否や経済的保護主義を意味するものでもない。
reviewed: false
