question: තම සදාකාලික සාමය සඳහා ව්‍යාපෘතිය සමඟ abbé de Saint-Pierre කුමන දාර්ශනිකයාගේ පූර්වගාමියෙකු ලෙස පෙනී සිටීද?
answer: Emmanuel Kant
wrong_answers:
  - Jeremy Bentham
  - Jean-Jacques Rousseau
  - Baruch Spinoza
explanation: |
  Abbé de Saint-Pierreගේ සදාකාලික සාමය සඳහා ව්‍යාපෘතිය, සාර්වත්‍රික සාමය පිළිබඳ Immanuel Kantගේ අදහස්වල පූර්වගාමියෙකු ලෙස සැලකේ. ජාතීන් අතර සාමය සහතික කළ හැකි ජාත්‍යන්තර සංවිධානයක් නිර්මාණය කිරීම සඳහා චින්තකයන් දෙදෙනාම පෙනී සිටියහ.