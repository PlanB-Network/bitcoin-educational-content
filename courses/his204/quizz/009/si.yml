question: 18 වන සියවසේ මුල් භාගයේ ප්‍රංශයේ තත්ත්වය පිළිබඳ Vaubanගේ අදහස් Tocqueville විනිශ්චය කළේ කෙසේද?
answer: ඔහුගේ අදහස් භයානක වූවත් හොඳින් පදනම් වූ ඒවා විය
wrong_answers:
  - මේවා අතිශයෝක්ති වේ
  - ඔහු අවතක්සේරු වූ පුද්ගලයෙකි
  - ඒවා සම්පූර්ණයෙන්ම අදාළ නොවූ ඒවා විය
explanation: |
  Alexis de Tocqueville, තම "L'Ancien Régime et la Révolution" කෘතියේ, 18 වන සියවසේ ආරම්භයේදී ප්‍රංශයේ ජනතාවගේ දුක්ඛිත තත්ත්වය සහ සමාජ අසමානතා පිළිබඳ Vaubanගේ නිරීක්ෂණවල අදාළත්වය අවධාරණය කළේය. Vauban තත්ත්වය පිළිබඳ යථාර්ථවාදී සහ භයානක චිත්‍රයක් ඇඳ තිබූ බව ඔහුට හැඟුණි.
