question: "ノーラン・チャートの縦軸は、真の政治的問いについて何を明らかにするのか？"
answer: "国家を通じて自分自身の感性を他者に押し付けたいのか、それとも各人が自分で決める自由を持つことを好むのかを明らかにする"
wrong_answers:
  - "民主的統治を支持するのか、それとも一人の指導者による権威主義的支配を好むのかを明らかにする"
  - "進歩的な社会運動に自分を同一化するのか、それとも伝統的な宗教制度に同一化するのかを明らかにする"
  - "主な関心が国家安全保障なのか経済的繁栄なのかを明らかにする"
explanation: >-
  縦軸は真の政治的問いを明らかにする。
  それは、あなたが左派か右派かではなく、自分の価値観に従って社会を形作るために国家がどの程度介入することを望むのかである。
  あなたは自分の感性を他者に押し付けたいのか、それとも各人が自分で決める自由を持つことを好むのか。
  この枠組みは左右の分断を超え、どちらの陣営も同じくらい国家統制主義的になり得ることを示す。
reviewed: false
