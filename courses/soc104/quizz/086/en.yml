question: "What did Ludwig von Mises mean when he wrote that only the individual thinks, reasons, and acts?"
answer: "That collectivities like the state or a nation have no existence of their own beyond the actions of their individual members"
wrong_answers:
  - "That individuals should avoid forming groups or associations because collective action is always harmful"
  - "That only certain gifted individuals are capable of rational thought while most people follow instinct"
  - "That thinking and reasoning are private activities that should never be shared or discussed in public"
explanation: >-
  Mises clarified that individualism opposes the notion that social entities such as society or the nation could exist independently of the individuals who compose them. A collectivity has no existence of its own beyond the actions of its individual members. We cannot meaningfully speak of the action of the state or a company because these entities have no will or thought of their own and act only through individuals.
reviewed: false
