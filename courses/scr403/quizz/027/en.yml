question: "Why are witness values excluded from the Commitment Merkle Root (CMR)?"
answer: "So that addresses can be calculated before knowing witness values, and unexecuted branches can be pruned without revealing their witness data."
wrong_answers:
  - "Because witness values are too large to include in a 256-bit hash."
  - "Because witness values are validated separately by the Failure effect."
  - "Because including witness values would make the CMR non-deterministic."
explanation: >-
  Witness expressions (like signatures) are provided at spending time, not at address creation time.
  Excluding them from the CMR enables two important properties: addresses can be generated before
  the spending transaction exists, and unexecuted conditional branches can be pruned from the
  on-chain data without revealing their associated witness values.
reviewed: true
