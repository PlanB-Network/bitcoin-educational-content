question: "French libertaires (socialist anarchists) private property ගැන විශ්වාස කරන්නේ කුමක්ද?"
answer: "private property සහ capitalism පීඩනයේ මූලාශ්‍ර වන බැවින් ඒවා අහෝසි කළ යුතුය"
wrong_answers:
  - "private property යනු state එකට පෙර පවතින natural right එකක් වන අතර, ඕනෑම වියදමකින් එය ආරක්ෂා කළ යුතුය"
  - "private property state එක මඟින් regulate කළ යුතු නමුත් society එකෙන් කිසි විටෙක සම්පූර්ණයෙන් ඉවත් නොකළ යුතුය"
  - "private property පිළිගත හැක්කේ commune එකක සියලු සාමාජිකයන් අතර සමානව බෙදා හරින විට පමණි"
explanation: >-
  Proudhon සහ Bakunin වැනි thinkers හරහා socialist anarchism හි උරුමකරුවන් වන French libertaires, state එක සහ private property යන දෙකම පීඩනයේ ද්විත්ව මූලාශ්‍ර ලෙස අහෝසි කළ යුතු බව සලකති. මෙය Proudhonගේ ප්‍රසිද්ධ formula එක වන "Property is theft." තුළ අල්ලා ඇත. පළමු වැරදි පිළිතුර libertarian position එක විස්තර කරයි; එය libertaire view එකට මූලිකවම විරුද්ධය.
reviewed: false
