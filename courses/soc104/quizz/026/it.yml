question: "Che cos'è il paleo-libertarianismo?"
answer: "Una sintesi che combina il rifiuto dello stato come fonte di coercizione con il rafforzamento delle istituzioni tradizionali e delle strutture sociali volontarie"
wrong_answers:
  - "Un movimento libertario che rifiuta tutti i valori tradizionali e promuove un progressismo sociale radicale"
  - "Un'ideologia conservatrice che usa il potere dello stato per imporre valori tradizionali pur consentendo una certa libertà economica"
  - "Una filosofia centrista che cerca un compromesso equilibrato tra economia socialista e politica sociale conservatrice"
explanation: >-
  Il paleo-libertarianismo combina il rifiuto dello stato come fonte istituzionale di coercizione con il rafforzamento delle istituzioni tradizionali e una preferenza per le strutture sociali volontarie rispetto all'autorità statale. Si distingue dal neo-libertarianismo perché è più simpatetico verso i valori tradizionali. Il paleo-libertario non si oppone al fatto che le comunità si organizzino attorno a principi socialisti o comunitari; rifiuta solo che tali comunità impongano i propri valori a tutti con la forza della legge.
