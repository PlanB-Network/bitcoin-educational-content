question: "Kubera iki umurongo ibubamfu-iburyo ufatwa nk'udahagije mu gushira abiyumvira vya liberalism ya kera nka Bastiat canke Ron Paul?"
answer: "Kubera ko liberalism ya kera iha agaciro umwidegemvyo w'ubutunzi n'uw'umuntu ku giti ciwe, ivyo ibubamfu canke iburyo bitakira vyose uko bikwiye"
wrong_answers:
  - "Kubera ko abiyumvira vya liberalism ya kera bama bahuza n'amapolitike y'ubutunzi y'iburyo kandi bakanka ivyiyumviro vyose vy'ibubamfu"
  - "Kubera ko abiyumvira vya liberalism ya kera ari abo hagati bafata uburyo buringaniye bw'ivyiyumviro vy'ibubamfu n'ivy'iburyo"
  - "Kubera ko abiyumvira vya liberalism ya kera barwanya uburyo bwose bwa leta, bigatuma baba anarchists aho kuba abiyumvira vya politike"
explanation: >-
  Umurongo ibubamfu-iburyo urananirwa kwerekana neza abiyumvira vya liberalism ya kera kubera ko udashobora kwakira ikibanza kirwanira rimwe umwidegemvyo w'ubutunzi (kenshi ufitanijwe n'iburyo) n'umwidegemvyo w'umuntu ku giti ciwe (kenshi ufitanijwe n'ibubamfu). Abiyumvira vya liberalism ya kera si abantu bo hagati barondera ubwumvikane, kandi si anarchists canke abantu b'iburyo gusa. Ntibashobora gusa gukwirwa ku murongo w'urugero rumwe.
reviewed: false
