question: "Почему предсказание Молинари 1849 года оказалось пророческим в отношении связи между свободой и политической властью?"
answer: "Потому что консерваторы и социалисты чередовались у власти и инструментализировали свободу в служении своим соответствующим политическим целям, именно так, как он описал"
wrong_answers:
  - "Потому что описанный им персонаж-экономист в итоге получил политическую власть и реализовал либертарианские политики по всей Европе"
  - "Потому что его предсказание о том, что все три политические семьи сольются в единое центристское движение, сбылось в двадцатом веке"
  - "Потому что свобода постепенно расширялась сменявшими друг друга правительствами, пока не стала главным организующим принципом современных демократий"
explanation: >-
  Видение Молинари оказалось пророческим, потому что с середины девятнадцатого века консерваторы и социалисты чередовались у власти и осуществляли именно то, что он описал: инструментализацию свободы в служении политическим целям. Обе семьи готовы ограничивать свободы и призывать государство навязывать их соответствующие программы, тогда как позиция экономиста, основанная на безусловной свободе, оставалась маргинализированной.
