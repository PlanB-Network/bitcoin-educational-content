question: Что делает комбинатор 'take'?
answer: Он извлекает левый компонент произведения, отбрасывая правый.
wrong_answers:
  - Он удаляет элемент из суммарного типа, отбрасывая бит метки.
  - Он последовательно соединяет две отдельные операции друг за другом.
  - Он оборачивает значение левой меткой, формируя новый суммарный тип.
explanation: >-
  Комбинатор take — это извлекатель для типов произведений. Если take f
  применяется к паре ⟨a, b⟩, он отбрасывает b и применяет f к a. В
  сочетании с iden, take iden извлекает первый элемент любой пары.
