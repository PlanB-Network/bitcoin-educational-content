question: "为什么自由意志主义者反对税收？"
answer: "因为它是对财产权的道德侵犯，是一种未经同意攫取他人财产的国家盗窃形式"
wrong_answers:
  - "因为税收在经济上低效，并且总会导致更高的失业率"
  - "因为税收抑制外国投资，削弱一个国家的竞争地位"
  - "因为累进税制不公平地针对创造最多就业机会的富裕个人"
explanation: >-
  自由意志主义者对税收的反对首先是道德性的，其次才是经济性的。自由意志主义者把税收视为一种国家盗窃形式和对私有财产的阻碍，因为它是在未经同意的情况下攫取他人财产。虽然可能存在反对税收的经济论证，但自由意志主义者的基础论证建立在税收侵犯财产权这一原则之上，而不是建立在效率或竞争力的计算之上。
reviewed: false
