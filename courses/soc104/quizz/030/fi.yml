question: "Miten Cato Instituten, Mises Instituten ja Libertarian Partyn roolit eroavat libertaristisessa liikkeessä?"
answer: "Cato Institute keskittyy julkisen politiikan ehdotuksiin, Mises Institute koulutukseen ja akateemiseen julkaisemiseen sekä Libertarian Party vaalipolitiikkaan"
wrong_answers:
  - "Cato Institute rahoittaa poliittisia kampanjoita, Mises Institute lobbaa suoraan kongressia ja Libertarian Party järjestää akateemisia konferensseja"
  - "Cato Institute julkaisee taloustieteen oppikirjoja, Mises Institute pyörittää äänestäjärekisteröintikampanjoita ja Libertarian Party laatii lakiesityksiä"
  - "Cato Institute järjestää ruohonjuuritason protesteja, Mises Institute tarjoaa oikeudellista puolustusta libertaristeille ja Libertarian Party hallinnoi ajatushautomoiden tutkimusta"
explanation: >-
  Cato Institute (perustettu 1977) on Washingtonissa sijaitseva ajatushautomo, joka työskentelee julkisen politiikan ehdotusten parissa. Mises Institute (perustettu 1982) keskittyy koulutukseen poliittisen lobbauksen sijaan ja toimii eräänlaisena verkkoyliopistona, jossa on konferensseja ja uudelleenjulkaistuja teoksia. Libertarian Party (perustettu 1971) on Yhdysvaltojen kolmanneksi suurin poliittinen puolue, joka osallistuu vaaleihin, joissa jopa sen noin 2 %:n ääniosuus voi ratkaista lopputuloksen.
