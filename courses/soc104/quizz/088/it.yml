question: "Perché Popper sostiene che la società aperta resti intrinsecamente fragile nonostante i suoi vantaggi?"
answer: "Perché la responsabilità che l'individualismo implica può sembrare spaventosa, creando la tentazione di rifugiarsi nella protezione comunitaria, nell'autorità o nella nostalgia per un passato idealizzato"
wrong_answers:
  - "Perché le società aperte mancano di forza militare e non possono difendersi dall'invasione da parte di società chiuse"
  - "Perché le istituzioni democratiche sono intrinsecamente inefficienti e alla fine collassano sotto il peso della complessità burocratica"
  - "Perché le società aperte consentono troppa disuguaglianza economica, che conduce inevitabilmente alla rivoluzione e all'installazione di regimi autoritari"
explanation: >-
  Popper sottolinea che la fragilità della società aperta deriva da una vulnerabilità psicologica. La responsabilità che l'individualismo implica può sembrare spaventosa e rischiosa perché bisogna fare le proprie scelte e si può fallire. Ciò crea la tentazione di rifugiarsi nella protezione comunitaria o in tendenze nostalgiche verso un passato idealizzato. La società aperta affronta sfide continue provenienti dagli impulsi comunitaristi e dalla tentazione ricorrente della violenza.
