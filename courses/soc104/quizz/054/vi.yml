question: "Nguyên tắc bất xâm phạm phát biểu điều gì?"
answer: "Một người được tự do hành động như mình muốn miễn là không có bạo lực nào được thực hiện chống lại sự sống, tự do hoặc tài sản của người khác"
wrong_answers:
  - "Nhà nước có quyền duy nhất sử dụng vũ lực để duy trì trật tự xã hội"
  - "Công dân phải phục tùng sự cai trị của đa số ngay cả khi nó hạn chế các quyền tự do cá nhân"
  - "Tự do hành động chỉ được cho phép khi nó có lợi cho lợi ích tập thể của xã hội"
explanation: >-
  Nguyên tắc bất xâm phạm là một nền tảng của chính trị libertarian, phát biểu rằng các cá nhân có thể hành động tự do miễn là họ không thực hiện bạo lực chống lại sự sống, tự do hoặc tài sản của người khác. Nó gợi lại luật vàng có trong nhiều nền văn minh. Không giống các lựa chọn khác, nó không trao cho nhà nước thẩm quyền đạo đức đặc biệt hay đặt quyền cá nhân dưới lợi ích tập thể.
