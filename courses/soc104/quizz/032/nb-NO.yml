question: "Hvordan ser libertarianere på forholdet mellom privat eiendom og frihet?"
answer: "Privat eiendom er en naturlig rett som går forut for loven og staten, og er selve grunnlaget for frihet"
wrong_answers:
  - "Privat eiendom er en sosial konvensjon skapt av staten som kan trekkes tilbake når den skaper ulikhet"
  - "Privat eiendom er nyttig for økonomisk effektivitet, men har ingen iboende moralsk eller filosofisk betydning"
  - "Privat eiendom bør bare eksistere for personlige eiendeler, ikke for produktive eiendeler eller land"
explanation: >-
  Libertarianere forsvarer privat eiendom som en naturlig rett som går forut for loven og staten. De argumenterer for at hvis et individ eier sin egen kropp, eier de også sitt arbeid og fruktene av det. Eierskap til materielle goder er en forlengelse av selveierskap. Dette står i skarp kontrast til libertaire-synet om at eiendom er en sosial konvensjon eller en kilde til undertrykkelse.
