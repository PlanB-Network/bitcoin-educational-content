question: Как в системе типов Simplicity представляются буферы переменной длины?
answer: Как вложенные произведения опциональных типов, где каждый слой отмечает блок размером со степень двойки.
wrong_answers:
  - С помощью специального типа динамического массива, встроенного прямо в язык.
  - Через рекурсивные суммарные типы, увеличивающиеся при каждом вызове функции.
  - Как векторы фиксированного размера, дополненные завершающими нулевыми значениями.
explanation: >-
  Буферы используют вложенные опциональные типы. Например, Xᑉ⁸
  раскрывается как (1 + X⁴) × ((1 + X²) × (1 + X)), что в виде многочлена
  даёт 1 + X + X² + ... + X⁷ — представляя коллекции из 0–7 элементов.
  Каждый опциональный слой указывает, присутствует ли блок размером со
  степень двойки, что фактически кодирует длину в двоичном виде.
reviewed: false
