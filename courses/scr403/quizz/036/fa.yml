question: push-<n نوع Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ دارد. چرا خروجی آن باید یک sum باشد که نوع بردار کامل Aⁿ را هم شامل می‌شود؟
answer: یک بافر Aᑉⁿ حداکثر n−1 آیتم نگه می‌دارد، پس push کردن روی یک بافر پر n آیتم می‌دهد — فقط Aⁿ می‌تواند آن را نمایش دهد.
wrong_answers:
  - sum به فراخوان‌ها اجازه می‌دهد کدگذاری ارزان‌تر را انتخاب کنند، چون بردارها فشرده‌تر از productهای option سریال‌سازی می‌شوند.
  - Push می‌تواند روی یک بافر خالی شکست بخورد، و شاخهٔ Aⁿ حالت خطایی است که محتوای قدیمی را حمل می‌کند.
  - case الزام می‌کند هر تابعی که یک بافر با نوع sum مصرف می‌کند، خروجی با نوع sum نیز تولید کند.
explanation: >-
  Aᑉⁿ دقیقاً نوع فهرست‌هایی است که طولشان به‌طور سخت‌گیرانه کمتر از n است،
  بنابراین یک بافر در بیشینهٔ ظرفیت n−1 عنصر دارد. push کردن یک عنصر دیگر دقیقاً
  n عنصر تولید می‌کند، که Aᑉⁿ نمی‌تواند نمایش دهد؛ جمعوند Aⁿ آن نتیجهٔ سرریزکرده
  را به‌صورت یک بردار کامل بازمی‌گرداند. کدگذاری سرریز در نوع خروجی، push-<n را
  به‌جای یک تابع جزئی، یک تابع کل نگه می‌دارد — حالت شکستِ بافر خالی متعلق به
  pop-<n است، نه push.
