question: "Co Ludwig von Mises miał na myśli, gdy pisał, że tylko jednostka myśli, rozumuje i działa?"
answer: "Że zbiorowości takie jak państwo albo naród nie mają własnego istnienia poza działaniami swoich indywidualnych członków"
wrong_answers:
  - "Że jednostki powinny unikać tworzenia grup albo stowarzyszeń, ponieważ działanie zbiorowe jest zawsze szkodliwe"
  - "Że tylko niektóre uzdolnione jednostki są zdolne do racjonalnego myślenia, podczas gdy większość ludzi kieruje się instynktem"
  - "Że myślenie i rozumowanie są czynnościami prywatnymi, które nigdy nie powinny być dzielone ani omawiane publicznie"
explanation: >-
  Mises wyjaśnił, że indywidualizm sprzeciwia się pojęciu, jakoby byty społeczne takie jak społeczeństwo albo naród mogły istnieć niezależnie od jednostek, które je tworzą. Zbiorowość nie ma własnego istnienia poza działaniami swoich indywidualnych członków. Nie możemy sensownie mówić o działaniu państwa albo firmy, ponieważ te byty nie mają własnej woli ani myśli i działają wyłącznie za pośrednictwem jednostek.
reviewed: false
