question: "Mises इस बात पर ज़ोर क्यों देते हैं कि व्यक्तिवाद को आत्मनिर्भरता या मानवद्वेष से भ्रमित नहीं किया जाना चाहिए?"
answer: "क्योंकि व्यक्तिवाद सहयोग और संघ को बढ़ावा देता है, बशर्ते वे प्रतिभागियों की स्वतंत्र सहमति पर आधारित हों, यह मानते हुए कि मनुष्य दूसरों के साथ स्वैच्छिक संबंधों के माध्यम से अपनी पूर्ण क्षमता विकसित करते हैं"
wrong_answers:
  - "क्योंकि व्यक्तिवाद लोगों से अनिवार्य नागरिक संगठनों में शामिल होने की माँग करता है ताकि यह सुनिश्चित हो कि वे सामूहिक भलाई में योगदान दें"
  - "क्योंकि व्यक्तिवाद का अर्थ है कि प्रत्येक व्यक्ति उन सेवाओं के लिए पूरी तरह राज्य पर निर्भर रहे जिन्हें वह स्वयं उपलब्ध नहीं करा सकता"
  - "क्योंकि व्यक्तिवाद मांग करता है कि लोग अपनी व्यक्तिगत श्रेष्ठता साबित करने के लिए सभी क्षेत्रों में एक-दूसरे से प्रतिस्पर्धा करें"
explanation: >-
  Mises इस बात पर ज़ोर देते हैं कि मनुष्य एक सामाजिक प्राणी है। व्यक्तिवाद का अर्थ अलगाव नहीं है। यह सहयोग और संघ को इस शर्त पर बढ़ावा देता है कि वे प्रतिभागियों की स्वतंत्र सहमति पर आधारित हों। मनुष्य अपनी पूर्ण क्षमता केवल दूसरों के साथ संबंध में ही विकसित कर सकता है, लेकिन यह सहयोग सामूहिक प्राधिकरण द्वारा थोपा हुआ नहीं बल्कि स्वैच्छिक होना चाहिए।
reviewed: false
