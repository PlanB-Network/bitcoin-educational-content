question: "다섯 가지 경제 논쟁(세금, 최저임금, 의료, 환경, 보조금) 전반에서, 중도주의자의 방법을 다른 정치 가족들의 입장과 구별하는 일관된 패턴은 무엇인가요?"
answer: "중도주의자들은 고정된 원칙에 헌신하기를 거부하고, 대신 사안별로 정책을 결정하기 위해 경험적 분석과 전문가 평가를 요구하므로 그들의 접근은 본질적으로 기술관료적입니다"
wrong_answers:
  - "중도주의자들은 항상 사회주의자와 보수주의자의 입장 사이에서 중간 입장을 취하며, 모든 쟁점에서 차이를 똑같이 나눕니다"
  - "중도주의자들은 사회 복지보다 경제 성장을 일관되게 우선시하여, 재정 정책에서는 리버테리언 편에 서고 규제에서는 사회주의자들에게 동의합니다"
  - "중도주의자들은 독립적인 국가 정책을 만들기보다 모든 경제 결정을 국제기구와 무역 협정에 맡깁니다"
explanation: >-
  다섯 가지 경제 논쟁 전반에서 중도주의자의 접근은 같은 패턴을 따릅니다. 고정된 이데올로기 원칙에 헌신하기보다, 중도주의자들은 결정을 내리기 전에 경험적 증거와 전문가 평가를 요구합니다. 세금에서는 적정 수준이 분석을 통해 결정되어야 합니다. 최저임금에서는 수준이 실용적으로 조정되어야 합니다. 의료에서는 전문가가 보정한 혼합이 이상적입니다. 환경에서는 정책이 경쟁력과 균형을 맞춰야 합니다. 보조금에서는 각 사례가 그 자체의 장점에 따라 평가되어야 합니다. 이것이 중도주의를 본질적으로 기술관료적으로 만들며, 이는 단순히 차이를 나누거나 국제기구에 맡기는 것과 다릅니다.
