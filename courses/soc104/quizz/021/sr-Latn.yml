question: "Šta je kulturni konzervatizam?"
answer: "Lično pridržavanje porodičnih, moralnih, estetskih i metafizičkih vrednosti nasleđenih iz prošlosti, a ne politička filozofija"
wrong_answers:
  - "Politička ideologija koja koristi državnu moć da zakonodavstvom nametne tradicionalne vrednosti celom društvu"
  - "Pokret koji odbacuje sve oblike modernosti i nastoji da vrati društvo predindustrijskom načinu života"
  - "Ekonomska doktrina koja štiti nacionalne industrije i protivi se slobodnoj trgovini sa stranim zemljama"
explanation: >-
  Kulturni konzervatizam definiše se kao životna mudrost: lično pridržavanje porodičnih, moralnih, estetskih i metafizičkih vrednosti nasleđenih iz prošlosti, bilo grčko-rimskih ili judeo-hrišćanskih. On izričito nije politička filozofija. Razlikuje se od političkog konzervatizma, koji nastoji da očuva političke institucije i društveni poredak kroz državnu moć. Takođe se ne radi o odbacivanju modernosti ili ekonomskom protekcionizmu.
