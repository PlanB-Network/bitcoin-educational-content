question: "Hoe vormen de drie essentiële functies van de vrije markt, zoals beschreven door libertariërs, samen zowel een efficiënt als ethisch systeem van sociale organisatie?"
answer: "Prijzen bieden een kompas voor beslissingen, de markt onthult authentieke voorkeuren via vraag en aanbod, en vrije uitwisseling stelt individuen in staat hun eigen zaken te bepalen volgens persoonlijke waarden, waarbij informationele efficiëntie wordt gecombineerd met morele autonomie"
wrong_answers:
  - "De markt maximaliseert de totale rijkdom, voorkomt monopolies via natuurlijke concurrentie en waarborgt een gelijke verdeling van middelen, waarbij productiviteit wordt gecombineerd met sociale rechtvaardigheid"
  - "Vrije markten verlagen overheidsuitgaven, stimuleren technologische innovatie en creëren werkgelegenheid, waarbij fiscale verantwoordelijkheid wordt gecombineerd met economische groei"
  - "Markten verlagen consumentenprijzen, verhogen productkwaliteit via concurrentie en breiden internationale handel uit, waarbij binnenlandse welvaart wordt gecombineerd met mondiale samenwerking"
explanation: >-
  Het libertarische pleidooi voor de vrije markt berust op drie onderling verbonden functies. Ten eerste dienen prijzen als betrouwbare indicatoren die economische en sociale beslissingen sturen (het kompas). Ten tweede onthult de markt authentieke individuele voorkeuren via vraag en aanbod. Ten derde stelt vrije uitwisseling actoren in staat hun eigen zaken te bepalen volgens persoonlijke waarden. Hayek liet zien dat vrije markten verspreide informatie beter coördineren dan centrale planning (efficiëntie), terwijl wederzijdse instemming de menselijke waardigheid meer respecteert dan dwang (rechtvaardigheid).
