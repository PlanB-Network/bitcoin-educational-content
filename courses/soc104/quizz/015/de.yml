question: "Warum argumentiert das zweidimensionale Modell, dass sich die meisten politischen Fragen in wirtschaftliche und persönliche Kategorien einteilen lassen?"
answer: "Weil wirtschaftliche Fragen betreffen, was du als Produzent und Verbraucher tust, während persönliche Fragen deine privaten Beziehungen, Überzeugungen und körperliche Autonomie betreffen"
wrong_answers:
  - "Weil alle politischen Debatten letztlich auf Meinungsverschiedenheiten über Steuerhöhe und religiöse Praktiken hinauslaufen"
  - "Weil Regierungen historisch nur zwei Dinge regulieren: den Marktplatz und das Militär"
  - "Weil politische Philosophen materielle Anliegen seit der Antike immer von spirituellen Anliegen getrennt haben"
explanation: >-
  Das zweidimensionale Modell beruht auf der Idee, dass politische Fragen in zwei breite Kategorien fallen. Wirtschaftliche Freiheiten umfassen Produktion, Konsum, Handel, Beschäftigung und Geldverwaltung. Persönliche Freiheiten umfassen private Beziehungen, Meinungen, Überzeugungen und Entscheidungen über den eigenen Körper und Geist. Diese Trennung ermöglicht eine weitaus nuanciertere Kartierung politischer Positionen als eine einzige Links-rechts-Achse.
