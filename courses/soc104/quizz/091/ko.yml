question: "Satoshi Nakamoto가 식별한 법정화폐의 근본 문제는 무엇인가요?"
answer: "중앙은행이 통화 가치를 떨어뜨리지 않으리라고 신뢰해야 하지만, 법정화폐의 역사는 이 신뢰를 어긴 사례로 가득하다는 점입니다"
wrong_answers:
  - "실물 현금은 빨리 닳고 생산 비용이 많이 들어 일상 거래에 사용하기 너무 어렵다는 점입니다"
  - "각 나라가 서로 호환되지 않는 통화 표준과 규제를 가지고 있어 국제적으로 이전될 수 없다는 점입니다"
  - "유통 중인 총 통화량을 충당하기에 부족한 금 준비금으로 뒷받침된다는 점입니다"
explanation: >-
  Satoshi Nakamoto는 전통적 통화의 근본 문제가 그것들이 작동하기 위해 요구되는 신뢰라고 말했습니다. 법정화폐는 상품에 의해 뒷받침되지 않으며, 전적으로 제도적 권위에 의존합니다. 어떤 기관이 돈에 대한 총체적 통제를 보유할 때, 남용의 유혹은 너무 강하며, 역사는 통화 가치 하락을 통해 이를 반복해서 보여 주었습니다.
