question: Simplicity исключает неограниченную рекурсию. Что призвано заменить неограниченную итерацию?
answer: Рекурсивные ковенанты, распределяющие вычисление между несколькими транзакциями и делающие стоимость каждой транзакции предсказуемой.
wrong_answers:
  - Функция делегирования, специально созданная для дозированной формы неограниченной рекурсии внутри одной транзакции.
  - Девять базовых комбинаторов, чья полнота позволяет с помощью конструкции неподвижной точки закодировать любую рекурсивную функцию.
  - Разворачивание циклов на этапе компиляции, при котором статический анализ определяет максимальное число итераций и дублирует тело цикла.
explanation: >-
  Тезис статьи в том, что неограниченную итерацию лучше реализовывать как
  рекурсивные ковенанты, вычисляющиеся через несколько транзакций, что
  позволяет избежать ограничений на место в блоке и стандартность и
  делает стоимость транзакций предсказуемой. Делегирование можно
  использовать со злоупотреблением лишь для получения чего-то похожего
  на неограниченную рекурсию — это не предусмотренный механизм, — а
  девять базовых комбинаторов полны только для конечных вычислений,
  поэтому внутри одной программы не существует конструкции неподвижной
  точки.
reviewed: false
