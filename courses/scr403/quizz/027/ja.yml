question: "なぜ witness 値は Commitment Merkle Root（CMR）から除外されるのですか？"
answer: アドレスが witness の判明前に生成でき、未使用の分岐を非公開で刈り取れるようにするためです。
wrong_answers:
  - witness 値は単純に大きすぎて、256 ビットハッシュに含められないからです。
  - witness 値は Failure 副作用によって完全に別個に検証されるからです。
  - witness 値を含めると CMR が非決定的になってしまうからです。
explanation: >-
  witness 式（署名など）は、アドレス作成時ではなく支出時に提供されます。
  それらを CMR から除外することで、2つの重要な性質が可能になります。
  1つは、支出トランザクションが存在する前にアドレスを生成できること、
  もう1つは、実行されない条件分岐を、それに関連する
  witness 値を明かすことなくオンチェーンデータから刈り取れることです。
reviewed: true
