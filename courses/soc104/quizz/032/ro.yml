question: "Cum privesc libertarienii relația dintre proprietatea privată și libertate?"
answer: "Proprietatea privată este un drept natural care precedă legea și statul și este chiar fundamentul libertății"
wrong_answers:
  - "Proprietatea privată este o convenție socială creată de stat, care poate fi revocată atunci când provoacă inegalitate"
  - "Proprietatea privată este utilă pentru eficiența economică, dar nu are nicio semnificație morală sau filosofică inerentă"
  - "Proprietatea privată ar trebui să existe doar pentru posesiuni personale, nu pentru active productive sau terenuri"
explanation: >-
  Libertarienii apără proprietatea privată ca drept natural care precedă legea și statul. Ei susțin că, dacă un individ își deține propriul corp, atunci își deține și munca, precum și roadele acesteia. Deținerea bunurilor materiale este o extensie a proprietății de sine. Aceasta contrastează puternic cu perspectiva libertaire, potrivit căreia proprietatea este o convenție socială sau o sursă de opresiune.
reviewed: false
