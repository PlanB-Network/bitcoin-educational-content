question: "What feature does the group level of the Merkle forest enable for Taproot assets?"
answer: "Multi-tranche minting: assets minted across separate rounds stay fully interchangeable within one group"
wrong_answers:
  - "Atomic swaps between different asset types without an on-chain confirmation transaction at all"
  - "Parallel proof verification across multiple independent Merkle trees for faster validation"
  - "Cross-chain bridging by linking the group commitment to external blockchain state roots"
explanation: >-
  The group level sits above the asset level in the Merkle forest and groups fungible assets together. For example, all beefbucks minted across different rounds share the same group, making them interchangeable. This is what enables multi-tranche minting, where an issuer can create additional units of the same asset in separate minting events. Group key signatures can authorize these new minting rounds.
reviewed: false
