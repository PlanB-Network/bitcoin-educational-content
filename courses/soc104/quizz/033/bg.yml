question: "Как се различават стратегиите за премахване на държавата при libertaires и либертарианците?"
answer: "Libertaires исторически защитават насилственото разрушаване, докато либертарианците се стремят да делегитимират държавата чрез образование и гражданско неподчинение"
wrong_answers:
  - "Libertaires използват демократични избори, за да разглобят държавата, докато либертарианците предпочитат въоръжена революция и пряко действие"
  - "Libertaires се фокусират върху изграждането на алтернативни общности, докато либертарианците работят в рамките на съществуващата политическа система, за да прокарват реформи"
  - "И libertaires, и либертарианците са съгласни, че мирният протест е единственото легитимно средство за социална трансформация"
explanation: >-
  Libertaires исторически защитават разрушаването на държавата и капитализма чрез насилие, включително терор и целенасочени атаки. За разлика от тях либертарианците отхвърлят агресивното насилие като нелегитимно. Тяхната стратегия почива върху делегитимирането на държавата чрез аргументация, дебат, образование и гражданско неподчинение. Тези фундаментално различни подходи към промяната отразяват по-дълбоките им философски несъгласия.
