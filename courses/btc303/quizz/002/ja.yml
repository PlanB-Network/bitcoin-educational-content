question: ビットコインにおける分散化の2大側面とは？
answer: マイナーの分散化とフルノードの分散化
wrong_answers:
  - トランザクションの分散化とウォレットの分散化
  - ネットワークの分散化とプロトコルの分散化
  - ユーザーの分散化と開発者の分散化
explanation: |
  ビットコインの分散化には2つの重要な要素がある：マイナーの分散化とフルノードの分散化だ。マイナーの分散化とは、トランザクションの処理と順序付けが単一の主体によって制御されるのではなく、自由に参加したり離脱したりできるマイナーのダイナミックな集合体によって制御されることを意味する。フルノードの分散化化とは、ブロックの検証が信頼された当局によってではなく、ユーザー自身によってネットワークのエッジで実行されることを指す。マイナーは中央集権的なトランザクションの順位付けを防ぎ、フルノードはブロックチェーンの信頼できる検証を保証する。
