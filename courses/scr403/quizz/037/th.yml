question: การบีบอัด SHA-256 กลายเป็น jet ได้ แต่คอมบิเนเตอร์ fold และ map ทำไม่ได้ อะไรอธิบายความไม่สมมาตรนี้?
answer: jet แทนนิพจน์คงที่หนึ่งนิพจน์; fold และ map ไม่ใช่นิพจน์เดี่ยว แต่เป็น schemas ซึ่งสร้างนิพจน์ต่างกันหนึ่งตัวต่อฟังก์ชันภายใน f แต่ละตัว
wrong_answers:
  - Jets เร่งได้เฉพาะโค้ดเส้นตรง ดังนั้นคอมบิเนเตอร์แบบวนซ้ำต้องถูก unroll ก่อน แล้วจึงไม่ตรงกับ jet ใด
  - มีเพียงนิพจน์ที่มีหลักฐาน Rocq ที่ตรวจสอบด้วยเครื่องเท่านั้นที่เข้าเงื่อนไข ซึ่งมีสำหรับ SHA-256 แต่ไม่มีสำหรับ folds
  - Folds บนเวกเตอร์สั้นราคาถูกเกินกว่าจะได้ประโยชน์ ดังนั้น jets จึงสงวนไว้สำหรับงาน crypto ที่มีต้นทุนสูง
explanation: >-
  jet คือการแทนที่แบบ native สำหรับนิพจน์ Simplicity ที่เฉพาะเจาะจงและสร้างเสร็จครบหนึ่งนิพจน์
  ซึ่ง nodes สามารถแทนเข้าไปได้โดยคง semantics ที่ตรงกันทุกประการ fold-right-n,
  map, zip และ variants ของมันไม่ใช่นิพจน์เดี่ยว แต่เป็นแบบแผนการสร้าง:
  การเลือกฟังก์ชันภายใน f แต่ละครั้งให้นิพจน์ที่มีโครงสร้างต่างกัน
  ดังนั้นไม่มี jet เดี่ยวใดแทนทั้งตระกูลได้ นี่คือเหตุผลที่รูปแบบ iteration เหล่านี้
  ปรากฏเป็นโค้ดคอมบิเนเตอร์จริงในโปรแกรมจริง โดยปกติสร้างโดยภาษาระดับสูงกว่าอย่าง SimplicityHL
