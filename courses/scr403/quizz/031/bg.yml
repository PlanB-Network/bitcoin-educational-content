question: Какъв е типът на pair (drop iden) (take iden) и каква функция обозначава той?
answer: A × B ⊢ B × A — той разменя двата компонента на двойка.
wrong_answers:
  - A × B ⊢ A × B — той пропуска двата компонента непроменени (идентичността).
  - "Неправилно типизиран: take iden и drop iden имат различни изходни типове, които pair не може да слее."
  - (A × B) × (A × B) ⊢ B × A — pair слива входните типове на двата си подизраза.
explanation: >-
  drop iden : A × B ⊢ B извлича втория компонент, а take iden : A ×
  B ⊢ A извлича първия. Комбинаторът pair изисква само двата му
  подизраза да споделят един и същ входен тип (тук A × B); изходите им може
  да се различават и се връщат като двойка. При вход ⟨a, b⟩ изразът
  следователно дава ⟨b, a⟩: функцията за размяна, от тип A × B ⊢ B × A.
reviewed: false
