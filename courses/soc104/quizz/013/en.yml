question: "Which emblematic figures are associated with maximum economic freedom on the Nolan diagram?"
answer: "Margaret Thatcher, Ronald Reagan, and Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures, and Bernie Sanders"
  - "Nelson Mandela, Simone Veil, and Noam Chomsky"
  - "Vladimir Putin, Xi Jinping, and Joseph de Maistre"
explanation: >-
  Thatcher, Reagan, and Milei are cited as emblematic figures of maximum economic freedom, favoring less state intervention, fewer regulations, and lower taxes. Roosevelt, Jaures, and Sanders represent the opposite end favoring state control of the economy. Mandela, Veil, and Chomsky represent maximum personal freedom. Putin, Xi Jinping, and de Maistre represent maximum state control of personal life.
reviewed: false
