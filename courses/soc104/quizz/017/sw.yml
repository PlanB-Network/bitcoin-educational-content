question: "Mrengo wa kulia unataka kutunga sheria kuhusu nini?"
answer: "Maadili na dini, vikichochewa na hamu ya kuhifadhi taasisi za jadi na hierarkia za kijamii"
wrong_answers:
  - "Uchumi na masoko ya fedha, vikichochewa na hamu ya kupunguza ukosefu wa usawa na kugawa upya utajiri"
  - "Sayansi na elimu, vikichochewa na hamu ya kudhibiti kinachofundishwa katika shule za umma"
  - "Biashara ya kimataifa na diplomasia, vikichochewa na hamu ya kupanua ushawishi wa taifa nje ya nchi"
explanation: >-
  Mrengo wa kulia huipa kipaumbele maadili ya binafsi na thamani za jadi. Huona kwamba ustaarabu umejengwa juu ya taasisi fulani za jadi na hierarkia za kijamii ambazo lazima zihifadhiwe, na unataka kutunga sheria kuhusu maadili na dini. Mrengo wa kushoto, si mrengo wa kulia, ndio unaozingatia kutungia uchumi sheria. Sayansi, elimu, na sera ya biashara si malengo makuu yaliyoelezwa kwa mrengo wa kulia.
