question: "What does Mussolini's 1920 declaration 'Everything in the State, nothing outside the State, nothing against the State' reveal about totalitarianism?"
answer: "There is no longer any separation between public and private space, as the state entirely absorbs society"
wrong_answers:
  - "The state focuses exclusively on military power while leaving the economy to private enterprise"
  - "Citizens are free to organize privately as long as they do not openly criticize the government"
  - "The government controls only political activity while cultural and religious life remain autonomous"
explanation: >-
  Mussolini's declaration captures the essence of totalitarianism: totality. Everything is absorbed into the state, meaning there is no separation between public and private space. Society loses all form of autonomy, down to the most mundane activities like opening a sports club. This goes far beyond controlling just military, political, or economic spheres.
reviewed: false
