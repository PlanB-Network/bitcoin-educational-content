question: "¿Por qué se considera que el eje vertical (arriba-abajo) es más fundamental que el eje horizontal (izquierda-derecha) en el diagrama de Nolan?"
answer: "Porque revela la verdadera división entre quienes defienden las máximas libertades individuales y quienes favorecen el máximo control estatal"
wrong_answers:
  - "Porque mide la producción económica con más precisión que el eje horizontal mide las políticas sociales"
  - "Porque la mayoría de los conflictos políticos a lo largo de la historia han tratado sobre identidad cultural más que sobre gobernanza"
  - "Porque el eje horizontal solo se aplica a las democracias modernas, mientras que el eje vertical es universal"
explanation: >-
  El eje fundamental es el vertical porque capta la pregunta política esencial: ¿hasta qué punto debe el Estado controlar la acción humana? El eje izquierda-derecha solo refleja sensibilidades diferentes (justicia social frente a tradición), pero ambos lados pueden ocupar la misma posición en el eje vertical como estatistas. El eje vertical revela si alguien quiere imponer su visión por la fuerza o respeta la libertad individual.
