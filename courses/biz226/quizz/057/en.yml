question: "According to the chapter, what defines a thought leader compared to someone who simply promotes themselves?"
answer: "A thought leader shapes and owns a topic of societal relevance, and the title must be given by others"
wrong_answers:
  - "A thought leader publishes content at least five times per week on a single specialized topic"
  - "A thought leader has been formally recognized by an industry body or professional association"
  - "A thought leader holds advanced academic credentials and publishes peer-reviewed research"
explanation: >-
  The chapter defines thought leadership as a strategy to shape, promote, and own a topic of great societal relevance. Crucially, you cannot call yourself a thought leader and have it stick. Other people calling you one is what makes it real. This distinguishes it from self-promotion, which is about visibility rather than earned authority on a topic.
reviewed: false
