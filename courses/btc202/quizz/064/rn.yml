question: Ni iyihe mpamvu nyamukuru yo gushiraho Block explorer yo mu karere nka Mempool.Space kuri Umbrel?
answer:  Kubungabunga ibanga no gukoresha amakuru ava kuri node yawe bwite
wrong_answers:
  - Kwihutisha guhuza kwa mbere kwa Bitcoin core
  - Kongera ububiko buboneka ku blocks
  - Kubona Lightning channels
explanation: |
  Block explorer yo mu karere irabuza IP gusohoka kandi yizigira amakuru yawe bwite yemejwe, igatanga ibanga n’ukwizigirwa.
reviewed: true
