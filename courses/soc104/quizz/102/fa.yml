question: "دوره فراتر از طیف سنتی چپ-راست-مرکز، شکاف سیاسی واقعی را چه می‌داند؟"
answer: "شکاف میان اصول فلسفی بنیادی: آزادی یا اجبار، رضایت داوطلبانه یا اکراه، فرد مسئول یا جمع"
wrong_answers:
  - "شکاف میان ملت‌های ثروتمند و فقیر بر سر کنترل توافق‌نامه‌های تجاری بین‌المللی و نهادهای مالی جهانی"
  - "شکاف میان جمعیت‌های شهری و روستایی بر سر اولویت‌های هزینه‌کرد دولت و سرمایه‌گذاری زیرساختی"
  - "شکاف میان فرهنگ‌های پیشرو و سنتی بر سر هنجارهای اجتماعی، ارزش‌های خانوادگی، و آموزش دینی"
explanation: >-
  دوره استدلال می‌کند که شکاف سیاسی واقعی نه در برچسب‌های سنتی چپ-راست-مرکز، بلکه در اصول فلسفی بنیادی نهفته است: آزادی یا اجبار، رضایت داوطلبانه یا اکراه، فرد مسئول یا جمع. راه درست اندیشیدن درباره سیاست این است که از اصول اخلاقی آغاز کنیم، نه از برچسب‌ها.
reviewed: false
