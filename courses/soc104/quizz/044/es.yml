question: "¿Cómo representa el Green New Deal una evolución contemporánea del socialismo democrático?"
answer: "Usa las preocupaciones medioambientales como una nueva justificación para la intervención estatal y la confiscación de ingresos privados, subordinando el interés individual a la salud planetaria colectiva"
wrong_answers:
  - "Abandona por completo la economía socialista tradicional en favor de soluciones de mercado libre a los problemas medioambientales mediante el comercio de carbono"
  - "Rechaza la intervención estatal y se basa en cambio en la acción individual voluntaria y la innovación del sector privado para abordar el cambio climático"
  - "Representa una ruptura con el socialismo al priorizar la protección medioambiental por encima de toda preocupación por la justicia social y el empleo"
explanation: >-
  El Green New Deal fusiona las preocupaciones medioambientales con objetivos sociales, combinando la transición ecológica con la justicia social, garantías de empleo y servicios públicos reforzados. El interés individual queda subordinado al interés colectivo definido por la salud planetaria. En esencia, proporciona una nueva envoltura retórica que justifica la intervención estatal y la confiscación de ingresos privados, ya no solo en nombre de la justicia social sino también en nombre del medio ambiente.
