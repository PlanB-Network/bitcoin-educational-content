question: "คำประกาศของ Mussolini ในปี 1920 ที่ว่า 'ทุกสิ่งในรัฐ ไม่มีสิ่งใดนอกรัฐ ไม่มีสิ่งใดต่อต้านรัฐ' เผยอะไรเกี่ยวกับเบ็ดเสร็จนิยม?"
answer: "ไม่มีการแบ่งแยกระหว่างพื้นที่สาธารณะกับพื้นที่ส่วนตัวอีกต่อไป เพราะรัฐดูดซับสังคมทั้งหมดอย่างสมบูรณ์"
wrong_answers:
  - "รัฐมุ่งเน้นเฉพาะอำนาจทางทหาร ขณะที่ปล่อยเศรษฐกิจไว้ให้กิจการเอกชน"
  - "พลเมืองมีเสรีภาพในการจัดตั้งองค์กรเอกชน ตราบใดที่ไม่วิจารณ์รัฐบาลอย่างเปิดเผย"
  - "รัฐบาลควบคุมเฉพาะกิจกรรมทางการเมือง ขณะที่ชีวิตทางวัฒนธรรมและศาสนายังคงมีอัตตาณัติ"
explanation: >-
  คำประกาศของ Mussolini จับแก่นแท้ของเบ็ดเสร็จนิยมไว้ได้: ความเป็นทั้งหมด ทุกสิ่งถูกดูดซับเข้าสู่รัฐ หมายความว่าไม่มีการแบ่งแยกระหว่างพื้นที่สาธารณะกับพื้นที่ส่วนตัว สังคมสูญเสียอัตตาณัติทุกรูปแบบ ไปจนถึงกิจกรรมธรรมดาที่สุดอย่างการเปิดชมรมกีฬา สิ่งนี้ไปไกลกว่าการควบคุมเพียงขอบเขตทางทหาร การเมือง หรือเศรษฐกิจมากนัก
reviewed: false
