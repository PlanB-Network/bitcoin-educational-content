question: "Miten valtion lakkauttamisen strategiat eroavat libertairejen ja libertaarien välillä?"
answer: "Libertairet ovat historiallisesti kannattaneet väkivaltaista hävittämistä, kun taas libertaarit pyrkivät tekemään valtiosta epälegitiimin koulutuksen ja kansalaistottelemattomuuden avulla"
wrong_answers:
  - "Libertairet käyttävät demokraattisia vaaleja valtion purkamiseen, kun taas libertaarit suosivat aseellista vallankumousta ja suoraa toimintaa"
  - "Libertairet keskittyvät vaihtoehtoisten yhteisöjen rakentamiseen, kun taas libertaarit toimivat nykyisen poliittisen järjestelmän sisällä uudistusten säätämiseksi"
  - "Sekä libertairet että libertaarit ovat samaa mieltä siitä, että rauhanomainen protesti on ainoa legitiimi yhteiskunnallisen muutoksen keino"
explanation: >-
  Libertairet ovat historiallisesti kannattaneet valtion ja kapitalismin tuhoamista väkivallalla, mukaan lukien terrorilla ja kohdennetuilla iskuilla. Libertaarit sitä vastoin torjuvat hyökkäävän väkivallan epälegitiiminä. Heidän strategiansa perustuu valtion epälegitimointiin argumentaation, väittelyn, koulutuksen ja kansalaistottelemattomuuden kautta. Nämä perustavanlaatuisesti erilaiset lähestymistavat muutokseen heijastavat heidän syvempiä filosofisia erimielisyyksiään.
