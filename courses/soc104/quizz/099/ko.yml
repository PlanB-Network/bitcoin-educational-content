question: "중앙집중화에 관한 사이퍼펑크 철학은 동의를 정의의 근본 규범으로 보는 리버테리언 원칙과 어떻게 연결되나요?"
answer: "사이퍼펑크는 모든 중앙집중화를 동의가 아니라 강제 위에 세워진 것으로 보며, 중앙집중적 권위가 힘으로 부과한 것은 어떤 것도 정의로울 수 없다는 리버테리언 입장을 반영합니다"
wrong_answers:
  - "사이퍼펑크는 민주적 다수결로 승인될 때 중앙집중화가 받아들여질 수 있다고 믿으며, 이는 헌정 거버넌스에 대한 리버테리언의 존중과 일치합니다"
  - "사이퍼펑크는 비상상황에서 일시적 중앙집중화를 지지하며, 이는 집단이 위협받을 때 개인의 권리가 중지될 수 있다는 리버테리언 관점을 반영합니다"
  - "사이퍼펑크는 기술 시스템에서만 중앙집중화에 반대하며, 재산권과 계약 집행에는 정치적 중앙집중화가 필요하다고 받아들입니다"
explanation: >-
  사이퍼펑크는 중앙집중적 제도보다 탈중앙화된 암호학 시스템을 신뢰합니다. 모든 중앙집중화는 동의가 아니라 강제 위에 세워진 것으로 인식됩니다. 이는 동의가 정의의 근본 규범이라는 리버테리언 철학과 직접 공명합니다. 어떤 것이든 중앙집중적 권위에 의해 힘으로 부과된다면 정의로울 수 없으며, 그래서 그들은 단일 실체가 자신의 의지를 부과할 수 없는 탈중앙화 네트워크를 구축하려 했습니다.
