question: full-adder ทำ OR กับบิต carry ของ half-adders สองตัวแทนที่จะทำ XOR ทำไม OR จึงถูกต้อง?
answer: สำหรับอินพุตใด ๆ มี half-adder ได้มากที่สุดหนึ่งตัวเท่านั้นที่เกิด carry ดังนั้น OR จึงรวมสองกรณีที่เกิดร่วมกันไม่ได้อย่างพอดี
wrong_answers:
  - บิต carry ทั้งสองต้องถูกบวก และ OR คือวิธีทำการบวกไบนารีแบบบิตเดียวใน Simplicity
  - หลังจากการ branching แล้ว OR เป็นตัวดำเนินการบูลีนตัวเดียวที่ชนิดยังตรงกับสภาพแวดล้อม
  - OR ประมาณค่า carry เผื่อเกิน; carry ส่วนเกินใด ๆ จะถูกทิ้งโดย projection สุดท้ายภายหลัง
explanation: >-
  ถ้า half-adder ตัวแรกเกิด carry แปลว่าบิตอินพุตทั้งสองของมันเป็น 1 ดังนั้น
  บิต sum ของมันเป็น 0 — และ half-adder ที่รับ 0 เป็นอินพุตไม่มีทางเกิด carry ได้
  ดังนั้นบิต carry ทั้งสองจึงไม่เคยเป็น 1 พร้อมกัน และ OR จึงรวมพวกมันได้อย่างพอดี
  (บนอินพุตที่เข้าถึงได้ มันยังตรงกับ XOR ด้วยซ้ำ) ความเป็นกรณีที่เกิดร่วมกันไม่ได้นี้
  คือสิ่งที่ทำให้การแยก full-adder เป็น half-adders สองตัวถูกต้องอย่างแม่นยำ
reviewed: false
