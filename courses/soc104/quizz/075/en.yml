question: "Across all five economic debates (taxes, minimum wage, healthcare, environment, subsidies), what consistent pattern distinguishes the centrist method from the positions of other political families?"
answer: "Centrists refuse to commit to a fixed principle and instead demand empirical analysis and expert evaluation to determine policy on a case-by-case basis, making their approach inherently technocratic"
wrong_answers:
  - "Centrists always adopt a middle position between the socialist and conservative stances, splitting the difference on every issue equally"
  - "Centrists consistently prioritize economic growth over social welfare, siding with libertarians on fiscal policy while agreeing with socialists on regulation"
  - "Centrists defer all economic decisions to international organizations and trade agreements rather than making independent national policy"
explanation: >-
  Across all five economic debates, the centrist approach follows the same pattern: rather than committing to a fixed ideological principle, centrists demand empirical evidence and expert evaluation before making decisions. On taxes, the right level must be determined by analysis. On the minimum wage, the level must be adjusted pragmatically. On healthcare, a blend calibrated by experts is ideal. On environment, policy must balance competitiveness. On subsidies, each case must be evaluated on its merits. This makes centrism inherently technocratic, which is different from simply splitting the difference or deferring to international bodies.
reviewed: false
