question: "Co znamená pojem ‚morální hazard‘ v kontextu debaty o dotacích a která politická rodina tuto obavu vznáší?"
answer: "Morální hazard je pobídka k nezodpovědnosti, když je firmám prostřednictvím dotací bráněno selhat, protože nakonec platí daňový poplatník; tuto obavu vznášejí libertariáni"
wrong_answers:
  - "Morální hazard je riziko, že dotované firmy přesunou sídlo do zemí s nižšími daněmi a vezmou s sebou pracovní místa; tuto obavu vznášejí konzervativci"
  - "Morální hazard je nebezpečí, že se vládní úředníci zkorumpují tím, že budou vybírat, které firmy dostanou dotace; tuto obavu vznášejí centristé"
  - "Morální hazard je etický problém firem, které po obdržení veřejných prostředků vykořisťují pracovníky; tuto obavu vznášejí socialisté"
explanation: >-
  Libertariáni tvrdí, že dotace a záchranné balíčky vytvářejí morální hazard: když je firmám bráněno selhat, motivuje to k nezodpovědnosti a bezohlednosti, protože špatná rozhodnutí nenesou žádné důsledky. Nakonec platí daňový poplatník, což libertariáni považují za hluboce nespravedlivé. Tento pojem se liší od obav z přesunu firem, úřední korupce nebo vykořisťování pracovníků, které vznášejí jiné politické rodiny.
