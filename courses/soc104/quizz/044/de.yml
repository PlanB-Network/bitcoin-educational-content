question: "Wie stellt der Green New Deal eine zeitgenössische Entwicklung des demokratischen Sozialismus dar?"
answer: "Er nutzt Umweltbelange als neue Rechtfertigung für staatliche Intervention und Konfiskation privaten Einkommens und ordnet das individuelle Interesse der kollektiven planetaren Gesundheit unter"
wrong_answers:
  - "Er gibt die traditionelle sozialistische Ökonomie vollständig zugunsten freimarktwirtschaftlicher Lösungen für Umweltprobleme durch Emissionshandel auf"
  - "Er lehnt staatliche Intervention ab und stützt sich stattdessen auf freiwilliges individuelles Handeln und Innovationen des Privatsektors, um den Klimawandel anzugehen"
  - "Er stellt einen Bruch mit dem Sozialismus dar, indem er Umweltschutz über alle Anliegen sozialer Gerechtigkeit und Beschäftigung stellt"
explanation: >-
  Der Green New Deal verbindet Umweltbelange mit sozialen Zielen, indem er ökologische Transformation mit sozialer Gerechtigkeit, Beschäftigungsgarantien und gestärkten öffentlichen Diensten kombiniert. Das individuelle Interesse wird dem kollektiven Interesse untergeordnet, das durch planetare Gesundheit definiert ist. Im Kern bietet er eine neue rhetorische Hülle, die staatliche Intervention und die Konfiskation privaten Einkommens rechtfertigt, nicht mehr allein im Namen sozialer Gerechtigkeit, sondern auch im Namen der Umwelt.
reviewed: false
