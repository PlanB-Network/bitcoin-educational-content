question: S čím markíz d'Argenson porovnával spoločnosť?
answer: S úľom, kde každý hmyz koná podľa vlastných záujmov, výsledkom čoho je spoločné blaho všetkých
wrong_answers:
  - S džungľou, kde vládne len zákon silnejšieho
  - S riekou, ktorá tečie prirodzene bez zásahu zákonov
  - Zložitý stroj, ktorý si vyžaduje neustálu údržbu
explanation: |
  D'Argenson porovnával spoločnosť s úľom plným včiel, kde každý hmyz nasleduje svoj inštinkt a vytvára tak veľké nahromadenie pre potreby malej spoločnosti bez rozkazov generálov. Toto je azda najbližšie vyjadrenie vo francúzskom ekonomickom myslení k slávnej "neviditeľnej ruke" Adama Smitha.
