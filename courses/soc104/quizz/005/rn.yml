question: "Ni ikintu rusangi ikihe imigambwe ya politike y'ibubamfu n'iy'iburyo isangiye naho isa n'iyihanganye?"
answer: "Yompi irwanira uburenganzira bwa leta bwo kuganza ubuzima bw'abantu biciye mu mategeko ngenderwako no mu makori"
wrong_answers:
  - "Yompi isaba gukuraho burundu ukwivanga kwa leta mu bibazo vy'ubutunzi"
  - "Yompi ishira imbere umwidegemvyo w'umuntu ku giti ciwe kuruta gutunganya ikibano mu buryo rusangi"
  - "Yompi iranka gukoresha politike y'amahera nk'igikoresho co gufasha leta gukoresha amafaranga"
explanation: >-
  Naho bisa n'ibihanganye, ibubamfu n'iburyo bisangiye ugukunda ukwivanga kwa leta. Vyompi biranegura isoko ryigenga kandi bikarwanira uburenganzira bwa leta bwo kuganza ubuzima bw'abantu biciye mu mategeko ngenderwako no mu makori. Ibubamfu bunegura amasoko nk'isoko ry'ubusumbasumbane, mu gihe iburyo bubona ayo masoko nk'ikibangamira ubusegaba, ariko vyompi birahindukirira leta kugira ngo ironke inyishu.
