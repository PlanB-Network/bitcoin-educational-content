question: Ktorého filozofa sa abbé de Saint-Pierre svojím Projektom večného mieru javí ako predchodca?
answer: Immanuel Kant
wrong_answers:
  - Jeremy Bentham
  - Jean-Jacques Rousseau
  - Baruch Spinoza
explanation: |
  Projekt večného mieru abbého de Saint-Pierre sa považuje za predchodcu myšlienok Immanuela Kanta o všeobecnom mieri. Obaja myslitelia obhajovali vytvorenie medzinárodnej organizácie schopnej zaručiť mier medzi národmi.
