question: Pourquoi les Autrichiens affirment-ils que le socialisme est impossible à réaliser ?
answer: Sans un système de prix libre, les planificateurs centraux ne peuvent pas effectuer de calculs économiques précis.
wrong_answers:
  - Le socialisme est contraire à la nature.
  - Le socialisme est efficace sur le plan économique mais immoral.
  - Le socialisme nécessite trop de bureaucrates pour fonctionner correctement.
explanation: |
  Ludwig von Mises a démontré que le socialisme est impossible en pratique car, sans un système de prix libre fourni par le marché, les planificateurs centraux ne peuvent pas effectuer de calculs économiques précis, ce qui conduit inévitablement à des pénuries généralisées et à une mauvaise allocation des ressources.
reviewed: true
