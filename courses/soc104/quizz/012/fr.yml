question: "Que comprend la catégorie de la liberté économique ?"
answer: "Ce que vous faites en tant que producteur et consommateur : acheter, vendre, produire, travailler, embaucher et gérer votre argent"
wrong_answers:
  - "Vos croyances religieuses, vos relations personnelles et votre liberté d'expression"
  - "Votre droit de vote, de participation aux élections et d'adhésion à des partis politiques"
  - "Votre capacité à voyager librement, à choisir votre lieu de résidence et à franchir les frontières nationales"
explanation: >-
  La liberté économique couvre ce que vous faites en tant que producteur et consommateur : ce que vous pouvez acheter, vendre ou produire ; où vous travaillez ; qui vous embauchez ; et ce que vous faites de votre argent. Les relations personnelles, les croyances religieuses et la liberté de circulation relèvent de la catégorie de la liberté personnelle, et non de la liberté économique.
reviewed: false
