question: "Molinari'nin 1849 tarihli öngörüsü, özgürlük ile siyasi iktidar arasındaki ilişki konusunda neden kehanet niteliğinde çıktı?"
answer: "Çünkü muhafazakârlar ve sosyalistler iktidarda dönüşümlü olarak yer aldılar ve özgürlüğü, tam da onun tarif ettiği gibi, kendi siyasi hedeflerinin hizmetinde araçsallaştırdılar"
wrong_answers:
  - "Çünkü tarif ettiği iktisatçı karakter sonunda siyasi iktidarı ele geçirdi ve Avrupa genelinde liberteryen politikalar uyguladı"
  - "Çünkü üç siyasi ailenin tek bir merkezci hareket içinde birleşeceğine dair öngörüsü yirminci yüzyılda gerçekleşti"
  - "Çünkü özgürlük ardışık hükümetler tarafından kademeli olarak genişletildi ve modern demokrasilerin birincil düzenleyici ilkesi hâline geldi"
explanation: >-
  Molinari'nin vizyonu kehanet niteliğinde çıktı; çünkü on dokuzuncu yüzyılın ortasından beri muhafazakârlar ve sosyalistler iktidarda dönüşümlü olarak yer aldılar ve tam olarak onun tarif ettiği şeyi gerçekleştirdiler: özgürlüğün siyasi hedeflerin hizmetinde araçsallaştırılması. Her iki aile de özgürlükleri kısıtlamaya ve kendi gündemlerini dayatmak için devlete başvurmaya isteklidir; iktisatçının koşulsuz özgürlük konumu ise marjinal kalmıştır.
