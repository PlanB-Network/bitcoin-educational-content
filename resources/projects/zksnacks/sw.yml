description: |
  "zk" katika zkSNACKs inawakilisha sifuri maarifa, ambayo ina maana kwamba hatuwezi kukusanya taarifa yoyote ya kibinafsi ya mtumiaji katika bidhaa zetu.

  zkSNACKs ilifunga mratibu wake wa coinjoin tarehe 1 Juni 2024, na tovuti yake haipatikani. Wasabi Wallet inaendelea kama programu huria.
  