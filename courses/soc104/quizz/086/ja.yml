question: "Ludwig von Mises が、考え、推論し、行動するのは個人だけであると書いたとき、何を意味していたのか？"
answer: "国家や国民のような集合体は、その個々の構成員の行為を越えて、それ自体の存在を持たないということ"
wrong_answers:
  - "集団や結社を形成することは常に有害なので、個人はそれを避けるべきだということ"
  - "理性的思考が可能なのは特定の才能ある個人だけであり、ほとんどの人は本能に従うということ"
  - "思考と推論は私的な活動であり、公の場で共有されたり議論されたりすべきではないということ"
explanation: >-
  Mises は、個人主義は、社会や国民のような社会的実体が、それを構成する個人とは独立して存在し得るという観念に反対するものだと明確にした。集合体は、その個々の構成員の行為を越えて、それ自体の存在を持たない。国家や会社の行為について意味のある形で語ることはできない。なぜなら、これらの実体にはそれ自体の意志や思考がなく、個人を通じてのみ行動するからである。
reviewed: false
