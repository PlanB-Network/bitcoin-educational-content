question: "미국의 고전적 자유주의자들은 왜 1960년대 이후 스스로를 'libertarians'라고 부르기 시작했나요?"
answer: "의미가 국가 개입주의 쪽으로 이동한 미국식 liberals와 자신들을 구별하기 위해서입니다"
wrong_answers:
  - "Democratic Party와 그 진보적 사회 프로그램에 자신들을 맞추기 위해서입니다"
  - "Lyndon B. Johnson의 Great Society 개혁에 대한 지지를 나타내기 위해서입니다"
  - "유럽 사회주의 운동에서 영감을 받은 더 급진적인 혁명적 정체성을 채택하기 위해서입니다"
explanation: >-
  미국에서 'liberal'이라는 단어는 특히 New Deal과 Great Society 이후 큰 정부와 국가 개입을 지지하는 사람들을 뜻하는 쪽으로 이동했습니다. 고전적 자유주의자들은 자신들의 철학이 가진 원래 의미를 보존하기 위해 'libertarian'이라는 명칭을 채택했습니다. 그들은 미국식 liberals와 자신들을 구별한 것이지, 그들과 연대하려 한 것이 아닙니다.
reviewed: false
