question: "Bitcoin は福祉国家のどの 3 つの柱に挑戦するか？"
answer: "財政システム、債務を通じて支出を賄うための貨幣独占、そして代替通貨の使用を防ぐための取引監視"
wrong_answers:
  - "軍事予算、公教育システム、政府管理の医療インフラ"
  - "司法制度、立法過程、企業に対する規制の行政執行"
  - "社会保障制度、最低賃金法、累進所得税構造"
explanation: >-
  Bitcoin は福祉国家が依拠する 3 つの柱に挑戦する。
  第一に、支出を賄うには不十分な財政システムである。
  第二に、債務を通じて支出を賄うために貨幣を発行する能力を意味する貨幣独占である。
  第三に、国家が押しつけた法定通貨以外の通貨を人々が使うことを防ぐ能力である取引の監視である。
  Bitcoin はこの 3 つすべてを同時に掘り崩す。
reviewed: false
