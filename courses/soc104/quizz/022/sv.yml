question: "Vad är politisk konservatism?"
answer: "En ideologi som syftar till att bevara etablerade politiska institutioner och social ordning, och motsätter sig stora strukturella omvälvningar"
wrong_answers:
  - "Ett personligt engagemang för traditionella familjevärden och religiösa praktiker utan att försöka påtvinga dem på andra"
  - "En filosofi som främjar snabb social förändring genom demokratiska reformer och progressiv lagstiftning"
  - "En ekonomisk teori som förespråkar fria marknader, minimal beskattning och avskaffande av handelshinder"
explanation: >-
  Politisk konservatism är en ideologi, ofta representerad i höger- eller extremhögerpartier, som syftar till att bevara etablerade politiska institutioner och social ordning samtidigt som den motsätter sig stora strukturella omvälvningar. Dess förespråkare vill använda makt och lag för att skydda sitt arv. Detta skiljer sig från kulturell konservatism, som är ett personligt livsval snarare än ett politiskt program.
reviewed: false
