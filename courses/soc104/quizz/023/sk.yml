question: "Čo vertikálna os Nolanovho diagramu odhaľuje o skutočnej politickej otázke?"
answer: "Odhaľuje, či chcete prostredníctvom štátu vnucovať iným svoje vlastné citlivosti, alebo uprednostňujete, aby každý človek mohol slobodne rozhodovať sám za seba"
wrong_answers:
  - "Odhaľuje, či podporujete demokratickú správu alebo uprednostňujete autoritatívnu vládu jediného vodcu"
  - "Odhaľuje, či sa identifikujete s progresívnymi spoločenskými hnutiami alebo s tradičnými náboženskými inštitúciami"
  - "Odhaľuje, či je vašou hlavnou starosťou národná bezpečnosť alebo ekonomická prosperita"
explanation: >-
  Vertikálna os odhaľuje skutočnú politickú otázku: nie to, či ste ľavicový alebo pravicový, ale do akej miery chcete, aby štát zasahoval do formovania spoločnosti podľa vašich hodnôt. Želáte si vnútiť svoje citlivosti iným, alebo uprednostňujete, aby každý človek mohol slobodne rozhodovať sám za seba? Tento rámec presahuje delenie na ľavicu a pravicu a ukazuje, že oba tábory môžu byť rovnako etatistické.
reviewed: false
