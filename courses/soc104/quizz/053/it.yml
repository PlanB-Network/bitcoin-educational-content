question: "Quale paradosso nascosto si trova nel pragmatismo centrista?"
answer: "Il pragmatismo stesso poggia su una forma di dogmatismo, cioè la convinzione non espressa che solo gli esperti siano competenti a guidare la società"
wrong_answers:
  - "I centristi affermano di essere moderati ma si allineano costantemente con i partiti di sinistra nei governi di coalizione"
  - "Le politiche centriste appaiono equilibrate ma favoriscono sempre la crescita economica rispetto alla protezione ambientale"
  - "I centristi rifiutano l'ideologia ma adottano rigidi principi di libero mercato quando prendono decisioni economiche"
explanation: >-
  Il paradosso del pragmatismo centrista è che pretende di rifiutare l'ideologia a favore della competenza razionale, eppure proprio questa pretesa poggia su un dogma invisibile e non espresso: che solo i tecnocrati siano capaci di prendere le decisioni giuste. Questa convinzione che solo gli esperti debbano guidare la società è essa stessa un impegno ideologico, anche se i centristi non la riconoscono come tale.
reviewed: false
