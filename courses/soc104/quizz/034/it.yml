question: "In che modo il socialismo tratta le libertà in modo diverso nelle sfere sociale ed economica?"
answer: "Il socialismo favorisce libertà forti nella sfera sociale ma libertà deboli nella sfera economica"
wrong_answers:
  - "Il socialismo limita tutte le libertà allo stesso modo sia nella sfera sociale sia in quella economica"
  - "Il socialismo favorisce forti libertà economiche ma limita le libertà sociali per mantenere l'ordine sociale"
  - "Il socialismo concede libertà illimitate in entrambe le sfere e si affida alla cooperazione volontaria per mantenere l'equilibrio"
explanation: >-
  Nel pensiero socialista esiste una dicotomia fondamentale tra libertà sociali ed economiche. Le libertà sociali sono forti, ma le libertà economiche sono deboli a causa dell'enfasi sul controllo statale, sulla pianificazione e sulla redistribuzione della ricchezza. La terza risposta errata descrive l'ideale libertariano, mentre la seconda descrive il modello conservatore, che è l'immagine speculare del socialismo.
