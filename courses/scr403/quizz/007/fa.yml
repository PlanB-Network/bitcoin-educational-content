question: نوع بولی (𝟚) در Simplicity چگونه تعریف می‌شود؟
answer: به‌عنوان نوع جمعی 𝟙 + 𝟙، که دقیقاً دو مقدار را نگه می‌دارد (false و true).
wrong_answers:
  - به‌عنوان نوع ضربی 𝟙 × 𝟙 که در آن صورت فقط یک مقدار را نگه می‌داشت.
  - به‌عنوان یک نوع اولیه ویژه که مستقیم در زبان ساخته شده است.
  - به‌عنوان یک نوع عدد صحیح ۳۲بیتی که فقط به مقدارهای 0 و 1 محدود شده است.
explanation: >-
  نوع بولی 𝟚 به‌صورت 𝟙 + 𝟙 تعریف می‌شود، یعنی جمع دو نوع واحد. مقدار
  با برچسب چپ σᴸ⟨⟩ نماینده false (0) است و مقدار با برچسب راست σᴿ⟨⟩
  نماینده true (1) است. این یک نوع داده یک‌بیتی است که فقط از نوع واحد
  و سازنده نوع جمعی ساخته شده است — سازنده ضربی لازم نیست.
reviewed: false
