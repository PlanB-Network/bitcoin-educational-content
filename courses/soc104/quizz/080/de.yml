question: "Warum erwies sich Molinaris Vorhersage von 1849 hinsichtlich der Beziehung zwischen Freiheit und politischer Macht als prophetisch?"
answer: "Weil Konservative und Sozialisten sich an der Macht abgewechselt und Freiheit im Dienst ihrer jeweiligen politischen Ziele instrumentalisiert haben, genau wie er es beschrieben hat"
wrong_answers:
  - "Weil die von ihm beschriebene Ökonomenfigur schließlich politische Macht erlangte und in ganz Europa libertäre Politiken umsetzte"
  - "Weil seine Vorhersage, dass alle drei politischen Familien zu einer einzigen zentristischen Bewegung verschmelzen würden, im zwanzigsten Jahrhundert wahr wurde"
  - "Weil Freiheit von aufeinanderfolgenden Regierungen schrittweise ausgeweitet wurde, bis sie zum primären Organisationsprinzip moderner Demokratien wurde"
explanation: >-
  Molinaris Vision erwies sich als prophetisch, weil sich Konservative und Sozialisten seit der Mitte des neunzehnten Jahrhunderts an der Macht abgewechselt und genau das ausgeführt haben, was er beschrieb: die Instrumentalisierung der Freiheit im Dienst politischer Ziele. Beide Familien sind bereit, Freiheiten einzuschränken und den Staat heranzuziehen, um ihre jeweiligen Agenden durchzusetzen, während die Position des Ökonomen einer bedingungslosen Freiheit marginalisiert blieb.
reviewed: false
