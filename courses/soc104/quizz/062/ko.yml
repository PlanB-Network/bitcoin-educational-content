question: "모든 전체주의 정권은 어떻게 권력을 잡았나요?"
answer: "이전 체제를 완전히 새로 시작해야 한다고 정당화한 폭력 혁명을 통해"
wrong_answers:
  - "기존 민주 제도 안에서 점진적인 입법 개혁을 통해"
  - "지역 통제를 추구하는 외국 세력이 조직한 군사 쿠데타를 통해"
  - "큰 표차로 대중 선거에서 승리한 평화적 대중운동을 통해"
explanation: >-
  모든 전체주의 정권은 폭력 혁명을 통해 권력을 잡았습니다. 이 혁명은 두 가지 목적을 수행합니다. 그것은 낡은 질서를 물리적으로 파괴하고, 새로운 사회를 건설하는 데 폭력이 필요하다는 점을 이데올로기적으로 정당화합니다. 이것이 전체주의적 권력 장악을 민주적 이행, 외국의 지원을 받은 쿠데타, 또는 평화적 선거 승리와 구별합니다.
