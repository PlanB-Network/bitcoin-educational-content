question: "Wie unterscheidet sich die libertäre Auffassung von Freiheit von der zentristischen Auffassung?"
answer: "Libertäre behandeln Freiheit als ein bedingungsloses Axiom, während Zentristen Freiheiten opportunistisch je nach Kontext und Effizienz verteidigen"
wrong_answers:
  - "Libertäre erlauben dem Staat, Freiheit selektiv zu schützen, während Zentristen jede staatliche Beteiligung am Schutz individueller Rechte ablehnen"
  - "Libertäre konzentrieren Freiheit nur auf wirtschaftliche Angelegenheiten, während Zentristen Freiheit breit auf soziale und kulturelle Bereiche anwenden"
  - "Libertäre und Zentristen teilen dieselbe Sicht auf Freiheit, sind sich aber uneinig über die Größe der Regierung, die zu ihrer Durchsetzung erforderlich ist"
explanation: >-
  Libertäre definieren Freiheit als allgemeines, bedingungsloses Prinzip, das als Axiom fungiert. Zentristen hingegen verteidigen bestimmte Freiheiten auf opportunistische und kontextbezogene Weise, ohne irgendein allgemeines Prinzip anzuwenden. Der zentristische Ansatz offenbart eine instrumentelle Auffassung von Freiheit, die stets pragmatischen Zielen wie Effizienz untergeordnet ist, was Libertäre grundlegend ablehnen.
reviewed: false
