question: "What does the personal freedom category include?"
answer: "What you do in your private relationships, with your opinions, beliefs, and everything involving your own body and mind"
wrong_answers:
  - "What you do as a producer, including starting a business, hiring employees, and trading goods"
  - "How much tax you pay, what investments you make, and how you manage your financial assets"
  - "Your ability to compete in the marketplace, set prices for your products, and choose your suppliers"
explanation: >-
  Personal freedom encompasses what you do in your private relationships, with your opinions and beliefs, and everything involving your own body and mind. This includes marriage, reading choices, religious practices, food and medicine choices, and who you associate with. Business activities, taxes, and marketplace decisions fall under economic freedom.
reviewed: false
