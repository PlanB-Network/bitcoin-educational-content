question: Ako sa nazýva časopis fyziokratov?
answer: Les Ephémérides du Citoyen
wrong_answers:
  - Les Ephémérides du Peuple
  - Nový občan
  - Le Journal des Économistes
explanation: |
  Časopisom fyziokratov boli "Les Éphémérides du Citoyen", periodikum, v ktorom šírili svoje myšlienky a ekonomické analýzy.
