question: "为什么极权主义政权被描述为“世俗宗教”，这揭示了极权主义存在所需的哪些条件？"
answer: "它们要求积极分子具有近乎宗教般的信仰，并用恐惧对付反对者；而极权主义要求所有特征同时存在：自由被压制、单一政党统治、暴力革命和指令型经济"
wrong_answers:
  - "它们用国家仪式取代传统崇拜，而极权主义只需要一个魅力型领袖和军事控制"
  - "它们利用宗教机构执行国家意识形态，而只要一个政党主导议会，极权主义就可能出现"
  - "它们承诺通过政治行动实现精神救赎，而只要国家控制经济，无论政治自由如何，极权主义就存在"
explanation: >-
  Raymond Aron 观察到，极权主义政权依靠两项原则运作：积极分子的信仰和反对者的恐惧。这种近乎宗教般的狂热主义超越了它们不同的动机，因而使它们被称为世俗宗教。关键在于，极权主义要求所有定义性特征同时存在：自由被压制、通过单一政党实现不受限制的权威、暴力革命，以及指令型经济。现代民主国家可能表现出其中某些特征，但只有当这些特征全部组合在一起时，极权主义才存在。
reviewed: false
