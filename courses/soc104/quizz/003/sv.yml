question: "Varför anses vänster-höger-axeln vara otillräcklig för att placera klassiskt liberala tänkare som Bastiat eller Ron Paul?"
answer: "Eftersom klassisk liberalism värdesätter både ekonomiska och personliga friheter, vilket varken vänstern eller högern fullt ut omfamnar"
wrong_answers:
  - "Eftersom klassiska liberaler alltid ansluter sig till högerns ekonomiska politik och avvisar alla vänsterpositioner"
  - "Eftersom klassiska liberaler är centrister som antar moderata versioner av både vänster- och högerideologier"
  - "Eftersom klassiska liberaler motsätter sig alla former av statsmakt, vilket gör dem till anarkister snarare än politiska tänkare"
explanation: >-
  Vänster-höger-axeln fungerar dåligt för klassiska liberaler eftersom den inte kan rymma en position som samtidigt försvarar ekonomisk frihet (typiskt höger) och personlig frihet (typiskt vänster). Klassiska liberaler är inte centrister som söker kompromisser, och de är inte heller anarkister eller rent högerinriktade. De passar helt enkelt inte in på ett endimensionellt spektrum.
reviewed: false
