question: "Apa yang lebih diprioritaskan daripada kebebasan dalam filsafat politik konservatif?"
answer: "Tatanan dan tradisi, yang harus ditegakkan dengan kokoh sebelum kebebasan dapat dihargai"
wrong_answers:
  - "Keadilan sosial dan kesetaraan, yang harus dijamin sebelum individu dapat benar-benar bebas"
  - "Efisiensi ekonomi dan hasil pragmatis, yang menentukan kapan kebebasan itu tepat"
  - "Hak milik individu, yang harus dilindungi sebelum kebebasan lain apa pun diberikan"
explanation: >-
  Bagi kaum konservatif, tatanan dan tradisi lebih diprioritaskan daripada kebebasan. Mereka berargumen bahwa terlalu banyak kebebasan menghasilkan kekacauan dan ketidakteraturan sosial, sehingga kebebasan hanya dapat dihargai setelah tatanan ditegakkan dengan kokoh. Ini kontras dengan pandangan sosialis yang memprioritaskan keadilan, atau fokus sentris pada efisiensi.
