question: "Minkä kurssi tunnistaa todelliseksi poliittiseksi jakolinjaksi perinteisen vasemmisto–oikeisto–keskusta-spektrin tuolla puolen?"
answer: "Perustavien filosofisten periaatteiden välisen jaon: vapaus tai pakko, vapaaehtoinen suostumus tai pakottaminen, vastuullinen yksilö tai kollektiivi"
wrong_answers:
  - "Rikkaiden ja köyhien valtioiden välisen jaon kansainvälisten kauppasopimusten ja globaalien rahoitusinstituutioiden hallinnasta"
  - "Kaupunki- ja maaseutuväestöjen välisen jaon valtion menojen painopisteistä ja infrastruktuuri-investoinneista"
  - "Edistyksellisten ja perinteisten kulttuurien välisen jaon sosiaalisista normeista, perhearvoista ja uskonnollisesta kasvatuksesta"
explanation: >-
  Kurssi väittää, että todellinen poliittinen jakolinja ei ole perinteisissä vasemmisto–oikeisto–keskusta-etiketeissä vaan perustavissa filosofisissa periaatteissa: vapaus tai pakko, vapaaehtoinen suostumus tai pakottaminen, vastuullinen yksilö tai kollektiivi. Oikea tapa ajatella politiikkaa on aloittaa eettisistä periaatteista eikä etiketeistä.
