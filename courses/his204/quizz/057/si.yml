question: Le Trosneගේ පොතක මාතෘකාව අනුව, වෙළඳ නිදහස විස්තර කරන්නේ කෙසේද?
answer: සැමවිටම ප්‍රයෝජනවත්, කිසිවිටෙක හානිකර නොවේ
wrong_answers:
  - සැමවිටම ලාභදායී සහ සැමවිටම ප්‍රයෝජනවත්
  - බොහෝ විට ලාභදායී, සැමවිටම සදාචාරාත්මක
  - සමහර විට ලාභදායී, සමහර විට හානිකර
explanation: |
  Le Trosne "De l'intérêt social, par rapport à la valeur, à la circulation, à l'industrie et au commerce intérieur et extérieur" ලියූ අතර, එහිදී ඔහු නිදහස් වෙළඳාම සමාජයට සැමවිටම ප්‍රයෝජනවත් සහ කිසිවිටෙක හානිකර නොවන බව පෙන්වා දෙමින් ආරක්ෂා කරයි.