question: "Ku kibazo co gutunganya inkoho, itandukaniro nyamukuru hagati y'ibibanza vy'abakonservateur n'aba-libertarian ni irihe?"
answer: "Bose baremera ugutunganya kumwe, ariko abakonservateur bashaka amategeko ava ku butegetsi rusangi bufise uburenganzira, mu gihe aba-libertarian bashaka ko amategeko avuka mu babiraba neza na neza, nk'amashirahamwe y'abanyagihugu n'ihiganwa ryo mw'isoko"
wrong_answers:
  - "Abakonservateur barwanya ugutunganya kwose kw'inkoho mu gihe aba-libertarian bemera ugucungera gukomeye kwa Leta ku mutekano rusangi"
  - "Abakonservateur bashaka kubuza inkoho burundu mu gihe aba-libertarian bashigikira kuronka ibirwanisho vyose ata nzitizi"
  - "Abakonservateur bashinga ikibanza cabo ku burenganzira bw'umuntu ku giti ciwe mu gihe aba-libertarian bagishinga ku kwishura kw'abantu bose hamwe"
explanation: >-
  Abakonservateur n'aba-libertarian bose bemera ko uburyo bumwe bwo gutunganya gutwara ibirwanisho ari ngombwa. Itandukaniro nyamukuru riri mu muntu ashinga ayo mategeko. Abakonservateur bashimika ko amategeko ategerezwa kuva ku butegetsi rusangi bushinzwe gukingira ineza rusangi (biva hejuru bija hasi). Aba-libertarian bavuga ko ugutunganya gukwiye kuva mu babiraba neza na neza: abahinga mu vy'umutekano, amashirahamwe y'abanyagihugu, n'ihiganwa ryo mw'isoko (biva hasi bija hejuru).
