question: Aká je podľa Cantillona hlavná charakteristika podnikateľa?
answer: Pôsobí v neistote
wrong_answers:
  - Má kapitál
  - Je inovátor
  - Pochádza z bohatej rodiny
explanation: |
  Cantillon zdôrazňuje úlohu podnikateľa tvárou v tvár neistote a riziku. Podnikateľ je ten, kto rozhoduje v neistom prostredí a nesie dôsledky svojich rozhodnutí.
