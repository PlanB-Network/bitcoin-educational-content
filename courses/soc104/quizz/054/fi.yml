question: "Miten George W. Bushin vastaus vuoden 2008 finanssikriisiin havainnollistaa konservatiivisten periaatteiden 'pulmallista joustavuutta'?"
answer: "Hän hylkäsi vapaiden markkinoiden periaatteet pelastaakseen suurpankit, mikä paljasti konservatiivisen käsityksen valtiosta kansallisen taloudellisen vakauden ylimpänä takaajana"
wrong_answers:
  - "Hän kieltäytyi kaikesta valtion puuttumisesta ja antoi pankkien kaatua pitäytyen tiukasti vapaiden markkinoiden ideologiassa seurauksista riippumatta"
  - "Hän kansallisti pankkisektorin pysyvästi ja otti käyttöön progressiivisen verotuksen, siirtyen konservatismista demokraattiseen sosialismiin"
  - "Hän vastasi leikkaamalla kaikki julkiset menot ja poistamalla finanssisääntelyn, jotta markkinat voisivat korjata itse itsensä"
explanation: >-
  Bush julisti 'hylänneensä vapaiden markkinoiden periaatteet pelastaakseen vapaiden markkinoiden järjestelmän' puuttumalla tilanteeseen suurpankkien pelastamiseksi. Tämä havainnollistaa, kuinka konservatiivit voivat asettaa kansakunnan vallan ja jatkuvuuden abstraktien markkinaperiaatteiden edelle. Sama joustava logiikka näkyy Trumpin protektionistisessa kauppapolitiikassa, jota harjoitettiin kansallisen edun nimissä korporatismin ja kaverikapitalismin ruokkimisen riskistä huolimatta.
