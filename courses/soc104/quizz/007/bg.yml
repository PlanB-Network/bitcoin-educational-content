question: "Кои са двете оси на диаграмата на Нолан?"
answer: "Вертикална ос, измерваща личните свободи, и хоризонтална ос, измерваща икономическите свободи"
wrong_answers:
  - "Хоризонтална ос от ляво към дясно и вертикална ос от авторитарно към демократично"
  - "Вертикална ос, измерваща богатството, и хоризонтална ос, измерваща образователните нива"
  - "Хоризонтална ос от социализъм към капитализъм и вертикална ос от традиция към прогрес"
explanation: >-
  David Nolan е проектирал диаграмата си с две конкретни оси: лични свободи (вертикална) и икономически свободи (хоризонтална). Този двумерен подход заменя прекомерно опростената линия ляво-дясно и по-добре улавя сложността на политическите идеологии, като разделя двете основни категории свобода.
