question: "Где на диаграмме Нолана находятся Зеленые и почему?"
answer: "Очень низко на диаграмме, потому что они считают, что индивидуальный интерес не должен иметь приоритет над коллективным интересом планеты"
wrong_answers:
  - "В верхней части диаграммы, потому что они одинаково ставят в приоритет личную свободу и экологическую осознанность"
  - "В центре диаграммы, потому что они уравновешивают экономический рост с защитой окружающей среды"
  - "На крайнем правом фланге, потому что они поддерживают рыночные решения экологических проблем"
explanation: >-
  Зеленые находятся очень низко на диаграмме Нолана, потому что во имя благополучия планеты выступают за сильный государственный контроль как над экономическими, так и над личными решениями. Они заменили марксистскую классовую борьбу борьбой между человеком и природой и склонны защищать экономический контроль и даже отмену частной собственности. Это помещает их в авторитарный сектор, а не в верхнюю часть или центр.
