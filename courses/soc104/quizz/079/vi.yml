question: "Vì sao dự đoán năm 1849 của Molinari tỏ ra có tính tiên tri về mối quan hệ giữa tự do và quyền lực chính trị?"
answer: "Vì những người bảo thủ và những người xã hội chủ nghĩa đã luân phiên nắm quyền và công cụ hóa tự do để phục vụ các mục tiêu chính trị tương ứng của họ, đúng như ông mô tả"
wrong_answers:
  - "Vì nhân vật nhà kinh tế mà ông mô tả cuối cùng đã giành được quyền lực chính trị và thực thi các chính sách libertarian khắp châu Âu"
  - "Vì dự đoán của ông rằng cả ba họ chính trị sẽ hợp nhất thành một phong trào trung dung duy nhất đã trở thành sự thật trong thế kỷ XX"
  - "Vì tự do dần được mở rộng bởi các chính phủ kế tiếp cho đến khi nó trở thành nguyên tắc tổ chức chính của các nền dân chủ hiện đại"
explanation: >-
  Tầm nhìn của Molinari tỏ ra có tính tiên tri vì, kể từ giữa thế kỷ XIX, những người bảo thủ và những người xã hội chủ nghĩa đã luân phiên nắm quyền và thực hiện chính xác điều ông mô tả: công cụ hóa tự do để phục vụ các mục tiêu chính trị. Cả hai họ đều sẵn sàng hạn chế các quyền tự do và kêu gọi nhà nước áp đặt chương trình nghị sự tương ứng của họ, trong khi lập trường tự do vô điều kiện của nhà kinh tế vẫn bị gạt ra ngoài lề.
