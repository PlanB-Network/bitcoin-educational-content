question: "Hannah Arendt 對古典專制與極權主義所作的關鍵區分是什麼？"
answer: "極權主義不只是使人屈從於專制規則，而是使人類無法獨立行動，否定政治本身"
wrong_answers:
  - "古典專制控制經濟，而極權主義只控制政治與軍事機構"
  - "極權主義只是專制更極端的版本，差異只在鎮壓規模"
  - "古典專制使用意識形態正當化其統治，而極權主義純粹依靠軍事力量"
explanation: >-
  Arendt 主張，極權主義與古典專制有根本差異。它不只是更極端的暴政，而是一種使人成為多餘之物、摧毀其獨立行動能力的制度。對 Arendt 而言，政治是一個人民掌握自身命運的能力，而極權主義正是這種能力的否定，因此它與專制有質的不同。
reviewed: false
