question: ทำไม Simplicity จึงไม่ใช้การจัดสรรหน่วยความจำแบบ dynamic ระหว่าง execution?
answer: เพื่อให้ทำ static analysis ได้และตัด bug กับการโจมตีทั้งกลุ่มออกไป.
wrong_answers:
  - เพราะ Liquid Network ไม่รองรับปฏิบัติการหน่วยความจำระดับต่ำ.
  - เพื่อลดความชันของการเรียนรู้การเขียนโปรแกรมสำหรับนักพัฒนา smart contract มือใหม่.
  - เพราะ Bitcoin Script เองก็ไม่มีการจัดสรรหน่วยความจำแบบ dynamic เช่นกัน.
explanation: >-
  Simplicity หลีกเลี่ยงการจัดสรรหน่วยความจำแบบ dynamic เพื่อให้สามารถกำหนด
  การใช้ทรัพยากรทั้งหมดได้แบบ statically ก่อน execution สิ่งนี้ทำให้ขอบเขต
  ทรัพยากรคาดการณ์ได้และกำจัดช่องโหว่ที่เกี่ยวข้องกับการจัดการหน่วยความจำ
  ซึ่งเป็นเรื่องสำคัญในบริบทของการตรวจสอบความถูกต้องบนบล็อกเชน.
reviewed: false
