question: "ลิเบอร์ทาเรียนที่อนุรักษนิยมทางวัฒนธรรมจัดการกับพฤติกรรมที่ตนไม่เห็นด้วยทางศีลธรรมอย่างไร?"
answer: "พวกเขาคัดค้านและห้ามปรามพฤติกรรมเหล่านั้นผ่านการโน้มน้าวและตัวอย่าง แต่ไม่พึ่งพากำลังบังคับของกฎหมาย"
wrong_answers:
  - "พวกเขาสนับสนุนการห้ามพฤติกรรมเหล่านั้นโดยรัฐบาลท้องถิ่น ขณะคัดค้านการห้ามระดับรัฐบาลกลาง"
  - "พวกเขานิ่งเงียบอย่างสมบูรณ์ต่อพฤติกรรมเหล่านั้น เพราะเชื่อว่าการไม่เห็นด้วยในรูปแบบใด ๆ ละเมิดเสรีภาพส่วนบุคคล"
  - "พวกเขาสนับสนุนศาลชุมชนที่สามารถลงโทษพฤติกรรมเหล่านั้นนอกระบบกฎหมายทางการ"
explanation: >-
  ลิเบอร์ทาเรียนที่อนุรักษนิยมทางวัฒนธรรมอาจไม่เห็นด้วยทางศีลธรรมกับพฤติกรรมบางอย่าง แต่ไม่สนับสนุนการห้ามทางกฎหมายต่อการกระทำที่มีการยินยอมและไม่ก้าวร้าว พวกเขาอาจไม่ชอบการกระทำเช่นนั้น คัดค้าน และพยายามห้ามปรามอย่างจริงจัง แต่เสมอผ่านการโน้มน้าว การศึกษา และตัวอย่าง แทนที่จะผ่านกำลังบังคับของกฎหมาย เรื่องนี้ไม่ใช่การนิ่งเงียบหรือการสร้างกลไกบังคับใช้อื่นขึ้นมา
reviewed: false
