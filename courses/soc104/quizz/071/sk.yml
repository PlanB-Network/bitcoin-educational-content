question: "Aký opakujúci sa analytický rámec formuje socialistickú pozíciu v každej z piatich spoločenských debát (manželstvo, imigrácia, strelné zbrane, drogy, sladené nápoje)?"
answer: "Konfliktný rámec medzi dominantnými a ovládanými, v ktorom je spoločnosť štruktúrovaná útlakom a štát musí zasiahnuť na ochranu zraniteľnej skupiny"
wrong_answers:
  - "Utilitaristický rámec zameraný na maximalizáciu celkového šťastia a ekonomickej produktivity pre čo najväčší počet občanov"
  - "Rámec prirodzených práv, v ktorom musia byť individuálne slobody chránené pred štátnymi aj korporátnymi zásahmi"
  - "Tradicionalistický rámec, v ktorom sa zavedené spoločenské inštitúcie musia zachovať pred rušivými modernými zmenami"
explanation: >-
  Socialistická pozícia naprieč spoločenskými debatami je dôsledne formovaná konfliktným rámcom dominantných a ovládaných. Pri manželstve ide o heterosexuálnu väčšinu utláčajúcu homosexuálnu menšinu. Pri imigrácii sú obmedzenia založené na štátnej príslušnosti formami útlaku. Pri strelných zbraniach by silou mal disponovať iba štát, aby chránil zraniteľných. Pri sladených nápojoch priemyselníci profitujú zo zraniteľnosti najmenej chránených. Táto optika utláčateľa a utláčaného sa reprodukuje v mnohých oblastiach vrátane rodu, rasy a dokonca aj vzťahu medzi ľudstvom a prírodou.
