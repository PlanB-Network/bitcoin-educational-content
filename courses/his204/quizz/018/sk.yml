question: Čo sú Cantillonove efekty?
answer: Zvýšenie množstva peňazí v krajine ovplyvňuje rozdelenie príjmov
wrong_answers:
  - Zvýšenie množstva peňazí má vplyv na správanie ľudí
  - Zvýšenie množstva peňazí má vplyv na výšku verejného dlhu
  - Zvýšenie množstva peňazí nemá žiadny významný účinok
explanation: |
  Cantillonove efekty opisujú, ako zvýšenie peňažnej zásoby ovplyvňuje ceny a príjmy odlišne v rôznych sektoroch hospodárstva. Vstrekovanie nových peňazí sa nešíri rovnomerne, čím vytvára deformácie a nerovnosti.
