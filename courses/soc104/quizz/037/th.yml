question: "Milton Friedman เตือนอะไรเกี่ยวกับการตัดสินนโยบายการเมือง?"
answer: "นโยบายควรถูกตัดสินจากผลลัพธ์มากกว่าจากเจตนา"
wrong_answers:
  - "นโยบายควรถูกตัดสินจากคุณธรรมส่วนตัวของนักการเมืองที่เสนอสิ่งเหล่านั้น"
  - "นโยบายควรถูกตัดสินจากความนิยมในหมู่สาธารณชนผู้มีสิทธิเลือกตั้งทั่วไป"
  - "นโยบายควรถูกตัดสินจากว่ามันสอดคล้องกับรัฐธรรมนูญดั้งเดิมของประเทศหรือไม่"
explanation: >-
  Friedman เขียนว่าหนึ่งในความผิดพลาดที่ใหญ่ที่สุดคือการตัดสินนโยบายจากเจตนาแทนที่จะตัดสินจากผลลัพธ์ โดยตั้งข้อสังเกตว่าโครงการที่ติดป้ายว่าเพื่อคนจนแทบจะให้ผลตรงกันข้ามกับสิ่งที่ผู้สนับสนุนตั้งใจไว้เสมอ สิ่งนี้สะท้อนคำสอนของ Bastiat ที่ว่านักเศรษฐศาสตร์ที่ดีพิจารณาทั้งผลระยะสั้นและระยะยาวต่อประชากรทั้งหมด
reviewed: false
