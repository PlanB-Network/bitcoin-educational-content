question: "Что утверждает принцип ненападения?"
answer: "Человек свободен действовать по своему усмотрению до тех пор, пока он не совершает насилия против жизни, свободы или собственности другого"
wrong_answers:
  - "Государство имеет исключительное право применять силу для поддержания социального порядка"
  - "Граждане должны подчиняться власти большинства, даже когда она ограничивает индивидуальные свободы"
  - "Свобода действий допускается только тогда, когда она служит коллективному благу общества"
explanation: >-
  Принцип ненападения — краеугольный камень либертарианской политики: он утверждает, что люди могут действовать свободно при условии, что они не совершают насилия против жизни, свободы или собственности других. Он напоминает золотое правило, встречающееся в разных цивилизациях. В отличие от других вариантов, он не наделяет государство особым моральным авторитетом и не подчиняет индивидуальные права коллективной пользе.
