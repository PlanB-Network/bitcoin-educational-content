question: "Zašto se Molinarijevo predviđanje iz 1849. pokazalo proročkim u pogledu odnosa između slobode i političke moći?"
answer: "Zato što su se konzervativci i socijalisti smenjivali na vlasti i instrumentalizovali slobodu u službi svojih odgovarajućih političkih ciljeva, tačno kako je opisao"
wrong_answers:
  - "Zato što je lik ekonomiste koji je opisao na kraju stekao političku moć i sproveo libertarijanske politike širom Evrope"
  - "Zato što se njegovo predviđanje da će se sve tri političke porodice spojiti u jedan centristički pokret obistinilo u dvadesetom veku"
  - "Zato što su uzastopne vlade postepeno širile slobodu sve dok ona nije postala primarni organizacioni princip modernih demokratija"
explanation: >-
  Molinarijeva vizija pokazala se proročkom zato što su se, od sredine devetnaestog veka, konzervativci i socijalisti smenjivali na vlasti i činili upravo ono što je opisao: instrumentalizovali slobodu u službi političkih ciljeva. Obe porodice spremne su da ograniče slobode i pozovu državu da nametne njihove odgovarajuće agende, dok je stav ekonomiste o bezuslovnoj slobodi ostao marginalizovan.
reviewed: false
