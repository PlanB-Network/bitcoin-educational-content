question: "Czym jest zasada nieagresji w ujęciu teoretycznym Murraya Rothbarda?"
answer: "Niedopuszczalne jest inicjowanie siły fizycznej przeciwko innej jednostce albo jej własności, choć przemoc obronna jest dozwolona"
wrong_answers:
  - "Wszystkie formy przemocy są zawsze złe, w tym samoobrona i opór wobec opresji"
  - "Przemoc jest dopuszczalna, gdy jest skierowana przeciwko opresyjnym instytucjom, ale nigdy przeciwko innym jednostkom"
  - "Tylko państwo ma uzasadnione prawo użycia siły, a jednostki nigdy nie mogą uciekać się do przemocy"
explanation: >-
  Rothbardowska zasada nieagresji głosi, że inicjowanie siły fizycznej przeciwko innej osobie albo jej własności jest niedopuszczalne. Jest filozoficznym przełożeniem złotej reguły. Nie zakazuje jednak wszelkiej przemocy: przemoc obronna, w tym samoobrona i opór wobec opresji, jest uznawana za uzasadnioną. Odróżnia ją to od czystego pacyfizmu oraz od roszczonego przez państwo monopolu na siłę.
