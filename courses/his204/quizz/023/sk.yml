question: Prečo bol Saint-Pierre vylúčený z Francúzskej akadémie?
answer: Odvážil sa kritizovať vládu Ľudovíta XIV., plnú vojen a prepychu
wrong_answers:
  - Trpel ťažkou chorobou a napoly sa pomätol
  - Odvážil sa podporiť anglického kráľa, dedičného nepriateľa Francúzska
  - Dopustil sa plagiátu iného akademika
explanation: |
  Saint-Pierre bol vylúčený z Francúzskej akadémie za kritiku vlády Ľudovíta XIV., najmä jeho vojen a nadmerných výdavkov. Jeho kritiku považovali za neúctivú voči monarchovi.
