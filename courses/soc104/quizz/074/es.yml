question: "¿Cuál es el concepto de 'riesgo moral' en el contexto del debate sobre las subvenciones, y qué familia política plantea esta preocupación?"
answer: "El riesgo moral es el incentivo a la irresponsabilidad cuando se impide que las empresas fracasen mediante subvenciones, porque al final paga el contribuyente; esta preocupación la plantean los libertarios"
wrong_answers:
  - "El riesgo moral es el riesgo de que las empresas subvencionadas se trasladen a países con impuestos más bajos, llevándose los empleos consigo; esta preocupación la plantean los conservadores"
  - "El riesgo moral es el peligro de que los funcionarios del gobierno se vuelvan corruptos al elegir qué empresas reciben subvenciones; esta preocupación la plantean los centristas"
  - "El riesgo moral es el problema ético de que las empresas exploten a los trabajadores después de recibir fondos públicos; esta preocupación la plantean los socialistas"
explanation: >-
  Los libertarios sostienen que las subvenciones y los rescates crean riesgo moral: cuando se impide que las empresas fracasen, se incentiva la irresponsabilidad y la temeridad porque no hay consecuencias por las malas decisiones. Al final, es el contribuyente quien paga, lo que los libertarios consideran profundamente injusto. Este concepto es distinto de las preocupaciones sobre la reubicación empresarial, la corrupción oficial o la explotación de los trabajadores planteadas por otras familias políticas.
