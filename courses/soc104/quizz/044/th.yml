question: "Green New Deal เป็นตัวแทนของวิวัฒนาการร่วมสมัยของสังคมนิยมประชาธิปไตยอย่างไร?"
answer: "มันใช้ความกังวลด้านสิ่งแวดล้อมเป็นเหตุผลใหม่สำหรับการแทรกแซงของรัฐและการริบรายได้เอกชน โดยทำให้ผลประโยชน์ส่วนบุคคลอยู่ใต้สุขภาพของโลกร่วมกัน"
wrong_answers:
  - "มันละทิ้งเศรษฐศาสตร์สังคมนิยมแบบดั้งเดิมทั้งหมด เพื่อหันไปใช้ทางออกแบบตลาดเสรีต่อปัญหาสิ่งแวดล้อมผ่านการค้าคาร์บอน"
  - "มันปฏิเสธการแทรกแซงของรัฐ และพึ่งพาการกระทำโดยสมัครใจของปัจเจกบุคคลและนวัตกรรมภาคเอกชนเพื่อรับมือการเปลี่ยนแปลงภูมิอากาศแทน"
  - "มันเป็นการแยกตัวจากสังคมนิยมโดยให้ความสำคัญกับการคุ้มครองสิ่งแวดล้อมเหนือข้อกังวลด้านความยุติธรรมทางสังคมและการจ้างงานทั้งหมด"
explanation: >-
  Green New Deal หลอมรวมความกังวลด้านสิ่งแวดล้อมเข้ากับวัตถุประสงค์ทางสังคม โดยผสมผสานการเปลี่ยนผ่านทางนิเวศกับความยุติธรรมทางสังคม การรับประกันการจ้างงาน และบริการสาธารณะที่เข้มแข็งขึ้น ผลประโยชน์ส่วนบุคคลถูกทำให้อยู่ใต้ผลประโยชน์ส่วนรวมที่กำหนดโดยสุขภาพของโลก โดยแก่นของมัน มันให้เปลือกวาทกรรมใหม่ที่ทำให้การแทรกแซงของรัฐและการริบรายได้เอกชนดูมีเหตุผล ไม่ใช่เพียงในนามของความยุติธรรมทางสังคมอีกต่อไป แต่ยังในนามของสิ่งแวดล้อมด้วย
reviewed: false
