question: "Hoe definieert de structurele benadering het fundamentele verschil tussen socialisme en libertarisme?"
answer: "Socialisme geeft voorrang aan de staat via regulering, planning en controle, terwijl libertarisme voorrang geeft aan het individu via minimale staatsinterventie"
wrong_answers:
  - "Socialisme geeft prioriteit aan landelijke landbouwgemeenschappen, terwijl libertarisme stedelijke industriële ontwikkeling verkiest"
  - "Socialisme wordt gedefinieerd door zijn steun voor democratische verkiezingen, terwijl libertarisme alle vormen van politieke participatie verwerpt"
  - "Socialisme richt zich op buitenlands beleid en internationale samenwerking, terwijl libertarisme zich alleen bezighoudt met binnenlandse economische kwesties"
explanation: >-
  Structureel wordt socialisme gekenmerkt door de alomtegenwoordigheid van de staat, die reguleert, plant en controleert. Libertarisme wordt gedefinieerd door minimale staatsinterventie in de economie en het privéleven, met een tendens naar het primaat van individuele vrijheid en de vrije markt. Dit structurele onderscheid is analytisch veel nuttiger dan het vergelijken van de uitgesproken intenties van elk systeem.
reviewed: false
