question: "Totaliter rejimler neden 'seküler dinler' olarak tanımlanmıştır ve bu, totalitarizmin var olabilmesi için gerekli koşullar hakkında neyi ortaya koyar?"
answer: "Militanlardan yarı-dinî bir iman talep eder ve muhaliflere karşı korkuyu kullanırlar; totalitarizm ise tüm özelliklerin aynı anda bulunmasını gerektirir: bastırılmış özgürlükler, tek parti yönetimi, şiddet içeren devrim ve güdümlü ekonomi"
wrong_answers:
  - "Geleneksel ibadetin yerine devlet törenlerini koyarlar ve totalitarizm yalnızca karizmatik bir lider ile askerî kontrol gerektirir"
  - "Devlet ideolojisini uygulatmak için dinî kurumları kullanırlar ve totalitarizm tek bir siyasi parti parlamentoya hâkim olduğunda ortaya çıkabilir"
  - "Siyasi eylem yoluyla ruhsal kurtuluş vaat ederler ve totalitarizm, siyasi özgürlüklerden bağımsız olarak devlet ekonomiyi kontrol ettiğinde var olur"
explanation: >-
  Raymond Aron, totaliter rejimlerin iki ilke üzerinde işlediğini gözlemledi: militanların imanı ve muhaliflerin korkusu. Bu yarı-dinî fanatizm, farklı motivasyonlarının ötesinde onları karakterize eder ve onlara seküler dinler etiketi kazandırır. Kritik olarak, totalitarizm tüm tanımlayıcı özelliklerin aynı anda bulunmasını gerektirir: bastırılmış özgürlükler, tek parti aracılığıyla sınırsız otorite, şiddet içeren devrim ve güdümlü ekonomi. Modern demokrasiler bu özelliklerin bazılarını sergileyebilir, ancak totalitarizm yalnızca hepsi bir araya geldiğinde mevcuttur.
