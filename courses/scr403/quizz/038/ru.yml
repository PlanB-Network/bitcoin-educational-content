question: "Джет half-agg-verify записывает множество кортежей как эффект Writer. По критерию коммутативность/идемпотентность/унитарность, чего достигает конструкция с множеством, и чего всё ещё не хватает?"
answer: "Коммутативна и идемпотентна (как того требует Simplicity), но не унитарна: отбрасывание вызова удалило бы его кортеж и пропустило бы подпись."
wrong_answers:
  - Идемпотентна и унитарна, но не коммутативна, поскольку агрегат должен объединять r-компоненты в порядке подписания.
  - Все три свойства сразу, поэтому оптимизатор может свободно дублировать, переупорядочивать или отбрасывать вызовы без всякого риска.
  - Коммутативна, но не идемпотентна, поскольку запись одного и того же кортежа дважды потребовала бы двух s-компонент агрегата.
explanation: >-
  Если рассматривать журнал writer'а как множество, эффект становится
  идемпотентным и коммутативным, поскольку сама вставка в множество
  обладает обоими этими свойствами — именно теми двумя, которые
  Simplicity требует от каждого эффекта. Унитарность по-прежнему
  недостижима: как и Failure, запись влияет на действительность
  транзакции, поскольку транзакция действительна только тогда, когда
  s-компонента агрегата покрывает каждый записанный кортеж. Поэтому
  выражение, выполняющее запись, нельзя отбросить только потому, что
  его выход типа unit не используется, — иначе его кортеж бесследно
  исчез бы из проверки полу-агрегации.
reviewed: false
