question: Защо Simplicity използва статичен анализ вместо динамичен gas модел като Ethereum?
answer: За да определи границите на ресурсите преди началото на изпълнението, което дава предвидими разходи.
wrong_answers:
  - Защото статичният анализ просто е много по-бърз за имплементиране от разработчиците.
  - Защото собственият gas модел на Ethereum е бил патентован и следователно недостъпен.
  - Защото програмите на Simplicity са твърде кратки, за да имат някога реална нужда от измерване.
explanation: >-
  Статичният анализ на Simplicity позволява на мрежата да знае точно колко
  изчисления изисква дадена програма, преди тя да се изпълни. Това елиминира
  непредвидимостта на динамичното измерване, предотвратява отказ от услуга
  чрез изчерпване на ресурси и позволява на възлите да отхвърлят програми,
  които надвишават лимитите, без да хабят изчисления.
reviewed: false
