question: "Kwa nini tawala za kitotalitari zimeelezwa kama 'dini za kisekula,' na hili linafichua nini kuhusu masharti yanayohitajika ili utotalitari uwepo?"
answer: "Hudai imani inayofanana na ya kidini kutoka kwa wanaharakati na hutumia hofu dhidi ya wapinzani, na utotalitari unahitaji sifa zote kwa wakati mmoja: uhuru uliokandamizwa, utawala wa chama kimoja, mapinduzi ya vurugu, na uchumi unaoelekezwa"
wrong_answers:
  - "Huchukua nafasi ya ibada za jadi kwa sherehe za dola, na utotalitari unahitaji tu kiongozi mwenye mvuto na udhibiti wa kijeshi"
  - "Hutumia taasisi za kidini kutekeleza itikadi ya dola, na utotalitari unaweza kuibuka wakati wowote chama kimoja cha kisiasa kinapotawala bunge"
  - "Huahidi wokovu wa kiroho kupitia hatua ya kisiasa, na utotalitari upo wakati wowote dola inapodhibiti uchumi bila kujali uhuru wa kisiasa"
explanation: >-
  Raymond Aron aliona kwamba tawala za kitotalitari hufanya kazi kwa misingi miwili: imani ya wanaharakati na hofu ya wapinzani. Ushabiki huu unaofanana na dini huzitambulisha zaidi ya motisha zao tofauti, na kuzipa lebo ya dini za kisekula. Muhimu zaidi, utotalitari unahitaji sifa zote zinazoufafanua kwa wakati mmoja: uhuru uliokandamizwa, mamlaka isiyo na kikomo kupitia chama kimoja, mapinduzi ya vurugu, na uchumi unaoelekezwa. Demokrasia za kisasa zinaweza kuonyesha baadhi ya sifa hizi, lakini utotalitari upo tu pale zote zinapokusanywa pamoja.
