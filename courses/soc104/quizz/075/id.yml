question: "Di semua lima perdebatan ekonomi (pajak, upah minimum, layanan kesehatan, lingkungan, subsidi), pola konsisten apa yang membedakan metode sentris dari posisi keluarga politik lain?"
answer: "Kaum sentris menolak berkomitmen pada prinsip tetap dan sebaliknya menuntut analisis empiris serta evaluasi ahli untuk menentukan kebijakan kasus per kasus, sehingga pendekatan mereka secara inheren teknokratis"
wrong_answers:
  - "Kaum sentris selalu mengadopsi posisi tengah antara sikap sosialis dan konservatif, membagi selisih secara setara pada setiap isu"
  - "Kaum sentris secara konsisten memprioritaskan pertumbuhan ekonomi di atas kesejahteraan sosial, berpihak pada libertarian dalam kebijakan fiskal sambil sepakat dengan sosialis dalam regulasi"
  - "Kaum sentris menyerahkan semua keputusan ekonomi kepada organisasi internasional dan perjanjian perdagangan alih-alih membuat kebijakan nasional yang independen"
explanation: >-
  Di semua lima perdebatan ekonomi, pendekatan sentris mengikuti pola yang sama: alih-alih berkomitmen pada prinsip ideologis tetap, kaum sentris menuntut bukti empiris dan evaluasi ahli sebelum membuat keputusan. Pada pajak, tingkat yang tepat harus ditentukan melalui analisis. Pada upah minimum, tingkatnya harus disesuaikan secara pragmatis. Pada layanan kesehatan, perpaduan yang dikalibrasi oleh ahli adalah ideal. Pada lingkungan, kebijakan harus menyeimbangkan daya saing. Pada subsidi, setiap kasus harus dievaluasi berdasarkan kelebihannya sendiri. Ini membuat sentrisme secara inheren teknokratis, yang berbeda dari sekadar membagi selisih atau tunduk pada badan internasional.
reviewed: false
