question: "Was besagt das Nichtaggressionsprinzip?"
answer: "Eine Person ist frei, so zu handeln, wie sie möchte, solange keine Gewalt gegen das Leben, die Freiheit oder das Eigentum eines anderen verübt wird"
wrong_answers:
  - "Der Staat hat das alleinige Recht, Gewalt einzusetzen, um die soziale Ordnung aufrechtzuerhalten"
  - "Bürger müssen sich der Mehrheitsentscheidung unterwerfen, selbst wenn sie individuelle Freiheiten einschränkt"
  - "Handlungsfreiheit ist nur erlaubt, wenn sie dem kollektiven Wohl der Gesellschaft zugutekommt"
explanation: >-
  Das Nichtaggressionsprinzip ist ein Eckpfeiler libertärer Politik und besagt, dass Individuen frei handeln dürfen, sofern sie keine Gewalt gegen das Leben, die Freiheit oder das Eigentum anderer verüben. Es erinnert an die goldene Regel, die sich in allen Zivilisationen findet. Anders als die anderen Optionen gewährt es dem Staat keine besondere moralische Autorität und ordnet individuelle Rechte nicht dem kollektiven Nutzen unter.
