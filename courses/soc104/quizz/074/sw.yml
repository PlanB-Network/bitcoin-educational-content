question: "Dhana ya 'moral hazard' ni nini katika muktadha wa mjadala wa ruzuku, na ni familia gani ya kisiasa inayoibua wasiwasi huu?"
answer: "Moral hazard ni kichocheo kuelekea kutowajibika wakati kampuni zinazuiwa kufeli kupitia ruzuku, kwa sababu hatimaye mlipa kodi ndiye hulipa; wasiwasi huu huibuliwa na walibertaria"
wrong_answers:
  - "Moral hazard ni hatari kwamba kampuni zinazopokea ruzuku zitahamia nchi zenye kodi ndogo, zikichukua ajira pamoja nazo; wasiwasi huu huibuliwa na wahafidhina"
  - "Moral hazard ni hatari kwamba maafisa wa serikali watakuwa mafisadi kwa kuchagua kampuni zipi zipokee ruzuku; wasiwasi huu huibuliwa na wenye msimamo wa kati"
  - "Moral hazard ni tatizo la kimaadili la kampuni kuwanyonya wafanyakazi baada ya kupokea fedha za umma; wasiwasi huu huibuliwa na wanajamaa"
explanation: >-
  Walibertaria husema kwamba ruzuku na uokoaji wa kifedha huunda moral hazard: kampuni zinapozuiwa kufeli, hilo huchochea kutowajibika na uzembe kwa sababu hakuna matokeo kwa maamuzi mabaya. Mwishowe, mlipa kodi ndiye hulipa, jambo ambalo walibertaria huliona kuwa lisilo la haki kabisa. Dhana hii ni tofauti na wasiwasi kuhusu kampuni kuhamia nchi nyingine, ufisadi wa maafisa, au unyonyaji wa wafanyakazi unaoibuliwa na familia nyingine za kisiasa.
