question: Gournay කවයේ ලේඛනවල විශේෂත්වය කුමක්ද?
answer: මේවා ප්‍රධාන වශයෙන් විදේශීය කතුවරුන්ගේ පරිවර්තන වේ
wrong_answers:
  - ඒවා සියල්ල ආර්ථික ලිබරල්වාදය ආරක්ෂා කරන ලේඛන වේ
  - මේවා ආර්ථික විද්‍යාව විද්‍යාත්මකව අධ්‍යයනය කිරීම පිළිබඳ නිබන්ධන වේ
  - මේවා උපහාසාත්මක ප්‍රකාශන වේ
explanation: |
  Gournay කවය ඉංග්‍රීසි සහ ඩච් ආර්ථික කෘති පරිවර්තනය කිරීම සඳහා ප්‍රසිද්ධය. එමගින් ප්‍රංශය තුළ ලිබරල් අදහස් පැතිරවීමට උපකාර විය.
