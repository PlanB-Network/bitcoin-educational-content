question: "Hva sier ikke-aggresjonsprinsippet?"
answer: "En person står fritt til å handle som de ønsker, så lenge det ikke begås vold mot en annens liv, frihet eller eiendom"
wrong_answers:
  - "Staten har enerett til å bruke makt for å opprettholde sosial orden"
  - "Borgere må underordne seg flertallsstyre selv når det begrenser individuelle friheter"
  - "Handlingsfrihet er bare tillatt når den gagner samfunnets kollektive gode"
explanation: >-
  Ikke-aggresjonsprinsippet er en hjørnestein i libertariansk politikk, og sier at individer kan handle fritt så lenge de ikke begår vold mot andres liv, frihet eller eiendom. Det minner om den gylne regel som finnes på tvers av sivilisasjoner. I motsetning til de andre alternativene gir det ikke staten noen særskilt moralsk autoritet eller underordner individuelle rettigheter kollektiv nytte.
reviewed: false
