question: Constituent Assembly වෙත ඉදිරිපත් කළ පනත් කෙටුම්පතකදී, Dupont de Nemours තහනම් කිරීමට යෝජනා කළේ කුමක්ද?
answer: ආක්‍රමණකාරී යුද්ධ
wrong_answers:
  - වෙළඳ යුද්ධ
  - ආරක්ෂක යුද්ධ
  - සියලුම යුද්ධ
explanation: |
  Physiocratic මූලධර්මවලට අනුකූලව Dupont de Nemours ආක්‍රමණකාරී යුද්ධ තහනම් කිරීමට යෝජනා කළේය, මන්ද ඔහු ඒවා ආර්ථික සමෘද්ධියට සහ ජනතාවගේ සුභසිද්ධියට හානිකර යැයි සැලකූ බැවිනි.