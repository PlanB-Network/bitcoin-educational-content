question: "व्यक्तिगत स्वतंत्रता की श्रेणी में क्या शामिल है?"
answer: "आप अपने निजी संबंधों में, अपनी राय, विश्वासों, और अपने शरीर तथा मन से जुड़ी हर चीज़ में क्या करते हैं"
wrong_answers:
  - "आप एक उत्पादक के रूप में क्या करते हैं, जिसमें व्यवसाय शुरू करना, कर्मचारियों को नियुक्त करना और वस्तुओं का व्यापार करना शामिल है"
  - "आप कितना कर चुकाते हैं, कौन-से निवेश करते हैं, और अपनी वित्तीय संपत्तियों का प्रबंधन कैसे करते हैं"
  - "बाज़ार में प्रतिस्पर्धा करने, अपने उत्पादों की कीमतें तय करने, और अपने आपूर्तिकर्ताओं को चुनने की आपकी क्षमता"
explanation: >-
  व्यक्तिगत स्वतंत्रता में आपके निजी संबंधों में, आपकी राय और विश्वासों के साथ, और आपके अपने शरीर तथा मन से जुड़ी हर चीज़ में आप क्या करते हैं, यह शामिल है। इसमें विवाह, पढ़ने के विकल्प, धार्मिक प्रथाएँ, भोजन और दवा के विकल्प, और आप किन लोगों से जुड़ते हैं, शामिल हैं। व्यावसायिक गतिविधियाँ, कर, और बाज़ार के निर्णय आर्थिक स्वतंत्रता के अंतर्गत आते हैं।
