question: "Neno 'holism' linamaanisha nini katika muktadha wa falsafa ya kisoshalisti?"
answer: "Maono ya jamii kama kitu kizima kisichogawanyika ambapo mkusanyiko hupewa kipaumbele juu ya mtu binafsi"
wrong_answers:
  - "Falsafa inayomtazama kila mtu binafsi kama kitengo kinachojitosheleza ambacho haki zake haziwezi kuzidiwa na kundi lolote"
  - "Nadharia ya kiuchumi inayotetea kusawazisha sekta za umma na binafsi kwa kipimo sawa"
  - "Mkakati wa kisiasa unaounganisha mitazamo yote ya makundi madogo katika jukwaa moja lenye msingi wa makubaliano"
explanation: >-
  Holism hutokana na Kigiriki 'holos' linalomaanisha 'kitu kizima.' Katika fikra za kisoshalisti, hurejelea maono ya jamii kama kitu kizima kisichogawanyika badala ya jumla rahisi ya watu binafsi. Dola ya kisoshalisti hulenga kuchukua jukumu la kusimamia na kuelekeza shughuli za binadamu kwa kiwango cha juu kabisa. Mkusanyiko huu unaweza kuwakilishwa kama tabaka la kijamii, taifa, rangi, au jinsia, lakini katika kila hali mtu binafsi hufafanuliwa kwa uanachama wa kundi.
