question: "چرا لیبرال‌های کلاسیک در ایالات متحده از دههٔ 1960 به بعد شروع کردند خود را 'لیبرتارین' بنامند؟"
answer: "برای متمایزکردن خود از لیبرال‌های آمریکایی، زیرا معنای «لیبرال» در آمریکا به‌سوی مداخله‌گرایی دولتی تغییر کرده بود"
wrong_answers:
  - "برای همسوکردن خود با حزب دموکرات و برنامه‌های اجتماعی ترقی‌خواهانهٔ آن"
  - "برای اعلام حمایت خود از اصلاحات Great Society لیندون بی. جانسون"
  - "برای پذیرفتن هویتی انقلابی‌تر، الهام‌گرفته از جنبش‌های سوسیالیستی اروپایی"
explanation: >-
  در ایالات متحده، واژهٔ 'لیبرال' به معنای حامیان Big Government و مداخلهٔ دولت تغییر کرد، به‌ویژه پس از New Deal و Great Society. لیبرال‌های کلاسیک برچسب 'لیبرتارین' را پذیرفتند تا معنای اصلی فلسفهٔ خود را حفظ کنند. آن‌ها خود را از لیبرال‌های آمریکایی دور می‌کردند، نه اینکه با آن‌ها همسو شوند.
reviewed: false
