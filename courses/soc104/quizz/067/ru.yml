question: "Какова консервативная позиция по вопросу иммиграции?"
answer: "Государство имеет суверенное право контролировать свои границы для защиты национальной безопасности и культурной идентичности"
wrong_answers:
  - "Границы должны быть безусловно открыты, потому что дискриминационные ограничения нарушают права человека"
  - "Иммиграция должна определяться рыночным спросом, а граждане должны договорным образом решать свои отношения с иностранцами"
  - "Иммиграционная политика должна уравновешивать экономические потребности с успешной интеграцией на основе экспертной оценки"
explanation: >-
  Консерваторы считают, что порядок, идентичность и национальный суверенитет должны иметь приоритет над неограниченным приёмом иностранцев или беженцев. Границы и чётко определённое население являются частью цивилизованных ценностей. Неверные ответы представляют социалистическую позицию (открытые границы как права человека), либертарианскую позицию (рыночная иммиграция) и центристскую позицию (сбалансированный подход, основанный на экспертной оценке).
reviewed: false
