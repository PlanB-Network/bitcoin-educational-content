question: "左派と右派の国家統制主義者が共有する政治的目的は何か？"
answer: "権力を獲得し、自分たちの世界観に従って社会を組織し、それを全員に押し付けること"
wrong_answers:
  - "政府の規模を縮小し、意思決定権を個々の市民に戻すこと"
  - "すべての市民がすべての立法上の決定に投票する直接民主制を確立すること"
  - "政党を廃止し、独立したテクノクラート統治に置き換えること"
explanation: >-
  左派と右派の国家統制主義者は、同じ政治的目的を共有している。
  それは、権力を獲得し、自分たちの世界観に従って社会を組織し、立法を通じてそれを全員に押し付けることである。
  違いは価値観にしかない。
  右派は文明の防衛を持ち出し、左派は労働者階級や抑圧された人々の防衛を持ち出す。
  どちらも政府を縮小したり政党を廃止したりしようとしているわけではない。
reviewed: false
