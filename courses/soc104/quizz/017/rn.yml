question: "Ni iyihe ntumbero ya politike abashyigikiye ububasha bwa Leta bo mu bumoso n'abo mu buryo bw'iburyo basangiye?"
answer: "Gutsinda ubutegetsi kugira ngo batunganye ikibano bisunze uko babona isi kandi babihate bose"
wrong_answers:
  - "Kugabanya ubunini bwa Leta no gusubiza ububasha bwo gufata ingingo ku benegihugu ku giti cabo"
  - "Gushinga demokarasi idaciye ku baserukizi aho umwenegihugu wese atora ku ngingo yose y'amategeko"
  - "Gukuraho imigambwe ya politike no kuyisubiriza intwaro y'abahinga bigenga"
explanation: >-
  Abashyigikiye ububasha bwa Leta bo mu bumoso n'abo mu buryo bw'iburyo basangiye intumbero imwe ya politike: gutsinda ubutegetsi kugira ngo batunganye ikibano bisunze uko babona isi kandi babihate bose biciye mu mategeko. Itandukaniro riri gusa mu ndangagaciro zabo: iburyo havuga gukingira ubusivilizasioni, mu gihe ibumoso havuga gukingira umugwi w'abakozi canke abahahazwa. Nta ruhande na rumwe rurondera kugabanya Leta canke gukuraho imigambwe.
