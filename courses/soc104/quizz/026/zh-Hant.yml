question: "在歐洲政治傳統中，'liberal' 一詞是什麼意思？"
answer: "laissez-faire 經濟、減少國家干預與個人自由的支持者"
wrong_answers:
  - "國家干預、公共醫療保險與反貧困計畫的倡導者"
  - "尋求徹底廢除政府與私有財產的激進無政府主義者"
  - "在所有政策領域同等平衡社會主義與保守主義立場的中間主義者"
explanation: >-
  在歐洲，liberalism 一直與 laissez-faire 經濟政策、減少國家干預，以及捍衛個人自由相關。第一個錯誤答案描述的是美國 liberals，他們已經把該詞的含義轉向干預主義。歐洲 liberalism 既不是無政府主義，也不是中間主義。
reviewed: false
