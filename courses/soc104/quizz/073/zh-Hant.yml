question: "保守主義者與自由至上主義者在最低工資上的立場，雖然都支持廢除，卻在推理上有何不同？"
answer: "如果不妨礙競爭力，保守主義者接受國家在工資設定上的某些參與；而自由至上主義者把最低工資視為對雇用自由與經商自由的道德強加"
wrong_answers:
  - "保守主義者反對最低工資，因為它會製造通貨膨脹；自由至上主義者反對它，因為它給予工會過多權力"
  - "保守主義者希望工資由宗教與社群機構設定，而自由至上主義者希望工資由政府批准的市場研究決定"
  - "保守主義者認為最低工資應按地區不同而異，而自由至上主義者認為應在全國適用單一固定工資"
explanation: >-
  兩者都支持降低或廢除最低工資，但其推理有根本差異。保守主義者接受國家在工資設定上有某些參與，同時堅持它必須保持最低且取決於脈絡，並著重於競爭力。自由至上主義者採取更強的道德立場：最低工資是對雇用自由與經商自由的強加。當自由至上主義者說「市場」時，他們指的是契約，由兩方在沒有國家干預下自由協商。
reviewed: false
