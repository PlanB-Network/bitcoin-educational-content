question: "Cum constituie împreună cele trei funcții esențiale ale pieței libere, așa cum sunt descrise de libertarieni, atât un sistem eficient, cât și unul etic de organizare socială?"
answer: "Prețurile oferă o busolă pentru decizii, piața dezvăluie preferințe autentice prin cerere și ofertă, iar schimbul liber le permite indivizilor să își gestioneze propriile treburi potrivit valorilor personale, combinând eficiența informațională cu autonomia morală"
wrong_answers:
  - "Piața maximizează bogăția totală, previne monopolurile prin competiție naturală și asigură distribuția egală a resurselor, combinând productivitatea cu justiția socială"
  - "Piețele libere reduc cheltuielile guvernamentale, stimulează inovația tehnologică și creează oportunități de angajare, combinând responsabilitatea fiscală cu creșterea economică"
  - "Piețele scad prețurile pentru consumatori, cresc calitatea produselor prin competiție și extind comerțul internațional, combinând prosperitatea internă cu cooperarea globală"
explanation: >-
  Argumentul libertarian pentru piața liberă se sprijină pe trei funcții interconectate. În primul rând, prețurile servesc drept indicatori fiabili care ghidează deciziile economice și sociale (busola). În al doilea rând, piața dezvăluie preferințele individuale autentice prin cerere și ofertă. În al treilea rând, schimbul liber le permite actorilor să își gestioneze propriile treburi potrivit valorilor personale. Hayek a arătat că piețele libere coordonează informația dispersată mai bine decât planificarea centrală (eficiență), în timp ce consimțământul reciproc respectă demnitatea umană mai mult decât coerciția (justiție).
