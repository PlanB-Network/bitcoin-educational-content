question: "Hoe versterkt het fiatgeldsysteem de kloof tussen bestuurders en bestuurden?"
answer: "Het stelt regeringen in staat onbeperkte uitgaven te financieren via geldcreatie, waardoor spaargeld door inflatie in waarde daalt"
wrong_answers:
  - "Het geeft burgers directe controle over monetair beleid via democratische verkiezingen en referenda"
  - "Het verhindert regeringen om te lenen, waardoor ze voor inkomsten uitsluitend op belastingen moeten vertrouwen"
  - "Het verdeelt nieuw gecreëerd geld gelijkelijk onder alle burgers om economische groei te stimuleren"
explanation: >-
  Fiatgeld wordt beschreven als de hoeksteen van de uitbreiding van staatsmacht omdat het regeringen in staat stelt te lenen en banken ertoe aan te zetten nieuw geld te drukken. De daaruit voortvloeiende inflatie vermindert de waarde van het spaargeld van mensen, ten voordele van de rijkste en machtigste entiteiten. Het geeft burgers geen monetaire controle, verhindert lenen niet en verdeelt geld ook niet gelijkelijk.
reviewed: false
