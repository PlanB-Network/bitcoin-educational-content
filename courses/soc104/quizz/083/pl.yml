question: "Na czym polega kluczowe rozróżnienie między byciem pro-business a byciem pro-market?"
answer: "Zwolennicy pro-business szukają interwencji państwa, aby chronić konkretne firmy przed upadkiem, podczas gdy zwolennicy pro-market popierają deregulację i pozwalają firmom upadać, aby rynek mógł naturalnie się reorganizować"
wrong_answers:
  - "Zwolennicy pro-business skupiają się na dużych korporacjach, podczas gdy zwolennicy pro-market skupiają się wyłącznie na wspieraniu małych firm i startupów"
  - "Pro-business to stanowisko lewicowe sprzyjające spółdzielniom pracowniczym, podczas gdy pro-market to stanowisko prawicowe sprzyjające własności prywatnej"
  - "Zwolennicy pro-business odrzucają wszelką konkurencję, podczas gdy zwolennicy pro-market popierają regulowaną przez rząd konkurencję między zatwierdzonymi przedsiębiorstwami"
explanation: >-
  Stanowisko pro-business postrzega konkurencję jako instrument rządzenia uzyskiwany poprzez regulacje i uzasadnia dotacje oraz bailouty zapobieganiem utracie miejsc pracy. W ujęciu pro-business rynek jest kruchy i potrzebuje ratunku ze strony państwa. Zwolennicy pro-market widzą konkurencję jako naturalny rezultat wolnej przedsiębiorczości, co oznacza deregulację i pozwalanie firmom upadać, ponieważ porażka pozwala rynkowi naturalnie się reorganizować i otwiera pole dla bardziej kompetentnych aktorów.
reviewed: false
