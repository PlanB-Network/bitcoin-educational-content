question: ⟨⟨1,1⟩,1⟩ (1+1+1) මත full-adder එක trace කරන්න. stage two, O O H ▵ (O I H ▵ I H ⨾ half-adder), final stage එකට ලබා දෙන්නේ කුමන value එකද?
answer: ⟨1, ⟨0, 1⟩⟩ — පළමු half-adder හි carry එක, ඉන්පසු දෙවන එකේ carry සහ sum.
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ — පළමු half-adder හි carry එක, ඉන්පසු දෙවන එකේ sum සහ carry.
  - ⟨0, ⟨0, 1⟩⟩ — පළමු half-adder හි sum bit එක, ඉන්පසු දෙවන එකේ carry සහ sum.
  - ⟨1, ⟨1, 1⟩⟩ — පළමු half-adder හි carry එක, ඉන්පසු දෙවන එකේ OR සහ XOR bits.
