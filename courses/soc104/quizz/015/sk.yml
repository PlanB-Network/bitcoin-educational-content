question: "Ktoré symbolické osobnosti sú na Nolanovom diagrame spojené s maximálnou ekonomickou slobodou?"
answer: "Margaret Thatcher, Ronald Reagan a Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures a Bernie Sanders"
  - "Nelson Mandela, Simone Veil a Noam Chomsky"
  - "Vladimir Putin, Xi Jinping a Joseph de Maistre"
explanation: >-
  Thatcher, Reagan a Milei sú uvádzaní ako symbolické osobnosti maximálnej ekonomickej slobody, ktoré uprednostňujú menej štátnych zásahov, menej regulácií a nižšie dane. Roosevelt, Jaures a Sanders predstavujú opačný koniec, ktorý uprednostňuje štátnu kontrolu ekonomiky. Mandela, Veil a Chomsky predstavujú maximálnu osobnú slobodu. Putin, Xi Jinping a de Maistre predstavujú maximálnu štátnu kontrolu nad osobným životom.
