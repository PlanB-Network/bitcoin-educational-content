description: |
  Zitadelle is a German-language Bitcoin community event taking place on the private island of Obonjan in Croatia from May 28-31, 2026. The four-day gathering brings together 500+ Bitcoin enthusiasts for technical deep-dives, economic discussions, practical workshops, and community networking in a unique island setting. It offers over 30 talks and 15+ workshops covering various aspects of Bitcoin, combined with outdoor activities and community bonding experiences.
