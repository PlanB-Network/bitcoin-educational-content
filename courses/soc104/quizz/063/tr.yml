question: "Eşcinsel evlilik meselesinde liberteryen tutum nedir?"
answer: "Devletin evliliği tanımlamakla işi yoktur; evlilik özelleştirilmeli ve bireylere, derneklere ve dinî kurumlara bırakılmalıdır"
wrong_answers:
  - "Eşcinsel evlilik yasallaştırılmalıdır çünkü tüm yurttaşlar hukuk karşısında eşit muameleyi hak eder"
  - "Eşcinsel evlilik yasaklanmalıdır çünkü geleneksel evlilik üreme için temel bir kurumdur"
  - "Eşcinsel evlilik yasallaştırılmalıdır, ancak yalnızca geleneksel evlilikten ayrı bir hukuki çerçeve üzerinden"
explanation: >-
  Liberteryenler, evlilik sorununun devletçi terimlerle ortaya konduğu için temelden yanlış çerçevelendiğini savunur. Devletin özel hayata müdahale etmekle işi olmadığına inanırlar; bu yüzden çözüm, evliliği devletten tamamen ayırmaktır. Devlet tek bir tanım dayatarak çatışmalar yaratır. İlk yanlış cevap sosyalist veya merkezci tutumu, ikincisi ise muhafazakâr tutumu yansıtır.
