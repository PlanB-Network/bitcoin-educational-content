question: "Vad avslöjar Nolan-diagrammets vertikala axel om den verkliga politiska frågan?"
answer: "Den avslöjar om du vill påtvinga andra dina egna känslor genom staten, eller föredrar att varje person ska vara fri att själv bestämma"
wrong_answers:
  - "Den avslöjar om du stödjer demokratiskt styre eller föredrar auktoritärt styre av en enda ledare"
  - "Den avslöjar om du identifierar dig med progressiva sociala rörelser eller med traditionella religiösa institutioner"
  - "Den avslöjar om din främsta angelägenhet är nationell säkerhet eller ekonomiskt välstånd"
explanation: >-
  Den vertikala axeln blottlägger den verkliga politiska frågan: inte om du är vänster eller höger, utan i vilken utsträckning du vill att staten ska ingripa i att forma samhället enligt dina värden. Vill du påtvinga andra dina känslor, eller föredrar du att varje person ska vara fri att själv bestämma? Denna inramning överskrider vänster-höger-skalan och visar att båda lägren kan vara lika statistiska.
reviewed: false
