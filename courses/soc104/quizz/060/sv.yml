question: "Vilken dold paradox ligger inom centristisk pragmatism?"
answer: "Pragmatismen själv vilar på en form av dogmatism, nämligen den outtalade övertygelsen att endast experter är kompetenta att styra samhället"
wrong_answers:
  - "Centrister påstår sig vara måttfulla men lierar sig konsekvent med vänsterpartier i koalitionsregeringar"
  - "Centristisk politik framstår som balanserad men gynnar alltid ekonomisk tillväxt framför miljöskydd"
  - "Centrister avvisar ideologi men antar rigida frimarknadsprinciper när de fattar ekonomiska beslut"
explanation: >-
  Paradoxen i centristisk pragmatism är att den påstår sig avvisa ideologi till förmån för rationell expertis, men att just detta påstående vilar på en osynlig och outtalad dogm: att endast teknokrater är kapabla att fatta de rätta besluten. Denna övertygelse om att experter ensamma bör styra samhället är i sig ett ideologiskt åtagande, även om centrister inte erkänner den som sådan.
reviewed: false
