question: Ce propune abatele de Saint-Pierre pentru a garanta pacea între națiuni?
answer: Celelalte 3 răspunsuri deodată
wrong_answers:
  - Formarea unui consiliu al națiunilor
  - Instituirea unei armate comune
  - Recurgerea la arbitraj în caz de litigii
explanation: |
  Abatele de Saint-Pierre a propus o serie de măsuri pentru a garanta pacea, printre care un consiliu al națiunilor, o armată comună și arbitrajul. El credea că aceste instituții ar ajuta la rezolvarea pașnică a conflictelor și la prevenirea războaielor.
