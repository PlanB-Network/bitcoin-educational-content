question: "Miks osutus Molinari 1849. aasta ennustus vabaduse ja poliitilise võimu suhte kohta prohvetlikuks?"
answer: "Sest konservatiivid ja sotsialistid on võimul vaheldunud ning instrumentaliseerinud vabaduse oma vastavate poliitiliste eesmärkide teenistusse täpselt nii, nagu ta kirjeldas"
wrong_answers:
  - "Sest tema kirjeldatud majandusteadlase tegelaskuju saavutas lõpuks poliitilise võimu ja rakendas kogu Euroopas libertaarseid poliitikaid"
  - "Sest tema ennustus, et kõik kolm poliitilist perekonda sulanduvad üheks tsentristlikuks liikumiseks, täitus kahekümnendal sajandil"
  - "Sest järjestikused valitsused laiendasid vabadust järk-järgult, kuni sellest sai tänapäevaste demokraatiate peamine korralduspõhimõte"
explanation: >-
  Molinari nägemus osutus prohvetlikuks, sest alates üheksateistkümnenda sajandi keskpaigast on konservatiivid ja sotsialistid võimul vaheldunud ning teinud täpselt seda, mida ta kirjeldas: instrumentaliseerinud vabaduse poliitiliste eesmärkide teenistusse. Mõlemad perekonnad on valmis vabadusi piirama ja kutsuma riiki appi oma vastavate tegevuskavade kehtestamiseks, samas kui majandusteadlase tingimusteta vabaduse positsioon jäi marginaliseerituks.
