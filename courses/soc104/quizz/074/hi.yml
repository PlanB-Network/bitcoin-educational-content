question: "सभी पांच आर्थिक बहसों (कर, न्यूनतम वेतन, स्वास्थ्य सेवा, पर्यावरण, सब्सिडी) में कौन सा स्थिर पैटर्न मध्यमार्गी पद्धति को अन्य राजनीतिक परिवारों की स्थितियों से अलग करता है?"
answer: "मध्यमार्गी किसी स्थिर सिद्धांत के प्रति प्रतिबद्ध होने से इनकार करते हैं और इसके बजाय हर मामले के आधार पर नीति निर्धारित करने के लिए अनुभवजन्य विश्लेषण और विशेषज्ञ मूल्यांकन की मांग करते हैं, जिससे उनका दृष्टिकोण स्वभावतः टेक्नोक्रैटिक बन जाता है"
wrong_answers:
  - "मध्यमार्गी हमेशा समाजवादी और कंजरवेटिव रुखों के बीच मध्य स्थिति अपनाते हैं, और हर मुद्दे पर समान रूप से बीच का रास्ता निकालते हैं"
  - "मध्यमार्गी लगातार सामाजिक कल्याण से ऊपर आर्थिक वृद्धि को प्राथमिकता देते हैं, राजकोषीय नीति पर लिबर्टेरियन के साथ और नियमन पर समाजवादियों के साथ खड़े होते हैं"
  - "मध्यमार्गी स्वतंत्र राष्ट्रीय नीति बनाने के बजाय सभी आर्थिक निर्णय अंतरराष्ट्रीय संगठनों और व्यापार समझौतों को सौंप देते हैं"
explanation: >-
  सभी पांच आर्थिक बहसों में मध्यमार्गी दृष्टिकोण वही पैटर्न अपनाता है: किसी स्थिर वैचारिक सिद्धांत के प्रति प्रतिबद्ध होने के बजाय, मध्यमार्गी निर्णय लेने से पहले अनुभवजन्य साक्ष्य और विशेषज्ञ मूल्यांकन की मांग करते हैं। करों पर, सही स्तर विश्लेषण से निर्धारित होना चाहिए। न्यूनतम वेतन पर, स्तर को व्यवहारिक रूप से समायोजित किया जाना चाहिए। स्वास्थ्य सेवा पर, विशेषज्ञों द्वारा संतुलित मिश्रण आदर्श है। पर्यावरण पर, नीति को प्रतिस्पर्धात्मकता का संतुलन रखना चाहिए। सब्सिडी पर, हर मामले का मूल्यांकन उसकी अपनी विशेषताओं के आधार पर होना चाहिए। यही मध्यमार्ग को स्वभावतः टेक्नोक्रैटिक बनाता है, जो केवल बीच का रास्ता निकालने या अंतरराष्ट्रीय संस्थाओं को निर्णय सौंपने से अलग है।
