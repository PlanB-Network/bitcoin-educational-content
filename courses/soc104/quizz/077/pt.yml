question: "O que tem precedência sobre a liberdade na filosofia política conservadora?"
answer: "A ordem e a tradição, que devem estar firmemente estabelecidas antes que a liberdade possa ser valorizada"
wrong_answers:
  - "A justiça social e a igualdade, que devem ser garantidas antes que os indivíduos possam ser verdadeiramente livres"
  - "A eficiência econômica e os resultados pragmáticos, que determinam quando a liberdade é apropriada"
  - "Os direitos de propriedade individuais, que devem ser protegidos antes que qualquer outra liberdade seja concedida"
explanation: >-
  Para os conservadores, a ordem e a tradição têm precedência sobre a liberdade. Eles argumentam que liberdade demais gera caos e desordem social, de modo que a liberdade só pode ser valorizada depois que a ordem estiver firmemente estabelecida. Isso contrasta com a visão socialista que prioriza a justiça, ou com o foco centrista na eficiência.
