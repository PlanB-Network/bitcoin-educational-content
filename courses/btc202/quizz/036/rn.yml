question: Ni akahe kamaro ka laptop yihariye kuruta mini-PC?
answer: Bateri yayo ikora nk'inverter .
wrong_answers:
  - Biratekanye cane
  - iramara igihe kirekire
  - Ikoresha umuriro muke
explanation: |  
Batiri ya laptop ikora nka UPS isanzwe, igakingira mudasobwa kuzima giturumbuka igihe habaye ikibazo c’umuriro.
reviewed: true
