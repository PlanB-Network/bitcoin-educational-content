question: "Pourquoi Ron Paul soutient-il que la Réserve fédérale est nuisible, et quel est le lien avec Bitcoin dans sa position ?"
answer: "La Réserve fédérale provoque l'inflation et les cycles économiques par la manipulation de la monnaie fiat, et Bitcoin représente une forme de monnaie saine qui pourrait remplacer l'étalon-or"
wrong_answers:
  - "La Réserve fédérale limite la concurrence bancaire, et Bitcoin décentralise les services bancaires pour améliorer l'inclusion financière"
  - "La Réserve fédérale empêche le libre-échange entre les nations, et Bitcoin permet des transactions sans frontières sans approbation gouvernementale"
  - "La Réserve fédérale crée une dette publique excessive, et Bitcoin offre une monnaie déflationniste qui élimine la dette nationale"
explanation: >-
  Ron Paul, un minarchiste, soutient que la Réserve fédérale est responsable de l'inflation et des cycles économiques parce qu'elle manipule la monnaie fiat. Il défend la dénationalisation de la monnaie, une idée préconisée par Friedrich Hayek, et voit Bitcoin comme une forme de monnaie saine qui pourrait remplacer l'étalon-or. Sa critique est enracinée dans la théorie monétaire libertarienne, et non principalement dans la concurrence bancaire, les barrières commerciales ou la dette publique.
reviewed: false
