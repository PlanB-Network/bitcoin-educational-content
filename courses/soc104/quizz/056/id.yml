question: "Bentuk tata kelola apa yang cenderung dituju oleh sentrisme?"
answer: "Teknokrasi, di mana kekuasaan dipercayakan kepada para ahli yang mengarahkan ekonomi dan kebijakan moneter"
wrong_answers:
  - "Demokrasi langsung, di mana warga negara memilih setiap keputusan kebijakan besar"
  - "Aristokrasi, di mana kekuasaan dipegang oleh kelas penguasa tradisional"
  - "Tata kelola laissez-faire, di mana pasar mengatur dirinya sendiri tanpa intervensi negara"
explanation: >-
  Sentrisme mengutamakan efisiensi, pragmatisme, dan cenderung menuju teknokrasi, artinya kekuasaan seharusnya dipercayakan kepada para ahli yang mengarahkan ekonomi dan mengemudikan kebijakan moneter. Ini secara fundamental berbeda dari demokrasi langsung, aristokrasi, atau laissez-faire, yang masing-masing mendistribusikan kekuasaan menurut prinsip yang sama sekali berbeda.
