question: "Millised on tsentrismi põhiväärtused?"
answer: "Mõõdukus, kompromiss, kohanemine ja avalik kasu"
wrong_answers:
  - "Traditsioon, kord, autoriteet ja rahvuslik identiteet"
  - "Vabadus, eraomand, nõusolek ja individuaalne vastutus"
  - "Võrdsus, sotsiaalne õiglus, solidaarsus ja kollektiivne omand"
explanation: >-
  Tsentrismi põhiväärtused on mõõdukus, kompromiss, kohanemine ja avalik kasu. Need peegeldavad tsentristlikku rõhuasetust pragmaatilisele tasakaalule, mitte ideoloogilisele pühendumusele. Teised valikud kirjeldavad vastavalt konservatismi, libertarismi ja sotsialismi põhiväärtusi.
reviewed: false
