question: "Mitä henkilökohtaisen vapauden kategoria sisältää?"
answer: "Sen, mitä teet yksityisissä ihmissuhteissasi, mielipiteilläsi, uskomuksillasi ja kaikessa, mikä koskee omaa kehoasi ja mieltäsi"
wrong_answers:
  - "Sen, mitä teet tuottajana, mukaan lukien yrityksen perustaminen, työntekijöiden palkkaaminen ja tavaroiden kauppa"
  - "Kuinka paljon veroa maksat, mitä sijoituksia teet ja miten hallinnoit taloudellisia varojasi"
  - "Kykysi kilpailla markkinoilla, asettaa tuotteillesi hintoja ja valita toimittajasi"
explanation: >-
  Henkilökohtainen vapaus kattaa sen, mitä teet yksityisissä ihmissuhteissasi, mielipiteilläsi ja uskomuksillasi sekä kaikessa, mikä koskee omaa kehoasi ja mieltäsi. Tämä sisältää avioliiton, lukemisvalinnat, uskonnolliset käytännöt, ruoka- ja lääkevalinnat sekä sen, kenen kanssa olet tekemisissä. Liiketoiminta, verot ja markkinapäätökset kuuluvat taloudellisen vapauden piiriin.
