question: "Hur hanterar en kulturellt konservativ libertarian beteenden som de moraliskt ogillar?"
answer: "De motsätter sig och avråder från dessa beteenden genom övertygelse och exempel, men utan att tillgripa lagens tvingande kraft"
wrong_answers:
  - "De stödjer lokala myndighetsförbud mot dessa beteenden samtidigt som de motsätter sig förbud på federal nivå"
  - "De förblir helt tysta om dessa beteenden, eftersom de anser att varje form av ogillande kränker individuell frihet"
  - "De förespråkar gemenskapstribunaler som kan bestraffa dessa beteenden utanför det formella rättssystemet"
explanation: >-
  Den kulturellt konservativa libertarianen kan moraliskt ogilla vissa beteenden, men förespråkar inte rättsligt förbud mot frivilliga, icke-aggressiva handlingar. De kan ogilla sådana handlingar, motsätta sig dem och aktivt avråda från dem, men alltid genom övertygelse, utbildning och exempel snarare än genom lagens tvingande kraft. Detta handlar inte om att förbli tyst eller skapa alternativa verkställighetsmekanismer.
