question: "John Rawls の正義の 2 つの原則とは何か？"
answer: "すべての人に等しい自由、そして不平等が最も不利な立場にある人々に利益をもたらす場合にのみそれを認める格差原理"
wrong_answers:
  - "すべての市民に対する普通選挙、そして公共サービスに資金を供給するための累進課税"
  - "制限のない言論の自由、そして平等を達成するための義務的な富の再分配"
  - "私有財産権の保護、そしてすべての国家行動に適用される不可侵原則"
explanation: >-
  Rawls は 2 つの原則を提案する。第一に、すべての人に等しい自由（民主主義の基盤）であり、第二に、不平等が社会で最も不利な立場にある人々に利益をもたらす場合にのみそれを認める格差原理である。これは、再分配によって最も恵まれない人々も利益を得るなら、富む権利があるということを意味する。他の選択肢は、異なる政治哲学の要素を混ぜている。
reviewed: false
