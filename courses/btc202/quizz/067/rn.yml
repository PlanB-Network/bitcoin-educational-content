question:  Ni izihe backups zikenewe kugira ngo usubize (restore) node ya Lightning?
answer: seed na SCB
wrong_answers:
  - seed and txindex file
  - seed and public IP address
  - seed and 2FA
explanation: |
Gusubiza node ya Lightning bisaba seed hamwe na SCB (Static Channel Backup), kuko bitabaye ivyo amafaranga ari mu channels ntashobora kugarurwa.
reviewed: true
reviewed: true
