question: "보수주의자와 리버테리언은 둘 다 최저임금 폐지를 선호함에도, 그 추론은 어떻게 다른가요?"
answer: "보수주의자는 경쟁력을 저해하지 않는다면 임금 설정에 대한 일정한 국가 개입을 받아들이는 반면, 리버테리언은 최저임금을 고용하고 사업할 자유에 대한 도덕적 강제로 봅니다"
wrong_answers:
  - "보수주의자는 최저임금이 인플레이션을 일으키기 때문에 반대하고, 리버테리언은 그것이 노동조합에 너무 많은 권한을 주기 때문에 반대합니다"
  - "보수주의자는 종교 및 공동체 기관이 임금을 정하기를 원하는 반면, 리버테리언은 정부가 승인한 시장 연구가 임금을 결정하기를 원합니다"
  - "보수주의자는 최저임금이 지역별로 달라야 한다고 믿는 반면, 리버테리언은 단일한 고정 임금이 전국적으로 적용되어야 한다고 믿습니다"
explanation: >-
  둘 다 최저임금을 줄이거나 폐지하는 것을 선호하지만, 그들의 추론은 근본적으로 다릅니다. 보수주의자들은 임금 설정에 대한 일정한 국가 개입을 받아들이되, 그것이 최소한이고 맥락에 따라 달라져야 하며 경쟁력에 초점을 맞춰야 한다고 주장합니다. 리버테리언들은 더 강한 도덕적 입장을 취합니다. 최저임금은 고용하고 사업할 자유에 대한 강제입니다. 리버테리언들이 "시장"이라고 말할 때, 그것은 국가 간섭 없이 두 당사자 사이에서 자유롭게 협상된 계약을 의미합니다.
