question: "Vad vill vänstern lagstifta om och reglera?"
answer: "Ekonomin, driven av fientlighet mot ekonomisk frihet, kapitalism och den fria marknaden"
wrong_answers:
  - "Personlig moral och religiösa praktiker, driven av en vilja att bevara traditionella institutioner"
  - "Invandring och nationsgränser, driven av oro för kulturell identitet och suveränitet"
  - "Teknik och innovation, driven av rädsla för att automatisering ska ersätta mänskliga arbetare"
explanation: >-
  Vänstern prioriterar social rättvisa och jämlikhet, särskilt på det ekonomiska planet. Detta leder till dess fientlighet mot ekonomisk frihet, kapitalism och den fria marknaden, och dess vilja att lagstifta om och reglera ekonomin. Högern vill däremot lagstifta om moral och religion. Reglering av invandring och teknik är inte det huvudsakliga fokus som beskrivs här.
reviewed: false
