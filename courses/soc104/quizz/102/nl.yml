question: "Wat geloven libertariërs over het vermogen van individuen om beslissingen te nemen?"
answer: "Individuen hebben zowel het recht als de verantwoordelijkheid om hun eigen beslissingen over hun leven te nemen"
wrong_answers:
  - "Individuen zouden beslissingen alleen moeten nemen na overleg met gekozen vertegenwoordigers die beleidsimplicaties begrijpen"
  - "Individuen zijn over het algemeen niet in staat goede beslissingen te nemen en hebben deskundige begeleiding van overheidsinstellingen nodig"
  - "Individuen zouden economische beslissingen vrij moeten nemen, maar zich voor alle sociale en culturele kwesties naar de staat moeten voegen"
explanation: >-
  Vanuit libertair oogpunt hebben individuen zowel het recht als de verantwoordelijkheid om hun eigen beslissingen te nemen. Dit staat in contrast met conventionele politieke families van links tot rechts, die geloven dat de overheid sommige of veel van de belangrijke beslissingen in iemands leven en in het economische leven in het algemeen zou moeten nemen.
reviewed: false
