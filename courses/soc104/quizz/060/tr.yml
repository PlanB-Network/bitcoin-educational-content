question: "Merkezci pragmatizmin içinde hangi gizli paradoks yatar?"
answer: "Pragmatizmin kendisi bir tür dogmatizme, yani yalnızca uzmanların toplumu yönlendirmeye ehil olduğuna dair dile getirilmeyen kanaate dayanır"
wrong_answers:
  - "Merkezciler ılımlı olduklarını iddia eder, ancak koalisyon hükümetlerinde sürekli olarak sol partilerle hizalanır"
  - "Merkezci politikalar dengeli görünür, ancak çevre koruması yerine her zaman ekonomik büyümeyi tercih eder"
  - "Merkezciler ideolojiyi reddeder, ancak ekonomik kararlar alırken katı serbest piyasa ilkelerini benimser"
explanation: >-
  Merkezci pragmatizmin paradoksu, ideolojiyi rasyonel uzmanlık lehine reddettiğini iddia etmesi; fakat bu iddianın bizzat görünmez ve dile getirilmeyen bir dogmaya dayanmasıdır: doğru kararları yalnızca teknokratların alabileceği. Yalnızca uzmanların toplumu yönlendirmesi gerektiğine dair bu kanaat, merkezciler bunu böyle kabul etmese bile başlı başına ideolojik bir bağlılıktır.
reviewed: false
