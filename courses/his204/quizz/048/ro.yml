question: 1757 a marcat nașterea fiziocrației. Ce două articole a publicat Quesnay în Enciclopedie?
answer: Fermierii și Cerealele
wrong_answers:
  - Dobânda banilor și agricultura
  - Cultivarea pământului și rotația culturilor
  - Taxele și Comerțul
explanation: |
  Quesnay a publicat articolele „Fermierii” și „Cerealele” în Enciclopedia lui Diderot și d'Alembert, marcând nașterea fiziocrației ca școală de gândire economică.
