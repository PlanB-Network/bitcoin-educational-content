question: "Bitcoin right-wing හෝ left-wing project එකක් නොව state moneyට විරුද්ධ market currency එකක් ලෙස course එක විස්තර කරන්නේ ඇයි?"
answer: "Bitcoin voluntary ලෙස adopted කරන, produce කිරීමට hard, decentralized, value retain කරන currency එකක් වන නිසා; එය value lose කරන coercive, centralized fiat money සමඟ contrast වන අතර, divide එක political ideology ගැන නොව market versus state ගැන කරයි"
wrong_answers:
  - "Bitcoin නිර්මාණය කළේ anonymous developer කෙනෙකු වන අතර, ඔහු එහි intended purpose හෝ philosophy ගැන political statements කිසිවක් හිතාමතාම avoid කළ නිසා"
  - "Bitcoin mining algorithm නව coins සියලු political parties වෙත equal distribution සහතික කරන බැවින්, monetary system තුළ ideological bias කිසිවක් වැළැක්වෙන නිසා"
  - "Bitcoin existing fiat currencies සමඟ identical ලෙස ක්‍රියා කරන නමුත් faster payment network එකක් මත operate වන නිසා, political distinctions irrelevant වන බැවින්"
explanation: >-
  Bitcoin money politicizationට එරෙහි peaceful revolt එකක් ලෙස විස්තර කරයි. State හෝ fiat money යනු value lose කිරීමට නැඹුරු coercive, centralized system එකකි. Market money, historically gold සහ currently Bitcoin, voluntarily emerge වී long term තුළ value retain කරන healthy, hard-to-produce currency එකකි. Real opposition එක left versus right නොව market versus state වන අතර, Bitcoin traditional ideological camps transcend කරන political rupture එකක් බවට පත් කරයි.
reviewed: false
