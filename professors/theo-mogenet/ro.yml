bio: |
  Profesor la Kedge Bordeaux, predau Bitcoin și teoriile economice ale Școlii Austriece și sunt fondatorul Bitcoin Institute, o companie educațională și de formare situată în Paris. Sunt pasionat de economie, istorie, literatură, științe politice și tehnologie. Îmi place schiul, vinul, whisky-ul, fripturile și conversația. Fiind bine versat în toate, dar expert în nimic, am decis să mă dedic în totalitate educației Bitcoin.
  Sunt creatorul ECON 201 - introducere în economia austriacă.

short_bio: Fiat-ul este o escrocherie, pasionat de economia austriacă.
