question: "グリーン・ニュー・ディールは、民主社会主義の現代的進化をどのように表していますか？"
answer: "それは環境への懸念を、国家介入と私的所得の没収を正当化する新たな根拠として用い、個人の利益を地球環境の健全性という集団的利益に従属させる"
wrong_answers:
  - "それは従来の社会主義経済を完全に放棄し、炭素取引を通じた環境問題への自由市場型解決策を支持する"
  - "それは国家介入を拒否し、気候変動に対処するために自発的な個人行動と民間部門のイノベーションに依拠する"
  - "それは、あらゆる社会正義や雇用上の懸念よりも環境保護を優先することで、社会主義からの断絶を表している"
explanation: >-
  グリーン・ニュー・ディールは、環境への懸念と社会的目標を融合させ、エコロジーへの移行を社会正義、雇用保障、強化された公共サービスと組み合わせる。個人の利益は、地球環境の健全性によって定義される集団的利益に従属させられる。その核心において、それは国家介入と私的所得の没収を正当化する新たな修辞的外皮を提供しており、もはや社会正義の名においてだけでなく、環境の名においてもそうしている。
reviewed: false
