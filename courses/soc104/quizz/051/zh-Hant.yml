question: "在自由至上主義內部，最小國家主義者與無政府資本主義者的關鍵差異是什麼？"
answer: "最小國家主義者接受用於防衛、司法與警察的最低限度國家，而無政府資本主義者希望所有國家職能都私有化"
wrong_answers:
  - "最小國家主義者拒絕一切形式的政府，而無政府資本主義者接受有限的國家市場管制"
  - "最小國家主義者支持以累進稅資助必要服務，而無政府資本主義者反對一切稅收"
  - "最小國家主義者只關注經濟自由，而無政府資本主義者同時捍衛經濟與社會自由"
explanation: >-
  最小國家主義者認為國家應限於防衛、司法與警察等核心職能（「守夜人國家」），而無政府資本主義者主張即使這些職能也應私有化，並透過自願的市場競爭來管理。他們的分歧更多在於實務執行，而非根本倫理原則。兩種傾向共享自我所有權與非侵略的相同自由至上主義價值。
reviewed: false
