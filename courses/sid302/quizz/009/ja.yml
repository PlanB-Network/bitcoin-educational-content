question: ElementsのConfidential Transactionsにおける、ペダーセン・コミットメントの主な目的は何ですか？
answer: 目に見えるトランザクションの金額を、実際の値を明かさずに検証できる暗号学的コミットメントに置き換えること
wrong_answers:
  - Elementsブロックチェーン上で新たに発行されたアセットに、一意の64文字の16進数IDを割り当てること
  - 隠された値が有効な範囲内の正の整数であることを数学的に証明し、二重支払いを防ぐこと
  - 暗号学的なペグの仕組みを通じて、メインチェーンからElementsサイドチェーンへBitcoinを移せるようにすること
explanation: |
  ペダーセン・コミットメントは、目に見える金額を数学的なコミットメントに置き換えることで、Confidential Transactionsのプライバシーを実現する中核的な暗号メカニズムです。準同型性があるため、バリデーターは実際の値を見ることなく、入力が出力と手数料の合計に等しいことを検証できます。負の金額を防ぐのはレンジプルーフ、トークンを識別するのはアセットID、チェーン間の移動を担うのはペグの仕組みであり、いずれもペダーセン・コミットメントそのものの機能ではありません。