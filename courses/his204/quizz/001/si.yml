question: 17 වන සියවසේ අවසානයේදී, ආර්ථික විද්‍යාව පිළිබඳ රාජ්‍යනායකයන්ට ආදර්ශයක් වූ ඇමතිවරයා කවුද?
answer: Colbert
wrong_answers:
  - Turgot
  - Sully
  - Mazarin
explanation: |
  Louis XIVගේ මුදල් ඇමති වූ Colbert, ප්‍රංශ කර්මාන්තය හා වාණිජය සංවර්ධනය කිරීම අරමුණු කළ Colbertism ලෙස හැඳින්වෙන මැදිහත්කාරී ආර්ථික ප්‍රතිපත්තියකින් තම යුගයට ගැඹුරු සලකුණක් තැබුවේය. ඔහුගේ ක්‍රියා බොහෝ යුරෝපීය රාජ්‍යනායකයන්ට ආදර්ශයක් විය.
