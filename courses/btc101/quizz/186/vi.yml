question: Làm thế nào để có được bitcoin mà không cần phải mua?
answer: Chấp nhận chúng như một phương tiện thanh toán cho các sản phẩm hoặc dịch vụ bạn cung cấp.
wrong_answers:
  - Mượn bitcoin từ bạn bè và không bao giờ trả lại.
  - Thắng bitcoin trong một trò xổ số.
  - Tìm thấy bitcoin trên đường.
explanation: >-
  Một cách để có được bitcoin mà không cần mua bitcoin là chấp nhận bitcoin như một
  phương tiện thanh toán cho các sản phẩm hoặc dịch vụ bạn cung cấp. Điều này cho phép bạn
  kiếm được bitcoin thông qua công việc của mình.
reviewed: true