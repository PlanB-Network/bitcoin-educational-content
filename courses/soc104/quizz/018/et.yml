question: "Mida tahavad vasakpoolsed seadustega reguleerida ja kontrollida?"
answer: "Majandust, ajendatuna vaenulikkusest majandusvabaduse, kapitalismi ja vaba turu suhtes"
wrong_answers:
  - "Isiklikku moraali ja religioosseid praktikaid, ajendatuna soovist säilitada traditsioonilisi institutsioone"
  - "Immigratsiooni ja riigipiire, ajendatuna murest kultuurilise identiteedi ja suveräänsuse pärast"
  - "Tehnoloogiat ja innovatsiooni, ajendatuna hirmust, et automatiseerimine asendab inimtööjõu"
explanation: >-
  Vasakpoolsed seavad esikohale sotsiaalse õigluse ja võrdsuse, eriti majanduslikul tasandil. See viib nende vaenulikkuseni majandusvabaduse, kapitalismi ja vaba turu suhtes ning soovini majandust seadustega reguleerida ja kontrollida. Seevastu parempoolsed tahavad seadustega reguleerida moraali ja religiooni. Immigratsiooni ja tehnoloogia reguleerimine ei ole siin kirjeldatud põhifookus.
reviewed: false
