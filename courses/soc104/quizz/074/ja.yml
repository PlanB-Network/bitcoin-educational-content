question: "補助金論争の文脈における「モラルハザード」とはどのような概念であり、この懸念を提起する政治的家族はどれですか？"
answer: "モラルハザードとは、企業が補助金によって失敗から守られると無責任へのインセンティブが生じることである。最終的には納税者が支払うからであり、この懸念はリバタリアンによって提起される"
wrong_answers:
  - "モラルハザードとは、補助を受けた企業が税の低い国へ移転し、雇用も持ち去るリスクである。この懸念は保守主義者によって提起される"
  - "モラルハザードとは、どの企業が補助金を受けるかを政府職員が選ぶことで腐敗する危険である。この懸念は中道主義者によって提起される"
  - "モラルハザードとは、公的資金を受け取った後に企業が労働者を搾取するという倫理的問題である。この懸念は社会主義者によって提起される"
explanation: >-
  リバタリアンは、補助金と救済がモラルハザードを生むと論じます。企業が失敗から守られると、悪い決定の結果を負わないため、無責任と無謀さへのインセンティブが生じるからです。最終的に支払うのは納税者であり、リバタリアンはこれを深く不正だと考えます。この概念は、他の政治的家族が提起する企業移転、公務員の腐敗、労働者搾取への懸念とは別のものです。
reviewed: false
