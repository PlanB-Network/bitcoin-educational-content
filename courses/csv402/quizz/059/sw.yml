question: Je, ni kazi gani ya server mbadala ya RGB katika mazingira ya Lightning ya RGB?
answer: Kuwezesha Exchange ya mizigo ya RGB
wrong_answers:
  - Toa funguo za umma kwa node ili kufungua vituo
  - Weka historia ya mabadiliko ya hali ya RGB
  - Epuka nakala za tiki za tokeni za RGB
explanation: |
  Server ya proksi ya RGB hurahisisha mawasiliano ya shehena ya RGB kati ya washiriki wa Lightning kwa kufanya kazi kama mpatanishi, kuwezesha utumiaji rahisi zaidi wa uzoefu wa sasa wa Bitcoin na Lightning.
reviewed: true
