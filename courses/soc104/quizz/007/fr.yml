question: "Dans le losange de Nolan, quelle position se trouve en haut et représente la liberté maximale ?"
answer: "Le libertarianisme, qui soutient la plus grande liberté économique et personnelle"
wrong_answers:
  - "Le conservatisme, qui soutient les valeurs traditionnelles et la liberté économique"
  - "Le centrisme, qui équilibre toutes les positions politiques de manière pragmatique"
  - "Le socialisme, qui soutient la liberté personnelle et l'égalité sociale"
explanation: >-
  Le libertarianisme occupe le sommet du losange de Nolan comme opposé de l'étatisme. Il représente ceux qui soutiennent le plus haut degré de liberté économique et personnelle. Le conservatisme se situe à droite (forte liberté économique, faible liberté personnelle), le socialisme à gauche (forte liberté personnelle, faible liberté économique), et le centrisme au milieu.
