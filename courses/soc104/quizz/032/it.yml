question: "Perché le definizioni intenzionali dei sistemi politici sono considerate problematiche a fini analitici?"
answer: "Creano confusione concettuale perché tutti i sistemi affermano di perseguire obiettivi simili come giustizia, equità e libertà"
wrong_answers:
  - "Sono troppo precise e rigide, lasciando poco spazio all'evoluzione naturale dei movimenti politici nel tempo"
  - "Si concentrano troppo sui risultati economici e ignorano le dimensioni culturali e sociali della vita politica"
  - "Si basano su documenti governativi classificati che raramente sono disponibili ai ricercatori indipendenti"
explanation: >-
  Le definizioni intenzionali si basano sulle motivazioni e sugli obiettivi dichiarati, ma ogni sistema politico afferma di perseguire giustizia, equità e libertà. Questo rende impossibile distinguere i sistemi gli uni dagli altri. L'analisi strutturale, al contrario, valuta i sistemi in base alle loro conseguenze empiriche e misurabili e ai mezzi che impiegano, rivelandone la vera natura al di là della retorica.
reviewed: false
