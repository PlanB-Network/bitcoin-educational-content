question: "Ako kultúrne konzervatívny libertarián pristupuje k správaniu, s ktorým morálne nesúhlasí?"
answer: "Stavia sa proti takému správaniu a odrádza od neho presviedčaním a príkladom, ale bez siahania po donucovacej sile zákona"
wrong_answers:
  - "Podporuje miestne vládne zákazy takého správania, pričom odmieta zákazy na federálnej úrovni"
  - "Zostáva o takom správaní úplne ticho, pretože verí, že akákoľvek forma nesúhlasu porušuje individuálnu slobodu"
  - "Obhajuje komunitné tribunály, ktoré môžu také správanie trestať mimo formálneho právneho systému"
explanation: >-
  Kultúrne konzervatívny libertarián môže morálne nesúhlasiť s určitým správaním, ale neobhajuje zákonný zákaz konsenzuálnych, neagresívnych činov. Môžu sa mu také činy nepáčiť, môže sa im stavať proti a aktívne od nich odrádzať, no vždy presviedčaním, vzdelávaním a príkladom, nie donucovacou silou zákona. Nejde o mlčanie ani o vytváranie alternatívnych donucovacích mechanizmov.
reviewed: false
