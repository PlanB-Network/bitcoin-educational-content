question: "Neno 'liberal' linamaanisha nini katika mapokeo ya kisiasa ya Ulaya?"
answer: "Mtu anayeunga mkono uchumi wa laissez-faire, kupunguzwa kwa uingiliaji wa dola, na uhuru wa mtu binafsi"
wrong_answers:
  - "Mtetezi wa uingiliaji wa dola, bima ya afya ya umma, na programu za kupambana na umaskini"
  - "Anarkisti mkali anayetafuta kufutwa kabisa kwa serikali na mali binafsi"
  - "Mtu wa msimamo wa kati anayesawazisha misimamo ya kisoshalisti na kihafidhina kwa usawa katika nyanja zote za sera"
explanation: >-
  Barani Ulaya, liberalism imeendelea kuhusishwa na sera za kiuchumi za laissez-faire, kupunguzwa kwa uingiliaji wa dola, na utetezi wa uhuru wa mtu binafsi. Jibu la kwanza lisilo sahihi linaeleza waliberali wa Marekani, ambao wamehamisha maana ya neno hilo kuelekea uingiliaji wa dola. Liberalism ya Ulaya si anarchism wala msimamo wa kati.
