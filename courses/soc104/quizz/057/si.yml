question: "centrism නැඹුරු වන්නේ කුමන governance ආකාරයකටද?"
answer: "Technocracy, එහිදී economy සහ monetary policy steer කරන experts වෙත power භාර දෙනු ලැබේ"
wrong_answers:
  - "Direct democracy, එහිදී citizens සෑම major policy decision එකක් පිළිබඳව ඡන්දය දෙති"
  - "Aristocracy, එහිදී power සම්ප්‍රදායික ruling class එකක් සතුව පවතී"
  - "Laissez-faire governance, එහිදී market state intervention නැතිව තමන්ව regulate කරයි"
explanation: >-
  Centrism efficiency, pragmatism, සහ technocracy වෙත ප්‍රමුඛතාවය දෙයි; එනම් economy steer කර monetary policy pilot කරන experts වෙත power භාර දිය යුතු බවයි. මෙය direct democracy, aristocracy, හෝ laissez-faire වලින් මූලිකව වෙනස් වේ; ඒ සෑම එකක්ම සම්පූර්ණයෙන් වෙනස් principles අනුව power බෙදාහරින බැවිනි.
reviewed: false
