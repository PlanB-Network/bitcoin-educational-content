question: "Miten rakenteellinen lähestymistapa määrittelee sosialismin ja libertarismin perustavanlaatuisen eron?"
answer: "Sosialismi antaa etusijan valtiolle sääntelyn, suunnittelun ja kontrollin kautta, kun taas libertarismi antaa etusijan yksilölle minimaalisen valtion väliintulon kautta"
wrong_answers:
  - "Sosialismi asettaa etusijalle maaseudun maatalousyhteisöt, kun taas libertarismi suosii kaupunkien teollista kehitystä"
  - "Sosialismi määritellään sen demokraattisten vaalien kannatuksen perusteella, kun taas libertarismi hylkää kaikki poliittisen osallistumisen muodot"
  - "Sosialismi keskittyy ulkopolitiikkaan ja kansainväliseen yhteistyöhön, kun taas libertarismi koskee vain kotimaisia talouskysymyksiä"
explanation: >-
  Rakenteellisesti sosialismia luonnehtii valtion kaikkialla läsnäolo: valtio sääntelee, suunnittelee ja kontrolloi. Libertarismi määrittyy valtion minimaalisena väliintulona talouteen ja yksityiselämään, ja se suuntautuu yksilönvapauden ja vapaiden markkinoiden ensisijaisuuteen. Tämä rakenteellinen erottelu on analyyttisesti paljon hyödyllisempi kuin kummankin järjestelmän ilmoitettujen aikomusten vertaaminen.
reviewed: false
