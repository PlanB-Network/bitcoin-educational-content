question: "Mitä hyökkäämättömyysperiaate sanoo?"
answer: "Ihminen on vapaa toimimaan haluamallaan tavalla, kunhan kenenkään toisen henkeen, vapauteen tai omaisuuteen ei kohdisteta väkivaltaa"
wrong_answers:
  - "Valtiolla on yksinoikeus käyttää voimaa yhteiskuntajärjestyksen ylläpitämiseksi"
  - "Kansalaisten on alistuttava enemmistön tahtoon silloinkin, kun se rajoittaa yksilönvapauksia"
  - "Toiminnanvapaus sallitaan vain silloin, kun se hyödyttää yhteiskunnan kollektiivista hyvää"
explanation: >-
  Hyökkäämättömyysperiaate on libertaarisen politiikan kulmakivi, jonka mukaan yksilöt voivat toimia vapaasti, kunhan he eivät kohdista väkivaltaa toisten henkeen, vapauteen tai omaisuuteen. Se muistuttaa kultaista sääntöä, joka löytyy eri sivilisaatioista. Toisin kuin muut vaihtoehdot, se ei anna valtiolle erityistä moraalista auktoriteettia eikä alista yksilön oikeuksia kollektiiviselle hyödylle.
