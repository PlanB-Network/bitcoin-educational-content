question: Which later thinker has Boisguilbert NOT been compared to?
answer: Adam Smith and the invisible hand
wrong_answers:
  - Keynes and the theory of underemployment
  - Marx and class analysis
  - Walras and general equilibrium
explanation: |
  Modern scholars have over-claimed Boisguilbert as a precursor to Keynes (underemployment), Marx (class analysis), and Walras (general equilibrium). However, the invisible hand concept is attributed to the Marquis d'Argenson, not Boisguilbert. As one commentator asked: "Who or what could Boisguilbert not be the precursor of?"