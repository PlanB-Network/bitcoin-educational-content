question: "Ako konzervatizmus pristupuje k slobodám v ekonomickej a spoločenskej sfére?"
answer: "Silné slobody v ekonomickej sfére, ale slabé slobody v spoločenskej sfére"
wrong_answers:
  - "Slabé slobody v ekonomickej aj spoločenskej sfére s cieľom zachovať tradičný spoločenský poriadok"
  - "Silné slobody v spoločenskej sfére, ale slabé slobody v ekonomickej sfére"
  - "Rovnaké a neobmedzené slobody v oboch sférach s minimálnymi vládnymi zásahmi akéhokoľvek druhu"
explanation: >-
  Konzervatizmus vykazuje dichotómiu, ktorá je zrkadlovým obrazom socializmu. V ekonomickej oblasti konzervatívci obhajujú voľný trh, podnikanie a súkromné vlastníctvo. V spoločenskej oblasti sa obmedzenia odôvodňujú zachovaním tradičných morálnych noriem a spoločenskej stability. Tretia nesprávna odpoveď opisuje socialistický vzorec, ktorý je opačný.
