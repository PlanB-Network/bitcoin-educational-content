question: "Dlaczego libertarianie sprzeciwiają się opodatkowaniu?"
answer: "Ponieważ jest to moralne naruszenie praw własności, forma państwowej kradzieży, która przejmuje cudzą własność bez zgody"
wrong_answers:
  - "Ponieważ podatki są ekonomicznie nieefektywne i zawsze prowadzą do wyższych stóp bezrobocia"
  - "Ponieważ opodatkowanie zniechęca do inwestycji zagranicznych i osłabia pozycję konkurencyjną kraju"
  - "Ponieważ progresywne systemy podatkowe niesprawiedliwie obciążają zamożne osoby, które tworzą najwięcej miejsc pracy"
explanation: >-
  Libertariański sprzeciw wobec opodatkowania jest moralny, zanim jest ekonomiczny. Libertarianie postrzegają opodatkowanie jako formę państwowej kradzieży i przeszkodę dla własności prywatnej, ponieważ polega ono na przejęciu cudzej własności bez zgody. Choć mogą istnieć argumenty ekonomiczne przeciwko opodatkowaniu, fundamentalny argument libertariański opiera się na zasadzie, że narusza ono prawa własności, a nie na kalkulacjach efektywności czy konkurencyjności.
reviewed: false
