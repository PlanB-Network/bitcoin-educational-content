question: Într-un proiect de lege prezentat Adunării Constituante, ce a propus Dupont de Nemours să fie interzis?
answer: Războaiele ofensive
wrong_answers:
  - Războaiele comerciale
  - Războaiele defensive
  - Toate războaiele
explanation: |
  Dupont de Nemours, în conformitate cu principiile fiziocratice, a propus interzicerea războaielor ofensive, întrucât le considera dăunătoare prosperității economice și bunăstării populației.
