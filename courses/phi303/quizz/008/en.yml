question: "What is the 'circulation of elites'?"
answer: "The ruling minority maintains power by absorbing able newcomers and replacing decayed members \u2014 changing people to keep the structure."
wrong_answers:
  - "The rotation of civil servants between government departments."
  - "The periodic replacement of the whole elite by the majority through elections."
  - "The migration of elites from one country to another."
explanation: |
  As The Leopard puts it: 'everything must change for everything to remain the same.' Burnham calls it a safeguard against degeneration and a protection against revolution — which, note, is always led by a dissident part of the elite, never by the majority itself.
