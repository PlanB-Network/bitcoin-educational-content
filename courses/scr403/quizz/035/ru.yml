question: Проследите выполнение полного сумматора на ⟨⟨1,1⟩,1⟩ (1+1+1). Какое значение этап два, O O H ▵ (O I H ▵ I H ⨾ half-adder), передаёт финальному этапу?
answer: ⟨1, ⟨0, 1⟩⟩ — перенос первого полусумматора, затем перенос и сумма второго.
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ — перенос первого полусумматора, затем сумма и перенос второго.
  - ⟨0, ⟨0, 1⟩⟩ — бит суммы первого полусумматора, затем перенос и сумма второго.
  - ⟨1, ⟨1, 1⟩⟩ — перенос первого полусумматора, затем биты OR и XOR второго.
explanation: >-
  Этап один вычисляет half-adder⟨1,1⟩ = ⟨1, 0⟩ (перенос 1, сумма 0) и
  сохраняет входящий перенос, давая ⟨⟨1,0⟩, 1⟩. На этапе два O O H
  извлекает первый перенос (1), а O I H ▵ I H подаёт ⟨0, 1⟩ — первую
  сумму и входящий перенос — во второй полусумматор, давая ⟨0, 1⟩,
  поскольку and(0,1)=0 и xor(0,1)=1. Затем финальный этап объединяет
  два переноса через OR и сохраняет сумму, давая ⟨1, 1⟩: двоичное 3,
  как и ожидалось.
