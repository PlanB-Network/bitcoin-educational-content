question: "چرا روتبارد از تصور لیبرتِرها درباره طبیعت انسان انتقاد کرد و چه جایگزینی پیشنهاد داد؟"
answer: "او آنان را به داشتن دیدگاه ساده‌لوحانه «وحشی نجیب» متهم کرد و استدلال کرد که جامعه باید با استفاده از مالکیت خصوصی و مشوق‌های درست، رفتار مبتنی بر نفع شخصی را هدایت کند"
wrong_answers:
  - "او فهم آنان از همکاری انسانی را ستود، اما استدلال کرد که برای اجرای قراردادها هنوز وجود یک دولت حداقلی ضروری است"
  - "او پذیرفت که انسان‌ها ذاتاً خوب‌اند، اما اصرار داشت که فقط بازارهای آزاد می‌توانند این نیکی را به فعالیت مولد هدایت کنند"
  - "او تأکید آنان بر حقوق فردی را رد کرد و در عوض استدلال کرد که جوامع باید معیارهای اخلاقی را به‌صورت جمعی تعریف کنند"
explanation: >-
  روتبارد از لیبرتِرها انتقاد کرد که دیدگاهی ساده‌لوحانه و روسومانند از طبیعت انسان به‌عنوان موجودی ذاتاً خوب پذیرفته‌اند. او در عوض استدلال کرد که انسان‌ها با نفع شخصی هدایت می‌شوند و جامعه باید چنان سازمان یابد که مشوق‌های درست رفتار را هدایت کنند. این امر مستلزم به‌رسمیت شناختن و تضمین مالکیت خصوصی است. برچیدن دولت به معنای برچیدن کارکردهای آن نیست؛ پلیس و دادگستری باید توسط بازار آزاد و از راه رقابت اداره شوند.
reviewed: false
