question: completeness theorem එක Simplicity ගැන සහතික කරන්නේ කුමක්ද?
answer: Simplicity types දෙකක් අතර ඕනෑම function එකක් combinators නවයෙන් ගොඩනැගිය හැකි බව.
wrong_answers:
  - Simplicity programs සෑම විටම constant time තුළ අවසන් වන බවට සහතික කර ඇති බව.
  - Simplicity Turing-complete වන අතර ඕනෑම Turing machine එකක් සම්පූර්ණයෙන් simulate කළ හැකි බව.
  - සෑම වලංගු Simplicity program එකකටම එකම තනි unique representation එකක් ඇති බව.
