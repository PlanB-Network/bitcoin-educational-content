question: "individual කෙනෙකු පමණක් සිතයි, reason කරයි, සහ act කරයි යනුවෙන් Ludwig von Mises ලියා තිබූ විට ඔහු අදහස් කළේ කුමක්ද?"
answer: "state හෝ nation වැනි collectivities වලට, ඒවායේ individual membersගේ actions ඉක්මවා, තමන්ගේම existence එකක් නොමැති බව"
wrong_answers:
