question: "當自由至上主義者與其他政治家族共享相同目標時，關鍵分歧是什麼？"
answer: "分歧在於手段：自由至上主義者拒絕強制性解決方案，並偏好透過市場過程進行自願交換"
wrong_answers:
  - "分歧在於目的：自由至上主義者追求個人財富等不同目標，而不是社會福利"
  - "分歧在於時機：自由至上主義者想透過漸進改革，以更慢速度達成相同目標"
  - "分歧在於範圍：自由至上主義者只想在地方層級而非國家層級套用相同政策"
explanation: >-
  自由至上主義者可以在捍衛受壓迫者或促進社會凝聚等某些目標上，同意社會主義者、保守主義者與中間派。分歧不在目的，而在手段。自由至上主義者拒絕所有試圖統一實踐與法規的強制性解決方案，轉而透過建立在自願契約上的自由、去中心化交換，捍衛選擇的力量與負責任的自由。
reviewed: false
