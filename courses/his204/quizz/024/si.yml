question: Saint Peter ජාතීන් අතර සාමය සහතික කිරීමට යෝජනා කරන්නේ කුමක්ද?
answer: අනෙක් පිළිතුරු 3ම එකවර
wrong_answers:
  - ජාතීන්ගේ සභාවක් පිහිටුවීම
  - පොදු හමුදාවක් පිහිටුවීම
  - ආරවුල් ඇති විට මධ්‍යස්ථ විනිශ්චයට යොමු වීම
explanation: |
  Abbé de Saint-Pierre සාමය සහතික කිරීමට පියවර මාලාවක් යෝජනා කළේය. ඒ අතර ජාතීන්ගේ සභාවක්, පොදු හමුදාවක් සහ මධ්‍යස්ථ විනිශ්චය ඇතුළත් විය. මෙම ආයතන ගැටුම් සාමකාමීව විසඳීමට සහ යුද්ධ වැළැක්වීමට උපකාරී වන බව ඔහු විශ්වාස කළේය.