question: "놀런 도표에서 수직축(상하)이 수평축(좌우)보다 더 근본적이라고 여겨지는 이유는 무엇인가요?"
answer: "최대한의 개인적 자유를 옹호하는 사람들과 최대한의 국가 통제를 선호하는 사람들 사이의 진정한 구분을 드러내기 때문입니다"
wrong_answers:
  - "수평축이 사회 정책을 측정하는 것보다 경제 산출을 더 정확하게 측정하기 때문입니다"
  - "역사 전반의 대부분의 정치 갈등은 통치 방식보다 문화적 정체성에 관한 것이었기 때문입니다"
  - "수평축은 현대 민주주의에만 적용되는 반면, 수직축은 보편적이기 때문입니다"
explanation: >-
  근본적인 축은 수직축입니다. 그것이 본질적인 정치적 질문, 즉 국가가 인간의 행동을 어느 정도까지 통제해야 하는지를 포착하기 때문입니다. 좌우 축은 단지 서로 다른 감수성(사회 정의 대 전통)을 반영할 뿐이지만, 양쪽 모두 국가주의자로서 수직축의 같은 위치를 차지할 수 있습니다. 수직축은 누군가가 자신의 비전을 힘으로 강요하려 하는지, 아니면 개인의 자유를 존중하는지를 드러냅니다.
