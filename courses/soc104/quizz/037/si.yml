question: "Rothbard libertaires ගේ human nature vision එක criticize කළේ ඇයි, සහ ඔහු propose කළ alternative එක කුමක්ද?"
answer: "ඔහු ඔවුන්ට naive 'noble savage' view එකක් තිබෙන බව චෝදනා කළ අතර, self-interested behavior guide කිරීමට society private property සහ good incentives භාවිත කළ යුතු බව තර්ක කළේය"
wrong_answers:
  - "ඔහු ඔවුන්ගේ human cooperation පිළිබඳ understanding එක praise කළ නමුත්, contracts enforce කිරීමට minimal state එකක් තවමත් අවශ්‍ය බව තර්ක කළේය"
  - "humans naturally good බව ඔහු එකඟ වූ නමුත්, free markets පමණක් එම goodness productive activity වෙත channel කළ හැකි බව insist කළේය"
  - "ඔහු individual rights මත ඔවුන්ගේ emphasis ප්‍රතික්ෂේප කර, ඒ වෙනුවට communities collectively moral standards define කළ යුතු බව තර්ක කළේය"
explanation: >-
  Rothbard libertaires criticize කළේ, human nature naturally good ලෙස දකින naive, Rousseau-like vision එකක් adopt කිරීම නිසාය. ඒ වෙනුවට, people self-interest මඟින් guided වන අතර, good incentives behavior guide කරන ලෙස society සංවිධානය කළ යුතු බව ඔහු තර්ක කළේය. මෙය private property recognize සහ guarantee කිරීම අවශ්‍ය කරයි. State එක අහෝසි කිරීම එහි functions අහෝසි කිරීම නොවේ; police සහ justice competition හරහා free market මගින් manage කළ යුතුය.
reviewed: false
