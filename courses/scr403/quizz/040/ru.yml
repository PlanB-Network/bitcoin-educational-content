question: "Вычисление #ᶜ(comp f g) хеширует 128 байт: дважды метку comp, затем оба дочерних CMR. Почему это всё равно не более одного вызова функции сжатия SHA-256?"
answer: Первый 64-байтовый блок — это константа tag∥tag, чьё промежуточное состояние предвычисляется один раз; сжимается только блок, содержащий дочерние CMR.
wrong_answers:
  - Одно лишь отбрасывание финального блока дополнения длины SHA-256 позволяет уместить все 128 байт в один вызов.
  - Два дочерних CMR объединяются через XOR в один 32-байтовый дайджест, сокращая вход до одного блока.
  - SHA-256-midstate — это вариант с широким блоком, который поглощает 128-байтовые блоки сообщения за один проход.
explanation: >-
  Функция сжатия SHA-256 обрабатывает фиксированные 64-байтовые блоки,
  поэтому 128-байтовый вход обычно требует двух вызовов (плюс ещё один
  для дополнения длины в полном SHA-256). Поскольку первый блок каждого
  комбинатора — это константа tag∥tag, её промежуточное состояние можно
  предвычислить один раз и закэшировать; тогда каждому выражению
  требуется лишь одно новое сжатие блока, содержащего CMR его
  потомков. Промежуточные состояния также убирают финальный блок
  дополнения, но одно это всё равно оставило бы два сжатия — именно
  предвычисленное промежуточное состояние метки снижает это число до
  не более одного.
