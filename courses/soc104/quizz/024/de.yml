question: "Wie geht ein kulturell konservativer Libertärer mit Verhaltensweisen um, die er moralisch missbilligt?"
answer: "Er lehnt diese Verhaltensweisen ab und entmutigt sie durch Überzeugung und Beispiel, aber ohne auf die Zwangsgewalt des Gesetzes zurückzugreifen"
wrong_answers:
  - "Er unterstützt Verbote dieser Verhaltensweisen durch lokale Regierungen, während er Verbote auf Bundesebene ablehnt"
  - "Er schweigt vollständig zu diesen Verhaltensweisen, weil er glaubt, dass jede Form der Missbilligung die individuelle Freiheit verletzt"
  - "Er befürwortet Gemeinschaftstribunale, die solche Verhaltensweisen außerhalb des formalen Rechtssystems bestrafen können"
explanation: >-
  Der kulturell konservative Libertäre mag bestimmte Verhaltensweisen moralisch missbilligen, befürwortet aber kein gesetzliches Verbot einvernehmlicher, nicht-aggressiver Handlungen. Er mag solche Handlungen ablehnen, sich ihnen widersetzen und sie aktiv entmutigen, aber immer durch Überzeugung, Bildung und Beispiel statt durch die Zwangsgewalt des Gesetzes. Dabei geht es nicht darum zu schweigen oder alternative Durchsetzungsmechanismen zu schaffen.
reviewed: false
