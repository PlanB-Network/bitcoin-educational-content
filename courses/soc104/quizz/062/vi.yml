question: "Tất cả các chế độ toàn trị đã lên nắm quyền bằng cách nào?"
answer: "Thông qua cách mạng bạo lực, qua đó biện minh cho việc xóa sạch hệ thống trước đó để bắt đầu lại từ đầu"
wrong_answers:
  - "Thông qua cải cách lập pháp dần dần trong các thiết chế dân chủ hiện có"
  - "Thông qua các cuộc đảo chính quân sự do các thế lực nước ngoài tổ chức để kiểm soát khu vực"
  - "Thông qua các phong trào quần chúng hòa bình thắng cử với cách biệt lớn"
explanation: >-
  Tất cả các chế độ toàn trị đã lên nắm quyền thông qua cách mạng bạo lực. Cuộc cách mạng này phục vụ hai mục đích: nó phá hủy trật tự cũ về mặt vật chất và biện minh về mặt ý thức hệ cho việc sử dụng bạo lực như điều cần thiết để xây dựng xã hội mới. Điều này phân biệt các cuộc tiếp quản toàn trị với những chuyển đổi dân chủ, các cuộc đảo chính do nước ngoài hậu thuẫn, hoặc những chiến thắng bầu cử hòa bình.
