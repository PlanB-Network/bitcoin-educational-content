question: "Co charakterizuje spodní část osy osobní svobody v Nolanově diagramu?"
answer: "Preference řádu, bezpečnosti, tradičních hodnot a toho, aby stát reguloval mravy a udržoval veřejný pořádek"
wrong_answers:
  - "Preference individuální autonomie, tolerance a minimálních státních zásahů do osobních životních voleb"
  - "Preference ekonomické deregulace, volného obchodu a zrušení cel a dotací"
  - "Preference přerozdělování bohatství, vysokých daní a znárodňování klíčových odvětví"
explanation: >-
  Spodní část osy osobní svobody představuje maximální státní kontrolu nad osobním životem, charakterizovanou preferencí řádu, bezpečnosti a tradičních hodnot. Stát reguluje mravy, udržuje veřejný pořádek a může hájit konkrétní vizi morálky nebo tradice. Horní část osy představuje opak: individuální svobodu a toleranci. Ekonomické politiky se měří na samostatné vodorovné ose.
