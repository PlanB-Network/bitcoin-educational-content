question: "What is Mosca's 'political formula'?"
answer: "The justification a ruling minority uses to legitimize its rule \u2014 historically divine right, today 'the people's representative'."
wrong_answers:
  - "The mathematical law describing the size of ruling classes."
  - "The set of electoral rules defining a valid majority."
  - "The secret agreement between banking families."
explanation: |
  Without a formula, 'the social structure would disintegrate' (Burnham). When educated populations stopped believing in divine right, it was replaced by an even better formula: people-power.
reviewed: false
