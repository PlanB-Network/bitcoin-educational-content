question: "सब्सिडी बहस के संदर्भ में 'नैतिक जोखिम' की अवधारणा क्या है, और कौन सा राजनीतिक परिवार यह चिंता उठाता है?"
answer: "नैतिक जोखिम वह प्रोत्साहन है जो तब गैर-जिम्मेदारी की ओर ले जाता है जब कंपनियों को सब्सिडी के माध्यम से असफल होने से बचा लिया जाता है, क्योंकि अंततः करदाता भुगतान करता है; यह चिंता लिबर्टेरियन उठाते हैं"
wrong_answers:
  - "नैतिक जोखिम यह जोखिम है कि सब्सिडी पाने वाली कंपनियां कम कर वाले देशों में चली जाएंगी और नौकरियां साथ ले जाएंगी; यह चिंता कंजरवेटिव उठाते हैं"
  - "नैतिक जोखिम यह खतरा है कि सरकारी अधिकारी यह चुनते हुए भ्रष्ट हो जाएंगे कि किन कंपनियों को सब्सिडी मिले; यह चिंता मध्यमार्गी उठाते हैं"
  - "नैतिक जोखिम सार्वजनिक धन प्राप्त करने के बाद कंपनियों द्वारा श्रमिकों का शोषण करने की नैतिक समस्या है; यह चिंता समाजवादी उठाते हैं"
explanation: >-
  लिबर्टेरियन तर्क देते हैं कि सब्सिडी और बेलआउट नैतिक जोखिम पैदा करते हैं: जब कंपनियों को असफल होने से बचा लिया जाता है, तो यह गैर-जिम्मेदारी और लापरवाही को प्रोत्साहित करता है, क्योंकि खराब फैसलों के कोई परिणाम नहीं होते। अंत में भुगतान करदाता करता है, जिसे लिबर्टेरियन गहराई से अन्यायपूर्ण मानते हैं। यह अवधारणा कॉर्पोरेट पलायन, अधिकारी भ्रष्टाचार या श्रमिक शोषण की उन चिंताओं से अलग है जिन्हें अन्य राजनीतिक परिवार उठाते हैं।
reviewed: false
