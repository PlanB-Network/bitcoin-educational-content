question: "リバタリアンは、私有財産と自由の関係をどのように見ていますか？"
answer: "私有財産は法と国家に先立つ自然権であり、自由そのものの基盤である"
wrong_answers:
  - "私有財産は国家によって作られた社会的慣習であり、不平等を引き起こす場合には取り消すことができる"
  - "私有財産は経済効率に役立つが、それ自体に道徳的または哲学的な意味はない"
  - "私有財産は個人の所持品に限って存在すべきであり、生産資産や土地には認められるべきではない"
explanation: >-
  リバタリアンは、私有財産を法と国家に先立つ自然権として擁護する。彼らは、個人が自分の身体を所有するなら、その労働とその成果も所有すると論じる。物質的財の所有は自己所有の延長である。これは、財産を社会的慣習または抑圧の源とみなすリベルテールの見解と鋭く対照をなす。
reviewed: false
