question: "Ni iki gitandukanya neoconservatives na paleoconservatives mu buryo bafata politike y'imigenderanire n'amahanga?"
answer: "Neoconservatives bashigikira ukwivanga kwa gisirikare kugira ngo bakwiragize demokarasi, mu gihe paleoconservatives barwanira politike y'imigenderanire n'amahanga yigungira kurusha"
wrong_answers:
  - "Neoconservatives barwanya ibikorwa vyose vya gisirikare bagashigikira ibiganiro, mu gihe paleoconservatives bashigikira ibitero vy'imbere ku vyoshobora gutera ingorane"
  - "Neoconservatives bitwararika gusa ibihano vy'ubutunzi, mu gihe paleoconservatives basaba kwubaka ama coalitions mpuzamakungu y'ibikorwa vya gisirikare bihurijweko"
  - "Neoconservatives na paleoconservatives barumvikana kuri politike y'imigenderanire n'amahanga ariko bagatandukana cane ku mabwirizwa y'ubutunzi bwo mu gihugu"
explanation: >-
  Guhera mu myaka ya 2000, neoconservatives barushirije kuja mu bikorwa vyo gushingira intahe ukwivanga kwa gisirikare kugira ngo bashire demokarasi hirya no hino kw'isi, cane cane inyuma ya September 11, 2001. Mu kubishura, conservatives ba kera bafashe izina 'paleoconservative' kugira ngo bitandukanye. Paleoconservatives banegura ukwivanga kwa gisirikare, bakarwanira politike y'imigenderanire n'amahanga yigungira kurusha, kandi bagashira imbere cane akaranga k'igihugu n'ak'imico.
