question: "Nolan framework හි ඉදිරිපත් කරන පරිදි statism හි නිර්වචනය කුමක්ද?"
answer: "සභ්‍යත්වය, වැඩකරන පන්තිය, ස්වභාවධර්මය, හෝ පීඩිතයන් ආරක්ෂා කිරීමේ නාමයෙන් හෝ වේවා, සමාජය පාලනය කර හැඩගැස්වීමට නීති සම්පාදනය භාවිත කිරීම"
wrong_answers:
  - "තේරී පත් වූ නිලධාරීන් නියමිත කාලසීමා සේවය කර, බලය democratic elections හරහා මාරු වන government ක්‍රමයක්"
  - "ජාතියක ස්වාධිපත්‍යය සහ භූමි අඛණ්ඩතාව ආරක්ෂා කළ හැක්කේ ශක්තිමත් military එකකට පමණි යන විශ්වාසය"
  - "tariffs සහ quotas හරහා විදේශීය තරඟයට වඩා ජාතික කර්මාන්තවලට ප්‍රමුඛතාව දෙන ආර්ථික දර්ශනයක්"
explanation: >-
  Statism යනු සමාජය පාලනය කර හැඩගැස්වීමට නීති සම්පාදනය භාවිත කිරීම ලෙස නිර්වචනය කෙරේ. වම සහ දකුණ දෙකම එය ක්‍රියාත්මක කරයි: සමහරු සභ්‍යත්වය ආරක්ෂා කිරීමේ නාමයෙන්, තවත් සමහරු වැඩකරන පන්තිය, ස්වභාවධර්මය, හෝ පීඩිතයන් ආරක්ෂා කිරීමේ නාමයෙන්. Centrists පවා එය තමන්ට ගැළපෙන විට අනුමත කරති. Statism military policy, trade protectionism, හෝ සරලව තේරී පත් වූ governments තිබීමකට පමණක් සීමා නොවේ.
reviewed: false
