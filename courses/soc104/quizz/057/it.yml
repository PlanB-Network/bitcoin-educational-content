question: "Qual è l'importante distinzione tra essere pro-business ed essere pro-market?"
answer: "Essere pro-business significa favorire un'alleanza tra grandi imprese e Stato, mentre essere pro-market significa sostenere la libera concorrenza senza favoritismi statali"
wrong_answers:
  - "Essere pro-business significa sostenere le piccole imprese, mentre essere pro-market significa sostenere le multinazionali"
  - "Essere pro-business significa opporsi del tutto alla regolazione, mentre essere pro-market significa accettare una regolazione moderata"
  - "Essere pro-business si concentra sull'industria nazionale, mentre essere pro-market si concentra sul commercio internazionale"
explanation: >-
  I centristi tendono a essere pro-business, cioè favoriscono una sorta di alleanza tra grandi imprese e Stato, cosa diversa dall'essere pro-market. Essere pro-market sostiene la libera concorrenza senza favoritismi statali o protezionismo aziendale. Questa distinzione è cruciale perché le politiche pro-business possono creare monopoli e protezioni regolatorie che in realtà minano la concorrenza di libero mercato.
