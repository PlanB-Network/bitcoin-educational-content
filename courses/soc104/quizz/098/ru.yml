question: "Почему шифропанки утверждали, что необходима цифровая валюта с анонимными свойствами?"
answer: "Потому что наличные, основная система анонимных транзакций, исчезают в цифровом обществе, и необходимо изобрести цифровую замену с теми же свойствами приватности"
wrong_answers:
  - "Потому что существующие цифровые платёжные системы были слишком медленными и дорогими, требуя более быстрой и дешёвой альтернативы для онлайн-коммерции"
  - "Потому что правительства уже запретили все формы анонимных транзакций, и только новая технология могла обойти эти законы"
  - "Потому что традиционные банки отказывались обслуживать определённые группы населения, делая универсально доступную цифровую платёжную систему экономической необходимостью"
explanation: >-
  Манифест шифропанков утверждает, что конфиденциальность в открытом обществе требует систем анонимных транзакций. До цифровой эпохи основной системой такого типа служили наличные. Но в цифровом обществе, где наличные исчезают, необходимо изобрести цифровую валюту с теми же свойствами анонимности. Это видение прямо предвосхитило то, чего достигнет Bitcoin.
