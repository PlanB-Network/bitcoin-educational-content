question: What is HTML primarily used for?
answer: Instructing web browsers how to display content on a web page
wrong_answers:
  - Performing mathematical calculations and data processing operations
  - Creating databases and managing server-side data storage
  - Building mobile applications and desktop software programs
explanation: |
  HTML is a markup language specifically designed to instruct web browsers how to display content such as text, images, and other elements on web pages. It is not a programming language and cannot perform calculations, manage databases, or create applications. HTML simply provides structure and formatting instructions that browsers interpret to render web content visually for users.
