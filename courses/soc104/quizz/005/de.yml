question: "Welche Gemeinsamkeit teilen linke und rechte politische Parteien trotz ihres scheinbaren Gegensatzes?"
answer: "Beide verteidigen das Recht des Staates, das Leben der Menschen durch Vorschriften und Steuern zu regieren"
wrong_answers:
  - "Beide setzen sich für die vollständige Abschaffung staatlicher Eingriffe in wirtschaftliche Angelegenheiten ein"
  - "Beide stellen individuelle Freiheit über die kollektive Organisation der Gesellschaft"
  - "Beide lehnen den Einsatz von Geldpolitik als Instrument für Staatsausgaben ab"
explanation: >-
  Obwohl sie gegensätzlich erscheinen, teilen Linke und Rechte eine Vorliebe für staatliche Intervention. Beide kritisieren den freien Markt und verteidigen das Recht des Staates, das Leben der Menschen durch Vorschriften und Steuern zu regieren. Die Linke kritisiert Märkte als Quelle von Ungleichheit, während die Rechte sie als Bedrohung für die Souveränität sieht, doch beide wenden sich für Lösungen an den Staat.
reviewed: false
