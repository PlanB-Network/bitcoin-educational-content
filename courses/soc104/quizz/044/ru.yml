question: "Как Зелёный новый курс представляет современную эволюцию демократического социализма?"
answer: "Он использует экологические проблемы как новое обоснование государственного вмешательства и конфискации частного дохода, подчиняя индивидуальный интерес коллективному планетарному здоровью"
wrong_answers:
  - "Он полностью отказывается от традиционной социалистической экономики в пользу рыночных решений экологических проблем через торговлю углеродными квотами"
  - "Он отвергает государственное вмешательство и вместо этого полагается на добровольные индивидуальные действия и инновации частного сектора для решения проблемы изменения климата"
  - "Он представляет собой разрыв с социализмом, ставя защиту окружающей среды выше всех вопросов социальной справедливости и занятости"
explanation: >-
  Зелёный новый курс соединяет экологические проблемы с социальными целями, сочетая экологический переход с социальной справедливостью, гарантиями занятости и усиленными общественными услугами. Индивидуальный интерес подчиняется коллективному интересу, определяемому планетарным здоровьем. По своей сути он предоставляет новую риторическую оболочку, оправдывающую государственное вмешательство и конфискацию частного дохода, уже не только во имя социальной справедливости, но и во имя окружающей среды.
reviewed: false
