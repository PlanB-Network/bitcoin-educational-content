question: "Welke waarschuwing gaf Milton Friedman over het beoordelen van politiek beleid?"
answer: "Beleid moet worden beoordeeld op zijn resultaten in plaats van op zijn intenties"
wrong_answers:
  - "Beleid moet worden beoordeeld op het morele karakter van de politici die het voorstellen"
  - "Beleid moet worden beoordeeld op hoe populair het is bij het algemene kiespubliek"
  - "Beleid moet worden beoordeeld op de vraag of het aansluit bij de oorspronkelijke grondwet van het land"
explanation: >-
  Friedman schreef dat een van de grootste fouten is om beleid te beoordelen op zijn intenties in plaats van op zijn resultaten, en merkte op dat programma's die worden voorgesteld als bedoeld voor de armen bijna altijd effecten produceren die tegengesteld zijn aan wat hun sponsors beoogden. Dit weerspiegelt Bastiats les dat een goede econoom zowel de kortetermijn- als de langetermijneffecten voor de hele bevolking in aanmerking neemt.
