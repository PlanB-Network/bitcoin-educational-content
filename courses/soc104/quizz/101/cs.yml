question: "Jak kurz tvrdí, že svoboda umožňuje levicovým i pravicovým hodnotám pokojně koexistovat?"
answer: "V režimu skutečné svobody mohou lidé s levicovými ideály dobrovolně sdílet majetek a přerozdělovat prostředky, zatímco ti s pravicovými hodnotami mohou spořit a předávat tradice, aniž by jedna strana vnucovala svůj způsob života té druhé"
wrong_answers:
  - "Svoboda vyžaduje, aby obě strany učinily kompromis přijetím centristické pozice, v níž vláda vyvažuje soupeřící hodnoty prostřednictvím umírněné regulace"
  - "Svoboda znamená, že levicové a pravicové komunity musí žít v oddělených geografických územích s vlastními nezávislými vládami"
  - "Svoboda funguje tak, že občanům umožňuje hlasovat o tom, které hodnoty mají být v každém regionu vynucovány, přičemž se v každém volebním cyklu střídají levicové a pravicové politiky"
explanation: >-
  Kurz ukazuje, že ve skutečném režimu svobody se ti, kdo se hlásí k levicovým ideálům, mohou dobrovolně vzdát majetku, sdílet výrobní prostředky nebo darovat mzdy přerozdělovacím organizacím. Ti s pravicovými hodnotami mohou tvrdě pracovat, spořit a předávat rodinné hodnoty. Nikdo by neměl ostatním vnucovat svůj způsob života. Právě prostřednictvím svobody trhu a síly volby lze cílů dosahovat pokojně.
