question: با توجه به قواعد نوع‌دهیِ «نوع‌های کوچک‌تر در مقدمات»، کدام ترکیب‌گرهای هسته‌ای واقعاً هنگام اجرا داده را جابه‌جا می‌کنند؟
answer: فقط iden و comp؛ هفت مورد دیگر با چیزی بیش از نگه‌داریِ اطلاعات ساختاری پیاده‌سازی نمی‌شوند.
wrong_answers:
  - فقط take و drop؛ استخراج یک مؤلفه ماشین را مجبور می‌کند آن را از product کپی کند.
  - فقط pair و case؛ تکثیر ورودی برای دو شاخه و انشعاب بر اساس یک برچسب، داده را جابه‌جا می‌کند.
  - فقط injl و injr؛ افزودن یک برچسب مقدار را به یک نمایش بزرگ‌ترِ نوع sum بازنویسی می‌کند.
explanation: >-
  برخلاف شهود، ترکیب‌گرهایی که شبیه دسترسی به داده به نظر می‌رسند (take،
  drop، pair، case، injl، injr) به هیچ کپی‌کردنی نیاز ندارند: چون مقدمات در
  قواعد نوع‌دهی نوع‌های کوچک‌تری نسبت به نتایجشان دارند، Bit Machine می‌تواند
  آن‌ها را فقط با نگه‌داریِ اطلاعات ساختاری پیاده‌سازی کند. فقط iden، که کل
  ورودی خود را به خروجی‌اش کپی می‌کند، و comp، که یک مقدار میانیِ عبور داده‌شده
  از f به g را مادی‌سازی می‌کند، واقعاً داده را جابه‌جا می‌کنند.
reviewed: false
