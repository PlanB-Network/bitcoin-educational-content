question: "カール・マルクスは空想的社会主義と科学的社会主義をどのように区別しましたか？"
answer: "彼は初期のフランス社会主義者が空想的な解決策を提案していると非難し、自身の科学的社会主義は史的唯物論と階級闘争に根ざしているとした"
wrong_answers:
  - "彼は空想的社会主義が経済に注目しすぎている一方、科学的社会主義は文化的・芸術的変革を優先すると論じた"
  - "彼は空想的社会主義者の実践的実験を称賛し、科学的社会主義は抽象的で理論的すぎると批判した"
  - "彼は空想的社会主義は暴力的で革命的であり、科学的社会主義は平和的な民主改革を支持すると主張した"
explanation: >-
  マルクスは、プルードン、サン＝シモン、フーリエのような初期フランス社会主義者を、純粋に空想的な解決策を提案する空想家だと非難した。彼の科学的社会主義は史的唯物論に基づいていた。すなわち、歴史は階級闘争と生産手段の取得を通じて進み、すべての文化的表象は生産力と生産関係によって条件づけられるという考えである。
reviewed: false
