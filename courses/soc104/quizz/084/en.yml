question: "What is the key distinction between being pro-business and being pro-market?"
answer: "Pro-business advocates seek state intervention to protect specific companies from failure, while pro-market advocates support deregulation and allow businesses to fail so the market can reorganize naturally"
wrong_answers:
  - "Pro-business advocates focus on large corporations while pro-market advocates focus exclusively on supporting small businesses and startups"
  - "Pro-business is a left-wing position that favors worker cooperatives while pro-market is a right-wing position that favors private ownership"
  - "Pro-business advocates reject all competition while pro-market advocates support government-regulated competition between approved enterprises"
explanation: >-
  The pro-business position views competition as an instrument of governance obtained through regulations and justifies subsidies and bailouts to prevent job losses. In the pro-business view, the market is fragile and needs state rescue. Pro-market advocates see competition as the natural result of free enterprise, implying deregulation and allowing businesses to fail, because failure allows the market to reorganize naturally and opens the field to more capable actors.
reviewed: false
