question: "Nolan diyagramında azami ekonomik özgürlükle ilişkilendirilen sembolik figürler hangileridir?"
answer: "Margaret Thatcher, Ronald Reagan ve Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaurès ve Bernie Sanders"
  - "Nelson Mandela, Simone Veil ve Noam Chomsky"
  - "Vladimir Putin, Xi Jinping ve Joseph de Maistre"
explanation: >-
  Thatcher, Reagan ve Milei; daha az devlet müdahalesini, daha az düzenlemeyi ve daha düşük vergileri tercih ederek azami ekonomik özgürlüğün sembolik figürleri olarak anılır. Roosevelt, Jaurès ve Sanders ekonomide devlet denetimini destekleyen karşı ucu temsil eder. Mandela, Veil ve Chomsky azami kişisel özgürlüğü temsil eder. Putin, Xi Jinping ve de Maistre ise kişisel yaşam üzerinde azami devlet denetimini temsil eder.
reviewed: false
