question: "Kuidas erinesid Hitleri Saksamaa ja Stalini Nõukogude Liidu majanduslikud lähenemised, hoolimata nende ühistest totalitaarsetest meetoditest?"
answer: "Natsi-Saksamaa säilitas eraomandi näivuse, allutades erasektori riigi eesmärkidele, samal ajal kui stalinism kaotas kogu eraomandi ja planeeris majandust täielikult"
wrong_answers:
  - "Natsi-Saksamaa natsionaliseeris täielikult kõik tööstusharud, samal ajal kui Stalini režiim lubas põllumajanduses piiratud eraettevõtlust"
  - "Natsi-Saksamaa edendas vaba rahvusvahelist kaubandust taasrelvastumise rahastamiseks, samal ajal kui stalinism kehtestas täieliku majandusliku isolatsiooni"
  - "Natsi-Saksamaa toetus ettevõtete vabatahtlikule koostööle riigiga, samal ajal kui stalinism kasutas ainult sunnitööd"
explanation: >-
  Kuigi mõlemad režiimid kasutasid identseid poliitilisi meetodeid (isiksusekultus, totaalne jälgimine, opositsiooni süstemaatiline kõrvaldamine), erinesid nende majandusmudelid vormilt. Natsi-Saksamaa ei kaotanud eraomandit formaalselt, vaid allutas erasektori täielikult riigi eesmärkidele nagu sõda ja taasrelvastumine, kehtestades majandusliku autarkia. Stalinism läks kaugemale, kaotades kogu eraomandi, rakendades viisaastakuplaane ning kontrollides otse kogu tootmist ja jaotust.
