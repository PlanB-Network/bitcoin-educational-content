question: What is the main difference between block elements and inline elements in HTML?
answer: Block elements cover the full width of the page and force new lines before and after
wrong_answers:
  - Block elements can only contain text while inline elements can contain images
  - Block elements are faster to load while inline elements require more processing time
  - Block elements are used for styling while inline elements are used for content structure
explanation: |
  Block elements like <div>, <p>, and <h1> take up the full width available and create line breaks before and after themselves, causing them to stack vertically. Inline elements like <span>, <a>, and <img> only take up as much width as needed and can sit side by side on the same line. This fundamental difference affects how content flows and is positioned on a webpage, making it crucial for proper HTML layout and structure.
