question: "O que significa o termo 'holismo' no contexto da filosofia socialista?"
answer: "Uma visão da sociedade como um todo indivisível em que o coletivo tem primazia sobre o indivíduo"
wrong_answers:
  - "Uma filosofia que trata cada indivíduo como uma unidade autônoma cujos direitos não podem ser sobrepostos por nenhum grupo"
  - "Uma teoria econômica que defende equilibrar os setores público e privado em igual medida"
  - "Uma estratégia política que integra todos os pontos de vista minoritários em uma única plataforma baseada em consenso"
explanation: >-
  Holismo vem do grego 'holos', que significa 'o todo'. No pensamento socialista, refere-se a uma visão da sociedade como um todo indivisível, em vez de uma simples soma de indivíduos. O Estado socialista busca assumir o controle e dirigir a atividade humana ao máximo. Esse coletivo pode ser representado como uma classe social, uma nação, uma raça ou um gênero, mas em cada caso o indivíduo é definido pelo pertencimento ao grupo.
