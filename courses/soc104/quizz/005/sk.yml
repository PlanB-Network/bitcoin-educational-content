question: "Aké sú dve osi Nolanovho diagramu?"
answer: "Vertikálna os merajúca osobné slobody a horizontálna os merajúca ekonomické slobody"
wrong_answers:
  - "Horizontálna os zľava doprava a vertikálna os od autoritárstva k demokracii"
  - "Vertikálna os merajúca bohatstvo a horizontálna os merajúca úroveň vzdelania"
  - "Horizontálna os od socializmu ku kapitalizmu a vertikálna os od tradície k pokroku"
explanation: >-
  David Nolan navrhol svoj diagram s dvoma konkrétnymi osami: osobné slobody (vertikálne) a ekonomické slobody (horizontálne). Tento dvojrozmerný prístup nahrádza príliš zjednodušenú ľavicovo-pravicovú líniu a lepšie zachytáva zložitosť politických ideológií tým, že oddeľuje dve hlavné kategórie slobody.
