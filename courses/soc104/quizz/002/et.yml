question: "Miks peetakse vasak-parem telge ebapiisavaks klassikaliste liberaalsete mõtlejate, nagu Bastiat või Ron Paul, paigutamiseks?"
answer: "Sest klassikaline liberalism väärtustab nii majanduslikke kui ka isiklikke vabadusi, mida ei vasak ega parem täielikult omaks ei võta"
wrong_answers:
  - "Sest klassikalised liberaalid joonduvad alati parempoolse majanduspoliitikaga ja lükkavad tagasi kõik vasakpoolsed seisukohad"
  - "Sest klassikalised liberaalid on tsentristid, kes võtavad omaks nii vasak- kui parempoolsete ideoloogiate mõõdukad versioonid"
  - "Sest klassikalised liberaalid vastustavad kõiki valitsemisvorme, mistõttu nad on pigem anarhistid kui poliitilised mõtlejad"
explanation: >-
  Vasak-parem telg ei sobi klassikaliste liberaalide jaoks, sest see ei mahuta positsiooni, mis kaitseb korraga majanduslikku vabadust (tavaliselt paremal) ja isiklikku vabadust (tavaliselt vasakul). Klassikalised liberaalid ei ole kompromissi otsivad tsentristid, samuti ei ole nad anarhistid ega puhtalt parempoolsed. Nad lihtsalt ei mahu ühemõõtmelisele spektrile.
reviewed: false
