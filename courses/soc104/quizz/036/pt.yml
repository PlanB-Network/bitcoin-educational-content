question: "Em que uma definição estrutural de um sistema político se concentra?"
answer: "Em como o sistema realmente funciona e em suas características observáveis, como o grau de controle estatal"
wrong_answers:
  - "Nos objetivos declarados e nas nobres intenções anunciadas pelos fundadores e líderes do sistema"
  - "Nas origens históricas do movimento político e nas biografias de seus principais pensadores"
  - "No número de partidos políticos permitidos e na frequência das eleições democráticas realizadas"
explanation: >-
  Definições estruturais se concentram em como os sistemas políticos realmente funcionam e em suas características observáveis. Por exemplo, o socialismo é estruturalmente caracterizado pela onipresença do Estado. Essa abordagem contrasta com definições intencionais, que se baseiam em motivações e objetivos declarados. A abordagem estrutural permite uma avaliação mais objetiva com base em resultados mensuráveis.
