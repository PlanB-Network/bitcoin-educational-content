question: De ce fiziocrații, apărători ai libertății economice, au rămas mari sceptici față de democrație?
answer: Democrația reprezintă potențial înrobirea minorității de către majoritate
wrong_answers:
  - Monarhia este mai puțin costisitoare decât democrația
  - Fiziocrații numărau printre rândurile lor mai mulți membri de rang înalt ai curții regelui
  - Credeau că oamenii erau prea ignoranți pentru a lua decizii informate
explanation: |
  Fiziocrații se temeau că democrația va duce la tirania majorității, în care interesele minorității ar fi sacrificate în beneficiul majorității. Ei preferau o guvernare luminată, capabilă să ia decizii raționale și să apere drepturile tuturor.
