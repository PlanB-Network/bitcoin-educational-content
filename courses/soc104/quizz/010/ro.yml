question: "Ce include categoria libertății economice?"
answer: "Ceea ce faci ca producător și consumator: cumperi, vinzi, produci, muncești, angajezi și îți gestionezi banii"
wrong_answers:
  - "Convingerile tale religioase, relațiile personale și libertatea de exprimare"
  - "Dreptul tău de a vota, de a participa la alegeri și de a te înscrie în partide politice"
  - "Capacitatea ta de a călători liber, de a-ți alege reședința și de a traversa frontiere naționale"
explanation: >-
  Libertatea economică acoperă ceea ce faci ca producător și consumator: ce poți cumpăra, vinde sau produce; unde lucrezi; pe cine angajezi; și ce faci cu banii tăi. Relațiile personale, convingerile religioase și libertatea de circulație intră în categoria libertății personale, nu în cea economică.
reviewed: false
