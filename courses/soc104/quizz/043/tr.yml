question: "Sosyalizm, toplumsal ve ekonomik alanlarda özgürlüklere nasıl farklı davranır?"
answer: "Sosyalizm toplumsal alanda güçlü özgürlükleri, ekonomik alanda ise zayıf özgürlükleri tercih eder"
wrong_answers:
  - "Sosyalizm, hem toplumsal hem de ekonomik alanlarda tüm özgürlükleri eşit biçimde kısıtlar"
  - "Sosyalizm güçlü ekonomik özgürlükleri tercih eder, ancak toplumsal düzeni korumak için toplumsal özgürlükleri kısıtlar"
  - "Sosyalizm her iki alanda da sınırsız özgürlükler tanır ve dengeyi korumak için gönüllü işbirliğine dayanır"
explanation: >-
  Sosyalist düşüncede toplumsal ve ekonomik özgürlükler arasında temel bir ikilik vardır. Toplumsal özgürlükler güçlüdür, ancak devlet kontrolüne, planlamaya ve servet yeniden dağıtımına yapılan vurgu nedeniyle ekonomik özgürlükler zayıftır. Üçüncü yanlış cevap liberteryen ideali açıklar; ikinci cevap ise sosyalizmin ayna görüntüsü olan muhafazakâr örüntüyü açıklar.
reviewed: false
