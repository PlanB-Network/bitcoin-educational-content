question: Ni itandukaniro nyamukuru irihe riri hagati yo gukoresha ibikoresho vyo kurondera kumbuga mu buryo bwihariye no gukoresha urubuga rwa TOR?
answer: Tor inyegeza IP y'ukoresha Address, bitandukanye n'ibindi bikoresho vyo kurondera ku mbuga.
wrong_answers:
  - Ibikoresho vyo kurondera kuri interineti mu buryo bwihariye na TOR ni kimwe.
  - Kurondera kumbuga mu buryo bwihariye bipfuka IP Address y’ukoresha, mu gihe TOR itabipfuka.
  - TOR isiga ibimenyetso vyo mu karere kuri nyabwoya yawe, mu gihe kugendera mu buryo bwihariye bitabikora.
explanation: |
  Gusura mu buryo bwihariye ni ikintu kibuza interineti
  umucukumbuzi kuva mu kubika amateka y'umucukumbuzi, interineti y'igihe gito
  dosiye, amakuru y’ifomu, amakuru, n’amazina y’abakoresha n’amajambobanga.
  Ariko rero, ntibihisha gusura kuri interineti yawe .
  uwutanga ibikorwa. Ku rundi ruhande, urubuga rwa TOR rutanga .
  kutamenyekana mu gupfuka IP y'ukoresha Address no kwemera
  gushika ku rubuga rw’umwiza.
reviewed: true
