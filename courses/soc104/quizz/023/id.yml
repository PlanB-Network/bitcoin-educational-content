question: "Bagaimana seorang libertarian yang konservatif secara budaya menangani perilaku yang tidak mereka setujui secara moral?"
answer: "Mereka menentang dan mengecilkan hati perilaku tersebut melalui persuasi dan teladan, tetapi tanpa menggunakan kekuatan koersif hukum"
wrong_answers:
  - "Mereka mendukung larangan pemerintah lokal terhadap perilaku tersebut sambil menentang larangan di tingkat federal"
  - "Mereka tetap sepenuhnya diam tentang perilaku tersebut, karena percaya bahwa segala bentuk ketidaksetujuan melanggar kebebasan individu"
  - "Mereka menganjurkan tribunal komunitas yang dapat menghukum perilaku tersebut di luar sistem hukum formal"
explanation: >-
  Libertarian yang konservatif secara budaya mungkin tidak menyetujui perilaku tertentu secara moral, tetapi tidak menganjurkan pelarangan hukum atas tindakan konsensual dan non-agresif. Mereka mungkin tidak menyukai tindakan tersebut, menentangnya, dan secara aktif mengecilkan hatinya, tetapi selalu melalui persuasi, pendidikan, dan teladan, bukan melalui kekuatan koersif hukum. Ini bukan tentang tetap diam atau menciptakan mekanisme penegakan alternatif.
reviewed: false
