question: "Zašto se intencionalne definicije političkih sistema smatraju problematičnim za analitičke svrhe?"
answer: "Stvaraju pojmovnu konfuziju jer svi sistemi tvrde da slede slične ciljeve poput pravde, pravičnosti i slobode"
wrong_answers:
  - "Previše su precizne i krute, ne ostavljajući prostor za prirodnu evoluciju političkih pokreta tokom vremena"
  - "Previše se usredsređuju na ekonomske ishode i zanemaruju kulturne i društvene dimenzije političkog života"
  - "Oslanjaju se na poverljive vladine dokumente koji su retko dostupni nezavisnim istraživačima"
explanation: >-
  Intencionalne definicije oslanjaju se na deklarisane motivacije i ciljeve, ali svaki politički sistem tvrdi da teži pravdi, pravičnosti i slobodi. Zbog toga postaje nemoguće razlikovati sisteme jedne od drugih. Strukturna analiza, nasuprot tome, procenjuje sisteme prema njihovim empirijskim, merljivim posledicama i sredstvima koja koriste, otkrivajući njihovu pravu prirodu iza retorike.
reviewed: false
