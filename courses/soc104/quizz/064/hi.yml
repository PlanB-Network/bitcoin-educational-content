question: "आग्नेयास्त्रों के नियमन के प्रश्न पर कंजरवेटिव और लिबर्टेरियन स्थितियों के बीच निर्णायक अंतर क्या है?"
answer: "दोनों कुछ नियमन स्वीकार करते हैं, लेकिन कंजरवेटिव चाहते हैं कि नियम वैध सार्वजनिक प्राधिकरण से आएं, जबकि लिबर्टेरियन चाहते हैं कि नियम सीधे संबंधित लोगों से उभरें, जैसे नागरिक संघों और बाज़ार प्रतिस्पर्धा से"
wrong_answers:
  - "कंजरवेटिव सभी आग्नेयास्त्र नियमन का विरोध करते हैं, जबकि लिबर्टेरियन सार्वजनिक सुरक्षा के लिए कड़े सरकारी नियंत्रण को स्वीकार करते हैं"
  - "कंजरवेटिव आग्नेयास्त्रों पर पूरी तरह प्रतिबंध लगाना चाहते हैं, जबकि लिबर्टेरियन सभी हथियारों तक अनियंत्रित पहुंच का समर्थन करते हैं"
  - "कंजरवेटिव अपनी स्थिति को व्यक्तिगत अधिकारों पर आधारित करते हैं, जबकि लिबर्टेरियन अपनी स्थिति को सामूहिक जिम्मेदारी पर आधारित करते हैं"
explanation: >-
  कंजरवेटिव और लिबर्टेरियन दोनों सहमत हैं कि हथियार रखने के लिए किसी न किसी प्रकार का नियमन आवश्यक है। निर्णायक अंतर इस बात में है कि वे नियम कौन बनाता है। कंजरवेटिव इस पर जोर देते हैं कि नियम उस सार्वजनिक प्राधिकरण से आने चाहिए जिसे सामान्य भलाई की रक्षा का दायित्व दिया गया हो (ऊपर से नीचे)। लिबर्टेरियन तर्क देते हैं कि नियमन सीधे संबंधित लोगों से उभरना चाहिए: सुरक्षा पेशेवरों, नागरिक संघों और बाज़ार प्रतिस्पर्धा से (नीचे से ऊपर)।
reviewed: false
