question: "What is Hannah Arendt's key distinction between classical despotism and totalitarianism?"
answer: "Totalitarianism does not merely subject people to tyrannical rules but renders human beings incapable of independent action, negating politics itself"
wrong_answers:
  - "Classical despotism controls the economy while totalitarianism controls only political and military institutions"
  - "Totalitarianism is simply a more extreme version of despotism, differing only in the scale of repression"
  - "Classical despotism uses ideology to justify its rule while totalitarianism relies purely on military force"
explanation: >-
  Arendt argues that totalitarianism is fundamentally different from classical despotism. It is not simply a more extreme tyranny but a system that renders human beings superfluous, destroying their capacity for independent action. For Arendt, politics is the capacity of a people to take its destiny in hand, and totalitarianism is the very negation of this capacity, making it qualitatively different from despotism.
