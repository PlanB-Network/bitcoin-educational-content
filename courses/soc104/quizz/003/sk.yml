question: "Aký vodiaci princíp určoval hlasovania Frederica Bastiata v Národnom zhromaždení?"
answer: "Podpora individuálnych a ekonomických slobôd a znižovanie vládnych zásahov"
wrong_answers:
  - "Obrana kráľovskej autority a zachovanie monarchických tradícií"
  - "Presadzovanie socialistických politík na rovnomernejšie prerozdeľovanie bohatstva"
  - "Centristická stratégia kompromisu medzi ľavicovými a pravicovými frakciami"
explanation: >-
  Bastiat hlasoval na základe základného princípu: podporovať individuálne a ekonomické slobody a zároveň znižovať vládne zásahy. Nebol centristický oportunista, ani royalista či socialista. Hlasoval s tou stranou, ktorá navrhovala opatrenia v súlade so slobodou a obmedzenou vládou.
