question: Taprootに対応したHTLCで、スワップが失敗し、一方が非協調的なパスで資金を回収しなければならない場合、Bitcoinネットワークにはどのような情報が公開されますか？
answer: 資金の回収に必要なハッシュロックまたはタイムロックの条件を含む、マークルツリーの特定のブランチだけ
wrong_answers:
  - "考えられるすべての実行パスと、両者それぞれの公開鍵を含むスクリプトのロジック全体"
  - プリイメージの秘密と、MuSig2の鍵集約の過程で使われたすべての集約公開鍵
  - スワップの金額、期限、LightningとLiquidの両方のアドレスを含む、HTLCの契約条件全体
explanation: |
  TaprootはHTLCの条件をマークルツリーの構造で整理するため、必要な部分だけを選んで開示できます。協調が成立しなかった場合でも、資金を回収する権利を証明するのに必要なブランチだけが公開され、その他の契約の詳細は隠されたままです。スクリプト全体を公開していた従来のHTLCとは異なり、またスクリプトの詳細がまったく公開されない協調的なケースとも異なります。