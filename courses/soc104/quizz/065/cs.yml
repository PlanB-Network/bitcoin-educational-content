question: "Jaký je v otázce regulace střelných zbraní zásadní rozdíl mezi konzervativní a libertariánskou pozicí?"
answer: "Obě přijímají určitou regulaci, ale konzervativci chtějí pravidla od legitimní veřejné autority, zatímco libertariáni chtějí, aby pravidla vycházela od těch, kterých se přímo týkají, například od občanských sdružení a tržní konkurence"
wrong_answers:
  - "Konzervativci odmítají jakoukoli regulaci střelných zbraní, zatímco libertariáni přijímají přísnou vládní kontrolu kvůli veřejné bezpečnosti"
  - "Konzervativci chtějí střelné zbraně zcela zakázat, zatímco libertariáni podporují neomezený přístup ke všem zbraním"
  - "Konzervativci zakládají svůj postoj na individuálních právech, zatímco libertariáni na kolektivní odpovědnosti"
explanation: >-
  Konzervativci i libertariáni souhlasí, že pro nošení zbraní je nezbytná určitá forma regulace. Zásadní rozdíl spočívá v tom, kdo tato pravidla stanovuje. Konzervativci trvají na tom, že regulace musí vycházet z veřejné autority pověřené ochranou obecného dobra (shora dolů). Libertariáni tvrdí, že regulace by měla vycházet od těch, kterých se přímo týká: bezpečnostních profesionálů, občanských sdružení a tržní konkurence (zdola nahoru).
