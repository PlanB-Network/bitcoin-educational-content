question: "Milliseid sümboolseid tegelasi seostatakse Nolani diagrammil maksimaalse majandusliku vabadusega?"
answer: "Margaret Thatcher, Ronald Reagan ja Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures ja Bernie Sanders"
  - "Nelson Mandela, Simone Veil ja Noam Chomsky"
  - "Vladimir Putin, Xi Jinping ja Joseph de Maistre"
explanation: >-
  Thatcherit, Reaganit ja Mileid nimetatakse maksimaalse majandusliku vabaduse sümboolsete tegelastena, kes eelistavad väiksemat riiklikku sekkumist, vähem regulatsioone ja madalamaid makse. Roosevelt, Jaures ja Sanders esindavad vastaspoolust, mis eelistab riiklikku kontrolli majanduse üle. Mandela, Veil ja Chomsky esindavad maksimaalset isiklikku vabadust. Putin, Xi Jinping ja de Maistre esindavad maksimaalset riiklikku kontrolli isikliku elu üle.
reviewed: false
