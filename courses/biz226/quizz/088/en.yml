question: 'Why did civilizations on different continents independently converge on the same metals as money?'
answer: 'These metals share physical properties (malleability, stability, scarcity) making them superior monetary goods, driven by nature not convention'
wrong_answers:
  - 'Trade routes connected all civilizations so the choice spread culturally'
  - 'Religious texts prescribed the same metals as sacred'
  - 'Colonial powers imposed metallic standards on conquered peoples'
explanation: >-
  Copper, silver, and gold share the same periodic table column. Gold is most inert and scarce. Independent convergence undermines the claim that money is just a shared delusion.
reviewed: false
