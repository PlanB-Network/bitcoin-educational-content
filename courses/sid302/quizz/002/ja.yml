question: Liquid Networkでは、新しいブロックはどのくらいの間隔で生成されますか？
answer: 1分ごと
wrong_answers:
  - 10分ごと
  - 30秒ごと
  - 5分ごと
explanation: |
  Liquid Networkは、あらかじめ決められた順番で交代するラウンドロビン方式で1分ごとにブロックを生成します。確率的に約10分間隔となるBitcoinと比べて、はるかに速く、予測しやすいのが特徴です。この正確な1分間隔は、裁定取引や取引所間の迅速な決済といったLiquidのユースケースに欠かせず、機関投資家の取引業務に必要なスピードを提供します。