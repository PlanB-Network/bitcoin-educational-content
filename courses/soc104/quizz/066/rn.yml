question: "Uburyo bw'ubukungu bw'Ubudagi bwa Hitler n'Ubumwe bw'Abasoviyeti bwa Stalin bwatandukanye gute, naho bwari busangiye uburyo bw'igitugu bugenzura vyose?"
answer: "Ubudagi bwa Nazi bwagumije ishusho y'uko hariho umutungo w'abikorera ku giti cabo mu gihe bwashira igisata c'abikorera munsi y'intumbero za Leta, mu gihe ubustalinisite bwakuyeho umutungo wose w'abikorera kandi butegura ubukungu bwose"
wrong_answers:
  - "Ubudagi bwa Nazi bwashize amashirahamwe yose mu maboko ya Leta, mu gihe intwaro ya Stalin yemereye ubucuruzi buke bw'abikorera mu burimyi"
  - "Ubudagi bwa Nazi bwateje imbere ubudandaji mpuzamakungu bwisanzuye kugira buronke amahera yo gusubira kwitwaza ibirwanisho, mu gihe ubustalinisite bwashizeho ukwigungira mu bukungu kwuzuye"
  - "Ubudagi bwa Nazi bwishimikije ubufatanye bw'amasosiyete na Leta ku bushake, mu gihe ubustalinisite bwakoresheje gusa ibikorwa vy'agahato"
explanation: >-
  Naho izo ntwaro zompi zakoresheje uburyo bwa politike bumwe (gusenga indongozi, ugucungera abantu hose, gukuraho abatavuga rumwe na zo ku buryo butunganijwe), uburyo bwazo bw'ubukungu bwatandukanye mu buryo. Ubudagi bwa Nazi ntibwakuyeho ku mugaragaro umutungo w'abikorera ku giti cabo, ariko bwashize rwose igisata c'abikorera munsi y'intumbero za Leta nk'intambara no gusubira kwitwaza ibirwanisho, bushiraho ubukungu bwifungiraniye. Ubustalinisite bwaragiye kure kuruta, bukuraho umutungo wose w'abikorera, bushira mu ngiro imigambi y'imyaka itanu, kandi bugenzura ubuhinguriro bwose n'ikwiragizwa ry'ibintu ata wundi abiciyemwo.
