question: "Jak Green New Deal představuje současný vývoj demokratického socialismu?"
answer: "Využívá environmentální obavy jako nové ospravedlnění státních zásahů a konfiskace soukromého příjmu a podřizuje individuální zájem kolektivnímu planetárnímu zdraví"
wrong_answers:
  - "Zcela opouští tradiční socialistickou ekonomii ve prospěch tržních řešení environmentálních problémů prostřednictvím obchodování s uhlíkem"
  - "Odmítá státní zásahy a místo toho spoléhá na dobrovolné individuální jednání a inovace soukromého sektoru při řešení klimatické změny"
  - "Představuje rozchod se socialismem tím, že upřednostňuje ochranu životního prostředí před všemi otázkami sociální spravedlnosti a zaměstnanosti"
explanation: >-
  Green New Deal spojuje environmentální obavy se sociálními cíli, kombinuje ekologickou transformaci se sociální spravedlností, garancemi zaměstnání a posílenými veřejnými službami. Individuální zájem je podřízen kolektivnímu zájmu definovanému planetárním zdravím. V jádru poskytuje nový rétorický obal ospravedlňující státní zásahy a konfiskaci soukromého příjmu, už nejen ve jménu sociální spravedlnosti, ale také ve jménu životního prostředí.
