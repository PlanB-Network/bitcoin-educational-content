question: Turgot පැසසුම් කළ ආර්ථික විද්‍යාඥයා කවුද?
answer: Vincent de Gournay
wrong_answers:
  - François Quesnay
  - The Marquis d'Argenson
  - Adam Smith
explanation: |
  Turgot Vincent de Gournay පැසසුම් කරමින් ලිවීය. එහිදී ඔහු ආර්ථික ලිබරල්වාදයේ පුරෝගාමියෙකු ලෙස ඔහුගේ භූමිකාව සහ ප්‍රංශ ආර්ථික චින්තනයට කළ බලපෑම අවධාරණය කළේය.