question: "Каква обща политическа цел имат левите и десните етатисти?"
answer: "Да спечелят властта, за да организират обществото според своята визия за света и да я наложат на всички"
wrong_answers:
  - "Да намалят размера на правителството и да върнат властта за вземане на решения на отделните граждани"
  - "Да установят пряка демокрация, при която всеки гражданин гласува за всяко законодателно решение"
  - "Да премахнат политическите партии и да ги заменят с независимо технократско управление"
explanation: >-
  И левите, и десните етатисти споделят една и съща политическа цел: да спечелят властта, за да организират обществото според своя светоглед и да го наложат на всички чрез законодателство. Разликата е само в техните ценности: десницата се позовава на защитата на цивилизацията, докато левицата се позовава на защитата на работническата класа или потиснатите. Нито едните, нито другите се стремят да намалят правителството или да премахнат партиите.
reviewed: false
