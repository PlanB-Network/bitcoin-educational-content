question: Hva er eksempelet brukt av Leonard Read for å illustrere usynlig samarbeid?
answer: Produksjonen av en blyant
wrong_answers:
  - Byggingen av et hus
  - Produksjonen av en bil
  - Organiseringen av en by
explanation: |
  Leonard Read bruker eksempelet med en blyant for å demonstrere hvordan mange individer samarbeider uten å kjenne hverandre for å produsere en enkel vare.
