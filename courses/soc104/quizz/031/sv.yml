question: "Vad anser de franska libertärerna (socialistiska anarkister) om privat egendom?"
answer: "Privat egendom och kapitalism måste avskaffas eftersom de är källor till förtryck"
wrong_answers:
  - "Privat egendom är en naturlig rätt som föregår staten och måste skyddas till varje pris"
  - "Privat egendom bör regleras av staten men aldrig helt avskaffas ur samhället"
  - "Privat egendom är acceptabel endast när den fördelas lika mellan alla medlemmar i en kommun"
explanation: >-
  De franska libertärerna, arvtagare till socialistisk anarkism genom tänkare som Proudhon och Bakunin, menar att både staten och den privata egendomen måste avskaffas som två sammanlänkade källor till förtryck. Detta fångas i Proudhons berömda formulering "Egendom är stöld." Det första felaktiga svaret beskriver den libertarianska positionen, som står i grundläggande motsättning till den libertära synen.
