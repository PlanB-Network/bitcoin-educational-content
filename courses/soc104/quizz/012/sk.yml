question: "Čo zahŕňa kategória ekonomickej slobody?"
answer: "To, čo robíte ako producent a spotrebiteľ: nákup, predaj, výroba, práca, najímanie a správa svojich peňazí"
wrong_answers:
  - "Vaše náboženské presvedčenia, osobné vzťahy a slobodu prejavu"
  - "Vaše právo voliť, zúčastňovať sa volieb a vstupovať do politických strán"
  - "Vašu schopnosť slobodne cestovať, vybrať si bydlisko a prekračovať štátne hranice"
explanation: >-
  Ekonomická sloboda zahŕňa to, čo robíte ako producent a spotrebiteľ: čo môžete kupovať, predávať alebo vyrábať; kde pracujete; koho najímate; a čo robíte so svojimi peniazmi. Osobné vzťahy, náboženské presvedčenia a sloboda pohybu patria do kategórie osobnej slobody, nie ekonomickej.
