question: "Какъв скрит парадокс се крие в центристкия прагматизъм?"
answer: "Самият прагматизъм почива върху форма на догматизъм, а именно неизразеното убеждение, че само експертите са компетентни да направляват обществото"
wrong_answers:
  - "Центристите твърдят, че са умерени, но последователно се съюзяват с леви партии в коалиционни правителства"
  - "Центристките политики изглеждат балансирани, но винаги предпочитат икономическия растеж пред опазването на околната среда"
  - "Центристите отхвърлят идеологията, но приемат твърди принципи на свободния пазар, когато вземат икономически решения"
explanation: >-
  Парадоксът на центристкия прагматизъм е, че той твърди, че отхвърля идеологията в полза на рационална експертиза, но самото това твърдение почива върху невидима и неизразена догма: че само технократите са способни да вземат правилните решения. Това убеждение, че единствено експертите трябва да направляват обществото, само по себе си е идеологическа ангажираност, въпреки че центристите не го разпознават като такава.
