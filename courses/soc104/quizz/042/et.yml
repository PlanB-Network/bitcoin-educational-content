question: "Mida tähendab mõiste 'holism' sotsialistliku filosoofia kontekstis?"
answer: "Nägemus ühiskonnast kui jagamatust tervikust, kus kollektiiv on üksikisiku suhtes esmane"
wrong_answers:
  - "Filosoofia, mis käsitleb iga üksikisikut iseseisva üksusena, kelle õigusi ei või ükski rühm kõrvale tõrjuda"
  - "Majandusteooria, mis pooldab avaliku ja erasektori võrdset tasakaalustamist"
  - "Poliitiline strateegia, mis ühendab kõik vähemusvaated üheks konsensuspõhiseks platvormiks"
explanation: >-
  Holism pärineb kreeka sõnast 'holos', mis tähendab 'tervikut'. Sotsialistlikus mõtlemises viitab see nägemusele ühiskonnast kui jagamatust tervikust, mitte üksikisikute lihtsast summast. Sotsialistlik riik püüab inimtegevust maksimaalselt enda hoole alla võtta ja suunata. Seda kollektiivi võib esindada ühiskonnaklass, rahvus, rass või sugu, kuid igal juhul määratletakse üksikisikut rühmakuuluvuse kaudu.
reviewed: false
