question: "Uburyo bw'amafaranga fiat bukomeza gute igaburwa hagati y'abatwara n'abatwarwa?"
answer: "Butuma leta zishobora kuriha ugukoresha amahera kutagira imbibe biciye mu kurema amahera, bigatuma ivyo abantu babitse bitakaza agaciro kubera uguta agaciro kw'amahera"
wrong_answers:
  - "Buha abanyagihugu ububasha butaziguye bwo kugenzura politike y'amahera biciye mu matora ya demokarasi no mu matora ya referendumu"
  - "Bubuza leta kugurana amahera, bukazihata kwisunga amakori gusa kugira ngo zironke amafaranga"
  - "Bukwiragiza amahera mashasha yaremwe ku banyagihugu bose ku rugero rungana kugira ngo butume ubutunzi bukura"
explanation: >-
  Ifaranga fiat ridondorwa nk'ibuye ry'imfuruka ryo kwagura ububasha bwa leta kubera ko rituma leta zigurana amahera kandi zigasunika amabanki gucapura amahera mashasha. Uguta agaciro kw'amahera bivamwo gutuma ivyo abantu babitse bitakaza agaciro, bikagirira akamaro abafise ubutunzi bwinshi n'inzego zifise ububasha kuruta izindi. Ntibiha abanyagihugu ububasha bwo kugenzura amahera, kandi ntibibuza kugurana canke ngo bikwiragize amahera ku rugero rungana.
