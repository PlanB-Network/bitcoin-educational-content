question: "Vad är definitionen av statism som den presenteras i Nolan-ramverket?"
answer: "Att använda lagstiftning för att kontrollera och forma samhället, vare sig det sker i namn av att försvara civilisationen, arbetarklassen, naturen eller de förtryckta"
wrong_answers:
  - "Ett styrelseskick där valda företrädare tjänstgör under fasta mandatperioder och makten övergår genom demokratiska val"
  - "Uppfattningen att endast en stark militär kan skydda en nations suveränitet och territoriella integritet"
  - "En ekonomisk filosofi som prioriterar nationella industrier framför utländsk konkurrens genom tullar och kvoter"
explanation: >-
  Statism definieras som att använda lagstiftning för att kontrollera och forma samhället. Både vänstern och högern utövar den: vissa i namn av att försvara civilisationen, andra i namn av att försvara arbetarklassen, naturen eller de förtryckta. Även centrister godkänner den när det passar dem. Statism är inte begränsad till militärpolitik, handelsskydd eller bara till att ha valda regeringar.
reviewed: false
