bio: |
  Linnéa are un doctorat în Sisteme Electronice. Este traducătoarea în suedeză a cărții The Little Bitcoin Book și co-traducătoare a cărții The Bitcoin Standard. Face de asemenea parte din consiliul Swedish Bitcoin Association. Are experiență în dezvoltare de firmware, cu o trecere recentă spre dezvoltarea de software.

short_bio: Co-autoare a cărții despre filosofia dezvoltării Bitcoin
