question: "Какво вътрешно напрежение съществува сред либертарианците върху диаграмата на Нолан?"
answer: "Някои искат изцяло да премахнат държавата (анархокапиталисти), докато други предпочитат минимална държава, запазваща основни суверенни функции (минархисти)"
wrong_answers:
  - "Някои искат силна икономическа регулация, докато други предпочитат пълна дерегулация на всички индустрии"
  - "Някои подкрепят демократични избори, докато други предпочитат наследствена система на управление"
  - "Някои се застъпват за прогресивни социални политики, докато други защитават строго традиционни морални ценности"
explanation: >-
  В рамките на либертарианското семейство съществува фундаментално несъгласие относно ролята на държавата. Анархокапиталистите искат да заменят всички държавни функции с частни услуги, докато минархистите приемат минимална държава, която запазва основни суверенни функции като отбрана и съдилища. И двете групи споделят либертарианския връх, но се различават по това дали изобщо трябва да съществува някаква държава.
