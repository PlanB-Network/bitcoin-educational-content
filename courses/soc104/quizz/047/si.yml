question: "Michael Oakeshott තම philosophical work තුළ conservatism විස්තර කළේ කෙසේද?"
answer: "දෘඩ systematic ideology එකකට වඩා, ජීවිතය වෙත temperament එකක් සහ disposition එකක් ලෙස"
wrong_answers:
  - "government හි සෑම ක්ෂේත්‍රයක් සඳහාම නිශ්චිත policy prescriptions ඇති comprehensive economic theory එකක් ලෙස"
  - "modern institutions විනාශ කර සමාජය pre-industrial යුගයට ආපසු ගෙන යාමට උත්සාහ කරන revolutionary movement එකක් ලෙස"
  - "Christian theology සහ ecclesiastical authority මත පදනම් වූ සම්පූර්ණයෙන්ම ආගමික doctrine එකක් ලෙස"
explanation: >-
  British philosopher කෙනෙකු වූ Michael Oakeshott, conservatism systematic ideology එකකට වඩා temperament එකක් ලෙස දකින conception එකක් ආරක්ෂා කළේය. ඔහුගේ On Being Conservative (1956) essay එක අත්‍යවශ්‍ය reference එකක් ලෙස පවතී. Conservatism disposition එකක් ලෙස දකින මෙම දැක්ම Friedrich Hayek කෙරෙහිද බලපෑවේය. Oakeshott ගේ approach එක politics තුළ rationalism පිළිබඳ critique එක නිසා කැපී පෙනේ; politics system එකකට අඩු කළ හැකි යන අදහස එය ප්‍රතික්ෂේප කරයි.
reviewed: false
