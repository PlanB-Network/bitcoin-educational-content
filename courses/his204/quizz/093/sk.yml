question: Prečo bol podľa Condorceta Turgot odsúdený na zlyhanie?
answer: Bol príliš čestný na politickú hru v Paríži
wrong_answers:
  - Chýbali mu znalosti ekonomickej teórie
  - Jeho telesná konštitúcia bola príliš slabá
  - Na tú funkciu bol príliš mladý
explanation: |
  Condorcet povedal Turgotovi: "Nie ste vôbec šarlatán, a to je chyba, vzhľadom na to, ako sa veci v Paríži majú." Poukázal na množstvo protivníkov, ktorým bude Turgot čeliť: kráľovi favoriti, parlamenty, duchovenstvo, šľachta a cechy. Tieto skupiny očakávali lichotenie, nie reformy.
