question: "Dlaczego Rothbard krytykował wizję natury ludzkiej u libertaires i jaką alternatywę proponował?"
answer: "Zarzucał im naiwną wizję „szlachetnego dzikusa” i twierdził, że społeczeństwo musi używać własności prywatnej oraz dobrych bodźców, aby kierować zachowaniami opartymi na interesie własnym"
wrong_answers:
  - "Chwalił ich rozumienie ludzkiej współpracy, ale twierdził, że minimalne państwo nadal jest konieczne do egzekwowania umów"
  - "Zgadzał się, że ludzie są z natury dobrzy, ale nalegał, że tylko wolne rynki mogą skierować tę dobroć ku produktywnej aktywności"
  - "Odrzucał ich nacisk na prawa jednostki i twierdził zamiast tego, że wspólnoty powinny kolektywnie definiować standardy moralne"
explanation: >-
  Rothbard krytykował libertaires za przyjęcie naiwnej, rousseau'owskiej wizji natury ludzkiej jako naturalnie dobrej. Twierdził natomiast, że ludźmi kieruje interes własny, a społeczeństwo musi być zorganizowane tak, aby dobre bodźce kierowały zachowaniem. Wymaga to uznania i zagwarantowania własności prywatnej. Zniesienie państwa nie oznacza zniesienia jego funkcji; policja i wymiar sprawiedliwości powinny być zarządzane przez wolny rynek poprzez konkurencję.
