question: "Защо sig-all-hash използва ефекта Reader, вместо да приема транзакционните данни като типизиран вход?"
answer: За да може джетът да използва PrecomputedTransactionData и да работи в константно време върху фиксирана среда.
wrong_answers:
  - Защото типовата система на Simplicity фундаментално не може да представя транзакционни данни като тип.
  - Защото ефектът Reader е по-бърз от подаването на тези данни през дървото на комбинаторите.
  - Защото транзакционните данни са твърде големи, за да се поберат в типовата система с фиксиран размер на Simplicity.
explanation: >-
  Ако sig-all-hash приемаше входен тип TxEnv, програмите биха могли да подават модифицирани копия на транзакционни данни
  към джета, което би му попречило да използва предварително изчислени хешове. С ефекта Reader джетът има достъп само
  до фиксирана, неизменяема транзакционна среда, така че неговата имплементация може безопасно да използва
  PrecomputedTransactionData и да работи в константно време за всяка проверка на подпис, избягвайки проблема с квадратичното
  хеширане, от който страдаше ранният Bitcoin Script.
reviewed: true
