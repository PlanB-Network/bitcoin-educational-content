question: "Bitcoin ทำหน้าที่เป็นโครงการศีลธรรมที่มีผลทางการเมือง แทนที่จะเป็นโครงการทางการเมืองที่อ้างศีลธรรม อย่างไร?"
answer: "Bitcoin ถูกออกแบบมาเพื่อทำให้ผู้คนเสรี ไม่ใช่ร่ำรวย โดยทำให้เกิดทรัพย์สินที่มีผลจริง ปกป้องมูลค่าของงาน และรักษาความเป็นส่วนตัว ซึ่งเป็นความสำเร็จทางศีลธรรมที่ก่อผลทางการเมืองโดยไม่อ้างค่ายการเมืองใด"
wrong_answers:
  - "Bitcoin เป็นโครงการศีลธรรมเพราะ code ของมันบังคับใช้กฎจริยธรรมที่ป้องกันการฉ้อโกง และผลทางการเมืองของมันคือการแทนที่การปกครองประชาธิปไตยด้วยการตัดสินใจแบบ algorithmic"
  - "Bitcoin ทำหน้าที่เป็นโครงการศีลธรรมเพราะมันกระจายความมั่งคั่งจากคนรวยไปยังผู้ใช้รุ่นแรก สร้างสังคมที่เป็นธรรมขึ้นพร้อมผลทางการเมืองต่อนโยบายภาษี"
  - "Bitcoin มีศีลธรรมเพราะ Satoshi Nakamoto ฝังบัญญัติทางจริยธรรมไว้ใน protocol และผลทางการเมืองของมันคือการรวมกลุ่มการเมืองทั้งหมดภายใต้ระบบเงินร่วมกัน"
explanation: >-
  Bitcoin ไม่ได้ถูกออกแบบมาเพื่อทำให้ผู้คนร่ำรวย แต่เพื่อทำให้พวกเขาเสรี มันบรรลุผลลัพธ์ทางศีลธรรมสามประการ: ทำให้เกิดทรัพย์สินที่มีผลจริง (จูงใจความรับผิดชอบ) ปกป้องมูลค่าที่สร้างโดยงาน (ส่งเสริมความพยายามที่ก่อผลผลิต) และรักษาความเป็นส่วนตัว (เปิดให้ผู้คนใช้ชีวิตโดยปราศจากความกลัว) สิ่งเหล่านี้เป็นความสำเร็จทางศีลธรรมที่มีผลทางการเมืองโดยไม่สังกัดค่ายการเมืองใด ทำให้มันเป็นโครงการศีลธรรมก่อนและเป็นการเมืองทีหลัง
reviewed: false
