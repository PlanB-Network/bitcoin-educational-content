question: "Jaké jsou kardinální hodnoty centrismu?"
answer: "Umírněnost, kompromis, adaptace a veřejná prospěšnost"
wrong_answers:
  - "Tradice, řád, autorita a národní identita"
  - "Svoboda, soukromé vlastnictví, souhlas a individuální odpovědnost"
  - "Rovnost, sociální spravedlnost, solidarita a kolektivní vlastnictví"
explanation: >-
  Kardinálními hodnotami centrismu jsou umírněnost, kompromis, adaptace a veřejná prospěšnost. Odrážejí centristický důraz na pragmatickou rovnováhu spíše než na ideologický závazek. Ostatní možnosti popisují kardinální hodnoty konzervatismu, libertarianismu a socialismu.
