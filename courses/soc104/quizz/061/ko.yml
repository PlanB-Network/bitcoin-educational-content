question: "무솔리니의 1920년 선언 '국가 안의 모든 것, 국가 밖의 어떤 것도 없고, 국가에 반하는 어떤 것도 없다'는 전체주의에 대해 무엇을 드러내나요?"
answer: "국가가 사회를 완전히 흡수하기 때문에 공적 공간과 사적 공간 사이의 분리가 더 이상 존재하지 않습니다"
wrong_answers:
  - "국가는 군사력에만 집중하고 경제는 민간 기업에 맡깁니다"
  - "시민들은 정부를 공개적으로 비판하지 않는 한 사적으로 조직할 자유가 있습니다"
  - "정부는 정치 활동만 통제하고 문화적·종교적 삶은 자율적으로 남아 있습니다"
explanation: >-
  무솔리니의 선언은 전체주의의 본질, 즉 총체성을 포착합니다. 모든 것이 국가 안으로 흡수되며, 이는 공적 공간과 사적 공간 사이의 분리가 없다는 뜻입니다. 사회는 스포츠 클럽을 여는 것 같은 가장 일상적인 활동에 이르기까지 모든 형태의 자율성을 잃습니다. 이는 군사적, 정치적, 경제적 영역만 통제하는 것을 훨씬 넘어섭니다.
reviewed: false
