question: "Jak konzervatismus zachází se svobodami v ekonomické a společenské sféře?"
answer: "Silné svobody v ekonomické sféře, ale slabé svobody ve společenské sféře"
wrong_answers:
  - "Slabé svobody v ekonomické i společenské sféře za účelem zachování tradičního společenského řádu"
  - "Silné svobody ve společenské sféře, ale slabé svobody v ekonomické sféře"
  - "Stejné a neomezené svobody v obou sférách s minimálními vládními zásahy jakéhokoli druhu"
explanation: >-
  Konzervatismus vykazuje dichotomii, která je zrcadlovým obrazem socialismu. V ekonomické oblasti konzervativci hájí volný trh, podnikání a soukromé vlastnictví. Ve společenské oblasti jsou omezení ospravedlňována zachováním tradičních morálních norem a společenské stability. Třetí chybná odpověď popisuje socialistický vzorec, který je opačný.
