question: "O que a categoria de liberdade econômica inclui?"
answer: "O que você faz como produtor e consumidor: comprar, vender, produzir, trabalhar, contratar e administrar seu dinheiro"
wrong_answers:
  - "Suas crenças religiosas, relações pessoais e liberdade de expressão"
  - "Seu direito de votar, participar de eleições e filiar-se a partidos políticos"
  - "Sua capacidade de viajar livremente, escolher sua residência e cruzar fronteiras nacionais"
explanation: >-
  A liberdade econômica abrange o que você faz como produtor e consumidor: o que você pode comprar, vender ou produzir; onde trabalha; quem contrata; e o que faz com seu dinheiro. Relações pessoais, crenças religiosas e liberdade de movimento se enquadram na categoria de liberdade pessoal, não na econômica.
reviewed: false
