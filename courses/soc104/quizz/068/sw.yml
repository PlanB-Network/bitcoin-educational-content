question: "Katika mijadala mitano ya kijamii (ndoa, uhamiaji, silaha za moto, dawa za kulevya, vinywaji vyenye sukari), ni fremu gani ya uchambuzi inayojirudia inayounda msimamo wa kijamaa katika kila suala?"
answer: "Fremu ya mgogoro kati ya watawala na wanaotawaliwa, ambapo jamii imeundwa na ukandamizaji na dola lazima iingilie kulinda kundi dhaifu"
wrong_answers:
  - "Fremu ya matumizi inayolenga kuongeza furaha ya jumla na tija ya kiuchumi kwa idadi kubwa zaidi ya raia"
  - "Fremu ya haki za asili ambapo uhuru wa mtu binafsi lazima ulindwe dhidi ya kuingiliwa na dola na mashirika"
  - "Fremu ya kimapokeo ambapo taasisi za kijamii zilizopo lazima zihifadhiwe dhidi ya mabadiliko ya kisasa yenye kuvuruga"
explanation: >-
  Msimamo wa kijamaa katika mijadala ya kijamii huundwa kwa uthabiti na fremu ya mgogoro kati ya mtawala/anayetawaliwa. Kuhusu ndoa, ni wengi wa watu wa jinsia tofauti wanaokandamiza wachache wa watu wa jinsia moja. Kuhusu uhamiaji, vikwazo vinavyotegemea uraia ni aina za ukandamizaji. Kuhusu silaha za moto, ni dola pekee inayopaswa kushikilia nguvu ili kulinda walio dhaifu. Kuhusu vinywaji vyenye sukari, wenye viwanda hufaidika kutokana na udhaifu wa walio na ulinzi mdogo zaidi. Mtazamo huu wa mkandamizaji/aliyekandamizwa hujirudia katika nyanja nyingi ikiwemo jinsia, rangi, na hata uhusiano kati ya ubinadamu na asili.
