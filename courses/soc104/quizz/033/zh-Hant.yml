question: "自由意志主義者如何看待私有財產與自由之間的關係？"
answer: "私有財產是一項先於法律與國家的自然權利，並且正是自由的根基"
wrong_answers:
  - "私有財產是由國家創造的社會慣例，當它造成不平等時可以被撤銷"
  - "私有財產對經濟效率有用，但沒有內在的道德或哲學意義"
  - "私有財產只應存在於個人物品上，而不應存在於生產性資產或土地上"
explanation: >-
  自由意志主義者捍衛私有財產，將其視為先於法律與國家的自然權利。他們主張，如果一個人擁有自己的身體，也就擁有自己的勞動及其成果。對物質財貨的所有權，是自我所有權的延伸。這與 libertaire 觀點形成鮮明對比，後者認為財產是一種社會慣例或壓迫來源。
reviewed: false
