question: "¿Por qué criticó Rothbard la visión de la naturaleza humana de los libertaires, y qué alternativa propuso?"
answer: "Los acusó de sostener una visión ingenua del 'buen salvaje' y argumentó que la sociedad debe usar la propiedad privada y buenos incentivos para orientar el comportamiento interesado"
wrong_answers:
  - "Elogió su comprensión de la cooperación humana, pero argumentó que seguía siendo necesario un Estado mínimo para hacer cumplir los contratos"
  - "Estuvo de acuerdo en que los seres humanos son naturalmente buenos, pero insistió en que solo los mercados libres podían canalizar esa bondad hacia la actividad productiva"
  - "Rechazó su énfasis en los derechos individuales y argumentó en cambio que las comunidades deberían definir colectivamente los estándares morales"
explanation: >-
  Rothbard criticó a los libertaires por adoptar una visión ingenua, de tipo rousseauniano, de la naturaleza humana como naturalmente buena. Argumentó en cambio que las personas se guían por el interés propio, y que la sociedad debe organizarse de modo que buenos incentivos orienten el comportamiento. Esto exige reconocer y garantizar la propiedad privada. Abolir el Estado no significa abolir sus funciones; la policía y la justicia deberían ser gestionadas por el mercado libre mediante la competencia.
