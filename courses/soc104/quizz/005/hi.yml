question: "Fiat money system शासकों और शासितों के बीच विभाजन को कैसे मजबूत करता है?"
answer: "यह सरकारों को मुद्रा निर्माण के माध्यम से असीमित खर्च का वित्तपोषण करने देता है, जिससे inflation के जरिए बचत का मूल्य घटता है"
wrong_answers:
  - "यह नागरिकों को लोकतांत्रिक चुनावों और जनमत-संग्रहों के माध्यम से मौद्रिक नीति पर सीधा नियंत्रण देता है"
  - "यह सरकारों को उधार लेने से रोकता है, जिससे वे राजस्व के लिए केवल कराधान पर निर्भर रहने को मजबूर होती हैं"
  - "यह आर्थिक वृद्धि को प्रोत्साहित करने के लिए नई बनाई गई मुद्रा को सभी नागरिकों में समान रूप से बाँटता है"
explanation: >-
  Fiat मुद्रा को राज्य शक्ति के विस्तार की आधारशिला के रूप में वर्णित किया गया है क्योंकि यह सरकारों को उधार लेने और बैंकों को नई मुद्रा छापने के लिए प्रेरित करने देता है। परिणामी inflation लोगों की बचत का मूल्य घटाती है, जिससे सबसे धनी और सबसे शक्तिशाली संस्थाओं को लाभ होता है। यह नागरिकों को मौद्रिक नियंत्रण नहीं देता, न ही उधार को रोकता है या मुद्रा को समान रूप से बाँटता है।
