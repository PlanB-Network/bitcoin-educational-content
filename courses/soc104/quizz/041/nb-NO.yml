question: "Hvorfor kritiserte Rothbard libertaires' syn på menneskenaturen, og hvilket alternativ foreslo han?"
answer: "Han anklaget dem for å ha et naivt 'den edle villmann'-syn og argumenterte for at samfunnet må bruke privat eiendom og gode insentiver til å styre egeninteressert atferd"
wrong_answers:
  - "Han roste deres forståelse av menneskelig samarbeid, men argumenterte for at en minimal stat fortsatt var nødvendig for å håndheve kontrakter"
  - "Han var enig i at mennesker er naturlig gode, men insisterte på at bare frie markeder kunne kanalisere denne godheten inn i produktiv aktivitet"
  - "Han avviste deres vektlegging av individuelle rettigheter og argumenterte i stedet for at fellesskap kollektivt bør definere moralske standarder"
explanation: >-
  Rothbard kritiserte libertaires for å adoptere et naivt, Rousseau-lignende syn på menneskenaturen som naturlig god. Han argumenterte i stedet for at mennesker styres av egeninteresse, og at samfunnet må organiseres slik at gode insentiver styrer atferd. Dette krever å anerkjenne og garantere privat eiendom. Å avskaffe staten betyr ikke å avskaffe dens funksjoner; politi og rettsvesen bør forvaltes av det frie markedet gjennom konkurranse.
reviewed: false
