question: "Защо оста ляво-дясно се смята за неподходяща за позициониране на класически либерални мислители като Bastiat или Ron Paul?"
answer: "Защото класическият либерализъм цени както икономическите, така и личните свободи, които нито левицата, нито десницата приемат напълно"
wrong_answers:
  - "Защото класическите либерали винаги се съгласуват с десни икономически политики и отхвърлят всички леви позиции"
  - "Защото класическите либерали са центристи, които приемат умерени версии както на левите, така и на десните идеологии"
  - "Защото класическите либерали се противопоставят на всички форми на управление, което ги прави анархисти, а не политически мислители"
explanation: >-
  Оста ляво-дясно не успява да обхване класическите либерали, защото не може да побере позиция, която едновременно защитава икономическата свобода (обикновено дясна) и личната свобода (обикновено лява). Класическите либерали не са центристи, търсещи компромис, нито са анархисти или чисто десни. Те просто не се вписват в едноизмерен спектър.
reviewed: false
