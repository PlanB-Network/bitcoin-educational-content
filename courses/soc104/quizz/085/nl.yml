question: "Wat moedigt Kants motto 'Sapere aude' mensen aan te doen?"
answer: "Te durven voor zichzelf te denken en de staat van onmondigheid te verlaten waarin zij afhankelijk zijn van de leiding van een hogere autoriteit"
wrong_answers:
  - "Academische kennis nastreven door zich in te schrijven bij formele onderwijsinstellingen en diploma's te behalen"
  - "Alle vormen van moraliteit uitdagen en volledig nieuwe ethische systemen creëren op basis van persoonlijk verlangen"
  - "Wijsheid zoeken via religieuze devotie en onderwerping aan de leer van de kerk"
explanation: >-
  Sapere aude, wat "Durf voor jezelf te denken" betekent, werd door Kant ontleend aan de dichter Horatius en tot motto van de Verlichting gemaakt. Het symboliseert het verlaten van onmondigheid, een toestand waarin mensen niet in staat zijn hun verstand te gebruiken zonder de leiding van een hogere klasse of autoriteit. Kant moedigt emancipatie en volledige verantwoordelijkheid voor het eigen denken aan.
reviewed: false
