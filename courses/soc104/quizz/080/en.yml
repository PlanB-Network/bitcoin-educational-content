question: "Why did Molinari's 1849 prediction prove prophetic regarding the relationship between freedom and political power?"
answer: "Because conservatives and socialists have alternated in power and instrumentalized freedom in service of their respective political goals, exactly as he described"
wrong_answers:
  - "Because the economist character he described eventually gained political power and implemented libertarian policies across Europe"
  - "Because his prediction that all three political families would merge into a single centrist movement came true in the twentieth century"
  - "Because freedom was gradually expanded by successive governments until it became the primary organizing principle of modern democracies"
explanation: >-
  Molinari's vision proved prophetic because, since the mid-nineteenth century, conservatives and socialists have alternated in power and carried out precisely what he described: the instrumentalization of freedom in service of political goals. Both families are willing to restrict freedoms and call on the state to impose their respective agendas, while the economist's position of unconditional freedom remained marginalized.
