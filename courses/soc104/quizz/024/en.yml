question: "What is paleo-libertarianism?"
answer: "A synthesis combining the rejection of the state as a source of coercion with a reinforcement of traditional institutions and voluntary social structures"
wrong_answers:
  - "A libertarian movement that rejects all traditional values and promotes radical social progressivism"
  - "A conservative ideology that uses state power to enforce traditional values while allowing some economic freedom"
  - "A centrist philosophy that seeks a balanced compromise between socialist economics and conservative social policy"
explanation: >-
  Paleo-libertarianism combines the rejection of the state as the institutional source of coercion with a reinforcement of traditional institutions and a preference for voluntary social structures over state authority. It distinguishes itself from neo-libertarianism by being more sympathetic to traditional values. The paleo-libertarian does not oppose communities organizing around socialist or communitarian principles; they only refuse that such communities impose their values on everyone by force of law.
