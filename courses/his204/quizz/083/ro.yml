question: De ce a fost numirea lui Turgot ca ministru al Marinei primită cu surprindere?
answer: Turgot nu este un mare cunoscător al Marinei
wrong_answers:
  - Turgot are mulți dușmani în acest minister
  - Turgot nu știe să înoate
  - Turgot este civil
explanation: |
  Turgot nu avea nicio experiență navală, ceea ce i-a surprins pe mulți atunci când a fost numit în această funcție. În schimb, se aștepta să fie numit într-o funcție economică sau financiară.
