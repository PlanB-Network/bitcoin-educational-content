question: "自由至上主義者所描述的自由市場三項必要功能，如何共同構成一套既有效率又合乎倫理的社會組織系統？"
answer: "價格為決策提供羅盤，市場透過供給與需求揭示真實偏好，而自由交換使個人能依個人價值決定自己的事務，結合資訊效率與道德自主"
wrong_answers:
  - "市場最大化總財富，透過自然競爭防止壟斷，並確保資源平等分配，結合生產力與社會正義"
  - "自由市場減少政府支出，刺激技術創新，並創造就業機會，結合財政責任與經濟成長"
  - "市場降低消費者價格，透過競爭提升產品品質，並擴大國際貿易，結合國內繁榮與全球合作"
explanation: >-
  自由至上主義對自由市場的辯護建立在三項相互連結的功能上。第一，價格作為可靠指標，引導經濟與社會決策（羅盤）。第二，市場透過供給與需求揭示真實個人偏好。第三，自由交換使行動者能依個人價值決定自己的事務。Hayek 顯示，自由市場比中央規劃更能協調分散資訊（效率），而相互同意比強制更尊重人類尊嚴（正義）。
reviewed: false
