question: "Apa titik temu yang dimiliki libertarian dan konservatif, dan apa yang memisahkan mereka?"
answer: "Mereka sama-sama memiliki keterikatan pada pemerintah terbatas dan penolakan terhadap egalitarianisme paksa, tetapi tidak sepakat tentang intervensionisme militer dan kebijakan sosial"
wrong_answers:
  - "Mereka sama-sama mendukung kebijakan perdagangan proteksionis dan pertahanan nasional, tetapi tidak sepakat tentang peran agama dalam kehidupan publik"
  - "Mereka sama-sama berkomitmen pada pajak progresif dan program kesejahteraan, tetapi tidak sepakat tentang kebijakan imigrasi"
  - "Mereka sama-sama menentang perdagangan bebas dan legalisasi narkoba, tetapi tidak sepakat tentang ukuran pemerintah federal"
explanation: >-
  Libertarian dan konservatif sama-sama memperjuangkan pemerintah terbatas, menolak egalitarianisme paksa, menentang utang publik, dan membela hak-hak negara bagian. Namun, libertarian menolak intervensionisme militer neokonservatif, menentang kebijakan sosial dan subsidi konservatif, mengecam pelarangan narkoba, dan menolak proteksionisme. Aliansi itu nyata tetapi secara inheren tegang.
reviewed: false
