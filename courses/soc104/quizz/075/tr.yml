question: "Beş ekonomik tartışmanın tamamı boyunca (vergiler, asgari ücret, sağlık hizmetleri, çevre, sübvansiyonlar), merkezci yöntemi diğer siyasi ailelerin tutumlarından ayıran tutarlı örüntü nedir?"
answer: "Merkezciler sabit bir ilkeye bağlanmayı reddeder ve bunun yerine politikayı duruma göre belirlemek için ampirik analiz ve uzman değerlendirmesi talep eder; bu da yaklaşımlarını doğası gereği teknokratik kılar"
wrong_answers:
  - "Merkezciler her zaman sosyalist ve muhafazakâr tutumlar arasında orta bir konum benimser, her meselede farkı eşit biçimde ikiye böler"
  - "Merkezciler tutarlı biçimde ekonomik büyümeyi sosyal refahın önüne koyar, maliye politikasında liberteryenlerle aynı tarafta yer alırken düzenlemede sosyalistlerle anlaşır"
  - "Merkezciler, bağımsız ulusal politika yapmak yerine tüm ekonomik kararları uluslararası örgütlere ve ticaret anlaşmalarına bırakır"
explanation: >-
  Beş ekonomik tartışmanın tamamında merkezci yaklaşım aynı örüntüyü izler: sabit bir ideolojik ilkeye bağlanmak yerine, merkezciler karar vermeden önce ampirik kanıt ve uzman değerlendirmesi talep eder. Vergilerde doğru düzey analizle belirlenmelidir. Asgari ücrette düzey pragmatik biçimde ayarlanmalıdır. Sağlık hizmetlerinde uzmanlarca kalibre edilen bir karışım idealdir. Çevrede politika rekabet gücünü dengelemelidir. Sübvansiyonlarda her vaka kendi esası üzerinden değerlendirilmelidir. Bu, merkezciliği doğası gereği teknokratik kılar; bu, farkı basitçe ikiye bölmekten veya uluslararası kurumlara tabi olmaktan farklıdır.
