question: "ロスバードはなぜリベルテールの人間観を批判し、どのような代替案を提案しましたか？"
answer: "彼は彼らが素朴な「高貴な野蛮人」観を持っていると非難し、社会は私有財産と良いインセンティブを用いて利己的な行動を導かなければならないと論じた"
wrong_answers:
  - "彼は彼らの人間協力の理解を称賛したが、契約を執行するためにはなお最小国家が必要だと論じた"
  - "彼は人間が本来的に善であることに同意したが、その善を生産的活動へ導けるのは自由市場だけだと主張した"
  - "彼は個人の権利を重視する彼らの姿勢を退け、代わりに共同体が道徳基準を集団的に定義すべきだと論じた"
explanation: >-
  ロスバードは、リベルテールが人間本性を本来的に善とする素朴でルソー的な見方を採用しているとして批判した。彼は代わりに、人々は自己利益によって導かれるのであり、社会は良いインセンティブが行動を導くように組織されなければならないと論じた。そのためには、私有財産を認め保証することが必要である。国家を廃止することは、その機能を廃止することを意味しない。警察と司法は、競争を通じて自由市場によって管理されるべきである。
