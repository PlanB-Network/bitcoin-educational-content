question: "Hai trục của biểu đồ Nolan là gì?"
answer: "Một trục dọc đo lường các quyền tự do cá nhân và một trục ngang đo lường các quyền tự do kinh tế"
wrong_answers:
  - "Một trục ngang từ trái sang phải và một trục dọc từ độc đoán đến dân chủ"
  - "Một trục dọc đo lường sự giàu có và một trục ngang đo lường trình độ giáo dục"
  - "Một trục ngang từ chủ nghĩa xã hội đến chủ nghĩa tư bản và một trục dọc từ truyền thống đến tiến bộ"
explanation: >-
  David Nolan thiết kế biểu đồ của mình với hai trục cụ thể: các quyền tự do cá nhân (trục dọc) và các quyền tự do kinh tế (trục ngang). Cách tiếp cận hai chiều này thay thế đường tả-hữu quá đơn giản hóa và nắm bắt tốt hơn tính phức tạp của các hệ tư tưởng chính trị bằng cách tách hai nhóm tự do chính.
