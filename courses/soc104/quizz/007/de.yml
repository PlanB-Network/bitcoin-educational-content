question: "Welche Position befindet sich im Nolan-Rhombus ganz oben und steht für maximale Freiheit?"
answer: "Libertarismus, der die größtmögliche wirtschaftliche und persönliche Freiheit unterstützt"
wrong_answers:
  - "Konservatismus, der traditionelle Werte und wirtschaftliche Freiheit unterstützt"
  - "Zentrismus, der alle politischen Positionen auf pragmatische Weise ausbalanciert"
  - "Sozialismus, der persönliche Freiheit und soziale Gleichheit unterstützt"
explanation: >-
  Libertarismus nimmt im Nolan-Rhombus die obere Position als Gegenpol zum Etatismus ein. Er steht für diejenigen, die den größtmöglichen Grad sowohl wirtschaftlicher als auch persönlicher Freiheit unterstützen. Konservatismus liegt rechts (hohe wirtschaftliche, geringe persönliche Freiheit), Sozialismus links (hohe persönliche, geringe wirtschaftliche Freiheit) und Zentrismus in der Mitte.
