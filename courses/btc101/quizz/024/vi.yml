question: Nhược điểm chính của fiat (tiền tệ pháp định) là gì?
answer: Giá trị của chúng liên tục bị xói mòn bởi chính sách lạm phát tiền tệ.
wrong_answers:
  - Chúng không dễ dàng vận chuyển.
  - Giá trị của chúng liên tục được đánh giá cao bởi lạm phát tiền tệ.
  - Chúng không thể chia nhỏ.
explanation:
  Nhược điểm chính của fiat (tiền tệ pháp định), như đô la và euro, là giá trị của chúng liên tục bị xói mòn bởi lạm phát tiền tệ. Điều này do sự mất giá do các thế lực kiểm soát chúng (vua, ngân hàng trung ương, hoàng đế, độc tài) gây ra.
reviewed: true