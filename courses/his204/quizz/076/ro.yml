question: Care sunt cei trei factori care explică strălucirea lui Turgot?
answer: Originile sale familiale, epoca, precocitatea sa intelectuală
wrong_answers:
  - Originile sale familiale, rețeaua sa de prieteni, averea sa
  - Epoca, averea sa, reputația fratelui său
  - Carisma sa, elocvența sa, hotărârea sa
explanation: |
  Originile familiale ale lui Turgot, apartenența sa la o familie nobilă și influentă, epoca marcată de efervescență intelectuală și dorința de reformă, precum și precocitatea sa intelectuală, care i-a permis să stăpânească rapid cunoștințele economice și politice, au contribuit toate la strălucirea sa.
