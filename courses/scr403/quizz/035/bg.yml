question: Full-adder прилага OR върху битовете за пренос на двата си half-adder-а, вместо да ги XOR-ва. Защо OR е правилен?
answer: Най-много един half-adder може да има пренос за който и да е вход, така че OR слива точно два взаимно изключващи се случая.
wrong_answers:
  - Двата бита за пренос трябва да се съберат, а OR е начинът, по който еднобитовото двоично събиране се прави в Simplicity.
  - След разклоняването OR е единственият булев оператор, чийто тип все още съвпада със средата.
  - OR надценява преноса; всички фалшиви преноси после се изхвърлят от финалната проекция.
explanation: >-
  Ако първият half-adder има пренос, и двата му входни бита са били 1, така че
  сумарният му бит е 0 — а half-adder, захранен с 0, никога не може да има пренос.
  Следователно двата бита за пренос никога не са едновременно 1 и OR ги слива точно
  (върху достижимите входове той дори съвпада с XOR). Тази взаимна изключителност
  е точно това, което прави декомпозицията на full-adder с два half-adder-а правилна.
reviewed: false
