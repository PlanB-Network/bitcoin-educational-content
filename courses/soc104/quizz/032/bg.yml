question: "Как либертарианците виждат връзката между частната собственост и свободата?"
answer: "Частната собственост е естествено право, което предхожда закона и държавата, и е самата основа на свободата"
wrong_answers:
  - "Частната собственост е социална конвенция, създадена от държавата, която може да бъде отменена, когато причинява неравенство"
  - "Частната собственост е полезна за икономическата ефективност, но няма присъщо морално или философско значение"
  - "Частната собственост трябва да съществува само за лични притежания, а не за производствени активи или земя"
explanation: >-
  Либертарианците защитават частната собственост като естествено право, което предхожда закона и държавата. Те твърдят, че ако един индивид притежава собственото си тяло, той притежава и своя труд и плодовете от него. Собствеността върху материални блага е разширение на себепритежанието. Това рязко контрастира с възгледа на libertaires, според който собствеността е социална конвенция или източник на потисничество.
reviewed: false
