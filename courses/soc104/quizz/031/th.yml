question: "กลุ่ม libertaires ฝรั่งเศส (อนาธิปไตยสังคมนิยม) เชื่ออย่างไรเกี่ยวกับทรัพย์สินส่วนตัว?"
answer: "ทรัพย์สินส่วนตัวและทุนนิยมต้องถูกยกเลิก เพราะเป็นแหล่งของการกดขี่"
wrong_answers:
  - "ทรัพย์สินส่วนตัวเป็นสิทธิตามธรรมชาติที่มาก่อนรัฐ และต้องได้รับการคุ้มครองไม่ว่าจะต้องแลกด้วยอะไรก็ตาม"
  - "ทรัพย์สินส่วนตัวควรถูกกำกับโดยรัฐ แต่ไม่ควรถูกกำจัดออกจากสังคมโดยสิ้นเชิง"
  - "ทรัพย์สินส่วนตัวยอมรับได้ก็ต่อเมื่อถูกกระจายอย่างเท่าเทียมในหมู่สมาชิกทุกคนของคอมมูน"
explanation: >-
  กลุ่ม libertaires ฝรั่งเศส ทายาทของอนาธิปไตยสังคมนิยมผ่านนักคิดอย่าง Proudhon และ Bakunin ถือว่าทั้งรัฐและทรัพย์สินส่วนตัวต้องถูกยกเลิกในฐานะแหล่งกดขี่คู่กัน สิ่งนี้ถูกจับไว้ในสูตรอันโด่งดังของ Proudhon ว่า "ทรัพย์สินคือการขโมย" คำตอบผิดข้อแรกอธิบายจุดยืนลิเบอร์ทาเรียน ซึ่งตรงข้ามอย่างรากฐานกับมุมมอง libertaire
reviewed: false
