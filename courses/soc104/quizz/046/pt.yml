question: "Como o conservadorismo trata as liberdades nas esferas econômica e social?"
answer: "Liberdades fortes na esfera econômica, mas liberdades fracas na esfera social"
wrong_answers:
  - "Liberdades fracas tanto na esfera econômica quanto na social para manter a ordem social tradicional"
  - "Liberdades fortes na esfera social, mas liberdades fracas na esfera econômica"
  - "Liberdades iguais e ilimitadas em ambas as esferas, com intervenção governamental mínima de qualquer tipo"
explanation: >-
  O conservadorismo exibe uma dicotomia que é a imagem espelhada do socialismo. No domínio econômico, os conservadores defendem o livre mercado, o empreendedorismo e a propriedade privada. No domínio social, as restrições são justificadas pela preservação de normas morais tradicionais e da estabilidade social. A terceira resposta errada descreve o padrão socialista, que é o oposto.
