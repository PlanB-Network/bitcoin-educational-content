question: "Prečo sa ľavicovo-pravicová os považuje za nedostatočnú na zaradenie klasických liberálnych mysliteľov ako Bastiat alebo Ron Paul?"
answer: "Pretože klasický liberalizmus si cení ekonomické aj osobné slobody, ktoré ľavica ani pravica plne neprijímajú"
wrong_answers:
  - "Pretože klasickí liberáli sa vždy stotožňujú s pravicovými ekonomickými politikami a odmietajú všetky ľavicové postoje"
  - "Pretože klasickí liberáli sú centristi, ktorí prijímajú umiernené verzie ľavicových aj pravicových ideológií"
  - "Pretože klasickí liberáli odmietajú všetky formy vlády, čo z nich robí anarchistov, a nie politických mysliteľov"
explanation: >-
  Ľavicovo-pravicová os pri klasických liberáloch zlyháva, pretože nedokáže zachytiť pozíciu, ktorá súčasne bráni ekonomickú slobodu (typicky pravica) aj osobnú slobodu (typicky ľavica). Klasickí liberáli nie sú centristi hľadajúci kompromis, ani nie sú anarchisti či čisto pravicoví. Jednoducho nezapadajú do jednorozmerného spektra.
reviewed: false
