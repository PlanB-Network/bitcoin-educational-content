question: "Hva er kulturell konservatisme?"
answer: "En personlig tilslutning til familieverdier, moralske, estetiske og metafysiske verdier arvet fra fortiden, ikke en politisk filosofi"
wrong_answers:
  - "En politisk ideologi som bruker statsmakt til å påtvinge hele samfunnet tradisjonelle verdier gjennom lovgivning"
  - "En bevegelse som avviser alle former for modernitet og søker å føre samfunnet tilbake til en førindustriell levemåte"
  - "En økonomisk doktrine som beskytter nasjonale industrier og motsetter seg frihandel med fremmede land"
explanation: >-
  Kulturell konservatisme defineres som en livsvisdom: den personlige tilslutningen til familieverdier, moralske, estetiske og metafysiske verdier arvet fra fortiden, enten gresk-romerske eller jødisk-kristne. Den er uttrykkelig ikke en politisk filosofi. Den skiller seg fra politisk konservatisme, som tar sikte på å bevare politiske institusjoner og sosial orden gjennom statsmakt. Den handler heller ikke om å avvise modernitet eller økonomisk proteksjonisme.
reviewed: false
