question: "Какъв водещ принцип е определял гласовете на Frederic Bastiat в Националното събрание?"
answer: "Насърчаването на индивидуалните и икономическите свободи и намаляването на държавната намеса"
wrong_answers:
  - "Защитата на кралската власт и запазването на монархическите традиции"
  - "Напредъкът на социалистически политики за по-равномерно преразпределение на богатството"
  - "Центристка стратегия за компромис между левите и десните фракции"
explanation: >-
  Bastiat гласувал въз основа на фундаментален принцип: насърчаване на индивидуалните и икономическите свободи, като същевременно се намалява държавната намеса. Той не бил центристки опортюнист, нито роялист или социалист. Той гласувал с онази страна, която предлагала мерки, съответстващи на свободата и ограниченото управление.
reviewed: false
