question: Что происходит со входными данными при параллельной композиции?
answer: Обе операции получают одни и те же входные данные, а их результаты образуют произведение (пару).
wrong_answers:
  - Входные данные делятся пополам, и каждая операция получает отдельную часть.
  - Одна операция сначала обрабатывает входные данные, а другая получает изменённый результат.
  - Входные данные помечаются тегом и направляются только одной из двух операций для обработки.
explanation: >-
  Параллельная композиция передаёт одни и те же неизменённые входные данные
  обеим операциям одновременно. Результаты объединяются в тип произведения
  (пару). В Simplicity для этого используется комбинатор pair, записываемый
  как f ▵ g, который для входа a производит ⟨f(a), g(a)⟩.
