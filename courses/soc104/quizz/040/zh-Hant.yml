question: "從二十世紀初開始，什麼根本分歧使社會主義者彼此分裂？"
answer: "試圖透過暴力奪取權力的革命社會主義者，對上透過民主選舉追求變革的改良社會主義者"
wrong_answers:
  - "專注於工業工人的城市社會主義者，對上組織農業公社的鄉村社會主義者"
  - "優先考量本國的民族主義社會主義者，對上倡議全球革命的國際主義社會主義者"
  - "撰寫理論文本的知識分子社會主義者，對上組織勞工罷工的行動派社會主義者"
explanation: >-
  從二十世紀初開始，一項根本分歧分隔了革命社會主義者與改良社會主義者：前者反對財產權，並試圖透過暴力或無產階級專政摧毀資本主義社會；後者則透過民主選舉與課稅追求社會正義，同時暫時接受資本主義。這場分裂形塑了此後社會主義運動的整個歷史。
