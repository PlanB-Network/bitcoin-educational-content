question: "Nghịch lý ẩn nào nằm trong chủ nghĩa thực dụng trung dung?"
answer: "Chính chủ nghĩa thực dụng dựa trên một dạng giáo điều, cụ thể là niềm tin không được nói ra rằng chỉ các chuyên gia mới đủ năng lực lèo lái xã hội"
wrong_answers:
  - "Những người trung dung tuyên bố là ôn hòa nhưng luôn liên kết với các đảng cánh tả trong chính phủ liên minh"
  - "Các chính sách trung dung có vẻ cân bằng nhưng luôn ưu tiên tăng trưởng kinh tế hơn bảo vệ môi trường"
  - "Những người trung dung bác bỏ hệ tư tưởng nhưng lại chấp nhận các nguyên tắc thị trường tự do cứng nhắc khi đưa ra quyết định kinh tế"
explanation: >-
  Nghịch lý của chủ nghĩa thực dụng trung dung là nó tuyên bố bác bỏ hệ tư tưởng để ưu tiên chuyên môn duy lý, nhưng chính tuyên bố này dựa trên một giáo điều vô hình và không được nói ra: rằng chỉ các nhà kỹ trị mới có khả năng đưa ra những quyết định đúng. Niềm tin rằng chỉ các chuyên gia mới nên lèo lái xã hội tự nó là một cam kết hệ tư tưởng, dù những người trung dung không nhận ra nó như vậy.
reviewed: false
