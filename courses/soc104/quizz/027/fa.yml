question: "نقش‌های Cato Institute، Mises Institute و Libertarian Party در جنبش لیبرتارین چه تفاوتی با هم دارند؟"
answer: "Cato Institute بر پیشنهادهای سیاست عمومی تمرکز دارد، Mises Institute بر آموزش و نشر دانشگاهی، و Libertarian Party بر سیاست انتخاباتی"
wrong_answers:
  - "Cato Institute کارزارهای سیاسی را تأمین مالی می‌کند، Mises Institute مستقیماً برای کنگره لابی می‌کند، و Libertarian Party کنفرانس‌های دانشگاهی برگزار می‌کند"
  - "Cato Institute کتاب‌های درسی اقتصاد منتشر می‌کند، Mises Institute برنامه‌های ثبت‌نام رأی‌دهندگان اجرا می‌کند، و Libertarian Party پیش‌نویس لوایح قانون‌گذاری را تهیه می‌کند"
  - "Cato Institute اعتراضات مردمی سازمان‌دهی می‌کند، Mises Institute دفاع حقوقی برای لیبرتارین‌ها فراهم می‌کند، و Libertarian Party پژوهش اندیشکده‌ها را مدیریت می‌کند"
explanation: >-
  Cato Institute (تأسیس 1977) اندیشکده‌ای مستقر در واشنگتن است که روی پیشنهادهای سیاست عمومی کار می‌کند. Mises Institute (تأسیس 1982) به‌جای لابی‌گری سیاسی بر آموزش تمرکز دارد و مانند نوعی دانشگاه آنلاین با کنفرانس‌ها و آثار بازنشرشده عمل می‌کند. Libertarian Party (تأسیس 1971) سومین حزب سیاسی بزرگ آمریکا است و در انتخابات شرکت می‌کند؛ جایی که حتی سهم رأی حدود 2٪ آن می‌تواند نتایج را تغییر دهد.
reviewed: false
