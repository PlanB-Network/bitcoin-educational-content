question: "리버테리언은 개인의 의사결정 능력에 대해 무엇을 믿나요?"
answer: "개인은 자신의 삶에 관한 결정을 스스로 내릴 권리와 책임을 모두 가지고 있습니다"
wrong_answers:
  - "개인은 정책적 함의를 이해하는 선출직 대표와 상담한 뒤에만 결정을 내려야 합니다"
  - "개인은 일반적으로 좋은 결정을 내릴 능력이 없으며 정부 기관의 전문가 지도가 필요합니다"
  - "개인은 경제적 결정은 자유롭게 내려야 하지만 모든 사회적·문화적 사안에서는 국가에 따라야 합니다"
explanation: >-
  리버테리언 관점에서 개인은 자신의 결정을 내릴 권리와 책임을 모두 가집니다. 이는 좌에서 우까지의 전통적 정치 가족이 정부가 개인의 삶과 경제생활 전반에서 중요한 결정의 일부 또는 많은 것을 내려야 한다고 믿는 것과 대조됩니다.
