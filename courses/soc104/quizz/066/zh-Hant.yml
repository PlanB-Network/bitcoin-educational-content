question: "自由至上主義者在同性婚姻問題上的立場是什麼？"
answer: "國家無權定義婚姻；婚姻應被私有化，並交由個人、協會與宗教機構處理"
wrong_answers:
  - "同性婚姻應被合法化，因為所有公民都應在法律下受到平等對待"
  - "同性婚姻應被禁止，因為傳統婚姻是生育的根本制度"
  - "同性婚姻應被合法化，但只能透過與傳統婚姻不同的獨立法律框架"
explanation: >-
  自由至上主義者主張，婚姻問題在根本上被錯誤設定了，因為它是以國家主義術語提出的。他們認為國家無權干預私人生活，因此解決方案是讓婚姻與國家完全分離。透過強加單一定義，國家製造了衝突。第一個錯誤答案反映社會主義或中間派立場，第二個則反映保守主義立場。
reviewed: false
