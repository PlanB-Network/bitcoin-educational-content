question: "Jak Michael Oakeshott charakteryzował konserwatyzm w swojej pracy filozoficznej?"
answer: "Jako temperament i dyspozycję wobec życia, a nie sztywną systematyczną ideologię"
wrong_answers:
  - "Jako kompleksową teorię ekonomiczną z precyzyjnymi zaleceniami politycznymi dla każdego obszaru rządzenia"
  - "Jako ruch rewolucyjny, który dąży do demontażu nowoczesnych instytucji i powrotu do społeczeństwa przedindustrialnego"
  - "Jako czysto religijną doktrynę zakorzenioną w teologii chrześcijańskiej i autorytecie kościelnym"
explanation: >-
  Michael Oakeshott, brytyjski filozof, bronił koncepcji konserwatyzmu jako temperamentu, a nie systematycznej ideologii. Jego esej On Being Conservative (1956) pozostaje ważnym punktem odniesienia. Ten pogląd na konserwatyzm jako dyspozycję wpłynął również na Friedricha Hayeka. Podejście Oakeshotta wyróżnia się krytyką racjonalizmu w polityce, odrzucającą ideę, że politykę można sprowadzić do systemu.
