question: "Que signifie le terme 'holisme' dans le contexte de la philosophie socialiste ?"
answer: "Une vision de la société comme un tout indivisible où le collectif prime sur l'individu"
wrong_answers:
  - "Une philosophie qui traite chaque individu comme une unité autonome dont les droits ne peuvent être supplantés par aucun groupe"
  - "Une théorie économique qui préconise d'équilibrer secteurs public et privé à parts égales"
  - "Une stratégie politique qui intègre tous les points de vue minoritaires dans une plateforme unique fondée sur le consensus"
explanation: >-
  L'holisme vient du grec 'holos', qui signifie 'le tout'. Dans la pensée socialiste, il désigne une vision de la société comme un tout indivisible plutôt que comme une simple somme d'individus. L'État socialiste vise à prendre en charge et à diriger l'activité humaine au maximum. Ce collectif peut être représenté comme une classe sociale, une nation, une race ou un genre, mais dans chaque cas l'individu est défini par son appartenance au groupe.
