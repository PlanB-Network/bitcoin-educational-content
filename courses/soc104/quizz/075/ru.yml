question: "Что означает понятие 'моральный риск' в контексте дебатов о субсидиях, и какая политическая семья поднимает эту проблему?"
answer: "Моральный риск — это стимул к безответственности, возникающий, когда компаниям не дают обанкротиться с помощью субсидий, потому что в конечном счёте платит налогоплательщик; эту проблему поднимают либертарианцы"
wrong_answers:
  - "Моральный риск — это риск того, что субсидируемые компании переедут в страны с более низкими налогами, забрав с собой рабочие места; эту проблему поднимают консерваторы"
  - "Моральный риск — это опасность того, что государственные чиновники станут коррумпированными, выбирая, какие компании получают субсидии; эту проблему поднимают центристы"
  - "Моральный риск — это этическая проблема эксплуатации работников компаниями после получения государственных средств; эту проблему поднимают социалисты"
explanation: >-
  Либертарианцы утверждают, что субсидии и спасение компаний за счёт государства создают моральный риск: когда компаниям не дают обанкротиться, это стимулирует безответственность и безрассудство, потому что за плохие решения нет последствий. В конечном итоге платит налогоплательщик, что либертарианцы считают глубоко несправедливым. Это понятие отличается от опасений о переносе компаний в другие страны, коррупции чиновников или эксплуатации работников, которые поднимают другие политические семьи.
