question: "Khái niệm 'rủi ro đạo đức' trong bối cảnh tranh luận về trợ cấp là gì, và gia đình chính trị nào nêu lên mối lo này?"
answer: "Rủi ro đạo đức là động cơ dẫn tới sự vô trách nhiệm khi các công ty được ngăn không cho thất bại thông qua trợ cấp, vì cuối cùng người nộp thuế phải trả tiền; mối lo này được những người theo chủ nghĩa tự do cá nhân nêu ra"
wrong_answers:
  - "Rủi ro đạo đức là nguy cơ các công ty được trợ cấp sẽ chuyển sang các quốc gia có thuế thấp hơn, mang theo việc làm; mối lo này được những người bảo thủ nêu ra"
  - "Rủi ro đạo đức là nguy cơ các quan chức chính phủ trở nên tham nhũng khi chọn công ty nào nhận trợ cấp; mối lo này được những người trung dung nêu ra"
  - "Rủi ro đạo đức là vấn đề đạo đức khi các công ty bóc lột người lao động sau khi nhận tiền công; mối lo này được những người xã hội chủ nghĩa nêu ra"
explanation: >-
  Những người theo chủ nghĩa tự do cá nhân lập luận rằng trợ cấp và cứu trợ tạo ra rủi ro đạo đức: khi các công ty được ngăn không cho thất bại, điều đó khuyến khích sự vô trách nhiệm và liều lĩnh vì không có hệ quả nào cho các quyết định kém. Cuối cùng, chính người nộp thuế phải trả tiền, điều mà những người theo chủ nghĩa tự do cá nhân xem là hết sức bất công. Khái niệm này khác với các mối lo về việc doanh nghiệp chuyển địa điểm, tham nhũng của quan chức, hoặc bóc lột người lao động do các gia đình chính trị khác nêu ra.
