question: "Какую версию TapLeaf использует Simplicity при фиксации в рамках BIP-0341 Taproot?"
answer: Версию 0xbe, что соответствует байтовому значению 190 в десятичной системе.
wrong_answers:
  - Версию 0xc0 — такую же, как у Bitcoin Script Tapscript.
  - Версию 0x00 — версию листа Taproot по умолчанию.
  - Версию 0xff — зарезервированную версию для экспериментальных скриптов.
explanation: >-
  Программы Simplicity фиксируются в адресах Taproot с использованием
  версии TapLeaf 0xbe. Это отличает скрипты Simplicity от Bitcoin
  Tapscript (который использует версию 0xc0) и позволяет сети корректно
  распознавать и проверять программы Simplicity, когда те появляются в
  блокчейне.
reviewed: true
