question: SHA-256 圧縮は jet になりますが、fold と map のコンビネータはそうなりません。この非対称性を説明するものは何ですか？
answer: jet は 1 つの固定された式を置き換えるものです。fold と map は単一の式ではなくスキーマであり、内側の関数 f ごとに異なる式を生成します。
wrong_answers:
  - jet は直線的なコードだけを高速化するため、反復コンビネータはまずアンロールされ、その後どの jet にも一致しなくなる。
  - 機械検査された Rocq 証明を持つ式だけが対象となり、それは SHA-256 には存在するが fold には存在しない。
  - 短いベクトル上の fold は恩恵を受けるには安すぎるため、jet はコストの高い暗号操作に予約されている。
explanation: >-
  jet は、特定の完全に形成された 1 つの Simplicity 式に対するネイティブな置換であり、
  ノードはその正確な意味論を保ちながら代入できます。fold-right-n、map、zip とその変種は、
  単一の式ではなく構築スキームです。内側の関数 f の選択ごとに構造的に異なる式が
  得られるため、この族全体の代わりになる単一の jet は存在しません。これが、これらの
  反復パターンが実際のプログラムでは本物のコンビネータコードとして現れる理由であり、
  通常は SimplicityHL のような高水準言語によって生成されます。
reviewed: false
