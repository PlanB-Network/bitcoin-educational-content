question: "Kroz svih pet ekonomskih rasprava (porezi, minimalna zarada, zdravstvena zaštita, životna sredina, subvencije), koji dosledan obrazac razlikuje centristički metod od pozicija drugih političkih porodica?"
answer: "Centristi odbijaju da se obavežu na fiksni princip i umesto toga zahtevaju empirijsku analizu i procenu stručnjaka kako bi odredili politiku od slučaja do slučaja, što njihov pristup čini suštinski tehnokratskim"
wrong_answers:
  - "Centristi uvek usvajaju srednju poziciju između socijalističkog i konzervativnog stava, jednako deleći razliku po svakom pitanju"
  - "Centristi dosledno daju prednost ekonomskom rastu nad socijalnim blagostanjem, stajući uz libertarijance u fiskalnoj politici dok se slažu sa socijalistima o regulaciji"
  - "Centristi prepuštaju sve ekonomske odluke međunarodnim organizacijama i trgovinskim sporazumima umesto da donose nezavisnu nacionalnu politiku"
explanation: >-
  Kroz svih pet ekonomskih rasprava, centristički pristup sledi isti obrazac: umesto da se obavežu na fiksni ideološki princip, centristi zahtevaju empirijske dokaze i procenu stručnjaka pre donošenja odluka. Kod poreza, pravi nivo mora biti određen analizom. Kod minimalne zarade, nivo mora biti pragmatično prilagođen. Kod zdravstvene zaštite, idealna je mešavina kalibrisana od strane stručnjaka. Kod životne sredine, politika mora uravnotežiti konkurentnost. Kod subvencija, svaki slučaj mora biti procenjen prema sopstvenim zaslugama. To centrizam čini suštinski tehnokratskim, što je drugačije od jednostavnog deljenja razlike ili prepuštanja međunarodnim telima.
reviewed: false
