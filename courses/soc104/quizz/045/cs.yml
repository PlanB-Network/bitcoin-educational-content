question: "Jaké rozlišení Karl Marx učinil mezi utopickým socialismem a vědeckým socialismem?"
answer: "Obviňoval rané francouzské socialisty, že navrhují imaginární řešení, zatímco jeho vědecký socialismus byl založen na historickém materialismu a třídním boji"
wrong_answers:
  - "Tvrdil, že utopický socialismus se příliš zaměřoval na ekonomii, zatímco vědecký socialismus upřednostňoval kulturní a uměleckou transformaci"
  - "Chválil utopické socialisty za jejich praktické experimenty a kritizoval vědecký socialismus za přílišnou abstraktnost a teoretičnost"
  - "Tvrdil, že utopický socialismus byl násilný a revoluční, zatímco vědecký socialismus upřednostňoval pokojnou demokratickou reformu"
explanation: >-
  Marx obviňoval rané francouzské socialisty, jako byli Proudhon, Saint-Simon a Fourier, že jsou utopisté navrhující čistě imaginární řešení. Jeho vědecký socialismus spočíval na historickém materialismu: na myšlence, že dějiny postupují skrze třídní boj a přivlastnění výrobních prostředků, přičemž všechny kulturní reprezentace jsou podmíněny výrobními silami a výrobními vztahy.
