question: 在并行组合中，输入会发生什么？
answer: 两个操作接收相同输入，并且它们的输出形成一个积（对）。
wrong_answers:
  - 输入被一分为二，每个操作接收一个单独部分。
  - 一个操作先处理输入，另一个操作接收修改后的结果。
  - 输入被打上标签，并被路由到两个操作中的一个去处理。
explanation: >-
  并行组合会把同一个未修改的输入同时提供给两个操作。
  结果被捆绑成一个积类型（对）。在 Simplicity 中，这使用 pair
  组合子，写作 f ▵ g；对于输入 a，它产生 ⟨f(a), g(a)⟩。
