question: "Miten Hitlerin Saksan ja Stalinin Neuvostoliiton taloudelliset lähestymistavat erosivat, vaikka niiden totalitaariset menetelmät olivat yhteisiä?"
answer: "Natsi-Saksa säilytti yksityisomistuksen näennäisyyden mutta alisti yksityissektorin valtion tavoitteille, kun taas stalinismi lakkautti kaiken yksityisomistuksen ja suunnitteli talouden kokonaan"
wrong_answers:
  - "Natsi-Saksa kansallisti täysin kaikki teollisuudenalat, kun taas Stalinin hallinto salli rajoitettua yksityistä yritystoimintaa maataloudessa"
  - "Natsi-Saksa edisti vapaata kansainvälistä kauppaa jälleenaseistautumisen rahoittamiseksi, kun taas stalinismi määräsi täydellisen taloudellisen eristäytymisen"
  - "Natsi-Saksa tukeutui yritysten vapaaehtoiseen yhteistyöhön valtion kanssa, kun taas stalinismi käytti vain pakkotyötä"
explanation: >-
  Vaikka molemmat hallinnot käyttivät identtisiä poliittisia menetelmiä (henkilökultti, totaalinen valvonta, opposition järjestelmällinen eliminointi), niiden talousmallit erosivat muodoltaan. Natsi-Saksa ei muodollisesti lakkauttanut yksityisomistusta, mutta alisti yksityissektorin täysin valtion tavoitteille, kuten sodalle ja jälleenaseistautumiselle, ja määräsi taloudellisen autarkian. Stalinismi meni pidemmälle lakkauttamalla kaiken yksityisomistuksen, toteuttamalla viisivuotissuunnitelmia ja kontrolloimalla kaikkea tuotantoa ja jakelua suoraan.
