question: "در لوزی نولان، کدام موضع در بالا قرار دارد و نمایندهٔ بیشترین آزادی است؟"
answer: "لیبرترینیسم، که از بیشترین آزادی اقتصادی و شخصی پشتیبانی می‌کند"
wrong_answers:
  - "محافظه‌کاری، که از ارزش‌های سنتی و آزادی اقتصادی پشتیبانی می‌کند"
  - "میانه‌گرایی، که همهٔ مواضع سیاسی را به شکلی عمل‌گرایانه متوازن می‌کند"
  - "سوسیالیسم، که از آزادی شخصی و برابری اجتماعی پشتیبانی می‌کند"
explanation: >-
  لیبرترینیسم در بالای لوزی نولان، در نقطهٔ مقابل دولت‌گرایی، قرار دارد. این موضع نمایندهٔ کسانی است که از بیشترین درجهٔ آزادی اقتصادی و شخصی پشتیبانی می‌کنند. محافظه‌کاری در سمت راست قرار می‌گیرد (آزادی اقتصادی بالا، آزادی شخصی پایین)، سوسیالیسم در سمت چپ (آزادی شخصی بالا، آزادی اقتصادی پایین)، و میانه‌گرایی در وسط.
reviewed: false
