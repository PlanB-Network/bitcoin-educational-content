question: "리버테리언이 설명하는 자유시장의 세 가지 필수 기능은 어떻게 함께 효율적이면서도 윤리적인 사회조직 체계를 구성하나요?"
answer: "가격은 결정을 위한 나침반을 제공하고, 시장은 공급과 수요를 통해 진정한 선호를 드러내며, 자유로운 교환은 개인이 자신의 가치에 따라 자기 일을 결정할 수 있게 하여 정보적 효율성과 도덕적 자율성을 결합합니다"
wrong_answers:
  - "시장은 총부를 극대화하고, 자연 경쟁을 통해 독점을 방지하며, 자원의 평등한 분배를 보장하여 생산성과 사회정의를 결합합니다"
  - "자유시장은 정부 지출을 줄이고, 기술 혁신을 자극하며, 고용 기회를 창출하여 재정 책임과 경제성장을 결합합니다"
  - "시장은 소비자 가격을 낮추고, 경쟁을 통해 제품 품질을 높이며, 국제무역을 확대하여 국내 번영과 글로벌 협력을 결합합니다"
explanation: >-
  자유시장에 대한 리버테리언의 논거는 서로 연결된 세 기능에 기초합니다. 첫째, 가격은 경제적·사회적 결정을 안내하는 신뢰할 수 있는 지표(나침반) 역할을 합니다. 둘째, 시장은 공급과 수요를 통해 진정한 개인 선호를 드러냅니다. 셋째, 자유로운 교환은 행위자들이 자신의 개인적 가치에 따라 자기 일을 결정할 수 있게 합니다. Hayek는 자유시장이 중앙계획보다 분산된 정보를 더 잘 조정한다는 점(효율성)을 보여 주었고, 상호 동의는 강제보다 인간의 존엄을 더 존중합니다(정의).
reviewed: false
