question: "Šta je politički konzervatizam?"
answer: "Ideologija koja teži da očuva uspostavljene političke institucije i društveni poredak, suprotstavljajući se velikim strukturnim prevratima"
wrong_answers:
  - "Lična posvećenost tradicionalnim porodičnim vrednostima i verskim praksama, bez nastojanja da se one nametnu drugima"
  - "Filozofija koja promoviše brzu društvenu promenu kroz demokratsku reformu i progresivno zakonodavstvo"
  - "Ekonomska teorija koja zagovara slobodna tržišta, minimalno oporezivanje i ukidanje trgovinskih barijera"
explanation: >-
  Politički konzervatizam je ideologija, često zastupljena u desničarskim ili krajnje desničarskim partijama, koja teži da očuva uspostavljene političke institucije i društveni poredak, dok se protivi velikim strukturnim prevratima. Njegovi zastupnici žele da koriste moć i zakon kako bi zaštitili svoje nasleđe. To se razlikuje od kulturnog konzervatizma, koji je lični životni izbor, a ne politički program.
