question: "Qual è la distinzione chiave tra essere pro-business ed essere pro-market?"
answer: "I sostenitori pro-business cercano l'intervento dello Stato per proteggere specifiche aziende dal fallimento, mentre i sostenitori pro-market sostengono la deregolamentazione e permettono alle imprese di fallire affinché il mercato possa riorganizzarsi naturalmente"
wrong_answers:
  - "I sostenitori pro-business si concentrano sulle grandi corporation mentre i sostenitori pro-market si concentrano esclusivamente sul sostegno a piccole imprese e startup"
  - "Pro-business è una posizione di sinistra che favorisce le cooperative di lavoratori mentre pro-market è una posizione di destra che favorisce la proprietà privata"
  - "I sostenitori pro-business rifiutano ogni concorrenza mentre i sostenitori pro-market sostengono una concorrenza regolata dal governo tra imprese approvate"
explanation: >-
  La posizione pro-business considera la concorrenza uno strumento di governance ottenuto tramite regolamenti e giustifica sussidi e salvataggi per prevenire perdite di posti di lavoro. Nella visione pro-business, il mercato è fragile e ha bisogno del salvataggio dello Stato. I sostenitori pro-market vedono la concorrenza come il risultato naturale della libera impresa, il che implica deregolamentazione e la possibilità per le imprese di fallire, perché il fallimento permette al mercato di riorganizzarsi naturalmente e apre spazio ad attori più capaci.
reviewed: false
