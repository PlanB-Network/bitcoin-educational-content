question: "Ni igiki kiranga igice co hasi c'umurongo w'umwidegemvyo w'umuntu ku giti ciwe ku gishushanyo ca Nolan?"
answer: "Gukunda urutonde, umutekano, agaciro k'imigenzo, na leta itunganya inyifato runtu kandi ikabungabunga urutonde rusangi"
wrong_answers:
  - "Gukunda ubwigenge bw'umuntu ku giti ciwe, ukwihanganirana, n'ukwivanga gutoyi kwa leta mu mahitamwo y'ubuzima bw'umuntu ku giti ciwe"
  - "Gukunda gukuraho amategeko ngenderwako y'ubutunzi, ubudandaji bwigenga, no gukuraho amakori y'ibicuruzwa n'imfashanyo za leta"
  - "Gukunda gusubira gusangira ubutunzi, amakori menshi, no gushira amashirahamwe nyamukuru y'inganda mu maboko ya leta"
explanation: >-
  Igice co hasi c'umurongo w'umwidegemvyo w'umuntu ku giti ciwe giserukira igenzura rinini rya leta ku buzima bw'umuntu ku giti ciwe, rikangwa no gukunda urutonde, umutekano, n'agaciro k'imigenzo. Leta itunganya inyifato runtu, ikabungabunga urutonde rusangi, kandi yoshobora kurwanira iciyumviro gitomoye c'inyifato runtu canke c'imigenzo. Hejuru kuri uwo murongo hagereranya ikinyuranye: umwidegemvyo w'umuntu ku giti ciwe n'ukwihanganirana. Amapolitike y'ubutunzi apimirwa ku murongo utambitse utandukanye.
reviewed: false
