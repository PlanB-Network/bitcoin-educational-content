question: چرا عبارت‌های Simplicity به‌صورت DAGها، نه درخت‌ها، سریال‌سازی می‌شوند؟
answer: برای جلوگیری از رشد نمایی، چون زیرعبارت‌های مشترک فقط یک‌بار ذخیره می‌شوند.
wrong_answers:
  - چون ساختارهای درختی ساده اصلاً نمی‌توانند شاخه‌بندی شرطی را نمایش دهند.
  - برای ممکن کردن اجرای موازی روی تعداد زیادی پردازنده چند‌هسته‌ای جداگانه.
  - چون پروتکل Liquid Network در اینجا قالب DAG را به‌طور سخت‌گیرانه الزامی می‌کند.
explanation: >-
  عبارت‌های Simplicity به‌طور طبیعی درخت‌هایی تشکیل می‌دهند که با افزایش
  پیچیدگی می‌توانند به‌صورت نمایی رشد کنند. با سریال‌سازی آن‌ها به‌صورت
  گراف‌های جهت‌دار بدون دور (DAGها)، زیرعبارت‌هایی که چندین بار ظاهر می‌شوند
  یک‌بار ذخیره می‌شوند و چندین والد به آن‌ها ارجاع می‌دهند. این کار اندازه‌های
  واقعی برنامه را به‌جای رشد نمایی، در رشد خطی نگه می‌دارد.
reviewed: false
