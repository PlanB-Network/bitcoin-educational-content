question: "Ikibanza c'aba-libertarian ku kibazo c'ukwubakana kw'abasangiye igitsina ni ikihe?"
answer: "Leta nta co ikwiye gukora mu gusigura umubano; ukwiye gukurwa mu maboko ya Leta ugasigirwa abantu ku giti cabo, amashirahamwe, n'inzego z'idini"
wrong_answers:
  - "Ukwubakana kw'abasangiye igitsina gukwiye kwemerwa n'amategeko kuko abanyagihugu bose bakwiye gufatwa kumwe imbere y'itegeko"
  - "Ukwubakana kw'abasangiye igitsina gukwiye kubuzwa kuko umubano wa kera ari urwego shingiro rwo kuvyara"
  - "Ukwubakana kw'abasangiye igitsina gukwiye kwemerwa n'amategeko ariko gusa biciye mu buryo bw'amategeko butandukanye n'umubano wa kera"
explanation: >-
  Aba-libertarian bavuga ko ikibazo c'umubano gishirwa nabi mu buryo bw'ibanze kuko kibazwa mu majambo ashingiye kuri Leta. Bemera ko Leta ata co ikwiye kwivanga mu buzima bw'abantu ku giti cabo, rero umuti ni ugutandukanya umubano na Leta burundu. Mu gushiraho insiguro imwe gusa, Leta irema amakimbirane. Inyishu ya mbere itari yo yerekana ikibanza c'abasosiyalisite canke c'abari hagati, iya kabiri na yo ikerekana ikibanza c'abakonservateur.
