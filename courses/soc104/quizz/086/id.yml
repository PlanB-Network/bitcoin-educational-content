question: "Bagaimana pembedaan Karl Popper antara masyarakat terbuka dan tertutup berkaitan dengan debat individualisme vs. kolektivisme?"
answer: "Masyarakat terbuka mengakui hak individu untuk menilai sendiri melalui keputusan pribadi, sementara masyarakat tertutup bersifat kolektivis, bertumpu pada mentalitas kesukuan dan penolakan terhadap kebebasan kritis"
wrong_answers:
  - "Masyarakat terbuka adalah masyarakat yang mengizinkan perdagangan bebas lintas batas nasional, sementara masyarakat tertutup memberlakukan tarif dan kebijakan ekonomi proteksionis"
  - "Masyarakat terbuka diperintah oleh demokrasi langsung tempat setiap warga memberi suara, sementara masyarakat tertutup diperintah oleh satu monarki turun-temurun"
  - "Masyarakat terbuka menerbitkan semua dokumen pemerintah secara transparan, sementara masyarakat tertutup mengklasifikasikan informasi sebagai rahasia negara"
explanation: >-
  Popper mendefinisikan masyarakat tertutup sebagai masyarakat magis atau kesukuan dan masyarakat terbuka sebagai masyarakat tempat individu dihadapkan pada keputusan pribadi. Masyarakat tertutup bersifat kolektivis, bertumpu pada mentalitas kesukuan dengan penolakan terhadap kebebasan kritis dan idealisasi tatanan statis. Masyarakat terbuka memberi keutamaan pada pilihan bebas atas nilai, keyakinan, dan relasi, yang secara langsung mewujudkan prinsip-prinsip individualis.
