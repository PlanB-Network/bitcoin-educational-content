question: "Как Ron Paul илюстрира палео-либертарианската позиция по въпроси като употребата на наркотици и аборта?"
answer: "Лично е съветвал да не се употребяват наркотици и се е противопоставял на аборта, но политически се е борил срещу федералната забрана и е твърдял, че изборът трябва да бъде оставен на индивидите или щатите"
wrong_answers:
  - "Подкрепял е федералната легализация на всички наркотици и на аборта като въпрос на абсолютни индивидуални права"
  - "Водил е кампания за строги федерални забрани както на наркотиците, така и на аборта въз основа на личните си морални убеждения"
  - "Отказвал е да изрази лично мнение по тези въпроси, твърдейки, че политиците трябва да останат морално неутрални"
explanation: >-
  Ron Paul е пример за палео-либертарианския синтез, защото отделя личните морални убеждения от политическата принуда. Той винаги е съветвал да не се употребяват наркотици, но същевременно се е противопоставял на забраната им. Лично се е противопоставял на аборта, но е твърдял, че изборът трябва да бъде оставен на федералните щати, а не наложен отгоре. Това показва как човек може да има силни традиционни ценности, като отказва да използва принудителната власт на федералното правителство, за да ги налага.
reviewed: false
