question: "Kako se libertarijansko shvatanje slobode razlikuje od centrističkog shvatanja?"
answer: "Libertarijanci tretiraju slobodu kao bezuslovni aksiom, dok centristi oportunistički brane slobode u zavisnosti od konteksta i efikasnosti"
wrong_answers:
  - "Libertarijanci dopuštaju državi da selektivno štiti slobodu, dok centristi odbacuju svako učešće države u zaštiti individualnih prava"
  - "Libertarijanci se usredsređuju na slobodu samo u ekonomskim pitanjima, dok centristi široko primenjuju slobodu u društvenim i kulturnim domenima"
  - "Libertarijanci i centristi dele isti pogled na slobodu, ali se ne slažu oko veličine vlade potrebne da je sprovede"
explanation: >-
  Libertarijanci definišu slobodu kao opšti, bezuslovni princip koji funkcioniše kao aksiom. Centristi, nasuprot tome, brane određene slobode na oportunistički i kontekstualan način, ne primenjujući nikakav opšti princip. Centristički pristup otkriva instrumentalno shvatanje slobode, uvek podređeno pragmatičnim ciljevima poput efikasnosti, što libertarijanci fundamentalno odbacuju.
