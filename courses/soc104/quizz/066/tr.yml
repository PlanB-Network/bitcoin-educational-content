question: "Hitler Almanyası ile Stalin'in Sovyetler Birliği'nin ekonomik yaklaşımları, paylaştıkları totaliter yöntemlere rağmen nasıl farklılaştı?"
answer: "Nazi Almanyası özel mülkiyet görünümünü korurken özel sektörü devlet hedeflerine tabi kıldı; Stalinizm ise tüm özel mülkiyeti kaldırdı ve ekonomiyi tamamen planladı"
wrong_answers:
  - "Nazi Almanyası tüm sanayileri tamamen millîleştirirken Stalin rejimi tarımda sınırlı özel teşebbüse izin verdi"
  - "Nazi Almanyası yeniden silahlanmayı finanse etmek için serbest uluslararası ticareti teşvik ederken Stalinizm tam ekonomik tecrit dayattı"
  - "Nazi Almanyası devletle gönüllü kurumsal işbirliğine dayanırken Stalinizm yalnızca zorla çalıştırmayı kullandı"
explanation: >-
  Her iki rejim de aynı siyasi yöntemleri kullansa da (kişilik kültü, toplam gözetim, muhalefetin sistematik olarak ortadan kaldırılması), ekonomik modelleri biçim bakımından farklıydı. Nazi Almanyası özel mülkiyeti resmen kaldırmadı, ancak özel sektörü savaş ve yeniden silahlanma gibi devlet hedeflerine tamamen tabi kıldı ve ekonomik otarşi dayattı. Stalinizm ise tüm özel mülkiyeti kaldırarak, beş yıllık planlar uygulayarak ve tüm üretim ile dağıtımı doğrudan kontrol ederek daha da ileri gitti.
