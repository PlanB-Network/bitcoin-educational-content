question: "좌우 정치 구분은 어디에서 유래했나요?"
answer: "1789년 프랑스 혁명 토론 당시의 좌석 배치에서 유래했습니다"
wrong_answers:
  - "19세기 카를 마르크스와 애덤 스미스의 저술에서 유래했습니다"
  - "북부와 남부 주 사이의 미국 남북전쟁에서 유래했습니다"
  - "이성을 전통과 분리한 계몽주의 철학자들에게서 유래했습니다"
explanation: >-
  좌우 구분은 1789년으로 거슬러 올라갑니다. 프랑스 국민의회에서 국왕의 권력 유지를 지지한 의원들은 의장 오른쪽에 앉았고, 국왕의 권력을 제한하려던 의원들은 왼쪽에 앉았습니다. 이는 마르크스와 스미스, 미국 남북전쟁, 또는 계몽주의 철학에서 유래한 것이 아닙니다.
reviewed: false
