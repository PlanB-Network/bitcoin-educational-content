question: "Có căng thẳng nội bộ nào giữa những người theo chủ nghĩa tự do cá nhân trên biểu đồ Nolan?"
answer: "Một số muốn bãi bỏ hoàn toàn nhà nước (những người vô chính phủ tư bản), trong khi những người khác thích một nhà nước tối thiểu vẫn giữ các chức năng chủ quyền cốt lõi (những người theo chủ nghĩa nhà nước tối thiểu)"
wrong_answers:
  - "Một số muốn điều tiết kinh tế mạnh mẽ trong khi những người khác thích phi điều tiết hoàn toàn mọi ngành công nghiệp"
  - "Một số ủng hộ bầu cử dân chủ trong khi những người khác thiên về một hệ thống cai trị cha truyền con nối"
  - "Một số ủng hộ các chính sách xã hội tiến bộ trong khi những người khác bảo vệ các giá trị đạo đức truyền thống một cách nghiêm ngặt"
explanation: >-
  Trong gia đình tự do cá nhân, có một bất đồng nền tảng về vai trò của nhà nước. Những người vô chính phủ tư bản muốn thay thế mọi chức năng của nhà nước bằng các dịch vụ tư nhân, trong khi những người theo chủ nghĩa nhà nước tối thiểu chấp nhận một nhà nước tối thiểu vẫn giữ các chức năng chủ quyền cốt lõi như quốc phòng và tòa án. Cả hai nhóm cùng chia sẻ đỉnh tự do cá nhân nhưng khác nhau về việc liệu có nên tồn tại bất kỳ nhà nước nào hay không.
