question: "Satoshi Nakamoto が特定した法定通貨の根本的な問題は何か？"
answer: "中央銀行が通貨を切り下げないと信頼する必要があるが、法定通貨の歴史はこの信頼への違反に満ちていること"
wrong_answers:
  - "物理的な現金はすぐに摩耗し、生産費も高いため、日常取引に使うには難しすぎること"
  - "各国が互換性のない貨幣基準と規制を持っているため、国際的に送金できないこと"
  - "流通している総貨幣供給量を賄うには不十分な金準備によって裏づけられていること"
explanation: >-
  Satoshi Nakamoto は、従来型通貨の根本的な問題は、それが機能するために必要とする信頼だと述べた。
  法定通貨は商品によって裏づけられておらず、制度的権威だけに完全に依存している。
  一つの制度が貨幣を完全に支配すると、濫用への誘惑はあまりに強くなり、歴史は通貨価値の切り下げを通じてこれを繰り返し示してきた。
