question: "右派想要在哪些方面立法？"
answer: "道德和宗教，其动因是保存传统制度和社会等级的愿望"
wrong_answers:
  - "经济和金融市场，其动因是减少不平等并重新分配财富的愿望"
  - "科学和教育，其动因是控制公立学校所教内容的愿望"
  - "国际贸易和外交，其动因是在海外扩大国家影响力的愿望"
explanation: >-
  右派优先考虑个人道德和传统价值观。它认为文明建立在某些必须被保存的传统制度和社会等级之上，并想要在道德和宗教上立法。专注于为经济立法的是左派，而不是右派。科学、教育和贸易政策并不是此处为右派描述的主要焦点。
reviewed: false
