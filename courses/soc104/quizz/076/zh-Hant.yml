question: "在 Gustave de Molinari 1849 年的對話中，哪個角色捍衛自由作為根本原則，而不是把它從屬於其他目標？"
answer: "經濟學家，他把自由視為不從屬於任何其他目標的原則"
wrong_answers:
  - "社會主義者，他透過旨在社會平等的進步改革來捍衛自由"
  - "保守主義者，他透過保存傳統社會秩序與穩定來維護自由"
  - "三個角色都同等捍衛自由，只是在如何實行上有分歧"
explanation: >-
  在 Molinari 的 *Les Soirees de la rue Saint-Lazare* 對話中，經濟學家與社會主義者和保守主義者始終處於永久分歧。他是唯一捍衛自由作為根本原則的人。社會主義者把自由從屬於進步理想，保守主義者把自由從屬於保存秩序，這使經濟學家在無條件捍衛自由上顯得獨特。
reviewed: false
