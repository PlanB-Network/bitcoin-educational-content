question: "Các lập trường bảo thủ và tự do cá nhân về lương tối thiểu khác nhau như thế nào trong lý luận của họ, dù cả hai đều ủng hộ việc bãi bỏ nó?"
answer: "Những người bảo thủ chấp nhận một mức độ tham gia nào đó của nhà nước vào việc ấn định tiền lương nếu điều đó không cản trở năng lực cạnh tranh, trong khi những người theo chủ nghĩa tự do cá nhân xem lương tối thiểu là một áp đặt đạo đức lên quyền tự do thuê lao động và kinh doanh"
wrong_answers:
  - "Những người bảo thủ phản đối lương tối thiểu vì nó tạo ra lạm phát, trong khi những người theo chủ nghĩa tự do cá nhân phản đối vì nó trao quá nhiều quyền lực cho công đoàn"
  - "Những người bảo thủ muốn tiền lương do các thiết chế tôn giáo và cộng đồng ấn định, trong khi những người theo chủ nghĩa tự do cá nhân muốn tiền lương được quyết định bởi các nghiên cứu thị trường do chính phủ phê duyệt"
  - "Những người bảo thủ tin rằng lương tối thiểu nên thay đổi theo vùng, trong khi những người theo chủ nghĩa tự do cá nhân tin rằng một mức lương cố định duy nhất nên được áp dụng trên toàn quốc"
explanation: >-
  Cả hai đều ủng hộ việc giảm hoặc bãi bỏ lương tối thiểu, nhưng lý luận của họ khác nhau về căn bản. Những người bảo thủ chấp nhận một mức độ tham gia nào đó của nhà nước vào việc ấn định tiền lương, đồng thời nhấn mạnh rằng sự tham gia đó phải ở mức tối thiểu và phụ thuộc vào bối cảnh, tập trung vào năng lực cạnh tranh. Những người theo chủ nghĩa tự do cá nhân giữ một lập trường đạo đức mạnh hơn: lương tối thiểu là một sự áp đặt lên quyền tự do thuê lao động và kinh doanh. Khi những người theo chủ nghĩa tự do cá nhân nói "thị trường", họ muốn nói đến hợp đồng, được thương lượng tự do giữa hai bên mà không có sự can thiệp của nhà nước.
