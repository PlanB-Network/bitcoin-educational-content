question: "Jaka zasada przewodnia kierowała głosami Frédérica Bastiata w Zgromadzeniu Narodowym?"
answer: "Promowanie wolności indywidualnych i gospodarczych oraz ograniczanie ingerencji rządu"
wrong_answers:
  - "Obrona władzy królewskiej i zachowanie tradycji monarchicznych"
  - "Rozwijanie polityk socjalistycznych, aby bardziej równo redystrybuować bogactwo"
  - "Centrowa strategia kompromisu między frakcjami lewicy i prawicy"
explanation: >-
  Bastiat głosował w oparciu o fundamentalną zasadę: promowanie wolności indywidualnych i gospodarczych przy jednoczesnym ograniczaniu ingerencji rządu. Nie był centrowym oportunistą, rojalistą ani socjalistą. Głosował z tą stroną, która proponowała środki zgodne z wolnością i ograniczonym rządem.
reviewed: false
