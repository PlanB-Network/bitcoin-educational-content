question: "Liberteryenlerin tanımladığı şekliyle serbest piyasanın üç temel işlevi birlikte nasıl hem verimli hem de etik bir toplumsal örgütlenme sistemi oluşturur?"
answer: "Fiyatlar kararlar için bir pusula sağlar, piyasa arz ve talep yoluyla otantik tercihleri açığa çıkarır ve serbest mübadele bireylerin kendi işlerini kişisel değerlerine göre belirlemesine imkân verir; böylece bilgisel verimlilik ile ahlaki özerklik birleşir"
wrong_answers:
  - "Piyasa toplam serveti en üst düzeye çıkarır, doğal rekabet yoluyla tekelleri önler ve kaynakların eşit dağılımını sağlar; böylece üretkenlik ile sosyal adaleti birleştirir"
  - "Serbest piyasalar hükümet harcamalarını azaltır, teknolojik yeniliği teşvik eder ve istihdam fırsatları yaratır; böylece mali sorumluluk ile ekonomik büyümeyi birleştirir"
  - "Piyasalar tüketici fiyatlarını düşürür, rekabet yoluyla ürün kalitesini artırır ve uluslararası ticareti genişletir; böylece yerel refah ile küresel işbirliğini birleştirir"
explanation: >-
  Serbest piyasaya yönelik liberteryen sav, birbirine bağlı üç işleve dayanır. Birincisi, fiyatlar ekonomik ve toplumsal kararları yönlendiren güvenilir göstergeler olarak hizmet eder (pusula). İkincisi, piyasa arz ve talep yoluyla otantik bireysel tercihleri açığa çıkarır. Üçüncüsü, serbest mübadele aktörlerin kendi işlerini kişisel değerlerine göre belirlemesine imkân verir. Hayek, serbest piyasaların dağınık bilgiyi merkezi planlamadan daha iyi koordine ettiğini (verimlilik), karşılıklı rızanın ise insan onuruna zorlamadan daha fazla saygı gösterdiğini (adalet) göstermiştir.
reviewed: false
