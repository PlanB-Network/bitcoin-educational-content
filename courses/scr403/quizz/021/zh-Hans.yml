question: "为什么 bip0340-verify 使用 Failure 效应，而不是返回布尔值（true/false）？"
answer: 为了支持 Schnorr 签名的批量验证，其中一次检查失败会使整个批次失败。
wrong_answers:
  - 因为与单位类型相比，布尔类型在区块空间方面过于昂贵。
  - 因为 Simplicity 的类型系统无法表示来自 jets 的布尔返回值。
  - 因为返回普通布尔值会直接违反完备性定理。
explanation: >-
  如果 bip0340-verify 返回布尔值，失败的签名检查仍可能通向一个
  脚本成功的分支。在这种情况下，验证者需要知道具体是哪一个签名
  失败，从而阻止批量验证。通过使用 Failure 效应，失败的检查总是中止
  整个计算，从而支持高效批量验证，把许多签名合并在一起验证。
reviewed: true
