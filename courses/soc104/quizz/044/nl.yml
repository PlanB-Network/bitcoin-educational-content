question: "Welke fundamentele scheidslijn verdeelde socialisten vanaf het begin van de twintigste eeuw?"
answer: "Revolutionaire socialisten die de macht met geweld wilden grijpen tegenover reformistische socialisten die verandering via democratische verkiezingen nastreefden"
wrong_answers:
  - "Stedelijke socialisten die zich richtten op industriële arbeiders tegenover landelijke socialisten die landbouwcommunes organiseerden"
  - "Nationalistische socialisten die hun eigen land prioriteit gaven tegenover internationalistische socialisten die wereldwijde revolutie bepleitten"
  - "Intellectuele socialisten die theoretische teksten schreven tegenover activistische socialisten die arbeidsstakingen organiseerden"
explanation: >-
  Vanaf het begin van de twintigste eeuw scheidde een fundamentele tweedeling revolutionaire socialisten, die zich tegen eigendomsrechten verzetten en de kapitalistische samenleving wilden vernietigen door geweld of de dictatuur van het proletariaat, van reformistische socialisten, die sociale rechtvaardigheid nastreefden via democratische verkiezingen en belastingen terwijl zij het kapitalisme tijdelijk accepteerden. Deze splitsing vormde de hele latere geschiedenis van socialistische bewegingen.
reviewed: false
