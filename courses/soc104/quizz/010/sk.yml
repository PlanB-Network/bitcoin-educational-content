question: "Prečo sa vertikálna os (hore-dole) v Nolanovom diagrame považuje za zásadnejšiu než horizontálna os (ľavica-pravica)?"
answer: "Pretože odhaľuje skutočné delenie medzi tými, ktorí bránia maximálne individuálne slobody, a tými, ktorí uprednostňujú maximálnu štátnu kontrolu"
wrong_answers:
  - "Pretože meria ekonomický výstup presnejšie než horizontálna os meria sociálne politiky"
  - "Pretože väčšina politických konfliktov v dejinách sa týkala skôr kultúrnej identity než vládnutia"
  - "Pretože horizontálna os sa vzťahuje iba na moderné demokracie, zatiaľ čo vertikálna os je univerzálna"
explanation: >-
  Základná os je vertikálna, pretože zachytáva podstatnú politickú otázku: do akej miery má štát kontrolovať ľudské konanie? Ľavicovo-pravicová os iba odráža rôzne citlivosti (sociálna spravodlivosť verzus tradícia), no obe strany môžu na vertikálnej osi zaujímať rovnakú pozíciu ako etatisti. Vertikálna os odhaľuje, či niekto chce vnucovať svoju víziu silou, alebo rešpektuje individuálnu slobodu.
reviewed: false
