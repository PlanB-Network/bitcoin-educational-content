question: "Каква е ключовата разлика между минархистите и анархокапиталистите в рамките на либертарианството?"
answer: "Минархистите приемат минимална държава за отбрана, правосъдие и полиция, докато анархокапиталистите искат всички държавни функции да бъдат приватизирани"
wrong_answers:
  - "Минархистите отхвърлят всички форми на управление, докато анархокапиталистите приемат ограничена държавна регулация на пазарите"
  - "Минархистите предпочитат прогресивно данъчно облагане за основни услуги, докато анархокапиталистите се противопоставят на всякакво данъчно облагане"
  - "Минархистите се фокусират само върху икономическата свобода, докато анархокапиталистите защитават както икономическите, така и обществените свободи"
explanation: >-
  Минархистите смятат, че държавата трябва да бъде ограничена до основни функции като отбрана, правосъдие и полиция ("държавата нощен пазач"), докато анархокапиталистите твърдят, че дори тези функции трябва да бъдат приватизирани и управлявани чрез доброволна пазарна конкуренция. Несъгласието им е повече за практическото прилагане, отколкото за фундаменталните етични принципи. И двете тенденции споделят едни и същи либертариански ценности на самопритежание и неагресия.
reviewed: false
