question: "Wie unterschieden sich die wirtschaftlichen Ansätze von Hitlers Deutschland und Stalins Sowjetunion trotz ihrer gemeinsamen totalitären Methoden?"
answer: "NS-Deutschland bewahrte den Anschein von Privateigentum, während es den Privatsektor staatlichen Zielen unterordnete, während der Stalinismus jedes Privateigentum abschaffte und die Wirtschaft vollständig plante"
wrong_answers:
  - "NS-Deutschland verstaatlichte alle Industrien vollständig, während Stalins Regime begrenzte Privatunternehmen in der Landwirtschaft zuließ"
  - "NS-Deutschland förderte freien internationalen Handel, um die Wiederaufrüstung zu finanzieren, während der Stalinismus vollständige wirtschaftliche Isolation durchsetzte"
  - "NS-Deutschland stützte sich auf freiwillige Zusammenarbeit der Unternehmen mit dem Staat, während der Stalinismus nur Zwangsarbeit einsetzte"
explanation: >-
  Obwohl beide Regime identische politische Methoden einsetzten (Personenkult, totale Überwachung, systematische Beseitigung der Opposition), unterschieden sich ihre Wirtschaftsmodelle in der Form. NS-Deutschland schaffte Privateigentum nicht formell ab, ordnete den Privatsektor aber vollständig staatlichen Zielen wie Krieg und Wiederaufrüstung unter und erzwang wirtschaftliche Autarkie. Der Stalinismus ging weiter, indem er jedes Privateigentum abschaffte, Fünfjahrespläne einführte und gesamte Produktion und Verteilung direkt kontrollierte.
reviewed: false
