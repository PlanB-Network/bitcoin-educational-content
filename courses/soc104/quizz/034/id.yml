question: "Apa itu prinsip non-agresi sebagaimana diteorikan oleh Murray Rothbard?"
answer: "Tidak sah untuk memulai kekuatan fisik terhadap individu lain atau kepemilikannya, meskipun kekerasan defensif diperbolehkan"
wrong_answers:
  - "Semua bentuk kekerasan selalu salah, termasuk bela diri dan perlawanan terhadap penindasan"
  - "Kekerasan dapat diterima ketika diarahkan terhadap institusi yang menindas tetapi tidak pernah terhadap individu lain"
  - "Hanya negara yang memiliki hak sah untuk menggunakan kekuatan, dan individu tidak boleh pernah menggunakan kekerasan"
explanation: >-
  Prinsip non-agresi Rothbard menyatakan bahwa memulai kekuatan fisik terhadap orang lain atau kepemilikannya adalah tidak sah. Ini adalah terjemahan filosofis dari aturan emas. Namun, prinsip ini tidak melarang semua kekerasan: kekerasan defensif, termasuk bela diri dan perlawanan terhadap penindasan, dianggap sah. Ini membedakannya dari pasifisme murni dan dari klaim monopoli negara atas kekuatan.
reviewed: false
