question: "Aká je libertariánska pozícia k otázke manželstva homosexuálov?"
answer: "Štát nemá čo definovať manželstvo; malo by sa sprivatizovať a ponechať jednotlivcom, združeniam a náboženským inštitúciám"
wrong_answers:
  - "Manželstvo homosexuálov by sa malo legalizovať, pretože všetci občania si zaslúžia rovnaké zaobchádzanie pred zákonom"
  - "Manželstvo homosexuálov by sa malo zakázať, pretože tradičné manželstvo je základnou inštitúciou pre plodenie detí"
  - "Manželstvo homosexuálov by sa malo legalizovať, ale iba prostredníctvom samostatného právneho rámca odlišného od tradičného manželstva"
explanation: >-
  Libertariáni tvrdia, že otázka manželstva je zásadne nesprávne zarámovaná, pretože je kladená v etatistických pojmoch. Veria, že štát nemá čo zasahovať do súkromných životov, takže riešením je úplne oddeliť manželstvo od štátu. Vnucovaním jednej definície štát vytvára konflikty. Prvá nesprávna odpoveď odráža socialistickú alebo centristickú pozíciu a druhá odráža konzervatívnu pozíciu.
