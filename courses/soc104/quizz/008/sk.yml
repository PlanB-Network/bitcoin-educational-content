question: "Kde sa na Nolanovom diagrame nachádzajú Zelení a prečo?"
answer: "Veľmi nízko na diagrame, pretože sa domnievajú, že individuálny záujem nesmie mať prednosť pred kolektívnym záujmom planéty"
wrong_answers:
  - "Na vrchole diagramu, pretože rovnako uprednostňujú osobnú slobodu aj environmentálne povedomie"
  - "V strede diagramu, pretože vyvažujú hospodársky rast s ochranou životného prostredia"
  - "Úplne napravo, pretože podporujú trhové riešenia environmentálnych výziev"
explanation: >-
  Zelení sa na Nolanovom diagrame nachádzajú veľmi nízko, pretože v mene blaha planéty uprednostňujú silnú štátnu kontrolu nad ekonomickými aj osobnými rozhodnutiami. Nahradili marxistický triedny boj zápasom medzi človekom a prírodou a majú sklon obhajovať ekonomickú kontrolu, ba dokonca zrušenie súkromného vlastníctva. To ich umiestňuje do autoritárskeho sektora, nie na vrchol ani do stredu.
