question: "Hur relaterar Karl Poppers åtskillnad mellan öppna och slutna samhällen till debatten om individualism kontra kollektivism?"
answer: "Det öppna samhället erkänner individens rätt att själv döma genom personliga beslut, medan det slutna samhället är kollektivistiskt och vilar på stammentalitet och vägran av kritisk frihet"
wrong_answers:
  - "Det öppna samhället är ett samhälle som tillåter frihandel över nationsgränser, medan det slutna samhället inför tullar och protektionistisk ekonomisk politik"
  - "Det öppna samhället styrs av direktdemokrati där varje medborgare röstar, medan det slutna samhället styrs av en enda ärftlig monark"
  - "Det öppna samhället publicerar alla regeringsdokument transparent, medan det slutna samhället klassificerar information som statshemligheter"
explanation: >-
  Popper definierade det slutna samhället som det magiska eller tribala samhället och det öppna samhället som ett där individer konfronteras med personliga beslut. Det slutna samhället är kollektivistiskt och vilar på stammentalitet med vägran av kritisk frihet och idealisering av en statisk ordning. Det öppna samhället ger företräde åt fritt val av värden, övertygelser och relationer, och förkroppsligar därmed direkt individualistiska principer.
reviewed: false
