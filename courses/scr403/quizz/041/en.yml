question: A Simplicity output is built with the fixed BIP-0341 NUMS point as its internal key. Why is the key-spend path provably unusable, and what does randomizing that NUMS point (as BIP-0341 recommends) actually add?
answer: Nobody knows the NUMS point's discrete logarithm, so no key-path signature can ever be produced; randomization adds only privacy, making the output indistinguishable from ordinary Taproot outputs.
wrong_answers:
  - The NUMS point is deliberately chosen to lie off the secp256k1 curve, so key-path signatures fail validation; randomization brings it back on-curve while keeping its private key unrecoverable.
  - The NUMS point corresponds to a private key of zero, which consensus rules reject in any signature; randomization protects the tweak computation against side-channel leakage of that key.
  - Tweaking a NUMS point yields an output key outside the valid range, making key-spend transactions non-standard; randomization guarantees distinct addresses when the same CMR is reused.
explanation: >-
  A NUMS ('Nothing-Up-My-Sleeve') point is a perfectly valid curve point
  constructed so that no one knows a corresponding private key — its
  discrete logarithm is unknown. Since a key-path spend requires a Schnorr
  signature under the internal key, and no such signature can be produced
  without the private key, the key-spend path is provably unusable and
  funds can only move through the committed script path. Randomizing the
  NUMS point changes none of this; it merely hides the fact that key-spend
  is disabled, so the output looks like any other Taproot output — a
  privacy benefit.
reviewed: false
