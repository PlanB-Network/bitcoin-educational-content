question: Je, "topology" inamaanisha nini kwenye mtandao wa kompyuta?
answer: Jinsi vifaa vimeunganishwa
wrong_answers:
  - Kasi ya muunganisho wa mtandao
  - Aina ya protocol inayotumika kwa mawasiliano
  - Kwa chapa ya ruta zinazotumika kwenye mtandao
explanation: |
  Topology inahusu muundo wa kimwili au wa kimantiki wa mtandao na jinsi vipengele vyake vimeunganishwa.
reviewed: true
