question: "Why is monetary inflation described as a hidden tax imposed without the consent of citizens?"
answer: "Because government money creation devalues the currency so people can buy less with the same amount, but most do not realize that rising prices reflect government policy rather than natural market forces"
wrong_answers:
  - "Because central banks secretly charge fees on every transaction processed through the banking system without disclosing them to account holders"
  - "Because governments print money and distribute it only to wealthy individuals while taxing the poor through higher sales taxes on essential goods"
  - "Because inflation is caused by private corporations raising prices to increase profits, which functions as an unofficial tax on consumers"
explanation: >-
  The injection of money into the system translates into currency devaluation where the same amount buys less because the new money does not reflect genuine economic growth. Most people do not see that government policy led to rising prices, which are simply the reflection of currency devaluation. This amounts to legal theft and institutionalized spoliation, impoverishing the middle class while the wealthy capture new money through speculative assets.
reviewed: false
