question: Коя частна валутна система изрично споменава Satoshi Nakamoto в своите трудове?
answer: Liberty Reserve
wrong_answers:
  - e-gold
  - Liberty dollar
  - e-Bullion
explanation: |
  Liberty Reserve е верният отговор. Satoshi също така [споменава](https: //bitcointalk.org/index.php?topic=87.msg807#msg807) Pecunix, цифрова златна валута, създадена през 2002 г.
reviewed: true
