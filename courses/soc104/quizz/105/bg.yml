question: "Според курса, как свободата позволява и леви, и десни ценности да съществуват мирно заедно?"
answer: "В режим на истинска свобода хората с леви идеали могат доброволно да споделят притежания и да преразпределят средства, докато онези с десни ценности могат да спестяват и да предават традиции, без нито една страна да налага своя начин на живот на другата"
wrong_answers:
  - "Свободата изисква и двете страни да направят компромис, като приемат центристка позиция, при която правителството балансира конкуриращи се ценности чрез умерена регулация"
  - "Свободата означава, че левите и десните общности трябва да живеят в отделни географски територии със собствени независими правителства"
  - "Свободата работи, като позволява на гражданите да гласуват кои ценности трябва да бъдат прилагани във всеки регион, редувайки леви и десни политики при всеки изборен цикъл"
explanation: >-
  Курсът показва, че в истински режим на свобода онези, които се придържат към леви идеали, могат доброволно да се откажат от притежания, да споделят средства за производство или да дарят заплати на преразпределящи организации. Онези с десни ценности могат да работят усилено, да спестяват и да предават семейни ценности. Никой не трябва да налага своя начин на живот на другите. Именно чрез свободата на пазара и силата на избора целите могат да бъдат постигнати мирно.
