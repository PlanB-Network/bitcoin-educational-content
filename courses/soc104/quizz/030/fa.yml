question: "اصطلاح 'لیبرال' در سنت سیاسی اروپا چه معنایی دارد؟"
answer: "حامی اقتصاد مبتنی بر laissez-faire، کاهش مداخلهٔ دولت و آزادی‌های فردی"
wrong_answers:
  - "مدافع مداخلهٔ دولت، بیمهٔ سلامت عمومی و برنامه‌های مبارزه با فقر"
  - "آنارشیستی رادیکال که به‌دنبال الغای کامل دولت و مالکیت خصوصی است"
  - "میانه‌رویی که در همهٔ حوزه‌های سیاست به‌طور برابر مواضع سوسیالیستی و محافظه‌کارانه را متوازن می‌کند"
explanation: >-
  در اروپا، لیبرالیسم همچنان با سیاست‌های اقتصادی laissez-faire، کاهش مداخلهٔ دولت و دفاع از آزادی‌های فردی پیوند دارد. پاسخ نادرست نخست لیبرال‌های آمریکایی را توصیف می‌کند، که معنای این اصطلاح را به سوی مداخله‌گرایی تغییر داده‌اند. لیبرالیسم اروپایی نه آنارشیسم است و نه میانه‌روی.
reviewed: false
