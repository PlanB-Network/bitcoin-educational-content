question: "Wie unterscheiden sich die Rollen des Cato Institute, des Mises Institute und der Libertarian Party innerhalb der libertären Bewegung?"
answer: "Das Cato Institute konzentriert sich auf politische Handlungsvorschläge, das Mises Institute auf Bildung und akademisches Publizieren und die Libertarian Party auf Wahlpolitik"
wrong_answers:
  - "Das Cato Institute finanziert politische Kampagnen, das Mises Institute lobbyiert direkt beim Kongress, und die Libertarian Party organisiert akademische Konferenzen"
  - "Das Cato Institute veröffentlicht Wirtschaftslehrbücher, das Mises Institute betreibt Wählerregistrierungskampagnen, und die Libertarian Party entwirft Gesetzesvorlagen"
  - "Das Cato Institute organisiert Basisproteste, das Mises Institute stellt rechtliche Verteidigung für Libertäre bereit, und die Libertarian Party verwaltet Think-Tank-Forschung"
explanation: >-
  Das Cato Institute (gegründet 1977) ist ein in Washington ansässiger Think Tank, der an politischen Handlungsvorschlägen arbeitet. Das Mises Institute (gegründet 1982) konzentriert sich auf Bildung statt auf politische Lobbyarbeit und funktioniert als eine Art Online-Universität mit Konferenzen und neu veröffentlichten Werken. Die Libertarian Party (gegründet 1971) ist die drittgrößte amerikanische politische Partei und nimmt an Wahlen teil, bei denen selbst ihr Stimmenanteil von ungefähr 2 % Ergebnisse kippen kann.
reviewed: false
