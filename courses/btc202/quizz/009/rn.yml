question:  Ni ikihe gikorwa nyamukuru ca Bitcoin node?
answer:  Kubika Blockchain no kwemeza transactions na blocs
wrong_answers:
  - Kubika impfunguruzo z'ibanga no  gukora transactions
  - Gukora aderesi nshasha z’abakoresha
  - Guhindura bitcoins mu mafaranga ya fiat
explanation: |
  Igikoresho ca Bitcoin kigumya kopi ya Blockchain kandi kigira uruhara mu kwemeza no gutanga amafaranga n’amabuye.
reviewed: true
