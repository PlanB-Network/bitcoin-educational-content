question: "Che cos'è il costruttivismo come convinzione politica condivisa?"
answer: "La credenza che un governo centrale possa creare, con la forza della legge, un ordine sociale buono per il maggior numero"
wrong_answers:
  - "La credenza che la società debba essere organizzata attraverso cooperazione volontaria tra individui senza interferenza dello Stato"
  - "La credenza che solo i liberi mercati possano determinare la distribuzione ottimale delle risorse nella società"
  - "La credenza che l'autorità politica debba essere distribuita equamente tra tutti i cittadini attraverso la democrazia diretta"
explanation: >-
  Il costruttivismo unisce centristi, conservatori e socialisti intorno a una convinzione condivisa: la superiorità del processo politico sul processo di mercato. È la credenza che un governo centrale possa creare, con la forza della legge, un ordine sociale buono per il maggior numero. Ciò si oppone direttamente alla difesa libertaria dell'ordine spontaneo che emerge dalle interazioni volontarie.
