question: "Trong vấn đề quản lý súng, khác biệt then chốt giữa lập trường bảo thủ và lập trường tự do cá nhân là gì?"
answer: "Cả hai đều chấp nhận một mức độ quản lý nào đó, nhưng những người bảo thủ muốn các quy tắc đến từ một thẩm quyền công hợp pháp, trong khi những người theo chủ nghĩa tự do cá nhân muốn các quy tắc nảy sinh từ những người trực tiếp liên quan, như các hiệp hội công dân và cạnh tranh thị trường"
wrong_answers:
  - "Những người bảo thủ phản đối mọi hình thức quản lý súng, trong khi những người theo chủ nghĩa tự do cá nhân chấp nhận sự kiểm soát nghiêm ngặt của chính phủ vì an toàn công cộng"
  - "Những người bảo thủ muốn cấm hoàn toàn súng, trong khi những người theo chủ nghĩa tự do cá nhân ủng hộ quyền tiếp cận không hạn chế với mọi loại vũ khí"
  - "Những người bảo thủ đặt lập trường của mình trên các quyền cá nhân, trong khi những người theo chủ nghĩa tự do cá nhân đặt lập trường của mình trên trách nhiệm tập thể"
explanation: >-
  Cả những người bảo thủ lẫn những người theo chủ nghĩa tự do cá nhân đều đồng ý rằng cần có một hình thức quản lý nào đó đối với việc mang vũ khí. Khác biệt then chốt nằm ở chỗ ai thiết lập các quy tắc đó. Những người bảo thủ nhấn mạnh rằng các quy định phải đến từ một thẩm quyền công được giao nhiệm vụ bảo vệ lợi ích chung (từ trên xuống). Những người theo chủ nghĩa tự do cá nhân lập luận rằng việc quản lý nên nảy sinh từ những người trực tiếp liên quan: các chuyên gia an ninh, các hiệp hội công dân, và cạnh tranh thị trường (từ dưới lên).
