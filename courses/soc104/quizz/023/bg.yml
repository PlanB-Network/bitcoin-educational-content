question: "Как културно консервативният либертарианец се отнася към поведения, които морално не одобрява?"
answer: "Противопоставя им се и ги обезкуражава чрез убеждаване и пример, но без да прибягва до принудителната сила на закона"
wrong_answers:
  - "Подкрепя забрани на тези поведения от местните власти, като същевременно се противопоставя на забрани на федерално ниво"
  - "Остава напълно мълчалив за тези поведения, вярвайки, че всяка форма на неодобрение нарушава индивидуалната свобода"
  - "Защитава общностни трибунали, които могат да наказват тези поведения извън формалната правна система"
explanation: >-
  Културно консервативният либертарианец може морално да не одобрява определени поведения, но не защитава законова забрана на консенсусни, неагресивни действия. Той може да не харесва такива действия, да им се противопоставя и активно да ги обезкуражава, но винаги чрез убеждаване, образование и пример, а не чрез принудителната сила на закона. Тук не става дума за мълчание или за създаване на алтернативни механизми за принуда.
