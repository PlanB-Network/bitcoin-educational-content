question: "Kwa nini Popper anahoji kwamba jamii wazi hubaki dhaifu kiasili licha ya faida zake?"
answer: "Kwa sababu wajibu unaoletwa na ubinafsi unaweza kuonekana wa kutisha, ukiumba kishawishi cha kutafuta kimbilio katika ulinzi wa jumuiya, mamlaka, au hamu ya kurejea katika zamani zilizotukuzwa"
wrong_answers:
  - "Kwa sababu jamii wazi hazina nguvu za kijeshi na haziwezi kujilinda dhidi ya uvamizi wa jamii funge"
  - "Kwa sababu taasisi za kidemokrasia hazina ufanisi kiasili na hatimaye huanguka chini ya uzito wa utata wa urasimu"
  - "Kwa sababu jamii wazi huruhusu ukosefu mkubwa mno wa usawa wa kiuchumi, ambao bila kuepuka husababisha mapinduzi na kuwekwa kwa tawala za kimabavu"
explanation: >-
  Popper anasisitiza kwamba udhaifu wa jamii wazi unatokana na hatari ya kisaikolojia. Wajibu unaodokezwa na ubinafsi unaweza kuonekana wa kutisha na wenye hatari kwa sababu mtu lazima afanye maamuzi yake mwenyewe na anaweza kushindwa. Hili huumba kishawishi cha kutafuta kimbilio katika ulinzi wa jumuiya au mielekeo ya kutamani zamani zilizotukuzwa. Jamii wazi hukabili changamoto zinazoendelea kutoka kwa misukumo ya kijumuiya na kishawishi kinachojirudia cha vurugu.
