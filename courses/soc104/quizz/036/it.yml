question: "Che cosa significa il termine 'olismo' nel contesto della filosofia socialista?"
answer: "Una visione della società come un tutto indivisibile in cui il collettivo ha il primato sull'individuo"
wrong_answers:
  - "Una filosofia che tratta ogni individuo come un'unità autonoma i cui diritti non possono essere prevalicati da alcun gruppo"
  - "Una teoria economica che sostiene il bilanciamento tra settore pubblico e settore privato in uguale misura"
  - "Una strategia politica che integra tutti i punti di vista minoritari in un'unica piattaforma basata sul consenso"
explanation: >-
  Olismo deriva dal greco 'holos', che significa 'il tutto.' Nel pensiero socialista, si riferisce a una visione della società come un tutto indivisibile anziché come una semplice somma di individui. Lo Stato socialista mira a farsi carico dell'attività umana e a dirigerla al massimo grado. Questo collettivo può essere rappresentato come una classe sociale, una nazione, una razza o un genere, ma in ogni caso l'individuo è definito dall'appartenenza al gruppo.
