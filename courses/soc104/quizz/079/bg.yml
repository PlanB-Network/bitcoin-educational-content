question: "Защо предсказанието на Molinari от 1849 г. се оказва пророческо относно връзката между свободата и политическата власт?"
answer: "Защото консерваторите и социалистите са се редували във властта и са инструментализирали свободата в служба на съответните си политически цели, точно както той описва"
wrong_answers:
  - "Защото описаният от него персонаж икономист в крайна сметка придобива политическа власт и прилага либертариански политики в цяла Европа"
  - "Защото предсказанието му, че и трите политически семейства ще се слеят в едно центристко движение, се сбъдва през двадесети век"
  - "Защото свободата постепенно е разширявана от последователни правителства, докато стане основният организиращ принцип на модерните демокрации"
explanation: >-
  Визията на Molinari се оказва пророческа, защото от средата на деветнадесети век насам консерваторите и социалистите са се редували във властта и са извършвали именно това, което той описва: инструментализирането на свободата в служба на политически цели. И двете семейства са готови да ограничават свободи и да призовават държавата да налага съответните им програми, докато позицията на икономиста за безусловна свобода остава маргинализирана.
