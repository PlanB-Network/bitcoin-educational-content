question: "Warum argumentiert Popper, dass die offene Gesellschaft trotz ihrer Vorteile von Natur aus fragil bleibt?"
answer: "Weil die Verantwortung, die Individualismus impliziert, beängstigend wirken kann, wodurch die Versuchung entsteht, Zuflucht in gemeinschaftlichem Schutz, Autorität oder Nostalgie nach einer idealisierten Vergangenheit zu suchen"
wrong_answers:
  - "Weil offene Gesellschaften keine militärische Stärke haben und sich nicht gegen Invasionen durch geschlossene Gesellschaften verteidigen können"
  - "Weil demokratische Institutionen von Natur aus ineffizient sind und schließlich unter dem Gewicht bürokratischer Komplexität zusammenbrechen"
  - "Weil offene Gesellschaften zu viel wirtschaftliche Ungleichheit zulassen, was unvermeidlich zur Revolution und zur Errichtung autoritärer Regime führt"
explanation: >-
  Popper betont, dass die Fragilität der offenen Gesellschaft aus einer psychologischen Verwundbarkeit stammt. Die Verantwortung, die Individualismus impliziert, kann beängstigend und riskant wirken, weil man seine eigenen Entscheidungen treffen muss und scheitern kann. Dies erzeugt die Versuchung, Zuflucht in gemeinschaftlichem Schutz oder in nostalgischen Tendenzen zu einer idealisierten Vergangenheit zu suchen. Die offene Gesellschaft steht vor fortlaufenden Herausforderungen durch kommunitaristische Impulse und die wiederkehrende Versuchung der Gewalt.
