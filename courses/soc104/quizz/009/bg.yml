question: "Къде се намират Зелените върху диаграмата на Нолан и защо?"
answer: "Много ниско в диаграмата, защото смятат, че индивидуалният интерес не трябва да има предимство пред колективния интерес на планетата"
wrong_answers:
  - "На върха на диаграмата, защото отдават еднакъв приоритет на личната свобода и екологичното съзнание"
  - "В центъра на диаграмата, защото балансират икономическия растеж с опазването на околната среда"
  - "В крайната десница, защото подкрепят пазарно базирани решения на екологичните предизвикателства"
explanation: >-
  Зелените се намират много ниско върху диаграмата на Нолан, защото предпочитат силен държавен контрол както върху икономическите, така и върху личните решения в името на планетарното благополучие. Те са заменили марксистката класова борба с борба между човека и природата и имат тенденция да защитават икономическия контрол и дори премахването на частната собственост. Това ги поставя в авторитарния сектор, а не на върха или в центъра.
