question: typing rules의 'premises에서 더 작은 types' 조건이 주어졌을 때, 실행 중 실제로 data를 이동하는 core combinators는 무엇인가요?
answer: iden과 comp뿐입니다. 나머지 일곱 개는 bookkeeping만으로 구현됩니다.
wrong_answers:
  - take와 drop뿐입니다. component 하나를 추출하면 machine이 product 밖으로 그것을 copy해야 하기 때문입니다.
  - pair와 case뿐입니다. 두 branch를 위해 input을 duplicate하고 tag로 dispatch하면 data가 shuffle되기 때문입니다.
  - injl과 injr뿐입니다. tag를 추가하면 value를 더 큰 sum-type representation으로 rewrite하기 때문입니다.
explanation: >-
  직관과 달리 data access처럼 보이는 combinators(take,
  drop, pair, case, injl, injr)는 copying이 필요 없습니다. typing rules의
  premises가 conclusions보다 작은 types를 포함하기 때문에, Bit
  Machine은 이들을 bookkeeping만으로 구현할 수 있습니다. 자신의 전체 input을
  output으로 copy하는 iden과, f에서 g로 전달되는 intermediate value를 materialize하는
  comp만이 실제로 data를 이동합니다.
reviewed: false
