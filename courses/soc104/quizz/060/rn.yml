question: "Uko George W. Bush yishuye ku ngorane z'imari za 2008 vyerekana gute 'uguhindagurika guteza ingorane' kw'ingingo za conservative?"
answer: "Yarahevye ingingo z'isoko ryigenga kugira ngo atabare amabanki manini, agaragaza uko conservatives babona Leta nk'umwishingizi wa nyuma w'ugutekana kw'ubutunzi bw'igihugu"
wrong_answers:
  - "Yaranse ukwivanga kwose kwa Leta arareka amabanki aratemba, akurikiza cane ideology y'isoko ryigenga naho ingaruka zoba izihe"
  - "Yagize urwego rw'amabanki urwa Leta burundu kandi azana amakori yiyongera uko umuntu aronka menshi, ava muri conservatism aja muri democratic socialism"
  - "Yishuye mu kugabanya amafaranga yose Leta ikoresha no gukuraho amabwirizwa y'imari kugira ngo isoko ryikikosore"
explanation: >-
  Bush yavuze ko yari 'abandoned free-market principles to save the free-market system' mu kwivanga kugira ngo atabare amabanki manini. Ivyo vyerekana ukuntu conservatives bashobora gushira imbere ububasha n'ukubandanya kw'igihugu kurusha ingingo z'isoko ziri mu vyiyumviro. Ubwo buryo nyene buhindagurika buboneka muri politike z'ubudandaji za Trump z'ukwirinda, zakurikijwe mw'izina ry'inyungu z'igihugu naho hari akaga ko gukomeza corporatism na crony capitalism.
