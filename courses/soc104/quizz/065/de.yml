question: "Was ist die libertäre Position zur Frage der gleichgeschlechtlichen Ehe?"
answer: "Der Staat hat nicht darüber zu bestimmen, was Ehe ist; sie sollte privatisiert und Individuen, Vereinigungen und religiösen Institutionen überlassen werden"
wrong_answers:
  - "Die gleichgeschlechtliche Ehe sollte legalisiert werden, weil alle Bürger gleiche Behandlung vor dem Gesetz verdienen"
  - "Die gleichgeschlechtliche Ehe sollte verboten werden, weil die traditionelle Ehe eine grundlegende Institution für die Fortpflanzung ist"
  - "Die gleichgeschlechtliche Ehe sollte legalisiert werden, aber nur durch einen separaten rechtlichen Rahmen, der sich von der traditionellen Ehe unterscheidet"
explanation: >-
  Libertäre argumentieren, dass die Ehefrage grundlegend falsch gestellt ist, weil sie in etatistischen Begriffen formuliert wird. Sie glauben, dass der Staat nichts in Privatleben einzugreifen hat, daher besteht die Lösung darin, die Ehe vollständig vom Staat zu trennen. Indem der Staat eine einzige Definition auferlegt, schafft er Konflikte. Die erste falsche Antwort spiegelt die sozialistische oder zentristische Position wider, und die zweite spiegelt die konservative Position wider.
reviewed: false
