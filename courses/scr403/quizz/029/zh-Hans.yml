question: 条件组合在什么意义上是并行组合的对偶？
answer: 并行把一个输入喂给两个操作并将它们的输出配成对（一个积）；条件接收输入之和，并且两个分支共享一个输出类型。
wrong_answers:
  - 并行必须同时运行两个操作；条件按顺序运行它们，并只返回标签选择的分支。
  - 二者都运行在一个共享输入上；并行保留输出对，而条件运行两个分支并丢弃未选中的那个。
  - 并行预先复制其输入，而条件事后复制其输出，从而交换复制发生的位置。
explanation: >-
  这种对偶性是积/和的交换，并伴随共享类型换边：
  并行组合把相同的输入类型提供给两个操作，
  并把它们的输出配成一个积，而条件组合
  接收两个输入类型的和（带标签联合），且两个分支必须
  产生相同的输出类型。是否同时运行并不相关——文章
  强调并行组合可以按顺序实现——并且
  条件组合只执行由标签选择的一个分支，
  而不是运行两个分支再丢弃其中一个。
reviewed: false
