question: "Что означает термин «либерал» в европейской политической традиции?"
answer: "Сторонника экономики laissez-faire, сокращения государственного вмешательства и индивидуальных свобод"
wrong_answers:
  - "Сторонника государственного вмешательства, государственного медицинского страхования и программ борьбы с бедностью"
  - "Радикального анархиста, который стремится к полной отмене государства и частной собственности"
  - "Центриста, который одинаково уравновешивает социалистические и консервативные позиции во всех областях политики"
explanation: >-
  В Европе либерализм остался связанным с экономической политикой laissez-faire, сокращением государственного вмешательства и защитой индивидуальных свобод. Первый неправильный ответ описывает американских liberals, у которых значение термина сместилось к интервенционизму. Европейский либерализм не является ни анархизмом, ни центризмом.
