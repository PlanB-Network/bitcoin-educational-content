question: Why does Rothbard believe that written constitutions are not enough to limit the power of the state?
answer: They can be interpreted broadly by those in power to expand state authority
wrong_answers:
  - They can be easily amended by those in power
  - They are too old to be relevant in modern democratic societies
  - They cannot prevent abuses of power by bureaucrats and officials
explanation: |
  Rothbard argues that constitutions are insufficient because the majority party can adopt extensive interpretations to increase its power. Without concrete enforcement mechanisms, constitutions become ineffective tools against the expansion of state authority.
reviewed: true
