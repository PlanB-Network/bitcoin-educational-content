question: "在枪支管制问题上，保守主义者和自由意志主义者立场的关键区别是什么？"
answer: "双方都接受某种监管，但保守主义者希望规则来自合法的公共权威，而自由意志主义者希望规则由直接相关者产生，例如公民协会和市场竞争"
wrong_answers:
  - "保守主义者反对一切枪支监管，而自由意志主义者接受出于公共安全的严格政府控制"
  - "保守主义者希望完全禁止枪支，而自由意志主义者支持不受限制地获得所有武器"
  - "保守主义者把自己的立场建立在个人权利之上，而自由意志主义者把自己的立场建立在集体责任之上"
explanation: >-
  保守主义者和自由意志主义者都同意，对携带武器进行某种形式的监管是必要的。关键区别在于谁来制定这些规则。保守主义者坚持，监管必须来自负责维护共同善的公共权威（自上而下）。自由意志主义者则认为，监管应当由直接相关者产生：安全专业人士、公民协会和市场竞争（自下而上）。
reviewed: false
