question: 在 Simplicity 的类型系统中，定长向量是如何构建的？
answer: 通过嵌套的、长度为二的幂的积类型（例如 A⁴ = A² × A²）。
wrong_answers:
  - 使用内置在语言中的特殊数组类型构造器。
  - 通过把元素链成列表的递归和类型。
  - 使用具有固定最大大小的可变长度缓冲区。
explanation: >-
  Simplicity 由嵌套的积类型构建向量。A² 是 A × A，
  A⁴ 是 A² × A²，A⁸ 是 A⁴ × A⁴，依此类推。这会得到大小为二的幂的集合。
  例如，𝟚²⁵⁶（一个 256 位哈希）是从布尔类型出发，通过嵌套 8 层积构建的。
