question: "Wie funktioniert Bitcoin als moralisches Projekt mit politischen Folgen und nicht als politisches Projekt mit moralischen Ansprüchen?"
answer: "Bitcoin wurde entworfen, um Menschen frei und nicht reich zu machen, indem es wirksames Eigentum ermöglicht, den Wert der Arbeit schützt und Privatsphäre bewahrt; das sind moralische Errungenschaften, die politische Wirkungen erzeugen, ohne irgendein politisches Lager zu beanspruchen"
wrong_answers:
  - "Bitcoin ist ein moralisches Projekt, weil sein Code ethische Regeln durchsetzt, die Betrug verhindern, und seine politische Folge darin besteht, demokratische Regierungsführung durch algorithmische Entscheidungsfindung zu ersetzen"
  - "Bitcoin funktioniert als moralisches Projekt, weil es Vermögen von den Reichen zu frühen Anwendern umverteilt und dadurch eine gerechtere Gesellschaft mit politischen Implikationen für die Steuerpolitik schafft"
  - "Bitcoin ist moralisch, weil Satoshi Nakamoto ethische Gebote in das Protokoll eingebettet hat, und seine politische Folge besteht darin, alle politischen Familien unter einem gemeinsamen Geldsystem zu vereinen"
explanation: >-
  Bitcoin wurde nicht entworfen, um Menschen reich zu machen, sondern um sie frei zu machen. Es erzielt drei moralische Ergebnisse: wirksames Eigentum zu ermöglichen (Verantwortung anzureizen), den durch Arbeit geschaffenen Wert zu schützen (produktive Anstrengung zu fördern) und Privatsphäre zu bewahren (Menschen zu erlauben, ohne Angst zu leben). Dies sind moralische Errungenschaften mit politischen Folgen, ohne irgendeinem politischen Lager anzugehören, wodurch Bitcoin zuerst ein moralisches und erst danach ein politisches Projekt ist.
