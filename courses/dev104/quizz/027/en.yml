question: What is the fundamental advantage of React's predictable data flow pattern (props down, events up) in Lightning wallet development compared to vanilla JavaScript approaches?
answer: It eliminates state synchronization issues by creating a unidirectional data flow that makes UI updates automatic and debugging straightforward
wrong_answers:
  - It allows components to directly modify parent state without callbacks, reducing the complexity of inter-component communication patterns
  - It enables bidirectional data binding where child components can automatically update parent props, creating seamless state synchronization
  - It permits multiple components to share mutable state references, allowing for faster updates and reduced memory usage in wallet operations
explanation: |
  React's unidirectional data flow (props down, events up) solves the core problem of state synchronization that plagued vanilla JavaScript wallets. When data flows predictably in one direction - from parent to child via props, and changes flow back up via event callbacks - it eliminates the chaos of scattered state updates and manual DOM manipulation. This pattern ensures that when wallet data changes (like balance updates or new transactions), the UI automatically re-renders consistently across all components. The wrong answers describe anti-patterns that would actually recreate the synchronization problems React was designed to solve.
