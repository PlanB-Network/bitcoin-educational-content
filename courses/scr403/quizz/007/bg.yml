question: Как се изграждат вектори с фиксирана дължина в типовата система на Simplicity?
answer: Чрез вложени product типове с дължина степен на две (напр. A⁴ = A² × A²).
wrong_answers:
  - Чрез специален конструктор за масивен тип, вграден в езика.
  - Чрез рекурсивни sum типове, които свързват елементите в списък.
  - Чрез буфери с променлива дължина, които имат фиксиран максимален размер.
explanation: >-
  Simplicity изгражда вектори от вложени product типове. A² е A × A,
  A⁴ е A² × A², A⁸ е A⁴ × A⁴ и така нататък. Това дава колекции
  с размери степени на две. Например 𝟚²⁵⁶ (256-битов хеш) се изгражда
  чрез влагане на product-и 8 нива дълбоко от булевия тип.
