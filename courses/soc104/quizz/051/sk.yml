question: "Čo hovorí princíp neagresie?"
answer: "Človek môže slobodne konať podľa svojej vôle, pokiaľ nepácha násilie voči životu, slobode alebo vlastníctvu iného človeka"
wrong_answers:
  - "Štát má výlučné právo použiť silu na udržiavanie spoločenského poriadku"
  - "Občania sa musia podriadiť vláde väčšiny aj vtedy, keď obmedzuje individuálne slobody"
  - "Sloboda konania je dovolená iba vtedy, keď prospieva kolektívnemu dobru spoločnosti"
explanation: >-
  Princíp neagresie je základným kameňom libertariánskej politiky a tvrdí, že jednotlivci môžu konať slobodne za predpokladu, že nepáchajú násilie voči životu, slobode alebo vlastníctvu iných. Pripomína zlaté pravidlo prítomné naprieč civilizáciami. Na rozdiel od ostatných možností nepriznáva štátu osobitnú morálnu autoritu ani nepodriaďuje individuálne práva kolektívnemu prospechu.
