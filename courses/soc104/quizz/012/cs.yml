question: "Co zahrnuje kategorie ekonomické svobody?"
answer: "To, co děláte jako výrobce a spotřebitel: nákup, prodej, výrobu, práci, najímání a správu svých peněz"
wrong_answers:
  - "Vaše náboženská přesvědčení, osobní vztahy a svobodu projevu"
  - "Vaše právo volit, účastnit se voleb a vstupovat do politických stran"
  - "Vaši schopnost svobodně cestovat, zvolit si bydliště a překračovat státní hranice"
explanation: >-
  Ekonomická svoboda zahrnuje to, co děláte jako výrobce a spotřebitel: co můžete kupovat, prodávat nebo vyrábět; kde pracujete; koho zaměstnáváte; a co děláte se svými penězi. Osobní vztahy, náboženská přesvědčení a svoboda pohybu spadají do kategorie osobní svobody, nikoli do kategorie ekonomické svobody.
