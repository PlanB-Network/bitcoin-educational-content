question: "Ce înseamnă termenul 'liberal' în tradiția politică europeană?"
answer: "Un susținător al economiei laissez-faire, al reducerii intervenției statului și al libertăților individuale"
wrong_answers:
  - "Un adept al intervenției statului, al asigurărilor publice de sănătate și al programelor împotriva sărăciei"
  - "Un anarhist radical care urmărește abolirea completă a guvernului și a proprietății private"
  - "Un centrist care echilibrează în mod egal pozițiile socialiste și conservatoare în toate domeniile de politică publică"
explanation: >-
  În Europa, liberalismul a rămas asociat cu politici economice laissez-faire, intervenție redusă a statului și apărarea libertăților individuale. Primul răspuns greșit descrie liberalii americani, care au deplasat sensul termenului spre intervenționism. Liberalismul european nu este nici anarhism, nici centrism.
reviewed: false
