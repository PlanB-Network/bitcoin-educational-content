question: Mirabeau a jucat un rol activ în școala fiziocrată. Pe cine a convertit el în special?
answer: Dupont de Nemours
wrong_answers:
  - François Quesnay
  - Turgot
  - Adam Smith
explanation: |
  Mirabeau l-a convertit pe Dupont de Nemours la fiziocrație, permițându-i acestuia să devină unul dintre principalii susținători ai acestei școli de gândire.
