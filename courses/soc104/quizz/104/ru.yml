question: "Почему курс описывает Bitcoin как рыночную валюту, противопоставленную государственным деньгам, а не как правый или левый проект?"
answer: "Потому что Bitcoin — добровольно принимаемая, трудная в производстве, децентрализованная валюта, сохраняющая ценность, в отличие от принудительных централизованных фиатных денег, которые теряют ценность; поэтому раскол проходит между рынком и государством, а не между политическими идеологиями"
wrong_answers:
  - "Потому что Bitcoin был создан анонимным разработчиком, который намеренно избегал каких-либо политических заявлений о его цели или философии"
  - "Потому что алгоритм майнинга Bitcoin обеспечивает равное распределение новых монет между всеми политическими партиями, предотвращая любую идеологическую предвзятость денежной системы"
  - "Потому что Bitcoin функционирует идентично существующим фиатным валютам, но работает на более быстрой платёжной сети, делая политические различия несущественными"
explanation: >-
  Bitcoin описывается как мирное восстание против политизации денег. Государственные, или фиатные, деньги — это принудительная централизованная система, склонная терять ценность. Рыночные деньги, исторически золото, а сейчас Bitcoin, — это здоровая, трудная в производстве валюта, которая возникает добровольно и сохраняет свою ценность в долгосрочной перспективе. Настоящее противостояние — не левые против правых, а рынок против государства, что делает Bitcoin политическим разрывом, выходящим за пределы традиционных идеологических лагерей.
reviewed: false
