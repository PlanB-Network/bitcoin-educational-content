question: De ce a fost Dupont de Nemours o figură atât de excepțională în școala fiziocratică?
answer: Era cel mai tânăr
wrong_answers:
  - Era cel mai în vârstă
  - Era cel mai bogat
  - Era cel mai elocvent
explanation: |
  Dupont de Nemours a fost unul dintre cei mai tineri membri ai școlii fiziocratice, ceea ce i-a permis să se bucure de o carieră politică și economică lungă și distinsă.
