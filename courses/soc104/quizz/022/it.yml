question: "Che cosa rivela l'asse verticale del diagramma di Nolan sulla vera questione politica?"
answer: "Rivela se vuoi imporre le tue sensibilità agli altri attraverso lo stato, oppure preferisci che ogni persona sia libera di decidere per sé"
wrong_answers:
  - "Rivela se sostieni la governance democratica o preferisci il governo autoritario di un singolo leader"
  - "Rivela se ti identifichi con i movimenti sociali progressisti o con le istituzioni religiose tradizionali"
  - "Rivela se la tua preoccupazione principale è la sicurezza nazionale o la prosperità economica"
explanation: >-
  L'asse verticale espone la vera questione politica: non se sei di sinistra o di destra, ma fino a che punto vuoi che lo stato intervenga nel plasmare la società secondo i tuoi valori. Vuoi imporre le tue sensibilità agli altri, oppure preferisci che ogni persona sia libera di decidere per sé? Questo inquadramento trascende la divisione sinistra-destra e mostra che entrambi i campi possono essere ugualmente statalisti.
reviewed: false
