question: "Hoe kunnen door de staat gefinancierde programma's voor sociale bijstand perverse effecten produceren en zo het gevaar illustreren van uitsluitend op intenties vertrouwen?"
answer: "Ze kunnen afhankelijkheid creëren, prikkels om te werken wegnemen en neerkomen op plundering, aangezien het geld eerst moet worden afgenomen van degenen die de rijkdom hebben geproduceerd"
wrong_answers:
  - "Ze moedigen buitensporige persoonlijke besparingen aan, verminderen consumentenbestedingen en veroorzaken deflatie in de bredere economie"
  - "Ze versterken private ondernemingen door arbeidskosten naar de overheid te verschuiven en de noodzaak van concurrerende lonen te verminderen"
  - "Ze schaffen klassenverschillen zo grondig af dat sociale mobiliteit overbodig wordt en innovatie stagneert"
explanation: >-
  Friedman waarschuwt dat genereuze intenties schadelijke gevolgen kunnen produceren wanneer zij een rigoureuze analyse van menselijke prikkels verwaarlozen. Door de staat gefinancierde bijstandsprogramma's riskeren afhankelijkheid te creëren, geen prikkel om te werken te genereren en een vorm van plundering te vormen, aangezien middelen eerst moeten worden afgenomen van producenten van rijkdom. Meetbare resultaten zoals armoedevermindering en efficiëntie moeten voorrang krijgen boven nobele intenties.
