question: "Kwa nini walibertaria hupinga utozaji kodi?"
answer: "Kwa sababu ni ukiukaji wa kimaadili wa haki za mali, aina ya wizi wa dola unaonyakua mali ya mwingine bila ridhaa"
wrong_answers:
  - "Kwa sababu kodi hazina ufanisi kiuchumi na daima husababisha viwango vya juu vya ukosefu wa ajira"
  - "Kwa sababu utozaji kodi hukatisha tamaa uwekezaji wa kigeni na hudhoofisha nafasi ya ushindani ya nchi"
  - "Kwa sababu mifumo ya kodi endelevu huwalenga isivyo haki watu matajiri wanaounda ajira nyingi zaidi"
explanation: >-
  Pingamizi la kilibertaria dhidi ya utozaji kodi ni la kimaadili kabla halijawa la kiuchumi. Walibertaria huona utozaji kodi kama aina ya wizi wa dola na kizuizi kwa mali binafsi kwa sababu unahusisha kunyakua mali ya mwingine bila ridhaa. Ingawa kunaweza kuwa na hoja za kiuchumi dhidi ya utozaji kodi, hoja ya msingi ya kilibertaria hutegemea kanuni kwamba unakiuka haki za mali, si mahesabu ya ufanisi au ushindani.
