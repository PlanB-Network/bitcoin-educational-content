question: "Čo charakterizuje spodnú časť osi osobnej slobody na Nolanovom diagrame?"
answer: "Preferencia poriadku, bezpečnosti, tradičných hodnôt a toho, aby štát reguloval mravy a udržiaval verejný poriadok"
wrong_answers:
  - "Preferencia individuálnej autonómie, tolerancie a minimálnych štátnych zásahov do osobných životných volieb"
  - "Preferencia ekonomickej deregulácie, voľného obchodu a zrušenia ciel a dotácií"
  - "Preferencia prerozdeľovania bohatstva, vysokých daní a znárodňovania kľúčových odvetví"
explanation: >-
  Spodná časť osi osobnej slobody predstavuje maximálnu štátnu kontrolu nad osobným životom, charakterizovanú preferenciou poriadku, bezpečnosti a tradičných hodnôt. Štát reguluje mravy, udržiava verejný poriadok a môže obhajovať konkrétnu víziu morálky alebo tradície. Vrchol osi predstavuje opak: individuálnu slobodu a toleranciu. Ekonomické politiky sa merajú na samostatnej horizontálnej osi.
