question: "Warum beschreibt der Kurs Bitcoin als Marktwährung, die Staatsgeld entgegengesetzt ist, und nicht als rechtes oder linkes Projekt?"
answer: "Weil Bitcoin eine freiwillig angenommene, schwer zu produzierende, dezentrale Währung ist, die Wert bewahrt, im Gegensatz zu zwangsbewehrtem, zentralisiertem Fiatgeld, das Wert verliert, wodurch es bei der Spaltung um Markt gegen Staat statt um politische Ideologie geht"
wrong_answers:
  - "Weil Bitcoin von einem anonymen Entwickler geschaffen wurde, der bewusst vermied, politische Aussagen über seinen beabsichtigten Zweck oder seine Philosophie zu machen"
  - "Weil Bitcoins Mining-Algorithmus die gleiche Verteilung neuer Coins an alle politischen Parteien sicherstellt und so jede ideologische Voreingenommenheit im Geldsystem verhindert"
  - "Weil Bitcoin identisch mit bestehenden Fiatwährungen funktioniert, aber auf einem schnelleren Zahlungsnetzwerk läuft, wodurch politische Unterscheidungen irrelevant werden"
explanation: >-
  Bitcoin wird als friedliche Revolte gegen die Politisierung des Geldes beschrieben. Staatliches Geld oder Fiatgeld ist ein zwangsbewehrtes, zentralisiertes System, das dazu neigt, an Wert zu verlieren. Marktgeld, historisch Gold und heute Bitcoin, ist gesundes, schwer zu produzierendes Geld, das freiwillig entsteht und seinen Wert langfristig bewahrt. Der wirkliche Gegensatz ist nicht links gegen rechts, sondern Markt gegen Staat, wodurch Bitcoin zu einem politischen Bruch wird, der traditionelle ideologische Lager überschreitet.
reviewed: false
