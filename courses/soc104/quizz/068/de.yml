question: "Was ist die konservative Position zur Einwanderung?"
answer: "Der Staat hat das souveräne Recht, seine Grenzen zu kontrollieren, um nationale Sicherheit und kulturelle Identität zu schützen"
wrong_answers:
  - "Grenzen sollten bedingungslos offen sein, weil diskriminierende Beschränkungen Menschenrechte verletzen"
  - "Einwanderung sollte durch Marktnachfrage bestimmt werden, wobei Bürger vertraglich über ihre Beziehungen zu Ausländern entscheiden"
  - "Einwanderungspolitik sollte wirtschaftliche Bedürfnisse mit erfolgreicher Integration auf Grundlage von Expertenbewertung ausbalancieren"
explanation: >-
  Konservative vertreten die Auffassung, dass Ordnung, Identität und nationale Souveränität Vorrang vor der uneingeschränkten Aufnahme von Ausländern oder Flüchtlingen haben müssen. Grenzen und eine klar definierte Bevölkerung sind Teil zivilisierter Werte. Die falschen Antworten repräsentieren die sozialistische Position (offene Grenzen als Menschenrechte), die libertäre Position (marktbasierte Einwanderung) und die zentristische Position (ausgewogener, expertengeleiteter Ansatz).
reviewed: false
