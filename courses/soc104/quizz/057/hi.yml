question: "Centrism की cardinal values क्या हैं?"
answer: "Moderation, compromise, adaptation और public utility"
wrong_answers:
  - "Tradition, order, authority और national identity"
  - "Freedom, private property, consent और individual responsibility"
  - "Equality, social justice, solidarity और collective ownership"
explanation: >-
  Centrism की cardinal values moderation, compromise, adaptation और public utility हैं। ये ideological commitment के बजाय pragmatic balance पर centrist emphasis को reflect करती हैं। Other options क्रमशः conservatism, libertarianism और socialism की cardinal values describe करते हैं।
reviewed: false
