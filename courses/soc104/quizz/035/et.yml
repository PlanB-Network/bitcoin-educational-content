question: "Kuidas erinevad libertääride ja libertariaanide strateegiad riigi kaotamiseks?"
answer: "Libertäärid on ajalooliselt pooldanud vägivaldset hävitamist, samas kui libertariaanid püüavad riiki delegitimeerida hariduse ja kodanikuallumatuse kaudu"
wrong_answers:
  - "Libertäärid kasutavad riigi lammutamiseks demokraatlikke valimisi, samas kui libertariaanid soosivad relvastatud revolutsiooni ja otsest tegevust"
  - "Libertäärid keskenduvad alternatiivsete kogukondade rajamisele, samas kui libertariaanid tegutsevad olemasoleva poliitilise süsteemi sees reformide vastuvõtmiseks"
  - "Nii libertäärid kui ka libertariaanid nõustuvad, et rahumeelne protest on ainus õiguspärane ühiskondliku muutuse vahend"
explanation: >-
  Libertäärid on ajalooliselt pooldanud riigi ja kapitalismi hävitamist vägivalla, sealhulgas terrori ja sihitud rünnakute abil. Libertariaanid seevastu lükkavad agressiivse vägivalla ebaseaduspärasena tagasi. Nende strateegia toetub riigi delegitimeerimisele argumentatsiooni, arutelu, hariduse ja kodanikuallumatuse kaudu. Need põhimõtteliselt erinevad lähenemised muutusele peegeldavad nende sügavamaid filosoofilisi erimeelsusi.
