question: "Why does the two-dimensional model argue that most political issues can be divided into economic and personal categories?"
answer: "Because economic issues concern what you do as a producer and consumer, while personal issues concern your private relationships, beliefs, and bodily autonomy"
wrong_answers:
  - "Because all political debates ultimately reduce to disagreements about taxation levels and religious practices"
  - "Because governments historically only regulate two things: the marketplace and the military"
  - "Because political philosophers have always separated material concerns from spiritual concerns since antiquity"
explanation: >-
  The two-dimensional model is based on the idea that political issues divide into two broad categories. Economic freedoms cover production, consumption, trade, employment, and money management. Personal freedoms cover private relationships, opinions, beliefs, and choices about your own body and mind. This separation allows for a far more nuanced mapping of political positions than a single left-right axis.
