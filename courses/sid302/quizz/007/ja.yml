question: ElementsとLiquid Networkはどのような関係にありますか？
answer: Liquidは、本番運用向けに設定されたElementsサイドチェーンの特定のインスタンスである
wrong_answers:
  - Elementsは、テスト用に設定されたLiquid Networkの特定のインスタンスである
  - LiquidとElementsは、コードベースの異なる2つの競合するブロックチェーン・プラットフォームである
  - "Elementsは、Liquid Networkのブロック検証を担うコンセンサスメカニズムである"
explanation: |
  Elementsはオープンソースのブロックチェーン・プラットフォームのソフトウェアで、Liquidは、フェデレーテッド・コンセンサスモデルで本番運用できるように設定された、Elementsサイドチェーンの特定の実装、つまり「インスタンス」です。Elementsが土台となる技術フレームワークで、Liquidはそのフレームワークで構築された1つのネットワークだと考えるとわかりやすいでしょう。Bitcoin CoreがBitcoinネットワークを動かすソフトウェアであるのと同じように、ElementsはLiquidやその他のカスタムサイドチェーンを動かすソフトウェアエンジンです。