question: În ce formă literară i-a atacat abatele Galiani pe fiziocrați și teza lor privind libertatea comerțului cu cereale?
answer: Dialog
wrong_answers:
  - Romanul
  - Poezia
  - Eseul
explanation: |
  Galiani i-a criticat pe fiziocrați în lucrarea sa „Dialogues sur le commerce des blés”, o operă scrisă sub formă de dialoguri între diferite personaje.
