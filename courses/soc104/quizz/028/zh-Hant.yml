question: "Friedrich Hayek 所描述的「自發秩序」概念是什麼？"
answer: "社會規則與規範應從自由的個人互動中浮現，而不是由威權式規劃強加"
wrong_answers:
  - "除非國家介入以維持競爭平衡，否則市場自然會趨向壟斷"
  - "民主選舉是確立治理社會之法律的唯一正當機制"
  - "經濟危機會自發出現，並需要政府立即干預以恢復穩定"
explanation: >-
  Hayek 的自發秩序概念主張，治理社會的規則不應由中央規劃自上而下強加，而應從個人意志、契約與自願關係的自由運作中浮現。這是自由意志主義思想的一條根本軸線。它並不意味市場會趨向壟斷，也不意味危機需要政府干預。
reviewed: false
