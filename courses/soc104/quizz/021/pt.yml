question: "O que é conservadorismo político?"
answer: "Uma ideologia que visa preservar instituições políticas estabelecidas e a ordem social, opondo-se a grandes rupturas estruturais"
wrong_answers:
  - "Um compromisso pessoal com valores familiares tradicionais e práticas religiosas sem buscar impô-los aos outros"
  - "Uma filosofia que promove mudanças sociais rápidas por meio de reformas democráticas e legislação progressista"
  - "Uma teoria econômica que defende mercados livres, tributação mínima e a abolição de barreiras comerciais"
explanation: >-
  O conservadorismo político é uma ideologia, muitas vezes representada em partidos de direita ou de extrema direita, que visa preservar instituições políticas estabelecidas e a ordem social enquanto se opõe a grandes rupturas estruturais. Seus defensores desejam usar o poder e a lei para proteger sua herança. Isso difere do conservadorismo cultural, que é uma escolha de vida pessoal, e não um programa político.
