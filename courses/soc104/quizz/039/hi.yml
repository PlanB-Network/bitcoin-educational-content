question: "Milton Friedman ने राजनीतिक नीतियों का मूल्यांकन करने के बारे में क्या चेतावनी दी?"
answer: "नीतियों का आकलन उनके इरादों के बजाय उनके परिणामों से किया जाना चाहिए"
wrong_answers:
  - "नीतियों का आकलन उन्हें प्रस्तावित करने वाले राजनेताओं के नैतिक चरित्र से किया जाना चाहिए"
  - "नीतियों का आकलन इस आधार पर किया जाना चाहिए कि वे सामान्य मतदाता जनता में कितनी लोकप्रिय हैं"
  - "नीतियों का आकलन इस आधार पर किया जाना चाहिए कि वे देश के मूल संविधान के अनुरूप हैं या नहीं"
explanation: >-
  Friedman ने लिखा कि सबसे बड़ी गलतियों में से एक है नीतियों का मूल्यांकन उनके परिणामों के बजाय उनके इरादों से करना, और यह नोट किया कि गरीबों के लिए कहे जाने वाले कार्यक्रम लगभग हमेशा अपने प्रायोजकों के इरादों के विपरीत प्रभाव पैदा करते हैं। यह Bastiat की शिक्षा को दोहराता है कि एक अच्छा अर्थशास्त्री पूरी आबादी पर अल्पकालिक और दीर्घकालिक दोनों प्रभावों पर विचार करता है।
reviewed: false
