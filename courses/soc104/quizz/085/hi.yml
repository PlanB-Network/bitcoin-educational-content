question: "निम्नलिखित में से कौन सा Hayek द्वारा वर्णित स्वस्फूर्त व्यवस्था का उदाहरण है?"
answer: "भाषा, जो किसी दफ़्तर में बुद्धिजीवियों द्वारा डिज़ाइन किए जाने के बजाय ऐतिहासिक अंतःक्रियाओं के माध्यम से जैविक रूप से विकसित हुई"
wrong_answers:
  - "एक राष्ट्रीय संविधान, जिसे सामाजिक नियम स्थापित करने के लिए निर्वाचित प्रतिनिधियों ने सावधानीपूर्वक मसौदा तैयार किया"
  - "एक सरकारी प्रोत्साहन योजना, जिसे आर्थिक गतिविधि का समन्वय करने के लिए अर्थशास्त्रियों ने डिज़ाइन किया"
  - "एक सार्वजनिक शिक्षा प्रणाली, जिसे ज्ञान तक सार्वभौमिक पहुँच सुनिश्चित करने के लिए विधायकों ने बनाया"
explanation: >-
  Hayek स्वस्फूर्त व्यवस्था को समाज में स्वतंत्र अंतःक्रियाओं के उत्पाद के रूप में वर्णित करते हैं, जो मानव कार्रवाई से उत्पन्न होता है लेकिन जानबूझकर किए गए मानव डिज़ाइन से नहीं। भाषा इसका प्रमुख उदाहरण है: फ्रेंच, अंग्रेज़ी और जर्मन को बुद्धिजीवियों ने व्याकरण नियम तय करके निर्मित नहीं किया, बल्कि वे ऐतिहासिक अंतःक्रियाओं के माध्यम से बने धीमे, जैविक संगठन के फल के रूप में उभरीं।
reviewed: false
