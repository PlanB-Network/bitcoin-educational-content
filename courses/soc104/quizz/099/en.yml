question: "What does the cypherpunk principle 'Cypherpunks write code' reveal about the movement's approach to achieving freedom?"
answer: "That the path to freedom passes through actively building anonymous systems using code as the fundamental tool for transforming abstract ideas of freedom into reality"
wrong_answers:
  - "That cypherpunks are primarily software developers who write commercial applications to fund their political activism campaigns"
  - "That the movement believes in educating the public through written manifestos and academic publications rather than direct action"
  - "That cypherpunks focus on hacking existing government systems to expose surveillance programs and force legislative reform"
explanation: >-
  The formula "Cypherpunks write code" reflects the movement's commitment to active intervention rather than mere hope. For Eric Hughes, the path to freedom passes through the active construction of anonymous systems that render arbitrary political divisions irrelevant. Code becomes the fundamental tool for transforming abstract ideas of freedom into reality, which is why Satoshi Nakamoto wrote the entire Bitcoin code before even writing the white paper.
reviewed: false
