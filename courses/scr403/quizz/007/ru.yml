question: Как определяется булев тип (𝟚) в Simplicity?
answer: Как суммарный тип 𝟙 + 𝟙, содержащий ровно два значения (ложь и истина).
wrong_answers:
  - Как тип произведения 𝟙 × 𝟙, который в этом случае содержал бы только одно значение.
  - Как специальный примитивный тип, встроенный непосредственно в язык.
  - Как 32-битный целочисленный тип, ограниченный только значениями 0 и 1.
explanation: >-
  Булев тип 𝟚 определяется как 𝟙 + 𝟙, сумма двух единичных типов.
  Значение с левой меткой σᴸ⟨⟩ представляет ложь (0), а значение с правой
  меткой σᴿ⟨⟩ представляет истину (1). Это однобитный тип данных,
  построенный только из единичного типа и конструктора суммы — конструктор
  произведения здесь не нужен.
reviewed: false
