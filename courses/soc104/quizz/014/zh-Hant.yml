question: "Nolan diagram 上個人自由軸的底部有什麼特徵？"
answer: "偏好秩序、安全、傳統價值，以及國家規範道德並維持公共秩序"
wrong_answers:
  - "偏好個人自主、寬容，以及國家對個人生活選擇的最小干預"
  - "偏好經濟解除管制、自由貿易，以及廢除關稅與補貼"
  - "偏好財富重新分配、高稅收，以及關鍵產業國有化"
explanation: >-
  個人自由軸的底部代表國家對個人生活的最大控制，其特徵是偏好秩序、安全與傳統價值。國家規範道德、維持公共秩序，並可能捍衛某種特定的道德或傳統願景。軸的頂端代表相反面：個人自由與寬容。經濟政策則由獨立的橫軸衡量。
reviewed: false
