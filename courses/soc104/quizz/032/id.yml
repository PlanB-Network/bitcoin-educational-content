question: "Bagaimana libertarian memandang hubungan antara kepemilikan pribadi dan kebebasan?"
answer: "Kepemilikan pribadi adalah hak alamiah yang mendahului hukum dan negara, serta merupakan fondasi kebebasan itu sendiri"
wrong_answers:
  - "Kepemilikan pribadi adalah konvensi sosial yang diciptakan oleh negara dan dapat dicabut ketika menyebabkan ketimpangan"
  - "Kepemilikan pribadi berguna untuk efisiensi ekonomi tetapi tidak memiliki signifikansi moral atau filosofis yang melekat"
  - "Kepemilikan pribadi seharusnya hanya ada untuk barang milik pribadi, bukan untuk aset produktif atau tanah"
explanation: >-
  Libertarian membela kepemilikan pribadi sebagai hak alamiah yang mendahului hukum dan negara. Mereka berargumen bahwa jika seorang individu memiliki tubuhnya sendiri, ia juga memiliki kerja dan buah dari kerjanya. Kepemilikan atas barang material adalah perpanjangan dari kepemilikan diri. Ini sangat kontras dengan pandangan libertaire bahwa kepemilikan adalah konvensi sosial atau sumber penindasan.
