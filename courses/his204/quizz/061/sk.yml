question: Prečo bolo uplatňovanie fyziokratických myšlienok v Nemecku nakoniec prerušené?
answer: Existujúci úradníci sa zdráhali
wrong_answers:
  - Obyvateľstvo nebolo veľmi naklonené
  - Bádenský markgróf, pôvodne stúpenec fyziokracie, nakoniec svoju podporu odvolal
  - Podnebie nebolo priaznivé pre poľnohospodárstvo
explanation: |
  Odpor doterajších úradníkov, ktorí lipli na svojich výsadách a zvykoch, zabránil uplatneniu fyziokratických myšlienok v Nemecku. Obávali sa, že navrhované reformy spochybnia ich moc a vplyv.
