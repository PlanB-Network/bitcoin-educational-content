question: Simplicity excludes unbounded recursion. What is its intended substitute for unbounded iteration?
answer: Recursive covenants that spread the computation across multiple transactions, keeping each transaction's cost predictable.
wrong_answers:
  - The delegation feature, purpose-built to give a metered form of unbounded recursion inside a single transaction.
  - The nine core combinators, whose completeness lets a fixed-point construction encode any recursive function.
  - Compile-time loop unrolling, where static analysis infers the maximum iteration count and duplicates the body.
explanation: >-
  The article's thesis is that unbounded iteration is better implemented
  as recursive covenants computing over multiple transactions, which
  avoids block-space and standardness constraints and makes transaction
  costs predictable. Delegation can only be abused to produce something
  resembling unbounded recursion — it is not the intended mechanism — and
  the nine core combinators are complete only for finite computations, so
  no fixed-point construction exists within a single program.
