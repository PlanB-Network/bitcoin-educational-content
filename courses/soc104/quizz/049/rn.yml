question: "Conservatism ifata gute imwidegemvyo mu nzego z'ubutunzi n'iz'imibano?"
answer: "Imwidegemvyo ikomeye mu rwego rw'ubutunzi ariko imwidegemvyo nke mu rwego rw'imibano"
wrong_answers:
  - "Imwidegemvyo mike muri izo nzego zompi z'ubutunzi n'imibano kugira ngo hagumane urutonde rw'imibano rushingiye ku migenzo"
  - "Imwidegemvyo ikomeye mu rwego rw'imibano ariko imwidegemvyo mike mu rwego rw'ubutunzi"
  - "Imwidegemvyo ingana kandi itagira akarimbi muri izo nzego zompi, Leta ikivanga ku rugero ruto cane mu buryo bwose"
explanation: >-
  Conservatism igaragaza ukwicamwo kubiri kumeze nk'ishusho ihushanye na socialism. Mu rwego rw'ubutunzi, conservatives barwanira isoko ryigenga, kwihangira imirimo, n'uburenganzira ku mutungo bwite. Mu rwego rw'imibano, amabwirizwa abuza arashingirwa intahe n'ukuzigama ingingo z'inyifato runtu za kera n'ugutekana kw'imibano. Inyishu ya gatatu itari yo idondora uburyo bwa socialism, ari bwo buhushanye n'ivyo.
