question: "In che modo il Green New Deal rappresenta un'evoluzione contemporanea del socialismo democratico?"
answer: "Usa le preoccupazioni ambientali come una nuova giustificazione per l'intervento statale e la confisca del reddito privato, subordinando l'interesse individuale alla salute planetaria collettiva"
wrong_answers:
  - "Abbandona completamente l'economia socialista tradizionale a favore di soluzioni di libero mercato ai problemi ambientali tramite lo scambio di quote di carbonio"
  - "Rifiuta l'intervento statale e si affida invece all'azione individuale volontaria e all'innovazione del settore privato per affrontare il cambiamento climatico"
  - "Rappresenta una rottura con il socialismo dando priorità alla protezione ambientale rispetto a tutte le questioni di giustizia sociale e occupazione"
explanation: >-
  Il Green New Deal fonde le preoccupazioni ambientali con obiettivi sociali, combinando transizione ecologica con giustizia sociale, garanzie occupazionali e servizi pubblici rafforzati. L'interesse individuale è subordinato all'interesse collettivo definito dalla salute planetaria. Al suo nucleo, fornisce un nuovo involucro retorico che giustifica l'intervento statale e la confisca del reddito privato, non più soltanto in nome della giustizia sociale ma anche in nome dell'ambiente.
reviewed: false
