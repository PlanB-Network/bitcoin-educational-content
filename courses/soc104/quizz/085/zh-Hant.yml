question: "為什麼 Molinari 1849 年關於自由與政治權力關係的預測證明具有預言性？"
answer: "因為保守主義者與社會主義者輪流掌權，並把自由工具化，用來服務各自的政治目標，正如他所描述的那樣"
wrong_answers:
  - "因為他所描述的經濟學家角色最終取得政治權力，並在歐洲各地實行自由至上主義政策"
  - "因為他預測三個政治家族會合併為單一中間派運動，而這在二十世紀成真"
  - "因為自由由歷屆政府逐步擴大，直到成為現代民主的首要組織原則"
explanation: >-
  Molinari 的願景證明具有預言性，因為自十九世紀中葉以來，保守主義者與社會主義者輪流掌權，並精確執行了他所描述的事：為政治目標服務而工具化自由。兩個家族都願意限制自由，並要求國家強加各自的議程，而經濟學家無條件自由的立場則仍被邊緣化。
reviewed: false
