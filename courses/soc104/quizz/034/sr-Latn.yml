question: "Na šta se usredsređuje strukturna definicija političkog sistema?"
answer: "Na to kako sistem zaista funkcioniše i na njegove uočljive karakteristike, kao što je stepen državne kontrole"
wrong_answers:
  - "Na deklarisane ciljeve i plemenite namere koje objavljuju osnivači i lideri sistema"
  - "Na istorijsko poreklo političkog pokreta i biografije njegovih ključnih mislilaca"
  - "Na broj dozvoljenih političkih stranaka i učestalost održavanja demokratskih izbora"
explanation: >-
  Strukturne definicije usredsređuju se na to kako politički sistemi zaista funkcionišu i na njihove uočljive karakteristike. Na primer, socijalizam strukturno karakteriše sveprisutnost države. Ovaj pristup je u kontrastu s intencionalnim definicijama, koje se oslanjaju na deklarisane motivacije i ciljeve. Strukturni pristup omogućava objektivniju procenu zasnovanu na merljivim rezultatima.
