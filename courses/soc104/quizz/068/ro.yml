question: "De ce poziția libertariană privind legalizarea drogurilor vine cu condiția ca rolul statului în societate să fie redus?"
answer: "Deoarece liberalizarea preluată de stat ar înlocui responsabilitatea individuală cu îngrijire administrată de guvern, în timp ce libertarienii vor ca cetățenii să suporte consecințele alegerilor lor, cu sprijin din partea asociațiilor private"
wrong_answers:
  - "Deoarece legalizarea controlată de stat ar genera prea multe venituri fiscale, făcând guvernul excesiv de puternic și corupt"
  - "Deoarece statul ar impune standarde de calitate care ar crește prețurile și ar recrea piețele negre"
  - "Deoarece reglementarea guvernamentală a drogurilor ar încălca acordurile comerciale internaționale și relațiile diplomatice"
explanation: >-
  Libertarienii susțin liberalizarea drogurilor, dar insistă ca rolul statului să fie redus, deoarece scopul lor este restaurarea responsabilității individuale, nu extinderea administrării de stat. Dacă cineva devine dependent, trebuie să își asume responsabilitatea în loc să ceară statului să ofere îngrijire. Soluția pentru dependență stă în inițiativa privată: sprijin voluntar din partea indivizilor, familiilor și asociațiilor caritabile. Legalizarea administrată de stat ar contrazice principiul libertarian fundamental al responsabilității personale.
reviewed: false
