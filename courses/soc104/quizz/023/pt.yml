question: "O que é paleo-libertarianismo?"
answer: "Uma síntese que combina a rejeição do Estado como fonte de coerção com o reforço de instituições tradicionais e estruturas sociais voluntárias"
wrong_answers:
  - "Um movimento libertário que rejeita todos os valores tradicionais e promove um progressismo social radical"
  - "Uma ideologia conservadora que usa o poder do Estado para impor valores tradicionais enquanto permite alguma liberdade econômica"
  - "Uma filosofia centrista que busca um compromisso equilibrado entre economia socialista e política social conservadora"
explanation: >-
  O paleo-libertarianismo combina a rejeição do Estado como fonte institucional de coerção com o reforço de instituições tradicionais e uma preferência por estruturas sociais voluntárias em vez da autoridade estatal. Ele se distingue do neo-libertarianismo por ser mais simpático aos valores tradicionais. O paleo-libertário não se opõe a comunidades que se organizem em torno de princípios socialistas ou comunitários; ele apenas recusa que tais comunidades imponham seus valores a todos pela força da lei.
