question: "Jaki fundamentalny podział oddzielił socjalistów od początku XX wieku?"
answer: "Socjaliści rewolucyjni dążący do przejęcia władzy przez przemoc kontra socjaliści reformistyczni dążący do zmiany przez demokratyczne wybory"
wrong_answers:
  - "Socjaliści miejscy skupiający się na robotnikach przemysłowych kontra socjaliści wiejscy organizujący komuny rolnicze"
  - "Socjaliści nacjonalistyczni priorytetowo traktujący własny kraj kontra socjaliści internacjonalistyczni opowiadający się za globalną rewolucją"
  - "Socjaliści intelektualni piszący teksty teoretyczne kontra socjaliści aktywistyczni organizujący strajki pracownicze"
explanation: >-
  Od początku XX wieku fundamentalny podział oddzielił socjalistów rewolucyjnych, którzy sprzeciwiali się prawom własności i dążyli do zniszczenia społeczeństwa kapitalistycznego poprzez przemoc albo dyktaturę proletariatu, od socjalistów reformistycznych, którzy dążyli do sprawiedliwości społecznej przez demokratyczne wybory i opodatkowanie, tymczasowo akceptując kapitalizm. Ten rozłam ukształtował całą późniejszą historię ruchów socjalistycznych.
reviewed: false
