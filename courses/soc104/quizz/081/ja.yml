question: "共有された政治的確信としての構成主義とは何か？"
answer: "中央政府が法律の力によって、最大多数にとって善い社会秩序を作り出せるという信念"
wrong_answers:
  - "社会は国家の干渉なしに個人間の自発的協力を通じて組織されるべきだという信念"
  - "自由市場だけが社会における資源の最適配分を決定できるという信念"
  - "政治的権威は直接民主制を通じてすべての市民に平等に分配されるべきだという信念"
explanation: >-
  構成主義は、中道主義者、保守主義者、社会主義者を、共有された確信、すなわち市場プロセスに対する政治プロセスの優位性のもとに結びつける。それは、中央政府が法律の力によって、最大多数にとって善い社会秩序を作り出せるという信念である。これは、自発的相互作用から生じる自生的秩序を擁護するリバタリアンの立場と正面から対立する。
reviewed: false
