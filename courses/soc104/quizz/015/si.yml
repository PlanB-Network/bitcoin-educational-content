question: "පුද්ගලික නිදහස කාණ්ඩයට ඇතුළත් වන්නේ කුමක්ද?"
answer: "ඔබ ඔබේ පුද්ගලික සබඳතා තුළ, ඔබේ මත හා විශ්වාස සමඟ, සහ ඔබේම ශරීරය හා මනස සම්බන්ධ සියල්ලෙහි කරන දේ"
wrong_answers:
  - "ව්‍යාපාරයක් ආරම්භ කිරීම, සේවකයන් බඳවා ගැනීම, සහ භාණ්ඩ වෙළඳාම් කිරීම ඇතුළුව, ඔබ නිෂ්පාදකයෙකු ලෙස කරන දේ"
  - "ඔබ කොපමණ බදු ගෙවන්නේද, ඔබ කරන ආයෝජන මොනවාද, සහ ඔබේ මූල්‍ය වත්කම් කළමනාකරණය කරන ආකාරය"
  - "වෙළඳපොළ තුළ තරඟ කිරීමේ, ඔබේ නිෂ්පාදන සඳහා මිල නියම කිරීමේ, සහ ඔබේ සැපයුම්කරුවන් තෝරාගැනීමේ ඔබේ හැකියාව"
explanation: >-
  පුද්ගලික නිදහස ඔබ ඔබේ පුද්ගලික සබඳතා තුළ, ඔබේ මත හා විශ්වාස සමඟ, සහ ඔබේම ශරීරය හා මනස සම්බන්ධ සියල්ලෙහි කරන දේ අන්තර්ගත කරයි. මෙයට විවාහය, කියවීම් තේරීම්, ආගමික පුරුදු, ආහාර සහ ඖෂධ තේරීම්, සහ ඔබ සම්බන්ධ වන අය ඇතුළත් වේ. ව්‍යාපාරික ක්‍රියාකාරකම්, බදු, සහ වෙළඳපොළ තීරණ ආර්ථික නිදහස යටතට අයත් වේ.
reviewed: false
