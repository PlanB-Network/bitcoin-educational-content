question: "What was expected of citizens in Athenian democracy that is not expected today?"
answer: "Active, informed, direct participation in public life \u2014 a duty, not just a right."
wrong_answers:
  - "Paying a poll tax to vote."
  - "Serving in the priesthood."
  - "Owning at least two slaves."
explanation: |
  Athenian citizens deliberated and voted directly on the square and were expected to be informed and to prioritize the public good. Today we delegate being informed to representatives — a convenience with consequences.
reviewed: false
