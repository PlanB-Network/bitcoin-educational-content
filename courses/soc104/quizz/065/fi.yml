question: "Mikä on libertaarinen kanta kysymykseen samaa sukupuolta olevien avioliitosta?"
answer: "Valtiolla ei ole tehtävää määritellä avioliittoa; se tulisi yksityistää ja jättää yksilöille, yhdistyksille ja uskonnollisille instituutioille"
wrong_answers:
  - "Samaa sukupuolta olevien avioliitto tulisi laillistaa, koska kaikki kansalaiset ansaitsevat yhdenvertaisen kohtelun lain edessä"
  - "Samaa sukupuolta olevien avioliitto tulisi kieltää, koska perinteinen avioliitto on lisääntymisen perustava instituutio"
  - "Samaa sukupuolta olevien avioliitto tulisi laillistaa, mutta vain erillisen, perinteisestä avioliitosta poikkeavan oikeudellisen kehyksen kautta"
explanation: >-
  Libertaarit väittävät, että avioliittokysymys on perustavasti väärin asetettu, koska se esitetään valtiokeskeisin termein. Heidän mukaansa valtiolla ei ole asiaa puuttua yksityiselämään, joten ratkaisu on erottaa avioliitto kokonaan valtiosta. Asettamalla yhden ainoan määritelmän valtio luo konflikteja. Ensimmäinen väärä vastaus heijastaa sosialistista tai keskustalaista kantaa, ja toinen heijastaa konservatiivista kantaa.
