question: "تفاوت کلیدی میان مینارشیست‌ها و آنارکو-کاپیتالیست‌ها درون لیبرتارینیسم چیست؟"
answer: "مینارشیست‌ها یک دولت حداقلی را برای دفاع، عدالت، و پلیس می‌پذیرند، در حالی که آنارکو-کاپیتالیست‌ها می‌خواهند همه کارکردهای دولت خصوصی‌سازی شود"
wrong_answers:
  - "مینارشیست‌ها همه اشکال حکومت را رد می‌کنند، در حالی که آنارکو-کاپیتالیست‌ها تنظیم‌گری محدود دولت بر بازارها را می‌پذیرند"
  - "مینارشیست‌ها مالیات‌ستانی تصاعدی را برای خدمات ضروری ترجیح می‌دهند، در حالی که آنارکو-کاپیتالیست‌ها با همه مالیات‌ها مخالف‌اند"
  - "مینارشیست‌ها فقط بر آزادی اقتصادی تمرکز می‌کنند، در حالی که آنارکو-کاپیتالیست‌ها هم از آزادی‌های اقتصادی و هم از آزادی‌های اجتماعی دفاع می‌کنند"
explanation: >-
  مینارشیست‌ها معتقدند دولت باید به کارکردهای اصلی مانند دفاع، عدالت، و پلیس محدود شود («دولت نگهبان شب»)، در حالی که آنارکو-کاپیتالیست‌ها استدلال می‌کنند که حتی این کارکردها نیز باید خصوصی‌سازی شوند و از طریق رقابت داوطلبانه بازار اداره شوند. اختلاف آنان بیش از آن‌که درباره اصول اخلاقی بنیادین باشد، درباره اجرای عملی است. هر دو گرایش ارزش‌های لیبرتارینِ خودمالکیتی و عدم تجاوز را مشترکاً دارند.
reviewed: false
