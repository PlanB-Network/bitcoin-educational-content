question: "बाएँ-दाएँ राजनीतिक विभाजन की उत्पत्ति कहाँ से हुई?"
answer: "1789 की फ्रांसीसी क्रांति की बहसों के दौरान बैठने की व्यवस्था से"
wrong_answers:
  - "उन्नीसवीं सदी में Karl Marx और Adam Smith के लेखन से"
  - "उत्तरी और दक्षिणी राज्यों के बीच अमेरिकी गृहयुद्ध से"
  - "उन Enlightenment दार्शनिकों से जिन्होंने तर्क को परंपरा से अलग किया"
explanation: >-
  बाएँ-दाएँ विभाजन 1789 से शुरू हुआ, जब फ्रांसीसी National Assembly में वे प्रतिनिधि जो राजा की शक्ति बनाए रखने के पक्ष में थे, अध्यक्ष के दाईं ओर बैठे, जबकि जो उसकी शक्तियों को सीमित करना चाहते थे, वे बाईं ओर बैठे। इसकी उत्पत्ति Marx और Smith, अमेरिकी गृहयुद्ध, या Enlightenment दर्शन से नहीं हुई।
reviewed: false
