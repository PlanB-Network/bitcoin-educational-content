question: "이 강의는 전통적 좌-우-중도 스펙트럼을 넘어 실제 정치적 구분을 무엇으로 식별하나요?"
answer: "근본적 철학 원칙들 사이의 구분입니다: 자유냐 강제냐, 자발적 동의냐 강요냐, 책임 있는 개인이냐 집단이냐입니다"
wrong_answers:
  - "국제 무역 협정과 세계 금융기관의 통제를 둘러싼 부유한 국가와 가난한 국가 사이의 구분입니다"
  - "정부 지출 우선순위와 인프라 투자를 둘러싼 도시 인구와 농촌 인구 사이의 구분입니다"
  - "사회 규범, 가족 가치, 종교 교육을 둘러싼 진보적 문화와 전통적 문화 사이의 구분입니다"
explanation: >-
  이 강의는 실제 정치적 구분이 전통적 좌-우-중도 라벨이 아니라 근본적 철학 원칙들에 있다고 주장합니다: 자유냐 강제냐, 자발적 동의냐 강요냐, 책임 있는 개인이냐 집단이냐입니다. 정치를 생각하는 올바른 방법은 라벨이 아니라 윤리 원칙에서 시작하는 것입니다.
reviewed: false
