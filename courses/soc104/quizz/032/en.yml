question: "How do libertarians view the relationship between private property and freedom?"
answer: "Private property is a natural right that precedes the law and the state, and is the very foundation of freedom"
wrong_answers:
  - "Private property is a social convention created by the state that can be revoked when it causes inequality"
  - "Private property is useful for economic efficiency but has no inherent moral or philosophical significance"
  - "Private property should exist only for personal possessions, not for productive assets or land"
explanation: >-
  Libertarians defend private property as a natural right that precedes law and the state. They argue that if an individual owns their own body, they also own their labor and its fruits. Ownership of material goods is an extension of self-ownership. This contrasts sharply with the libertaire view that property is a social convention or a source of oppression.
