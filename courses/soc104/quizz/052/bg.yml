question: "Какво гласи принципът на неагресия?"
answer: "Човек е свободен да действа както желае, доколкото не се извършва насилие срещу живота, свободата или собствеността на друг"
wrong_answers:
  - "Държавата има единственото право да използва сила, за да поддържа социалния ред"
  - "Гражданите трябва да се подчиняват на управлението на мнозинството дори когато то ограничава индивидуалните свободи"
  - "Свободата на действие е позволена само когато е от полза за колективното благо на обществото"
explanation: >-
  Принципът на неагресия е крайъгълен камък на либертарианската политика, заявявайки, че индивидите могат да действат свободно, при условие че не извършват насилие срещу живота, свободата или собствеността на други. Той напомня златното правило, откривано във всички цивилизации. За разлика от другите варианти, той не дава на държавата специална морална власт и не подчинява индивидуалните права на колективната полза.
reviewed: false
