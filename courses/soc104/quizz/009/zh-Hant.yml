question: "綠黨在 Nolan diagram 上位於哪裡，為什麼？"
answer: "圖表上非常低的位置，因為他們認為個人利益不得優先於地球的集體利益"
wrong_answers:
  - "圖表頂端，因為他們同等重視個人自由與環境意識"
  - "圖表中央，因為他們平衡經濟成長與環境保護"
  - "最右側，因為他們支持以市場為基礎的環境挑戰解決方案"
explanation: >-
  綠黨在 Nolan diagram 上位於非常低的位置，因為他們以地球福祉之名，偏好國家對經濟與個人決策都實施強力控制。他們以人與自然之間的鬥爭取代了馬克思主義的階級鬥爭，並傾向於捍衛經濟控制，甚至廢除私有財產。這使他們位於威權區域，而不是頂端或中央。
