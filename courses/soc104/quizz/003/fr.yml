question: "Pourquoi l'axe gauche-droite est-il considéré comme inadéquat pour situer des penseurs libéraux classiques comme Bastiat ou Ron Paul ?"
answer: "Parce que le libéralisme classique valorise à la fois les libertés économiques et personnelles, que ni la gauche ni la droite n'embrassent pleinement"
wrong_answers:
  - "Parce que les libéraux classiques s'alignent toujours sur les politiques économiques de droite et rejettent toutes les positions de gauche"
  - "Parce que les libéraux classiques sont des centristes qui adoptent des versions modérées des idéologies de gauche et de droite"
  - "Parce que les libéraux classiques s'opposent à toutes les formes de gouvernement, ce qui en fait des anarchistes plutôt que des penseurs politiques"
explanation: >-
  L'axe gauche-droite échoue à situer les libéraux classiques parce qu'il ne peut pas accueillir une position qui défend simultanément la liberté économique (typiquement à droite) et la liberté personnelle (typiquement à gauche). Les libéraux classiques ne sont pas des centristes en quête de compromis, pas plus qu'ils ne sont anarchistes ou purement de droite. Ils ne rentrent tout simplement pas dans un spectre unidimensionnel.
reviewed: false
