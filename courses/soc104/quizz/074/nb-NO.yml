question: "Hva er begrepet «moral hazard» i sammenheng med debatten om subsidier, og hvilken politisk familie reiser denne bekymringen?"
answer: "Moral hazard er insentivet til uansvarlighet når selskaper hindres i å gå konkurs gjennom subsidier, fordi skattebetaleren til slutt betaler; denne bekymringen reises av libertarianere"
wrong_answers:
  - "Moral hazard er risikoen for at subsidierte selskaper vil flytte til land med lavere skatter og ta arbeidsplasser med seg; denne bekymringen reises av konservative"
  - "Moral hazard er faren for at offentlige tjenestemenn blir korrupte ved å velge hvilke selskaper som får subsidier; denne bekymringen reises av sentrister"
  - "Moral hazard er det etiske problemet med selskaper som utnytter arbeidere etter å ha mottatt offentlige midler; denne bekymringen reises av sosialister"
explanation: >-
  Libertarianere hevder at subsidier og redningspakker skaper moral hazard: når selskaper hindres i å gå konkurs, gir det insentiv til uansvarlighet og hensynsløshet fordi dårlige beslutninger ikke får konsekvenser. Til slutt er det skattebetaleren som betaler, noe libertarianere anser som dypt urettferdig. Dette begrepet er forskjellig fra bekymringer om selskapsflytting, offentlig korrupsjon eller utnyttelse av arbeidere som reises av andre politiske familier.
reviewed: false
