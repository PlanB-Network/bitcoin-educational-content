question: "Почему тоталитарные режимы описывали как 'светские религии', и что это раскрывает об условиях, необходимых для существования тоталитаризма?"
answer: "Они требуют от активистов квазирелигиозной веры и используют страх против противников, а тоталитаризм требует одновременного наличия всех характеристик: подавленных свобод, однопартийного правления, насильственной революции и управляемой экономики"
wrong_answers:
  - "Они заменяют традиционное поклонение государственными церемониями, а тоталитаризм требует только харизматического лидера и военного контроля"
  - "Они используют религиозные институты для навязывания государственной идеологии, а тоталитаризм может возникнуть всякий раз, когда одна политическая партия доминирует в парламенте"
  - "Они обещают духовное спасение через политическое действие, а тоталитаризм существует всякий раз, когда государство контролирует экономику, независимо от политических свобод"
explanation: >-
  Раймон Арон отмечал, что тоталитарные режимы функционируют на двух принципах: вере активистов и страхе противников. Этот квазирелигиозный фанатизм характеризует их поверх различий в мотивах, за что они и получили название светских религий. Критически важно, что тоталитаризм требует одновременного наличия всех определяющих характеристик: подавленных свобод, неограниченной власти через единственную партию, насильственной революции и управляемой экономики. Современные демократии могут проявлять некоторые из этих черт, но тоталитаризм существует только тогда, когда все они собраны вместе.
