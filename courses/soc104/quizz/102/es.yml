question: "¿Qué creen los libertarios sobre la capacidad de los individuos para tomar decisiones?"
answer: "Los individuos tienen tanto el derecho como la responsabilidad de tomar sus propias decisiones sobre sus vidas"
wrong_answers:
  - "Los individuos deberían tomar decisiones solo después de consultar con representantes electos que comprendan las implicaciones de las políticas públicas"
  - "Los individuos son generalmente incapaces de tomar buenas decisiones y necesitan orientación experta de instituciones gubernamentales"
  - "Los individuos deberían tomar decisiones económicas libremente, pero deferir al Estado en todos los asuntos sociales y culturales"
explanation: >-
  Desde un punto de vista libertario, los individuos tienen tanto el derecho como la responsabilidad de tomar sus propias decisiones. Esto contrasta con las familias políticas convencionales de izquierda a derecha, que creen que el gobierno debería tomar algunas o muchas de las decisiones importantes en la vida de un individuo y en la vida económica en general.
