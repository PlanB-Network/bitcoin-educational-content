question: جمع‌کنندهٔ کامل را روی ⟨⟨1,1⟩,1⟩ (1+1+1) ردگیری کنید. مرحلهٔ دوم، O O H ▵ (O I H ▵ I H ⨾ half-adder)، چه مقداری را به مرحلهٔ نهایی می‌دهد؟
answer: ⟨1, ⟨0, 1⟩⟩ — نقلیِ نیم‌جمع‌کنندهٔ نخست، سپس نقلی و جمعِ نیم‌جمع‌کنندهٔ دوم.
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ — نقلیِ نیم‌جمع‌کنندهٔ نخست، سپس جمع و نقلیِ دومی.
  - ⟨0, ⟨0, 1⟩⟩ — بیت جمعِ نیم‌جمع‌کنندهٔ نخست، سپس نقلی و جمعِ دومی.
  - ⟨1, ⟨1, 1⟩⟩ — نقلیِ نیم‌جمع‌کنندهٔ نخست، سپس بیت‌های OR و XOR دومی.
explanation: >-
  مرحلهٔ نخست half-adder⟨1,1⟩ = ⟨1, 0⟩ را محاسبه می‌کند (نقلی 1، جمع 0) و
  carry-in را ذخیره می‌کند، در نتیجه ⟨⟨1,0⟩, 1⟩ به دست می‌آید. در مرحلهٔ دوم،
  O O H نقلیِ اول (1) را استخراج می‌کند، در حالی که O I H ▵ I H مقدار ⟨0, 1⟩ —
  جمعِ اول و carry-in — را به half-adder دوم می‌دهد، که چون and(0,1)=0 و
  xor(0,1)=1 است، ⟨0, 1⟩ را برمی‌گرداند. سپس مرحلهٔ نهایی دو نقلی را OR می‌کند
  و جمع را نگه می‌دارد، و ⟨1, 1⟩ تولید می‌کند: عدد دودویی 3، همان‌طور که انتظار می‌رود.
