question: "右翼想要對什麼立法？"
answer: "道德與宗教，其動因是保存傳統制度與社會階序的願望"
wrong_answers:
  - "經濟與金融市場，其動因是減少不平等並重新分配財富的願望"
  - "科學與教育，其動因是控制公立學校所教內容的願望"
  - "國際貿易與外交，其動因是在海外擴大國家影響力的願望"
explanation: >-
  右翼優先考量個人道德與傳統價值。它認為文明建立在某些必須被保存的傳統制度與社會階序之上，並想要在道德與宗教上立法。專注於對經濟立法的是左翼，而不是右翼。科學、教育與貿易政策並不是此處描述的右翼主要焦點。
reviewed: false
