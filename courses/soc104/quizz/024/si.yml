question: "political conservatism යනු කුමක්ද?"
answer: "පිහිටුවා ඇති දේශපාලන ආයතන සහ සමාජ පිළිවෙළ රැක ගැනීමට අරමුණු කරන, විශාල structural upheaval වලට විරුද්ධ වන ideology එකක්"
wrong_answers:
  - "ඒවා අන් අය මත පැනවීමට උත්සාහ නොකරමින්, සම්ප්‍රදායික පවුල් වටිනාකම් සහ ආගමික චාරිත්‍ර සඳහා පුද්ගලික කැපවීමක්"
  - "democratic reform සහ progressive legislation හරහා වේගවත් සමාජ වෙනස ප්‍රවර්ධනය කරන philosophy එකක්"
  - "free markets, අවම taxation, සහ trade barriers ඉවත් කිරීම සඳහා පෙනී සිටින economic theory එකක්"
explanation: >-
  Political conservatism යනු බොහෝ විට right-wing හෝ far-right parties මගින් නියෝජනය වන, පිහිටුවා ඇති දේශපාලන ආයතන සහ සමාජ පිළිවෙළ රැක ගැනීමට අරමුණු කරන අතරම විශාල structural upheaval වලට විරුද්ධ වන ideology එකකි. එහි පක්ෂධාරීන් තම උරුමය ආරක්ෂා කිරීමට බලය සහ නීතිය භාවිත කිරීමට කැමති වෙති. මෙය cultural conservatism වෙතින් වෙනස් වේ, එය political program එකක් නොව පුද්ගලික ජීවන තේරීමකි.
reviewed: false
