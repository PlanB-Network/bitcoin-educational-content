question: What is the dominant view of power in Western philosophy and historiography?
answer: Power is necessary for the progress and prosperity of humanity
wrong_answers:
  - Power is a corrupting force that leads to oppression
  - Power is a neutral tool that can be used for either good or evil
  - Power is an illegitimate usurpation that society should abolish
explanation: |
  According to the course, the cultural prejudice dominating Western philosophy and historiography is that we owe everything to power: freedom, health, education, security, and prosperity, with humanity seen as "inert matter" shaped by the legislator. Bastiat challenges this dominant view, arguing that the reality of power is in fact oppression.
reviewed: true
