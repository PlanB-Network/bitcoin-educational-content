question: Publicată anonim, L'Ami des Hommes a produs o asemenea impresie încât a fost inițial atribuită lui?
answer: Montesquieu
wrong_answers:
  - Voltaire
  - Diderot
  - Rousseau
explanation: |
  L'Ami des Hommes a fost atribuită inițial lui Montesquieu pentru stilul și importanța sa, înainte de a se descoperi că autorul era de fapt marchizul de Mirabeau.
