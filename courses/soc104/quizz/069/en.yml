question: "Why does the libertarian position on drug legalization come with the condition that the state's role in society must be reduced?"
answer: "Because liberalization taken over by the state would replace individual responsibility with government-managed care, whereas libertarians want citizens to bear the consequences of their choices with support from private associations"
wrong_answers:
  - "Because state-controlled legalization would generate too much tax revenue, making the government overly powerful and corrupt"
  - "Because the state would impose quality standards that would drive up prices and recreate black markets"
  - "Because government regulation of drugs would violate international trade agreements and diplomatic relationships"
explanation: >-
  Libertarians support drug liberalization but insist the state's role must be reduced because their goal is restoring individual responsibility, not expanding state management. If someone becomes dependent, they must take responsibility rather than asking the state to provide care. The solution to addiction lies in private initiative: voluntary support from individuals, families, and charitable associations. State-managed legalization would contradict the fundamental libertarian principle of personal responsibility.
