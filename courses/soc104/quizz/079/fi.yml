question: "Mitä konstruktivismi on jaettuna poliittisena vakaumuksena?"
answer: "Uskomus, että keskushallinto voi lain voimalla luoda yhteiskuntajärjestyksen, joka on hyvä mahdollisimman monelle"
wrong_answers:
  - "Uskomus, että yhteiskunta pitäisi järjestää yksilöiden välisen vapaaehtoisen yhteistyön kautta ilman valtion puuttumista"
  - "Uskomus, että vain vapaat markkinat voivat määrittää resurssien optimaalisen jakautumisen yhteiskunnassa"
  - "Uskomus, että poliittinen auktoriteetti pitäisi jakaa tasapuolisesti kaikkien kansalaisten kesken suoran demokratian kautta"
explanation: >-
  Konstruktivismi yhdistää sentristit, konservatiivit ja sosialistit jaetun vakaumuksen ympärille: poliittisen prosessin paremmuuden markkinaprosessiin nähden. Se on uskomus, että keskushallinto voi lain voimalla luoda yhteiskuntajärjestyksen, joka on hyvä mahdollisimman monelle. Tämä on suorassa vastakohdassa libertaariselle puolustukselle spontaanista järjestyksestä, joka nousee vapaaehtoisista vuorovaikutuksista.
