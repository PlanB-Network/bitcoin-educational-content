question: "Как социализм по-разному относится к свободам в общественной и экономической сферах?"
answer: "Социализм поддерживает сильные свободы в общественной сфере, но слабые свободы в экономической сфере"
wrong_answers:
  - "Социализм одинаково ограничивает все свободы как в общественной, так и в экономической сферах"
  - "Социализм поддерживает сильные экономические свободы, но ограничивает общественные свободы ради поддержания социального порядка"
  - "Социализм предоставляет неограниченные свободы в обеих сферах и полагается на добровольное сотрудничество для поддержания баланса"
explanation: >-
  В социалистической мысли существует фундаментальная дихотомия между общественными и экономическими свободами. Общественные свободы сильны, но экономические свободы слабы из-за акцента на государственном контроле, планировании и перераспределении богатства. Третий неправильный ответ описывает либертарианский идеал, тогда как второй описывает консервативную модель, являющуюся зеркальным отражением социализма.
reviewed: false
