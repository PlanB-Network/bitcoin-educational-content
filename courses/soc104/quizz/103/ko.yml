question: "이 강의는 왜 Bitcoin을 우파 또는 좌파 프로젝트가 아니라 국가 화폐에 맞서는 시장 화폐로 묘사하나요?"
answer: "Bitcoin은 자발적으로 채택되고, 생산하기 어렵고, 탈중앙화되어 있으며, 가치를 유지하는 통화이기 때문입니다. 이는 가치를 잃는 강제적이고 중앙집중화된 법정화폐와 대조되며, 구분을 정치 이념이 아니라 시장 대 국가의 문제로 만듭니다"
wrong_answers:
  - "Bitcoin은 의도된 목적이나 철학에 대해 어떤 정치적 발언도 의도적으로 피한 익명의 개발자가 만들었기 때문입니다"
  - "Bitcoin의 채굴 알고리즘이 모든 정당에 새 코인을 동등하게 배분하도록 보장해 통화 시스템의 이념적 편향을 막기 때문입니다"
  - "Bitcoin은 기존 법정화폐와 동일하게 기능하지만 더 빠른 결제 네트워크에서 작동해 정치적 구분을 무의미하게 만들기 때문입니다"
explanation: >-
  Bitcoin은 돈의 정치화에 맞서는 평화로운 반란으로 묘사됩니다. 국가 또는 법정화폐는 가치를 잃는 경향이 있는 강제적이고 중앙집중화된 시스템입니다. 역사적으로 금이, 현재는 Bitcoin이 보여 주는 시장 화폐는 자발적으로 나타나고 장기적으로 가치를 유지하는 건강하고 생산하기 어려운 통화입니다. 실제 대립은 좌파 대 우파가 아니라 시장 대 국가이며, 따라서 Bitcoin은 전통적 이념 진영을 초월하는 정치적 단절입니다.
