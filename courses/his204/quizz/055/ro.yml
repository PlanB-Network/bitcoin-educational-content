question: În ce țări au fost aplicate reforme economice inspirate de fiziocrație?
answer: Franța, Germania, Italia și Suedia
wrong_answers:
  - Anglia, Spania și Olanda
  - Portugalia, Anglia și Spania
  - Olanda, Spania și Portugalia
explanation: |
  Reformele fiziocratice au fost aplicate în Franța (sub Turgot), Germania (Margraful de Baden, prin experimentul lui Schlettwein la Dietlingen), Italia (Leopold al Toscanei) și Suedia (Gustav al III-lea). Ecaterina a II-a a Rusiei l-a invitat, de asemenea, pe Mercier de la Rivière, dar a fost dezamăgită de el.
