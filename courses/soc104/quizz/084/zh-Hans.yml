question: "Ludwig von Mises 写下只有个人思考、推理和行动时，他是什么意思？"
answer: "国家或民族这样的集体，除了其个体成员的行动之外，没有自身的存在"
wrong_answers:
  - "个人应避免组成群体或结社，因为集体行动总是有害的"
  - "只有某些有天赋的个人能够进行理性思考，而大多数人只是遵循本能"
  - "思考和推理是私人活动，绝不应在公共场合分享或讨论"
explanation: >-
  Mises 澄清说，个人主义反对这样一种观念：像社会或民族这样的社会实体可以独立于构成它们的个人而存在。集体除了其个体成员的行动之外，没有自身的存在。我们无法有意义地谈论国家或一家公司在行动，因为这些实体没有自己的意志或思想，只通过个人而行动。
reviewed: false
