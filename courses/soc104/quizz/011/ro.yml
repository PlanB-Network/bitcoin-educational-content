question: "De ce este considerată axa verticală (sus-jos) mai fundamentală decât axa orizontală (stânga-dreapta) în diagrama Nolan?"
answer: "Deoarece dezvăluie adevăratul clivaj dintre cei care apără libertățile individuale maxime și cei care favorizează controlul maxim al statului"
wrong_answers:
  - "Deoarece măsoară producția economică mai precis decât măsoară axa orizontală politicile sociale"
  - "Deoarece majoritatea conflictelor politice de-a lungul istoriei au fost despre identitate culturală mai degrabă decât despre guvernare"
  - "Deoarece axa orizontală se aplică doar democrațiilor moderne, în timp ce axa verticală este universală"
explanation: >-
  Axa fundamentală este cea verticală deoarece surprinde întrebarea politică esențială: în ce măsură ar trebui statul să controleze acțiunea umană? Axa stânga-dreapta reflectă doar sensibilități diferite (justiție socială vs. tradiție), dar ambele părți pot ocupa aceeași poziție pe axa verticală ca etatiști. Axa verticală dezvăluie dacă cineva vrea să-și impună viziunea prin forță sau respectă libertatea individuală.
reviewed: false
