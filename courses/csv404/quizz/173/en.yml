question: What does a decimal display value of 6 mean for a USD stablecoin in the price oracle's configuration?
answer: One dollar equals exactly 1,000,000 base units, which enables sub-cent precision in cross-asset calculations
wrong_answers:
  - The oracle rounds all exchange rate calculations to six decimal places before returning a quote
  - The stablecoin supports a maximum of six digits in its total supply, limiting issuance to 999,999 tokens
  - Price quotes are cached for six seconds before the oracle fetches a fresh rate from external feeds
explanation: >-
  The decimal display defines how the smallest on-chain unit relates to the human-readable value.
  With a decimal display of 6, one dollar is represented as 1,000,000 base units (10^6). This
  granularity allows the system to handle amounts smaller than one cent, which is essential for
  precise exchange rate calculations and preventing rounding errors in cross-asset payments.
reviewed: false
