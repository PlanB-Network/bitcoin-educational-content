question: Ancien Régime බදු ක්‍රමය "අධෛර්යමත් කරවන" එකක් ලෙස විස්තර කරන්නේ ඇයි?
answer: මන්ද සුළු වශයෙන් ධනවත් වූ මිනිසෙකුට ඊළඟ වසරේ දෙගුණයක් බදු ගෙවීමට සිදුවිය හැකි බැවිනි
wrong_answers:
  - එහි සංකීර්ණතාව බදු නිලධාරීන් බදු එකතු කිරීමෙන් අධෛර්යමත් කළ බැවින්
  - එහි මෘදුභාවය ප්‍රංශ ජනයා විදේශයට පලා යාමෙන් අධෛර්යමත් කළ බැවින්
  - එය අතිශයින් සරල සහ පුරෝකථනය කළ හැකි වූ බැවින්
explanation: |
  Ancien Régime යටතේ බදුකරණය බොහෝ විට අත්තනෝමතික සහ පුරෝකථනය කළ නොහැකි විය. පැහැදිලි නීති නොමැතිකම සහ අධික ලෙස බදු පැනවිය හැකි වීම ආයෝජනය සහ ධනවත් වීම අධෛර්යමත් කළේය, මන්ද ලාභ බදුකරණයෙන් අත්පත් කර ගත හැකි වූ බැවිනි.
