question: "Merkezcilik hangi yönetişim biçimine eğilim gösterir?"
answer: "Gücün ekonomiyi ve para politikasını yönlendiren uzmanlara emanet edildiği teknokrasi"
wrong_answers:
  - "Vatandaşların her büyük politika kararı için oy kullandığı doğrudan demokrasi"
  - "Gücün geleneksel bir yönetici sınıfın elinde bulunduğu aristokrasi"
  - "Piyasanın devlet müdahalesi olmadan kendi kendini düzenlediği laissez-faire yönetişim"
explanation: >-
  Merkezcilik verimliliği ve pragmatizmi öne çıkarır ve teknokrasiye eğilim gösterir; yani güç, ekonomiyi yönlendiren ve para politikasını idare eden uzmanlara emanet edilmelidir. Bu, doğrudan demokrasi, aristokrasi veya laissez-faire'den temelden farklıdır; çünkü bunların her biri gücü tamamen farklı ilkelere göre dağıtır.
reviewed: false
