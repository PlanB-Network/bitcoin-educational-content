question: "Sự phân biệt then chốt giữa thân doanh nghiệp và thân thị trường là gì?"
answer: "Những người thân doanh nghiệp tìm kiếm sự can thiệp của nhà nước để bảo vệ các công ty cụ thể khỏi thất bại, trong khi những người thân thị trường ủng hộ phi điều tiết và cho phép doanh nghiệp thất bại để thị trường có thể tự nhiên tái tổ chức"
wrong_answers:
  - "Những người thân doanh nghiệp tập trung vào các tập đoàn lớn, trong khi những người thân thị trường chỉ tập trung vào việc hỗ trợ doanh nghiệp nhỏ và startup"
  - "Thân doanh nghiệp là một lập trường cánh tả ủng hộ hợp tác xã của người lao động, trong khi thân thị trường là một lập trường cánh hữu ủng hộ sở hữu tư nhân"
  - "Những người thân doanh nghiệp bác bỏ mọi cạnh tranh, trong khi những người thân thị trường ủng hộ cạnh tranh do chính phủ điều tiết giữa các doanh nghiệp được phê duyệt"
explanation: >-
  Lập trường thân doanh nghiệp xem cạnh tranh như một công cụ quản trị đạt được thông qua các quy định và biện minh cho trợ cấp cũng như cứu trợ để ngăn mất việc làm. Trong quan điểm thân doanh nghiệp, thị trường mong manh và cần nhà nước giải cứu. Những người thân thị trường xem cạnh tranh là kết quả tự nhiên của tự do kinh doanh, hàm ý phi điều tiết và cho phép doanh nghiệp thất bại, vì thất bại cho phép thị trường tự nhiên tái tổ chức và mở ra không gian cho các tác nhân có năng lực hơn.
