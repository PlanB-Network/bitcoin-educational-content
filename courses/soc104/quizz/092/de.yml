question: "Welche drei Säulen des Wohlfahrtsstaates stellt Bitcoin infrage?"
answer: "Das fiskalische System, das Geldmonopol zur Finanzierung von Ausgaben durch Schulden und die Überwachung von Transaktionen, um die Nutzung alternativer Währungen zu verhindern"
wrong_answers:
  - "Das Militärbudget, das öffentliche Bildungssystem und die staatlich kontrollierte Gesundheitsinfrastruktur"
  - "Das Justizsystem, den Gesetzgebungsprozess und die exekutive Durchsetzung von Vorschriften für Unternehmen"
  - "Das Sozialversicherungssystem, die Mindestlohngesetzgebung und die progressive Einkommensteuerstruktur"
explanation: >-
  Bitcoin stellt die drei Säulen infrage, auf denen der Wohlfahrtsstaat ruht. Erstens das fiskalische System, das nicht ausreicht, um die Ausgaben zu decken. Zweitens das Geldmonopol, also die Fähigkeit, Geld auszugeben, um Ausgaben durch Schulden zu finanzieren. Drittens die Überwachung von Transaktionen, die Fähigkeit, Menschen daran zu hindern, eine andere Währung als das staatlich aufgezwungene Fiat zu verwenden. Bitcoin untergräbt alle drei gleichzeitig.
reviewed: false
