question: "文化的に保守的なリバタリアンは、自分が道徳的に認めない行動にどのように対処するのか？"
answer: "説得と模範を通じてそれらの行動に反対し、思いとどまらせるが、法の強制力には訴えない"
wrong_answers:
  - "連邦レベルの禁止には反対しつつ、地方政府によるそれらの行動の禁止を支持する"
  - "どのような不承認の表明も個人の自由を侵害すると考え、それらの行動について完全に沈黙する"
  - "正式な法制度の外でそれらの行動を罰することができる共同体法廷を提唱する"
explanation: >-
  文化的に保守的なリバタリアンは、特定の行動を道徳的に認めないことがあるが、同意に基づく非攻撃的な行為の法的禁止は主張しない。
  彼らはそのような行為を嫌い、反対し、積極的に思いとどまらせることはあるが、それは常に説得、教育、模範を通じてであり、法の強制力を通じてではない。
  これは沈黙を保つことや、代替的な執行メカニズムを作ることではない。
reviewed: false
