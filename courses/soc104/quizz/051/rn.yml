question: "Ni ikihe kinyuranyo cinyegeje kiri muri pragmatism ya centrists?"
answer: "Iyo pragmatism ubwayo ishingiye ku bwoko bw'ukwizera kudahinyuzwa, ni ukuvuga ukwemera kutavugwa ko abahinga bonyene ari bo babishoboye kuyobora ikibano"
wrong_answers:
  - "Centrists bavuga ko bari ku rugero rwo hagati ariko mu ma coalitions ya Leta bakama bashigikira imigambwe y'ibubamfu"
  - "Politiki za centrists zisa n'iziringaniye ariko zama zishira iterambere ry'ubutunzi imbere y'ukurengera ibidukikije"
  - "Centrists baranka ideology ariko bagafata ingingo zikomeye z'isoko ryigenga igihe bafata ingingo z'ubutunzi"
explanation: >-
  Ikinyuranyo ca pragmatism ya centrists ni uko ivuga ko yanka ideology igashima ubuhinga bushingiye ku bwenge, ariko ico ciyumviro nyene gishingiye ku dogma itaboneka kandi itavugwa: ko technocrats bonyene ari bo bashoboye gufata ingingo zibereye. Ukwo kwemera ko abahinga bonyene bakwiye kuyobora ikibano na kwo nyene ni ukwiyemeza kwa ideology, naho centrists batakumenya gutyo.
