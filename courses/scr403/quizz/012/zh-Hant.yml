question: 為什麼 Simplicity 運算式被序列化為 DAG 而非樹？
answer: 為了防止指數性增長，因為共享的子運算式只會儲存一次。
wrong_answers:
  - 因為單純的樹結構根本無法表示條件分支。
  - 為了在許多分開的多核心處理器上實現平行執行。
  - 因為 Liquid Network 協定在此嚴格規定必須使用 DAG 格式。
explanation: >-
  Simplicity 運算式自然形成的樹會隨著複雜度增加而可能呈指數性增長。透過序列化為有向無環圖（DAG），多次出現的子運算式只儲存一次，並由多個父節點引用。這使實際的程式大小以線性而非指數的方式增長。
reviewed: false
