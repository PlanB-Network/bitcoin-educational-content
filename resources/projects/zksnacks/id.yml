description: |
  "zk" dalam zkSNACKs berarti pengetahuan nol, yang berarti kami tidak dan tidak dapat mengumpulkan informasi pribadi pengguna dalam produk kami.

  zkSNACKs menutup koordinator coinjoin-nya pada 1 Juni 2024, dan situs webnya tidak dapat diakses. Wasabi Wallet tetap berlanjut sebagai perangkat lunak sumber terbuka.

