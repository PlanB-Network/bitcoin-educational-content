question: "Hva mener de franske libertaires (sosialistiske anarkister) om privat eiendom?"
answer: "Privat eiendom og kapitalisme må avskaffes fordi de er kilder til undertrykkelse"
wrong_answers:
  - "Privat eiendom er en naturlig rett som går forut for staten og må beskyttes for enhver pris"
  - "Privat eiendom bør reguleres av staten, men aldri fjernes fullstendig fra samfunnet"
  - "Privat eiendom er akseptabel bare når den fordeles likt mellom alle medlemmer av en kommune"
explanation: >-
  De franske libertaires, arvinger etter sosialistisk anarkisme gjennom tenkere som Proudhon og Bakunin, hevder at både staten og privat eiendom må avskaffes som tvillingkilder til undertrykkelse. Dette fanges i Proudhons berømte formel "Eiendom er tyveri." Det første gale svaret beskriver den libertarianske posisjonen, som står i grunnleggende motsetning til libertaire-synet.
