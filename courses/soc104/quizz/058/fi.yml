question: "Mikä erottaa uuskonservatiivit paleokonservatiiveista heidän lähestymistavassaan ulkopolitiikkaan?"
answer: "Uuskonservatiivit oikeuttavat sotilaallisen interventionismin demokratian levittämiseksi, kun taas paleokonservatiivit puolustavat isolationistisempaa ulkopolitiikkaa"
wrong_answers:
  - "Uuskonservatiivit vastustavat kaikkea sotilaallista toimintaa ja suosivat diplomatiaa, kun taas paleokonservatiivit tukevat ennaltaehkäiseviä iskuja mahdollisia uhkia vastaan"
  - "Uuskonservatiivit keskittyvät yksinomaan talouspakotteisiin, kun taas paleokonservatiivit kannattavat kansainvälisten koalitioiden rakentamista yhteisiä sotilasoperaatioita varten"
  - "Uuskonservatiivit ja paleokonservatiivit ovat samaa mieltä ulkopolitiikasta mutta eroavat jyrkästi kotimaisessa taloussääntelyssä"
explanation: >-
  2000-luvulta alkaen uuskonservatiivit osallistuivat yhä enemmän sotilaallisen interventionismin oikeuttamiseen demokratian juurruttamiseksi ympäri maailmaa, erityisesti 11. syyskuuta 2001 jälkeen. Vastareaktiona perinteiset konservatiivit ottivat käyttöön nimityksen 'paleokonservatiivi' erottautuakseen heistä. Paleokonservatiivit kritisoivat sotilaallista interventionismia, puolustavat isolationistisempaa ulkopolitiikkaa ja painottavat enemmän kansallista ja kulttuurista identiteettiä.
