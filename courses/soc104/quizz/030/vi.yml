question: "Vai trò của Cato Institute, Mises Institute và Libertarian Party khác nhau như thế nào trong phong trào libertarian?"
answer: "Cato Institute tập trung vào các đề xuất chính sách công, Mises Institute tập trung vào giáo dục và xuất bản học thuật, còn Libertarian Party tập trung vào chính trị bầu cử"
wrong_answers:
  - "Cato Institute tài trợ các chiến dịch chính trị, Mises Institute trực tiếp vận động hành lang Quốc hội, còn Libertarian Party tổ chức các hội nghị học thuật"
  - "Cato Institute xuất bản giáo trình kinh tế, Mises Institute tổ chức các chiến dịch đăng ký cử tri, còn Libertarian Party soạn thảo các dự luật"
  - "Cato Institute tổ chức các cuộc biểu tình cơ sở, Mises Institute cung cấp bảo vệ pháp lý cho những người libertarian, còn Libertarian Party quản lý nghiên cứu của think tank"
explanation: >-
  Cato Institute (thành lập năm 1977) là một think tank đặt tại Washington làm việc về các đề xuất chính sách công. Mises Institute (thành lập năm 1982) tập trung vào giáo dục hơn là vận động hành lang chính trị, hoạt động như một kiểu đại học trực tuyến với các hội nghị và các tác phẩm được tái xuất bản. Libertarian Party (thành lập năm 1971) là đảng chính trị lớn thứ ba của Mỹ, tham gia bầu cử, nơi ngay cả tỷ lệ phiếu khoảng 2% của họ cũng có thể làm nghiêng kết quả.
