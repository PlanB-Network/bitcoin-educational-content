description: |
  ZkSNACKs'deki "zk" sıfır bilgi anlamına gelir, yani ürünlerimizde herhangi bir kişisel kullanıcı bilgisi toplamıyoruz ve toplayamayız.

  zkSNACKs, coinjoin koordinatörünü 1 Haziran 2024'te kapattı ve web sitesi çevrimdışı. Wasabi Wallet açık kaynaklı yazılım olarak devam ediyor.
  