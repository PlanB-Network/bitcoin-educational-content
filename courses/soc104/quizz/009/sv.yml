question: "Var placerar sig de gröna i Nolan-diagrammet, och varför?"
answer: "Mycket lågt i diagrammet, eftersom de anser att individuellt intresse inte får gå före planetens kollektiva intresse"
wrong_answers:
  - "Högst upp i diagrammet, eftersom de prioriterar personlig frihet och miljömedvetenhet lika mycket"
  - "I mitten av diagrammet, eftersom de balanserar ekonomisk tillväxt med miljöskydd"
  - "Längst till höger, eftersom de stödjer marknadsbaserade lösningar på miljöutmaningar"
explanation: >-
  De gröna placerar sig mycket lågt i Nolan-diagrammet eftersom de förespråkar stark statlig kontroll över både ekonomiska och personliga beslut i planetens välbefinnandes namn. De har ersatt den marxistiska klasskampen med en kamp mellan människa och natur, och tenderar att försvara ekonomisk kontroll och till och med avskaffandet av privat egendom. Detta placerar dem i den auktoritära sektorn, inte högst upp eller i mitten.
reviewed: false
