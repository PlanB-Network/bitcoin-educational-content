question: "Apa fokus definisi struktural dari suatu sistem politik?"
answer: "Bagaimana sistem tersebut benar-benar berfungsi dan karakteristiknya yang dapat diamati, seperti tingkat kontrol negara"
wrong_answers:
  - "Tujuan yang dinyatakan dan niat luhur yang dideklarasikan oleh para pendiri dan pemimpin sistem tersebut"
  - "Asal-usul historis gerakan politik tersebut dan biografi para pemikir kuncinya"
  - "Jumlah partai politik yang diizinkan dan frekuensi pemilihan demokratis yang diadakan"
explanation: >-
  Definisi struktural berfokus pada bagaimana sistem politik benar-benar berfungsi dan pada karakteristiknya yang dapat diamati. Misalnya, sosialisme secara struktural dicirikan oleh kemahahadiran negara. Pendekatan ini kontras dengan definisi berbasis niat, yang bergantung pada motivasi dan tujuan yang dinyatakan. Pendekatan struktural memungkinkan evaluasi yang lebih objektif berdasarkan hasil yang dapat diukur.
