question: "Как се различават ролите на Cato Institute, Mises Institute и Libertarian Party в рамките на либертарианското движение?"
answer: "Cato Institute се фокусира върху предложения за публични политики, Mises Institute — върху образование и академично публикуване, а Libertarian Party — върху изборна политика"
wrong_answers:
  - "Cato Institute финансира политически кампании, Mises Institute лобира директно в Конгреса, а Libertarian Party организира академични конференции"
  - "Cato Institute публикува учебници по икономика, Mises Institute провежда кампании за регистрация на избиратели, а Libertarian Party изготвя законопроекти"
  - "Cato Institute организира низови протести, Mises Institute осигурява правна защита на либертарианци, а Libertarian Party управлява изследванията на мозъчни тръстове"
explanation: >-
  Cato Institute (основан през 1977 г.) е мозъчен тръст, базиран във Washington, който работи върху предложения за публични политики. Mises Institute (основан през 1982 г.) се фокусира върху образованието, а не върху политическото лобиране, функционирайки като вид онлайн университет с конференции и преиздавани трудове. Libertarian Party (основана през 1971 г.) е третата по големина американска политическа партия и участва в избори, при които дори приблизително 2% дял от гласовете може да наклони резултатите.
