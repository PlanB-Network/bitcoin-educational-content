question: "لیبرتارین‌ها درباره توانایی افراد برای تصمیم‌گیری چه باوری دارند؟"
answer: "افراد هم حق و هم مسئولیت دارند که درباره زندگی خودشان تصمیم بگیرند"
wrong_answers:
  - "افراد باید فقط پس از مشورت با نمایندگان منتخب که پیامدهای سیاستی را می‌فهمند تصمیم بگیرند"
  - "افراد عموماً قادر به گرفتن تصمیم‌های خوب نیستند و به راهنمایی کارشناسانه از سوی نهادهای دولتی نیاز دارند"
  - "افراد باید تصمیم‌های اقتصادی را آزادانه بگیرند، اما در همه امور اجتماعی و فرهنگی به دولت واگذار کنند"
explanation: >-
  از دیدگاه لیبرتارین، افراد هم حق و هم مسئولیت دارند که تصمیم‌های خودشان را بگیرند. این در تضاد با خانواده‌های سیاسی متعارف، از چپ تا راست، است که باور دارند دولت باید برخی یا بسیاری از تصمیم‌های مهم در زندگی فرد و در زندگی اقتصادی به‌طور کلی را بگیرد.
reviewed: false
