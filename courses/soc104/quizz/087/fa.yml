question: "تمایز کارل پوپر میان جوامع باز و بسته چه نسبتی با بحث فردگرایی در برابر جمع‌گرایی دارد؟"
answer: "جامعهٔ باز حق فرد برای داوری به‌جای خود از طریق تصمیم‌های شخصی را به رسمیت می‌شناسد، در حالی که جامعهٔ بسته جمع‌گراست و بر ذهنیت قبیله‌ای و امتناع از آزادی انتقادی تکیه دارد"
wrong_answers:
  - "جامعهٔ باز جامعه‌ای است که تجارت آزاد را در مرزهای ملی مجاز می‌داند، در حالی که جامعهٔ بسته تعرفه‌ها و سیاست‌های اقتصادی حمایت‌گرایانه وضع می‌کند"
  - "جامعهٔ باز با دموکراسی مستقیم اداره می‌شود که در آن هر شهروند رأی می‌دهد، در حالی که جامعهٔ بسته زیر فرمان یک پادشاه موروثی واحد است"
  - "جامعهٔ باز همهٔ اسناد دولت را به‌صورت شفاف منتشر می‌کند، در حالی که جامعهٔ بسته اطلاعات را به‌عنوان اسرار دولتی طبقه‌بندی می‌کند"
explanation: >-
  پوپر جامعهٔ بسته را جامعهٔ جادویی یا قبیله‌ای و جامعهٔ باز را جامعه‌ای تعریف کرد که در آن افراد با تصمیم‌های شخصی روبه‌رو می‌شوند. جامعهٔ بسته جمع‌گراست و بر ذهنیت قبیله‌ای، همراه با امتناع از آزادی انتقادی و آرمانی‌سازی نظمی ایستا، تکیه دارد. جامعهٔ باز به انتخاب آزادانهٔ ارزش‌ها، باورها و روابط اولویت می‌دهد و مستقیماً اصول فردگرایانه را مجسم می‌کند.
reviewed: false
