question: "Czym różnią się role Cato Institute, Mises Institute i Libertarian Party w ruchu libertariańskim?"
answer: "Cato Institute koncentruje się na propozycjach polityki publicznej, Mises Institute na edukacji i publikacjach akademickich, a Libertarian Party na polityce wyborczej"
wrong_answers:
  - "Cato Institute finansuje kampanie polityczne, Mises Institute bezpośrednio lobbuje w Kongresie, a Libertarian Party organizuje konferencje akademickie"
  - "Cato Institute publikuje podręczniki ekonomii, Mises Institute prowadzi akcje rejestracji wyborców, a Libertarian Party opracowuje projekty ustaw"
  - "Cato Institute organizuje protesty oddolne, Mises Institute zapewnia libertarianom obronę prawną, a Libertarian Party zarządza badaniami think tanków"
explanation: >-
  Cato Institute (założony w 1977 roku) jest think tankiem z siedzibą w Waszyngtonie, pracującym nad propozycjami polityki publicznej. Mises Institute (założony w 1982 roku) koncentruje się na edukacji, a nie na lobbingu politycznym, działając jako rodzaj uniwersytetu internetowego z konferencjami i ponownie publikowanymi pracami. Libertarian Party (założona w 1971 roku) jest trzecią co do wielkości amerykańską partią polityczną, uczestniczącą w wyborach, w których nawet jej około 2% udziału w głosach może przesądzać o wynikach.
