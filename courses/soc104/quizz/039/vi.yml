question: "Vì sao các định nghĩa theo ý định về hệ thống chính trị được xem là có vấn đề cho mục đích phân tích?"
answer: "Chúng tạo ra sự lẫn lộn khái niệm vì mọi hệ thống đều tuyên bố theo đuổi các mục tiêu tương tự như công lý, bình đẳng và tự do"
wrong_answers:
  - "Chúng quá chính xác và cứng nhắc, không để lại không gian cho sự tiến hóa tự nhiên của các phong trào chính trị theo thời gian"
  - "Chúng tập trung quá nặng vào kết quả kinh tế và bỏ qua các chiều kích văn hóa và xã hội của đời sống chính trị"
  - "Chúng dựa vào các tài liệu mật của chính phủ, vốn hiếm khi có sẵn cho các nhà nghiên cứu độc lập"
explanation: >-
  Các định nghĩa theo ý định dựa vào các động cơ và mục tiêu được tuyên bố, nhưng mọi hệ thống chính trị đều tuyên bố theo đuổi công lý, bình đẳng và tự do. Điều này khiến các hệ thống không thể được phân biệt với nhau. Trái lại, phân tích cấu trúc đánh giá các hệ thống bằng những hệ quả thực nghiệm, có thể đo lường và bằng các phương tiện mà chúng sử dụng, qua đó bộc lộ bản chất thật của chúng vượt ra ngoài tu từ.
