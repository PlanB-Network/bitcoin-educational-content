question: "Comment les programmes d'assistance sociale financés par l'État peuvent-ils produire des effets pervers, illustrant le danger de s'appuyer uniquement sur les intentions ?"
answer: "Ils peuvent créer de la dépendance, supprimer les incitations à travailler, et relever de la spoliation puisque l'argent doit d'abord être prélevé sur ceux qui ont produit la richesse"
wrong_answers:
  - "Ils encouragent une épargne personnelle excessive, réduisent les dépenses de consommation et provoquent une déflation dans l'économie au sens large"
  - "Ils renforcent l'entreprise privée en transférant les coûts du travail vers le gouvernement et en réduisant la nécessité de salaires compétitifs"
  - "Ils éliminent les distinctions de classe si complètement que la mobilité sociale devient inutile et que l'innovation stagne"
explanation: >-
  Friedman avertit que des intentions généreuses peuvent produire des conséquences néfastes lorsqu'elles négligent une analyse rigoureuse des incitations humaines. Les programmes d'assistance financés par l'État risquent de créer une dépendance, de ne générer aucune incitation au travail et de constituer une forme de spoliation puisque les fonds doivent d'abord être prélevés sur les producteurs de richesse. Les résultats mesurables comme la réduction de la pauvreté et l'efficacité doivent primer sur les nobles intentions.
reviewed: false
