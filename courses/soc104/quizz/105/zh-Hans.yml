question: "考虑本课程的完整论证，Bitcoin 如何同时体现自由意志主义对建构主义的批判、加密朋克对行动的承诺，以及个人主义对道德自主的捍卫？"
answer: "Bitcoin 用自发市场秩序取代中央计划货币（反建构主义），把金融自由的抽象理想转化为可运行的代码（加密朋克行动），并把主权财产和隐私还给个人（道德自主）"
wrong_answers:
  - "Bitcoin 使用民主治理来设定货币政策（反建构主义），发布关于金融自由的教育内容（加密朋克行动），并允许个人对协议变更投票（道德自主）"
  - "Bitcoin 消除所有金融监管（反建构主义），创建一个游说放松监管的开发者共同体（加密朋克行动），并让富人对货币政策拥有更多控制权（道德自主）"
  - "Bitcoin 将服务器基础设施去中心化到多个国家（反建构主义），使用开源许可来免费分享技术（加密朋克行动），并为政治异见提供匿名社交媒体平台（道德自主）"
explanation: >-
  Bitcoin 位于本课程探讨的三种思想传统的交汇处。它通过用自发、去中心化且没有中央规划者能够控制的货币秩序取代中央计划的法定货币，体现了反建构主义论证。它通过把金融自由和隐私的抽象理想转化为可运行技术，履行了加密朋克写代码的要求。它还通过使主权财产成为可能、保护劳动果实并保存隐私，为个人主义对道德自主的捍卫服务，让每个人都能成为自己生活的主人。
reviewed: false
