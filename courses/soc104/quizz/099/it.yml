question: "Che cosa identifica il corso come la vera frattura politica, oltre il tradizionale spettro sinistra-destra-centro?"
answer: "La frattura tra principi filosofici fondamentali: libertà o coercizione, consenso volontario o costrizione, l'individuo responsabile o il collettivo"
wrong_answers:
  - "La frattura tra nazioni ricche e povere sul controllo degli accordi commerciali internazionali e delle istituzioni finanziarie globali"
  - "La frattura tra popolazioni urbane e rurali sulle priorità di spesa pubblica e sugli investimenti infrastrutturali"
  - "La frattura tra culture progressiste e tradizionali su norme sociali, valori familiari ed educazione religiosa"
explanation: >-
  Il corso sostiene che la vera frattura politica non si trova nelle etichette tradizionali sinistra-destra-centro, ma in principi filosofici fondamentali: libertà o coercizione, consenso volontario o costrizione, l'individuo responsabile o il collettivo. Il modo giusto di pensare la politica è partire dai principi etici anziché dalle etichette.
