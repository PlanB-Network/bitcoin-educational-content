question: "کدام‌یک از موارد زیر نمونه‌ای از نظم خودجوش، به توصیف هایک، است؟"
answer: "زبان، که از راه تعاملات تاریخی به‌صورت ارگانیک پدید آمد، نه اینکه روشنفکران در یک دفتر آن را طراحی کرده باشند"
wrong_answers:
  - "قانون اساسی ملی، که به‌دقت توسط نمایندگان منتخب برای ایجاد قواعد اجتماعی تدوین شد"
  - "طرح محرک اقتصادی دولت، که اقتصاددانان برای هماهنگ‌کردن فعالیت اقتصادی طراحی کردند"
  - "نظام آموزش عمومی، که قانون‌گذاران برای تضمین دسترسی همگانی به دانش ایجاد کردند"
explanation: >-
  هایک نظم خودجوش را محصول تعاملات آزاد در جامعه توصیف می‌کند؛ نتیجهٔ کنش انسانی است، اما حاصل طراحی عمدی انسان نیست. زبان نمونه‌ای برجسته است: فرانسوی، انگلیسی و آلمانی را روشنفکرانی که دربارهٔ قواعد دستور زبان تصمیم می‌گرفتند نساختند، بلکه به‌عنوان ثمرهٔ سازمان‌یابی آهسته و ارگانیکی پدید آمدند که از راه تعاملات تاریخی شکل گرفت.
reviewed: false
