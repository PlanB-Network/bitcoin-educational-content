question: "Why didn't universal education produce scientifically-minded voters?"
answer: "State education doesn't teach how politics really works, information control counterbalanced literacy, and expert culture ignores political economy."
wrong_answers:
  - "Because most people still cannot read."
  - "Because politics was removed from constitutions."
  - "Because universities teach only ancient history."
explanation: |
  The 19th century expected universal education to perfect democracy. Instead, education produced specialists with no time for 'unprofitable' subjects like political philosophy — and the state's own schools were never going to explain minority rule.
reviewed: false
