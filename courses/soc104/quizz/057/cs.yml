question: "K jaké formě vládnutí centrismus tíhne?"
answer: "K technokracii, v níž je moc svěřena expertům, kteří řídí ekonomiku a měnovou politiku"
wrong_answers:
  - "K přímé demokracii, v níž občané hlasují o každém důležitém politickém rozhodnutí"
  - "K aristokracii, v níž moc drží tradiční vládnoucí třída"
  - "K vládnutí laissez-faire, v němž se trh reguluje sám bez státních zásahů"
explanation: >-
  Centrismus upřednostňuje efektivitu, pragmatismus a tíhne k technokracii, což znamená, že moc by měla být svěřena expertům, kteří řídí ekonomiku a pilotují měnovou politiku. To se zásadně liší od přímé demokracie, aristokracie nebo laissez-faire, z nichž každé rozděluje moc podle zcela odlišných principů.
