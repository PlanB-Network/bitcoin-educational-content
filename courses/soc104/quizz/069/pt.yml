question: "Qual é a posição conservadora sobre imigração?"
answer: "O Estado tem o direito soberano de controlar suas fronteiras para proteger a segurança nacional e a identidade cultural"
wrong_answers:
  - "As fronteiras devem ser abertas incondicionalmente porque restrições discriminatórias violam os direitos humanos"
  - "A imigração deve ser determinada pela demanda de mercado, com os cidadãos decidindo contratualmente sobre suas relações com estrangeiros"
  - "A política de imigração deve equilibrar necessidades econômicas com integração bem-sucedida com base na avaliação de especialistas"
explanation: >-
  Conservadores sustentam que ordem, identidade e soberania nacional devem ter prioridade sobre o acolhimento irrestrito de estrangeiros ou refugiados. Fronteiras e uma população bem definida fazem parte dos valores civilizados. As respostas erradas representam a posição socialista (fronteiras abertas como direitos humanos), a posição libertária (imigração baseada no mercado) e a posição centrista (abordagem equilibrada guiada por especialistas).
