question: یک jet به نام half-agg-verify مجموعه‌ای از چندتایی‌ها را به‌عنوان اثر Writer ثبت می‌کند. تحت آزمون جابجایی‌پذیر/ایدمپوتنت/واحدی، طراحیِ مجموعه چه چیزی به دست می‌آورد، و چه چیزی هنوز کم است؟
answer: "جابجایی‌پذیر و ایدمپوتنت (همان‌طور که Simplicity الزام می‌کند)، اما واحدی نیست: دور انداختن یک فراخوانی، چندتاییِ آن را حذف می‌کند و یک امضا را نادیده می‌گیرد."
wrong_answers:
  - ایدمپوتنت و واحدی، اما نه جابجایی‌پذیر، چون تجمیع باید r-components را به ترتیب امضاکردن ترکیب کند.
  - هر سه، پس بهینه‌ساز می‌تواند فراخوانی‌ها را آزادانه و بدون ریسک تکثیر، بازمرتب، یا دور بیندازد.
  - جابجایی‌پذیر اما نه ایدمپوتنت، چون ثبت دوبارهٔ همان چندتایی دو s-components تجمیعی را مطالبه می‌کند.
explanation: >-
  در نظر گرفتن لاگ Writer به‌صورت یک مجموعه اثر را ایدمپوتنت و جابجایی‌پذیر می‌کند،
  چون خودِ درج در مجموعه هر دو ویژگی را دارد — دقیقاً همان دو ویژگی‌ای که Simplicity
  از هر اثر می‌خواهد. واحدی‌بودن هنوز دور از دسترس است: مانند Failure، write بر
  اعتبار تراکنش اثر می‌گذارد، چون تراکنش فقط وقتی معتبر است که یک s-component
  تجمیعی همهٔ چندتایی‌های ثبت‌شده را پوشش دهد. بنابراین عبارتی که write را انجام
  می‌دهد صرفاً به این دلیل که خروجی unit آن استفاده نشده، نمی‌تواند دور انداخته
  شود، چون چندتاییِ آن بی‌صدا از راستی‌آزمایی half-aggregation ناپدید می‌شود.
reviewed: false
