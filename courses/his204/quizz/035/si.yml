question: කතෝලික සභාව විසින් සංවර්ධනය කළ කුමන අදහසකට Gournay පහර දුන්නේද?
answer: පොලී සහිත ණය තහනම
wrong_answers:
  - අවශ්‍යතා ඇති අය සඳහා දානය
  - භික්ෂූන්ගේ ස්වයංපෝෂිත ජීවිතය
  - දසයෙන් පංගුව
explanation: |
  ව්‍යවසායකයන්ට ණය ලබාගැනීම වැළැක්වීම මගින් ආර්ථික සංවර්ධනයට බාධා කරන බව කියමින් Gournay පොලී සහිත ණය තහනම විවේචනය කළේය.
