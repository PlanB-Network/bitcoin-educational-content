question: "Кой стартира първия Cypherpunk пощенски списък през 1992 г.?"
answer: "Tim May и Eric Hughes, които създават платформа, превърнала се в нервен център на движението"
wrong_answers:
  - "Satoshi Nakamoto и Hal Finney, които по-късно създават Bitcoin заедно през 2008 г."
  - "Julian Assange и Edward Snowden, които използват списъка, за да координират дейности по разкриване на злоупотреби в правителството"
  - "Phil Zimmermann и Bruce Schneier, които проектират списъка като инструмент за разпространение на софтуер за криптиране"
explanation: >-
  През 1992 г. Tim May и Eric Hughes стартират първия Cypherpunk пощенски списък. Тази платформа бързо се превръща в нервен център на движението, събирайки разработчици, криптографи и защитници на дигиталната свобода. Именно в този същия списък Satoshi Nakamoto по-късно ще сподели Bitcoin White Paper за първи път през 2008 г.
reviewed: false
