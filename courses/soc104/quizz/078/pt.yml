question: "Como a concepção libertária de liberdade difere da concepção centrista?"
answer: "Os libertários tratam a liberdade como um axioma incondicional, enquanto os centristas defendem liberdades oportunisticamente, dependendo do contexto e da eficiência"
wrong_answers:
  - "Os libertários permitem que o estado proteja a liberdade seletivamente, enquanto os centristas rejeitam qualquer envolvimento do estado na proteção dos direitos individuais"
  - "Os libertários concentram a liberdade apenas em questões econômicas, enquanto os centristas aplicam a liberdade amplamente em domínios sociais e culturais"
  - "Libertários e centristas compartilham a mesma visão de liberdade, mas discordam sobre o tamanho do governo necessário para aplicá-la"
explanation: >-
  Os libertários definem a liberdade como um princípio geral e incondicional que funciona como um axioma. Os centristas, por outro lado, defendem certas liberdades de maneira oportunista e contextual, sem aplicar nenhum princípio geral. A abordagem centrista revela uma concepção instrumental da liberdade, sempre subordinada a objetivos pragmáticos como a eficiência, o que os libertários rejeitam fundamentalmente.
