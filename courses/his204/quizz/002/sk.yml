question: Ktorého kráľa bol Sully ministrom?
answer: Henrich IV.
wrong_answers:
  - Ľudovít XIV.
  - Ľudovít XV.
  - Ľudovít XIII.
explanation: |
  Maximilien de Béthune, vojvoda de Sully, bol hlavným ministrom Henricha IV. Zohral kľúčovú úlohu pri ozdravení kráľovských financií a pri hospodárskej obnove kráľovstva po náboženských vojnách.
