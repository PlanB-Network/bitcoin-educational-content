title: "Socialism: An Economic and Sociological Analysis"

publication_year: 1922

cover: cover_en.webp

original: false

description: |
  Mises's systematic critique of socialism, first published in German as "Die Gemeinwirtschaft," demonstrates that socialist economic planning is impossible without market prices. Without private ownership of the means of production, there can be no market for capital goods, no prices, and therefore no rational way to allocate resources. The book's "economic calculation argument" converted Hayek and an entire generation of economists, and remains the most rigorous theoretical refutation of central planning.
