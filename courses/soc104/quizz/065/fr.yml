question: "Pourquoi les régimes totalitaires ont-ils été décrits comme des « religions séculières », et que cela révèle-t-il sur les conditions nécessaires à l'existence du totalitarisme ?"
answer: "Ils exigent une foi quasi religieuse de la part des militants et utilisent la peur contre les opposants, et le totalitarisme exige simultanément toutes ses caractéristiques : libertés supprimées, parti unique, révolution violente et économie dirigée"
wrong_answers:
  - "Ils remplacent le culte traditionnel par des cérémonies d'État, et le totalitarisme ne nécessite qu'un chef charismatique et un contrôle militaire"
  - "Ils utilisent les institutions religieuses pour imposer l'idéologie d'État, et le totalitarisme peut émerger chaque fois qu'un seul parti politique domine le parlement"
  - "Ils promettent le salut spirituel par l'action politique, et le totalitarisme existe chaque fois que l'État contrôle l'économie, indépendamment des libertés politiques"
explanation: >-
  Raymond Aron a observé que les régimes totalitaires fonctionnent selon deux principes : la foi des militants et la peur des opposants. Ce fanatisme quasi religieux les caractérise au-delà de leurs motivations différentes, ce qui leur vaut l'étiquette de religions séculières. Point crucial, le totalitarisme exige simultanément toutes ses caractéristiques définitoires : libertés supprimées, autorité illimitée par l'intermédiaire d'un parti unique, révolution violente et économie dirigée. Les démocraties modernes peuvent présenter certains de ces traits, mais le totalitarisme n'est présent que lorsqu'ils sont tous réunis.
reviewed: false
