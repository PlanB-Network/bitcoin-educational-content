question: "왜 전체주의 정권은 '세속 종교'라고 묘사되어 왔으며, 이는 전체주의가 존재하기 위해 필요한 조건에 대해 무엇을 드러내나요?"
answer: "그들은 투사들에게 준종교적 신앙을 요구하고 반대자들에게는 공포를 사용하며, 전체주의는 억압된 자유, 일당 지배, 폭력 혁명, 통제 경제라는 모든 특징을 동시에 필요로 합니다"
wrong_answers:
  - "그들은 전통적 예배를 국가 의식으로 대체하며, 전체주의에는 카리스마적 지도자와 군사적 통제만 필요합니다"
  - "그들은 국가 이데올로기를 강제하기 위해 종교 제도를 사용하며, 전체주의는 단일 정당이 의회를 지배할 때마다 나타날 수 있습니다"
  - "그들은 정치적 행동을 통한 영적 구원을 약속하며, 전체주의는 정치적 자유와 상관없이 국가가 경제를 통제할 때마다 존재합니다"
explanation: >-
  Raymond Aron은 전체주의 정권이 두 가지 원리 위에서 작동한다고 보았습니다. 투사들의 신앙과 반대자들의 공포입니다. 이 준종교적 광신은 서로 다른 동기를 넘어 그들을 특징짓고, 그래서 세속 종교라는 이름을 얻게 합니다. 결정적으로 전체주의는 정의하는 모든 특징을 동시에 필요로 합니다. 억압된 자유, 단일 정당을 통한 무제한 권위, 폭력 혁명, 통제 경제가 그것입니다. 현대 민주주의는 이러한 특성 중 일부를 보일 수 있지만, 전체주의는 이 모든 것이 함께 모였을 때에만 존재합니다.
