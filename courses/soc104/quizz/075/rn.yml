question: "Mu biganiro bitanu vyose vy'ubukungu (amakori, umushahara fatizo, ubuvuzi, ibidukikije, imfashanyo za Leta), ni uburyo ubuhe budahinduka butandukanya uburyo bw'abari hagati n'ibibanza vy'iyindi miryango ya politike?"
answer: "Abari hagati baranka kwiyemeza ku ngingo ngenderwako idahinduka, ahubwo bagasaba isesengura rishingiye ku bimenyamenya n'isuzuma ry'abahinga kugira bamenye politiki ikwiye ku kibazo ku kindi, bigatuma uburyo bwabo bushingira ku bubasha bw'abahinga"
wrong_answers:
  - "Abari hagati bama bafata ikibanza co hagati hagati y'ibibanza vy'abasosiyalisite n'abakonservateur, bagabura itandukaniro ku kibazo cose ku rugero rungana"
  - "Abari hagati baguma bashira imbere iterambere ry'ubukungu kuruta imibereho myiza y'ikibano, bakemeranya n'aba-libertarian ku politiki y'amahera ya Leta mu gihe bemeranya n'abasosiyalisite ku gutunganya"
  - "Abari hagati basigira ingingo zose z'ubukungu amashirahamwe mpuzamakungu n'amasezerano y'ubudandaji aho gufata politiki yigenga y'igihugu"
explanation: >-
  Mu biganiro bitanu vyose vy'ubukungu, uburyo bw'abari hagati bukurikira ishusho imwe: aho kwiyemeza ku ngingo ngenderwako idahinduka y'iciyumviro ca politike, abari hagati basaba ibimenyamenya biva mu bushakashatsi n'isuzuma ry'abahinga imbere yo gufata ingingo. Ku makori, urugero rubereye rutegerezwa kugenwa n'isesengura. Ku mushahara fatizo, urugero rutegerezwa guhindurwa mu buryo ngirakamaro. Ku buvuzi, uburyo buvanze buringanijwe n'abahinga ni bwo bwiza. Ku bidukikije, politiki itegerezwa kuringaniza ubushobozi bwo guhiganwa. Ku mfashanyo za Leta, ikibazo cose gitegerezwa gusuzumwa hisunzwe agaciro kaco. Ivyo bituma uburyo bw'abari hagati bushingira ku bubasha bw'abahinga, bikaba bitandukanye no kugabura gusa itandukaniro canke kwisunga amashirahamwe mpuzamakungu.
