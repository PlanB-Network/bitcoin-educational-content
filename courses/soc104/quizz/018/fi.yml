question: "Mitä kulttuurikonservatismi on?"
answer: "Henkilökohtaista sitoutumista perheeseen sekä menneisyydestä perittyihin moraalisiin, esteettisiin ja metafyysisiin arvoihin, ei poliittinen filosofia"
wrong_answers:
  - "Poliittinen ideologia, joka käyttää valtiovaltaa perinteisten arvojen pakottamiseen koko yhteiskunnalle lainsäädännön avulla"
  - "Liike, joka hylkää kaikki moderniuden muodot ja pyrkii palauttamaan yhteiskunnan esiteolliseen elämäntapaan"
  - "Taloudellinen oppi, joka suojelee kansallisia teollisuudenaloja ja vastustaa vapaakauppaa ulkomaiden kanssa"
explanation: >-
  Kulttuurikonservatismi määritellään elämänviisaudeksi: henkilökohtaiseksi sitoutumiseksi perheeseen sekä menneisyydestä perittyihin moraalisiin, esteettisiin ja metafyysisiin arvoihin, olivatpa ne kreikkalais-roomalaisia tai juutalais-kristillisiä. Se ei nimenomaisesti ole poliittinen filosofia. Se eroaa poliittisesta konservatismista, joka pyrkii säilyttämään poliittiset instituutiot ja yhteiskuntajärjestyksen valtiovallan avulla. Kyse ei myöskään ole moderniuden hylkäämisestä tai taloudellisesta protektionismista.
