question: "非侵略原则说明了什么？"
answer: "只要不对他人的生命、自由或财产实施暴力，一个人就可以按自己的意愿自由行动"
wrong_answers:
  - "国家拥有使用武力以维持社会秩序的唯一权利"
  - "公民必须服从多数统治，即使它限制个人自由"
  - "只有当行动自由有益于社会的集体善时，才允许这种自由"
explanation: >-
  非侵略原则是自由意志主义政治的基石，它说明个人可以自由行动，前提是他们不对他人的生命、自由或财产实施暴力。它让人想起各个文明中都存在的黄金律。与其他选项不同，它并不赋予国家特殊的道德权威，也不让个人权利从属于集体利益。
reviewed: false
