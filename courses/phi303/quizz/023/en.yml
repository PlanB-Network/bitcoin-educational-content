question: "Why is it paradoxically in the ruling minority's own interest to be constrained by public opinion?"
answer: "Because a ruling class exempt from constraints undergoes moral degeneration and eventually loses power."
wrong_answers:
  - "Because constraints raise the minority's popularity ratings artificially."
  - "Because constitutional courts pay the minority for compliance."
  - "Because constrained elites pay lower taxes."
explanation: |
  Lord Acton: power corrupts. Mosca goes further: a ruling class that can get away with anything degenerates — the constraints imposed by the opinion and conscience of fellow men are what keep it healthy and in power.
reviewed: false
