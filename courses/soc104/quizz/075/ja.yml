question: "5 つの経済的論点（税、最低賃金、医療、環境、補助金）全体を通じて、中道主義の方法を他の政治的家族の立場から区別する一貫したパターンは何ですか？"
answer: "中道主義者は固定された原則にコミットすることを拒み、代わりに政策を事例ごとに決定するための経験的分析と専門家評価を要求するため、そのアプローチは本質的にテクノクラート的である"
wrong_answers:
  - "中道主義者は常に社会主義と保守主義の中間の立場を取り、すべての問題で差を等しく二分する"
  - "中道主義者は一貫して社会福祉より経済成長を優先し、財政政策ではリバタリアンに同調しつつ、規制では社会主義者に同意する"
  - "中道主義者は独自の国内政策を作るのではなく、すべての経済的決定を国際機関と貿易協定に委ねる"
explanation: >-
  5 つの経済的論点全体を通じて、中道主義のアプローチは同じパターンに従います。固定されたイデオロギー的原則にコミットするのではなく、中道主義者は決定を下す前に経験的証拠と専門家評価を要求します。税では、適切な水準は分析によって決められなければなりません。最低賃金では、水準は実用的に調整されなければなりません。医療では、専門家によって調整された組み合わせが理想です。環境では、政策は競争力とのバランスを取らなければなりません。補助金では、各事例がその固有の価値に基づいて評価されなければなりません。これにより、中道主義は本質的にテクノクラート的になります。それは、単に差を二分することや国際機関に委ねることとは異なります。
reviewed: false
