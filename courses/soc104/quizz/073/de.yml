question: "Was ist die sozialistische Position zur Gesundheitsversorgung?"
answer: "Zugang zur Gesundheitsversorgung ist ein Grundrecht, und der Staat muss ein universelles, öffentlich finanziertes System für alle garantieren, unabhängig vom Einkommen"
wrong_answers:
  - "Die Gesundheitsversorgung sollte ein gemischtes System sein, mit staatlicher Grundabsicherung, ergänzt durch private Versicherungsoptionen"
  - "Private Märkte liefern innovativere Gesundheitsversorgung, daher sollten Individuen ihr eigenes System frei wählen"
  - "Der Staat sollte Gesundheitsversorgung nur für die ärmsten Bürger bereitstellen, während private Versicherungen alle anderen abdecken"
explanation: >-
  Für Sozialisten ist der Zugang zur Gesundheitsversorgung ein Grundrecht, keine Ware. Der Staat muss ein universelles, öffentlich finanziertes Gesundheitssystem garantieren, damit jeder Zugang zu Versorgung hat, unabhängig vom Einkommen. Dies spiegelt das sozialistische Anliegen für Gleichheit, soziale Gerechtigkeit und die Bedeutung des Staates bei der Organisation von Diensten im Allgemeininteresse wider. Das gemischte System beschreibt die zentristische Sichtweise, während wahlbasierte Ansätze libertäre und konservative Positionen widerspiegeln.
