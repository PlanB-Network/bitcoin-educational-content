question: "Bagaimana kursus ini berargumen bahwa kebebasan memungkinkan nilai sayap kiri dan sayap kanan hidup berdampingan secara damai?"
answer: "Dalam rezim kebebasan sejati, orang dengan ideal sayap kiri dapat secara sukarela berbagi kepemilikan dan mendistribusikan ulang dana, sementara mereka yang memiliki nilai sayap kanan dapat menabung dan mewariskan tradisi, tanpa salah satu pihak memaksakan cara hidupnya kepada pihak lain"
wrong_answers:
  - "Kebebasan mengharuskan kedua pihak berkompromi dengan menerima posisi sentris, di mana pemerintah menyeimbangkan nilai-nilai yang bersaing melalui regulasi moderat"
  - "Kebebasan berarti komunitas sayap kiri dan sayap kanan harus hidup di wilayah geografis terpisah dengan pemerintah independen mereka sendiri"
  - "Kebebasan bekerja dengan memungkinkan warga memilih nilai mana yang harus ditegakkan di setiap wilayah, berganti antara kebijakan sayap kiri dan sayap kanan setiap siklus pemilu"
explanation: >-
  Kursus ini menunjukkan bahwa dalam rezim kebebasan yang sejati, mereka yang berpegang pada ideal sayap kiri dapat secara sukarela melepaskan kepemilikan, berbagi sarana produksi, atau menyumbangkan upah kepada organisasi redistributif. Mereka yang memiliki nilai sayap kanan dapat bekerja keras, menabung, dan mewariskan nilai keluarga. Tidak seorang pun boleh memaksakan cara hidupnya kepada orang lain. Melalui kebebasan pasar dan kekuatan pilihanlah tujuan dapat dicapai secara damai.
