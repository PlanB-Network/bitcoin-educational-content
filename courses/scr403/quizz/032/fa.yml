question: نوع pair (drop iden) (take iden) چیست، و چه تابعی را نشان می‌دهد؟
answer: A × B ⊢ B × A — دو مؤلفهٔ یک جفت را جابه‌جا می‌کند.
wrong_answers:
  - A × B ⊢ A × B — هر دو مؤلفه را بدون تغییر عبور می‌دهد (تابع همانی).
  - "بدنوع: take iden و drop iden نوع‌های خروجی متفاوتی دارند که pair نمی‌تواند آن‌ها را ادغام کند."
  - (A × B) × (A × B) ⊢ B × A — pair نوع‌های ورودی دو زیرعبارت خود را ادغام می‌کند.
explanation: >-
  drop iden : A × B ⊢ B مؤلفهٔ دوم را استخراج می‌کند و take iden : A ×
  B ⊢ A مؤلفهٔ نخست را استخراج می‌کند. ترکیب‌گر pair فقط نیاز دارد که دو
  زیرعبارتش نوع ورودی یکسانی داشته باشند (اینجا A × B)؛ خروجی‌های آن‌ها می‌توانند
  متفاوت باشند و به‌صورت یک جفت بازگردانده می‌شوند. بنابراین روی ورودی ⟨a, b⟩
  این عبارت ⟨b, a⟩ را می‌دهد: تابع جابه‌جایی، از نوع A × B ⊢ B × A.
