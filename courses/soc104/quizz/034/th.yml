question: "ทำไม Rothbard จึงวิจารณ์วิสัยทัศน์เรื่องธรรมชาติมนุษย์ของกลุ่ม libertaires และเขาเสนอทางเลือกอะไร?"
answer: "เขากล่าวหาว่าพวกเขายึดมุมมอง 'noble savage' ที่ไร้เดียงสา และโต้แย้งว่าสังคมต้องใช้ทรัพย์สินส่วนตัวและแรงจูงใจที่ดีเพื่อชี้นำพฤติกรรมที่ขับเคลื่อนด้วยผลประโยชน์ของตน"
wrong_answers:
  - "เขาชื่นชมความเข้าใจเรื่องความร่วมมือของมนุษย์ของพวกเขา แต่โต้แย้งว่ารัฐขั้นต่ำยังจำเป็นต่อการบังคับใช้สัญญา"
  - "เขาเห็นด้วยว่ามนุษย์ดีโดยธรรมชาติ แต่ยืนยันว่ามีเพียงตลาดเสรีเท่านั้นที่จะนำความดีนั้นไปสู่กิจกรรมที่ก่อผลผลิตได้"
  - "เขาปฏิเสธการเน้นสิทธิส่วนบุคคลของพวกเขา และโต้แย้งแทนว่าชุมชนควรกำหนดมาตรฐานศีลธรรมร่วมกัน"
explanation: >-
  Rothbard วิจารณ์กลุ่ม libertaires ว่ารับเอาวิสัยทัศน์เกี่ยวกับธรรมชาติมนุษย์ที่ไร้เดียงสา คล้าย Rousseau ที่มองมนุษย์ว่าเป็นคนดีโดยธรรมชาติ เขาโต้แย้งแทนว่าผู้คนถูกนำทางด้วยผลประโยชน์ของตน และสังคมต้องถูกจัดระเบียบให้แรงจูงใจที่ดีชี้นำพฤติกรรม สิ่งนี้ต้องอาศัยการยอมรับและรับประกันทรัพย์สินส่วนตัว การยกเลิกรัฐไม่ได้หมายถึงการยกเลิกหน้าที่ของรัฐ ตำรวจและความยุติธรรมควรถูกจัดการโดยตลาดเสรีผ่านการแข่งขัน
reviewed: false
