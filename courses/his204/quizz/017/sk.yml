question: Hoci sa Richard Cantillon stal v roku 1708 francúzskym občanom, odkiaľ pochádzal?
answer: Z Írska
wrong_answers:
  - Zo Španielska
  - Z Anglicka
  - Z Nemecka
explanation: |
  Richard Cantillon bol írskeho pôvodu a francúzske štátne občianstvo získal neskôr, v roku 1708. Veľkú časť svojho života strávil vo Francúzsku a ovplyvnili ho francúzske ekonomické myšlienky jeho doby.
