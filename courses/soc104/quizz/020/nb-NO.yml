question: "Hva avslører den vertikale aksen i Nolan-diagrammet om det egentlige politiske spørsmålet?"
answer: "Den avslører om du vil påtvinge andre dine egne sensibiliteter gjennom staten, eller foretrekker at hver person står fritt til å bestemme selv"
wrong_answers:
  - "Den avslører om du støtter demokratisk styring eller foretrekker autoritært styre ved én enkelt leder"
  - "Den avslører om du identifiserer deg med progressive sosiale bevegelser eller med tradisjonelle religiøse institusjoner"
  - "Den avslører om din primære bekymring er nasjonal sikkerhet eller økonomisk velstand"
explanation: >-
  Den vertikale aksen avdekker det egentlige politiske spørsmålet: ikke om du er venstre eller høyre, men i hvilken grad du vil at staten skal gripe inn i å forme samfunnet etter dine verdier. Ønsker du å påtvinge andre dine sensibiliteter, eller foretrekker du at hver person står fritt til å bestemme selv? Denne innrammingen overskrider venstre-høyre-skillet og viser at begge leirer kan være like statistiske.
reviewed: false
