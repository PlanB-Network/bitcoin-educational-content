question: "Ako sa libertariánske poňatie slobody líši od centristického poňatia?"
answer: "Libertariáni chápu slobodu ako bezpodmienečnú axiómu, zatiaľ čo centristi obhajujú slobody oportunisticky podľa kontextu a efektívnosti"
wrong_answers:
  - "Libertariáni umožňujú štátu chrániť slobodu selektívne, zatiaľ čo centristi odmietajú akúkoľvek účasť štátu na ochrane individuálnych práv"
  - "Libertariáni zameriavajú slobodu iba na ekonomické otázky, zatiaľ čo centristi uplatňujú slobodu široko v spoločenských a kultúrnych oblastiach"
  - "Libertariáni a centristi zdieľajú rovnaký pohľad na slobodu, ale nezhodujú sa na veľkosti vlády potrebnej na jej presadzovanie"
explanation: >-
  Libertariáni definujú slobodu ako všeobecný, bezpodmienečný princíp, ktorý funguje ako axióma. Centristi naopak obhajujú určité slobody oportunistickým a kontextuálnym spôsobom bez uplatnenia akéhokoľvek všeobecného princípu. Centristický prístup odhaľuje inštrumentálne poňatie slobody, vždy podriadené pragmatickým cieľom, ako je efektívnosť, čo libertariáni zásadne odmietajú.
