question: "Mengapa Popper berargumen bahwa masyarakat terbuka tetap secara inheren rapuh meskipun memiliki keunggulan?"
answer: "Karena tanggung jawab yang disiratkan oleh individualisme dapat terasa menakutkan, menciptakan godaan untuk mencari perlindungan dalam proteksi komunal, otoritas, atau nostalgia terhadap masa lalu yang diidealkan"
wrong_answers:
  - "Karena masyarakat terbuka kekurangan kekuatan militer dan tidak dapat membela diri dari invasi oleh masyarakat tertutup"
  - "Karena institusi demokratis secara inheren tidak efisien dan akhirnya runtuh di bawah beban kompleksitas birokratis"
  - "Karena masyarakat terbuka mengizinkan terlalu banyak ketimpangan ekonomi, yang tak terelakkan mengarah pada revolusi dan pemasangan rezim otoriter"
explanation: >-
  Popper menekankan bahwa kerapuhan masyarakat terbuka berasal dari kerentanan psikologis. Tanggung jawab yang disiratkan oleh individualisme dapat terasa menakutkan dan berisiko karena seseorang harus membuat pilihannya sendiri dan dapat gagal. Ini menciptakan godaan untuk mencari perlindungan dalam proteksi komunal atau kecenderungan nostalgis menuju masa lalu yang diidealkan. Masyarakat terbuka menghadapi tantangan berkelanjutan dari dorongan komuniter dan godaan kekerasan yang berulang.
reviewed: false
