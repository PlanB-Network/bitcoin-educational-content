question: "ลิเบอร์ทาเรียนและอนุรักษนิยมมีจุดร่วมอะไร และอะไรที่แบ่งแยกพวกเขา?"
answer: "พวกเขามีความยึดมั่นร่วมกันต่อรัฐบาลจำกัดและการปฏิเสธความเท่าเทียมนิยมแบบบังคับ แต่ไม่เห็นพ้องกันเรื่อง interventionism ทางทหารและนโยบายสังคม"
wrong_answers:
  - "พวกเขาสนับสนุนนโยบายการค้าแบบ protectionist และการป้องกันประเทศร่วมกัน แต่ไม่เห็นพ้องกันเรื่องบทบาทของศาสนาในชีวิตสาธารณะ"
  - "พวกเขามีความมุ่งมั่นร่วมกันต่อภาษีแบบก้าวหน้าและโครงการสวัสดิการ แต่ไม่เห็นพ้องกันเรื่องนโยบายการย้ายถิ่นฐาน"
  - "พวกเขาคัดค้านการค้าเสรีและการทำให้ยาเสพติดถูกกฎหมายร่วมกัน แต่ไม่เห็นพ้องกันเรื่องขนาดของรัฐบาลกลาง"
explanation: >-
  ลิเบอร์ทาเรียนและอนุรักษนิยมต่างสนับสนุนรัฐบาลจำกัด ปฏิเสธความเท่าเทียมนิยมแบบบังคับ คัดค้านหนี้สาธารณะ และปกป้องสิทธิของรัฐย่อย อย่างไรก็ตาม ลิเบอร์ทาเรียนปฏิเสธ interventionism ทางทหารของ neoconservatives คัดค้านนโยบายสังคมและเงินอุดหนุนแบบอนุรักษนิยม ประณามการห้ามยาเสพติด และปฏิเสธ protectionism พันธมิตรนี้มีอยู่จริงแต่ตึงเครียดโดยเนื้อแท้
reviewed: false
