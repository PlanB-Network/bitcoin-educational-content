question: "pro-business වීම සහ pro-market වීම අතර වැදගත් වෙනස කුමක්ද?"
answer: "pro-business වීම කියන්නේ විශාල enterprises සහ state අතර alliance එකකට ප්‍රිය කිරීමයි, අතර pro-market වීම කියන්නේ state favoritism නැති free competition සඳහා සහාය දැක්වීමයි"
wrong_answers:
  - "pro-business වීම කියන්නේ small businesses සඳහා සහාය දැක්වීමයි, අතර pro-market වීම කියන්නේ multinational corporations සඳහා සහාය දැක්වීමයි"
  - "pro-business වීම කියන්නේ regulation සම්පූර්ණයෙන් විරුද්ධ වීමයි, අතර pro-market වීම කියන්නේ මධ්‍යස්ථ regulation පිළිගැනීමයි"
  - "pro-business වීම domestic industry වෙත අවධානය යොමු කරයි, අතර pro-market වීම international trade වෙත අවධානය යොමු කරයි"
explanation: >-
  Centrists pro-business වීමට නැඹුරු වෙති; එනම් විශාල enterprises සහ state අතර යම් ආකාරයක alliance එකකට ඔවුන් ප්‍රිය කරන අතර, එය pro-market වීමෙන් වෙනස් වේ. Pro-market වීම state favoritism හෝ corporate protectionism නැති free competition සඳහා සහාය දක්වයි. මෙම වෙනස තීරණාත්මකය, මන්ද pro-business policies monopolies සහ regulatory protections නිර්මාණය කර, ඇත්ත වශයෙන් free-market competition දුර්වල කළ හැකි බැවිනි.
reviewed: false
