question: "왜 좌우 축은 바스티아나 론 폴 같은 고전적 자유주의 사상가들을 배치하기에 부적절하다고 여겨지나요?"
answer: "고전적 자유주의는 경제적 자유와 개인적 자유를 모두 중시하지만, 좌파도 우파도 이를 완전히 포용하지 않기 때문입니다"
wrong_answers:
  - "고전적 자유주의자들은 항상 우파 경제 정책과 일치하고 모든 좌파 입장을 거부하기 때문입니다"
  - "고전적 자유주의자들은 좌파와 우파 이념의 온건한 버전을 모두 채택하는 중도파이기 때문입니다"
  - "고전적 자유주의자들은 모든 형태의 정부에 반대하므로 정치 사상가가 아니라 아나키스트이기 때문입니다"
explanation: >-
  좌우 축은 경제적 자유(일반적으로 우파)와 개인적 자유(일반적으로 좌파)를 동시에 옹호하는 입장을 수용할 수 없기 때문에 고전적 자유주의자들을 설명하는 데 실패합니다. 고전적 자유주의자들은 타협을 추구하는 중도파도 아니고, 아나키스트나 순수한 우파도 아닙니다. 그들은 단순히 일차원적 스펙트럼에 들어맞지 않습니다.
reviewed: false
