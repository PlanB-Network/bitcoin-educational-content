question: "Warum wurden totalitäre Regime als 'säkulare Religionen' beschrieben, und was zeigt dies über die Bedingungen, die notwendig sind, damit Totalitarismus existiert?"
answer: "Sie verlangen von Militanten einen quasi-religiösen Glauben und setzen Angst gegen Gegner ein, und Totalitarismus erfordert alle Merkmale gleichzeitig: unterdrückte Freiheiten, Einparteienherrschaft, gewaltsame Revolution und eine gelenkte Wirtschaft"
wrong_answers:
  - "Sie ersetzen traditionelle Gottesdienste durch Staatszeremonien, und Totalitarismus erfordert nur einen charismatischen Führer und militärische Kontrolle"
  - "Sie nutzen religiöse Institutionen, um die Staatsideologie durchzusetzen, und Totalitarismus kann entstehen, sobald eine einzelne politische Partei das Parlament dominiert"
  - "Sie versprechen spirituelle Erlösung durch politisches Handeln, und Totalitarismus existiert, sobald der Staat die Wirtschaft kontrolliert, unabhängig von politischen Freiheiten"
explanation: >-
  Raymond Aron beobachtete, dass totalitäre Regime auf zwei Prinzipien funktionieren: dem Glauben der Militanten und der Angst der Gegner. Dieser quasi-religiöse Fanatismus kennzeichnet sie über ihre unterschiedlichen Motivationen hinaus und brachte ihnen die Bezeichnung säkulare Religionen ein. Entscheidend ist, dass Totalitarismus alle definierenden Merkmale gleichzeitig erfordert: unterdrückte Freiheiten, unbegrenzte Autorität durch eine einzige Partei, gewaltsame Revolution und eine gelenkte Wirtschaft. Moderne Demokratien können einige dieser Merkmale aufweisen, aber Totalitarismus liegt nur vor, wenn alle zusammenkommen.
