question: Prečo je výmena podľa abbého de Saint-Pierre vždy a nevyhnutne hrou s pozitívnym súčtom?
answer: Ak sa dvaja ľudia slobodne rozhodnú vstúpiť do zmluvy, je to preto, že v tom každý z nich vidí výhodu
wrong_answers:
  - Čím častejšie tovar mení vlastníka, tým bohatší sa národ stáva
  - Národ, ktorý obchoduje, je vždy bohatší ako ten, ktorý žije v autarkii
  - Pretože to chce Boh
explanation: |
  Abbé de Saint-Pierre, tak ako iní liberálni myslitelia, veril, že dobrovoľná výmena je vzájomne prospešná. Ak sa dvaja ľudia dohodnú, že si niečo vymenia, je to preto, že obaja majú pocit, že niečo získajú, inak by to neurobili.
