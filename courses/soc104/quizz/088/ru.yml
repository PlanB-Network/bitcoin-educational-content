question: "Как различие Карла Поппера между открытыми и закрытыми обществами связано с спором между индивидуализмом и коллективизмом?"
answer: "Открытое общество признает право индивида судить самостоятельно через личные решения, тогда как закрытое общество является коллективистским, опирается на племенное мышление и отказ от критической свободы"
wrong_answers:
  - "Открытое общество — это общество, допускающее свободную торговлю через национальные границы, тогда как закрытое общество вводит тарифы и протекционистскую экономическую политику"
  - "Открытое общество управляется прямой демократией, где голосует каждый гражданин, тогда как закрытым обществом правит единственный наследственный монарх"
  - "Открытое общество прозрачно публикует все государственные документы, тогда как закрытое общество засекречивает информацию как государственную тайну"
explanation: >-
  Поппер определял закрытое общество как магическое или племенное общество, а открытое общество — как общество, в котором индивиды сталкиваются с личными решениями. Закрытое общество является коллективистским, опирается на племенное мышление с отказом от критической свободы и идеализацией статического порядка. Открытое общество отдает первенство свободному выбору ценностей, убеждений и отношений, прямо воплощая индивидуалистические принципы.
