question: "Che cosa credono i libertaires francesi (anarchici socialisti) riguardo alla proprietà privata?"
answer: "La proprietà privata e il capitalismo devono essere aboliti perché sono fonti di oppressione"
wrong_answers:
  - "La proprietà privata è un diritto naturale che precede lo Stato e deve essere protetta a ogni costo"
  - "La proprietà privata dovrebbe essere regolata dallo Stato ma mai eliminata completamente dalla società"
  - "La proprietà privata è accettabile solo quando è distribuita equamente tra tutti i membri di una comune"
explanation: >-
  I libertaires francesi, eredi dell'anarchismo socialista attraverso pensatori come Proudhon e Bakunin, sostengono che sia lo Stato sia la proprietà privata debbano essere aboliti come due fonti gemelle di oppressione. Questo è riassunto nella celebre formula di Proudhon "La proprietà è un furto." La prima risposta errata descrive la posizione libertariana, che è fondamentalmente opposta alla visione libertaire.
