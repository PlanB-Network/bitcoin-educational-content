question: "Hva setter libertarianere i sentrum for sin politiske filosofi?"
answer: "Etikk og lov"
wrong_answers:
  - "Økonomisk vekst og verdiskaping"
  - "Sosial likhet og kollektiv velferd"
  - "Nasjonal identitet og kulturell bevaring"
explanation: >-
  Libertarianere skiller seg fra alle andre politiske familier ved å sette etikk og lov i sentrum for sin filosofi, ikke økonomien. Når de forsvarer markedsøkonomien, er det mindre på grunn av dens evne til å produsere velstand enn på grunn av dens fremme av individuell frihet og ansvar. Økonomisk vekst er en sekundær gevinst, ikke det grunnleggende prinsippet.
