question: "Karl Marx ने utopian socialism और scientific socialism के बीच क्या भेद किया?"
answer: "उन्होंने शुरुआती फ्रांसीसी समाजवादियों पर काल्पनिक समाधान प्रस्तावित करने का आरोप लगाया, जबकि उनका scientific socialism ऐतिहासिक भौतिकवाद और वर्ग संघर्ष पर आधारित था"
wrong_answers:
  - "उन्होंने तर्क दिया कि utopian socialism अर्थशास्त्र पर बहुत अधिक केंद्रित था, जबकि scientific socialism ने सांस्कृतिक और कलात्मक रूपांतरण को प्राथमिकता दी"
  - "उन्होंने utopian socialists की व्यावहारिक प्रयोगों के लिए प्रशंसा की और scientific socialism की अत्यधिक अमूर्त तथा सैद्धांतिक होने के लिए आलोचना की"
  - "उन्होंने दावा किया कि utopian socialism हिंसक और क्रांतिकारी था, जबकि scientific socialism शांतिपूर्ण लोकतांत्रिक सुधार का पक्षधर था"
explanation: >-
  Marx ने Proudhon, Saint-Simon और Fourier जैसे शुरुआती फ्रांसीसी समाजवादियों पर utopian होने का आरोप लगाया, जो पूरी तरह काल्पनिक समाधान प्रस्तावित करते थे। उनका scientific socialism ऐतिहासिक भौतिकवाद पर आधारित था: यह विचार कि इतिहास वर्ग संघर्ष और उत्पादन के साधनों के अधिग्रहण के माध्यम से आगे बढ़ता है, जहाँ सभी सांस्कृतिक निरूपण उत्पादक शक्तियों और उत्पादन संबंधों से निर्धारित होते हैं।
