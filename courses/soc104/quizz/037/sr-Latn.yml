question: "Kako programi socijalne pomoći koje finansira država mogu proizvesti perverzne efekte, ilustrujući opasnost oslanjanja samo na namere?"
answer: "Mogu stvoriti zavisnost, ukloniti podsticaje za rad i predstavljati otimačinu jer novac najpre mora biti uzet od onih koji su proizveli bogatstvo"
wrong_answers:
  - "Podstiču prekomernu ličnu štednju, smanjuju potrošačku potrošnju i izazivaju deflaciju u široj ekonomiji"
  - "Jačaju privatno preduzetništvo prebacivanjem troškova rada na vladu i smanjenjem potrebe za konkurentnim zaradama"
  - "Toliko temeljno uklanjaju klasne razlike da društvena mobilnost postaje nepotrebna, a inovacije stagniraju"
explanation: >-
  Friedman upozorava da plemenite namere mogu proizvesti štetne posledice kada zanemare rigoroznu analizu ljudskih podsticaja. Programi pomoći koje finansira država rizikuju da stvore zavisnost, ne generišu podsticaj za rad i predstavljaju oblik otimačine jer sredstva najpre moraju biti uzeta od proizvođača bogatstva. Merljivi rezultati poput smanjenja siromaštva i efikasnosti moraju imati prednost nad plemenitim namerama.
