question: "Why did the cypherpunks argue that a digital currency with anonymous properties was necessary?"
answer: "Because cash, the primary anonymous transaction system, is disappearing in the digital society, and a digital replacement with the same privacy properties must be invented"
wrong_answers:
  - "Because existing digital payment systems were too slow and expensive, requiring a faster and cheaper alternative for online commerce"
  - "Because governments had already banned all forms of anonymous transactions and only a new technology could circumvent these laws"
  - "Because traditional banks refused to serve certain populations, making a universally accessible digital payment system an economic necessity"
explanation: >-
  The cypherpunk manifesto states that confidentiality in an open society requires anonymous transaction systems. Until the digital age, cash served as the primary system of this type. But in a digital society where cash is disappearing, a digital currency with the same properties of anonymity must be invented. This vision directly anticipated what Bitcoin would achieve.
reviewed: false
