question: "Đảng Xanh nằm ở đâu trên biểu đồ Nolan, và vì sao?"
answer: "Rất thấp trên biểu đồ, vì họ cho rằng lợi ích cá nhân không được đặt lên trên lợi ích tập thể của hành tinh"
wrong_answers:
  - "Ở đỉnh của biểu đồ, vì họ ưu tiên tự do cá nhân và ý thức môi trường ngang nhau"
  - "Ở trung tâm của biểu đồ, vì họ cân bằng tăng trưởng kinh tế với bảo vệ môi trường"
  - "Ở cực hữu, vì họ ủng hộ các giải pháp dựa trên thị trường cho các thách thức môi trường"
explanation: >-
  Đảng Xanh nằm rất thấp trên biểu đồ Nolan vì họ ủng hộ sự kiểm soát mạnh của nhà nước đối với cả các quyết định kinh tế lẫn cá nhân nhân danh phúc lợi của hành tinh. Họ đã thay thế đấu tranh giai cấp kiểu Marx bằng cuộc đấu tranh giữa con người và tự nhiên, và có xu hướng bảo vệ kiểm soát kinh tế, thậm chí cả việc bãi bỏ sở hữu tư nhân. Điều này đặt họ trong khu vực độc đoán, chứ không phải ở đỉnh hay ở trung tâm.
