question: 为什么 Simplicity 表达式被序列化为 DAG，而不是树？
answer: 为了防止指数级增长，因为共享子表达式只存储一次。
wrong_answers:
  - 因为普通树结构完全无法表示条件分支。
  - 为了在许多独立的多核处理器之间启用并行执行。
  - 因为 Liquid network 协议在这里严格规定必须使用 DAG 格式。
explanation: >-
  Simplicity 表达式天然形成树，随着复杂度增加，这些树可能会指数级增长。
  通过序列化为有向无环图（DAG），出现多次的子表达式只存储一次，
  并由多个父节点引用。这使实际程序大小保持线性增长，而不是指数级增长。
reviewed: false
