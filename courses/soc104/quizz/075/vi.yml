question: "Trong cả năm tranh luận kinh tế (thuế, lương tối thiểu, chăm sóc y tế, môi trường, trợ cấp), mô thức nhất quán nào phân biệt phương pháp trung dung với các lập trường của những gia đình chính trị khác?"
answer: "Những người trung dung từ chối cam kết với một nguyên tắc cố định và thay vào đó đòi hỏi phân tích thực nghiệm cùng đánh giá của chuyên gia để quyết định chính sách theo từng trường hợp, khiến cách tiếp cận của họ mang tính kỹ trị nội tại"
wrong_answers:
  - "Những người trung dung luôn chọn một vị trí ở giữa các lập trường xã hội chủ nghĩa và bảo thủ, chia đôi khác biệt trên mọi vấn đề một cách ngang nhau"
  - "Những người trung dung nhất quán ưu tiên tăng trưởng kinh tế hơn phúc lợi xã hội, đứng cùng những người theo chủ nghĩa tự do cá nhân về chính sách tài khóa trong khi đồng ý với những người xã hội chủ nghĩa về quản lý"
  - "Những người trung dung giao mọi quyết định kinh tế cho các tổ chức quốc tế và hiệp định thương mại thay vì đưa ra chính sách quốc gia độc lập"
explanation: >-
  Trong cả năm tranh luận kinh tế, cách tiếp cận trung dung đi theo cùng một mô thức: thay vì cam kết với một nguyên tắc ý thức hệ cố định, những người trung dung đòi hỏi bằng chứng thực nghiệm và đánh giá của chuyên gia trước khi đưa ra quyết định. Về thuế, mức phù hợp phải được xác định bằng phân tích. Về lương tối thiểu, mức đó phải được điều chỉnh một cách thực dụng. Về chăm sóc y tế, một sự pha trộn do chuyên gia hiệu chỉnh là lý tưởng. Về môi trường, chính sách phải cân bằng năng lực cạnh tranh. Về trợ cấp, từng trường hợp phải được đánh giá theo giá trị riêng của nó. Điều này khiến chủ nghĩa trung dung mang tính kỹ trị nội tại, khác với việc chỉ đơn giản chia đôi khác biệt hoặc phó thác cho các cơ quan quốc tế.
