question: Simplicity는 왜 Ethereum 같은 동적 gas 모델 대신 정적 분석을 사용하나요?
answer: 실행이 시작되기 전에 리소스 한계를 결정하여 예측 가능한 비용을 제공하기 위해서입니다.
wrong_answers:
  - 정적 분석이 개발자에게 구현하기 훨씬 빠르기 때문입니다.
  - Ethereum의 gas 모델 자체가 특허로 보호되어 사용할 수 없었기 때문입니다.
  - Simplicity 프로그램이 너무 짧아서 실제로는 metering이 전혀 필요하지 않기 때문입니다.
explanation: >-
  Simplicity의 정적 분석은 프로그램이 실행되기 전에 네트워크가 그 프로그램에
  필요한 계산량을 정확히 알 수 있게 합니다. 이는 동적 metering의 예측 불가능성을
  제거하고, 리소스 고갈을 통한 서비스 거부를 방지하며, 노드가 계산을 낭비하지
  않고 한계를 초과하는 프로그램을 거부할 수 있게 합니다.
reviewed: false
