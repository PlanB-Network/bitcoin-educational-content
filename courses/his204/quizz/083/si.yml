question: තම lettre sur la marque des fers තුළ Turgot වෙළඳපොළට වඩා හොඳින් දැනගැනීම අසම්භව බවට අදහස ප්‍රකාශ කරයි. 20 වන සියවසේදී එය වර්ධනය කළ Austrian ආර්ථික විද්‍යාඥයා කවුද?
answer: Friedrich Hayek
wrong_answers:
  - Carl Menger
  - Murray Rothbard
  - Ludwig von Mises
explanation: |
  Hayek වෙළඳපොළ මගින් සිදුවන "price discovery" යන අදහස වර්ධනය කළේය. එම අදහස අනුව වෙළඳපොළ යනු තොරතුරු සොයාගැනීමේ ක්‍රියාවලියක් වන අතර, මිල ගණන් යනු සැපයුම සහ ඉල්ලුම අතර අන්තර්ක්‍රියාවේ ප්‍රතිඵලයයි.