question: "Dış politika yaklaşımlarında neomuhafazakârları paleomuhafazakârlardan ayıran nedir?"
answer: "Neomuhafazakârlar demokrasiyi yaymak için askeri müdahaleciliği gerekçelendirirken, paleomuhafazakârlar daha izolasyonist bir dış politikayı savunur"
wrong_answers:
  - "Neomuhafazakârlar tüm askeri eylemlere karşı çıkıp diplomasiyi tercih ederken, paleomuhafazakârlar potansiyel tehditlere karşı önleyici saldırıları destekler"
  - "Neomuhafazakârlar yalnızca ekonomik yaptırımlara odaklanırken, paleomuhafazakârlar ortak askeri operasyonlar için uluslararası koalisyonlar kurmayı savunur"
  - "Neomuhafazakârlar ve paleomuhafazakârlar dış politika konusunda anlaşır, ancak iç ekonomik düzenleme konusunda keskin biçimde ayrışır"
explanation: >-
  2000'lerden itibaren neomuhafazakârlar, özellikle 11 Eylül 2001'den sonra, dünya çapında demokrasiyi yerleştirmek için askeri müdahaleciliği gerekçelendirmeye giderek daha fazla dahil oldu. Buna tepki olarak geleneksel muhafazakârlar kendilerini ayırmak için 'paleomuhafazakâr' etiketini sahiplendi. Paleomuhafazakârlar askeri müdahaleciliği eleştirir, daha izolasyonist bir dış politikayı savunur ve ulusal ve kültürel kimliğe daha fazla vurgu yapar.
