question: "Worauf konzentriert sich eine strukturelle Definition eines politischen Systems?"
answer: "Wie das System tatsächlich funktioniert und welche beobachtbaren Merkmale es hat, etwa das Ausmaß staatlicher Kontrolle"
wrong_answers:
  - "Die erklärten Ziele und edlen Absichten, die von den Gründern und Führern des Systems verkündet wurden"
  - "Die historischen Ursprünge der politischen Bewegung und die Biografien ihrer wichtigsten Denker"
  - "Die Anzahl der zugelassenen politischen Parteien und die Häufigkeit abgehaltener demokratischer Wahlen"
explanation: >-
  Strukturelle Definitionen konzentrieren sich darauf, wie politische Systeme tatsächlich funktionieren, und auf ihre beobachtbaren Merkmale. Zum Beispiel ist der Sozialismus strukturell durch die Allgegenwart des Staates gekennzeichnet. Dieser Ansatz steht im Gegensatz zu intentionalen Definitionen, die sich auf erklärte Motivationen und Ziele stützen. Der strukturelle Ansatz ermöglicht eine objektivere Bewertung auf der Grundlage messbarer Ergebnisse.
