question: "绿党在诺兰图上位于哪里，为什么？"
answer: "图中非常低的位置，因为他们认为个人利益不得优先于地球的集体利益"
wrong_answers:
  - "图的顶端，因为他们同等重视个人自由与环境意识"
  - "图的中央，因为他们平衡经济增长与环境保护"
  - "最右侧，因为他们支持以市场为基础的环境挑战解决方案"
explanation: >-
  绿党在诺兰图上位于非常低的位置，因为他们以地球福祉之名，偏好国家对经济与个人决策都实施强力控制。他们用人与自然之间的斗争取代了马克思主义的阶级斗争，并倾向于捍卫经济控制，甚至废除私有财产。这使他们位于威权区域，而不是顶端或中央。
