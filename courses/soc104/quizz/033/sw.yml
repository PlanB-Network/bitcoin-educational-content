question: "Mikakati ya kufuta dola inatofautianaje kati ya libertaires na libertarians?"
answer: "Libertaires kihistoria hutetea uharibifu wa kutumia vurugu, ilhali libertarians hutafuta kuondoa uhalali wa dola kupitia elimu na uasi wa kiraia"
wrong_answers:
  - "Libertaires hutumia uchaguzi wa kidemokrasia kuivunja dola, ilhali libertarians hupendelea mapinduzi ya silaha na hatua za moja kwa moja"
  - "Libertaires hujikita katika kujenga jumuiya mbadala, ilhali libertarians hufanya kazi ndani ya mfumo wa kisiasa uliopo ili kupitisha mageuzi"
  - "Libertaires na libertarians wote hukubaliana kwamba maandamano ya amani ndiyo njia pekee halali ya mabadiliko ya kijamii"
explanation: >-
  Libertaires kihistoria hutetea kuharibu dola na ubepari kwa kutumia vurugu, ikijumuisha ugaidi na mashambulio yaliyolengwa. Libertarians, kwa upande mwingine, hukataa vurugu za uchokozi kama zisizo halali. Mkakati wao unategemea kuiondolea dola uhalali kupitia hoja, mjadala, elimu, na uasi wa kiraia. Mbinu hizi zilizo tofauti kimsingi za kuleta mabadiliko zinaakisi kutokubaliana kwao kwa kina zaidi kwa kifalsafa.
