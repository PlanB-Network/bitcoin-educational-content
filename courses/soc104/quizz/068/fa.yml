question: "در مسئله تنظیم مقررات سلاح گرم، تفاوت حیاتی میان مواضع محافظه‌کارانه و لیبرتارین چیست؟"
answer: "هر دو میزانی از مقررات را می‌پذیرند، اما محافظه‌کاران خواهان قواعدی از سوی یک مرجع عمومی مشروع‌اند، در حالی که لیبرتارین‌ها می‌خواهند قواعد از میان کسانی که مستقیماً درگیرند، مانند انجمن‌های شهروندی و رقابت بازار، پدید آید"
wrong_answers:
  - "محافظه‌کاران با هرگونه مقررات سلاح گرم مخالف‌اند، در حالی که لیبرتارین‌ها کنترل سخت‌گیرانه دولتی را برای امنیت عمومی می‌پذیرند"
  - "محافظه‌کاران می‌خواهند سلاح گرم را کاملاً ممنوع کنند، در حالی که لیبرتارین‌ها از دسترسی نامحدود به همه سلاح‌ها حمایت می‌کنند"
  - "محافظه‌کاران موضع خود را بر حقوق فردی بنا می‌کنند، در حالی که لیبرتارین‌ها موضع خود را بر مسئولیت جمعی بنا می‌کنند"
explanation: >-
  هم محافظه‌کاران و هم لیبرتارین‌ها می‌پذیرند که نوعی مقررات برای حمل سلاح ضروری است. تفاوت حیاتی در این است که چه کسی آن قواعد را وضع می‌کند. محافظه‌کاران اصرار دارند که مقررات باید از سوی یک مرجع عمومیِ مأمور پاسداری از خیر مشترک صادر شود (از بالا به پایین). لیبرتارین‌ها استدلال می‌کنند که مقررات باید از میان کسانی که مستقیماً درگیرند پدید آید: متخصصان امنیت، انجمن‌های شهروندی و رقابت بازار (از پایین به بالا).
reviewed: false
