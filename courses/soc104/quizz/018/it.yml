question: "Qual è la definizione di statalismo presentata nel quadro di Nolan?"
answer: "Usare la legislazione per controllare e plasmare la società, sia in nome della difesa della civiltà, della classe lavoratrice, della natura o degli oppressi"
wrong_answers:
  - "Un sistema di governo in cui i funzionari eletti servono mandati fissi e il potere passa attraverso elezioni democratiche"
  - "La convinzione che solo un esercito forte possa proteggere la sovranità e l'integrità territoriale di una nazione"
  - "Una filosofia economica che dà priorità alle industrie nazionali rispetto alla concorrenza estera attraverso dazi e quote"
explanation: >-
  Lo statalismo è definito come l'uso della legislazione per controllare e plasmare la società. Sia la sinistra sia la destra lo praticano: alcuni in nome della difesa della civiltà, altri in nome della difesa della classe lavoratrice, della natura o degli oppressi. Anche i centristi lo approvano quando fa loro comodo. Lo statalismo non si limita alla politica militare, al protezionismo commerciale o al semplice fatto di avere governi eletti.
reviewed: false
