question: "Miks rõhutab Mises, et individualismi ei tohiks segi ajada eneseküllasuse või misantroopiaga?"
answer: "Sest individualism edendab koostööd ja assotsiatsiooni, tingimusel et need põhinevad osalejate vabal nõusolekul, tunnistades, et inimesed arendavad oma täieliku potentsiaali välja vabatahtlike suhete kaudu teistega"
wrong_answers:
  - "Sest individualism nõuab inimestelt kohustuslike kodanikuorganisatsioonidega liitumist, et tagada nende panus ühisesse hüvesse"
  - "Sest individualism tähendab, et iga inimene peab täielikult tuginema riigile teenuste puhul, mida ta ise pakkuda ei saa"
  - "Sest individualism nõuab, et inimesed konkureeriksid üksteisega kõigis valdkondades, et tõestada oma isiklikku üleolekut"
explanation: >-
  Mises rõhutab, et inimene on sotsiaalne olend. Individualism ei tähenda isolatsiooni. See edendab koostööd ja assotsiatsiooni tingimusel, et need põhinevad osalejate vabal nõusolekul. Inimene saab oma täieliku potentsiaali välja arendada ainult suhtes teistega, kuid see koostöö peab olema vabatahtlik, mitte kollektiivse võimu poolt peale surutud.
reviewed: false
