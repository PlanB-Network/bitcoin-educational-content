question: "چرا محور عمودی (بالا-پایین) در نمودار نولان بنیادین‌تر از محور افقی (چپ-راست) دانسته می‌شود؟"
answer: "زیرا شکاف واقعی میان کسانی را آشکار می‌کند که از بیشترین آزادی‌های فردی دفاع می‌کنند و کسانی که طرفدار بیشترین کنترل دولت هستند"
wrong_answers:
  - "زیرا تولید اقتصادی را دقیق‌تر از آن می‌سنجد که محور افقی سیاست‌های اجتماعی را می‌سنجد"
  - "زیرا بیشتر تعارضات سیاسی در طول تاریخ دربارهٔ هویت فرهنگی بوده‌اند نه حکمرانی"
  - "زیرا محور افقی فقط برای دموکراسی‌های مدرن کاربرد دارد، در حالی که محور عمودی جهانی است"
explanation: >-
  محور بنیادین، محور عمودی است، زیرا پرسش سیاسی اساسی را ثبت می‌کند: دولت تا چه اندازه باید کنش انسانی را کنترل کند؟ محور چپ-راست صرفاً حساسیت‌های متفاوتی را بازتاب می‌دهد (عدالت اجتماعی در برابر سنت)، اما هر دو طرف می‌توانند به عنوان دولت‌گرا جایگاه یکسانی روی محور عمودی داشته باشند. محور عمودی آشکار می‌کند که آیا کسی می‌خواهد چشم‌انداز خود را با زور تحمیل کند یا به آزادی فردی احترام می‌گذارد.
reviewed: false
