question: "Perché il modello bidimensionale sostiene che la maggior parte delle questioni politiche può essere divisa in categorie economiche e personali?"
answer: "Perché le questioni economiche riguardano ciò che fai come produttore e consumatore, mentre le questioni personali riguardano le tue relazioni private, le credenze e l'autonomia corporea"
wrong_answers:
  - "Perché tutti i dibattiti politici si riducono in ultima analisi a disaccordi sui livelli di tassazione e sulle pratiche religiose"
  - "Perché storicamente i governi regolano solo due cose: il mercato e l'esercito"
  - "Perché i filosofi politici hanno sempre separato le questioni materiali da quelle spirituali fin dall'antichità"
explanation: >-
  Il modello bidimensionale si basa sull'idea che le questioni politiche si dividano in due grandi categorie. Le libertà economiche coprono produzione, consumo, commercio, occupazione e gestione del denaro. Le libertà personali coprono relazioni private, opinioni, credenze e scelte sul proprio corpo e sulla propria mente. Questa separazione consente una mappatura delle posizioni politiche molto più sfumata rispetto a un singolo asse sinistra-destra.
