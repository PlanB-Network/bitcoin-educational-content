question: "Mida tähendab mõiste 'liberaal' Euroopa poliitilises traditsioonis?"
answer: "Laissez-faire majanduse, vähendatud riikliku sekkumise ja üksikisikuvabaduste toetajat"
wrong_answers:
  - "Riikliku sekkumise, avaliku tervisekindlustuse ja vaesusevastaste programmide pooldajat"
  - "Radikaalset anarhisti, kes taotleb valitsuse ja eraomandi täielikku kaotamist"
  - "Tsentristi, kes tasakaalustab kõigis poliitikavaldkondades võrdselt sotsialistlikke ja konservatiivseid seisukohti"
explanation: >-
  Euroopas on liberalism jäänud seotuks laissez-faire majanduspoliitika, vähendatud riikliku sekkumise ja üksikisikuvabaduste kaitsmisega. Esimene vale vastus kirjeldab Ameerika liberaale, kes on nihutanud mõiste tähendust interventsionismi poole. Euroopa liberalism ei ole ei anarhism ega tsentrism.
reviewed: false
