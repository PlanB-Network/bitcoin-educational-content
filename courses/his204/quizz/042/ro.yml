question: Din ce autor se inspiră Mirabeau în L'Ami des Hommes?
answer: Richard Cantillon
wrong_answers:
  - Vincent de Gournay
  - François Quesnay
  - Adam Smith
explanation: |
  Mirabeau deținuse un manuscris al Eseului asupra naturii comerțului în general al lui Cantillon timp de 15 ani și îl analizase cu răbdare. L'Ami des Hommes a fost conceput inițial ca un simplu comentariu la Eseul lui Cantillon. Convertirea sa la fiziocrația lui Quesnay a venit mai târziu, după publicarea cărții.
