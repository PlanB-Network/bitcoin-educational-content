question: Pentru ce ministru a lucrat Dupont de Nemours?
answer: Turgot
wrong_answers:
  - Necker
  - Calonne
  - Colbert
explanation: |
  Dupont de Nemours a lucrat alături de Turgot, ministrul de finanțe al lui Ludovic al XVI-lea, și a ajutat la punerea în aplicare a unui număr de reforme economice inspirate din fiziocrație.
