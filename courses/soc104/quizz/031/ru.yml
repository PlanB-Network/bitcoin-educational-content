question: "Что французские либертеры (социалистические анархисты) считают о частной собственности?"
answer: "Частная собственность и капитализм должны быть упразднены, потому что они являются источниками угнетения"
wrong_answers:
  - "Частная собственность — это естественное право, предшествующее государству, и её нужно защищать любой ценой"
  - "Частная собственность должна регулироваться государством, но никогда не должна полностью устраняться из общества"
  - "Частная собственность допустима только тогда, когда она распределена поровну между всеми членами коммуны"
explanation: >-
  Французские либертеры, наследники социалистического анархизма через таких мыслителей, как Прудон и Бакунин, считают, что и государство, и частная собственность должны быть упразднены как два взаимосвязанных источника угнетения. Это выражено в знаменитой формуле Прудона: «Собственность — это кража». Первый неправильный ответ описывает либертарианскую позицию, которая фундаментально противоположна взгляду либертеров.
