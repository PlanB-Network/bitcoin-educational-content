question: 在 Simplicity 中，布尔类型（𝟚）是如何定义的？
answer: 作为和类型 𝟙 + 𝟙，正好保存两个值（false 和 true）。
wrong_answers:
  - 作为积类型 𝟙 × 𝟙，那样就只会保存一个值。
  - 作为一种直接内置在语言中的特殊原始类型。
  - 作为一种仅限取值 0 和 1 的 32 位整数类型。
explanation: >-
  布尔类型 𝟚 被定义为 𝟙 + 𝟙，即两个单位类型的和。
  带左标签的值 σᴸ⟨⟩ 表示 false（0），带右标签的值 σᴿ⟨⟩ 表示
  true（1）。这是一种只由单位类型和和类型构造器构成的一位数据类型——
  不需要积类型构造器。
reviewed: false
