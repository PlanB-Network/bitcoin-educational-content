question: Care personaj reprezintă veriga lipsă dintre Boisguilbert și fiziocrați?
answer: Vincent de Gournay
wrong_answers:
  - Voltaire
  - Turgot
  - Colbert
explanation: |
  Vincent de Gournay i-a influențat atât pe Boisguilbert, cât și pe fiziocrați, răspândind idei liberale și criticând intervenția excesivă a statului în economie.
