question: "Wat is het belangrijkste onderscheid tussen pro-business en pro-markt zijn?"
answer: "Pro-business pleitbezorgers zoeken staatsinterventie om specifieke bedrijven tegen faillissement te beschermen, terwijl pro-markt pleitbezorgers deregulering steunen en bedrijven laten falen zodat de markt zich natuurlijk kan reorganiseren"
wrong_answers:
  - "Pro-business pleitbezorgers richten zich op grote ondernemingen, terwijl pro-markt pleitbezorgers zich uitsluitend richten op het ondersteunen van kleine bedrijven en startups"
  - "Pro-business is een linkse positie die werknemerscoöperaties bevoordeelt, terwijl pro-markt een rechtse positie is die privaat eigendom bevoordeelt"
  - "Pro-business pleitbezorgers wijzen alle concurrentie af, terwijl pro-markt pleitbezorgers door de overheid gereguleerde concurrentie tussen goedgekeurde ondernemingen steunen"
explanation: >-
  De pro-business positie ziet concurrentie als een bestuursinstrument dat via regels wordt verkregen, en rechtvaardigt subsidies en reddingsoperaties om banenverlies te voorkomen. In de pro-business visie is de markt kwetsbaar en heeft zij staatsredding nodig. Pro-markt pleitbezorgers zien concurrentie als het natuurlijke resultaat van vrije onderneming, wat deregulering impliceert en bedrijven laat falen, omdat falen de markt in staat stelt zich natuurlijk te reorganiseren en ruimte opent voor bekwamere actoren.
