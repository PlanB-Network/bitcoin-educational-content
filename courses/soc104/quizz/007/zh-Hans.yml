question: "法币体系如何强化统治者与被统治者之间的分野？"
answer: "它让政府能够通过创造货币来资助无限支出，而这会通过通货膨胀使储蓄贬值"
wrong_answers:
  - "它让公民通过民主选举与公投直接控制货币政策"
  - "它防止政府借贷，迫使政府只能依赖税收取得收入"
  - "它将新创造的货币平均分配给所有公民，以刺激经济增长"
explanation: >-
  法币被描述为国家权力扩张的基石，因为它让政府能够借款，并推动银行印刷新货币。由此产生的通货膨胀会使人们的储蓄贬值，让最富有、最有权势的实体受益。它并没有赋予公民货币控制权，也没有防止借贷或平等分配货币。
