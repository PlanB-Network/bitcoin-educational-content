question: "Nguyên tắc chỉ đạo nào đã định hướng các lá phiếu của Frederic Bastiat trong Quốc hội?"
answer: "Thúc đẩy các quyền tự do cá nhân và kinh tế, đồng thời giảm sự can thiệp của chính phủ"
wrong_answers:
  - "Bảo vệ quyền lực hoàng gia và gìn giữ các truyền thống quân chủ"
  - "Thúc đẩy các chính sách xã hội chủ nghĩa nhằm phân phối lại của cải công bằng hơn"
  - "Một chiến lược trung dung nhằm thỏa hiệp giữa các phe cánh tả và cánh hữu"
explanation: >-
  Bastiat bỏ phiếu dựa trên một nguyên tắc nền tảng: thúc đẩy các quyền tự do cá nhân và kinh tế trong khi giảm sự can thiệp của chính phủ. Ông không phải là một người trung dung cơ hội, cũng không phải là người bảo hoàng hay người xã hội chủ nghĩa. Ông bỏ phiếu cùng bất kỳ bên nào đề xuất các biện pháp phù hợp với tự do và chính phủ giới hạn.
reviewed: false
