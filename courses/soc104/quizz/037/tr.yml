question: "Rothbard libertaire'lerin insan doğası vizyonunu neden eleştirdi ve hangi alternatifi önerdi?"
answer: "Onları naif bir 'soylu vahşi' görüşe sahip olmakla suçladı ve toplumun, çıkarcı davranışı yönlendirmek için özel mülkiyet ve iyi teşvikler kullanması gerektiğini savundu"
wrong_answers:
  - "İnsan işbirliğine ilişkin anlayışlarını övdü, ancak sözleşmeleri uygulamak için asgari bir devletin hâlâ gerekli olduğunu savundu"
  - "İnsanların doğal olarak iyi olduğu konusunda onlarla hemfikir oldu, ancak yalnızca serbest piyasaların bu iyiliği üretken faaliyete yönlendirebileceğinde ısrar etti"
  - "Bireysel haklara yaptıkları vurguyu reddetti ve bunun yerine toplulukların ahlaki standartları kolektif olarak tanımlaması gerektiğini savundu"
explanation: >-
  Rothbard, libertaire'leri insan doğasına, doğal olarak iyi olduğuna dair naif, Rousseau'cu bir vizyon benimsemekle eleştirdi. Bunun yerine insanların özçıkar tarafından yönlendirildiğini ve toplumun, iyi teşviklerin davranışı yönlendireceği şekilde örgütlenmesi gerektiğini savundu. Bu, özel mülkiyetin tanınmasını ve güvence altına alınmasını gerektirir. Devleti ortadan kaldırmak, onun işlevlerini ortadan kaldırmak anlamına gelmez; polis ve adalet, rekabet yoluyla serbest piyasa tarafından yönetilmelidir.
