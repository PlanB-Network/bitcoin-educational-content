question: "Aký je kľúčový rozdiel medzi minarchistami a anarchokapitalistami v rámci libertarianizmu?"
answer: "Minarchisti akceptujú minimálny štát pre obranu, súdnictvo a políciu, zatiaľ čo anarchokapitalisti chcú privatizovať všetky štátne funkcie"
wrong_answers:
  - "Minarchisti odmietajú všetky formy vlády, zatiaľ čo anarchokapitalisti akceptujú obmedzenú štátnu reguláciu trhov"
  - "Minarchisti uprednostňujú progresívne zdanenie pre základné služby, zatiaľ čo anarchokapitalisti odmietajú akékoľvek zdanenie"
  - "Minarchisti sa zameriavajú iba na ekonomickú slobodu, zatiaľ čo anarchokapitalisti obhajujú ekonomické aj spoločenské slobody"
explanation: >-
  Minarchisti veria, že štát by mal byť obmedzený na základné funkcie, ako sú obrana, súdnictvo a polícia („štát nočného strážnika“), zatiaľ čo anarchokapitalisti tvrdia, že aj tieto funkcie by mali byť privatizované a spravované prostredníctvom dobrovoľnej trhovej konkurencie. Ich nezhoda sa týka viac praktickej implementácie než základných etických princípov. Obe tendencie zdieľajú rovnaké libertariánske hodnoty vlastníctva seba samého a neagresie.
