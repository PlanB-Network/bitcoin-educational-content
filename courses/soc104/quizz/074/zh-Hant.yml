question: "在補貼辯論的脈絡中，「道德風險」是什麼概念，而哪個政治家族提出這項關切？"
answer: "道德風險是當公司透過補貼被阻止失敗時，走向不負責任的誘因，因為最終由納稅人付錢；這項關切由自由至上主義者提出"
wrong_answers:
  - "道德風險是受補貼公司會遷往稅收較低國家並帶走工作的風險；這項關切由保守主義者提出"
  - "道德風險是政府官員會因選擇哪些公司獲得補貼而腐敗的危險；這項關切由中間派提出"
  - "道德風險是公司在接受公共資金後剝削工人的倫理問題；這項關切由社會主義者提出"
explanation: >-
  自由至上主義者主張，補貼與救助會製造道德風險：當公司被阻止失敗時，它會鼓勵不負責任與魯莽，因為錯誤決策不會帶來後果。到頭來，是納稅人付錢，而自由至上主義者認為這深刻不正義。這個概念不同於其他政治家族提出的企業遷移、官員腐敗或工人剝削等關切。
reviewed: false
