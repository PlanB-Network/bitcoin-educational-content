question: Ce abordează Voltaire în L'Homme aux quarante écus?
answer: Teoria fiscală a fiziocraților
wrong_answers:
  - Teoria monetară a fiziocraților
  - Teoria politică a fiziocraților
  - Teoria valorii la fiziocrați
explanation: |
  Voltaire critică teoria fiscală a fiziocraților în „L'Homme aux quarante écus”, un basm filosofic în care batjocorește impozitul unic pe pământ propus de fiziocrați.
