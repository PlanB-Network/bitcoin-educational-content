question: Care dintre acești autori a fost inspirat în mod deosebit de Gournay?
answer: Turgot
wrong_answers:
  - Josiah Child
  - François Quesnay
  - Adam Smith
explanation: |
  Turgot a fost puternic influențat de ideile lui Gournay, în special de apărarea libertății economice și de critica intervenției statului.
