question: "Как культурно консервативный либертарианец относится к поведению, которое он морально не одобряет?"
answer: "Он выступает против такого поведения и отговаривает от него через убеждение и пример, но без обращения к принудительной силе закона"
wrong_answers:
  - "Он поддерживает местные государственные запреты на такое поведение, одновременно выступая против запретов на федеральном уровне"
  - "Он полностью молчит о таком поведении, считая, что любая форма неодобрения нарушает индивидуальную свободу"
  - "Он выступает за общественные трибуналы, способные наказывать за такое поведение вне формальной правовой системы"
explanation: >-
  Культурно консервативный либертарианец может морально не одобрять определенное поведение, но не выступает за юридический запрет действий, совершаемых по согласию и без агрессии. Он может не любить такие действия, выступать против них и активно отговаривать от них, но всегда через убеждение, образование и пример, а не через принудительную силу закона. Речь не идет о молчании или создании альтернативных механизмов принуждения.
