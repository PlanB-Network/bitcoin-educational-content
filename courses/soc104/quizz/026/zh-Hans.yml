question: "为什么美国的古典自由主义者从 1960 年代起开始称自己为 'libertarians'？"
answer: "为了把自己与美国的 liberals 区分开来，因为后者的含义已经转向国家干预主义"
wrong_answers:
  - "为了与民主党及其进步社会项目结盟"
  - "为了表示他们支持 Lyndon B. Johnson 的 Great Society 改革"
  - "为了采用一种受欧洲社会主义运动启发的更激进革命身份"
explanation: >-
  在美国，'liberal' 一词转变为指 Big Government 和国家干预的支持者，尤其是在 New Deal 和 Great Society 之后。古典自由主义者采用 'libertarian' 这一标签，以保存其哲学的原初含义。他们是在与美国 liberals 拉开距离，而不是与他们结盟。
reviewed: false
