question: "Warum gilt die vertikale Achse (oben-unten) im Nolan-Diagramm als grundlegender als die horizontale Achse (links-rechts)?"
answer: "Weil sie die wahre Trennlinie zwischen denen sichtbar macht, die maximale individuelle Freiheiten verteidigen, und denen, die maximale staatliche Kontrolle bevorzugen"
wrong_answers:
  - "Weil sie die Wirtschaftsleistung genauer misst, als die horizontale Achse Sozialpolitiken misst"
  - "Weil die meisten politischen Konflikte der Geschichte eher kulturelle Identität als Regierungsführung betrafen"
  - "Weil die horizontale Achse nur für moderne Demokratien gilt, während die vertikale Achse universell ist"
explanation: >-
  Die grundlegende Achse ist die vertikale, weil sie die wesentliche politische Frage erfasst: In welchem Ausmaß sollte der Staat menschliches Handeln kontrollieren? Die Links-rechts-Achse spiegelt lediglich unterschiedliche Sensibilitäten wider (soziale Gerechtigkeit vs. Tradition), doch beide Seiten können auf der vertikalen Achse dieselbe etatistische Position einnehmen. Die vertikale Achse zeigt, ob jemand seine Vision mit Gewalt durchsetzen will oder individuelle Freiheit respektiert.
reviewed: false
