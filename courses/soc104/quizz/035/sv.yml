question: "Varför kritiserade Rothbard libertärernas syn på den mänskliga naturen, och vilket alternativ föreslog han?"
answer: "Han anklagade dem för att ha en naiv syn på den 'ädle vilden' och hävdade att samhället måste använda privat egendom och goda incitament för att vägleda egenintresserat beteende"
wrong_answers:
  - "Han berömde deras förståelse av mänskligt samarbete men hävdade att en minimal stat fortfarande var nödvändig för att verkställa kontrakt"
  - "Han höll med om att människor är naturligt goda men insisterade på att endast fria marknader kunde kanalisera denna godhet till produktiv verksamhet"
  - "Han avvisade deras betoning på individuella rättigheter och hävdade i stället att gemenskaper kollektivt borde definiera moraliska normer"
explanation: >-
  Rothbard kritiserade libertärerna för att anta en naiv, Rousseau-liknande syn på den mänskliga naturen som naturligt god. Han hävdade i stället att människor styrs av egenintresse, och att samhället måste organiseras så att goda incitament vägleder beteendet. Detta kräver att privat egendom erkänns och garanteras. Att avskaffa staten betyder inte att avskaffa dess funktioner; polis och rättsväsende bör hanteras av den fria marknaden genom konkurrens.
reviewed: false
