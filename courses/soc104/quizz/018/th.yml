question: "คำนิยามของรัฐนิยมตามที่นำเสนอในกรอบ Nolan คืออะไร?"
answer: "การใช้กฎหมายเพื่อควบคุมและปั้นแต่งสังคม ไม่ว่าจะในนามของการปกป้องอารยธรรม ชนชั้นแรงงาน ธรรมชาติ หรือผู้ถูกกดขี่"
wrong_answers:
  - "ระบบการปกครองที่เจ้าหน้าที่ที่มาจากการเลือกตั้งดำรงตำแหน่งตามวาระที่กำหนด และมีการเปลี่ยนผ่านอำนาจผ่านการเลือกตั้งประชาธิปไตย"
  - "ความเชื่อที่ว่ามีเพียงกองทัพที่เข้มแข็งเท่านั้นที่สามารถปกป้องอธิปไตยและบูรณภาพแห่งดินแดนของชาติได้"
  - "ปรัชญาเศรษฐกิจที่ให้ความสำคัญกับอุตสาหกรรมแห่งชาติเหนือการแข่งขันจากต่างประเทศผ่านภาษีนำเข้าและโควตา"
explanation: >-
  รัฐนิยมถูกนิยามว่าเป็นการใช้กฎหมายเพื่อควบคุมและปั้นแต่งสังคม ทั้งฝ่ายซ้ายและฝ่ายขวาต่างปฏิบัติเช่นนี้: บางคนทำในนามของการปกป้องอารยธรรม ส่วนคนอื่นทำในนามของการปกป้องชนชั้นแรงงาน ธรรมชาติ หรือผู้ถูกกดขี่ แม้แต่สายกลางก็เห็นชอบกับสิ่งนี้เมื่อมันเหมาะกับพวกเขา รัฐนิยมไม่ได้จำกัดอยู่แค่นโยบายทหาร protectionism ทางการค้า หรือเพียงการมีรัฐบาลที่มาจากการเลือกตั้ง
reviewed: false
