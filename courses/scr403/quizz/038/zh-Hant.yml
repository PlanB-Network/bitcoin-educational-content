question: 一個 half-agg-verify jet 以 Writer 效果的形式記錄一組元組的集合。在可交換／冪等／單位性的檢驗之下，這個集合設計達成了什麼，又還缺少什麼？
answer: "可交換且冪等（正如 Simplicity 所要求），但非單位性：捨棄一次呼叫會丟失它的元組，並跳過一個簽章。"
wrong_answers:
  - 冪等且單位性，但非可交換，因為聚合必須以簽署順序來組合 r 分量。
  - 三者兼具，所以最佳化器可以毫無風險地自由複製、重新排序或捨棄這些呼叫。
  - 可交換但非冪等，因為將同一個元組記錄兩次會要求兩個聚合 s 分量。
explanation: >-
  把 writer 日誌視為一個集合，會使該效果成為冪等且可交換的，因為集合插入本身就同時具備這兩種性質 —— 這正是 Simplicity 對每個效果所要求的那兩項。單位性仍然遙不可及：就像 Failure 一樣，這個寫入會影響交易的有效性，因為唯有當一個聚合 s 分量涵蓋了每一個被記錄的元組時，該交易才有效。因此，執行這個寫入的運算式並不能僅僅因為它的單位輸出未被使用就被捨棄，否則它的元組會從半聚合驗證中悄悄消失。
reviewed: false
