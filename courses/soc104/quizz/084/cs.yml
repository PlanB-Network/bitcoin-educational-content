question: "Jaké je klíčové rozlišení mezi tím být pro-business a být pro-market?"
answer: "Zastánci pro-business usilují o státní zásah na ochranu konkrétních firem před selháním, zatímco zastánci pro-market podporují deregulaci a dovolují firmám selhat, aby se trh mohl přirozeně reorganizovat"
wrong_answers:
  - "Zastánci pro-business se zaměřují na velké korporace, zatímco zastánci pro-market se zaměřují výhradně na podporu malých podniků a startupů"
  - "Pro-business je levicová pozice, která upřednostňuje zaměstnanecká družstva, zatímco pro-market je pravicová pozice, která upřednostňuje soukromé vlastnictví"
  - "Zastánci pro-business odmítají veškerou konkurenci, zatímco zastánci pro-market podporují vládou regulovanou konkurenci mezi schválenými podniky"
explanation: >-
  Pozice pro-business chápe konkurenci jako nástroj vládnutí získaný prostřednictvím regulací a ospravedlňuje dotace a záchranné balíčky, aby zabránila ztrátám pracovních míst. V pohledu pro-business je trh křehký a potřebuje státní záchranu. Zastánci pro-market vidí konkurenci jako přirozený výsledek svobodného podnikání, což implikuje deregulaci a umožnění podnikům selhat, protože selhání umožňuje trhu se přirozeně reorganizovat a otevírá pole schopnějším aktérům.
