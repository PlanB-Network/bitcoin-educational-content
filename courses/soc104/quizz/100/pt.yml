question: "O que os libertários acreditam sobre a capacidade dos indivíduos de tomar decisões?"
answer: "Os indivíduos têm tanto o direito quanto a responsabilidade de tomar suas próprias decisões sobre suas vidas"
wrong_answers:
  - "Os indivíduos devem tomar decisões somente depois de consultar representantes eleitos que entendem as implicações de políticas públicas"
  - "Os indivíduos geralmente são incapazes de tomar boas decisões e precisam de orientação especializada de instituições governamentais"
  - "Os indivíduos devem tomar decisões econômicas livremente, mas deferir ao Estado em todos os assuntos sociais e culturais"
explanation: >-
  Do ponto de vista libertário, os indivíduos têm tanto o direito quanto a responsabilidade de tomar suas próprias decisões. Isso contrasta com famílias políticas convencionais da esquerda à direita, que acreditam que o governo deve tomar algumas ou muitas das decisões importantes na vida de um indivíduo e na vida econômica em geral.
reviewed: false
