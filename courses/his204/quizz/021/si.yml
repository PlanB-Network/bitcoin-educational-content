question: Abbé de Saint-Pierre වෙත පොතක් කැප කළ 19වන සියවසේ ප්‍රංශ ආර්ථික විද්‍යාඥයා කවුද?
answer: Gustave de Molinari
wrong_answers:
  - Frédéric Bastiat
  - Jean-Baptiste Say
  - Léon Walras
explanation: |
  19වන සියවසේ liberal ආර්ථික විද්‍යාඥයෙකු වූ Gustave de Molinari, Abbé de Saint-Pierre පිළිබඳ පොතක් ලියා, liberal චින්තනයේ සහ සාමය ආරක්ෂා කිරීමේ පූර්වගාමියෙකු ලෙස ඔහුගේ භූමිකාව අවධාරණය කළේය.