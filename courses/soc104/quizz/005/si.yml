question: "Nolan රූපසටහනේ අක්ෂ දෙක මොනවාද?"
answer: "පුද්ගලික නිදහස්තා මනින සිරස් අක්ෂයක් සහ ආර්ථික නිදහස්තා මනින තිරස් අක්ෂයක්"
wrong_answers:
  - "වමෙන් දකුණට යන තිරස් අක්ෂයක් සහ අධිකාරවාදී සිට ප්‍රජාතන්ත්‍රවාදී දක්වා යන සිරස් අක්ෂයක්"
  - "ධනය මනින සිරස් අක්ෂයක් සහ අධ්‍යාපන මට්ටම් මනින තිරස් අක්ෂයක්"
  - "සමාජවාදයෙන් ධනවාදයට යන තිරස් අක්ෂයක් සහ සම්ප්‍රදායෙන් ප්‍රගතියට යන සිරස් අක්ෂයක්"
explanation: >-
  David Nolan තම රූපසටහන නිශ්චිත අක්ෂ දෙකකින් සැලසුම් කළේය: පුද්ගලික නිදහස්තා (සිරස්) සහ ආර්ථික නිදහස්තා (තිරස්). මෙම ද්වි-මාන ප්‍රවේශය අතිසරල කළ වම-දකුණ රේඛාව වෙනුවට පැමිණ, නිදහසේ ප්‍රධාන කාණ්ඩ දෙක වෙන් කිරීමෙන් දේශපාලන මතවාදවල සංකීර්ණතාව වඩා හොඳින් ග්‍රහණය කරයි.
reviewed: false
