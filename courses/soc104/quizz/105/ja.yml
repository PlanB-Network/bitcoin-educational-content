question: "このコース全体の議論を考えると、Bitcoin はリバタリアンによる構成主義批判、サイファーパンクの行動へのコミットメント、そして道徳的自律の個人主義的擁護を、どのように同時に体現しているか？"
answer: "Bitcoin は、中央計画された貨幣を自生的な市場秩序に置き換え（反構成主義）、金融の自由という抽象的理想を動くコードへ変換し（サイファーパンク的行動）、主権的所有とプライバシーを個人に取り戻す（道徳的自律）"
wrong_answers:
  - "Bitcoin は、民主的統治を用いて貨幣政策を設定し（反構成主義）、金融の自由について教育コンテンツを公開し（サイファーパンク的行動）、個人がプロトコル変更に投票できるようにする（道徳的自律）"
  - "Bitcoin は、あらゆる金融規制を廃止し（反構成主義）、規制緩和のためにロビー活動する開発者コミュニティを作り（サイファーパンク的行動）、富裕層に貨幣政策へのより大きな支配を与える（道徳的自律）"
  - "Bitcoin は、サーバーインフラを複数国に分散し（反構成主義）、オープンソースライセンスを用いて技術を自由に共有し（サイファーパンク的行動）、政治的反対意見のための匿名ソーシャルメディアプラットフォームを提供する（道徳的自律）"
explanation: >-
  Bitcoin は、このコースで探究された 3 つの知的伝統の交差点に位置している。
  中央計画された法定通貨を、中央計画者が支配できない自生的で分散型の貨幣秩序に置き換えることで、反構成主義的な議論を体現している。
  金融の自由とプライバシーという抽象的理想を動く技術へ変えることで、コードを書くというサイファーパンクの要請を満たしている。
  そして、主権的所有を可能にし、労働の果実を保護し、プライバシーを守り、各人が自分自身の人生の主人でいられるようにすることで、道徳的自律の個人主義的擁護に役立っている。
reviewed: false
