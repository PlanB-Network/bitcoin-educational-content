question: "중도주의적 실용주의 안에는 어떤 숨겨진 역설이 있나요?"
answer: "실용주의 자체가 일종의 독단, 즉 사회를 이끌 역량은 전문가들에게만 있다는 드러나지 않은 확신에 의존합니다"
wrong_answers:
  - "중도주의자들은 온건하다고 주장하지만 연립정부에서는 일관되게 좌파 정당들과 제휴합니다"
  - "중도주의 정책은 균형 잡힌 것처럼 보이지만 항상 환경 보호보다 경제 성장을 선호합니다"
  - "중도주의자들은 이데올로기를 거부하지만 경제 결정을 내릴 때 경직된 자유시장 원칙을 채택합니다"
explanation: >-
  중도주의적 실용주의의 역설은 그것이 합리적 전문성을 위해 이데올로기를 거부한다고 주장하지만, 바로 그 주장이 보이지 않고 드러나지 않은 교의, 즉 오직 기술관료들만이 올바른 결정을 내릴 수 있다는 생각에 의존한다는 점입니다. 전문가들만이 사회를 이끌어야 한다는 이 확신은 중도주의자들이 그것을 그렇게 인식하지 않더라도 그 자체로 이데올로기적 헌신입니다.
