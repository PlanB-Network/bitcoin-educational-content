question: "Kako Green New Deal predstavlja savremenu evoluciju demokratskog socijalizma?"
answer: "Koristi ekološke brige kao novo opravdanje za državnu intervenciju i konfiskaciju privatnih prihoda, podređujući individualni interes kolektivnom planetarnom zdravlju"
wrong_answers:
  - "U potpunosti napušta tradicionalnu socijalističku ekonomiju u korist slobodnotržišnih rešenja za ekološke probleme kroz trgovinu ugljenikom"
  - "Odbacuje državnu intervenciju i umesto toga oslanja se na dobrovoljnu individualnu akciju i inovacije privatnog sektora za rešavanje klimatskih promena"
  - "Predstavlja raskid sa socijalizmom jer daje prioritet zaštiti životne sredine nad svim brigama za socijalnu pravdu i zaposlenje"
explanation: >-
  Green New Deal spaja ekološke brige sa društvenim ciljevima, kombinujući ekološku tranziciju sa socijalnom pravdom, garancijama zaposlenja i ojačanim javnim uslugama. Individualni interes podređen je kolektivnom interesu definisanom planetarnim zdravljem. U svojoj osnovi, on pruža novo retoričko pakovanje koje opravdava državnu intervenciju i konfiskaciju privatnih prihoda, više ne samo u ime socijalne pravde već i u ime životne sredine.
