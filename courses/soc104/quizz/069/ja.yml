question: "なぜリバタリアンは課税に反対するのですか？"
answer: "課税は財産権の道徳的侵害であり、同意なしに他者の財産を奪う国家による窃盗の一形態だからである"
wrong_answers:
  - "税は経済的に非効率であり、常に失業率の上昇につながるからである"
  - "課税は外国投資を妨げ、国の競争力を弱めるからである"
  - "累進課税制度は、最も多くの雇用を生み出す富裕層を不当に標的にするからである"
explanation: >-
  課税に対するリバタリアンの反対は、経済的である前に道徳的です。リバタリアンは、課税を国家による窃盗の一形態であり、私有財産への妨げと見なします。なぜなら、それは同意なしに他者の財産を奪うことから成るからです。課税に反対する経済的議論もあり得ますが、リバタリアンの根本的な議論は、効率性や競争力の計算ではなく、それが財産権を侵害するという原則に基づいています。
reviewed: false
