question: "Как консерватизм относится к свободам в экономической и общественной сферах?"
answer: "Сильные свободы в экономической сфере, но слабые свободы в общественной сфере"
wrong_answers:
  - "Слабые свободы и в экономической, и в общественной сферах ради сохранения традиционного социального порядка"
  - "Сильные свободы в общественной сфере, но слабые свободы в экономической сфере"
  - "Равные и неограниченные свободы в обеих сферах при минимальном государственном вмешательстве любого рода"
explanation: >-
  Консерватизм демонстрирует дихотомию, зеркально противоположную социализму. В экономической сфере консерваторы защищают свободный рынок, предпринимательство и частную собственность. В общественной сфере ограничения оправдываются сохранением традиционных моральных норм и социальной стабильности. Третий неверный ответ описывает социалистическую модель, которая является противоположной.
reviewed: false
