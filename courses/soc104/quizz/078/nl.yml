question: "Wat krijgt voorrang boven vrijheid in de conservatieve politieke filosofie?"
answer: "Orde en traditie, die stevig moeten zijn gevestigd voordat vrijheid kan worden gewaardeerd"
wrong_answers:
  - "Sociale rechtvaardigheid en gelijkheid, die moeten worden gegarandeerd voordat individuen werkelijk vrij kunnen zijn"
  - "Economische efficiëntie en pragmatische resultaten, die bepalen wanneer vrijheid gepast is"
  - "Individuele eigendomsrechten, die moeten worden beschermd voordat enige andere vrijheid wordt verleend"
explanation: >-
  Voor conservatieven krijgen orde en traditie voorrang boven vrijheid. Zij stellen dat te veel vrijheid chaos en sociale wanorde veroorzaakt, zodat vrijheid pas kan worden gewaardeerd zodra orde stevig is gevestigd. Dit contrasteert met de socialistische visie die rechtvaardigheid prioriteit geeft, of met de centristische focus op efficiëntie.
