question: "What does a structural definition of a political system focus on?"
answer: "How the system actually functions and its observable characteristics, such as the degree of state control"
wrong_answers:
  - "The stated goals and noble intentions declared by the system's founders and leaders"
  - "The historical origins of the political movement and the biographies of its key thinkers"
  - "The number of political parties allowed and the frequency of democratic elections held"
explanation: >-
  Structural definitions focus on how political systems actually function and on their observable characteristics. For example, socialism is structurally characterized by the omnipresence of the state. This approach contrasts with intentional definitions, which rely on stated motivations and goals. The structural approach allows for more objective evaluation based on measurable results.
