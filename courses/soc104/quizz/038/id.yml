question: "Mengapa definisi berbasis niat dari sistem politik dianggap bermasalah untuk tujuan analitis?"
answer: "Definisi tersebut menciptakan kebingungan konseptual karena semua sistem mengklaim mengejar tujuan serupa seperti keadilan, kesetaraan, dan kebebasan"
wrong_answers:
  - "Definisi tersebut terlalu presisi dan kaku, sehingga tidak memberi ruang bagi evolusi alami gerakan politik dari waktu ke waktu"
  - "Definisi tersebut terlalu berfokus pada hasil ekonomi dan mengabaikan dimensi budaya serta sosial dari kehidupan politik"
  - "Definisi tersebut bergantung pada dokumen pemerintah rahasia yang jarang tersedia bagi peneliti independen"
explanation: >-
  Definisi berbasis niat bergantung pada motivasi dan tujuan yang dinyatakan, tetapi setiap sistem politik mengklaim mengejar keadilan, kesetaraan, dan kebebasan. Ini membuat sistem-sistem tersebut mustahil dibedakan satu sama lain. Sebaliknya, analisis struktural mengevaluasi sistem berdasarkan konsekuensi empiris yang dapat diukur dan sarana yang mereka gunakan, sehingga mengungkap sifat sejatinya di balik retorika.
