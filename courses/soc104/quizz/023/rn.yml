question: "Paleo-libertarianism ni iki?"
answer: "Isanganya rihuza ukwamirira kure Leta nk'isoko ry'agahato n'ugukomeza inzego za kera n'imiterere y'ikibano ishingiye ku bushake"
wrong_answers:
  - "Umuhari w'abaharanira umwidegemvyo wanka indangagaciro za kera zose kandi ugashigikira iterambere ry'ikibano rikaze"
  - "Ingengabitekerezo y'abagumyabanga ikoresha ububasha bwa Leta kugira ngo ishikamishe indangagaciro za kera mu gihe yemera umwidegemvyo mutoyi w'ubutunzi"
  - "Filozofiya yo hagati irondera ubwumvikane buringaniye hagati y'ubutunzi bwa gisosiyalisite na politike y'ikibano y'abagumyabanga"
explanation: >-
  Paleo-libertarianism ihuza ukwamirira kure Leta nk'isoko ry'inzego ritera agahato n'ugukomeza inzego za kera be n'uguhitamwo imiterere y'ikibano ishingiye ku bushake aho guhitamwo ububasha bwa Leta. Itandukana na neo-libertarianism kuko irushiriza kugirira impuhwe indangagaciro za kera. Umu paleo-libertarian ntarwanya ko imiryango yitunganya ku ngingo za gisosiyalisite canke iz'ubuzima rusangi; yanka gusa ko iyo miryango ihatira bose indangagaciro zayo biciye ku nguvu z'itegeko.
