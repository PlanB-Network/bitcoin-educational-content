question: "Warum wird monetäre Inflation als versteckte Steuer beschrieben, die ohne Zustimmung der Bürger auferlegt wird?"
answer: "Weil staatliche Geldschöpfung die Währung entwertet, sodass Menschen mit demselben Betrag weniger kaufen können, die meisten aber nicht erkennen, dass steigende Preise staatliche Politik statt natürliche Marktkräfte widerspiegeln"
wrong_answers:
  - "Weil Zentralbanken heimlich Gebühren auf jede über das Bankensystem abgewickelte Transaktion erheben, ohne sie den Kontoinhabern offenzulegen"
  - "Weil Regierungen Geld drucken und es nur an wohlhabende Personen verteilen, während sie die Armen durch höhere Umsatzsteuern auf lebensnotwendige Güter besteuern"
  - "Weil Inflation dadurch verursacht wird, dass private Unternehmen Preise erhöhen, um Gewinne zu steigern, was als inoffizielle Steuer auf Verbraucher funktioniert"
explanation: >-
  Die Einspeisung von Geld in das System führt zu Währungsentwertung, bei der derselbe Betrag weniger kauft, weil das neue Geld kein echtes Wirtschaftswachstum widerspiegelt. Die meisten Menschen sehen nicht, dass staatliche Politik zu steigenden Preisen geführt hat, die schlicht die Folge von Währungsentwertung sind. Das kommt legalisiertem Diebstahl und institutionalisierter Ausplünderung gleich, verarmt die Mittelschicht, während die Wohlhabenden neues Geld über spekulative Vermögenswerte abschöpfen.
reviewed: false
