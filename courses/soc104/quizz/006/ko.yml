question: "좌파와 우파 정당은 겉보기의 대립에도 불구하고 어떤 공통점을 공유하나요?"
answer: "둘 다 규제와 세금을 통해 국가가 사람들의 삶을 지배할 권리를 옹호합니다"
wrong_answers:
  - "둘 다 경제 문제에서 국가 개입의 완전한 폐지를 주장합니다"
  - "둘 다 사회의 집단적 조직보다 개인의 자유를 우선시합니다"
  - "둘 다 정부 지출의 도구로 통화 정책을 사용하는 것을 거부합니다"
explanation: >-
  대립하는 것처럼 보이지만, 좌파와 우파는 국가 개입에 대한 선호를 공유합니다. 둘 다 자유 시장을 비판하고 규제와 세금을 통해 국가가 사람들의 삶을 지배할 권리를 옹호합니다. 좌파는 시장을 불평등의 원천으로 비판하는 반면, 우파는 시장을 주권에 대한 위협으로 보지만, 둘 다 해결책을 국가에서 찾습니다.
reviewed: false
