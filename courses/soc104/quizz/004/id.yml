question: "Dalam berlian Nolan, posisi mana yang berada di puncak dan merepresentasikan kebebasan maksimum?"
answer: "Libertarianisme, yang mendukung kebebasan ekonomi dan pribadi terbesar"
wrong_answers:
  - "Konservatisme, yang mendukung nilai-nilai tradisional dan kebebasan ekonomi"
  - "Sentrisme, yang menyeimbangkan semua posisi politik secara pragmatis"
  - "Sosialisme, yang mendukung kebebasan pribadi dan kesetaraan sosial"
explanation: >-
  Libertarianisme menempati puncak berlian Nolan sebagai kebalikan dari statisme. Ia merepresentasikan mereka yang mendukung tingkat kebebasan ekonomi dan pribadi terbesar. Konservatisme berada di kanan (kebebasan ekonomi tinggi, kebebasan pribadi rendah), sosialisme di kiri (kebebasan pribadi tinggi, kebebasan ekonomi rendah), dan sentrisme di tengah.
