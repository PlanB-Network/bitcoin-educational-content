question: "दक्षिणपंथ किस विषय पर कानून बनाना चाहता है?"
answer: "नैतिकता और धर्म, पारंपरिक संस्थाओं और सामाजिक पदानुक्रमों को संरक्षित रखने की इच्छा से प्रेरित होकर"
wrong_answers:
  - "अर्थव्यवस्था और वित्तीय बाज़ार, असमानता घटाने और संपत्ति का पुनर्वितरण करने की इच्छा से प्रेरित होकर"
  - "विज्ञान और शिक्षा, सार्वजनिक स्कूलों में क्या पढ़ाया जाता है इसे नियंत्रित करने की इच्छा से प्रेरित होकर"
  - "अंतरराष्ट्रीय व्यापार और कूटनीति, विदेशों में राष्ट्रीय प्रभाव बढ़ाने की इच्छा से प्रेरित होकर"
explanation: >-
  दक्षिणपंथ व्यक्तिगत नैतिकता और पारंपरिक मूल्यों को प्राथमिकता देता है। वह मानता है कि सभ्यता कुछ पारंपरिक संस्थाओं और सामाजिक पदानुक्रमों पर बनी है जिन्हें संरक्षित रखा जाना चाहिए, और वह नैतिकता और धर्म पर कानून बनाना चाहता है। अर्थव्यवस्था पर कानून बनाने पर ध्यान दक्षिणपंथ नहीं, वामपंथ देता है। विज्ञान, शिक्षा और व्यापार नीति दक्षिणपंथ के लिए यहाँ वर्णित प्राथमिक केंद्र नहीं हैं।
reviewed: false
