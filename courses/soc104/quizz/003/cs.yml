question: "Jaký společný bod sdílejí levicové a pravicové politické strany navzdory svému zdánlivému protikladu?"
answer: "Obě hájí právo státu řídit životy lidí prostřednictvím regulací a daní"
wrong_answers:
  - "Obě prosazují úplné zrušení státních zásahů do ekonomických záležitostí"
  - "Obě upřednostňují individuální svobodu před kolektivním uspořádáním společnosti"
  - "Obě odmítají používání měnové politiky jako nástroje vládních výdajů"
explanation: >-
  Ačkoli se zdají být v opozici, levice i pravice sdílejí preferenci státních zásahů. Obě kritizují volný trh a hájí právo státu řídit životy lidí prostřednictvím regulací a daní. Levice kritizuje trhy jako zdroj nerovnosti, zatímco pravice je vnímá jako hrozbu pro suverenitu, ale obě se obracejí na stát jako na zdroj řešení.
reviewed: false
