question: Al cărui rege a fost Sully ministru?
answer: Henric al IV-lea
wrong_answers:
  - Ludovic al XIV-lea
  - Ludovic al XV-lea
  - Ludovic al XIII-lea
explanation: |
  Maximilien de Béthune, duce de Sully, a fost ministrul principal al lui Henric al IV-lea. El a jucat un rol esențial în restabilirea finanțelor regale și în redresarea economică a regatului după Războaiele Religioase.
