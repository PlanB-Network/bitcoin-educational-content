question: L'Ami des Hommes තුළ Mirabeau ආභාෂය ගන්නේ කුමන කතුවරයාගෙන්ද?
answer: Richard Cantillon
wrong_answers:
  - Vincent de Gournay
  - François Quesnay
  - Adam Smith
explanation: |
  Mirabeau වසර 15ක් Cantillonගේ සාමාන්‍ය වාණිජයේ ස්වභාවය පිළිබඳ රචනයෙහි අත්පිටපතක් සතුව තබාගෙන එය ඉවසීමෙන් විශ්ලේෂණය කර තිබුණි. L'Ami des Hommes මුලින් සැලසුම් කර තිබුණේ Cantillonගේ රචනය පිළිබඳ සරල විවරණයක් ලෙසය. Quesnayගේ Physiocracy වෙත ඔහුගේ හැරීම පසුව, පොත දැනටමත් ප්‍රකාශයට පත් වූ පසු සිදු විය.
