question: "構造的アプローチは、社会主義とリバタリアニズムの根本的な違いをどのように定義しますか？"
answer: "社会主義は規制、計画、統制を通じて国家を優先し、リバタリアニズムは最小限の国家介入を通じて個人を優先する"
wrong_answers:
  - "社会主義は農村の農業共同体を優先し、リバタリアニズムは都市の産業発展を好む"
  - "社会主義は民主的選挙への支持によって定義され、リバタリアニズムはあらゆる形の政治参加を拒否する"
  - "社会主義は外交政策と国際協力に注目し、リバタリアニズムは国内の経済問題だけに関心を持つ"
explanation: >-
  構造的には、社会主義は規制し、計画し、統制する国家の遍在によって特徴づけられる。リバタリアニズムは、経済と私生活への最小限の国家介入によって定義され、個人の自由と自由市場の優位へ向かう。この構造的区別は、それぞれの体制が掲げる意図を比較するよりも、分析上はるかに有用である。
reviewed: false
