question: "사회주의는 사회적 영역과 경제적 영역에서 자유를 어떻게 다르게 다루나요?"
answer: "사회주의는 사회적 영역에서는 강한 자유를 선호하지만 경제적 영역에서는 약한 자유를 선호합니다"
wrong_answers:
  - "사회주의는 사회적 영역과 경제적 영역 모두에서 모든 자유를 똑같이 제한합니다"
  - "사회주의는 강한 경제적 자유를 선호하지만 사회질서 유지를 위해 사회적 자유를 제한합니다"
  - "사회주의는 두 영역 모두에서 무제한의 자유를 부여하고 균형 유지를 자발적 협력에 의존합니다"
explanation: >-
  사회주의 사상에는 사회적 자유와 경제적 자유 사이의 근본적 이분법이 있습니다. 사회적 자유는 강하지만, 국가 통제, 계획, 부의 재분배에 대한 강조 때문에 경제적 자유는 약합니다. 세 번째 오답은 리버테리언 이상을 설명하고, 두 번째는 사회주의의 거울상인 보수주의 패턴을 설명합니다.
reviewed: false
