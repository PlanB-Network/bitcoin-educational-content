question: "Какъв е типът на програма на Simplicity?"
answer: 1 ⊢ 1 (unit към unit) — без смислен вход или изход; страничните ефекти извършват I/O.
wrong_answers:
  - TxEnv ⊢ Bool — тя приема транзакционни данни и връща булева стойност за валидност.
  - 2^256 ⊢ 2^256 — тя приема хеш вход и връща нова хеш изходна стойност.
  - Всеки тип A ⊢ B — програмите могат да имат напълно произволни входни и изходни типове.
explanation: >-
  Програма на Simplicity се дефинира като израз от тип 1 ⊢ 1. Ефектът Reader улавя
  входа на транзакционната среда, докато ефектът Failure определя успеха или провала.
  Тези странични ефекти обработват целия I/O вместо самите типове на Simplicity.
reviewed: true
