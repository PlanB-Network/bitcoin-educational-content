question: "Какое различие Карл Маркс проводил между утопическим социализмом и научным социализмом?"
answer: "Он обвинял ранних французских социалистов в предложении воображаемых решений, тогда как его научный социализм был основан на историческом материализме и классовой борьбе"
wrong_answers:
  - "Он утверждал, что утопический социализм был слишком сосредоточен на экономике, тогда как научный социализм ставил в приоритет культурное и художественное преобразование"
  - "Он хвалил социалистов-утопистов за их практические эксперименты и критиковал научный социализм за чрезмерную абстрактность и теоретичность"
  - "Он заявлял, что утопический социализм был насильственным и революционным, тогда как научный социализм поддерживал мирную демократическую реформу"
explanation: >-
  Маркс обвинял ранних французских социалистов, таких как Прудон, Сен-Симон и Фурье, в том, что они были утопистами, предлагавшими чисто воображаемые решения. Его научный социализм опирался на исторический материализм: идею о том, что история развивается через классовую борьбу и присвоение средств производства, где все культурные представления обусловлены производительными силами и производственными отношениями.
