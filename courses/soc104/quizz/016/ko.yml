question: "좌파는 무엇을 입법하고 규제하려 하나요?"
answer: "경제입니다. 이는 경제적 자유, 자본주의, 자유 시장에 대한 적대감에서 비롯됩니다"
wrong_answers:
  - "개인적 도덕과 종교 관행입니다. 이는 전통적 제도를 보존하려는 욕구에서 비롯됩니다"
  - "이민과 국경입니다. 이는 문화적 정체성과 주권에 대한 우려에서 비롯됩니다"
  - "기술과 혁신입니다. 이는 자동화가 인간 노동자를 대체할 것이라는 두려움에서 비롯됩니다"
explanation: >-
  좌파는 사회 정의와 평등, 특히 경제적 차원의 평등을 우선시합니다. 이것이 경제적 자유, 자본주의, 자유 시장에 대한 적대감과, 경제를 입법하고 규제하려는 욕구로 이어집니다. 반대로 우파는 도덕과 종교에 대해 입법하려 합니다. 이민과 기술 규제는 여기에서 설명하는 주된 초점이 아닙니다.
reviewed: false
