question: "Ni kubera iki Mises ashimika ko individualism idakwiye kwitiranywa no kwikwiza canke kwanka abantu?"
answer: "Kuko individualism iteza imbere gukorana n'ukwifatanya, igihe vyubakiye ku kwemera kwidegemvya kw'ababigiramwo uruhara, ikemera ko abantu bashikira ubushobozi bwabo bwuzuye biciye mu migenderanire y'ubushake n'abandi"
wrong_answers:
  - "Kuko individualism isaba abantu kwinjira mu mashirahamwe y'abanyagihugu ategetswe kugira ngo hamenyekane ko batanga umusanzu ku neza rusangi"
  - "Kuko individualism isobanura ko umuntu wese ategerezwa kwiheka rwose kuri leta ku bikorwa adashobora kwikorera"
  - "Kuko individualism isaba ko abantu bahiganwa hagati yabo mu mice yose kugira ngo berekane ko baruta abandi"
explanation: >-
  Mises ashimika ko umuntu ari ikiremwa kibana n'abandi. Individualism ntisobanura kwigunga. Iteza imbere gukorana n'ukwifatanya ku ngingo y'uko vyubakiye ku kwemera kwidegemvya kw'ababigiramwo uruhara. Umuntu ashobora guteza imbere ubushobozi bwiwe bwuzuye gusa mu migenderanire n'abandi, ariko uko gukorana gutegerezwa kuba ukw'ubushake aho guhatirwa n'ububasha rusangi.
