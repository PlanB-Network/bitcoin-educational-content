question: Care este teza din spatele nuvelei Chinki, histoire cochininoise, aplicabilă și altor țări?
answer: Că reglementările corporatiste împiedică oamenii să muncească și descurajează efortul
wrong_answers:
  - Că Cochinchina este un exemplu de guvernare liberală
  - Că negoțul cu grâne trebuie să fie liber prin toate porturile
  - Cochinchina este o țară bogată în resurse naturale
explanation: |
  „Chinki” critică reglementările corporatiste care frânează activitatea economică și descurajează inițiativa individuală.
