question: "Как философия шифропанков о централизации связана с либертарианским принципом согласия как фундаментальной нормы справедливости?"
answer: "Шифропанки рассматривают любую централизацию как основанную на принуждении, а не на согласии, что перекликается с либертарианской позицией: ничто не может быть справедливым, если навязано централизованной властью через силу"
wrong_answers:
  - "Шифропанки считают централизацию приемлемой, когда она одобрена демократическим большинством голосов, что соответствует либертарианскому уважению к конституционному управлению"
  - "Шифропанки поддерживают временную централизацию во время чрезвычайных ситуаций, отражая либертарианский взгляд, что индивидуальные права можно приостанавливать, когда коллектив находится под угрозой"
  - "Шифропанки выступают против централизации только в технологических системах, принимая политическую централизацию как необходимую для обеспечения прав собственности и договоров"
explanation: >-
  Шифропанки доверяют децентрализованным криптографическим системам, а не централизованным институтам. Любая централизация воспринимается как основанная на принуждении, а не на согласии. Это напрямую перекликается с либертарианской философией, согласно которой согласие является фундаментальной нормой справедливости. Ничто не может быть справедливым, если оно навязано централизованной властью через силу, поэтому они стремились строить децентрализованные сети, где ни одна отдельная сущность не могла бы навязать свою волю.
reviewed: false
