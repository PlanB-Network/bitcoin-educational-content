question: "Mistä oikeisto haluaa säätää lakeja?"
answer: "Moraalista ja uskonnosta, taustalla halu säilyttää perinteiset instituutiot ja sosiaaliset hierarkiat"
wrong_answers:
  - "Taloudesta ja rahoitusmarkkinoista, taustalla halu vähentää eriarvoisuutta ja jakaa varallisuutta uudelleen"
  - "Tieteestä ja koulutuksesta, taustalla halu valvoa, mitä julkisissa kouluissa opetetaan"
  - "Kansainvälisestä kaupasta ja diplomatiasta, taustalla halu laajentaa kansallista vaikutusvaltaa ulkomailla"
explanation: >-
  Oikeisto asettaa etusijalle henkilökohtaisen moraalin ja perinteiset arvot. Se katsoo, että sivilisaatio rakentuu tiettyjen perinteisten instituutioiden ja sosiaalisten hierarkioiden varaan, jotka täytyy säilyttää, ja se haluaa säätää lakeja moraalista ja uskonnosta. Vasemmisto, ei oikeisto, keskittyy säätämään lakeja taloudesta. Tiede, koulutus ja kauppapolitiikka eivät ole oikeiston tässä kuvattu ensisijainen painopiste.
