question: "Hvilket grunnleggende skille delte sosialister fra begynnelsen av det tjuende århundre og framover?"
answer: "Revolusjonære sosialister som søkte å gripe makten gjennom vold, versus reformistiske sosialister som forfulgte endring gjennom demokratiske valg"
wrong_answers:
  - "Urbane sosialister som fokuserte på industriarbeidere, versus rurale sosialister som organiserte jordbrukskommuner"
  - "Nasjonalistiske sosialister som prioriterte sitt eget land, versus internasjonalistiske sosialister som tok til orde for global revolusjon"
  - "Intellektuelle sosialister som skrev teoretiske tekster, versus aktivistiske sosialister som organiserte arbeiderstreiker"
explanation: >-
  Fra begynnelsen av det tjuende århundre skilte et grunnleggende skille revolusjonære sosialister, som motsatte seg eiendomsrettigheter og søkte å ødelegge det kapitalistiske samfunnet gjennom vold eller proletariatets diktatur, fra reformistiske sosialister, som forfulgte sosial rettferdighet gjennom demokratiske valg og beskatning mens de midlertidig aksepterte kapitalismen. Denne splittelsen formet hele den etterfølgende historien til sosialistiske bevegelser.
reviewed: false
