question: "#ᶜ(comp f g) の計算では 128 バイトをハッシュします。comp タグを 2 回、その後に両方の子 CMR です。なぜそれでも最大 1 回の SHA-256 圧縮呼び出しで済むのでしょうか？"
answer: 最初の 64 バイトブロックは定数 tag∥tag であり、その midstate は一度だけ事前計算されます。圧縮されるのは子 CMR を保持するブロックだけです。
wrong_answers:
  - SHA-256 の最終の長さパディングブロックを落とすだけで、128 バイト全体が 1 回の呼び出しに収まる。
  - 2 つの子 CMR は XOR されて 1 つの 32 バイトダイジェストになり、入力が単一ブロックに縮小される。
  - SHA-256-midstate は、128 バイトのメッセージブロックを 1 パスで吸収するワイドブロック変種である。
explanation: >-
  SHA-256 の圧縮関数は固定長の 64 バイトブロックを処理するため、
  128 バイト入力には通常 2 回の呼び出しが必要です（完全な SHA-256 では長さパディングのために
  さらに 1 回必要です）。各コンビネータの最初のブロックは定数 tag∥tag なので、
  その midstate は一度だけ事前計算してキャッシュできます。その後、各式に必要なのは、
  その子の CMR を保持するブロックに対する新たな圧縮 1 回だけです。midstate は
  最終のパディングブロックも落としますが、それだけではまだ 2 回の圧縮が残ります。
  それを最大 1 回にまで下げるのは、事前計算されたタグ midstate です。
reviewed: false
