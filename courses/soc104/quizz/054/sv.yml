question: "Varför började klassiska liberaler i USA kalla sig 'libertarianer' under nittonhundratalet?"
answer: "Eftersom amerikansk 'liberalism' hade tagits över av växande statlig interventionism och välfärdsstaten"
wrong_answers:
  - "Eftersom de ville distansera sig från europeiska monarkistiska traditioner"
  - "Eftersom termen 'liberal' blev förknippad med anarkism och politiskt våld"
  - "Eftersom nya handelsavtal krävde en särskild politisk identitet för förespråkare av fri marknad"
explanation: >-
  Under nittonhundratalet inträffade en grundläggande förskjutning när laissez-faire-principer gradvis övergavs till förmån för välfärdsstaten. Amerikansk "liberalism" kom att betyda något helt annat än klassisk liberalism, genom att omfatta statlig interventionism. Klassiska liberaler antog termen "libertarian" för att bevara distinktionen. Denna omprofilering hade inget att göra med europeisk monarkism, anarkistiskt våld eller handelsavtal.
reviewed: false
