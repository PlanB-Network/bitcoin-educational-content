question: "¿Cuál es el desacuerdo clave entre los libertarios y otras familias políticas cuando comparten los mismos objetivos?"
answer: "El desacuerdo es sobre los medios: los libertarios rechazan las soluciones coercitivas y favorecen el intercambio voluntario mediante el proceso de mercado"
wrong_answers:
  - "El desacuerdo es sobre los fines: los libertarios persiguen objetivos distintos, como la riqueza individual en lugar del bienestar social"
  - "El desacuerdo es sobre el ritmo: los libertarios quieren alcanzar los mismos objetivos más lentamente mediante reformas graduales"
  - "El desacuerdo es sobre el alcance: los libertarios quieren aplicar las mismas políticas solo a nivel local en lugar de nacional"
explanation: >-
  Los libertarios pueden coincidir con socialistas, conservadores y centristas en ciertos objetivos, como defender a los oprimidos o promover la cohesión social. El desacuerdo no reside en los fines, sino en los medios. Los libertarios rechazan todas las soluciones coercitivas que buscan uniformizar prácticas y regulaciones, y en su lugar defienden el poder de elección y la libertad responsable mediante intercambios libres y descentralizados fundados en contratos voluntarios.
