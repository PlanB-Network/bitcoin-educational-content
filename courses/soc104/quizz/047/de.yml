question: "Wer wird oft als Gründungsfigur des modernen Konservatismus genannt?"
answer: "Edmund Burke, der dafür eintrat, Institutionen und Traditionen gegen die radikalen Veränderungen der Französischen Revolution zu bewahren"
wrong_answers:
  - "Karl Marx, der im neunzehnten Jahrhundert die Theorie des Klassenkampfs und des historischen Materialismus entwickelte"
  - "John Locke, der im siebzehnten Jahrhundert die Theorie der natürlichen Rechte und des Gesellschaftsvertrags formulierte"
  - "Adam Smith, der The Wealth of Nations schrieb und die Disziplin der klassischen Ökonomie begründete"
explanation: >-
  Edmund Burke wird wegen seiner Opposition gegen die Französische Revolution oft als Gründungsfigur des Konservatismus genannt. Seine Reflections on the Revolution in France (1790) verteidigten Klugheit und schrittweise Reformen gegenüber radikalem Wandel. Er glaubte, die Gesellschaft solle nicht durch einen völligen Neuanfang voranschreiten, sondern durch inkrementelle Reformen, die bewährte Institutionen und Traditionen bewahren.
reviewed: false
