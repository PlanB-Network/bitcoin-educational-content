question: "Quale terreno comune condividono libertari e conservatori, e che cosa li divide?"
answer: "Condividono l'attaccamento a un governo limitato e il rifiuto dell'egualitarismo imposto, ma divergono sull'interventismo militare e sulle politiche sociali"
wrong_answers:
  - "Condividono il sostegno a politiche commerciali protezionistiche e alla difesa nazionale, ma divergono sul ruolo della religione nella vita pubblica"
  - "Condividono l'impegno per una tassazione progressiva e programmi di welfare, ma divergono sulla politica migratoria"
  - "Condividono l'opposizione al libero scambio e alla legalizzazione delle droghe, ma divergono sulle dimensioni del governo federale"
explanation: >-
  Libertari e conservatori difendono entrambi il governo limitato, rifiutano l'egualitarismo imposto, si oppongono al debito pubblico e difendono i diritti degli stati. Tuttavia, i libertari rifiutano l'interventismo militare dei neoconservatori, si oppongono alle politiche sociali conservatrici e ai sussidi, condannano la proibizione delle droghe e rifiutano il protezionismo. L'alleanza è reale ma intrinsecamente tesa.
