question: "リバタリアン運動の中で、Cato Institute、Mises Institute、Libertarian Party の役割はどのように異なるのか？"
answer: "Cato Institute は公共政策提案に、Mises Institute は教育と学術出版に、Libertarian Party は選挙政治に焦点を当てる"
wrong_answers:
  - "Cato Institute は政治キャンペーンに資金提供し、Mises Institute は議会に直接ロビー活動を行い、Libertarian Party は学術会議を組織する"
  - "Cato Institute は経済学の教科書を出版し、Mises Institute は有権者登録運動を行い、Libertarian Party は法案を起草する"
  - "Cato Institute は草の根抗議を組織し、Mises Institute はリバタリアンのために法的弁護を提供し、Libertarian Party はシンクタンク研究を管理する"
explanation: >-
  Cato Institute（1977年設立）は、公共政策提案に取り組むワシントン拠点のシンクタンクである。
  Mises Institute（1982年設立）は、政治的ロビー活動ではなく教育に焦点を当て、会議や再出版された著作を備えた一種のオンライン大学として機能している。
  Libertarian Party（1971年設立）は米国で第3位の政党であり、およそ2%の得票率でさえ結果を左右し得る選挙に参加している。
reviewed: false
