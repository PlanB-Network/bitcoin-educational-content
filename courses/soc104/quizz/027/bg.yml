question: "Какво означава терминът „либерал“ в европейската политическа традиция?"
answer: "Поддръжник на laissez-faire икономика, намалена държавна намеса и индивидуални свободи"
wrong_answers:
  - "Защитник на държавната намеса, публичното здравно осигуряване и програмите срещу бедността"
  - "Радикален анархист, който се стреми към пълното премахване на правителството и частната собственост"
  - "Центрист, който балансира социалистически и консервативни позиции еднакво във всички области на политиката"
explanation: >-
  В Европа либерализмът остава свързан с икономически политики laissez-faire, намалена държавна намеса и защита на индивидуалните свободи. Първият грешен отговор описва американските „liberals“, при които значението на термина се е изместило към интервенционизъм. Европейският либерализъм не е нито анархизъм, нито центризъм.
reviewed: false
