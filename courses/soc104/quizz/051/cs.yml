question: "Co odlišuje neokonzervativce od paleokonzervativců v jejich přístupu k zahraniční politice?"
answer: "Neokonzervativci ospravedlňují vojenský intervencionismus za účelem šíření demokracie, zatímco paleokonzervativci hájí izolacionističtější zahraniční politiku"
wrong_answers:
  - "Neokonzervativci odmítají veškerou vojenskou akci a upřednostňují diplomacii, zatímco paleokonzervativci podporují preventivní údery proti potenciálním hrozbám"
  - "Neokonzervativci se soustředí výhradně na ekonomické sankce, zatímco paleokonzervativci prosazují budování mezinárodních koalic pro společné vojenské operace"
  - "Neokonzervativci a paleokonzervativci se shodují v zahraniční politice, ale ostře se liší v domácí ekonomické regulaci"
explanation: >-
  Od 2000. let se neokonzervativci stále více angažovali v ospravedlňování vojenského intervencionismu s cílem implantovat demokracii po celém světě, zejména po 11. září 2001. V reakci na to si tradiční konzervativci nárokovali nálepku „paleokonzervativec“, aby se odlišili. Paleokonzervativci kritizují vojenský intervencionismus, hájí izolacionističtější zahraniční politiku a kladou větší důraz na národní a kulturní identitu.
