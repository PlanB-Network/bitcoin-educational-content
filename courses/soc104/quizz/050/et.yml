question: "Kuidas illustreerib George W. Bushi reaktsioon 2008. aasta finantskriisile konservatiivsete põhimõtete \"problemaatilist paindlikkust\"?"
answer: "Ta loobus vabaturu põhimõtetest, et päästa suuremad pangad, paljastades konservatiivse arusaama riigist kui riikliku majandusliku stabiilsuse viimsest tagajast"
wrong_answers:
  - "Ta keeldus igasugusest valitsuse sekkumisest ja lasi pankadel kokku kukkuda, järgides rangelt vabaturu ideoloogiat tagajärgedest hoolimata"
  - "Ta riigistas pangandussektori püsivalt ja kehtestas progressiivse maksustamise, liikudes konservatismilt demokraatlikule sotsialismile"
  - "Ta vastas kogu valitsuse kulutuste kärpimise ja finantsregulatsioonide kaotamisega, et lasta turul end ise korrigeerida"
explanation: >-
  Bush teatas, et ta oli „loobunud vabaturu põhimõtetest, et päästa vabaturu süsteem”, sekkudes suuremate pankade päästmiseks. See illustreerib, kuidas konservatiivid võivad seada rahvuse võimu ja järjepidevuse abstraktsetest turupõhimõtetest kõrgemale. Sama paindlik loogika ilmneb Trumpi protektsionistlikus kaubanduspoliitikas, mida aeti rahvusliku huvi nimel, riskides korporatismi ja semukapitalismi õhutamisega.
