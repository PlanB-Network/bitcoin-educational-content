question: "Chủ nghĩa xã hội đối xử với các quyền tự do khác nhau như thế nào trong lĩnh vực xã hội và lĩnh vực kinh tế?"
answer: "Chủ nghĩa xã hội ủng hộ các quyền tự do mạnh trong lĩnh vực xã hội nhưng các quyền tự do yếu trong lĩnh vực kinh tế"
wrong_answers:
  - "Chủ nghĩa xã hội hạn chế mọi quyền tự do như nhau trong cả lĩnh vực xã hội lẫn lĩnh vực kinh tế"
  - "Chủ nghĩa xã hội ủng hộ các quyền tự do kinh tế mạnh nhưng hạn chế các quyền tự do xã hội để duy trì trật tự xã hội"
  - "Chủ nghĩa xã hội trao các quyền tự do không giới hạn trong cả hai lĩnh vực và dựa vào hợp tác tự nguyện để duy trì cân bằng"
explanation: >-
  Trong tư tưởng xã hội chủ nghĩa, có một sự lưỡng phân nền tảng giữa các quyền tự do xã hội và kinh tế. Các quyền tự do xã hội mạnh, nhưng các quyền tự do kinh tế yếu do sự nhấn mạnh vào kiểm soát của nhà nước, kế hoạch hóa và tái phân phối của cải. Câu trả lời sai thứ ba mô tả lý tưởng libertarian, trong khi câu thứ hai mô tả mô thức bảo thủ, vốn là hình ảnh phản chiếu của chủ nghĩa xã hội.
