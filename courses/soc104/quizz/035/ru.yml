question: "Почему Ротбард критиковал представление либертеров о человеческой природе и какую альтернативу он предлагал?"
answer: "Он обвинял их в наивном взгляде на «благородного дикаря» и утверждал, что общество должно использовать частную собственность и правильные стимулы, чтобы направлять эгоистическое поведение"
wrong_answers:
  - "Он хвалил их понимание человеческого сотрудничества, но утверждал, что минимальное государство всё же необходимо для обеспечения исполнения контрактов"
  - "Он соглашался, что люди по природе добры, но настаивал, что только свободные рынки могут направить эту доброту в продуктивную деятельность"
  - "Он отвергал их акцент на индивидуальных правах и вместо этого утверждал, что сообщества должны коллективно определять моральные стандарты"
explanation: >-
  Ротбард критиковал либертеров за принятие наивного, руссоистского представления о человеческой природе как изначально доброй. Вместо этого он утверждал, что людьми движет личный интерес, а общество должно быть организовано так, чтобы хорошие стимулы направляли поведение. Для этого необходимо признавать и гарантировать частную собственность. Упразднение государства не означает упразднение его функций; полиция и правосудие должны управляться свободным рынком через конкуренцию.
