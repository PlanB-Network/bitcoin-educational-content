question: "Cánh hữu muốn lập pháp về điều gì?"
answer: "Đạo đức và tôn giáo, xuất phát từ mong muốn bảo tồn các thiết chế truyền thống và thứ bậc xã hội"
wrong_answers:
  - "Nền kinh tế và thị trường tài chính, xuất phát từ mong muốn giảm bất bình đẳng và tái phân phối của cải"
  - "Khoa học và giáo dục, xuất phát từ mong muốn kiểm soát những gì được dạy trong trường công"
  - "Thương mại quốc tế và ngoại giao, xuất phát từ mong muốn mở rộng ảnh hưởng quốc gia ra nước ngoài"
explanation: >-
  Cánh hữu ưu tiên đạo đức cá nhân và các giá trị truyền thống. Họ cho rằng văn minh được xây dựng trên một số thiết chế truyền thống và thứ bậc xã hội cần phải được bảo tồn, và họ muốn lập pháp về đạo đức và tôn giáo. Cánh tả, chứ không phải cánh hữu, tập trung vào việc lập pháp cho nền kinh tế. Khoa học, giáo dục và chính sách thương mại không phải là trọng tâm chính được mô tả cho cánh hữu.
