question: "Ka kom obliku upravljanja centrizam teži?"
answer: "Tehnokratiji, gde se moć poverava stručnjacima koji usmeravaju ekonomiju i monetarnu politiku"
wrong_answers:
  - "Direktnoj demokratiji, gde građani glasaju o svakoj velikoj političkoj odluci"
  - "Aristokratiji, gde moć drži tradicionalna vladajuća klasa"
  - "Laissez-faire upravljanju, gde tržište reguliše samo sebe bez državnog mešanja"
explanation: >-
  Centrizam daje prednost efikasnosti, pragmatizmu i teži tehnokratiji, što znači da moć treba poveriti stručnjacima koji usmeravaju ekonomiju i vode monetarnu politiku. To je suštinski drugačije od direktne demokratije, aristokratije ili laissez-faire-a, od kojih svaka raspodeljuje moć prema sasvim drugačijim principima.
