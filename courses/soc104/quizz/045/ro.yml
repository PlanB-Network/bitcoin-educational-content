question: "Cum reprezintă Green New Deal o evoluție contemporană a socialismului democratic?"
answer: "Folosește preocupările de mediu ca o nouă justificare pentru intervenția statului și confiscarea venitului privat, subordonând interesul individual sănătății planetare colective"
wrong_answers:
  - "Abandonează complet economia socialistă tradițională în favoarea soluțiilor de piață liberă la problemele de mediu prin tranzacționarea carbonului"
  - "Respinge intervenția statului și se bazează în schimb pe acțiune individuală voluntară și inovație din sectorul privat pentru a aborda schimbările climatice"
  - "Reprezintă o ruptură față de socialism prin prioritizarea protecției mediului peste toate preocupările de justiție socială și ocupare a forței de muncă"
explanation: >-
  Green New Deal îmbină preocupările de mediu cu obiectivele sociale, combinând tranziția ecologică cu justiția socială, garanții de ocupare a forței de muncă și servicii publice consolidate. Interesul individual este subordonat interesului colectiv definit prin sănătatea planetară. În esență, oferă un nou înveliș retoric care justifică intervenția statului și confiscarea venitului privat, nu mai doar în numele justiției sociale, ci și în numele mediului.
reviewed: false
