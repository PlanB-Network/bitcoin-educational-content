question: තම කාලයේ අමාත්‍යවරුන් කිසියම් ආර්ථික ක්‍රියාකාරකමක් නියාමනය කිරීමට යෝජනා කළ විට Marquis d'Argenson කෙසේ ප්‍රතිචාර දැක්වූවාද?
answer: පළමුව, නියාමනය නිදහසට වඩා හොඳ බව සහතික කරගත යුතු විය
wrong_answers:
  - මෙම ක්‍රියාකාරකම නියාමනය කිරීමට පෙර පළමුව පරිණත වීමට ඉඩ දිය යුතු බව
  - English සහ Dutch විසින් කළ නියාමන අනුගමනය කළ යුතු බව
  - තීරණයක් ගැනීමට පෙර ජනතාවගෙන් උපදෙස් ලබා ගත යුතු බව
explanation: |
  Marquis d'Argenson නියාමනය නිදහසට වඩා සුදුසු බව ඔප්පු කිරීම අවශ්‍ය බව අවධාරණය කළේය. නිදහස මූලික මූලධර්මය බවත්, ඕනෑම සීමාවක් ශක්තිමත් තර්ක මඟින් සාධාරණීකරණය කළ යුතු බවත් ඔහු විශ්වාස කළේය.