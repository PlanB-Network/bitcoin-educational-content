question: "Hvordan representerer Green New Deal en moderne utvikling av demokratisk sosialisme?"
answer: "Den bruker miljøhensyn som en ny begrunnelse for statlig inngripen og konfiskering av privat inntekt, og underordner individuell interesse kollektiv planetarisk helse"
wrong_answers:
  - "Den forlater tradisjonell sosialistisk økonomi fullstendig til fordel for frimarkedsløsninger på miljøproblemer gjennom karbonhandel"
  - "Den avviser statlig inngripen og bygger i stedet på frivillig individuell handling og innovasjon i privat sektor for å håndtere klimaendringer"
  - "Den representerer et brudd med sosialisme ved å prioritere miljøvern over alle hensyn til sosial rettferdighet og sysselsetting"
explanation: >-
  Green New Deal smelter sammen miljøhensyn med sosiale mål, og kombinerer økologisk omstilling med sosial rettferdighet, sysselsettingsgarantier og styrkede offentlige tjenester. Individuell interesse underordnes kollektiv interesse definert av planetarisk helse. I kjernen gir den en ny retorisk innpakning som rettferdiggjør statlig inngripen og konfiskering av privat inntekt, ikke lenger bare i sosial rettferdighets navn, men også i miljøets navn.
reviewed: false
