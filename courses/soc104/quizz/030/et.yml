question: "Kuidas erinevad Cato Institute'i, Mises Institute'i ja Libertarian Party rollid libertaarses liikumises?"
answer: "Cato Institute keskendub avaliku poliitika ettepanekutele, Mises Institute haridusele ja akadeemilisele kirjastamisele ning Libertarian Party valimispoliitikale"
wrong_answers:
  - "Cato Institute rahastab poliitilisi kampaaniaid, Mises Institute lobistab otse Kongressi ning Libertarian Party korraldab akadeemilisi konverentse"
  - "Cato Institute avaldab majandusõpikuid, Mises Institute korraldab valijate registreerimise kampaaniaid ning Libertarian Party koostab seaduseelnõusid"
  - "Cato Institute korraldab rohujuuretasandi proteste, Mises Institute pakub libertaarlastele õigusabi ning Libertarian Party haldab mõttekodade uuringuid"
explanation: >-
  Cato Institute (asutatud 1977) on Washingtonis asuv mõttekoda, mis töötab avaliku poliitika ettepanekutega. Mises Institute (asutatud 1982) keskendub poliitilise lobitöö asemel haridusele, toimides omamoodi veebiülikoolina koos konverentside ja taasavaldatud teostega. Libertarian Party (asutatud 1971) on Ameerika suuruselt kolmas erakond, mis osaleb valimistel, kus isegi selle ligikaudu 2% häältesaak võib tulemusi kallutada.
