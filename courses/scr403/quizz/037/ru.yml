question: Сжатие SHA-256 становится джетом, а комбинаторы fold и map — нет. Чем объясняется эта асимметрия?
answer: Джет заменяет одно фиксированное выражение; fold и map — это не единичные выражения, а схемы, дающие разное выражение для каждой внутренней функции f.
wrong_answers:
  - Джеты ускоряют только линейный код, поэтому итерирующие комбинаторы сначала нужно развернуть, после чего они уже не соответствуют никакому джету.
  - Подходят только выражения с машинно проверенным доказательством в Rocq, которое существует для SHA-256, но не для fold.
  - Свёртки по коротким векторам слишком дёшевы, чтобы выигрывать от ускорения, поэтому джеты зарезервированы для затратных криптографических операций.
explanation: >-
  Джет — это нативная замена одного конкретного, полностью
  сформированного выражения Simplicity, которую узлы могут подставлять,
  сохраняя его точную семантику. fold-right-n, map, zip и их варианты —
  это не единичные выражения, а схемы построения: каждый выбор
  внутренней функции f даёт структурно иное выражение, поэтому ни один
  отдельный джет не может заменить собой всё семейство. Именно поэтому
  такие итеративные шаблоны появляются в реальных программах как
  настоящий код комбинаторов, обычно порождаемый языками более высокого
  уровня, такими как SimplicityHL.
