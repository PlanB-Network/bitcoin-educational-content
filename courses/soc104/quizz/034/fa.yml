question: "تعریف ساختاری از یک نظام سیاسی بر چه چیزی تمرکز دارد؟"
answer: "بر اینکه نظام عملاً چگونه کار می‌کند و ویژگی‌های مشاهده‌پذیر آن، مانند میزان کنترل دولتی"
wrong_answers:
  - "اهداف اعلام‌شده و نیت‌های شریف بنیان‌گذاران و رهبران نظام"
  - "ریشه‌های تاریخی جنبش سیاسی و زندگی‌نامه متفکران کلیدی آن"
  - "تعداد احزاب سیاسی مجاز و فراوانی انتخابات دموکراتیک برگزارشده"
explanation: >-
  تعاریف ساختاری بر این تمرکز دارند که نظام‌های سیاسی عملاً چگونه کار می‌کنند و ویژگی‌های مشاهده‌پذیرشان چیست. برای مثال، سوسیالیسم از نظر ساختاری با حضور همه‌جانبه دولت مشخص می‌شود. این رویکرد با تعاریف نیت‌محور تفاوت دارد، زیرا آن‌ها بر انگیزه‌ها و اهداف اعلام‌شده تکیه می‌کنند. رویکرد ساختاری امکان ارزیابی عینی‌تر را بر پایه نتایج قابل اندازه‌گیری فراهم می‌کند.
reviewed: false
