question: "Su che cosa vuole legiferare la destra?"
answer: "Moralità e religione, spinte dal desiderio di preservare le istituzioni tradizionali e le gerarchie sociali"
wrong_answers:
  - "L'economia e i mercati finanziari, spinti dal desiderio di ridurre la disuguaglianza e redistribuire la ricchezza"
  - "La scienza e l'istruzione, spinte dal desiderio di controllare ciò che viene insegnato nelle scuole pubbliche"
  - "Il commercio internazionale e la diplomazia, spinti dal desiderio di espandere l'influenza nazionale all'estero"
explanation: >-
  La destra dà priorità alla moralità personale e ai valori tradizionali. Ritiene che la civiltà sia costruita su certe istituzioni tradizionali e gerarchie sociali che devono essere preservate, e vuole legiferare su moralità e religione. La sinistra, non la destra, si concentra sul legiferare l'economia. Scienza, istruzione e politica commerciale non sono il focus principale descritto per la destra.
