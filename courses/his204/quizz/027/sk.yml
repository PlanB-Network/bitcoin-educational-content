question: Ktoré princípy markíza d'Argensona zdieľa Adam Smith?
answer: Deľba práce a vlastný záujem
wrong_answers:
  - Laissez faire a vlastný záujem
  - Laissez faire a deľba práce
  - Deľba práce a protekcionizmus
explanation: |
  Markíz d'Argenson predznamenal niektoré kľúčové myšlienky Adama Smitha, ako deľbu práce a úlohu vlastného záujmu vo fungovaní hospodárstva. Smith tieto myšlienky rozvinul systematickejšie v "Bohatstve národov".
