question: "ทำไมระบอบเบ็ดเสร็จจึงถูกอธิบายว่าเป็น 'ศาสนาทางโลก' และสิ่งนี้เผยอะไรเกี่ยวกับเงื่อนไขที่จำเป็นต่อการมีอยู่ของเบ็ดเสร็จนิยม?"
answer: "พวกมันเรียกร้องศรัทธาแบบกึ่งศาสนาจากนักเคลื่อนไหวและใช้ความกลัวต่อฝ่ายตรงข้าม และเบ็ดเสร็จนิยมต้องมีคุณลักษณะทั้งหมดพร้อมกัน: เสรีภาพถูกปราบ การปกครองพรรคเดียว การปฏิวัติรุนแรง และเศรษฐกิจที่ถูกกำกับ"
wrong_answers:
  - "พวกมันแทนที่การบูชาแบบดั้งเดิมด้วยพิธีกรรมของรัฐ และเบ็ดเสร็จนิยมต้องการเพียงผู้นำที่มี charisma กับการควบคุมทางทหาร"
  - "พวกมันใช้สถาบันศาสนาเพื่อบังคับใช้ ideology ของรัฐ และเบ็ดเสร็จนิยมสามารถเกิดขึ้นได้เมื่อใดก็ตามที่พรรคการเมืองเดียวครองรัฐสภา"
  - "พวกมันสัญญาความรอดทางจิตวิญญาณผ่านการกระทำทางการเมือง และเบ็ดเสร็จนิยมมีอยู่เมื่อใดก็ตามที่รัฐควบคุมเศรษฐกิจ โดยไม่คำนึงถึงเสรีภาพทางการเมือง"
explanation: >-
  Raymond Aron สังเกตว่าระบอบเบ็ดเสร็จทำงานบนหลักสองข้อ: ศรัทธาของนักเคลื่อนไหวและความกลัวของฝ่ายตรงข้าม ความคลั่งไคล้แบบกึ่งศาสนานี้เป็นลักษณะของพวกมันเหนือแรงจูงใจที่แตกต่างกัน ทำให้พวกมันถูกเรียกว่าศาสนาทางโลก สิ่งสำคัญคือ เบ็ดเสร็จนิยมต้องมีคุณลักษณะที่กำหนดทั้งหมดพร้อมกัน: เสรีภาพถูกปราบ อำนาจไร้ขีดจำกัดผ่านพรรคเดียว การปฏิวัติรุนแรง และเศรษฐกิจที่ถูกกำกับ ประชาธิปไตยสมัยใหม่อาจแสดงลักษณะบางอย่างเหล่านี้ แต่เบ็ดเสร็จนิยมมีอยู่ก็ต่อเมื่อทั้งหมดถูกประกอบเข้าด้วยกัน
reviewed: false
