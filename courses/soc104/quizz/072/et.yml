question: "Mis on sotsialistlik seisukoht tervishoiu suhtes?"
answer: "Juurdepääs tervishoiule on fundamentaalne õigus ja riik peab tagama universaalse, avalikult rahastatud süsteemi kõigile sõltumata sissetulekust"
wrong_answers:
  - "Tervishoid peaks olema segasüsteem, kus riigi põhilist katvust täiendavad eraravikindlustuse võimalused"
  - "Eraturud pakuvad innovaatilisemat tervishoidu, seega peaksid üksikisikud oma süsteemi vabalt valima"
  - "Riik peaks pakkuma tervishoidu ainult kõige vaesematele kodanikele, samal ajal kui eraravikindlustus katab kõik teised"
explanation: >-
  Sotsialistide jaoks on juurdepääs tervishoiule fundamentaalne õigus, mitte kaup. Riik peab tagama universaalse, avalikult rahastatud tervishoiusüsteemi, et kõigil oleks juurdepääs ravile sõltumata sissetulekust. See peegeldab sotsialistlikku muret võrdsuse, sotsiaalse õigluse ja riigi tähtsuse pärast üldistes huvides teenuste korraldamisel. Segasüsteem kirjeldab tsentristlikku vaadet, samal ajal kui valikupõhised lähenemised peegeldavad libertaarseid ja konservatiivseid seisukohti.
reviewed: false
