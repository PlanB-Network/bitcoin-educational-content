question: "自由意志主义的自由观与中间主义的自由观有何不同？"
answer: "自由意志主义者把自由视为无条件公理，而中间主义者则根据语境和效率机会主义地捍卫自由"
wrong_answers:
  - "自由意志主义者允许国家选择性地保护自由，而中间主义者拒绝国家以任何方式介入个人权利保护"
  - "自由意志主义者只把自由集中于经济事务，而中间主义者则把自由广泛适用于社会和文化领域"
  - "自由意志主义者和中间主义者对自由持有相同看法，只是在执行自由所需的政府规模上存在分歧"
explanation: >-
  自由意志主义者把自由定义为一种一般性、无条件原则，它作为一条公理运作。相比之下，中间主义者以机会主义和语境化方式捍卫某些自由，而不应用任何一般原则。中间主义方法揭示了一种工具性自由观，它总是从属于效率等务实目标，而这正是自由意志主义者根本拒绝的。
