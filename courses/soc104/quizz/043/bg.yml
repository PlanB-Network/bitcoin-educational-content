question: "Какво разграничение прави Karl Marx между утопичен социализъм и научен социализъм?"
answer: "Той обвинява ранните френски социалисти, че предлагат въображаеми решения, докато неговият научен социализъм е основан на историческия материализъм и класовата борба"
wrong_answers:
  - "Той твърди, че утопичният социализъм е прекалено фокусиран върху икономиката, докато научният социализъм приоритизира културната и художествената трансформация"
  - "Той хвали утопичните социалисти за практическите им експерименти и критикува научния социализъм, че е твърде абстрактен и теоретичен"
  - "Той твърди, че утопичният социализъм е насилствен и революционен, докато научният социализъм предпочита мирна демократична реформа"
explanation: >-
  Marx обвинява ранните френски социалисти като Proudhon, Saint-Simon и Fourier, че са утописти, които предлагат чисто въображаеми решения. Неговият научен социализъм почива върху историческия материализъм: идеята, че историята напредва чрез класова борба и присвояване на средствата за производство, при което всички културни представи са обусловени от производителните сили и производствените отношения.
