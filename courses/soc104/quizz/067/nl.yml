question: "Wat is het conservatieve standpunt over immigratie?"
answer: "De staat heeft het soevereine recht om zijn grenzen te controleren om nationale veiligheid en culturele identiteit te beschermen"
wrong_answers:
  - "Grenzen moeten onvoorwaardelijk open zijn omdat discriminerende beperkingen de mensenrechten schenden"
  - "Immigratie moet worden bepaald door marktvraag, waarbij burgers contractueel beslissen over hun relaties met buitenlanders"
  - "Immigratiebeleid moet economische behoeften in evenwicht brengen met succesvolle integratie op basis van deskundige evaluatie"
explanation: >-
  Conservatieven vinden dat orde, identiteit en nationale soevereiniteit prioriteit moeten krijgen boven de onbeperkte ontvangst van buitenlanders of vluchtelingen. Grenzen en een duidelijk afgebakende bevolking maken deel uit van beschaafde waarden. De foute antwoorden vertegenwoordigen het socialistische standpunt (open grenzen als mensenrechten), het libertarische standpunt (marktgebaseerde immigratie) en het centristische standpunt (evenwichtige, door experts gestuurde benadering).
reviewed: false
