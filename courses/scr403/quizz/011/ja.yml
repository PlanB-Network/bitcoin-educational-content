question: なぜSimplicity式は木ではなくDAGとしてシリアライズされるのですか？
answer: 共有された部分式を一度だけ保存することで、指数関数的な増大を防ぐためです。
wrong_answers:
  - 通常の木構造では条件分岐をまったく表現できないためです。
  - 多数の別々のマルチコアプロセッサにまたがる並列実行を可能にするためです。
  - Liquid NetworkプロトコルがここでDAG形式を厳密に義務づけているためです。
explanation: >-
  Simplicity式は自然には木を形成し、複雑さが増すにつれて指数関数的に
  大きくなる可能性がある。有向非巡回グラフ（DAG）としてシリアライズすることで、
  複数回現れる部分式は一度だけ保存され、複数の親から参照される。
  これにより、実際のプログラムサイズは指数関数的ではなく線形に増加する。
