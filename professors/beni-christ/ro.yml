bio: |
  Salut! Sunt dezvoltator frontend, cu o minte curioasă și o pasiune pentru învățare. Din 2024, sunt interesat de finanțe, blockchain și Bitcoin. Acum, vreau să fac următorul pas: să îmi împărtășesc cunoștințele și să contribui la proiecte care conectează tehnologia și educația.

