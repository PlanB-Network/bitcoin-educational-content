question: "Perché i liberali classici negli Stati Uniti iniziarono a chiamarsi 'libertari' durante il ventesimo secolo?"
answer: "Perché il 'liberalismo' americano era stato cooptato dal crescente interventismo statale e dal welfare state"
wrong_answers:
  - "Perché volevano prendere le distanze dalle tradizioni monarchiche europee"
  - "Perché il termine 'liberale' divenne associato all'anarchismo e alla violenza politica"
  - "Perché nuovi accordi commerciali richiedevano un'identità politica distinta per i sostenitori del libero mercato"
explanation: >-
  Durante il ventesimo secolo si verificò un cambiamento fondamentale, poiché i principi laissez-faire furono progressivamente abbandonati a favore del welfare state. Il "liberalismo" americano arrivò a significare qualcosa di molto diverso dal liberalismo classico, abbracciando l'interventismo statale. I liberali classici adottarono il termine "libertario" per preservare la distinzione. Questo rebranding non aveva nulla a che fare con il monarchismo europeo, la violenza anarchica o gli accordi commerciali.
reviewed: false
