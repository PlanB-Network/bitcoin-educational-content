title: "The Denationalization of Money"

publication_year: 1976

cover: cover_en.webp

original: true

description: |
  In this radical proposal, Hayek argues that the government monopoly on money should be abolished and replaced by competing private currencies. Banks and institutions would issue their own money, and market competition would ensure stability better than any central bank. Written in 1976, the book anticipates the logic behind Bitcoin by nearly four decades: a non-state money whose value is maintained not by decree but by its utility and scarcity.
