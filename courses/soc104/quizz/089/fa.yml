question: "شعار کانت، 'Sapere aude'، مردم را به چه کاری تشویق می‌کند؟"
answer: "اینکه جرئت کنند برای خود بیندیشند و از وضعیت صغارتی بیرون آیند که در آن به هدایت یک مرجع برتر وابسته‌اند"
wrong_answers:
  - "اینکه با ثبت‌نام در نهادهای آموزشی رسمی و گرفتن مدارک، دانش دانشگاهی را دنبال کنند"
  - "اینکه همهٔ شکل‌های اخلاق را به چالش بکشند و نظام‌های اخلاقی کاملاً تازه‌ای بر پایهٔ میل شخصی بسازند"
  - "اینکه از راه پارسایی دینی و تسلیم در برابر آموزه‌های کلیسا، جویای حکمت شوند"
explanation: >-
  Sapere aude، به معنای "جرئت کن برای خود بیندیشی"، عبارتی بود که کانت از شاعر هوراس گرفت و آن را شعار روشنگری ساخت. این عبارت نماد خروج از صغارت است؛ وضعیتی که در آن مردم بدون هدایت طبقه یا مرجعی برتر، قادر به به‌کارگیری فهم خود نیستند. کانت رهایی و مسئولیت کامل نسبت به اندیشهٔ خود را تشویق می‌کند.
reviewed: false
