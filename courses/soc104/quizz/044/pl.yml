question: "Jakie rozróżnienie Karl Marx wprowadził między socjalizmem utopijnym a socjalizmem naukowym?"
answer: "Oskarżał wczesnych francuskich socjalistów o proponowanie wyobrażonych rozwiązań, podczas gdy jego socjalizm naukowy był zakorzeniony w materializmie historycznym i walce klas"
wrong_answers:
  - "Twierdził, że socjalizm utopijny zbyt mocno skupiał się na ekonomii, podczas gdy socjalizm naukowy priorytetowo traktował transformację kulturową i artystyczną"
  - "Chwalił socjalistów utopijnych za ich praktyczne eksperymenty i krytykował socjalizm naukowy za nadmierną abstrakcyjność i teoretyczność"
  - "Twierdził, że socjalizm utopijny był przemocowy i rewolucyjny, podczas gdy socjalizm naukowy sprzyjał pokojowej reformie demokratycznej"
explanation: >-
  Marx oskarżał wczesnych francuskich socjalistów takich jak Proudhon, Saint-Simon i Fourier o bycie utopistami, którzy proponowali czysto wyobrażone rozwiązania. Jego socjalizm naukowy opierał się na materializmie historycznym: idei, że historia postępuje poprzez walkę klas i przywłaszczenie środków produkcji, gdzie wszystkie reprezentacje kulturowe są uwarunkowane siłami wytwórczymi i stosunkami produkcji.
