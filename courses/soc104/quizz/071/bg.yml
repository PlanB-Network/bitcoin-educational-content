question: "Защо либертарианците се противопоставят на данъчното облагане?"
answer: "Защото то е морално нарушение на правата на собственост, форма на държавна кражба, която изземва чужда собственост без съгласие"
wrong_answers:
  - "Защото данъците са икономически неефективни и винаги водят до по-високи нива на безработица"
  - "Защото данъчното облагане обезкуражава чуждестранните инвестиции и отслабва конкурентната позиция на една страна"
  - "Защото прогресивните данъчни системи несправедливо таргетират богатите индивиди, които създават най-много работни места"
explanation: >-
  Либертарианското възражение срещу данъчното облагане е морално, преди да е икономическо. Либертарианците разглеждат данъчното облагане като форма на държавна кражба и пречка пред частната собственост, защото то се състои в изземване на чужда собственост без съгласие. Макар да може да има икономически аргументи срещу данъчното облагане, основополагащият либертариански аргумент почива на принципа, че то нарушава правата на собственост, а не на изчисления за ефективност или конкурентоспособност.
