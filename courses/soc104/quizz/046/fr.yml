question: "Que formule le principe de non-agression ?"
answer: "Une personne est libre d'agir comme elle le souhaite tant qu'aucune violence n'est commise contre la vie, la liberté ou la propriété d'autrui"
wrong_answers:
  - "L'État a le droit exclusif d'utiliser la force afin de maintenir l'ordre social"
  - "Les citoyens doivent se soumettre à la règle de la majorité même lorsqu'elle restreint les libertés individuelles"
  - "La liberté d'action n'est permise que lorsqu'elle bénéficie au bien collectif de la société"
explanation: >-
  Le principe de non-agression est une pierre angulaire de la politique libertarienne, affirmant que les individus peuvent agir librement à condition de ne pas commettre de violence contre la vie, la liberté ou la propriété d'autrui. Il rappelle la règle d'or présente dans toutes les civilisations. Contrairement aux autres options, il n'accorde pas à l'État une autorité morale particulière et ne subordonne pas les droits individuels au bénéfice collectif.
reviewed: false
