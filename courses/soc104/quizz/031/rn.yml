question: "Aba libertaires b'Abafaransa (aba anarchistes basosiyaliste) bemera iki ku bijanye n'umutungo bwite?"
answer: "Umutungo bwite na kapitalizimu bitegerezwa gukurwaho kuko ari amasoko y'agahahazo"
wrong_answers:
  - "Umutungo bwite ni uburenganzira mvukanwa bubanza Leta kandi butegerezwa gukingirwa uko vyogenda kwose"
  - "Umutungo bwite ukwiye kugengwa na Leta ariko ntukigere ukurwaho burundu mu kibano"
  - "Umutungo bwite wemewe gusa iyo ugabuwe ku rugero rungana mu banywanyi bose b'ikomini"
explanation: >-
  Aba libertaires b'Abafaransa, abaragwa ba anarchisme socialiste biciye ku biyumviro vy'abiyumvirizi nka Proudhon na Bakunin, bavuga ko Leta n'umutungo bwite bitegerezwa gukurwaho nk'amasoko abiri y'agahahazo. Ivyo bibonekera mu mvugo rurangiranwa ya Proudhon ngo "Umutungo ni ubusuma." Inyishu ya mbere itari yo idondora ikibanza c'aba libertarian, gihushanye ku mushinge n'uko aba libertaires babibona.
