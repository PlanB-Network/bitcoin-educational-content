question: "Bitcoin은 어떻게 도덕적 주장을 가진 정치적 프로젝트가 아니라 정치적 결과를 가진 도덕적 프로젝트로 기능하나요?"
answer: "Bitcoin은 사람들을 부자로 만들기보다 자유롭게 만들기 위해 설계되었고, 효과적 재산을 가능하게 하며, 노동의 가치를 보호하고, 프라이버시를 보존합니다. 이는 어떤 정치 진영도 주장하지 않으면서 정치적 효과를 낳는 도덕적 성취입니다"
wrong_answers:
  - "Bitcoin은 그 코드가 사기를 막는 윤리 규칙을 강제하기 때문에 도덕적 프로젝트이며, 그 정치적 결과는 민주적 거버넌스를 알고리즘 의사결정으로 대체하는 것입니다"
  - "Bitcoin은 부를 부자에게서 초기 채택자에게 재분배해 조세 정책에 정치적 함의를 지닌 더 공정한 사회를 만들기 때문에 도덕적 프로젝트로 기능합니다"
  - "Bitcoin은 Satoshi Nakamoto가 프로토콜에 윤리적 계명을 삽입했기 때문에 도덕적이며, 그 정치적 결과는 모든 정치 가족을 하나의 공유된 통화 시스템 아래 통합하는 것입니다"
explanation: >-
  Bitcoin은 사람들을 부자로 만들기 위해 설계된 것이 아니라 자유롭게 만들기 위해 설계되었습니다. 그것은 세 가지 도덕적 결과를 성취합니다: 효과적 재산을 가능하게 하는 것(책임을 장려함), 노동이 창출한 가치를 보호하는 것(생산적 노력을 장려함), 프라이버시를 보존하는 것(사람들이 두려움 없이 살 수 있게 함)입니다. 이는 어떤 정치 진영에도 속하지 않으면서 정치적 결과를 수반하는 도덕적 성취이므로, Bitcoin은 먼저 도덕적 프로젝트이고 그다음 정치적 프로젝트입니다.
