question: "Was bedeutet der Begriff 'liberal' in der europäischen politischen Tradition?"
answer: "Ein Befürworter von Laissez-faire-Wirtschaft, reduzierter staatlicher Intervention und individuellen Freiheiten"
wrong_answers:
  - "Ein Befürworter staatlicher Intervention, öffentlicher Krankenversicherung und Programme zur Armutsbekämpfung"
  - "Ein radikaler Anarchist, der die vollständige Abschaffung von Regierung und Privateigentum anstrebt"
  - "Ein Zentrist, der sozialistische und konservative Positionen in allen Politikbereichen gleichermaßen ausbalanciert"
explanation: >-
  In Europa ist der Liberalismus mit Laissez-faire-Wirtschaftspolitik, reduzierter staatlicher Intervention und der Verteidigung individueller Freiheiten verbunden geblieben. Die erste falsche Antwort beschreibt amerikanische Liberale, die die Bedeutung des Begriffs in Richtung Interventionismus verschoben haben. Europäischer Liberalismus ist weder Anarchismus noch Zentrismus.
reviewed: false
