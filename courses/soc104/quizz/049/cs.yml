question: "Jak reakce George W. Bushe na finanční krizi roku 2008 ilustruje „problematickou flexibilitu“ konzervativních principů?"
answer: "Opustil principy volného trhu, aby zachránil velké banky, čímž odhalil konzervativní pohled na stát jako konečného garanta národní ekonomické stability"
wrong_answers:
  - "Odmítl veškeré vládní zásahy a nechal banky padnout, přičemž se bez ohledu na důsledky přísně držel ideologie volného trhu"
  - "Trvale znárodnil bankovní sektor a zavedl progresivní zdanění, čímž přešel od konzervatismu k demokratickému socialismu"
  - "Reagoval snížením všech vládních výdajů a odstraněním finančních regulací, aby nechal trh se sám napravit"
explanation: >-
  Bush prohlásil, že „opustil principy volného trhu, aby zachránil systém volného trhu“, když zasáhl na záchranu velkých bank. To ukazuje, jak konzervativci mohou upřednostnit moc a kontinuitu národa před abstraktními tržními principy. Stejná flexibilní logika se objevuje v Trumpových protekcionistických obchodních politikách, prosazovaných ve jménu národního zájmu s rizikem posilování korporatismu a klientelistického kapitalismu.
