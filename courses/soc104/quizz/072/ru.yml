question: "Какова социалистическая позиция по вопросу здравоохранения?"
answer: "Доступ к медицинской помощи является фундаментальным правом, и государство должно гарантировать универсальную систему, финансируемую из общественных средств, для всех независимо от дохода"
wrong_answers:
  - "Здравоохранение должно быть смешанной системой с базовым государственным покрытием, дополненным вариантами частного страхования"
  - "Частные рынки предоставляют более инновационную медицинскую помощь, поэтому индивиды должны свободно выбирать собственную систему"
  - "Государство должно предоставлять медицинскую помощь только самым бедным гражданам, тогда как частное страхование покрывает всех остальных"
explanation: >-
  Для социалистов доступ к медицинской помощи является фундаментальным правом, а не товаром. Государство должно гарантировать универсальную систему здравоохранения, финансируемую из общественных средств, чтобы каждый имел доступ к лечению независимо от дохода. Это отражает социалистическую заботу о равенстве, социальной справедливости и важности государства в организации услуг в общем интересе. Смешанная система описывает центристский взгляд, тогда как подходы, основанные на выборе, отражают либертарианские и консервативные позиции.
