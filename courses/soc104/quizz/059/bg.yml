question: "Кои са двата принципа на справедливостта на John Rawls?"
answer: "Равна свобода за всички и принципът на разликата, допускащ неравенства само ако те облагодетелстват най-необлагодетелстваните"
wrong_answers:
  - "Всеобщо избирателно право за всички граждани и прогресивно данъчно облагане за финансиране на публични услуги"
  - "Свобода на словото без ограничения и задължително преразпределение на богатството за постигане на равенство"
  - "Защита на правата на частна собственост и принципът на неагресия, приложен към всички действия на държавата"
explanation: >-
  Rawls предлага два принципа: първо, равна свобода за всички (основата на демокрацията), и второ, принципът на разликата, който допуска неравенства само ако те облагодетелстват най-необлагодетелстваните членове на обществото. Това означава, че човек има право да забогатее, при условие че преразпределението позволява и на най-малко облагодетелстваните да се възползват. Другите варианти смесват елементи от различни политически философии.
