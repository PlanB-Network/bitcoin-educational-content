question: "Karl Marx 對空想社會主義與科學社會主義作出了什麼區分？"
answer: "他指責早期法國社會主義者提出想像中的解決方案，而他的科學社會主義則奠基於歷史唯物主義與階級鬥爭"
wrong_answers:
  - "他主張空想社會主義過於聚焦經濟，而科學社會主義優先考量文化與藝術轉型"
  - "他稱讚空想社會主義者的實踐實驗，並批判科學社會主義過於抽象和理論化"
  - "他聲稱空想社會主義是暴力且革命性的，而科學社會主義偏好和平的民主改革"
explanation: >-
  Marx 指責 Proudhon、Saint-Simon 與 Fourier 等早期法國社會主義者是空想家，提出純粹想像中的解決方案。他的科學社會主義立足於歷史唯物主義：也就是歷史透過階級鬥爭與對生產資料的佔有而推進的觀念，其中所有文化表徵都受到生產力與生產關係的制約。
reviewed: false
