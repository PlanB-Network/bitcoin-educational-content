question: "Thuật ngữ 'liberal' có nghĩa là gì trong truyền thống chính trị châu Âu?"
answer: "Một người ủng hộ kinh tế laissez-faire, giảm can thiệp nhà nước và các quyền tự do cá nhân"
wrong_answers:
  - "Một người ủng hộ can thiệp nhà nước, bảo hiểm y tế công và các chương trình chống nghèo đói"
  - "Một người vô chính phủ cấp tiến tìm cách bãi bỏ hoàn toàn chính quyền và sở hữu tư nhân"
  - "Một người trung dung cân bằng các lập trường xã hội chủ nghĩa và bảo thủ một cách ngang nhau trong mọi lĩnh vực chính sách"
explanation: >-
  Ở châu Âu, chủ nghĩa tự do vẫn gắn với các chính sách kinh tế laissez-faire, giảm can thiệp nhà nước và bảo vệ các quyền tự do cá nhân. Câu trả lời sai đầu tiên mô tả các liberal Mỹ, những người đã làm dịch chuyển ý nghĩa của thuật ngữ này sang chủ nghĩa can thiệp. Chủ nghĩa tự do châu Âu không phải là chủ nghĩa vô chính phủ cũng không phải là chủ nghĩa trung dung.
reviewed: false
