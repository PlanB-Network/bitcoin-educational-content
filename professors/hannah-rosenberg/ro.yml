bio: |
  Hannah deține o diplomă de licență în Economie de la University of Illinois Chicago. În timpul studiilor, a devenit profund fascinată de bani. Când a descoperit Bitcoin în 2012, s-a îndrăgostit rapid. După ani petrecuți ca dezvoltatoare web cu o pregătire tehnică, Hannah a început să studieze și să lucreze în domeniul tehnologiei criptomonedelor. De la descoperirea Bitcoin, Hannah a fondat Velas Commerce, iar în 2017 a început să predea tehnologie crypto la UIC și la diverse organizații non-profit.
short_bio: Developer Advocate la Lightning Labs
