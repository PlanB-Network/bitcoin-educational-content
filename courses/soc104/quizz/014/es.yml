question: "¿Qué caracteriza la parte inferior del eje de libertad personal en el diagrama de Nolan?"
answer: "Preferencia por el orden, la seguridad, los valores tradicionales y por que el Estado regule la moral y mantenga el orden público"
wrong_answers:
  - "Preferencia por la autonomía individual, la tolerancia y una mínima injerencia estatal en las elecciones de vida personales"
  - "Preferencia por la desregulación económica, el libre comercio y la abolición de aranceles y subsidios"
  - "Preferencia por la redistribución de la riqueza, impuestos altos y nacionalización de industrias clave"
explanation: >-
  La parte inferior del eje de libertad personal representa el máximo control estatal sobre la vida personal, caracterizado por una preferencia por el orden, la seguridad y los valores tradicionales. El Estado regula las costumbres, mantiene el orden público y puede defender una visión específica de la moral o la tradición. La parte superior del eje representa lo contrario: libertad individual y tolerancia. Las políticas económicas se miden en el eje horizontal separado.
