question: "Ako reakcia Georgea W. Busha na finančnú krízu v roku 2008 ilustruje „problematickú flexibilitu“ konzervatívnych princípov?"
answer: "Opustil princípy voľného trhu, aby zachránil veľké banky, čím odhalil konzervatívne chápanie štátu ako konečného garanta národnej ekonomickej stability"
wrong_answers:
  - "Odmietol akýkoľvek vládny zásah a nechal banky padnúť, pričom sa bez ohľadu na dôsledky striktne držal ideológie voľného trhu"
  - "Natrvalo znárodnil bankový sektor a zaviedol progresívne zdanenie, čím prešiel od konzervatizmu k demokratickému socializmu"
  - "Reagoval znížením všetkých vládnych výdavkov a odstránením finančných regulácií, aby sa trh mohol sám napraviť"
explanation: >-
  Bush vyhlásil, že „opustil princípy voľného trhu, aby zachránil systém voľného trhu“, keď zasiahol s cieľom zachrániť veľké banky. To ukazuje, ako môžu konzervatívci uprednostniť moc a kontinuitu národa pred abstraktnými trhovými princípmi. Rovnaká flexibilná logika sa objavuje v Trumpových protekcionistických obchodných politikách, presadzovaných v mene národného záujmu s rizikom podpory korporativizmu a klientelistického kapitalizmu.
