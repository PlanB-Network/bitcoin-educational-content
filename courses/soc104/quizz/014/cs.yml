question: "Proč dvourozměrný model tvrdí, že většinu politických otázek lze rozdělit na ekonomické a osobní kategorie?"
answer: "Protože ekonomické otázky se týkají toho, co děláte jako výrobce a spotřebitel, zatímco osobní otázky se týkají vašich soukromých vztahů, přesvědčení a tělesné autonomie"
wrong_answers:
  - "Protože všechny politické debaty se nakonec redukují na neshody ohledně úrovně zdanění a náboženských praktik"
  - "Protože vlády historicky regulují pouze dvě věci: trh a armádu"
  - "Protože političtí filozofové od antiky vždy oddělovali materiální záležitosti od duchovních"
explanation: >-
  Dvourozměrný model je založen na myšlence, že politické otázky se dělí do dvou širokých kategorií. Ekonomické svobody zahrnují výrobu, spotřebu, obchod, zaměstnání a správu peněz. Osobní svobody zahrnují soukromé vztahy, názory, přesvědčení a volby týkající se vlastního těla a mysli. Toto oddělení umožňuje mnohem nuancovanější mapování politických pozic než jediná osa levice–pravice.
