question: "සියලු totalitarian regimes power වෙත පැමිණියේ කෙසේද?"
answer: "පෙර පැවති system එක clean slate කිරීම යුක්තිසහගත කළ violent revolution හරහා"
wrong_answers:
  - "පවතින democratic institutions තුළ gradual legislative reform හරහා"
  - "regional control සොයන foreign powers විසින් සංවිධානය කළ military coups හරහා"
  - "විශාල margins වලින් popular elections දිනාගත් peaceful mass movements හරහා"
explanation: >-
  සියලු totalitarian regimes power වෙත පැමිණියේ violent revolution හරහාය. මෙම revolution එක dual purpose එකක් සේවය කරයි: එය old order එක භෞතිකව විනාශ කරන අතර නව society එක ගොඩනැගීමට violence භාවිතය අවශ්‍ය බව ideologically යුක්තිසහගත කරයි. මෙය totalitarian takeovers, democratic transitions, foreign-backed coups, හෝ peaceful electoral victories වලින් වෙන් කරයි.
reviewed: false
