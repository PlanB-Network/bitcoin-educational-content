question: "چرا مدل دوبعدی استدلال می‌کند که بیشتر مسائل سیاسی را می‌توان به دسته‌های اقتصادی و شخصی تقسیم کرد؟"
answer: "زیرا مسائل اقتصادی به آنچه شما به عنوان تولیدکننده و مصرف‌کننده انجام می‌دهید مربوط‌اند، در حالی که مسائل شخصی به روابط خصوصی، باورها، و خودمختاری بدنی شما مربوط‌اند"
wrong_answers:
  - "زیرا همهٔ بحث‌های سیاسی در نهایت به اختلاف نظر دربارهٔ سطح مالیات و اعمال دینی فروکاسته می‌شوند"
  - "زیرا دولت‌ها در طول تاریخ فقط دو چیز را تنظیم کرده‌اند: بازار و ارتش"
  - "زیرا فیلسوفان سیاسی از دوران باستان همیشه دغدغه‌های مادی را از دغدغه‌های معنوی جدا کرده‌اند"
explanation: >-
  مدل دوبعدی بر این ایده استوار است که مسائل سیاسی به دو دستهٔ گسترده تقسیم می‌شوند. آزادی‌های اقتصادی تولید، مصرف، تجارت، اشتغال، و مدیریت پول را پوشش می‌دهند. آزادی‌های شخصی روابط خصوصی، نظرات، باورها، و انتخاب‌های مربوط به بدن و ذهن خودتان را پوشش می‌دهند. این جداسازی امکان ترسیم بسیار ظریف‌تری از مواضع سیاسی را نسبت به یک محور واحد چپ-راست فراهم می‌کند.
reviewed: false
