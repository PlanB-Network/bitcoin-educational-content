question: "Wat is het belangrijke onderscheid tussen pro-business en pro-markt zijn?"
answer: "Pro-business zijn betekent een alliantie tussen grote ondernemingen en de staat bevoordelen, terwijl pro-markt zijn betekent vrije concurrentie steunen zonder staatsfavoritisme"
wrong_answers:
  - "Pro-business zijn betekent kleine bedrijven steunen, terwijl pro-markt zijn betekent multinationale ondernemingen steunen"
  - "Pro-business zijn betekent regulering volledig afwijzen, terwijl pro-markt zijn betekent gematigde regulering accepteren"
  - "Pro-business zijn richt zich op binnenlandse industrie, terwijl pro-markt zijn zich richt op internationale handel"
explanation: >-
  Centristen neigen pro-business te zijn, wat betekent dat zij een soort alliantie tussen grote ondernemingen en de staat bevoordelen; dat verschilt van pro-markt zijn. Pro-markt zijn steunt vrije concurrentie zonder staatsfavoritisme of corporatief protectionisme. Dit onderscheid is cruciaal omdat pro-business-beleid monopolies en regulerende beschermingen kan creëren die vrijemarktconcurrentie juist ondermijnen.
