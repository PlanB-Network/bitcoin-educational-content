question: "Co oznacza termin 'liberalny' w europejskiej tradycji politycznej?"
answer: "Zwolennika ekonomii laissez-faire, ograniczonej interwencji państwa i wolności jednostki"
wrong_answers:
  - "Orędownika interwencji państwa, publicznego ubezpieczenia zdrowotnego i programów walki z ubóstwem"
  - "Radykalnego anarchistę, który dąży do całkowitego zniesienia rządu i własności prywatnej"
  - "Centrystę, który w każdej dziedzinie polityki jednakowo równoważy stanowiska socjalistyczne i konserwatywne"
explanation: >-
  W Europie liberalizm pozostał związany z polityką gospodarczą laissez-faire, ograniczoną interwencją państwa i obroną wolności jednostki. Pierwsza błędna odpowiedź opisuje amerykańskich liberałów, u których znaczenie tego terminu przesunęło się w stronę interwencjonizmu. Europejski liberalizm nie jest ani anarchizmem, ani centryzmem.
