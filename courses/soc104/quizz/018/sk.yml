question: "Aká je definícia etatizmu, ako je predstavená v Nolanovom rámci?"
answer: "Používanie legislatívy na kontrolu a formovanie spoločnosti, či už v mene obrany civilizácie, pracujúcej triedy, prírody alebo utláčaných"
wrong_answers:
  - "Systém vlády, v ktorom volení predstavitelia slúžia pevne stanovené obdobia a moc sa odovzdáva prostredníctvom demokratických volieb"
  - "Presvedčenie, že iba silná armáda dokáže ochrániť suverenitu a územnú celistvosť národa"
  - "Ekonomická filozofia, ktorá prostredníctvom ciel a kvót uprednostňuje národné odvetvia pred zahraničnou konkurenciou"
explanation: >-
  Etatizmus je definovaný ako používanie legislatívy na kontrolu a formovanie spoločnosti. Praktizuje ho ľavica aj pravica: niektorí v mene obrany civilizácie, iní v mene obrany pracujúcej triedy, prírody alebo utláčaných. Aj centristi ho schvaľujú, keď sa im to hodí. Etatizmus sa neobmedzuje na vojenskú politiku, obchodný protekcionizmus ani na samotnú existenciu volených vlád.
