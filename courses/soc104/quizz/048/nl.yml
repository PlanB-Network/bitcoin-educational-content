question: "Hoe karakteriseerde Michael Oakeshott conservatisme in zijn filosofische werk?"
answer: "Als een temperament en levenshouding in plaats van een rigide systematische ideologie"
wrong_answers:
  - "Als een omvattende economische theorie met precieze beleidsvoorschriften voor elk terrein van de overheid"
  - "Als een revolutionaire beweging die moderne instellingen wil ontmantelen en wil terugkeren naar de pre-industriële samenleving"
  - "Als een zuiver religieuze doctrine die geworteld is in christelijke theologie en kerkelijk gezag"
explanation: >-
  Michael Oakeshott, een Britse filosoof, verdedigde een opvatting van conservatisme als temperament in plaats van systematische ideologie. Zijn essay On Being Conservative (1956) blijft een essentiële referentie. Deze kijk op conservatisme als houding beïnvloedde ook Friedrich Hayek. Oakeshotts benadering valt op door haar kritiek op rationalisme in de politiek, waarbij zij het idee verwerpt dat politiek tot een systeem kan worden herleid.
reviewed: false
