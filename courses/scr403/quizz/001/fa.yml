question: در ترکیب موازی، چه اتفاقی برای ورودی می‌افتد؟
answer: هر دو عملیات همان ورودی را دریافت می‌کنند، و خروجی‌هایشان یک حاصل‌ضرب (جفت) تشکیل می‌دهد.
wrong_answers:
  - ورودی به دو نیم تقسیم می‌شود و هر عملیات یک بخش جداگانه را دریافت می‌کند.
  - یک عملیات ابتدا ورودی را پردازش می‌کند و عملیات دیگر نتیجه تغییریافته را دریافت می‌کند.
  - ورودی برچسب‌گذاری می‌شود و برای پردازش فقط به یکی از دو عملیات هدایت می‌شود.
explanation: >-
  ترکیب موازی همان ورودیِ بدون تغییر را هم‌زمان به هر دو عملیات می‌دهد.
  نتیجه‌ها در یک نوع ضربی (جفت) بسته‌بندی می‌شوند. در Simplicity، این کار
  از ترکیب‌گر pair استفاده می‌کند که به‌صورت f ▵ g نوشته می‌شود و برای
  ورودی a، مقدار ⟨f(a), g(a)⟩ را تولید می‌کند.
reviewed: false
