question: "O que afirma o princípio de não agressão?"
answer: "Uma pessoa é livre para agir como quiser, desde que nenhuma violência seja cometida contra a vida, a liberdade ou a propriedade de outra pessoa"
wrong_answers:
  - "O Estado tem o direito exclusivo de usar a força para manter a ordem social"
  - "Os cidadãos devem se submeter ao governo da maioria mesmo quando ele restringe liberdades individuais"
  - "A liberdade de ação é permitida apenas quando beneficia o bem coletivo da sociedade"
explanation: >-
  O princípio de não agressão é uma pedra angular da política libertária, afirmando que os indivíduos podem agir livremente desde que não cometam violência contra a vida, a liberdade ou a propriedade de outros. Ele recorda a regra de ouro encontrada em várias civilizações. Ao contrário das outras opções, ele não concede ao Estado autoridade moral especial nem subordina os direitos individuais ao benefício coletivo.
