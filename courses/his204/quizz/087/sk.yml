question: V roku 1776 vyšlo Le commerce et le gouvernement considérés relativement l'un avec l'autre. Ktorá ďalšia kniha vyšla v tom istom roku?
answer: Bohatstvo národov od Adama Smitha
wrong_answers:
  - Pojednanie o politickej ekonómii Jeana-Baptista Saya
  - Turgotove Úvahy o tvorbe a rozdeľovaní bohatstva
  - Spoločenská zmluva
explanation: |
  "Bohatstvo národov" Adama Smitha vyšlo v roku 1776, v prelomovom roku pre ekonomické myslenie.
