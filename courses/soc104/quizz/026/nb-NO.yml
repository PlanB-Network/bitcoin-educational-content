question: "Hva betyr begrepet 'liberal' i den europeiske politiske tradisjonen?"
answer: "En tilhenger av laissez-faire-økonomi, redusert statlig inngripen og individuelle friheter"
wrong_answers:
  - "En forkjemper for statlig inngripen, offentlig helseforsikring og fattigdomsbekjempende programmer"
  - "En radikal anarkist som søker fullstendig avskaffelse av staten og privat eiendom"
  - "En sentrist som balanserer sosialistiske og konservative posisjoner likt på alle politikkområder"
explanation: >-
  I Europa har liberalisme forblitt forbundet med laissez-faire-økonomisk politikk, redusert statlig inngripen og forsvaret av individuelle friheter. Det første gale svaret beskriver amerikanske liberalere, som har forskjøvet begrepets betydning mot intervensjonisme. Europeisk liberalisme er verken anarkisme eller sentrisme.
reviewed: false
