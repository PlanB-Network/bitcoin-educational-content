question: "Amerika Birleşik Devletleri'ndeki klasik liberaller yirminci yüzyılda neden kendilerini 'liberteryenler' olarak adlandırmaya başladı?"
answer: "Çünkü Amerikan 'liberalizmi' artan devlet müdahaleciliği ve refah devleti tarafından ele geçirilmişti"
wrong_answers:
  - "Çünkü kendilerini Avrupa monarşist geleneklerinden uzaklaştırmak istiyorlardı"
  - "Çünkü 'liberal' terimi anarşizm ve siyasi şiddetle ilişkilendirilmeye başlamıştı"
  - "Çünkü yeni ticaret anlaşmaları serbest piyasa savunucuları için ayrı bir siyasi kimlik gerektiriyordu"
explanation: >-
  Yirminci yüzyılda, laissez-faire ilkelerinin refah devleti lehine kademeli olarak terk edilmesiyle temel bir değişim yaşandı. Amerikan "liberalizmi", klasik liberalizmden çok farklı bir anlama gelmeye ve devlet müdahaleciliğini benimsemeye başladı. Klasik liberaller ayrımı korumak için "liberteryen" terimini benimsedi. Bu yeniden markalanmanın Avrupa monarşizmiyle, anarşist şiddetle veya ticaret anlaşmalarıyla hiçbir ilgisi yoktu.
