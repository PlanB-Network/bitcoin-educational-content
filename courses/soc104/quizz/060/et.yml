question: "Milline varjatud paradoks peitub tsentristlikus pragmatismis?"
answer: "Pragmatism ise põhineb dogmatismi vormil, nimelt väljendamata veendumusel, et ainult eksperdid on pädevad ühiskonda juhtima"
wrong_answers:
  - "Tsentristid väidavad end olevat mõõdukad, kuid liituvad koalitsioonivalitsustes järjekindlalt vasakparteidega"
  - "Tsentristlikud poliitikad näivad tasakaalukad, kuid soosivad alati majanduskasvu keskkonnakaitse arvelt"
  - "Tsentristid lükkavad ideoloogia tagasi, kuid võtavad majandusotsuseid tehes omaks jäigad vabaturu põhimõtted"
explanation: >-
  Tsentristliku pragmatismi paradoks seisneb selles, et see väidab end hülgavat ideoloogia ratsionaalse ekspertiisi kasuks, kuid just see väide toetub nähtamatule ja väljendamata dogmale: et ainult tehnokraadid suudavad teha õigeid otsuseid. See veendumus, et üksnes eksperdid peaksid ühiskonda juhtima, on iseenesest ideoloogiline pühendumus, kuigi tsentristid ei tunnista seda sellisena.
reviewed: false
