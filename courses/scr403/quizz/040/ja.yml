question: Simplicity の出力は、固定された BIP-0341 NUMS 点を内部キーとして使用します。なぜ鍵支出は証明可能に不可能であり、NUMS 点のランダム化は何を追加するのでしょうか？
answer: NUMS 点の離散対数を知っている人はいないため、鍵パス署名は存在できません。ランダム化はプライバシーを追加するだけです。
wrong_answers:
  - NUMS 点は曲線上にないため鍵パス署名は失敗する。ランダム化はそれを曲線上に戻す。
  - NUMS 点の秘密鍵はゼロであり、コンセンサスがそれを拒否する。ランダム化はサイドチャネルからツイークを守る。
  - NUMS 点をツイークすると範囲外の鍵になり、鍵支出が非標準になる。ランダム化はアドレス再利用を避ける。
explanation: >-
  NUMS（'Nothing-Up-My-Sleeve'）点は完全に有効な曲線点であり、対応する秘密鍵を誰も
  知らないように構成されています。つまり、その離散対数は未知です。鍵パス支出には
  内部キーの下でのシュノア署名が必要であり、秘密鍵なしにはそのような署名を生成できないため、
  鍵支出経路は証明可能に使用不能で、資金はコミット済みのスクリプトパスを通じてのみ
  移動できます。NUMS 点をランダム化しても、この点は何も変わりません。それは鍵支出が
  無効化されている事実を隠すだけで、その出力を他の Taproot 出力と同じように見せます。
  つまりプライバシー上の利点です。
reviewed: false
