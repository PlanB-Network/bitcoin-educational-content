question: "Ni iki abaharanira umwidegemvyo n'abagumyabanga bahurirako, kandi ni iki kibatandukanya?"
answer: "Bahurira ku kwiyegereza intwaro igarukira no ku kwamirira kure uburinganire buhatirwa, ariko ntibumvikana ku kwinjira mu ntambara zo hanze no kuri politike z'ikibano"
wrong_answers:
  - "Bahurira ku gushigikira politike z'ubudandaji bwa protectionism n'ukwivuna abansi kw'igihugu, ariko ntibumvikana ku ruhara rw'idini mu buzima bwa bose"
  - "Bahurira ku kwiyemeza imisoro igenda yiyongera n'imigambi y'imfashanyo, ariko ntibumvikana ku politike y'abimukira"
  - "Bahurira ku kurwanya ubudandaji bwidegemvya n'ukwemerera ibiyayuramutwe, ariko ntibumvikana ku bunini bwa Leta nkuru"
explanation: >-
  Abaharanira umwidegemvyo n'abagumyabanga bompi bashigikira intwaro igarukira, baranka uburinganire buhatirwa, barwanya umwenda wa Leta, kandi barakingira uburenganzira bw'intara zigize igihugu. Ariko abaharanira umwidegemvyo baranka military interventionism y'aba neoconservatives, barwanya politike z'ikibano n'imfashanyo z'abagumyabanga, baranegura ukubuzwa kw'ibiyayuramutwe, kandi baranka protectionism. Ubucuti burahari ariko muri kamere yabwo burimwo ukutoroherana.
