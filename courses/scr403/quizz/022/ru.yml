question: "Почему bip0340-verify использует эффект Failure вместо возврата булева значения (true/false)?"
answer: Чтобы обеспечить пакетную проверку подписей Schnorr, при которой одна неудачная проверка проваливает весь пакет.
wrong_answers:
  - Потому что булевы типы слишком дороги с точки зрения места в блоке по сравнению с типом unit.
  - Потому что система типов Simplicity не может представлять булевы возвращаемые значения, приходящие из джетов.
  - Потому что возврат обычного булева значения напрямую нарушил бы теорему полноты.
explanation: >-
  Если бы bip0340-verify возвращал булево значение, неудачная проверка
  подписи всё равно могла бы привести к ветви, в которой скрипт
  выполняется успешно. В этом случае верификатору потребовалось бы знать,
  какая именно подпись не прошла проверку, что делает пакетную проверку
  невозможной. Используя эффект Failure, неудачная проверка всегда
  прерывает всё вычисление целиком, что позволяет эффективно проводить
  пакетную проверку, когда множество подписей объединяются вместе.
reviewed: true
