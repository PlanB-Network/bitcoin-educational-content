question: "Qual è l'argomento fondamentale di Hayek sul perché la pianificazione centrale fallisce?"
answer: "La conoscenza esiste solo come frammenti dispersi posseduti da individui distinti e non può essere concentrata o integrata da un'autorità centrale"
wrong_answers:
  - "I pianificatori centrali sono moralmente corrotti e agiscono sempre nel proprio interesse invece che per il bene pubblico"
  - "Le istituzioni democratiche sono troppo lente nel rispondere ai cambiamenti economici, rendendo le decisioni centralizzate sempre superate"
  - "La pianificazione centrale fallisce perché i cittadini resistono deliberatamente ai mandati governativi e rifiutano di rispettare i regolamenti"
explanation: >-
  L'argomento fondamentale di Hayek poggia sulla natura dell'informazione. Dimostrò che la conoscenza non esiste mai in forma concentrata o integrata, ma solo come frammenti dispersi posseduti da tutti gli individui distinti. Il valore è soggettivo ed è conosciuto solo localmente e incompletamente. Il pianificatore centrale, seduto in un ufficio, non conosce il vero prezzo delle cose perché non è impegnato in interazione e scambio.
