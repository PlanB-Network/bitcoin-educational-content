question: Какова роль джетов (jets) в Simplicity?
answer: Джеты — это нативные реализации, заменяющие заданные выражения Simplicity ради скорости.
wrong_answers:
  - Джеты — это этап компиляции, преобразующий Simplicity в Bitcoin Script.
  - Джеты — это сетевые сообщения, рассылающие программы Simplicity всем узлам.
  - Джеты — это инструменты отладки для тестирования и трассировки выражений Simplicity.
explanation: >-
  Джет — это нативная реализация, которую сеть соглашается использовать
  вместо конкретного выражения Simplicity (идентифицируемого по его
  корню Меркла). Выражение Simplicity служит формальной спецификацией
  того, что вычисляет джет, а нативный код обеспечивает практическую
  скорость выполнения. Распространённые джеты обрабатывают арифметические
  и криптографические операции, такие как SHA-256.
reviewed: false
