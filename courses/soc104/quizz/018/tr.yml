question: "Nolan diyagramının dikey ekseni gerçek siyasi soru hakkında neyi açığa çıkarır?"
answer: "Kendi hassasiyetlerinizi devlet aracılığıyla başkalarına dayatmak mı istediğinizi, yoksa herkesin kendi adına karar vermekte özgür olmasını mı tercih ettiğinizi açığa çıkarır"
wrong_answers:
  - "Demokratik yönetimi mi desteklediğinizi yoksa tek bir liderin otoriter yönetimini mi tercih ettiğinizi açığa çıkarır"
  - "İlerici toplumsal hareketlerle mi yoksa geleneksel dini kurumlarla mı özdeşleştiğinizi açığa çıkarır"
  - "Birincil kaygınızın ulusal güvenlik mi yoksa ekonomik refah mı olduğunu açığa çıkarır"
explanation: >-
  Dikey eksen gerçek siyasi soruyu ortaya koyar: solcu mu sağcı mı olduğunuz değil, devletin toplumu sizin değerlerinize göre şekillendirmeye ne ölçüde müdahale etmesini istediğiniz. Hassasiyetlerinizi başkalarına dayatmak mı istiyorsunuz, yoksa herkesin kendi adına karar vermekte özgür olmasını mı tercih ediyorsunuz? Bu çerçeve sol-sağ ayrımını aşar ve iki kampın da eşit derecede devletçi olabileceğini gösterir.
