question: Elementsは、ネットワークによる検証を可能にしつつトランザクションの金額を隠すために、どの暗号技術を使っていますか？
answer: ペダーセン・コミットメント
wrong_answers:
  - マークルツリーによるハッシュ化
  - 楕円曲線署名
  - SHA-256による暗号化
explanation: |
  ペダーセン・コミットメントは、ElementsのConfidential Transactionsでトランザクションの金額を隠すために使われる暗号技術です。目に見える金額を暗号学的なコミットメントに置き換えますが、バリデーターは実際の値を知らなくても、それを数学的に検証できます。マークルツリーはブロック内のトランザクションデータの整理に、楕円曲線署名はトランザクションの承認に使われ、SHA-256はハッシュアルゴリズムです。いずれも、ペダーセン・コミットメントのように検証可能性を保ったまま金額を隠すものではありません。