question: "اصل عدم تجاوز، آن‌گونه که مورای روتبارد نظریه‌پردازی کرد، چیست؟"
answer: "آغاز کردن زور فیزیکی علیه فردی دیگر یا مالکیت او نامشروع است، هرچند خشونت دفاعی مجاز است"
wrong_answers:
  - "همه شکل‌های خشونت همیشه نادرست‌اند، از جمله دفاع از خود و مقاومت در برابر ستم"
  - "خشونت وقتی علیه نهادهای ستمگر به‌کار رود پذیرفتنی است، اما هرگز علیه افراد دیگر نه"
  - "تنها دولت حق مشروع استفاده از زور را دارد و افراد هرگز نباید به خشونت متوسل شوند"
explanation: >-
  اصل عدم تجاوز روتبارد می‌گوید آغاز کردن زور فیزیکی علیه شخصی دیگر یا مالکیت او نامشروع است. این ترجمه‌ای فلسفی از قاعده طلایی است. با این حال، همه خشونت‌ها را ممنوع نمی‌کند: خشونت دفاعی، از جمله دفاع از خود و مقاومت در برابر ستم، مشروع دانسته می‌شود. همین آن را از صلح‌طلبی محض و از انحصار ادعایی دولت بر زور متمایز می‌کند.
reviewed: false
