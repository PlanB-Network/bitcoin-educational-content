question: "Uburyo bw'imiterere busigura gute itandukaniro ry'ishingiro hagati ya sosiyalizimu na libertarianism?"
answer: "Sosiyalizimu iha ubukuru Leta biciye mu mategeko agenga, mu gutegura, no mu kugenzura, mu gihe libertarianism iha ubukuru umuntu ku giti ciwe biciye mu kwivanga guke kwa Leta"
wrong_answers:
  - "Sosiyalizimu ishira imbere ibibano vy'abarimyi vyo mu misozi, mu gihe libertarianism ishigikira iterambere ry'inganda zo mu bisagara"
  - "Sosiyalizimu isigurwa n'uko ishigikira amatora ya demokarasi, mu gihe libertarianism yanka uburyo bwose bwo kugira uruhara muri politike"
  - "Sosiyalizimu yibanda kuri politike y'imigenderanire n'amakungu n'ugukorana mpuzamakungu, mu gihe libertarianism yitwararika gusa ibibazo vy'ubutunzi vyo mu gihugu"
explanation: >-
  Mu miterere, sosiyalizimu irangwa n'ukuba Leta iri hose, aho igenga, itegura, ikanagenzura. Libertarianism isigurwa n'ukwivanga guke kwa Leta mu butunzi no mu buzima bwite, igana ku bukuru bw'umwidegemvyo w'umuntu ku giti ciwe n'isoko yidegemvya. Iri tandukaniro ry'imiterere rirafasha cane mu gusesengura kuruta kugereranya imigambi ivugwa na buri mugwi.
