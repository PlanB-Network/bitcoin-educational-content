question: "Czym libertariańska koncepcja wolności różni się od koncepcji centrowej?"
answer: "Libertarianie traktują wolność jako bezwarunkowy aksjomat, podczas gdy centryści bronią wolności oportunistycznie, zależnie od kontekstu i efektywności"
wrong_answers:
  - "Libertarianie pozwalają państwu chronić wolność wybiórczo, podczas gdy centryści odrzucają jakiekolwiek zaangażowanie państwa w ochronę praw jednostki"
  - "Libertarianie skupiają wolność wyłącznie na kwestiach gospodarczych, podczas gdy centryści stosują wolność szeroko w domenach społecznych i kulturowych"
  - "Libertarianie i centryści podzielają ten sam pogląd na wolność, ale nie zgadzają się co do wielkości rządu potrzebnego do jej egzekwowania"
explanation: >-
  Libertarianie definiują wolność jako ogólną, bezwarunkową zasadę, która funkcjonuje jako aksjomat. Centryści natomiast bronią pewnych wolności w sposób oportunistyczny i kontekstualny, bez stosowania jakiejkolwiek ogólnej zasady. Podejście centrowe ujawnia instrumentalną koncepcję wolności, zawsze podporządkowaną pragmatycznym celom takim jak efektywność, co libertarianie fundamentalnie odrzucają.
