question: "Kategoria ya uhuru wa binafsi inajumuisha nini?"
answer: "Unachofanya katika mahusiano yako ya faragha, na maoni yako, imani zako, na kila kitu kinachohusu mwili na akili yako mwenyewe"
wrong_answers:
  - "Unachofanya kama mzalishaji, ikijumuisha kuanzisha biashara, kuajiri wafanyakazi, na kufanya biashara ya bidhaa"
  - "Kiasi cha kodi unacholipa, uwekezaji unaofanya, na jinsi unavyosimamia mali zako za kifedha"
  - "Uwezo wako wa kushindana sokoni, kupanga bei za bidhaa zako, na kuchagua wasambazaji wako"
explanation: >-
  Uhuru wa binafsi unajumuisha unachofanya katika mahusiano yako ya faragha, na maoni na imani zako, na kila kitu kinachohusu mwili na akili yako mwenyewe. Hii inajumuisha ndoa, chaguo za usomaji, desturi za kidini, chaguo za chakula na dawa, na watu unaoshirikiana nao. Shughuli za biashara, kodi, na maamuzi ya sokoni huangukia chini ya uhuru wa kiuchumi.
