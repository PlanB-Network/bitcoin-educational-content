question: Каков тип выражения pair (drop iden) (take iden), и какую функцию оно обозначает?
answer: A × B ⊢ B × A — оно меняет местами два компонента пары.
wrong_answers:
  - A × B ⊢ A × B — оно пропускает оба компонента без изменений (тождественная функция).
  - "Некорректно типизировано: take iden и drop iden имеют разные типы результата, которые pair не может объединить."
  - (A × B) × (A × B) ⊢ B × A — pair объединяет типы входов своих двух подвыражений.
explanation: >-
  drop iden : A × B ⊢ B извлекает второй компонент, а take iden : A ×
  B ⊢ A извлекает первый. Комбинатор pair требует лишь, чтобы оба его
  подвыражения имели один и тот же тип входа (здесь — A × B); их выходы
  могут различаться и возвращаются в виде пары. На входе ⟨a, b⟩
  выражение поэтому даёт ⟨b, a⟩ — функцию перестановки типа
  A × B ⊢ B × A.
reviewed: false
