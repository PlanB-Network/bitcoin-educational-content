question: "United States में शास्त्रीय उदारवादियों ने 1960s के बाद से खुद को 'libertarians' कहना क्यों शुरू किया?"
answer: "खुद को अमेरिकी liberals से अलग दिखाने के लिए, जिनका अर्थ राज्य-हस्तक्षेपवाद की ओर बदल गया था"
wrong_answers:
  - "खुद को Democratic Party और उसके प्रगतिशील सामाजिक कार्यक्रमों के साथ जोड़ने के लिए"
  - "Lyndon B. Johnson के Great Society सुधारों के प्रति अपना समर्थन संकेतित करने के लिए"
  - "यूरोपीय समाजवादी आंदोलनों से प्रेरित अधिक कट्टर क्रांतिकारी पहचान अपनाने के लिए"
explanation: >-
  United States में 'liberal' शब्द का अर्थ बड़ी सरकार और राज्य-हस्तक्षेप के समर्थकों से जुड़ गया, विशेषकर New Deal और Great Society के बाद। शास्त्रीय उदारवादियों ने अपने दर्शन के मूल अर्थ को बचाए रखने के लिए 'libertarian' लेबल अपनाया। वे अमेरिकी liberals से दूरी बना रहे थे, उनके साथ जुड़ नहीं रहे थे।
reviewed: false
