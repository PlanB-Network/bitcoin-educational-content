question: "Was stellen Libertäre ins Zentrum ihrer politischen Philosophie?"
answer: "Ethik und Recht"
wrong_answers:
  - "Wirtschaftswachstum und Vermögensbildung"
  - "Soziale Gleichheit und kollektives Wohlergehen"
  - "Nationale Identität und kulturelle Bewahrung"
explanation: >-
  Libertäre unterscheiden sich von allen anderen politischen Familien dadurch, dass sie Ethik und Recht ins Zentrum ihrer Philosophie stellen, nicht die Wirtschaft. Wenn sie die Marktwirtschaft verteidigen, dann weniger wegen ihrer Fähigkeit, Wohlstand zu schaffen, als wegen ihrer Förderung individueller Freiheit und Verantwortung. Wirtschaftswachstum ist ein sekundärer Nutzen, nicht das grundlegende Prinzip.
reviewed: false
