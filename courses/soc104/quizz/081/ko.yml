question: "중앙계획이 실패하는 이유에 관한 Hayek의 근본 논거는 무엇인가요?"
answer: "지식은 서로 다른 개인들이 보유한 분산된 조각으로만 존재하며, 중앙 권위가 그것을 집중하거나 통합할 수 없다는 것입니다"
wrong_answers:
  - "중앙계획자들은 도덕적으로 부패해 항상 공익보다 자신의 사익을 위해 행동한다는 것입니다"
  - "민주주의 제도는 경제 변화에 대응하기에 너무 느려서 중앙집중적 결정이 항상 뒤처진다는 것입니다"
  - "중앙계획은 시민들이 정부 명령에 고의로 저항하고 규제 준수를 거부하기 때문에 실패한다는 것입니다"
explanation: >-
  Hayek의 근본 논거는 정보의 본성에 기초합니다. 그는 지식이 결코 집중되거나 통합된 형태로 존재하지 않고, 오직 모든 서로 다른 개인들이 보유한 분산된 조각으로만 존재한다는 점을 보여 주었습니다. 가치는 주관적이며 오직 지역적으로, 불완전하게만 알려집니다. 사무실에 앉아 있는 중앙계획자는 자신이 상호작용과 교환에 참여하지 않기 때문에 사물의 진정한 가격에 대한 지식을 갖지 못합니다.
