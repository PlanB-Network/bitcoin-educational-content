question: "Quale principio guida orientava i voti di Frederic Bastiat nell'Assemblea nazionale?"
answer: "La promozione delle libertà individuali ed economiche e la riduzione dell'interferenza del governo"
wrong_answers:
  - "La difesa dell'autorità reale e la preservazione delle tradizioni monarchiche"
  - "L'avanzamento di politiche socialiste per ridistribuire la ricchezza in modo più equo"
  - "Una strategia centrista di compromesso tra le fazioni di sinistra e di destra"
explanation: >-
  Bastiat votava sulla base di un principio fondamentale: promuovere le libertà individuali ed economiche riducendo al contempo l'interferenza del governo. Non era un opportunista centrista, né un monarchico o un socialista. Votava con il lato che proponeva misure allineate alla libertà e a un governo limitato.
