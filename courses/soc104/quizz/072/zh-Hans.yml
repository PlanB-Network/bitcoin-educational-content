question: "在补贴辩论中，“道德风险”概念是什么，哪个政治家族提出了这种担忧？"
answer: "道德风险是指当公司通过补贴被阻止倒闭时产生的趋向不负责任的激励，因为最终由纳税人买单；这种担忧由自由意志主义者提出"
wrong_answers:
  - "道德风险是指受补贴公司会迁往税率更低的国家并带走就业岗位的风险；这种担忧由保守主义者提出"
  - "道德风险是指政府官员会因选择哪些公司获得补贴而变得腐败的危险；这种担忧由中间主义者提出"
  - "道德风险是指公司在获得公共资金后剥削工人的伦理问题；这种担忧由社会主义者提出"
explanation: >-
  自由意志主义者认为，补贴和救助会制造道德风险：当公司被阻止倒闭时，这会激励不负责任和鲁莽，因为糟糕决策没有后果。最终买单的是纳税人，而自由意志主义者认为这极其不公。这个概念不同于其他政治家族提出的关于企业迁移、官员腐败或工人剥削的担忧。
reviewed: false
