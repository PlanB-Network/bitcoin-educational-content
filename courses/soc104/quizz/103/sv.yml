question: "Hur hävdar kursen att frihet gör det möjligt för både vänster- och högervärderingar att samexistera fredligt?"
answer: "I en ordning med verklig frihet kan människor med vänsterideal frivilligt dela egendom och omfördela medel, medan de med högervärderingar kan spara och föra traditioner vidare, utan att någon sida påtvingar den andra sitt sätt att leva"
wrong_answers:
  - "Frihet kräver att båda sidor kompromissar genom att acceptera en mittenposition där staten balanserar konkurrerande värderingar genom måttlig reglering"
  - "Frihet innebär att vänster- och högersamhällen måste leva i separata geografiska områden med egna oberoende regeringar"
  - "Frihet fungerar genom att låta medborgarna rösta om vilka värderingar som ska genomdrivas i varje region, med växling mellan vänster- och högerpolitik vid varje valcykel"
explanation: >-
  Kursen visar att i en verklig frihetsordning kan de som ansluter sig till vänsterideal frivilligt avstå från ägodelar, dela produktionsmedel eller donera löner till omfördelande organisationer. De med högervärderingar kan arbeta hårt, spara och föra familjevärderingar vidare. Ingen bör påtvinga andra sitt sätt att leva. Det är genom marknadens frihet och valets kraft som mål kan uppnås fredligt.
reviewed: false
