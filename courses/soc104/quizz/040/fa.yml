question: "میلتون فریدمن درباره داوری سیاست‌ها چه هشداری داد؟"
answer: "سیاست‌ها باید بر اساس نتایجشان داوری شوند، نه بر اساس نیت‌هایشان"
wrong_answers:
  - "سیاست‌ها باید بر اساس شخصیت اخلاقی سیاستمدارانی داوری شوند که آن‌ها را پیشنهاد می‌کنند"
  - "سیاست‌ها باید بر اساس میزان محبوبیتشان نزد عموم رأی‌دهندگان داوری شوند"
  - "سیاست‌ها باید بر اساس سازگاری‌شان با قانون اساسی اولیه کشور داوری شوند"
explanation: >-
  فریدمن نوشت یکی از بزرگ‌ترین اشتباه‌ها این است که سیاست‌ها را بر اساس نیت‌هایشان داوری کنیم نه نتایجشان، و یادآور شد برنامه‌هایی که به نام فقرا برچسب‌گذاری می‌شوند تقریباً همیشه آثاری مخالف با آنچه حامیانشان قصد داشته‌اند پدید می‌آورند. این بازتاب آموزه باستیا است که اقتصاددان خوب هم آثار کوتاه‌مدت و هم آثار بلندمدت را بر کل جمعیت در نظر می‌گیرد.
reviewed: false
