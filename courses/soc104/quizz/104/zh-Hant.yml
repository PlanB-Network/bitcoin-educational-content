question: "本課程如何主張，自由能讓左翼與右翼價值和平共存？"
answer: "在真正自由的制度中，抱持左翼理想的人可以自願分享財產並重新分配資金，而抱持右翼價值的人可以儲蓄並傳承傳統，雙方都不把自己的生活方式強加於對方"
wrong_answers:
  - "自由要求雙方妥協，接受由政府透過溫和監管平衡競爭價值的中間派立場"
  - "自由意味著左翼與右翼社群必須生活在彼此分離的地理領土中，並擁有各自獨立的政府"
  - "自由的運作方式，是允許公民投票決定每個地區應強制執行哪些價值，並在每個選舉週期於左翼與右翼政策之間輪換"
explanation: >-
  本課程顯示，在真正自由的制度中，堅持左翼理想的人可以自願放棄財產、分享生產資料，或將工資捐給再分配組織。抱持右翼價值的人可以努力工作、儲蓄，並傳承家庭價值。任何人都不應把自己的生活方式強加於他人。正是透過市場自由與選擇的力量，目標才能和平達成。
reviewed: false
