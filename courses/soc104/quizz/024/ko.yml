question: "문화적 보수주의란 무엇인가요?"
answer: "과거에서 물려받은 가족적, 도덕적, 미학적, 형이상학적 가치에 대한 개인적 고수이며, 정치 철학이 아닙니다"
wrong_answers:
  - "국가 권력을 사용해 입법을 통해 전통적 가치를 사회 전체에 강요하는 정치 이념입니다"
  - "모든 형태의 근대성을 거부하고 사회를 산업화 이전의 생활 방식으로 되돌리려는 운동입니다"
  - "국내 산업을 보호하고 외국과의 자유 무역에 반대하는 경제 교리입니다"
explanation: >-
  문화적 보수주의는 삶의 지혜로 정의됩니다. 그리스-로마적이든 유대-기독교적이든, 과거에서 물려받은 가족적, 도덕적, 미학적, 형이상학적 가치에 대한 개인적 고수입니다. 이는 명시적으로 정치 철학이 아닙니다. 국가 권력을 통해 정치 제도와 사회 질서를 보존하려는 정치적 보수주의와 다릅니다. 또한 근대성 거부나 경제적 보호주의에 관한 것도 아닙니다.
reviewed: false
