question: "Kubera iki umurongo uhagaze (hejuru-hasi) ufatwa nk'uw'ishimikiro kuruta umurongo utambitse (ibubamfu-iburyo) ku gishushanyo ca Nolan?"
answer: "Kubera ko ugaragaza igaburwa ry'ukuri hagati y'abashigikira umwidegemvyo mwinshi ushoboka w'umuntu ku giti ciwe n'abashigikira igenzura rinini rishoboka rya leta"
wrong_answers:
  - "Kubera ko upima umwimbu w'ubutunzi neza kuruta uko umurongo utambitse upima amapolitike y'ikibano"
  - "Kubera ko amakimbirane menshi ya politike muri kahise yari yerekeye akaranga k'imico kuruta ubutegetsi"
  - "Kubera ko umurongo utambitse ukora gusa kuri demokarasi za none, mu gihe umurongo uhagaze ari rusangi hose"
explanation: >-
  Umurongo w'ishimikiro ni uwuhagaze kubera ko ufata ikibazo nyamukuru ca politike: leta ikwiye kugenzura ibikorwa vy'umuntu ku rugero rungana iki? Umurongo ibubamfu-iburyo werekana gusa inyiyumvo zitandukanye (ubutungane bw'ikibano ku ruhande rumwe, imigenzo ku rundi), ariko impande zompi zishobora kuba ku kibanza kimwe ku murongo uhagaze nk'abashigikira ububasha bwa leta. Umurongo uhagaze ugaragaza nimba umuntu ashaka guhata abandi kwakira ivyo abona akoresheje inguvu canke yubaha umwidegemvyo w'umuntu ku giti ciwe.
