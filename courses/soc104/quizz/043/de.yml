question: "Was bedeutet der Begriff 'Holismus' im Kontext sozialistischer Philosophie?"
answer: "Eine Sicht der Gesellschaft als unteilbares Ganzes, in dem das Kollektiv Vorrang vor dem Individuum hat"
wrong_answers:
  - "Eine Philosophie, die jedes Individuum als in sich abgeschlossene Einheit behandelt, deren Rechte von keiner Gruppe außer Kraft gesetzt werden können"
  - "Eine Wirtschaftstheorie, die dafür eintritt, öffentliche und private Sektoren in gleichem Maße auszubalancieren"
  - "Eine politische Strategie, die alle Minderheitenstandpunkte in eine einzige konsensbasierte Plattform integriert"
explanation: >-
  Holismus stammt vom griechischen 'holos', was 'das Ganze' bedeutet. Im sozialistischen Denken bezieht er sich auf eine Sicht der Gesellschaft als unteilbares Ganzes und nicht als einfache Summe von Individuen. Der sozialistische Staat zielt darauf ab, menschliche Tätigkeit so weit wie möglich zu übernehmen und zu lenken. Dieses Kollektiv kann als soziale Klasse, Nation, Rasse oder Geschlecht repräsentiert werden, aber in jedem Fall wird das Individuum durch Gruppenzugehörigkeit definiert.
