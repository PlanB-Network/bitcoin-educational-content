question: "Aké základné rozdelenie od začiatku dvadsiateho storočia oddeľovalo socialistov?"
answer: "Revoluční socialisti, ktorí sa usilovali uchopiť moc násilím, verzus reformistickí socialisti, ktorí sledovali zmenu prostredníctvom demokratických volieb"
wrong_answers:
  - "Mestskí socialisti, ktorí sa zameriavali na priemyselných robotníkov, verzus vidiecki socialisti, ktorí organizovali poľnohospodárske komúny"
  - "Nacionalistickí socialisti, ktorí uprednostňovali vlastnú krajinu, verzus internacionalistickí socialisti, ktorí obhajovali globálnu revolúciu"
  - "Intelektuálni socialisti, ktorí písali teoretické texty, verzus aktivistickí socialisti, ktorí organizovali robotnícke štrajky"
explanation: >-
  Od začiatku dvadsiateho storočia existovalo základné rozdelenie medzi revolučnými socialistami, ktorí odporovali vlastníckym právam a usilovali sa zničiť kapitalistickú spoločnosť násilím alebo diktatúrou proletariátu, a reformistickými socialistami, ktorí sledovali sociálnu spravodlivosť prostredníctvom demokratických volieb a zdaňovania, pričom dočasne prijímali kapitalizmus. Tento rozkol formoval celé nasledujúce dejiny socialistických hnutí.
