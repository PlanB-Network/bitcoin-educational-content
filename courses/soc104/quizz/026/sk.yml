question: "Čo znamená pojem 'liberal' v európskej politickej tradícii?"
answer: "Zástanca ekonomiky laissez-faire, obmedzeného štátneho zásahu a individuálnych slobôd"
wrong_answers:
  - "Zástanca štátneho zásahu, verejného zdravotného poistenia a programov proti chudobe"
  - "Radikálny anarchista, ktorý sa usiluje o úplné zrušenie vlády a súkromného vlastníctva"
  - "Centrista, ktorý vo všetkých oblastiach politiky rovnomerne vyvažuje socialistické a konzervatívne pozície"
explanation: >-
  V Európe zostal liberalizmus spojený s ekonomickými politikami laissez-faire, obmedzeným štátnym zásahom a obranou individuálnych slobôd. Prvá nesprávna odpoveď opisuje amerických liberals, ktorí posunuli význam tohto pojmu smerom k intervencionizmu. Európsky liberalizmus nie je ani anarchizmom, ani centrizmom.
