question: assignats පිළිබඳ තම ප්‍රචාරක පොතේ Dupont de Nemours තමන්ව ඉදිරිපත් කරන්නේ කෙසේද?
answer: ජනතාවගේ මිතුරෙකු ලෙස
wrong_answers:
  - රජුගේ මිතුරෙකු ලෙස
  - නිදහසේ මිතුරෙකු ලෙස
  - Bourgeoisගේ මිතුරෙකු ලෙස
explanation: |
  Dupont de Nemours තමන්ව "ජනතාවගේ මිතුරෙකු" ලෙස ඉදිරිපත් කරමින්, ජනගහනයේ යහපැවැත්ම පිළිබඳ තම සැලකිල්ල අවධාරණය කළේය.