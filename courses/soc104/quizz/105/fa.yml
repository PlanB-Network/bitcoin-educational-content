question: "با در نظر گرفتن استدلال کامل این دوره، Bitcoin چگونه هم‌زمان نقد لیبرتارینِ سازه‌گرایی، تعهد سایفرپانکی به کنش، و دفاع فردگرایانه از خودمختاری اخلاقی را مجسم می‌کند؟"
answer: "Bitcoin پول برنامه‌ریزی‌شده مرکزی را با نظمی خودجوش در بازار جایگزین می‌کند (ضد سازه‌گرایی)، آرمان انتزاعی آزادی مالی را به کدی کارآمد تبدیل می‌کند (کنش سایفرپانکی)، و مالکیت حاکمانه و حریم خصوصی را به فرد بازمی‌گرداند (خودمختاری اخلاقی)"
wrong_answers:
  - "Bitcoin از حکمرانی دموکراتیک برای تعیین سیاست پولی استفاده می‌کند (ضد سازه‌گرایی)، محتوای آموزشی درباره آزادی مالی منتشر می‌کند (کنش سایفرپانکی)، و به افراد اجازه می‌دهد درباره تغییرات پروتکل رأی دهند (خودمختاری اخلاقی)"
  - "Bitcoin همه مقررات مالی را حذف می‌کند (ضد سازه‌گرایی)، جامعه‌ای از توسعه‌دهندگان می‌سازد که برای مقررات‌زدایی لابی می‌کنند (کنش سایفرپانکی)، و به افراد ثروتمند کنترل بیشتری بر سیاست پولی می‌دهد (خودمختاری اخلاقی)"
  - "Bitcoin زیرساخت سرورها را در چندین کشور غیرمتمرکز می‌کند (ضد سازه‌گرایی)، از مجوزدهی متن‌باز برای اشتراک آزادانه فناوری استفاده می‌کند (کنش سایفرپانکی)، و بسترهای شبکه اجتماعی ناشناس برای مخالفت سیاسی فراهم می‌کند (خودمختاری اخلاقی)"
explanation: >-
  Bitcoin در محل تلاقی سه سنت فکری بررسی‌شده در این دوره قرار دارد. استدلال ضد سازه‌گرایی را با جایگزین کردن پول Fiat برنامه‌ریزی‌شده مرکزی با نظمی پولی، خودجوش و غیرمتمرکز که هیچ برنامه‌ریز مرکزی نمی‌تواند کنترلش کند مجسم می‌کند. الزام سایفرپانکیِ نوشتن کد را با تبدیل آرمان‌های انتزاعی آزادی مالی و حریم خصوصی به فناوری کارآمد برآورده می‌سازد. و با ممکن کردن مالکیت حاکمانه، حفاظت از ثمرات کار، و حفظ حریم خصوصی، در خدمت دفاع فردگرایانه از خودمختاری اخلاقی است و می‌گذارد هر شخص ارباب زندگی خودش باشد.
reviewed: false
