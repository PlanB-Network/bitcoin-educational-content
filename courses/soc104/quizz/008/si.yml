question: "fiat මුදල් පද්ධතිය පාලකයන් සහ පාලිතයන් අතර බෙදීම ශක්තිමත් කරන්නේ කෙසේද?"
answer: "මුදල් නිර්මාණය හරහා සීමාවක් නැති වියදම් මූල්‍යකරණය කිරීමට එය රජයන්ට ඉඩ දෙයි; එමඟින් උද්ධමනය හරහා ඉතිරිකිරීම්වල වටිනාකම අඩු වේ"
wrong_answers:
  - "ප්‍රජාතන්ත්‍රවාදී මැතිවරණ සහ ජනමත විචාරණ හරහා මුදල් ප්‍රතිපත්තිය මත පුරවැසියන්ට සෘජු පාලනය ලබා දෙයි"
  - "රජයන්ට ණය ගැනීම වැළැක්වී, ආදායම සඳහා බදුකරණය මත පමණක් රඳා සිටීමට බල කරයි"
  - "ආර්ථික වර්ධනය උත්තේජනය කිරීමට අලුතින් නිර්මාණය කළ මුදල් සියලු පුරවැසියන් අතර සමානව බෙදාහරියි"
explanation: >-
  Fiat මුදල් රාජ්‍ය බලය ව්‍යාප්ත වීමේ මූලස්ථම්භය ලෙස විස්තර කරන්නේ, එය රජයන්ට ණය ගැනීමට සහ බැංකු නව මුදල් මුද්‍රණය කිරීමට තල්ලු කිරීමට ඉඩ දෙන නිසාය. ප්‍රතිඵලයක් වන උද්ධමනය මිනිසුන්ගේ ඉතිරිකිරීම්වල වටිනාකම අඩු කර, ධනවත්ම සහ බලවත්ම ආයතනවලට වාසි සලසයි. එය පුරවැසියන්ට මුදල් පාලනය ලබා නොදෙන අතර, ණය ගැනීම වැළැක්වීම හෝ මුදල් සමානව බෙදාහැරීම ද නොකරයි.
