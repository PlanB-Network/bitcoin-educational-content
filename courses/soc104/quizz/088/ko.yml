question: "Karl Popper의 열린 사회와 닫힌 사회 구분은 개인주의 대 집단주의 논쟁과 어떻게 관련되나요?"
answer: "열린 사회는 개인이 개인적 결정을 통해 스스로 판단할 권리를 인정하는 반면, 닫힌 사회는 집단주의적이며 부족적 사고방식과 비판적 자유의 거부에 기초합니다"
wrong_answers:
  - "열린 사회는 국경을 넘는 자유무역을 허용하는 사회인 반면, 닫힌 사회는 관세와 보호주의적 경제정책을 부과합니다"
  - "열린 사회는 모든 시민이 투표하는 직접민주주의로 통치되는 사회인 반면, 닫힌 사회는 단일 세습 군주가 지배합니다"
  - "열린 사회는 모든 정부 문서를 투명하게 공개하는 반면, 닫힌 사회는 정보를 국가기밀로 분류합니다"
explanation: >-
  Popper는 닫힌 사회를 마법적 또는 부족적 사회로, 열린 사회를 개인들이 개인적 결정에 직면하는 사회로 정의했습니다. 닫힌 사회는 집단주의적이며, 비판적 자유의 거부와 정적 질서의 이상화가 결합된 부족적 사고방식에 의존합니다. 열린 사회는 가치, 신념, 관계의 자유로운 선택에 우선성을 부여하며, 개인주의 원칙을 직접 구현합니다.
