question: "Nhóm tự do kinh tế bao gồm những gì?"
answer: "Những gì bạn làm với tư cách là người sản xuất và người tiêu dùng: mua, bán, sản xuất, làm việc, thuê người và quản lý tiền của bạn"
wrong_answers:
  - "Niềm tin tôn giáo, các mối quan hệ cá nhân và quyền tự do biểu đạt của bạn"
  - "Quyền bỏ phiếu, tham gia bầu cử và gia nhập các đảng chính trị của bạn"
  - "Khả năng đi lại tự do, chọn nơi cư trú và vượt qua biên giới quốc gia của bạn"
explanation: >-
  Tự do kinh tế bao quát những gì bạn làm với tư cách là người sản xuất và người tiêu dùng: bạn có thể mua, bán hay sản xuất gì; bạn làm việc ở đâu; bạn thuê ai; và bạn làm gì với tiền của mình. Các mối quan hệ cá nhân, niềm tin tôn giáo và quyền tự do đi lại thuộc về nhóm tự do cá nhân, không phải nhóm kinh tế.
