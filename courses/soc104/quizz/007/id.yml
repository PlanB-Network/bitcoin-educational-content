question: "Apa yang termasuk dalam kategori kebebasan ekonomi?"
answer: "Apa yang Anda lakukan sebagai produsen dan konsumen: membeli, menjual, memproduksi, bekerja, merekrut, dan mengelola uang Anda"
wrong_answers:
  - "Keyakinan agama, hubungan pribadi, dan kebebasan berekspresi Anda"
  - "Hak Anda untuk memilih, berpartisipasi dalam pemilu, dan bergabung dengan partai politik"
  - "Kemampuan Anda untuk bepergian secara bebas, memilih tempat tinggal, dan melintasi perbatasan nasional"
explanation: >-
  Kebebasan ekonomi mencakup apa yang Anda lakukan sebagai produsen dan konsumen: apa yang dapat Anda beli, jual, atau produksi; di mana Anda bekerja; siapa yang Anda rekrut; dan apa yang Anda lakukan dengan uang Anda. Hubungan pribadi, keyakinan agama, dan kebebasan bergerak termasuk dalam kategori kebebasan pribadi, bukan ekonomi.
