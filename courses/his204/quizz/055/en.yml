question: In which countries were economic reforms inspired by Physiocracy applied?
answer: France, Germany, Italy, and Sweden
wrong_answers:
  - England, Spain, and Holland
  - Portugal, England, and Spain
  - Holland, Spain, and Portugal
explanation: |
  Physiocratic reforms were applied in France (under Turgot), Germany (Margrave of Baden, with Schlettwein's experiment in Dietlingen), Italy (Leopold of Tuscany), and Sweden (Gustav III). Russia's Catherine II also invited Mercier de la Riviere, but was disappointed with him.