question: "Čo znamená pojem 'holizmus' v kontexte socialistickej filozofie?"
answer: "Vízia spoločnosti ako nedeliteľného celku, v ktorom má kolektív prvenstvo pred jednotlivcom"
wrong_answers:
  - "Filozofia, ktorá považuje každého jednotlivca za samostatnú jednotku, ktorej práva nemôže prekonať nijaká skupina"
  - "Ekonomická teória, ktorá obhajuje vyváženie verejného a súkromného sektora v rovnakej miere"
  - "Politická stratégia, ktorá integruje všetky menšinové pohľady do jednej platformy založenej na konsenze"
explanation: >-
  Holizmus pochádza z gréckeho 'holos', čo znamená 'celok'. V socialistickom myslení označuje víziu spoločnosti ako nedeliteľného celku, nie ako jednoduchého súčtu jednotlivcov. Socialistický štát sa usiluje v maximálnej miere prevziať a riadiť ľudskú činnosť. Tento kolektív môže byť reprezentovaný ako spoločenská trieda, národ, rasa alebo rod, no v každom prípade je jednotlivec definovaný príslušnosťou ku skupine.
