question: "Mis on peamine erinevus ettevõtlusmeelse ja turumeelse hoiaku vahel?"
answer: "Ettevõtlusmeelsed pooldajad otsivad riigi sekkumist, et kaitsta konkreetseid ettevõtteid läbikukkumise eest, samas kui turumeelsed pooldajad toetavad dereguleerimist ja lasevad ettevõtetel läbi kukkuda, et turg saaks loomulikult ümber korralduda"
wrong_answers:
  - "Ettevõtlusmeelsed pooldajad keskenduvad suurkorporatsioonidele, samas kui turumeelsed pooldajad keskenduvad üksnes väikeettevõtete ja idufirmade toetamisele"
  - "Ettevõtlusmeelsus on vasakpoolne seisukoht, mis soosib töötajate kooperatiive, samas kui turumeelsus on parempoolne seisukoht, mis soosib eraomandit"
  - "Ettevõtlusmeelsed pooldajad lükkavad tagasi kogu konkurentsi, samas kui turumeelsed pooldajad toetavad valitsuse reguleeritud konkurentsi heakskiidetud ettevõtete vahel"
explanation: >-
  Ettevõtlusmeelne seisukoht käsitleb konkurentsi regulatsioonide abil loodud valitsemisvahendina ning õigustab toetusi ja päästepakette töökohtade kadumise vältimiseks. Ettevõtlusmeelses vaates on turg habras ja vajab riiklikku päästmist. Turumeelsed pooldajad näevad konkurentsi vaba ettevõtluse loomuliku tulemusena, mis tähendab dereguleerimist ja ettevõtetel läbi kukkuda laskmist, sest läbikukkumine võimaldab turul loomulikult ümber korralduda ja avab välja võimekamatele tegutsejatele.
reviewed: false
