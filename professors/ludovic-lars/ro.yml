bio: |
  Ludovic Lars este autor, editor și formator în lumea Bitcoin și a criptomonedelor. Inspirat de ideile liberale, a descoperit Bitcoin în 2013 și i s-a dedicat din 2017. A scris cartea The Elegance of Bitcoin, publicată în 2024 de Konsensus Network. A contribuit la traducerea cărților Cryptoeconomics, The Book of Satoshi și The Blocksize War. A scris de asemenea peste o sută de articole pe blogul său și pe alte site-uri specializate. Cu o pregătire științifică, a căutat mereu să descrie criptomonedele cât mai precis posibil și s-a specializat recent în studierea istoriei Bitcoin.

short_bio: Autor al cărții The Elegance of Bitcoin
