question: "Quais figuras emblemáticas estão associadas à liberdade econômica máxima no diagrama de Nolan?"
answer: "Margaret Thatcher, Ronald Reagan e Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures e Bernie Sanders"
  - "Nelson Mandela, Simone Veil e Noam Chomsky"
  - "Vladimir Putin, Xi Jinping e Joseph de Maistre"
explanation: >-
  Thatcher, Reagan e Milei são citados como figuras emblemáticas da liberdade econômica máxima, favorecendo menos intervenção estatal, menos regulações e impostos mais baixos. Roosevelt, Jaures e Sanders representam a extremidade oposta, favorável ao controle estatal da economia. Mandela, Veil e Chomsky representam a liberdade pessoal máxima. Putin, Xi Jinping e de Maistre representam o controle estatal máximo da vida pessoal.
reviewed: false
