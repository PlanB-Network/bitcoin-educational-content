question: "Welches konsistente Muster unterscheidet über alle fünf wirtschaftlichen Debatten hinweg (Steuern, Mindestlohn, Gesundheitsversorgung, Umwelt, Subventionen) die zentristische Methode von den Positionen anderer politischer Familien?"
answer: "Zentristen weigern sich, sich auf ein festes Prinzip festzulegen, und verlangen stattdessen empirische Analyse und Expertenbewertung, um Politik von Fall zu Fall zu bestimmen, wodurch ihr Ansatz inhärent technokratisch ist"
wrong_answers:
  - "Zentristen nehmen immer eine mittlere Position zwischen sozialistischen und konservativen Standpunkten ein und teilen bei jeder Frage gleichermaßen die Differenz"
  - "Zentristen priorisieren durchgängig Wirtschaftswachstum gegenüber sozialer Wohlfahrt, stehen in der Fiskalpolitik auf der Seite der Libertären und stimmen bei Regulierung mit Sozialisten überein"
  - "Zentristen überlassen alle wirtschaftlichen Entscheidungen internationalen Organisationen und Handelsabkommen, statt unabhängige nationale Politik zu machen"
explanation: >-
  Über alle fünf wirtschaftlichen Debatten hinweg folgt der zentristische Ansatz demselben Muster: Statt sich auf ein festes ideologisches Prinzip festzulegen, verlangen Zentristen empirische Belege und Expertenbewertung, bevor sie Entscheidungen treffen. Bei Steuern muss das richtige Niveau durch Analyse bestimmt werden. Beim Mindestlohn muss das Niveau pragmatisch angepasst werden. Bei der Gesundheitsversorgung ist eine von Experten kalibrierte Mischung ideal. Bei der Umwelt muss Politik Wettbewerbsfähigkeit ausbalancieren. Bei Subventionen muss jeder Fall nach seinen eigenen Vorzügen bewertet werden. Das macht den Zentrismus inhärent technokratisch, was etwas anderes ist, als einfach die Differenz zu teilen oder sich internationalen Gremien zu unterwerfen.
