question: "中间主义务实主义中隐藏着什么悖论？"
answer: "这种务实主义本身建立在某种教条主义之上，即一种未明说的信念：只有专家才有能力引导社会"
wrong_answers:
  - "中间主义者声称自己温和，但在联合政府中始终与左翼政党结盟"
  - "中间主义政策看似平衡，但总是偏向经济增长而不是环境保护"
  - "中间主义者拒绝意识形态，但在制定经济决策时采用僵硬的自由市场原则"
explanation: >-
  中间主义务实主义的悖论在于，它声称拒绝意识形态，转而支持理性专业知识；然而，这一主张本身却建立在一种不可见、未明说的教条之上：只有技术官僚才能作出正确决定。只有专家才应引导社会这一信念本身就是一种意识形态承诺，尽管中间主义者并不将其视为如此。
