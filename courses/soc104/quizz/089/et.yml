question: "Milles seisneb peamine lahkarvamus libertaaride ja teiste poliitiliste perekondade vahel, kui neil on samad eesmärgid?"
answer: "Lahkarvamus puudutab vahendeid: libertaarid lükkavad tagasi sunnilahendused ja eelistavad vabatahtlikku vahetust turuprotsessi kaudu"
wrong_answers:
  - "Lahkarvamus puudutab lõppeesmärke: libertaarid taotlevad teistsuguseid eesmärke, nagu individuaalne rikkus, mitte ühiskondlik heaolu"
  - "Lahkarvamus puudutab ajastust: libertaarid tahavad samu eesmärke saavutada aeglasemalt järkjärgulise reformi kaudu"
  - "Lahkarvamus puudutab ulatust: libertaarid tahavad samu poliitikaid rakendada ainult kohalikul, mitte riiklikul tasandil"
explanation: >-
  Libertaarid võivad sotsialistide, konservatiivide ja tsentristidega nõustuda teatud eesmärkides, nagu rõhutute kaitsmine või sotsiaalse ühtekuuluvuse edendamine. Lahkarvamus ei seisne lõppeesmärkides, vaid vahendites. Libertaarid lükkavad tagasi kõik sunnilahendused, mis püüavad praktikaid ja regulatsioone ühetaoliseks muuta, kaitstes selle asemel valikuvõimu ja vastutustundlikku vabadust vabade, detsentraliseeritud vahetuste kaudu, mis põhinevad vabatahtlikel lepingutel.
reviewed: false
