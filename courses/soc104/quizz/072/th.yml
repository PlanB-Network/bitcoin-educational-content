question: "จุดยืนอนุรักษนิยมและลิเบอร์ทาเรียนต่อค่าแรงขั้นต่ำแตกต่างกันอย่างไรในเหตุผลของพวกเขา แม้ทั้งสองสนับสนุนการยกเลิกมัน?"
answer: "อนุรักษนิยมยอมรับการมีส่วนร่วมของรัฐบางส่วนในการกำหนดค่าจ้าง หากมันไม่ขัดขวางความสามารถในการแข่งขัน ขณะที่ลิเบอร์ทาเรียนมองค่าแรงขั้นต่ำเป็นการบังคับทางศีลธรรมต่อเสรีภาพในการจ้างงานและทำธุรกิจ"
wrong_answers:
  - "อนุรักษนิยมคัดค้านค่าแรงขั้นต่ำเพราะมันสร้างเงินเฟ้อ ขณะที่ลิเบอร์ทาเรียนคัดค้านเพราะมันให้อำนาจสหภาพแรงงานมากเกินไป"
  - "อนุรักษนิยมต้องการให้ค่าจ้างถูกกำหนดโดยสถาบันศาสนาและชุมชน ขณะที่ลิเบอร์ทาเรียนต้องการให้ค่าจ้างถูกกำหนดโดยการศึกษาตลาดที่รัฐบาลอนุมัติ"
  - "อนุรักษนิยมเชื่อว่าค่าแรงขั้นต่ำควรแตกต่างกันตามภูมิภาค ขณะที่ลิเบอร์ทาเรียนเชื่อว่าค่าจ้างอัตราเดียวคงที่ควรใช้ทั่วประเทศ"
explanation: >-
  ทั้งสองสนับสนุนการลดหรือยกเลิกค่าแรงขั้นต่ำ แต่เหตุผลของพวกเขาแตกต่างกันโดยพื้นฐาน อนุรักษนิยมยอมรับการมีส่วนร่วมของรัฐบางส่วนในการกำหนดค่าจ้าง ขณะยืนกรานว่าต้องน้อยที่สุดและขึ้นกับบริบท โดยมุ่งที่ความสามารถในการแข่งขัน ลิเบอร์ทาเรียนมีจุดยืนทางศีลธรรมที่หนักแน่นกว่า: ค่าแรงขั้นต่ำคือการบังคับต่อเสรีภาพในการจ้างงานและทำธุรกิจ เมื่อลิเบอร์ทาเรียนพูดว่า "ตลาด" พวกเขาหมายถึงสัญญาที่เจรจาอย่างเสรีระหว่างสองฝ่ายโดยปราศจากการแทรกแซงของรัฐ
reviewed: false
