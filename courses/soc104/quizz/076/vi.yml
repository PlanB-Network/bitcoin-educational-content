question: "Trong các cuộc đối thoại năm 1849 của Gustave de Molinari, nhân vật nào bảo vệ tự do như một nguyên tắc nền tảng thay vì đặt nó dưới các mục tiêu khác?"
answer: "Nhà kinh tế, người xem tự do là một nguyên tắc không bị đặt dưới bất kỳ mục tiêu nào khác"
wrong_answers:
  - "Nhà xã hội chủ nghĩa, người bảo vệ tự do thông qua các cải cách tiến bộ nhằm hướng tới bình đẳng xã hội"
  - "Nhà bảo thủ, người duy trì tự do bằng cách bảo tồn trật tự xã hội truyền thống và ổn định"
  - "Cả ba nhân vật đều bảo vệ tự do ngang nhau nhưng bất đồng về cách thực hiện nó"
explanation: >-
  Trong các cuộc đối thoại của Molinari từ Les Soirees de la rue Saint-Lazare, nhà kinh tế luôn bất đồng với cả nhà xã hội chủ nghĩa lẫn nhà bảo thủ. Ông là người duy nhất bảo vệ tự do như một nguyên tắc nền tảng. Nhà xã hội chủ nghĩa đặt tự do dưới các lý tưởng tiến bộ, còn nhà bảo thủ đặt nó dưới việc bảo tồn trật tự, khiến nhà kinh tế trở nên độc đáo trong sự bảo vệ tự do vô điều kiện của mình.
