question: "De ce a criticat Rothbard viziunea libertaires asupra naturii umane și ce alternativă a propus?"
answer: "I-a acuzat că susțin o viziune naivă de tip «bunul sălbatic» și a argumentat că societatea trebuie să folosească proprietatea privată și stimulente bune pentru a ghida comportamentul interesat de sine"
wrong_answers:
  - "Le-a lăudat înțelegerea cooperării umane, dar a argumentat că un stat minimal era totuși necesar pentru a impune contractele"
  - "A fost de acord că oamenii sunt buni în mod natural, dar a insistat că doar piețele libere ar putea canaliza acea bunătate în activitate productivă"
  - "A respins accentul lor pe drepturile individuale și a argumentat în schimb că standardele morale ar trebui definite colectiv de comunități"
explanation: >-
  Rothbard i-a criticat pe libertaires pentru adoptarea unei viziuni naive, de tip rousseauist, asupra naturii umane ca fiind bună în mod natural. El a susținut în schimb că oamenii sunt ghidați de interesul propriu, iar societatea trebuie organizată astfel încât stimulentele bune să ghideze comportamentul. Aceasta cere recunoașterea și garantarea proprietății private. Abolirea statului nu înseamnă abolirea funcțiilor sale; poliția și justiția ar trebui gestionate de piața liberă prin concurență.
reviewed: false
