question: "Intwaro zose z'igitugu zigenzura vyose zashitse gute ku butegetsi?"
answer: "Biciye mu mpinduka y'ubutegetsi y'ubukazi yatsindagiye ko hakenewe gusiba burundu uburyo bwa kera"
wrong_answers:
  - "Biciye mu mavugurura y'amategeko buhorobuhoro imbere mu nzego za demokarasi zari zisanzweho"
  - "Biciye mu makudeta ya gisirikare yateguwe n'ibihugu vyo hanze vyarondera kugenzura akarere"
  - "Biciye mu mihari y'amahoro y'abantu benshi yatsinze amatora ku majwi menshi cane"
explanation: >-
  Intwaro zose z'igitugu zigenzura vyose zashitse ku butegetsi biciye mu mpinduka y'ubutegetsi y'ubukazi. Iyo mpinduka ifise intumbero zibiri: irasambura ku mubiri urutonde rwa kera kandi mu vyiyumviro igatsindagira ko gukoresha ubukazi ari ngombwa kugira hubakwe ikibano gishasha. Ivyo bitandukanya ukwigarurira ubutegetsi kw'intwaro z'igitugu zigenzura vyose n'ihinduka rya demokarasi, amakudeta ashigikiwe n'ibihugu vyo hanze, canke intsinzi z'amatora y'amahoro.
