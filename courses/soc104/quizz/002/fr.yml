question: "Quel principe directeur guidait les votes de Frédéric Bastiat à l'Assemblée nationale ?"
answer: "La promotion des libertés individuelles et économiques et la réduction de l'ingérence de l'État"
wrong_answers:
  - "La défense de l'autorité royale et la préservation des traditions monarchiques"
  - "La promotion de politiques socialistes visant à redistribuer plus équitablement les richesses"
  - "Une stratégie centriste de compromis entre les factions de gauche et de droite"
explanation: >-
  Bastiat votait selon un principe fondamental : promouvoir les libertés individuelles et économiques tout en réduisant l'ingérence de l'État. Il n'était ni un centriste opportuniste, ni un royaliste, ni un socialiste. Il votait avec le camp qui proposait des mesures alignées sur la liberté et un gouvernement limité.
reviewed: false
