question: "Kozi inatambua nini kama mgawanyiko halisi wa kisiasa, zaidi ya wigo wa jadi wa kushoto-kulia-katikati?"
answer: "Mgawanyiko kati ya kanuni za msingi za kifalsafa: uhuru au ulazimishaji, ridhaa ya hiari au kulazimishwa, mtu binafsi anayewajibika au jumuiya"
wrong_answers:
  - "Mgawanyiko kati ya mataifa tajiri na maskini kuhusu udhibiti wa mikataba ya biashara ya kimataifa na taasisi za kifedha za kimataifa"
  - "Mgawanyiko kati ya wakazi wa mijini na vijijini kuhusu vipaumbele vya matumizi ya serikali na uwekezaji wa miundombinu"
  - "Mgawanyiko kati ya tamaduni za kimaendeleo na za jadi kuhusu kanuni za kijamii, thamani za familia, na elimu ya kidini"
explanation: >-
  Kozi inadai kwamba mgawanyiko halisi wa kisiasa haupo katika lebo za jadi za kushoto-kulia-katikati bali katika kanuni za msingi za kifalsafa: uhuru au ulazimishaji, ridhaa ya hiari au kulazimishwa, mtu binafsi anayewajibika au jumuiya. Njia sahihi ya kufikiri kuhusu siasa ni kuanzia kwenye kanuni za kimaadili badala ya lebo.
