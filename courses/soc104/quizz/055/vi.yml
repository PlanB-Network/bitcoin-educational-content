question: "Vì sao Ron Paul lập luận rằng Federal Reserve là có hại, và Bitcoin liên hệ như thế nào với lập trường của ông?"
answer: "Federal Reserve gây ra lạm phát và các chu kỳ kinh tế thông qua thao túng tiền fiat, và Bitcoin đại diện cho một dạng tiền lành mạnh có thể thay thế bản vị vàng"
wrong_answers:
  - "Federal Reserve giới hạn cạnh tranh ngân hàng, và Bitcoin phi tập trung hóa các dịch vụ ngân hàng để cải thiện bao trùm tài chính"
  - "Federal Reserve ngăn cản thương mại tự do giữa các quốc gia, và Bitcoin cho phép các giao dịch xuyên biên giới không cần chính phủ phê duyệt"
  - "Federal Reserve tạo ra nợ chính phủ quá mức, và Bitcoin cung cấp một đồng tiền giảm phát loại bỏ nợ quốc gia"
explanation: >-
  Ron Paul, một minarchist, lập luận rằng Federal Reserve chịu trách nhiệm cho lạm phát và các chu kỳ kinh tế vì nó thao túng tiền fiat. Ông cổ vũ việc phi quốc hữu hóa tiền tệ, một ý tưởng do Friedrich Hayek ủng hộ, và xem Bitcoin như một dạng tiền lành mạnh có thể thay thế bản vị vàng. Phê phán của ông bắt nguồn từ lý thuyết tiền tệ libertarian, chứ không chủ yếu từ cạnh tranh ngân hàng, rào cản thương mại, hay nợ chính phủ.
