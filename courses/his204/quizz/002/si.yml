question: Sully කුමන රජුගේ ඇමතිවරයාද?
answer: Henri IV
wrong_answers:
  - Louis XIV
  - Louis XV
  - Louis XIII
explanation: |
  Maximilien de Béthune, Duc de Sully, Henri IVගේ ප්‍රධාන ඇමතිවරයා විය. ආගමික යුද්ධවලින් පසු රාජකීය මුදල් තත්ත්වය නැවත පිහිටුවීමට සහ රාජධානියේ ආර්ථික ප්‍රතිසාධනයට ඔහු ප්‍රධාන භූමිකාවක් ඉටු කළේය.
