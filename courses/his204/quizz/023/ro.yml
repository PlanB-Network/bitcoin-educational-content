question: De ce a fost Saint-Pierre exclus din Académie française?
answer: A îndrăznit să critice domnia lui Ludovic al XIV-lea, plină de războaie și exces
wrong_answers:
  - Suferind de o boală gravă, înnebunise pe jumătate
  - Îndrăznise să-l susțină pe regele Angliei, dușmanul ereditar al Franței
  - Plagiase un alt academician
explanation: |
  Saint-Pierre a fost exclus din Académie française pentru că a criticat domnia lui Ludovic al XIV-lea, în special războaiele și cheltuielile sale excesive. Critica sa a fost considerată lipsită de respect față de monarh.
