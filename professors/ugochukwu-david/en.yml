bio: |
  I'm a Nigerian Human Anatomist turned Bitcoiner. First heard about Bitcoin in 2014, properly orange-pilled in 2017. My Bitcoin "Ahaaa" moment was in 2021. I will be writing tutorials about simple hacks for Bitcoin technology that people find hard to use. I'm building Bolta.app, a Bitcoin Insurance Bank.  
