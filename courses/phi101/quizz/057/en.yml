question: What was the influence of the School of Salamanca on the development of modern thought?
answer: It contributed to the emergence of international law and the recognition of universal human rights.
wrong_answers:
  - It laid the foundations of modern political philosophy by asserting the separation of powers and popular sovereignty.
  - It promoted the spread of mercantilism across European trading empires.
  - It influenced scientific thought by encouraging the experimental method and rationalism.
explanation: |
  The School of Salamanca's most significant contribution was the emergence of international law and the recognition of universal human rights, notably through Francisco de Vitoria and Bartolomeo de Las Casas who defended the rights of Indigenous peoples based on natural law.
reviewed: true
