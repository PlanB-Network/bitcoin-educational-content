question: "자유지상주의자와 보수주의자는 어떤 공통 기반을 공유하며, 무엇이 그들을 갈라놓나요?"
answer: "그들은 제한된 정부에 대한 애착과 강제된 평등주의에 대한 거부를 공유하지만, 군사 개입주의와 사회 정책에서 의견이 갈립니다"
wrong_answers:
  - "그들은 보호주의적 무역 정책과 국방에 대한 지지를 공유하지만, 공적 삶에서 종교의 역할에 대해서는 의견이 갈립니다"
  - "그들은 누진 과세와 복지 프로그램에 대한 헌신을 공유하지만, 이민 정책에서는 의견이 갈립니다"
  - "그들은 자유 무역과 마약 합법화에 대한 반대를 공유하지만, 연방정부의 규모에 대해서는 의견이 갈립니다"
explanation: >-
  자유지상주의자와 보수주의자는 모두 제한된 정부를 옹호하고, 강제된 평등주의를 거부하며, 공공부채에 반대하고, 주의 권리를 방어합니다. 그러나 자유지상주의자는 네오콘의 군사 개입주의를 거부하고, 보수적 사회 정책과 보조금에 반대하며, 마약 금지를 비판하고, 보호주의를 거부합니다. 이 동맹은 실제로 존재하지만 본질적으로 긴장을 품고 있습니다.
