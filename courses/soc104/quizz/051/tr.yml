question: "Saldırmazlık ilkesi neyi ifade eder?"
answer: "Bir kişi, başkasının yaşamına, özgürlüğüne veya mülkiyetine karşı şiddet uygulamadığı sürece dilediği gibi davranmakta özgürdür"
wrong_answers:
  - "Toplumsal düzeni korumak için güç kullanma hakkı yalnızca devlete aittir"
  - "Vatandaşlar, bireysel özgürlükleri kısıtlasa bile çoğunluk yönetimine boyun eğmelidir"
  - "Eylem özgürlüğüne yalnızca toplumun kolektif yararına hizmet ettiğinde izin verilir"
explanation: >-
  Saldırmazlık ilkesi, liberteryen siyasetin temel taşlarından biridir ve bireylerin başkalarının yaşamına, özgürlüğüne veya mülkiyetine karşı şiddet uygulamadıkları sürece özgürce hareket edebileceklerini belirtir. Medeniyetler boyunca görülen altın kuralı hatırlatır. Diğer seçeneklerin aksine, devlete özel bir ahlaki otorite tanımaz veya bireysel hakları kolektif faydaya tabi kılmaz.
