question: "totalitarian regimes 'secular religions' ලෙස විස්තර කර ඇත්තේ ඇයි, සහ totalitarianism පැවතීමට අවශ්‍ය conditions පිළිබඳ මෙය කුමක් අනාවරණය කරයිද?"
answer: "ඔවුන් militants වෙතින් quasi-religious faith ඉල්ලා, opponents ට එරෙහිව fear භාවිත කරයි; totalitarianism සඳහා සියලු characteristics එකවර අවශ්‍ය වේ: suppressed freedoms, single-party rule, violent revolution, සහ directed economy"
wrong_answers:
  - "ඔවුන් traditional worship state ceremonies වලින් ප්‍රතිස්ථාපනය කරයි, සහ totalitarianism සඳහා charismatic leader සහ military control පමණක් අවශ්‍ය වේ"
  - "ඔවුන් state ideology enforce කිරීමට religious institutions භාවිත කරයි, සහ single political party එකක් parliament එක dominate කරන ඕනෑම විට totalitarianism මතුවිය හැක"
  - "ඔවුන් political action හරහා spiritual salvation පොරොන්දු වෙයි, සහ political freedoms නොසලකා state economy පාලනය කරන ඕනෑම විට totalitarianism පවතී"
explanation: >-
  Raymond Aron නිරීක්ෂණය කළේ totalitarian regimes principles දෙකක් මත ක්‍රියා කරන බවයි: militantsගේ faith සහ opponentsගේ fear. මෙම quasi-religious fanaticism ඔවුන්ගේ වෙනස් motivations ඉක්මවා ඔවුන්ව characterize කරමින්, secular religions යන label එක ඔවුන්ට ලබා දෙයි. Crucially, totalitarianism සඳහා defining characteristics සියල්ල එකවර අවශ්‍ය වේ: suppressed freedoms, single party එකක් හරහා unlimited authority, violent revolution, සහ directed economy. Modern democracies මේ traits කිහිපයක් පෙන්විය හැකි නමුත්, totalitarianism පවතින්නේ සියල්ල එකට assembled වූ විට පමණි.
reviewed: false
