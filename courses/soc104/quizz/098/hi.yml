question: "Libertarians individuals की decisions लेने की capacity के बारे में क्या believe करते हैं?"
answer: "Individuals के पास अपनी lives के बारे में अपने decisions लेने का right और responsibility दोनों हैं"
wrong_answers:
  - "Individuals को decisions केवल elected representatives से consult करने के बाद लेने चाहिए जो policy implications समझते हैं"
  - "Individuals generally good decisions लेने में incapable हैं और उन्हें government institutions से expert guidance चाहिए"
  - "Individuals को economic decisions freely लेने चाहिए लेकिन सभी social और cultural matters पर state को defer करना चाहिए"
explanation: >-
  Libertarian point of view से, individuals के पास अपने decisions खुद लेने का right और responsibility दोनों हैं। यह left से right तक conventional political families के contrast में है, जो मानती हैं कि government को individual's life और general economic life में कुछ या कई important decisions लेने चाहिए।
reviewed: false
