question: Simplicity は無制限再帰を排除しています。無制限反復の意図された代替手段は何ですか？
answer: 計算を複数のトランザクションに分散し、各トランザクションのコストを予測可能に保つ、再帰的カバナントです。
wrong_answers:
  - delegation 機能。1つのトランザクション内で、計量された形の無制限再帰を提供するために専用に作られている。
  - 9つのコアコンビネータ。その完全性により、固定点構成で任意の再帰関数をエンコードできる。
  - コンパイル時のループ展開。静的解析が最大反復回数を推論し、本体を複製する。
explanation: >-
  この記事の主張は、無制限反復は、複数のトランザクションにまたがって計算する
  再帰的カバナントとして実装する方がよい、というものです。これにより、
  ブロックスペースと標準性の制約を避け、トランザクションコストを
  予測可能にできます。Delegation は、無制限再帰に似たものを生み出すために悪用され得るだけで、
  意図された仕組みではありません。また9つのコアコンビネータは有限計算についてのみ完全であるため、
  1つのプログラム内に固定点構成は存在しません。
reviewed: false
