question: "Como um libertário culturalmente conservador lida com comportamentos que desaprova moralmente?"
answer: "Ele se opõe a esses comportamentos e os desencoraja por meio da persuasão e do exemplo, mas sem recorrer à força coercitiva da lei"
wrong_answers:
  - "Ele apoia proibições por governos locais desses comportamentos enquanto se opõe a proibições no nível federal"
  - "Ele permanece completamente silencioso sobre esses comportamentos, acreditando que qualquer forma de desaprovação viola a liberdade individual"
  - "Ele defende tribunais comunitários que possam punir esses comportamentos fora do sistema jurídico formal"
explanation: >-
  O libertário culturalmente conservador pode desaprovar moralmente certos comportamentos, mas não defende a proibição legal de ações consensuais e não agressivas. Ele pode não gostar dessas ações, opor-se a elas e desencorajá-las ativamente, mas sempre por meio da persuasão, da educação e do exemplo, e não pela força coercitiva da lei. Não se trata de ficar em silêncio nem de criar mecanismos alternativos de imposição.
