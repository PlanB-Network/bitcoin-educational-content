question: "political policies විනිශ්චය කිරීම ගැන Milton Friedman දුන් warning එක කුමක්ද?"
answer: "Policies ඒවායේ intentions අනුව නොව, ඒවායේ results අනුව විනිශ්චය කළ යුතුය"
wrong_answers:
  - "Policies ඒවා propose කරන politicians ගේ moral character අනුව විනිශ්චය කළ යුතුය"
  - "Policies general voting public අතර ඒවා කොතරම් popular ද යන්න අනුව විනිශ්චය කළ යුතුය"
  - "Policies රටේ original constitution එක සමඟ align වන්නේද යන්න අනුව විනිශ්චය කළ යුතුය"
explanation: >-
  Friedman ලිව්වේ, විශාලතම වැරදිවලින් එකක් policies ඒවායේ results වෙනුවට intentions අනුව විනිශ්චය කිරීම බවය; poor අය සඳහා යැයි label කරන programs ඒවායේ sponsors අදහස් කළ දේට ප්‍රතිවිරුද්ධ effects almost always produce කරන බව ඔහු noted කළේය. මෙය හොඳ economist කෙනෙකු entire population මත short-term සහ long-term effects දෙකම සලකා බලන බව කියන Bastiatගේ teaching එක echo කරයි.
reviewed: false
