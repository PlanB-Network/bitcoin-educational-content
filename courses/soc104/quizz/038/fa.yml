question: "چه شکاف بنیادی‌ای از اوایل قرن بیستم به بعد سوسیالیست‌ها را از هم جدا کرد؟"
answer: "سوسیالیست‌های انقلابی که می‌خواستند از راه خشونت قدرت را تصاحب کنند در برابر سوسیالیست‌های اصلاح‌طلبی که تغییر را از راه انتخابات دموکراتیک دنبال می‌کردند"
wrong_answers:
  - "سوسیالیست‌های شهری که بر کارگران صنعتی تمرکز داشتند در برابر سوسیالیست‌های روستایی که کمون‌های کشاورزی سازمان می‌دادند"
  - "سوسیالیست‌های ملی‌گرا که کشور خود را در اولویت می‌گذاشتند در برابر سوسیالیست‌های انترناسیونالیست که از انقلاب جهانی دفاع می‌کردند"
  - "سوسیالیست‌های روشنفکر که متون نظری می‌نوشتند در برابر سوسیالیست‌های کنشگر که اعتصابات کارگری سازمان می‌دادند"
explanation: >-
  از اوایل قرن بیستم، شکافی بنیادین سوسیالیست‌های انقلابی را، که با حقوق مالکیت مخالف بودند و می‌خواستند جامعه سرمایه‌داری را از راه خشونت یا دیکتاتوری پرولتاریا نابود کنند، از سوسیالیست‌های اصلاح‌طلب جدا کرد؛ اصلاح‌طلبان عدالت اجتماعی را از راه انتخابات دموکراتیک و مالیات‌ستانی دنبال می‌کردند و سرمایه‌داری را موقتاً می‌پذیرفتند. این شکاف سراسر تاریخ بعدی جنبش‌های سوسیالیستی را شکل داد.
reviewed: false
