question: "පෙනෙන විරුද්ධතාව තිබුණත් වාමාංශික සහ දක්ෂිණාංශික දේශපාලන පක්ෂ බෙදාගන්නා පොදු කරුණ කුමක්ද?"
answer: "නියාමන සහ බදු හරහා මිනිසුන්ගේ ජීවිත පාලනය කිරීමට රාජ්‍යයට ඇති අයිතිය දෙකම ආරක්ෂා කරයි"
wrong_answers:
  - "ආර්ථික කරුණු පිළිබඳ රාජ්‍ය මැදිහත්වීම සම්පූර්ණයෙන් අහෝසි කිරීම සඳහා දෙකම පෙනී සිටියි"
  - "සමාජයේ සාමූහික සංවිධානයට වඩා පුද්ගලික නිදහසට දෙකම ප්‍රමුඛතාව දෙයි"
  - "රජයේ වියදම් සඳහා මෙවලමක් ලෙස මුදල් ප්‍රතිපත්තිය භාවිතය දෙකම ප්‍රතික්ෂේප කරයි"
explanation: >-
  විරුද්ධ බව පෙනුණත්, වම සහ දකුණ රාජ්‍ය මැදිහත්වීමට ඇති කැමැත්තක් බෙදාගනී. දෙකම නිදහස් වෙළඳපොළ විවේචනය කරන අතර නියාමන සහ බදු හරහා මිනිසුන්ගේ ජීවිත පාලනය කිරීමට රාජ්‍යයට ඇති අයිතිය ආරක්ෂා කරයි. වම වෙළඳපොළ අසමානතාවේ මූලාශ්‍රයක් ලෙස විවේචනය කරන අතර, දකුණ ඒවා ස්වෛරීභාවයට තර්ජනයක් ලෙස දකින නමුත්, දෙපාර්ශ්වයම විසඳුම් සඳහා රාජ්‍යයට හැරෙයි.
reviewed: false
