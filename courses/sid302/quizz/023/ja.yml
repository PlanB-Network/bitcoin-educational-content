question: MayfellがLiquid上で約束手形を実装する際、透明なブロックチェーンの記録ではなく、あえてConfidential Transactionsを活用しているのはなぜですか？
answer: 商取引上のプライバシーの要件として、融資額を貸し手と借り手にだけ見えるようにしつつ、監査人が検証できる状態を保つ必要があるから
wrong_answers:
  - メキシコの規制では、すべての金融取引を政府の監督や税務当局から完全に隠すことが義務付けられているから
  - 透明な記録はスケーラビリティのボトルネックとなり、必要な25,000枚以上の約束手形を効率よく処理できなくなるから
  - 融資額が公開されると自動的に課税イベントが発生し、参加者にとってトークン化が経済的に成り立たなくなるから
explanation: |
  Confidential Transactionsは、企業間融資における重要なビジネス上の課題、つまり規制への準拠を可能にしながら競争上のプライバシーを守るという課題を解決します。従来の金融では、企業間の融資額は競合他社に知られるべきではない商業上の機密情報ですが、監査人や規制当局は台帳の整合性を検証する必要があります。LiquidのConfidential Transactionsは、金額を暗号学的に一般から隠しながら、権限を持つ関係者がトランザクションを検証できるようにすることで、このバランスを実現しています。誤った選択肢はこの技術を正しく説明していません。CTは規制当局からトランザクションを隠すものではなく（プライバシーと秘匿は別物です）、スケーラビリティの問題を解決するものでもなく（それは別の技術的課題です）、租税回避の仕組みを作るものでもありません（正当なプライバシーツールは納税義務を逃れるためのものではありません）。