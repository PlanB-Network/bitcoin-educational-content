question: "Qual objetivo político comum os estatistas de esquerda e de direita têm?"
answer: "Conquistar o poder para organizar a sociedade de acordo com sua visão de mundo e impô-la a todos"
wrong_answers:
  - "Reduzir o tamanho do governo e devolver o poder de decisão aos cidadãos individuais"
  - "Estabelecer uma democracia direta em que cada cidadão vote em cada decisão legislativa"
  - "Eliminar os partidos políticos e substituí-los por uma governança tecnocrática independente"
explanation: >-
  Estatistas de esquerda e de direita compartilham o mesmo objetivo político: conquistar o poder para organizar a sociedade de acordo com sua visão de mundo e impô-la a todos por meio da legislação. A diferença está apenas em seus valores: a direita invoca a defesa da civilização, enquanto a esquerda invoca a defesa da classe trabalhadora ou dos oprimidos. Nenhuma delas busca reduzir o governo ou eliminar partidos.
reviewed: false
