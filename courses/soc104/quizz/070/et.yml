question: "Miks kaasneb libertaarse seisukohaga narkootikumide legaliseerimise suhtes tingimus, et riigi rolli ühiskonnas tuleb vähendada?"
answer: "Sest riigi poolt üle võetud liberaliseerimine asendaks individuaalse vastutuse valitsuse juhitud hoolega, samal ajal kui libertaarid tahavad, et kodanikud kannaksid oma valikute tagajärgi erasektori ühenduste toetusega"
wrong_answers:
  - "Sest riigi kontrollitud legaliseerimine tooks liiga palju maksutulu, muutes valitsuse ülemäära võimsaks ja korrumpeerunuks"
  - "Sest riik kehtestaks kvaliteedistandardid, mis tõstaksid hindu ja looksid mustad turud uuesti"
  - "Sest narkootikumide riiklik reguleerimine rikuks rahvusvahelisi kaubanduslepinguid ja diplomaatilisi suhteid"
explanation: >-
  Libertaarid toetavad narkootikumide liberaliseerimist, kuid rõhutavad, et riigi rolli tuleb vähendada, sest nende eesmärk on taastada individuaalne vastutus, mitte laiendada riiklikku juhtimist. Kui keegi muutub sõltuvaks, peab ta võtma vastutuse, mitte paluma riigil hoolt pakkuda. Sõltuvuse lahendus peitub eraalgatuses: vabatahtlikus toetuses üksikisikutelt, perekondadelt ja heategevusühendustelt. Riigi juhitud legaliseerimine oleks vastuolus isikliku vastutuse fundamentaalse libertaarse põhimõttega.
