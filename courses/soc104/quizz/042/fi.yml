question: "Mikä perustavanlaatuinen jako erotti sosialisteja 1900-luvun alusta lähtien?"
answer: "Vallankumoukselliset sosialistit, jotka pyrkivät kaappaamaan vallan väkivallalla, vastakkain reformististen sosialistien kanssa, jotka tavoittelivat muutosta demokraattisten vaalien kautta"
wrong_answers:
  - "Kaupunkisosialistit, jotka keskittyivät teollisuustyöläisiin, vastakkain maaseutusosialistien kanssa, jotka järjestivät maatalouskommuuneja"
  - "Nationalistiset sosialistit, jotka asettivat oman maansa etusijalle, vastakkain internationalististen sosialistien kanssa, jotka kannattivat maailmanlaajuista vallankumousta"
  - "Intellektuellisosialistit, jotka kirjoittivat teoreettisia tekstejä, vastakkain aktivistisosialistien kanssa, jotka järjestivät työläisten lakkoja"
explanation: >-
  1900-luvun alusta lähtien perustavanlaatuinen jako erotti vallankumoukselliset sosialistit, jotka vastustivat omistusoikeuksia ja pyrkivät tuhoamaan kapitalistisen yhteiskunnan väkivallalla tai proletariaatin diktatuurilla, reformistisista sosialisteista, jotka tavoittelivat sosiaalista oikeudenmukaisuutta demokraattisten vaalien ja verotuksen kautta samalla kun hyväksyivät kapitalismin väliaikaisesti. Tämä jakolinja muokkasi sosialististen liikkeiden koko myöhempää historiaa.
