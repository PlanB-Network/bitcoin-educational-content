question: Taprootに対応したHTLCで、両者が協調してレイヤー間のスワップを完了することに合意した場合、何が起こりますか？
answer: MuSig2による集約公開鍵で共同署名し、通常のシングルシグの支払いと見分けがつかないトランザクションを作る
wrong_answers:
  - ネットワークに検証してもらうため、ハッシュロックとタイムロックを含むスクリプト全体をオンチェーンで公開しなければならない
  - 必要なマークルツリーの特定のブランチだけを公開し、集約公開鍵は外部から見えないようにする
  - 鍵を集約せずに各レイヤーで別々のトランザクションを同時にブロードキャストし、アトミックな決済を保証する
explanation: |
  Taprootの協調的な「キーパス」では、当事者はMuSig2を使ってそれぞれの鍵を1つの集約公開鍵にまとめられます。両者が合意すれば、トランザクションに共同で署名するだけでよく、そのトランザクションはブロックチェーン上で通常の支払いとまったく同じに見えます。スクリプトのロジックが一切明かされず、ブロックスペースの消費も最小限で済むため、プライバシーと効率が最大になります。他の選択肢は、従来のHTLCの動作か、非協調時のスクリプトパスの状況を誤って説明しています。