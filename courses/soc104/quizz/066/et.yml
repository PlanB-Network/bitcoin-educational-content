question: "Miks on totalitaarseid režiime kirjeldatud kui „ilmalikke religioone“ ja mida see näitab totalitarismi olemasoluks vajalike tingimuste kohta?"
answer: "Need nõuavad võitlejatelt kvaasireligioosset usku ja kasutavad vastaste vastu hirmu, ning totalitarism nõuab kõiki tunnuseid samaaegselt: allasurutud vabadusi, üheparteilist võimu, vägivaldset revolutsiooni ja suunatud majandust"
wrong_answers:
  - "Need asendavad traditsioonilise jumalateenistuse riiklike tseremooniatega, ja totalitarism nõuab ainult karismaatilist juhti ja sõjalist kontrolli"
  - "Need kasutavad religioosseid institutsioone riigiideoloogia jõustamiseks, ja totalitarism võib tekkida alati, kui üks poliitiline partei domineerib parlamendis"
  - "Need lubavad poliitilise tegevuse kaudu vaimset pääsemist, ja totalitarism eksisteerib alati, kui riik kontrollib majandust sõltumata poliitilistest vabadustest"
explanation: >-
  Raymond Aron täheldas, et totalitaarsed režiimid toimivad kahe põhimõtte alusel: võitlejate usk ja vastaste hirm. See kvaasireligioosne fanatism iseloomustab neid nende erinevatest motiividest kaugemale, andes neile ilmalike religioonide sildi. Oluline on, et totalitarism nõuab kõiki määratlevaid tunnuseid samaaegselt: allasurutud vabadusi, piiramatut autoriteeti ühe partei kaudu, vägivaldset revolutsiooni ja suunatud majandust. Kaasaegsetes demokraatiates võib esineda mõni neist joontest, kuid totalitarism on olemas ainult siis, kui kõik need on koos.
