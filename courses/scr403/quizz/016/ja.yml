question: Simplicity におけるアクセス記法 (O, I, H) はどのように機能しますか？
answer: O は 'take'（左）、I は 'drop'（右）、H は 'iden'（値全体）を意味します。
wrong_answers:
  - O は出力、I は入力、H はプログラム実行の停止を意味する。
  - これらは、コンパイラが値に自動的に割り当てる変数名である。
  - O は奇数番目の要素を選択し、I は偶数番目の要素を選択し、H は先頭を選択する。
explanation: >-
  O/I/H の省略記法は、ネストしたペアをたどるためのコンパクトな方法を提供します。
  O f は take f（左を取り出す）、I f は drop f（右を取り出す）、H は
  iden（値全体）です。I O H のような列は drop(take(iden)) を意味し、
  2番目の要素の1番目の要素を取り出します。これは、ツリー内の位置として
  2進数字を使うド・ブリュイン指数に似ています。
reviewed: false
