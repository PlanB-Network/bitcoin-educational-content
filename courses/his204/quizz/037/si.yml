question: මෙම කතුවරුන්ගෙන් Gournay කවයට අයත් නොවන්නේ කවුද?
answer: Dupont de Nemours
wrong_answers:
  - Véron de Forbonnais
  - Turgot
  - Abbé Morellet
explanation: |
  Dupont de Nemours Gournay කවයේ සාමාජිකයෙකු නොව, physiocrat කෙනෙකු විය. Physiocratsගේ අදහස් Gournay කවයේ අදහස්වලට ආසන්න වූ නමුත්, ඔවුහු වෙනම කණ්ඩායමක් සෑදූහ.
