question: "Hva kjennetegner bunnen av aksen for personlig frihet i Nolan-diagrammet?"
answer: "Preferanse for orden, sikkerhet, tradisjonelle verdier og at staten regulerer moral og opprettholder offentlig orden"
wrong_answers:
  - "Preferanse for individuell autonomi, toleranse og minimal statlig innblanding i personlige livsvalg"
  - "Preferanse for økonomisk deregulering, frihandel og avskaffelse av tollsatser og subsidier"
  - "Preferanse for omfordeling av rikdom, høye skatter og nasjonalisering av nøkkelindustrier"
explanation: >-
  Bunnen av aksen for personlig frihet representerer maksimal statlig kontroll over privatlivet, kjennetegnet av en preferanse for orden, sikkerhet og tradisjonelle verdier. Staten regulerer moral, opprettholder offentlig orden og kan forsvare en bestemt visjon om moral eller tradisjon. Toppen av aksen representerer det motsatte: individuell frihet og toleranse. Økonomisk politikk måles på den separate horisontale aksen.
reviewed: false
