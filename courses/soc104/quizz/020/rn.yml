question: "Umurongo uhagaze w'igishushanyo ca Nolan uhishura iki ku kibazo nyaco ca politike?"
answer: "Uhishura niba ushaka guhatira abandi ivyiyumviro vyawe biciye kuri Leta, canke ukarushiriza guhitamwo ko umuntu wese yidegemvya kwifatira ingingo"
wrong_answers:
  - "Uhishura niba ushigikira intwaro ya demokarasi canke ukarushiriza guhitamwo intwaro y'umukuru umwe afise ububasha bwose"
  - "Uhishura niba wiyumva mu mihari y'iterambere ry'ikibano canke mu nzego z'idini za kera"
  - "Uhishura niba ikikuraje ishinga kuruta ibindi ari umutekano w'igihugu canke iterambere ry'ubutunzi"
explanation: >-
  Umurongo uhagaze werekana ikibazo nyaco ca politike: si ukumenya niba uri ibumoso canke iburyo, ahubwo ni urugero ushaka ko Leta yinjira mu guhingura ikibano ikurikije indangagaciro zawe. Woba ushaka guhatira abandi ivyiyumviro vyawe, canke uhitamwo ko umuntu wese yidegemvya kwifatira ingingo? Ubu buryo bwo kubibona burarenga ukwigabura kw'ibumoso n'iburyo kandi bukerekana ko impande zompi zishobora kuba zishigikiye ububasha bwa Leta ku rugero rumwe.
