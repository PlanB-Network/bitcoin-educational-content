question: "Ingingo ngenderwako yo kudatera abandi ivuga iki?"
answer: "Umuntu arafise umwidegemvyo wo gukora uko ashaka igihe cose ata bukazi akorewe ubuzima, umwidegemvyo, canke itunga ry'uwundi"
wrong_answers:
  - "Leta ni yo yonyene ifise uburenganzira bwo gukoresha inguvu kugira ngo igumane urutonde rw'imibano"
  - "Abanyagihugu bategerezwa kwemera ubutegetsi bwa benshi naho bwoba bugabanya imwidegemvyo y'umuntu ku giti ciwe"
  - "Umwidegemvyo wo gukora wemerewe gusa igihe ugirira akamaro ineza rusangi y'ikibano"
explanation: >-
  Ingingo ngenderwako yo kudatera abandi ni inkingi nyamukuru ya politike ya libertarian, ivuga ko abantu bashobora gukora mu mwidegemvyo igihe badakora ubukazi ku buzima, umwidegemvyo, canke itunga ry'abandi. Iributsa itegeko rya zahabu riboneka mu mico myinshi. Mu buryo butandukanye n'ayandi mahitamwo, ntihereza Leta ububasha budasanzwe bw'inyifato runtu canke ngo ishira uburenganzira bw'umuntu munsi y'inyungu rusangi.
