question: Prečo bol Dupont de Nemours takou výnimočnou osobnosťou fyziokratickej školy?
answer: Bol najmladší
wrong_answers:
  - Bol najstarší
  - Bol najbohatší
  - Bol najvýrečnejší
explanation: |
  Dupont de Nemours bol jedným z najmladších členov fyziokratickej školy, čo mu umožnilo dlhú a významnú politickú a ekonomickú kariéru.
