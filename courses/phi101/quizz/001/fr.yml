question: Quelle est la différence entre l'histoire et la philosophie ?
answer: L'histoire est factuelle, tandis que la philosophie est normative.
wrong_answers:
  - L'histoire décrit le passé tandis que la philosophie le juge.
  - L'histoire repose sur des preuves empiriques, tandis que la philosophie repose sur des preuves mathématiques.
  - L'histoire s'intéresse aux événements tandis que la philosophie s'intéresse aux concepts.
explanation: |
  La différence clé soulignée dans le cours est que la philosophie politique est normative, prescrivant des valeurs et jugeant les actions humaines selon un critère de justice, tandis que l'histoire et la science politique sont descriptives, se concentrant sur les événements et les institutions sans porter de jugements de valeur.
reviewed: true
