question: "Vad ges företräde framför frihet i den konservativa politiska filosofin?"
answer: "Ordning och tradition, som måste vara fast etablerade innan frihet kan värdesättas"
wrong_answers:
  - "Social rättvisa och jämlikhet, som måste garanteras innan individer kan vara verkligt fria"
  - "Ekonomisk effektivitet och pragmatiska resultat, som avgör när frihet är lämplig"
  - "Individuell äganderätt, som måste skyddas innan någon annan frihet beviljas"
explanation: >-
  För konservativa ges ordning och tradition företräde framför frihet. De hävdar att för mycket frihet skapar kaos och social oordning, så frihet kan bara värdesättas när ordningen har etablerats fast. Detta står i kontrast till den socialistiska synen som prioriterar rättvisa, eller den centristiska betoningen på effektivitet.
