question: "尽管保守主义者和自由意志主义者都支持废除最低工资，他们在最低工资问题上的理由有何不同？"
answer: "如果不妨碍竞争力，保守主义者接受国家在工资设定中的某些参与；而自由意志主义者把最低工资视为对雇佣和经商自由的道德强加"
wrong_answers:
  - "保守主义者反对最低工资，因为它会造成通货膨胀；而自由意志主义者反对它，因为它给工会太多权力"
  - "保守主义者希望工资由宗教和社区机构设定，而自由意志主义者希望工资由政府批准的市场研究决定"
  - "保守主义者认为最低工资应按地区变化，而自由意志主义者认为全国应适用单一固定工资"
explanation: >-
  双方都支持降低或废除最低工资，但其理由有根本差异。保守主义者接受国家在工资设定中的某些参与，同时坚持这种参与应保持最低限度并取决于具体情境，重点放在竞争力上。自由意志主义者则采取更强的道德立场：最低工资是对雇佣和经商自由的强加。当自由意志主义者说“市场”时，他们指的是契约，即在没有国家干预的情况下由双方自由协商达成的契约。
reviewed: false
