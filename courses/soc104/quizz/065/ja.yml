question: "移民に関する保守主義の立場は何ですか？"
answer: "国家は、国家安全保障と文化的アイデンティティを守るために国境を管理する主権的権利を持つ"
wrong_answers:
  - "差別的な制限は人権を侵害するため、国境は無条件に開かれるべきである"
  - "移民は市場の需要によって決定されるべきであり、市民が外国人との関係を契約によって決めるべきである"
  - "移民政策は、専門家の評価に基づき、経済的必要性と成功した統合のバランスを取るべきである"
explanation: >-
  保守主義者は、秩序、アイデンティティ、国家主権が、外国人や難民の無制限の受け入れに優先しなければならないと考えます。国境と明確に定義された人口は、文明的価値の一部です。誤答は、社会主義の立場（人権としての開かれた国境）、リバタリアンの立場（市場に基づく移民）、そして中道主義の立場（専門家主導のバランスの取れたアプローチ）を表しています。
reviewed: false
