question: "Apa yang ditempatkan kaum libertarian di pusat filsafat politik mereka?"
answer: "Etika dan hukum"
wrong_answers:
  - "Pertumbuhan ekonomi dan penciptaan kekayaan"
  - "Kesetaraan sosial dan kesejahteraan kolektif"
  - "Identitas nasional dan pelestarian budaya"
explanation: >-
  Kaum libertarian membedakan diri dari semua keluarga politik lain dengan menempatkan etika dan hukum di pusat filsafat mereka, bukan ekonomi. Ketika mereka membela ekonomi pasar, itu bukan terutama karena kapasitasnya menghasilkan kekayaan, melainkan karena ia mendorong kebebasan dan tanggung jawab individu. Pertumbuhan ekonomi adalah manfaat sekunder, bukan prinsip fondasional.
