question: "¿Sobre qué quiere legislar la derecha?"
answer: "Sobre la moral y la religión, impulsada por el deseo de preservar las instituciones tradicionales y las jerarquías sociales"
wrong_answers:
  - "Sobre la economía y los mercados financieros, impulsada por el deseo de reducir la desigualdad y redistribuir la riqueza"
  - "Sobre la ciencia y la educación, impulsada por el deseo de controlar lo que se enseña en las escuelas públicas"
  - "Sobre el comercio internacional y la diplomacia, impulsada por el deseo de expandir la influencia nacional en el extranjero"
explanation: >-
  La derecha da prioridad a la moral personal y a los valores tradicionales. Considera que la civilización se construye sobre ciertas instituciones tradicionales y jerarquías sociales que deben preservarse, y quiere legislar sobre la moral y la religión. La izquierda, no la derecha, se centra en legislar sobre la economía. La ciencia, la educación y la política comercial no son el foco principal descrito para la derecha.
