question: "Miksi Molinarin vuoden 1849 ennustus osoittautui profeetalliseksi vapauden ja poliittisen vallan välisen suhteen osalta?"
answer: "Koska konservatiivit ja sosialistit ovat vuorotelleet vallassa ja instrumentalisoineet vapautta omien poliittisten tavoitteidensa palveluksessa juuri kuten hän kuvasi"
wrong_answers:
  - "Koska hänen kuvaamansa ekonomistihahmo pääsi lopulta poliittiseen valtaan ja toteutti libertaarisia politiikkoja kaikkialla Euroopassa"
  - "Koska hänen ennustuksensa siitä, että kaikki kolme poliittista perhettä sulautuisivat yhdeksi sentristiseksi liikkeeksi, toteutui 1900-luvulla"
  - "Koska peräkkäiset hallitukset laajensivat vapautta vähitellen, kunnes siitä tuli modernien demokratioiden ensisijainen järjestävä periaate"
explanation: >-
  Molinarin visio osoittautui profeetalliseksi, koska 1800-luvun puolivälistä lähtien konservatiivit ja sosialistit ovat vuorotelleet vallassa ja toteuttaneet täsmälleen sen, mitä hän kuvasi: vapauden instrumentalisoimisen poliittisten tavoitteiden palvelukseen. Molemmat perheet ovat valmiita rajoittamaan vapauksia ja kutsumaan valtion pakottamaan omat agendansa, kun taas ekonomistin ehdottoman vapauden kanta jäi marginaaliin.
