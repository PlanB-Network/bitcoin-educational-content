question: "Wat omvat de categorie persoonlijke vrijheid?"
answer: "Wat je doet in je privérelaties, met je meningen, overtuigingen en alles wat je eigen lichaam en geest betreft"
wrong_answers:
  - "Wat je doet als producent, waaronder een bedrijf starten, werknemers aannemen en goederen verhandelen"
  - "Hoeveel belasting je betaalt, welke investeringen je doet en hoe je je financiële activa beheert"
  - "Je vermogen om op de markt te concurreren, prijzen voor je producten vast te stellen en je leveranciers te kiezen"
explanation: >-
  Persoonlijke vrijheid omvat wat je doet in je privérelaties, met je meningen en overtuigingen, en alles wat je eigen lichaam en geest betreft. Dit omvat huwelijk, leeskeuzes, religieuze praktijken, voedsel- en medicijnkeuzes, en met wie je omgaat. Bedrijfsactiviteiten, belastingen en marktbeslissingen vallen onder economische vrijheid.
