question: "Ni mgawanyiko gani wa msingi uliowatenganisha wanasoshalisti kuanzia mapema karne ya ishirini na kuendelea?"
answer: "Wanasoshalisti wa kimapinduzi waliotafuta kutwaa mamlaka kupitia vurugu dhidi ya wanasoshalisti wa kimatengenezo waliofuatilia mabadiliko kupitia uchaguzi wa kidemokrasia"
wrong_answers:
  - "Wanasoshalisti wa mijini waliolenga wafanyakazi wa viwandani dhidi ya wanasoshalisti wa vijijini walioandaa jumuiya za kilimo"
  - "Wanasoshalisti wa kitaifa waliotanguliza nchi yao wenyewe dhidi ya wanasoshalisti wa kimataifa waliotetea mapinduzi ya kimataifa"
  - "Wanasoshalisti wasomi walioandika maandiko ya kinadharia dhidi ya wanasoshalisti wanaharakati walioandaa migomo ya wafanyakazi"
explanation: >-
  Kuanzia mapema karne ya ishirini, mgawanyiko wa msingi uliwatenganisha wanasoshalisti wa kimapinduzi, waliopinga haki za umiliki na kutafuta kuharibu jamii ya kibepari kupitia vurugu au udikteta wa proletariat, na wanasoshalisti wa kimatengenezo, waliofuatilia haki ya kijamii kupitia uchaguzi wa kidemokrasia na utozaji kodi huku wakikubali ubepari kwa muda. Mgawanyiko huu uliunda historia yote iliyofuata ya harakati za kisoshalisti.
