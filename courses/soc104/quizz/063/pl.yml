question: "Czym różniły się podejścia gospodarcze hitlerowskich Niemiec i stalinowskiego Związku Radzieckiego, mimo ich wspólnych metod totalitarnych?"
answer: "Nazistowskie Niemcy utrzymywały pozory własności prywatnej, podporządkowując sektor prywatny celom państwa, podczas gdy stalinizm zniósł wszelką własność prywatną i w pełni zaplanował gospodarkę"
wrong_answers:
  - "Nazistowskie Niemcy w pełni znacjonalizowały wszystkie gałęzie przemysłu, podczas gdy reżim Stalina dopuszczał ograniczoną prywatną przedsiębiorczość w rolnictwie"
  - "Nazistowskie Niemcy promowały wolny handel międzynarodowy, aby finansować zbrojenia, podczas gdy stalinizm narzucił całkowitą izolację gospodarczą"
  - "Nazistowskie Niemcy opierały się na dobrowolnej współpracy korporacji z państwem, podczas gdy stalinizm stosował wyłącznie pracę przymusową"
explanation: >-
  Choć oba reżimy stosowały identyczne metody polityczne (kult jednostki, pełną inwigilację, systematyczną eliminację opozycji), ich modele gospodarcze różniły się formą. Nazistowskie Niemcy formalnie nie zniosły własności prywatnej, ale całkowicie podporządkowały sektor prywatny celom państwa, takim jak wojna i zbrojenia, narzucając autarkię gospodarczą. Stalinizm poszedł dalej, znosząc wszelką własność prywatną, wprowadzając plany pięcioletnie oraz bezpośrednio kontrolując całą produkcję i dystrybucję.
