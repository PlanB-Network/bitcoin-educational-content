question: Simplicityの型システムでは、固定長ベクトルはどのように構築されますか？
answer: 2のべき乗長のネストした積型によって構築されます（例：A⁴ = A² × A²）。
wrong_answers:
  - 言語に組み込まれた特別な配列型コンストラクタを使います。
  - 要素をリスト状につなげる再帰的な和型によって構築されます。
  - 固定された最大サイズを持つ可変長バッファを使います。
explanation: >-
  Simplicityはネストした積型からベクトルを構築する。A²はA × A、
  A⁴はA² × A²、A⁸はA⁴ × A⁴、というようになる。これにより、
  2のべき乗サイズの集合が得られる。たとえば、𝟚²⁵⁶（256ビットハッシュ）は、
  boolean型から8階層深く積をネストすることで構築される。
