question: "لیبرتارین‌ها و محافظه‌کاران چه زمینهٔ مشترکی دارند و چه چیزی آن‌ها را از هم جدا می‌کند؟"
answer: "آن‌ها در دلبستگی به دولت محدود و رد برابری‌طلبی اجباری مشترک‌اند، اما بر سر مداخله‌گرایی نظامی و سیاست‌های اجتماعی اختلاف دارند"
wrong_answers:
  - "آن‌ها در حمایت از سیاست‌های تجاری حمایت‌گرایانه و دفاع ملی مشترک‌اند، اما بر سر نقش دین در زندگی عمومی اختلاف دارند"
  - "آن‌ها در تعهد به مالیات‌ستانی ترقی‌خواهانه و برنامه‌های رفاهی مشترک‌اند، اما بر سر سیاست مهاجرت اختلاف دارند"
  - "آن‌ها در مخالفت با تجارت آزاد و قانونی‌سازی مواد مخدر مشترک‌اند، اما بر سر اندازهٔ دولت فدرال اختلاف دارند"
explanation: >-
  لیبرتارین‌ها و محافظه‌کاران هر دو از دولت محدود دفاع می‌کنند، برابری‌طلبی اجباری را رد می‌کنند، با بدهی عمومی مخالفت می‌کنند و از حقوق ایالت‌ها دفاع می‌کنند. با این حال، لیبرتارین‌ها مداخله‌گرایی نظامی نومحافظه‌کاران را رد می‌کنند، با سیاست‌ها و یارانه‌های اجتماعی محافظه‌کارانه مخالفت می‌کنند، ممنوعیت مواد مخدر را محکوم می‌کنند و حمایت‌گرایی را رد می‌کنند. این اتحاد واقعی است اما ذاتاً پرتنش است.
reviewed: false
