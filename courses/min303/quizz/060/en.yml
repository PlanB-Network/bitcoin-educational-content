question: "What is the key advantage of using a revenue-sharing model for remote Bitcoin mining operations in Africa?"
answer: Eliminates fixed costs and protects downside risk
wrong_answers:
  - Increases overall profitability
  - Provides access to cheaper electricity
  - Simplifies maintenance and logistics
explanation: |
  The chapter explains that remote mining operations in Africa often use revenue-sharing agreements with energy producers, which aligns incentives and reduces risks by eliminating fixed costs and protecting miners from downside risk.
