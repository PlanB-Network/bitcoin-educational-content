question: "What hidden paradox lies within centrist pragmatism?"
answer: "The pragmatism itself rests on a form of dogmatism, namely the unexpressed conviction that only experts are competent to steer society"
wrong_answers:
  - "Centrists claim to be moderate but consistently align with left-wing parties in coalition governments"
  - "Centrist policies appear balanced but always favor economic growth over environmental protection"
  - "Centrists reject ideology but adopt rigid free-market principles when making economic decisions"
explanation: >-
  The paradox of centrist pragmatism is that it claims to reject ideology in favor of rational expertise, yet this very claim rests on an invisible and unexpressed dogma: that only technocrats are capable of making the right decisions. This conviction that experts alone should steer society is itself an ideological commitment, even though centrists do not recognize it as such.
reviewed: false
