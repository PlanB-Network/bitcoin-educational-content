question: "تعریف دولت‌گرایی در چارچوب Nolan چیست؟"
answer: "استفاده از قانون‌گذاری برای کنترل و شکل‌دادن به جامعه، خواه به نام دفاع از تمدن، طبقهٔ کارگر، طبیعت، یا ستمدیدگان"
wrong_answers:
  - "نظامی حکومتی که در آن مقام‌های منتخب دوره‌های ثابت خدمت می‌کنند و انتقال قدرت از طریق انتخابات دموکراتیک انجام می‌شود"
  - "باوری که تنها یک ارتش نیرومند می‌تواند حاکمیت و تمامیت ارضی یک ملت را حفظ کند"
  - "فلسفه‌ای اقتصادی که از طریق تعرفه‌ها و سهمیه‌ها صنایع ملی را بر رقابت خارجی مقدم می‌داند"
explanation: >-
  دولت‌گرایی به‌معنای استفاده از قانون‌گذاری برای کنترل و شکل‌دادن به جامعه تعریف می‌شود. هم چپ و هم راست آن را به کار می‌گیرند: برخی به نام دفاع از تمدن، و برخی دیگر به نام دفاع از طبقهٔ کارگر، طبیعت، یا ستمدیدگان. حتی میانه‌روها نیز وقتی به کارشان بیاید آن را تأیید می‌کنند. دولت‌گرایی به سیاست نظامی، حمایت‌گرایی تجاری، یا صرفاً داشتن دولت‌های منتخب محدود نیست.
reviewed: false
