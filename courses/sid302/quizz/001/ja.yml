question: Liquid Networkでブロックを有効にするには、何人のファンクショナリーの署名が必要ですか？
answer: 15人のファンクショナリーのうち少なくとも11人の署名
wrong_answers:
  - 15人のファンクショナリーのうち少なくとも8人の署名
  - 15人のファンクショナリーのうち少なくとも10人の署名
  - 15人のファンクショナリーのうち少なくとも12人の署名
explanation: |
  Liquid Networkでは、ブロックを有効にするために15人のファンクショナリーのうち少なくとも11人の署名が必要です。これは「3分の2＋1」のしきい値にあたります。この要件により強固なコンセンサスが保たれ、少数のグループがネットワークを支配することを防げます。他の選択肢は誤りです。8人ではセキュリティ上少なすぎ、10人では3分の2のしきい値に届かず、12人では通常の運用には厳しすぎます。