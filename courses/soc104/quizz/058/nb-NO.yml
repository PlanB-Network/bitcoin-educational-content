question: "Hva er det viktige skillet mellom å være pro-business og å være pro-market?"
answer: "Å være pro-business betyr å favorisere en allianse mellom store foretak og staten, mens å være pro-market betyr å støtte fri konkurranse uten statlig favorisering"
wrong_answers:
  - "Å være pro-business betyr å støtte små bedrifter, mens å være pro-market betyr å støtte multinasjonale selskaper"
  - "Å være pro-business betyr å motsette seg regulering helt, mens å være pro-market betyr å akseptere moderat regulering"
  - "Å være pro-business fokuserer på innenlandsk industri, mens å være pro-market fokuserer på internasjonal handel"
explanation: >-
  Sentrister tenderer mot å være pro-business, noe som betyr at de favoriserer en slags allianse mellom store foretak og staten, som skiller seg fra å være pro-market. Å være pro-market støtter fri konkurranse uten statlig favorisering eller selskapsproteksjonisme. Dette skillet er avgjørende fordi pro-business-politikk kan skape monopoler og regulatoriske beskyttelser som faktisk undergraver frimarkedskonkurranse.
reviewed: false
