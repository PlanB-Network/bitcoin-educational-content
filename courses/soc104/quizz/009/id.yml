question: "Apa yang mencirikan bagian bawah sumbu kebebasan pribadi pada diagram Nolan?"
answer: "Preferensi terhadap ketertiban, keamanan, nilai-nilai tradisional, serta negara yang mengatur moral dan menjaga ketertiban umum"
wrong_answers:
  - "Preferensi terhadap otonomi individu, toleransi, dan campur tangan negara yang minimal dalam pilihan hidup pribadi"
  - "Preferensi terhadap deregulasi ekonomi, perdagangan bebas, dan penghapusan tarif serta subsidi"
  - "Preferensi terhadap redistribusi kekayaan, pajak tinggi, dan nasionalisasi industri-industri kunci"
explanation: >-
  Bagian bawah sumbu kebebasan pribadi merepresentasikan kontrol negara maksimum atas kehidupan pribadi, yang dicirikan oleh preferensi terhadap ketertiban, keamanan, dan nilai-nilai tradisional. Negara mengatur moral, menjaga ketertiban umum, dan dapat membela visi tertentu tentang moralitas atau tradisi. Bagian atas sumbu merepresentasikan kebalikannya: kebebasan individu dan toleransi. Kebijakan ekonomi diukur pada sumbu horizontal yang terpisah.
