question: "Co říká princip neagrese?"
answer: "Člověk může svobodně jednat, jak si přeje, pokud není pácháno násilí proti životu, svobodě nebo majetku druhého"
wrong_answers:
  - "Stát má výhradní právo používat sílu za účelem udržení společenského řádu"
  - "Občané se musí podřídit vládě většiny, i když omezuje individuální svobody"
  - "Svoboda jednání je dovolena pouze tehdy, když prospívá kolektivnímu dobru společnosti"
explanation: >-
  Princip neagrese je základním kamenem libertariánské politiky a říká, že jednotlivci mohou jednat svobodně za předpokladu, že nepáchají násilí proti životu, svobodě nebo majetku druhých. Připomíná zlaté pravidlo přítomné napříč civilizacemi. Na rozdíl od ostatních možností neuděluje státu zvláštní morální autoritu ani nepodřizuje individuální práva kolektivnímu prospěchu.
