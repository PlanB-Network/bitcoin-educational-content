question: "I frågan om reglering av skjutvapen, vilken är den avgörande skillnaden mellan de konservativa och libertarianska positionerna?"
answer: "Båda accepterar viss reglering, men konservativa vill ha regler från en legitim offentlig auktoritet medan libertarianer vill att regler ska växa fram från dem som direkt berörs, såsom medborgarsammanslutningar och marknadskonkurrens"
wrong_answers:
  - "Konservativa motsätter sig all reglering av skjutvapen medan libertarianer accepterar strikt statlig kontroll för allmän säkerhet"
  - "Konservativa vill förbjuda skjutvapen helt medan libertarianer stödjer obegränsad tillgång till alla vapen"
  - "Konservativa grundar sin position på individuella rättigheter medan libertarianer grundar sin på kollektivt ansvar"
explanation: >-
  Både konservativa och libertarianer är överens om att någon form av reglering för att bära vapen är nödvändig. Den avgörande skillnaden ligger i vem som fastställer dessa regler. Konservativa insisterar på att regleringar måste komma från en offentlig auktoritet som har i uppdrag att skydda det gemensamma bästa (uppifrån och ner). Libertarianer hävdar att reglering bör växa fram från dem som direkt berörs: säkerhetsprofessionella, medborgarsammanslutningar och marknadskonkurrens (nerifrån och upp).
reviewed: false
