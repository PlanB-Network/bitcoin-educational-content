question: මුදල් ණයට දීම පිළිබඳ තම මතක සටහනේ, Turgot කාගේ මූලධර්ම ප්‍රතික්ෂේප කරන අතරම ඔවුන්ගේ නිදහස ආරක්ෂා කරන්නේද?
answer: ග්‍රීකයන් සහ Catholic Church
wrong_answers:
  - ග්‍රීකයන් සහ ඊජිප්තු ජාතිකයන්
  - Catholic Church සහ ඊජිප්තු ජාතිකයන්
  - රෝමවරුන් සහ Carthaginians
explanation: |
  Turgot මුදල් ණයට දීමේ නිදහස ආරක්ෂා කළ අතර, පොලියට එරෙහි ග්‍රීකයන්ගේ සහ Catholic Churchගේ තර්ක ප්‍රතික්ෂේප කළේය. පොලිය තහනම් කිරීම ආර්ථික සංවර්ධනයට බාධා කරන බවත්, පුද්ගලයන්ට නිදහසේ ණයට දීමට සහ ණය ගැනීමට ඉඩ දිය යුතු බවත් ඔහු විශ්වාස කළේය.