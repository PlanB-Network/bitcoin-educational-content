question: "Wat is politiek conservatisme?"
answer: "Een ideologie die gevestigde politieke instellingen en sociale orde wil behouden en grote structurele omwentelingen afwijst"
wrong_answers:
  - "Een persoonlijke toewijding aan traditionele gezinswaarden en religieuze praktijken zonder te proberen die aan anderen op te leggen"
  - "Een filosofie die snelle sociale verandering bevordert via democratische hervorming en progressieve wetgeving"
  - "Een economische theorie die pleit voor vrije markten, minimale belastingheffing en de afschaffing van handelsbarrières"
explanation: >-
  Politiek conservatisme is een ideologie, vaak vertegenwoordigd in rechtse of extreemrechtse partijen, die gevestigde politieke instellingen en sociale orde wil behouden en grote structurele omwentelingen afwijst. Zijn voorstanders willen macht en wet gebruiken om hun erfgoed te beschermen. Dit verschilt van cultureel conservatisme, dat een persoonlijke levenskeuze is in plaats van een politiek programma.
reviewed: false
