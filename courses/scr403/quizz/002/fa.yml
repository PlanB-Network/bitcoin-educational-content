question: ترکیب ترتیبی هنگام زنجیر کردن عملیات f (A → B) با عملیات g (B → C) چه چیزی تولید می‌کند؟
answer: یک عملیات مرکب واحد از A به C، که خروجی f به ورودی g داده می‌شود.
wrong_answers:
  - یک مقدار جفتی که هر دو خروجی میانی از نوع B و C را در خود دارد.
  - یک شرط که بر اساس ورودی بین f و g انتخاب می‌کند.
  - دو عملیات جداگانه که مستقل اجرا می‌شوند و هیچ داده‌ای را به اشتراک نمی‌گذارند.
explanation: >-
  ترکیب ترتیبی دو عملیات را سر به سر زنجیر می‌کند. خروجی عملیات اول به
  ورودی عملیات دوم تبدیل می‌شود. در Simplicity، این کار با ترکیب‌گر comp
  بیان می‌شود: comp f g ابتدا f را اعمال می‌کند، سپس g را بر نتیجه اعمال
  می‌کند.
reviewed: false
