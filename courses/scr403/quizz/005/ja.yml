question: "'take' コンビネータは何をしますか？"
answer: 積の左側のコンポーネントを抽出し、右側を破棄します。
wrong_answers:
  - 和型から要素を1つ取り除き、タグビットを破棄します。
  - 2つの別々の操作を端から端まで逐次的に合成します。
  - 値を左タグで包んで、新しい和型を構築します。
explanation: >-
  take コンビネータは積型のための抽出器です。ペア ⟨a, b⟩ に適用された
  take f は、b を破棄して a に f を適用します。iden と組み合わせると、
  take iden は任意のペアの最初の要素を抽出します。
reviewed: false
