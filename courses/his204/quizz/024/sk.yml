question: Čo navrhuje Saint-Pierre na zaručenie mieru medzi národmi?
answer: Všetky 3 ostatné odpovede naraz
wrong_answers:
  - Vytvoriť radu národov
  - Zriadiť spoločnú armádu
  - Uchýliť sa v prípade sporov k arbitráži
explanation: |
  Abbé de Saint-Pierre navrhol súbor opatrení na zaručenie mieru, medzi nimi radu národov, spoločnú armádu a arbitráž. Veril, že tieto inštitúcie pomôžu riešiť konflikty pokojnou cestou a zabránia vojnám.
