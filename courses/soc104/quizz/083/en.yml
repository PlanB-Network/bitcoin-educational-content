question: "What is Hayek's fundamental argument about why central planning fails?"
answer: "Knowledge exists only as dispersed fragments possessed by distinct individuals and cannot be concentrated or integrated by a central authority"
wrong_answers:
  - "Central planners are morally corrupt and always act in their own self-interest rather than the public good"
  - "Democratic institutions are too slow to respond to economic changes, making centralized decisions always outdated"
  - "Central planning fails because citizens deliberately resist government mandates and refuse to comply with regulations"
explanation: >-
  Hayek's fundamental argument rests on the nature of information. He demonstrated that knowledge never exists in concentrated or integrated form but only as dispersed fragments possessed by all distinct individuals. Value is subjective and known only locally and incompletely. The central planner, sitting in an office, has no knowledge of the true price of things because he is not engaged in interaction and exchange.
reviewed: false
