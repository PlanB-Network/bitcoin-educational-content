question: "Co oznacza termin „holizm” w kontekście filozofii socjalistycznej?"
answer: "Wizję społeczeństwa jako niepodzielnej całości, w której kolektyw ma pierwszeństwo przed jednostką"
wrong_answers:
  - "Filozofię, która traktuje każdą jednostkę jako samowystarczalną całość, której praw nie może unieważnić żadna grupa"
  - "Teorię ekonomiczną, która opowiada się za równoważeniem sektora publicznego i prywatnego w równych proporcjach"
  - "Strategię polityczną, która integruje wszystkie poglądy mniejszościowe w jedną platformę opartą na konsensusie"
explanation: >-
  Holizm pochodzi od greckiego „holos”, oznaczającego „całość”. W myśli socjalistycznej odnosi się do wizji społeczeństwa jako niepodzielnej całości, a nie prostej sumy jednostek. Państwo socjalistyczne dąży do przejęcia i kierowania ludzką aktywnością w maksymalnym stopniu. Ten kolektyw może być reprezentowany jako klasa społeczna, naród, rasa albo płeć, ale w każdym przypadku jednostka jest definiowana przez przynależność do grupy.
reviewed: false
