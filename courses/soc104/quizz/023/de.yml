question: "Worüber will die Rechte gesetzlich bestimmen?"
answer: "Über Moral und Religion, angetrieben von dem Wunsch, traditionelle Institutionen und soziale Hierarchien zu bewahren"
wrong_answers:
  - "Über die Wirtschaft und Finanzmärkte, angetrieben von dem Wunsch, Ungleichheit zu verringern und Wohlstand umzuverteilen"
  - "Über Wissenschaft und Bildung, angetrieben von dem Wunsch zu kontrollieren, was an öffentlichen Schulen gelehrt wird"
  - "Über internationalen Handel und Diplomatie, angetrieben von dem Wunsch, nationalen Einfluss im Ausland auszuweiten"
explanation: >-
  Die Rechte gibt persönlicher Moral und traditionellen Werten Vorrang. Sie ist der Ansicht, dass Zivilisation auf bestimmten traditionellen Institutionen und sozialen Hierarchien aufgebaut ist, die bewahrt werden müssen, und sie will Moral und Religion gesetzlich regeln. Die Linke, nicht die Rechte, konzentriert sich darauf, die Wirtschaft gesetzlich zu regeln. Wissenschaft, Bildung und Handelspolitik sind nicht der primäre Fokus, der für die Rechte beschrieben wird.
reviewed: false
