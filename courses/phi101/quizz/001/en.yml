question: What is the difference between history and philosophy?
answer: History is factual, while philosophy is normative
wrong_answers:
  - History describes the past while philosophy judges it
  - History relies on empirical evidence, while philosophy relies on mathematical proofs
  - History focuses on events, while philosophy focuses on concepts
explanation: |
  The key difference highlighted in the course is that political philosophy is normative, prescribing values and judging human actions by a criterion of justice, while history and political science are descriptive, focusing on events and institutions without making value judgments.
reviewed: true
