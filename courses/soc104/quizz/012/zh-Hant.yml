question: "個人自由類別包含什麼？"
answer: "你在私人關係中做什麼、你的觀點與信念，以及一切涉及你自己身體與心智的事項"
wrong_answers:
  - "你作為生產者所做的事，包括創辦企業、雇用員工與交易商品"
  - "你繳多少稅、做哪些投資，以及如何管理你的金融資產"
  - "你在市場中競爭、為產品訂價，以及選擇供應商的能力"
explanation: >-
  個人自由涵蓋你在私人關係中做什麼、你的觀點與信念，以及一切涉及你自己身體與心智的事項。這包括婚姻、閱讀選擇、宗教實踐、食物與藥物選擇，以及你與誰交往。商業活動、稅收與市場決策屬於經濟自由。
reviewed: false
