question: "What distinction did Karl Marx draw between utopian socialism and scientific socialism?"
answer: "He accused early French socialists of proposing imaginary solutions, while his scientific socialism was grounded in historical materialism and class struggle"
wrong_answers:
  - "He argued that utopian socialism was too focused on economics, while scientific socialism prioritized cultural and artistic transformation"
  - "He praised utopian socialists for their practical experiments and criticized scientific socialism for being too abstract and theoretical"
  - "He claimed utopian socialism was violent and revolutionary, while scientific socialism favored peaceful democratic reform"
explanation: >-
  Marx accused early French socialists like Proudhon, Saint-Simon, and Fourier of being utopians who proposed purely imaginary solutions. His scientific socialism rested on historical materialism: the idea that history progresses through class struggle and the appropriation of the means of production, where all cultural representations are conditioned by productive forces and relations of production.
