question: Điểm chính trong khóa học này về Bitcoin là gì?
answer: Các khía cạnh về tiền tệ của Bitcoin.
wrong_answers:
  - Các khía cạnh lập trình của Bitcoin.
  - Ảnh hưởng của hệ sinh thái Bitcoin.
  - Các khía cạnh quy định của Bitcoin.
explanation: |
  Khóa học Bitcoin này tập trung vào các khía cạnh vềtiền tệ của
  Bitcoin, bao gồm cách mua và bán bitcoin, lưu trữ bitcoin an toàn
  trong ví điện tử, và sử dụng bitcoin cho
  các giao dịch.
reviewed: true