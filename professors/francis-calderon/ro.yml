bio: |
  Sunt inginer software, susținător al open source și Bitcoin. Îmi petrec timpul contribuind la proiecte open source legate de Bitcoin și de rețeaua Lightning, vreau să ajut Bitcoin să devină bani mai buni și ușor de folosit pentru persoanele fără cunoștințe tehnice. Lucrez la proiecte legate de rețeaua Lightning din primul trimestru al anului 2018, în prezent sunt consultant independent pe proiecte legate de Bitcoin/Lightning Network, dacă vrei să vorbim, scrie-mi direct.

short_bio: Cypherpunks scriu cod.
