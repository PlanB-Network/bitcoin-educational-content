question: "Какво насърчава хората да правят девизът на Kant 'Sapere aude'?"
answer: "Да се осмелят да мислят сами и да излязат от състоянието на непълнолетие, в което зависят от ръководството на висшестояща власт"
wrong_answers:
  - "Да преследват академично знание, като се записват във формални образователни институции и получават дипломи"
  - "Да оспорват всички форми на морал и да създават изцяло нови етични системи, основани на лично желание"
  - "Да търсят мъдрост чрез религиозна отдаденост и подчинение на ученията на църквата"
explanation: >-
  Sapere aude, означаващо "Осмели се да мислиш сам", е взето от Kant от поета Horace и превърнато в девиз на Просвещението. То символизира излизането от непълнолетие — състояние, в което хората са неспособни да използват своя разум без ръководството на висшестояща класа или власт. Kant насърчава еманципацията и пълната отговорност за собственото мислене.
reviewed: false
