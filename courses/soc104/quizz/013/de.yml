question: "Was kennzeichnet das untere Ende der Achse persönlicher Freiheit im Nolan-Diagramm?"
answer: "Eine Vorliebe für Ordnung, Sicherheit, traditionelle Werte und dafür, dass der Staat Moral reguliert und die öffentliche Ordnung aufrechterhält"
wrong_answers:
  - "Eine Vorliebe für individuelle Autonomie, Toleranz und minimale staatliche Einmischung in persönliche Lebensentscheidungen"
  - "Eine Vorliebe für wirtschaftliche Deregulierung, freien Handel und die Abschaffung von Zöllen und Subventionen"
  - "Eine Vorliebe für Vermögensumverteilung, hohe Steuern und Verstaatlichung von Schlüsselindustrien"
explanation: >-
  Das untere Ende der Achse persönlicher Freiheit steht für maximale staatliche Kontrolle über das persönliche Leben, gekennzeichnet durch eine Vorliebe für Ordnung, Sicherheit und traditionelle Werte. Der Staat reguliert Moral, erhält die öffentliche Ordnung aufrecht und kann eine bestimmte Vorstellung von Moral oder Tradition verteidigen. Das obere Ende der Achse steht für das Gegenteil: individuelle Freiheit und Toleranz. Wirtschaftspolitik wird auf der separaten horizontalen Achse gemessen.
reviewed: false
