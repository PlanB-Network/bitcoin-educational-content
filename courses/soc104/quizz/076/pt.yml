question: "Nos diálogos de Gustave de Molinari de 1849, qual personagem defende a liberdade como um princípio fundamental, em vez de subordiná-la a outros objetivos?"
answer: "O economista, que trata a liberdade como um princípio que não é subordinado a nenhum outro objetivo"
wrong_answers:
  - "O socialista, que defende a liberdade por meio de reformas progressistas voltadas à igualdade social"
  - "O conservador, que sustenta a liberdade ao preservar a ordem social tradicional e a estabilidade"
  - "Todos os três personagens defendem a liberdade igualmente, mas discordam sobre como implementá-la"
explanation: >-
  Nos diálogos de Molinari em Les Soirees de la rue Saint-Lazare, o economista está em desacordo permanente tanto com o socialista quanto com o conservador. Ele é o único que defende a liberdade como um princípio fundamental. O socialista subordina a liberdade a ideais progressistas, e o conservador a subordina à preservação da ordem, tornando o economista único em sua defesa incondicional da liberdade.
