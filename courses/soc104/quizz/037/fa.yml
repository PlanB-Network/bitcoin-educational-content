question: "سوسیالیسم چگونه با آزادی‌ها در حوزه‌های اجتماعی و اقتصادی به‌گونه‌ای متفاوت برخورد می‌کند؟"
answer: "سوسیالیسم از آزادی‌های گسترده در حوزه اجتماعی حمایت می‌کند، اما آزادی‌های محدود در حوزه اقتصادی را ترجیح می‌دهد"
wrong_answers:
  - "سوسیالیسم همه آزادی‌ها را در هر دو حوزه اجتماعی و اقتصادی به‌طور برابر محدود می‌کند"
  - "سوسیالیسم از آزادی‌های گسترده اقتصادی حمایت می‌کند، اما برای حفظ نظم اجتماعی آزادی‌های اجتماعی را محدود می‌کند"
  - "سوسیالیسم در هر دو حوزه آزادی‌های نامحدود اعطا می‌کند و برای حفظ تعادل بر همکاری داوطلبانه تکیه دارد"
explanation: >-
  در اندیشه سوسیالیستی، میان آزادی‌های اجتماعی و اقتصادی یک دوگانگی بنیادین وجود دارد. آزادی‌های اجتماعی گسترده‌اند، اما آزادی‌های اقتصادی به دلیل تأکید بر کنترل دولتی، برنامه‌ریزی و بازتوزیع ثروت محدودند. پاسخ نادرست سوم آرمان لیبرترین را توصیف می‌کند، در حالی که پاسخ دوم الگوی محافظه‌کارانه را توضیح می‌دهد که تصویر آینه‌ای سوسیالیسم است.
reviewed: false
