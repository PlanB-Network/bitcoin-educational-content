question: "Koje se emblematične ličnosti povezuju sa maksimalnom ekonomskom slobodom na Nolanovom dijagramu?"
answer: "Margaret Thatcher, Ronald Reagan i Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures i Bernie Sanders"
  - "Nelson Mandela, Simone Veil i Noam Chomsky"
  - "Vladimir Putin, Xi Jinping i Joseph de Maistre"
explanation: >-
  Thatcher, Reagan i Milei navedeni su kao emblematične ličnosti maksimalne ekonomske slobode, koje favorizuju manje državne intervencije, manje propisa i niže poreze. Roosevelt, Jaures i Sanders predstavljaju suprotni kraj koji favorizuje državnu kontrolu ekonomije. Mandela, Veil i Chomsky predstavljaju maksimalnu ličnu slobodu. Putin, Xi Jinping i de Maistre predstavljaju maksimalnu državnu kontrolu ličnog života.
