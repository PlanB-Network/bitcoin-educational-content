question: "Защо паричната инфлация е описана като скрит данък, наложен без съгласието на гражданите?"
answer: "Защото създаването на пари от правителството обезценява валутата, така че хората могат да купуват по-малко със същата сума, но повечето не осъзнават, че нарастващите цени отразяват правителствена политика, а не естествени пазарни сили"
wrong_answers:
  - "Защото централните банки тайно начисляват такси върху всяка транзакция, обработена през банковата система, без да ги разкриват на титулярите на сметки"
  - "Защото правителствата печатат пари и ги разпределят само на богати индивиди, докато облагат бедните чрез по-високи данъци върху продажбите на стоки от първа необходимост"
  - "Защото инфлацията е причинена от частни корпорации, които повишават цените, за да увеличат печалбите си, което функционира като неофициален данък върху потребителите"
explanation: >-
  Инжектирането на пари в системата се превръща в обезценяване на валутата, при което същата сума купува по-малко, защото новите пари не отразяват истински икономически растеж. Повечето хора не виждат, че правителствената политика е довела до нарастващите цени, които са просто отражение на обезценяването на валутата. Това представлява легална кражба и институционализирано ограбване, обедняващо средната класа, докато богатите улавят новите пари чрез спекулативни активи.
