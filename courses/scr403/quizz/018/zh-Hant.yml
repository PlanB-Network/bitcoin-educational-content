question: 可變長度的緩衝區在 Simplicity 的型別系統中是如何表示的？
answer: 表示為巢狀的選項型別積，每一層標示一個二的次方大小的區塊。
wrong_answers:
  - 使用一種直接內建於語言中的特殊動態陣列型別。
  - 透過在每次函數呼叫時變得更大的遞迴和型別。
  - 表示為以尾端零值填補的固定大小向量。
explanation: >-
  緩衝區使用巢狀的選項型別。舉例來說，Xᑉ⁸ 展開為 (1 + X⁴) × ((1 + X²) × (1 + X))，作為多項式時得出 1 + X + X² + ... + X⁷ —— 代表包含 0 到 7 個元素的集合。每一層選項都指示某個二的次方大小的區塊是否存在，實際上就是以二進位編碼了長度。
reviewed: false
