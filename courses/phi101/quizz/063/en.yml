question: What was the main argument of Nicolas Oresme against currency alterations?
answer: They benefit those in power at the expense of the community.
wrong_answers:
  - They prevent international trade and commerce.
  - They violate divine law as stated in the Scriptures.
  - They are too technically difficult for medieval mints to execute.
explanation: |
  Nicolas Oresme argued that currency alterations primarily benefit the prince at the expense of the community, constituting an unjust form of appropriation. He emphasized that such manipulations lead to shortages, black markets, and economic instability.
reviewed: true
