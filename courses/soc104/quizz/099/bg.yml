question: "Защо cypherpunk-овете твърдят, че е необходима дигитална валута с анонимни свойства?"
answer: "Защото кешът, основната анонимна транзакционна система, изчезва в дигиталното общество и трябва да бъде изобретен дигитален заместител със същите свойства на поверителност"
wrong_answers:
  - "Защото съществуващите дигитални платежни системи са твърде бавни и скъпи, изисквайки по-бърза и по-евтина алтернатива за онлайн търговия"
  - "Защото правителствата вече са забранили всички форми на анонимни транзакции и само нова технология може да заобиколи тези закони"
  - "Защото традиционните банки отказват да обслужват определени групи от населението, което прави универсално достъпната дигитална платежна система икономическа необходимост"
explanation: >-
  Cypherpunk манифестът заявява, че конфиденциалността в отворено общество изисква анонимни транзакционни системи. До дигиталната епоха кешът е служил като основна система от този тип. Но в дигитално общество, където кешът изчезва, трябва да бъде изобретена дигитална валута със същите свойства на анонимност. Тази визия директно предвещава това, което Bitcoin ще постигне.
