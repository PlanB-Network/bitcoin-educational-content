question: "¿Qué es el conservadurismo político?"
answer: "Una ideología que busca preservar las instituciones políticas establecidas y el orden social, oponiéndose a grandes convulsiones estructurales"
wrong_answers:
  - "Un compromiso personal con los valores familiares tradicionales y las prácticas religiosas sin buscar imponerlos a los demás"
  - "Una filosofía que promueve un cambio social rápido mediante reformas democráticas y legislación progresista"
  - "Una teoría económica que defiende los mercados libres, una tributación mínima y la abolición de las barreras comerciales"
explanation: >-
  El conservadurismo político es una ideología, a menudo representada en partidos de derecha o extrema derecha, que busca preservar las instituciones políticas establecidas y el orden social, oponiéndose a grandes convulsiones estructurales. Sus partidarios desean usar el poder y la ley para salvaguardar su herencia. Esto difiere del conservadurismo cultural, que es una elección de vida personal y no un programa político.
