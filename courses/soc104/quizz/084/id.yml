question: "Apa itu konstruktivisme sebagai keyakinan politik bersama?"
answer: "Keyakinan bahwa pemerintah pusat dapat menciptakan, dengan kekuatan hukum, suatu tatanan sosial yang baik bagi jumlah orang terbesar"
wrong_answers:
  - "Keyakinan bahwa masyarakat harus diorganisasi melalui kerja sama sukarela antarindividu tanpa campur tangan negara"
  - "Keyakinan bahwa hanya pasar bebas yang dapat menentukan distribusi sumber daya yang optimal dalam masyarakat"
  - "Keyakinan bahwa otoritas politik harus didistribusikan secara merata di antara semua warga melalui demokrasi langsung"
explanation: >-
  Konstruktivisme menyatukan kaum sentris, konservatif, dan sosialis di sekitar satu keyakinan bersama: superioritas proses politik atas proses pasar. Ini adalah keyakinan bahwa pemerintah pusat dapat menciptakan, dengan kekuatan hukum, suatu tatanan sosial yang baik bagi jumlah orang terbesar. Hal ini berdiri dalam oposisi langsung terhadap pembelaan libertarian atas tatanan spontan yang muncul dari interaksi sukarela.
