question: "What makes the Cusco Highlands Bitcoin project significant as a proof of concept for global adoption?"
answer: "Illiterate women at 3,600 meters altitude and 90 minutes from the nearest bank successfully use Bitcoin for purchases"
wrong_answers:
  - "It was the first Bitcoin community to receive official endorsement from a South American national government"
  - "It demonstrated that Bitcoin mining can be profitable at high altitudes due to natural cooling advantages"
  - "It proved that Bitcoin adoption requires reliable internet infrastructure and at least basic financial literacy"
explanation: >-
  In the Cusco Highlands, 5 of the 18 women in the weaving community cannot read, yet they use Bitcoin successfully to buy machines and materials. The community is at 3,600 meters altitude and 90 minutes from the nearest bank. The chapter presents this as the ultimate proof of concept: **if Bitcoin works here, it works anywhere**. The community even started donating to a local orphanage unprompted.
reviewed: false
