question: "リバタリアンと他の政治的家族が同じ目的を共有する場合、重要な不一致は何か？"
answer: "不一致は手段に関するものである。リバタリアンは強制的解決策を拒否し、市場プロセスを通じた自発的交換を好む"
wrong_answers:
  - "不一致は目的に関するものである。リバタリアンは社会福祉ではなく個人の富のような異なる目標を追求する"
  - "不一致は時期に関するものである。リバタリアンは同じ目標を漸進的改革によってよりゆっくり達成したいと考える"
  - "不一致は範囲に関するものである。リバタリアンは同じ政策を全国ではなく地方にのみ適用したいと考える"
explanation: >-
  リバタリアンは、抑圧された人々を守ることや社会的結束を促進することのような特定の目的について、社会主義者、保守主義者、中道主義者と一致し得る。不一致は目的ではなく手段にある。リバタリアンは、慣行や規制を均質化しようとするすべての強制的解決策を拒否し、その代わりに、自発的契約に基づく自由で分散化された交換を通じて、選択の力と責任ある自由を擁護する。
