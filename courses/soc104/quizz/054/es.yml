question: "¿Por qué los liberales clásicos en Estados Unidos comenzaron a llamarse 'libertarios' durante el siglo XX?"
answer: "Porque el 'liberalismo' estadounidense había sido cooptado por el creciente intervencionismo estatal y el Estado del bienestar"
wrong_answers:
  - "Porque querían distanciarse de las tradiciones monárquicas europeas"
  - "Porque el término 'liberal' pasó a asociarse con el anarquismo y la violencia política"
  - "Porque nuevos acuerdos comerciales exigían una identidad política distinta para los defensores del libre mercado"
explanation: >-
  Durante el siglo XX, se produjo un cambio fundamental a medida que los principios de laissez-faire fueron abandonados progresivamente en favor del Estado del bienestar. El "liberalismo" estadounidense pasó a significar algo muy diferente del liberalismo clásico, abrazando el intervencionismo estatal. Los liberales clásicos adoptaron el término "libertario" para preservar la distinción. Este cambio de marca no tuvo nada que ver con el monarquismo europeo, la violencia anarquista o los acuerdos comerciales.
