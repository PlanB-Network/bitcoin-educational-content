question: "Čo je paleo-libertarianizmus?"
answer: "Syntéza kombinujúca odmietnutie štátu ako zdroja nátlaku s posilnením tradičných inštitúcií a dobrovoľných spoločenských štruktúr"
wrong_answers:
  - "Libertariánske hnutie, ktoré odmieta všetky tradičné hodnoty a podporuje radikálny spoločenský progresivizmus"
  - "Konzervatívna ideológia, ktorá používa štátnu moc na vynucovanie tradičných hodnôt, pričom pripúšťa určitú ekonomickú slobodu"
  - "Centristická filozofia, ktorá hľadá vyvážený kompromis medzi socialistickou ekonomikou a konzervatívnou sociálnou politikou"
explanation: >-
  Paleo-libertarianizmus kombinuje odmietnutie štátu ako inštitucionálneho zdroja nátlaku s posilnením tradičných inštitúcií a preferenciou dobrovoľných spoločenských štruktúr pred štátnou autoritou. Od neo-libertarianizmu sa odlišuje tým, že je priaznivejší k tradičným hodnotám. Paleo-libertarián neodmieta, aby sa komunity organizovali okolo socialistických alebo komunitaristických princípov; odmieta iba to, aby také komunity silou zákona vnucovali svoje hodnoty všetkým.
