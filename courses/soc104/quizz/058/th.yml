question: "คุณค่าหลักของสายกลางคืออะไร?"
answer: "ความพอประมาณ การประนีประนอม การปรับตัว และประโยชน์สาธารณะ"
wrong_answers:
  - "จารีต ระเบียบ อำนาจ และอัตลักษณ์ชาติ"
  - "เสรีภาพ ทรัพย์สินส่วนตัว ความยินยอม และความรับผิดชอบส่วนบุคคล"
  - "ความเท่าเทียม ความยุติธรรมทางสังคม ความเป็นน้ำหนึ่งใจเดียวกัน และกรรมสิทธิ์ส่วนรวม"
explanation: >-
  คุณค่าหลักของสายกลางคือความพอประมาณ การประนีประนอม การปรับตัว และประโยชน์สาธารณะ สิ่งเหล่านี้สะท้อนการเน้นของสายกลางต่อความสมดุลเชิงปฏิบัติมากกว่าพันธะทางอุดมการณ์ ตัวเลือกอื่น ๆ อธิบายคุณค่าหลักของอนุรักษนิยม ลิเบอร์ทาเรียน และสังคมนิยมตามลำดับ
reviewed: false
