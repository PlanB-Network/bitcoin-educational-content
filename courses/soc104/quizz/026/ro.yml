question: "Cum a ilustrat Ron Paul poziția paleo-libertariană în probleme precum consumul de droguri și avortul?"
answer: "Personal, a sfătuit împotriva consumului de droguri și s-a opus avortului, dar politic a luptat împotriva interdicției federale și a susținut că alegerile ar trebui lăsate indivizilor sau statelor federale"
wrong_answers:
  - "A susținut legalizarea federală a tuturor drogurilor și a avortului ca o chestiune de drepturi individuale absolute"
  - "A făcut campanie pentru interdicții federale stricte atât asupra drogurilor, cât și asupra avortului, pe baza convingerilor sale morale personale"
  - "A refuzat să exprime orice opinie personală asupra acestor probleme, susținând că politicienii ar trebui să rămână neutri moral"
explanation: >-
  Ron Paul exemplifică sinteza paleo-libertariană prin separarea convingerilor morale personale de coerciția politică. El a sfătuit întotdeauna împotriva consumului de droguri, dar s-a opus simultan interdicției drogurilor. Personal, s-a opus avortului, dar a susținut că alegerea ar trebui lăsată statelor federale, nu impusă de sus. Aceasta demonstrează cum cineva poate avea valori tradiționale puternice, refuzând în același timp să folosească puterea coercitivă a guvernului federal pentru a le impune.
reviewed: false
