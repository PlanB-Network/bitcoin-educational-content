question: "Các chiến lược bãi bỏ nhà nước khác nhau như thế nào giữa libertaires và libertarians?"
answer: "Libertaires trong lịch sử ủng hộ sự phá hủy bằng bạo lực, trong khi libertarians tìm cách làm mất tính chính danh của nhà nước thông qua giáo dục và bất tuân dân sự"
wrong_answers:
  - "Libertaires dùng bầu cử dân chủ để tháo dỡ nhà nước, trong khi libertarians ủng hộ cách mạng vũ trang và hành động trực tiếp"
  - "Libertaires tập trung xây dựng các cộng đồng thay thế, trong khi libertarians hoạt động trong hệ thống chính trị hiện hữu để thông qua cải cách"
  - "Cả libertaires lẫn libertarians đều đồng ý rằng phản kháng ôn hòa là phương tiện chính đáng duy nhất để chuyển hóa xã hội"
explanation: >-
  Libertaires trong lịch sử ủng hộ việc phá hủy nhà nước và chủ nghĩa tư bản bằng bạo lực, bao gồm khủng bố và các cuộc tấn công có mục tiêu. Trái lại, libertarians bác bỏ bạo lực xâm lược như phi chính đáng. Chiến lược của họ dựa trên việc làm mất tính chính danh của nhà nước thông qua lập luận, tranh luận, giáo dục và bất tuân dân sự. Những cách tiếp cận thay đổi khác nhau căn bản này phản ánh các bất đồng triết học sâu hơn của họ.
