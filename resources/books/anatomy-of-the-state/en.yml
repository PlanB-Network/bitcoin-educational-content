title: "Anatomy of the State"

publication_year: 1974

cover: cover_en.webp

original: true

description: |
  Rothbard's concise essay dissects the nature of the state, arguing that it is fundamentally a parasitic institution that survives through taxation and the monopoly of force. He distinguishes between the state and voluntary society, showing how governments use ideology, intellectuals, and fear to maintain legitimacy. The essay draws on Franz Oppenheimer's distinction between the "economic means" (production and trade) and the "political means" (coercion and confiscation) of acquiring wealth.
