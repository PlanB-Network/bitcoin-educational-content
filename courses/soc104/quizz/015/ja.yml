question: "二次元モデルは、ほとんどの政治問題を経済的カテゴリと個人的カテゴリに分けられると主張しますが、それはなぜですか？"
answer: "経済問題は生産者および消費者として行うことに関わり、個人的問題は私的な人間関係、信念、身体の自己決定に関わるから"
wrong_answers:
  - "すべての政治的議論は、結局のところ税率と宗教的実践をめぐる意見の相違に還元されるから"
  - "歴史的に政府が規制してきたものは、市場と軍隊の2つだけだから"
  - "政治哲学者は古代以来、物質的関心を精神的関心から常に分離してきたから"
explanation: >-
  二次元モデルは、政治問題が2つの大きなカテゴリに分かれるという考えに基づいています。経済的自由は、生産、消費、取引、雇用、お金の管理を対象とします。個人的自由は、私的な人間関係、意見、信念、そして自分自身の身体と精神に関する選択を対象とします。この分離により、単一の左右軸よりもはるかにニュアンスに富んだ政治的立場のマッピングが可能になります。
reviewed: false
