question: "En los diálogos de Gustave de Molinari de 1849, ¿qué personaje defiende la libertad como principio fundamental en lugar de subordinarla a otros objetivos?"
answer: "El economista, que trata la libertad como un principio que no está subordinado a ningún otro objetivo"
wrong_answers:
  - "El socialista, que defiende la libertad mediante reformas progresistas orientadas a la igualdad social"
  - "El conservador, que sostiene la libertad preservando el orden social tradicional y la estabilidad"
  - "Los tres personajes defienden la libertad por igual, pero discrepan sobre cómo implementarla"
explanation: >-
  En los diálogos de Molinari de Les Soirees de la rue Saint-Lazare, el economista está en desacuerdo permanente tanto con el socialista como con el conservador. Es el único que defiende la libertad como principio fundamental. El socialista subordina la libertad a ideales progresistas, y el conservador la subordina a la preservación del orden, lo que hace único al economista en su defensa incondicional de la libertad.
