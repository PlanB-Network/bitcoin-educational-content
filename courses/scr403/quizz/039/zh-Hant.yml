question: Simplicity 的效果是可交換且冪等的，但非單位性的。因此，哪一種最佳化器變換在一般情況下必須被拒絕？
answer: 以 unit 取代一個看似無用的運算式 —— Failure 並非單位性的，所以它可能藏著一個必須中止執行的失敗檢查。
wrong_answers:
  - 交換兩個獨立的子運算式，因為 sig-all-hash 可能會觀察到不同的環境狀態。
  - 合併兩個相同的 verify 呼叫，因為被複製的 Failure 會拋出兩次並錯誤地中止。
  - 重新排序可能拋出例外的運算式，因為所傳播的例外取決於哪一側先執行。
explanation: >-
  因為 Simplicity 的效果被保證是可交換且冪等的，交換獨立的子運算式、以及複製或合併相同的運算式，永遠是安全的；Reader 環境是固定的，而 Failure 的單位型別例外無論哪一側先拋出、拋出幾次都完全相同。然而，捨棄變換 `f ⨾ unit = unit` 需要單位性，而 Failure 並不具備：如果 `f` 包含一個作用於無效簽章的 `bip0340-verify`，消除那段『無用』程式碼便會把中止最佳化掉，從而驗證通過一筆本應失敗的交易。
reviewed: false
