question: "Misimamo ya kihafidhina na kilibertaria kuhusu kima cha chini cha mshahara hutofautianaje katika hoja zao, licha ya wote kuunga mkono kukifuta?"
answer: "Wahafidhina hukubali ushiriki fulani wa dola katika kuweka mishahara ikiwa hauzuii ushindani, ilhali walibertaria huona kima cha chini cha mshahara kama ulazimishaji wa kimaadili dhidi ya uhuru wa kuajiri na kufanya biashara"
wrong_answers:
  - "Wahafidhina hupinga kima cha chini cha mshahara kwa sababu huleta mfumuko wa bei, ilhali walibertaria hukipinga kwa sababu huwapa vyama vya wafanyakazi nguvu nyingi kupita kiasi"
  - "Wahafidhina wanataka mishahara iwekwe na taasisi za kidini na kijamii, ilhali walibertaria wanataka mishahara iamuliwe na tafiti za soko zilizoidhinishwa na serikali"
  - "Wahafidhina wanaamini mishahara ya chini inapaswa kutofautiana kwa mikoa, ilhali walibertaria wanaamini mshahara mmoja bapa unapaswa kutumika kitaifa"
explanation: >-
  Wote huunga mkono kupunguza au kufuta kima cha chini cha mshahara, lakini hoja zao hutofautiana kimsingi. Wahafidhina hukubali ushiriki fulani wa dola katika kuweka mishahara huku wakisisitiza ubaki mdogo na utegemee muktadha, wakilenga ushindani. Walibertaria huchukua msimamo mkali zaidi wa kimaadili: kima cha chini cha mshahara ni ulazimishaji dhidi ya uhuru wa kuajiri na kufanya biashara. Walibertaria wanaposema "soko," wanamaanisha mkataba, uliojadiliwa kwa uhuru kati ya pande mbili bila kuingiliwa na dola.
