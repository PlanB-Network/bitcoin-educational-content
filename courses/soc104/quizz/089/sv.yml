question: "Vad uppmuntrar Kants motto 'Sapere aude' människor att göra?"
answer: "Att våga tänka själva och lämna omyndighetens tillstånd där de är beroende av ledning från en överordnad auktoritet"
wrong_answers:
  - "Att söka akademisk kunskap genom att skriva in sig vid formella utbildningsinstitutioner och ta examina"
  - "Att utmana alla former av moral och skapa helt nya etiska system baserade på personligt begär"
  - "Att söka visdom genom religiös hängivenhet och underkastelse under kyrkans läror"
explanation: >-
  Sapere aude, som betyder "Våga tänka själv," hämtades av Kant från poeten Horatius och gjordes till upplysningens motto. Det symboliserar utträdet ur omyndighet, ett tillstånd där människor är oförmögna att använda sitt förstånd utan ledning från en överordnad klass eller auktoritet. Kant uppmuntrar emancipation och fullt ansvar för det egna tänkandet.
