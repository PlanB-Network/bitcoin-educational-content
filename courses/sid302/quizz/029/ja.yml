question: Blockstream AMPのアセットのエコシステムに参加する投資家は、通常のLiquid Networkのトランザクションと比べて、どのような根本的なトレードオフを受け入れなければなりませんか？
answer: 他のユーザーに対するプライバシーは保たれるものの、保有資産と取引履歴がアセットの発行者からはすべて見えるようになる
wrong_answers:
  - 共同署名による認可の仕組みに追加の計算コストがかかるため、取引手数料が高くなる
  - すべての送付が承認前に中央集権的なコンプライアンスサーバーで検証されるため、トランザクションの速度が落ちる
  - AMPトークンは同じ法域内の事前承認されたウォレットにしか送れないため、アセットを自由に移転しにくくなる
explanation: |
  正解は、AMPの中核にあるプライバシーのトレードオフを示しています。Confidential Transactionsによってユーザー同士のプライバシーは保たれますが、AMPのアセットでは、規制への準拠のために発行者がブラインディングを解除した状態ですべてを見られるようになっています。誤った選択肢は、運用上の制約（手数料、速度、移転のしやすさ）を説明しているだけで、すべてが秘匿される通常のLiquidとAMPを分ける、透明性に関する根本的な妥協については述べていません。