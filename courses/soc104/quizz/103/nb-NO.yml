question: "Hva mener libertarianere om individers evne til å ta beslutninger?"
answer: "Individer har både retten og ansvaret til å ta sine egne beslutninger om livet sitt"
wrong_answers:
  - "Individer bør ta beslutninger bare etter å ha rådført seg med folkevalgte representanter som forstår politiske implikasjoner"
  - "Individer er generelt ute av stand til å ta gode beslutninger og trenger ekspertveiledning fra statlige institusjoner"
  - "Individer bør ta økonomiske beslutninger fritt, men rette seg etter staten i alle sosiale og kulturelle spørsmål"
explanation: >-
  Fra et libertariansk synspunkt har individer både retten og ansvaret til å ta sine egne beslutninger. Dette står i kontrast til konvensjonelle politiske familier fra venstre til høyre, som mener at myndighetene bør ta noen eller mange av de viktige beslutningene i et individs liv og i det økonomiske livet generelt.
reviewed: false
