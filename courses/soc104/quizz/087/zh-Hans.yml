question: "自由意志主义者所描述的自由市场三项基本功能，如何共同构成一种既高效又合乎伦理的社会组织体系？"
answer: "价格为决策提供指南针，市场通过供给与需求揭示真实偏好，自由交换使个人能够根据个人价值决定自己的事务，从而把信息效率与道德自主结合起来"
wrong_answers:
  - "市场最大化总财富，通过自然竞争防止垄断，并确保资源平等分配，从而把生产力与社会正义结合起来"
  - "自由市场减少政府支出，刺激技术创新，并创造就业机会，从而把财政责任与经济增长结合起来"
  - "市场降低消费者价格，通过竞争提高产品质量，并扩大国际贸易，从而把国内繁荣与全球合作结合起来"
explanation: >-
  自由意志主义者为自由市场辩护，建立在三项相互关联的功能之上。第一，价格作为可靠指标，引导经济和社会决策（指南针）。第二，市场通过供给与需求揭示真实的个人偏好。第三，自由交换使行动者能够根据个人价值自由决定自己的事务。Hayek 表明，自由市场比中央计划更好地协调分散信息（效率），而相互同意比强制更尊重人的尊严（正义）。
reviewed: false
