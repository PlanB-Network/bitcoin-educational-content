bio: |
  Finn Andreen is a Swedish libertarian author and lecturer based in Versailles, France. His work focuses on political philosophy and political economy, in particular the realist analysis of power inspired by the Machiavellian school of thinkers (Mosca, Michels, Pareto) and the Austrian tradition of Mises and Hayek. He has published essays on the definitions of freedom and on causality in political analysis, notably on mises.org and academia.edu. In his teaching he examines the relationship between democracy and liberty, the role of public opinion in all systems of rule, and the monetary dimension of state power — themes he develops in depth in his Plan B course "Democracy and Liberty".

short_bio: Swedish libertarian author and lecturer on political philosophy and political economy
