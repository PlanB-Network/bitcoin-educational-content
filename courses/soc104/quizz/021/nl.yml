question: "Wat is cultureel conservatisme?"
answer: "Een persoonlijke gehechtheid aan familiale, morele, esthetische en metafysische waarden die uit het verleden zijn geërfd, geen politieke filosofie"
wrong_answers:
  - "Een politieke ideologie die staatsmacht gebruikt om traditionele waarden via wetgeving aan de hele samenleving op te leggen"
  - "Een beweging die alle vormen van moderniteit verwerpt en de samenleving wil terugbrengen naar een pre-industriële levenswijze"
  - "Een economische doctrine die nationale industrieën beschermt en vrije handel met andere landen afwijst"
explanation: >-
  Cultureel conservatisme wordt gedefinieerd als een levenswijsheid: de persoonlijke gehechtheid aan familiale, morele, esthetische en metafysische waarden die uit het verleden zijn geërfd, of ze nu Grieks-Romeins of joods-christelijk zijn. Het is expliciet geen politieke filosofie. Het verschilt van politiek conservatisme, dat politieke instellingen en sociale orde via staatsmacht wil behouden. Het gaat ook niet om het verwerpen van moderniteit of economisch protectionisme.
reviewed: false
