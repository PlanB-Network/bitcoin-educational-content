question: "Where do the Greens sit on the Nolan diagram, and why?"
answer: "Very low on the diagram, because they consider that individual interest must not take precedence over the collective interest of the planet"
wrong_answers:
  - "At the top of the diagram, because they prioritize personal freedom and environmental awareness equally"
  - "In the center of the diagram, because they balance economic growth with environmental protection"
  - "On the far right, because they support market-based solutions to environmental challenges"
explanation: >-
  The Greens sit very low on the Nolan diagram because they favor strong state control over both economic and personal decisions in the name of planetary well-being. They have replaced the Marxist class struggle with a struggle between man and nature, and tend to defend economic control and even the abolition of private property. This places them in the authoritarian sector, not at the top or in the center.
reviewed: false
