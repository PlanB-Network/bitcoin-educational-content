question: "현대 보수주의의 창시자로 자주 언급되는 인물은 누구인가요?"
answer: "프랑스 혁명의 급진적 변화에 맞서 제도와 전통의 보존을 주장한 에드먼드 버크"
wrong_answers:
  - "19세기에 계급투쟁과 역사적 유물론 이론을 발전시킨 카를 마르크스"
  - "17세기에 자연권과 사회계약 이론을 정식화한 존 로크"
  - "『국부론』을 저술하고 고전 경제학이라는 학문을 창시한 애덤 스미스"
explanation: >-
  에드먼드 버크는 프랑스 혁명에 반대한 인물로서 보수주의의 창시자로 자주 언급됩니다. 그의 『프랑스 혁명에 대한 성찰』(1790)은 급진적 변화보다 신중함과 점진적 개혁을 옹호했습니다. 그는 사회가 백지 상태에서 새로 출발해서가 아니라, 검증된 제도와 전통을 보존하는 점진적 개혁을 통해 발전해야 한다고 믿었습니다.
reviewed: false
