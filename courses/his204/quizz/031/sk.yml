question: Ktoré národy navrhuje Vincent de Gournay ako vzory?
answer: Anglicko a Holandsko
wrong_answers:
  - Holandsko a Švajčiarsko
  - Škótsko a Anglicko
  - Španielsko a Portugalsko
explanation: |
  Gournay obdivoval hospodárske systémy Anglicka a Holandska, ktoré boli liberálnejšie a priaznivejšie pre obchod než francúzsky.
