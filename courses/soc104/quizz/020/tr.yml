question: "Kültürel olarak muhafazakâr bir liberteryen, ahlaken onaylamadığı davranışlarla nasıl başa çıkar?"
answer: "Bu davranışlara ikna ve örnek olma yoluyla karşı çıkar ve onları caydırır, ancak yasanın zorlayıcı gücüne başvurmaz"
wrong_answers:
  - "Federal düzeyde yasaklara karşı çıkarken yerel yönetimlerin bu davranışları yasaklamasını destekler"
  - "Her türlü onaylamama ifadesinin bireysel özgürlüğü ihlal ettiğine inanarak bu davranışlar hakkında tamamen sessiz kalır"
  - "Resmi hukuk sisteminin dışında bu davranışları cezalandırabilecek topluluk mahkemelerini savunur"
explanation: >-
  Kültürel olarak muhafazakâr liberteryen, belirli davranışları ahlaken onaylamayabilir, ancak rızaya dayalı, saldırgan olmayan eylemlerin hukuken yasaklanmasını savunmaz. Bu tür eylemlerden hoşlanmayabilir, onlara karşı çıkabilir ve onları aktif olarak caydırabilir, fakat bunu her zaman yasanın zorlayıcı gücüyle değil, ikna, eğitim ve örnek olma yoluyla yapar. Bu, sessiz kalmak ya da alternatif yaptırım mekanizmaları oluşturmakla ilgili değildir.
reviewed: false
