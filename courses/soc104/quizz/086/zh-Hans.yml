question: "亲商业和亲市场之间的关键区别是什么？"
answer: "亲商业倡导者寻求国家干预，以保护特定公司免于失败；亲市场倡导者支持去监管，并允许企业失败，使市场能够自然重组"
wrong_answers:
  - "亲商业倡导者关注大公司，而亲市场倡导者只关注支持小企业和初创企业"
  - "亲商业是一种支持工人合作社的左翼立场，而亲市场是一种支持私有制的右翼立场"
  - "亲商业倡导者拒绝一切竞争，而亲市场倡导者支持经政府监管、在获批企业之间进行的竞争"
explanation: >-
  亲商业立场把竞争视为一种通过监管获得的治理工具，并以防止失业为理由为补贴和救助辩护。在亲商业观点中，市场是脆弱的，需要国家来拯救。亲市场倡导者把竞争视为自由企业的自然结果，这意味着去监管并允许企业失败，因为失败使市场能够自然重组，并为更有能力的行动者打开空间。
reviewed: false
