question: "Kuidas võivad riigi rahastatud sotsiaalabi programmid tekitada perversseid mõjusid, näidates ohtu, mis kaasneb üksnes kavatsustele toetumisega?"
answer: "Need võivad luua sõltuvust, kaotada stiimulid töötada ja tähendada riisumist, sest raha tuleb esmalt võtta neilt, kes rikkuse lõid"
wrong_answers:
  - "Need soodustavad liigset isiklikku säästmist, vähendavad tarbijakulutusi ja põhjustavad laiemas majanduses deflatsiooni"
  - "Need tugevdavad eraettevõtlust, nihutades tööjõukulusid valitsusele ja vähendades vajadust konkurentsivõimeliste palkade järele"
  - "Need kaotavad klassierinevused nii põhjalikult, et sotsiaalne mobiilsus muutub tarbetuks ja innovatsioon stagneerub"
explanation: >-
  Friedman hoiatab, et õilsad kavatsused võivad tekitada kahjulikke tagajärgi, kui need jätavad tähelepanuta inimlike stiimulite range analüüsi. Riigi rahastatud abiprogrammid riskivad sõltuvuse loomisega, töötamiseks stiimuli puudumise tekitamisega ja riisumise vormi moodustamisega, sest vahendid tuleb esmalt võtta rikkuse tootjatelt. Mõõdetavad tulemused, nagu vaesuse vähendamine ja tõhusus, peavad olema õilsatest kavatsustest tähtsamad.
reviewed: false
