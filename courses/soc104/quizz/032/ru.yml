question: "Чем различаются стратегии упразднения государства у либертеров и либертарианцев?"
answer: "Либертеры исторически выступали за насильственное уничтожение, тогда как либертарианцы стремятся делегитимировать государство через образование и гражданское неповиновение"
wrong_answers:
  - "Либертеры используют демократические выборы, чтобы демонтировать государство, тогда как либертарианцы поддерживают вооружённую революцию и прямое действие"
  - "Либертеры сосредоточены на построении альтернативных сообществ, тогда как либертарианцы работают внутри существующей политической системы, чтобы проводить реформы"
  - "И либертеры, и либертарианцы согласны, что мирный протест — единственное легитимное средство общественного преобразования"
explanation: >-
  Либертеры исторически выступали за уничтожение государства и капитализма посредством насилия, включая террор и целевые атаки. Либертарианцы, напротив, отвергают агрессивное насилие как нелегитимное. Их стратегия основана на делегитимации государства через аргументацию, дебаты, образование и гражданское неповиновение. Эти фундаментально разные подходы к изменениям отражают их более глубокие философские разногласия.
