question: "Who is often cited as the founding figure of modern conservatism?"
answer: "Edmund Burke, who advocated preserving institutions and traditions against the radical changes of the French Revolution"
wrong_answers:
  - "Karl Marx, who developed the theory of class struggle and historical materialism in the nineteenth century"
  - "John Locke, who articulated the theory of natural rights and the social contract in the seventeenth century"
  - "Adam Smith, who wrote The Wealth of Nations and founded the discipline of classical economics"
explanation: >-
  Edmund Burke is often cited as the founding figure of conservatism for his opposition to the French Revolution. His Reflections on the Revolution in France (1790) championed prudence and gradual reform over radical change. He believed society should advance not by making a clean slate but through incremental reforms that preserve tested institutions and traditions.
