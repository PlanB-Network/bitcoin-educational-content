question: "米国の古典的自由主義者は、なぜ1960年代以降、自らを「libertarians」と呼び始めたのか？"
answer: "意味が国家介入主義へと変化していたアメリカのリベラルと自分たちを区別するため"
wrong_answers:
  - "民主党とその進歩的な社会プログラムに自分たちを合わせるため"
  - "リンドン・B・ジョンソンの「偉大な社会」改革への支持を示すため"
  - "欧州の社会主義運動に触発された、より急進的な革命的アイデンティティを採用するため"
explanation: >-
  米国では、「liberal」という語は、特にニュー・ディールと「偉大な社会」の後、大きな政府と国家介入の支持者を意味するように変化した。
  古典的自由主義者は、自分たちの哲学の本来の意味を保つために、「libertarian」というラベルを採用した。
  彼らはアメリカのリベラルから距離を置いていたのであって、彼らと足並みをそろえていたのではない。
reviewed: false
