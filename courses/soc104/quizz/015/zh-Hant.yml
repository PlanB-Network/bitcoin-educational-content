question: "為什麼二維模型主張，大多數政治議題可以分為經濟與個人兩類？"
answer: "因為經濟議題關乎你作為生產者與消費者所做的事，而個人議題關乎你的私人關係、信念與身體自主"
wrong_answers:
  - "因為所有政治辯論最終都簡化為對稅率水準與宗教實踐的分歧"
  - "因為政府歷史上只管制兩件事：市場與軍事"
  - "因為政治哲學家自古以來總是將物質關切與精神關切分開"
explanation: >-
  二維模型基於這樣的理念：政治議題可分為兩大類。經濟自由涵蓋生產、消費、貿易、就業與金錢管理。個人自由涵蓋私人關係、觀點、信念，以及關於自己身體與心智的選擇。這種分離讓政治立場的映射比單一左右軸細緻得多。
reviewed: false
