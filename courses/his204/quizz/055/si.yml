question: Physiocracy වෙතින් ප්‍රේරණය වූ ආර්ථික ප්‍රතිසංස්කරණ ක්‍රියාත්මක කළේ කුමන රටවලද?
answer: ප්‍රංශය, ජර්මනිය, ඉතාලිය සහ ස්වීඩනය
wrong_answers:
  - එංගලන්තය, ස්පාඤ්ඤය සහ ඕලන්දය
  - පෘතුගාලය, එංගලන්තය සහ ස්පාඤ්ඤය
  - ඕලන්දය, ස්පාඤ්ඤය සහ පෘතුගාලය
explanation: |
  Physiocratic ප්‍රතිසංස්කරණ ප්‍රංශයේ (Turgot යටතේ), ජර්මනියේ (Badenගේ Margrave, Dietlingenහි Schlettweinගේ අත්හදා බැලීම සමඟ), ඉතාලියේ (Tuscanyහි Leopold) සහ ස්වීඩනයේ (Gustav III) ක්‍රියාත්මක කරන ලදී. රුසියාවේ Catherine II ද Mercier de la Riviereට ආරාධනා කළ නමුත්, ඔහු ගැන ඇය කලකිරුණාය.