question: "Hvordan henger Karl Poppers skille mellom åpne og lukkede samfunn sammen med debatten om individualisme versus kollektivisme?"
answer: "Det åpne samfunnet anerkjenner individets rett til å dømme selv gjennom personlige beslutninger, mens det lukkede samfunnet er kollektivistisk og hviler på stammentalitet og avvisning av kritisk frihet"
wrong_answers:
  - "Det åpne samfunnet er et samfunn som tillater frihandel over nasjonale grenser, mens det lukkede samfunnet innfører toll og proteksjonistisk økonomisk politikk"
  - "Det åpne samfunnet styres av direkte demokrati der hver borger stemmer, mens det lukkede samfunnet styres av én enkelt arvelig monark"
  - "Det åpne samfunnet offentliggjør alle offentlige dokumenter transparent, mens det lukkede samfunnet klassifiserer informasjon som statshemmeligheter"
explanation: >-
  Popper definerte det lukkede samfunnet som det magiske eller tribale samfunnet og det åpne samfunnet som et samfunn der individer konfronteres med personlige beslutninger. Det lukkede samfunnet er kollektivistisk, hviler på stammentalitet med en avvisning av kritisk frihet og idealiseringen av en statisk orden. Det åpne samfunnet gir forrang til fritt valg av verdier, overbevisninger og relasjoner, og legemliggjør individualistiske prinsipper direkte.
reviewed: false
