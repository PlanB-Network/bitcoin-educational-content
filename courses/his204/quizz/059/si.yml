question: Physiocrats සඳහා, නිෂ්පාදනය සහ ලාභය අතර වෙනස කුමක්ද?
answer: කර්මාන්තකරුවා සහ වෙළෙන්දා ලාභ ලැබිය හැක, නමුත් නිෂ්පාදනය කරන්නේ ගොවියා පමණි, මන්ද නිෂ්පාදනය යනු ප්‍රයෝජනවත් ද්‍රව්‍ය නිර්මාණය කිරීමයි
wrong_answers:
  - නිෂ්පාදකයන් සහ වෙළෙන්දන් ලාභයක් ලබා නොගත හැක. කෘෂිකර්මය පමණක් අනිවාර්යයෙන් ලාභ ගෙන එයි.
  - ගොවියාට උපයා ගත හැක, නමුත් නිෂ්පාදනය කරන්නේ කර්මාන්තකරුවා සහ වෙළෙන්දා පමණි, මන්ද නිෂ්පාදනය කිරීම යනු සේවාවක් සැපයීමයි
  - නිෂ්පාදනය සහ ලාභය එකම දෙයකි
explanation: |
  Physiocrats විශ්වාස කළේ නව ද්‍රව්‍ය නිර්මාණය කරන බැවින් කෘෂිකර්මය පමණක් නිෂ්පාදනශීලී බවයි. කර්මාන්තය සහ වාණිජය, ඒවා පවතින ධනය පමණක් පරිවර්තනය කිරීම හෝ වෙනත් තැනකට ගෙනයාම සිදු කරන බැවින්, නිෂ්ඵල ක්‍රියාකාරකම් ලෙස සැලකුණි.