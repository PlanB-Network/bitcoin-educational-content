question: "Ingingo yo kutagaba igitero nk'uko Murray Rothbard yayiteguye ni iki?"
answer: "Ntivyemewe gutangura gukoresha inguvu z'umubiri ku wundi muntu canke ku mutungo wiwe, naho inguvu zo kwivuna umwansi zemewe"
wrong_answers:
  - "Uburyo bwose bw'inguvu bwama ari bubi, harimwo ukwivuna umwansi n'ukurwanya agahahazo"
  - "Inguvu ziremewe iyo zerekejwe ku nzego zihahaza, ariko ntizigere zerekejwe ku bandi bantu"
  - "Leta yonyene ni yo ifise uburenganzira bwemewe bwo gukoresha inguvu, kandi abantu ku giti cabo ntibakwiye kwigera bazikoresha"
explanation: >-
  Ingingo ya Rothbard yo kutagaba igitero ivuga ko gutangura gukoresha inguvu z'umubiri ku wundi muntu canke ku mutungo wiwe bidafise ishingiro ryemewe. Ni ihindurwa mu vy'ubufilosofi ry'itegeko ry'inzahabu. Ariko ntibuza inguvu zose: inguvu zo kwivuna umwansi, harimwo ukwikingira no kurwanya agahahazo, zifatwa nk'izemewe. Ivyo birayitandukanya n'ukwanka inguvu burundu hamwe n'ikirego ca Leta co kugira monopole ku nguvu.
