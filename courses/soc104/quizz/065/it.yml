question: "Perché i regimi totalitari sono stati descritti come 'religioni secolari' e che cosa rivela questo sulle condizioni necessarie perché il totalitarismo esista?"
answer: "Richiedono ai militanti una fede quasi religiosa e usano la paura contro gli oppositori, e il totalitarismo richiede simultaneamente tutte le sue caratteristiche: libertà soppresse, governo a partito unico, rivoluzione violenta ed economia diretta"
wrong_answers:
  - "Sostituiscono il culto tradizionale con cerimonie di Stato, e il totalitarismo richiede solo un leader carismatico e il controllo militare"
  - "Usano le istituzioni religiose per imporre l'ideologia di Stato, e il totalitarismo può emergere ogni volta che un singolo partito politico domina il parlamento"
  - "Promettono la salvezza spirituale attraverso l'azione politica, e il totalitarismo esiste ogni volta che lo Stato controlla l'economia indipendentemente dalle libertà politiche"
explanation: >-
  Raymond Aron osservò che i regimi totalitari funzionano su due principi: la fede dei militanti e la paura degli oppositori. Questo fanatismo quasi religioso li caratterizza al di là delle loro diverse motivazioni, guadagnando loro l'etichetta di religioni secolari. Fondamentalmente, il totalitarismo richiede simultaneamente tutte le caratteristiche che lo definiscono: libertà soppresse, autorità illimitata tramite un partito unico, rivoluzione violenta ed economia diretta. Le democrazie moderne possono presentare alcuni di questi tratti, ma il totalitarismo è presente solo quando tutti sono riuniti insieme.
reviewed: false
