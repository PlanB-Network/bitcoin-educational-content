question: "ลิเบอร์ทาเรียนเชื่ออะไรเกี่ยวกับความสามารถของปัจเจกบุคคลในการตัดสินใจ?"
answer: "ปัจเจกบุคคลมีทั้งสิทธิและความรับผิดชอบในการตัดสินใจเกี่ยวกับชีวิตของตนเอง"
wrong_answers:
  - "ปัจเจกบุคคลควรตัดสินใจหลังจากปรึกษาผู้แทนที่มาจากการเลือกตั้งซึ่งเข้าใจผลกระทบเชิงนโยบายแล้วเท่านั้น"
  - "โดยทั่วไปปัจเจกบุคคลไม่สามารถตัดสินใจได้ดีและต้องการคำแนะนำจากผู้เชี่ยวชาญในสถาบันรัฐบาล"
  - "ปัจเจกบุคคลควรตัดสินใจทางเศรษฐกิจได้อย่างเสรี แต่ยอมให้รัฐตัดสินใจในประเด็นสังคมและวัฒนธรรมทั้งหมด"
explanation: >-
  จากมุมมองลิเบอร์ทาเรียน ปัจเจกบุคคลมีทั้งสิทธิและความรับผิดชอบในการตัดสินใจของตนเอง สิ่งนี้ตรงข้ามกับกลุ่มการเมืองตามธรรมเนียมตั้งแต่ซ้ายถึงขวา ซึ่งเชื่อว่ารัฐบาลควรตัดสินใจบางเรื่องหรือหลายเรื่องที่สำคัญในชีวิตของปัจเจกบุคคลและในชีวิตเศรษฐกิจโดยทั่วไป
reviewed: false
