description: |
  "zk" i zkSNACKs står for nullkunnskap, noe som betyr at vi ikke samler inn og ikke kan samle inn noen personlig brukerinformasjon i våre produkter.

  zkSNACKs la ned coinjoin-koordinatoren sin 1. juni 2024, og nettstedet er utilgjengelig. Wasabi Wallet fortsetter som programvare med åpen kildekode.

