question: "在保守主義政治哲學中，什麼優先於自由？"
answer: "秩序與傳統，它們必須先被牢固建立，自由才可能受到重視"
wrong_answers:
  - "社會正義與平等，它們必須先被保障，個人才可能真正自由"
  - "經濟效率與務實結果，它們決定自由在何時適當"
  - "個人財產權，它必須先受到保護，其他任何自由才會被授予"
explanation: >-
  對保守主義者而言，秩序與傳統優先於自由。他們主張，過多自由會產生混亂與社會失序，因此自由只有在秩序已被牢固建立之後才可能受到重視。這與優先考慮正義的社會主義觀點，或中間派對效率的關注形成對比。
