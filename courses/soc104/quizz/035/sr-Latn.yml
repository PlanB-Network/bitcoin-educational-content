question: "Zašto je Rothbard kritikovao viziju ljudske prirode kod libertaires i koju alternativu je predložio?"
answer: "Optužio ih je da imaju naivan pogled 'plemenitog divljaka' i tvrdio da društvo mora koristiti privatnu svojinu i dobre podsticaje da usmerava ponašanje zasnovano na sopstvenom interesu"
wrong_answers:
  - "Hvalio je njihovo razumevanje ljudske saradnje, ali je tvrdio da je minimalna država ipak neophodna za sprovođenje ugovora"
  - "Složio se da su ljudi prirodno dobri, ali je insistirao da samo slobodna tržišta mogu usmeriti tu dobrotu u produktivnu aktivnost"
  - "Odbacio je njihov naglasak na individualnim pravima i umesto toga tvrdio da zajednice treba kolektivno da definišu moralne standarde"
explanation: >-
  Rothbard je kritikovao libertaires zbog usvajanja naivne, rousseauovske vizije ljudske prirode kao prirodno dobre. Umesto toga tvrdio je da ljude vodi sopstveni interes i da društvo mora biti organizovano tako da dobri podsticaji usmeravaju ponašanje. To zahteva priznavanje i garantovanje privatne svojine. Ukidanje države ne znači ukidanje njenih funkcija; policijom i pravdom treba da upravlja slobodno tržište kroz konkurenciju.
