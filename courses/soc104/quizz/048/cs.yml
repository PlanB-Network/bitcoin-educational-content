question: "Jak Michael Oakeshott ve svém filozofickém díle charakterizoval konzervatismus?"
answer: "Jako temperament a dispozici k životu spíše než jako rigidní systematickou ideologii"
wrong_answers:
  - "Jako ucelenou ekonomickou teorii s přesnými politickými předpisy pro každou oblast vlády"
  - "Jako revoluční hnutí, které se snaží rozložit moderní instituce a vrátit se k předindustriální společnosti"
  - "Jako čistě náboženskou doktrínu založenou na křesťanské teologii a církevní autoritě"
explanation: >-
  Michael Oakeshott, britský filozof, hájil pojetí konzervatismu jako temperamentu spíše než systematické ideologie. Jeho esej On Being Conservative (1956) zůstává zásadním odkazem. Toto pojetí konzervatismu jako dispozice ovlivnilo také Friedricha Hayeka. Oakeshottův přístup je pozoruhodný svou kritikou racionalismu v politice, protože odmítá představu, že politiku lze redukovat na systém.
reviewed: false
