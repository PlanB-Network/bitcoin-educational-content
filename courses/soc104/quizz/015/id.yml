question: "Tokoh-tokoh emblematis mana yang diasosiasikan dengan kebebasan ekonomi maksimum pada diagram Nolan?"
answer: "Margaret Thatcher, Ronald Reagan, dan Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures, dan Bernie Sanders"
  - "Nelson Mandela, Simone Veil, dan Noam Chomsky"
  - "Vladimir Putin, Xi Jinping, dan Joseph de Maistre"
explanation: >-
  Thatcher, Reagan, dan Milei disebut sebagai tokoh-tokoh emblematis kebebasan ekonomi maksimum, yang mendukung lebih sedikit intervensi negara, lebih sedikit regulasi, dan pajak yang lebih rendah. Roosevelt, Jaures, dan Sanders merepresentasikan ujung berlawanan yang mendukung kontrol negara atas ekonomi. Mandela, Veil, dan Chomsky merepresentasikan kebebasan pribadi maksimum. Putin, Xi Jinping, dan de Maistre merepresentasikan kontrol negara maksimum atas kehidupan pribadi.
reviewed: false
