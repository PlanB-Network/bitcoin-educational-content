question: "なぜこのコースは、Bitcoin を右派や左派のプロジェクトではなく、国家通貨に対抗する市場通貨だと説明しているのか？"
answer: "Bitcoin は自発的に採用され、生産が困難で、分散型で、価値を保持する通貨であり、価値を失う強制的で中央集権的な法定通貨と対照的であるため、分断は政治イデオロギーではなく市場対国家についてのものになるから"
wrong_answers:
  - "Bitcoin は、その意図された目的や哲学について意図的に政治的発言を避けた匿名開発者によって作られたから"
  - "Bitcoin のマイニングアルゴリズムが、すべての政党に新しいコインを平等に配分することを保証し、貨幣システム内のイデオロギー的偏りを防ぐから"
  - "Bitcoin は既存の法定通貨と同一に機能するが、より高速な決済ネットワーク上で動作するため、政治的区別が無関係になるから"
explanation: >-
  Bitcoin は、貨幣の政治化に対する平和的反乱として説明される。
  国家通貨または法定通貨は、価値を失う傾向のある強制的で中央集権的なシステムである。
  市場通貨、歴史的には金、現在では Bitcoin は、自発的に現れ、長期的に価値を保持する、健全で生産困難な通貨である。
  本当の対立は左対右ではなく市場対国家であり、Bitcoin は従来のイデオロギー的陣営を超える政治的断絶となる。
reviewed: false
