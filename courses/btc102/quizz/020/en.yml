question: What are the possible effects of orchestrated devaluation of national currencies?
answer: Social instability and the rise of political extremism
wrong_answers:
  - Economic growth and national prosperity
  - Improving international trade
  - Consolidating democracy and the natural rights of individuals
explanation: |
  Devaluation can provoke an economic crisis through inflation, fuelling social discontent and the rise of political extremism.
