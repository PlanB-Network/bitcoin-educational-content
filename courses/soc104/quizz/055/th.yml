question: "ทำไม Ron Paul จึงโต้แย้งว่า Federal Reserve เป็นอันตราย และ Bitcoin เกี่ยวข้องกับจุดยืนของเขาอย่างไร?"
answer: "Federal Reserve ก่อให้เกิดเงินเฟ้อและวัฏจักรเศรษฐกิจผ่านการจัดการเงิน fiat และ Bitcoin เป็นตัวแทนของ sound money รูปแบบหนึ่งที่อาจแทนที่มาตรฐานทองคำได้"
wrong_answers:
  - "Federal Reserve จำกัดการแข่งขันของธนาคาร และ Bitcoin กระจายศูนย์บริการธนาคารเพื่อปรับปรุงการเข้าถึงบริการทางการเงิน"
  - "Federal Reserve ขัดขวางการค้าเสรีระหว่างประเทศ และ Bitcoin ทำให้ธุรกรรมไร้พรมแดนเกิดขึ้นได้โดยไม่ต้องขออนุมัติจากรัฐบาล"
  - "Federal Reserve สร้างหนี้รัฐบาลมากเกินไป และ Bitcoin เสนอสกุลเงินแบบเงินฝืดที่กำจัดหนี้ชาติได้"
explanation: >-
  Ron Paul ซึ่งเป็น minarchist โต้แย้งว่า Federal Reserve รับผิดชอบต่อเงินเฟ้อและวัฏจักรเศรษฐกิจ เพราะมันจัดการเงิน fiat เขาเชิดชูการถอนความเป็นของชาติออกจากเงิน ซึ่งเป็นแนวคิดที่ Friedrich Hayek สนับสนุน และมอง Bitcoin เป็น sound money รูปแบบหนึ่งที่อาจแทนที่มาตรฐานทองคำได้ การวิจารณ์ของเขามีรากฐานอยู่ในทฤษฎีการเงินแบบลิเบอร์ทาเรียน ไม่ใช่หลัก ๆ ในการแข่งขันของธนาคาร อุปสรรคทางการค้า หรือหนี้รัฐบาล
reviewed: false
