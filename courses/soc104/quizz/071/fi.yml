question: "Miksi libertaarit vastustavat verotusta?"
answer: "Koska se on omistusoikeuksien moraalinen loukkaus, valtiollisen varkauden muoto, joka ottaa toisen omaisuutta ilman suostumusta"
wrong_answers:
  - "Koska verot ovat taloudellisesti tehottomia ja johtavat aina korkeampaan työttömyysasteeseen"
  - "Koska verotus vähentää ulkomaisia investointeja ja heikentää maan kilpailuasemaa"
  - "Koska progressiiviset verojärjestelmät kohdistuvat epäoikeudenmukaisesti varakkaisiin yksilöihin, jotka luovat eniten työpaikkoja"
explanation: >-
  Libertaarinen vastalause verotukselle on moraalinen ennen kuin se on taloudellinen. Libertaarit pitävät verotusta valtiollisen varkauden muotona ja yksityisomaisuuden esteenä, koska siinä otetaan toisen omaisuutta ilman suostumusta. Vaikka verotusta vastaan voi olla taloudellisia argumentteja, perustava libertaarinen argumentti nojaa periaatteeseen, että verotus loukkaa omistusoikeuksia, ei tehokkuuden tai kilpailukyvyn laskelmiin.
