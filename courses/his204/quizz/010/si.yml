question: Vaubanට අනුව, සෑම කෙනෙකුම බදු ගෙවීම නිවැරදි හා ස්වාභාවික වන්නේ ඇයි?
answer: රාජ්‍යය සිය සේවාවන් සැමට ලබා දෙන බැවින්, ඒවා සඳහා ගෙවීමට සෑම කෙනෙකුම දායක වීම සාධාරණය
wrong_answers:
  - මුළු ජනගහනයටම එකවර බදු පැනවීමෙන් රාජ්‍යයට වැඩි මුදලක් රැස් කළ හැකි බැවින්
  - ජීවිත කාලය තුළ සෑම කෙනෙකුම සමහර විට ධනවත් සහ සමහර විට දුප්පත් වන බැවින්, සෑම කෙනෙකුටම සමාන ලෙස බදු පැනවීම වඩා හොඳ බැවින්
  - එය යුද්ධවලට මුදල් සැපයීමට සහ රාජධානියේ ශ්‍රේෂ්ඨත්වය සහතික කිරීමට උපකාරී වන බැවින්
explanation: |
  සියලු පුරවැසියන් ආරක්ෂාව, යුක්තිය සහ යටිතල පහසුකම් වැනි රාජ්‍ය සේවාවලින් ප්‍රතිලාභ ලබන බැවින්, බදුකරණය විශ්වීය විය යුතු බව Vauban විශ්වාස කළේය. එබැවින් සෑම කෙනෙකුම තම හැකියාව අනුව ඒවායේ මූල්‍යකරණයට දායක වීම සාධාරණ යැයි ඔහු සැලකුවේය.
