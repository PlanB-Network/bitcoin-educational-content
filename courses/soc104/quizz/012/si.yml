question: "Nolan රූපසටහනේ පුද්ගලික නිදහසේ අක්ෂයේ පහළ කොටස ලක්ෂණගත කරන්නේ කුමක්ද?"
answer: "පිළිවෙළ, ආරක්ෂාව, සම්ප්‍රදායික වටිනාකම්, සහ රාජ්‍යය සදාචාරය නියාමනය කර මහජන පිළිවෙළ පවත්වා ගැනීම සඳහා ඇති කැමැත්ත"
wrong_answers:
  - "පුද්ගලික ස්වයංපාලනය, සහනශීලීභාවය, සහ පුද්ගලික ජීවිත තේරීම්වල රාජ්‍ය මැදිහත්වීම අවම කිරීම සඳහා ඇති කැමැත්ත"
  - "ආර්ථික deregulation, නිදහස් වෙළඳාම, සහ තීරුබදු හා සහනාධාර අහෝසි කිරීම සඳහා ඇති කැමැත්ත"
  - "ධනය නැවත බෙදාහැරීම, ඉහළ බදු, සහ ප්‍රධාන කර්මාන්ත ජාතිකකරණය සඳහා ඇති කැමැත්ත"
explanation: >-
  පුද්ගලික නිදහසේ අක්ෂයේ පහළ කොටස පුද්ගලික ජීවිතය මත උපරිම රාජ්‍ය පාලනය නියෝජනය කරන අතර, එය පිළිවෙළ, ආරක්ෂාව, සහ සම්ප්‍රදායික වටිනාකම් සඳහා ඇති කැමැත්තකින් ලක්ෂණගත වේ. රාජ්‍යය සදාචාරය නියාමනය කරයි, මහජන පිළිවෙළ පවත්වා ගනී, සහ සදාචාරය හෝ සම්ප්‍රදාය පිළිබඳ නිශ්චිත දැක්මක් ආරක්ෂා කළ හැක. අක්ෂයේ ඉහළ කොටස විරුද්ධය නියෝජනය කරයි: පුද්ගලික නිදහස සහ සහනශීලීභාවය. ආර්ථික ප්‍රතිපත්ති වෙනම තිරස් අක්ෂය මත මනිනු ලැබේ.
