question: Колко основни комбинатора има Simplicity?
answer: Девет (iden, unit, comp, pair, case, take, drop, injl, injr).
wrong_answers:
  - Три (последователна композиция, паралелна композиция, условна композиция).
  - Пет (само комбинаторите comp, pair, case, take и drop).
  - Дванадесет (деветте основни плюс три допълнителни разширителни комбинатора).
explanation: >-
  Simplicity има точно девет основни комбинатора. Две основни операции (iden
  и unit), три метода за композиция (comp, pair, case) и четири
  достъпващи комбинатора (take, drop за product-и, injl и injr за sum-ове).
  Тези девет са достатъчни за изразяване на всяка функция между типове на Simplicity.
