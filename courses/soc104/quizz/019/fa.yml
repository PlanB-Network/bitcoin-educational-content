question: "محور عمودی نمودار Nolan دربارهٔ پرسش سیاسی واقعی چه چیزی را آشکار می‌کند؟"
answer: "آشکار می‌کند که آیا می‌خواهید حساسیت‌ها و ترجیحات خود را از طریق دولت بر دیگران تحمیل کنید، یا ترجیح می‌دهید هر فرد آزاد باشد برای خودش تصمیم بگیرد"
wrong_answers:
  - "آشکار می‌کند که آیا از حکمرانی دموکراتیک حمایت می‌کنید یا حکومت اقتدارگرایانهٔ یک رهبر واحد را ترجیح می‌دهید"
  - "آشکار می‌کند که آیا خود را با جنبش‌های اجتماعی ترقی‌خواه هم‌هویت می‌دانید یا با نهادهای دینی سنتی"
  - "آشکار می‌کند که آیا دغدغهٔ اصلی شما امنیت ملی است یا شکوفایی اقتصادی"
explanation: >-
  محور عمودی پرسش سیاسی واقعی را آشکار می‌کند: نه اینکه چپ هستید یا راست، بلکه اینکه تا چه حد می‌خواهید دولت در شکل‌دادن جامعه مطابق با ارزش‌های شما مداخله کند. آیا می‌خواهید حساسیت‌ها و ترجیحات خود را بر دیگران تحمیل کنید، یا ترجیح می‌دهید هر فرد آزاد باشد برای خودش تصمیم بگیرد؟ این چارچوب‌بندی از شکاف چپ-راست فراتر می‌رود و نشان می‌دهد که هر دو اردوگاه می‌توانند به یک اندازه دولت‌گرا باشند.
reviewed: false
