question: "パレオ・リバタリアニズムとは何か？"
answer: "強制の源としての国家の拒否と、伝統的制度および自発的な社会構造の強化を組み合わせた統合"
wrong_answers:
  - "すべての伝統的価値を拒否し、急進的な社会進歩主義を促進するリバタリアン運動"
  - "国家権力を用いて伝統的価値を強制しつつ、一定の経済的自由を認める保守的イデオロギー"
  - "社会主義経済と保守的社会政策の均衡ある妥協を求める中道哲学"
explanation: >-
  パレオ・リバタリアニズムは、強制の制度的な源としての国家の拒否と、伝統的制度の強化、そして国家権力よりも自発的な社会構造を好む姿勢を組み合わせる。
  伝統的価値により共感的である点で、ネオ・リバタリアニズムとは異なる。
  パレオ・リバタリアンは、社会主義的または共同体主義的原理を中心に共同体が組織されることに反対しない。
  そのような共同体が法の力によって自分たちの価値を全員に押し付けることだけを拒否する。
reviewed: false
