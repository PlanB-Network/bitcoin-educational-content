question: What authentication credentials does Polar automatically generate for each node's API access?
answer: TLS certificates and macaroon files required for secure REST and gRPC communication
wrong_answers:
  - OAuth2 tokens and API keys that expire after 24 hours of inactivity
  - Username and password pairs stored in a plaintext configuration file
  - SSH key pairs and GPG signatures for encrypted peer-to-peer communication
explanation: >-
  Each node in Polar automatically generates TLS certificates and macaroon files,
  which are the same authentication credentials used in production TAPD deployments.
  These credentials enable secure, authenticated communication via both REST and
  gRPC interfaces. They can be found in each node's detail panel within the
  Polar interface.
reviewed: false
