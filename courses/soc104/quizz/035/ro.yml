question: "Pe ce se concentrează o definiție structurală a unui sistem politic?"
answer: "Pe modul în care sistemul funcționează efectiv și pe caracteristicile sale observabile, cum ar fi gradul de control al statului"
wrong_answers:
  - "Pe obiectivele declarate și intențiile nobile anunțate de fondatorii și liderii sistemului"
  - "Pe originile istorice ale mișcării politice și biografiile gânditorilor săi cheie"
  - "Pe numărul de partide politice permise și frecvența alegerilor democratice organizate"
explanation: >-
  Definițiile structurale se concentrează pe modul în care sistemele politice funcționează efectiv și pe caracteristicile lor observabile. De exemplu, socialismul este caracterizat structural prin omniprezența statului. Această abordare contrastează cu definițiile intenționale, care se bazează pe motivații și obiective declarate. Abordarea structurală permite o evaluare mai obiectivă, bazată pe rezultate măsurabile.
