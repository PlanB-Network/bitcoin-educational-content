question: "Vad vill högern lagstifta om?"
answer: "Moral och religion, driven av en vilja att bevara traditionella institutioner och sociala hierarkier"
wrong_answers:
  - "Ekonomin och finansmarknaderna, driven av en vilja att minska ojämlikhet och omfördela rikedom"
  - "Vetenskap och utbildning, driven av en vilja att kontrollera vad som lärs ut i offentliga skolor"
  - "Internationell handel och diplomati, driven av en vilja att utöka nationellt inflytande utomlands"
explanation: >-
  Högern prioriterar personlig moral och traditionella värden. Den anser att civilisationen bygger på vissa traditionella institutioner och sociala hierarkier som måste bevaras, och den vill lagstifta om moral och religion. Vänstern, inte högern, fokuserar på att lagstifta om ekonomin. Vetenskap, utbildning och handelspolitik är inte det huvudsakliga fokus som beskrivs för högern.
reviewed: false
