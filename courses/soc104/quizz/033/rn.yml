question: "Ingamba zo gukuraho Leta zitandukana gute hagati y'aba libertaires n'aba libertarian?"
answer: "Aba libertaires mu mateka bashigikira ugusenya biciye mu nguvu, mu gihe aba libertarian barondera gutuma Leta itakaza uburenganzira bwayo mu kwigisha no mu kutagamburuka kw'abanyagihugu"
wrong_answers:
  - "Aba libertaires bakoresha amatora ya demokarasi kugira basenyure Leta, mu gihe aba libertarian bashigikira revolisiyo yitwaje ibirwanisho n'ibikorwa bidaciye ku bandi"
  - "Aba libertaires bashira imbere kwubaka ibibano bisubirira ibihari, mu gihe aba libertarian bakorera mu nzira za politike zisanzwe kugira bemeze amavugurura"
  - "Aba libertaires n'aba libertarian bompi baremeranya ko imyiyerekano y'amahoro ari yo nzira yonyene yemewe yo guhindura ikibano"
explanation: >-
  Aba libertaires mu mateka bashigikira gusenya Leta na kapitalizimu biciye mu nguvu, harimwo iterabwoba n'ibitero vyerekejwe ku bantu canke ku bintu. Aba libertarian bo, ku rundi ruhande, banka inguvu zo gutera abandi kuko zitagira ishingiro ryemewe. Ingamba zabo zishingiye ku gutuma Leta itakaza uburenganzira bwayo biciye mu gutanga ivyiyumviro, ibiganiro, impaka, inyigisho, no mu kutagamburuka kw'abanyagihugu. Ubwo buryo butandukanye cane bwo guhindura ibintu bugaragaza ukutemeranya kwabo kwimbitse mu vy'ubufilosofi.
