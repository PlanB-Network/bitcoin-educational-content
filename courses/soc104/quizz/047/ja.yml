question: "Michael Oakeshott は、哲学的著作の中で保守主義をどのように特徴づけたか？"
answer: "硬直した体系的イデオロギーではなく、人生に対する気質と態度として"
wrong_answers:
  - "政府のあらゆる領域について精密な政策処方を持つ包括的な経済理論として"
  - "近代的制度を解体し、産業化以前の社会へ戻ることを目指す革命運動として"
  - "キリスト教神学と教会権威に根ざした純粋に宗教的な教義として"
explanation: >-
  英国の哲学者 Michael Oakeshott は、保守主義を体系的イデオロギーではなく気質として捉える構想を擁護した。彼の論考 On Being Conservative（1956 年）は、今なお重要な参照点である。保守主義を態度として見るこの見方は、Friedrich Hayek にも影響を与えた。Oakeshott のアプローチは、政治における合理主義への批判、すなわち政治を一つの体系に還元できるという考えの拒否によって注目される。
reviewed: false
