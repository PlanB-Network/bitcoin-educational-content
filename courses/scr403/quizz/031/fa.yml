question: اثبات کامل‌بودن هر تابعی را با تو‌در‌تو کردن case برای تجزیهٔ ورودی و scribe برای هر خروجی می‌سازد. چرا این فقط یک ابزار نظری است؟
answer: عبارت حاصل یک جدول جست‌وجوی عظیم است که اندازه‌اش به‌صورت نمایی رشد می‌کند — یک ورودی 256-بیتی به حدود 2²⁵⁶ مدخل نیاز خواهد داشت.
wrong_answers:
  - scribe یک ماکرو است، نه یک ترکیب‌گر هسته‌ای، پس عبارت از زبانِ به‌صورت رسمی راستی‌آزمایی‌شده بیرون می‌افتد.
  - Bit Machine آن را در زمان نمایی ارزیابی می‌کند، هرچند خود عبارت از طریق اشتراک‌گذاری فشرده می‌ماند.
  - case تو‌در‌تو فقط می‌تواند نوع‌های sum را تجزیه کند، پس ساختار روی هر ورودی با نوع product شکست می‌خورد.
explanation: >-
  این ساختار هر ورودی ممکن را از طریق تجزیهٔ تو‌در‌توی case فهرست می‌کند و هر
  خروجی را با scribe به‌صورت سخت‌کد شده قرار می‌دهد، بنابراین اندازهٔ عبارت
  به‌صورت نمایی منفجر می‌شود — برای نوع‌های واقعی مانند واژه‌های 256-بیتی
  نجومی است. این انفجار در اندازهٔ خود عبارت است، نه در زمان اجرای یک عبارت
  وگرنه فشرده. scribe به ترکیب‌گرهای هسته‌ای واقعی (unit، injl، injr، pair)
  گسترش می‌یابد، پس نتیجه داخل زبان هسته می‌ماند، زبانی که قضیهٔ کامل‌بودن آن
  در Rocq به‌صورت رسمی راستی‌آزمایی شده است؛ و تجزیه ورودی‌های هر نوعی، از جمله
  productها، را هم پوشش می‌دهد.
reviewed: false
