  - "formal legal system එකෙන් පිටත එම හැසිරීම් දඬුවම් කළ හැකි community tribunals සඳහා ඔවුන් පෙනී සිටිති"
explanation: >-
  සංස්කෘතිකව conservative libertarian කෙනෙකුට ඇතැම් හැසිරීම් සදාචාරිකව අනුමත නොවිය හැක, නමුත් එකඟතාවයෙන් සිදුවන, ආක්‍රමණශීලී නොවන ක්‍රියාවන් නීතිමය ලෙස තහනම් කිරීමට ඔහු හෝ ඇය පෙනී නොසිටී. ඔවුන් එවැනි ක්‍රියාවන්ට අකමැති විය හැක, ඒවාට විරුද්ධ විය හැක, සහ ඒවා ක්‍රියාශීලීව අධෛර්යමත් කළ හැක, නමුත් සැමවිටම නීතියේ බලහත්කාර බලය වෙනුවට persuasion, education, සහ example හරහාය. මෙය නිහඬව සිටීම හෝ විකල්ප enforcement mechanisms නිර්මාණය කිරීම පිළිබඳ දෙයක් නොවේ.
