question: "Como as posições conservadora e libertária sobre o salário mínimo diferem em seu raciocínio, apesar de ambas favorecerem sua abolição?"
answer: "Os conservadores aceitam algum envolvimento do Estado na definição de salários se isso não prejudicar a competitividade, enquanto os libertários veem o salário mínimo como uma imposição moral sobre a liberdade de contratar e fazer negócios"
wrong_answers:
  - "Os conservadores se opõem ao salário mínimo porque ele cria inflação, enquanto os libertários se opõem a ele porque dá poder demais aos sindicatos"
  - "Os conservadores querem salários definidos por instituições religiosas e comunitárias, enquanto os libertários querem salários determinados por estudos de mercado aprovados pelo governo"
  - "Os conservadores acreditam que salários mínimos devem variar por região, enquanto os libertários acreditam que um único salário uniforme deve se aplicar nacionalmente"
explanation: >-
  Ambos favorecem reduzir ou abolir o salário mínimo, mas seus raciocínios diferem fundamentalmente. Os conservadores aceitam algum envolvimento do Estado na definição de salários, insistindo ao mesmo tempo que ele permaneça mínimo e dependente do contexto, com foco na competitividade. Os libertários adotam uma posição moral mais forte: um salário mínimo é uma imposição sobre a liberdade de contratar e fazer negócios. Quando libertários dizem "o mercado", eles querem dizer o contrato, livremente negociado entre duas partes sem interferência estatal.
reviewed: false
