question: Care este numele revistei fiziocraților?
answer: Les Ephémérides du Citoyen
wrong_answers:
  - Les Ephémérides du Peuple
  - The New Citizen
  - Le Journal des Économistes
explanation: |
  Ziarul fiziocraților se numea „Les Éphémérides du Citoyen”, o publicație periodică în care își difuzau ideile și analizele economice.
