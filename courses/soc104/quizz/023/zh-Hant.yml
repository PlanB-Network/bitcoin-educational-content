question: "文化保守的自由意志主義者如何處理他們在道德上不贊成的行為？"
answer: "他們透過勸說與榜樣反對並勸阻那些行為，但不訴諸法律的強制力"
wrong_answers:
  - "他們支持地方政府禁止那些行為，同時反對聯邦層級的禁令"
  - "他們對那些行為保持完全沉默，認為任何形式的不贊成皆侵犯個人自由"
  - "他們主張設立共同體法庭，在正式法律體系之外懲罰那些行為"
explanation: >-
  文化保守的自由意志主義者可能在道德上不贊成某些行為，但並不主張以法律禁止合意、非侵害性的行動。他們可能不喜歡這類行動、反對它們，並積極勸阻它們，但始終透過勸說、教育與榜樣，而不是透過法律的強制力。這並不是保持沉默，也不是建立替代性的執行機制。
reviewed: false
