question: Boisguilbert සම්බන්ධ කර නොමැති පසුකාලීන චින්තකයා කවුරුන්ද?
answer: Adam Smith සහ අදෘශ්‍යමාන හස්තය
wrong_answers:
  - Keynes සහ අඩු රැකියා නියුක්තියේ න්‍යාය
  - Marx සහ පන්ති විශ්ලේෂණය
  - Walras සහ පොදු සමතුලිතතාව
explanation: |
  නවීන විද්වතුන් Boisguilbert, Keynesගේ (අඩු රැකියා නියුක්තිය) පූර්වගාමියෙකු ලෙසද, Marxගේ (පන්ති විශ්ලේෂණය) පූර්වගාමියෙකු ලෙසද, Walrasගේ (පොදු සමතුලිතතාව) පූර්වගාමියෙකු ලෙසද අධික ලෙස ප්‍රකාශ කර ඇත. කෙසේ වෙතත්, අදෘශ්‍යමාන හස්තය යන සංකල්පය Boisguilbertට නොව Marquis d'Argensonට ආරෝපණය කර ඇත. එක් විචාරකයෙකු ඇසූ පරිදි: "Boisguilbert කාගේ හෝ කුමක් සඳහා පූර්වගාමියා නොවිය හැකිද?"
