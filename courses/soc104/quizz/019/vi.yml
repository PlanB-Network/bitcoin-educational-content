question: "Những người theo chủ nghĩa nhà nước cánh tả và cánh hữu có chung mục tiêu chính trị nào?"
answer: "Giành quyền lực để tổ chức xã hội theo tầm nhìn của họ về thế giới và áp đặt nó lên mọi người"
wrong_answers:
  - "Thu hẹp quy mô chính quyền và trao lại quyền ra quyết định cho từng công dân"
  - "Thiết lập một nền dân chủ trực tiếp, nơi mọi công dân bỏ phiếu cho mọi quyết định lập pháp"
  - "Loại bỏ các đảng phái chính trị và thay thế chúng bằng quản trị kỹ trị độc lập"
explanation: >-
  Những người theo chủ nghĩa nhà nước ở cả cánh tả lẫn cánh hữu có chung cùng một mục tiêu chính trị: giành quyền lực để tổ chức xã hội theo thế giới quan của họ và áp đặt nó lên mọi người thông qua pháp luật. Khác biệt chỉ nằm ở các giá trị của họ: cánh hữu viện dẫn việc bảo vệ văn minh, trong khi cánh tả viện dẫn việc bảo vệ giai cấp công nhân hoặc người bị áp bức. Không bên nào tìm cách thu hẹp chính quyền hay loại bỏ đảng phái.
