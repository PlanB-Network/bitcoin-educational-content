question: "Tofauti kuu kati ya wafuasi wa minarchism na anarcho-capitalists ndani ya ulibertaria ni ipi?"
answer: "Wafuasi wa minarchism hukubali dola ndogo kwa ajili ya ulinzi, haki, na polisi, ilhali anarcho-capitalists hutaka kazi zote za dola zibinafsishwe"
wrong_answers:
  - "Wafuasi wa minarchism hukataa aina zote za serikali, ilhali anarcho-capitalists hukubali udhibiti mdogo wa serikali wa masoko"
  - "Wafuasi wa minarchism hupendelea ushuru endelevu kwa huduma muhimu, ilhali anarcho-capitalists hupinga ushuru wote"
  - "Wafuasi wa minarchism huzingatia uhuru wa kiuchumi pekee, ilhali anarcho-capitalists hutetea uhuru wa kiuchumi na kijamii"
explanation: >-
  Wafuasi wa minarchism huamini kwamba dola inapaswa kuwekewa mipaka kwenye kazi za msingi kama ulinzi, haki, na polisi ("dola ya mlinzi wa usiku"), ilhali anarcho-capitalists hudai kwamba hata kazi hizi zinapaswa kubinafsishwa na kusimamiwa kupitia ushindani wa soko wa hiari. Kutokubaliana kwao kunahusu zaidi utekelezaji wa vitendo kuliko kanuni za msingi za kimaadili. Mikondo yote miwili inashiriki maadili yale yale ya ulibertaria ya umiliki wa nafsi na kutoshambulia.
