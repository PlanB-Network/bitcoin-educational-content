question: Prečo bolo Turgotovo menovanie za ministra námorníctva prijaté s prekvapením?
answer: Turgot nie je veľký znalec námorníctva
wrong_answers:
  - Turgot má na tomto ministerstve mnoho nepriateľov
  - Turgot nevie plávať
  - Turgot je civil
explanation: |
  Turgot nemal žiadne námorné skúsenosti, čo mnohých pri jeho menovaní do tejto funkcie prekvapilo. Namiesto toho sa očakávalo, že bude menovaný do hospodárskej alebo finančnej funkcie.
