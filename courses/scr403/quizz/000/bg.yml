question: Защо Simplicity изключва динамичното заделяне на памет по време на изпълнение?
answer: За да позволи статичен анализ и да изключи цели класове бъгове и атаки.
wrong_answers:
  - Защото Liquid Network не поддържа нисконивови операции с памет.
  - За да намали кривата на обучение по програмиране за нови разработчици на умни договори.
  - Защото самият Bitcoin Script също няма никакво динамично заделяне на памет.
explanation: >-
  Simplicity избягва динамичното заделяне на памет, така че цялото използване
  на ресурси да може да бъде определено статично преди изпълнение. Това позволява
  предвидими граници на ресурсите и елиминира уязвимости, свързани с управлението
  на паметта, което е критично в контекст на блокчейн валидация.
reviewed: false
