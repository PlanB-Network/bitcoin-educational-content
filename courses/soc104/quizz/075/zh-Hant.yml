question: "在所有五項經濟辯論（稅收、最低工資、醫療照護、環境、補貼）中，哪一種一致模式區分了中間派方法與其他政治家族的立場？"
answer: "中間派拒絕承諾固定原則，轉而要求經驗分析與專家評估，以逐案決定政策，使其方法本質上是技術官僚式的"
wrong_answers:
  - "中間派總是在社會主義與保守主義立場之間採取中間位置，在每個議題上平均折衷"
  - "中間派一貫優先考慮經濟成長而非社會福利，在財政政策上站在自由至上主義者一邊，同時在管制上同意社會主義者"
  - "中間派把所有經濟決策交給國際組織與貿易協定，而不是制定獨立的國家政策"
explanation: >-
  在所有五項經濟辯論中，中間派方法遵循同一模式：中間派不承諾固定的意識形態原則，而是在作出決策前要求經驗證據與專家評估。在稅收問題上，正確水平必須由分析決定。在最低工資問題上，水平必須務實調整。在醫療照護問題上，由專家校準的混合制度是理想的。在環境問題上，政策必須平衡競爭力。在補貼問題上，每個案例都必須按其自身條件評估。這使中間主義本質上具有技術官僚性，這不同於單純折衷或聽命於國際機構。
reviewed: false
