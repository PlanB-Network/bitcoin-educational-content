question: "サイファーパンクの原則「Cypherpunks write code」は、自由を実現するための運動のアプローチについて何を明らかにしているか？"
answer: "自由への道は、自由という抽象的な考えを現実へ変える根本的な道具としてコードを用い、匿名システムを積極的に構築することを通るということ"
wrong_answers:
  - "サイファーパンクは主に、政治活動キャンペーンの資金を得るために商用アプリケーションを書くソフトウェア開発者であるということ"
  - "この運動は、直接行動よりも、書かれたマニフェストや学術出版物を通じて一般市民を教育することを信じているということ"
  - "サイファーパンクは、監視プログラムを暴露して法改正を強制するために、既存の政府システムをハッキングすることに焦点を当てているということ"
explanation: >-
  「Cypherpunks write code」という定式は、単なる希望ではなく積極的な介入に対する運動のコミットメントを反映している。
  Eric Hughes にとって、自由への道は、恣意的な政治的分断を無意味にする匿名システムの能動的な構築を通る。
  コードは、自由という抽象的な考えを現実へ変える根本的な道具になる。
  だからこそ Satoshi Nakamoto は、ホワイトペーパーを書く前に Bitcoin のコード全体を書いたのである。
reviewed: false
