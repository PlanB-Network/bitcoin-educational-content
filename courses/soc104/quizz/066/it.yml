question: "Qual è la posizione libertaria sulla questione del matrimonio gay?"
answer: "Lo Stato non deve occuparsi di definire il matrimonio; esso dovrebbe essere privatizzato e lasciato agli individui, alle associazioni e alle istituzioni religiose"
wrong_answers:
  - "Il matrimonio gay dovrebbe essere legalizzato perché tutti i cittadini meritano pari trattamento davanti alla legge"
  - "Il matrimonio gay dovrebbe essere vietato perché il matrimonio tradizionale è un'istituzione fondamentale per la procreazione"
  - "Il matrimonio gay dovrebbe essere legalizzato, ma solo attraverso un quadro giuridico separato distinto dal matrimonio tradizionale"
explanation: >-
  I libertari sostengono che la questione del matrimonio sia fondamentalmente formulata in modo errato perché posta in termini statalisti. Ritengono che lo Stato non debba interferire nella vita privata, quindi la soluzione è separare completamente il matrimonio dallo Stato. Imponendo un'unica definizione, lo Stato crea conflitti. La prima risposta sbagliata riflette la posizione socialista o centrista, e la seconda riflette la posizione conservatrice.
