question: Why is it important to protect your mnemonic phrase?
answer: Because its loss means the permanent loss of bitcoins
wrong_answers:
  - Because Blockchain takes a long time to regenerate
  - Because its loss leads to a leakage of personal data
  - Because exchange platforms require a lot of documents to regenerate it
explanation: |
  The mnemonic allows you to regain access to your funds. In the event of loss, if the wallet is no longer accessible on its support, the bitcoins are permanently lost.
reviewed: false