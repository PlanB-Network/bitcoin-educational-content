question: "I Nolan-diamanten, vilken position ligger högst upp och representerar maximal frihet?"
answer: "Libertarianism, som stödjer största möjliga ekonomiska och personliga frihet"
wrong_answers:
  - "Konservatism, som stödjer traditionella värden och ekonomisk frihet"
  - "Centrism, som balanserar alla politiska positioner på ett pragmatiskt sätt"
  - "Socialism, som stödjer personlig frihet och social jämlikhet"
explanation: >-
  Libertarianism upptar toppen av Nolan-diamanten som motsatsen till etatism. Den representerar dem som stödjer den största graden av både ekonomisk och personlig frihet. Konservatismen ligger till höger (hög ekonomisk frihet, låg personlig frihet), socialismen till vänster (hög personlig frihet, låg ekonomisk frihet) och centrismen i mitten.
reviewed: false
