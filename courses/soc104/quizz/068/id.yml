question: "Dalam pertanyaan tentang regulasi senjata api, apa perbedaan krusial antara posisi konservatif dan libertarian?"
answer: "Keduanya menerima sebagian regulasi, tetapi kaum konservatif menginginkan aturan dari otoritas publik yang sah sementara libertarian menginginkan aturan muncul dari pihak-pihak yang langsung berkepentingan, seperti asosiasi warga dan kompetisi pasar"
wrong_answers:
  - "Kaum konservatif menentang semua regulasi senjata api sementara libertarian menerima kontrol pemerintah yang ketat demi keselamatan publik"
  - "Kaum konservatif ingin melarang senjata api sepenuhnya sementara libertarian mendukung akses tanpa batas ke semua senjata"
  - "Kaum konservatif mendasarkan posisi mereka pada hak individu sementara libertarian mendasarkannya pada tanggung jawab kolektif"
explanation: >-
  Baik kaum konservatif maupun libertarian sepakat bahwa suatu bentuk regulasi untuk membawa senjata diperlukan. Perbedaan krusialnya terletak pada siapa yang menetapkan aturan tersebut. Kaum konservatif menegaskan bahwa regulasi harus datang dari otoritas publik yang bertugas menjaga kebaikan bersama (top-down). Libertarian berargumen bahwa regulasi harus muncul dari pihak-pihak yang langsung berkepentingan: profesional keamanan, asosiasi warga, dan kompetisi pasar (bottom-up).
