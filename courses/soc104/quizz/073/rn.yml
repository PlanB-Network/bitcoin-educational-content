question: "Iciyumviro ca 'moral hazard' ni iki mu bijanye n'ikiganiro ku mfashanyo za Leta, kandi ni uwuhe muryango wa politike ushikiriza ico kibazo?"
answer: "Moral hazard ni ikibaremesha kutagira ico bitayeho igihe amasosiyete abujijwe guhomba biciye ku mfashanyo za Leta, kuko mu nyuma umusoreshwa ari we avyishura; ico kibazo gishikirizwa n'aba-libertarian"
wrong_answers:
  - "Moral hazard ni ingorane y'uko amasosiyete yafashijwe ashobora kwimukira mu bihugu bifise amakori make, agatwara akazi hamwe na yo; ico kibazo gishikirizwa n'abakonservateur"
  - "Moral hazard ni akaga k'uko abategetsi ba Leta bashobora kwononekara kubera ruswa mu guhitamwo amasosiyete ahabwa imfashanyo; ico kibazo gishikirizwa n'abari hagati"
  - "Moral hazard ni ikibazo c'inyifato runtu c'uko amasosiyete akoresha nabi abakozi amaze kuronka amahera ya Leta; ico kibazo gishikirizwa n'abasosiyalisite"
explanation: >-
  Aba-libertarian bavuga ko imfashanyo za Leta n'ugutabara amasosiyete ari hafi guhomba birema moral hazard: iyo amasosiyete abujijwe guhomba, bica biremesha ukutagira ico bitayeho n'ubuhubutsi kuko ata ngaruka ziba ku ngingo mbi. Mu nyuma, umusoreshwa ni we avyishura, ico aba-libertarian bafata nk'akarenganyo gakomeye cane. Ico ciyumviro kiratandukanye n'ibibazo vyerekeye kwimura amasosiyete, ruswa y'abategetsi, canke gukoresha nabi abakozi bishikirizwa n'iyindi miryango ya politike.
