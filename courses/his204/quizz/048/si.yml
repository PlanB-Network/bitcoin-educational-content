question: 1757 Physiocracy උපත සලකුණු කළේය. Quesnay Encyclopédieහි ප්‍රකාශයට පත් කළ ලිපි දෙක කුමක්ද?
answer: Farmers සහ Grains
wrong_answers:
  - මුදල් සහ කෘෂිකර්මය පිළිබඳ පොලිය
  - ඉඩම් වගාව සහ භෝග මාරුව
  - බදු සහ වෙළඳාම
explanation: |
  Quesnay Diderot සහ d'Alembertගේ Encyclopédieහි "Farmers" සහ "Grains" යන ලිපි ප්‍රකාශයට පත් කළ අතර, එය ආර්ථික චින්තන පාසලක් ලෙස physiocracyගේ උපත සලකුණු කළේය.