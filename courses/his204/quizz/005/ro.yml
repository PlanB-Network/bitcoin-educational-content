question: Ce formă a luat reglementarea muncii și a industriei sub Vechiul Regim?
answer: Sute de reglementări pentru fiecare tip de industrie
wrong_answers:
  - Un cod general pentru activitatea economică
  - Câteva prevederi destul de flexibile, lăsând multă libertate pentru muncă și industrie
  - O absență totală a regulilor, lăsând mână liberă inițiativei individuale
explanation: |
  Vechiul Regim se caracteriza printr-un sistem de bresle și reglementări stricte care guvernau munca și industria. Fiecare meserie era supusă unor reguli specifice, adesea extrem de detaliate, care limitau concurența și inovația.
