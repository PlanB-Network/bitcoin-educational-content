question: "Защо либертарианската позиция за легализацията на наркотиците идва с условието ролята на държавата в обществото да бъде намалена?"
answer: "Защото либерализация, поета от държавата, би заменила индивидуалната отговорност с грижа, управлявана от правителството, докато либертарианците искат гражданите да понасят последствията от изборите си с подкрепа от частни асоциации"
wrong_answers:
  - "Защото контролирана от държавата легализация би генерирала твърде много данъчни приходи, правейки правителството прекалено силно и корумпирано"
  - "Защото държавата би наложила стандарти за качество, които биха повишили цените и пресъздали черни пазари"
  - "Защото правителствената регулация на наркотиците би нарушила международни търговски споразумения и дипломатически отношения"
explanation: >-
  Либертарианците подкрепят либерализацията на наркотиците, но настояват ролята на държавата да бъде намалена, защото целта им е възстановяване на индивидуалната отговорност, а не разширяване на държавното управление. Ако някой стане зависим, той трябва да поеме отговорност, вместо да иска държавата да предоставя грижи. Решението на зависимостта се намира в частната инициатива: доброволна подкрепа от индивиди, семейства и благотворителни асоциации. Легализация, управлявана от държавата, би противоречала на фундаменталния либертариански принцип на личната отговорност.
reviewed: false
