question: "Qual é a posição libertária sobre a questão do casamento gay?"
answer: "O Estado não tem nada que definir o casamento; ele deve ser privatizado e deixado aos indivíduos, associações e instituições religiosas"
wrong_answers:
  - "O casamento gay deve ser legalizado porque todos os cidadãos merecem tratamento igual perante a lei"
  - "O casamento gay deve ser proibido porque o casamento tradicional é uma instituição fundamental para a procriação"
  - "O casamento gay deve ser legalizado, mas apenas por meio de um arcabouço jurídico separado, distinto do casamento tradicional"
explanation: >-
  Libertários argumentam que a questão do casamento é fundamentalmente mal formulada porque é colocada em termos estatistas. Eles acreditam que o Estado não tem nada que interferir na vida privada, portanto a solução é separar inteiramente o casamento do Estado. Ao impor uma definição única, o Estado cria conflitos. A primeira resposta errada reflete a posição socialista ou centrista, e a segunda reflete a posição conservadora.
