question: Care dintre acești autori nu face parte din cercul lui Gournay?
answer: Dupont de Nemours
wrong_answers:
  - Véron de Forbonnais
  - Turgot
  - Abbé Morellet
explanation: |
  Dupont de Nemours era fiziocrat, nu membru al cercului lui Gournay. Fiziocrații aveau idei apropiate de cele ale cercului lui Gournay, dar formau un grup distinct.
