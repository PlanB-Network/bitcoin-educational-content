question: "pro-business और pro-market होने के बीच मुख्य अंतर क्या है?"
answer: "Pro-business समर्थक विशिष्ट कंपनियों को विफलता से बचाने के लिए राज्य हस्तक्षेप चाहते हैं, जबकि pro-market समर्थक विनियमन हटाने का समर्थन करते हैं और व्यवसायों को विफल होने देते हैं ताकि बाज़ार स्वाभाविक रूप से पुनर्गठित हो सके"
wrong_answers:
  - "Pro-business समर्थक बड़े निगमों पर ध्यान केंद्रित करते हैं, जबकि pro-market समर्थक केवल छोटे व्यवसायों और startups को समर्थन देने पर ध्यान केंद्रित करते हैं"
  - "Pro-business एक वामपंथी स्थिति है जो श्रमिक सहकारिताओं का समर्थन करती है, जबकि pro-market एक दक्षिणपंथी स्थिति है जो निजी स्वामित्व का समर्थन करती है"
  - "Pro-business समर्थक सभी प्रतिस्पर्धा को अस्वीकार करते हैं, जबकि pro-market समर्थक अनुमोदित उद्यमों के बीच सरकारी-विनियमित प्रतिस्पर्धा का समर्थन करते हैं"
explanation: >-
  Pro-business स्थिति प्रतिस्पर्धा को नियमनों के माध्यम से प्राप्त शासन के एक साधन के रूप में देखती है और नौकरी के नुकसान को रोकने के लिए subsidies और bailouts को उचित ठहराती है। Pro-business दृष्टिकोण में, बाज़ार नाज़ुक है और उसे राज्य के बचाव की आवश्यकता है। Pro-market समर्थक प्रतिस्पर्धा को मुक्त उद्यम का स्वाभाविक परिणाम मानते हैं, जिसका अर्थ है विनियमन हटाना और व्यवसायों को विफल होने देना, क्योंकि विफलता बाज़ार को स्वाभाविक रूप से पुनर्गठित होने देती है और अधिक सक्षम कर्ताओं के लिए क्षेत्र खोलती है।
reviewed: false
