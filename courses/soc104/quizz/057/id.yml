question: "Apa nilai-nilai utama sentrisme?"
answer: "Moderasi, kompromi, adaptasi, dan utilitas publik"
wrong_answers:
  - "Tradisi, ketertiban, otoritas, dan identitas nasional"
  - "Kebebasan, properti privat, persetujuan, dan tanggung jawab individu"
  - "Kesetaraan, keadilan sosial, solidaritas, dan kepemilikan kolektif"
explanation: >-
  Nilai-nilai utama sentrisme adalah moderasi, kompromi, adaptasi, dan utilitas publik. Nilai-nilai ini mencerminkan penekanan sentris pada keseimbangan pragmatis alih-alih komitmen ideologis. Opsi lain masing-masing menggambarkan nilai-nilai utama konservatisme, libertarianisme, dan sosialisme.
