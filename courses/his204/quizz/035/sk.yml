question: Ktorú myšlienku rozvinutú katolíckou cirkvou Gournay napadol?
answer: Zákaz úročených pôžičiek
wrong_answers:
  - Almužna pre núdznych
  - Samozásobiteľský život mníchov
  - Desiatok
explanation: |
  Gournay kritizoval zákaz úročených pôžičiek za to, že bráni hospodárskemu rozvoju, pretože podnikateľom znemožňuje prístup k úveru.
