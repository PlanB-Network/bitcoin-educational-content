question: "Ketä pidetään usein modernin konservatismin perustajahahmona?"
answer: "Edmund Burkea, joka kannatti instituutioiden ja perinteiden säilyttämistä Ranskan vallankumouksen radikaaleja muutoksia vastaan"
wrong_answers:
  - "Karl Marxia, joka kehitti luokkataistelun ja historiallisen materialismin teorian 1800-luvulla"
  - "John Lockea, joka muotoili teorian luonnollisista oikeuksista ja yhteiskuntasopimuksesta 1600-luvulla"
  - "Adam Smithiä, joka kirjoitti The Wealth of Nations -teoksen ja perusti klassisen taloustieteen oppialan"
explanation: >-
  Edmund Burkea pidetään usein konservatismin perustajahahmona hänen Ranskan vallankumouksen vastustuksensa vuoksi. Hänen teoksensa Reflections on the Revolution in France (1790) puolusti harkitsevuutta ja asteittaista uudistamista radikaalin muutoksen sijaan. Hänen mukaansa yhteiskunnan ei tulisi edetä aloittamalla puhtaalta pöydältä vaan asteittaisilla uudistuksilla, jotka säilyttävät koetellut instituutiot ja perinteet.
