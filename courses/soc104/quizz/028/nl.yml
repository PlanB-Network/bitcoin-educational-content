question: "Wat is het concept van 'spontane orde' zoals beschreven door Friedrich Hayek?"
answer: "Sociale regels en normen moeten voortkomen uit vrije individuele interacties in plaats van te worden opgelegd door autoritaire planning"
wrong_answers:
  - "Markten neigen van nature naar monopolie tenzij de staat ingrijpt om concurrentieel evenwicht te handhaven"
  - "Democratische verkiezingen zijn het enige legitieme mechanisme om de wetten vast te stellen die de samenleving besturen"
  - "Economische crises ontstaan spontaan en vereisen onmiddellijke overheidsinterventie om stabiliteit te herstellen"
explanation: >-
  Hayeks concept van spontane orde houdt in dat de regels die de samenleving besturen niet van bovenaf door centrale planning moeten worden opgelegd, maar moeten voortkomen uit het vrije spel van individuele wilsuitingen, contracten en vrijwillige relaties. Dit is een fundamentele as van het libertaire denken. Het impliceert niet dat markten naar monopolie neigen of dat crises overheidsinterventie vereisen.
reviewed: false
