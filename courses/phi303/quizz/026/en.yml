question: "How does the course interpret the economic growth of the democratic era?"
answer: "Growth and technological development happened despite the interventionist state, not because of it."
wrong_answers:
  - "Growth proves that state planning is superior to markets."
  - "Growth was entirely caused by wise Keynesian policy."
  - "There has been no economic growth since 1900."
explanation: |
  The standard argument credits modern democracy with prosperity. The course's answer: with more economic freedom, growth would have been higher and technology adopted faster.
