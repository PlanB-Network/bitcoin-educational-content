question: "谁常被称为现代保守主义的奠基人物？"
answer: "埃德蒙·伯克，他主张保护制度和传统，反对法国大革命的激进变革"
wrong_answers:
  - "卡尔·马克思，他在十九世纪发展了阶级斗争和历史唯物主义理论"
  - "约翰·洛克，他在十七世纪阐述了自然权利和社会契约理论"
  - "亚当·斯密，他撰写了《国富论》，并奠定了古典经济学这门学科"
explanation: >-
  埃德蒙·伯克因反对法国大革命而常被称为保守主义的奠基人物。他的《法国革命论》（1790）推崇审慎和渐进改革，而不是激进变革。他认为，社会不应通过推倒重来而前进，而应通过保留经受考验的制度和传统的渐进改革来发展。
reviewed: false
