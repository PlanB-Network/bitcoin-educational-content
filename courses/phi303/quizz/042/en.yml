question: "What is the first step the course prescribes before anything can be done?"
answer: "Recognition: understanding the problems of democracy and that the media does not tell the whole truth."
wrong_answers:
  - "Overthrowing the government by force."
  - "Abstaining from all future elections."
  - "Moving one's savings abroad."
explanation: |
  'Ignorance, forgetfulness or contempt of the rights of man are the only causes of public misfortunes' (Declaration of 1789). Before a person recognizes this, no further step is possible — hence: spread the truth, information and education.
