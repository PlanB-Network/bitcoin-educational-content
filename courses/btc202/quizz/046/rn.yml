question: Ni igiki dbcache ishobora gukora muri Bitcoin core?
answer: Gutanga RAM kugira ngo yihutishe IBD
wrong_answers:
  - Sigura ubunini bwa Blockchain
  - Guhindura ingorane nyinshi za Mining
  - Guhagarika igitigiri c'abagenzi bahuye
explanation: |
 dbcache yongera umwanya wa memory (RAM) ukoreshwa mu kubika temporarily UTXO set, bigafasha kwihutisha initial synchronization ya node.
reviewed: true
