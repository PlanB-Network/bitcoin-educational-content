question: "In che modo il corso sostiene che la libertà permette ai valori di sinistra e di destra di coesistere pacificamente?"
answer: "In un regime di libertà autentica, le persone con ideali di sinistra possono condividere volontariamente i beni e ridistribuire fondi, mentre quelle con valori di destra possono risparmiare e trasmettere tradizioni, senza che nessuna delle due parti imponga il proprio modo di vivere all'altra"
wrong_answers:
  - "La libertà richiede a entrambe le parti di scendere a compromessi accettando una posizione centrista in cui il governo bilancia valori concorrenti attraverso una regolamentazione moderata"
  - "La libertà significa che le comunità di sinistra e di destra devono vivere in territori geografici separati con i propri governi indipendenti"
  - "La libertà funziona permettendo ai cittadini di votare quali valori dovrebbero essere imposti in ciascuna regione, alternando politiche di sinistra e di destra a ogni ciclo elettorale"
explanation: >-
  Il corso mostra che in un regime autentico di libertà, coloro che aderiscono a ideali di sinistra possono rinunciare volontariamente ai beni, condividere i mezzi di produzione o donare salari a organizzazioni redistributive. Coloro che hanno valori di destra possono lavorare duramente, risparmiare e trasmettere valori familiari. Nessuno dovrebbe imporre il proprio modo di vivere agli altri. È attraverso la libertà del mercato e il potere della scelta che gli obiettivi possono essere raggiunti pacificamente.
