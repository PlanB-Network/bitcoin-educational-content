question: "Vad kännetecknar botten av axeln för personlig frihet i Nolan-diagrammet?"
answer: "En preferens för ordning, säkerhet, traditionella värden och att staten reglerar moral och upprätthåller allmän ordning"
wrong_answers:
  - "En preferens för individuell autonomi, tolerans och minimal statlig inblandning i personliga livsval"
  - "En preferens för ekonomisk avreglering, frihandel och avskaffande av tullar och subventioner"
  - "En preferens för omfördelning av välstånd, höga skatter och nationalisering av nyckelindustrier"
explanation: >-
  Botten av axeln för personlig frihet representerar maximal statlig kontroll över privatlivet, kännetecknad av en preferens för ordning, säkerhet och traditionella värden. Staten reglerar moral, upprätthåller allmän ordning och kan försvara en specifik syn på moral eller tradition. Toppen av axeln representerar motsatsen: individuell frihet och tolerans. Ekonomisk politik mäts på den separata horisontella axeln.
reviewed: false
