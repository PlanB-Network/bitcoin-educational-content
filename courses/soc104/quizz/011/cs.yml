question: "Které emblematické osobnosti jsou v Nolanově diagramu spojeny s maximální ekonomickou svobodou?"
answer: "Margaret Thatcher, Ronald Reagan a Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaurès a Bernie Sanders"
  - "Nelson Mandela, Simone Veil a Noam Chomsky"
  - "Vladimir Putin, Xi Jinping a Joseph de Maistre"
explanation: >-
  Thatcher, Reagan a Milei jsou uváděni jako emblematické osobnosti maximální ekonomické svobody, protože upřednostňují méně státních zásahů, méně regulací a nižší daně. Roosevelt, Jaurès a Sanders představují opačný pól, který upřednostňuje státní kontrolu ekonomiky. Mandela, Veil a Chomsky představují maximální osobní svobodu. Putin, Xi Jinping a de Maistre představují maximální státní kontrolu osobního života.
