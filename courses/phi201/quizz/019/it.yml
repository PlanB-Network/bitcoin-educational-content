question: A cosa è dovuto il miracolo europeo?
answer: Alla frammentazione politica dell'Europa e all'assenza di un potere centrale egemone
wrong_answers:
  - Alla superiorità della cultura europea
  - Allo sfruttamento delle colonie e delle risorse naturali del resto del mondo
  - Al progresso della scienza e della tecnologia
explanation: |
  Il miracolo europeo è stato possibile grazie alla frammentazione politica dell'Europa, che ha favorito la competizione tra gli Stati e l'innovazione, mentre l'assenza di un potere centrale dominante ha permesso il pluralismo che ha stimolato lo sviluppo economico e culturale.
