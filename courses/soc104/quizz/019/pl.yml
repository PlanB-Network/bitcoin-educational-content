question: "Co pionowa oś diagramu Nolana ujawnia o prawdziwym pytaniu politycznym?"
answer: "Ujawnia, czy chcesz narzucać innym własną wrażliwość za pośrednictwem państwa, czy wolisz, aby każda osoba mogła swobodnie decydować za siebie"
wrong_answers:
  - "Ujawnia, czy popierasz demokratyczne rządy, czy wolisz autorytarne rządy jednego przywódcy"
  - "Ujawnia, czy utożsamiasz się z postępowymi ruchami społecznymi, czy z tradycyjnymi instytucjami religijnymi"
  - "Ujawnia, czy twoim głównym zmartwieniem jest bezpieczeństwo narodowe, czy dobrobyt gospodarczy"
explanation: >-
  Pionowa oś odsłania prawdziwe pytanie polityczne: nie to, czy jesteś lewicowy czy prawicowy, lecz to, w jakim stopniu chcesz, aby państwo ingerowało w kształtowanie społeczeństwa według twoich wartości. Czy chcesz narzucać innym swoją wrażliwość, czy wolisz, aby każda osoba mogła swobodnie decydować za siebie? Takie ujęcie wykracza poza podział lewica-prawica i pokazuje, że oba obozy mogą być równie etatystyczne.
reviewed: false
