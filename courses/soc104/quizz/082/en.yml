question: "Which of the following is an example of spontaneous order as described by Hayek?"
answer: "Language, which developed organically through historical interactions rather than being designed by intellectuals in a bureau"
wrong_answers:
  - "A national constitution, which was carefully drafted by elected representatives to establish social rules"
  - "A government stimulus plan, which was designed by economists to coordinate economic activity"
  - "A public education system, which was created by legislators to ensure universal access to knowledge"
explanation: >-
  Hayek describes spontaneous order as the product of free interactions in society, resulting from human action but not from deliberate human design. Language is a prime example: French, English, and German were not constructed by intellectuals deciding grammar rules but emerged as the fruit of slow, organic organization built through historical interactions.
