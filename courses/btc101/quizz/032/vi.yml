question: Loại tiền tệ vững chắc được tạo ra như thế nào?
answer: Loại tiền tệ vững chắc phải tự nhiên xuất hiện từ thị trường và sự tự nguyện đồng thuận.
wrong_answers:
  - Loại tiền tệ vững chắc cần được chính phủ thực thi bằng cách ban hành các luật tiền tệ.
  - Loại tiền tệ vững chắc phải được các công ty áp đặt thông qua việc sử dụng bạo lực.
  - Loại tiền tệ vững chắc không thể được tạo ra.
explanation: |
  Loại tiền tệ vững chắc là một hiện tượng xã hội tự nhiên phải xuất hiện
  từ thị trường và sự tự nguyện đồng thuận. Không có con người hay
  nhóm người nào có thể tạo ra tiền tệ.
reviewed: true