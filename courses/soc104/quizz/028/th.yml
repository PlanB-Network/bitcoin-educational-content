question: "แนวคิด 'ระเบียบที่เกิดขึ้นเอง' ตามที่ Friedrich Hayek อธิบายไว้คืออะไร?"
answer: "กฎและบรรทัดฐานทางสังคมควรเกิดขึ้นจากปฏิสัมพันธ์เสรีของปัจเจกบุคคล มากกว่าถูกบังคับโดยการวางแผนอำนาจนิยม"
wrong_answers:
  - "ตลาดมีแนวโน้มตามธรรมชาติไปสู่การผูกขาด เว้นแต่รัฐจะแทรกแซงเพื่อรักษาสมดุลการแข่งขัน"
  - "การเลือกตั้งประชาธิปไตยเป็นกลไกที่ชอบธรรมเพียงอย่างเดียวสำหรับการจัดตั้งกฎหมายที่กำกับสังคม"
  - "วิกฤตเศรษฐกิจเกิดขึ้นเองและต้องการการแทรกแซงของรัฐบาลทันทีเพื่อฟื้นฟูเสถียรภาพ"
explanation: >-
  แนวคิดเรื่องระเบียบที่เกิดขึ้นเองของ Hayek ถือว่ากฎที่กำกับสังคมไม่ควรถูกบังคับจากเบื้องบนด้วยการวางแผนส่วนกลาง แต่ควรเกิดขึ้นจากการเล่นเสรีของเจตจำนงปัจเจก สัญญา และความสัมพันธ์โดยสมัครใจ นี่คือแกนพื้นฐานของความคิดลิเบอร์ทาเรียน มันไม่ได้หมายความว่าตลาดมีแนวโน้มไปสู่การผูกขาด หรือวิกฤตต้องการการแทรกแซงของรัฐบาล
