question: "Mitkä ovat keskustalaisuuden perusarvot?"
answer: "Kohtuullisuus, kompromissi, sopeutuminen ja julkinen hyöty"
wrong_answers:
  - "Perinne, järjestys, auktoriteetti ja kansallinen identiteetti"
  - "Vapaus, yksityisomistus, suostumus ja yksilöllinen vastuu"
  - "Tasa-arvo, yhteiskunnallinen oikeudenmukaisuus, solidaarisuus ja kollektiivinen omistus"
explanation: >-
  Keskustalaisuuden perusarvot ovat kohtuullisuus, kompromissi, sopeutuminen ja julkinen hyöty. Ne heijastavat keskustalaista painotusta käytännölliseen tasapainoon ideologisen sitoutumisen sijaan. Muut vaihtoehdot kuvaavat konservatismin, libertarismin ja sosialismin perusarvoja tässä järjestyksessä.
