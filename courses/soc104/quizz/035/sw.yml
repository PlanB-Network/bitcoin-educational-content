question: "Kwa nini Rothbard alikosoa maono ya libertaires kuhusu asili ya binadamu, na alipendekeza mbadala gani?"
answer: "Aliwatuhumu kushikilia mtazamo wa kijinga wa 'mshenzi mwema' na akasema kwamba jamii lazima itumie mali binafsi na motisha nzuri kuongoza tabia ya kujinufaisha"
wrong_answers:
  - "Alisifu uelewa wao wa ushirikiano wa binadamu lakini akasema kwamba dola ndogo bado ilikuwa muhimu kutekeleza mikataba"
  - "Alikubali kwamba binadamu ni wema kwa asili lakini akasisitiza kwamba masoko huru pekee ndiyo yangeweza kuelekeza wema huo katika shughuli yenye uzalishaji"
  - "Alikataa msisitizo wao juu ya haki za mtu binafsi na badala yake akasema jumuiya zinapaswa kufafanua viwango vya maadili kwa pamoja"
explanation: >-
  Rothbard aliwakosoa libertaires kwa kukubali maono ya kijinga, yanayofanana na ya Rousseau, ya asili ya binadamu kama njema kwa asili. Badala yake alisema kwamba watu huongozwa na maslahi binafsi, na jamii lazima ipangwe ili motisha nzuri ziongoze tabia. Hili linahitaji kutambua na kudhamini mali binafsi. Kufuta dola hakumaanishi kufuta kazi zake; polisi na haki vinapaswa kusimamiwa na soko huru kupitia ushindani.
