question: "Co má v konzervativní politické filozofii přednost před svobodou?"
answer: "Řád a tradice, které musí být pevně nastoleny, než lze svobodu oceňovat"
wrong_answers:
  - "Sociální spravedlnost a rovnost, které musí být zaručeny, než mohou být jednotlivci skutečně svobodní"
  - "Ekonomická efektivita a pragmatické výsledky, které určují, kdy je svoboda vhodná"
  - "Individuální vlastnická práva, která musí být chráněna dříve, než je přiznána jakákoli jiná svoboda"
explanation: >-
  Pro konzervativce mají řád a tradice přednost před svobodou. Tvrdí, že příliš mnoho svobody vytváří chaos a společenský nepořádek, takže svobodu lze oceňovat teprve tehdy, když je pevně nastolen řád. To kontrastuje se socialistickým pohledem, který upřednostňuje spravedlnost, nebo s centristickým zaměřením na efektivitu.
