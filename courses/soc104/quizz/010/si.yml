question: "Nolan රූපසටහනේ උපරිම ආර්ථික නිදහස සමඟ සම්බන්ධ වන සංකේතාත්මක චරිත කවුද?"
answer: "Margaret Thatcher, Ronald Reagan, සහ Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures, සහ Bernie Sanders"
  - "Nelson Mandela, Simone Veil, සහ Noam Chomsky"
  - "Vladimir Putin, Xi Jinping, සහ Joseph de Maistre"
explanation: >-
  Thatcher, Reagan, සහ Milei උපරිම ආර්ථික නිදහසේ සංකේතාත්මක චරිත ලෙස සඳහන් කරනු ලබන්නේ, අඩු රාජ්‍ය මැදිහත්වීම, අඩු නියාමන, සහ අඩු බදු සඳහා කැමැත්ත දක්වන නිසාය. Roosevelt, Jaures, සහ Sanders ආර්ථිකය මත රාජ්‍ය පාලනයට කැමති විරුද්ධ අන්තය නියෝජනය කරති. Mandela, Veil, සහ Chomsky උපරිම පුද්ගලික නිදහස නියෝජනය කරති. Putin, Xi Jinping, සහ de Maistre පුද්ගලික ජීවිතය මත උපරිම රාජ්‍ය පාලනය නියෝජනය කරති.
