question: "Ni ikihe kibazo c'ishimikiro c'amafaranga ya Fiat Satoshi Nakamoto yerekanye?"
answer: "Asaba kwizigira banki nkuru ko itazotesha agaciro ifaranga, ariko kahise k'amafaranga ya Fiat kuzuye ukurenga kuri ico cizere"
wrong_answers:
  - "Aragoye cane gukoresha mu bikorwa vya misi yose kuko amahera akoreshwa mu ntoke asaza ningoga kandi azimvye kuyahingura"
  - "Ntashobora kurungikwa mu bihugu bitandukanye kuko igihugu cose gifise ingingo n'amategeko y'amahera bidahuye n'ivy'ibindi"
  - "Ashigikiwe n'ububiko bwa zahabu budakwiye gukingira amahera yose ari mu kuzurunguka"
explanation: >-
  Satoshi Nakamoto yavuze ko ikibazo c'ishimikiro c'amafaranga asanzwe ari icizere gisabwa kugira ngo akore. Amafaranga ya Fiat ntashigikiwe n'ikintu gifise agaciro, ahubwo yishimikiza gusa ububasha bw'ibigo. Igihe ikigo gifise ububasha bwose ku mahera, inyosha mbi yo kubukoresha nabi iba ikomeye cane, kandi kahise kavyerekanye kenshi biciye mu gutakaza agaciro kw'amafaranga.
