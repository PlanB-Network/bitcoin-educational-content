question: "Šta je konstruktivizam kao zajedničko političko uverenje?"
answer: "Uverenje da centralna vlada može, snagom zakona, stvoriti društveni poredak koji je dobar za najveći broj ljudi"
wrong_answers:
  - "Uverenje da društvo treba organizovati kroz dobrovoljnu saradnju između pojedinaca bez državnog mešanja"
  - "Uverenje da samo slobodna tržišta mogu odrediti optimalnu raspodelu resursa u društvu"
  - "Uverenje da politička vlast treba biti jednako raspodeljena među svim građanima kroz direktnu demokratiju"
explanation: >-
  Konstruktivizam ujedinjuje centriste, konzervativce i socijaliste oko zajedničkog uverenja: superiornosti političkog procesa nad tržišnim procesom. To je uverenje da centralna vlada može, snagom zakona, stvoriti društveni poredak dobar za najveći broj ljudi. To stoji u direktnoj suprotnosti sa libertarijanskom odbranom spontanog poretka koji nastaje iz dobrovoljnih interakcija.
