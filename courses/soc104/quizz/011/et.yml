question: "Mida hõlmab isikliku vabaduse kategooria?"
answer: "Seda, mida teete oma erasuhetes, oma arvamuste, veendumuste ja kõigega, mis puudutab teie enda keha ja meelt"
wrong_answers:
  - "Seda, mida teete tootjana, sealhulgas ettevõtte alustamine, töötajate palkamine ja kaupadega kauplemine"
  - "Kui palju makse maksate, milliseid investeeringuid teete ja kuidas haldate oma finantsvarasid"
  - "Teie võimet turul konkureerida, oma toodetele hindu määrata ja tarnijaid valida"
explanation: >-
  Isiklik vabadus hõlmab seda, mida teete oma erasuhetes, oma arvamuste ja veendumustega ning kõigega, mis puudutab teie enda keha ja meelt. See hõlmab abielu, lugemisvalikuid, usulisi praktikaid, toidu- ja ravimivalikuid ning seda, kellega te suhtlete. Äritegevus, maksud ja turuotsused kuuluvad majandusliku vabaduse alla.
reviewed: false
