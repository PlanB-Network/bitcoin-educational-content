question: Simplicity에서 'case' 컴비네이터는 왜 시그니처에 공유 환경 타입 C를 포함하나요?
answer: 두 분기가 태그가 붙은 입력과 함께 공유 컨텍스트 데이터를 읽을 수 있도록 하기 위해서입니다.
wrong_answers:
  - 스택 오버플로를 방지하기 위해 입력의 크기를 제한하기 위해서입니다.
  - 두 분기 사이에서 서로 재귀 호출을 할 수 있게 하기 위해서입니다.
  - 체인에서 앞선 이전 컴비네이터의 출력을 저장하기 위해서입니다.
explanation: >-
  case 컴비네이터의 시그니처는 (A + B) × C ⊢ D입니다. 추가 타입 C는
  왼쪽 분기(f : A × C ⊢ D)와 오른쪽 분기(g : B × C ⊢ D)가 모두 접근할 수
  있는 공유 환경으로 작동합니다. 이는 단순한 if-then-else보다 더 강력한데,
  분기들이 각자의 특정 데이터와 계산에 필요한 컨텍스트 정보를 함께 받기 때문입니다.
reviewed: false
