question: "Kubera iki inflation y'amafaranga ivugwa nk'umusoro wihishije ushirwaho ata kwemera kw'abanyagihugu?"
answer: "Kuko kurema amahera kwa leta gutesha agaciro ifaranga ku buryo abantu bashobora kugura bike kuruta ku mahera angana na ya yandi, ariko benshi ntibamenya ko izamuka ry'ibiciro ryerekana politike ya leta aho kuba inguvu z'isoko zisanzwe"
wrong_answers:
  - "Kuko amabanki makuru yishuza mu mpisho amahera kuri transaction yose ica mu buryo bw'amabanki atabimenyesheje abafise amakonti"
  - "Kuko leta zicapura amahera zikayaha abatunzi gusa, mu gihe zisoresha abakene biciye mu misoro minini y'igurisha ku bintu vya nkenerwa"
  - "Kuko inflation iterwa n'amashirahamwe yigenga aduza ibiciro kugira ngo yongere inyungu, ivyo bigakora nk'umusoro utemewe ku bakoresha"
explanation: >-
  Ugushira amahera mashasha mu buryo bw'amahera guhinduka uguta agaciro kw'ifaranga, aho amahera angana na ya yandi agura bike kuruta kubera ko ayo mahera mashasha atagaragaza ukwiyongera kw'ubutunzi nyakuri. Abantu benshi ntibabona ko politike ya leta ari yo yazanye izamuka ry'ibiciro, kandi iryo zamuka ari gusa ishusho y'ugutakaza agaciro kw'ifaranga. Ivyo bingana n'ubusuma bwemewe n'amategeko n'ukunyaga kwashizwe mu bigo, bigakenesha umugwi wo hagati mu gihe abatunzi bafata amahera mashasha biciye mu mitungo y'ukwunguka ku biciro bihindagurika.
