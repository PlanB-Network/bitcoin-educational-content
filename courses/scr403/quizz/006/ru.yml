question: Что гарантирует теорема полноты в отношении Simplicity?
answer: Что любую функцию между двумя типами Simplicity можно построить из девяти комбинаторов.
wrong_answers:
  - Что программы Simplicity гарантированно всегда завершаются за постоянное время.
  - Что Simplicity является тьюринг-полным и способен симулировать любую машину Тьюринга.
  - Что каждая корректная программа Simplicity имеет одно-единственное уникальное представление.
explanation: >-
  Теорема полноты доказывает, что для любой функции между конечными типами
  Simplicity существует выражение Simplicity, которое её вычисляет.
  Конструктивное доказательство строит таблицу поиска с использованием
  вложенных выражений case и scribe. Это было формально проверено в
  системе доказательств Rocq.
