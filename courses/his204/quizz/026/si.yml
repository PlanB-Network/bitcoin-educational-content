question: Marquis d'Argensonට පෙර laissez-faire අදහස වර්ධනය කළේ කවුද?
answer: Boisguilbert
wrong_answers:
  - Vauban
  - Cantillon
  - Colbert
explanation: |
  Pierre Le Pesant de Boisguilbert laissez-faireහි පූර්වගාමියෙකු ලෙස සැලකෙන්නේ, ඔහු ආර්ථික නිදහස ආරක්ෂා කළ නිසාත් ආර්ථිකය තුළ අධික රාජ්‍ය මැදිහත්වීම විවේචනය කළ නිසාත්ය.