question: Cu care membru al școlii fiziocrate a dezbătut Condillac natura valorii lucrurilor?
answer: Guillaume-François Le Trosne
wrong_answers:
  - François Quesnay
  - Pierre-Samuel Dupont de Nemours
  - Marchizul de Mirabeau
explanation: |
  Condillac a dezbătut natura valorii cu Le Trosne, apărând o teorie subiectivă a valorii.
