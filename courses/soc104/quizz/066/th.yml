question: "จุดยืนลิเบอร์ทาเรียนต่อคำถามเรื่องการแต่งงานของคนรักเพศเดียวกันคืออะไร?"
answer: "รัฐไม่มีธุระต้องนิยามการแต่งงาน; ควรแปรรูปเป็นเรื่องเอกชนและปล่อยให้ปัจเจก สมาคม และสถาบันศาสนาเป็นผู้จัดการ"
wrong_answers:
  - "การแต่งงานของคนรักเพศเดียวกันควรถูกทำให้ถูกกฎหมาย เพราะพลเมืองทุกคนสมควรได้รับการปฏิบัติอย่างเท่าเทียมภายใต้กฎหมาย"
  - "การแต่งงานของคนรักเพศเดียวกันควรถูกห้าม เพราะการแต่งงานแบบดั้งเดิมเป็นสถาบันพื้นฐานสำหรับการให้กำเนิด"
  - "การแต่งงานของคนรักเพศเดียวกันควรถูกทำให้ถูกกฎหมาย แต่เฉพาะผ่านกรอบกฎหมายแยกต่างหากจากการแต่งงานแบบดั้งเดิม"
explanation: >-
  ลิเบอร์ทาเรียนโต้แย้งว่าคำถามเรื่องการแต่งงานถูกวางกรอบผิดโดยพื้นฐาน เพราะมันถูกตั้งในคำศัพท์แบบรัฐนิยม พวกเขาเห็นว่ารัฐไม่มีธุระต้องแทรกแซงชีวิตส่วนตัว ดังนั้นทางออกคือแยกการแต่งงานออกจากรัฐทั้งหมด ด้วยการบังคับคำนิยามเดียว รัฐสร้างความขัดแย้ง คำตอบผิดข้อแรกสะท้อนจุดยืนสังคมนิยมหรือสายกลาง และข้อที่สองสะท้อนจุดยืนอนุรักษนิยม
reviewed: false
