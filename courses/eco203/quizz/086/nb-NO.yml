question: Hvilket konsept bruker Bastiat for å beskrive ideologien om tvungen omfordeling og lovlig plyndring?
answer: sosialisme
wrong_answers:
  - republikanisme
  - konservatisme
  - liberalisme
explanation: |
  Bastiat kritiserer sosialismen for dens tendens til å bruke loven til å pålegge tvungen omfordeling, som han anser som en form for lovlig plyndring.
reviewed: false
