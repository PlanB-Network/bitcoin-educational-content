question: "Vilken är den konservativa positionen om invandring?"
answer: "Staten har den suveräna rätten att kontrollera sina gränser för att skydda nationell säkerhet och kulturell identitet"
wrong_answers:
  - "Gränser bör vara ovillkorligt öppna eftersom diskriminerande restriktioner kränker mänskliga rättigheter"
  - "Invandring bör avgöras av marknadsefterfrågan, där medborgare avtalsmässigt beslutar om sina relationer med utlänningar"
  - "Invandringspolitik bör balansera ekonomiska behov med framgångsrik integration baserad på expertutvärdering"
explanation: >-
  Konservativa anser att ordning, identitet och nationell suveränitet måste prioriteras framför ett obegränsat välkomnande av utlänningar eller flyktingar. Gränser och en väldefinierad befolkning är en del av civiliserade värden. De felaktiga svaren representerar den socialistiska positionen (öppna gränser som mänskliga rättigheter), den libertarianska positionen (marknadsbaserad invandring) och den centristiska positionen (balanserat expertstyrt angreppssätt).
reviewed: false
