question: "Hva er det sentrale skillet mellom å være pro-business og å være pro-market?"
answer: "Pro-business-forkjempere søker statlig inngripen for å beskytte bestemte selskaper mot å mislykkes, mens pro-market-forkjempere støtter deregulering og lar bedrifter gå konkurs slik at markedet kan reorganisere seg naturlig"
wrong_answers:
  - "Pro-business-forkjempere fokuserer på store selskaper, mens pro-market-forkjempere utelukkende fokuserer på å støtte småbedrifter og oppstartsbedrifter"
  - "Pro-business er et venstreorientert standpunkt som favoriserer arbeiderkooperativer, mens pro-market er et høyreorientert standpunkt som favoriserer privat eierskap"
  - "Pro-business-forkjempere avviser all konkurranse, mens pro-market-forkjempere støtter statlig regulert konkurranse mellom godkjente foretak"
explanation: >-
  Pro-business-standpunktet ser konkurranse som et styringsinstrument oppnådd gjennom reguleringer og rettferdiggjør subsidier og redningspakker for å forhindre tap av arbeidsplasser. I pro-business-synet er markedet skjørt og trenger statlig redning. Pro-market-forkjempere ser konkurranse som det naturlige resultatet av fri næringsvirksomhet, noe som innebærer deregulering og å la bedrifter gå konkurs, fordi konkurs gjør at markedet kan reorganisere seg naturlig og åpner feltet for mer kompetente aktører.
reviewed: false
