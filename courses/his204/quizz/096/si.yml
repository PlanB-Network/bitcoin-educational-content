question: Dupont de Nemours විරුද්ධව කතා කළ, 1789දී කළ තේරීම්වල අවසාන ප්‍රතිඵලය වන බැංකු ආයතනය කුමක්ද?
answer: Banque de France
wrong_answers:
  - The Savings Bank
  - Crédit Agricole
  - The European Central Bank
explanation: |
  Banque de France යනු 1789දී කළ තේරීම්වල ප්‍රතිඵලයකි. Dupont de Nemours ඒවා විවේචනය කළේ ඒවා මූල්‍ය බලය අධික ලෙස මධ්‍යගත කිරීමට සහ ආර්ථිකයට රාජ්‍යය අධික ලෙස මැදිහත්වීමට තුඩු දෙන නිසාය.