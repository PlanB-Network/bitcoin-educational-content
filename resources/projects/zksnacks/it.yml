description: |
  Lo "zk" in zkSNACKs sta per zero knowledge, il che significa che non raccogliamo e non possiamo raccogliere alcuna informazione personale degli utenti nei nostri prodotti.

  zkSNACKs ha chiuso il suo coordinatore coinjoin il 1º giugno 2024 e il suo sito web è offline. Wasabi Wallet continua come software open source.
