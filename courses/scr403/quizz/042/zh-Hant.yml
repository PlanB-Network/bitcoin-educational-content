question: 在花費時，一個 case 分支被修剪掉了。驗證者如何仍能將所揭露的程式與已承諾的 CMR 相匹配？
answer: CMR 是一個 Merkle Root，所以花費者只需提供被修剪分支的 CMR，驗證者便將它併入以重新計算出根。
wrong_answers:
  - 驗證者只使用被執行的分支，因為未被執行的 case 分支從來就不在 CMR 之中。
  - 被修剪的分支會變成一個標準的佔位符，其固定的 CMR 會在重新計算根時充當替代。
  - 被修剪分支的完整程式碼留在見證資料中，驗證者在那裡對它進行雜湊，但並不執行它。
explanation: >-
  case f g 的 CMR 是一個對兩個子節點 CMR 的帶標籤雜湊，所以每一個分支 —— 無論是否被執行 —— 在產生位址時都已被承諾。由於此構造是一棵 Merkle 樹，一個被修剪的分支可以僅憑它 32 位元組的 CMR 來概括：驗證者把那個雜湊插入遞迴計算中，並檢查根是否與該 UTXO 的承諾相符，而完全不需要看到被修剪的程式碼。這正是為什麼要使用 Merkle Root 來做承諾，也是為什麼被修剪分支內的任何見證運算式永遠不會出現在鏈上。
reviewed: false
