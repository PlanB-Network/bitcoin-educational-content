question: "En quoi les stratégies d'abolition de l'État diffèrent-elles entre libertaires et libertariens ?"
answer: "Les libertaires ont historiquement prôné la destruction violente, tandis que les libertariens cherchent à délégitimer l'État par l'éducation et la désobéissance civile"
wrong_answers:
  - "Les libertaires utilisent les élections démocratiques pour démanteler l'État, tandis que les libertariens favorisent la révolution armée et l'action directe"
  - "Les libertaires se concentrent sur la construction de communautés alternatives, tandis que les libertariens travaillent au sein du système politique existant pour faire adopter des réformes"
  - "Les libertaires et les libertariens s'accordent tous deux à dire que la protestation pacifique est le seul moyen légitime de transformation sociale"
explanation: >-
  Les libertaires ont historiquement prôné la destruction de l'État et du capitalisme par la violence, y compris la terreur et les attaques ciblées. Les libertariens, au contraire, rejettent la violence agressive comme illégitime. Leur stratégie repose sur la délégitimation de l'État par l'argumentation, le débat, l'éducation et la désobéissance civile. Ces approches fondamentalement différentes du changement reflètent leurs désaccords philosophiques plus profonds.
