question: Quelle a été l'influence de l'école de Salamanque dans le développement de la pensée moderne ?
answer: Elle a contribué à l'émergence du droit international et à la reconnaissance des droits de l'homme universels.
wrong_answers:
  - Elle a posé les bases de la philosophie politique moderne en affirmant la séparation des pouvoirs et la souveraineté populaire.
  - Elle a promu la diffusion du mercantilisme à travers les empires commerciaux européens.
  - Elle a influencé la pensée scientifique en encourageant la méthode expérimentale et le rationalisme.
explanation: |
  La contribution la plus significative de l'école de Salamanque a été l'émergence du droit international et la reconnaissance des droits de l'homme universels, notamment à travers Francisco de Vitoria et Bartolomeo de Las Casas qui ont défendu les droits des peuples autochtones sur la base du droit naturel.
reviewed: true
