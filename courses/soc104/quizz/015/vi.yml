question: "Những nhân vật biểu tượng nào gắn với tự do kinh tế tối đa trên biểu đồ Nolan?"
answer: "Margaret Thatcher, Ronald Reagan, và Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures, và Bernie Sanders"
  - "Nelson Mandela, Simone Veil, và Noam Chomsky"
  - "Vladimir Putin, Xi Jinping, và Joseph de Maistre"
explanation: >-
  Thatcher, Reagan và Milei được nêu là những nhân vật biểu tượng của tự do kinh tế tối đa, ủng hộ ít sự can thiệp của nhà nước hơn, ít quy định hơn và thuế thấp hơn. Roosevelt, Jaures và Sanders đại diện cho đầu đối lập, ủng hộ sự kiểm soát của nhà nước đối với nền kinh tế. Mandela, Veil và Chomsky đại diện cho tự do cá nhân tối đa. Putin, Xi Jinping và de Maistre đại diện cho sự kiểm soát tối đa của nhà nước đối với đời sống cá nhân.
