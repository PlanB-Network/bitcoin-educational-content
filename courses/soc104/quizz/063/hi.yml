question: "सर्वसत्तावादी शासन को 'धर्मनिरपेक्ष धर्म' क्यों कहा गया है, और यह सर्वसत्तावाद के अस्तित्व के लिए आवश्यक स्थितियों के बारे में क्या बताता है?"
answer: "वे सक्रिय समर्थकों से अर्ध-धार्मिक आस्था की मांग करते हैं और विरोधियों के विरुद्ध भय का उपयोग करते हैं, और सर्वसत्तावाद के लिए सभी विशेषताओं का एक साथ होना आवश्यक है: स्वतंत्रताओं का दमन, एक-दलीय शासन, हिंसक क्रांति और निर्देशित अर्थव्यवस्था"
wrong_answers:
  - "वे पारंपरिक पूजा को राज्य समारोहों से बदल देते हैं, और सर्वसत्तावाद के लिए केवल एक करिश्माई नेता और सैन्य नियंत्रण आवश्यक है"
  - "वे राज्य की विचारधारा लागू करने के लिए धार्मिक संस्थाओं का उपयोग करते हैं, और जब भी कोई एक राजनीतिक दल संसद पर हावी हो जाता है, सर्वसत्तावाद उभर सकता है"
  - "वे राजनीतिक कार्रवाई के माध्यम से आध्यात्मिक मुक्ति का वादा करते हैं, और जब भी राज्य अर्थव्यवस्था को नियंत्रित करता है, राजनीतिक स्वतंत्रताओं की परवाह किए बिना सर्वसत्तावाद मौजूद होता है"
explanation: >-
  रेमों आरों ने देखा कि सर्वसत्तावादी शासन दो सिद्धांतों पर काम करते हैं: सक्रिय समर्थकों की आस्था और विरोधियों का भय। यह अर्ध-धार्मिक कट्टरता उनकी अलग-अलग प्रेरणाओं से परे उन्हें परिभाषित करती है, इसलिए उन्हें धर्मनिरपेक्ष धर्म कहा जाता है। महत्वपूर्ण बात यह है कि सर्वसत्तावाद के लिए सभी परिभाषित विशेषताओं का एक साथ होना आवश्यक है: स्वतंत्रताओं का दमन, एक दल के माध्यम से असीमित अधिकार, हिंसक क्रांति और निर्देशित अर्थव्यवस्था। आधुनिक लोकतंत्र इनमें से कुछ लक्षण दिखा सकते हैं, लेकिन सर्वसत्तावाद केवल तब मौजूद होता है जब ये सभी एक साथ इकट्ठे हों।
reviewed: false
