question: "Bagaimana Green New Deal merepresentasikan evolusi kontemporer dari sosialisme demokratis?"
answer: "Ia menggunakan kekhawatiran lingkungan sebagai pembenaran baru bagi intervensi negara dan penyitaan pendapatan pribadi, dengan menundukkan kepentingan individu pada kesehatan planet secara kolektif"
wrong_answers:
  - "Ia sepenuhnya meninggalkan ekonomi sosialis tradisional demi solusi pasar bebas untuk masalah lingkungan melalui perdagangan karbon"
  - "Ia menolak intervensi negara dan sebaliknya mengandalkan tindakan individu sukarela serta inovasi sektor swasta untuk mengatasi perubahan iklim"
  - "Ia merepresentasikan pemutusan dari sosialisme dengan memprioritaskan perlindungan lingkungan di atas semua kekhawatiran keadilan sosial dan lapangan kerja"
explanation: >-
  Green New Deal memadukan kekhawatiran lingkungan dengan tujuan sosial, menggabungkan transisi ekologis dengan keadilan sosial, jaminan lapangan kerja, dan layanan publik yang diperkuat. Kepentingan individu ditundukkan pada kepentingan kolektif yang didefinisikan oleh kesehatan planet. Pada intinya, ia menyediakan wadah retoris baru yang membenarkan intervensi negara dan penyitaan pendapatan pribadi, tidak lagi semata-mata atas nama keadilan sosial tetapi juga atas nama lingkungan.
