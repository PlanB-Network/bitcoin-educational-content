question: When strategically overriding CSS properties using the cascade, what is the most effective approach for setting general margins while ensuring the bottom margin is removed?
answer: Set margin: 1% auto first, then override with margin-bottom: 0
wrong_answers:
  - Set margin-bottom: 0 first, then apply margin: 1% auto
  - Use !important on margin-bottom: 0 to ensure it takes precedence
  - Define separate margin-top, margin-left, and margin-right properties individually
explanation: |
  The cascade reads CSS properties top to bottom, with later declarations overwriting earlier ones for the same property. Setting margin: 1% auto establishes general margins for all sides, then margin-bottom: 0 specifically overrides just the bottom margin while preserving the auto left/right and 1% top values. This leverages CSS's natural cascade behavior without needing !important or verbose individual property declarations.
