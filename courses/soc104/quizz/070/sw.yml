question: "Kwa nini msimamo wa kilibertaria kuhusu kuhalalisha dawa za kulevya unaambatana na sharti kwamba nafasi ya dola katika jamii lazima ipunguzwe?"
answer: "Kwa sababu ulegezaji unaochukuliwa na dola ungechukua nafasi ya wajibu wa mtu binafsi kwa huduma inayosimamiwa na serikali, ilhali walibertaria wanataka raia wabebe matokeo ya chaguo zao kwa msaada kutoka vyama binafsi"
wrong_answers:
  - "Kwa sababu uhalalishaji unaodhibitiwa na dola ungezalisha mapato mengi mno ya kodi, na kuifanya serikali kuwa yenye nguvu kupita kiasi na fisadi"
  - "Kwa sababu dola ingeweka viwango vya ubora ambavyo vingepandisha bei na kuunda upya masoko haramu"
  - "Kwa sababu udhibiti wa serikali juu ya dawa za kulevya ungekiuka mikataba ya biashara ya kimataifa na mahusiano ya kidiplomasia"
explanation: >-
  Walibertaria huunga mkono ulegezaji wa dawa za kulevya lakini husisitiza kwamba nafasi ya dola lazima ipunguzwe kwa sababu lengo lao ni kurejesha wajibu wa mtu binafsi, si kupanua usimamizi wa dola. Ikiwa mtu anakuwa tegemezi, lazima awajibike badala ya kuiomba dola itoe huduma. Suluhisho la uraibu liko katika jitihada binafsi: msaada wa hiari kutoka kwa watu binafsi, familia, na vyama vya hisani. Uhalalishaji unaosimamiwa na dola ungepingana na kanuni ya msingi ya kilibertaria ya wajibu binafsi.
