question: "centrism හි cardinal values කුමක්ද?"
answer: "Moderation, compromise, adaptation, සහ public utility"
wrong_answers:
  - "Tradition, order, authority, සහ national identity"
  - "Freedom, private property, consent, සහ individual responsibility"
  - "Equality, social justice, solidarity, සහ collective ownership"
explanation: >-
  Centrism හි cardinal values වන්නේ moderation, compromise, adaptation, සහ public utility ය. මේවා ideological commitment එකකට වඩා pragmatic balance වෙත centrist emphasis එක පෙන්වයි. අනෙකුත් options පිළිවෙළින් conservatism, libertarianism, සහ socialism හි cardinal values විස්තර කරයි.
reviewed: false
