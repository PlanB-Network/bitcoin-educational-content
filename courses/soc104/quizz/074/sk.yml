question: "Aká je socialistická pozícia k zdravotnej starostlivosti?"
answer: "Prístup k zdravotnej starostlivosti je základné právo a štát musí zaručiť univerzálny, verejne financovaný systém pre každého bez ohľadu na príjem"
wrong_answers:
  - "Zdravotná starostlivosť by mala byť zmiešaným systémom so základným štátnym krytím doplneným možnosťami súkromného poistenia"
  - "Súkromné trhy poskytujú inovatívnejšiu zdravotnú starostlivosť, takže jednotlivci by si mali slobodne vybrať vlastný systém"
  - "Štát by mal poskytovať zdravotnú starostlivosť iba najchudobnejším občanom, zatiaľ čo súkromné poistenie pokrýva všetkých ostatných"
explanation: >-
  Pre socialistov je prístup k zdravotnej starostlivosti základným právom, nie komoditou. Štát musí zaručiť univerzálny, verejne financovaný systém zdravotnej starostlivosti, aby mal každý prístup k starostlivosti bez ohľadu na príjem. To odráža socialistický dôraz na rovnosť, sociálnu spravodlivosť a význam štátu pri organizovaní služieb vo všeobecnom záujme. Zmiešaný systém opisuje centristický pohľad, zatiaľ čo prístupy založené na voľbe odrážajú libertariánske a konzervatívne pozície.
