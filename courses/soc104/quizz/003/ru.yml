question: "Почему ось левые–правые считается недостаточной для размещения классических либеральных мыслителей вроде Бастиа или Рона Пола?"
answer: "Потому что классический либерализм ценит и экономические, и личные свободы, которые ни левые, ни правые полностью не принимают"
wrong_answers:
  - "Потому что классические либералы всегда совпадают с правой экономической политикой и отвергают все левые позиции"
  - "Потому что классические либералы — центристы, принимающие умеренные версии как левых, так и правых идеологий"
  - "Потому что классические либералы выступают против всех форм государства, что делает их анархистами, а не политическими мыслителями"
explanation: >-
  Ось левые–правые не подходит для классических либералов, потому что не может вместить позицию, которая одновременно защищает экономическую свободу (обычно правую) и личную свободу (обычно левую). Классические либералы не являются центристами, ищущими компромисс, и не являются анархистами или чисто правыми. Они просто не помещаются на одномерном спектре.
