question: "Apa yang membedakan neokonservatif dari paleokonservatif dalam pendekatan mereka terhadap kebijakan luar negeri?"
answer: "Neokonservatif membenarkan intervensi militer untuk menyebarkan demokrasi, sementara paleokonservatif membela kebijakan luar negeri yang lebih isolasionis"
wrong_answers:
  - "Neokonservatif menentang semua aksi militer dan mendukung diplomasi, sementara paleokonservatif mendukung serangan preemptif terhadap ancaman potensial"
  - "Neokonservatif berfokus secara eksklusif pada sanksi ekonomi, sementara paleokonservatif menganjurkan pembangunan koalisi internasional untuk operasi militer bersama"
  - "Neokonservatif dan paleokonservatif sepakat tentang kebijakan luar negeri tetapi berbeda tajam dalam regulasi ekonomi domestik"
explanation: >-
  Sejak tahun 2000-an, neokonservatif semakin terlibat dalam pembenaran intervensi militer untuk menanamkan demokrasi di seluruh dunia, terutama setelah 11 September 2001. Sebagai reaksi, kaum konservatif tradisional mengklaim label 'paleokonservatif' untuk membedakan diri mereka. Paleokonservatif mengkritik intervensi militer, membela kebijakan luar negeri yang lebih isolasionis, dan memberi penekanan lebih besar pada identitas nasional dan budaya.
