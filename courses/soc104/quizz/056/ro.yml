question: "Spre ce formă de guvernanță tinde centrismul?"
answer: "Tehnocrație, unde puterea este încredințată experților care dirijează economia și politica monetară"
wrong_answers:
  - "Democrație directă, unde cetățenii votează asupra fiecărei decizii majore de politică publică"
  - "Aristocrație, unde puterea este deținută de o clasă conducătoare tradițională"
  - "Guvernanță laissez-faire, unde piața se reglementează singură fără intervenția statului"
explanation: >-
  Centrismul privilegiază eficiența, pragmatismul și tinde către tehnocrație, ceea ce înseamnă că puterea ar trebui încredințată experților care dirijează economia și pilotează politica monetară. Acest lucru este fundamental diferit de democrația directă, aristocrație sau laissez-faire, fiecare dintre acestea distribuind puterea potrivit unor principii complet diferite.
reviewed: false
