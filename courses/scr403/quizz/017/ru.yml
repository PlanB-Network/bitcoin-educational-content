question: Как работает нотация доступа (O, I, H) в Simplicity?
answer: O означает 'take' (левый элемент), I означает 'drop' (правый элемент), а H означает 'iden' (всё значение целиком).
wrong_answers:
  - O означает output (вывод), I означает input (ввод), а H означает halt (остановку выполнения программы).
  - Это имена переменных, которые компилятор автоматически присваивает значениям.
  - O выбирает элементы с нечётными индексами, I — с чётными, а H — выбирает голову.
explanation: >-
  Сокращение O/I/H даёт компактный способ навигации по вложенным парам.
  O f — это take f (извлечение левого элемента), I f — это drop f
  (извлечение правого элемента), а H — это iden (значение целиком).
  Последовательности вроде I O H означают drop(take(iden)) — извлечение
  первого элемента второго элемента. Это напоминает индексы Де Брёйна,
  где двоичные цифры задают позиции в дереве.
reviewed: false
