question: "¿Qué quiere legislar y regular la izquierda?"
answer: "La economía, impulsada por la hostilidad hacia la libertad económica, el capitalismo y el libre mercado"
wrong_answers:
  - "La moral personal y las prácticas religiosas, impulsada por el deseo de preservar las instituciones tradicionales"
  - "La inmigración y las fronteras nacionales, impulsada por preocupaciones sobre la identidad cultural y la soberanía"
  - "La tecnología y la innovación, impulsada por temores a que la automatización sustituya a los trabajadores humanos"
explanation: >-
  La izquierda da prioridad a la justicia social y la igualdad, especialmente en el plano económico. Esto conduce a su hostilidad hacia la libertad económica, el capitalismo y el libre mercado, y a su deseo de legislar y regular la economía. La derecha, en cambio, quiere legislar sobre la moral y la religión. La inmigración y la regulación tecnológica no son el foco principal descrito aquí.
