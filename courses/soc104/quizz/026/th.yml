question: "อนุรักษนิยมทางวัฒนธรรมคืออะไร?"
answer: "การยึดถือส่วนตัวต่อคุณค่าครอบครัว ศีลธรรม สุนทรียะ และอภิปรัชญาที่สืบทอดมาจากอดีต ไม่ใช่ปรัชญาการเมือง"
wrong_answers:
  - "อุดมการณ์ทางการเมืองที่ใช้อำนาจรัฐเพื่อบังคับค่านิยมแบบดั้งเดิมต่อสังคมทั้งหมดผ่านกฎหมาย"
  - "ขบวนการที่ปฏิเสธความเป็นสมัยใหม่ทุกรูปแบบและแสวงหาการพาสังคมกลับไปสู่วิถีชีวิตก่อนยุคอุตสาหกรรม"
  - "หลักคำสอนทางเศรษฐกิจที่ปกป้องอุตสาหกรรมแห่งชาติและคัดค้านการค้าเสรีกับต่างประเทศ"
explanation: >-
  อนุรักษนิยมทางวัฒนธรรมถูกนิยามว่าเป็นภูมิปัญญาของชีวิต: การยึดถือส่วนตัวต่อคุณค่าครอบครัว ศีลธรรม สุนทรียะ และอภิปรัชญาที่สืบทอดมาจากอดีต ไม่ว่าจะเป็นกรีก-โรมันหรือยิว-คริสต์ มันไม่ใช่ปรัชญาการเมืองอย่างชัดเจน มันแตกต่างจากอนุรักษนิยมทางการเมือง ซึ่งมุ่งรักษาสถาบันการเมืองและระเบียบสังคมผ่านอำนาจรัฐ และไม่ใช่เรื่องของการปฏิเสธความเป็นสมัยใหม่หรือ protectionism ทางเศรษฐกิจ
reviewed: false
