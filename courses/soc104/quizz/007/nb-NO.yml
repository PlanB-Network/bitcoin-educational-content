question: "Hvilken indre spenning finnes blant libertarianere i Nolan-diagrammet?"
answer: "Noen ønsker å avskaffe staten helt (anarkokapitalister), mens andre foretrekker en minimal stat som beholder kjernefunksjoner for suverenitet (minarkister)"
wrong_answers:
  - "Noen ønsker sterk økonomisk regulering, mens andre foretrekker fullstendig deregulering av alle industrier"
  - "Noen støtter demokratiske valg, mens andre foretrekker et arvelig styresystem"
  - "Noen går inn for progressive sosialpolitiske tiltak, mens andre forsvarer strengt tradisjonelle moralske verdier"
explanation: >-
  Innenfor den libertarianske familien finnes det en grunnleggende uenighet om statens rolle. Anarkokapitalister ønsker å erstatte alle statlige funksjoner med private tjenester, mens minarkister aksepterer en minimal stat som beholder kjernefunksjoner for suverenitet som forsvar og domstoler. Begge grupper deler det libertarianske toppunktet, men er uenige om hvorvidt noen stat i det hele tatt bør eksistere.
reviewed: false
