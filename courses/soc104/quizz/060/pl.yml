question: "Jaki ukryty paradoks kryje się w centrowym pragmatyzmie?"
answer: "Sam pragmatyzm opiera się na formie dogmatyzmu, mianowicie niewyrażonym przekonaniu, że tylko eksperci są kompetentni, by sterować społeczeństwem"
wrong_answers:
  - "Centrowcy twierdzą, że są umiarkowani, ale konsekwentnie sprzymierzają się z partiami lewicowymi w rządach koalicyjnych"
  - "Polityki centrowe wydają się zrównoważone, ale zawsze przedkładają wzrost gospodarczy nad ochronę środowiska"
  - "Centrowcy odrzucają ideologię, ale przy podejmowaniu decyzji gospodarczych przyjmują sztywne zasady wolnorynkowe"
explanation: >-
  Paradoks centrowego pragmatyzmu polega na tym, że twierdzi on, iż odrzuca ideologię na rzecz racjonalnej ekspertyzy, a jednak samo to twierdzenie opiera się na niewidzialnym i niewyrażonym dogmacie: że tylko technokraci są zdolni podejmować właściwe decyzje. To przekonanie, że wyłącznie eksperci powinni sterować społeczeństwem, samo jest zobowiązaniem ideologicznym, choć centryści nie rozpoznają go jako takiego.
reviewed: false
