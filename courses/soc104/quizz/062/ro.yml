question: "Cum au ajuns la putere toate regimurile totalitare?"
answer: "Prin revoluție violentă, care a justificat ștergerea completă a sistemului anterior"
wrong_answers:
  - "Prin reformă legislativă graduală în cadrul instituțiilor democratice existente"
  - "Prin lovituri de stat militare organizate de puteri străine care urmăreau control regional"
  - "Prin mișcări de masă pașnice care au câștigat alegeri populare cu majorități largi"
explanation: >-
  Toate regimurile totalitare au ajuns la putere prin revoluție violentă. Această revoluție servește unui dublu scop: distruge fizic vechea ordine și justifică ideologic folosirea violenței ca fiind necesară pentru construirea noii societăți. Acest lucru deosebește preluările totalitare de tranzițiile democratice, loviturile de stat susținute din exterior sau victoriile electorale pașnice.
