question: "Aký spoločný politický cieľ majú ľavicoví a pravicoví etatisti?"
answer: "Získať moc, aby mohli usporiadať spoločnosť podľa svojej vízie sveta a vnútiť ju všetkým"
wrong_answers:
  - "Zmenšiť veľkosť vlády a vrátiť rozhodovaciu moc jednotlivým občanom"
  - "Zaviesť priamu demokraciu, v ktorej každý občan hlasuje o každom legislatívnom rozhodnutí"
  - "Odstrániť politické strany a nahradiť ich nezávislou technokratickou správou"
explanation: >-
  Ľavicoví aj pravicoví etatisti zdieľajú ten istý politický cieľ: získať moc, aby mohli prostredníctvom legislatívy usporiadať spoločnosť podľa svojho svetonázoru a vnútiť ho všetkým. Rozdiel je iba v ich hodnotách: pravica sa odvoláva na obranu civilizácie, zatiaľ čo ľavica sa odvoláva na obranu pracujúcej triedy alebo utláčaných. Ani jedna strana sa nesnaží zmenšiť vládu alebo odstrániť strany.
