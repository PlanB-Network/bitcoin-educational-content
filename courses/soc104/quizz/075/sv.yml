question: "I alla fem ekonomiska debatter (skatter, minimilön, sjukvård, miljö, subventioner), vilket konsekvent mönster skiljer den centristiska metoden från andra politiska familjers positioner?"
answer: "Centrister vägrar att binda sig till en fast princip och kräver i stället empirisk analys och expertutvärdering för att avgöra politik från fall till fall, vilket gör deras angreppssätt inneboende teknokratiskt"
wrong_answers:
  - "Centrister intar alltid en mittposition mellan de socialistiska och konservativa ståndpunkterna och delar skillnaden lika i varje fråga"
  - "Centrister prioriterar konsekvent ekonomisk tillväxt framför social välfärd, ställer sig på libertarianernas sida i finanspolitik samtidigt som de håller med socialister om reglering"
  - "Centrister överlåter alla ekonomiska beslut till internationella organisationer och handelsavtal i stället för att föra självständig nationell politik"
explanation: >-
  I alla fem ekonomiska debatter följer det centristiska angreppssättet samma mönster: snarare än att binda sig till en fast ideologisk princip kräver centrister empiriska belägg och expertutvärdering innan de fattar beslut. När det gäller skatter måste rätt nivå bestämmas genom analys. När det gäller minimilönen måste nivån justeras pragmatiskt. När det gäller sjukvård är en blandning kalibrerad av experter idealisk. När det gäller miljö måste politiken balansera konkurrenskraft. När det gäller subventioner måste varje fall bedömas utifrån sina egna meriter. Detta gör centrismen inneboende teknokratisk, vilket skiljer sig från att bara dela skillnaden eller överlåta beslut till internationella organ.
