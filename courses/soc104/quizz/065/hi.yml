question: "आव्रजन पर कंजरवेटिव स्थिति क्या है?"
answer: "राज्य को राष्ट्रीय सुरक्षा और सांस्कृतिक पहचान की रक्षा के लिए अपनी सीमाओं को नियंत्रित करने का संप्रभु अधिकार है"
wrong_answers:
  - "सीमाएं बिना शर्त खुली होनी चाहिए, क्योंकि भेदभावपूर्ण प्रतिबंध मानवाधिकारों का उल्लंघन करते हैं"
  - "आव्रजन बाज़ार मांग से निर्धारित होना चाहिए, और नागरिक विदेशियों के साथ अपने संबंधों पर संविदात्मक रूप से निर्णय लें"
  - "आव्रजन नीति को आर्थिक जरूरतों और सफल एकीकरण के बीच संतुलन बनाना चाहिए, जो विशेषज्ञ मूल्यांकन पर आधारित हो"
explanation: >-
  कंजरवेटिव मानते हैं कि व्यवस्था, पहचान और राष्ट्रीय संप्रभुता को विदेशियों या शरणार्थियों के अनियंत्रित स्वागत पर प्राथमिकता मिलनी चाहिए। सीमाएं और स्पष्ट रूप से परिभाषित जनसंख्या सभ्य मूल्यों का हिस्सा हैं। गलत उत्तर समाजवादी स्थिति (मानवाधिकारों के रूप में खुली सीमाएं), लिबर्टेरियन स्थिति (बाज़ार-आधारित आव्रजन) और मध्यमार्गी स्थिति (संतुलित, विशेषज्ञ-निर्देशित दृष्टिकोण) को दर्शाते हैं।
