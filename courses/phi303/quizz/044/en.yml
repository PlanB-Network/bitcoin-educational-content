question: "What monetary prescription closes the course's program?"
answer: "Discredit fiat money and promote sound money \u2014 gold and Bitcoin \u2014 which no state can expand."
wrong_answers:
  - "Introduce a global central bank digital currency."
  - "Peg all currencies to the US dollar."
  - "Ban savings to stimulate consumption."
explanation: |
  Inflation quietly makes people poorer even as technology masks it. Sound money outside state control — gold historically, Bitcoin today — removes the state's ability to finance itself by debasing the currency.
