question: "Yapısal yaklaşım sosyalizm ile liberteryenizm arasındaki temel farkı nasıl tanımlar?"
answer: "Sosyalizm düzenleme, planlama ve kontrol yoluyla devlete öncelik verirken, liberteryenizm asgari devlet müdahalesi yoluyla bireye öncelik verir"
wrong_answers:
  - "Sosyalizm kırsal tarım topluluklarına öncelik verirken, liberteryenizm kentsel endüstriyel gelişmeyi tercih eder"
  - "Sosyalizm demokratik seçimleri desteklemesiyle tanımlanırken, liberteryenizm her türlü siyasi katılımı reddeder"
  - "Sosyalizm dış politikaya ve uluslararası işbirliğine odaklanırken, liberteryenizm yalnızca iç ekonomik meselelerle ilgilenir"
explanation: >-
  Yapısal olarak sosyalizm, düzenleyen, planlayan ve kontrol eden devletin her yerde hazır bulunmasıyla karakterize edilir. Liberteryenizm ise ekonomiye ve özel hayata asgari devlet müdahalesiyle tanımlanır; bireysel özgürlüğün ve serbest piyasanın önceliğine yönelir. Bu yapısal ayrım, her sistemin beyan edilmiş niyetlerini karşılaştırmaktan analitik açıdan çok daha yararlıdır.
