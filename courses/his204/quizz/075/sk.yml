question: Prečo možno povedať, že filozofi osvietenstva zohrali vo vývoji politickej ekonómie protikladnú úlohu?
answer: Jej princípy zároveň oslavovali aj odsudzovali
wrong_answers:
  - O túto vedu sa začali zaujímať až veľmi neskoro v živote
  - Niektorí sú jasne ekonómami, iní ich odporcami
  - Boli príliš teoretickí a málo praktickí
explanation: |
  Filozofi osvietenstva zastávali rozmanité názory na politickú ekonómiu, priaznivé aj kritické. Niektorí obhajovali princípy ekonomického liberalizmu, iní varovali pred nebezpečenstvom nerovnosti a vykorisťovania.
