question: "Ni lengo gani la kisiasa la pamoja ambalo wanaounga mkono ustatisti wa mrengo wa kushoto na wa mrengo wa kulia wanalo?"
answer: "Kushinda madaraka ili kupanga jamii kulingana na maono yao ya dunia na kuyamlazimisha kwa kila mtu"
wrong_answers:
  - "Kupunguza ukubwa wa serikali na kurudisha uwezo wa kufanya maamuzi kwa raia mmoja mmoja"
  - "Kuanzisha demokrasia ya moja kwa moja ambapo kila raia hupiga kura juu ya kila uamuzi wa kisheria"
  - "Kuondoa vyama vya siasa na kuvibadilisha kwa utawala huru wa kiteknokrasia"
explanation: >-
  Wanaounga mkono ustatisti wa mrengo wa kushoto na wa mrengo wa kulia wote hushiriki lengo moja la kisiasa: kushinda madaraka ili kupanga jamii kulingana na mtazamo wao wa dunia na kuulazimisha kwa kila mtu kupitia sheria. Tofauti iko tu katika thamani zao: mrengo wa kulia hutaja kutetea ustaarabu, ilhali mrengo wa kushoto hutaja kutetea tabaka la wafanyakazi au waliokandamizwa. Hakuna upande unaotafuta kupunguza serikali au kuondoa vyama.
