question: "En quoi les rôles du Cato Institute, du Mises Institute et du Libertarian Party diffèrent-ils au sein du mouvement libertarien ?"
answer: "Le Cato Institute se concentre sur les propositions de politiques publiques, le Mises Institute sur l'éducation et les publications universitaires, et le Libertarian Party sur la politique électorale"
wrong_answers:
  - "Le Cato Institute finance des campagnes politiques, le Mises Institute fait directement du lobbying auprès du Congrès, et le Libertarian Party organise des conférences universitaires"
  - "Le Cato Institute publie des manuels d'économie, le Mises Institute mène des campagnes d'inscription électorale, et le Libertarian Party rédige des projets de loi"
  - "Le Cato Institute organise des manifestations de terrain, le Mises Institute fournit une défense juridique aux libertariens, et le Libertarian Party gère la recherche de think tanks"
explanation: >-
  Le Cato Institute (fondé en 1977) est un think tank basé à Washington qui travaille sur des propositions de politiques publiques. Le Mises Institute (fondé en 1982) se concentre sur l'éducation plutôt que sur le lobbying politique, fonctionnant comme une sorte d'université en ligne avec des conférences et des ouvrages réédités. Le Libertarian Party (fondé en 1971) est le troisième plus grand parti politique américain, participant à des élections où même sa part d'environ 2 % des voix peut faire basculer les résultats.
reviewed: false
