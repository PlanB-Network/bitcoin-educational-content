question: "O que os libertários colocam no centro de sua filosofia política?"
answer: "Ética e direito"
wrong_answers:
  - "Crescimento econômico e criação de riqueza"
  - "Igualdade social e bem-estar coletivo"
  - "Identidade nacional e preservação cultural"
explanation: >-
  Os libertários se distinguem de todas as outras famílias políticas ao colocar a ética e o direito no centro de sua filosofia, não a economia. Quando defendem a economia de mercado, é menos por sua capacidade de produzir riqueza do que por sua promoção da liberdade e da responsabilidade individuais. O crescimento econômico é um benefício secundário, não o princípio fundador.
reviewed: false
