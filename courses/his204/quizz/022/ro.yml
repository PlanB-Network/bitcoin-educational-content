question: Al cărui filosof apare abatele de Saint-Pierre ca precursor prin Proiectul său de pace perpetuă?
answer: Emmanuel Kant
wrong_answers:
  - Jeremy Bentham
  - Jean-Jacques Rousseau
  - Baruch Spinoza
explanation: |
  Proiectul de pace perpetuă al abatelui de Saint-Pierre este considerat un precursor al ideilor lui Immanuel Kant privind pacea universală. Ambii gânditori susțineau crearea unei organizații internaționale capabile să garanteze pacea între națiuni.
