question: "Mfumo wa pesa Fiat huimarishaje mgawanyiko kati ya watawala na watawaliwa?"
answer: "Unaruhusu serikali kufadhili matumizi yasiyo na kikomo kupitia uundaji wa pesa, jambo linalopunguza thamani ya akiba kupitia mfumuko wa bei"
wrong_answers:
  - "Unawapa raia udhibiti wa moja kwa moja wa sera ya fedha kupitia uchaguzi wa kidemokrasia na kura za maoni"
  - "Unazuia serikali kukopa, na kuzilazimisha kutegemea kodi pekee kwa mapato"
  - "Unagawa pesa mpya zilizoundwa kwa usawa miongoni mwa raia wote ili kuchochea ukuaji wa uchumi"
explanation: >-
  Sarafu ya Fiat inaelezwa kama jiwe la msingi la upanuzi wa mamlaka ya dola kwa sababu inaruhusu serikali kukopa na kusukuma benki kuchapisha pesa mpya. Mfumuko wa bei unaotokana na hilo hupunguza thamani ya akiba za watu, na kunufaisha vyombo tajiri na vyenye nguvu zaidi. Haiwapi raia udhibiti wa fedha, wala haizuii ukopaji au kugawa pesa kwa usawa.
