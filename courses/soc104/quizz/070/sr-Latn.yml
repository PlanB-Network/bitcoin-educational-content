question: "Zašto libertarijanska pozicija o legalizaciji droga dolazi uz uslov da se uloga države u društvu mora smanjiti?"
answer: "Zato što bi liberalizacija koju preuzme država zamenila individualnu odgovornost državnom brigom, dok libertarijanci žele da građani snose posledice svojih izbora uz podršku privatnih udruženja"
wrong_answers:
  - "Zato što bi legalizacija pod državnom kontrolom generisala previše poreskih prihoda, čineći vladu previše moćnom i korumpiranom"
  - "Zato što bi država nametnula standarde kvaliteta koji bi podigli cene i ponovo stvorili crna tržišta"
  - "Zato što bi državna regulacija droga kršila međunarodne trgovinske sporazume i diplomatske odnose"
explanation: >-
  Libertarijanci podržavaju liberalizaciju droga, ali insistiraju da se uloga države mora smanjiti, jer je njihov cilj vraćanje individualne odgovornosti, a ne širenje državnog upravljanja. Ako neko postane zavisan, mora preuzeti odgovornost umesto da traži od države da obezbedi brigu. Rešenje za zavisnost leži u privatnoj inicijativi: dobrovoljnoj podršci pojedinaca, porodica i dobrotvornih udruženja. Legalizacija kojom upravlja država protivrečila bi fundamentalnom libertarijanskom principu lične odgovornosti.
