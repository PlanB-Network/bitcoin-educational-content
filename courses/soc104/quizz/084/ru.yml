question: "Что из перечисленного является примером спонтанного порядка, как его описывает Хайек?"
answer: "Язык, который развился органически через исторические взаимодействия, а не был спроектирован интеллектуалами в бюро"
wrong_answers:
  - "Национальная конституция, которая была тщательно составлена избранными представителями для установления социальных правил"
  - "Государственный план стимулирования, который был разработан экономистами для координации экономической деятельности"
  - "Система государственного образования, которая была создана законодателями для обеспечения всеобщего доступа к знаниям"
explanation: >-
  Хайек описывает спонтанный порядок как продукт свободных взаимодействий в обществе, возникающий из человеческого действия, но не из преднамеренного человеческого замысла. Язык — яркий пример: французский, английский и немецкий не были сконструированы интеллектуалами, решавшими правила грамматики, а возникли как плод медленной, органической организации, сложившейся через исторические взаимодействия.
reviewed: false
