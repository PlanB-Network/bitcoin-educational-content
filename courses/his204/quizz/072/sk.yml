question: V akej literárnej forme zaútočil abbé Galiani na fyziokratov a na ich tézu o slobode obchodu s obilím?
answer: Dialóg
wrong_answers:
  - Román
  - Poézia
  - Esej
explanation: |
  Galiani kritizoval fyziokratov vo svojich "Dialogues sur le commerce des blés", diele napísanom vo forme dialógov medzi rôznymi postavami.
