question: "Какво има предимство пред свободата в консервативната политическа философия?"
answer: "Редът и традицията, които трябва да бъдат здраво установени, преди свободата да може да бъде ценена"
wrong_answers:
  - "Социалната справедливост и равенството, които трябва да бъдат гарантирани, преди индивидите да могат да бъдат истински свободни"
  - "Икономическата ефективност и прагматичните резултати, които определят кога свободата е подходяща"
  - "Индивидуалните права на собственост, които трябва да бъдат защитени, преди да бъде предоставена каквато и да е друга свобода"
explanation: >-
  За консерваторите редът и традицията имат предимство пред свободата. Те твърдят, че твърде много свобода поражда хаос и социален безпорядък, така че свободата може да бъде ценена едва след като редът е здраво установен. Това контрастира със социалистическия възглед, който приоритизира справедливостта, или с центристкия фокус върху ефективността.
