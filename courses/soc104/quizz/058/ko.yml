  - "친기업적이라는 것은 규제에 전적으로 반대한다는 뜻인 반면, 친시장적이라는 것은 온건한 규제를 받아들인다는 뜻입니다"
  - "친기업적이라는 것은 국내 산업에 초점을 맞춘다는 뜻인 반면, 친시장적이라는 것은 국제 무역에 초점을 맞춘다는 뜻입니다"
explanation: >-
  중도주의자들은 친기업적인 경향이 있는데, 이는 대기업과 국가 사이의 일종의 동맹을 선호한다는 뜻이며, 친시장적이라는 것과는 다릅니다. 친시장적이라는 것은 국가의 특혜나 기업 보호주의 없이 자유 경쟁을 지지한다는 뜻입니다. 이 구분은 중요합니다. 친기업 정책은 독점과 규제상 보호 장치를 만들어 실제로 자유시장 경쟁을 약화시킬 수 있기 때문입니다.
