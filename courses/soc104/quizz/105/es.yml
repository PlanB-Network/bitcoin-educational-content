question: "Considerando el argumento completo de este curso, ¿cómo encarna Bitcoin simultáneamente la crítica libertaria del constructivismo, el compromiso cypherpunk con la acción y la defensa individualista de la autonomía moral?"
answer: "Bitcoin sustituye el dinero planificado centralmente por un orden de mercado espontáneo (anticonstructivismo), transforma el ideal abstracto de la libertad financiera en código funcional (acción cypherpunk) y restaura la propiedad soberana y la privacidad al individuo (autonomía moral)"
wrong_answers:
  - "Bitcoin usa gobernanza democrática para fijar la política monetaria (anticonstructivismo), publica contenido educativo sobre la libertad financiera (acción cypherpunk) y permite a los individuos votar sobre cambios del protocolo (autonomía moral)"
  - "Bitcoin elimina toda regulación financiera (anticonstructivismo), crea una comunidad de desarrolladores que presionan por la desregulación (acción cypherpunk) y da a los individuos ricos más control sobre la política monetaria (autonomía moral)"
  - "Bitcoin descentraliza la infraestructura de servidores en múltiples países (anticonstructivismo), usa licencias de código abierto para compartir tecnología libremente (acción cypherpunk) y proporciona plataformas de redes sociales anónimas para la disidencia política (autonomía moral)"
explanation: >-
  Bitcoin se sitúa en la intersección de tres tradiciones intelectuales exploradas en el curso. Encarna el argumento anticonstructivista al sustituir el dinero fiat planificado centralmente por un orden monetario espontáneo y descentralizado que ningún planificador central puede controlar. Cumple el imperativo cypherpunk de escribir código al convertir ideales abstractos de libertad financiera y privacidad en tecnología funcional. Y sirve a la defensa individualista de la autonomía moral al permitir la propiedad soberana, proteger los frutos del trabajo y preservar la privacidad, dejando que cada persona sea dueña de su propia vida.
reviewed: false
