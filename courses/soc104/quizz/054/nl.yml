question: "Naar welke bestuursvorm neigt centrisme?"
answer: "Technocratie, waarbij macht wordt toevertrouwd aan experts die de economie en het monetaire beleid sturen"
wrong_answers:
  - "Directe democratie, waarbij burgers stemmen over elke belangrijke beleidsbeslissing"
  - "Aristocratie, waarbij macht berust bij een traditionele heersende klasse"
  - "Laissez-faire-bestuur, waarbij de markt zichzelf reguleert zonder staatsinterventie"
explanation: >-
  Centrisme geeft voorrang aan efficiëntie en pragmatisme en neigt naar technocratie, wat betekent dat macht moet worden toevertrouwd aan experts die de economie sturen en het monetaire beleid leiden. Dit verschilt fundamenteel van directe democratie, aristocratie of laissez-faire, die elk macht volgens volledig andere principes verdelen.
reviewed: false
