question: "Koji zajednički politički cilj imaju levičarski i desničarski etatisti?"
answer: "Da osvoje vlast kako bi organizovali društvo prema svojoj viziji sveta i nametnuli je svima"
wrong_answers:
  - "Da smanje veličinu vlade i vrate moć odlučivanja pojedinačnim građanima"
  - "Da uspostave direktnu demokratiju u kojoj svaki građanin glasa o svakoj zakonodavnoj odluci"
  - "Da ukinu političke partije i zamene ih nezavisnom tehnokratskom upravom"
explanation: >-
  I levi i desni etatisti dele isti politički cilj: osvajanje vlasti kako bi organizovali društvo prema svom pogledu na svet i nametnuli ga svima kroz zakonodavstvo. Razlika je samo u njihovim vrednostima: desnica se poziva na odbranu civilizacije, dok se levica poziva na odbranu radničke klase ili potlačenih. Niko od njih ne nastoji da smanji vladu ili ukine partije.
