question: "دو اصل عدالت جان رالز چیستند؟"
answer: "آزادی برابر برای همه، و اصل تفاوت که نابرابری‌ها را فقط در صورتی مجاز می‌داند که به سود محروم‌ترینان باشد"
wrong_answers:
  - "حق رأی همگانی برای همه شهروندان، و مالیات‌ستانی تصاعدی برای تأمین مالی خدمات عمومی"
  - "آزادی بیان بدون محدودیت، و بازتوزیع اجباری ثروت برای دستیابی به برابری"
  - "حمایت از حقوق مالکیت خصوصی، و اصل عدم تجاوز که بر همه اقدامات دولت اعمال شود"
explanation: >-
  رالز دو اصل پیشنهاد می‌کند: نخست، آزادی برابر برای همه (بنیاد دموکراسی)، و دوم، اصل تفاوت، که نابرابری‌ها را فقط در صورتی مجاز می‌داند که به سود محروم‌ترین اعضای جامعه باشند. این یعنی فرد حق دارد ثروتمند شود، مشروط بر آن‌که بازتوزیع اجازه دهد کم‌برخوردارترینان نیز بهره‌مند شوند. گزینه‌های دیگر عناصر فلسفه‌های سیاسی متفاوت را با هم می‌آمیزند.
