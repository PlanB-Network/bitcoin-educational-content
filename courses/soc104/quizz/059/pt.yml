question: "Que paradoxo oculto existe dentro do pragmatismo centrista?"
answer: "O próprio pragmatismo repousa sobre uma forma de dogmatismo, a saber, a convicção não expressa de que apenas especialistas são competentes para dirigir a sociedade"
wrong_answers:
  - "Centristas afirmam ser moderados, mas se alinham consistentemente com partidos de esquerda em governos de coalizão"
  - "Políticas centristas parecem equilibradas, mas sempre favorecem o crescimento econômico em detrimento da proteção ambiental"
  - "Centristas rejeitam a ideologia, mas adotam princípios rígidos de livre mercado ao tomar decisões econômicas"
explanation: >-
  O paradoxo do pragmatismo centrista é que ele afirma rejeitar a ideologia em favor da expertise racional, mas essa própria afirmação repousa sobre um dogma invisível e não expresso: que apenas tecnocratas são capazes de tomar as decisões certas. Essa convicção de que somente especialistas devem dirigir a sociedade é em si um compromisso ideológico, embora os centristas não a reconheçam como tal.
