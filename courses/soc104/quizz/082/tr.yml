question: "Aşağıdakilerden hangisi Hayek'in tanımladığı kendiliğinden düzene bir örnektir?"
answer: "Entelektüeller tarafından bir büroda tasarlanmaktan ziyade tarihsel etkileşimler yoluyla organik biçimde gelişen dil"
wrong_answers:
  - "Toplumsal kuralları oluşturmak için seçilmiş temsilciler tarafından dikkatle kaleme alınan ulusal anayasa"
  - "Ekonomik faaliyeti koordine etmek için iktisatçılar tarafından tasarlanan bir hükümet teşvik planı"
  - "Bilgiye evrensel erişimi sağlamak için yasa koyucular tarafından oluşturulan kamu eğitim sistemi"
explanation: >-
  Hayek kendiliğinden düzeni, toplumdaki özgür etkileşimlerin ürünü olarak; insan eyleminden doğan fakat bilinçli insan tasarımından doğmayan bir şey olarak tanımlar. Dil bunun başlıca örneğidir: Fransızca, İngilizce ve Almanca, entelektüellerin gramer kurallarını belirlemesiyle inşa edilmemiş, tarihsel etkileşimlerle kurulmuş yavaş, organik bir örgütlenmenin meyvesi olarak ortaya çıkmıştır.
reviewed: false
