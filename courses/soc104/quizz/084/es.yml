question: "¿Cuál es la distinción clave entre ser proempresarial y ser promercado?"
answer: "Los defensores proempresariales buscan la intervención estatal para proteger a empresas específicas del fracaso, mientras que los defensores promercado apoyan la desregulación y permiten que las empresas fracasen para que el mercado pueda reorganizarse naturalmente"
wrong_answers:
  - "Los defensores proempresariales se centran en grandes corporaciones, mientras que los defensores promercado se centran exclusivamente en apoyar a pequeñas empresas y startups"
  - "Ser proempresarial es una postura de izquierda que favorece las cooperativas de trabajadores, mientras que ser promercado es una postura de derecha que favorece la propiedad privada"
  - "Los defensores proempresariales rechazan toda competencia, mientras que los defensores promercado apoyan la competencia regulada por el gobierno entre empresas aprobadas"
explanation: >-
  La postura proempresarial ve la competencia como un instrumento de gobernanza obtenido mediante regulaciones y justifica subsidios y rescates para evitar pérdidas de empleo. En la visión proempresarial, el mercado es frágil y necesita rescate estatal. Los defensores promercado ven la competencia como el resultado natural de la libre empresa, lo que implica desregulación y permitir que las empresas fracasen, porque el fracaso permite al mercado reorganizarse naturalmente y abre espacio a otros actores.
