question: رابطه بین Simplicity و حساب سکوانتِ Gentzen چیست؟
answer: نُه ترکیب‌گر آن، قطعه عطفی-فصلی حساب سکوانت را بازتاب می‌دهند.
wrong_answers:
  - Simplicity مستقیماً از برهان‌های حساب سکوانت به کد اجرایی ترجمه شده بود.
  - حساب سکوانتِ Gentzen در زمان اجرا برای بررسی نوع برنامه‌های Simplicity استفاده می‌شود.
  - آن‌ها کاملاً بی‌ارتباط‌اند و شباهت ظاهری صرفاً تصادفی است.
explanation: >-
  نُه قاعده اصلی Simplicity بسیار شبیه قواعدی در حساب سکوانتِ Gentzen هستند،
  مشابه تناظر Curry-Howard بین حساب لامبدا و استنتاج طبیعی. این ارتباط تضمین می‌کند که
  نوع‌ها در مقدمات کوچک‌تر از نتیجه‌ها هستند؛ چیزی که Bit
  Machine از آن برای اجرای کارآمد با حداقل کپی‌کردن داده بهره می‌برد.
reviewed: false
