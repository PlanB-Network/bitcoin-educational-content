question: "自由意志主义者如何看待私有财产与自由之间的关系？"
answer: "私有财产是一项先于法律和国家存在的自然权利，并且正是自由的基础"
wrong_answers:
  - "私有财产是由国家创造的一种社会约定，当它造成不平等时可以被撤销"
  - "私有财产有助于经济效率，但没有内在的道德或哲学意义"
  - "私有财产只应存在于个人物品中，而不应存在于生产性资产或土地中"
explanation: >-
  自由意志主义者把私有财产捍卫为一项先于法律和国家存在的自然权利。他们认为，如果一个人拥有自己的身体，他也就拥有自己的劳动以及劳动果实。对物质财产的所有权是自我所有权的延伸。这与 libertaire 观点形成鲜明对比，后者认为财产是一种社会约定或压迫来源。
reviewed: false
