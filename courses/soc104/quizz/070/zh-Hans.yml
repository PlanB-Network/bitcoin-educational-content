question: "社会主义者在医疗保健问题上的立场是什么？"
answer: "获得医疗保健是一项基本权利，国家必须为所有人保障一个普遍的、由公共资金资助的体系，而不论收入如何"
wrong_answers:
  - "医疗保健应当是一个混合体系，由国家提供基本保障，并以私人保险选项作为补充"
  - "私人市场能提供更具创新性的医疗保健，因此个人应自由选择自己的体系"
  - "国家应当只为最贫困的公民提供医疗保健，而私人保险覆盖其他所有人"
explanation: >-
  对社会主义者而言，获得医疗保健是一项基本权利，而不是一种商品。国家必须保障一个普遍的、由公共资金资助的医疗保健体系，使每个人都能获得照护，而不论收入如何。这反映了社会主义者对平等、社会正义以及国家在公共利益中组织服务的重要性的关注。混合体系描述的是中间主义观点，而基于选择的方法反映了自由意志主义和保守主义立场。
reviewed: false
