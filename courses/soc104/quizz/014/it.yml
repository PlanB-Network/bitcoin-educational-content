question: "Quali figure emblematiche sono associate alla massima libertà economica nel diagramma di Nolan?"
answer: "Margaret Thatcher, Ronald Reagan e Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures e Bernie Sanders"
  - "Nelson Mandela, Simone Veil e Noam Chomsky"
  - "Vladimir Putin, Xi Jinping e Joseph de Maistre"
explanation: >-
  Thatcher, Reagan e Milei sono citati come figure emblematiche della massima libertà economica, favorevoli a meno intervento statale, meno regolamenti e tasse più basse. Roosevelt, Jaures e Sanders rappresentano l'estremo opposto, favorevole al controllo statale dell'economia. Mandela, Veil e Chomsky rappresentano la massima libertà personale. Putin, Xi Jinping e de Maistre rappresentano il massimo controllo statale sulla vita personale.
reviewed: false
