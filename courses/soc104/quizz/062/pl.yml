question: "W jaki sposób wszystkie reżimy totalitarne dochodziły do władzy?"
answer: "Poprzez brutalną rewolucję, która uzasadniała całkowite wymazanie poprzedniego systemu"
wrong_answers:
  - "Poprzez stopniową reformę ustawodawczą w ramach istniejących instytucji demokratycznych"
  - "Poprzez wojskowe zamachy stanu organizowane przez obce mocarstwa dążące do kontroli regionalnej"
  - "Poprzez pokojowe ruchy masowe, które wygrywały wybory powszechne dużą przewagą"
explanation: >-
  Wszystkie reżimy totalitarne dochodziły do władzy poprzez brutalną rewolucję. Rewolucja ta spełnia podwójną funkcję: fizycznie niszczy stary porządek i ideologicznie uzasadnia użycie przemocy jako konieczne do budowy nowego społeczeństwa. Odróżnia to totalitarne przejęcia władzy od demokratycznych przemian, zamachów stanu wspieranych z zagranicy czy pokojowych zwycięstw wyborczych.
