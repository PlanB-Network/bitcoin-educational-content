question: "保守主義如何看待經濟與社會領域中的自由？"
answer: "經濟領域中的自由強，但社會領域中的自由弱"
wrong_answers:
  - "經濟與社會領域中的自由都弱，以維持傳統社會秩序"
  - "社會領域中的自由強，但經濟領域中的自由弱"
  - "兩個領域中的自由都平等且不受限制，政府任何形式的干預都最少"
explanation: >-
  保守主義呈現一種二分，正是社會主義的鏡像。在經濟領域，保守主義者捍衛自由市場、創業精神與私有財產。在社會領域，限制則以保存傳統道德規範與社會穩定為理由。第三個錯誤答案描述的是社會主義模式，與此相反。
reviewed: false
