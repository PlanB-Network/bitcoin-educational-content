question: "Dlaczego libertariańskie stanowisko w sprawie legalizacji narkotyków wiąże się z warunkiem ograniczenia roli państwa w społeczeństwie?"
answer: "Ponieważ liberalizacja przejęta przez państwo zastąpiłaby indywidualną odpowiedzialność opieką zarządzaną przez rząd, podczas gdy libertarianie chcą, by obywatele ponosili konsekwencje swoich wyborów przy wsparciu prywatnych stowarzyszeń"
wrong_answers:
  - "Ponieważ legalizacja kontrolowana przez państwo generowałaby zbyt duże wpływy podatkowe, czyniąc rząd nadmiernie potężnym i skorumpowanym"
  - "Ponieważ państwo narzuciłoby standardy jakości, które podniosłyby ceny i odtworzyły czarne rynki"
  - "Ponieważ rządowa regulacja narkotyków naruszałaby międzynarodowe umowy handlowe i relacje dyplomatyczne"
explanation: >-
  Libertarianie popierają liberalizację narkotyków, ale podkreślają, że rola państwa musi zostać ograniczona, ponieważ ich celem jest przywrócenie indywidualnej odpowiedzialności, a nie rozszerzenie zarządzania przez państwo. Jeśli ktoś popada w uzależnienie, musi wziąć odpowiedzialność zamiast prosić państwo o zapewnienie opieki. Rozwiązanie problemu uzależnienia leży w inicjatywie prywatnej: dobrowolnym wsparciu ze strony jednostek, rodzin i stowarzyszeń dobroczynnych. Legalizacja zarządzana przez państwo przeczyłaby fundamentalnej libertariańskiej zasadzie osobistej odpowiedzialności.
