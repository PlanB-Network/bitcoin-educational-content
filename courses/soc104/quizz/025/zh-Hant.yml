question: "Ron Paul 如何用毒品使用與墮胎等議題說明 paleo-libertarian 立場？"
answer: "他個人建議不要使用毒品並反對墮胎，但在政治上反對聯邦禁令，並主張選擇應留給個人或各州"
wrong_answers:
  - "他支持以絕對個人權利之名，在聯邦層級使所有毒品與墮胎合法化"
  - "他基於個人道德信念，主張對毒品與墮胎實施嚴格的聯邦禁令"
  - "他拒絕對這些議題表達任何個人意見，認為政治人物應保持道德中立"
explanation: >-
  Ron Paul 透過區分個人道德信念與政治強制，體現了 paleo-libertarian 的綜合。他始終建議不要使用毒品，但同時反對禁毒。他個人反對墮胎，卻主張這一選擇應留給各州，而不是由上而下強加。這說明一個人可以持有強烈的傳統價值觀，同時拒絕使用聯邦政府的強制權力來執行這些價值觀。
reviewed: false
