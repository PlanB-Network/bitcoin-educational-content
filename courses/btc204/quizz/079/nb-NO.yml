question: Hvilket uttrykk beskriver beskyttelsen som tilbys av en coinjoin mot analysen av en mynts fremtidige transaksjoner?

answer: Fremtidig anonset.

wrong_answers:
  - Tilbakevirkende anonset.
  - Sporbarhetsmotstand.
  - Tidsmessig personvern.

explanation: |
  Beskyttelsen mot analyse fra fortiden til nåtiden er det som kalles det fremtidige anonset.
reviewed: false
