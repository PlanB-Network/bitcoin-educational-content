question: "Bitcoin 挑战了福利国家的哪三大支柱？"
answer: "财政体系、通过债务为支出融资的货币垄断，以及为阻止使用替代货币而进行的交易监控"
wrong_answers:
  - "军事预算、公共教育体系，以及政府控制的医疗基础设施"
  - "司法系统、立法过程，以及行政部门对企业监管的执行"
  - "社会保障体系、最低工资立法，以及累进所得税结构"
explanation: >-
  Bitcoin 挑战了福利国家赖以存在的三大支柱。第一，是不足以覆盖支出的财政体系。第二，是货币垄断，即通过发行货币来以债务为支出融资的能力。第三，是交易监控，即阻止人们使用国家强加的法定货币之外任何货币的能力。Bitcoin 同时削弱了这三者。
reviewed: false
