question: "Kuidas erineb libertaarne vabadusekäsitus tsentristlikust käsitusest?"
answer: "Libertaarid käsitlevad vabadust tingimusteta aksioomina, samas kui tsentristid kaitsevad vabadusi oportunistlikult sõltuvalt kontekstist ja tõhususest"
wrong_answers:
  - "Libertaarid lubavad riigil vabadust valikuliselt kaitsta, samas kui tsentristid lükkavad tagasi igasuguse riigi osaluse individuaalsete õiguste kaitsmisel"
  - "Libertaarid keskendavad vabaduse ainult majandusküsimustele, samas kui tsentristid rakendavad vabadust laialt sotsiaalsetes ja kultuurilistes valdkondades"
  - "Libertaaridel ja tsentristidel on sama arusaam vabadusest, kuid nad ei nõustu valitsuse suuruses, mida on vaja selle jõustamiseks"
explanation: >-
  Libertaarid määratlevad vabadust üldise, tingimusteta põhimõttena, mis toimib aksioomina. Tsentristid seevastu kaitsevad teatud vabadusi oportunistlikul ja kontekstuaalsel viisil, rakendamata ühtegi üldist põhimõtet. Tsentristlik lähenemine paljastab instrumentaalse vabadusekäsituse, mis on alati allutatud pragmaatilistele eesmärkidele nagu tõhusus, mille libertaarid põhimõtteliselt tagasi lükkavad.
