question: "个人自由类别包含什么？"
answer: "你在私人关系中做什么、你的观点与信念，以及一切涉及你自己身体与心智的事项"
wrong_answers:
  - "你作为生产者所做的事，包括创办企业、雇用员工与交易商品"
  - "你缴多少税、做哪些投资，以及如何管理你的金融资产"
  - "你在市场中竞争、为产品定价，以及选择供应商的能力"
explanation: >-
  个人自由涵盖你在私人关系中做什么、你的观点与信念，以及一切涉及你自己身体与心智的事项。这包括婚姻、阅读选择、宗教实践、食物与药物选择，以及你与谁交往。商业活动、税收与市场决策属于经济自由。
reviewed: false
