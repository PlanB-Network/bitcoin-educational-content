question: Cine l-a numit pe Cantillon fondatorul economiei?
answer: Murray Rothbard
wrong_answers:
  - Joseph A. Schumpeter
  - Mark Blaug
  - Adam Smith
explanation: |
  Murray Rothbard, un economist al școlii austriece, l-a numit pe Richard Cantillon fondatorul economiei datorită abordării sale inovatoare și a contribuțiilor sale importante la teoria economică.
