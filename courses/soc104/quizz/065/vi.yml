question: "Vì sao các chế độ toàn trị được mô tả là 'tôn giáo thế tục', và điều này cho thấy gì về các điều kiện cần thiết để chủ nghĩa toàn trị tồn tại?"
answer: "Chúng đòi hỏi từ những người hoạt động một niềm tin gần như tôn giáo và dùng nỗi sợ đối với đối thủ, và chủ nghĩa toàn trị đòi hỏi đồng thời tất cả các đặc điểm: các quyền tự do bị đàn áp, cai trị độc đảng, cách mạng bạo lực, và một nền kinh tế được định hướng"
wrong_answers:
  - "Chúng thay thế thờ phụng truyền thống bằng nghi lễ nhà nước, và chủ nghĩa toàn trị chỉ cần một lãnh tụ có sức lôi cuốn cùng sự kiểm soát quân sự"
  - "Chúng dùng các thiết chế tôn giáo để thực thi ý thức hệ nhà nước, và chủ nghĩa toàn trị có thể xuất hiện bất cứ khi nào một đảng chính trị duy nhất thống trị nghị viện"
  - "Chúng hứa hẹn sự cứu rỗi tinh thần thông qua hành động chính trị, và chủ nghĩa toàn trị tồn tại bất cứ khi nào nhà nước kiểm soát nền kinh tế bất kể các quyền tự do chính trị"
explanation: >-
  Raymond Aron quan sát rằng các chế độ toàn trị vận hành theo hai nguyên tắc: niềm tin của những người hoạt động và nỗi sợ của các đối thủ. Sự cuồng tín gần như tôn giáo này đặc trưng cho chúng, vượt lên trên các động cơ khác nhau của chúng, khiến chúng được gọi là các tôn giáo thế tục. Điều then chốt là chủ nghĩa toàn trị đòi hỏi đồng thời tất cả các đặc điểm định nghĩa: các quyền tự do bị đàn áp, thẩm quyền vô giới hạn thông qua một đảng duy nhất, cách mạng bạo lực, và một nền kinh tế được định hướng. Các nền dân chủ hiện đại có thể biểu hiện một số đặc điểm này, nhưng chủ nghĩa toàn trị chỉ hiện diện khi tất cả chúng được tập hợp lại với nhau.
