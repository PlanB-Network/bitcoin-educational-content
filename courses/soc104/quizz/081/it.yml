question: "Perché la previsione di Molinari del 1849 si rivelò profetica riguardo al rapporto tra libertà e potere politico?"
answer: "Perché conservatori e socialisti si sono alternati al potere e hanno strumentalizzato la libertà al servizio dei rispettivi obiettivi politici, esattamente come egli descriveva"
wrong_answers:
  - "Perché il personaggio dell'economista che descrisse alla fine conquistò il potere politico e attuò politiche libertarie in tutta Europa"
  - "Perché la sua previsione che tutte e tre le famiglie politiche si sarebbero fuse in un unico movimento centrista si avverò nel ventesimo secolo"
  - "Perché la libertà fu gradualmente ampliata dai governi successivi fino a diventare il principio organizzativo primario delle democrazie moderne"
explanation: >-
  La visione di Molinari si rivelò profetica perché, dalla metà dell'Ottocento, conservatori e socialisti si sono alternati al potere e hanno realizzato precisamente ciò che egli descriveva: la strumentalizzazione della libertà al servizio di obiettivi politici. Entrambe le famiglie sono disposte a restringere le libertà e a invocare lo Stato per imporre le rispettive agende, mentre la posizione dell'economista a favore della libertà incondizionata rimase marginalizzata.
reviewed: false
