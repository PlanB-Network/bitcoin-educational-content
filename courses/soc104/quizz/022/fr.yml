question: "Qu'est-ce que le conservatisme politique ?"
answer: "Une idéologie qui vise à préserver les institutions politiques établies et l'ordre social, en s'opposant aux grands bouleversements structurels"
wrong_answers:
  - "Un engagement personnel envers les valeurs familiales traditionnelles et les pratiques religieuses, sans chercher à les imposer aux autres"
  - "Une philosophie qui favorise le changement social rapide par la réforme démocratique et la législation progressiste"
  - "Une théorie économique qui défend les marchés libres, une fiscalité minimale et l'abolition des barrières commerciales"
explanation: >-
  Le conservatisme politique est une idéologie, souvent représentée dans des partis de droite ou d'extrême droite, qui vise à préserver les institutions politiques établies et l'ordre social tout en s'opposant aux grands bouleversements structurels. Ses partisans souhaitent utiliser le pouvoir et la loi pour protéger leur héritage. Cela diffère du conservatisme culturel, qui est un choix de vie personnel plutôt qu'un programme politique.
