  - "open societies අධික economic inequality ඉඩදෙන බැවින්, එය අවශ්‍යයෙන්ම revolution සහ authoritarian regimes ස්ථාපනය වෙත මඟ පාදන නිසා"
explanation: >-
  open society හි fragility එක psychological vulnerability එකකින් පැන නගින බව Popper අවධාරණය කරයි. individualism ඇඟවුම් කරන responsibility බියජනක සහ risky ලෙස පෙනිය හැක, මන්ද පුද්ගලයාට තමන්ගේම choices කිරීමටත් fail වීමටත් සිදු වන නිසාය. මෙය communal protection තුළ හෝ idealized past එකකට nostalgic tendencies තුළ refuge සෙවීමට temptation නිර්මාණය කරයි. open society communitarian impulses සහ violence පිළිබඳ නැවත නැවත මතුවන temptation වෙතින් ongoing challenges මුහුණ දෙයි.
