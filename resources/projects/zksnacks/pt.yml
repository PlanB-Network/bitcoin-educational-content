description: |
  O "zk" em zkSNACKs significa conhecimento zero, o que significa que não coletamos e não podemos coletar nenhuma informação pessoal do usuário em nossos produtos.

  A zkSNACKs encerrou o seu coordenador de coinjoin em 1 de junho de 2024, e o seu site está offline. A Wasabi Wallet continua como software de código aberto.
