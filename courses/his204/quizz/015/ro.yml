question: Sub ce titlu și-a republicat Boisguilbert lucrarea Détail de la France în 1696?
answer: Franța ruinată sub domnia lui Ludovic al XIV-lea, de către cine și cum, cu mijloacele pentru a o restabili
wrong_answers:
  - Franța ruinată sub domnia lui Ludovic al XIV-lea, de ce și cum, cu cifre justificative
  - Franța divizată în timpul domniei lui Ludovic al XIV-lea, de care facțiuni și de ce, și cum să fie unificată din nou
  - Franța prosperă sub domnia lui Ludovic al XIV-lea, datorită cui și cum, cu exemple concrete
explanation: |
  Titlul complet al republicării lucrării sale din 1696 este într-adevăr „La France ruinée sous le règne de Louis XIV, par qui et comment, avec les moyens de la rétablir”. Acest titlu reflectă critica virulentă a lui Boisguilbert la adresa politicii economice a lui Ludovic al XIV-lea.
