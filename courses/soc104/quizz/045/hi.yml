question: "समाजवादी दर्शन के संदर्भ में 'holism' शब्द का क्या अर्थ है?"
answer: "समाज को एक अविभाज्य समग्र के रूप में देखने की दृष्टि, जहाँ सामूहिकता व्यक्ति पर प्रधानता रखती है"
wrong_answers:
  - "एक ऐसा दर्शन जो प्रत्येक व्यक्ति को अपने में पूर्ण इकाई मानता है, जिसके अधिकारों को कोई भी समूह रद्द नहीं कर सकता"
  - "एक आर्थिक सिद्धांत जो सार्वजनिक और निजी क्षेत्रों को समान मात्रा में संतुलित करने की वकालत करता है"
  - "एक राजनीतिक रणनीति जो सभी अल्पसंख्यक दृष्टिकोणों को एक अकेले सहमति-आधारित मंच में समाहित करती है"
explanation: >-
  Holism ग्रीक 'holos' से आता है, जिसका अर्थ 'the whole' है। समाजवादी चिंतन में, यह समाज को व्यक्तियों के सरल योग के बजाय एक अविभाज्य समग्र के रूप में देखने की दृष्टि को संदर्भित करता है। समाजवादी राज्य मानव गतिविधि को अधिकतम स्तर तक अपने हाथ में लेने और निर्देशित करने का लक्ष्य रखता है। इस सामूहिकता को सामाजिक वर्ग, राष्ट्र, नस्ल या लिंग के रूप में प्रस्तुत किया जा सकता है, लेकिन प्रत्येक मामले में व्यक्ति को समूह-सदस्यता से परिभाषित किया जाता है।
reviewed: false
