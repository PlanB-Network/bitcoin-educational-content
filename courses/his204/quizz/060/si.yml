question: ආර්ථික නිදහසේ ආරක්ෂකයන් වූ Physiocrats, ප්‍රජාතන්ත්‍රවාදය ගැන විශාල සැකකරුවන් ලෙස රැඳී සිටියේ ඇයි?
answer: ප්‍රජාතන්ත්‍රවාදය බහුතරය විසින් සුළුතරය වහල්භාවයට පත් කිරීමක් විය හැක
wrong_answers:
  - රාජාණ්ඩුව ප්‍රජාතන්ත්‍රවාදයට වඩා අඩු වියදම් සහිතය
  - Physiocratsගේ පිරිසට රජුගේ රාජ සභාවේ උසස් තනතුරු දැරූ සාමාජිකයන් කිහිප දෙනෙක් ඇතුළත් වූහ
  - ජනතාව දැනුවත් තීරණ ගැනීමට තරම් අඥාන යැයි ඔවුන් සිතුවා
explanation: |
  Physiocrats බිය වූයේ ප්‍රජාතන්ත්‍රවාදය බහුතරයේ අත්තනෝමතික පාලනයකට තුඩු දෙනු ඇති බවටය, එහිදී සුළුතරයේ අවශ්‍යතා බහුතරයේ ප්‍රයෝජනය සඳහා බිලි දෙනු ඇත. ඔවුන් තාර්කික තීරණ ගැනීමට සහ සියලු දෙනාගේ අයිතිවාසිකම් ආරක්ෂා කිරීමට හැකි ප්‍රබුද්ධ පාලනයක් වඩාත් කැමති වූහ.