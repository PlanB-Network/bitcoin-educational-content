question: V akom odvetví podniká Dupont de Nemours et Cie, spoločnosť založená synom francúzskeho ekonóma?
answer: Chémia a biológia
wrong_answers:
  - Bankovníctvo a poisťovníctvo
  - Textil
  - Potravinársky priemysel
explanation: |
  Dupont de Nemours je chemická a biologická spoločnosť, ktorú založil syn ekonóma Pierra-Samuela Duponta de Nemours.
