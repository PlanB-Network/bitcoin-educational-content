question: Turgotට Diderotගේ සහාය ලැබුණේ කුමන ප්‍රශ්නයේදීද?
answer: වැඩ කිරීමේ නිදහස සහ ගිල්ඩ් අහෝසි කිරීම
wrong_answers:
  - ධාන්‍ය වෙළඳාමේ නිදහස
  - පොලී සහිත ණයවල නිදහස
  - අධ්‍යාපන ප්‍රතිසංස්කරණය
explanation: |
  Diderot ශ්‍රම නිදහස සහ ගිල්ඩ් අහෝසි කිරීම පිළිබඳ ප්‍රශ්නයේදී Turgotට සහාය දුන්නේය. මෙම පියවර ආර්ථිකය උත්තේජනය කිරීමට සහ සමාජ ප්‍රගතිය ප්‍රවර්ධනය කිරීමට අවශ්‍ය බව ඔහු විශ්වාස කළේය.
