question: "자유지상주의자들은 자신들의 정치 철학의 중심에 무엇을 두나요?"
answer: "윤리와 법"
wrong_answers:
  - "경제 성장과 부의 창출"
  - "사회적 평등과 집단적 복지"
  - "국가 정체성과 문화 보존"
explanation: >-
  자유지상주의자들은 경제가 아니라 윤리와 법을 자신들의 철학 중심에 둔다는 점에서 다른 모든 정치 계열과 구별됩니다. 그들이 시장경제를 옹호할 때, 이는 부를 생산하는 능력 때문이라기보다 개인의 자유와 책임을 촉진하기 때문입니다. 경제 성장은 부차적 이익이지, 근본 원칙이 아닙니다.
reviewed: false
