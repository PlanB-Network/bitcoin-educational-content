question: Ni irihe tandukaniro riri hagati y’amategeko ya consensus n’amategeko ya relay?
answer: Consensus igena ivyemewe, relay ikagena ikwiragizwa rya transactions
wrong_answers:
  - Consensus igena amafaranga y’ikiguzi, relay igena aderesi
  - Consensus igenzura Blockchain, relay igenzura impfunguruzo z’ibanga
  - Consensus ihitamwo miners, relay ihitamwo abadandaza
explanation: |
  Amategeko ya consensus ni yo agena ikintu cemewe muri Bitcoin.
  Amategeko ya relay yo agenga uburyo transactions zunguruzwa hagati ya nodes mu rubuga.
reviewed: true
