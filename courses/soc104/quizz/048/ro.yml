question: "Cum a caracterizat Michael Oakeshott conservatorismul în opera sa filosofică?"
answer: "Ca temperament și dispoziție față de viață, mai degrabă decât ca ideologie sistematică rigidă"
wrong_answers:
  - "Ca teorie economică cuprinzătoare, cu prescripții de politică precise pentru fiecare domeniu al guvernării"
  - "Ca mișcare revoluționară care caută să demonteze instituțiile moderne și să revină la societatea preindustrială"
  - "Ca doctrină pur religioasă întemeiată pe teologia creștină și autoritatea ecleziastică"
explanation: >-
  Michael Oakeshott, un filosof britanic, a apărat o concepție a conservatorismului ca temperament, mai degrabă decât ca ideologie sistematică. Eseul său On Being Conservative (1956) rămâne o referință esențială. Această viziune asupra conservatorismului ca dispoziție l-a influențat și pe Friedrich Hayek. Abordarea lui Oakeshott este remarcabilă prin critica raționalismului în politică, respingând ideea că politica poate fi redusă la un sistem.
