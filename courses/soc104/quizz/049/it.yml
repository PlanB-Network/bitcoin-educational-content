question: "Che cosa distingue i neoconservatori dai paleoconservatori nel loro approccio alla politica estera?"
answer: "I neoconservatori giustificano l'interventismo militare per diffondere la democrazia, mentre i paleoconservatori difendono una politica estera più isolazionista"
wrong_answers:
  - "I neoconservatori si oppongono a ogni azione militare e favoriscono la diplomazia, mentre i paleoconservatori sostengono attacchi preventivi contro potenziali minacce"
  - "I neoconservatori si concentrano esclusivamente sulle sanzioni economiche, mentre i paleoconservatori sostengono la costruzione di coalizioni internazionali per operazioni militari congiunte"
  - "Neoconservatori e paleoconservatori concordano sulla politica estera ma divergono nettamente sulla regolazione economica interna"
explanation: >-
  Dagli anni 2000 in poi, i neoconservatori divennero sempre più coinvolti nel giustificare l'interventismo militare per impiantare la democrazia nel mondo, in particolare dopo l'11 settembre 2001. In reazione, i conservatori tradizionali rivendicarono l'etichetta di 'paleoconservatore' per distinguersi. I paleoconservatori criticano l'interventismo militare, difendono una politica estera più isolazionista e pongono maggiore enfasi sull'identità nazionale e culturale.
