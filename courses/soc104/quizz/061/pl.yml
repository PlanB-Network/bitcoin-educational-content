question: "Co deklaracja Mussoliniego z 1920 roku: „Wszystko w Państwie, nic poza Państwem, nic przeciwko Państwu” ujawnia o totalitaryzmie?"
answer: "Nie ma już żadnego rozdziału między przestrzenią publiczną a prywatną, ponieważ państwo całkowicie pochłania społeczeństwo"
wrong_answers:
  - "Państwo koncentruje się wyłącznie na sile militarnej, pozostawiając gospodarkę prywatnym przedsiębiorstwom"
  - "Obywatele mogą swobodnie organizować się prywatnie, o ile otwarcie nie krytykują rządu"
  - "Rząd kontroluje tylko działalność polityczną, podczas gdy życie kulturalne i religijne pozostają autonomiczne"
explanation: >-
  Deklaracja Mussoliniego ujmuje istotę totalitaryzmu: totalność. Wszystko zostaje wchłonięte przez państwo, co oznacza, że nie ma rozdziału między przestrzenią publiczną a prywatną. Społeczeństwo traci wszelką formę autonomii, aż po najbardziej zwyczajne czynności, takie jak założenie klubu sportowego. Wykracza to daleko poza kontrolę jedynie sfery militarnej, politycznej czy gospodarczej.
reviewed: false
