question: "哪些標誌性人物與 Nolan diagram 上的最大經濟自由相關？"
answer: "Margaret Thatcher、Ronald Reagan 與 Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt、Jean Jaures 與 Bernie Sanders"
  - "Nelson Mandela、Simone Veil 與 Noam Chomsky"
  - "Vladimir Putin、Xi Jinping 與 Joseph de Maistre"
explanation: >-
  Thatcher、Reagan 與 Milei 被列為最大經濟自由的標誌性人物，他們偏好更少的國家干預、更少的管制與更低的稅收。Roosevelt、Jaures 與 Sanders 代表相反端點，偏好國家控制經濟。Mandela、Veil 與 Chomsky 代表最大個人自由。Putin、Xi Jinping 與 de Maistre 代表對個人生活的最大國家控制。
reviewed: false
