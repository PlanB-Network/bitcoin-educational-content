question: "Ikibanza c'abasosiyalisite ku buvuzi ni ikihe?"
answer: "Kuronka ubuvuzi ni uburenganzira shingiro, kandi Leta itegerezwa kwemeza uburyo rusangi bw'ubuvuzi burihwa n'amahera ya Leta kuri bose hatitawe ku mafaranga binjiza"
wrong_answers:
  - "Ubuvuzi bukwiye kuba uburyo buvanze bufise ubwishingizi shingiro bwa Leta bwunganirwa n'uburyo bw'ubwishingizi bw'abikorera"
  - "Amasoko yigenga atanga ubuvuzi burimwo udushasha twinshi, rero abantu bakwiye kwihitiramwo uburyo bwabo bidegemvya"
  - "Leta ikwiye gutanga ubuvuzi ku banyagihugu bakennye kuruta abandi gusa mu gihe ubwishingizi bw'abikorera bupfuka abandi bose"
explanation: >-
  Ku basosiyalisite, kuronka ubuvuzi ni uburenganzira shingiro, si ikidandazwa. Leta itegerezwa kwemeza uburyo rusangi bw'ubuvuzi burihwa n'amahera ya Leta kugira umuntu wese ashobore kuronka ukwitwararikwa, hatitawe ku mafaranga yinjiza. Ivyo vyerekana impungenge z'abasosiyalisite ku buringanire, ubutungane bw'ikibano, n'akamaro ka Leta mu gutunganya ibikorwa mu nyungu rusangi. Uburyo buvanze budondora iciyumviro c'abari hagati, mu gihe uburyo bushingiye ku guhitamwo bwerekana ibibanza vy'aba-libertarian n'abakonservateur.
