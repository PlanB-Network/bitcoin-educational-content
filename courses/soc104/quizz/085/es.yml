question: "¿Cómo constituyen juntas las tres funciones esenciales del mercado libre, según las describen los libertarios, un sistema de organización social eficiente y ético?"
answer: "Los precios proporcionan una brújula para las decisiones, el mercado revela preferencias auténticas mediante la oferta y la demanda, y el intercambio libre permite a los individuos determinar sus propios asuntos según sus valores personales, combinando eficiencia informacional con autonomía moral"
wrong_answers:
  - "El mercado maximiza la riqueza total, previene los monopolios mediante la competencia natural y garantiza una distribución igual de los recursos, combinando productividad con justicia social"
  - "Los mercados libres reducen el gasto público, estimulan la innovación tecnológica y crean oportunidades de empleo, combinando responsabilidad fiscal con crecimiento económico"
  - "Los mercados bajan los precios al consumidor, aumentan la calidad de los productos mediante la competencia y expanden el comercio internacional, combinando prosperidad nacional con cooperación global"
explanation: >-
  El argumento libertario a favor del mercado libre descansa en tres funciones interconectadas. Primero, los precios sirven como indicadores fiables que guían las decisiones económicas y sociales (la brújula). Segundo, el mercado revela preferencias individuales auténticas mediante la oferta y la demanda. Tercero, el intercambio libre permite a los actores determinar sus propios asuntos según valores personales. Hayek mostró que los mercados libres coordinan la información dispersa mejor que la planificación central (eficiencia), mientras que el consentimiento mutuo respeta la dignidad humana más que la coacción (justicia).
