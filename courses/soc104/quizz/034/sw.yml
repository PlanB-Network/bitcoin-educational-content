question: "Kanuni ya kutoanzisha uchokozi kama ilivyofafanuliwa kinadharia na Murray Rothbard ni nini?"
answer: "Si halali kuanzisha nguvu ya kimwili dhidi ya mtu mwingine au mali yake, ingawa vurugu za kujihami zinaruhusiwa"
wrong_answers:
  - "Aina zote za vurugu daima ni makosa, ikijumuisha kujilinda na kupinga ukandamizaji"
  - "Vurugu inakubalika inapolenga taasisi kandamizi lakini kamwe si dhidi ya watu wengine binafsi"
  - "Dola pekee ndiyo ina haki halali ya kutumia nguvu, na watu binafsi hawapaswi kamwe kutumia vurugu"
explanation: >-
  Kanuni ya Rothbard ya kutoanzisha uchokozi hushikilia kwamba kuanzisha nguvu ya kimwili dhidi ya mtu mwingine au mali yake si halali. Ni tafsiri ya kifalsafa ya kanuni ya dhahabu. Hata hivyo, haikatazi vurugu zote: vurugu za kujihami, ikijumuisha kujilinda na kupinga ukandamizaji, huchukuliwa kuwa halali. Hili huitofautisha na upacifisti safi na dai la dola la ukiritimba juu ya nguvu.
