question: "Hvorfor beskrives monetær inflasjon som en skjult skatt pålagt uten borgernes samtykke?"
answer: "Fordi statlig pengeskaping devaluerer valutaen slik at folk kan kjøpe mindre med samme beløp, men de fleste innser ikke at stigende priser gjenspeiler statlig politikk snarere enn naturlige markedskrefter"
wrong_answers:
  - "Fordi sentralbanker hemmelig belaster gebyrer på hver transaksjon som behandles gjennom banksystemet uten å opplyse kontoinnehaverne om det"
  - "Fordi myndigheter trykker penger og distribuerer dem bare til velstående personer, mens de skattlegger fattige gjennom høyere omsetningsavgifter på nødvendige varer"
  - "Fordi inflasjon skyldes at private selskaper øker prisene for å øke profitten, noe som fungerer som en uoffisiell skatt på forbrukere"
explanation: >-
  Injeksjonen av penger i systemet oversettes til valutadevaluering, der samme beløp kjøper mindre fordi de nye pengene ikke gjenspeiler ekte økonomisk vekst. De fleste ser ikke at statlig politikk førte til stigende priser, som ganske enkelt er uttrykket for valutadevaluering. Dette utgjør lovlig tyveri og institusjonalisert plyndring, og gjør middelklassen fattigere mens de velstående fanger opp nye penger gjennom spekulative aktiva.
