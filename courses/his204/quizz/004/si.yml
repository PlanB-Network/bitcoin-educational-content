question: Colbertගේ ශිෂ්‍යයන්ට අනුව, වාණිජය සදාකාලික යුද්ධයක් වන්නේ ඇයි?
answer: ජාතීන්ට ධනවත් විය හැක්කේ එකිනෙකාගේ වියදමෙන් පමණි
wrong_answers:
  - වෙළඳාමට සහාය දැක්වීමට යුධ නෞකා අවශ්‍ය වේ
  - යුද්ධ කාලවලදී වෙළඳාම වඩාත්ම සමෘද්ධිමත් වේ
  - වෙළඳාම සම්පත් සඳහා නිරන්තර තරඟයකි
explanation: |
  වණිජවාදී දැක්ම තුළ, ලෝකයේ ධනය ස්ථාවර ප්‍රමාණයක් ලෙස සැලකේ. එබැවින් එක් ජාතියක ධනවත් වීම අනිවාර්යයෙන්ම අනෙකුත් ජාතීන්ගේ වියදමෙන් සිදුවේ. එයින් ස්ථිර "ආර්ථික යුද්ධයක්" පිළිබඳ අදහස මතු වේ.
