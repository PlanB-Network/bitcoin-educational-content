question: "लिबर्टेरियन द्वारा वर्णित मुक्त बाज़ार के तीन आवश्यक कार्य मिलकर सामाजिक संगठन की एक दक्ष और नैतिक प्रणाली कैसे बनाते हैं?"
answer: "कीमतें निर्णयों के लिए एक दिशासूचक प्रदान करती हैं, बाज़ार आपूर्ति और मांग के माध्यम से प्रामाणिक प्राथमिकताओं को प्रकट करता है, और मुक्त विनिमय व्यक्तियों को अपने व्यक्तिगत मूल्यों के अनुसार अपने मामलों का निर्धारण करने देता है, जिससे सूचनात्मक दक्षता नैतिक स्वायत्तता के साथ जुड़ती है"
wrong_answers:
  - "बाज़ार कुल संपत्ति को अधिकतम करता है, प्राकृतिक प्रतिस्पर्धा के माध्यम से एकाधिकारों को रोकता है, और संसाधनों का समान वितरण सुनिश्चित करता है, जिससे उत्पादकता सामाजिक न्याय के साथ जुड़ती है"
  - "मुक्त बाज़ार सरकारी खर्च कम करते हैं, तकनीकी नवाचार को प्रोत्साहित करते हैं, और रोजगार अवसर पैदा करते हैं, जिससे वित्तीय जिम्मेदारी आर्थिक वृद्धि के साथ जुड़ती है"
  - "बाज़ार उपभोक्ता कीमतें कम करते हैं, प्रतिस्पर्धा के माध्यम से उत्पाद गुणवत्ता बढ़ाते हैं, और अंतरराष्ट्रीय व्यापार का विस्तार करते हैं, जिससे घरेलू समृद्धि वैश्विक सहयोग के साथ जुड़ती है"
explanation: >-
  मुक्त बाज़ार के पक्ष में लिबर्टेरियन तर्क तीन परस्पर जुड़े कार्यों पर आधारित है। पहला, कीमतें आर्थिक और सामाजिक निर्णयों को दिशा देने वाले विश्वसनीय संकेतक के रूप में काम करती हैं (दिशासूचक)। दूसरा, बाज़ार आपूर्ति और मांग के माध्यम से प्रामाणिक व्यक्तिगत प्राथमिकताओं को प्रकट करता है। तीसरा, मुक्त विनिमय कर्ताओं को अपने व्यक्तिगत मूल्यों के अनुसार अपने मामलों का निर्धारण करने देता है। Hayek ने दिखाया कि मुक्त बाज़ार केंद्रीय नियोजन की तुलना में बिखरी हुई सूचना का बेहतर समन्वय करते हैं (दक्षता), जबकि पारस्परिक सहमति जबरदस्ती की तुलना में मानव गरिमा का अधिक सम्मान करती है (न्याय)।
reviewed: false
