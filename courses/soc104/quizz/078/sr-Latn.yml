question: "Šta ima prvenstvo nad slobodom u konzervativnoj političkoj filozofiji?"
answer: "Poredak i tradicija, koji moraju biti čvrsto uspostavljeni pre nego što sloboda može biti vrednovana"
wrong_answers:
  - "Socijalna pravda i jednakost, koje moraju biti garantovane pre nego što pojedinci mogu biti zaista slobodni"
  - "Ekonomska efikasnost i pragmatični rezultati, koji određuju kada je sloboda prikladna"
  - "Individualna prava svojine, koja moraju biti zaštićena pre nego što se dodeli bilo koja druga sloboda"
explanation: >-
  Za konzervativce, poredak i tradicija imaju prvenstvo nad slobodom. Oni tvrde da previše slobode stvara haos i društveni nered, pa se sloboda može vrednovati tek kada je poredak čvrsto uspostavljen. To je u suprotnosti sa socijalističkim pogledom koji daje prioritet pravdi, ili centrističkim fokusom na efikasnost.
