question: พิสูจน์ความสมบูรณ์สร้างฟังก์ชันใด ๆ ได้โดยซ้อน case เพื่อแยกส่วนอินพุตและใช้ scribe สำหรับแต่ละเอาต์พุต ทำไมมันจึงเป็นเพียงเครื่องมือเชิงทฤษฎี?
answer: นิพจน์ที่ได้เป็นตารางค้นหาขนาดยักษ์ซึ่งมีขนาดเติบโตแบบเอ็กซ์โพเนนเชียล — อินพุต 256 บิตจะต้องมีประมาณ 2²⁵⁶ รายการ
wrong_answers:
  - scribe เป็นมาโคร ไม่ใช่คอร์คอมบิเนเตอร์ ดังนั้นนิพจน์จึงอยู่นอกภาษาที่ผ่านการพิสูจน์อย่างเป็นทางการ
  - Bit Machine ประเมินมันในเวลาเอ็กซ์โพเนนเชียล แม้ว่านิพจน์เองจะยังคงกะทัดรัดผ่านการแชร์
  - case ที่ซ้อนกันสามารถแยกส่วนได้เฉพาะชนิด sum เท่านั้น ดังนั้นการสร้างนี้จึงล้มเหลวกับอินพุตที่มีชนิด product ใด ๆ
explanation: >-
  การสร้างนี้แจกแจงอินพุตที่เป็นไปได้ทุกค่าผ่านการแยกส่วนด้วย case
  ที่ซ้อนกัน และ hard-code เอาต์พุตแต่ละค่าด้วย scribe ดังนั้นขนาดนิพจน์
  จึงระเบิดแบบเอ็กซ์โพเนนเชียล — ใหญ่มหาศาลสำหรับชนิดที่ใช้งานจริงอย่างคำขนาด 256 บิต
  การระเบิดนี้อยู่ที่ขนาดของนิพจน์ ไม่ใช่ runtime ของนิพจน์ที่กะทัดรัดด้วยวิธีอื่น
  scribe ขยายเป็นคอร์คอมบิเนเตอร์จริง (unit, injl, injr, pair)
  ดังนั้นผลลัพธ์ยังคงอยู่ภายในภาษาคอร์ ซึ่งทฤษฎีบทความสมบูรณ์ของมันได้รับการพิสูจน์อย่างเป็นทางการใน Rocq;
  และการแยกส่วนรองรับอินพุตของชนิดใด ๆ รวมถึง products ด้วย
reviewed: false
