question: Kto poslal Merciera de la Rivière do Ruska, aby pomohol Kataríne II. reformovať jej zákony?
answer: Diderot
wrong_answers:
  - Voltaire
  - Turgot
  - Quesnay
explanation: |
  Diderot, ktorý si dopisoval s Katarínou II., ju povzbudil, aby sa obrátila na Merciera de la Rivière s prosbou o pomoc pri reforme ruskej legislatívy.
