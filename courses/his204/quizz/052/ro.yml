question: Datorită intervenției cui a scăpat Mirabeau de rigorile represiunii după publicarea lucrării sale Théorie de l'Impôt?
answer: Doamna de Pompadour
wrong_answers:
  - Ludovic al XV-lea
  - François Quesnay
  - Voltaire
explanation: |
  Doamna de Pompadour a intervenit în favoarea lui Mirabeau după publicarea lucrării „La Théorie de l'Impôt”, permițându-i să evite o pedeapsă mai severă.
