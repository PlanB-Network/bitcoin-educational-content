question: Ni ubuhe buhinga amahera y'ubuhinga bwa none ecash ahagazeko?
answer: Imikono y'impumyi(Blind signatures)
wrong_answers:
  - Imikono y'umugwi(umuryango)
  - Imikono y'impeta
  - Imikono y'imbere
explanation: |
  eCash ishingiye ku nzira yo gusinya ataco abona, ivyo bikaba bituma uwusinya ashobora gusinya ku kintu atabona ico ariko arasinya.
reviewed: true
