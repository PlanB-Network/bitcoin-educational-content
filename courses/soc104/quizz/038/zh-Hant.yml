question: "結構性方法如何定義社會主義與自由意志主義之間的根本差異？"
answer: "社會主義透過管制、規劃與控制賦予國家優先性，而自由意志主義則透過最低限度的國家干預賦予個人優先性"
wrong_answers:
  - "社會主義優先考量鄉村農業社群，而自由意志主義偏好城市工業發展"
  - "社會主義由其支持民主選舉來定義，而自由意志主義拒絕一切形式的政治參與"
  - "社會主義聚焦於外交政策與國際合作，而自由意志主義只關心國內經濟議題"
explanation: >-
  從結構上看，社會主義以國家的無所不在為特徵，國家進行管制、規劃與控制。自由意志主義則由國家對經濟與私人生活的最低限度干預來定義，傾向於個人自由與自由市場的優先性。這種結構性區分，比較各制度所宣稱的意圖更具分析用途。
reviewed: false
