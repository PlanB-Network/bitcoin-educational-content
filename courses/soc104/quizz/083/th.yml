question: "ความแตกต่างหลักระหว่างการสนับสนุนธุรกิจกับการสนับสนุนตลาดคืออะไร?"
answer: "ผู้สนับสนุนธุรกิจต้องการการแทรกแซงของรัฐเพื่อปกป้องบริษัทเฉพาะรายจากความล้มเหลว ส่วนผู้สนับสนุนตลาดสนับสนุนการยกเลิกกฎระเบียบและยอมให้ธุรกิจล้มเหลวเพื่อให้ตลาดจัดระเบียบใหม่ตามธรรมชาติ"
wrong_answers:
  - "ผู้สนับสนุนธุรกิจมุ่งเน้นบรรษัทขนาดใหญ่ ส่วนผู้สนับสนุนตลาดมุ่งสนับสนุนธุรกิจขนาดเล็กและสตาร์ทอัพเท่านั้น"
  - "การสนับสนุนธุรกิจเป็นจุดยืนฝ่ายซ้ายที่เข้าข้างสหกรณ์แรงงาน ส่วนการสนับสนุนตลาดเป็นจุดยืนฝ่ายขวาที่เข้าข้างกรรมสิทธิ์เอกชน"
  - "ผู้สนับสนุนธุรกิจปฏิเสธการแข่งขันทั้งหมด ส่วนผู้สนับสนุนตลาดสนับสนุนการแข่งขันที่รัฐบาลกำกับระหว่างกิจการที่ได้รับอนุมัติ"
explanation: >-
  จุดยืนแบบสนับสนุนธุรกิจมองการแข่งขันว่าเป็นเครื่องมือของการกำกับดูแลที่ได้มาผ่านกฎระเบียบ และให้เหตุผลสนับสนุนเงินอุดหนุนกับการช่วยเหลือทางการเงินเพื่อป้องกันการสูญเสียงาน ในมุมมองแบบสนับสนุนธุรกิจ ตลาดเปราะบางและต้องการการกู้ภัยจากรัฐ ผู้สนับสนุนตลาดมองการแข่งขันว่าเป็นผลลัพธ์ตามธรรมชาติของกิจการเสรี ซึ่งหมายถึงการยกเลิกกฎระเบียบและการยอมให้ธุรกิจล้มเหลว เพราะความล้มเหลวเปิดทางให้ตลาดจัดระเบียบใหม่ตามธรรมชาติและเปิดพื้นที่ให้ผู้กระทำที่มีความสามารถมากกว่า
reviewed: false
