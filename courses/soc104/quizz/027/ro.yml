question: "De ce au început liberalii clasici din Statele Unite să se numească 'libertarieni' începând cu anii 1960?"
answer: "Pentru a se distinge de liberalii americani, al căror sens se deplasase spre intervenționismul statului"
wrong_answers:
  - "Pentru a se alinia cu Partidul Democrat și cu programele sale sociale progresiste"
  - "Pentru a-și semnala sprijinul pentru reformele Great Society ale lui Lyndon B. Johnson"
  - "Pentru a adopta o identitate revoluționară mai radicală inspirată de mișcările socialiste europene"
explanation: >-
  În Statele Unite, cuvântul 'liberal' s-a deplasat spre a desemna susținătorii Big Government și ai intervenției statului, mai ales după New Deal și Great Society. Liberalii clasici au adoptat eticheta 'libertarian' pentru a păstra sensul original al filosofiei lor. Ei se distanțau de liberalii americani, nu se aliniau cu ei.
reviewed: false
