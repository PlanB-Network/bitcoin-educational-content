question: "친기업과 친시장의 핵심 구분은 무엇인가요?"
answer: "친기업 옹호자는 특정 기업을 실패로부터 보호하기 위해 국가 개입을 추구하는 반면, 친시장 옹호자는 탈규제를 지지하고 기업이 실패하도록 허용해 시장이 자연스럽게 재조직되게 합니다"
wrong_answers:
  - "친기업 옹호자는 대기업에 초점을 맞추는 반면, 친시장 옹호자는 오직 소기업과 스타트업 지원에만 초점을 맞춥니다"
  - "친기업은 노동자 협동조합을 선호하는 좌파 입장인 반면, 친시장은 사적 소유를 선호하는 우파 입장입니다"
  - "친기업 옹호자는 모든 경쟁을 거부하는 반면, 친시장 옹호자는 승인된 기업들 사이의 정부 규제 경쟁을 지지합니다"
explanation: >-
  친기업 입장은 경쟁을 규제를 통해 얻어지는 거버넌스 도구로 보며, 일자리 손실을 막기 위해 보조금과 구제금융을 정당화합니다. 친기업 관점에서 시장은 취약하며 국가의 구제가 필요합니다. 친시장 옹호자는 경쟁을 자유기업의 자연스러운 결과로 보며, 이는 탈규제와 기업이 실패하도록 허용하는 것을 의미합니다. 실패는 시장이 자연스럽게 재조직되고 더 유능한 행위자들에게 장을 열어 주기 때문입니다.
