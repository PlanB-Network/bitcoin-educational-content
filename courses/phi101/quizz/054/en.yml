question: What means did kings use to assert their sovereignty against the Church?
answer: The development of a centralized and powerful state apparatus.
wrong_answers:
  - The creation of their own legal and fiscal systems.
  - The adoption of non-Christian religions to undermine papal authority.
  - Raising armies and waging wars against the Church.
explanation: |
  Kings primarily asserted their sovereignty against the Church by developing a centralized state apparatus, establishing independent power structures that could rival ecclesiastical authority and reduce the Church's influence on governance.
reviewed: true
