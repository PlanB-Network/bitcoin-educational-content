question: "When middle management becomes necessary as the team grows, what approach does the chapter recommend?"
answer: "Promote from within because internal candidates understand the culture and have earned the team's trust"
wrong_answers:
  - "Hire experienced external managers who bring fresh processes and industry best practices"
  - "Rotate team members through temporary management roles to identify natural leaders"
  - "Outsource management functions to fractional executives until revenue justifies full-time hires"
explanation: >-
  The chapter recommends **promoting from within** when middle management becomes necessary. Someone who has been with the company, understands the culture, and has earned the team's trust is almost always a better choice than an outside hire with management credentials but no context. This preserves cultural continuity during a critical growth transition.
reviewed: false
