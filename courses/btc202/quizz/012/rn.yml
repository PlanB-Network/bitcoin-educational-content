question: Ni ikihe gice kiri mu nshingano za miner?
answer: Kwubaka candidate block ikuwe muri Mempool
wrong_answers:
  - Kwemeza Blockchain yose ukoresheje Mempool.
  - Rema aderesi za Bitcoin ku bakoresha
  - Bika impfunguruzo z'ibanga wallets
explanation: |
  Miner ahitamwo amafaranga muri Mempool maze akubaka umugwi w'abashaka gutora, uwo akagerageza kwemeza na Proof of Work.
reviewed: true
