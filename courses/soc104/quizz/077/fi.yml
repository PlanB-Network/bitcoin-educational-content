question: "Miten libertaarinen vapauskäsitys eroaa sentristisestä käsityksestä?"
answer: "Libertaarit käsittelevät vapautta ehdottomana aksioomana, kun taas sentristit puolustavat vapauksia opportunistisesti kontekstin ja tehokkuuden mukaan"
wrong_answers:
  - "Libertaarit sallivat valtion suojella vapautta valikoivasti, kun taas sentristit torjuvat kaiken valtion osallistumisen yksilön oikeuksien suojelemiseen"
  - "Libertaarit keskittyvät vapaudessa vain taloudellisiin asioihin, kun taas sentristit soveltavat vapautta laajasti sosiaalisilla ja kulttuurisilla alueilla"
  - "Libertaareilla ja sentristeillä on sama näkemys vapaudesta, mutta he ovat eri mieltä sen valvomiseen tarvittavan hallinnon koosta"
explanation: >-
  Libertaarit määrittelevät vapauden yleiseksi, ehdottomaksi periaatteeksi, joka toimii aksioomana. Sentristit sitä vastoin puolustavat tiettyjä vapauksia opportunistisesti ja kontekstuaalisesti soveltamatta mitään yleistä periaatetta. Sentristinen lähestymistapa paljastaa välineellisen vapauskäsityksen, joka alistetaan aina pragmaattisille tavoitteille, kuten tehokkuudelle, minkä libertaarit pohjimmiltaan torjuvat.
