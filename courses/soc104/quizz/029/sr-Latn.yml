question: "Kako se uloge Cato Institute-a, Mises Institute-a i Libertarian Party-ja razlikuju unutar libertarijanskog pokreta?"
answer: "Cato Institute se fokusira na predloge javne politike, Mises Institute na obrazovanje i akademsko izdavaštvo, a Libertarian Party na izbornu politiku"
wrong_answers:
  - "Cato Institute finansira političke kampanje, Mises Institute direktno lobira kod Kongresa, a Libertarian Party organizuje akademske konferencije"
  - "Cato Institute objavljuje ekonomske udžbenike, Mises Institute vodi akcije registracije birača, a Libertarian Party sastavlja zakonske predloge"
  - "Cato Institute organizuje proteste na nivou baze, Mises Institute pruža pravnu odbranu libertarijancima, a Libertarian Party upravlja istraživanjima think tankova"
explanation: >-
  Cato Institute (osnovan 1977) je think tank sa sedištem u Washingtonu koji radi na predlozima javne politike. Mises Institute (osnovan 1982) fokusira se na obrazovanje, a ne na političko lobiranje, funkcionišući kao neka vrsta online univerziteta sa konferencijama i ponovo objavljenim radovima. Libertarian Party (osnovana 1971) treća je najveća američka politička partija, učestvuje na izborima na kojima čak i njenih približno 2% glasova može da preokrene ishode.
reviewed: false
