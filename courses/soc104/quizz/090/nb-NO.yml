question: "Hvorfor hevder Popper at det åpne samfunnet forblir iboende skjørt til tross for sine fordeler?"
answer: "Fordi ansvaret som individualismen innebærer, kan virke skremmende og skape en fristelse til å søke tilflukt i fellesskapets beskyttelse, autoritet eller nostalgi etter en idealisert fortid"
wrong_answers:
  - "Fordi åpne samfunn mangler militær styrke og ikke kan forsvare seg mot invasjon fra lukkede samfunn"
  - "Fordi demokratiske institusjoner er iboende ineffektive og til slutt kollapser under vekten av byråkratisk kompleksitet"
  - "Fordi åpne samfunn tillater for mye økonomisk ulikhet, noe som uunngåelig fører til revolusjon og innføring av autoritære regimer"
explanation: >-
  Popper understreker at det åpne samfunnets skjørhet stammer fra en psykologisk sårbarhet. Ansvaret som individualismen innebærer, kan virke skremmende og risikabelt fordi man må gjøre sine egne valg og kan mislykkes. Dette skaper en fristelse til å søke tilflukt i fellesskapets beskyttelse eller nostalgiske tendenser mot en idealisert fortid. Det åpne samfunnet møter vedvarende utfordringer fra kommunitære impulser og den tilbakevendende fristelsen til vold.
reviewed: false
