question: "Quan niệm libertarian về tự do khác với quan niệm trung dung như thế nào?"
answer: "Những người libertarian xem tự do như một tiên đề vô điều kiện, trong khi những người trung dung bảo vệ các quyền tự do một cách cơ hội tùy theo bối cảnh và hiệu quả"
wrong_answers:
  - "Những người libertarian cho phép nhà nước bảo vệ tự do một cách chọn lọc, trong khi những người trung dung bác bỏ mọi sự tham gia của nhà nước trong việc bảo vệ quyền cá nhân"
  - "Những người libertarian chỉ tập trung tự do vào các vấn đề kinh tế, trong khi những người trung dung áp dụng tự do rộng rãi trên các lĩnh vực xã hội và văn hóa"
  - "Những người libertarian và những người trung dung có cùng quan điểm về tự do nhưng bất đồng về quy mô chính phủ cần thiết để thực thi nó"
explanation: >-
  Những người libertarian định nghĩa tự do như một nguyên tắc tổng quát, vô điều kiện, vận hành như một tiên đề. Ngược lại, những người trung dung bảo vệ một số quyền tự do theo cách cơ hội và theo bối cảnh mà không áp dụng bất kỳ nguyên tắc tổng quát nào. Cách tiếp cận trung dung bộc lộ một quan niệm công cụ về tự do, luôn bị đặt dưới các mục tiêu thực dụng như hiệu quả, điều mà những người libertarian về căn bản bác bỏ.
