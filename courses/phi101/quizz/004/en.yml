question: What is the fundamental difference between the philosophy of freedom and the philosophy of power?
answer: The philosophy of freedom values private property, while the philosophy of power values the collective interest
wrong_answers:
  - The philosophy of freedom favors the individual, while the philosophy of power favors society
  - The philosophy of freedom emerged during the Enlightenment, while the philosophy of power dates back to Antiquity
  - The philosophy of freedom is based on natural law, while the philosophy of power is based on positive law
explanation: |
  The fundamental distinction is that the philosophy of freedom is based on private property and individual rights, while the philosophy of power justifies collective authority to organize society, often at the expense of individual property and autonomy.
reviewed: true
