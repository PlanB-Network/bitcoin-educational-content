question: "¿Cómo define el enfoque estructural la diferencia fundamental entre socialismo y libertarianismo?"
answer: "El socialismo da primacía al Estado mediante regulación, planificación y control, mientras que el libertarianismo da primacía al individuo mediante una intervención estatal mínima"
wrong_answers:
  - "El socialismo prioriza las comunidades agrícolas rurales, mientras que el libertarianismo favorece el desarrollo industrial urbano"
  - "El socialismo se define por su apoyo a las elecciones democráticas, mientras que el libertarianismo rechaza toda forma de participación política"
  - "El socialismo se centra en la política exterior y la cooperación internacional, mientras que el libertarianismo solo se ocupa de cuestiones económicas internas"
explanation: >-
  Estructuralmente, el socialismo se caracteriza por la omnipresencia del Estado, que regula, planifica y controla. El libertarianismo se define por una intervención estatal mínima en la economía y la vida privada, tendiendo hacia la primacía de la libertad individual y el mercado libre. Esta distinción estructural es mucho más útil analíticamente que comparar las intenciones declaradas de cada sistema.
