question: "Šta karakteriše dno ose lične slobode na Nolanovom dijagramu?"
answer: "Prednost data poretku, bezbednosti, tradicionalnim vrednostima i tome da država reguliše moral i održava javni red"
wrong_answers:
  - "Prednost data individualnoj autonomiji, toleranciji i minimalnom mešanju države u izbore u ličnom životu"
  - "Prednost data ekonomskoj deregulaciji, slobodnoj trgovini i ukidanju carina i subvencija"
  - "Prednost data preraspodeli bogatstva, visokim porezima i nacionalizaciji ključnih industrija"
explanation: >-
  Dno ose lične slobode predstavlja maksimalnu državnu kontrolu nad ličnim životom, koju karakteriše prednost data poretku, bezbednosti i tradicionalnim vrednostima. Država reguliše moral, održava javni red i može braniti određenu viziju morala ili tradicije. Vrh ose predstavlja suprotnost: individualnu slobodu i toleranciju. Ekonomske politike mere se na zasebnoj horizontalnoj osi.
reviewed: false
