question: "De ce susține modelul bidimensional că majoritatea chestiunilor politice pot fi împărțite în categorii economice și personale?"
answer: "Deoarece chestiunile economice privesc ceea ce faci ca producător și consumator, în timp ce chestiunile personale privesc relațiile tale private, convingerile și autonomia corporală"
wrong_answers:
  - "Deoarece toate dezbaterile politice se reduc în cele din urmă la dezacorduri privind nivelurile de impozitare și practicile religioase"
  - "Deoarece guvernele au reglementat istoric doar două lucruri: piața și armata"
  - "Deoarece filosofii politici au separat întotdeauna preocupările materiale de cele spirituale încă din Antichitate"
explanation: >-
  Modelul bidimensional se bazează pe ideea că chestiunile politice se împart în două categorii largi. Libertățile economice acoperă producția, consumul, comerțul, ocuparea forței de muncă și gestionarea banilor. Libertățile personale acoperă relațiile private, opiniile, convingerile și alegerile privind propriul corp și propria minte. Această separare permite o cartografiere mult mai nuanțată a pozițiilor politice decât o singură axă stânga-dreapta.
reviewed: false
