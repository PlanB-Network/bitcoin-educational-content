question: "Что такое конструктивизм как общее политическое убеждение?"
answer: "Вера в то, что центральное правительство может силой закона создать социальный порядок, благой для наибольшего числа людей"
wrong_answers:
  - "Вера в то, что общество должно организовываться через добровольное сотрудничество между индивидами без вмешательства государства"
  - "Вера в то, что только свободные рынки могут определить оптимальное распределение ресурсов в обществе"
  - "Вера в то, что политическая власть должна быть распределена поровну между всеми гражданами через прямую демократию"
explanation: >-
  Конструктивизм объединяет центристов, консерваторов и социалистов вокруг общего убеждения: превосходства политического процесса над рыночным процессом. Это вера в то, что центральное правительство может силой закона создать социальный порядок, благой для наибольшего числа людей. Это прямо противоположно либертарианской защите спонтанного порядка, возникающего из добровольных взаимодействий.
reviewed: false
