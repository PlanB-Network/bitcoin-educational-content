question: "Nolan diagram पर अधिकतम आर्थिक स्वतंत्रता से कौन-सी प्रतीकात्मक हस्तियाँ जुड़ी हैं?"
answer: "Margaret Thatcher, Ronald Reagan, और Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures, और Bernie Sanders"
  - "Nelson Mandela, Simone Veil, और Noam Chomsky"
  - "Vladimir Putin, Xi Jinping, और Joseph de Maistre"
explanation: >-
  Thatcher, Reagan, और Milei को अधिकतम आर्थिक स्वतंत्रता की प्रतीकात्मक हस्तियों के रूप में उद्धृत किया गया है, जो कम राज्य हस्तक्षेप, कम नियमों, और कम करों का समर्थन करते हैं। Roosevelt, Jaures, और Sanders उस विपरीत छोर का प्रतिनिधित्व करते हैं जो अर्थव्यवस्था पर राज्य नियंत्रण का समर्थन करता है। Mandela, Veil, और Chomsky अधिकतम व्यक्तिगत स्वतंत्रता का प्रतिनिधित्व करते हैं। Putin, Xi Jinping, और de Maistre व्यक्तिगत जीवन पर अधिकतम राज्य नियंत्रण का प्रतिनिधित्व करते हैं।
reviewed: false
