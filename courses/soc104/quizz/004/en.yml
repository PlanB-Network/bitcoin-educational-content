question: "What common point do left-wing and right-wing political parties share despite their apparent opposition?"
answer: "Both defend the right of the state to govern people's lives through regulations and taxes"
wrong_answers:
  - "Both advocate for the complete abolition of state intervention in economic matters"
  - "Both prioritize individual freedom over collective organization of society"
  - "Both reject the use of monetary policy as a tool for government spending"
explanation: >-
  Despite seeming opposed, left and right share a preference for state intervention. Both criticize the free market and defend the right of the state to govern people's lives through regulations and taxes. The left criticizes markets as a source of inequality, while the right sees them as a threat to sovereignty, but both turn to the state for solutions.
reviewed: false
