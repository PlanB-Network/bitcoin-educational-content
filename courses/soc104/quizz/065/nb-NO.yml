question: "Hva er Hannah Arendts viktigste skille mellom klassisk despoti og totalitarisme?"
answer: "Totalitarisme underlegger ikke bare mennesker tyranniske regler, men gjør mennesker ute av stand til selvstendig handling, og negerer politikken selv"
wrong_answers:
  - "Klassisk despoti kontrollerer økonomien, mens totalitarisme bare kontrollerer politiske og militære institusjoner"
  - "Totalitarisme er simpelthen en mer ekstrem versjon av despoti, som bare skiller seg i omfanget av undertrykkelse"
  - "Klassisk despoti bruker ideologi for å rettferdiggjøre sitt styre, mens totalitarisme utelukkende baserer seg på militær makt"
explanation: >-
  Arendt hevder at totalitarisme er fundamentalt forskjellig fra klassisk despoti. Det er ikke bare et mer ekstremt tyranni, men et system som gjør mennesker overflødige og ødelegger deres evne til selvstendig handling. For Arendt er politikk et folks evne til å ta sin skjebne i egne hender, og totalitarisme er selve negasjonen av denne evnen, noe som gjør den kvalitativt forskjellig fra despoti.
reviewed: false
