question: "Ni kubera iki ubuhanuzi bwa Molinari bwo mu 1849 bwagaragaye ko bwari bwo ku bijanye n'isano hagati y'ubwisanzure n'ububasha bwa politike?"
answer: "Kuko aba conservative n'abasosiyaliste bagiye barasimburana ku butegetsi kandi bagakoresha ubwisanzure nk'igikoresho co gushikira intumbero zabo za politike, neza na neza nk'uko yabidondoye"
wrong_answers:
  - "Kuko wa muntu w'umuhinga w'ubutunzi yadondora yahavuye afata ububasha bwa politike maze agashira mu ngiro politike za libertarian mu Burayi bwose"
  - "Kuko ubuhanuzi bwiwe bw'uko imiryango itatu ya politike yose yohurira mu muhari umwe wa centrist bwabaye impamo mu kinjana ca mirongo ibiri"
  - "Kuko ubwisanzure bwagiye buragurwa n'intwaro zagiye zirakurikirana gushika bubaye ingingo nyamukuru itunganya za demokarasi za none"
explanation: >-
  Iyerekwa rya Molinari ryagaragaye ko ryari nk'ubuhanuzi kuko, kuva hagati mu kinjana ca cumi n'icenda, aba conservative n'abasosiyaliste bagiye barasimburana ku butegetsi kandi bagakora neza na neza ivyo yadondoye: gukoresha ubwisanzure nk'igikoresho co gushikira intumbero za politike. Iyo miryango yompi yiteguriye kugabanya ubwisanzure no kwitabaza leta kugira ngo ihatire abandi imigambi yayo, mu gihe ikibanza c'umuhinga w'ubutunzi co kuburanira ubwisanzure ata co abuharirako cagumye ku ruhande.
