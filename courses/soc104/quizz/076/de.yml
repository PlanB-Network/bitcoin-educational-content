question: "Welche Figur verteidigt in Gustave de Molinaris Dialogen von 1849 Freiheit als grundlegendes Prinzip, statt sie anderen Zielen unterzuordnen?"
answer: "Der Ökonom, der Freiheit als ein Prinzip behandelt, das keinem anderen Ziel untergeordnet wird"
wrong_answers:
  - "Der Sozialist, der Freiheit durch progressive Reformen verteidigt, die auf soziale Gleichheit abzielen"
  - "Der Konservative, der Freiheit aufrechterhält, indem er die traditionelle soziale Ordnung und Stabilität bewahrt"
  - "Alle drei Figuren verteidigen Freiheit gleichermaßen, sind sich aber uneinig darüber, wie sie umzusetzen ist"
explanation: >-
  In Molinaris Dialogen aus Les Soirees de la rue Saint-Lazare steht der Ökonom in dauerhaftem Widerspruch sowohl zum Sozialisten als auch zum Konservativen. Er ist der Einzige, der Freiheit als grundlegendes Prinzip verteidigt. Der Sozialist ordnet die Freiheit progressiven Idealen unter, und der Konservative ordnet sie der Bewahrung der Ordnung unter, wodurch der Ökonom in seiner bedingungslosen Verteidigung der Freiheit einzigartig ist.
reviewed: false
