question: Condorcetට අනුව, නිදහස මිනිසුන් බියගන්වන්නේ ඇයි?
answer: ඔවුන් සියලු කාරණාවලදී රජයට මැදිහත් වීමට ඉඩ දීමට ඉතා හුරු වී ඇති නිසා
wrong_answers:
  - එය ප්‍රංශයේ කිසිදා උත්සාහ කර නොමැති නිසා
  - එයට ප්‍රචණ්ඩ විප්ලවයක් අවශ්‍ය නිසා
  - එය අවුල් සහගත තත්ත්වයට සමාන නිසා
explanation: |
  Condorcet විශ්වාස කළේ මිනිසුන් රාජ්‍ය මැදිහත්වීමට හුරු වී සිටි අතර, නිදහස භාවිතා කරන්නේ කෙසේදැයි නොදන්නා නිසා ඔවුන් නිදහසට බිය වූ බවයි.