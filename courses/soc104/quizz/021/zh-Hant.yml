question: "文化保守主義是什麼？"
answer: "個人對從過去承襲而來的家庭、道德、美學與形而上學價值的堅守，而不是一種政治哲學"
wrong_answers:
  - "一種透過立法使用國家權力把傳統價值強加給整個社會的政治意識形態"
  - "一種拒絕一切形式的現代性，並尋求讓社會回到前工業生活方式的運動"
  - "一種保護本國產業，並反對與外國自由貿易的經濟學說"
explanation: >-
  文化保守主義被定義為一種生活智慧：個人對從過去承襲而來的家庭、道德、美學與形而上學價值的堅守，無論其來源是希臘—羅馬傳統或猶太—基督教傳統。它明確不是一種政治哲學。它不同於政治保守主義，後者旨在透過國家權力保存政治制度與社會秩序。它也不是關於拒絕現代性或經濟保護主義。
reviewed: false
