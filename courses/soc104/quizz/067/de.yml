question: "Was ist bei der Frage der Regulierung von Schusswaffen der entscheidende Unterschied zwischen der konservativen und der libertären Position?"
answer: "Beide akzeptieren eine gewisse Regulierung, aber Konservative wollen Regeln von einer legitimen öffentlichen Autorität, während Libertäre wollen, dass Regeln von den unmittelbar Betroffenen ausgehen, etwa Bürgervereinigungen und Marktwettbewerb"
wrong_answers:
  - "Konservative lehnen jede Regulierung von Schusswaffen ab, während Libertäre strikte staatliche Kontrolle im Namen der öffentlichen Sicherheit akzeptieren"
  - "Konservative wollen Schusswaffen vollständig verbieten, während Libertäre uneingeschränkten Zugang zu allen Waffen unterstützen"
  - "Konservative stützen ihre Position auf individuelle Rechte, während Libertäre ihre auf kollektive Verantwortung stützen"
explanation: >-
  Sowohl Konservative als auch Libertäre stimmen darin überein, dass irgendeine Form der Regulierung für das Tragen von Waffen notwendig ist. Der entscheidende Unterschied liegt darin, wer diese Regeln festlegt. Konservative bestehen darauf, dass Regulierungen von einer öffentlichen Autorität kommen müssen, die mit der Wahrung des Gemeinwohls betraut ist (top-down). Libertäre argumentieren, dass Regulierung von den unmittelbar Betroffenen ausgehen sollte: Sicherheitsfachleuten, Bürgervereinigungen und Marktwettbewerb (bottom-up).
reviewed: false
