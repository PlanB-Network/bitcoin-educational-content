question: "加密朋克关于中心化的哲学如何与自由意志主义把同意视为正义根本规范的原则相连接？"
answer: "加密朋克认为所有中心化都建立在强制而非同意之上，这呼应了自由意志主义立场：任何由中心化权威通过强力强加的东西都不可能是正义的"
wrong_answers:
  - "加密朋克认为，只要经过民主多数投票批准，中心化就是可以接受的，这符合自由意志主义对宪政治理的尊重"
  - "加密朋克支持紧急状态下的临时中心化，这反映了自由意志主义观点：当集体受到威胁时，个人权利可以被暂停"
  - "加密朋克只反对技术系统中的中心化，同时接受政治中心化对于执行财产权和合同是必要的"
explanation: >-
  加密朋克把信任放在去中心化密码系统中，而不是中心化机构中。所有中心化都被视为建立在强制而非同意之上。这直接呼应了自由意志主义哲学，即同意是正义的根本规范。如果某物由中心化权威通过强力强加，它就不可能是正义的，这也是他们寻求构建去中心化网络的原因：在其中没有任何单一实体能够强加其意志。
