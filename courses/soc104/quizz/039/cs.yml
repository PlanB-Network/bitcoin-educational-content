question: "Jak strukturální přístup definuje základní rozdíl mezi socialismem a libertarianismem?"
answer: "Socialismus dává primát státu prostřednictvím regulace, plánování a kontroly, zatímco libertarianismus dává primát jednotlivci prostřednictvím minimálních státních zásahů"
wrong_answers:
  - "Socialismus upřednostňuje venkovské zemědělské komunity, zatímco libertarianismus podporuje městský průmyslový rozvoj"
  - "Socialismus je definován podporou demokratických voleb, zatímco libertarianismus odmítá všechny formy politické účasti"
  - "Socialismus se zaměřuje na zahraniční politiku a mezinárodní spolupráci, zatímco libertarianismus se zabývá pouze domácími ekonomickými otázkami"
explanation: >-
  Strukturálně je socialismus charakterizován všudypřítomností státu, který reguluje, plánuje a kontroluje. Libertarianismus je definován minimálními státními zásahy do ekonomiky a soukromého života a směřuje k primátu individuální svobody a volného trhu. Toto strukturální rozlišení je analyticky mnohem užitečnější než srovnávání deklarovaných záměrů jednotlivých systémů.
