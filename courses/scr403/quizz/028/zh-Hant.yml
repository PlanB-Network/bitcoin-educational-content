question: 條件組合在什麼意義上是平行組合的對偶？
answer: 平行組合把同一個輸入餵給兩個運算，並把它們的輸出配成一對（一個積）；條件組合則接收一個輸入的和，且兩個分支共享同一種輸出型別。
wrong_answers:
  - 平行組合必須同時執行它的兩個運算；條件組合則循序執行它們，並只回傳由標記所選中的那個分支。
  - 兩者都在同一個共用輸入上運行；平行組合保留輸出的配對，而條件組合則執行兩個分支並捨棄未被選中的那一個。
  - 平行組合事先複製它的輸入，而條件組合則事後複製它的輸出，兩者調換了複製發生的位置。
explanation: >-
  這種對偶性是一種積/和的交換，且共用的型別會換邊：平行組合給予兩個運算相同的輸入型別，並把它們的輸出配成一個積，而條件組合則接收兩個輸入型別的和（標記聯集），且兩個分支必須產生相同的輸出型別。同時性與此無關——文章強調平行組合可以循序地實作——而條件組合恰好執行一個分支，由標記所選定，而非執行兩者並捨棄其一。
reviewed: false
