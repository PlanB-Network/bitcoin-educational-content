question: Potrivit titlului unei cărți a lui Le Trosne, cum este descrisă libertatea comerțului?
answer: Întotdeauna utilă, niciodată dăunătoare
wrong_answers:
  - Întotdeauna profitabilă și întotdeauna utilă
  - Adesea profitabilă, întotdeauna morală
  - Uneori profitabilă, uneori dăunătoare
explanation: |
  Le Trosne a scris „De l'intérêt social, par rapport à la valeur, à la circulation, à l'industrie et au commerce intérieur et extérieur”, în care apără liberul schimb ca fiind întotdeauna util și niciodată dăunător societății.
