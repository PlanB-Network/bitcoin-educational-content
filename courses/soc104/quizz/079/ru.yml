question: "В чем заключается ключевое разногласие между либертарианцами и другими политическими семьями, когда они разделяют одни и те же цели?"
answer: "Разногласие касается средств: либертарианцы отвергают принудительные решения и предпочитают добровольный обмен через рыночный процесс"
wrong_answers:
  - "Разногласие касается конечных целей: либертарианцы преследуют иные цели, такие как индивидуальное богатство, а не социальное благосостояние"
  - "Разногласие касается сроков: либертарианцы хотят достигать тех же целей медленнее, через постепенные реформы"
  - "Разногласие касается масштаба: либертарианцы хотят применять те же политики только на местном, а не на национальном уровне"
explanation: >-
  Либертарианцы могут соглашаться с социалистами, консерваторами и центристами по определенным целям, таким как защита угнетенных или содействие социальной сплоченности. Разногласие заключается не в целях, а в средствах. Либертарианцы отвергают все принудительные решения, стремящиеся унифицировать практики и правила, вместо этого защищая силу выбора и ответственную свободу через свободный, децентрализованный обмен, основанный на добровольных контрактах.
