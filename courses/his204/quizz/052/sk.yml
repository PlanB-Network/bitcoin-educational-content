question: Vďaka koho zásahu Mirabeau unikol tvrdosti represie po vydaní svojej Théorie de l'Impôt?
answer: Madame de Pompadour
wrong_answers:
  - Ľudovít XV.
  - François Quesnay
  - Voltaire
explanation: |
  Madame de Pompadour sa po vydaní "La Théorie de l'Impôt" prihovorila za Mirabeaua, čo mu umožnilo vyhnúť sa tvrdšiemu rozsudku.
