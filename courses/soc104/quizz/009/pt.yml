question: "Por que o eixo vertical (cima-baixo) é considerado mais fundamental do que o eixo horizontal (esquerda-direita) no diagrama de Nolan?"
answer: "Porque ele revela a verdadeira divisão entre aqueles que defendem o máximo de liberdades individuais e aqueles que favorecem o máximo de controle estatal"
wrong_answers:
  - "Porque ele mede a produção econômica com mais precisão do que o eixo horizontal mede as políticas sociais"
  - "Porque a maioria dos conflitos políticos ao longo da história envolveu identidade cultural em vez de governança"
  - "Porque o eixo horizontal se aplica apenas às democracias modernas, enquanto o eixo vertical é universal"
explanation: >-
  O eixo fundamental é o vertical porque ele capta a questão política essencial: em que grau o Estado deve controlar a ação humana? O eixo esquerda-direita apenas reflete sensibilidades diferentes (justiça social vs. tradição), mas ambos os lados podem ocupar a mesma posição no eixo vertical como estatistas. O eixo vertical revela se alguém quer impor sua visão pela força ou respeita a liberdade individual.
