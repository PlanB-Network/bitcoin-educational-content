question: Contrôle Général වෙත එක් වූ විට Louis XVI වෙත ලියූ තම ප්‍රසිද්ධ ලිපියේ Turgot ඉදිරිපත් කළ මූල්‍ය අනිවාර්යතා තුන කුමක්ද?
answer: බංකොලොත් වීමක් නැත. බදු වැඩි කිරීමක් නැත. ණය ගැනීමක් නැත
wrong_answers:
  - සංශෝධනයක් නැත. නව බදු නැත. නව නීති නැත.
  - නව යුද්ධයක් නැත. බදු වැඩි කිරීමක් නැත. ණය ගැනීමක් නැත
  - අනවශ්‍ය වියදම් නැත. වරප්‍රසාද නැත. පක්ෂපාතීකම නැත.
explanation: |
  Turgotගේ අනිවාර්යතා තුන වූයේ බංකොලොත් වීමක් නැත, බදු වැඩි කිරීමක් නැත, ණය ගැනීමක් නැත යන්නයි. රාජ්‍යයේ මුදල් තත්ත්වය යථා තත්ත්වයට පත් කිරීමට සහ ආර්ථිකය නැවත පණගැන්වීමට මෙම මූලධර්ම තුන අත්‍යවශ්‍ය බව ඔහු විශ්වාස කළේය.