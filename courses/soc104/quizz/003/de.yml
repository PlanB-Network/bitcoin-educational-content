question: "Warum gilt die Links-rechts-Achse als unzureichend, um klassisch-liberale Denker wie Bastiat oder Ron Paul einzuordnen?"
answer: "Weil der klassische Liberalismus sowohl wirtschaftliche als auch persönliche Freiheiten schätzt, die weder die Linke noch die Rechte vollständig befürworten"
wrong_answers:
  - "Weil klassische Liberale sich immer mit rechter Wirtschaftspolitik identifizieren und alle linken Positionen ablehnen"
  - "Weil klassische Liberale Zentristen sind, die gemäßigte Versionen sowohl linker als auch rechter Ideologien übernehmen"
  - "Weil klassische Liberale alle Formen von Regierung ablehnen, was sie eher zu Anarchisten als zu politischen Denkern macht"
explanation: >-
  Die Links-rechts-Achse scheitert an klassischen Liberalen, weil sie keine Position abbilden kann, die zugleich wirtschaftliche Freiheit (typischerweise rechts) und persönliche Freiheit (typischerweise links) verteidigt. Klassische Liberale sind keine Zentristen, die nach Kompromissen suchen, und sie sind auch keine Anarchisten oder rein rechtsgerichtet. Sie passen schlicht nicht auf ein eindimensionales Spektrum.
reviewed: false
