question: "Karl Marx ütopik sosyalizm ile bilimsel sosyalizm arasında hangi ayrımı yaptı?"
answer: "Erken dönem Fransız sosyalistlerini hayali çözümler önermekle suçladı; kendi bilimsel sosyalizmi ise tarihsel materyalizme ve sınıf mücadelesine dayanıyordu"
wrong_answers:
  - "Ütopik sosyalizmin ekonomiye fazla odaklandığını, bilimsel sosyalizmin ise kültürel ve sanatsal dönüşüme öncelik verdiğini savundu"
  - "Ütopik sosyalistleri pratik deneyleri nedeniyle övdü ve bilimsel sosyalizmi fazla soyut ve teorik olduğu için eleştirdi"
  - "Ütopik sosyalizmin şiddet yanlısı ve devrimci olduğunu, bilimsel sosyalizmin ise barışçıl demokratik reformu tercih ettiğini iddia etti"
explanation: >-
  Marx, Proudhon, Saint-Simon ve Fourier gibi erken dönem Fransız sosyalistlerini, tamamen hayali çözümler öneren ütopyacılar olmakla suçladı. Onun bilimsel sosyalizmi tarihsel materyalizme dayanıyordu: tarihin sınıf mücadelesi ve üretim araçlarının mülk edinilmesi yoluyla ilerlediği; tüm kültürel temsillerin üretici güçler ve üretim ilişkileri tarafından koşullandırıldığı fikrine.
