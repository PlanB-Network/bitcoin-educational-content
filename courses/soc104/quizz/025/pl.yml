question: "Jak Ron Paul zilustrował stanowisko paleolibertariańskie w kwestiach takich jak używanie narkotyków i aborcja?"
answer: "Osobiście odradzał używanie narkotyków i sprzeciwiał się aborcji, ale politycznie walczył przeciw zakazom federalnym i argumentował, że wybory należy pozostawić jednostkom lub stanom"
wrong_answers:
  - "Popierał federalną legalizację wszystkich narkotyków i aborcji jako sprawę absolutnych praw jednostki"
  - "Prowadził kampanię na rzecz surowych federalnych zakazów zarówno narkotyków, jak i aborcji, opierając się na swoich osobistych przekonaniach moralnych"
  - "Odmawiał wyrażania jakiejkolwiek osobistej opinii w tych kwestiach, argumentując, że politycy powinni pozostawać moralnie neutralni"
explanation: >-
  Ron Paul stanowi przykład syntezy paleolibertariańskiej, oddzielając osobiste przekonania moralne od przymusu politycznego. Zawsze odradzał używanie narkotyków, ale jednocześnie sprzeciwiał się ich prohibicji. Osobiście sprzeciwiał się aborcji, a jednak argumentował, że wybór powinien zostać pozostawiony poszczególnym stanom, a nie narzucony z góry. Pokazuje to, jak można mieć silne tradycyjne wartości, odmawiając jednocześnie używania przymusowej władzy rządu federalnego do ich egzekwowania.
