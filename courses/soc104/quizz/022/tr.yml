question: "Nolan çerçevesinde sunulduğu şekliyle devletçiliğin tanımı nedir?"
answer: "Medeniyeti, işçi sınıfını, doğayı veya ezilenleri savunma adına olsun, toplumu kontrol etmek ve şekillendirmek için mevzuatı kullanmak"
wrong_answers:
  - "Seçilmiş yetkililerin belirli sürelerle görev yaptığı ve iktidarın demokratik seçimler yoluyla el değiştirdiği bir hükümet sistemi"
  - "Yalnızca güçlü bir ordunun bir ulusun egemenliğini ve toprak bütünlüğünü koruyabileceği inancı"
  - "Gümrük tarifeleri ve kotalar yoluyla ulusal sanayilere yabancı rekabete göre öncelik veren bir ekonomik felsefe"
explanation: >-
  Devletçilik, toplumu kontrol etmek ve şekillendirmek için mevzuatın kullanılması olarak tanımlanır. Hem sol hem de sağ bunu uygular: bazıları medeniyeti savunma adına, diğerleri işçi sınıfını, doğayı veya ezilenleri savunma adına. Hatta merkezciler bile işlerine geldiğinde bunu onaylar. Devletçilik askeri politikayla, ticari korumacılıkla veya yalnızca seçilmiş hükümetlere sahip olmakla sınırlı değildir.
