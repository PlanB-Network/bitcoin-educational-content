question: "O que é o princípio da não agressão conforme teorizado por Murray Rothbard?"
answer: "É ilegítimo iniciar força física contra outro indivíduo ou sua propriedade, embora a violência defensiva seja permitida"
wrong_answers:
  - "Todas as formas de violência são sempre erradas, incluindo a autodefesa e a resistência à opressão"
  - "A violência é aceitável quando dirigida contra instituições opressivas, mas nunca contra outros indivíduos"
  - "Somente o Estado tem o direito legítimo de usar a força, e os indivíduos nunca devem recorrer à violência"
explanation: >-
  O princípio da não agressão de Rothbard sustenta que iniciar força física contra outra pessoa ou sua propriedade é ilegítimo. É uma tradução filosófica da regra de ouro. No entanto, ele não proíbe toda violência: a violência defensiva, incluindo a autodefesa e a resistência à opressão, é considerada legítima. Isso o distingue do pacifismo puro e do monopólio da força reivindicado pelo Estado.
reviewed: false
