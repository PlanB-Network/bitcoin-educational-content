question: "作为一种共同政治信念的建构主义是什么？"
answer: "一种认为中央政府可以通过法律强力，创造有利于最大多数人的社会秩序的信念"
wrong_answers:
  - "一种认为社会应通过个人之间的自愿合作来组织，而不受国家干预的信念"
  - "一种认为只有自由市场才能决定社会中资源最优分配的信念"
  - "一种认为政治权威应通过直接民主在所有公民之间平等分配的信念"
explanation: >-
  建构主义把中间主义者、保守主义者和社会主义者联合在一个共同信念周围：政治过程优于市场过程。它相信中央政府可以通过法律强力，创造一种有利于最大多数人的社会秩序。这与自由意志主义对从自愿互动中出现的自发秩序的捍卫直接相反。
reviewed: false
