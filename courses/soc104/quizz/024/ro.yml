question: "Ce este conservatorismul politic?"
answer: "O ideologie care urmărește păstrarea instituțiilor politice consacrate și a ordinii sociale, opunându-se marilor răsturnări structurale"
wrong_answers:
  - "Un angajament personal față de valorile familiale tradiționale și practicile religioase, fără a urmări impunerea lor asupra altora"
  - "O filosofie care promovează schimbarea socială rapidă prin reformă democratică și legislație progresistă"
  - "O teorie economică ce pledează pentru piețe libere, impozitare minimă și abolirea barierelor comerciale"
explanation: >-
  Conservatorismul politic este o ideologie, adesea reprezentată de partide de dreapta sau de extremă dreapta, care urmărește să păstreze instituțiile politice consacrate și ordinea socială, opunându-se marilor răsturnări structurale. Susținătorii săi doresc să folosească puterea și legea pentru a-și proteja moștenirea. Acesta diferă de conservatorismul cultural, care este o alegere personală de viață, nu un program politic.
