question: unit type (𝟙) คืออะไร และทำไมจึงมีประโยชน์แม้ไม่บรรทุกข้อมูล?
answer: มันมีหนึ่งค่า (empty tuple) และเป็นฐานสำหรับชนิดข้อมูลอื่นทั้งหมด.
wrong_answers:
  - มันแทนเลข 1 และใช้โดยตรงกับปฏิบัติการเลขคณิต.
  - มันเป็นชนิด debugging พิเศษที่บันทึก execution traces ออกไปยังไฟล์.
  - มันเก็บข้อมูลพอดีหนึ่งบิตที่ใช้สำหรับปฏิบัติการ boolean.
explanation: >-
  unit type 𝟙 มีค่าเดียวพอดี — empty tuple ⟨⟩ แม้มันจะบรรทุกข้อมูลศูนย์บิต
  แต่มันจำเป็นในฐานะเมล็ดตั้งต้นที่ sum และ product types ใช้สร้างชนิดข้อมูล
  ที่มีประโยชน์ทั้งหมด ตัวอย่างเช่น boolean type 𝟚 คือ 𝟙 + 𝟙 ซึ่งสร้างทั้งหมด
  จาก unit types.
reviewed: false
