question: "În chestiunea reglementării armelor de foc, care este diferența crucială dintre pozițiile conservatoare și libertariene?"
answer: "Ambele acceptă o anumită reglementare, dar conservatorii vor reguli provenite de la o autoritate publică legitimă, în timp ce libertarienii vor ca regulile să apară de la cei direct vizați, precum asociațiile de cetățeni și concurența de pe piață"
wrong_answers:
  - "Conservatorii se opun oricărei reglementări a armelor de foc, în timp ce libertarienii acceptă control guvernamental strict pentru siguranța publică"
  - "Conservatorii vor să interzică complet armele de foc, în timp ce libertarienii susțin accesul nerestricționat la toate armele"
  - "Conservatorii își bazează poziția pe drepturile individuale, în timp ce libertarienii și-o bazează pe responsabilitatea colectivă"
explanation: >-
  Atât conservatorii, cât și libertarienii sunt de acord că este necesară o formă de reglementare pentru portul armelor. Diferența crucială constă în cine stabilește acele reguli. Conservatorii insistă că reglementările trebuie să vină de la o autoritate publică însărcinată cu protejarea binelui comun (de sus în jos). Libertarienii susțin că reglementarea ar trebui să apară de la cei direct vizați: profesioniști din securitate, asociații de cetățeni și concurența de pe piață (de jos în sus).
reviewed: false
