question: "Dlaczego oś pionowa (góra-dół) jest uważana za bardziej fundamentalną niż oś pozioma (lewica-prawica) w diagramie Nolana?"
answer: "Ponieważ ujawnia prawdziwy podział między tymi, którzy bronią maksymalnych wolności indywidualnych, a tymi, którzy sprzyjają maksymalnej kontroli państwa"
wrong_answers:
  - "Ponieważ mierzy produkcję gospodarczą dokładniej niż oś pozioma mierzy polityki społeczne"
  - "Ponieważ większość konfliktów politycznych w historii dotyczyła tożsamości kulturowej, a nie rządzenia"
  - "Ponieważ oś pozioma dotyczy tylko współczesnych demokracji, podczas gdy oś pionowa jest uniwersalna"
explanation: >-
  Fundamentalną osią jest oś pionowa, ponieważ uchwytuje zasadnicze pytanie polityczne: w jakim stopniu państwo powinno kontrolować ludzkie działanie? Oś lewica-prawica odzwierciedla jedynie różne wrażliwości (sprawiedliwość społeczna kontra tradycja), ale obie strony jako etatyści mogą zajmować tę samą pozycję na osi pionowej. Oś pionowa ujawnia, czy ktoś chce narzucać swoją wizję siłą, czy szanuje wolność jednostki.
reviewed: false
