question: "Jaké je hlavní poselství Manifestu šifrantů Erica Hughese z roku 1993 ohledně soukromí?"
answer: "Soukromí je v elektronickém věku nezbytné pro otevřenou společnost a jednotlivci si je musí vybudovat sami, místo aby očekávali, že jim je zaručí vlády nebo korporace"
wrong_answers:
  - "Soukromí je luxus, který musí být obětován výměnou za národní bezpečnost a ochranu demokratických institucí"
  - "Soukromí by mělo být regulováno mezinárodními smlouvami, které stanoví jednotné standardy ochrany dat ve všech zemích"
  - "Soukromí je důležité pouze pro zločince a disidenty, zatímco zákon dodržující občané těží z transparentních systémů dohledu"
explanation: >-
  Manifest Erica Hughese z roku 1993 uvádí, že soukromí je v elektronickém věku nezbytné pro otevřenou společnost a že nemůžeme očekávat, že ho zaručí vlády, korporace nebo jiné velké organizace. Základní motivací je, že důvěrnost je klíčovým prvkem svobody a musí ji budovat sami jednotlivci, nikoli ji očekávat jako dar od institucí.
