question: "Bagaimana sosialisme memperlakukan kebebasan secara berbeda dalam ranah kemasyarakatan dan ekonomi?"
answer: "Sosialisme mendukung kebebasan yang kuat dalam ranah kemasyarakatan tetapi kebebasan yang lemah dalam ranah ekonomi"
wrong_answers:
  - "Sosialisme membatasi semua kebebasan secara sama di kedua ranah, kemasyarakatan maupun ekonomi"
  - "Sosialisme mendukung kebebasan ekonomi yang kuat tetapi membatasi kebebasan kemasyarakatan untuk menjaga ketertiban sosial"
  - "Sosialisme memberikan kebebasan tak terbatas di kedua ranah dan mengandalkan kerja sama sukarela untuk menjaga keseimbangan"
explanation: >-
  Dalam pemikiran sosialis, terdapat dikotomi mendasar antara kebebasan kemasyarakatan dan ekonomi. Kebebasan kemasyarakatan kuat, tetapi kebebasan ekonomi lemah karena penekanan pada kontrol negara, perencanaan, dan redistribusi kekayaan. Jawaban salah ketiga menggambarkan ideal libertarian, sementara yang kedua menggambarkan pola konservatif, yang merupakan bayangan cermin dari sosialisme.
reviewed: false
