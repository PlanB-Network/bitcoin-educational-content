question: بافرهای با طول متغیر در سیستم نوع Simplicity چگونه نمایش داده می‌شوند؟
answer: به صورت حاصل‌ضرب‌های تودرتوی نوع option، که هر لایه یک بلوک توانِ دو را علامت‌گذاری می‌کند.
wrong_answers:
  - با استفاده از یک نوع آرایه پویای ویژه که مستقیماً در زبان تعبیه شده است.
  - از طریق نوع‌های مجموع بازگشتی که در هر فراخوانی تابع بزرگ‌تر می‌شوند.
  - به صورت بردارهای با اندازه ثابت که با مقادیر صفر پایانی پر می‌شوند.
explanation: >-
  بافرها از نوع‌های option تودرتو استفاده می‌کنند. برای مثال، Xᑉ⁸ به
  (1 + X⁴) × ((1 + X²) × (1 + X)) گسترش می‌یابد، که به عنوان یک چندجمله‌ای برابر است با
  1 + X + X² + ... + X⁷ — و مجموعه‌هایی از 0 تا 7 عنصر را نمایش می‌دهد.
  هر لایه option نشان می‌دهد که آیا یک بلوک با اندازه توانِ دو حاضر است یا نه،
  و در عمل طول را به صورت دودویی کُدگذاری می‌کند.
reviewed: false
