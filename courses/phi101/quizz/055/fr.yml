question: En quoi l'éthique biblique se distingue-t-elle de l'éthique antique ?
answer: L'éthique biblique attribue une valeur infinie à l'individu car il est créé à l'image de Dieu, tandis que l'éthique antique subordonne l'homme au cosmos.
wrong_answers:
  - L'éthique biblique prône l'amour du prochain et la compassion, tandis que l'éthique antique met l'accent sur la justice et la réciprocité.
  - L'éthique biblique se concentre sur l'observance rituelle, tandis que l'éthique antique repose sur la recherche rationnelle.
  - L'éthique biblique s'adresse à tous les hommes, tandis que l'éthique antique est réservée à une élite de citoyens.
explanation: |
  La différence fondamentale est que l'éthique biblique affirme la valeur sacrée et infinie de chaque individu créé à l'image de Dieu, tandis que la pensée antique subordonnait l'homme à un cosmos divin, le traitant comme simple partie d'un ordre plus vaste.
reviewed: true
