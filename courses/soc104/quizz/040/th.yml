question: "โครงการช่วยเหลือสังคมที่รัฐจัดหาเงินสามารถสร้างผลเสียย้อนกลับอย่างไร ซึ่งแสดงให้เห็นอันตรายของการพึ่งพาเจตนาเพียงอย่างเดียว?"
answer: "มันอาจสร้างการพึ่งพา ลดแรงจูงใจให้ทำงาน และเท่ากับการปล้น เพราะเงินต้องถูกเอามาจากผู้ที่ผลิตความมั่งคั่งก่อน"
wrong_answers:
  - "มันกระตุ้นการออมส่วนบุคคลมากเกินไป ลดการใช้จ่ายของผู้บริโภค และก่อให้เกิดภาวะเงินฝืดในเศรษฐกิจโดยรวม"
  - "มันทำให้กิจการเอกชนแข็งแกร่งขึ้นโดยผลักต้นทุนแรงงานไปให้รัฐบาล และลดความจำเป็นของค่าจ้างที่แข่งขันได้"
  - "มันกำจัดความแตกต่างทางชนชั้นอย่างทั่วถึงจนการเลื่อนสถานะทางสังคมกลายเป็นสิ่งไม่จำเป็น และนวัตกรรมหยุดชะงัก"
explanation: >-
  Friedman เตือนว่าเจตนาอันเอื้อเฟื้ออาจสร้างผลลัพธ์ที่เป็นอันตรายเมื่อมันละเลยการวิเคราะห์แรงจูงใจของมนุษย์อย่างเข้มงวด โครงการช่วยเหลือที่รัฐจัดหาเงินเสี่ยงสร้างการพึ่งพา ไม่สร้างแรงจูงใจให้ทำงาน และประกอบเป็นรูปแบบหนึ่งของการปล้น เพราะเงินต้องถูกเอามาจากผู้ผลิตความมั่งคั่งก่อน ผลลัพธ์ที่วัดได้ เช่น การลดความยากจนและประสิทธิภาพ ต้องมาก่อนเจตนาอันสูงส่ง
reviewed: false
