question: half-agg-verify jet은 Writer effect로 tuple 집합을 log합니다. commutative/idempotent/unitary 테스트에서, 이 set design은 무엇을 달성하며 아직 무엇이 빠져 있나요?
answer: "Commutative이고 idempotent입니다(Simplicity가 요구하는 대로). 하지만 unitary는 아닙니다: 호출을 discard하면 그 tuple이 drop되어 signature 하나를 skip하게 됩니다."
wrong_answers:
  - Idempotent이고 unitary이지만 commutative는 아닙니다. aggregate가 signing order대로 r-components를 결합해야 하기 때문입니다.
  - 세 가지 모두입니다. 따라서 optimizer는 아무 위험 없이 호출을 자유롭게 duplicate, reorder, discard할 수 있습니다.
  - Commutative이지만 idempotent는 아닙니다. 같은 tuple을 두 번 logging하면 aggregate s-components 두 개가 필요하기 때문입니다.
explanation: >-
  writer log를 set으로 취급하면 effect는 idempotent이고
  commutative가 됩니다. set insertion 자체가 두 속성을 모두 갖기 때문입니다 — 정확히
  Simplicity가 모든 effect에 요구하는 두 가지입니다. Unitarity는 여전히
  도달할 수 없습니다. Failure와 마찬가지로 write는 transaction validity에 영향을 주는데,
  transaction은 aggregate s-component가 모든 logged tuple을 cover할 때만
  valid하기 때문입니다. 따라서 write를 수행하는 expression은
  unit output이 사용되지 않는다는 이유만으로 discard될 수 없습니다. 그렇게 하면 그 tuple이
  half-aggregation verification에서 조용히 사라지기 때문입니다.
