question: "อนุรักษนิยมปฏิบัติต่อเสรีภาพในขอบเขตเศรษฐกิจและสังคมอย่างไร?"
answer: "เสรีภาพแข็งแกร่งในขอบเขตเศรษฐกิจ แต่เสรีภาพอ่อนแอในขอบเขตสังคม"
wrong_answers:
  - "เสรีภาพอ่อนแอทั้งในขอบเขตเศรษฐกิจและสังคม เพื่อรักษาระเบียบสังคมแบบดั้งเดิม"
  - "เสรีภาพแข็งแกร่งในขอบเขตสังคม แต่เสรีภาพอ่อนแอในขอบเขตเศรษฐกิจ"
  - "เสรีภาพเท่าเทียมและไร้ขีดจำกัดในทั้งสองขอบเขต พร้อมการแทรกแซงของรัฐบาลทุกชนิดให้น้อยที่สุด"
explanation: >-
  อนุรักษนิยมแสดงทวิภาคที่เป็นภาพสะท้อนกลับของสังคมนิยม ในขอบเขตเศรษฐกิจ อนุรักษนิยมปกป้องตลาดเสรี ผู้ประกอบการ และทรัพย์สินส่วนตัว ในขอบเขตสังคม ข้อจำกัดถูกให้เหตุผลด้วยการรักษาบรรทัดฐานศีลธรรมแบบดั้งเดิมและเสถียรภาพทางสังคม คำตอบผิดข้อที่สามอธิบายแบบแผนสังคมนิยม ซึ่งเป็นสิ่งตรงข้าม
reviewed: false
