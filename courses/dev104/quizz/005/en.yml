question: What does the 'name' attribute in HTML form elements primarily accomplish?
answer: It identifies form fields so data can be passed to servers
wrong_answers:
  - It sets the visible label text that users see on the webpage
  - It determines the visual styling and appearance of the form element
  - It creates unique anchor links for navigation within the page
explanation: |
  The 'name' attribute in HTML form elements serves as an identifier that allows form data to be properly transmitted to servers when the form is submitted. When a user fills out a form and clicks submit, the server receives the data in name-value pairs, where the 'name' attribute becomes the key that identifies each piece of data. This is different from visible labels (which require separate label elements), styling (which is handled by CSS or style attributes), or navigation anchors (which use the 'id' attribute instead).
