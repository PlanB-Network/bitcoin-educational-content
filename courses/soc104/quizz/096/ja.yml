question: "中央集権化についてのサイファーパンク哲学は、同意を正義の根本規範とするリバタリアン原則とどのようにつながるか？"
answer: "サイファーパンクは、あらゆる中央集権化を同意ではなく強制に基づくものと見なし、中央集権的権威が力によって押しつけるものは何も正当ではあり得ないというリバタリアンの立場と響き合っている"
wrong_answers:
  - "サイファーパンクは、民主的多数決によって承認されれば中央集権化は許容されると考え、立憲統治を尊重するリバタリアンの姿勢と一致している"
  - "サイファーパンクは緊急時の一時的な中央集権化を支持し、集団が脅かされたときには個人の権利を停止できるというリバタリアンの見解を反映している"
  - "サイファーパンクは技術システムにおける中央集権化だけに反対し、財産権と契約を執行するためには政治的中央集権化が必要だと受け入れている"
explanation: >-
  サイファーパンクは、中央集権的制度ではなく、分散型暗号システムに信頼を置く。
  あらゆる中央集権化は、同意ではなく強制に基づくものとして認識される。
  これは、同意が正義の根本規範であるというリバタリアン哲学と直接響き合う。
  中央集権的権威によって力を通じて押しつけられたものは、何も正当ではあり得ない。
  だからこそ彼らは、単一の実体が自らの意思を押しつけられない分散型ネットワークを構築しようとした。
reviewed: false
