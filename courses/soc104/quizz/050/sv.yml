question: "Hur illustrerar George W. Bushs svar på finanskrisen 2008 den 'problematiska flexibiliteten' hos konservativa principer?"
answer: "Han övergav frimarknadsprinciper för att rädda stora banker, vilket avslöjade den konservativa synen på staten som den yttersta garanten för nationell ekonomisk stabilitet"
wrong_answers:
  - "Han vägrade all statlig intervention och lät bankerna gå omkull, i strikt följsamhet till frimarknadsideologi oavsett konsekvenser"
  - "Han nationaliserade banksektorn permanent och införde progressiv beskattning, vilket innebar ett skifte från konservatism till demokratisk socialism"
  - "Han svarade genom att skära ned alla offentliga utgifter och avskaffa finansiella regleringar för att låta marknaden korrigera sig själv"
explanation: >-
  Bush förklarade att han hade 'övergett frimarknadsprinciper för att rädda frimarknadssystemet' genom att ingripa för att rädda de stora bankerna. Detta illustrerar hur konservativa kan prioritera nationens makt och kontinuitet framför abstrakta marknadsprinciper. Samma flexibla logik syns i Trumps protektionistiska handelspolitik, som drivs i det nationella intressets namn med risk för att underblåsa korporatism och svågerkapitalism.
reviewed: false
