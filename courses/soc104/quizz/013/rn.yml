question: "Ni ukwivuguruza kw'imbere ukuhe kuri mu ba libertarians ku gishushanyo ca Nolan?"
answer: "Bamwe bashaka gukuraho leta burundu (anarcho-capitalists), mu gihe abandi bahitamwo leta ntoya igumana ibikorwa nyamukuru vy'ubusegaba (minarchists)"
wrong_answers:
  - "Bamwe bashaka igenzura rikomeye ry'ubutunzi, mu gihe abandi bashaka gukuraho burundu amategeko ngenderwako mu mashirahamwe yose y'inganda"
  - "Bamwe bashigikira amatora ya demokarasi, mu gihe abandi bashigikira uburyo bw'ubutegetsi buhererekanywa mu muryango"
  - "Bamwe basaba amapolitike y'ikibano y'iterambere, mu gihe abandi barwanira cane agaciro k'imigenzo y'inyifato"
explanation: >-
  Mu muryango wa libertarian, hari ukutumvikana kw'ishimikiro ku ruhara rwa leta. Anarcho-capitalists bashaka gusubiriza ibikorwa vyose vya leta n'ibikorwa vy'abikorera, mu gihe minarchists bemera leta ntoya igumana ibikorwa nyamukuru vy'ubusegaba nk'ukwivuna abansi n'amasentare. Iyo migwi yompi isangiye isonga rya libertarian, ariko itandukaniye ku kibazo co kumenya nimba hari leta n'imwe ikwiye kubaho.
