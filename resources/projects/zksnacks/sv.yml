description: |
  "Zk" i zkSNACKs står för zero knowledge, vilket innebär att vi inte samlar in någon personlig användarinformation i våra produkter.

  zkSNACKs stängde sin coinjoin-koordinator den 1 juni 2024, och webbplatsen är offline. Wasabi Wallet fortsätter som programvara med öppen källkod.
  