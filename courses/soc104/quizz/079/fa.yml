question: "استدلال بنیادین هایک دربارهٔ اینکه چرا برنامه‌ریزی مرکزی شکست می‌خورد چیست؟"
answer: "دانش فقط به‌صورت قطعات پراکنده‌ای وجود دارد که در اختیار افراد متمایز است و نمی‌تواند به‌وسیلهٔ یک مرجع مرکزی متمرکز یا یکپارچه شود"
wrong_answers:
  - "برنامه‌ریزان مرکزی از نظر اخلاقی فاسدند و همیشه به‌جای خیر عمومی، در راستای منفعت شخصی خود عمل می‌کنند"
  - "نهادهای دموکراتیک برای پاسخ‌گویی به تغییرات اقتصادی بیش از حد کند هستند و تصمیم‌های متمرکز را همیشه از رده خارج می‌کنند"
  - "برنامه‌ریزی مرکزی شکست می‌خورد، زیرا شهروندان عمداً در برابر دستورات دولت مقاومت می‌کنند و از تبعیت از مقررات سر باز می‌زنند"
explanation: >-
  استدلال بنیادین هایک بر ماهیت اطلاعات تکیه دارد. او نشان داد که دانش هرگز به‌شکل متمرکز یا یکپارچه وجود ندارد، بلکه فقط به‌صورت قطعات پراکنده‌ای است که همهٔ افراد متمایز در اختیار دارند. ارزش ذهنی است و فقط به‌صورت محلی و ناقص شناخته می‌شود. برنامه‌ریز مرکزی، که در دفتر خود نشسته است، هیچ دانشی از قیمت واقعی چیزها ندارد، زیرا درگیر تعامل و مبادله نیست.
reviewed: false
