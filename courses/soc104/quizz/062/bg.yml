question: "Как всички тоталитарни режими идват на власт?"
answer: "Чрез насилствена революция, която оправдава изчистването на предишната система до нула"
wrong_answers:
  - "Чрез постепенна законодателна реформа в рамките на съществуващите демократични институции"
  - "Чрез военни преврати, организирани от чужди сили, търсещи регионален контрол"
  - "Чрез мирни масови движения, които печелят народни избори с голяма преднина"
explanation: >-
  Всички тоталитарни режими идват на власт чрез насилствена революция. Тази революция служи на двойна цел: физически унищожава стария ред и идеологически оправдава употребата на насилие като необходима за изграждането на новото общество. Това отличава тоталитарните завземания на властта от демократичните преходи, подкрепените от чужбина преврати или мирните изборни победи.
reviewed: false
