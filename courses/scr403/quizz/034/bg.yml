question: Проследете full-adder при ⟨⟨1,1⟩,1⟩ (1+1+1). Каква стойност подава вторият етап, O O H ▵ (O I H ▵ I H ⨾ half-adder), към финалния етап?
answer: ⟨1, ⟨0, 1⟩⟩ — преносът на първия half-adder, после преносът и сумата на втория.
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ — преносът на първия half-adder, после сумата и преносът на втория.
  - ⟨0, ⟨0, 1⟩⟩ — сумарният бит на първия half-adder, после преносът и сумата на втория.
  - ⟨1, ⟨1, 1⟩⟩ — преносът на първия half-adder, после OR и XOR битовете на втория.
explanation: >-
  Първият етап изчислява half-adder⟨1,1⟩ = ⟨1, 0⟩ (пренос 1, сума 0) и запазва
  входния пренос, давайки ⟨⟨1,0⟩, 1⟩. Във втория етап O O H извлича първия
  пренос (1), докато O I H ▵ I H подава ⟨0, 1⟩ — първата сума и входния
  пренос — към втория half-adder, давайки ⟨0, 1⟩, тъй като and(0,1)=0 и
  xor(0,1)=1. Финалният етап след това прилага OR върху двата преноса и запазва сумата,
  произвеждайки ⟨1, 1⟩: двоично 3, както се очаква.
