question: "Jak Bitcoin działa jako projekt moralny z konsekwencjami politycznymi, a nie projekt polityczny z roszczeniami moralnymi?"
answer: "Bitcoin został zaprojektowany, aby uczynić ludzi wolnymi, a nie bogatymi, umożliwiając skuteczną własność, chroniąc wartość pracy i zachowując prywatność, czyli osiągnięcia moralne, które wywołują skutki polityczne bez roszczenia sobie prawa do żadnego obozu politycznego"
wrong_answers:
  - "Bitcoin jest projektem moralnym, ponieważ jego kod egzekwuje zasady etyczne zapobiegające oszustwom, a jego konsekwencją polityczną jest zastąpienie rządów demokratycznych podejmowaniem decyzji przez algorytmy"
  - "Bitcoin działa jako projekt moralny, ponieważ redystrybuuje bogactwo od bogatych do wczesnych użytkowników, tworząc sprawiedliwsze społeczeństwo z konsekwencjami politycznymi dla polityki podatkowej"
  - "Bitcoin jest moralny, ponieważ Satoshi Nakamoto umieścił w protokole przykazania etyczne, a jego konsekwencją polityczną jest zjednoczenie wszystkich rodzin politycznych pod wspólnym systemem monetarnym"
explanation: >-
  Bitcoin nie został zaprojektowany po to, aby uczynić ludzi bogatymi, lecz aby uczynić ich wolnymi. Osiąga trzy wyniki moralne: umożliwia skuteczną własność (zachęcając do odpowiedzialności), chroni wartość stworzoną przez pracę (zachęcając do produktywnego wysiłku) i zachowuje prywatność (pozwalając ludziom żyć bez lęku). Są to osiągnięcia moralne, które niosą konsekwencje polityczne, nie należąc do żadnego obozu politycznego, co czyni go najpierw projektem moralnym, a dopiero potem politycznym.
reviewed: false
