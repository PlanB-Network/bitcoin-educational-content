question: "為什麼本課程將 Bitcoin 描述為反對國家貨幣的市場貨幣，而不是右翼或左翼計畫？"
answer: "因為 Bitcoin 是一種自願採用、難以生產、去中心化且能保值的貨幣，與強制性、中心化且會貶值的法定貨幣形成對比，使分歧關乎市場對國家，而非政治意識形態"
wrong_answers:
  - "因為 Bitcoin 是由一位匿名開發者創造的，他刻意避免就其預期目的或哲學發表任何政治聲明"
  - "因為 Bitcoin 的挖礦演算法確保新幣平均分配給所有政黨，防止貨幣系統中出現任何意識形態偏見"
  - "因為 Bitcoin 的運作與現有法定貨幣完全相同，只是運行在更快的支付網路上，使政治區分變得無關緊要"
explanation: >-
  Bitcoin 被描述為對貨幣政治化的和平反抗。國家貨幣或法定貨幣是一種強制性、中心化且傾向於貶值的系統。市場貨幣，歷史上是黃金，如今則是 Bitcoin，是健康、難以生產的貨幣，會自願出現並長期保有其價值。真正的對立不是左派對右派，而是市場對國家，使 Bitcoin 成為超越傳統意識形態陣營的政治斷裂。
reviewed: false
