question: "親商與親市場之間的關鍵區別是什麼？"
answer: "親商倡議者尋求國家干預，以保護特定公司免於失敗；親市場倡議者則支持解除管制，並允許企業失敗，使市場能自然重組"
wrong_answers:
  - "親商倡議者聚焦大型企業，而親市場倡議者只專注於支持小型企業與新創公司"
  - "親商是偏左翼立場，偏好工人合作社；親市場是偏右翼立場，偏好私人所有權"
  - "親商倡議者拒絕所有競爭，而親市場倡議者支持由政府管制的核准企業之間競爭"
explanation: >-
  親商立場把競爭視為透過法規取得的治理工具，並以避免失業為理由正當化補貼與救助。在親商觀點中，市場是脆弱的，需要國家拯救。親市場倡議者把競爭視為自由企業的自然結果，這意味著解除管制並允許企業失敗，因為失敗讓市場自然重組，並為更有能力的行動者開啟領域。
reviewed: false
