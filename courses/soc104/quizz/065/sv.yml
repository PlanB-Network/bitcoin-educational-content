question: "Hur skilde sig de ekonomiska angreppssätten i Hitlers Tyskland och Stalins Sovjetunionen, trots deras gemensamma totalitära metoder?"
answer: "Nazityskland upprätthöll ett sken av privat ägande samtidigt som den privata sektorn underordnades statens mål, medan stalinismen avskaffade allt privat ägande och planerade ekonomin fullt ut"
wrong_answers:
  - "Nazityskland nationaliserade alla industrier fullt ut, medan Stalins regim tillät begränsat privat företagande inom jordbruket"
  - "Nazityskland främjade fri internationell handel för att finansiera återupprustning, medan stalinismen införde fullständig ekonomisk isolering"
  - "Nazityskland förlitade sig på frivilligt företagsmässigt samarbete med staten, medan stalinismen endast använde tvångsarbete"
explanation: >-
  Även om båda regimerna använde identiska politiska metoder (personkult, total övervakning, systematisk eliminering av opposition) skilde sig deras ekonomiska modeller till formen. Nazityskland avskaffade inte formellt privat egendom men underordnade helt den privata sektorn statliga mål som krig och återupprustning, och införde ekonomisk autarki. Stalinismen gick längre genom att avskaffa allt privat ägande, införa femårsplaner och direkt kontrollera all produktion och distribution.
reviewed: false
