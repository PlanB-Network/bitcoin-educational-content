question: "Mikä on etatismin määritelmä Nolanin viitekehyksessä esitettynä?"
answer: "Lainsäädännön käyttämistä yhteiskunnan hallitsemiseen ja muovaamiseen, joko sivilisaation, työväenluokan, luonnon tai sorrettujen puolustamisen nimissä"
wrong_answers:
  - "Hallintojärjestelmä, jossa vaaleilla valitut viranhaltijat palvelevat määräaikaisia kausia ja valta vaihtuu demokraattisten vaalien kautta"
  - "Uskomus, että vain vahva armeija voi suojella kansakunnan suvereniteettia ja alueellista koskemattomuutta"
  - "Taloudellinen filosofia, joka asettaa kansalliset teollisuudenalat ulkomaisen kilpailun edelle tullien ja kiintiöiden avulla"
explanation: >-
  Etatismi määritellään lainsäädännön käyttämiseksi yhteiskunnan hallitsemiseen ja muovaamiseen. Sekä vasemmisto että oikeisto harjoittavat sitä: jotkut sivilisaation puolustamisen nimissä, toiset työväenluokan, luonnon tai sorrettujen puolustamisen nimissä. Myös keskustalaiset hyväksyvät sen silloin, kun se sopii heille. Etatismi ei rajoitu sotilaspolitiikkaan, kaupan protektionismiin tai pelkkään vaaleilla valittujen hallitusten olemassaoloon.
reviewed: false
