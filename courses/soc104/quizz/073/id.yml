question: "Bagaimana posisi konservatif dan libertarian tentang upah minimum berbeda dalam penalarannya, meskipun keduanya mendukung penghapusannya?"
answer: "Kaum konservatif menerima sebagian keterlibatan negara dalam penetapan upah jika hal itu tidak menghambat daya saing, sementara libertarian memandang upah minimum sebagai pemaksaan moral terhadap kebebasan untuk merekrut dan berbisnis"
wrong_answers:
  - "Kaum konservatif menentang upah minimum karena ia menciptakan inflasi, sementara libertarian menentangnya karena ia memberi terlalu banyak kekuasaan kepada serikat pekerja"
  - "Kaum konservatif ingin upah ditetapkan oleh institusi keagamaan dan komunitas, sementara libertarian ingin upah ditentukan oleh studi pasar yang disetujui pemerintah"
  - "Kaum konservatif percaya upah minimum harus berbeda menurut wilayah, sementara libertarian percaya satu upah tetap harus berlaku secara nasional"
explanation: >-
  Keduanya mendukung pengurangan atau penghapusan upah minimum, tetapi penalaran mereka berbeda secara mendasar. Kaum konservatif menerima sebagian keterlibatan negara dalam penetapan upah sambil menegaskan bahwa keterlibatan itu tetap minimal dan bergantung konteks, dengan fokus pada daya saing. Libertarian mengambil posisi moral yang lebih kuat: upah minimum adalah pemaksaan terhadap kebebasan untuk merekrut dan berbisnis. Ketika libertarian mengatakan "pasar", yang mereka maksud adalah kontrak, yang dinegosiasikan secara bebas antara dua pihak tanpa campur tangan negara.
