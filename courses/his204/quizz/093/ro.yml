question: Potrivit lui Condorcet, de ce era Turgot sortit eșecului?
answer: Era prea onest pentru jocul politic de la Paris
wrong_answers:
  - Îi lipseau cunoștințele de teorie economică
  - Constituția sa fizică era prea slabă
  - Era prea tânăr pentru funcție
explanation: |
  Condorcet i-a spus lui Turgot: „Nu ești deloc un șarlatan, iar acesta este un defect, având în vedere cum stau lucrurile la Paris.” El a subliniat numeroșii adversari cu care Turgot avea să se confrunte: favoriții regelui, parlamentele, clerul, nobilimea și breslele. Aceste grupuri se așteptau la lingușire, nu la reformă.
