question: "以下哪一项是 Hayek 所描述的自发秩序的例子？"
answer: "语言，它通过历史互动有机发展，而不是由办公室里的知识分子设计出来"
wrong_answers:
  - "一部国家宪法，它由民选代表精心起草，以建立社会规则"
  - "一项政府刺激计划，它由经济学家设计，用来协调经济活动"
  - "一套公共教育体系，它由立法者创建，以确保普遍获得知识"
explanation: >-
  Hayek 把自发秩序描述为社会中自由互动的产物，源于人类行动，但并非源于人类有意设计。语言就是一个典型例子：法语、英语和德语并不是由知识分子决定语法规则而建构出来的，而是通过历史互动建立起来的缓慢、有机组织的果实。
