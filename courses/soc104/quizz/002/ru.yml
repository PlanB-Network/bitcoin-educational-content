question: "Какой руководящий принцип определял голосования Фредерика Бастиа в Национальном собрании?"
answer: "Продвижение индивидуальных и экономических свобод и сокращение государственного вмешательства"
wrong_answers:
  - "Защита королевской власти и сохранение монархических традиций"
  - "Продвижение социалистической политики для более равного перераспределения богатства"
  - "Центристская стратегия компромисса между левыми и правыми фракциями"
explanation: >-
  Бастиа голосовал, исходя из фундаментального принципа: продвигать индивидуальные и экономические свободы, сокращая государственное вмешательство. Он не был ни центристским оппортунистом, ни роялистом, ни социалистом. Он голосовал вместе с той стороной, которая предлагала меры, соответствующие свободе и ограниченному государству.
reviewed: false
