question: "What does the economic freedom category include?"
answer: "What you do as a producer and consumer: buying, selling, producing, working, hiring, and managing your money"
wrong_answers:
  - "Your religious beliefs, personal relationships, and freedom of expression"
  - "Your right to vote, participate in elections, and join political parties"
  - "Your ability to travel freely, choose your residence, and cross national borders"
explanation: >-
  Economic freedom covers what you do as a producer and consumer: what you can buy, sell, or produce; where you work; who you hire; and what you do with your money. Personal relationships, religious beliefs, and freedom of movement fall under the personal freedom category, not the economic one.
reviewed: false
