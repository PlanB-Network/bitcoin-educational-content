question: "Als je het volledige betoog van deze cursus bekijkt, hoe belichaamt Bitcoin dan tegelijk de libertaire kritiek op constructivisme, de cypherpunk-inzet tot handelen en de individualistische verdediging van morele autonomie?"
answer: "Bitcoin vervangt centraal gepland geld door een spontane marktorde (anti-constructivisme), zet het abstracte ideaal van financiële vrijheid om in werkende code (cypherpunk-actie), en herstelt soeverein eigendom en privacy voor het individu (morele autonomie)"
wrong_answers:
  - "Bitcoin gebruikt democratisch bestuur om monetair beleid vast te stellen (anti-constructivisme), publiceert educatieve content over financiële vrijheid (cypherpunk-actie), en laat individuen stemmen over protocolwijzigingen (morele autonomie)"
  - "Bitcoin elimineert alle financiële regulering (anti-constructivisme), creëert een gemeenschap van ontwikkelaars die lobbyen voor deregulering (cypherpunk-actie), en geeft rijke individuen meer controle over monetair beleid (morele autonomie)"
  - "Bitcoin decentraliseert serverinfrastructuur over meerdere landen (anti-constructivisme), gebruikt open-sourcelicenties om technologie vrij te delen (cypherpunk-actie), en biedt anonieme sociale-mediaplatforms voor politieke dissidentie (morele autonomie)"
explanation: >-
  Bitcoin bevindt zich op het snijpunt van drie intellectuele tradities die in de cursus worden verkend. Het belichaamt het anti-constructivistische argument door centraal gepland fiatgeld te vervangen door een spontane, gedecentraliseerde monetaire orde die geen centrale planner kan controleren. Het vervult de cypherpunk-imperatief om code te schrijven door abstracte idealen van financiële vrijheid en privacy om te zetten in werkende technologie. En het dient de individualistische verdediging van morele autonomie door soeverein eigendom mogelijk te maken, de vruchten van arbeid te beschermen en privacy te behouden, zodat ieder mens meester van zijn eigen leven kan zijn.
reviewed: false
