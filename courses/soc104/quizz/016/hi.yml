question: "Nolan diagram का ऊर्ध्वाधर अक्ष वास्तविक राजनीतिक प्रश्न के बारे में क्या प्रकट करता है?"
answer: "यह प्रकट करता है कि आप राज्य के माध्यम से अपनी संवेदनशीलताएँ दूसरों पर थोपना चाहते हैं, या यह पसंद करते हैं कि प्रत्येक व्यक्ति अपने लिए निर्णय लेने को स्वतंत्र हो"
wrong_answers:
  - "यह प्रकट करता है कि आप लोकतांत्रिक शासन का समर्थन करते हैं या किसी एक नेता के अधिनायकवादी शासन को पसंद करते हैं"
  - "यह प्रकट करता है कि आप प्रगतिशील सामाजिक आंदोलनों से अपनी पहचान जोड़ते हैं या पारंपरिक धार्मिक संस्थाओं से"
  - "यह प्रकट करता है कि आपकी प्राथमिक चिंता राष्ट्रीय सुरक्षा है या आर्थिक समृद्धि"
explanation: >-
  ऊर्ध्वाधर अक्ष वास्तविक राजनीतिक प्रश्न को उजागर करता है: यह नहीं कि आप वामपंथी हैं या दक्षिणपंथी, बल्कि यह कि आप अपने मूल्यों के अनुसार समाज को आकार देने में राज्य के हस्तक्षेप को किस हद तक चाहते हैं। क्या आप अपनी संवेदनशीलताएँ दूसरों पर थोपना चाहते हैं, या यह पसंद करते हैं कि प्रत्येक व्यक्ति अपने लिए निर्णय लेने को स्वतंत्र हो? यह दृष्टिकोण वाम-दक्षिण विभाजन से आगे जाता है और दिखाता है कि दोनों खेमे समान रूप से राज्यवादी हो सकते हैं।
reviewed: false
