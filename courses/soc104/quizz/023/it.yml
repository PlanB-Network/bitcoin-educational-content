question: "Come gestisce un libertario culturalmente conservatore i comportamenti che disapprova moralmente?"
answer: "Si oppone a quei comportamenti e li scoraggia attraverso la persuasione e l'esempio, ma senza ricorrere alla forza coercitiva della legge"
wrong_answers:
  - "Sostiene divieti del governo locale su quei comportamenti pur opponendosi ai divieti a livello federale"
  - "Rimane completamente in silenzio su quei comportamenti, credendo che qualsiasi forma di disapprovazione violi la libertà individuale"
  - "Sostiene tribunali comunitari che possano punire quei comportamenti al di fuori del sistema legale formale"
explanation: >-
  Il libertario culturalmente conservatore può disapprovare moralmente certi comportamenti, ma non sostiene la proibizione legale di azioni consensuali e non aggressive. Può non gradire tali azioni, opporvisi e scoraggiarle attivamente, ma sempre attraverso la persuasione, l'educazione e l'esempio invece che attraverso la forza coercitiva della legge. Non si tratta di restare in silenzio o di creare meccanismi alternativi di applicazione della norma.
