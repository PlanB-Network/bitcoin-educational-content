question: "Hva er den sosialistiske posisjonen om helsetjenester?"
answer: "Tilgang til helsetjenester er en grunnleggende rettighet, og staten må garantere et universelt, offentlig finansiert system for alle uavhengig av inntekt"
wrong_answers:
  - "Helsetjenester bør være et blandet system med grunnleggende statlig dekning supplert av private forsikringsalternativer"
  - "Private markeder leverer mer innovative helsetjenester, så individer bør fritt velge sitt eget system"
  - "Staten bør bare tilby helsetjenester til de fattigste borgerne, mens privat forsikring dekker alle andre"
explanation: >-
  For sosialister er tilgang til helsetjenester en grunnleggende rettighet, ikke en vare. Staten må garantere et universelt, offentlig finansiert helsesystem slik at alle har tilgang til behandling, uavhengig av inntekt. Dette gjenspeiler den sosialistiske bekymringen for likhet, sosial rettferdighet og statens betydning i å organisere tjenester i allmennhetens interesse. Det blandede systemet beskriver det sentristiske synet, mens valgbaserte tilnærminger gjenspeiler libertarianske og konservative posisjoner.
