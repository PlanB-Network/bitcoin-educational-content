question: "چرا لیبرتارین‌ها با مالیات مخالف‌اند؟"
answer: "زیرا مالیات نقض اخلاقی حقوق مالکیت است، شکلی از سرقت دولتی که دارایی دیگری را بدون رضایت او تصاحب می‌کند"
wrong_answers:
  - "زیرا مالیات‌ها از نظر اقتصادی ناکارآمدند و همیشه به نرخ‌های بالاتر بیکاری منجر می‌شوند"
  - "زیرا مالیات‌ستانی سرمایه‌گذاری خارجی را دلسرد می‌کند و موقعیت رقابتی یک کشور را تضعیف می‌سازد"
  - "زیرا نظام‌های مالیاتی تصاعدی ناعادلانه افراد ثروتمندی را هدف می‌گیرند که بیشترین شغل‌ها را ایجاد می‌کنند"
explanation: >-
  اعتراض لیبرتارین‌ها به مالیات پیش از آنکه اقتصادی باشد، اخلاقی است. لیبرتارین‌ها مالیات‌ستانی را شکلی از سرقت دولتی و مانعی بر مالکیت خصوصی می‌دانند، زیرا شامل تصاحب دارایی دیگری بدون رضایت اوست. هرچند ممکن است استدلال‌های اقتصادی علیه مالیات وجود داشته باشد، استدلال بنیادی لیبرتارین بر این اصل استوار است که مالیات حقوق مالکیت را نقض می‌کند، نه بر محاسبات کارایی یا رقابت‌پذیری.
