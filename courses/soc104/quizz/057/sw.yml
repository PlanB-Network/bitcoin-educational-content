question: "Kwa nini waliberali wa klasiki nchini Marekani walianza kujiita 'libertarians' katika karne ya ishirini?"
answer: "Kwa sababu 'uliberali' wa Marekani ulikuwa umetekwa na uingiliaji unaokua wa dola na dola ya ustawi"
wrong_answers:
  - "Kwa sababu walitaka kujitenga na mila za kifalme za Ulaya"
  - "Kwa sababu neno 'liberal' lilihusishwa na anarchism na vurugu za kisiasa"
  - "Kwa sababu mikataba mipya ya kibiashara ilihitaji utambulisho tofauti wa kisiasa kwa watetezi wa soko huria"
explanation: >-
  Katika karne ya ishirini, mabadiliko ya msingi yalitokea kadiri kanuni za laissez-faire zilivyoachwa taratibu kwa kupendelea dola ya ustawi. "Uliberali" wa Marekani ukaja kumaanisha kitu tofauti sana na uliberali wa klasiki, ukikumbatia uingiliaji wa dola. Waliberali wa klasiki walichukua neno "libertarian" ili kuhifadhi tofauti hiyo. Kujipa jina hili upya hakukuwa na uhusiano wowote na ufalme wa Ulaya, vurugu za anarchist, au mikataba ya kibiashara.
