question: "Koju zajedničku tačku dele levičarske i desničarske političke partije uprkos svom prividnom suprotstavljanju?"
answer: "Obe brane pravo države da upravlja životima ljudi putem propisa i poreza"
wrong_answers:
  - "Obe se zalažu za potpuno ukidanje državne intervencije u ekonomskim pitanjima"
  - "Obe daju prednost individualnoj slobodi nad kolektivnim uređenjem društva"
  - "Obe odbacuju korišćenje monetarne politike kao alata za državnu potrošnju"
explanation: >-
  Uprkos tome što deluju suprotstavljeno, levica i desnica dele sklonost ka državnoj intervenciji. Obe kritikuju slobodno tržište i brane pravo države da upravlja životima ljudi putem propisa i poreza. Levica kritikuje tržišta kao izvor nejednakosti, dok ih desnica vidi kao pretnju suverenitetu, ali obe se okreću državi kao izvoru rešenja.
