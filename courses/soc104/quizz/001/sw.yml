question: "Mgawanyiko wa kisiasa wa kushoto-kulia unatokana na nini?"
answer: "Mpangilio wa viti wakati wa mijadala ya Mapinduzi ya Ufaransa ya 1789"
wrong_answers:
  - "Maandishi ya Karl Marx na Adam Smith katika karne ya kumi na tisa"
  - "Vita vya wenyewe kwa wenyewe vya Marekani kati ya majimbo ya Kaskazini na Kusini"
  - "Wanafalsafa wa Mwangaza waliotenganisha akili na mapokeo"
explanation: >-
  Mgawanyiko wa kushoto-kulia ulianza mwaka 1789, wakati wawakilishi katika Bunge la Kitaifa la Ufaransa waliopendelea kudumisha mamlaka ya mfalme walikaa upande wa kulia wa rais, huku wale waliotaka kupunguza mamlaka yake wakikaa upande wa kushoto. Haukuanzia kwa Marx na Smith, Vita vya wenyewe kwa wenyewe vya Marekani, au falsafa ya Mwangaza.
reviewed: false
