question: "Fransız libertaire'leri (sosyalist anarşistler) özel mülkiyet hakkında neye inanır?"
answer: "Özel mülkiyet ve kapitalizm, baskı kaynakları oldukları için ortadan kaldırılmalıdır"
wrong_answers:
  - "Özel mülkiyet, devletten önce gelen doğal bir haktır ve her ne pahasına olursa olsun korunmalıdır"
  - "Özel mülkiyet devlet tarafından düzenlenmeli, ancak toplumdan hiçbir zaman tamamen kaldırılmamalıdır"
  - "Özel mülkiyet yalnızca bir komünün tüm üyeleri arasında eşit olarak dağıtıldığında kabul edilebilir"
explanation: >-
  Proudhon ve Bakunin gibi düşünürler aracılığıyla sosyalist anarşizmin mirasçıları olan Fransız libertaire'leri, hem devletin hem de özel mülkiyetin, ikiz baskı kaynakları olarak ortadan kaldırılması gerektiğini savunur. Bu, Proudhon'un ünlü "Mülkiyet hırsızlıktır." formülünde ifadesini bulur. İlk yanlış cevap, libertaire görüşe temelden karşı olan liberteryen pozisyonu açıklar.
