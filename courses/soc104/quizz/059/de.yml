question: "Was sind die Kardinalwerte des Zentrismus?"
answer: "Mäßigung, Kompromiss, Anpassung und öffentlicher Nutzen"
wrong_answers:
  - "Tradition, Ordnung, Autorität und nationale Identität"
  - "Freiheit, Privateigentum, Zustimmung und individuelle Verantwortung"
  - "Gleichheit, soziale Gerechtigkeit, Solidarität und kollektives Eigentum"
explanation: >-
  Die Kardinalwerte des Zentrismus sind Mäßigung, Kompromiss, Anpassung und öffentlicher Nutzen. Sie spiegeln die zentristische Betonung pragmatischen Ausgleichs statt ideologischer Verpflichtung wider. Die anderen Optionen beschreiben jeweils die Kardinalwerte des Konservatismus, Libertarismus und Sozialismus.
reviewed: false
