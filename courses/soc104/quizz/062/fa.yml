question: "تمایز کلیدی هانا آرنت میان استبداد کلاسیک و تمامیت‌خواهی چیست؟"
answer: "تمامیت‌خواهی صرفاً مردم را تابع قواعد خودکامه نمی‌کند، بلکه انسان‌ها را از کنش مستقل ناتوان می‌سازد و خود سیاست را نفی می‌کند"
wrong_answers:
  - "استبداد کلاسیک اقتصاد را کنترل می‌کند، در حالی که تمامیت‌خواهی فقط نهادهای سیاسی و نظامی را کنترل می‌کند"
  - "تمامیت‌خواهی صرفاً نسخه‌ای افراطی‌تر از استبداد است که فقط در مقیاس سرکوب تفاوت دارد"
  - "استبداد کلاسیک برای توجیه حکومت خود از ایدئولوژی استفاده می‌کند، در حالی که تمامیت‌خواهی صرفاً بر نیروی نظامی تکیه دارد"
explanation: >-
  آرنت استدلال می‌کند که تمامیت‌خواهی اساساً با استبداد کلاسیک متفاوت است. این صرفاً شکلی افراطی‌تر از خودکامگی نیست، بلکه نظامی است که انسان‌ها را زائد می‌سازد و ظرفیت آن‌ها برای کنش مستقل را نابود می‌کند. از نظر آرنت، سیاست توانایی یک مردم برای به‌دست گرفتن سرنوشت خویش است، و تمامیت‌خواهی نفی خود این توانایی است؛ از همین رو از نظر کیفی با استبداد متفاوت است.
reviewed: false
