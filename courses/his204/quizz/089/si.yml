question: මාර්ග ඉදිකිරීමට භාවිතා කළ ගෙවීමක් නොමැති බලහත්කාර ශ්‍රමය වූ Corvée ඔහුගේ සංශෝධනවල කේන්ද්‍රය විය. ඔහු එය කුමකින් ප්‍රතිස්ථාපනය කළේද?
answer: මුදල් බද්දකින්
wrong_answers:
  - භාණ්ඩයෙන් ගෙවන බද්දකින් (කෘෂිකාර්මික නිෂ්පාදන)
  - ඔහු එය කිසිවකින් ප්‍රතිස්ථාපනය නොකරයි
  - ස්වේච්ඡා පද්ධතියක් හරහා
explanation: |
  Turgot ගෙවීමක් නොමැති බලහත්කාර ශ්‍රමය වූ corvée, මුදල් බද්දකින් ප්‍රතිස්ථාපනය කළේය. එමඟින් මාර්ග ඉදිකිරීමේ බර පැතිරවූ අතර, ගොවීන් මෙම බැඳීමෙන් නිදහස් කළේය.