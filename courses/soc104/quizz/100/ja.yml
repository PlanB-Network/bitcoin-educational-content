question: "Eric Hughes の 1993 年の Cypherpunk Manifesto がプライバシーについて述べる核心的メッセージは何か？"
answer: "プライバシーは電子時代の開かれた社会に不可欠であり、個人は政府や企業がそれを保証してくれると期待するのではなく、自分たちで構築しなければならないということ"
wrong_answers:
  - "プライバシーは、国家安全保障と民主的制度の保護と引き換えに犠牲にされなければならない贅沢品であるということ"
  - "プライバシーは、すべての国にわたるデータ保護の統一基準を定める国際条約によって規制されるべきだということ"
  - "プライバシーは犯罪者や反体制派にだけ重要であり、法を守る市民は透明な監視システムから利益を得るということ"
explanation: >-
  Eric Hughes の 1993 年のマニフェストは、プライバシーは電子時代の開かれた社会に不可欠であり、政府、企業、その他の大規模組織がそれを保証してくれると期待することはできないと述べている。
  根本的な動機は、機密性が自由の重要な要素であり、制度からの贈り物として待つのではなく、個人自身によって構築されなければならないということである。
reviewed: false
