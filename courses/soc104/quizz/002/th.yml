question: "หลักการชี้นำใดที่ขับเคลื่อนการลงคะแนนของ Frederic Bastiat ในสมัชชาแห่งชาติ?"
answer: "การส่งเสริมเสรีภาพส่วนบุคคลและเศรษฐกิจ และการลดการแทรกแซงของรัฐบาล"
wrong_answers:
  - "การปกป้องอำนาจราชวงศ์และการรักษาจารีตของระบอบกษัตริย์"
  - "การผลักดันนโยบายสังคมนิยมเพื่อกระจายความมั่งคั่งให้เท่าเทียมมากขึ้น"
  - "ยุทธศาสตร์สายกลางที่ประนีประนอมระหว่างฝ่ายซ้ายกับฝ่ายขวา"
explanation: >-
  Bastiat ลงคะแนนโดยอิงหลักการพื้นฐานข้อหนึ่ง: ส่งเสริมเสรีภาพส่วนบุคคลและเศรษฐกิจ พร้อมกับลดการแทรกแซงของรัฐบาล เขาไม่ใช่นักฉวยโอกาสสายกลาง ไม่ใช่ฝ่ายนิยมกษัตริย์หรือสังคมนิยม เขาลงคะแนนกับฝ่ายใดก็ตามที่เสนอมาตรการสอดคล้องกับเสรีภาพและรัฐบาลจำกัด
reviewed: false
