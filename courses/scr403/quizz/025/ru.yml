question: "Что такое Commitment Merkle Root (CMR) в Simplicity?"
answer: 256-битный хеш, фиксирующий структуру программы Simplicity с помощью маркированного (tagged) SHA-256.
wrong_answers:
  - Двоичное дерево, содержащее все возможные пути выполнения программы Simplicity.
  - Хеш типов и значений свидетеля программы, используемый для проверки адреса.
  - Merkle-корень данных транзакции, к которым программа имеет доступ.
explanation: >-
  Каждый комбинатор Simplicity имеет уникальную SHA-256-метку (например,
  Simplicity␟Commitment␟iden), и CMR вычисляется путём рекурсивного
  хеширования дерева комбинаторов программы с использованием этих
  маркированных промежуточных состояний (midstates). Важно, что CMR не
  фиксирует типы выражений, полагаясь на вывод типов во время
  расходования (redemption). CMR используются для фиксации программ в
  адресах Taproot.
reviewed: true
