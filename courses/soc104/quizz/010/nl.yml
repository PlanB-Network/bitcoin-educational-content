question: "Waarom wordt de verticale as (boven-onder) in het Nolan-diagram als fundamenteler beschouwd dan de horizontale as (links-rechts)?"
answer: "Omdat ze de echte kloof onthult tussen degenen die maximale individuele vrijheden verdedigen en degenen die maximale staatscontrole voorstaan"
wrong_answers:
  - "Omdat ze economische output nauwkeuriger meet dan de horizontale as sociaal beleid meet"
  - "Omdat de meeste politieke conflicten door de geschiedenis heen over culturele identiteit gingen in plaats van bestuur"
  - "Omdat de horizontale as alleen geldt voor moderne democratieën terwijl de verticale as universeel is"
explanation: >-
  De fundamentele as is de verticale, omdat die de essentiële politieke vraag vat: in welke mate moet de staat menselijk handelen controleren? De links-rechtsas weerspiegelt slechts verschillende gevoeligheden (sociale rechtvaardigheid versus traditie), maar beide kanten kunnen op de verticale as dezelfde positie innemen als statisten. De verticale as onthult of iemand zijn visie met geweld wil opleggen of individuele vrijheid respecteert.
reviewed: false
