question: "Apa yang diungkapkan oleh deklarasi Mussolini tahun 1920 'Segalanya dalam Negara, tidak ada di luar Negara, tidak ada yang melawan Negara' tentang totalitarianisme?"
answer: "Tidak ada lagi pemisahan antara ruang publik dan privat, karena negara sepenuhnya menyerap masyarakat"
wrong_answers:
  - "Negara berfokus secara eksklusif pada kekuatan militer sambil menyerahkan ekonomi kepada perusahaan swasta"
  - "Warga bebas berorganisasi secara privat selama mereka tidak secara terbuka mengkritik pemerintah"
  - "Pemerintah hanya mengendalikan aktivitas politik sementara kehidupan budaya dan keagamaan tetap otonom"
explanation: >-
  Deklarasi Mussolini menangkap esensi totalitarianisme: totalitas. Segalanya diserap ke dalam negara, yang berarti tidak ada pemisahan antara ruang publik dan privat. Masyarakat kehilangan semua bentuk otonomi, sampai ke aktivitas paling sehari-hari seperti membuka klub olahraga. Ini jauh melampaui sekadar mengendalikan ranah militer, politik, atau ekonomi.
reviewed: false
