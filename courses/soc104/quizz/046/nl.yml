question: "Hoe behandelt conservatisme vrijheden in de economische en maatschappelijke sfeer?"
answer: "Sterke vrijheden in de economische sfeer maar zwakke vrijheden in de maatschappelijke sfeer"
wrong_answers:
  - "Zwakke vrijheden in zowel de economische als de maatschappelijke sfeer om de traditionele sociale orde te behouden"
  - "Sterke vrijheden in de maatschappelijke sfeer maar zwakke vrijheden in de economische sfeer"
  - "Gelijke en onbeperkte vrijheden in beide sferen met minimale overheidsinterventie van welke aard dan ook"
explanation: >-
  Conservatisme vertoont een tweedeling die het spiegelbeeld is van socialisme. In het economische domein verdedigen conservatieven de vrije markt, ondernemerschap en privé-eigendom. In het maatschappelijke domein worden beperkingen gerechtvaardigd door het behoud van traditionele morele normen en sociale stabiliteit. Het derde foute antwoord beschrijft het socialistische patroon, dat het tegenovergestelde is.
