question: "Каква е дефиницията за етатизъм, представена в рамката на Нолан?"
answer: "Използване на законодателството за контрол и оформяне на обществото, било в името на защитата на цивилизацията, работническата класа, природата или потиснатите"
wrong_answers:
  - "Система на управление, при която избрани длъжностни лица служат за фиксирани мандати и властта се предава чрез демократични избори"
  - "Убеждението, че само силна армия може да защити суверенитета и териториалната цялост на една нация"
  - "Икономическа философия, която дава приоритет на националните индустрии пред чуждестранната конкуренция чрез мита и квоти"
explanation: >-
  Етатизмът се дефинира като използване на законодателството за контрол и оформяне на обществото. И левицата, и десницата го практикуват: едни в името на защитата на цивилизацията, други в името на защитата на работническата класа, природата или потиснатите. Дори центристите го одобряват, когато им е удобно. Етатизмът не се свежда до военна политика, търговски протекционизъм или просто до наличието на избрани правителства.
