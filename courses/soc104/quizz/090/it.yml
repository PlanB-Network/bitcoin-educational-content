question: "Che cosa intendeva Ludwig von Mises quando scrisse che solo l'individuo pensa, ragiona e agisce?"
answer: "Che collettività come lo Stato o una nazione non hanno esistenza propria al di là delle azioni dei loro membri individuali"
wrong_answers:
  - "Che gli individui dovrebbero evitare di formare gruppi o associazioni perché l'azione collettiva è sempre dannosa"
  - "Che solo certi individui dotati sono capaci di pensiero razionale mentre la maggior parte delle persone segue l'istinto"
  - "Che pensare e ragionare sono attività private che non dovrebbero mai essere condivise o discusse in pubblico"
explanation: >-
  Mises chiarì che l'individualismo si oppone alla nozione che entità sociali come la società o la nazione possano esistere indipendentemente dagli individui che le compongono. Una collettività non ha esistenza propria al di là delle azioni dei suoi membri individuali. Non possiamo parlare in modo significativo dell'azione dello Stato o di un'azienda perché queste entità non hanno volontà o pensiero propri e agiscono solo tramite individui.
reviewed: false
