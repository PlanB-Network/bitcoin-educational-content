question: "Jaký konzistentní vzorec odlišuje centristickou metodu od postojů jiných politických rodin napříč všemi pěti ekonomickými debatami (daně, minimální mzda, zdravotnictví, životní prostředí, dotace)?"
answer: "Centristé se odmítají zavázat k pevnému principu a místo toho vyžadují empirickou analýzu a expertní hodnocení k určení politiky případ od případu, což činí jejich přístup ze své podstaty technokratickým"
wrong_answers:
  - "Centristé vždy zaujímají střední pozici mezi socialistickým a konzervativním postojem a v každé otázce rovným dílem rozdělují rozdíl"
  - "Centristé důsledně upřednostňují ekonomický růst před sociálním blahobytem, v daňové politice se staví na stranu libertariánů a v regulaci souhlasí se socialisty"
  - "Centristé přenechávají všechna ekonomická rozhodnutí mezinárodním organizacím a obchodním dohodám, místo aby vytvářeli nezávislou národní politiku"
explanation: >-
  Napříč všemi pěti ekonomickými debatami sleduje centristický přístup stejný vzorec: místo aby se zavázali k pevnému ideologickému principu, centristé před rozhodnutím vyžadují empirické důkazy a expertní hodnocení. U daní musí být správná úroveň určena analýzou. U minimální mzdy musí být její úroveň pragmaticky upravena. U zdravotnictví je ideální směs kalibrovaná experty. U životního prostředí musí politika vyvažovat konkurenceschopnost. U dotací musí být každý případ hodnocen podle vlastních zásluh. To činí centrismus inherentně technokratickým, což se liší od pouhého rozdělení rozdílu nebo odkládání rozhodnutí na mezinárodní orgány.
reviewed: false
