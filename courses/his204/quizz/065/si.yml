question: Adam Smith සහ Physiocrats හමුවූයේ කොහේද?
answer: පැරිසියේ
wrong_answers:
  - Glasgowහි
  - ලන්ඩනයේ
  - ඔවුන් කිසිවිටෙක හමු වී නැත
explanation: |
  Adam Smith යුරෝපයට කළ සංචාරයක් අතරතුර පැරිසියේදී Physiocrats හමුවිය. ඔහු ඔවුන්ගේ අදහස්වලින් ආභාෂය ලැබූ නමුත්, සමහර අංශවලින් Physiocracyගෙන් වෙනස් වූ තමන්ගේම ආර්ථික න්‍යායක්ද සංවර්ධනය කළේය.
