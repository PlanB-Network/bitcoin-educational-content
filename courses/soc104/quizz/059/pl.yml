question: "Jakie jest ważne rozróżnienie między postawą pro-biznesową a pro-rynkową?"
answer: "Postawa pro-biznesowa oznacza sprzyjanie sojuszowi między wielkimi przedsiębiorstwami a państwem, podczas gdy postawa pro-rynkowa oznacza wspieranie wolnej konkurencji bez państwowego faworyzowania"
wrong_answers:
  - "Postawa pro-biznesowa oznacza wspieranie małych firm, podczas gdy postawa pro-rynkowa oznacza wspieranie międzynarodowych korporacji"
  - "Postawa pro-biznesowa oznacza całkowity sprzeciw wobec regulacji, podczas gdy postawa pro-rynkowa oznacza akceptację umiarkowanych regulacji"
  - "Postawa pro-biznesowa skupia się na krajowym przemyśle, podczas gdy postawa pro-rynkowa skupia się na handlu międzynarodowym"
explanation: >-
  Centryści zwykle są pro-biznesowi, co oznacza, że sprzyjają pewnego rodzaju sojuszowi między wielkimi przedsiębiorstwami a państwem, co różni się od postawy pro-rynkowej. Postawa pro-rynkowa wspiera wolną konkurencję bez państwowego faworyzowania lub korporacyjnego protekcjonizmu. To rozróżnienie jest kluczowe, ponieważ polityki pro-biznesowe mogą tworzyć monopole i ochrony regulacyjne, które w rzeczywistości podważają konkurencję wolnorynkową.
