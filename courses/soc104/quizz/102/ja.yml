question: "リバタリアンは、個人が意思決定する能力について何を信じているか？"
answer: "個人は、自分の人生について自分自身の決定を下す権利と責任の双方を持っている"
wrong_answers:
  - "個人は、政策上の含意を理解している選出された代表者に相談した後でのみ決定を下すべきである"
  - "個人は一般に良い決定を下すことができず、政府機関の専門的な指導を必要とする"
  - "個人は経済的決定を自由に下すべきだが、すべての社会的・文化的問題では国家に従うべきである"
explanation: >-
  リバタリアンの観点からは、個人は自分自身の決定を下す権利と責任の双方を持っている。
  これは、左から右までの従来の政治的家族とは対照的である。
  それらは、政府が個人の人生や経済生活全般における重要な決定の一部または多くを下すべきだと考えている。
reviewed: false
