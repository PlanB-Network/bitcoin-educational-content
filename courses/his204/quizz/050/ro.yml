question: Ce critică le-a adus Quesnay discipolilor săi?
answer: Caracterul lor sectar
wrong_answers:
  - Liberalismul lor excesiv
  - Complezența lor față de puterea lui Ludovic al XV-lea
  - Lipsa lor de rigoare științifică
explanation: |
  Quesnay și-a criticat adepții pentru sectarismul și lipsa lor de deschidere față de alte idei. Se temea că dogmatismul lor va împiedica răspândirea fiziocrației.
