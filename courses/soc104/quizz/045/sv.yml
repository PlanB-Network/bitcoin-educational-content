question: "Vad betyder termen 'holism' i den socialistiska filosofins sammanhang?"
answer: "En syn på samhället som en odelbar helhet där kollektivet ges företräde framför individen"
wrong_answers:
  - "En filosofi som behandlar varje individ som en självständig enhet vars rättigheter inte kan åsidosättas av någon grupp"
  - "En ekonomisk teori som förespråkar att offentliga och privata sektorer balanseras i lika hög grad"
  - "En politisk strategi som integrerar alla minoritetsperspektiv i en enda konsensusbaserad plattform"
explanation: >-
  Holism kommer från grekiskans 'holos' som betyder 'helheten.' I socialistiskt tänkande syftar det på en syn på samhället som en odelbar helhet snarare än en enkel summa av individer. Den socialistiska staten strävar efter att ta ansvar för och styra mänsklig verksamhet i största möjliga utsträckning. Detta kollektiv kan representeras som en samhällsklass, en nation, en ras eller ett kön, men i varje fall definieras individen genom grupptillhörighet.
