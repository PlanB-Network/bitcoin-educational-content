question: "Kto sa často uvádza ako zakladateľská postava moderného konzervatizmu?"
answer: "Edmund Burke, ktorý obhajoval zachovanie inštitúcií a tradícií proti radikálnym zmenám Francúzskej revolúcie"
wrong_answers:
  - "Karl Marx, ktorý v devätnástom storočí rozvinul teóriu triedneho boja a historický materializmus"
  - "John Locke, ktorý v sedemnástom storočí sformuloval teóriu prirodzených práv a spoločenskej zmluvy"
  - "Adam Smith, ktorý napísal Bohatstvo národov a založil disciplínu klasickej ekonómie"
explanation: >-
  Edmund Burke sa často uvádza ako zakladateľská postava konzervatizmu pre svoj odpor voči Francúzskej revolúcii. Jeho Úvahy o revolúcii vo Francúzsku (1790) obhajovali rozvážnosť a postupnú reformu namiesto radikálnej zmeny. Veril, že spoločnosť má napredovať nie vymazaním minulosti, ale postupnými reformami, ktoré zachovávajú overené inštitúcie a tradície.
