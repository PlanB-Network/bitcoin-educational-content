question: "میانه‌گرایی به سوی چه شکلی از حکمرانی گرایش دارد؟"
answer: "تکنوکراسی، که در آن قدرت به کارشناسانی سپرده می‌شود که اقتصاد و سیاست پولی را هدایت می‌کنند"
wrong_answers:
  - "دموکراسی مستقیم، که در آن شهروندان درباره هر تصمیم سیاستی عمده رأی می‌دهند"
  - "اشراف‌سالاری، که در آن قدرت در دست یک طبقه حاکم سنتی است"
  - "حکمرانی لسه‌فر، که در آن بازار بدون مداخله دولت خود را تنظیم می‌کند"
explanation: >-
  میانه‌گرایی کارایی و عمل‌گرایی را ترجیح می‌دهد و به سوی تکنوکراسی گرایش دارد، یعنی قدرت باید به کارشناسانی سپرده شود که اقتصاد را هدایت و سیاست پولی را راهبری می‌کنند. این اساساً با دموکراسی مستقیم، اشراف‌سالاری، یا لسه‌فر تفاوت دارد، که هرکدام قدرت را بر اساس اصولی کاملاً متفاوت توزیع می‌کنند.
reviewed: false
