question: "Nolan diagram पर libertarians के बीच कौन-सा आंतरिक तनाव मौजूद है?"
answer: "कुछ लोग राज्य को पूरी तरह समाप्त करना चाहते हैं (anarcho-capitalists), जबकि अन्य मुख्य संप्रभु कार्यों को बनाए रखने वाला न्यूनतम राज्य पसंद करते हैं (minarchists)"
wrong_answers:
  - "कुछ लोग मजबूत आर्थिक विनियमन चाहते हैं, जबकि अन्य सभी उद्योगों के पूर्ण deregulation को पसंद करते हैं"
  - "कुछ लोग लोकतांत्रिक चुनावों का समर्थन करते हैं, जबकि अन्य शासन की वंशानुगत प्रणाली को पसंद करते हैं"
  - "कुछ लोग प्रगतिशील सामाजिक नीतियों की वकालत करते हैं, जबकि अन्य सख्ती से पारंपरिक नैतिक मूल्यों का बचाव करते हैं"
explanation: >-
  Libertarian परिवार के भीतर राज्य की भूमिका को लेकर एक मूलभूत असहमति है। Anarcho-capitalists सभी राज्य कार्यों को निजी सेवाओं से बदलना चाहते हैं, जबकि minarchists एक न्यूनतम राज्य स्वीकार करते हैं जो रक्षा और अदालतों जैसे मुख्य संप्रभु कार्य बनाए रखता है। दोनों समूह libertarian शिखर साझा करते हैं, लेकिन इस बात पर अलग हैं कि कोई राज्य होना भी चाहिए या नहीं।
