question: "Quale divisione fondamentale separò i socialisti dall'inizio del ventesimo secolo in poi?"
answer: "I socialisti rivoluzionari che cercavano di conquistare il potere attraverso la violenza, contrapposti ai socialisti riformisti che perseguivano il cambiamento attraverso elezioni democratiche"
wrong_answers:
  - "I socialisti urbani che si concentravano sui lavoratori industriali contro i socialisti rurali che organizzavano comuni agricole"
  - "I socialisti nazionalisti che davano priorità al proprio paese contro i socialisti internazionalisti che sostenevano la rivoluzione globale"
  - "I socialisti intellettuali che scrivevano testi teorici contro i socialisti attivisti che organizzavano scioperi dei lavoratori"
explanation: >-
  Dall'inizio del ventesimo secolo, una divisione fondamentale separò i socialisti rivoluzionari, che si opponevano ai diritti di proprietà e cercavano di distruggere la società capitalista attraverso la violenza o la dittatura del proletariato, dai socialisti riformisti, che perseguivano la giustizia sociale attraverso elezioni democratiche e tassazione, accettando temporaneamente il capitalismo. Questa scissione plasmò tutta la storia successiva dei movimenti socialisti.
