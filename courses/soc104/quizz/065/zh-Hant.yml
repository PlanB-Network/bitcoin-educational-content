question: "為什麼極權政權被描述為「世俗宗教」，而這揭示了極權主義存在所需的哪些條件？"
answer: "它們要求好戰分子具有準宗教式信仰，並用恐懼對付反對者；而極權主義要求所有特徵同時存在：被壓制的自由、一黨統治、暴力革命，以及受指導的經濟"
wrong_answers:
  - "它們以國家儀式取代傳統崇拜，而極權主義只需要魅力型領袖與軍事控制"
  - "它們利用宗教機構強制執行國家意識形態，而只要單一政黨主導議會，極權主義就可能出現"
  - "它們承諾透過政治行動帶來精神救贖，而只要國家控制經濟，不論政治自由如何，極權主義就存在"
explanation: >-
  Raymond Aron 觀察到，極權政權運作於兩項原則之上：好戰分子的信仰與反對者的恐懼。這種準宗教式狂熱主義，在它們不同動機之外刻畫了它們，使它們得到世俗宗教的標籤。關鍵的是，極權主義要求所有定義性特徵同時存在：被壓制的自由、透過單一政黨形成的無限權威、暴力革命，以及受指導的經濟。現代民主可能呈現其中某些特徵，但只有當所有特徵集合在一起時，極權主義才會存在。
reviewed: false
