question: "Tamko la Mussolini la mwaka 1920 'Kila kitu ndani ya Dola, hakuna kitu nje ya Dola, hakuna kitu dhidi ya Dola' linafichua nini kuhusu utotalitari?"
answer: "Hakuna tena utenganisho kati ya nyanja ya umma na ya binafsi, kwa kuwa dola huimeza jamii kikamilifu"
wrong_answers:
  - "Dola inalenga nguvu za kijeshi pekee huku ikiiacha uchumi kwa biashara binafsi"
  - "Raia wako huru kujipanga kwa faragha mradi hawakosoa serikali waziwazi"
  - "Serikali hudhibiti shughuli za kisiasa pekee huku maisha ya kitamaduni na kidini yakibaki huru"
explanation: >-
  Tamko la Mussolini linakamata kiini cha utotalitari: ukamilifu. Kila kitu humezwa ndani ya dola, kumaanisha hakuna utenganisho kati ya nyanja ya umma na ya binafsi. Jamii hupoteza kila aina ya uhuru, hadi shughuli za kawaida kabisa kama kufungua klabu ya michezo. Hili linakwenda mbali zaidi ya kudhibiti tu nyanja za kijeshi, kisiasa, au kiuchumi.
