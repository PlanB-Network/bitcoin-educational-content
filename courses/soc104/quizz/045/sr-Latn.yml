question: "Koja je fundamentalna podela razdvojila socijaliste od početka dvadesetog veka nadalje?"
answer: "Revolucionarni socijalisti koji su nastojali da osvoje vlast nasiljem naspram reformističkih socijalista koji su težili promenama kroz demokratske izbore"
wrong_answers:
  - "Urbani socijalisti koji su se usredsredili na industrijske radnike naspram ruralnih socijalista koji su organizovali poljoprivredne komune"
  - "Nacionalistički socijalisti koji su davali prioritet sopstvenoj zemlji naspram internacionalističkih socijalista koji su zagovarali globalnu revoluciju"
  - "Intelektualni socijalisti koji su pisali teorijske tekstove naspram aktivističkih socijalista koji su organizovali radničke štrajkove"
explanation: >-
  Od početka dvadesetog veka, fundamentalna podela razdvojila je revolucionarne socijaliste, koji su se protivili pravima svojine i nastojali da unište kapitalističko društvo nasiljem ili diktaturom proletarijata, od reformističkih socijalista, koji su težili socijalnoj pravdi kroz demokratske izbore i oporezivanje, privremeno prihvatajući kapitalizam. Ovaj raskol oblikovao je celu kasniju istoriju socijalističkih pokreta.
