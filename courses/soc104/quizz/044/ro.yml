question: "Ce distincție a făcut Karl Marx între socialismul utopic și socialismul științific?"
answer: "I-a acuzat pe primii socialiști francezi că propuneau soluții imaginare, în timp ce socialismul său științific era fundamentat în materialismul istoric și lupta de clasă"
wrong_answers:
  - "A argumentat că socialismul utopic era prea concentrat pe economie, în timp ce socialismul științific prioritiza transformarea culturală și artistică"
  - "I-a lăudat pe socialiștii utopici pentru experimentele lor practice și a criticat socialismul științific pentru că era prea abstract și teoretic"
  - "A susținut că socialismul utopic era violent și revoluționar, în timp ce socialismul științific favoriza reforma democratică pașnică"
explanation: >-
  Marx i-a acuzat pe primii socialiști francezi precum Proudhon, Saint-Simon și Fourier că erau utopici și propuneau soluții pur imaginare. Socialismul său științific se baza pe materialismul istoric: ideea că istoria progresează prin lupta de clasă și prin aproprierea mijloacelor de producție, unde toate reprezentările culturale sunt condiționate de forțele productive și de relațiile de producție.
