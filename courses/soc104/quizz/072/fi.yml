question: "Mikä on konservatiivinen kanta maahanmuuttoon?"
answer: "Valtiolla on suvereeni oikeus kontrolloida rajojaan kansallisen turvallisuuden ja kulttuurisen identiteetin suojelemiseksi"
wrong_answers:
  - "Rajojen tulisi olla ehdoitta avoimet, koska syrjivät rajoitukset rikkovat ihmisoikeuksia"
  - "Maahanmuuton tulisi määräytyä markkinakysynnän perusteella siten, että kansalaiset päättävät sopimuksellisesti suhteistaan ulkomaalaisiin"
  - "Maahanmuuttopolitiikan tulisi tasapainottaa taloudellisia tarpeita ja onnistunutta kotoutumista asiantuntija-arvioinnin perusteella"
explanation: >-
  Konservatiivit katsovat, että järjestyksen, identiteetin ja kansallisen suvereniteetin on oltava etusijalla ulkomaalaisten tai pakolaisten rajoittamattomaan vastaanottamiseen nähden. Rajat ja selkeästi määritelty väestö ovat osa sivistyneitä arvoja. Väärät vastaukset edustavat sosialistista kantaa (avoimet rajat ihmisoikeuksina), libertaarista kantaa (markkinaperustainen maahanmuutto) ja keskustalaista kantaa (tasapainoinen, asiantuntijavetoinen lähestymistapa).
