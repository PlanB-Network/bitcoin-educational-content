question: "Kako je Ron Paul ilustrovao paleo-libertarijansku poziciju o pitanjima poput upotrebe droga i abortusa?"
answer: "Lično je savetovao protiv upotrebe droga i protivio se abortusu, ali se politički borio protiv federalne zabrane i tvrdio da izbore treba prepustiti pojedincima ili saveznim državama"
wrong_answers:
  - "Podržavao je federalnu legalizaciju svih droga i abortusa kao stvar apsolutnih individualnih prava"
  - "Vodio je kampanju za stroge federalne zabrane i droga i abortusa, zasnovane na njegovim ličnim moralnim uverenjima"
  - "Odbijao je da izrazi bilo kakvo lično mišljenje o tim pitanjima, tvrdeći da političari treba da ostanu moralno neutralni"
explanation: >-
  Ron Paul oličava paleo-libertarijansku sintezu razdvajanjem ličnih moralnih uverenja od političke prinude. Uvek je savetovao protiv upotrebe droga, ali se istovremeno protivio zabrani droga. Lično se protivio abortusu, ali je tvrdio da izbor treba prepustiti saveznim državama, a ne nametati odozgo. To pokazuje kako neko može imati snažne tradicionalne vrednosti, a ipak odbijati da koristi prinudnu moć federalne vlade da ih sprovodi.
