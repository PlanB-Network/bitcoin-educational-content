question: "Hva er konstruktivisme som en delt politisk overbevisning?"
answer: "Troen på at en sentral regjering kan skape, med lovens makt, en sosial orden som er god for det største antallet"
wrong_answers:
  - "Troen på at samfunnet bør organiseres gjennom frivillig samarbeid mellom individer uten statlig innblanding"
  - "Troen på at bare frie markeder kan bestemme den optimale fordelingen av ressurser i samfunnet"
  - "Troen på at politisk autoritet bør fordeles likt mellom alle borgere gjennom direkte demokrati"
explanation: >-
  Konstruktivisme forener sentrister, konservative og sosialister rundt en delt overbevisning: den politiske prosessens overlegenhet over markedsprosessen. Det er troen på at en sentral regjering kan skape, med lovens makt, en sosial orden som er god for det største antallet. Dette står i direkte motsetning til det libertarianske forsvaret av spontan orden som oppstår fra frivillige samhandlinger.
reviewed: false
