question: "मादक पदार्थों के वैधीकरण पर लिबर्टेरियन स्थिति इस शर्त के साथ क्यों आती है कि समाज में राज्य की भूमिका घटाई जानी चाहिए?"
answer: "क्योंकि राज्य द्वारा संभाला गया उदारीकरण व्यक्तिगत जिम्मेदारी को सरकार-प्रबंधित देखभाल से बदल देगा, जबकि लिबर्टेरियन चाहते हैं कि नागरिक निजी संघों के समर्थन के साथ अपने चुनावों के परिणाम स्वयं भुगतें"
wrong_answers:
  - "क्योंकि राज्य-नियंत्रित वैधीकरण बहुत अधिक कर राजस्व पैदा करेगा, जिससे सरकार अत्यधिक शक्तिशाली और भ्रष्ट हो जाएगी"
  - "क्योंकि राज्य गुणवत्ता मानक लागू करेगा, जिससे कीमतें बढ़ेंगी और काले बाज़ार फिर बन जाएंगे"
  - "क्योंकि मादक पदार्थों का सरकारी नियमन अंतरराष्ट्रीय व्यापार समझौतों और कूटनीतिक संबंधों का उल्लंघन करेगा"
explanation: >-
  लिबर्टेरियन मादक पदार्थों के उदारीकरण का समर्थन करते हैं, लेकिन इस पर जोर देते हैं कि राज्य की भूमिका घटाई जानी चाहिए, क्योंकि उनका लक्ष्य व्यक्तिगत जिम्मेदारी को बहाल करना है, राज्य प्रबंधन को बढ़ाना नहीं। यदि कोई व्यक्ति निर्भर हो जाता है, तो उसे राज्य से देखभाल मांगने के बजाय जिम्मेदारी लेनी चाहिए। लत का समाधान निजी पहल में है: व्यक्तियों, परिवारों और परोपकारी संघों से स्वैच्छिक समर्थन। राज्य-प्रबंधित वैधीकरण व्यक्तिगत जिम्मेदारी के मूल लिबर्टेरियन सिद्धांत का विरोध करेगा।
reviewed: false
