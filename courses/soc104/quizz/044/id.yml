question: "Pembedaan apa yang dibuat Karl Marx antara sosialisme utopis dan sosialisme ilmiah?"
answer: "Ia menuduh para sosialis Prancis awal mengusulkan solusi imajiner, sementara sosialisme ilmiahnya berlandaskan materialisme historis dan perjuangan kelas"
wrong_answers:
  - "Ia berargumen bahwa sosialisme utopis terlalu berfokus pada ekonomi, sementara sosialisme ilmiah memprioritaskan transformasi budaya dan artistik"
  - "Ia memuji para sosialis utopis atas eksperimen praktis mereka dan mengkritik sosialisme ilmiah karena terlalu abstrak dan teoretis"
  - "Ia mengklaim sosialisme utopis bersifat kekerasan dan revolusioner, sementara sosialisme ilmiah mendukung reformasi demokratis yang damai"
explanation: >-
  Marx menuduh para sosialis Prancis awal seperti Proudhon, Saint-Simon, dan Fourier sebagai utopis yang mengusulkan solusi yang murni imajiner. Sosialisme ilmiahnya bertumpu pada materialisme historis: gagasan bahwa sejarah bergerak maju melalui perjuangan kelas dan apropriasi alat-alat produksi, di mana semua representasi budaya dikondisikan oleh kekuatan produktif dan relasi produksi.
