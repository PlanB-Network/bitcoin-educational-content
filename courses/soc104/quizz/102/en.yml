question: "What do libertarians believe about individuals' capacity to make decisions?"
answer: "Individuals have both the right and the responsibility to make their own decisions about their lives"
wrong_answers:
  - "Individuals should make decisions only after consulting with elected representatives who understand policy implications"
  - "Individuals are generally incapable of making good decisions and need expert guidance from government institutions"
  - "Individuals should make economic decisions freely but defer to the state on all social and cultural matters"
explanation: >-
  From a libertarian point of view, individuals have both the right and the responsibility to make their own decisions. This contrasts with conventional political families from left to right, which believe that government should make some or many of the important decisions in an individual's life and in economic life in general.
reviewed: false
