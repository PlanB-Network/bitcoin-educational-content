question: "Warum lehnen Libertäre Steuern ab?"
answer: "Weil sie eine moralische Verletzung von Eigentumsrechten sind, eine Form staatlichen Diebstahls, die das Eigentum eines anderen ohne Zustimmung beschlagnahmt"
wrong_answers:
  - "Weil Steuern wirtschaftlich ineffizient sind und immer zu höheren Arbeitslosenquoten führen"
  - "Weil Besteuerung ausländische Investitionen entmutigt und die Wettbewerbsposition eines Landes schwächt"
  - "Weil progressive Steuersysteme wohlhabende Personen unfair ins Visier nehmen, die die meisten Arbeitsplätze schaffen"
explanation: >-
  Der libertäre Einwand gegen Besteuerung ist moralisch, bevor er wirtschaftlich ist. Libertäre betrachten Besteuerung als eine Form staatlichen Diebstahls und als Hindernis für Privateigentum, weil sie darin besteht, das Eigentum eines anderen ohne Zustimmung zu beschlagnahmen. Zwar kann es wirtschaftliche Argumente gegen Besteuerung geben, doch das grundlegende libertäre Argument beruht auf dem Prinzip, dass sie Eigentumsrechte verletzt, nicht auf Berechnungen von Effizienz oder Wettbewerbsfähigkeit.
