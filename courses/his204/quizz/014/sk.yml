question: S ktorým neskorším mysliteľom Boisguilberta NEporovnávali?
answer: Adam Smith a neviditeľná ruka
wrong_answers:
  - Keynes a teória nedostatočnej zamestnanosti
  - Marx a triedna analýza
  - Walras a všeobecná rovnováha
explanation: |
  Moderní bádatelia Boisguilberta prehnane vyhlasovali za predchodcu Keynesa (nedostatočná zamestnanosť), Marxa (triedna analýza) a Walrasa (všeobecná rovnováha). Pojem neviditeľnej ruky sa však pripisuje markízovi d'Argensonovi, nie Boisguilbertovi. Ako sa spýtal jeden komentátor: "Koho alebo čoho by Boisguilbert nemohol byť predchodcom?"
