question: "Nolan රූපසටහනේ libertarians අතර පවතින අභ්‍යන්තර ආතතිය කුමක්ද?"
answer: "සමහරු රාජ්‍යය සම්පූර්ණයෙන් අහෝසි කිරීමට කැමති වන අතර (anarcho-capitalists), අනෙක් අය මූලික ස්වෛරී කාර්යයන් රඳවාගන්නා අවම රාජ්‍යයකට කැමති වෙති (minarchists)"
wrong_answers:
  - "සමහරු ශක්තිමත් ආර්ථික නියාමනයකට කැමති වන අතර අනෙක් අය සියලු කර්මාන්ත සම්පූර්ණයෙන් deregulation කිරීමට කැමති වෙති"
  - "සමහරු ප්‍රජාතන්ත්‍රවාදී මැතිවරණවලට සහාය දෙන අතර අනෙක් අය පරම්පරාගත පාලන ක්‍රමයකට කැමති වෙති"
  - "සමහරු ප්‍රගතිශීලී සමාජ ප්‍රතිපත්ති සඳහා පෙනී සිටින අතර අනෙක් අය දැඩි සම්ප්‍රදායික සදාචාර වටිනාකම් ආරක්ෂා කරති"
explanation: >-
  libertarian පවුල තුළ, රාජ්‍යයේ භූමිකාව පිළිබඳ මූලික අසම්මතියක් ඇත. Anarcho-capitalists සියලු රාජ්‍ය කාර්යයන් පුද්ගලික සේවාවලින් ප්‍රතිස්ථාපනය කිරීමට කැමති අතර, minarchists ආරක්ෂාව සහ අධිකරණ වැනි මූලික ස්වෛරී කාර්යයන් රඳවාගන්නා අවම රාජ්‍යයක් පිළිගනී. දෙපිරිසම libertarian ශිඛරය බෙදාගන්නා නමුත් කිසිදු රාජ්‍යයක් තිබිය යුතුද යන්න පිළිබඳව වෙනස් වෙති.
reviewed: false
