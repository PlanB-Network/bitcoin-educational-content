question: "В диалогах Гюстава де Молинари 1849 года какой персонаж защищает свободу как фундаментальный принцип, а не подчиняет ее другим целям?"
answer: "Экономист, который рассматривает свободу как принцип, не подчиненный никакой другой цели"
wrong_answers:
  - "Социалист, который защищает свободу через прогрессивные реформы, направленные на социальное равенство"
  - "Консерватор, который отстаивает свободу, сохраняя традиционный социальный порядок и стабильность"
  - "Все три персонажа одинаково защищают свободу, но расходятся во мнениях о том, как ее реализовать"
explanation: >-
  В диалогах Молинари из Les Soirees de la rue Saint-Lazare экономист находится в постоянном несогласии как с социалистом, так и с консерватором. Он единственный, кто защищает свободу как фундаментальный принцип. Социалист подчиняет свободу прогрессивным идеалам, а консерватор подчиняет ее сохранению порядка, что делает экономиста уникальным в его безусловной защите свободы.
reviewed: false
