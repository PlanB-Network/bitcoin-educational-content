question: "Vad menade Ludwig von Mises när han skrev att endast individen tänker, resonerar och handlar?"
answer: "Att kollektiv som staten eller en nation inte har någon egen existens bortom sina enskilda medlemmars handlingar"
wrong_answers:
  - "Att individer bör undvika att bilda grupper eller sammanslutningar eftersom kollektivt handlande alltid är skadligt"
  - "Att endast vissa begåvade individer är kapabla till rationellt tänkande medan de flesta människor följer instinkt"
  - "Att tänkande och resonerande är privata aktiviteter som aldrig bör delas eller diskuteras offentligt"
explanation: >-
  Mises klargjorde att individualismen motsätter sig föreställningen att sociala entiteter såsom samhället eller nationen skulle kunna existera oberoende av de individer som utgör dem. Ett kollektiv har ingen egen existens bortom sina enskilda medlemmars handlingar. Vi kan inte meningsfullt tala om statens eller ett företags handling eftersom dessa entiteter inte har någon egen vilja eller tanke och endast handlar genom individer.
reviewed: false
