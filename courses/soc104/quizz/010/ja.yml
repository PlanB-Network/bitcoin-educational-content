question: "ノーラン・チャートにおいて、垂直軸（上-下）が水平軸（左-右）より根本的だと考えられるのはなぜですか？"
answer: "最大限の個人の自由を擁護する人々と、最大限の国家統制を好む人々との真の分断を明らかにするから"
wrong_answers:
  - "水平軸が社会政策を測るよりも正確に、垂直軸が経済生産を測るから"
  - "歴史を通じてほとんどの政治的対立は、統治ではなく文化的アイデンティティをめぐるものだったから"
  - "水平軸は近代民主主義にしか当てはまらない一方、垂直軸は普遍的だから"
explanation: >-
  根本的な軸は垂直軸です。なぜなら、それは国家が人間の行動をどの程度統制すべきかという本質的な政治的問いを捉えるからです。左右軸は異なる感性（社会正義対伝統）を反映するにすぎず、両側とも国家主義者として垂直軸上の同じ位置を占めることがあります。垂直軸は、ある人が自分のビジョンを力で押しつけたいのか、それとも個人の自由を尊重するのかを明らかにします。
reviewed: false
