question: "چرا دوره Bitcoin را به‌جای پروژه‌ای راست‌گرا یا چپ‌گرا، ارزی بازاری در برابر پول دولتی توصیف می‌کند؟"
answer: "زیرا Bitcoin ارزی داوطلبانه پذیرفته‌شده، دشوار برای تولید، و غیرمتمرکز است که ارزش خود را حفظ می‌کند؛ در تضاد با پول Fiat قهری و متمرکزی که ارزشش را از دست می‌دهد، و شکاف را به مسئله بازار در برابر دولت تبدیل می‌کند نه ایدئولوژی سیاسی"
wrong_answers:
  - "زیرا Bitcoin توسط توسعه‌دهنده‌ای ناشناس ساخته شد که عمداً از هرگونه بیان سیاسی درباره هدف یا فلسفه مورد نظرش پرهیز کرد"
  - "زیرا الگوریتم استخراج Bitcoin توزیع برابر کوین‌های جدید میان همه احزاب سیاسی را تضمین می‌کند و از هرگونه سوگیری ایدئولوژیک در نظام پولی جلوگیری می‌کند"
  - "زیرا Bitcoin همانند ارزهای Fiat موجود عمل می‌کند اما بر شبکه پرداختی سریع‌تر اجرا می‌شود، و تمایزهای سیاسی را بی‌ربط می‌سازد"
explanation: >-
  Bitcoin به‌عنوان شورشی مسالمت‌آمیز علیه سیاسی‌سازی پول توصیف می‌شود. پول دولتی یا Fiat نظامی قهری و متمرکز است که گرایش به از دست دادن ارزش دارد. پول بازاری، که به‌طور تاریخی طلا و اکنون Bitcoin است، ارزی سالم و دشوار برای تولید است که داوطلبانه پدید می‌آید و ارزش خود را در بلندمدت حفظ می‌کند. تقابل واقعی چپ در برابر راست نیست، بلکه بازار در برابر دولت است؛ و این Bitcoin را به گسستی سیاسی تبدیل می‌کند که از اردوگاه‌های ایدئولوژیک سنتی فراتر می‌رود.
reviewed: false
