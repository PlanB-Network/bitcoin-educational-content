question: "¿Qué paradoja oculta reside en el pragmatismo centrista?"
answer: "El propio pragmatismo descansa en una forma de dogmatismo, a saber, la convicción no expresada de que solo los expertos son competentes para dirigir la sociedad"
wrong_answers:
  - "Los centristas afirman ser moderados, pero se alinean consistentemente con partidos de izquierda en gobiernos de coalición"
  - "Las políticas centristas parecen equilibradas, pero siempre favorecen el crecimiento económico por encima de la protección ambiental"
  - "Los centristas rechazan la ideología, pero adoptan principios rígidos de libre mercado al tomar decisiones económicas"
explanation: >-
  La paradoja del pragmatismo centrista es que afirma rechazar la ideología en favor de la pericia racional, pero esta misma afirmación descansa en un dogma invisible y no expresado: que solo los tecnócratas son capaces de tomar las decisiones correctas. Esta convicción de que solo los expertos deben dirigir la sociedad es en sí misma un compromiso ideológico, aunque los centristas no la reconozcan como tal.
