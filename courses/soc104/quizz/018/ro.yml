question: "Ce obiectiv politic comun au etatiștii de stânga și cei de dreapta?"
answer: "Să câștige puterea pentru a organiza societatea potrivit viziunii lor despre lume și pentru a o impune tuturor"
wrong_answers:
  - "Să reducă dimensiunea guvernului și să redea cetățenilor individuali puterea de decizie"
  - "Să instituie o democrație directă în care fiecare cetățean votează asupra fiecărei decizii legislative"
  - "Să elimine partidele politice și să le înlocuiască cu o guvernare tehnocratică independentă"
explanation: >-
  Atât etatiștii de stânga, cât și cei de dreapta împărtășesc același obiectiv politic: câștigarea puterii pentru a organiza societatea potrivit viziunii lor despre lume și pentru a o impune tuturor prin legislație. Diferența constă doar în valorile lor: dreapta invocă apărarea civilizației, în timp ce stânga invocă apărarea clasei muncitoare sau a celor oprimați. Niciuna nu urmărește reducerea guvernului sau eliminarea partidelor.
reviewed: false
