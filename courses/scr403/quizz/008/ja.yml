question: 半加算器は何を計算しますか？
answer: 2つの入力ビットのキャリー（AND）と和（XOR）です。
wrong_answers:
  - キャリー伝播を伴う2つの多ビット整数の和です。
  - 2つのビットの平均を切り捨てたものです。
  - 2つの入力ビットのビット単位ORとANDです。
explanation: >-
  半加算器は2つの単一ビットを受け取り、並列合成を使って2つの出力を生成する。
  それはキャリービット（入力のAND）と和ビット（入力のXOR）である。
  Simplicityではand ▵ xorとして定義され、同じ入力ペア上で
  両方の操作を実行する。
