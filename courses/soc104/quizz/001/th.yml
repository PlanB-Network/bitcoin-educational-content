question: "เส้นแบ่งทางการเมืองซ้าย-ขวามีต้นกำเนิดจากที่ใด?"
answer: "จากการจัดที่นั่งระหว่างการอภิปรายในการปฏิวัติฝรั่งเศสปี 1789"
wrong_answers:
  - "จากงานเขียนของ Karl Marx และ Adam Smith ในศตวรรษที่สิบเก้า"
  - "จากสงครามกลางเมืองอเมริการะหว่างรัฐฝ่ายเหนือและฝ่ายใต้"
  - "จากนักปรัชญายุคเรืองปัญญาที่แยกเหตุผลออกจากจารีต"
explanation: >-
  เส้นแบ่งซ้าย-ขวาย้อนกลับไปถึงปี 1789 เมื่อสมาชิกสภาในสมัชชาแห่งชาติฝรั่งเศสที่สนับสนุนการรักษาอำนาจของกษัตริย์นั่งทางขวาของประธานสภา ส่วนผู้ที่ต้องการจำกัดอำนาจของกษัตริย์นั่งทางซ้าย มันไม่ได้มีต้นกำเนิดจาก Marx และ Smith สงครามกลางเมืองอเมริกา หรือปรัชญายุคเรืองปัญญา
reviewed: false
