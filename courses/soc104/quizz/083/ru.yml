question: "В чем заключается ключевое различие между позицией pro-business и позицией pro-market?"
answer: "Сторонники pro-business добиваются государственного вмешательства, чтобы защитить конкретные компании от провала, тогда как сторонники pro-market поддерживают дерегулирование и допускают банкротство предприятий, чтобы рынок мог естественно реорганизоваться"
wrong_answers:
  - "Сторонники pro-business сосредоточены на крупных корпорациях, тогда как сторонники pro-market сосредоточены исключительно на поддержке малого бизнеса и стартапов"
  - "Pro-business — это левая позиция, выступающая за рабочие кооперативы, тогда как pro-market — правая позиция, выступающая за частную собственность"
  - "Сторонники pro-business отвергают всю конкуренцию, тогда как сторонники pro-market поддерживают регулируемую государством конкуренцию между одобренными предприятиями"
explanation: >-
  Позиция pro-business рассматривает конкуренцию как инструмент управления, получаемый через регулирование, и оправдывает субсидии и спасение компаний, чтобы предотвратить потерю рабочих мест. С точки зрения pro-business рынок хрупок и нуждается в государственной помощи. Сторонники pro-market видят конкуренцию как естественный результат свободного предпринимательства, что подразумевает дерегулирование и допущение банкротства предприятий, потому что провал позволяет рынку естественно реорганизоваться и открывает поле для более способных участников.
