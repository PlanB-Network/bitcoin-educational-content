question: "لیبرتارین‌ها چه چیزی را در مرکز فلسفه سیاسی خود قرار می‌دهند؟"
answer: "اخلاق و قانون"
wrong_answers:
  - "رشد اقتصادی و خلق ثروت"
  - "برابری اجتماعی و رفاه جمعی"
  - "هویت ملی و حفظ فرهنگی"
explanation: >-
  لیبرتارین‌ها خود را از همه خانواده‌های سیاسی دیگر با قرار دادن اخلاق و قانون در مرکز فلسفه‌شان، نه اقتصاد، متمایز می‌کنند. هنگامی که از اقتصاد بازار دفاع می‌کنند، این دفاع کمتر به‌خاطر ظرفیت آن برای تولید ثروت است تا به‌خاطر ترویج آزادی و مسئولیت فردی. رشد اقتصادی منفعتی ثانویه است، نه اصل بنیادین.
reviewed: false
