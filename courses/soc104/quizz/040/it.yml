question: "Quale avvertimento diede Milton Friedman sul giudicare le politiche pubbliche?"
answer: "Le politiche dovrebbero essere giudicate dai loro risultati piuttosto che dalle loro intenzioni"
wrong_answers:
  - "Le politiche dovrebbero essere giudicate dal carattere morale dei politici che le propongono"
  - "Le politiche dovrebbero essere giudicate in base a quanto sono popolari presso il pubblico elettorale generale"
  - "Le politiche dovrebbero essere giudicate in base al loro allineamento con la costituzione originaria del paese"
explanation: >-
  Friedman scrisse che uno degli errori più grandi è giudicare le politiche dalle loro intenzioni anziché dai loro risultati, osservando che i programmi etichettati come destinati ai poveri producono quasi sempre effetti opposti a quelli voluti dai loro promotori. Ciò riecheggia l'insegnamento di Bastiat secondo cui un buon economista considera sia gli effetti di breve periodo sia quelli di lungo periodo sull'intera popolazione.
