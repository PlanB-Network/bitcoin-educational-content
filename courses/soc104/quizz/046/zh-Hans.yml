question: "保守主义如何看待经济领域和社会领域的自由？"
answer: "经济领域的自由强，社会领域的自由弱"
wrong_answers:
  - "为了维持传统社会秩序，在经济和社会两个领域都限制自由"
  - "社会领域的自由强，经济领域的自由弱"
  - "两个领域都有平等且不受限制的自由，任何形式的政府干预都最少"
explanation: >-
  保守主义呈现出一种二分结构，它正是社会主义的镜像。在经济领域，保守主义者捍卫自由市场、创业精神和私有财产。在社会领域，则以维护传统道德规范和社会稳定为由来证明限制的正当性。第三个错误答案描述的是社会主义模式，而这正好相反。
reviewed: false
