question: "Aká je konzervatívna pozícia k imigrácii?"
answer: "Štát má suverénne právo kontrolovať svoje hranice, aby chránil národnú bezpečnosť a kultúrnu identitu"
wrong_answers:
  - "Hranice by mali byť bezpodmienečne otvorené, pretože diskriminačné obmedzenia porušujú ľudské práva"
  - "Imigrácia by sa mala určovať trhovým dopytom, pričom občania by o svojich vzťahoch s cudzincami rozhodovali zmluvne"
  - "Imigračná politika by mala vyvažovať ekonomické potreby s úspešnou integráciou na základe odborného hodnotenia"
explanation: >-
  Konzervatívci tvrdia, že poriadok, identita a národná suverenita musia mať prednosť pred neobmedzeným prijímaním cudzincov alebo utečencov. Hranice a jasne vymedzené obyvateľstvo sú súčasťou civilizovaných hodnôt. Nesprávne odpovede predstavujú socialistickú pozíciu (otvorené hranice ako ľudské práva), libertariánsku pozíciu (trhovo založená imigrácia) a centristickú pozíciu (vyvážený prístup riadený odborníkmi).
