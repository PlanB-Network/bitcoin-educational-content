question: "為什麼左右軸被認為不足以定位像 Bastiat 或 Ron Paul 這樣的古典自由主義思想家？"
answer: "因為古典自由主義同時重視經濟自由與個人自由，而左翼與右翼都沒有完全擁抱這兩者"
wrong_answers:
  - "因為古典自由主義者總是與右翼經濟政策一致，並拒絕所有左翼立場"
  - "因為古典自由主義者是中間派，採納左翼與右翼意識形態的溫和版本"
  - "因為古典自由主義者反對一切形式的政府，使他們成為無政府主義者而非政治思想家"
explanation: >-
  左右軸無法容納古典自由主義者，因為它無法安置一種同時捍衛經濟自由（通常被視為右翼）與個人自由（通常被視為左翼）的立場。古典自由主義者不是尋求妥協的中間派，也不是無政府主義者或純粹右翼。他們只是無法放在一條一維光譜上。
reviewed: false
