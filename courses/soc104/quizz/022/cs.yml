question: "Co je politický konzervatismus?"
answer: "Ideologie, která usiluje o zachování zavedených politických institucí a společenského řádu a staví se proti velkým strukturálním otřesům"
wrong_answers:
  - "Osobní závazek k tradičním rodinným hodnotám a náboženským praktikám bez snahy vnucovat je druhým"
  - "Filozofie, která podporuje rychlou společenskou změnu prostřednictvím demokratické reformy a progresivního zákonodárství"
  - "Ekonomická teorie, která prosazuje volné trhy, minimální zdanění a zrušení obchodních překážek"
explanation: >-
  Politický konzervatismus je ideologie, často zastoupená v pravicových nebo krajně pravicových stranách, která usiluje o zachování zavedených politických institucí a společenského řádu a staví se proti velkým strukturálním otřesům. Její zastánci chtějí používat moc a zákon k ochraně svého dědictví. To se liší od kulturního konzervatismu, který je osobní životní volbou, nikoli politickým programem.
