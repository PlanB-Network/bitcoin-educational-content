question: "¿Por qué se describe la inflación monetaria como un impuesto oculto impuesto sin el consentimiento de los ciudadanos?"
answer: "Porque la creación de dinero por parte del gobierno devalúa la moneda, de modo que las personas pueden comprar menos con la misma cantidad, pero la mayoría no se da cuenta de que la subida de precios refleja la política gubernamental y no fuerzas naturales del mercado"
wrong_answers:
  - "Porque los bancos centrales cobran en secreto comisiones por cada transacción procesada a través del sistema bancario sin comunicarlas a los titulares de las cuentas"
  - "Porque los gobiernos imprimen dinero y lo distribuyen solo a personas ricas mientras gravan a los pobres mediante impuestos sobre las ventas más altos en bienes esenciales"
  - "Porque la inflación es causada por corporaciones privadas que suben los precios para aumentar las ganancias, lo que funciona como un impuesto no oficial sobre los consumidores"
explanation: >-
  La inyección de dinero en el sistema se traduce en devaluación de la moneda, donde la misma cantidad compra menos porque el nuevo dinero no refleja un crecimiento económico genuino. La mayoría de las personas no ve que la política gubernamental condujo a la subida de precios, que son simplemente el reflejo de la devaluación de la moneda. Esto equivale a robo legal y expoliación institucionalizada, empobreciendo a la clase media mientras los ricos capturan el dinero nuevo a través de activos especulativos.
