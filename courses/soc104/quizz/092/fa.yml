question: "مشکل بنیادی ارزهای Fiat که Satoshi Nakamoto شناسایی کرد چیست؟"
answer: "آن‌ها مستلزم اعتماد به بانک مرکزی‌اند که ارزش ارز را کاهش ندهد، اما تاریخ ارزهای Fiat سرشار از نقض این اعتماد است"
wrong_answers:
  - "استفاده از آن‌ها برای تراکنش‌های روزمره بیش از حد دشوار است، زیرا پول نقد فیزیکی سریع فرسوده می‌شود و تولید آن پرهزینه است"
  - "آن‌ها را نمی‌توان بین‌المللی منتقل کرد، زیرا هر کشور استانداردها و مقررات پولی ناسازگار با دیگران دارد"
  - "آن‌ها پشتوانه ذخایر طلا دارند که برای پوشش کل عرضه پول در گردش کافی نیست"
explanation: >-
  Satoshi Nakamoto گفت مشکل بنیادی ارزهای متعارف، اعتمادی است که برای کارکرد آن‌ها لازم است. ارزهای Fiat پشتوانه کالایی ندارند و کاملاً بر اقتدار نهادی تکیه می‌کنند. وقتی نهادی کنترل کامل پول را در اختیار دارد، وسوسه سوءاستفاده بیش از حد نیرومند است، و تاریخ بارها این را از طریق کاهش ارزش ارز نشان داده است.
reviewed: false
