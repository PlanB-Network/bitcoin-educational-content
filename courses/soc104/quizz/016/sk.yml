question: "Čo chce ľavica legislatívne upravovať a regulovať?"
answer: "Ekonomiku, a to z nepriateľstva voči ekonomickej slobode, kapitalizmu a slobodnému trhu"
wrong_answers:
  - "Osobnú morálku a náboženské praktiky, z túžby zachovať tradičné inštitúcie"
  - "Imigráciu a národné hranice, z obáv o kultúrnu identitu a suverenitu"
  - "Technológie a inovácie, zo strachu, že automatizácia nahradí ľudských pracovníkov"
explanation: >-
  Ľavica dáva prioritu sociálnej spravodlivosti a rovnosti, najmä na ekonomickej úrovni. To vedie k jej nepriateľstvu voči ekonomickej slobode, kapitalizmu a slobodnému trhu a k jej túžbe legislatívne upravovať a regulovať ekonomiku. Pravica naopak chce legislatívne upravovať morálku a náboženstvo. Regulácia imigrácie a technológií nie je hlavným zameraním opísaným tu.
