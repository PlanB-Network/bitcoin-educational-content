question: Katika RGB, Commitment iko wapi wakati Single-Use Seal imefungwa?
answer: Katika matokeo ya muamala wa matumizi outpoint
wrong_answers:
  - Katika pembejeo ya miamala ya matumizi outpoint
  - Katika scriptSig ya miamala inayotumia muhtasari
  - Katika Shahidi wa miamala ya matumizi ya outpoint
explanation: |
  Commitment imeingizwa kwenye matokeo ya miamala ambayo hutumia sehemu ya kufafanua Single-Use Seal.
reviewed: true
