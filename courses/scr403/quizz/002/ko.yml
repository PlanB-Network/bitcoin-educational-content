question: Simplicity에서 합 타입(A + B)이란 무엇인가요?
answer: "태그가 붙은 합집합입니다. 값은 왼쪽 태그가 붙은 A이거나 오른쪽 태그가 붙은 B입니다."
wrong_answers:
  - A와 B의 모든 값을 동시에 포함하는 타입입니다.
  - 두 구성 타입의 비트 크기를 산술적으로 더한 것입니다.
  - A의 모든 입력을 B의 출력으로 매핑하는 함수 타입입니다.
explanation: >-
  합 타입 A + B는 태그가 붙은 합집합입니다. 각 값은 자신이 왼쪽 변형
  (타입 A)인지 오른쪽 변형(타입 B)인지를 나타내는 1비트 태그를 가집니다.
  A와 B가 같은 타입일 때에도 왼쪽 태그가 붙은 값과 오른쪽 태그가 붙은 값은
  서로 구별된 채로 남습니다.
reviewed: false
