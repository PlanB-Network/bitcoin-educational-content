question: "Какво смятат либертарианците относно способността на индивидите да вземат решения?"
answer: "Индивидите имат както правото, така и отговорността да вземат собствените си решения за живота си"
wrong_answers:
  - "Индивидите трябва да вземат решения само след консултация с избрани представители, които разбират последиците от политиките"
  - "Индивидите като цяло са неспособни да вземат добри решения и се нуждаят от експертно насочване от правителствени институции"
  - "Индивидите трябва свободно да вземат икономически решения, но да се съобразяват с държавата по всички социални и културни въпроси"
explanation: >-
  От либертарианска гледна точка индивидите имат както правото, така и отговорността да вземат собствените си решения. Това контрастира с конвенционалните политически семейства, от ляво до дясно, които вярват, че правителството трябва да взема някои или много от важните решения в живота на индивида и в икономическия живот като цяло.
reviewed: false
