question: Prečo sa mu hovorilo Dupont de Nemours, hoci sa narodil ako Pierre-Samuel Du Pont?
answer: Aby sa odlíšil od ostatných Dupontov v zhromaždení z roku 1789
wrong_answers:
  - Je pôvodom šľachtic
  - Oženil sa s grófkou de Nemours
  - Bol to literárny pseudonym
explanation: |
  "de Nemours" pridali k menu Pierra-Samuela Duponta, aby sa odlíšil od ostatných Dupontov, ktorí v roku 1789 zasadali v Assemblée Constitante.
