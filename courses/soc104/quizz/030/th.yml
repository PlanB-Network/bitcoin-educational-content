question: "บทบาทของ Cato Institute, Mises Institute และ Libertarian Party แตกต่างกันอย่างไรภายในขบวนการลิเบอร์ทาเรียน?"
answer: "Cato Institute มุ่งเน้นข้อเสนอนโยบายสาธารณะ, Mises Institute มุ่งเน้นการศึกษาและการตีพิมพ์ทางวิชาการ และ Libertarian Party มุ่งเน้นการเมืองเลือกตั้ง"
wrong_answers:
  - "Cato Institute ให้ทุนแก่แคมเปญการเมือง, Mises Institute ล็อบบี้ Congress โดยตรง และ Libertarian Party จัดการประชุมวิชาการ"
  - "Cato Institute ตีพิมพ์ตำราเศรษฐศาสตร์, Mises Institute ดำเนินโครงการลงทะเบียนผู้มีสิทธิเลือกตั้ง และ Libertarian Party ร่างร่างกฎหมาย"
  - "Cato Institute จัดการประท้วงระดับรากหญ้า, Mises Institute ให้การป้องกันทางกฎหมายแก่ลิเบอร์ทาเรียน และ Libertarian Party จัดการงานวิจัยของ think tank"
explanation: >-
  Cato Institute (ก่อตั้ง 1977) เป็น think tank ที่ตั้งอยู่ใน Washington ซึ่งทำงานเกี่ยวกับข้อเสนอนโยบายสาธารณะ Mises Institute (ก่อตั้ง 1982) เน้นการศึกษามากกว่าการล็อบบี้ทางการเมือง ทำหน้าที่คล้ายมหาวิทยาลัยออนไลน์ที่มีการประชุมและผลงานที่ตีพิมพ์ใหม่ Libertarian Party (ก่อตั้ง 1971) เป็นพรรคการเมืองใหญ่อันดับสามของอเมริกา เข้าร่วมการเลือกตั้งซึ่งแม้ส่วนแบ่งคะแนนราว 2% ของพรรคก็สามารถชี้ขาดผลลัพธ์ได้
reviewed: false
