question: වණිජවාදී ප්‍රතිපත්තිය නිර්දේශ කරන්නේ කුමක්ද?
answer: ගෙවීම් ලෙස ලැබෙන රන් සහ රිදී රැස්කර තබා ගැනීම සඳහා අපනයන
wrong_answers:
  - විදේශීය භාණ්ඩ රැස් කිරීම සඳහා ආනයන
  - කිසිවක් නොවේ, වෙළඳාම නිෂ්ඵල හා අර්ථ විරහිත බැවින්
  - ආනයන හා අපනයන අතර සමතුලිතතාව
explanation: |
  Mercantilism යනු ජාතික ධනවත්කම ප්‍රවර්ධනය කිරීමට රාජ්‍ය මැදිහත්වීම අනුමත කරන ආර්ථික මතවාදයකි. ප්‍රධාන අරමුණ වන්නේ වෙළඳ ශේෂ අතිරික්තයක් පවත්වාගෙන යාමෙන්, එනම් ආනයනය කරන ප්‍රමාණයට වඩා වැඩි ප්‍රමාණයක් අපනයනය කිරීමෙන්, වටිනා ලෝහ (රන් සහ රිදී) රැස් කිරීමයි.
