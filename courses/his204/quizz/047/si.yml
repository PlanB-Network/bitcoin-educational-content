question: François Quesnay, Madame de Pompadourගේ මහල් නිවාසවල entresolහි, Versaillesහි රැඳී සිටියේ ඇයි?
answer: ඔහු ඇගේ පුද්ගලික වෛද්‍යවරයා විය
wrong_answers:
  - එය ඇගේ ප්‍රියතම ස්ථානවලින් එකක් විය
  - ඔහු ඇගේ ආරක්ෂාව සහ ප්‍රතිලාභ සෙවීය
  - ඔහු ඇගේ මූල්‍ය උපදේශකයා විය
explanation: |
  Quesnay Madame de Pompadourගේ පුද්ගලික වෛද්‍යවරයා වූ අතර, එමඟින් ඔහුට රාජ සභාවට විශේෂ ප්‍රවේශයක් ලැබුණු අතර දේශපාලන තීරණවලට බලපෑම් කිරීමට හැකි විය.