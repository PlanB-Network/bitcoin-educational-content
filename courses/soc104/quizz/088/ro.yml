question: "Cum se leagă distincția lui Karl Popper dintre societățile deschise și cele închise de dezbaterea individualism versus colectivism?"
answer: "Societatea deschisă recunoaște dreptul individului de a judeca pentru sine prin decizii personale, în timp ce societatea închisă este colectivistă, sprijinindu-se pe mentalitatea tribală și pe refuzul libertății critice"
wrong_answers:
  - "Societatea deschisă este una care permite comerțul liber peste granițele naționale, în timp ce societatea închisă impune tarife și politici economice protecționiste"
  - "Societatea deschisă este guvernată prin democrație directă, în care fiecare cetățean votează, în timp ce societatea închisă este condusă de un singur monarh ereditar"
  - "Societatea deschisă publică transparent toate documentele guvernamentale, în timp ce societatea închisă clasifică informațiile drept secrete de stat"
explanation: >-
  Popper a definit societatea închisă ca societatea magică sau tribală, iar societatea deschisă ca una în care indivizii sunt confruntați cu decizii personale. Societatea închisă este colectivistă, sprijinindu-se pe mentalitatea tribală, cu un refuz al libertății critice și cu idealizarea unei ordini statice. Societatea deschisă acordă întâietate alegerii libere a valorilor, credințelor și relațiilor, întruchipând direct principiile individualiste.
reviewed: false
