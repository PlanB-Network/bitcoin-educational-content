question: "บุคคลเชิงสัญลักษณ์ใดที่เชื่อมโยงกับเสรีภาพทางเศรษฐกิจสูงสุดบน Nolan diagram?"
answer: "Margaret Thatcher, Ronald Reagan และ Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures และ Bernie Sanders"
  - "Nelson Mandela, Simone Veil และ Noam Chomsky"
  - "Vladimir Putin, Xi Jinping และ Joseph de Maistre"
explanation: >-
  Thatcher, Reagan และ Milei ถูกอ้างถึงในฐานะบุคคลเชิงสัญลักษณ์ของเสรีภาพทางเศรษฐกิจสูงสุด ซึ่งสนับสนุนการแทรกแซงของรัฐที่น้อยลง กฎระเบียบที่น้อยลง และภาษีที่ต่ำลง Roosevelt, Jaures และ Sanders แทนปลายตรงข้ามที่สนับสนุนการควบคุมเศรษฐกิจโดยรัฐ Mandela, Veil และ Chomsky แทนเสรีภาพส่วนบุคคลสูงสุด Putin, Xi Jinping และ de Maistre แทนการควบคุมชีวิตส่วนบุคคลโดยรัฐสูงสุด
reviewed: false
