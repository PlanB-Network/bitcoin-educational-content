question: "Cypherpunk 關於中心化的哲學，如何連結到自由意志主義將同意視為正義根本規範的原則？"
answer: "Cypherpunk 認為所有中心化都奠基於強制而非同意，呼應自由意志主義的立場：凡是由中心化權威透過武力強加之物，都不可能是正義的"
wrong_answers:
  - "Cypherpunk 相信中心化在獲得民主多數投票批准時可以接受，這與自由意志主義對憲政治理的尊重一致"
  - "Cypherpunk 支持在緊急時期暫時中心化，反映了自由意志主義認為當集體受到威脅時可以暫停個人權利"
  - "Cypherpunk 只反對技術系統中的中心化，同時接受政治中心化對執行財產權與契約而言是必要的"
explanation: >-
  Cypherpunk 信任去中心化的密碼系統，而不是中心化機構。所有中心化都被視為奠基於強制而非同意。這直接呼應了自由意志主義哲學，即同意是正義的根本規範。凡是由中心化權威透過武力強加之物，都不可能是正義的；這也是他們試圖建構去中心化網路的原因，在那裡沒有任何單一實體能夠強加自己的意志。
reviewed: false
