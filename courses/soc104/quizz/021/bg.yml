question: "Какво е културен консерватизъм?"
answer: "Лична привързаност към семейни, морални, естетически и метафизични ценности, наследени от миналото, а не политическа философия"
wrong_answers:
  - "Политическа идеология, която използва държавната власт, за да наложи традиционни ценности на цялото общество чрез законодателство"
  - "Движение, което отхвърля всички форми на модерност и се стреми да върне обществото към прединдустриален начин на живот"
  - "Икономическа доктрина, която защитава националните индустрии и се противопоставя на свободната търговия с чужди държави"
explanation: >-
  Културният консерватизъм се дефинира като житейска мъдрост: лична привързаност към семейни, морални, естетически и метафизични ценности, наследени от миналото, било гръко-римски или юдео-християнски. Той изрично не е политическа философия. Различава се от политическия консерватизъм, който цели да запази политическите институции и социалния ред чрез държавна власт. Той също така не е свързан с отхвърляне на модерността или с икономически протекционизъм.
reviewed: false
