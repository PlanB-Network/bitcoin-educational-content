question: "미국의 고전적 자유주의자들은 왜 20세기에 자신들을 '자유지상주의자'라고 부르기 시작했나요?"
answer: "미국의 '자유주의'가 커지는 국가 개입주의와 복지국가에 의해 전유되었기 때문입니다"
wrong_answers:
  - "유럽의 군주주의 전통과 거리를 두고 싶었기 때문입니다"
  - "'자유주의'라는 용어가 아나키즘과 정치적 폭력과 연관되었기 때문입니다"
  - "새로운 무역 협정이 자유시장 옹호자들에게 별도의 정치적 정체성을 요구했기 때문입니다"
explanation: >-
  20세기 동안 자유방임 원칙이 복지국가를 위해 점진적으로 폐기되면서 근본적 전환이 일어났습니다. 미국의 "자유주의"는 고전적 자유주의와 매우 다른 의미를 갖게 되었고, 국가 개입주의를 받아들였습니다. 고전적 자유주의자들은 그 구분을 보존하기 위해 "자유지상주의자"라는 용어를 채택했습니다. 이러한 명칭 변경은 유럽 군주주의, 아나키즘적 폭력, 또는 무역 협정과는 아무 관련이 없었습니다.
reviewed: false
