question: "Mis on „moraaliriski“ mõiste toetuste debati kontekstis ja milline poliitiline perekond selle mure tõstatab?"
answer: "Moraalirisk on stiimul vastutustundetusele, kui ettevõtetel ei lasta toetuste kaudu ebaõnnestuda, sest lõppkokkuvõttes maksab maksumaksja; selle mure tõstatavad libertaarid"
wrong_answers:
  - "Moraalirisk on oht, et toetatud ettevõtted kolivad madalamate maksudega riikidesse, võttes töökohad endaga kaasa; selle mure tõstatavad konservatiivid"
  - "Moraalirisk on oht, et riigiametnikud muutuvad korrumpeerunuks, valides, millised ettevõtted toetusi saavad; selle mure tõstatavad tsentristid"
  - "Moraalirisk on eetiline probleem, et ettevõtted ekspluateerivad töötajaid pärast avalike vahendite saamist; selle mure tõstatavad sotsialistid"
explanation: >-
  Libertaarid väidavad, et toetused ja päästepaketid loovad moraaliriski: kui ettevõtetel ei lasta ebaõnnestuda, motiveerib see vastutustundetust ja hoolimatust, sest halbadel otsustel ei ole tagajärgi. Lõpuks maksab selle kinni maksumaksja, mida libertaarid peavad sügavalt ebaõiglaseks. See mõiste erineb ettevõtete ümberpaiknemise, ametnike korruptsiooni või töötajate ekspluateerimisega seotud muredest, mida tõstatavad teised poliitilised perekonnad.
