question: Как работи нотацията за достъп (O, I, H) в Simplicity?
answer: O означава 'take' (ляво), I означава 'drop' (дясно), а H означава 'iden' (цялата стойност).
wrong_answers:
  - O означава output, I означава input, а H означава halt изпълнението на програмата.
  - Те са имена на променливи, които компилаторът автоматично присвоява на стойности.
  - O избира елементи с нечетен индекс, I избира елементи с четен индекс, H избира head.
explanation: >-
  Съкратената нотация O/I/H предоставя компактен начин за навигиране във вложени двойки.
  O f е take f (извличане на лявото), I f е drop f (извличане на дясното), а H е
  iden (цялата стойност). Последователности като I O H означават drop(take(iden)),
  извличайки първия елемент на втория елемент. Това наподобява
  индексите на De Bruijn с двоични цифри като позиции в дърво.
reviewed: false
