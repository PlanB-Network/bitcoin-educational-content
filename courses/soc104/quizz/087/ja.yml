question: "リバタリアンが説明する自由市場の 3 つの本質的機能は、どのようにして効率的かつ倫理的な社会組織システムをともに構成するのか？"
answer: "価格は決定のための羅針盤を提供し、市場は需要と供給を通じて本物の選好を明らかにし、自由な交換は個人が個人的価値観に従って自らの事柄を決定することを可能にし、情報効率と道徳的自律を結びつける"
wrong_answers:
  - "市場は総富を最大化し、自然競争を通じて独占を防ぎ、資源の平等な分配を保証し、生産性と社会正義を結びつける"
  - "自由市場は政府支出を削減し、技術革新を刺激し、雇用機会を創出し、財政責任と経済成長を結びつける"
  - "市場は消費者価格を引き下げ、競争を通じて製品品質を高め、国際貿易を拡大し、国内の繁栄と国際協力を結びつける"
explanation: >-
  自由市場を支持するリバタリアンの主張は、相互に結びついた 3 つの機能に基づく。第一に、価格は経済的・社会的決定を導く信頼できる指標、すなわち羅針盤として機能する。第二に、市場は需要と供給を通じて本物の個人的選好を明らかにする。第三に、自由な交換は、行為者が個人的価値観に従って自らの事柄を決定することを可能にする。Hayek は、自由市場が中央計画よりも分散した情報をよく調整すること（効率性）を示し、相互同意は強制よりも人間の尊厳を尊重する（正義）。
reviewed: false
