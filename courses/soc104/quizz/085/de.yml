question: "Was meinte Ludwig von Mises, als er schrieb, dass nur das Individuum denkt, schlussfolgert und handelt?"
answer: "Dass Kollektivitäten wie der Staat oder eine Nation keine eigene Existenz jenseits der Handlungen ihrer individuellen Mitglieder haben"
wrong_answers:
  - "Dass Individuen es vermeiden sollten, Gruppen oder Vereinigungen zu bilden, weil kollektives Handeln immer schädlich ist"
  - "Dass nur bestimmte begabte Individuen zu rationalem Denken fähig sind, während die meisten Menschen ihrem Instinkt folgen"
  - "Dass Denken und Schlussfolgern private Tätigkeiten sind, die niemals öffentlich geteilt oder diskutiert werden sollten"
explanation: >-
  Mises stellte klar, dass Individualismus der Vorstellung widerspricht, soziale Entitäten wie die Gesellschaft oder die Nation könnten unabhängig von den Individuen existieren, aus denen sie bestehen. Eine Kollektivität hat keine eigene Existenz jenseits der Handlungen ihrer individuellen Mitglieder. Wir können nicht sinnvoll von der Handlung des Staates oder eines Unternehmens sprechen, weil diese Entitäten keinen eigenen Willen oder Gedanken haben und nur durch Individuen handeln.
