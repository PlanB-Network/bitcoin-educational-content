question: "What is cultural conservatism?"
answer: "A personal adherence to family, moral, aesthetic, and metaphysical values inherited from the past, not a political philosophy"
wrong_answers:
  - "A political ideology that uses state power to impose traditional values on all of society through legislation"
  - "A movement that rejects all forms of modernity and seeks to return society to a pre-industrial way of life"
  - "An economic doctrine that protects national industries and opposes free trade with foreign countries"
explanation: >-
  Cultural conservatism is defined as a wisdom of life: the personal adherence to family, moral, aesthetic, and metaphysical values inherited from the past, whether Greco-Roman or Judeo-Christian. It is explicitly not a political philosophy. It differs from political conservatism, which aims to preserve political institutions and social order through state power. It is also not about rejecting modernity or economic protectionism.
reviewed: false
