question: "What common ground do libertarians and conservatives share, and what divides them?"
answer: "They share attachment to limited government and rejection of forced egalitarianism, but disagree on military interventionism and social policies"
wrong_answers:
  - "They share support for protectionist trade policies and national defense, but disagree on the role of religion in public life"
  - "They share a commitment to progressive taxation and welfare programs, but disagree on immigration policy"
  - "They share opposition to free trade and drug legalization, but disagree on the size of the federal government"
explanation: >-
  Libertarians and conservatives both champion limited government, reject forced egalitarianism, oppose public debt, and defend states' rights. However, libertarians reject the military interventionism of neoconservatives, oppose conservative social policies and subsidies, condemn drug prohibition, and reject protectionism. The alliance is real but inherently strained.
reviewed: false
