bio: |
  Bine ați venit pe PlanB.network! Sunt Thomas, cunoscut și ca @ProfEduStream, și m-am interesat pentru prima dată de Bitcoin prin mining. Ulterior, familiarizându-mă cu analiza de date și Python, m-am interesat rapid de analiza on-chain, în special de analiza tranzacțiilor din blocurile 1 până la 210000. În 2023, am început să scriu articole intitulate "Bitcoin Blockchain Fun Facts" pe Substack-ul meu.
  În paralel, ca profesor, am o pasiune profundă pentru împărtășirea cunoștințelor mele. De aceea am co-fondat asociația Bitcoin Lille din Franța, cu care organizăm un meet-up săptămânal. Acolo susțin în mod regulat prezentări, atât tehnice, cât și simplificate, toate disponibile open-source pe YouTube și pe Substack-ul meu.
  În cele din urmă, încerc să reunesc comunități, atât franceze, cât și internaționale. Pentru că împreună vom merge mult mai departe, mult mai repede.

short_bio: Educația este cea mai puternică armă pe care o poți folosi pentru a schimba lumea - Nelson Mandela
