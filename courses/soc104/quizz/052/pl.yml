question: "Dlaczego klasyczni liberałowie w Stanach Zjednoczonych zaczęli w XX wieku nazywać siebie 'libertarianami'?"
answer: "Ponieważ amerykański 'liberalizm' został przejęty przez rosnący interwencjonizm państwowy i państwo opiekuńcze"
wrong_answers:
  - "Ponieważ chcieli zdystansować się od europejskich tradycji monarchistycznych"
  - "Ponieważ termin 'liberalny' zaczął być kojarzony z anarchizmem i przemocą polityczną"
  - "Ponieważ nowe umowy handlowe wymagały odrębnej tożsamości politycznej dla zwolenników wolnego rynku"
explanation: >-
  W XX wieku nastąpiła fundamentalna zmiana, gdy zasady laissez-faire stopniowo porzucano na rzecz państwa opiekuńczego. Amerykański "liberalizm" zaczął oznaczać coś bardzo odmiennego od klasycznego liberalizmu, przyjmując interwencjonizm państwowy. Klasyczni liberałowie przyjęli termin "libertarianin", aby zachować to rozróżnienie. Ten rebranding nie miał nic wspólnego z europejskim monarchizmem, anarchistyczną przemocą ani umowami handlowymi.
reviewed: false
