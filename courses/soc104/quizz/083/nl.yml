question: "Wat is Hayeks fundamentele argument over waarom centrale planning faalt?"
answer: "Kennis bestaat alleen als verspreide fragmenten in het bezit van verschillende individuen en kan niet door een centrale autoriteit worden geconcentreerd of geïntegreerd"
wrong_answers:
  - "Centrale planners zijn moreel corrupt en handelen altijd in hun eigenbelang in plaats van in het algemeen belang"
  - "Democratische instellingen zijn te traag om op economische veranderingen te reageren, waardoor gecentraliseerde beslissingen altijd achterhaald zijn"
  - "Centrale planning faalt omdat burgers zich bewust verzetten tegen overheidsmandaten en weigeren regels na te leven"
explanation: >-
  Hayeks fundamentele argument berust op de aard van informatie. Hij liet zien dat kennis nooit in geconcentreerde of geïntegreerde vorm bestaat, maar alleen als verspreide fragmenten in het bezit van alle verschillende individuen. Waarde is subjectief en alleen lokaal en onvolledig bekend. De centrale planner, zittend in een kantoor, heeft geen kennis van de werkelijke prijs van dingen, omdat hij niet betrokken is bij interactie en uitwisseling.
reviewed: false
