question: Čo podľa Quesnaya a fyziokratov podnecuje úsilie a prácu?
answer: Bezpečnosť súkromného vlastníctva
wrong_answers:
  - Represívne zákony
  - Mravy remeselníkov a priemyselníkov naklonené obohacovaniu
  - Strach z hladomoru
explanation: |
  Bezpečnosť súkromného vlastníctva bola podľa fyziokratov nevyhnutná na podporu investícií a práce. Verili, že jednotlivci sú ochotnejší pracovať a investovať, ak majú istotu, že si budú môcť ponechať plody svojej práce.
