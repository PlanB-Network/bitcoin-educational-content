question: "在所有五个经济辩论（税收、最低工资、医疗保健、环境、补贴）中，什么一致模式把中间主义方法与其他政治家族的立场区分开来？"
answer: "中间主义者拒绝承诺某一固定原则，而是要求通过实证分析和专家评估逐案确定政策，这使他们的方法具有内在的技术官僚性质"
wrong_answers:
  - "中间主义者总是在社会主义和保守主义立场之间采取中间位置，在每个问题上同等折中"
  - "中间主义者始终优先考虑经济增长而非社会福利，在财政政策上站在自由意志主义者一边，同时在监管上同意社会主义者"
  - "中间主义者把所有经济决策都交给国际组织和贸易协定，而不是制定独立的国家政策"
explanation: >-
  在所有五个经济辩论中，中间主义方法遵循同一模式：中间主义者并不承诺某个固定的意识形态原则，而是在作出决定前要求实证证据和专家评估。在税收问题上，合适水平必须由分析确定。在最低工资问题上，水平必须务实地调整。在医疗保健问题上，由专家校准的混合模式是理想的。在环境问题上，政策必须平衡竞争力。在补贴问题上，每个案例都必须依据其自身价值进行评估。这使中间主义具有内在的技术官僚性质，这不同于简单地折中或听命于国际机构。
reviewed: false
