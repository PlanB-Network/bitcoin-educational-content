question: "Ce diviziune fundamentală i-a separat pe socialiști începând cu începutul secolului al XX-lea?"
answer: "Socialiștii revoluționari care urmăreau să preia puterea prin violență versus socialiștii reformiști care urmăreau schimbarea prin alegeri democratice"
wrong_answers:
  - "Socialiștii urbani care se concentrau pe muncitorii industriali versus socialiștii rurali care organizau comune agricole"
  - "Socialiștii naționaliști care își prioritizau propria țară versus socialiștii internaționaliști care pledau pentru revoluție globală"
  - "Socialiștii intelectuali care scriau texte teoretice versus socialiștii activiști care organizau greve muncitorești"
explanation: >-
  De la începutul secolului al XX-lea, o diviziune fundamentală i-a separat pe socialiștii revoluționari, care se opuneau drepturilor de proprietate și căutau să distrugă societatea capitalistă prin violență sau prin dictatura proletariatului, de socialiștii reformiști, care urmăreau justiția socială prin alegeri democratice și impozitare, acceptând temporar capitalismul. Această scindare a modelat întreaga istorie ulterioară a mișcărilor socialiste.
reviewed: false
