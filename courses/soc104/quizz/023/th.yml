question: "คำว่า 'liberal' หมายถึงอะไรในธรรมเนียมการเมืองยุโรป?"
answer: "ผู้สนับสนุนเศรษฐกิจแบบ laissez-faire การลดการแทรกแซงของรัฐ และเสรีภาพส่วนบุคคล"
wrong_answers:
  - "ผู้สนับสนุนการแทรกแซงของรัฐ ประกันสุขภาพสาธารณะ และโครงการต่อต้านความยากจน"
  - "อนาธิปไตยนิยมสุดโต่งที่แสวงหาการยกเลิกรัฐบาลและทรัพย์สินส่วนตัวอย่างสมบูรณ์"
  - "สายกลางที่ถ่วงดุลจุดยืนสังคมนิยมและอนุรักษนิยมอย่างเท่าเทียมในทุกด้านนโยบาย"
explanation: >-
  ในยุโรป liberalism ยังคงเชื่อมโยงกับนโยบายเศรษฐกิจแบบ laissez-faire การลดการแทรกแซงของรัฐ และการปกป้องเสรีภาพส่วนบุคคล คำตอบผิดข้อแรกอธิบาย American liberals ซึ่งได้เปลี่ยนความหมายของคำนี้ไปทาง interventionism เสรีนิยมยุโรปไม่ใช่อนาธิปไตยนิยมและไม่ใช่สายกลาง
reviewed: false
