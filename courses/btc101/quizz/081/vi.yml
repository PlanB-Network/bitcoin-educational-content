question: Câu hỏi trọng tâm về quyền tự quản lý khi chọn một ví Bitcoin là gì?
answer: Bạn có phải là chủ sở hữu của số tiền hay bạn để quyền kiểm soát tiền của mình cho một bên thứ ba?
wrong_answers:
  - Ví có được bảo vệ bằng cụm từ bí mật không?
  - Ví có cho phép nhận và gửi bitcoin không?
  - Tôi có thể chia sẻ ví của mình với người khác không?
explanation: |
  Khi chọn một ví Bitcoin, câu hỏi trọng tâm là: bạn có phải là chủ sở hữu của số tiền hay bạn để quyền kiểm soát tiền của mình cho một bên thứ ba? Điều này là bởi vì người giữ khóa riêng là chủ sở hữu của Bitcoins.
reviewed: true