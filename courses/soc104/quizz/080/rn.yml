question: "Ni iyihe ngingo nyamukuru Hayek atanga ku gituma igenamigambi ry'ubutunzi riva hagati ritsindwa?"
answer: "Ubumenyi bubaho gusa nk'uduce dutatanye dufiswe n'abantu batandukanye, kandi ntibushobora gukoranirizwa hamwe canke kwinjizwa n'ubutegetsi bwo hagati"
wrong_answers:
  - "Abategura ibintu bava hagati barononekaye mu mico kandi bama bakora ku nyungu zabo bwite aho gukorera ineza rusangi"
  - "Inzego za demokarasi ziratinda cane mu kwishura amahinduka y'ubutunzi, bigatuma ingingo zifashwe hagati zama zashaje"
  - "Igenamigambi riva hagati ritsindwa kuko abanyagihugu banka n'ibigirankana amategeko ya leta kandi bakanka kwubahiriza amabwirizwa"
explanation: >-
  Ingingo nyamukuru ya Hayek ishingiye ku kamere k'amakuru. Yerekanye ko ubumenyi butigera bubaho bukoraniye hamwe canke bwinjijwe mu buryo bumwe, ahubwo bubaho gusa nk'uduce dutatanye dufiswe n'abantu bose batandukanye. Agaciro kavana n'ukubona kw'umuntu kandi kamenyekana gusa mu karere kanaka no mu buryo budakwiye. Umuteguzi wo hagati, yicaye mu biro, nta bumenyi afise bw'igiciro nyakuri c'ibintu kuko atari mu migenderanire no mu guhanahana.
