question: "Miten sosialismi kohtelee vapauksia eri tavoin yhteiskunnallisella ja taloudellisella alueella?"
answer: "Sosialismi suosii vahvoja vapauksia yhteiskunnallisella alueella mutta heikkoja vapauksia taloudellisella alueella"
wrong_answers:
  - "Sosialismi rajoittaa kaikkia vapauksia yhtä paljon sekä yhteiskunnallisella että taloudellisella alueella"
  - "Sosialismi suosii vahvoja taloudellisia vapauksia mutta rajoittaa yhteiskunnallisia vapauksia yhteiskuntajärjestyksen ylläpitämiseksi"
  - "Sosialismi myöntää rajattomat vapaudet molemmilla alueilla ja tukeutuu vapaaehtoiseen yhteistyöhön tasapainon ylläpitämiseksi"
explanation: >-
  Sosialistisessa ajattelussa yhteiskunnallisten ja taloudellisten vapauksien välillä on perustavanlaatuinen kahtiajako. Yhteiskunnalliset vapaudet ovat vahvoja, mutta taloudelliset vapaudet ovat heikkoja valtion kontrollin, suunnittelun ja varallisuuden uudelleenjaon painotuksen vuoksi. Kolmas väärä vastaus kuvaa libertaarista ihannetta, kun taas toinen kuvaa konservatiivista mallia, joka on sosialismin peilikuva.
