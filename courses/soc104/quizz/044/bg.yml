question: "Как Green New Deal представлява съвременна еволюция на демократичния социализъм?"
answer: "Той използва екологичните тревоги като ново оправдание за държавна намеса и конфискация на частен доход, подчинявайки индивидуалния интерес на колективното планетарно здраве"
wrong_answers:
  - "Той напълно изоставя традиционната социалистическа икономика в полза на свободнопазарни решения на екологичните проблеми чрез търговия с въглеродни емисии"
  - "Той отхвърля държавната намеса и вместо това разчита на доброволни индивидуални действия и иновации в частния сектор, за да се справи с климатичните промени"
  - "Той представлява разрив със социализма, като приоритизира защитата на околната среда над всички въпроси на социалната справедливост и заетостта"
explanation: >-
  Green New Deal слива екологичните тревоги със социални цели, съчетавайки екологичен преход със социална справедливост, гаранции за заетост и засилени публични услуги. Индивидуалният интерес е подчинен на колективния интерес, дефиниран от здравето на планетата. В основата си той предоставя нова реторична обвивка, оправдаваща държавна намеса и конфискация на частен доход, вече не само в името на социалната справедливост, но и в името на околната среда.
reviewed: false
