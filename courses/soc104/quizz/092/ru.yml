question: "Каким трём столпам государства всеобщего благосостояния бросает вызов Bitcoin?"
answer: "Фискальной системе, денежной монополии для финансирования расходов через долг и надзору за транзакциями для предотвращения использования альтернативных валют"
wrong_answers:
  - "Военному бюджету, системе государственного образования и подконтрольной государству инфраструктуре здравоохранения"
  - "Судебной системе, законодательному процессу и исполнительному обеспечению регулирования бизнеса"
  - "Системе социального обеспечения, законодательству о минимальной заработной плате и прогрессивной шкале подоходного налога"
explanation: >-
  Bitcoin бросает вызов трём столпам, на которых держится государство всеобщего благосостояния. Во-первых, фискальной системе, которой недостаточно для покрытия расходов. Во-вторых, денежной монополии, то есть способности выпускать деньги для финансирования расходов через долг. В-третьих, надзору за транзакциями, способности не позволять людям использовать какую-либо валюту, кроме навязанного государством фиата. Bitcoin подрывает все три одновременно.
