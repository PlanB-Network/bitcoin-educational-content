question: "Защо тоталитарните режими са описвани като „светски религии“ и какво разкрива това за условията, необходими за съществуването на тоталитаризъм?"
answer: "Те изискват квазирелигиозна вяра от бойците и използват страх срещу противниците, а тоталитаризмът изисква всички характеристики едновременно: потиснати свободи, еднопартийно управление, насилствена революция и дирижирана икономика"
wrong_answers:
  - "Те заменят традиционното богослужение с държавни церемонии, а тоталитаризмът изисква само харизматичен лидер и военен контрол"
  - "Те използват религиозни институции, за да налагат държавна идеология, а тоталитаризмът може да възникне винаги когато една политическа партия доминира парламента"
  - "Те обещават духовно спасение чрез политическо действие, а тоталитаризъм съществува винаги когато държавата контролира икономиката, независимо от политическите свободи"
explanation: >-
  Raymond Aron отбелязва, че тоталитарните режими функционират върху два принципа: вярата на бойците и страхът на противниците. Този квазирелигиозен фанатизъм ги характеризира отвъд различните им мотивации, което им носи етикета светски религии. Решаващо е, че тоталитаризмът изисква всички определящи характеристики едновременно: потиснати свободи, неограничена власт чрез една-единствена партия, насилствена революция и дирижирана икономика. Модерните демокрации могат да проявяват някои от тези черти, но тоталитаризмът е налице само когато всички са събрани заедно.
