title: "The General Theory of Employment, Interest, and Money"

publication_year: 1936

cover: cover_en.webp

original: true

description: |
  Keynes's magnum opus revolutionized macroeconomics by arguing that aggregate demand, not supply, drives employment and output. He proposed that governments should use deficit spending to stimulate the economy during downturns, challenging the classical view that markets naturally tend toward full employment. The book provided the intellectual foundation for the welfare state and interventionist fiscal policy that dominated the 20th century, and remains the primary target of Austrian school criticism.
