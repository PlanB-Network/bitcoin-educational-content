question: What is the scope of the ethical revolution brought about by the Bible?
answer: It lays the foundation for a moral universalism recognizing the equal value of every human being.
wrong_answers:
  - It leads to a new concept of justice based on equality and compassion.
  - It establishes a set of dietary and ritual laws that govern daily life.
  - It challenges the passive acceptance of suffering and encourages action to alleviate it.
explanation: |
  The Bible introduced a moral universalism recognizing the equal value of every human being, based on the idea that all are created in God's image, which transformed the relationship to evil and suffering and laid the groundwork for universal human rights.
reviewed: true
