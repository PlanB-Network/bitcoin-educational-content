question: "Mis iseloomustab Nolani diagrammil isikliku vabaduse telje alumist osa?"
answer: "Korra, turvalisuse, traditsiooniliste väärtuste ning selle eelistamine, et riik reguleeriks moraali ja hoiaks avalikku korda"
wrong_answers:
  - "Üksikisiku autonoomia, sallivuse ja minimaalse riikliku sekkumise eelistamine isikliku elu valikutes"
  - "Majandusliku dereguleerimise, vabakaubanduse ning tollimaksude ja subsiidiumide kaotamise eelistamine"
  - "Rikkuse ümberjaotamise, kõrgete maksude ja võtmetööstusharude riigistamise eelistamine"
explanation: >-
  Isikliku vabaduse telje alumine osa esindab maksimaalset riiklikku kontrolli isikliku elu üle, mida iseloomustab korra, turvalisuse ja traditsiooniliste väärtuste eelistamine. Riik reguleerib moraali, hoiab avalikku korda ja võib kaitsta konkreetset moraali- või traditsiooninägemust. Telje ülemine osa esindab vastandit: üksikisiku vabadust ja sallivust. Majanduspoliitikaid mõõdetakse eraldi horisontaalteljel.
reviewed: false
