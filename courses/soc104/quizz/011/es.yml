question: "¿Qué incluye la categoría de libertad económica?"
answer: "Lo que haces como productor y consumidor: comprar, vender, producir, trabajar, contratar y gestionar tu dinero"
wrong_answers:
  - "Tus creencias religiosas, relaciones personales y libertad de expresión"
  - "Tu derecho a votar, participar en elecciones y unirte a partidos políticos"
  - "Tu capacidad de viajar libremente, elegir tu residencia y cruzar fronteras nacionales"
explanation: >-
  La libertad económica cubre lo que haces como productor y consumidor: lo que puedes comprar, vender o producir; dónde trabajas; a quién contratas; y qué haces con tu dinero. Las relaciones personales, las creencias religiosas y la libertad de movimiento pertenecen a la categoría de libertad personal, no a la económica.
