question: "Perché il corso descrive Bitcoin come una moneta di mercato opposta alla moneta di Stato, anziché come un progetto di destra o di sinistra?"
answer: "Perché Bitcoin è una valuta adottata volontariamente, difficile da produrre e decentralizzata, che conserva valore, in contrasto con la moneta fiat coercitiva e centralizzata che perde valore, rendendo la frattura una questione di mercato contro Stato anziché di ideologia politica"
wrong_answers:
  - "Perché Bitcoin è stato creato da uno sviluppatore anonimo che evitò deliberatamente di fare qualsiasi dichiarazione politica sul suo scopo o sulla sua filosofia"
  - "Perché l'algoritmo di mining di Bitcoin garantisce una distribuzione equa delle nuove monete a tutti i partiti politici, impedendo qualsiasi bias ideologico nel sistema monetario"
  - "Perché Bitcoin funziona in modo identico alle valute fiat esistenti ma opera su una rete di pagamento più veloce, rendendo irrilevanti le distinzioni politiche"
explanation: >-
  Bitcoin è descritto come una rivolta pacifica contro la politicizzazione del denaro. La moneta di Stato o fiat è un sistema coercitivo e centralizzato che tende a perdere valore. La moneta di mercato, storicamente l'oro e oggi Bitcoin, è una valuta sana, difficile da produrre, che emerge volontariamente e conserva il proprio valore nel lungo periodo. La vera opposizione non è sinistra contro destra, ma mercato contro Stato, rendendo Bitcoin una rottura politica che trascende i campi ideologici tradizionali.
reviewed: false
