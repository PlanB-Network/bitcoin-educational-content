question: "O que a declaração de Mussolini de 1920, 'Tudo no Estado, nada fora do Estado, nada contra o Estado', revela sobre o totalitarismo?"
answer: "Já não há nenhuma separação entre o espaço público e o privado, pois o Estado absorve inteiramente a sociedade"
wrong_answers:
  - "O Estado se concentra exclusivamente no poder militar enquanto deixa a economia para a iniciativa privada"
  - "Os cidadãos são livres para se organizar privadamente desde que não critiquem abertamente o governo"
  - "O governo controla apenas a atividade política enquanto a vida cultural e religiosa permanece autônoma"
explanation: >-
  A declaração de Mussolini captura a essência do totalitarismo: a totalidade. Tudo é absorvido pelo Estado, o que significa que não há separação entre o espaço público e o privado. A sociedade perde toda forma de autonomia, até nas atividades mais banais, como abrir um clube esportivo. Isso vai muito além de controlar apenas as esferas militar, política ou econômica.
