question: "Vad är paleo-libertarianism?"
answer: "En syntes som kombinerar avvisandet av staten som en källa till tvång med en förstärkning av traditionella institutioner och frivilliga sociala strukturer"
wrong_answers:
  - "En libertariansk rörelse som avvisar alla traditionella värden och främjar radikal social progressivism"
  - "En konservativ ideologi som använder statsmakt för att upprätthålla traditionella värden samtidigt som den tillåter viss ekonomisk frihet"
  - "En centristisk filosofi som söker en balanserad kompromiss mellan socialistisk ekonomi och konservativ socialpolitik"
explanation: >-
  Paleo-libertarianism kombinerar avvisandet av staten som den institutionella källan till tvång med en förstärkning av traditionella institutioner och en preferens för frivilliga sociala strukturer framför statlig auktoritet. Den skiljer sig från neo-libertarianism genom att vara mer välvilligt inställd till traditionella värden. Paleo-libertarianen motsätter sig inte att gemenskaper organiserar sig kring socialistiska eller kommunitaristiska principer; de vägrar bara att sådana gemenskaper påtvingar alla sina värden med lagens tvång.
