question: "ระบบเงิน fiat เสริมความแตกต่างระหว่างผู้ปกครองกับผู้ถูกปกครองอย่างไร?"
answer: "มันเปิดให้รัฐบาลจัดหาเงินทุนสำหรับการใช้จ่ายไม่จำกัดผ่านการสร้างเงิน ซึ่งลดมูลค่าเงินออมผ่านเงินเฟ้อ"
wrong_answers:
  - "มันให้พลเมืองควบคุมนโยบายการเงินโดยตรงผ่านการเลือกตั้งและประชามติ"
  - "มันป้องกันไม่ให้รัฐบาลกู้ยืม ทำให้ต้องพึ่งพาภาษีเป็นรายได้เพียงอย่างเดียว"
  - "มันกระจายเงินที่สร้างขึ้นใหม่อย่างเท่าเทียมให้พลเมืองทุกคนเพื่อกระตุ้นการเติบโตทางเศรษฐกิจ"
explanation: >-
  เงิน fiat ถูกอธิบายว่าเป็นรากฐานของการขยายอำนาจรัฐ เพราะมันเปิดให้รัฐบาลกู้ยืมและผลักดันให้ธนาคารพิมพ์เงินใหม่ เงินเฟ้อที่ตามมาลดมูลค่าเงินออมของผู้คน เอื้อประโยชน์แก่หน่วยงานที่ร่ำรวยที่สุดและทรงอำนาจที่สุด มันไม่ได้ให้พลเมืองควบคุมเงิน ไม่ได้ป้องกันการกู้ยืม และไม่ได้กระจายเงินอย่างเท่าเทียม
reviewed: false
