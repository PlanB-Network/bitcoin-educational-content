question: "Trong hình thoi Nolan, vị trí nào nằm ở đỉnh và đại diện cho tự do tối đa?"
answer: "Chủ nghĩa tự do cá nhân (libertarianism), ủng hộ mức độ tự do kinh tế và cá nhân lớn nhất"
wrong_answers:
  - "Chủ nghĩa bảo thủ, ủng hộ các giá trị truyền thống và tự do kinh tế"
  - "Chủ nghĩa trung dung, cân bằng mọi lập trường chính trị theo cách thực dụng"
  - "Chủ nghĩa xã hội, ủng hộ tự do cá nhân và bình đẳng xã hội"
explanation: >-
  Chủ nghĩa tự do cá nhân (libertarianism) chiếm đỉnh của hình thoi Nolan với tư cách là mặt đối lập của chủ nghĩa nhà nước. Nó đại diện cho những người ủng hộ mức độ lớn nhất của cả tự do kinh tế lẫn tự do cá nhân. Chủ nghĩa bảo thủ nằm bên phải (tự do kinh tế cao, tự do cá nhân thấp), chủ nghĩa xã hội nằm bên trái (tự do cá nhân cao, tự do kinh tế thấp), và chủ nghĩa trung dung ở giữa.
reviewed: false
