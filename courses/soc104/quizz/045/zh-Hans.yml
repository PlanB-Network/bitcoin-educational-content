question: "Green New Deal 如何代表民主社会主义的一种当代演变？"
answer: "它把环境关切用作国家干预和没收私人收入的新理由，将个人利益从属于集体的地球健康"
wrong_answers:
  - "它完全放弃传统社会主义经济学，转而支持通过碳交易以自由市场解决环境问题"
  - "它拒绝国家干预，转而依靠自愿的个人行动和私营部门创新来应对气候变化"
  - "它通过把环境保护置于所有社会正义和就业关切之上，代表了与社会主义的决裂"
explanation: >-
  Green New Deal 将环境关切与社会目标融合在一起，把生态转型与社会正义、就业保障和强化公共服务结合起来。个人利益从属于由地球健康定义的集体利益。从根本上说，它提供了一个新的修辞外壳，用来为国家干预和没收私人收入辩护，不再仅仅以社会正义之名，也以环境之名。
reviewed: false
