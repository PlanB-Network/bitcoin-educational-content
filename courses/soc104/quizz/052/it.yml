question: "Verso quale forma di governance tende il centrismo?"
answer: "La tecnocrazia, dove il potere è affidato a esperti che guidano l'economia e la politica monetaria"
wrong_answers:
  - "La democrazia diretta, dove i cittadini votano su ogni decisione politica importante"
  - "L'aristocrazia, dove il potere è detenuto da una classe dirigente tradizionale"
  - "Il governo laissez-faire, dove il mercato si regola da solo senza intervento statale"
explanation: >-
  Il centrismo privilegia l'efficienza, il pragmatismo e tende alla tecnocrazia, il che significa che il potere dovrebbe essere affidato a esperti che guidano l'economia e pilotano la politica monetaria. Questo è fondamentalmente diverso dalla democrazia diretta, dall'aristocrazia o dal laissez-faire, ciascuno dei quali distribuisce il potere secondo principi completamente diversi.
