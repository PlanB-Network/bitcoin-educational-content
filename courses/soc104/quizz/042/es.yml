question: "¿Cómo trata el socialismo las libertades de manera diferente en las esferas social y económica?"
answer: "El socialismo favorece libertades fuertes en la esfera social, pero libertades débiles en la esfera económica"
wrong_answers:
  - "El socialismo restringe todas las libertades por igual tanto en la esfera social como en la económica"
  - "El socialismo favorece fuertes libertades económicas, pero restringe las libertades sociales para mantener el orden social"
  - "El socialismo concede libertades ilimitadas en ambas esferas y se basa en la cooperación voluntaria para mantener el equilibrio"
explanation: >-
  En el pensamiento socialista existe una dicotomía fundamental entre las libertades sociales y las económicas. Las libertades sociales son fuertes, pero las libertades económicas son débiles debido al énfasis en el control estatal, la planificación y la redistribución de la riqueza. La tercera respuesta incorrecta describe el ideal libertariano, mientras que la segunda describe el patrón conservador, que es la imagen especular del socialismo.
