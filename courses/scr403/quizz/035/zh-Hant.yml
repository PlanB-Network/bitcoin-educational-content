question: 在 ⟨⟨1,1⟩,1⟩（1+1+1）上追蹤全加器的執行。第二階段 O O H ▵ (O I H ▵ I H ⨾ half-adder) 交給最終階段的是什麼值？
answer: ⟨1, ⟨0, 1⟩⟩ —— 第一個半加器的進位，接著是第二個的進位與和。
wrong_answers:
  - ⟨1, ⟨1, 0⟩⟩ —— 第一個半加器的進位，接著是第二個的和與進位。
  - ⟨0, ⟨0, 1⟩⟩ —— 第一個半加器的和位元，接著是第二個的進位與和。
  - ⟨1, ⟨1, 1⟩⟩ —— 第一個半加器的進位，接著是第二個的 OR 與 XOR 位元。
explanation: >-
  第一階段計算 half-adder⟨1,1⟩ = ⟨1, 0⟩（進位 1、和 0），並保存進位輸入，得到 ⟨⟨1,0⟩, 1⟩。在第二階段，O O H 取出第一個進位（1），而 O I H ▵ I H 將 ⟨0, 1⟩ —— 即第一個和與進位輸入 —— 餵入第二個半加器，由於 and(0,1)=0 且 xor(0,1)=1，於是得到 ⟨0, 1⟩。最終階段接著對這兩個進位取 OR 並保留和，產生 ⟨1, 1⟩：即二進位的 3，正如預期。
