question: "Ce trei piloni ai statului-providență sunt contestați de Bitcoin?"
answer: "Sistemul fiscal, monopolul monetar pentru finanțarea cheltuielilor prin datorie și supravegherea tranzacțiilor pentru a împiedica folosirea monedelor alternative"
wrong_answers:
  - "Bugetul militar, sistemul public de educație și infrastructura de sănătate controlată de guvern"
  - "Sistemul judiciar, procesul legislativ și aplicarea executivă a reglementărilor asupra afacerilor"
  - "Sistemul de securitate socială, legislația salariului minim și structura progresivă a impozitului pe venit"
explanation: >-
  Bitcoin contestă cei trei piloni pe care se sprijină statul-providență. În primul rând, sistemul fiscal, care este insuficient pentru a acoperi cheltuielile. În al doilea rând, monopolul monetar, adică posibilitatea de a emite bani pentru a finanța cheltuielile prin datorie. În al treilea rând, supravegherea tranzacțiilor, capacitatea de a împiedica oamenii să folosească orice monedă în afara celei fiat impuse de stat. Bitcoin subminează simultan toți acești trei piloni.
reviewed: false
