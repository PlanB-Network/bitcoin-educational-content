question: Ako sa Dupont de Nemours prezentuje vo svojej brožúre o asignátoch?
answer: Ako priateľ ľudu
wrong_answers:
  - Ako priateľ kráľa
  - Ako priateľ slobody
  - Ako priateľ buržoázie
explanation: |
  Dupont de Nemours sa prezentoval ako "priateľ ľudu" a podčiarkol tak svoj záujem o blaho obyvateľstva.
