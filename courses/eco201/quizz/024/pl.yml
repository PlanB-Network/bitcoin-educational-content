question: Jakie jest rozwiązanie problemu bezpośredniej wymiany w podziale pracy?
answer: Pośrednia wymiana ułatwiona przez pieniądze.
wrong_answers:
  - Bezpośrednia wymiana ułatwiona przez barter.
  - Pośrednia wymiana ułatwiony przez barter.
  - Bezpośrednia wymiana ułatwiona przez pieniądze.
explanation: |
  Pieniądze pozwalają na pośrednią wymianę, gdzie jednostka może
  kupić od innej osoby, a sprzedawca może użyć tej jednostki monetarnej
  gdzie indziej, w innym czasie i z kimś innym.
reviewed: true
