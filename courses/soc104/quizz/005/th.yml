question: "สองแกนของ Nolan diagram คืออะไร?"
answer: "แกนตั้งที่วัดเสรีภาพส่วนบุคคล และแกนนอนที่วัดเสรีภาพทางเศรษฐกิจ"
wrong_answers:
  - "แกนนอนจากซ้ายไปขวา และแกนตั้งจากอำนาจนิยมไปสู่ประชาธิปไตย"
  - "แกนตั้งที่วัดความมั่งคั่ง และแกนนอนที่วัดระดับการศึกษา"
  - "แกนนอนจากสังคมนิยมไปสู่ทุนนิยม และแกนตั้งจากจารีตไปสู่ความก้าวหน้า"
explanation: >-
  David Nolan ออกแบบแผนภาพของเขาด้วยสองแกนเฉพาะ: เสรีภาพส่วนบุคคล (แกนตั้ง) และเสรีภาพทางเศรษฐกิจ (แกนนอน) แนวทางสองมิตินี้แทนที่เส้นซ้าย-ขวาที่เรียบง่ายเกินไป และจับความซับซ้อนของอุดมการณ์ทางการเมืองได้ดีกว่าโดยแยกเสรีภาพสองหมวดหลักออกจากกัน
reviewed: false
