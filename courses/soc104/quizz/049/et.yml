question: "Mis eristab neokonservatiive paleokonservatiividest nende lähenemises välispoliitikale?"
answer: "Neokonservatiivid õigustavad sõjalist interventsionismi demokraatia levitamiseks, samas kui paleokonservatiivid kaitsevad isolatsionistlikumat välispoliitikat"
wrong_answers:
  - "Neokonservatiivid on vastu igasugusele sõjalisele tegevusele ja eelistavad diplomaatiat, samas kui paleokonservatiivid toetavad ennetavaid lööke võimalike ohtude vastu"
  - "Neokonservatiivid keskenduvad üksnes majandussanktsioonidele, samas kui paleokonservatiivid pooldavad rahvusvaheliste koalitsioonide loomist ühisteks sõjalisteks operatsioonideks"
  - "Neokonservatiivid ja paleokonservatiivid nõustuvad välispoliitikas, kuid erinevad teravalt sisemaises majandusregulatsioonis"
explanation: >-
  Alates 2000. aastatest hakkasid neokonservatiivid üha enam õigustama sõjalist interventsionismi demokraatia juurutamiseks kogu maailmas, eriti pärast 11. septembrit 2001. Vastureaktsioonina võtsid traditsioonilised konservatiivid enda eristamiseks kasutusele nimetuse „paleokonservatiiv”. Paleokonservatiivid kritiseerivad sõjalist interventsionismi, kaitsevad isolatsionistlikumat välispoliitikat ning panevad suuremat rõhku rahvuslikule ja kultuurilisele identiteedile.
