question: "Ufafanuzi wa ustatisti kama unavyowasilishwa katika mfumo wa Nolan ni upi?"
answer: "Kutumia sheria kudhibiti na kuunda jamii, iwe kwa jina la kutetea ustaarabu, tabaka la wafanyakazi, asili, au waliokandamizwa"
wrong_answers:
  - "Mfumo wa serikali ambapo viongozi waliochaguliwa hutumikia mihula maalumu na madaraka huhamishwa kupitia uchaguzi wa kidemokrasia"
  - "Imani kwamba jeshi lenye nguvu pekee ndilo linaweza kulinda mamlaka ya kujitawala ya taifa na uadilifu wa eneo lake"
  - "Falsafa ya kiuchumi inayozipa kipaumbele sekta za kitaifa dhidi ya ushindani wa kigeni kupitia ushuru wa forodha na mgao"
explanation: >-
  Ustatisti unafafanuliwa kama kutumia sheria kudhibiti na kuunda jamii. Mrengo wa kushoto na mrengo wa kulia wote huutumia: baadhi kwa jina la kutetea ustaarabu, wengine kwa jina la kutetea tabaka la wafanyakazi, asili, au waliokandamizwa. Hata watu wa msimamo wa kati huukubali unapowafaa. Ustatisti hauishii kwenye sera ya kijeshi, ulinzi wa biashara, au kuwa tu na serikali zilizochaguliwa.
