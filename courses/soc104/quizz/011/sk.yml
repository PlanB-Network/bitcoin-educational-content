question: "Čo zahŕňa kategória osobnej slobody?"
answer: "To, čo robíte vo svojich súkromných vzťahoch, so svojimi názormi, presvedčeniami a všetkým, čo sa týka vášho vlastného tela a mysle"
wrong_answers:
  - "To, čo robíte ako producent, vrátane založenia podniku, najímania zamestnancov a obchodovania s tovarom"
  - "Koľko daní platíte, aké investície robíte a ako spravujete svoje finančné aktíva"
  - "Vašu schopnosť súťažiť na trhu, stanovovať ceny svojich produktov a vyberať si dodávateľov"
explanation: >-
  Osobná sloboda zahŕňa to, čo robíte vo svojich súkromných vzťahoch, so svojimi názormi a presvedčeniami a všetkým, čo sa týka vášho vlastného tela a mysle. Patrí sem manželstvo, výber čítania, náboženské praktiky, výber jedla a liekov a to, s kým sa združujete. Podnikateľské činnosti, dane a trhové rozhodnutia patria pod ekonomickú slobodu.
