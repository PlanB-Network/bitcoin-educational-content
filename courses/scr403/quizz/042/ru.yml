question: В момент траты одна из ветвей case отсекается. Как верификатор всё же может сопоставить раскрытую программу с закреплённым CMR?
answer: CMR — это корень Меркла, поэтому тратящий предоставляет только CMR отсечённой ветви, а верификатор включает его в вычисление, чтобы восстановить корень.
wrong_answers:
  - Верификатор использует только выполненную ветвь, поскольку невыполненные ветви case никогда не входили в CMR.
  - Отсечённые ветви становятся каноническим заполнителем, чей фиксированный CMR подставляется при пересчёте корня.
  - Полный код отсечённой ветви остаётся в свидетеле, где верификатор его хеширует, но не выполняет.
explanation: >-
  CMR выражения case f g — это помеченный хеш от CMR обоих потомков,
  поэтому каждая ветвь — выполненная или нет — закрепляется уже на
  этапе адресации. Поскольку эта конструкция является деревом Меркла,
  отсечённая ветвь может быть представлена одним лишь своим 32-байтовым
  CMR: верификатор подставляет этот хеш в рекурсивное вычисление и
  проверяет, что корень совпадает с закреплением UTXO, ни разу не
  увидев отсечённый код. Именно поэтому для закрепления используется
  корень Меркла, и именно поэтому любые выражения из свидетеля внутри
  отсечённой ветви никогда не появляются в блокчейне.
reviewed: false
