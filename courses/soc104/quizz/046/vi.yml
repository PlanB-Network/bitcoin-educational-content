question: "Chủ nghĩa bảo thủ xử lý các quyền tự do trong lĩnh vực kinh tế và xã hội như thế nào?"
answer: "Các quyền tự do mạnh trong lĩnh vực kinh tế nhưng yếu trong lĩnh vực xã hội"
wrong_answers:
  - "Các quyền tự do yếu trong cả lĩnh vực kinh tế và xã hội để duy trì trật tự xã hội truyền thống"
  - "Các quyền tự do mạnh trong lĩnh vực xã hội nhưng yếu trong lĩnh vực kinh tế"
  - "Các quyền tự do bình đẳng và không giới hạn trong cả hai lĩnh vực với sự can thiệp tối thiểu của chính phủ dưới mọi hình thức"
explanation: >-
  Chủ nghĩa bảo thủ thể hiện một sự phân đôi là hình ảnh đối chiếu của chủ nghĩa xã hội. Trong miền kinh tế, những người bảo thủ bảo vệ thị trường tự do, tinh thần doanh nghiệp và tài sản tư nhân. Trong miền xã hội, các hạn chế được biện minh bằng việc bảo tồn các chuẩn mực đạo đức truyền thống và ổn định xã hội. Câu trả lời sai thứ ba mô tả mô thức xã hội chủ nghĩa, vốn là điều ngược lại.
