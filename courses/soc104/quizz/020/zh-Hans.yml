question: "诺兰图的纵轴揭示了真正的政治问题是什么？"
answer: "它揭示的是，你是想通过国家把自己的敏感性强加给他人，还是更愿意每个人都能自由地为自己作决定"
wrong_answers:
  - "它揭示的是，你支持民主治理，还是更偏好由单一领导者进行威权统治"
  - "它揭示的是，你认同进步社会运动，还是认同传统宗教制度"
  - "它揭示的是，你的首要关切是国家安全，还是经济繁荣"
explanation: >-
  纵轴揭示了真正的政治问题：不是你是左派还是右派，而是你希望国家在多大程度上介入，根据你的价值观塑造社会。你是否希望把自己的敏感性强加给他人，还是更愿意每个人都能自由地为自己作决定？这一框架超越了左右分野，并表明两个阵营都可能同样国家主义。
reviewed: false
