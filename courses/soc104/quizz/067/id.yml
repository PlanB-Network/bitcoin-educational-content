question: "Mengapa rezim totalitarian digambarkan sebagai 'agama sekuler', dan apa yang diungkapkan hal ini tentang kondisi yang diperlukan agar totalitarianisme dapat ada?"
answer: "Mereka menuntut iman semireligius dari para militan dan menggunakan rasa takut terhadap lawan, dan totalitarianisme mensyaratkan semua karakteristik secara simultan: kebebasan yang ditekan, kekuasaan partai tunggal, revolusi kekerasan, dan ekonomi terarah"
wrong_answers:
  - "Mereka menggantikan ibadah tradisional dengan upacara negara, dan totalitarianisme hanya membutuhkan pemimpin karismatik dan kontrol militer"
  - "Mereka menggunakan institusi keagamaan untuk menegakkan ideologi negara, dan totalitarianisme dapat muncul kapan pun satu partai politik mendominasi parlemen"
  - "Mereka menjanjikan keselamatan spiritual melalui aksi politik, dan totalitarianisme ada kapan pun negara mengendalikan ekonomi terlepas dari kebebasan politik"
explanation: >-
  Raymond Aron mengamati bahwa rezim totalitarian berfungsi berdasarkan dua prinsip: iman para militan dan ketakutan para lawan. Fanatisme semireligius ini mencirikan mereka melampaui perbedaan motivasi mereka, sehingga mereka mendapat label agama sekuler. Yang krusial, totalitarianisme mensyaratkan semua karakteristik penentunya secara simultan: kebebasan yang ditekan, otoritas tak terbatas melalui satu partai, revolusi kekerasan, dan ekonomi terarah. Demokrasi modern mungkin menunjukkan sebagian dari ciri-ciri ini, tetapi totalitarianisme hadir hanya ketika semuanya tersusun bersama.
