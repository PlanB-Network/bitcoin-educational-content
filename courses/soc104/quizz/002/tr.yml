question: "Frédéric Bastiat'nın Ulusal Meclis'teki oylarını hangi yönlendirici ilke belirliyordu?"
answer: "Bireysel ve ekonomik özgürlüklerin teşviki ve devlet müdahalesinin azaltılması"
wrong_answers:
  - "Kraliyet otoritesinin savunulması ve monarşik geleneklerin korunması"
  - "Serveti daha eşit biçimde yeniden dağıtmak için sosyalist politikaların ilerletilmesi"
  - "Sol ve sağ hizipler arasında merkezci bir uzlaşma stratejisi"
explanation: >-
  Bastiat, temel bir ilkeye dayanarak oy veriyordu: devlet müdahalesini azaltırken bireysel ve ekonomik özgürlükleri teşvik etmek. Merkezci bir oportünist değildi; kralcı ya da sosyalist de değildi. Özgürlük ve sınırlı devletle uyumlu önlemler öneren taraf hangisiyse onunla oy verirdi.
