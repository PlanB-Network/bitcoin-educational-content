question: "Hvilke emblematiske skikkelser forbindes med maksimal økonomisk frihet i Nolan-diagrammet?"
answer: "Margaret Thatcher, Ronald Reagan og Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures og Bernie Sanders"
  - "Nelson Mandela, Simone Veil og Noam Chomsky"
  - "Vladimir Putin, Xi Jinping og Joseph de Maistre"
explanation: >-
  Thatcher, Reagan og Milei nevnes som emblematiske skikkelser for maksimal økonomisk frihet, med preferanse for mindre statlig inngripen, færre reguleringer og lavere skatter. Roosevelt, Jaures og Sanders representerer den motsatte enden, som favoriserer statlig kontroll over økonomien. Mandela, Veil og Chomsky representerer maksimal personlig frihet. Putin, Xi Jinping og de Maistre representerer maksimal statlig kontroll over privatlivet.
reviewed: false
