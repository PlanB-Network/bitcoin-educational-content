question: "Какво включва категорията икономическа свобода?"
answer: "Това, което правите като производител и потребител: купуване, продаване, производство, работа, наемане и управление на парите ви"
wrong_answers:
  - "Религиозните ви убеждения, личните отношения и свободата на изразяване"
  - "Правото ви да гласувате, да участвате в избори и да се присъединявате към политически партии"
  - "Способността ви да пътувате свободно, да избирате местоживеенето си и да пресичате национални граници"
explanation: >-
  Икономическата свобода обхваща това, което правите като производител и потребител: какво можете да купувате, продавате или произвеждате; къде работите; кого наемате; и какво правите с парите си. Личните отношения, религиозните убеждения и свободата на движение попадат в категорията лична свобода, а не в икономическата.
reviewed: false
