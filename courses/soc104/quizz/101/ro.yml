question: "Ce identifică cursul drept adevărata diviziune politică, dincolo de spectrul tradițional stânga-dreapta-centru?"
answer: "Diviziunea dintre principii filosofice fundamentale: libertate sau constrângere, consimțământ voluntar sau coerciție, individul responsabil sau colectivul"
wrong_answers:
  - "Diviziunea dintre națiunile bogate și cele sărace privind controlul acordurilor comerciale internaționale și al instituțiilor financiare globale"
  - "Diviziunea dintre populațiile urbane și rurale privind prioritățile de cheltuieli guvernamentale și investițiile în infrastructură"
  - "Diviziunea dintre culturile progresiste și cele tradiționale privind normele sociale, valorile familiale și educația religioasă"
explanation: >-
  Cursul susține că adevărata diviziune politică nu se află în etichetele tradiționale stânga-dreapta-centru, ci în principii filosofice fundamentale: libertate sau constrângere, consimțământ voluntar sau coerciție, individul responsabil sau colectivul. Modul corect de a gândi politica este să pornești de la principii etice, nu de la etichete.
reviewed: false
