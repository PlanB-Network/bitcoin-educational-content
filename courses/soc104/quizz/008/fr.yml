question: "Où les Verts se situent-ils sur le diagramme de Nolan, et pourquoi ?"
answer: "Très bas sur le diagramme, parce qu'ils considèrent que l'intérêt individuel ne doit pas primer sur l'intérêt collectif de la planète"
wrong_answers:
  - "Au sommet du diagramme, parce qu'ils donnent la priorité à la liberté personnelle et à la conscience environnementale à parts égales"
  - "Au centre du diagramme, parce qu'ils équilibrent la croissance économique avec la protection de l'environnement"
  - "À l'extrême droite, parce qu'ils soutiennent des solutions de marché aux défis environnementaux"
explanation: >-
  Les Verts se situent très bas sur le diagramme de Nolan parce qu'ils favorisent un fort contrôle de l'État sur les décisions économiques comme personnelles au nom du bien-être planétaire. Ils ont remplacé la lutte des classes marxiste par une lutte entre l'homme et la nature, et tendent à défendre le contrôle économique, voire l'abolition de la propriété privée. Cela les place dans le secteur autoritaire, et non au sommet ou au centre.
reviewed: false
