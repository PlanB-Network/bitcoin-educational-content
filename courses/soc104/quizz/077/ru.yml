question: "Что имеет приоритет над свободой в консервативной политической философии?"
answer: "Порядок и традиция, которые должны быть прочно установлены, прежде чем свободу можно будет ценить"
wrong_answers:
  - "Социальная справедливость и равенство, которые должны быть гарантированы, прежде чем люди смогут быть по-настоящему свободными"
  - "Экономическая эффективность и прагматические результаты, которые определяют, когда свобода уместна"
  - "Индивидуальные права собственности, которые должны быть защищены, прежде чем будет предоставлена любая другая свобода"
explanation: >-
  Для консерваторов порядок и традиция имеют приоритет над свободой. Они утверждают, что слишком большая свобода порождает хаос и социальный беспорядок, поэтому свободу можно ценить только после того, как порядок будет прочно установлен. Это контрастирует с социалистическим взглядом, отдающим приоритет справедливости, или с центристским акцентом на эффективности.
reviewed: false
