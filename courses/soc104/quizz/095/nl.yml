question: "Hoe functioneert Bitcoin als een moreel project met politieke gevolgen in plaats van als een politiek project met morele claims?"
answer: "Bitcoin is ontworpen om mensen vrij te maken in plaats van rijk, door effectief eigendom mogelijk te maken, de waarde van werk te beschermen en privacy te behouden; dit zijn morele verwezenlijkingen die politieke effecten voortbrengen zonder aanspraak te maken op enig politiek kamp"
wrong_answers:
  - "Bitcoin is een moreel project omdat de code ethische regels afdwingt die fraude voorkomen, en het politieke gevolg ervan is het vervangen van democratisch bestuur door algoritmische besluitvorming"
  - "Bitcoin functioneert als een moreel project omdat het rijkdom herverdeelt van de rijken naar early adopters, waardoor een eerlijkere samenleving ontstaat met politieke implicaties voor fiscaal beleid"
  - "Bitcoin is moreel omdat Satoshi Nakamoto ethische geboden in het protocol heeft verwerkt, en het politieke gevolg ervan is het verenigen van alle politieke families onder een gedeeld monetair systeem"
explanation: >-
  Bitcoin is niet ontworpen om mensen rijk te maken, maar om ze vrij te maken. Het bereikt drie morele uitkomsten: effectief eigendom mogelijk maken (verantwoordelijkheid stimuleren), de door werk gecreëerde waarde beschermen (productieve inspanning aanmoedigen), en privacy behouden (mensen toestaan zonder angst te leven). Dit zijn morele verwezenlijkingen die politieke gevolgen dragen zonder tot enig politiek kamp te behoren, waardoor het eerst een moreel project is en pas daarna een politiek project.
reviewed: false
