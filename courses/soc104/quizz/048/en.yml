question: "How did Michael Oakeshott characterize conservatism in his philosophical work?"
answer: "As a temperament and disposition toward life rather than a rigid systematic ideology"
wrong_answers:
  - "As a comprehensive economic theory with precise policy prescriptions for every area of government"
  - "As a revolutionary movement that seeks to dismantle modern institutions and return to pre-industrial society"
  - "As a purely religious doctrine grounded in Christian theology and ecclesiastical authority"
explanation: >-
  Michael Oakeshott, a British philosopher, defended a conception of conservatism as temperament rather than systematic ideology. His essay On Being Conservative (1956) remains an essential reference. This view of conservatism as a disposition also influenced Friedrich Hayek. Oakeshott's approach is notable for its critique of rationalism in politics, rejecting the idea that politics can be reduced to a system.
reviewed: false
