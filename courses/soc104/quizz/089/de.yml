question: "Wie hängt Karl Poppers Unterscheidung zwischen offenen und geschlossenen Gesellschaften mit der Debatte Individualismus vs. Kollektivismus zusammen?"
answer: "Die offene Gesellschaft erkennt das Recht des Individuums an, durch persönliche Entscheidungen selbst zu urteilen, während die geschlossene Gesellschaft kollektivistisch ist und auf Stammesmentalität sowie der Ablehnung kritischer Freiheit beruht"
wrong_answers:
  - "Die offene Gesellschaft ist eine, die freien Handel über nationale Grenzen hinweg erlaubt, während die geschlossene Gesellschaft Zölle und protektionistische Wirtschaftspolitiken auferlegt"
  - "Die offene Gesellschaft wird durch direkte Demokratie regiert, in der jeder Bürger abstimmt, während die geschlossene Gesellschaft von einem einzigen erblichen Monarchen beherrscht wird"
  - "Die offene Gesellschaft veröffentlicht alle Regierungsdokumente transparent, während die geschlossene Gesellschaft Informationen als Staatsgeheimnisse klassifiziert"
explanation: >-
  Popper definierte die geschlossene Gesellschaft als die magische oder Stammesgesellschaft und die offene Gesellschaft als eine, in der Individuen mit persönlichen Entscheidungen konfrontiert sind. Die geschlossene Gesellschaft ist kollektivistisch, beruht auf Stammesmentalität mit einer Ablehnung kritischer Freiheit und der Idealisierung einer statischen Ordnung. Die offene Gesellschaft gibt der freien Wahl von Werten, Überzeugungen und Beziehungen Vorrang und verkörpert damit direkt individualistische Prinzipien.
