question: Odkiaľ pochádza pojem fyziokracia?
answer: Vo význame "vláda prírody" bol prvýkrát použitý ako názov zborníka Quesnayových článkov
wrong_answers:
  - Vo význame "láska k prírode" to bol názov, ktorý prijala skupina agronómov, z ktorých sa mali skoro stať ekonómovia
  - Názov, ktorým Gréci označovali hospodársku politiku, prevzal Quesnay, aby pomenoval novú ekonomickú vedu
  - Tento pojem vytvoril Voltaire, aby sa vysmial Quesnayovým myšlienkam
explanation: |
  Pojem "fyziokracia" znamená "vláda prírody" a Quesnay ním označil svoju ekonomickú doktrínu, ktorá zdôrazňovala význam poľnohospodárstva a prirodzeného poriadku.
