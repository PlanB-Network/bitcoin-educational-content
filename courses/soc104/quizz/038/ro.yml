question: "De ce sunt considerate problematice definițiile intenționale ale sistemelor politice în scopuri analitice?"
answer: "Ele creează confuzie conceptuală deoarece toate sistemele pretind că urmăresc obiective similare, precum justiția, echitatea și libertatea"
wrong_answers:
  - "Sunt prea precise și rigide, nelăsând loc evoluției naturale a mișcărilor politice în timp"
  - "Se concentrează prea mult pe rezultatele economice și ignoră dimensiunile culturale și sociale ale vieții politice"
  - "Se bazează pe documente guvernamentale clasificate, care sunt rareori disponibile cercetătorilor independenți"
explanation: >-
  Definițiile intenționale se bazează pe motivații și obiective declarate, dar fiecare sistem politic pretinde că urmărește justiția, echitatea și libertatea. Acest lucru face imposibilă distingerea sistemelor unele de altele. Analiza structurală, în schimb, evaluează sistemele după consecințele lor empirice, măsurabile, și după mijloacele pe care le folosesc, dezvăluind adevărata lor natură dincolo de retorică.
reviewed: false
