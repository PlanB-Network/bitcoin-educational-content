question: "Mu mpande zine za Nolan, ni ikihe kibanza kiri hejuru kandi giserukira umwidegemvyo mwinshi ushoboka?"
answer: "Libertarianism, ishigikira umwidegemvyo munini kuruta uwundi mu vy'ubutunzi no mu vy'umuntu ku giti ciwe"
wrong_answers:
  - "Conservatism, ishigikira agaciro k'imigenzo n'umwidegemvyo w'ubutunzi"
  - "Centrism, iringaniza ibibanza vyose vya politike mu buryo ngirakamaro"
  - "Socialism, ishigikira umwidegemvyo w'umuntu ku giti ciwe n'uburinganire bw'ikibano"
explanation: >-
  Libertarianism iri hejuru mu mpande zine za Nolan nk'ikinyuranye na statism. Iserukira abashigikira urugero runini kuruta urundi rw'umwidegemvyo w'ubutunzi n'uw'umuntu ku giti ciwe. Conservatism iri iburyo (umwidegemvyo munini w'ubutunzi, umwidegemvyo mutoyi w'umuntu ku giti ciwe), socialism iri ibubamfu (umwidegemvyo munini w'umuntu ku giti ciwe, umwidegemvyo mutoyi w'ubutunzi), na centrism iri hagati.
reviewed: false
