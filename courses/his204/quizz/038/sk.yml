question: Aká je téza krátkeho románu Chinki, histoire cochininoise, uplatniteľná aj na iné krajiny?
answer: Že cechové predpisy bránia ľuďom pracovať a odrádzajú od úsilia
wrong_answers:
  - Že Kočinčína je príkladom liberálnej vlády
  - Že obchod s obilím musí byť slobodný vo všetkých prístavoch
  - Kočinčína je krajina bohatá na prírodné zdroje
explanation: |
  "Chinki" kritizuje cechové predpisy, ktoré brzdia hospodársku činnosť a odrádzajú od individuálnej iniciatívy.
