question: "Ni paradoksi gani iliyofichika iliyo ndani ya pragmatism ya msimamo wa kati?"
answer: "Pragmatism yenyewe hutegemea aina ya udogma, yaani imani isiyotamkwa kwamba wataalamu pekee ndio wana uwezo wa kuiongoza jamii"
wrong_answers:
  - "Wafuasi wa msimamo wa kati hudai kuwa wa wastani lakini mara kwa mara huungana na vyama vya mrengo wa kushoto katika serikali za muungano"
  - "Sera za msimamo wa kati huonekana zenye usawaziko lakini daima hupendelea ukuaji wa uchumi kuliko ulinzi wa mazingira"
  - "Wafuasi wa msimamo wa kati hukataa itikadi lakini huchukua kanuni ngumu za soko huria wanapofanya maamuzi ya kiuchumi"
explanation: >-
  Paradoksi ya pragmatism ya msimamo wa kati ni kwamba hudai kukataa itikadi kwa kupendelea utaalamu wa kimantiki, lakini dai hili lenyewe hutegemea udogma usioonekana na usiotamkwa: kwamba teknokrati pekee ndio wanaoweza kufanya maamuzi sahihi. Imani hii kwamba wataalamu pekee wanapaswa kuiongoza jamii yenyewe ni kujifunga kwa itikadi, ingawa wafuasi wa msimamo wa kati hawaitambui hivyo.
