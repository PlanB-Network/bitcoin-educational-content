question: "Karl Popper का खुले और बंद समाजों के बीच अंतर व्यक्तिवाद बनाम सामूहिकतावाद की बहस से कैसे जुड़ता है?"
answer: "खुला समाज व्यक्ति के निजी निर्णयों के माध्यम से स्वयं निर्णय करने के अधिकार को मान्यता देता है, जबकि बंद समाज सामूहिकतावादी है, जो जनजातीय मानसिकता और आलोचनात्मक स्वतंत्रता के इंकार पर आधारित है"
wrong_answers:
  - "खुला समाज वह है जो राष्ट्रीय सीमाओं के पार मुक्त व्यापार की अनुमति देता है, जबकि बंद समाज शुल्क और संरक्षणवादी आर्थिक नीतियाँ लागू करता है"
  - "खुला समाज प्रत्यक्ष लोकतंत्र द्वारा शासित होता है जहाँ हर नागरिक मतदान करता है, जबकि बंद समाज एक ही वंशानुगत सम्राट द्वारा शासित होता है"
  - "खुला समाज सभी सरकारी दस्तावेज़ों को पारदर्शी ढंग से प्रकाशित करता है, जबकि बंद समाज सूचना को राज्य रहस्यों के रूप में वर्गीकृत करता है"
explanation: >-
  Popper ने बंद समाज को जादुई या जनजातीय समाज के रूप में और खुले समाज को ऐसे समाज के रूप में परिभाषित किया जिसमें व्यक्ति निजी निर्णयों से सामना करते हैं। बंद समाज सामूहिकतावादी है, जो जनजातीय मानसिकता पर आधारित है, आलोचनात्मक स्वतंत्रता के इंकार और स्थिर व्यवस्था के आदर्शीकरण के साथ। खुला समाज मूल्यों, विश्वासों और संबंधों के स्वतंत्र चुनाव को प्राथमिकता देता है, और सीधे तौर पर व्यक्तिवादी सिद्धांतों को मूर्त रूप देता है।
reviewed: false
