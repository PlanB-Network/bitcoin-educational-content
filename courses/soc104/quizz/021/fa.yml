question: "محافظه‌کاری سیاسی چیست؟"
answer: "ایدئولوژی‌ای که هدفش حفظ نهادهای سیاسی مستقر و نظم اجتماعی است و با دگرگونی ساختاری بزرگ مخالفت می‌کند"
wrong_answers:
  - "تعهدی شخصی به ارزش‌های خانوادگی سنتی و اعمال دینی، بدون تلاش برای تحمیل آن‌ها بر دیگران"
  - "فلسفه‌ای که تغییر اجتماعی سریع را از طریق اصلاحات دموکراتیک و قانون‌گذاری ترقی‌خواهانه ترویج می‌کند"
  - "نظریه‌ای اقتصادی که از بازارهای آزاد، مالیات حداقلی و لغو موانع تجاری دفاع می‌کند"
explanation: >-
  محافظه‌کاری سیاسی ایدئولوژی‌ای است، که اغلب در احزاب راست‌گرا یا راست افراطی نمایندگی می‌شود، و هدفش حفظ نهادهای سیاسی مستقر و نظم اجتماعی در عین مخالفت با دگرگونی ساختاری بزرگ است. طرفداران آن می‌خواهند از قدرت و قانون برای پاسداری از میراث خود استفاده کنند. این با محافظه‌کاری فرهنگی متفاوت است، که انتخابی شخصی در سبک زندگی است نه برنامه‌ای سیاسی.
reviewed: false
