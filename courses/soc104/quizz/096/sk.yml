question: "Ako Bitcoin funguje ako morálny projekt s politickými dôsledkami, a nie ako politický projekt s morálnymi nárokmi?"
answer: "Bitcoin bol navrhnutý tak, aby ľudí urobil slobodnými, nie bohatými, tým, že umožňuje účinné vlastníctvo, chráni hodnotu práce a zachováva súkromie; to sú morálne úspechy, ktoré vytvárajú politické účinky bez nároku na príslušnosť k akémukoľvek politickému táboru"
wrong_answers:
  - "Bitcoin je morálny projekt, pretože jeho kód presadzuje etické pravidlá, ktoré bránia podvodom, a jeho politickým dôsledkom je nahradenie demokratického vládnutia algoritmickým rozhodovaním"
  - "Bitcoin funguje ako morálny projekt, pretože prerozdeľuje bohatstvo od bohatých k skorým osvojiteľom, čím vytvára spravodlivejšiu spoločnosť s politickými dôsledkami pre daňovú politiku"
  - "Bitcoin je morálny, pretože Satoshi Nakamoto vložil do protokolu etické prikázania, a jeho politickým dôsledkom je zjednotenie všetkých politických rodín pod spoločným menovým systémom"
explanation: >-
  Bitcoin nebol navrhnutý na to, aby ľudí urobil bohatými, ale aby ich urobil slobodnými. Dosahuje tri morálne výsledky: umožňuje účinné vlastníctvo (motivuje k zodpovednosti), chráni hodnotu vytvorenú prácou (povzbudzuje produktívne úsilie) a zachováva súkromie (umožňuje ľuďom žiť bez strachu). Ide o morálne úspechy, ktoré nesú politické dôsledky bez príslušnosti k akémukoľvek politickému táboru, vďaka čomu je Bitcoin najprv morálnym a až potom politickým projektom.
