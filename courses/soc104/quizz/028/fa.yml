question: "Ron Paul چگونه موضع پالئو-لیبرتارین را در مسائلی مانند مصرف مواد مخدر و سقط جنین نشان داد؟"
answer: "او شخصاً مصرف مواد مخدر را توصیه نمی‌کرد و با سقط جنین مخالف بود، اما از نظر سیاسی علیه ممنوعیت فدرال مبارزه می‌کرد و استدلال می‌کرد انتخاب‌ها باید به افراد یا ایالت‌ها واگذار شوند"
wrong_answers:
  - "او از قانونی‌سازی فدرال همهٔ مواد مخدر و سقط جنین به‌عنوان مسئله‌ای از حقوق فردی مطلق حمایت می‌کرد"
  - "او بر پایهٔ باورهای اخلاقی شخصی خود برای ممنوعیت‌های سخت‌گیرانهٔ فدرال علیه هر دو، یعنی مواد مخدر و سقط جنین، کارزار می‌کرد"
  - "او از بیان هرگونه نظر شخصی دربارهٔ این مسائل خودداری می‌کرد و استدلال می‌کرد سیاستمداران باید از نظر اخلاقی بی‌طرف بمانند"
explanation: >-
  Ron Paul با جداکردن باورهای اخلاقی شخصی از اجبار سیاسی، ترکیب پالئو-لیبرتارین را نمونه‌وار نشان می‌دهد. او همیشه علیه مصرف مواد مخدر توصیه می‌کرد، اما هم‌زمان با ممنوعیت مواد مخدر مخالف بود. او شخصاً با سقط جنین مخالف بود، با این حال استدلال می‌کرد انتخاب باید به ایالت‌ها واگذار شود نه اینکه از بالا تحمیل گردد. این نشان می‌دهد چگونه می‌توان ارزش‌های سنتی نیرومندی داشت و در عین حال از به‌کارگیری قدرت قهری دولت فدرال برای اجرای آن‌ها خودداری کرد.
reviewed: false
