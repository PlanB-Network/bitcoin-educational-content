question: What did the Marquis d'Argenson compare society to?
answer: To a beehive, where each insect acts according to its own interests, resulting in the common well-being of all
wrong_answers:
  - To a jungle, where only the law of the strongest reigns
  - To a river, which flows naturally without the intervention of laws
  - A complex machine requiring constant maintenance
explanation: |
  D'Argenson compared society to a hive of bees where every insect follows its instinct, producing a great accumulation for the needs of the small society without orders from generals. This is perhaps the closest expression in French economic thought to Adam Smith's famous "invisible hand".