question: În 1776 a fost publicată lucrarea Le commerce et le gouvernement considérés relativement l'un avec l'autre. Ce altă carte a fost publicată în același an?
answer: Avuția națiunilor de Adam Smith
wrong_answers:
  - Tratatul de economie politică al lui Jean-Baptiste Say
  - Reflecții asupra formării și repartizării bogățiilor a lui Turgot
  - Contractul social
explanation: |
  „Avuția națiunilor” a lui Adam Smith a fost publicată în 1776, un an esențial pentru gândirea economică.
