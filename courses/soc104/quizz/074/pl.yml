question: "We wszystkich pięciu debatach gospodarczych (podatki, płaca minimalna, opieka zdrowotna, środowisko, subsydia), jaki spójny wzorzec odróżnia metodę centrową od stanowisk innych rodzin politycznych?"
answer: "Centrowcy odmawiają zobowiązania się do stałej zasady i zamiast tego domagają się analizy empirycznej oraz oceny ekspertów, aby określać politykę indywidualnie dla każdego przypadku, co czyni ich podejście z natury technokratycznym"
wrong_answers:
  - "Centrowcy zawsze przyjmują stanowisko pośrednie między stanowiskiem socjalistycznym a konserwatywnym, dzieląc różnicę po równo w każdej kwestii"
  - "Centrowcy konsekwentnie przedkładają wzrost gospodarczy nad dobrobyt społeczny, zgadzając się z libertarianami w polityce fiskalnej, a z socjalistami w regulacjach"
  - "Centrowcy przekazują wszystkie decyzje gospodarcze organizacjom międzynarodowym i umowom handlowym zamiast prowadzić niezależną politykę krajową"
explanation: >-
  We wszystkich pięciu debatach gospodarczych podejście centrowe podąża za tym samym wzorcem: zamiast zobowiązywać się do stałej zasady ideologicznej, centrowcy wymagają dowodów empirycznych i oceny ekspertów przed podjęciem decyzji. W sprawie podatków właściwy poziom musi zostać określony przez analizę. W sprawie płacy minimalnej poziom musi być dostosowywany pragmatycznie. W sprawie opieki zdrowotnej ideałem jest mieszanka skalibrowana przez ekspertów. W sprawie środowiska polityka musi równoważyć konkurencyjność. W sprawie subsydiów każdy przypadek musi zostać oceniony merytorycznie. Czyni to centryzm z natury technokratycznym, co różni się od prostego dzielenia różnicy lub zdawania się na instytucje międzynarodowe.
reviewed: false
