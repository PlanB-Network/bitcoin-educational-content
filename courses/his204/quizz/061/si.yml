question: ජර්මනියේ Physiocratic අදහස් යෙදීම අවසානයේ නවතා දැමුණේ ඇයි?
answer: පවත්නා සිවිල් සේවකයන් අකමැති වූහ
wrong_answers:
  - ජනගහනය එතරම් සහයෝගී නොවීය
  - ආරම්භයේ Physiocracy අනුගාමිකයෙකු වූ Badenහි Margrave අවසානයේ තම සහාය ඉවත් කර ගත්තේය
  - කාලගුණය කෘෂිකර්මාන්තයට හිතකර නොවීය
explanation: |
  තම වරප්‍රසාද හා පුරුදු වෙත බැඳී සිටි පවතින සිවිල් සේවකයන්ගේ විරුද්ධත්වය ජර්මනියේ Physiocratic අදහස් යෙදීම වැළැක්වීය. යෝජිත ප්‍රතිසංස්කරණ තම බලය හා බලපෑම අභියෝගයට ලක් කරනු ඇතැයි ඔවුහු බිය වූහ.
