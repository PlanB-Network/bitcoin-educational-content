question: "अपने स्पष्ट विरोध के बावजूद वामपंथी और दक्षिणपंथी राजनीतिक दलों में कौन-सी समानता है?"
answer: "दोनों नियमों और करों के माध्यम से लोगों के जीवन पर शासन करने के राज्य के अधिकार का बचाव करते हैं"
wrong_answers:
  - "दोनों आर्थिक मामलों में राज्य के हस्तक्षेप के पूर्ण उन्मूलन की वकालत करते हैं"
  - "दोनों समाज के सामूहिक संगठन की तुलना में व्यक्तिगत स्वतंत्रता को प्राथमिकता देते हैं"
  - "दोनों सरकारी खर्च के साधन के रूप में मौद्रिक नीति के उपयोग को अस्वीकार करते हैं"
explanation: >-
  विरोधी दिखने के बावजूद, वाम और दक्षिण दोनों राज्य हस्तक्षेप को पसंद करते हैं। दोनों मुक्त बाज़ार की आलोचना करते हैं और नियमों तथा करों के माध्यम से लोगों के जीवन पर शासन करने के राज्य के अधिकार का बचाव करते हैं। वामपंथ बाज़ारों को असमानता का स्रोत मानकर उनकी आलोचना करता है, जबकि दक्षिणपंथ उन्हें संप्रभुता के लिए खतरा मानता है, लेकिन दोनों समाधान के लिए राज्य की ओर मुड़ते हैं।
