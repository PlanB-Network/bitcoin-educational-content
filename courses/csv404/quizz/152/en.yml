question: "What verification step should be performed after downloading new TAPD binaries for a binary installation update?"
answer: "Verify the SHA256 checksum of the downloaded archive against the release notes"
wrong_answers:
  - "Run the binary with a --self-test flag to validate its internal integrity checks"
  - "Compare the file size of the new binary against the previous version's binary exactly"
  - "Submit the binary hash to the Lightning Labs verification portal for authentication"
explanation: >-
  The chapter instructs users to verify the SHA256 checksum of the downloaded tarball against the values published in the release notes using `sha256sum`. This ensures the downloaded file has not been tampered with or corrupted during transfer, which is a critical security step when updating node software that manages valuable assets.
reviewed: false
