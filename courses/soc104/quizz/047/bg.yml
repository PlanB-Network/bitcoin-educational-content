question: "Кой често се цитира като основоположник на модерния консерватизъм?"
answer: "Edmund Burke, който защитава запазването на институциите и традициите срещу радикалните промени на Френската революция"
wrong_answers:
  - "Karl Marx, който развива теорията за класовата борба и историческия материализъм през XIX век"
  - "John Locke, който формулира теорията за естествените права и обществения договор през XVII век"
  - "Adam Smith, който пише The Wealth of Nations и основава дисциплината класическа икономика"
explanation: >-
  Edmund Burke често се цитира като основоположник на консерватизма заради противопоставянето си на Френската революция. Неговите Reflections on the Revolution in France (1790) отстояват благоразумието и постепенната реформа пред радикалната промяна. Той вярва, че обществото трябва да напредва не чрез изчистване на всичко до нула, а чрез постепенни реформи, които запазват изпитаните институции и традиции.
reviewed: false
