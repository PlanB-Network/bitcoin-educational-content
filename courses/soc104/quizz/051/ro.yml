question: "Ce afirmă principiul non-agresiunii?"
answer: "O persoană este liberă să acționeze după cum dorește atât timp cât nu se comite violență împotriva vieții, libertății sau proprietății altuia"
wrong_answers:
  - "Statul are dreptul exclusiv de a folosi forța pentru a menține ordinea socială"
  - "Cetățenii trebuie să se supună domniei majorității chiar și atunci când aceasta restrânge libertățile individuale"
  - "Libertatea de acțiune este permisă numai atunci când aduce beneficii binelui colectiv al societății"
explanation: >-
  Principiul non-agresiunii este o piatră de temelie a politicii libertariene, afirmând că indivizii pot acționa liber cu condiția să nu comită violență împotriva vieții, libertății sau proprietății altora. El amintește de regula de aur întâlnită în civilizații diferite. Spre deosebire de celelalte opțiuni, nu acordă statului o autoritate morală specială și nu subordonează drepturile individuale beneficiului colectiv.
