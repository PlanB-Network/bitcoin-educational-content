question: "보수주의 정치철학에서는 무엇이 자유보다 우선하나요?"
answer: "질서와 전통이며, 자유가 가치 있게 여겨지기 전에 그것들이 확고히 확립되어야 합니다"
wrong_answers:
  - "사회정의와 평등이며, 개인이 진정으로 자유로워지기 전에 그것들이 보장되어야 합니다"
  - "경제적 효율성과 실용적 결과이며, 그것들이 언제 자유가 적절한지를 결정합니다"
  - "개인의 재산권이며, 다른 어떤 자유가 허용되기 전에 그것이 보호되어야 합니다"
explanation: >-
  보수주의자에게는 질서와 전통이 자유보다 우선합니다. 그들은 지나친 자유가 혼란과 사회적 무질서를 낳는다고 주장하므로, 질서가 확고히 확립된 뒤에야 자유가 가치 있게 여겨질 수 있습니다. 이는 정의를 우선시하는 사회주의적 관점이나 효율성에 초점을 맞추는 중도주의와 대비됩니다.
