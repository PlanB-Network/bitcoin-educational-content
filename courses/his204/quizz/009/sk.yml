question: Ako Tocqueville hodnotil Vaubanove poznámky o stave Francúzska na začiatku 18. storočia?
answer: Jeho poznámky boli zdesujúce, ale opodstatnené
wrong_answers:
  - Sú to prehnané tvrdenia
  - Bol to outsider
  - Boli úplne nemiestne
explanation: |
  Alexis de Tocqueville vo svojej knihe "L'Ancien Régime et la Révolution" zdôraznil výstižnosť Vaubanových pozorovaní o biede ľudu a o spoločenských nerovnostiach vo Francúzsku na začiatku 18. storočia. Domnieval sa, že Vauban vykreslil realistický a alarmujúci obraz situácie.
