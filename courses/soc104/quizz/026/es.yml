question: "¿Cómo difieren los roles del Cato Institute, el Mises Institute y el Libertarian Party dentro del movimiento libertario?"
answer: "El Cato Institute se centra en propuestas de política pública, el Mises Institute en la educación y la publicación académica, y el Libertarian Party en la política electoral"
wrong_answers:
  - "El Cato Institute financia campañas políticas, el Mises Institute hace lobby directamente ante el Congreso, y el Libertarian Party organiza conferencias académicas"
  - "El Cato Institute publica manuales de economía, el Mises Institute organiza campañas de registro de votantes, y el Libertarian Party redacta proyectos de ley"
  - "El Cato Institute organiza protestas de base, el Mises Institute proporciona defensa legal a libertarios, y el Libertarian Party gestiona investigaciones de think tanks"
explanation: >-
  El Cato Institute (fundado en 1977) es un think tank con sede en Washington que trabaja en propuestas de política pública. El Mises Institute (fundado en 1982) se centra en la educación más que en el lobby político, funcionando como una especie de universidad en línea con conferencias y obras reeditadas. El Libertarian Party (fundado en 1971) es el tercer partido político estadounidense más grande, y participa en elecciones donde incluso su cuota de voto de alrededor del 2% puede inclinar resultados.
