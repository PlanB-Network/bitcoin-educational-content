question: "Quais são os valores cardinais do centrismo?"
answer: "Moderação, compromisso, adaptação e utilidade pública"
wrong_answers:
  - "Tradição, ordem, autoridade e identidade nacional"
  - "Liberdade, propriedade privada, consentimento e responsabilidade individual"
  - "Igualdade, justiça social, solidariedade e propriedade coletiva"
explanation: >-
  Os valores cardinais do centrismo são moderação, compromisso, adaptação e utilidade pública. Eles refletem a ênfase centrista no equilíbrio pragmático, em vez de compromisso ideológico. As outras opções descrevem os valores cardinais do conservadorismo, do libertarianismo e do socialismo, respectivamente.
