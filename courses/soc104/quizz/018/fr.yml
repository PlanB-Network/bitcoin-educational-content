question: "Quelle est la définition de l'étatisme telle qu'elle est présentée dans le cadre de Nolan ?"
answer: "Utiliser la législation pour contrôler et façonner la société, que ce soit au nom de la défense de la civilisation, de la classe ouvrière, de la nature ou des opprimés"
wrong_answers:
  - "Un système de gouvernement dans lequel les élus servent des mandats fixes et où les transitions de pouvoir se font par des élections démocratiques"
  - "La croyance selon laquelle seule une armée forte peut protéger la souveraineté et l'intégrité territoriale d'une nation"
  - "Une philosophie économique qui privilégie les industries nationales face à la concurrence étrangère au moyen de droits de douane et de quotas"
explanation: >-
  L'étatisme est défini comme l'utilisation de la législation pour contrôler et façonner la société. La gauche comme la droite le pratiquent : certains au nom de la défense de la civilisation, d'autres au nom de la défense de la classe ouvrière, de la nature ou des opprimés. Même les centristes l'approuvent quand cela les arrange. L'étatisme ne se limite pas à la politique militaire, au protectionnisme commercial ou au simple fait d'avoir des gouvernements élus.
reviewed: false
