question: "Hoe illustreert George W. Bush' reactie op de financiële crisis van 2008 de 'problematische flexibiliteit' van conservatieve principes?"
answer: "Hij liet vrijemarktprincipes los om grote banken te redden, waarmee hij de conservatieve visie op de staat als ultieme garant van nationale economische stabiliteit blootlegde"
wrong_answers:
  - "Hij weigerde elke overheidsinterventie en liet de banken failliet gaan, waarbij hij zich strikt aan de vrijemarktideologie hield ongeacht de gevolgen"
  - "Hij nationaliseerde de bankensector permanent en voerde progressieve belastingheffing in, waarmee hij verschoof van conservatisme naar democratisch socialisme"
  - "Hij reageerde door alle overheidsuitgaven te verlagen en financiële reguleringen af te schaffen om de markt zichzelf te laten corrigeren"
explanation: >-
  Bush verklaarde dat hij 'vrijemarktprincipes had losgelaten om het vrijemarktsysteem te redden' door in te grijpen om de grote banken te redden. Dit illustreert hoe conservatieven de macht en continuïteit van de natie boven abstracte marktprincipes kunnen stellen. Dezelfde flexibele logica verschijnt in Trumps protectionistische handelsbeleid, gevoerd in naam van het nationale belang met het risico corporatisme en crony capitalism aan te wakkeren.
reviewed: false
