question: "Hva er Hayeks grunnleggende argument om hvorfor sentral planlegging mislykkes?"
answer: "Kunnskap finnes bare som spredte fragmenter eid av ulike individer og kan ikke konsentreres eller integreres av en sentral myndighet"
wrong_answers:
  - "Sentrale planleggere er moralsk korrupte og handler alltid i egeninteresse heller enn til det offentliges beste"
  - "Demokratiske institusjoner er for trege til å reagere på økonomiske endringer, noe som gjør sentraliserte beslutninger alltid utdaterte"
  - "Sentral planlegging mislykkes fordi borgere bevisst motsetter seg statlige påbud og nekter å følge reguleringer"
explanation: >-
  Hayeks grunnleggende argument hviler på informasjonens natur. Han viste at kunnskap aldri finnes i konsentrert eller integrert form, men bare som spredte fragmenter eid av alle ulike individer. Verdi er subjektiv og kjennes bare lokalt og ufullstendig. Den sentrale planleggeren, sittende på et kontor, har ingen kunnskap om tingenes virkelige pris fordi han ikke er engasjert i samhandling og utveksling.
reviewed: false
