question: "What is the core message of Eric Hughes's 1993 Cypherpunk Manifesto regarding privacy?"
answer: "Privacy is essential to an open society in the electronic age, and individuals must build it themselves rather than expecting governments or corporations to guarantee it"
wrong_answers:
  - "Privacy is a luxury that must be sacrificed in exchange for national security and the protection of democratic institutions"
  - "Privacy should be regulated by international treaties that establish uniform standards for data protection across all countries"
  - "Privacy is only important for criminals and dissidents, while law-abiding citizens benefit from transparent surveillance systems"
explanation: >-
  Eric Hughes's 1993 manifesto states that privacy is essential to an open society in the electronic age and that we cannot expect governments, corporations, or other large organizations to guarantee it. The fundamental motivation is that confidentiality is a key element of freedom and must be built by individuals themselves, not awaited as a gift from institutions.
reviewed: false
