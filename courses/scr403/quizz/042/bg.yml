question: Изход на Simplicity използва фиксираната BIP-0341 NUMS точка като свой вътрешен ключ. Защо key-spend е доказуемо невъзможен и какво добавя рандомизирането на NUMS точката?
answer: Никой не знае дискретния логаритъм на NUMS точката, така че не може да съществува key-path подпис; рандомизирането само добавя поверителност.
wrong_answers:
  - NUMS точката лежи извън кривата, така че key-path подписите се провалят; рандомизирането я връща обратно върху кривата.
  - Частният ключ на NUMS точката е нула, което консенсусът отхвърля; рандомизирането пази настройката от странични канали.
  - Настройването на NUMS точка дава ключ извън допустимия диапазон, правейки key-spend нестандартен; рандомизирането избягва повторна употреба на адрес.
explanation: >-
  NUMS („Nothing-Up-My-Sleeve“) точка е напълно валидна точка от кривата,
  конструирана така, че никой да не знае съответен частен ключ — нейният
  дискретен логаритъм е неизвестен. Тъй като key-path харчене изисква Schnorr
  подпис под вътрешния ключ, а такъв подпис не може да бъде произведен без частния
  ключ, key-spend пътят е доказуемо неизползваем и средствата могат да се движат
  само чрез ангажирания скриптов път. Рандомизирането на NUMS точката не променя
  нищо от това; то само скрива факта, че key-spend е деактивиран, така че изходът
  изглежда като всеки друг Taproot изход — полза за поверителността.
reviewed: false
