question: "Wat betekent de term 'liberaal' in de Europese politieke traditie?"
answer: "Een voorstander van laissez-faire-economie, verminderde staatsinterventie en individuele vrijheden"
wrong_answers:
  - "Een voorstander van staatsinterventie, publieke ziektekostenverzekering en armoedebestrijdingsprogramma's"
  - "Een radicale anarchist die de volledige afschaffing van overheid en privé-eigendom nastreeft"
  - "Een centrist die socialistische en conservatieve standpunten in alle beleidsterreinen gelijkmatig in balans brengt"
explanation: >-
  In Europa is liberalisme verbonden gebleven met laissez-faire economisch beleid, verminderde staatsinterventie en de verdediging van individuele vrijheden. Het eerste foute antwoord beschrijft Amerikaanse liberals, die de betekenis van de term richting interventionisme hebben verschoven. Europees liberalisme is noch anarchisme noch centrisme.
reviewed: false
