question: "Cato Institute、Mises Institute 與 Libertarian Party 在自由意志主義運動中的角色有何不同？"
answer: "Cato Institute 專注於公共政策提案，Mises Institute 專注於教育與學術出版，Libertarian Party 專注於選舉政治"
wrong_answers:
  - "Cato Institute 資助政治競選，Mises Institute 直接遊說國會，Libertarian Party 組織學術會議"
  - "Cato Institute 出版經濟學教科書，Mises Institute 推動選民登記活動，Libertarian Party 起草法案"
  - "Cato Institute 組織草根抗議，Mises Institute 為自由意志主義者提供法律辯護，Libertarian Party 管理智庫研究"
explanation: >-
  Cato Institute（成立於 1977 年）是一家位於華盛頓的智庫，致力於公共政策提案。Mises Institute（成立於 1982 年）專注於教育而非政治遊說，作為一種線上大學運作，舉辦會議並重新出版著作。Libertarian Party（成立於 1971 年）是美國第三大政黨，參與選舉，即使其約 2% 的得票率也可能左右選舉結果。
reviewed: false
