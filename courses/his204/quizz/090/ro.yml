question: De ce spunem că în schimb dăm întotdeauna mai puțin pentru a primi mai mult?
answer: Pentru că renunțăm întotdeauna la ceva ce prețuim mai puțin pentru ceva ce prețuim mai mult
wrong_answers:
  - Pentru că este un joc de fraieri, în care ne vindem produsele la un preț mai mare decât valorează
  - Pentru că banii au valoare, orice vânzare este o îmbogățire
  - Pentru că vânzătorii sunt întotdeauna mai deștepți decât cumpărătorii
explanation: |
  Dăm ceea ce prețuim mai puțin pentru a obține ceea ce prețuim mai mult, făcând schimbul reciproc avantajos.
