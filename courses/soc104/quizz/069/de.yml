question: "Warum ist die libertäre Position zur Legalisierung von Drogen an die Bedingung geknüpft, dass die Rolle des Staates in der Gesellschaft reduziert werden muss?"
answer: "Weil eine vom Staat übernommene Liberalisierung individuelle Verantwortung durch staatlich verwaltete Fürsorge ersetzen würde, während Libertäre wollen, dass Bürger die Folgen ihrer Entscheidungen tragen, mit Unterstützung durch private Vereinigungen"
wrong_answers:
  - "Weil staatlich kontrollierte Legalisierung zu hohe Steuereinnahmen erzeugen würde, wodurch die Regierung übermäßig mächtig und korrupt würde"
  - "Weil der Staat Qualitätsstandards auferlegen würde, die die Preise erhöhen und Schwarzmärkte neu entstehen lassen würden"
  - "Weil staatliche Regulierung von Drogen internationale Handelsabkommen und diplomatische Beziehungen verletzen würde"
explanation: >-
  Libertäre unterstützen die Liberalisierung von Drogen, bestehen aber darauf, dass die Rolle des Staates reduziert werden muss, weil ihr Ziel die Wiederherstellung individueller Verantwortung ist, nicht die Ausweitung staatlicher Verwaltung. Wenn jemand abhängig wird, muss er Verantwortung übernehmen, statt den Staat um Fürsorge zu bitten. Die Lösung für Sucht liegt in privater Initiative: freiwilliger Unterstützung durch Individuen, Familien und wohltätige Vereinigungen. Staatlich verwaltete Legalisierung würde dem grundlegenden libertären Prinzip persönlicher Verantwortung widersprechen.
reviewed: false
