question: "چرا bip0340-verify به جای برگرداندن یک boolean (true/false)، از اثر Failure استفاده می‌کند؟"
answer: برای امکان‌پذیر کردن تأیید دسته‌ای امضاهای Schnorr، که در آن یک بررسی ناموفق کل دسته را ناموفق می‌کند.
wrong_answers:
  - چون نوع‌های boolean از نظر فضای بلاک در مقایسه با نوع unit بیش از حد پرهزینه‌اند.
  - چون سیستم نوع Simplicity نمی‌تواند مقادیر بازگشتی boolean را که از jets می‌آیند نمایش دهد.
  - چون برگرداندن یک مقدار boolean ساده مستقیماً قضیه کامل بودن را نقض می‌کند.
explanation: >-
  اگر bip0340-verify یک boolean برمی‌گرداند، یک بررسی امضای ناموفق همچنان می‌توانست به شاخه‌ای منتهی شود که
  در آن اسکریپت موفق می‌شود. در آن حالت، اعتبارسنج باید بداند دقیقاً کدام امضا
  ناموفق شده است، و این مانع تأیید دسته‌ای می‌شود. با استفاده از اثر Failure، یک بررسی ناموفق همیشه
  کل محاسبه را متوقف می‌کند، و تأیید دسته‌ای کارآمد را ممکن می‌سازد؛ جایی که امضاهای زیادی با هم تجمیع می‌شوند.
reviewed: true
