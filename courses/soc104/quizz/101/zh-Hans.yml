question: "本课程认为，超越传统左—右—中间光谱的真正政治分野是什么？"
answer: "根本哲学原则之间的分野：自由或强制、自愿同意或强迫、负责任的个人或集体"
wrong_answers:
  - "富国与穷国围绕国际贸易协议和全球金融机构控制权的分野"
  - "城市与农村人口围绕政府支出优先事项和基础设施投资的分野"
  - "进步文化与传统文化围绕社会规范、家庭价值和宗教教育的分野"
explanation: >-
  本课程认为，真正的政治分野不在传统的左、右、中间标签中，而在根本哲学原则中：自由或强制、自愿同意或强迫、负责任的个人或集体。思考政治的正确方式，是从伦理原则而不是标签出发。
reviewed: false
