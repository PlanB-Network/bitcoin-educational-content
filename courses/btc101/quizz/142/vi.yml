question: Pruned node (máy chủ thu gọn) trong bối cảnh của Bitcoin là gì?
answer: Một pruned node (máy chủ thu gọn) chỉ giữ lại N khối cuối cùng trong bộ nhớ.
wrong_answers:
  - Một pruned node (máy chủ thu gọn) chỉ xác nhận các giao dịch.
  - Một pruned node (máy chủ thu gọn) chỉ truyền thông tin cho các pruned node (máy chủ thu gọn) khác.
  - Một pruned node (máy chủ thu gọn) chỉ thực thi các quy tắc của giao thức Bitcoin.
explanation: >-
  Một pruned node (máy chủ thu gọn) trong bối cảnh của Bitcoin là một pruned node (máy chủ thu gọn) chỉ giữ lại
  N khối cuối cùng trong bộ nhớ.
