question: "Miten Green New Deal edustaa demokraattisen sosialismin nykyistä kehitystä?"
answer: "Se käyttää ympäristöhuolia uutena perusteluna valtion väliintulolle ja yksityisten tulojen konfiskoinnille, alistaen yksilön edun kollektiiviselle planetaariselle terveydelle"
wrong_answers:
  - "Se hylkää perinteisen sosialistisen taloustieteen kokonaan ja suosii vapaiden markkinoiden ratkaisuja ympäristöongelmiin hiilikaupan kautta"
  - "Se torjuu valtion väliintulon ja tukeutuu sen sijaan vapaaehtoiseen yksilölliseen toimintaan ja yksityisen sektorin innovaatioihin ilmastonmuutoksen ratkaisemiseksi"
  - "Se merkitsee irtiottoa sosialismista asettamalla ympäristönsuojelun kaikkien sosiaalisen oikeudenmukaisuuden ja työllisyyden huolten edelle"
explanation: >-
  Green New Deal yhdistää ympäristöhuolet sosiaalisiin tavoitteisiin, yhdistäen ekologisen siirtymän sosiaaliseen oikeudenmukaisuuteen, työllisyystakuihin ja vahvistettuihin julkisiin palveluihin. Yksilön etu alistetaan kollektiiviselle edulle, joka määritellään planetaarisen terveyden kautta. Ytimeltään se tarjoaa uuden retorisen kuoren, joka oikeuttaa valtion väliintulon ja yksityisten tulojen konfiskoinnin, ei enää yksinomaan sosiaalisen oikeudenmukaisuuden vaan myös ympäristön nimissä.
