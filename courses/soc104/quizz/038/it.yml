question: "Perché Rothbard criticò la visione libertaire della natura umana, e quale alternativa propose?"
answer: "Li accusò di avere una visione ingenua del 'buon selvaggio' e sostenne che la società deve usare la proprietà privata e buoni incentivi per guidare il comportamento orientato all'interesse personale"
wrong_answers:
  - "Lodò la loro comprensione della cooperazione umana, ma sostenne che uno Stato minimo fosse ancora necessario per far rispettare i contratti"
  - "Concordò sul fatto che gli esseri umani siano naturalmente buoni, ma insistette che solo i mercati liberi potessero incanalare quella bontà in attività produttive"
  - "Respinse la loro enfasi sui diritti individuali e sostenne invece che le comunità dovrebbero definire collettivamente gli standard morali"
explanation: >-
  Rothbard criticò i libertaires per aver adottato una visione ingenua, simile a quella di Rousseau, della natura umana come naturalmente buona. Sostenne invece che le persone sono guidate dall'interesse personale e che la società deve essere organizzata in modo che buoni incentivi guidino il comportamento. Ciò richiede di riconoscere e garantire la proprietà privata. Abolire lo Stato non significa abolirne le funzioni; polizia e giustizia dovrebbero essere gestite dal libero mercato attraverso la concorrenza.
