question: "Karl Popper 對開放社會與封閉社會的區分，如何關聯到個人主義與集體主義的辯論？"
answer: "開放社會承認個人透過個人決定為自己判斷的權利，而封閉社會是集體主義的，建立在部落心態與拒絕批判自由之上"
wrong_answers:
  - "開放社會是允許跨國自由貿易的社會，而封閉社會則施加關稅與保護主義經濟政策"
  - "開放社會由每位公民投票的直接民主治理，而封閉社會則由單一世襲君主統治"
  - "開放社會透明公開所有政府文件，而封閉社會則把資訊列為國家機密"
explanation: >-
  Popper 把封閉社會定義為巫術或部落社會，而開放社會則是個人面對個人決定的社會。封閉社會是集體主義的，建立在部落心態上，拒絕批判自由並理想化靜態秩序。開放社會賦予價值、信念與關係的自由選擇以優先性，直接體現個人主義原則。
reviewed: false
