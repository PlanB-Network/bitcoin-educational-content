question: "Mengapa sumbu vertikal (atas-bawah) dianggap lebih fundamental daripada sumbu horizontal (kiri-kanan) dalam diagram Nolan?"
answer: "Karena sumbu itu mengungkap pembagian sejati antara mereka yang membela kebebasan individu maksimum dan mereka yang mendukung kontrol negara maksimum"
wrong_answers:
  - "Karena sumbu itu mengukur output ekonomi lebih akurat daripada sumbu horizontal mengukur kebijakan sosial"
  - "Karena sebagian besar konflik politik sepanjang sejarah berkaitan dengan identitas budaya daripada tata kelola"
  - "Karena sumbu horizontal hanya berlaku untuk demokrasi modern sementara sumbu vertikal bersifat universal"
explanation: >-
  Sumbu fundamental adalah sumbu vertikal karena ia menangkap pertanyaan politik yang esensial: sejauh mana negara seharusnya mengontrol tindakan manusia? Sumbu kiri-kanan hanya mencerminkan sensibilitas yang berbeda (keadilan sosial vs. tradisi), tetapi kedua pihak dapat menempati posisi yang sama pada sumbu vertikal sebagai penganut statisme. Sumbu vertikal mengungkap apakah seseorang ingin memaksakan visinya dengan kekuatan atau menghormati kebebasan individu.
