question: "What is the strongest weapon central states use against secession?"
answer: "Ideological: state education and propaganda teaching that the large country is great and indivisible."
wrong_answers:
  - "Trade embargoes against seceding regions."
  - "The physical destruction of regional capitals."
  - "International courts that dissolve secession movements."
explanation: |
  Legal bans and even violent suppression (Catalonia) exist, but the deepest resistance is taught: the longer a state has been unitary — France being the extreme case — the fewer of its citizens can even imagine secession.
reviewed: false
