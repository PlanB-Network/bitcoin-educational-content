question: "Green New Deal लोकतांत्रिक समाजवाद के समकालीन विकास का प्रतिनिधित्व कैसे करता है?"
answer: "यह राज्य हस्तक्षेप और निजी आय की जब्ती के नए औचित्य के रूप में पर्यावरणीय चिंताओं का उपयोग करता है, व्यक्तिगत हित को सामूहिक ग्रह-स्वास्थ्य के अधीन रखता है"
wrong_answers:
  - "यह कार्बन ट्रेडिंग के माध्यम से पर्यावरणीय समस्याओं के मुक्त-बाज़ार समाधानों के पक्ष में पारंपरिक समाजवादी अर्थशास्त्र को पूरी तरह छोड़ देता है"
  - "यह राज्य हस्तक्षेप को अस्वीकार करता है और जलवायु परिवर्तन से निपटने के लिए स्वैच्छिक व्यक्तिगत कार्रवाई तथा निजी-क्षेत्र नवाचार पर निर्भर करता है"
  - "यह सभी सामाजिक न्याय और रोज़गार संबंधी चिंताओं से ऊपर पर्यावरण संरक्षण को प्राथमिकता देकर समाजवाद से विच्छेद का प्रतिनिधित्व करता है"
explanation: >-
  Green New Deal पर्यावरणीय चिंताओं को सामाजिक उद्देश्यों से जोड़ता है, पारिस्थितिक संक्रमण को सामाजिक न्याय, रोज़गार गारंटी और सुदृढ़ सार्वजनिक सेवाओं के साथ मिलाता है। व्यक्तिगत हित को ग्रह-स्वास्थ्य द्वारा परिभाषित सामूहिक हित के अधीन कर दिया जाता है। अपने मूल में, यह राज्य हस्तक्षेप और निजी आय की जब्ती को उचित ठहराने वाला एक नया भाषणात्मक आवरण प्रदान करता है, अब केवल सामाजिक न्याय के नाम पर नहीं बल्कि पर्यावरण के नाम पर भी।
reviewed: false
