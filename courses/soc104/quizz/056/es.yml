question: "¿Hacia qué forma de gobernanza tiende el centrismo?"
answer: "La tecnocracia, donde el poder se confía a expertos que dirigen la economía y la política monetaria"
wrong_answers:
  - "La democracia directa, donde los ciudadanos votan sobre cada decisión política importante"
  - "La aristocracia, donde el poder lo detenta una clase dirigente tradicional"
  - "La gobernanza laissez-faire, donde el mercado se regula a sí mismo sin intervención estatal"
explanation: >-
  El centrismo privilegia la eficiencia, el pragmatismo y tiende hacia la tecnocracia, lo que significa que el poder debe confiarse a expertos que dirigen la economía y pilotan la política monetaria. Esto es fundamentalmente distinto de la democracia directa, la aristocracia o el laissez-faire, cada uno de los cuales distribuye el poder según principios completamente diferentes.
