bio: |
  Echipa Relai. Relai este o platformă elvețiană de schimb Bitcoin fondată de Julian Liniger și Adem Bilican. Relai face economisirea și investiția în Bitcoin accesibile tuturor. Aplicația bitcoin-only este concepută pentru a fi simplă și intuitivă, permițând oricui din Europa să cumpere și să vândă Bitcoin în câteva minute, fără înregistrare, verificare sau depozit. Auditată independent și cu peste 50 de milioane CHF de Bitcoin investiți prin platforma sa, Relai oferă consumatorilor șansa de a debloca noi moduri de a economisi și investi.

short_bio: Echipa Relai. Relai este o platformă elvețiană de schimb Bitcoin.
