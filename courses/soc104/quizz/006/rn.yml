question: "Ni iyihe mirongo ibiri iri ku gishushanyo ca Nolan?"
answer: "Umurongo uhagaze upima umwidegemvyo w'umuntu ku giti ciwe n'umurongo utambitse upima umwidegemvyo w'ubutunzi"
wrong_answers:
  - "Umurongo utambitse uva ibubamfu uja iburyo n'umurongo uhagaze uva ku butegetsi bukaze uja kuri demokarasi"
  - "Umurongo uhagaze upima ubutunzi n'umurongo utambitse upima urugero rw'indero"
  - "Umurongo utambitse uva kuri sosiyalisiti uja kuri capitalism n'umurongo uhagaze uva ku migenzo uja ku terambere"
explanation: >-
  David Nolan yateguye igishushanyo ciwe afise imirongo ibiri itomoye: umwidegemvyo w'umuntu ku giti ciwe (umurongo uhagaze) n'umwidegemvyo w'ubutunzi (umurongo utambitse). Ubu buryo bw'ibipimo bibiri busubirira umurongo woroshe cane w'ibubamfu-iburyo kandi bwerekana neza uruvange rw'ivyiyumviro vya politike mu gutandukanya imigwi ibiri nyamukuru y'umwidegemvyo.
reviewed: false
