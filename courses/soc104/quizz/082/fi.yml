question: "Mikä on keskeinen erimielisyys libertaarien ja muiden poliittisten perheiden välillä, kun he jakavat samat tavoitteet?"
answer: "Erimielisyys koskee keinoja: libertaarit torjuvat pakottavat ratkaisut ja suosivat vapaaehtoista vaihtoa markkinaprosessin kautta"
wrong_answers:
  - "Erimielisyys koskee päämääriä: libertaarit tavoittelevat eri tavoitteita, kuten yksilöllistä varallisuutta sosiaalisen hyvinvoinnin sijaan"
  - "Erimielisyys koskee ajoitusta: libertaarit haluavat saavuttaa samat tavoitteet hitaammin asteittaisen uudistuksen kautta"
  - "Erimielisyys koskee soveltamisalaa: libertaarit haluavat soveltaa samoja politiikkoja vain paikallisella eivätkä kansallisella tasolla"
explanation: >-
  Libertaarit voivat olla sosialistien, konservatiivien ja sentristien kanssa samaa mieltä tietyistä tavoitteista, kuten sorrettujen puolustamisesta tai sosiaalisen yhteenkuuluvuuden edistämisestä. Erimielisyys ei ole päämäärissä vaan keinoissa. Libertaarit torjuvat kaikki pakottavat ratkaisut, jotka pyrkivät yhdenmukaistamaan käytäntöjä ja sääntelyä, ja puolustavat sen sijaan valinnan voimaa ja vastuullista vapautta vapaaehtoisiin sopimuksiin perustuvan vapaan, hajautetun vaihdon kautta.
