question: "In che modo le tre funzioni essenziali del libero mercato, come descritte dai libertari, costituiscono insieme un sistema di organizzazione sociale sia efficiente sia etico?"
answer: "I prezzi forniscono una bussola per le decisioni, il mercato rivela preferenze autentiche attraverso domanda e offerta, e il libero scambio permette agli individui di determinare i propri affari secondo valori personali, combinando efficienza informativa e autonomia morale"
wrong_answers:
  - "Il mercato massimizza la ricchezza totale, previene i monopoli attraverso la concorrenza naturale e assicura una distribuzione equa delle risorse, combinando produttività e giustizia sociale"
  - "I liberi mercati riducono la spesa pubblica, stimolano l'innovazione tecnologica e creano opportunità di lavoro, combinando responsabilità fiscale e crescita economica"
  - "I mercati abbassano i prezzi al consumo, aumentano la qualità dei prodotti attraverso la concorrenza e ampliano il commercio internazionale, combinando prosperità interna e cooperazione globale"
explanation: >-
  La difesa libertaria del libero mercato poggia su tre funzioni interconnesse. Primo, i prezzi servono da indicatori affidabili che guidano decisioni economiche e sociali (la bussola). Secondo, il mercato rivela preferenze individuali autentiche attraverso domanda e offerta. Terzo, il libero scambio permette agli attori di determinare i propri affari secondo valori personali. Hayek mostrò che i liberi mercati coordinano l'informazione dispersa meglio della pianificazione centrale (efficienza), mentre il consenso reciproco rispetta la dignità umana più della coercizione (giustizia).
reviewed: false
