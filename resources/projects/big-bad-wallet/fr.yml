description: |
  Big Bad Wallet est un centre d’apprentissage Bitcoin, avec un portefeuille en auto-garde en préparation, par Sour Labs, en anglais et en français. Le centre d’apprentissage est en ligne : 32 guides en langage clair sur les sats, les phrases de récupération, les frais, Lightning et l’auto-garde, un glossaire qui explique chaque terme en une phrase, un quiz anti-arnaques, un convertisseur de sats, et un cours gratuit par e-mail en huit semaines qui mène un débutant complet de « qu’est-ce que le Bitcoin » à « je le garde moi-même ».

  Le portefeuille s’adresse à celles et ceux qui laissent leurs bitcoins sur une plateforme d’échange parce que l’auto-garde paraît compliquée. Il est non dépositaire : la phrase de récupération ne quitte jamais l’appareil, pas de compte, pas de KYC, et le moteur du portefeuille est open source. Bitcoin uniquement, pas d’altcoins. Il est sur liste d’attente le temps de sa construction.
