question: "法国的 libertaires（社会主义无政府主义者）如何看待私有财产？"
answer: "私有财产和资本主义必须被废除，因为它们是压迫的来源"
wrong_answers:
  - "私有财产是一项先于国家存在的自然权利，必须不惜一切代价保护"
  - "私有财产应由国家监管，但绝不应从社会中完全消除"
  - "只有在公社所有成员之间平均分配时，私有财产才可以接受"
explanation: >-
  法国的 libertaires 继承了 Proudhon 和 Bakunin 等思想家的社会主义无政府主义传统，认为国家和私有财产都必须作为双重压迫来源被废除。这体现在 Proudhon 的著名公式“财产就是盗窃。”中。第一个错误答案描述的是自由意志主义立场，它从根本上反对 libertaire 观点。
reviewed: false
