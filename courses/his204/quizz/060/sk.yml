question: Prečo fyziokrati, obhájci hospodárskej slobody, zostali veľkými skeptikmi demokracie?
answer: Demokracia je potenciálne zotročením menšiny väčšinou
wrong_answers:
  - Monarchia je menej nákladná než demokracia
  - Fyziokrati mali vo svojich radoch niekoľko vysoko postavených členov kráľovského dvora
  - Mysleli si, že ľudia sú príliš nevzdelaní, aby robili informované rozhodnutia
explanation: |
  Fyziokrati sa obávali, že demokracia povedie k tyranii väčšiny, kde by záujmy menšiny boli obetované v prospech väčšiny. Dávali prednosť osvietenej vláde, schopnej robiť racionálne rozhodnutia a obhajovať práva všetkých.
