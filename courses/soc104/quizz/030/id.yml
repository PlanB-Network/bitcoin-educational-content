question: "Mengapa para liberal klasik di Amerika Serikat mulai menyebut diri mereka 'libertarian' sejak 1960-an dan seterusnya?"
answer: "Untuk membedakan diri mereka dari liberal Amerika, yang maknanya telah bergeser ke arah intervensionisme negara"
wrong_answers:
  - "Untuk menyelaraskan diri mereka dengan Democratic Party dan program sosial progresifnya"
  - "Untuk menandakan dukungan mereka terhadap reformasi Great Society Lyndon B. Johnson"
  - "Untuk mengadopsi identitas revolusioner yang lebih radikal yang terinspirasi oleh gerakan sosialis Eropa"
explanation: >-
  Di Amerika Serikat, kata 'liberal' bergeser menjadi berarti pendukung Big Government dan intervensi negara, khususnya setelah New Deal dan Great Society. Para liberal klasik mengadopsi label 'libertarian' untuk mempertahankan makna asli filsafat mereka. Mereka menjauhkan diri dari liberal Amerika, bukan menyelaraskan diri dengan mereka.
reviewed: false
