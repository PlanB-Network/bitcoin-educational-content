question: "Mis on peamine erinevus minarhistide ja anarhokapitalistide vahel libertarismis?"
answer: "Minarhistid aktsepteerivad minimaalset riiki kaitse, õigusemõistmise ja politsei jaoks, samas kui anarhokapitalistid tahavad erastada kõik riigi funktsioonid"
wrong_answers:
  - "Minarhistid lükkavad tagasi kõik valitsemisvormid, samas kui anarhokapitalistid aktsepteerivad turgude piiratud riiklikku reguleerimist"
  - "Minarhistid pooldavad progressiivset maksustamist hädavajalike teenuste rahastamiseks, samas kui anarhokapitalistid on vastu igasugusele maksustamisele"
  - "Minarhistid keskenduvad ainult majanduslikule vabadusele, samas kui anarhokapitalistid kaitsevad nii majanduslikke kui ka ühiskondlikke vabadusi"
explanation: >-
  Minarhistid usuvad, et riik peaks piirduma põhifunktsioonidega nagu kaitse, õigusemõistmine ja politsei („öövahiriik”), samas kui anarhokapitalistid väidavad, et isegi need funktsioonid tuleks erastada ja korraldada vabatahtliku turukonkurentsi kaudu. Nende erimeelsus puudutab rohkem praktilist teostust kui põhimõttelisi eetilisi printsiipe. Mõlemad suundumused jagavad samu libertaarseid eneseomandi ja mitteagressiooni väärtusi.
reviewed: false
