question: "Proč si klasičtí liberálové ve Spojených státech začali od 60. let říkat 'libertarians'?"
answer: "Aby se odlišili od amerických liberals, jejichž význam se posunul směrem ke státnímu intervencionismu"
wrong_answers:
  - "Aby se sladili s Demokratickou stranou a jejími progresivními sociálními programy"
  - "Aby dali najevo podporu reformám Great Society Lyndona B. Johnsona"
  - "Aby přijali radikálnější revoluční identitu inspirovanou evropskými socialistickými hnutími"
explanation: >-
  Ve Spojených státech se slovo 'liberal' posunulo k označení zastánců Big Government a státních zásahů, zejména po New Dealu a Great Society. Klasičtí liberálové přijali nálepku 'libertarian', aby zachovali původní význam své filozofie. Od amerických liberals se distancovali, nikoli se s nimi spojovali.
