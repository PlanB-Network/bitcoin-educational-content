question: "¿Por qué los liberales clásicos en Estados Unidos empezaron a llamarse 'libertarians' a partir de la década de 1960?"
answer: "Para distinguirse de los liberales estadounidenses, cuyo significado se había desplazado hacia el intervencionismo estatal"
wrong_answers:
  - "Para alinearse con el Partido Demócrata y sus programas sociales progresistas"
  - "Para señalar su apoyo a las reformas de la Great Society de Lyndon B. Johnson"
  - "Para adoptar una identidad revolucionaria más radical inspirada en los movimientos socialistas europeos"
explanation: >-
  En Estados Unidos, la palabra 'liberal' se desplazó hasta significar partidarios del Big Government y de la intervención estatal, especialmente después del New Deal y la Great Society. Los liberales clásicos adoptaron la etiqueta 'libertarian' para preservar el significado original de su filosofía. Se estaban distanciando de los liberales estadounidenses, no alineándose con ellos.
