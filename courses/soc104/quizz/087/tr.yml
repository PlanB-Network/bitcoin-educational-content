question: "Kant'ın 'Sapere aude' mottosu insanları ne yapmaya teşvik eder?"
answer: "Kendi başlarına düşünmeye cesaret etmeye ve üstün bir otoritenin yönlendirmesine bağımlı oldukları reşit olmama hâlinden çıkmaya"
wrong_answers:
  - "Resmî eğitim kurumlarına kaydolup diploma alarak akademik bilginin peşinden gitmeye"
  - "Ahlakın tüm biçimlerine meydan okumaya ve kişisel arzuya dayalı bütünüyle yeni etik sistemler yaratmaya"
  - "Dinsel bağlılık ve kilisenin öğretilerine teslimiyet yoluyla bilgelik aramaya"
explanation: >-
  "Kendi başına düşünmeye cesaret et" anlamına gelen Sapere aude, Kant tarafından şair Horatius'tan alınmış ve Aydınlanma'nın mottosu yapılmıştır. İnsanların üstün bir sınıfın ya da otoritenin yönlendirmesi olmadan kendi anlama yetilerini kullanmaktan aciz olduğu reşit olmama hâlinden çıkışı simgeler. Kant özgürleşmeyi ve kişinin kendi düşüncesi için tam sorumluluk üstlenmesini teşvik eder.
