question: "Michael Oakeshott ने अपने philosophical work में conservatism को कैसे characterize किया?"
answer: "एक rigid systematic ideology के बजाय life के प्रति temperament और disposition के रूप में"
wrong_answers:
  - "Government के हर क्षेत्र के लिए precise policy prescriptions वाली एक comprehensive economic theory के रूप में"
  - "एक revolutionary movement के रूप में जो modern institutions को dismantle कर pre-industrial society में लौटना चाहता है"
  - "Christian theology और ecclesiastical authority में grounded एक purely religious doctrine के रूप में"
explanation: >-
  British philosopher Michael Oakeshott ने conservatism की conception को systematic ideology के बजाय temperament के रूप में defend किया। उनका essay On Being Conservative (1956) एक essential reference बना रहता है। Conservatism को disposition के रूप में देखने वाली इस view ने Friedrich Hayek को भी influence किया। Oakeshott का approach politics में rationalism की critique के लिए notable है, जो इस idea को reject करता है कि politics को किसी system में reduce किया जा सकता है।
