question: Ni ubuhe buryo bwa RGB butuma umuntu ashobora kurwana ku gusohora amahera incuro zibiri?
answer: Single-Use Seal.
wrong_answers:
  - Ikoreshwa ryinshi Seal.
  - Umukono wa kabiri
  - Ikimenyamenya c'Igiti
explanation: |
  Single-Use Seal (ikidodo gikora rimwe) ikoresha ukuri kw’uko UTXO ishobora gukoreshwa rimwe gusa, igatuma habaho kurwanya gusohora amahera incuro zibiri mu masezerano y’ubwenge ya RGB.
reviewed: false
