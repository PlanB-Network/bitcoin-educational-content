question: නිර්නාමිකව ප්‍රකාශයට පත් වූ L'Ami des Hommes එතරම් බලපෑමක් ඇති කළ බැවින්, මුලින් එය කාට අයත් කරනු ලැබුවේද?
answer: Montesquieu
wrong_answers:
  - Voltaire
  - Diderot
  - Rousseau
explanation: |
  L'Ami des Hommes එහි ශෛලිය සහ වැදගත්කම නිසා මුලින් Montesquieuට අයත් කරනු ලැබීය. පසුව එහි කතුවරයා සැබවින්ම Marquis de Mirabeau බව අනාවරණය විය.
