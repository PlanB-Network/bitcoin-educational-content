bio: |
  Un anatomist nigerian devenit bitcoiner. A auzit prima dată despre Bitcoin în 2014, orange-pilled în mod corespunzător în 2017. Momentul meu de "Ahaaa" despre Bitcoin a fost în 2021. Scriu despre trucuri de bază ale tehnologiei Bitcoin, ghiduri DIY și sfaturi personale generale pentru utilizarea Bitcoin, în special despre custodie și moștenire. Construiesc Bolta.app, o Bancă de Asigurări Bitcoin.

short_bio: Sunt autorul tutorialului pentru portofelul Valet.
