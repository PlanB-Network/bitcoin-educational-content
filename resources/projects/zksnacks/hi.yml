description: |
  zkSNACKs में "zk" का मतलब शून्य ज्ञान है, जिसका अर्थ है कि हम अपने उत्पादों में कोई भी व्यक्तिगत उपयोगकर्ता जानकारी एकत्र नहीं करते हैं और न ही कर सकते हैं।

  zkSNACKs ने 1 जून 2024 को अपना coinjoin कोऑर्डिनेटर बंद कर दिया, और इसकी वेबसाइट ऑफ़लाइन है। Wasabi Wallet ओपन-सोर्स सॉफ़्टवेयर के रूप में जारी है।