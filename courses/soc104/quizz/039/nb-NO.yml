question: "Hvordan kan statsfinansierte sosiale hjelpeprogrammer produsere perverse virkninger, og dermed illustrere faren ved å stole utelukkende på intensjoner?"
answer: "De kan skape avhengighet, fjerne insentiver til å arbeide, og utgjøre plyndring siden pengene først må tas fra dem som produserte rikdommen"
wrong_answers:
  - "De oppmuntrer til overdreven personlig sparing, reduserer forbruk og forårsaker deflasjon i den bredere økonomien"
  - "De styrker private foretak ved å flytte arbeidskostnader til regjeringen og redusere behovet for konkurransedyktige lønninger"
  - "De eliminerer klasseskiller så grundig at sosial mobilitet blir unødvendig og innovasjon stagnerer"
explanation: >-
  Friedman advarer om at generøse intensjoner kan produsere skadelige konsekvenser når de neglisjerer streng analyse av menneskelige insentiver. Statsfinansierte hjelpeprogrammer risikerer å skape avhengighet, ikke generere noe insentiv til å arbeide, og utgjøre en form for plyndring siden midlene først må tas fra rikdomsprodusenter. Målbare resultater som fattigdomsreduksjon og effektivitet må ha forrang over edle intensjoner.
reviewed: false
