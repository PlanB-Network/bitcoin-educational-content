description: |
  "zk" в zkSNACKs означава нулево познание, което означава, че не събираме и не можем да събираме никаква лична информация за потребителя в нашите продукти.

  zkSNACKs спря своя coinjoin координатор на 1 юни 2024 г., а уебсайтът му е офлайн. Wasabi Wallet продължава като софтуер с отворен код.
  