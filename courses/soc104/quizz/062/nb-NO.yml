question: "Hvordan kom alle totalitære regimer til makten?"
answer: "Gjennom voldelig revolusjon som rettferdiggjorde å gjøre rent bord med det tidligere systemet"
wrong_answers:
  - "Gjennom gradvis lovreform innenfor eksisterende demokratiske institusjoner"
  - "Gjennom militærkupp organisert av fremmede makter som søkte regional kontroll"
  - "Gjennom fredelige massebevegelser som vant folkevalg med store marginer"
explanation: >-
  Alle totalitære regimer kom til makten gjennom voldelig revolusjon. Denne revolusjonen tjener et dobbelt formål: den ødelegger den gamle ordenen fysisk og rettferdiggjør ideologisk bruken av vold som nødvendig for å bygge det nye samfunnet. Dette skiller totalitære maktovertakelser fra demokratiske overganger, utenlandskstøttede kupp eller fredelige valgseire.
reviewed: false
