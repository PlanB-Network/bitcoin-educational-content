question: "Centrist pragmatism के भीतर कौन-सा hidden paradox है?"
answer: "Pragmatism स्वयं dogmatism के एक form पर टिका है, अर्थात यह unexpressed conviction कि केवल experts ही society steer करने में competent हैं"
wrong_answers:
  - "Centrists moderate होने का दावा करते हैं लेकिन coalition governments में consistently left-wing parties के साथ align करते हैं"
  - "Centrist policies balanced दिखती हैं लेकिन हमेशा economic growth को environmental protection से ऊपर favor करती हैं"
  - "Centrists ideology reject करते हैं लेकिन economic decisions लेते समय rigid free-market principles adopt करते हैं"
explanation: >-
  Centrist pragmatism का paradox यह है कि वह rational expertise के favor में ideology reject करने का दावा करता है, फिर भी यही claim एक invisible और unexpressed dogma पर टिका है: केवल technocrats ही right decisions लेने में capable हैं। यह conviction कि केवल experts society steer करें, स्वयं एक ideological commitment है, भले ही centrists इसे ऐसा recognize न करें।
reviewed: false
