question: "为什么左右轴被认为不足以定位像 Bastiat 或 Ron Paul 这样的古典自由主义思想家？"
answer: "因为古典自由主义同时重视经济自由与个人自由，而左翼与右翼都没有完全接受这两者"
wrong_answers:
  - "因为古典自由主义者总是与右翼经济政策一致，并拒绝所有左翼立场"
  - "因为古典自由主义者是中间派，采纳左翼与右翼意识形态的温和版本"
  - "因为古典自由主义者反对一切形式的政府，使他们成为无政府主义者而非政治思想家"
explanation: >-
  左右轴无法容纳古典自由主义者，因为它无法安置一种同时捍卫经济自由（通常被视为右翼）与个人自由（通常被视为左翼）的立场。古典自由主义者不是寻求妥协的中间派，也不是无政府主义者或纯粹右翼。他们只是无法放在一条一维光谱上。
reviewed: false
