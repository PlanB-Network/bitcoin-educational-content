question: Ni iyihe ntambwe ya mbere yo gukora iyo habaye ikibazo (bug) kuri Umbrel?
answer:  Gukora diagnostics bundle
wrong_answers:
  - Subiramwo Bitcoin core hanyuma wongere ukore IBD
  - Kuraho ububiko
  - Guhagarika 2FA
explanation: |
  Iyo habaye ingorane, dutangura dukora umugwi w’ibipimo mu gice co gutorera umuti ingorane kugira ngo dusuzume ikibazo no kubungabunga inyandiko.
reviewed: true
