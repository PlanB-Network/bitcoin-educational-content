question: "Która postać w dialogach Gustave'a de Molinariego z 1849 roku broni wolności jako fundamentalnej zasady, zamiast podporządkowywać ją innym celom?"
answer: "Ekonomista, który traktuje wolność jako zasadę niepodporządkowaną żadnemu innemu celowi"
wrong_answers:
  - "Socjalista, który broni wolności przez postępowe reformy zmierzające do równości społecznej"
  - "Konserwatysta, który podtrzymuje wolność przez zachowanie tradycyjnego porządku społecznego i stabilności"
  - "Wszystkie trzy postacie bronią wolności w równym stopniu, ale nie zgadzają się co do sposobu jej wdrożenia"
explanation: >-
  W dialogach Molinariego z Les Soirees de la rue Saint-Lazare ekonomista pozostaje w stałej niezgodzie zarówno z socjalistą, jak i konserwatystą. Jest jedynym, który broni wolności jako fundamentalnej zasady. Socjalista podporządkowuje wolność postępowym ideałom, a konserwatysta podporządkowuje ją zachowaniu porządku, co czyni ekonomistę wyjątkowym w jego bezwarunkowej obronie wolności.
