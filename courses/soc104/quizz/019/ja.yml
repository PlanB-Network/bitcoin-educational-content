question: "欧州の政治的伝統において「liberal」という語は何を意味するのか？"
answer: "レッセフェール経済、国家介入の縮小、個人の自由を支持する人"
wrong_answers:
  - "国家介入、公的医療保険、貧困対策プログラムの提唱者"
  - "政府と私有財産の完全な廃止を求める急進的アナキスト"
  - "すべての政策領域で社会主義的立場と保守的立場を等しく均衡させる中道派"
explanation: >-
  欧州では、リベラリズムはレッセフェールの経済政策、国家介入の縮小、個人の自由の擁護と結び付いたままである。
  最初の誤答は、介入主義へと語の意味を変化させたアメリカのリベラルを説明している。
  欧州のリベラリズムは、アナキズムでも中道主義でもない。
reviewed: false
