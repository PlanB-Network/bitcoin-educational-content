question: En quoi l'affirmation de la liberté humaine dans la théologie chrétienne médiévale a-t-elle contribué au développement de la pensée moderne ?
answer: Elle a conduit à la remise en question de l'autorité politique et à l'affirmation de la liberté de conscience.
wrong_answers:
  - Elle a remplacé la philosophie classique par une vision du monde purement théologique.
  - Elle a jeté les bases d'une défense des droits individuels.
  - Elle a favorisé le développement de la science expérimentale et de la recherche rationnelle.
explanation: |
  L'affirmation de la liberté humaine dans la théologie chrétienne médiévale a ouvert la voie à la pensée moderne en établissant que l'autorité politique doit respecter le droit naturel et la conscience individuelle, posant les bases du concept de droits qui transcendent le pouvoir politique.
reviewed: true
