question: "Miten kaikki totalitaariset hallinnot nousivat valtaan?"
answer: "Väkivaltaisen vallankumouksen kautta, joka oikeutti aiemman järjestelmän pyyhkimisen pois ja aloittamisen puhtaalta pöydältä"
wrong_answers:
  - "Asteittaisen lainsäädäntöuudistuksen kautta olemassa olevien demokraattisten instituutioiden sisällä"
  - "Vieraiden valtojen alueellisen kontrollin tavoittelemiseksi järjestämien sotilasvallankaappausten kautta"
  - "Rauhanomaisten joukkoliikkeiden kautta, jotka voittivat kansanvaalit suurilla marginaaleilla"
explanation: >-
  Kaikki totalitaariset hallinnot nousivat valtaan väkivaltaisen vallankumouksen kautta. Tällä vallankumouksella on kaksoistarkoitus: se tuhoaa fyysisesti vanhan järjestyksen ja oikeuttaa ideologisesti väkivallan käytön välttämättömänä uuden yhteiskunnan rakentamiselle. Tämä erottaa totalitaariset vallanotot demokraattisista siirtymistä, ulkovaltojen tukemista vallankaappauksista tai rauhanomaisista vaalivoitoista.
