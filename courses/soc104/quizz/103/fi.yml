question: "Kun otetaan huomioon tämän kurssin koko argumentti, miten Bitcoin samanaikaisesti ilmentää libertaarista konstruktivismin kritiikkiä, cypherpunkien sitoutumista toimintaan ja individualistista moraalisen autonomian puolustusta?"
answer: "Bitcoin korvaa keskitetysti suunnitellun rahan spontaanilla markkinajärjestyksellä (anti-konstruktivismi), muuttaa taloudellisen vapauden abstraktin ihanteen toimivaksi koodiksi (cypherpunk-toiminta) ja palauttaa suvereenin omaisuuden ja yksityisyyden yksilölle (moraalinen autonomia)"
wrong_answers:
  - "Bitcoin käyttää demokraattista hallintoa rahapolitiikan määrittämiseen (anti-konstruktivismi), julkaisee koulutussisältöä taloudellisesta vapaudesta (cypherpunk-toiminta) ja antaa yksilöiden äänestää protokollamuutoksista (moraalinen autonomia)"
  - "Bitcoin poistaa kaiken taloudellisen sääntelyn (anti-konstruktivismi), luo kehittäjäyhteisön, joka lobbaa sääntelyn purkamisen puolesta (cypherpunk-toiminta), ja antaa varakkaille yksilöille enemmän määräysvaltaa rahapolitiikkaan (moraalinen autonomia)"
  - "Bitcoin hajauttaa palvelininfrastruktuurin useisiin maihin (anti-konstruktivismi), käyttää avoimen lähdekoodin lisensointia teknologian vapaaseen jakamiseen (cypherpunk-toiminta) ja tarjoaa anonyymejä sosiaalisen median alustoja poliittiselle toisinajattelulle (moraalinen autonomia)"
explanation: >-
  Bitcoin sijoittuu kolmen kurssilla käsitellyn älyllisen perinteen risteykseen. Se ilmentää anti-konstruktivistista argumenttia korvaamalla keskitetysti suunnitellun fiat-rahan spontaanilla, hajautetulla rahajärjestyksellä, jota mikään keskussuunnittelija ei voi hallita. Se täyttää cypherpunkien imperatiivin kirjoittaa koodia muuttamalla taloudellisen vapauden ja yksityisyyden abstraktit ihanteet toimivaksi teknologiaksi. Ja se palvelee individualistista moraalisen autonomian puolustusta mahdollistamalla suvereenin omaisuuden, suojaamalla työn hedelmiä ja säilyttämällä yksityisyyden, antaen jokaisen ihmisen olla oman elämänsä herra.
