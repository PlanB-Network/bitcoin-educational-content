question: "Khóa học lập luận rằng tự do cho phép các giá trị cánh tả và cánh hữu cùng tồn tại hòa bình như thế nào?"
answer: "Trong một chế độ tự do đích thực, những người có lý tưởng cánh tả có thể tự nguyện chia sẻ tài sản và tái phân phối tiền, trong khi những người có giá trị cánh hữu có thể tiết kiệm và truyền lại các truyền thống, mà không bên nào áp đặt lối sống của mình lên bên kia"
wrong_answers:
  - "Tự do đòi hỏi cả hai bên thỏa hiệp bằng cách chấp nhận một lập trường trung dung, nơi chính phủ cân bằng các giá trị cạnh tranh thông qua điều tiết vừa phải"
  - "Tự do nghĩa là các cộng đồng cánh tả và cánh hữu phải sống trong các lãnh thổ địa lý riêng biệt với các chính phủ độc lập của riêng họ"
  - "Tự do vận hành bằng cách cho phép công dân bỏ phiếu về những giá trị nào nên được cưỡng chế trong từng vùng, luân phiên giữa các chính sách cánh tả và cánh hữu ở mỗi chu kỳ bầu cử"
explanation: >-
  Khóa học cho thấy rằng trong một chế độ tự do đích thực, những người gắn bó với các lý tưởng cánh tả có thể tự nguyện từ bỏ tài sản, chia sẻ tư liệu sản xuất, hoặc quyên góp tiền lương cho các tổ chức tái phân phối. Những người có giá trị cánh hữu có thể làm việc chăm chỉ, tiết kiệm, và truyền lại các giá trị gia đình. Không ai nên áp đặt lối sống của mình lên người khác. Chính thông qua tự do của thị trường và sức mạnh của lựa chọn mà các mục tiêu có thể được đạt tới một cách hòa bình.
