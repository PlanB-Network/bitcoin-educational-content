question: "Pourquoi les libéraux classiques aux États-Unis ont-ils commencé à s'appeler « libertariens » au cours du vingtième siècle ?"
answer: "Parce que le « libéralisme » américain avait été récupéré par l'interventionnisme étatique croissant et l'État-providence"
wrong_answers:
  - "Parce qu'ils voulaient prendre leurs distances avec les traditions monarchistes européennes"
  - "Parce que le terme « libéral » est devenu associé à l'anarchisme et à la violence politique"
  - "Parce que de nouveaux accords commerciaux exigeaient une identité politique distincte pour les défenseurs du marché libre"
explanation: >-
  Au cours du vingtième siècle, un changement fondamental s'est produit lorsque les principes du laissez-faire ont été progressivement abandonnés au profit de l'État-providence. Le « libéralisme » américain en est venu à désigner quelque chose de très différent du libéralisme classique, en adoptant l'interventionnisme étatique. Les libéraux classiques ont adopté le terme « libertarien » pour préserver la distinction. Ce repositionnement lexical n'avait rien à voir avec le monarchisme européen, la violence anarchiste ou les accords commerciaux.
reviewed: false
