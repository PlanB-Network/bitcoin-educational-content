question: "Waar staan de Groenen op het Nolan-diagram, en waarom?"
answer: "Zeer laag op het diagram, omdat ze vinden dat individueel belang geen voorrang mag krijgen op het collectieve belang van de planeet"
wrong_answers:
  - "Bovenaan het diagram, omdat ze persoonlijke vrijheid en milieubewustzijn evenveel prioriteit geven"
  - "In het midden van het diagram, omdat ze economische groei in evenwicht brengen met milieubescherming"
  - "Helemaal rechts, omdat ze marktgebaseerde oplossingen voor milieuproblemen ondersteunen"
explanation: >-
  De Groenen staan zeer laag op het Nolan-diagram omdat ze sterke staatscontrole over zowel economische als persoonlijke beslissingen voorstaan in naam van het welzijn van de planeet. Ze hebben de marxistische klassenstrijd vervangen door een strijd tussen mens en natuur, en verdedigen meestal economische controle en zelfs de afschaffing van privé-eigendom. Dit plaatst hen in de autoritaire sector, niet bovenaan of in het midden.
reviewed: false
