question: "Các cách tiếp cận kinh tế của nước Đức của Hitler và Liên Xô của Stalin khác nhau như thế nào, dù cùng chia sẻ các phương pháp toàn trị?"
answer: "Đức Quốc xã duy trì vẻ ngoài của sở hữu tư nhân trong khi đặt khu vực tư nhân dưới các mục tiêu của nhà nước, còn chủ nghĩa Stalin bãi bỏ mọi sở hữu tư nhân và kế hoạch hóa hoàn toàn nền kinh tế"
wrong_answers:
  - "Đức Quốc xã quốc hữu hóa hoàn toàn mọi ngành công nghiệp, trong khi chế độ Stalin cho phép doanh nghiệp tư nhân hạn chế trong nông nghiệp"
  - "Đức Quốc xã thúc đẩy thương mại quốc tế tự do để tài trợ tái vũ trang, trong khi chủ nghĩa Stalin áp đặt cô lập kinh tế hoàn toàn"
  - "Đức Quốc xã dựa vào sự hợp tác tự nguyện của doanh nghiệp với nhà nước, trong khi chủ nghĩa Stalin chỉ sử dụng lao động cưỡng bức"
explanation: >-
  Dù cả hai chế độ sử dụng các phương pháp chính trị giống nhau (sùng bái cá nhân, giám sát toàn diện, loại bỏ có hệ thống phe đối lập), các mô hình kinh tế của họ khác nhau về hình thức. Đức Quốc xã không chính thức bãi bỏ sở hữu tư nhân nhưng hoàn toàn đặt khu vực tư nhân dưới các mục tiêu của nhà nước như chiến tranh và tái vũ trang, áp đặt chính sách kinh tế tự cung tự cấp. Chủ nghĩa Stalin đi xa hơn bằng cách bãi bỏ mọi sở hữu tư nhân, triển khai các kế hoạch năm năm, và trực tiếp kiểm soát toàn bộ sản xuất cũng như phân phối.
