question: "Milline juhtpõhimõte suunas Frederic Bastiat' hääletusi Rahvusassamblees?"
answer: "Üksikisiku ja majanduslike vabaduste edendamine ning valitsuse sekkumise vähendamine"
wrong_answers:
  - "Kuningliku võimu kaitsmine ja monarhiliste traditsioonide säilitamine"
  - "Sotsialistlike poliitikate edendamine, et rikkust võrdsemalt ümber jagada"
  - "Tsentristlik kompromissistrateegia vasak- ja parempoolsete fraktsioonide vahel"
explanation: >-
  Bastiat hääletas lähtudes ühest aluspõhimõttest: edendada üksikisiku ja majanduslikke vabadusi, vähendades samal ajal valitsuse sekkumist. Ta ei olnud tsentristlik oportunist ega ka rojalist või sotsialist. Ta hääletas koos selle poolega, kes pakkus välja vabaduse ja piiratud valitsemisega kooskõlas olevaid meetmeid.
reviewed: false
