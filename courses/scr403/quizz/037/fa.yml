question: اثرهای Simplicity جابجایی‌پذیر و ایدمپوتنت هستند اما واحدی نیستند. بنابراین کدام تبدیل بهینه‌ساز باید به‌طور کلی رد شود؟
answer: جایگزین کردن یک عبارت ظاهراً مرده با unit — Failure واحدی نیست، پس می‌تواند یک بررسیِ شکست‌خورنده را پنهان کند که باید اجرای تراکنش را متوقف کند.
wrong_answers:
  - جابه‌جا کردن دو زیرعبارت مستقل، چون sig-all-hash می‌تواند حالت محیطی متفاوتی را مشاهده کند.
  - ادغام دو فراخوانی verify یکسان، چون Failure تکرارشده دوبار استثنا پرتاب می‌کند و به‌اشتباه متوقف می‌شود.
  - بازمرتب‌سازی عبارت‌هایی که ممکن است استثنا پرتاب کنند، چون استثنای منتشرشده به این بستگی دارد که کدام طرف اول اجرا شود.
explanation: >-
  چون تضمین شده است اثرهای Simplicity جابجایی‌پذیر و ایدمپوتنت باشند، جابه‌جا
  کردن زیرعبارت‌های مستقل و تکثیر یا ادغام موارد یکسان همیشه امن است؛ محیط Reader
  ثابت است، و استثنای unit-typed در Failure صرف‌نظر از اینکه کدام طرف اول استثنا پرتاب
  کند یا چند بار رخ دهد، یکسان است. بااین‌حال، تبدیل دوراندازی `f ⨾ unit = unit`
  به واحدی‌بودن نیاز دارد، که Failure فاقد آن است: اگر `f` شامل یک
  `bip0340-verify` روی امضای نامعتبر باشد، حذف کد «مرده» توقف را بهینه‌سازی و
  حذف می‌کند و تراکنشی را معتبر می‌سازد که باید شکست بخورد.
reviewed: false
