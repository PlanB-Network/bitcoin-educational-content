question: "Por que a posição libertária sobre a legalização das drogas vem com a condição de que o papel do Estado na sociedade deve ser reduzido?"
answer: "Porque a liberalização assumida pelo Estado substituiria a responsabilidade individual por cuidados administrados pelo governo, enquanto os libertários querem que os cidadãos arquem com as consequências de suas escolhas, com apoio de associações privadas"
wrong_answers:
  - "Porque a legalização controlada pelo Estado geraria receita tributária demais, tornando o governo excessivamente poderoso e corrupto"
  - "Porque o Estado imporia padrões de qualidade que elevariam os preços e recriariam mercados negros"
  - "Porque a regulamentação governamental das drogas violaria acordos comerciais internacionais e relações diplomáticas"
explanation: >-
  Libertários apoiam a liberalização das drogas, mas insistem que o papel do Estado deve ser reduzido porque seu objetivo é restaurar a responsabilidade individual, não expandir a gestão estatal. Se alguém se torna dependente, essa pessoa deve assumir responsabilidade em vez de pedir que o Estado forneça cuidados. A solução para a dependência está na iniciativa privada: apoio voluntário de indivíduos, famílias e associações de caridade. A legalização administrada pelo Estado contradiziria o princípio libertário fundamental da responsabilidade pessoal.
