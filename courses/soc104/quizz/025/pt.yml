question: "Por que os liberais clássicos nos Estados Unidos começaram a chamar a si mesmos de 'libertarians' a partir da década de 1960?"
answer: "Para se distinguirem dos liberals americanos, cujo significado havia se deslocado para o intervencionismo estatal"
wrong_answers:
  - "Para se alinharem ao Partido Democrata e aos seus programas sociais progressistas"
  - "Para sinalizar seu apoio às reformas da Great Society de Lyndon B. Johnson"
  - "Para adotar uma identidade revolucionária mais radical inspirada em movimentos socialistas europeus"
explanation: >-
  Nos Estados Unidos, a palavra 'liberal' passou a significar apoiadores do Big Government e da intervenção estatal, particularmente depois do New Deal e da Great Society. Os liberais clássicos adotaram o rótulo 'libertarian' para preservar o significado original de sua filosofia. Eles estavam se distanciando dos liberals americanos, não se alinhando a eles.
reviewed: false
