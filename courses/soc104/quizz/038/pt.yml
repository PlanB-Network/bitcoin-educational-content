question: "Como o socialismo trata as liberdades de maneira diferente nas esferas societal e econômica?"
answer: "O socialismo favorece liberdades fortes na esfera societal, mas liberdades fracas na esfera econômica"
wrong_answers:
  - "O socialismo restringe todas as liberdades igualmente tanto na esfera societal quanto na econômica"
  - "O socialismo favorece fortes liberdades econômicas, mas restringe as liberdades societais para manter a ordem social"
  - "O socialismo concede liberdades ilimitadas em ambas as esferas e depende da cooperação voluntária para manter o equilíbrio"
explanation: >-
  No pensamento socialista, há uma dicotomia fundamental entre liberdades societais e econômicas. As liberdades societais são fortes, mas as liberdades econômicas são fracas devido à ênfase no controle estatal, no planejamento e na redistribuição de riqueza. A terceira resposta errada descreve o ideal libertário, enquanto a segunda descreve o padrão conservador, que é a imagem espelhada do socialismo.
