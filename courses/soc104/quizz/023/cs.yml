question: "Jak kulturně konzervativní libertarián přistupuje k chování, které morálně neschvaluje?"
answer: "Staví se proti takovému chování a odrazuje od něj přesvědčováním a příkladem, ale bez uchylování se k donucovací síle zákona"
wrong_answers:
  - "Podporuje zákazy takového chování na úrovni místní samosprávy, zatímco odmítá zákazy na federální úrovni"
  - "Zůstává vůči takovému chování zcela mlčenlivý, protože věří, že jakákoli forma nesouhlasu porušuje individuální svobodu"
  - "Prosazuje komunitní tribunály, které mohou takové chování trestat mimo formální právní systém"
explanation: >-
  Kulturně konzervativní libertarián může některé chování morálně neschvalovat, ale neprosazuje zákonný zákaz konsensuálních, neagresivních jednání. Taková jednání se mu mohou nelíbit, může jim odporovat a aktivně od nich odrazovat, ale vždy přesvědčováním, vzděláváním a příkladem, nikoli donucovací silou zákona. Nejde o mlčení ani o vytváření alternativních mechanismů vymáhání.
