question: "Как Рон Пол иллюстрировал палеолибертарианскую позицию по таким вопросам, как употребление наркотиков и аборты?"
answer: "Он лично советовал не употреблять наркотики и выступал против абортов, но политически боролся против федерального запрета и утверждал, что выбор должен быть оставлен индивидам или штатам"
wrong_answers:
  - "Он поддерживал федеральную легализацию всех наркотиков и абортов как вопрос абсолютных индивидуальных прав"
  - "Он вел кампанию за строгие федеральные запреты и наркотиков, и абортов, исходя из своих личных моральных убеждений"
  - "Он отказывался выражать какое-либо личное мнение по этим вопросам, утверждая, что политики должны оставаться морально нейтральными"
explanation: >-
  Рон Пол воплощает палеолибертарианский синтез, отделяя личные моральные убеждения от политического принуждения. Он всегда советовал не употреблять наркотики, но одновременно выступал против запрета наркотиков. Он лично был против абортов, однако утверждал, что выбор должен быть оставлен федеральным штатам, а не навязан сверху. Это показывает, как можно придерживаться сильных традиционных ценностей и при этом отказываться использовать принудительную власть федерального правительства для их навязывания.
reviewed: false
