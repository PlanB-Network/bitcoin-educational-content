question: "Comment le socialisme traite-t-il différemment les libertés dans les sphères sociétale et économique ?"
answer: "Le socialisme favorise des libertés fortes dans la sphère sociétale mais des libertés faibles dans la sphère économique"
wrong_answers:
  - "Le socialisme restreint toutes les libertés de manière égale dans les sphères sociétale et économique"
  - "Le socialisme favorise de fortes libertés économiques mais restreint les libertés sociétales pour maintenir l'ordre social"
  - "Le socialisme accorde des libertés illimitées dans les deux sphères et s'appuie sur la coopération volontaire pour maintenir l'équilibre"
explanation: >-
  Dans la pensée socialiste, il existe une dichotomie fondamentale entre les libertés sociétales et économiques. Les libertés sociétales sont fortes, mais les libertés économiques sont faibles en raison de l'accent mis sur le contrôle étatique, la planification et la redistribution des richesses. La troisième mauvaise réponse décrit l'idéal libertarien, tandis que la deuxième décrit le schéma conservateur, qui est l'image miroir du socialisme.
