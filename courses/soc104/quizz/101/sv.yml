question: "Vad tror libertarianer om individers förmåga att fatta beslut?"
answer: "Individer har både rätten och ansvaret att fatta sina egna beslut om sina liv"
wrong_answers:
  - "Individer bör fatta beslut först efter att ha rådfrågat valda representanter som förstår politiska konsekvenser"
  - "Individer är i allmänhet oförmögna att fatta goda beslut och behöver expertvägledning från statliga institutioner"
  - "Individer bör fatta ekonomiska beslut fritt men överlåta alla sociala och kulturella frågor till staten"
explanation: >-
  Ur ett libertarianskt perspektiv har individer både rätten och ansvaret att fatta sina egna beslut. Detta står i kontrast till konventionella politiska familjer från vänster till höger, som anser att staten bör fatta vissa eller många av de viktiga besluten i en individs liv och i det ekonomiska livet i allmänhet.
reviewed: false
