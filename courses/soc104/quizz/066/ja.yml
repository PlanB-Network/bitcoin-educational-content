question: "Hitler のドイツと Stalin のソビエト連邦は、全体主義的手法を共有していたにもかかわらず、経済的アプローチにおいてどのように異なっていましたか？"
answer: "ナチス・ドイツは私有財産の外観を維持しつつ私的部門を国家の目的に従属させた一方、スターリン主義はすべての私有を廃止し、経済を完全に計画した"
wrong_answers:
  - "ナチス・ドイツはすべての産業を完全に国有化した一方、Stalin 体制は農業における限定的な私企業を認めた"
  - "ナチス・ドイツは再軍備資金を得るために自由な国際貿易を促進した一方、スターリン主義は完全な経済的孤立を課した"
  - "ナチス・ドイツは国家との自発的な企業協力に依拠した一方、スターリン主義は強制労働だけを用いた"
explanation: >-
  両体制は同一の政治的手法（個人崇拝、全面的監視、反対派の体系的排除）を用いましたが、経済モデルの形式は異なっていました。ナチス・ドイツは私有財産を正式には廃止しませんでしたが、私的部門を戦争や再軍備のような国家目標に完全に従属させ、経済的自給自足を課しました。スターリン主義はさらに進み、すべての私有を廃止し、五カ年計画を実施し、すべての生産と分配を直接統制しました。
reviewed: false
