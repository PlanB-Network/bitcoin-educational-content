question: "Các chương trình trợ giúp xã hội do nhà nước tài trợ có thể tạo ra các tác động ngược như thế nào, minh họa cho nguy cơ của việc chỉ dựa vào ý định?"
answer: "Chúng có thể tạo ra sự phụ thuộc, loại bỏ động lực làm việc và cấu thành sự tước đoạt vì tiền trước hết phải được lấy từ những người đã tạo ra của cải"
wrong_answers:
  - "Chúng khuyến khích tiết kiệm cá nhân quá mức, làm giảm chi tiêu tiêu dùng và gây giảm phát trong nền kinh tế rộng hơn"
  - "Chúng củng cố doanh nghiệp tư nhân bằng cách chuyển chi phí lao động sang chính phủ và giảm nhu cầu về tiền lương cạnh tranh"
  - "Chúng xóa bỏ các phân biệt giai cấp triệt để đến mức sự dịch chuyển xã hội trở nên không cần thiết và đổi mới bị đình trệ"
explanation: >-
  Friedman cảnh báo rằng các ý định hào phóng có thể tạo ra những hệ quả có hại khi chúng bỏ qua phân tích nghiêm ngặt về các khuyến khích của con người. Các chương trình trợ giúp do nhà nước tài trợ có nguy cơ tạo ra sự phụ thuộc, không tạo ra động lực làm việc và cấu thành một hình thức tước đoạt vì nguồn tiền trước hết phải được lấy từ những người sản xuất ra của cải. Các kết quả có thể đo lường như giảm nghèo và hiệu quả phải được ưu tiên hơn những ý định cao đẹp.
