question: "프라이버시에 관한 Eric Hughes의 1993년 Cypherpunk Manifesto의 핵심 메시지는 무엇인가요?"
answer: "프라이버시는 전자 시대의 열린 사회에 필수적이며, 개인들은 정부나 기업이 그것을 보장해 주리라고 기대하기보다 스스로 구축해야 한다는 것입니다"
wrong_answers:
  - "프라이버시는 국가안보와 민주적 제도 보호를 대가로 희생되어야 하는 사치라는 것입니다"
  - "프라이버시는 모든 국가에 걸쳐 데이터 보호의 통일된 기준을 세우는 국제 조약으로 규제되어야 한다는 것입니다"
  - "프라이버시는 범죄자와 반체제 인사에게만 중요하며, 법을 지키는 시민은 투명한 감시 시스템에서 이익을 얻는다는 것입니다"
explanation: >-
  Eric Hughes의 1993년 선언문은 프라이버시가 전자 시대의 열린 사회에 필수적이며, 정부, 기업 또는 기타 대형 조직들이 그것을 보장해 주리라고 기대할 수 없다고 말합니다. 근본 동기는 기밀성이 자유의 핵심 요소이며, 제도로부터 선물처럼 기다릴 것이 아니라 개인들이 직접 구축해야 한다는 것입니다.
reviewed: false
