question: "Каква обща основа споделят либертарианците и консерваторите и какво ги разделя?"
answer: "Споделят привързаност към ограничено правителство и отхвърляне на принудителния егалитаризъм, но не са съгласни относно военния интервенционизъм и социалните политики"
wrong_answers:
  - "Споделят подкрепа за протекционистки търговски политики и национална отбрана, но не са съгласни относно ролята на религията в обществения живот"
  - "Споделят ангажимент към прогресивното данъчно облагане и социалните програми, но не са съгласни относно имиграционната политика"
  - "Споделят противопоставяне на свободната търговия и легализацията на наркотиците, но не са съгласни относно размера на федералното правителство"
explanation: >-
  Либертарианците и консерваторите защитават ограничено правителство, отхвърлят принудителния егалитаризъм, противопоставят се на публичния дълг и защитават правата на щатите. Либертарианците обаче отхвърлят военния интервенционизъм на неоконсерваторите, противопоставят се на консервативните социални политики и субсидии, осъждат забраната на наркотиците и отхвърлят протекционизма. Съюзът е реален, но по природа напрегнат.
