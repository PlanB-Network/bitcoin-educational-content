question: "20 世紀に、米国の古典的自由主義者はなぜ自分たちを「リバタリアン」と呼び始めたのか？"
answer: "アメリカの「リベラリズム」が、増大する国家介入主義と福祉国家に取り込まれていたから"
wrong_answers:
  - "ヨーロッパの君主主義的伝統から距離を置きたかったから"
  - "「リベラル」という用語が無政府主義や政治的暴力と結びつくようになったから"
  - "新しい貿易協定により、自由市場の擁護者に明確な政治的アイデンティティが必要になったから"
explanation: >-
  20 世紀には、レッセフェール原則が福祉国家を支持して徐々に放棄されるという根本的な転換が起こった。アメリカの「リベラリズム」は、国家介入主義を受け入れ、古典的自由主義とは非常に異なるものを意味するようになった。古典的自由主義者は、その区別を保存するために「リバタリアン」という用語を採用した。この名称変更は、ヨーロッパの君主主義、無政府主義者の暴力、貿易協定とは無関係だった。
reviewed: false
