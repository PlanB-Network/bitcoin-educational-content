question: "Vì sao mô hình hai chiều cho rằng hầu hết các vấn đề chính trị có thể được chia thành các nhóm kinh tế và cá nhân?"
answer: "Vì các vấn đề kinh tế liên quan đến những gì bạn làm với tư cách là người sản xuất và người tiêu dùng, trong khi các vấn đề cá nhân liên quan đến các mối quan hệ riêng tư, niềm tin và quyền tự chủ thân thể của bạn"
wrong_answers:
  - "Vì mọi cuộc tranh luận chính trị cuối cùng đều quy về bất đồng về mức thuế và thực hành tôn giáo"
  - "Vì về mặt lịch sử, các chính phủ chỉ điều tiết hai thứ: thị trường và quân đội"
  - "Vì các triết gia chính trị từ thời cổ đại luôn tách các mối quan tâm vật chất khỏi các mối quan tâm tinh thần"
explanation: >-
  Mô hình hai chiều dựa trên ý tưởng rằng các vấn đề chính trị chia thành hai nhóm rộng. Các quyền tự do kinh tế bao gồm sản xuất, tiêu dùng, thương mại, việc làm và quản lý tiền bạc. Các quyền tự do cá nhân bao gồm các mối quan hệ riêng tư, ý kiến, niềm tin và các lựa chọn về cơ thể và tâm trí của chính bạn. Sự tách biệt này cho phép lập bản đồ các lập trường chính trị tinh tế hơn nhiều so với một trục tả-hữu đơn lẻ.
