question: "Tiga pilar negara kesejahteraan apa yang ditantang oleh Bitcoin?"
answer: "Sistem fiskal, monopoli moneter untuk membiayai belanja melalui utang, dan pengawasan transaksi untuk mencegah penggunaan mata uang alternatif"
wrong_answers:
  - "Anggaran militer, sistem pendidikan publik, dan infrastruktur layanan kesehatan yang dikendalikan pemerintah"
  - "Sistem peradilan, proses legislatif, dan penegakan eksekutif regulasi terhadap bisnis"
  - "Sistem jaminan sosial, legislasi upah minimum, dan struktur pajak penghasilan progresif"
explanation: >-
  Bitcoin menantang tiga pilar yang menjadi tumpuan negara kesejahteraan. Pertama, sistem fiskal yang tidak cukup untuk menutupi pengeluaran. Kedua, monopoli moneter, yaitu kapasitas untuk menerbitkan uang guna membiayai belanja melalui utang. Ketiga, pengawasan transaksi, kemampuan untuk mencegah orang menggunakan mata uang apa pun selain fiat yang dipaksakan oleh negara. Bitcoin melemahkan ketiganya secara bersamaan.
reviewed: false
