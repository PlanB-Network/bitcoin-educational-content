question: "Какво разкрива декларацията на Mussolini от 1920 г. „Всичко в държавата, нищо извън държавата, нищо против държавата“ за тоталитаризма?"
answer: "Вече няма никакво разделение между публично и частно пространство, защото държавата изцяло поглъща обществото"
wrong_answers:
  - "Държавата се фокусира изключително върху военната мощ, като оставя икономиката на частното предприемачество"
  - "Гражданите са свободни да се организират частно, стига да не критикуват открито правителството"
  - "Правителството контролира само политическата дейност, докато културният и религиозният живот остават автономни"
explanation: >-
  Декларацията на Mussolini улавя същността на тоталитаризма: тоталността. Всичко се поглъща от държавата, което означава, че няма разделение между публично и частно пространство. Обществото губи всякаква форма на автономия, чак до най-обикновени дейности като откриването на спортен клуб. Това далеч надхвърля контрола само върху военната, политическата или икономическата сфера.
reviewed: false
