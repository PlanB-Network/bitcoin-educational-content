question: "برنامه‌های کمک اجتماعیِ تأمین‌شده توسط دولت چگونه می‌توانند آثار معکوس ایجاد کنند و خطر تکیه صرف بر نیت‌ها را نشان دهند؟"
answer: "آن‌ها می‌توانند وابستگی ایجاد کنند، مشوق کار کردن را از بین ببرند، و نوعی غارت محسوب شوند، زیرا پول باید ابتدا از کسانی گرفته شود که ثروت را تولید کرده‌اند"
wrong_answers:
  - "آن‌ها پس‌انداز شخصی افراطی را تشویق می‌کنند، مصرف را کاهش می‌دهند، و در اقتصاد گسترده‌تر باعث کاهش قیمت‌ها می‌شوند"
  - "آن‌ها با انتقال هزینه‌های نیروی کار به دولت و کاهش نیاز به دستمزدهای رقابتی، بنگاه خصوصی را تقویت می‌کنند"
  - "آن‌ها تمایزات طبقاتی را آن‌قدر کامل از بین می‌برند که تحرک اجتماعی غیرضروری می‌شود و نوآوری دچار رکود می‌گردد"
explanation: >-
  فریدمن هشدار می‌دهد که نیت‌های سخاوتمندانه وقتی تحلیل دقیق مشوق‌های انسانی را نادیده بگیرند، می‌توانند پیامدهای زیان‌بار پدید آورند. برنامه‌های کمک مالیِ تأمین‌شده توسط دولت خطر ایجاد وابستگی، از بین بردن هرگونه مشوق برای کار کردن، و تشکیل نوعی غارت را دارند، زیرا منابع مالی باید ابتدا از تولیدکنندگان ثروت گرفته شوند. نتایج قابل اندازه‌گیری مانند کاهش فقر و کارایی باید بر نیت‌های شریف تقدم داشته باشند.
reviewed: false
