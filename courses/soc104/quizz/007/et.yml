question: "Kus paiknevad rohelised Nolani diagrammil ja miks?"
answer: "Diagrammil väga madalal, sest nad leiavad, et üksikisiku huvi ei tohi olla ülimuslik planeedi kollektiivse huvi ees"
wrong_answers:
  - "Diagrammi tipus, sest nad seavad isikliku vabaduse ja keskkonnateadlikkuse võrdselt esikohale"
  - "Diagrammi keskel, sest nad tasakaalustavad majanduskasvu keskkonnakaitsega"
  - "Äärmisel paremal, sest nad toetavad turupõhiseid lahendusi keskkonnaprobleemidele"
explanation: >-
  Rohelised paiknevad Nolani diagrammil väga madalal, sest nad eelistavad planeedi heaolu nimel tugevat riiklikku kontrolli nii majanduslike kui ka isiklike otsuste üle. Nad on asendanud marksistliku klassivõitluse võitlusega inimese ja looduse vahel ning kalduvad kaitsma majanduslikku kontrolli ja isegi eraomandi kaotamist. See paigutab nad autoritaarsesse sektorisse, mitte tippu ega keskmesse.
