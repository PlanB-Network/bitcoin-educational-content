question: "在 Gustave de Molinari 1849 年的对话中，哪个人物把自由作为根本原则来捍卫，而不是将其从属于其他目标？"
answer: "经济学家，他把自由视为不从属于任何其他目标的原则"
wrong_answers:
  - "社会主义者，他通过旨在实现社会平等的进步改革来捍卫自由"
  - "保守主义者，他通过维护传统社会秩序和稳定来捍卫自由"
  - "三个人物都同等地捍卫自由，只是在如何实施自由上存在分歧"
explanation: >-
  在 Molinari 的 Les Soirees de la rue Saint-Lazare 对话中，经济学家与社会主义者和保守主义者始终处于分歧之中。他是唯一一个把自由作为根本原则来捍卫的人。社会主义者将自由从属于进步理想，保守主义者将自由从属于维护秩序，这使经济学家在无条件捍卫自由方面显得独特。
reviewed: false
