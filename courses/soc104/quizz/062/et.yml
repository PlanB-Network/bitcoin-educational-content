question: "Kuidas tulid võimule kõik totalitaarsed režiimid?"
answer: "Vägivaldse revolutsiooni kaudu, mis õigustas varasemast süsteemist puhta lehe tegemist"
wrong_answers:
  - "Järkjärgulise seadusandliku reformi kaudu olemasolevate demokraatlike institutsioonide sees"
  - "Sõjaväeliste riigipöörete kaudu, mille korraldasid piirkondlikku kontrolli taotlevad välisriigid"
  - "Rahumeelsete massiliikumiste kaudu, mis võitsid rahvavalimised suure ülekaaluga"
explanation: >-
  Kõik totalitaarsed režiimid tulid võimule vägivaldse revolutsiooni kaudu. Sellel revolutsioonil on kaks eesmärki: see hävitab füüsiliselt vana korra ja õigustab ideoloogiliselt vägivalla kasutamist uue ühiskonna ehitamiseks vajalikuna. See eristab totalitaarseid võimuhaaramisi demokraatlikest üleminekutest, välisriikide toetatud riigipööretest või rahumeelsetest valimisvõitudest.
reviewed: false
