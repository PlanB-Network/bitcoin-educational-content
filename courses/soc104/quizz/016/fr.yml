question: "Sur quoi la gauche veut-elle légiférer et que veut-elle réglementer ?"
answer: "L'économie, poussée par l'hostilité à la liberté économique, au capitalisme et au marché libre"
wrong_answers:
  - "La morale personnelle et les pratiques religieuses, poussées par le désir de préserver les institutions traditionnelles"
  - "L'immigration et les frontières nationales, poussées par des préoccupations liées à l'identité culturelle et à la souveraineté"
  - "La technologie et l'innovation, poussées par les craintes que l'automatisation remplace les travailleurs humains"
explanation: >-
  La gauche donne la priorité à la justice sociale et à l'égalité, en particulier sur le plan économique. Cela conduit à son hostilité envers la liberté économique, le capitalisme et le marché libre, ainsi qu'à son désir de légiférer et de réglementer l'économie. La droite, à l'inverse, veut légiférer sur la morale et la religion. La réglementation de l'immigration et de la technologie n'est pas le principal enjeu décrit ici.
reviewed: false
