question: "В чем заключается фундаментальный аргумент Хайека о том, почему центральное планирование терпит неудачу?"
answer: "Знание существует только как рассеянные фрагменты, которыми обладают отдельные индивиды, и не может быть сконцентрировано или интегрировано центральной властью"
wrong_answers:
  - "Центральные планировщики морально коррумпированы и всегда действуют в собственных интересах, а не ради общественного блага"
  - "Демократические институты слишком медленно реагируют на экономические изменения, из-за чего централизованные решения всегда устаревают"
  - "Центральное планирование терпит неудачу, потому что граждане сознательно сопротивляются государственным предписаниям и отказываются соблюдать правила"
explanation: >-
  Фундаментальный аргумент Хайека основан на природе информации. Он показал, что знание никогда не существует в концентрированной или интегрированной форме, а только как рассеянные фрагменты, которыми обладают все отдельные индивиды. Ценность субъективна и известна только локально и неполно. Центральный планировщик, сидящий в кабинете, не знает истинной цены вещей, потому что он не вовлечен во взаимодействие и обмен.
