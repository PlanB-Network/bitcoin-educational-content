question: "Che cosa significa il termine 'liberale' nella tradizione politica europea?"
answer: "Un sostenitore dell'economia laissez-faire, della riduzione dell'intervento statale e delle libertà individuali"
wrong_answers:
  - "Un sostenitore dell'intervento statale, dell'assicurazione sanitaria pubblica e dei programmi contro la povertà"
  - "Un anarchico radicale che cerca la completa abolizione del governo e della proprietà privata"
  - "Un centrista che bilancia allo stesso modo posizioni socialiste e conservatrici in tutti gli ambiti politici"
explanation: >-
  In Europa, il liberalismo è rimasto associato a politiche economiche laissez-faire, alla riduzione dell'intervento statale e alla difesa delle libertà individuali. La prima risposta sbagliata descrive i liberals americani, che hanno spostato il significato del termine verso l'interventismo. Il liberalismo europeo non è né anarchismo né centrismo.
reviewed: false
