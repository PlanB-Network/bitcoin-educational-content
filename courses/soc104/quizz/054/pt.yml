question: "Por que os liberais clássicos nos Estados Unidos começaram a se chamar de 'libertários' durante o século XX?"
answer: "Porque o 'liberalismo' americano havia sido cooptado pelo crescente intervencionismo estatal e pelo Estado de bem-estar social"
wrong_answers:
  - "Porque queriam se distanciar das tradições monarquistas europeias"
  - "Porque o termo 'liberal' passou a ser associado ao anarquismo e à violência política"
  - "Porque novos acordos comerciais exigiam uma identidade política distinta para defensores do livre mercado"
explanation: >-
  Durante o século XX, ocorreu uma mudança fundamental à medida que os princípios do laissez-faire foram progressivamente abandonados em favor do Estado de bem-estar social. O "liberalismo" americano passou a significar algo muito diferente do liberalismo clássico, abraçando o intervencionismo estatal. Os liberais clássicos adotaram o termo "libertário" para preservar a distinção. Esse reposicionamento de marca não tinha nada a ver com monarquismo europeu, violência anarquista ou acordos comerciais.
