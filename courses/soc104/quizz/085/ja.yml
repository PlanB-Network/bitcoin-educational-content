question: "Molinari の 1849 年の予測は、自由と政治権力の関係について、なぜ予言的であることが示されたのか？"
answer: "保守主義者と社会主義者が交互に権力を握り、それぞれの政治的目標に奉仕するために自由を道具化してきたから。まさに彼が述べた通りである"
wrong_answers:
  - "彼が描いた経済学者の登場人物が最終的に政治権力を獲得し、ヨーロッパ全体でリバタリアン政策を実施したから"
  - "3 つの政治的家族すべてが単一の中道主義運動へ統合されるという彼の予測が 20 世紀に実現したから"
  - "自由が歴代政府によって徐々に拡大され、近代民主主義の主要な組織原理になったから"
explanation: >-
  Molinari の視座が予言的であったのは、19 世紀半ば以降、保守主義者と社会主義者が交互に権力を握り、彼が描いたことを正確に実行してきたからである。すなわち、政治的目標に奉仕するための自由の道具化である。どちらの家族も自由を制限し、それぞれのアジェンダを押しつけるために国家に訴える用意がある一方、経済学者の無条件の自由という立場は周縁化されたままだった。
reviewed: false
