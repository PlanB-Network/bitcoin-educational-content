bio: |
  Mă numesc Moritz. Sprijin fondatorii și afacerile din Lightning Network în adoptarea acestei tehnologii.

  Sunt interesat de proiecte din toate verticalele industriei care aplică protocolul Bitcoin Lightning: cele care sunt gratuite și open source, cele care perturbă verticalele existente cu avantajul neloial al Lightning și cele care creează o categorie nouă și au potențialul de a deveni afaceri lider de categorie.

  Sunt pasionat de antreprenoriat și de rezolvarea în echipă a problemelor care contează. Am finanțat afaceri și am făcut parte din consilii de administrație, de la faza seed la Seria A; am condus echipe, am pus la punct procese și am strâns fonduri.

  Anterior, am lucrat ca manager de investiții la Unternehmertum Venture Capital Partners, o firmă de capital de risc care investește în startup-uri tehnologice aflate la început. Până în prezent, UVC Partners a ajutat peste 30 de companii să își lanseze și să își extindă afacerile. Am fost implicat pe ambele fețe ale industriei de capital de risc: ca investitor și ca manager de startup. La Bosch Digital Solutions am lucrat cu tehnologii descentralizate pentru construirea blocurilor fundamentale ale suveranității digitale a organizațiilor.

  În timpul liber îmi place să alerg, să petrec timp în activități în aer liber și să mănânc mâncare picantă. Sunt mereu bucuros să cunosc oameni care împărtășesc o pasiune similară pentru aceste subiecte.

short_bio: Sprijin fondatorii și afacerile din Lightning Network în adoptarea acestei tehnologii
