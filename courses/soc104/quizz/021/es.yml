question: "¿Qué revela el eje vertical del diagrama de Nolan sobre la verdadera cuestión política?"
answer: "Revela si quieres imponer tus propias sensibilidades a los demás mediante el Estado, o prefieres que cada persona sea libre de decidir por sí misma"
wrong_answers:
  - "Revela si apoyas la gobernanza democrática o prefieres el gobierno autoritario de un solo líder"
  - "Revela si te identificas con movimientos sociales progresistas o con instituciones religiosas tradicionales"
  - "Revela si tu preocupación principal es la seguridad nacional o la prosperidad económica"
explanation: >-
  El eje vertical expone la verdadera cuestión política: no si eres de izquierda o de derecha, sino hasta qué punto quieres que el Estado intervenga en moldear la sociedad según tus valores. ¿Deseas imponer tus sensibilidades a los demás, o prefieres que cada persona sea libre de decidir por sí misma? Este encuadre trasciende la división izquierda-derecha y muestra que ambos campos pueden ser igualmente estatistas.
reviewed: false
