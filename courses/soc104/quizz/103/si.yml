question: "individualsට decisions ගැනීමට ඇති capacity පිළිබඳ libertarians විශ්වාස කරන්නේ කුමක්ද?"
answer: "Individualsට තම ජීවිත පිළිබඳ තමන්ගේම decisions ගැනීමට right සහ responsibility දෙකම ඇත"
wrong_answers:
  - "Individuals decisions ගත යුත්තේ policy implications තේරුම් ගන්නා elected representatives සමඟ consult කිරීමෙන් පසුව පමණි"
  - "Individuals සාමාන්‍යයෙන් හොඳ decisions ගැනීමට අසමත් වන අතර government institutions වෙතින් expert guidance අවශ්‍ය වේ"
  - "Individuals economic decisions freely ගත යුතු නමුත් social සහ cultural matters සියල්ල පිළිබඳ state වෙත defer කළ යුතුය"
explanation: >-
  libertarian point of view එකකින්, individualsට තමන්ගේම decisions ගැනීමට right සහ responsibility දෙකම ඇත. මෙය left සිට right දක්වා conventional political families සමඟ වෙනස් වේ; ඔවුන් government එක individual කෙනෙකුගේ life තුළ සහ general economic life තුළ important decisions කිහිපයක් හෝ බොහොමයක් ගත යුතු බව විශ්වාස කරයි.
reviewed: false
