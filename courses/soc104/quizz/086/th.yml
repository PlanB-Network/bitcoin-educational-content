question: "หน้าที่สำคัญสามประการของตลาดเสรีตามที่ลิเบอร์ทาเรียนอธิบาย เมื่อนำมารวมกันแล้วก่อให้เกิดระบบการจัดระเบียบสังคมที่ทั้งมีประสิทธิภาพและมีจริยธรรมได้อย่างไร?"
answer: "ราคาให้เข็มทิศสำหรับการตัดสินใจ ตลาดเผยความพึงพอใจที่แท้จริงผ่านอุปสงค์และอุปทาน และการแลกเปลี่ยนเสรีทำให้ปัจเจกบุคคลกำหนดกิจการของตนเองตามคุณค่าส่วนบุคคลได้ โดยผสานประสิทธิภาพด้านข้อมูลเข้ากับอัตตาณัติทางศีลธรรม"
wrong_answers:
  - "ตลาดทำให้ความมั่งคั่งรวมสูงสุด ป้องกันการผูกขาดผ่านการแข่งขันตามธรรมชาติ และรับประกันการกระจายทรัพยากรอย่างเท่าเทียม โดยผสานผลิตภาพเข้ากับความยุติธรรมทางสังคม"
  - "ตลาดเสรีลดรายจ่ายของรัฐบาล กระตุ้นนวัตกรรมทางเทคโนโลยี และสร้างโอกาสการจ้างงาน โดยผสานความรับผิดชอบทางการคลังเข้ากับการเติบโตทางเศรษฐกิจ"
  - "ตลาดลดราคาผู้บริโภค เพิ่มคุณภาพสินค้าโดยการแข่งขัน และขยายการค้าระหว่างประเทศ โดยผสานความรุ่งเรืองภายในประเทศเข้ากับความร่วมมือระดับโลก"
explanation: >-
  เหตุผลแบบลิเบอร์ทาเรียนที่สนับสนุนตลาดเสรีตั้งอยู่บนหน้าที่สามประการที่เชื่อมโยงกัน ประการแรก ราคาเป็นตัวชี้วัดที่เชื่อถือได้สำหรับนำทางการตัดสินใจทางเศรษฐกิจและสังคม (เข็มทิศ) ประการที่สอง ตลาดเผยความพึงพอใจของปัจเจกบุคคลที่แท้จริงผ่านอุปสงค์และอุปทาน ประการที่สาม การแลกเปลี่ยนเสรีทำให้ผู้กระทำสามารถกำหนดกิจการของตนเองตามคุณค่าส่วนบุคคล Hayek แสดงให้เห็นว่าตลาดเสรีประสานข้อมูลที่กระจัดกระจายได้ดีกว่าการวางแผนจากศูนย์กลาง (ประสิทธิภาพ) ขณะที่ความยินยอมร่วมกันเคารพศักดิ์ศรีมนุษย์มากกว่าการบังคับ (ความยุติธรรม)
reviewed: false
