question: "دو side effect مورد استفاده در Simplicity برای کاربردهای Bitcoin و Liquid چیستند؟"
answer: "اثر Failure (یک استثنا از نوع 1) و اثر Reader (دسترسی به داده‌های محیط تراکنش)."
wrong_answers:
  - "اثر State (متغیرهای قابل تغییر) و اثر Writer (ثبت در یک لاگ تراکنش)."
  - "اثر IO (ارتباط شبکه‌ای) و اثر Memory (تخصیص حافظه پویا)."
  - "اثر Continuation (callbackها) و اثر Nondeterminism (چند مسیر اجرا)."
explanation: >-
  Simplicity دقیقاً از دو side effect برای کاربردهای بلاکچینی استفاده می‌کند. اثر Failure اجازه می‌دهد
  محاسبات متوقف شوند (مثلاً وقتی بررسی امضا ناموفق می‌شود)، و اثر Reader اجازه می‌دهد
  عبارت‌ها داده‌ها را از محیط تراکنش بخوانند. ترکیب‌گرهای هسته‌ای خالص می‌مانند —
  side effectها از طریق jets معرفی می‌شوند.
reviewed: true
