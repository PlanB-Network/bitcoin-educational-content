question: "En la cuestión de la regulación de las armas de fuego, ¿cuál es la diferencia crucial entre las posturas conservadora y libertaria?"
answer: "Ambas aceptan cierta regulación, pero los conservadores quieren reglas provenientes de una autoridad pública legítima, mientras que los libertarios quieren que las reglas surjan de los directamente afectados, como las asociaciones de ciudadanos y la competencia del mercado"
wrong_answers:
  - "Los conservadores se oponen a toda regulación de las armas de fuego, mientras que los libertarios aceptan un control gubernamental estricto por seguridad pública"
  - "Los conservadores quieren prohibir por completo las armas de fuego, mientras que los libertarios apoyan el acceso irrestricto a todas las armas"
  - "Los conservadores basan su postura en los derechos individuales, mientras que los libertarios basan la suya en la responsabilidad colectiva"
explanation: >-
  Tanto conservadores como libertarios coinciden en que es necesaria alguna forma de regulación para portar armas. La diferencia crucial está en quién establece esas reglas. Los conservadores insisten en que las regulaciones deben provenir de una autoridad pública encargada de salvaguardar el bien común (de arriba abajo). Los libertarios sostienen que la regulación debería surgir de los directamente afectados: profesionales de la seguridad, asociaciones de ciudadanos y competencia del mercado (de abajo arriba).
