question: "Какво иска левицата да законодателства и регулира?"
answer: "Икономиката — поради враждебност към икономическата свобода, капитализма и свободния пазар"
wrong_answers:
  - "Личния морал и религиозните практики — поради желание да се запазят традиционните институции"
  - "Имиграцията и националните граници — поради тревоги за културната идентичност и суверенитета"
  - "Технологиите и иновациите — поради страхове, че автоматизацията ще замени човешките работници"
explanation: >-
  Левицата дава приоритет на социалната справедливост и равенството, особено на икономическо ниво. Това води до нейната враждебност към икономическата свобода, капитализма и свободния пазар, както и до желанието ѝ да законодателства и регулира икономиката. Десницата, обратно, иска да законодателства върху морала и религията. Регулирането на имиграцията и технологиите не е основният фокус, описан тук.
reviewed: false
