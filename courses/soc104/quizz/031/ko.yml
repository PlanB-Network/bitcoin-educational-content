question: "정치 시스템의 의도적 정의가 분석 목적에 문제가 된다고 여겨지는 이유는 무엇인가요?"
answer: "모든 시스템이 정의, 형평, 자유 같은 유사한 목표를 추구한다고 주장하기 때문에 개념적 혼란을 낳기 때문입니다"
wrong_answers:
  - "그 정의들이 너무 정확하고 경직되어 정치 운동이 시간이 지나며 자연스럽게 진화할 여지를 남기지 않기 때문입니다"
  - "경제적 결과에 지나치게 집중하고 정치 생활의 문화적·사회적 차원을 무시하기 때문입니다"
  - "독립 연구자들이 거의 이용할 수 없는 기밀 정부 문서에 의존하기 때문입니다"
explanation: >-
  의도적 정의는 표방된 동기와 목표에 의존하지만, 모든 정치 시스템은 정의, 형평, 자유를 추구한다고 주장합니다. 이는 시스템들을 서로 구별할 수 없게 만듭니다. 반대로 구조적 분석은 시스템의 경험적이고 측정 가능한 결과와 그것이 사용하는 수단을 평가하여, 수사를 넘어 그 진정한 본성을 드러냅니다.
reviewed: false
