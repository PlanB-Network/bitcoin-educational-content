question: "What happens behind the scenes when the sender executes the tapcli assets send command?"
answer: "The node builds an on-chain Bitcoin transaction committing to the updated Merkle tree, generates proofs, and sends them to the receiver"
wrong_answers:
  - "The node opens a dedicated Lightning channel with the receiver, streams the full asset data, and closes the channel after final confirmation"
  - "The node broadcasts the complete asset metadata directly to the Bitcoin mempool and waits for miners to include it in a confirmed block"
  - "The node creates an off-chain state update signed jointly by both parties and periodically settles the aggregate balance fully on-chain"
explanation: >-
  When Alice executes tapcli assets send, her node constructs an on-chain Bitcoin transaction that commits to the updated Merkle tree reflecting the new ownership. It also generates cryptographic proof files and transmits them directly to Bob's node. The command returns an on-chain transaction ID that can be verified through any Bitcoin block explorer.
reviewed: false
