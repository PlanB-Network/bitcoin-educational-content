question: "Jaký společný základ sdílejí libertariáni a konzervativci a co je rozděluje?"
answer: "Sdílejí oddanost omezené vládě a odmítání nuceného egalitarismu, ale neshodují se na vojenském intervencionismu a sociálních politikách"
wrong_answers:
  - "Sdílejí podporu protekcionistickým obchodním politikám a národní obraně, ale neshodují se na roli náboženství ve veřejném životě"
  - "Sdílejí závazek k progresivnímu zdanění a sociálním programům, ale neshodují se na imigrační politice"
  - "Sdílejí odpor k volnému obchodu a legalizaci drog, ale neshodují se na velikosti federální vlády"
explanation: >-
  Libertariáni i konzervativci hájí omezenou vládu, odmítají nucený egalitarismus, staví se proti veřejnému dluhu a brání práva států. Libertariáni však odmítají vojenský intervencionismus neokonzervativců, staví se proti konzervativním sociálním politikám a dotacím, odsuzují prohibici drog a odmítají protekcionismus. Spojenectví je skutečné, ale vnitřně napjaté.
