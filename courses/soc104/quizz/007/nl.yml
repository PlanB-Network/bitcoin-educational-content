question: "Welke positie staat in de Nolan-diamant bovenaan en vertegenwoordigt maximale vrijheid?"
answer: "Libertarisme, dat de grootste economische en persoonlijke vrijheid ondersteunt"
wrong_answers:
  - "Conservatisme, dat traditionele waarden en economische vrijheid ondersteunt"
  - "Centrisme, dat alle politieke posities op pragmatische wijze in evenwicht brengt"
  - "Socialisme, dat persoonlijke vrijheid en sociale gelijkheid ondersteunt"
explanation: >-
  Libertarisme bevindt zich bovenaan de Nolan-diamant als het tegenovergestelde van statisme. Het vertegenwoordigt degenen die de grootst mogelijke mate van zowel economische als persoonlijke vrijheid ondersteunen. Conservatisme staat rechts (hoge economische, lage persoonlijke vrijheid), socialisme links (hoge persoonlijke, lage economische vrijheid) en centrisme in het midden.
