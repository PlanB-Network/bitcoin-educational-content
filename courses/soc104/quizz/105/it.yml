question: "Considerando l'intera argomentazione di questo corso, in che modo Bitcoin incarna simultaneamente la critica libertaria al costruttivismo, l'impegno cypherpunk all'azione e la difesa individualista dell'autonomia morale?"
answer: "Bitcoin sostituisce la moneta pianificata centralmente con un ordine di mercato spontaneo (anti-costruttivismo), trasforma l'ideale astratto della libertà finanziaria in codice funzionante (azione cypherpunk) e restituisce all'individuo proprietà sovrana e privacy (autonomia morale)"
wrong_answers:
  - "Bitcoin usa la governance democratica per definire la politica monetaria (anti-costruttivismo), pubblica contenuti educativi sulla libertà finanziaria (azione cypherpunk) e permette agli individui di votare sulle modifiche del protocollo (autonomia morale)"
  - "Bitcoin elimina ogni regolamentazione finanziaria (anti-costruttivismo), crea una comunità di sviluppatori che fanno lobbying per la deregolamentazione (azione cypherpunk) e dà agli individui ricchi più controllo sulla politica monetaria (autonomia morale)"
  - "Bitcoin decentralizza l'infrastruttura server in più paesi (anti-costruttivismo), usa licenze open-source per condividere liberamente la tecnologia (azione cypherpunk) e fornisce piattaforme di social media anonime per il dissenso politico (autonomia morale)"
explanation: >-
  Bitcoin si colloca all'intersezione di tre tradizioni intellettuali esplorate nel corso. Incarna l'argomento anti-costruttivista sostituendo la moneta fiat pianificata centralmente con un ordine monetario spontaneo e decentralizzato che nessun pianificatore centrale può controllare. Realizza l'imperativo cypherpunk di scrivere codice trasformando ideali astratti di libertà finanziaria e privacy in tecnologia funzionante. E serve la difesa individualista dell'autonomia morale consentendo proprietà sovrana, proteggendo i frutti del lavoro e preservando la privacy, permettendo a ciascuno di essere padrone della propria vita.
