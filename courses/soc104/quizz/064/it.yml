question: "In che modo differivano gli approcci economici della Germania di Hitler e dell'Unione Sovietica di Stalin, nonostante i loro metodi totalitari condivisi?"
answer: "La Germania nazista mantenne un'apparenza di proprietà privata subordinando il settore privato agli obiettivi dello Stato, mentre lo stalinismo abolì ogni proprietà privata e pianificò completamente l'economia"
wrong_answers:
  - "La Germania nazista nazionalizzò completamente tutte le industrie, mentre il regime di Stalin consentì un'impresa privata limitata in agricoltura"
  - "La Germania nazista promosse il libero commercio internazionale per finanziare il riarmo, mentre lo stalinismo impose un completo isolamento economico"
  - "La Germania nazista si basò sulla cooperazione volontaria delle imprese con lo Stato, mentre lo stalinismo usò solo il lavoro forzato"
explanation: >-
  Sebbene entrambi i regimi usassero metodi politici identici (culto della personalità, sorveglianza totale, eliminazione sistematica dell'opposizione), i loro modelli economici differivano nella forma. La Germania nazista non abolì formalmente la proprietà privata, ma subordinò completamente il settore privato agli obiettivi dello Stato, come la guerra e il riarmo, imponendo l'autarchia economica. Lo stalinismo andò oltre abolendo ogni proprietà privata, attuando piani quinquennali e controllando direttamente tutta la produzione e la distribuzione.
