question: Lightning送金のサブマリンスワップで、スワッププロバイダーがLightningインボイスを支払った後に、ロックされたLiquidの資金を受け取れるようにしている暗号学的な要素は何ですか？
answer: Lightningの支払いで得られるペイメント・プリイメージが、エスクローされたLiquidの資金のロックを解除する鍵になる
wrong_answers:
  - 最初のLiquidのロックアップ・トランザクションで生成されたハッシュタイムロック・コントラクトの署名によってアクセスできる
  - WebSocket接続のメタデータに、プロバイダーへの資金の解放を認可するロック解除キーが含まれている
  - "Lightningの支払いの完了が確認されると、スワッププロバイダーの秘密鍵で自動的に資金のロックが解除される"
explanation: |
  ペイメント・プリイメージは、Lightningの支払いが正常に完了したことを証明する暗号学的な領収書です。サブマリンスワップでは、このプリイメージがエスクローされたLiquidの資金のロック解除キーとして働き、アトミック性を保証します。つまり、スワッププロバイダーは実際にLightningインボイスを支払った場合にしかLiquidの資金を受け取れません。他の選択肢は、必要な支払いの証明にはならない一般的な暗号要素か、アトミックスワップのトラストレスな性質を損なう誤った仕組みを説明しています。