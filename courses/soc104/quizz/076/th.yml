question: "อะไรมีความสำคัญเหนือเสรีภาพในปรัชญาการเมืองแบบอนุรักษนิยม?"
answer: "ระเบียบและจารีต ซึ่งต้องถูกวางให้มั่นคงก่อนจึงจะเห็นคุณค่าของเสรีภาพได้"
wrong_answers:
  - "ความยุติธรรมทางสังคมและความเท่าเทียม ซึ่งต้องได้รับการรับประกันก่อนที่ปัจเจกบุคคลจะเป็นอิสระได้อย่างแท้จริง"
  - "ประสิทธิภาพทางเศรษฐกิจและผลลัพธ์เชิงปฏิบัติ ซึ่งเป็นตัวกำหนดว่าเมื่อใดเสรีภาพจึงเหมาะสม"
  - "สิทธิในทรัพย์สินของปัจเจกบุคคล ซึ่งต้องได้รับการคุ้มครองก่อนที่จะมอบเสรีภาพอื่นใด"
explanation: >-
  สำหรับฝ่ายอนุรักษนิยม ระเบียบและจารีตมีความสำคัญเหนือเสรีภาพ พวกเขาให้เหตุผลว่าเสรีภาพที่มากเกินไปก่อให้เกิดความโกลาหลและความไร้ระเบียบทางสังคม ดังนั้นเสรีภาพจะมีคุณค่าได้ก็ต่อเมื่อระเบียบถูกวางให้มั่นคงแล้วเท่านั้น สิ่งนี้ตรงกันข้ามกับมุมมองแบบสังคมนิยมที่ให้ความสำคัญกับความยุติธรรม หรือจุดเน้นของสายกลางที่อยู่ที่ประสิทธิภาพ
reviewed: false
