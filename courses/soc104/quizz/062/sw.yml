question: "Tawala zote za kitotalitari ziliingiaje madarakani?"
answer: "Kupitia mapinduzi ya vurugu yaliyohalalisha kufuta kabisa mfumo uliotangulia"
wrong_answers:
  - "Kupitia mageuzi ya kisheria ya polepole ndani ya taasisi zilizopo za kidemokrasia"
  - "Kupitia mapinduzi ya kijeshi yaliyoandaliwa na mataifa ya kigeni yaliyotaka udhibiti wa kikanda"
  - "Kupitia harakati za amani za umma zilizoshinda uchaguzi wa wananchi kwa tofauti kubwa"
explanation: >-
  Tawala zote za kitotalitari ziliingia madarakani kupitia mapinduzi ya vurugu. Mapinduzi haya hutimiza madhumuni mawili: huharibu kimwili utaratibu wa zamani na huhalalisha kiitikadi matumizi ya vurugu kama jambo la lazima kwa ajili ya kujenga jamii mpya. Hili hutofautisha unyakuzi wa kitotalitari na mpito wa kidemokrasia, mapinduzi yanayoungwa mkono na mataifa ya kigeni, au ushindi wa amani wa uchaguzi.
