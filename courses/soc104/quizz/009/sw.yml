question: "Kwa nini mhimili wima (juu-chini) unachukuliwa kuwa wa msingi zaidi kuliko mhimili mlalo (kushoto-kulia) katika mchoro wa Nolan?"
answer: "Kwa sababu unaonyesha mgawanyiko wa kweli kati ya wale wanaotetea uhuru mkubwa zaidi wa mtu binafsi na wale wanaopendelea udhibiti mkubwa zaidi wa dola"
wrong_answers:
  - "Kwa sababu unapima uzalishaji wa kiuchumi kwa usahihi zaidi kuliko mhimili mlalo unavyopima sera za kijamii"
  - "Kwa sababu migogoro mingi ya kisiasa katika historia imekuwa kuhusu utambulisho wa kitamaduni badala ya utawala"
  - "Kwa sababu mhimili mlalo unatumika tu kwa demokrasia za kisasa huku mhimili wima ukiwa wa ulimwengu mzima"
explanation: >-
  Mhimili wa msingi ni ule wa wima kwa sababu unanasa swali kuu la kisiasa: ni kwa kiwango gani dola inapaswa kudhibiti matendo ya binadamu? Mhimili wa kushoto-kulia huonyesha tu mielekeo tofauti (haki ya kijamii dhidi ya mapokeo), lakini pande zote mbili zinaweza kuchukua nafasi ileile kwenye mhimili wima kama wanaounga mkono udola. Mhimili wima huonyesha kama mtu anataka kulazimisha maono yake kwa nguvu au anaheshimu uhuru wa mtu binafsi.
reviewed: false
