question: "为什么二维模型认为，大多数政治议题可以分为经济与个人两类？"
answer: "因为经济议题关乎你作为生产者与消费者所做的事，而个人议题关乎你的私人关系、信念与身体自主"
wrong_answers:
  - "因为所有政治辩论最终都简化为对税率水平与宗教实践的分歧"
  - "因为政府历史上只监管两件事：市场与军事"
  - "因为政治哲学家自古以来总是将物质关切与精神关切分开"
explanation: >-
  二维模型基于这样一种理念：政治议题可分为两大类。经济自由涵盖生产、消费、贸易、就业与金钱管理。个人自由涵盖私人关系、观点、信念，以及关于自己身体与心智的选择。这种分离让政治立场的映射比单一左右轴细致得多。
reviewed: false
