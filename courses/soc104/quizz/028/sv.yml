question: "Vilken gemensam grund delar libertarianer och konservativa, och vad skiljer dem åt?"
answer: "De delar anknytning till begränsad statsmakt och avvisande av påtvingad egalitarism, men är oense om militär interventionism och socialpolitik"
wrong_answers:
  - "De delar stöd för protektionistisk handelspolitik och nationellt försvar, men är oense om religionens roll i det offentliga livet"
  - "De delar ett engagemang för progressiv beskattning och välfärdsprogram, men är oense om invandringspolitik"
  - "De delar motstånd mot frihandel och legalisering av droger, men är oense om den federala statens storlek"
explanation: >-
  Libertarianer och konservativa förespråkar båda begränsad statsmakt, avvisar påtvingad egalitarism, motsätter sig offentlig skuld och försvarar delstaters rättigheter. Libertarianer avvisar dock neokonservativas militära interventionism, motsätter sig konservativ socialpolitik och subventioner, fördömer drogförbud och avvisar protektionism. Alliansen är verklig men i grunden ansträngd.
reviewed: false
