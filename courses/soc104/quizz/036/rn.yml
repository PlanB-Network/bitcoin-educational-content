question: "Insiguro y'imiterere y'umugwi wa politike yibanda ku ki?"
answer: "Ukuntu uwo mugwi ukora vy'ukuri n'ibiranga bishobora kwihwezwa, nk'urugero rw'ubugenzuzi bwa Leta"
wrong_answers:
  - "Intumbero zivugwa n'imigambi myiza yatangajwe n'abashinze uwo mugwi n'abawurongoye"
  - "Inkomoko zo mu mateka z'uwo mugwi wa politike n'ubuzima bw'abiyumvirizi bawo bakuru"
  - "Igitigiri c'imigambwe ya politike yemerewe n'incuro amatora ya demokarasi aba"
explanation: >-
  Insiguro z'imiterere zibanda ku kuntu imigwi ya politike ikora vy'ukuri no ku biranga bishobora kwihwezwa. Nk'akarorero, sosiyalizimu mu miterere yayo irangwa n'ukuba Leta iri hose. Ubu buryo burahushanye n'insiguro zishingiye ku migambi, zubakira ku mvo n'intumbero zivugwa. Uburyo bw'imiterere butuma habaho isuzuma rirushirije kuba iritagira aho rihengamiye, rishingiye ku bivamwo bipimika.
