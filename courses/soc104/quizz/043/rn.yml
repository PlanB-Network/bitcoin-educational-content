question: "Ni irihe tandukaniro ry'ishingiro ryatandukanije abasosiyaliste kuva mu ntango z'ikinjana ca mirongo ibiri?"
answer: "Abasosiyaliste ba revolisiyo barondera gufata ubutegetsi biciye mu nguvu, bagereranijwe n'abasosiyaliste b'amavugurura barondera impinduka biciye mu matora ya demokarasi"
wrong_answers:
  - "Abasosiyaliste bo mu bisagara bibanda ku bakozi bo mu nganda, bagereranijwe n'abasosiyaliste bo mu misozi batunganya amakomini y'uburimyi"
  - "Abasosiyaliste b'igihugu bashira imbere igihugu cabo, bagereranijwe n'abasosiyaliste mpuzamakungu bashigikira revolisiyo y'isi yose"
  - "Abasosiyaliste b'incabwenge bandika ivyiyumviro, bagereranijwe n'abasosiyaliste b'abaharanira impinduka batunganya imyigaragambyo y'abakozi"
explanation: >-
  Kuva mu ntango z'ikinjana ca mirongo ibiri, itandukaniro ry'ishingiro ryatandukanije abasosiyaliste ba revolisiyo, barwanya uburenganzira ku mutungo kandi barondera gusenya ikibano ca kapitalizimu biciye mu nguvu canke mu butegetsi bw'igitugu bwa proletariat, n'abasosiyaliste b'amavugurura, barondera ubutungane bw'imibano biciye mu matora ya demokarasi no mu makori, mu gihe bemera kapitalizimu vy'agateganyo. Iryo tandukana ryahinduye amateka yose yakurikiye y'imigwi ya sosiyaliste.
