question: "ใน Nolan diamond ตำแหน่งใดอยู่ด้านบนและแทนเสรีภาพสูงสุด?"
answer: "ลิเบอร์ทาเรียน ซึ่งสนับสนุนเสรีภาพทางเศรษฐกิจและส่วนบุคคลสูงสุด"
wrong_answers:
  - "อนุรักษนิยม ซึ่งสนับสนุนค่านิยมแบบดั้งเดิมและเสรีภาพทางเศรษฐกิจ"
  - "สายกลาง ซึ่งสร้างสมดุลระหว่างจุดยืนทางการเมืองทั้งหมดอย่างเป็นเชิงปฏิบัติ"
  - "สังคมนิยม ซึ่งสนับสนุนเสรีภาพส่วนบุคคลและความเท่าเทียมทางสังคม"
explanation: >-
  ลิเบอร์ทาเรียนอยู่ด้านบนของ Nolan diamond ในฐานะตรงข้ามกับรัฐนิยม มันแทนผู้ที่สนับสนุนเสรีภาพทางเศรษฐกิจและเสรีภาพส่วนบุคคลในระดับสูงสุด อนุรักษนิยมอยู่ด้านขวา (เสรีภาพทางเศรษฐกิจสูง เสรีภาพส่วนบุคคลต่ำ) สังคมนิยมอยู่ด้านซ้าย (เสรีภาพส่วนบุคคลสูง เสรีภาพทางเศรษฐกิจต่ำ) และสายกลางอยู่ตรงกลาง
reviewed: false
