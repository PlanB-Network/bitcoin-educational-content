question: "No losango de Nolan, qual posição fica no topo e representa a liberdade máxima?"
answer: "O libertarianismo, que apoia o maior grau de liberdade econômica e pessoal"
wrong_answers:
  - "O conservadorismo, que apoia valores tradicionais e liberdade econômica"
  - "O centrismo, que equilibra todas as posições políticas de forma pragmática"
  - "O socialismo, que apoia a liberdade pessoal e a igualdade social"
explanation: >-
  O libertarianismo ocupa o topo do losango de Nolan como o oposto do estatismo. Ele representa aqueles que apoiam o maior grau tanto de liberdade econômica quanto de liberdade pessoal. O conservadorismo fica à direita (alta liberdade econômica, baixa liberdade pessoal), o socialismo à esquerda (alta liberdade pessoal, baixa liberdade econômica) e o centrismo no meio.
