question: BitcoinからLiquidへのペグインで、102回の承認を待つ主な目的は何ですか？
answer: L-BTCを発行する前に、Bitcoinブロックチェーンの再編成（reorg）から保護すること
wrong_answers:
  - フェデレーションがユーザーの本人確認とコンプライアンスの確認を行う時間を十分に確保すること
  - 受け取るトランザクションを処理するのに十分な容量がLiquidネットワークにあることを確認すること
  - フェデレーションのメンバーによる11-of-15のマルチシグ承認のための時間を確保すること
explanation: |
  102回の承認（約17時間）を待つ期間は、Bitcoinブロックチェーンの再編成から保護するために設けられています。Bitcoinのファイナリティは確率的なため、ブロックが再編成されてトランザクションが無効になる可能性はわずかながら常に存在します。102回の承認を待つことで、フェデレーションのアドレスに資金を送ったBitcoinトランザクションが十分に深く埋もれ、取り消される可能性が極めて低くなります。これにより、Liquid上でL-BTCが発行されたのに、元のBitcoinトランザクションが再編成によって取り消されるという事態を防げます。他の選択肢が誤りである理由は次のとおりです。本人確認は自動化されたペグインの手順には含まれず、ネットワークの容量はこのような待ち時間を必要とする制約ではなく、11-of-15のマルチシグ承認はペグインではなくペグアウトで使われます。