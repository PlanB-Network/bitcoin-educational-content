question: "چرا sig-all-hash به جای گرفتن داده تراکنش به عنوان یک ورودی نوع‌دار، از اثر Reader استفاده می‌کند؟"
answer: تا jet بتواند از PrecomputedTransactionData استفاده کند و روی یک محیط ثابت در زمان ثابت اجرا شود.
wrong_answers:
  - چون سیستم نوع Simplicity اساساً نمی‌تواند داده تراکنش را به صورت یک نوع نمایش دهد.
  - چون اثر Reader سریع‌تر از عبور دادن آن داده از درخت ترکیب‌گر است.
  - چون داده تراکنش آن‌قدر بزرگ است که در سیستم نوع با اندازه ثابت Simplicity جا نمی‌شود.
explanation: >-
  اگر sig-all-hash یک نوع ورودی TxEnv می‌گرفت، برنامه‌ها می‌توانستند کپی‌های تغییریافته‌ای از داده تراکنش را
  به jet بدهند، و این مانع استفاده آن از hashهای ازپیش‌محاسبه‌شده می‌شد. با اثر Reader، jet فقط
  به یک محیط تراکنش ثابت و تغییرناپذیر دسترسی دارد، بنابراین پیاده‌سازی آن می‌تواند با اطمینان از
  PrecomputedTransactionData استفاده کند و برای هر بررسی امضا در زمان ثابت اجرا شود، و از مشکل hashing درجه‌دومی
  که Bitcoin Script اولیه گرفتار آن بود اجتناب کند.
reviewed: true
