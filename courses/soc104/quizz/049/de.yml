question: "Was unterscheidet Neokonservative von Paläokonservativen in ihrem außenpolitischen Ansatz?"
answer: "Neokonservative rechtfertigen militärischen Interventionismus, um Demokratie zu verbreiten, während Paläokonservative eine stärker isolationistische Außenpolitik verteidigen"
wrong_answers:
  - "Neokonservative lehnen jede militärische Handlung ab und bevorzugen Diplomatie, während Paläokonservative Präventivschläge gegen potenzielle Bedrohungen unterstützen"
  - "Neokonservative konzentrieren sich ausschließlich auf Wirtschaftssanktionen, während Paläokonservative den Aufbau internationaler Koalitionen für gemeinsame Militäroperationen befürworten"
  - "Neokonservative und Paläokonservative stimmen in der Außenpolitik überein, unterscheiden sich aber stark bei der innenpolitischen Wirtschaftsregulierung"
explanation: >-
  Ab den 2000er Jahren beteiligten sich Neokonservative zunehmend daran, militärischen Interventionismus zu rechtfertigen, um Demokratie weltweit zu verankern, insbesondere nach dem 11. September 2001. Als Reaktion beanspruchten traditionelle Konservative die Bezeichnung 'paläokonservativ', um sich abzugrenzen. Paläokonservative kritisieren militärischen Interventionismus, verteidigen eine stärker isolationistische Außenpolitik und legen größeren Wert auf nationale und kulturelle Identität.
reviewed: false
