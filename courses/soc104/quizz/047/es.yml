question: "¿A quién se cita a menudo como la figura fundadora del conservadurismo moderno?"
answer: "A Edmund Burke, quien defendió la preservación de las instituciones y las tradiciones frente a los cambios radicales de la Revolución francesa"
wrong_answers:
  - "A Karl Marx, quien desarrolló la teoría de la lucha de clases y el materialismo histórico en el siglo XIX"
  - "A John Locke, quien articuló la teoría de los derechos naturales y el contrato social en el siglo XVII"
  - "A Adam Smith, quien escribió La riqueza de las naciones y fundó la disciplina de la economía clásica"
explanation: >-
  Edmund Burke es citado a menudo como la figura fundadora del conservadurismo por su oposición a la Revolución francesa. Sus Reflexiones sobre la Revolución en Francia (1790) defendieron la prudencia y la reforma gradual por encima del cambio radical. Creía que la sociedad debía avanzar no haciendo borrón y cuenta nueva, sino mediante reformas incrementales que preservaran instituciones y tradiciones probadas.
