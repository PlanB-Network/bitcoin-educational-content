question: "राज्य-वित्तपोषित सामाजिक सहायता कार्यक्रम कैसे विकृत प्रभाव पैदा कर सकते हैं, जिससे केवल इरादों पर निर्भर रहने का खतरा स्पष्ट होता है?"
answer: "वे निर्भरता पैदा कर सकते हैं, काम करने के प्रोत्साहन हटा सकते हैं, और लूट के समान हो सकते हैं क्योंकि धन पहले उन लोगों से लेना पड़ता है जिन्होंने संपदा पैदा की"
wrong_answers:
  - "वे अत्यधिक व्यक्तिगत बचत को प्रोत्साहित करते हैं, उपभोक्ता खर्च घटाते हैं, और व्यापक अर्थव्यवस्था में अपस्फीति पैदा करते हैं"
  - "वे श्रम लागत को सरकार पर स्थानांतरित करके और प्रतिस्पर्धी वेतन की आवश्यकता कम करके निजी उद्यम को मजबूत करते हैं"
  - "वे वर्ग भेदों को इतनी पूरी तरह समाप्त कर देते हैं कि सामाजिक गतिशीलता अनावश्यक हो जाती है और नवाचार ठहर जाता है"
explanation: >-
  Friedman चेतावनी देते हैं कि उदार इरादे हानिकारक परिणाम पैदा कर सकते हैं जब वे मानव प्रोत्साहनों के कठोर विश्लेषण की उपेक्षा करते हैं। राज्य-वित्तपोषित सहायता कार्यक्रम निर्भरता पैदा करने, काम करने का कोई प्रोत्साहन न बनाने, और लूट का एक रूप बनने का जोखिम रखते हैं, क्योंकि धन पहले संपदा पैदा करने वालों से लेना पड़ता है। गरीबी में कमी और दक्षता जैसे मापनीय परिणामों को उदात्त इरादों पर प्राथमिकता मिलनी चाहिए।
reviewed: false
