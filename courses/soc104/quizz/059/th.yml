question: "หลักความยุติธรรมสองข้อของ John Rawls คืออะไร?"
answer: "เสรีภาพเท่าเทียมสำหรับทุกคน และหลักความแตกต่างที่อนุญาตให้มีความเหลื่อมล้ำได้ก็ต่อเมื่อมันเป็นประโยชน์ต่อผู้เสียเปรียบที่สุด"
wrong_answers:
  - "สิทธิออกเสียงเลือกตั้งสากลสำหรับพลเมืองทุกคน และภาษีก้าวหน้าเพื่อจัดหาเงินให้บริการสาธารณะ"
  - "เสรีภาพในการพูดโดยไม่มีข้อจำกัด และการกระจายความมั่งคั่งซ้ำแบบบังคับเพื่อบรรลุความเท่าเทียม"
  - "การคุ้มครองสิทธิทรัพย์สินส่วนตัว และหลักการไม่รุกรานที่ใช้กับการกระทำทั้งหมดของรัฐ"
explanation: >-
  Rawls เสนอหลักสองข้อ: ข้อแรก เสรีภาพเท่าเทียมสำหรับทุกคน (รากฐานของประชาธิปไตย) และข้อที่สอง หลักความแตกต่าง ซึ่งอนุญาตให้มีความเหลื่อมล้ำได้ก็ต่อเมื่อมันเป็นประโยชน์ต่อสมาชิกในสังคมที่เสียเปรียบที่สุด นี่หมายความว่าคนหนึ่งมีสิทธิร่ำรวยได้ ตราบใดที่การกระจายซ้ำเปิดให้ผู้ได้รับความเอื้อเฟื้อน้อยที่สุดได้รับประโยชน์ด้วย ตัวเลือกอื่น ๆ ผสมองค์ประกอบจากปรัชญาการเมืองต่าง ๆ เข้าด้วยกัน
reviewed: false
