question: "Proč je svislá osa (shora dolů) v Nolanově diagramu považována za zásadnější než vodorovná osa (levice–pravice)?"
answer: "Protože odhaluje skutečné dělení mezi těmi, kdo hájí maximální individuální svobody, a těmi, kdo upřednostňují maximální státní kontrolu"
wrong_answers:
  - "Protože měří ekonomický výkon přesněji než vodorovná osa měří společenské politiky"
  - "Protože většina politických konfliktů v dějinách se týkala spíše kulturní identity než vládnutí"
  - "Protože vodorovná osa se vztahuje pouze na moderní demokracie, zatímco svislá osa je univerzální"
explanation: >-
  Základní osa je svislá, protože zachycuje podstatnou politickou otázku: do jaké míry má stát kontrolovat lidské jednání? Osa levice–pravice pouze odráží různé citlivosti (sociální spravedlnost versus tradice), ale obě strany mohou na svislé ose zaujímat stejnou etatistickou pozici. Svislá osa ukazuje, zda někdo chce svou vizi vnucovat silou, nebo respektuje individuální svobodu.
reviewed: false
