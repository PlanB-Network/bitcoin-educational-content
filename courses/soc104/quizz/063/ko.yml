question: "고전적 전제정과 전체주의 사이에서 Hannah Arendt가 제시한 핵심 구분은 무엇인가요?"
answer: "전체주의는 사람들을 폭정적 규칙에 복종시키는 데 그치지 않고 인간이 독립적으로 행동할 수 없게 만들어 정치 자체를 부정합니다"
wrong_answers:
  - "고전적 전제정은 경제를 통제하는 반면 전체주의는 정치 및 군사 제도만 통제합니다"
  - "전체주의는 단순히 전제정의 더 극단적인 형태이며, 억압의 규모만 다를 뿐입니다"
  - "고전적 전제정은 자신의 지배를 정당화하기 위해 이데올로기를 사용하는 반면 전체주의는 순수하게 군사력에만 의존합니다"
explanation: >-
  Arendt는 전체주의가 고전적 전제정과 근본적으로 다르다고 주장합니다. 그것은 단순히 더 극단적인 폭정이 아니라 인간을 불필요한 존재로 만들고 독립적 행동 능력을 파괴하는 체제입니다. Arendt에게 정치는 한 민족이 자신의 운명을 스스로 손에 쥘 수 있는 능력이며, 전체주의는 바로 이 능력의 부정입니다. 그래서 전체주의는 전제정과 질적으로 다릅니다.
