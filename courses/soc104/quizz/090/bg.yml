question: "Защо Mises подчертава, че индивидуализмът не трябва да се бърка със самодостатъчност или мизантропия?"
answer: "Защото индивидуализмът насърчава сътрудничеството и сдружаването, при условие че те почиват върху свободното съгласие на участниците, признавайки, че хората развиват пълния си потенциал чрез доброволни отношения с другите"
wrong_answers:
  - "Защото индивидуализмът изисква хората да се присъединяват към задължителни граждански организации, за да се гарантира, че допринасят за общото благо"
  - "Защото индивидуализмът означава, че всеки човек трябва да разчита изцяло на държавата за услуги, които не може да осигури сам"
  - "Защото индивидуализмът изисква хората да се конкурират помежду си във всички области, за да докажат личното си превъзходство"
explanation: >-
  Mises подчертава, че човешкото същество е социално създание. Индивидуализмът не означава изолация. Той насърчава сътрудничеството и сдружаването при условие, че те почиват върху свободното съгласие на участниците. Човешкото същество може да развие пълния си потенциал само във връзка с другите, но това сътрудничество трябва да бъде доброволно, а не наложено от колективна власт.
reviewed: false
