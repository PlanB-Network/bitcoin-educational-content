question: При правилата за типизиране с „по-малки типове в предпоставките“ кои основни комбинатори действително преместват данни по време на изпълнение?
answer: Само iden и comp; останалите седем се имплементират с нищо повече от служебно проследяване.
wrong_answers:
  - Само take и drop; извличането на един компонент принуждава машината да го копира извън product-а.
  - Само pair и case; дублирането на входа за два клона и разпращането по таг разместват данни.
  - Само injl и injr; добавянето на таг пренаписва стойността в по-голямо sum-type представяне.
explanation: >-
  Противно на интуицията, комбинаторите, които изглеждат като достъп до данни
  (take, drop, pair, case, injl, injr), не изискват копиране: тъй като
  предпоставките в правилата за типизиране включват по-малки типове от техните
  заключения, Bit Machine може да ги имплементира само със служебно проследяване.
  Само iden, който копира целия си вход към изхода си, и comp, който материализира
  междинна стойност, подавана от f към g, действително преместват данни.
reviewed: false
