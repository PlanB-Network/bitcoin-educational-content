question: "Ako libertariáni chápu vzťah medzi súkromným vlastníctvom a slobodou?"
answer: "Súkromné vlastníctvo je prirodzené právo, ktoré predchádza zákonu aj štátu, a je samotným základom slobody"
wrong_answers:
  - "Súkromné vlastníctvo je spoločenská konvencia vytvorená štátom, ktorú možno zrušiť, keď spôsobuje nerovnosť"
  - "Súkromné vlastníctvo je užitočné pre ekonomickú efektívnosť, ale nemá nijaký inherentný morálny ani filozofický význam"
  - "Súkromné vlastníctvo by malo existovať iba pre osobný majetok, nie pre produktívne aktíva alebo pôdu"
explanation: >-
  Libertariáni obhajujú súkromné vlastníctvo ako prirodzené právo, ktoré predchádza zákonu aj štátu. Tvrdia, že ak jednotlivec vlastní svoje vlastné telo, vlastní aj svoju prácu a jej plody. Vlastníctvo hmotných statkov je rozšírením seba-vlastníctva. To ostro kontrastuje s pohľadom libertaires, podľa ktorého je vlastníctvo spoločenskou konvenciou alebo zdrojom útlaku.
