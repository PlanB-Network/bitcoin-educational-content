question: "In the Nolan diamond, which position sits at the top and represents maximum freedom?"
answer: "Libertarianism, supporting the greatest economic and personal freedom"
wrong_answers:
  - "Conservatism, supporting traditional values and economic liberty"
  - "Centrism, balancing all political positions in a pragmatic way"
  - "Socialism, supporting personal liberty and social equality"
explanation: >-
  Libertarianism occupies the top of the Nolan diamond as the opposite of statism. It represents those who support the greatest degree of both economic and personal freedom. Conservatism sits to the right (high economic, low personal freedom), socialism to the left (high personal, low economic freedom), and centrism in the middle.
reviewed: false
