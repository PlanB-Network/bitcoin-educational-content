question: "Ibibanza vy'abakonservateur n'aba-libertarian ku mushahara fatizo bitandukana gute mu mpamvu zavyo, naho bose bashigikira kuwukuraho?"
answer: "Abakonservateur baremera uruhara runaka rwa Leta mu kugena imishahara igihe rudatambamiye ubushobozi bwo guhiganwa, mu gihe aba-libertarian babona umushahara fatizo nk'uguhatira mu nyifato runtu ku mwidegemvyo wo guha akazi no gukora ubudandaji"
wrong_answers:
  - "Abakonservateur barwanya umushahara fatizo kuko utera itumbagira ry'ibiciro, mu gihe aba-libertarian bawurwanya kuko uha ububasha bwinshi amasendika y'abakozi"
  - "Abakonservateur bashaka ko imishahara igenwa n'inzego z'idini n'iz'ikibano, mu gihe aba-libertarian bashaka ko imishahara igenwa n'ivyigwa vy'isoko vyemejwe na Leta"
  - "Abakonservateur bemera ko imishahara fatizo ikwiye guhinduka hisunzwe uturere, mu gihe aba-libertarian bemera ko umushahara umwe ungana ukwiye gukoreshwa mu gihugu cose"
explanation: >-
  Bose bashigikira kugabanya canke gukuraho umushahara fatizo, ariko impamvu zabo ziratandukanye mu buryo bw'ibanze. Abakonservateur baremera uruhara runaka rwa Leta mu kugena imishahara ariko bagashimika ko ruguma ruto kandi rukisunga uko ibintu vyifashe, bashira imbere ubushobozi bwo guhiganwa. Aba-libertarian bafata ikibanza gikomeye kuruta gishingiye ku nyifato runtu: umushahara fatizo ni uguhatira ku mwidegemvyo wo guha akazi no gukora ubudandaji. Iyo aba-libertarian bavuze "isoko," baba bashaka kuvuga amasezerano yumvikanyweko n'impande zibiri ata kwivanga kwa Leta.
