question: Ni igiki gifise intumbero y’amadosiye ya revNNNNN.dat zibikwa hamwe iruhande na blkNNNNN.dat?
answer: Kugarura UTXO yashizweho mu gihe co gusubira gutunganya
wrong_answers:
  - Gusubiza UTXO set mu gihe ca Hard Fork
  - Gusubiza Mempool mu gihe ca Hard Fork
  - Gusubiza Mempool mu gihe ca reorganization
explanation: |
  Buri revNNNNN.dat irimo amakuru akoreshwa mu gusubira inyuma (undo) ingaruka za block ku UTXO set, bigafasha gucunga neza reorganizations.
reviewed: true
