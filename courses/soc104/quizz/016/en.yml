question: "What does the left want to legislate and regulate?"
answer: "The economy, driven by hostility to economic freedom, capitalism, and the free market"
wrong_answers:
  - "Personal morality and religious practices, driven by a desire to preserve traditional institutions"
  - "Immigration and national borders, driven by concerns about cultural identity and sovereignty"
  - "Technology and innovation, driven by fears about automation replacing human workers"
explanation: >-
  The left gives priority to social justice and equality, particularly on the economic level. This leads to its hostility toward economic freedom, capitalism, and the free market, and its desire to legislate and regulate the economy. The right, by contrast, wants to legislate on morality and religion. Immigration and technology regulation are not the primary focus described here.
reviewed: false
