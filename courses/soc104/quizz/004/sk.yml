question: "Aký spoločný bod majú ľavicové a pravicové politické strany napriek svojmu zdanlivému protikladu?"
answer: "Obe obhajujú právo štátu riadiť životy ľudí prostredníctvom regulácií a daní"
wrong_answers:
  - "Obe presadzujú úplné zrušenie štátnych zásahov v ekonomických otázkach"
  - "Obe uprednostňujú individuálnu slobodu pred kolektívnou organizáciou spoločnosti"
  - "Obe odmietajú používanie menovej politiky ako nástroja vládnych výdavkov"
explanation: >-
  Hoci sa ľavica a pravica zdajú byť v protiklade, zdieľajú preferenciu štátnych zásahov. Obe kritizujú voľný trh a obhajujú právo štátu riadiť životy ľudí prostredníctvom regulácií a daní. Ľavica kritizuje trhy ako zdroj nerovnosti, zatiaľ čo pravica ich vníma ako hrozbu pre suverenitu, no obe sa pri riešeniach obracajú na štát.
