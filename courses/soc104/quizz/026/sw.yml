question: "Kwa nini waliberali wa classical nchini Marekani walianza kujiita 'libertarians' kuanzia miaka ya 1960 na kuendelea?"
answer: "Ili kujitofautisha na waliberali wa Marekani, ambapo maana ya neno hilo ilikuwa imehamia kwenye uingiliaji wa dola"
wrong_answers:
  - "Ili kujipanga pamoja na Democratic Party na programu zake za kijamii za kimaendeleo"
  - "Ili kuonyesha uungaji mkono wao kwa mageuzi ya Great Society ya Lyndon B. Johnson"
  - "Ili kuchukua utambulisho mkali zaidi wa kimapinduzi uliochochewa na harakati za kisoshalisti za Ulaya"
explanation: >-
  Nchini Marekani, neno 'liberal' lilihamia kumaanisha wafuasi wa Big Government na uingiliaji wa dola, hasa baada ya New Deal na Great Society. Waliberali wa classical walichukua lebo 'libertarian' ili kuhifadhi maana ya awali ya falsafa yao. Walikuwa wanajiweka mbali na waliberali wa Marekani, si kujipanga pamoja nao.
reviewed: false
