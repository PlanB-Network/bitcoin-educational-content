question: "Mitä vasemmisto haluaa säätää laeilla ja säännellä?"
answer: "Taloutta, taustalla vihamielisyys taloudellista vapautta, kapitalismia ja vapaita markkinoita kohtaan"
wrong_answers:
  - "Henkilökohtaista moraalia ja uskonnollisia käytäntöjä, taustalla halu säilyttää perinteiset instituutiot"
  - "Maahanmuuttoa ja kansallisia rajoja, taustalla huoli kulttuurisesta identiteetistä ja suvereniteetista"
  - "Teknologiaa ja innovaatioita, taustalla pelko siitä, että automaatio korvaa ihmistyöntekijät"
explanation: >-
  Vasemmisto asettaa etusijalle sosiaalisen oikeudenmukaisuuden ja tasa-arvon, erityisesti taloudellisella tasolla. Tämä johtaa sen vihamielisyyteen taloudellista vapautta, kapitalismia ja vapaita markkinoita kohtaan sekä sen haluun säätää lakeja taloudesta ja säännellä sitä. Oikeisto sitä vastoin haluaa säätää lakeja moraalista ja uskonnosta. Maahanmuuton ja teknologian sääntely eivät ole tässä kuvattu ensisijainen painopiste.
