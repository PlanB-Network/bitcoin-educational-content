question: "What is democracy's genuine social function, according to Mosca and Mises?"
answer: "It acts as a pressure valve: the majority can publicly sanction or reward factions of the ruling minority, adapting government to the governed without violent struggle."
wrong_answers:
  - "It ensures that the wisest citizens reach power."
  - "It abolishes the ruling minority entirely."
  - "It guarantees economic growth through public investment."
explanation: |
  Mises called this the social function of democracy: adaptation of the government to the wishes of the governed without civil war. Voting speeds up the circulation of elites — democracy's real, and conservative, virtue.
reviewed: false
