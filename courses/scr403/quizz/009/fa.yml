question: ترکیب‌گر 'take' چه می‌کند؟
answer: مؤلفه چپ یک حاصل‌ضرب را استخراج می‌کند و مؤلفه راست را دور می‌اندازد.
wrong_answers:
  - یک عنصر را از یک نوع جمعی حذف می‌کند و بیت برچسب را دور می‌اندازد.
  - دو عملیات جداگانه را به‌صورت ترتیبی از سر تا ته ترکیب می‌کند.
  - یک مقدار را با برچسب چپ می‌پیچد تا یک نوع جمعی جدید بسازد.
explanation: >-
  ترکیب‌گر take یک استخراج‌کننده برای نوع‌های ضربی است. وقتی take f بر
  یک جفت ⟨a, b⟩ اعمال می‌شود، b را دور می‌اندازد و f را بر a اعمال می‌کند.
  در ترکیب با iden، عبارت take iden نخستین عنصر هر جفت را استخراج می‌کند.
reviewed: false
