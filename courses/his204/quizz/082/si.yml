question: නාවික අමාත්‍යවරයා ලෙස Turgot පත් කිරීම පුදුමයෙන් පිළිගනු ලැබුවේ ඇයි?
answer: Turgot නාවික කටයුතු පිළිබඳ මහත් දැනුමක් ඇති අයෙකු නොවේ
wrong_answers:
  - මෙම අමාත්‍යාංශයේ Turgotට බොහෝ සතුරන් ඇත
  - Turgotට පීනීමට බැරිය
  - Turgot සිවිල් පුද්ගලයෙකි
explanation: |
  Turgotට නාවික අත්දැකීමක් නොතිබූ බැවින්, ඔහු එම තනතුරට පත් කළ විට බොහෝ දෙනෙක් පුදුමයට පත් වූහ. ඒ වෙනුවට, ඔහු ආර්ථික හෝ මූල්‍ය තනතුරකට පත් කරනු ඇතැයි අපේක්ෂා කරන ලදී.