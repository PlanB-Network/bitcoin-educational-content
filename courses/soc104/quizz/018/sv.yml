question: "Vilket gemensamt politiskt mål har vänster- och högerstatister?"
answer: "Att vinna makt för att organisera samhället enligt sin världsbild och påtvinga den på alla"
wrong_answers:
  - "Att minska statens storlek och återföra beslutsmakt till enskilda medborgare"
  - "Att inrätta en direktdemokrati där varje medborgare röstar om varje lagstiftningsbeslut"
  - "Att avskaffa politiska partier och ersätta dem med oberoende teknokratisk styrning"
explanation: >-
  Både vänster- och högerstatister delar samma politiska mål: att vinna makt för att organisera samhället enligt sin världsbild och påtvinga den på alla genom lagstiftning. Skillnaden ligger bara i deras värden: högern åberopar försvar av civilisationen, medan vänstern åberopar försvar av arbetarklassen eller de förtryckta. Ingen av dem försöker minska staten eller avskaffa partier.
reviewed: false
