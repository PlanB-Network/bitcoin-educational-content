question: What should you absolutely avoid to guarantee the security of your bitcoins?
answer: Keep your bitcoins on an exchange platform
wrong_answers:
  - Using an open-source Hardware Wallet
  - Use a Hot Wallet for daily transactions
  - Diversifying storage methods
explanation: |
  The "Not your keys, not your bitcoins" principle underlines the importance of holding your own private keys. On an exchange platform, your bitcoins are exposed to unnecessary risks.
reviewed: false