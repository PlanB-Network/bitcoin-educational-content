description: |
  The bitcoin course within the "Trovarsi Ora" platform is an important innovation for those who are interested in better understanding bitcoin both as a tool and as a philosophy. In the course you will learn to manage bitcoins without intermediaries, to purchase them anonymously and safely. Finally, it will be important to manage two types of "account", one safe and private, a kind of small safe in which the value will be stored, while the second, managed by the phone, will be the "cash wallet" for small instant payments every day.
  The motivations of the course lie in the purposes of the "Trovarsi Ora" platform within the words of its founder, the popularizer Matteo Bordini. Bitcoin is presented as a solution to some of today's forces that tend to limit the freedom of individuals. With the techniques illustrated you will be able to improve your defenses, learning to use one of the most important tools of our time.
  The teacher of the course is Michele Gandolfi, an expert in cybersecurity, as well as one of the most influential members within the Italian bitcoin community.
