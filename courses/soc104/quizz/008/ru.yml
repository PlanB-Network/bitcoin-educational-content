question: "Какая позиция в ромбе Нолана находится наверху и представляет максимальную свободу?"
answer: "Либертарианство, поддерживающее наибольшую экономическую и личную свободу"
wrong_answers:
  - "Консерватизм, поддерживающий традиционные ценности и экономическую свободу"
  - "Центризм, прагматично уравновешивающий все политические позиции"
  - "Социализм, поддерживающий личную свободу и социальное равенство"
explanation: >-
  Либертарианство занимает вершину ромба Нолана как противоположность этатизму. Оно представляет тех, кто поддерживает наибольшую степень как экономической, так и личной свободы. Консерватизм находится справа (высокая экономическая, низкая личная свобода), социализм — слева (высокая личная, низкая экономическая свобода), а центризм — посередине.
