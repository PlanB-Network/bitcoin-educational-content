question: "Perché l'asse verticale (alto-basso) è considerato più fondamentale dell'asse orizzontale (sinistra-destra) nel diagramma di Nolan?"
answer: "Perché rivela la vera divisione tra chi difende le massime libertà individuali e chi favorisce il massimo controllo statale"
wrong_answers:
  - "Perché misura la produzione economica in modo più accurato di quanto l'asse orizzontale misuri le politiche sociali"
  - "Perché la maggior parte dei conflitti politici nella storia ha riguardato l'identità culturale piuttosto che la governance"
  - "Perché l'asse orizzontale si applica solo alle democrazie moderne mentre l'asse verticale è universale"
explanation: >-
  L'asse fondamentale è quello verticale perché cattura la domanda politica essenziale: in che misura lo stato dovrebbe controllare l'azione umana? L'asse sinistra-destra riflette soltanto sensibilità diverse (giustizia sociale contro tradizione), ma entrambe le parti possono occupare la stessa posizione sull'asse verticale come stataliste. L'asse verticale rivela se qualcuno vuole imporre la propria visione con la forza o rispetta la libertà individuale.
