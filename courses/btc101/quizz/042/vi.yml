question: Một nhược điểm tiềm ẩn của tiền số do ngân hàng trung ương phát hành (CBDCs) là gì?
answer: Chúng có thể hạn chế tự do tài chính của cá nhân và tạo điều kiện cho việc lạm dụng quyền lực chuyên chế.
wrong_answers:
  - Chúng có thể dẫn đến sự giảm lượng tiền trong lưu thông.
  - Chúng có thể dẫn đến sự giảm giá trị của Bitcoin.
  - Chúng có thể dẫn đến sự giảm giá trị của vàng.
explanation: |
  Tiền số do ngân hàng trung ương phát hành (CBDCs) có thể tiềm ẩn hạn chế tự do tài chính của cá nhân và tạo điều kiện cho việc lạm dụng quyền lực chuyên chế. Điều này xảy ra vì chúng sẽ ủng hộ một nền kinh tế tập trung được kế hoạch một cách chặt chẽ, với ngân hàng trung ương có toàn quyền kiểm soát hơn đối với lượng tiền trong lưu thông.
reviewed: true