question: "Wie veranschaulicht George W. Bushs Reaktion auf die Finanzkrise von 2008 die 'problematische Flexibilität' konservativer Prinzipien?"
answer: "Er gab Prinzipien des freien Marktes auf, um große Banken zu retten, und offenbarte damit die konservative Sicht auf den Staat als letztendlichen Garanten nationaler wirtschaftlicher Stabilität"
wrong_answers:
  - "Er verweigerte jede staatliche Intervention und ließ die Banken scheitern, wobei er ungeachtet der Folgen strikt an der Ideologie des freien Marktes festhielt"
  - "Er verstaatlichte den Bankensektor dauerhaft und führte progressive Besteuerung ein, wodurch er vom Konservatismus zum demokratischen Sozialismus wechselte"
  - "Er reagierte, indem er alle Staatsausgaben kürzte und Finanzregulierungen abschaffte, damit der Markt sich selbst korrigieren konnte"
explanation: >-
  Bush erklärte, er habe 'Prinzipien des freien Marktes aufgegeben, um das System des freien Marktes zu retten', indem er eingriff, um die großen Banken zu retten. Dies zeigt, wie Konservative die Macht und Kontinuität der Nation über abstrakte Marktprinzipien stellen können. Dieselbe flexible Logik erscheint in Trumps protektionistischer Handelspolitik, die im Namen des nationalen Interesses verfolgt wurde, auf die Gefahr hin, Korporatismus und Vetternkapitalismus zu befeuern.
reviewed: false
