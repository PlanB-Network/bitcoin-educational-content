question: "I spørsmålet om våpenregulering, hva er den avgjørende forskjellen mellom den konservative og den libertarianske posisjonen?"
answer: "Begge aksepterer noe regulering, men konservative ønsker regler fra en legitim offentlig myndighet, mens libertarianere ønsker at regler skal vokse frem fra dem det direkte angår, som borgerforeninger og markedskonkurranse"
wrong_answers:
  - "Konservative motsetter seg all våpenregulering, mens libertarianere aksepterer streng statlig kontroll av hensyn til offentlig sikkerhet"
  - "Konservative ønsker å forby skytevåpen helt, mens libertarianere støtter ubegrenset tilgang til alle våpen"
  - "Konservative bygger sin posisjon på individuelle rettigheter, mens libertarianere bygger sin på kollektivt ansvar"
explanation: >-
  Både konservative og libertarianere er enige om at en form for regulering av våpenbæring er nødvendig. Den avgjørende forskjellen ligger i hvem som fastsetter disse reglene. Konservative insisterer på at reguleringer må komme fra en offentlig myndighet med ansvar for å verne det felles beste (ovenfra og ned). Libertarianere hevder at regulering bør vokse frem fra dem det direkte angår: sikkerhetsprofesjonelle, borgerforeninger og markedskonkurranse (nedenfra og opp).
reviewed: false
