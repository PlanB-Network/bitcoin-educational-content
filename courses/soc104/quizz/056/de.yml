question: "Zu welcher Regierungsform tendiert der Zentrismus?"
answer: "Technokratie, bei der Macht Experten anvertraut wird, die die Wirtschaft und Geldpolitik steuern"
wrong_answers:
  - "Direkte Demokratie, bei der Bürger über jede wichtige politische Entscheidung abstimmen"
  - "Aristokratie, bei der Macht von einer traditionellen herrschenden Klasse gehalten wird"
  - "Laissez-faire-Regierung, bei der der Markt sich ohne staatliche Intervention selbst reguliert"
explanation: >-
  Der Zentrismus bevorzugt Effizienz und Pragmatismus und tendiert zur Technokratie, was bedeutet, dass Macht Experten anvertraut werden sollte, die die Wirtschaft steuern und die Geldpolitik lenken. Dies unterscheidet sich grundlegend von direkter Demokratie, Aristokratie oder Laissez-faire, die Macht jeweils nach völlig anderen Prinzipien verteilen.
reviewed: false
