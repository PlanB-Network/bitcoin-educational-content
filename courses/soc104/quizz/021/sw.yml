question: "Mhimili wima wa mchoro wa Nolan unaonyesha nini kuhusu swali halisi la kisiasa?"
answer: "Unaonyesha ikiwa unataka kuwalazimisha wengine kufuata mielekeo yako mwenyewe kupitia dola, au unapendelea kila mtu awe huru kujiamulia mwenyewe"
wrong_answers:
  - "Unaonyesha ikiwa unaunga mkono utawala wa kidemokrasia au unapendelea utawala wa kimabavu wa kiongozi mmoja"
  - "Unaonyesha ikiwa unajitambulisha na harakati za kijamii za maendeleo au na taasisi za jadi za kidini"
  - "Unaonyesha ikiwa wasiwasi wako mkuu ni usalama wa taifa au ustawi wa kiuchumi"
explanation: >-
  Mhimili wima hufichua swali halisi la kisiasa: si kama wewe ni wa kushoto au wa kulia, bali ni kwa kiwango gani unataka dola iingilie katika kuunda jamii kulingana na thamani zako. Je, unatamani kuwalazimisha wengine kufuata mielekeo yako, au unapendelea kila mtu awe huru kujiamulia mwenyewe? Mtazamo huu huvuka mgawanyiko wa kushoto-kulia na huonyesha kwamba kambi zote mbili zinaweza kuwa za ustatisti kwa kiwango sawa.
