question: "ความแตกต่างสำคัญระหว่าง minarchists กับ anarcho-capitalists ภายใน libertarianism คืออะไร?"
answer: "Minarchists ยอมรับรัฐขั้นต่ำสำหรับการป้องกันประเทศ ความยุติธรรม และตำรวจ ขณะที่ anarcho-capitalists ต้องการให้หน้าที่ทั้งหมดของรัฐถูกแปรรูปเป็นเอกชน"
wrong_answers:
  - "Minarchists ปฏิเสธรัฐบาลทุกรูปแบบ ขณะที่ anarcho-capitalists ยอมรับการกำกับตลาดโดยรัฐแบบจำกัด"
  - "Minarchists สนับสนุนภาษีก้าวหน้าเพื่อบริการจำเป็น ขณะที่ anarcho-capitalists คัดค้านภาษีทั้งหมด"
  - "Minarchists มุ่งเน้นเฉพาะเสรีภาพทางเศรษฐกิจ ขณะที่ anarcho-capitalists ปกป้องทั้งเสรีภาพทางเศรษฐกิจและสังคม"
explanation: >-
  Minarchists เชื่อว่ารัฐควรถูกจำกัดไว้เฉพาะหน้าที่แกนกลาง เช่น การป้องกันประเทศ ความยุติธรรม และตำรวจ ("night-watchman state") ขณะที่ anarcho-capitalists โต้แย้งว่าแม้แต่หน้าที่เหล่านี้ก็ควรถูกแปรรูปเป็นเอกชนและจัดการผ่านการแข่งขันในตลาดโดยสมัครใจ ความไม่เห็นพ้องของพวกเขาเป็นเรื่องการนำไปใช้ในทางปฏิบัติมากกว่าหลักการจริยธรรมพื้นฐาน ทั้งสองแนวโน้มมีคุณค่าลิเบอร์ทาเรียนร่วมกันเรื่อง self-ownership และ non-aggression
reviewed: false
