question: "Ron Paul 為何主張 Federal Reserve 有害，而 Bitcoin 如何與他的立場相關？"
answer: "Federal Reserve 透過操縱 fiat money 造成通貨膨脹與經濟週期，而 Bitcoin 代表一種可以取代金本位的健全貨幣形式"
wrong_answers:
  - "Federal Reserve 限制銀行競爭，而 Bitcoin 將銀行服務去中心化以改善金融包容性"
  - "Federal Reserve 阻止國家之間的自由貿易，而 Bitcoin 讓無需政府批准的無邊界交易成為可能"
  - "Federal Reserve 製造過度政府債務，而 Bitcoin 提供一種消除國債的通縮貨幣"
explanation: >-
  Ron Paul 是最小國家主義者，主張 Federal Reserve 因操縱 fiat money 而對通貨膨脹與經濟週期負責。他倡導貨幣去國有化，這是 Friedrich Hayek 所倡議的想法，並把 Bitcoin 視為一種可以取代金本位的健全貨幣形式。他的批判根植於自由至上主義貨幣理論，而不是主要根植於銀行競爭、貿易壁壘或政府債務。
reviewed: false
