question: "What are the five pillars of Efrat's personal branding method?"
answer: "Brand identity, content, distribution, networking, and brand synergy"
wrong_answers:
  - "Target audience, values, characteristics, look and feel, and tone of voice"
  - "Social media, public speaking, thought leadership, blogging, and SEO"
  - "Mission statement, vision, biography, positioning, and visual design"
explanation: >-
  Efrat's method breaks personal branding into five pillars: brand identity, content, distribution, networking, and brand synergy. The first wrong answer lists the five components of brand identity, which is only one of the five pillars. The other distractors mix general marketing concepts that are not part of her framework.
reviewed: false
