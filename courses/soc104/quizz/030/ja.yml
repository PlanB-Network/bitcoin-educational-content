question: "政治的保守主義とは何か？"
answer: "確立された政治制度と社会秩序を維持することを目指し、大規模な構造的激変に反対するイデオロギー"
wrong_answers:
  - "伝統的な家族の価値と宗教的慣行への個人的なコミットメントであり、それらを他者に押し付けようとしないもの"
  - "民主的改革と進歩的立法を通じて急速な社会変化を促進する哲学"
  - "自由市場、最小限の課税、貿易障壁の廃止を提唱する経済理論"
explanation: >-
  政治的保守主義は、しばしば右派または極右政党に代表されるイデオロギーであり、大規模な構造的激変に反対しながら、確立された政治制度と社会秩序を維持することを目指す。
  その支持者は、自分たちの遺産を守るために権力と法律を用いることを望む。
  これは、政治的プログラムではなく個人的な生き方の選択である文化的保守主義とは異なる。
reviewed: false
