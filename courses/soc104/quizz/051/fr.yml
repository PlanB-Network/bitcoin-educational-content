question: "Comment Michael Oakeshott caractérisait-il le conservatisme dans son œuvre philosophique ?"
answer: "Comme un tempérament et une disposition envers la vie plutôt que comme une idéologie systématique rigide"
wrong_answers:
  - "Comme une théorie économique complète avec des prescriptions politiques précises pour chaque domaine de l'action gouvernementale"
  - "Comme un mouvement révolutionnaire qui cherche à démanteler les institutions modernes et à revenir à la société préindustrielle"
  - "Comme une doctrine purement religieuse fondée sur la théologie chrétienne et l'autorité ecclésiastique"
explanation: >-
  Michael Oakeshott, philosophe britannique, a défendu une conception du conservatisme comme tempérament plutôt que comme idéologie systématique. Son essai On Being Conservative (1956) demeure une référence essentielle. Cette vision du conservatisme comme disposition a également influencé Friedrich Hayek. L'approche d'Oakeshott est remarquable par sa critique du rationalisme en politique, rejetant l'idée que la politique puisse être réduite à un système.
reviewed: false
