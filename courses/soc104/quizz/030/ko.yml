question: "자유지상주의 운동 내에서 Cato Institute, Mises Institute, Libertarian Party의 역할은 어떻게 다른가요?"
answer: "Cato Institute는 공공정책 제안에, Mises Institute는 교육과 학술 출판에, Libertarian Party는 선거 정치에 초점을 맞춥니다"
wrong_answers:
  - "Cato Institute는 정치 캠페인에 자금을 대고, Mises Institute는 의회에 직접 로비하며, Libertarian Party는 학술 회의를 조직합니다"
  - "Cato Institute는 경제학 교과서를 출판하고, Mises Institute는 유권자 등록 운동을 운영하며, Libertarian Party는 입법안을 작성합니다"
  - "Cato Institute는 풀뿌리 시위를 조직하고, Mises Institute는 자유지상주의자를 위한 법적 방어를 제공하며, Libertarian Party는 싱크탱크 연구를 관리합니다"
explanation: >-
  Cato Institute(1977년 설립)는 Washington에 기반을 둔 싱크탱크로, 공공정책 제안 작업을 합니다. Mises Institute(1982년 설립)는 정치 로비보다 교육에 초점을 맞추며, 회의와 재출판된 저작을 갖춘 일종의 온라인 대학처럼 기능합니다. Libertarian Party(1971년 설립)는 미국에서 세 번째로 큰 정당으로, 약 2%의 득표율만으로도 결과를 뒤집을 수 있는 선거에 참여합니다.
reviewed: false
