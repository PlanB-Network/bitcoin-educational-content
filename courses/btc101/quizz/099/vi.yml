question: Bạn nên làm gì sau khi đã viết xong các từ của cụm từ khóa?
answer: Tạo một bản sao thứ hai và lưu trữ nó ở một nơi khác an toàn.
wrong_answers:
  - Chia sẻ nó với một người bạn đáng tin cậy.
  - Gửi email cho chính mình.
  - Lưu trữ nó trong điện thoại của bạn.
explanation: |
  Một khi các từ của cụm từ khóa đã được viết, bạn nên tạo một bản sao thứ hai và lưu trữ nó ở một nơi khác an toàn so với bản đầu tiên. Điều này cung cấp một bản sao dự phòng trong trường hợp mất mát hoặc có sự cố với bản sao đầu tiên.
reviewed: true