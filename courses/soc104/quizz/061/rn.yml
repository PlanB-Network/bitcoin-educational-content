question: "Ijambo rya Mussolini ryo mu 1920 rivuga ngo 'Vyose muri Leta, nta kiri hanze ya Leta, nta kiri kurwanya Leta' rihishura iki ku bijanye n'ubutegetsi bw'igitugu bugenzura vyose?"
answer: "Ntihaba hakiri itandukaniro hagati y'ikibanza rusangi n'ic'umuntu ku giti ciwe, kuko Leta yigarurira ikibano cose"
wrong_answers:
  - "Leta yitwararika gusa ububasha bwa gisirikare mu gihe ireka ubukungu mu maboko y'abikorera ku giti cabo"
  - "Abanyagihugu baridegemvya kwitunganya mu buryo bwabo ku giti cabo igihe cose badanegura Leta ku mugaragaro"
  - "Ubutegetsi bugenzura gusa ibikorwa vya politike mu gihe ubuzima bw'umuco n'ubw'idini buguma bwigenga"
explanation: >-
  Iryo jambo rya Mussolini rifata umutima w'ubutegetsi bw'igitugu bugenzura vyose: ukwuzura. Vyose vyigarurirwa na Leta, bisigura ko ata tandukaniro riba rikiri hagati y'ikibanza rusangi n'ic'umuntu ku giti ciwe. Ikibano gitakaza ubwigenge bwose, gushika no ku bikorwa bisanzwe cane nko kwugurura umugwi w'inkino. Ivyo birarenga kure kugenzura gusa ibisata vya gisirikare, vya politike canke vy'ubukungu.
