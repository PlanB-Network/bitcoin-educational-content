question: Condorcetට අනුව, Turgot අසාර්ථක වීමට නියමිත වූයේ ඇයි?
answer: ඔහු Parisහි දේශපාලන ක්‍රීඩාවට අතිශය අවංක විය
wrong_answers:
  - ඔහුට ආර්ථික න්‍යාය පිළිබඳ දැනුම අඩු විය
  - ඔහුගේ ශාරීරික ගොඩනැගීම ඉතා දුර්වල විය
  - ඔහු තනතුර සඳහා ඉතා තරුණ විය
explanation: |
  Condorcet Turgotට මෙසේ කීවේය: "ඔබ කිසිසේත්ම වංචනිකයෙකු නොවේ, සහ Parisහි දේවල් පවතින ආකාරය අනුව එය දෝෂයකි." ඔහු Turgot මුහුණ දීමට සිදුවන බොහෝ විරුද්ධවාදීන් පෙන්වා දුන්නේය: රජුගේ ප්‍රියතමයන්, පාර්ලිමේන්තු, පූජක පක්ෂය, උසස් කුලීනත්වය, සහ guilds. මෙම කණ්ඩායම් බලාපොරොත්තු වූයේ ප්‍රශංසාව මිස ප්‍රතිසංස්කරණ නොවේ.