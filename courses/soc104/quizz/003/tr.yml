question: "Sol-sağ ekseni, Bastiat veya Ron Paul gibi klasik liberal düşünürleri konumlandırmak için neden yetersiz kabul edilir?"
answer: "Çünkü klasik liberalizm hem ekonomik hem de kişisel özgürlüklere değer verir; bunları ne sol ne de sağ tam olarak benimser"
wrong_answers:
  - "Çünkü klasik liberaller her zaman sağ kanat ekonomi politikalarıyla hizalanır ve tüm sol kanat konumları reddeder"
  - "Çünkü klasik liberaller, sol ve sağ ideolojilerin ılımlı versiyonlarını benimseyen merkezcilerdir"
  - "Çünkü klasik liberaller tüm hükümet biçimlerine karşı çıkar; bu da onları siyasi düşünürlerden ziyade anarşist yapar"
explanation: >-
  Sol-sağ ekseni klasik liberaller için başarısızdır; çünkü ekonomik özgürlüğü (genellikle sağ) ve kişisel özgürlüğü (genellikle sol) aynı anda savunan bir konumu barındıramaz. Klasik liberaller uzlaşma arayan merkezciler değildir; anarşist ya da tamamen sağcı da değildir. Tek boyutlu bir yelpazeye basitçe sığmazlar.
reviewed: false
