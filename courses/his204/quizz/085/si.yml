question: දේවල්වල වටිනාකමේ ස්වභාවය ගැන Condillac විවාද කළ Physiocratic පාසලේ සාමාජිකයා කවුද?
answer: Guillaume-François Le Trosne
wrong_answers:
  - François Quesnay
  - Pierre-Samuel Dupont de Nemours
  - The Marquis de Mirabeau
explanation: |
  Condillac Le Trosne සමඟ වටිනාකමේ ස්වභාවය පිළිබඳව විවාද කළ අතර, වටිනාකමේ ආත්මීය න්‍යායක් ආරක්ෂා කළේය.