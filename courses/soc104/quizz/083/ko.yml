question: "다음 중 Hayek가 설명한 자생적 질서의 예는 무엇인가요?"
answer: "언어이며, 이는 사무실의 지식인들이 설계한 것이 아니라 역사적 상호작용을 통해 유기적으로 발전했습니다"
wrong_answers:
  - "국가 헌법이며, 이는 사회적 규칙을 확립하기 위해 선출된 대표자들이 신중히 초안한 것입니다"
  - "정부 경기부양 계획이며, 이는 경제활동을 조정하기 위해 경제학자들이 설계한 것입니다"
  - "공교육 제도이며, 이는 지식에 대한 보편적 접근을 보장하기 위해 입법자들이 만든 것입니다"
explanation: >-
  Hayek는 자생적 질서를 사회에서 자유로운 상호작용의 산물, 즉 인간 행위의 결과이지만 의도적인 인간 설계의 결과는 아닌 것으로 설명합니다. 언어가 대표적 예입니다: 프랑스어, 영어, 독일어는 문법 규칙을 정한 지식인들이 구성한 것이 아니라, 역사적 상호작용을 통해 세워진 느리고 유기적인 조직의 산물로 나타났습니다.
reviewed: false
