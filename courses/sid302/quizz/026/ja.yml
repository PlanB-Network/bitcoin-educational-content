question: トランザクションの構築とノードの要件に関して、Blockstream AMPのバージョン1とバージョン2のアーキテクチャ上の主な違いは何ですか？
answer: バージョン2では複雑な処理をサーバー側に移し、サーバーがトランザクションを構築して発行者にPSETを提示するため、フルノードを同期させる必要がなくなった
wrong_answers:
  - バージョン2では冗長性のために発行者が同期済みのElementsノードを複数運用する必要があるが、バージョン1では1つのノード接続だけで済んだ
  - バージョン2ではすべての暗号処理をクライアント側のハードウェアウォレットに移したが、バージョン1ではすべての署名処理をサーバーのインフラで行っていた
  - バージョン2では共同署名の要件が完全になくなり、ピアツーピアで直接送付できるようになったが、バージョン1ではすべてのトランザクションにサーバーの認可が必要だった
explanation: |
  AMPのバージョン1からバージョン2への進化は、「高機能なクライアントと複雑なインフラ」というモデルから、「高機能なサーバーと簡素化されたクライアント」というアプローチへの根本的な転換を表しています。バージョン1では、発行者は完全に同期したElementsノードを維持し、一体型のGreen SDKに大きく依存する必要があったため、技術的なハードルが高くなっていました。バージョン2では複雑な処理をサーバー側に移し、AMPサーバーがトランザクションの構築、UTXOの選択、手数料の計算を行ったうえで、署名だけが必要な部分署名済みElementsトランザクション（PSET）を発行者に提示します。これによりフルノードが不要になり、一般的なウォレットとの統合も可能になりました。