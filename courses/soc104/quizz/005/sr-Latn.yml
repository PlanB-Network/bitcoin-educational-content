question: "U Nolanovom dijamantu, koja pozicija se nalazi na vrhu i predstavlja maksimalnu slobodu?"
answer: "Libertarijanizam, koji podržava najveću ekonomsku i ličnu slobodu"
wrong_answers:
  - "Konzervatizam, koji podržava tradicionalne vrednosti i ekonomsku slobodu"
  - "Centrizam, koji na pragmatičan način uravnotežuje sve političke pozicije"
  - "Socijalizam, koji podržava ličnu slobodu i društvenu jednakost"
explanation: >-
  Libertarijanizam zauzima vrh Nolanovog dijamanta kao suprotnost etatizmu. On predstavlja one koji podržavaju najveći stepen i ekonomske i lične slobode. Konzervatizam se nalazi desno (visoka ekonomska, niska lična sloboda), socijalizam levo (visoka lična, niska ekonomska sloboda), a centrizam u sredini.
