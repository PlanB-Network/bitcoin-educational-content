question: "为什么 Popper 认为开放社会尽管有其优势，却仍然内在脆弱？"
answer: "因为个人主义所意味着的责任可能显得令人畏惧，产生一种向共同体保护、权威或对理想化过去的怀旧中寻求庇护的诱惑"
wrong_answers:
  - "因为开放社会缺乏军事实力，无法抵御封闭社会的入侵"
  - "因为民主制度本质上效率低下，并最终在官僚复杂性的重压下崩溃"
  - "因为开放社会允许过多经济不平等，这必然导致革命和威权政权的建立"
explanation: >-
  Popper 强调，开放社会的脆弱性源于一种心理脆弱。个人主义所意味着的责任可能显得令人畏惧且有风险，因为一个人必须自己作选择，而且可能失败。于是产生了向共同体保护或对理想化过去的怀旧倾向中寻求庇护的诱惑。开放社会持续面临来自共同体主义冲动以及反复出现的暴力诱惑的挑战。
reviewed: false
