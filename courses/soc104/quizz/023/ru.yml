question: "Что такое политический консерватизм?"
answer: "Идеология, стремящаяся сохранить сложившиеся политические институты и общественный порядок и выступающая против крупных структурных потрясений"
wrong_answers:
  - "Личная приверженность традиционным семейным ценностям и религиозным практикам без стремления навязать их другим"
  - "Философия, продвигающая быстрые социальные изменения через демократические реформы и прогрессивное законодательство"
  - "Экономическая теория, выступающая за свободные рынки, минимальное налогообложение и отмену торговых барьеров"
explanation: >-
  Политический консерватизм — это идеология, часто представленная в правых или крайне правых партиях, которая стремится сохранить сложившиеся политические институты и общественный порядок, выступая против крупных структурных потрясений. Его сторонники хотят использовать власть и закон, чтобы защитить свое наследие. Это отличается от культурного консерватизма, который является личным жизненным выбором, а не политической программой.
