question: Ni kipengele gani muhimu cha single use seals inayotumiwa katika RGB?
answer: Wanaweza kufungwa mara moja tu
wrong_answers:
  - Wanaweza tu kufungwa mara mbili
  - Wanahakikisha usiri wa muamala
  - Wanaondoa hitaji la makubaliano juu ya Blockchain
explanation: |
  Single use seals huwezesha uundaji wa ahadi za kipekee za cryptography, kuzuia kurudia au Double-spending.
reviewed: true
