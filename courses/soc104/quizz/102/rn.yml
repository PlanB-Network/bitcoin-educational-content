question: "Abaharanira umwidegemvyo bemera iki ku bushobozi bw'abantu bwo gufata ingingo?"
answer: "Abantu bafise uburenganzira n'ibanga vyo gufata ingingo zabo bwite ku vyerekeye ubuzima bwabo"
wrong_answers:
  - "Abantu bakwiye gufata ingingo gusa bamaze kubaza abaserukira abandi batowe batahura ingaruka za politike"
  - "Muri rusangi abantu ntibashoboye gufata ingingo nziza kandi bakeneye ubuyobozi bw'abahinga bo mu bigo vya leta"
  - "Abantu bakwiye gufata ingingo z'ubutunzi mu mwidegemvyo ariko bakisunga leta ku bibazo vyose vy'ikibano n'imico"
explanation: >-
  Dufatiye ku kubona ibintu kw'abaharanira umwidegemvyo, abantu bafise uburenganzira n'ibanga vyo gufata ingingo zabo bwite. Ivyo biratandukanye n'imiryango ya politike isanzwe kuva ibumoso gushika iburyo, yemera ko leta ikwiye gufata zimwe canke nyinshi mu ngingo zihambaye mu buzima bw'umuntu no mu buzima bw'ubutunzi muri rusangi.
