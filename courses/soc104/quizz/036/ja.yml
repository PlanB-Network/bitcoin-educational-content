question: "政治体制の意図的定義が分析目的にとって問題だとされるのはなぜですか？"
answer: "すべての体制が正義、公平、自由のような似た目的を追求すると主張するため、概念的混乱を生むから"
wrong_answers:
  - "それらはあまりに精密で硬直的であり、政治運動が時間とともに自然に進化する余地を残さないから"
  - "それらは経済的結果に過度に注目し、政治生活の文化的・社会的次元を無視するから"
  - "それらは、独立した研究者がほとんど入手できない機密政府文書に依拠するから"
explanation: >-
  意図的定義は表明された動機や目標に依拠するが、あらゆる政治体制は正義、公平、自由を追求すると主張する。これにより、体制同士を区別することが不可能になる。これに対して構造的分析は、体制をその経験的で測定可能な帰結と、それが用いる手段によって評価し、レトリックを超えた真の性質を明らかにする。
reviewed: false
