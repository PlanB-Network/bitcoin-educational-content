question: "Kant का सूत्रवाक्य 'Sapere aude' लोगों को क्या करने के लिए प्रोत्साहित करता है?"
answer: "स्वयं सोचने का साहस करने और उस अल्पवयस्कता की अवस्था से बाहर निकलने के लिए जिसमें वे किसी श्रेष्ठ प्राधिकरण के निर्देशन पर निर्भर रहते हैं"
wrong_answers:
  - "औपचारिक शैक्षणिक संस्थानों में दाखिला लेकर और प्रमाणपत्र प्राप्त करके अकादमिक ज्ञान का पीछा करने के लिए"
  - "नैतिकता के सभी रूपों को चुनौती देने और व्यक्तिगत इच्छा पर आधारित पूरी तरह नए नैतिक तंत्र बनाने के लिए"
  - "धार्मिक भक्ति और चर्च की शिक्षाओं के प्रति समर्पण के माध्यम से बुद्धि खोजने के लिए"
explanation: >-
  Sapere aude, जिसका अर्थ है “अपने लिए सोचने का साहस करो,” Kant ने कवि Horace से लिया था और इसे प्रबोधन का सूत्रवाक्य बनाया था। यह अल्पवयस्कता से बाहर निकलने का प्रतीक है, ऐसी अवस्था जिसमें लोग किसी श्रेष्ठ वर्ग या प्राधिकरण के निर्देशन के बिना अपनी समझ का उपयोग करने में असमर्थ होते हैं। Kant मुक्ति और अपने स्वयं के विचारों की पूर्ण जिम्मेदारी को प्रोत्साहित करते हैं।
reviewed: false
