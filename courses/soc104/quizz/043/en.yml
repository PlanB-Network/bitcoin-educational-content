question: "What does the term 'holism' mean in the context of socialist philosophy?"
answer: "A vision of society as an indivisible whole where the collective takes primacy over the individual"
wrong_answers:
  - "A philosophy that treats each individual as a self-contained unit whose rights cannot be overridden by any group"
  - "An economic theory that advocates balancing public and private sectors in equal measure"
  - "A political strategy that integrates all minority viewpoints into a single consensus-based platform"
explanation: >-
  Holism comes from the Greek 'holos' meaning 'the whole.' In socialist thought, it refers to a vision of society as an indivisible whole rather than a simple sum of individuals. The socialist state aims to take charge of and direct human activity to the maximum. This collective can be represented as a social class, a nation, a race, or a gender, but in each case the individual is defined by group belonging.
