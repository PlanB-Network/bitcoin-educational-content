question: "Quelle division fondamentale a séparé les socialistes à partir du début du XXe siècle ?"
answer: "Les socialistes révolutionnaires qui cherchaient à s'emparer du pouvoir par la violence, contre les socialistes réformistes qui poursuivaient le changement par les élections démocratiques"
wrong_answers:
  - "Les socialistes urbains qui se concentraient sur les travailleurs industriels, contre les socialistes ruraux qui organisaient des communes agricoles"
  - "Les socialistes nationalistes qui donnaient la priorité à leur propre pays, contre les socialistes internationalistes qui prônaient la révolution mondiale"
  - "Les socialistes intellectuels qui écrivaient des textes théoriques, contre les socialistes militants qui organisaient des grèves ouvrières"
explanation: >-
  À partir du début du XXe siècle, une division fondamentale a séparé les socialistes révolutionnaires, qui s'opposaient aux droits de propriété et cherchaient à détruire la société capitaliste par la violence ou la dictature du prolétariat, des socialistes réformistes, qui poursuivaient la justice sociale par les élections démocratiques et l'impôt tout en acceptant temporairement le capitalisme. Cette scission a façonné toute l'histoire ultérieure des mouvements socialistes.
