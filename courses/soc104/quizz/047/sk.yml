question: "Ako Michael Oakeshott charakterizoval konzervatizmus vo svojom filozofickom diele?"
answer: "Ako temperament a životnú dispozíciu, nie ako rigidnú systematickú ideológiu"
wrong_answers:
  - "Ako komplexnú ekonomickú teóriu s presnými politickými predpismi pre každú oblasť vlády"
  - "Ako revolučné hnutie, ktoré sa usiluje rozložiť moderné inštitúcie a vrátiť sa k predindustriálnej spoločnosti"
  - "Ako čisto náboženskú doktrínu založenú na kresťanskej teológii a cirkevnej autorite"
explanation: >-
  Michael Oakeshott, britský filozof, obhajoval chápanie konzervatizmu ako temperamentu, nie ako systematickej ideológie. Jeho esej On Being Conservative (1956) zostáva zásadnou referenciou. Toto chápanie konzervatizmu ako dispozície ovplyvnilo aj Friedricha Hayeka. Oakeshottov prístup je pozoruhodný kritikou racionalizmu v politike a odmietnutím predstavy, že politiku možno zredukovať na systém.
