question: "국가 폐지 전략에서 libertaires와 리버테리언은 어떻게 다른가요?"
answer: "libertaires는 역사적으로 폭력적 파괴를 옹호한 반면, 리버테리언은 교육과 시민 불복종을 통해 국가의 정당성을 약화시키려 합니다"
wrong_answers:
  - "libertaires는 민주적 선거를 통해 국가를 해체하려 하고, 리버테리언은 무장 혁명과 직접 행동을 선호합니다"
  - "libertaires는 대안 공동체 건설에 집중하고, 리버테리언은 기존 정치 체제 안에서 개혁을 통과시키려 일합니다"
  - "libertaires와 리버테리언은 모두 평화적 시위가 사회 변혁의 유일하게 정당한 수단이라는 데 동의합니다"
explanation: >-
  libertaires는 역사적으로 테러와 표적 공격을 포함해 폭력을 통해 국가와 자본주의를 파괴할 것을 옹호했습니다. 반대로 리버테리언은 공격적 폭력을 부당한 것으로 거부합니다. 그들의 전략은 논증, 토론, 교육, 시민 불복종을 통해 국가의 정당성을 약화시키는 데 기반합니다. 변화에 대한 이러한 근본적으로 다른 접근은 더 깊은 철학적 불일치를 반영합니다.
