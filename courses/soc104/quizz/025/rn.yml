question: "Ijambo 'liberal' risobanura iki mu muco wa politike w'i Buraya?"
answer: "Uwushigikira ubutunzi bwa laissez-faire, kugabanya ukwinjira kwa Leta, n'imwidegemvyo y'umuntu ku giti ciwe"
wrong_answers:
  - "Uwushigikira ukwinjira kwa Leta, ubwisungane bwa Leta mu vy'amagara, n'imigambi yo kurwanya ubukene"
  - "Umuanarchiste akaze arondera gukuraho burundu intwaro n'ubutunzi bw'abantu ku giti cabo"
  - "Uwo hagati aringaniza ivyiyumviro vya gisosiyalisite n'ivy'abagumyabanga ku rugero rumwe mu mice yose ya politike"
explanation: >-
  I Buraya, liberalism yagumye ifitaniye isano na politike z'ubutunzi bwa laissez-faire, ukwinjira kwa Leta kugabanutse, n'ugukingira imwidegemvyo y'umuntu ku giti ciwe. Inyishu ya mbere itari yo idondora American liberals, abo ijambo ryahindukiyeko risigura interventionism. European liberalism si anarchism kandi si centrism.
