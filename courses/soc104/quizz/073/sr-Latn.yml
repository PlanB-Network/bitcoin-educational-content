question: "Kako se konzervativna i libertarijanska pozicija o minimalnoj zaradi razlikuju u svom obrazloženju, uprkos tome što obe favorizuju njeno ukidanje?"
answer: "Konzervativci prihvataju određenu umešanost države u određivanje plata ako to ne ometa konkurentnost, dok libertarijanci vide minimalnu zaradu kao moralno nametanje slobodi zapošljavanja i poslovanja"
wrong_answers:
  - "Konzervativci se protive minimalnoj zaradi zato što stvara inflaciju, dok joj se libertarijanci protive zato što daje previše moći sindikatima"
  - "Konzervativci žele da plate određuju verske i zajedničke institucije, dok libertarijanci žele da plate određuju tržišne studije odobrene od vlade"
  - "Konzervativci veruju da minimalne zarade treba da se razlikuju po regionima, dok libertarijanci veruju da jedna fiksna zarada treba da važi na nacionalnom nivou"
explanation: >-
  Obe pozicije favorizuju smanjenje ili ukidanje minimalne zarade, ali se njihova obrazloženja fundamentalno razlikuju. Konzervativci prihvataju određenu umešanost države u određivanje plata, insistirajući da ostane minimalna i zavisna od konteksta, uz fokus na konkurentnosti. Libertarijanci zauzimaju snažniju moralnu poziciju: minimalna zarada je nametanje slobodi zapošljavanja i poslovanja. Kada libertarijanci kažu „tržište”, misle na ugovor, slobodno pregovaran između dve strane bez državnog mešanja.
