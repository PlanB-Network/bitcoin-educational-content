question: Ni ubuhinga ubuhe Umbrel ikoresha mu gutandukanya no gucunga ibikorwa vyayo?
answer: Docker containers
wrong_answers:
   - VirtualBox virtual machines
  - Bash scripts
  - Kubernetes clusters
explanation: |
  Buri porogarama muri Umbrel ikoreshwa mu gitereko ca Docker, ishoboza uburongozi bwigenga no kwitandukanya.
reviewed: true
