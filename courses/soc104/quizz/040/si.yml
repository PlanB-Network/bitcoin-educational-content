question: "Karl Marx utopian socialism සහ scientific socialism අතර ඇඳි distinction එක කුමක්ද?"
answer: "ඔහු early French socialists imaginary solutions propose කරන බව චෝදනා කළ අතර, ඔහුගේ scientific socialism historical materialism සහ class struggle මත grounded විය"
wrong_answers:
  - "utopian socialism economics කෙරෙහි අධිකව focus වූ අතර, scientific socialism cultural සහ artistic transformation prioritize කළ බව ඔහු තර්ක කළේය"
