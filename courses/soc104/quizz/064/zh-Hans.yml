question: "尽管 Hitler 的德国和 Stalin 的苏联共享极权主义方法，它们的经济路径有何不同？"
answer: "纳粹德国维持了私有财产的表象，同时把私营部门从属于国家目标；而斯大林主义废除了所有私人所有权，并完全计划经济"
wrong_answers:
  - "纳粹德国将所有产业完全国有化，而 Stalin 政权在农业中允许有限的私营企业"
  - "纳粹德国推动自由国际贸易以资助重整军备，而斯大林主义实行完全的经济孤立"
  - "纳粹德国依靠企业自愿与国家合作，而斯大林主义只使用强迫劳动"
explanation: >-
  尽管两个政权使用了相同的政治方法（个人崇拜、全面监控、系统性消灭反对派），但它们的经济模式在形式上有所不同。纳粹德国并未正式废除私有财产，而是把私营部门完全从属于战争和重整军备等国家目标，并实行经济自给自足。斯大林主义则走得更远，废除了所有私人所有权，实施五年计划，并直接控制所有生产和分配。
reviewed: false
