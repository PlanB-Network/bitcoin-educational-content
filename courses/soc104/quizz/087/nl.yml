question: "Waarom benadrukt Mises dat individualisme niet moet worden verward met zelfvoorziening of misantropie?"
answer: "Omdat individualisme samenwerking en vereniging bevordert, mits die berusten op de vrije instemming van de deelnemers, en erkent dat mensen hun volledige potentieel ontwikkelen via vrijwillige relaties met anderen"
wrong_answers:
  - "Omdat individualisme vereist dat mensen zich aansluiten bij verplichte burgerorganisaties om te waarborgen dat zij bijdragen aan het algemeen belang"
  - "Omdat individualisme betekent dat elke persoon volledig op de staat moet vertrouwen voor diensten die hij niet zelf kan leveren"
  - "Omdat individualisme eist dat mensen in alle domeinen met elkaar concurreren om hun persoonlijke superioriteit te bewijzen"
explanation: >-
  Mises benadrukt dat de mens een sociaal wezen is. Individualisme betekent geen isolement. Het bevordert samenwerking en vereniging op voorwaarde dat die berusten op de vrije instemming van de deelnemers. De mens kan zijn volledige potentieel alleen ontwikkelen in relatie met anderen, maar deze samenwerking moet vrijwillig zijn in plaats van opgelegd door collectieve autoriteit.
