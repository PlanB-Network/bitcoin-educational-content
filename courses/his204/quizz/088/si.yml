question: හුවමාරුවේදී වැඩි දෙයක් ලබා ගැනීමට අපි සැමවිටම අඩු දෙයක් දෙන බව අප කියන්නේ ඇයි?
answer: මන්ද අපි සැමවිටම වැඩි වටිනාකමක් දෙන දෙයක් වෙනුවෙන් අඩු වටිනාකමක් දෙන දෙයක් අත්හරිමු
wrong_answers:
  - මන්ද එය මෝඩයන්ගේ ක්‍රීඩාවකි, එහිදී අපි අපගේ නිෂ්පාදන ඒවාගේ වටිනාකමට වඩා වැඩියෙන් විකුණමු
  - මන්ද මුදලට වටිනාකමක් ඇති බැවින්, සෑම විකිණීමක්ම ධනවත් වීමකි
  - මන්ද විකුණුම්කරුවන් සැමවිටම ගැණුම්කරුවන්ට වඩා බුද්ධිමත්ය
explanation: |
  අපි වැඩි වටිනාකමක් දෙන දෙයක් ලබා ගැනීමට, අප අඩු වටිනාකමක් දෙන දෙයක් දෙමු. එම නිසා හුවමාරුව දෙපාර්ශ්වයටම ප්‍රයෝජනවත් වේ.