question: "Vad avslöjar Mussolinis deklaration från 1920, 'Allt i staten, inget utanför staten, inget mot staten', om totalitarism?"
answer: "Det finns inte längre någon åtskillnad mellan offentligt och privat rum, eftersom staten helt absorberar samhället"
wrong_answers:
  - "Staten fokuserar uteslutande på militär makt samtidigt som den lämnar ekonomin åt privat företagande"
  - "Medborgarna är fria att organisera sig privat så länge de inte öppet kritiserar regeringen"
  - "Regeringen kontrollerar endast politisk aktivitet medan kulturellt och religiöst liv förblir autonomt"
explanation: >-
  Mussolinis deklaration fångar totalitarismens väsen: totalitet. Allt absorberas in i staten, vilket innebär att det inte finns någon åtskillnad mellan offentligt och privat rum. Samhället förlorar all form av autonomi, ända ner till de mest vardagliga aktiviteterna som att öppna en idrottsklubb. Detta går långt bortom att kontrollera enbart militära, politiska eller ekonomiska sfärer.
