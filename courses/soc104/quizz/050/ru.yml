question: "Что либертарианцы ставят в центр своей политической философии?"
answer: "Этику и право"
wrong_answers:
  - "Экономический рост и создание богатства"
  - "Социальное равенство и коллективное благосостояние"
  - "Национальную идентичность и сохранение культуры"
explanation: >-
  Либертарианцы отличаются от всех других политических семей тем, что ставят в центр своей философии этику и право, а не экономику. Когда они защищают рыночную экономику, они делают это не столько из-за её способности производить богатство, сколько из-за того, что она способствует индивидуальной свободе и ответственности. Экономический рост — вторичное преимущество, а не основополагающий принцип.
