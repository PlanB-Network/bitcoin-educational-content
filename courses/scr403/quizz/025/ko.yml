question: "Simplicity 프로그램의 타입은 무엇인가요?"
answer: 1 ⊢ 1 (유닛에서 유닛으로) — 의미 있는 입력이나 출력은 없고, 부수 효과가 I/O를 처리합니다.
wrong_answers:
  - TxEnv ⊢ Bool — 트랜잭션 데이터를 받고 유효성 불리언을 반환합니다.
  - 2^256 ⊢ 2^256 — 해시 입력을 받아 새로운 해시 출력 값을 반환합니다.
  - 임의 타입 A ⊢ B — 프로그램은 완전히 임의의 입력과 출력 타입을 가질 수 있습니다.
explanation: >-
  Simplicity 프로그램은 타입 1 ⊢ 1의 표현식으로 정의됩니다. Reader 효과는
  트랜잭션 환경 입력을 포착하고, Failure 효과는 성공 또는 실패를 결정합니다.
  이러한 부수 효과가 Simplicity 타입 자체가 아니라 모든 I/O를 처리합니다.
reviewed: true
