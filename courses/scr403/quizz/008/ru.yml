question: Как работает логическая операция AND в Simplicity?
answer: Она разветвляется по первому биту — если он ложен, возвращает ложь, иначе — второй бит.
wrong_answers:
  - Она перемножает два булевых значения с помощью типа произведения.
  - Она использует таблицу соответствий со всеми четырьмя возможными комбинациями входов.
  - Она применяет комбинатор XOR, а затем комбинатор NOT к результату.
explanation: >-
  AND определяется как case (injl unit) (drop iden). Комбинатор case
  разветвляется по первому биту. Если он ложен (с левой меткой), injl unit
  возвращает ложь независимо от второго бита. Если он истинен (с правой
  меткой), drop iden возвращает второй бит без изменений. Это соответствует
  таблице истинности AND.
