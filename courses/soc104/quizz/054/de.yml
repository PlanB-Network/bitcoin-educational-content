question: "Warum begannen klassische Liberale in den Vereinigten Staaten im zwanzigsten Jahrhundert, sich 'Libertäre' zu nennen?"
answer: "Weil der amerikanische 'Liberalism' von wachsendem Staatsinterventionismus und dem Wohlfahrtsstaat vereinnahmt worden war"
wrong_answers:
  - "Weil sie sich von europäischen monarchistischen Traditionen distanzieren wollten"
  - "Weil der Begriff 'liberal' mit Anarchismus und politischer Gewalt in Verbindung gebracht wurde"
  - "Weil neue Handelsabkommen eine eigenständige politische Identität für Befürworter des freien Marktes erforderten"
explanation: >-
  Im zwanzigsten Jahrhundert vollzog sich ein grundlegender Wandel, als Laissez-faire-Prinzipien zugunsten des Wohlfahrtsstaates zunehmend aufgegeben wurden. Amerikanischer "Liberalism" bedeutete etwas ganz anderes als klassischer Liberalismus und umfasste Staatsinterventionismus. Klassische Liberale übernahmen den Begriff "libertarian", um die Unterscheidung zu bewahren. Dieses Rebranding hatte nichts mit europäischem Monarchismus, anarchistischer Gewalt oder Handelsabkommen zu tun.
reviewed: false
