question: "Tofauti kuu ya Hannah Arendt kati ya utawala wa kidhalimu wa kale na utotalitari ni ipi?"
answer: "Utotalitari hauwalazimishi tu watu kufuata kanuni za kidhalimu bali huwafanya wanadamu washindwe kuchukua hatua huru, na hivyo kuukana siasa wenyewe"
wrong_answers:
  - "Utawala wa kidhalimu wa kale hudhibiti uchumi huku utotalitari ukidhibiti tu taasisi za kisiasa na kijeshi"
  - "Utotalitari ni toleo kali zaidi tu la utawala wa kidhalimu, ukitofautiana tu kwa ukubwa wa ukandamizaji"
  - "Utawala wa kidhalimu wa kale hutumia itikadi kuhalalisha utawala wake huku utotalitari ukitegemea nguvu za kijeshi pekee"
explanation: >-
  Arendt anasema kwamba utotalitari ni tofauti kimsingi na utawala wa kidhalimu wa kale. Si udhalimu mkali zaidi tu bali ni mfumo unaowafanya wanadamu kuwa wasiohitajika, ukiharibu uwezo wao wa kuchukua hatua huru. Kwa Arendt, siasa ni uwezo wa watu kuchukua hatima yao mikononi mwao, na utotalitari ni ukanushaji wenyewe wa uwezo huu, jambo linaloufanya uwe tofauti kimaumbile na utawala wa kidhalimu.
