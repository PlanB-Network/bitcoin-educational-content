question: "बीसवीं सदी की शुरुआत से समाजवादियों को किस मूलभूत विभाजन ने अलग किया?"
answer: "क्रांतिकारी समाजवादी, जो हिंसा के माध्यम से सत्ता पर कब्ज़ा करना चाहते थे, बनाम सुधारवादी समाजवादी, जो लोकतांत्रिक चुनावों के माध्यम से परिवर्तन चाहते थे"
wrong_answers:
  - "शहरी समाजवादी, जो औद्योगिक श्रमिकों पर केंद्रित थे, बनाम ग्रामीण समाजवादी, जो कृषि कम्यूनों को संगठित करते थे"
  - "राष्ट्रवादी समाजवादी, जो अपने देश को प्राथमिकता देते थे, बनाम अंतरराष्ट्रीयतावादी समाजवादी, जो वैश्विक क्रांति की वकालत करते थे"
  - "बौद्धिक समाजवादी, जो सैद्धांतिक ग्रंथ लिखते थे, बनाम सक्रियतावादी समाजवादी, जो श्रमिक हड़तालें संगठित करते थे"
explanation: >-
  बीसवीं सदी की शुरुआत से, एक मूलभूत विभाजन ने क्रांतिकारी समाजवादियों को, जो संपत्ति अधिकारों का विरोध करते थे और हिंसा या सर्वहारा की तानाशाही के माध्यम से पूंजीवादी समाज को नष्ट करना चाहते थे, सुधारवादी समाजवादियों से अलग किया, जो अस्थायी रूप से पूंजीवाद को स्वीकार करते हुए लोकतांत्रिक चुनावों और कराधान के माध्यम से सामाजिक न्याय चाहते थे। इस विभाजन ने समाजवादी आंदोलनों के पूरे बाद के इतिहास को आकार दिया।
reviewed: false
