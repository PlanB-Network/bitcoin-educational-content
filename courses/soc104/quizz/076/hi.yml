question: "Gustave de Molinari के 1849 के संवादों में, कौन सा पात्र स्वतंत्रता को अन्य लक्ष्यों के अधीन रखने के बजाय एक मौलिक सिद्धांत के रूप में बचाव करता है?"
answer: "अर्थशास्त्री, जो स्वतंत्रता को ऐसे सिद्धांत के रूप में मानता है जो किसी भी अन्य उद्देश्य के अधीन नहीं है"
wrong_answers:
  - "समाजवादी, जो सामाजिक समानता के उद्देश्य से किए गए प्रगतिशील सुधारों के माध्यम से स्वतंत्रता का बचाव करता है"
  - "रूढ़िवादी, जो पारंपरिक सामाजिक व्यवस्था और स्थिरता को सुरक्षित रखकर स्वतंत्रता को कायम रखता है"
  - "तीनों पात्र स्वतंत्रता का समान रूप से बचाव करते हैं, लेकिन इसे लागू करने के तरीके पर असहमत हैं"
explanation: >-
  Les Soirees de la rue Saint-Lazare से Molinari के संवादों में, अर्थशास्त्री समाजवादी और रूढ़िवादी दोनों के साथ स्थायी असहमति में खड़ा है। वही अकेला है जो स्वतंत्रता को एक मौलिक सिद्धांत के रूप में बचाव करता है। समाजवादी स्वतंत्रता को प्रगतिशील आदर्शों के अधीन करता है, और रूढ़िवादी उसे व्यवस्था बनाए रखने के अधीन करता है, जिससे अर्थशास्त्री स्वतंत्रता की अपनी बिना शर्त रक्षा में अद्वितीय बन जाता है।
reviewed: false
