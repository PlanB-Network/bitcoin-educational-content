question: "Wat bedoelde Ludwig von Mises toen hij schreef dat alleen het individu denkt, redeneert en handelt?"
answer: "Dat collectiviteiten zoals de staat of een natie geen eigen bestaan hebben buiten de handelingen van hun individuele leden"
wrong_answers:
  - "Dat individuen moeten vermijden groepen of verenigingen te vormen omdat collectief handelen altijd schadelijk is"
  - "Dat alleen bepaalde begaafde individuen in staat zijn tot rationeel denken, terwijl de meeste mensen instinct volgen"
  - "Dat denken en redeneren privéactiviteiten zijn die nooit in het openbaar mogen worden gedeeld of besproken"
explanation: >-
  Mises verduidelijkte dat individualisme zich verzet tegen de gedachte dat sociale entiteiten zoals de samenleving of de natie onafhankelijk zouden kunnen bestaan van de individuen waaruit zij bestaan. Een collectiviteit heeft geen eigen bestaan buiten de handelingen van haar individuele leden. We kunnen niet betekenisvol spreken over het handelen van de staat of een bedrijf, omdat deze entiteiten geen eigen wil of gedachte hebben en alleen via individuen handelen.
