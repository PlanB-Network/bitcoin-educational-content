question: "Muhafazakâr ve liberteryen tutumlar, her ikisi de asgari ücretin kaldırılmasını desteklemesine rağmen, gerekçelendirmelerinde nasıl farklılaşır?"
answer: "Muhafazakârlar, rekabet gücünü engellemediği sürece ücret belirlemede bir miktar devlet müdahalesini kabul ederken liberteryenler asgari ücreti işe alma ve iş yapma özgürlüğüne ahlaki bir dayatma olarak görür"
wrong_answers:
  - "Muhafazakârlar asgari ücrete enflasyon yarattığı için karşı çıkarken liberteryenler işçi sendikalarına çok fazla güç verdiği için karşı çıkar"
  - "Muhafazakârlar ücretlerin dinî ve cemaat kurumları tarafından belirlenmesini isterken liberteryenler ücretlerin hükümet onaylı piyasa araştırmalarıyla belirlenmesini ister"
  - "Muhafazakârlar asgari ücretlerin bölgeye göre değişmesi gerektiğine inanırken liberteryenler ülke çapında tek bir sabit ücretin uygulanması gerektiğine inanır"
explanation: >-
  Her ikisi de asgari ücretin azaltılmasını veya kaldırılmasını destekler, ancak gerekçeleri temelden farklıdır. Muhafazakârlar, devlet müdahalesinin sınırlı ve bağlama bağlı kalmasında ısrar ederek ücret belirlemede bir miktar devlet müdahalesini kabul eder ve rekabet gücüne odaklanır. Liberteryenler daha güçlü bir ahlaki tutum alır: asgari ücret, işe alma ve iş yapma özgürlüğüne bir dayatmadır. Liberteryenler "piyasa" dediklerinde, devlet müdahalesi olmadan iki taraf arasında özgürce müzakere edilen sözleşmeyi kastederler.
