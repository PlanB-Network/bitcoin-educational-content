question: "What two ways does a ruling minority have to keep public opinion on its side?"
answer: "Improving opinion by governing well, or influencing it through propaganda and censorship."
wrong_answers:
  - "Raising salaries or lowering taxes."
  - "Elections and referendums."
  - "Public education and private media, which are independent of power."
explanation: |
  Both are used everywhere. The more detached the minority's interests become from the majority's, the harder 'improving' gets — and the more the effort shifts toward influencing, as Bernays described in Propaganda (1928).
reviewed: false
