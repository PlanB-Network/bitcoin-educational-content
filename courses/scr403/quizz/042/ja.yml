question: Simplicity の効果は可換かつ冪等ですが、単位的ではありません。したがって一般にはどのオプティマイザ変換を拒否しなければならないのでしょうか？
answer: 一見未使用に見える式を unit に置き換えることです。Failure は単位的ではないため、中止すべき失敗した検査を隠してしまう可能性があります。
wrong_answers:
  - 2 つの独立した部分式を入れ替えること。sig-all-hash が異なる環境状態を観測する可能性があるためである。
  - 2 つの同一の verify 呼び出しをマージすること。複製された Failure が 2 回例外を投げ、不正に中止するためである。
  - 例外を投げる可能性のある式を並べ替えること。伝播される例外はどちら側が先に実行されるかに依存するためである。
explanation: >-
  Simplicity の効果は可換かつ冪等であることが保証されているため、独立した部分式を
  入れ替えたり、同一の式を複製またはマージしたりすることは常に安全です。Reader 環境は
  固定されており、Failure の unit 型の例外は、どちら側が先に例外を投げるか、何回投げるかに
  かかわらず同一です。しかし、破棄変換 `f ⨾ unit = unit` には単位性が必要であり、
  Failure にはそれがありません。`f` が無効な署名に対する `bip0340-verify` を含んでいる場合、
  その「未使用」コードを削除すると、中止が最適化で取り除かれ、本来失敗すべきトランザクションを
  有効化してしまいます。
reviewed: false
