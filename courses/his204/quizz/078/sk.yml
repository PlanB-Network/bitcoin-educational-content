question: Aký je Turgotov argument vo Valeurs et monnaie?
answer: Hodnota vecí závisí od subjektívneho hodnotenia ľudí
wrong_answers:
  - Hodnota vecí závisí od ich vnútorných vlastností
  - Hodnotu vecí môžeme merať iba peniazmi
  - Hodnotu určuje práca
explanation: |
  Turgot obhajuje subjektívnu teóriu hodnoty, podľa ktorej hodnota tovaru závisí od užitočnosti, ktorú prináša jednotlivcovi, a od jeho osobného hodnotenia.
