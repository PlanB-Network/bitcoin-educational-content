question: "Che cosa rivela sul totalitarismo la dichiarazione di Mussolini del 1920: 'Tutto nello Stato, nulla al di fuori dello Stato, nulla contro lo Stato'?"
answer: "Non esiste più alcuna separazione tra spazio pubblico e spazio privato, poiché lo Stato assorbe interamente la società"
wrong_answers:
  - "Lo Stato si concentra esclusivamente sul potere militare lasciando l'economia all'impresa privata"
  - "I cittadini sono liberi di organizzarsi privatamente purché non critichino apertamente il governo"
  - "Il governo controlla solo l'attività politica, mentre la vita culturale e religiosa rimane autonoma"
explanation: >-
  La dichiarazione di Mussolini coglie l'essenza del totalitarismo: la totalità. Tutto viene assorbito nello Stato, il che significa che non esiste separazione tra spazio pubblico e spazio privato. La società perde ogni forma di autonomia, fino alle attività più ordinarie come aprire un club sportivo. Questo va ben oltre il controllo delle sole sfere militare, politica o economica.
reviewed: false
