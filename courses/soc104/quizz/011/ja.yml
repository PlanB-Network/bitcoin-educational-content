question: "経済的自由のカテゴリには何が含まれますか？"
answer: "生産者および消費者として行うこと、すなわち購入、販売、生産、労働、雇用、そして自分のお金の管理"
wrong_answers:
  - "あなたの宗教的信念、個人的関係、表現の自由"
  - "投票し、選挙に参加し、政党に加入する権利"
  - "自由に移動し、居住地を選び、国境を越える能力"
explanation: >-
  経済的自由は、生産者および消費者としてあなたが行うことを対象とします。何を購入、販売、または生産できるか、どこで働くか、誰を雇うか、そして自分のお金で何をするかです。個人的関係、宗教的信念、移動の自由は、経済的自由ではなく個人的自由のカテゴリに属します。
reviewed: false
