question: "Ako tri základné funkcie slobodného trhu, ako ich opisujú libertariáni, spolu tvoria efektívny aj etický systém spoločenskej organizácie?"
answer: "Ceny poskytujú kompas pre rozhodnutia, trh odhaľuje autentické preferencie prostredníctvom ponuky a dopytu a slobodná výmena umožňuje jednotlivcom určovať vlastné záležitosti podľa osobných hodnôt, čím spája informačnú efektívnosť s morálnou autonómiou"
wrong_answers:
  - "Trh maximalizuje celkové bohatstvo, zabraňuje monopolom prostredníctvom prirodzenej konkurencie a zabezpečuje rovnaké rozdelenie zdrojov, čím spája produktivitu so sociálnou spravodlivosťou"
  - "Slobodné trhy znižujú vládne výdavky, stimulujú technologické inovácie a vytvárajú pracovné príležitosti, čím spájajú fiškálnu zodpovednosť s ekonomickým rastom"
  - "Trhy znižujú spotrebiteľské ceny, zvyšujú kvalitu produktov prostredníctvom konkurencie a rozširujú medzinárodný obchod, čím spájajú domácu prosperitu s globálnou spoluprácou"
explanation: >-
  Libertariánska obhajoba slobodného trhu stojí na troch vzájomne prepojených funkciách. Po prvé, ceny slúžia ako spoľahlivé ukazovatele usmerňujúce ekonomické a spoločenské rozhodnutia (kompas). Po druhé, trh odhaľuje autentické individuálne preferencie prostredníctvom ponuky a dopytu. Po tretie, slobodná výmena umožňuje aktérom určovať vlastné záležitosti podľa osobných hodnôt. Hayek ukázal, že slobodné trhy koordinujú rozptýlené informácie lepšie než centrálne plánovanie (efektívnosť), zatiaľ čo vzájomný súhlas rešpektuje ľudskú dôstojnosť viac než nátlak (spravodlivosť).
