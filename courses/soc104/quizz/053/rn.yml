question: "Kubera iki Ron Paul avuga ko Federal Reserve itera ingorane, kandi Bitcoin ifitaniye gute isano n'ico ciyumviro ciwe?"
answer: "Federal Reserve itera inflation n'imizunguruko y'ubutunzi biciye mu gukoresha nabi amafaranga ya fiat, kandi Bitcoin iserukira ubwoko bw'amafaranga akomeye yoshobora gusubirira gold standard"
wrong_answers:
  - "Federal Reserve igabanya uguhiganwa kw'amabanki, kandi Bitcoin ikura serivisi z'amabanki mu kigo kimwe kugira ngo yongere ugushikira serivisi z'imari"
  - "Federal Reserve ibuza ubudandaji bwigenga hagati y'ibihugu, kandi Bitcoin ishoboza ama transactions atagira imbibe ata ruhusha rwa Leta"
  - "Federal Reserve irema umwenda wa Leta urenze urugero, kandi Bitcoin itanga amafaranga agabanya igiciro uko igihe kigenda, akuraho umwenda w'igihugu"
explanation: >-
  Ron Paul, minarchist, avuga ko Federal Reserve ari yo ibazwa inflation n'imizunguruko y'ubutunzi kuko ikoresha nabi amafaranga ya fiat. Arashigikira gukura amafaranga mu maboko ya Leta, iciyumviro cashigikiwe na Friedrich Hayek, kandi abona Bitcoin nk'ubwoko bw'amafaranga akomeye yoshobora gusubirira gold standard. Ukunegura kwiwe gushingiye ku nyigisho ya libertarian y'amafaranga, si cane cane ku guhiganwa kw'amabanki, inzitizi z'ubudandaji, canke umwenda wa Leta.
reviewed: false
