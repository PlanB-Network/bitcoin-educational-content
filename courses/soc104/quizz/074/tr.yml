question: "Sübvansiyonlar tartışması bağlamında 'ahlaki tehlike' kavramı nedir ve bu kaygıyı hangi siyasi aile dile getirir?"
answer: "Ahlaki tehlike, şirketlerin sübvansiyonlar yoluyla batmaktan alıkonulduğunda sorumsuzluğa teşvik edilmesidir, çünkü nihayetinde vergi mükellefi öder; bu kaygıyı liberteryenler dile getirir"
wrong_answers:
  - "Ahlaki tehlike, sübvanse edilen şirketlerin daha düşük vergili ülkelere taşınarak işleri de beraberlerinde götürmesi riskidir; bu kaygıyı muhafazakârlar dile getirir"
  - "Ahlaki tehlike, hükümet yetkililerinin hangi şirketlerin sübvansiyon alacağını seçerek yozlaşması tehlikesidir; bu kaygıyı merkezciler dile getirir"
  - "Ahlaki tehlike, şirketlerin kamu fonu aldıktan sonra işçileri sömürmesi etik sorunudur; bu kaygıyı sosyalistler dile getirir"
explanation: >-
  Liberteryenler, sübvansiyonların ve kurtarmaların ahlaki tehlike yarattığını savunur: şirketler batmaktan alıkonulduğunda, kötü kararların hiçbir sonucu olmadığı için sorumsuzluğu ve pervasızlığı teşvik eder. Sonunda ödeyen vergi mükellefidir; liberteryenler bunu son derece adaletsiz görür. Bu kavram, diğer siyasi ailelerin dile getirdiği şirket taşınması, resmî yolsuzluk veya işçi sömürüsü kaygılarından ayrıdır.
