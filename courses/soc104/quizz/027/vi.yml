question: "Tại sao những người theo chủ nghĩa tự do cổ điển ở Hoa Kỳ bắt đầu gọi mình là 'libertarians' từ thập niên 1960 trở đi?"
answer: "Để phân biệt họ với các liberal Mỹ, khi ý nghĩa của thuật ngữ này đã dịch chuyển sang chủ nghĩa can thiệp nhà nước"
wrong_answers:
  - "Để liên kết mình với Đảng Dân chủ và các chương trình xã hội tiến bộ của đảng này"
  - "Để báo hiệu sự ủng hộ của họ đối với các cải cách Great Society của Lyndon B. Johnson"
  - "Để tiếp nhận một bản sắc cách mạng cấp tiến hơn lấy cảm hứng từ các phong trào xã hội chủ nghĩa châu Âu"
explanation: >-
  Ở Hoa Kỳ, từ 'liberal' đã chuyển sang chỉ những người ủng hộ Big Government và can thiệp nhà nước, đặc biệt sau New Deal và Great Society. Những người theo chủ nghĩa tự do cổ điển đã dùng nhãn 'libertarian' để giữ lại ý nghĩa ban đầu của triết lý của họ. Họ đang tạo khoảng cách với các liberal Mỹ, chứ không liên kết với họ.
reviewed: false
