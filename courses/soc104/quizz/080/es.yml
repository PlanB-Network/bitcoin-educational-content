question: "¿Por qué la predicción de Molinari de 1849 resultó profética respecto de la relación entre libertad y poder político?"
answer: "Porque conservadores y socialistas se han alternado en el poder e instrumentalizado la libertad al servicio de sus respectivos objetivos políticos, exactamente como él describió"
wrong_answers:
  - "Porque el personaje del economista que describió acabó alcanzando el poder político e implementó políticas libertarias en toda Europa"
  - "Porque su predicción de que las tres familias políticas se fusionarían en un único movimiento centrista se hizo realidad en el siglo XX"
  - "Porque los gobiernos sucesivos ampliaron gradualmente la libertad hasta convertirla en el principio organizador principal de las democracias modernas"
explanation: >-
  La visión de Molinari resultó profética porque, desde mediados del siglo XIX, conservadores y socialistas se han alternado en el poder y han llevado a cabo precisamente lo que él describió: la instrumentalización de la libertad al servicio de objetivos políticos. Ambas familias están dispuestas a restringir libertades y a recurrir al Estado para imponer sus respectivas agendas, mientras que la posición del economista de libertad incondicional siguió marginada.
