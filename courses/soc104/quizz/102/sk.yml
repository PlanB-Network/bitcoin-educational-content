question: "Ako kurz tvrdí, že sloboda umožňuje ľavicovým aj pravicovým hodnotám pokojne spolunažívať?"
answer: "V režime skutočnej slobody môžu ľudia s ľavicovými ideálmi dobrovoľne zdieľať majetok a prerozdeľovať prostriedky, zatiaľ čo ľudia s pravicovými hodnotami môžu sporiť a odovzdávať tradície bez toho, aby ktorákoľvek strana vnucovala svoj spôsob života druhej"
wrong_answers:
  - "Sloboda vyžaduje, aby obe strany urobili kompromis prijatím centristickej pozície, v ktorej vláda vyvažuje súperiace hodnoty miernou reguláciou"
  - "Sloboda znamená, že ľavicové a pravicové komunity musia žiť na oddelených geografických územiach s vlastnými nezávislými vládami"
  - "Sloboda funguje tak, že občanom umožňuje hlasovať o tom, ktoré hodnoty sa majú v každom regióne presadzovať, pričom ľavicové a pravicové politiky sa striedajú v každom volebnom cykle"
explanation: >-
  Kurz ukazuje, že v skutočnom režime slobody sa tí, ktorí sa hlásia k ľavicovým ideálom, môžu dobrovoľne vzdať majetku, zdieľať výrobné prostriedky alebo darovať mzdy prerozdeľovacím organizáciám. Tí, ktorí majú pravicové hodnoty, môžu tvrdo pracovať, sporiť a odovzdávať rodinné hodnoty. Nikto by nemal vnucovať svoj spôsob života iným. Práve prostredníctvom slobody trhu a sily voľby možno ciele dosiahnuť pokojne.
