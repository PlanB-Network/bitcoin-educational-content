question: Quelle est la différence fondamentale entre la philosophie de la liberté et la philosophie du pouvoir ?
answer: La philosophie de la liberté valorise la propriété privée, tandis que la philosophie du pouvoir valorise l'intérêt collectif.
wrong_answers:
  - La philosophie de la liberté privilégie l'individu tandis que la philosophie du pouvoir privilégie la société.
  - La philosophie de la liberté a émergé durant les Lumières, tandis que la philosophie du pouvoir remonte à l'Antiquité.
  - La philosophie de la liberté s'appuie sur le droit naturel tandis que la philosophie du pouvoir s'appuie sur la loi positive.
explanation: |
  La distinction fondamentale est que la philosophie de la liberté repose sur la propriété privée et les droits individuels, tandis que la philosophie du pouvoir justifie l'autorité collective pour organiser la société, souvent au détriment de la propriété individuelle et de l'autonomie.
reviewed: true
