question: "Que voulait dire Ludwig von Mises lorsqu'il écrivait que seul l'individu pense, raisonne et agit ?"
answer: "Que les collectivités comme l'État ou une nation n'ont pas d'existence propre au-delà des actions de leurs membres individuels"
wrong_answers:
  - "Que les individus devraient éviter de former des groupes ou des associations parce que l'action collective est toujours nuisible"
  - "Que seuls certains individus doués sont capables de pensée rationnelle tandis que la plupart des gens suivent leur instinct"
  - "Que penser et raisonner sont des activités privées qui ne devraient jamais être partagées ni discutées en public"
explanation: >-
  Mises a clarifié que l'individualisme s'oppose à l'idée selon laquelle des entités sociales comme la société ou la nation pourraient exister indépendamment des individus qui les composent. Une collectivité n'a pas d'existence propre au-delà des actions de ses membres individuels. Nous ne pouvons pas parler de manière significative de l'action de l'État ou d'une entreprise parce que ces entités n'ont pas de volonté ni de pensée propres et n'agissent qu'à travers des individus.
reviewed: false
