question: "دو محور نمودار نولان کدام‌اند؟"
answer: "یک محور عمودی که آزادی‌های شخصی را می‌سنجد و یک محور افقی که آزادی‌های اقتصادی را می‌سنجد"
wrong_answers:
  - "یک محور افقی از چپ به راست و یک محور عمودی از اقتدارگرا تا دموکراتیک"
  - "یک محور عمودی که ثروت را می‌سنجد و یک محور افقی که سطح تحصیلات را می‌سنجد"
  - "یک محور افقی از سوسیالیسم تا سرمایه‌داری و یک محور عمودی از سنت تا پیشرفت"
explanation: >-
  دیوید نولان نمودار خود را با دو محور مشخص طراحی کرد: آزادی‌های شخصی (عمودی) و آزادی‌های اقتصادی (افقی). این رویکرد دوبعدی جایگزین خط بیش‌ازحد ساده‌شدهٔ چپ-راست می‌شود و با جدا کردن دو دستهٔ اصلی آزادی، پیچیدگی ایدئولوژی‌های سیاسی را بهتر ثبت می‌کند.
reviewed: false
