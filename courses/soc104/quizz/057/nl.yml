question: "Wat zijn de kardinale waarden van centrisme?"
answer: "Gematigdheid, compromis, aanpassing en publiek nut"
wrong_answers:
  - "Traditie, orde, gezag en nationale identiteit"
  - "Vrijheid, privé-eigendom, instemming en individuele verantwoordelijkheid"
  - "Gelijkheid, sociale rechtvaardigheid, solidariteit en collectief eigendom"
explanation: >-
  De kardinale waarden van centrisme zijn gematigdheid, compromis, aanpassing en publiek nut. Ze weerspiegelen de centristische nadruk op pragmatisch evenwicht in plaats van ideologische toewijding. De andere opties beschrijven respectievelijk de kardinale waarden van conservatisme, libertarianisme en socialisme.
reviewed: false
