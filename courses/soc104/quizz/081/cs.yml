question: "Proč se Molinariho předpověď z roku 1849 ukázala jako prorocká ohledně vztahu mezi svobodou a politickou mocí?"
answer: "Protože konzervativci a socialisté se střídali u moci a instrumentalizovali svobodu ve službě svým příslušným politickým cílům přesně tak, jak popsal"
wrong_answers:
  - "Protože postava ekonoma, kterou popsal, nakonec získala politickou moc a zavedla libertariánské politiky po celé Evropě"
  - "Protože jeho předpověď, že všechny tři politické rodiny splynou do jednoho centristického hnutí, se ve dvacátém století naplnila"
  - "Protože svoboda byla postupně rozšiřována po sobě jdoucími vládami, až se stala hlavním organizačním principem moderních demokracií"
explanation: >-
  Molinariho vize se ukázala jako prorocká, protože od poloviny devatenáctého století se konzervativci a socialisté střídali u moci a uskutečňovali přesně to, co popsal: instrumentalizaci svobody ve službě politickým cílům. Obě rodiny jsou ochotné omezovat svobody a povolat stát, aby prosadil jejich příslušné agendy, zatímco ekonomova pozice bezpodmínečné svobody zůstala marginalizována.
