question: How does biblical ethics differ from ancient ethics?
answer: Biblical ethics assigns infinite value to the individual as they are created in the image of God, whereas ancient ethics subordinates man to the cosmos.
wrong_answers:
  - Biblical ethics advocates for love of neighbor and compassion, while ancient ethics emphasizes justice and reciprocity.
  - Biblical ethics focuses on ritual observance, whereas ancient ethics is based on rational inquiry.
  - Biblical ethics addresses all men, whereas ancient ethics is reserved for an elite group of citizens.
explanation: |
  The fundamental difference is that biblical ethics affirms the sacred and infinite value of each individual created in God's image, whereas ancient thought subordinated man to a divine cosmos, treating him as merely part of a larger order.
reviewed: true
