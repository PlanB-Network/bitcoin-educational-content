question: "Was glauben die französischen Libertaires (sozialistischen Anarchisten) über Privateigentum?"
answer: "Privateigentum und Kapitalismus müssen abgeschafft werden, weil sie Quellen der Unterdrückung sind"
wrong_answers:
  - "Privateigentum ist ein natürliches Recht, das dem Staat vorausgeht und um jeden Preis geschützt werden muss"
  - "Privateigentum sollte vom Staat reguliert, aber niemals vollständig aus der Gesellschaft beseitigt werden"
  - "Privateigentum ist nur akzeptabel, wenn es gleichmäßig unter allen Mitgliedern einer Kommune verteilt wird"
explanation: >-
  Die französischen Libertaires, Erben des sozialistischen Anarchismus durch Denker wie Proudhon und Bakunin, vertreten die Auffassung, dass sowohl der Staat als auch das Privateigentum als zwei Quellen der Unterdrückung abgeschafft werden müssen. Dies kommt in Proudhons berühmter Formel "Eigentum ist Diebstahl" zum Ausdruck. Die erste falsche Antwort beschreibt die libertäre Position, die der libertaire-Sicht grundlegend entgegengesetzt ist.
reviewed: false
