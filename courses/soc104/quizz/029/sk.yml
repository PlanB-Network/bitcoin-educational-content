question: "Ako sa líšia úlohy Cato Institute, Mises Institute a Libertarian Party v rámci libertariánskeho hnutia?"
answer: "Cato Institute sa zameriava na návrhy verejnej politiky, Mises Institute na vzdelávanie a akademické publikovanie a Libertarian Party na volebnú politiku"
wrong_answers:
  - "Cato Institute financuje politické kampane, Mises Institute priamo lobuje v Kongrese a Libertarian Party organizuje akademické konferencie"
  - "Cato Institute vydáva ekonomické učebnice, Mises Institute vedie kampane na registráciu voličov a Libertarian Party pripravuje legislatívne návrhy"
  - "Cato Institute organizuje protesty zdola, Mises Institute poskytuje právnu obhajobu libertariánom a Libertarian Party riadi výskum think tankov"
explanation: >-
  Cato Institute (založený v roku 1977) je think tank so sídlom vo Washingtone, ktorý pracuje na návrhoch verejnej politiky. Mises Institute (založený v roku 1982) sa zameriava na vzdelávanie, nie na politické lobovanie, a funguje ako druh online univerzity s konferenciami a znovu vydávanými dielami. Libertarian Party (založená v roku 1971) je tretia najväčšia americká politická strana, ktorá sa zúčastňuje volieb, kde aj jej približne 2 % podiel hlasov môže rozhodnúť výsledok.
reviewed: false
