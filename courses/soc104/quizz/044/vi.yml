question: "Green New Deal đại diện cho một sự tiến hóa đương đại của chủ nghĩa xã hội dân chủ như thế nào?"
answer: "Nó sử dụng các mối quan ngại môi trường như một biện minh mới cho sự can thiệp của nhà nước và việc tịch thu thu nhập tư nhân, đặt lợi ích cá nhân dưới sức khỏe chung của hành tinh"
wrong_answers:
  - "Nó từ bỏ hoàn toàn kinh tế học xã hội chủ nghĩa truyền thống để ủng hộ các giải pháp thị trường tự do cho vấn đề môi trường thông qua giao dịch carbon"
  - "Nó bác bỏ sự can thiệp của nhà nước và thay vào đó dựa vào hành động cá nhân tự nguyện cùng đổi mới của khu vực tư nhân để giải quyết biến đổi khí hậu"
  - "Nó đại diện cho một sự đoạn tuyệt với chủ nghĩa xã hội bằng cách ưu tiên bảo vệ môi trường hơn mọi mối quan ngại về công bằng xã hội và việc làm"
explanation: >-
  Green New Deal hợp nhất các mối quan ngại môi trường với các mục tiêu xã hội, kết hợp chuyển đổi sinh thái với công bằng xã hội, bảo đảm việc làm và các dịch vụ công được tăng cường. Lợi ích cá nhân bị đặt dưới lợi ích tập thể được định nghĩa bằng sức khỏe hành tinh. Về cốt lõi, nó cung cấp một lớp vỏ tu từ mới biện minh cho sự can thiệp của nhà nước và việc tịch thu thu nhập tư nhân, không còn chỉ nhân danh công bằng xã hội mà còn nhân danh môi trường.
