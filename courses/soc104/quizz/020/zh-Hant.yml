question: "Nolan diagram 的縱軸揭示了真正的政治問題是什麼？"
answer: "它揭示的是，你想透過國家把自己的感性傾向強加給他人，還是偏好每個人都能自由地自行決定"
wrong_answers:
  - "它揭示的是，你支持民主治理，還是偏好由單一領導者進行威權統治"
  - "它揭示的是，你認同進步社會運動，還是認同傳統宗教制度"
  - "它揭示的是，你的首要關切是國家安全，還是經濟繁榮"
explanation: >-
  縱軸揭示了真正的政治問題：不是你是左翼還是右翼，而是你希望國家在多大程度上介入，按照你的價值觀塑造社會。你是否希望把自己的感性傾向強加給他人，還是偏好每個人都能自由地自行決定？這一框架超越左右分野，並表明兩個陣營都可能同樣是國家主義者。
