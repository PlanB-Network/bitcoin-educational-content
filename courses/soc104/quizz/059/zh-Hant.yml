question: "中間派務實主義中隱藏著什麼悖論？"
answer: "務實主義本身建立在某種教條主義之上，也就是未明說地相信只有專家有能力引導社會"
wrong_answers:
  - "中間派聲稱自己溫和，但在聯合政府中始終與左翼政黨結盟"
  - "中間派政策看似平衡，卻總是偏好經濟成長而非環境保護"
  - "中間派拒絕意識形態，但在制定經濟決策時採納僵硬的自由市場原則"
explanation: >-
  中間派務實主義的悖論在於，它聲稱拒絕意識形態而偏好理性專業知識，但這個主張本身建立在一個不可見且未明說的教條之上：只有技術官僚能夠作出正確決定。這種信念認為唯有專家應引導社會，它本身就是一種意識形態承諾，儘管中間派並不承認它如此。
