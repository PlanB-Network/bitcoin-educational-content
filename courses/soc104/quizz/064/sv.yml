question: "Varför har totalitära regimer beskrivits som 'sekulära religioner', och vad avslöjar detta om de villkor som krävs för att totalitarism ska existera?"
answer: "De kräver kvasireligiös tro från militanta anhängare och använder rädsla mot motståndare, och totalitarism kräver alla kännetecken samtidigt: undertryckta friheter, enpartistyre, våldsam revolution och en styrd ekonomi"
wrong_answers:
  - "De ersätter traditionell dyrkan med statsceremonier, och totalitarism kräver endast en karismatisk ledare och militär kontroll"
  - "De använder religiösa institutioner för att genomdriva statsideologi, och totalitarism kan uppstå närhelst ett enda politiskt parti dominerar parlamentet"
  - "De lovar andlig frälsning genom politisk handling, och totalitarism existerar närhelst staten kontrollerar ekonomin oavsett politiska friheter"
explanation: >-
  Raymond Aron observerade att totalitära regimer fungerar enligt två principer: de militanta anhängarnas tro och motståndarnas rädsla. Denna kvasireligiösa fanatism kännetecknar dem bortom deras olika motivationer och har gett dem etiketten sekulära religioner. Avgörande är att totalitarism kräver alla definierande kännetecken samtidigt: undertryckta friheter, obegränsad auktoritet genom ett enda parti, våldsam revolution och en styrd ekonomi. Moderna demokratier kan uppvisa vissa av dessa drag, men totalitarism finns endast när alla är samlade tillsammans.
reviewed: false
