question: "Какво включва категорията лична свобода?"
answer: "Това, което правите в частните си отношения, с вашите мнения, убеждения и всичко, което включва собственото ви тяло и ум"
wrong_answers:
  - "Това, което правите като производител, включително започване на бизнес, наемане на служители и търговия със стоки"
  - "Колко данъци плащате, какви инвестиции правите и как управлявате финансовите си активи"
  - "Способността ви да се конкурирате на пазара, да определяте цени за продуктите си и да избирате доставчиците си"
explanation: >-
  Личната свобода обхваща това, което правите в частните си отношения, с вашите мнения и убеждения, и всичко, което включва собственото ви тяло и ум. Това включва брака, избора на четива, религиозните практики, избора на храни и лекарства и хората, с които общувате. Бизнес дейностите, данъците и решенията на пазара попадат в икономическата свобода.
reviewed: false
