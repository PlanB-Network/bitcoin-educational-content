question: "Bitcoin 如何作为一个具有政治后果的道德项目，而不是一个带有道德主张的政治项目发挥作用？"
answer: "Bitcoin 的设计是为了让人自由，而不是让人致富，它使有效财产成为可能，保护劳动价值，并保存隐私；这些道德成就会产生政治效果，却不宣称属于任何政治阵营"
wrong_answers:
  - "Bitcoin 是一个道德项目，因为它的代码强制执行防止欺诈的伦理规则，而它的政治后果是用算法决策取代民主治理"
  - "Bitcoin 作为道德项目发挥作用，因为它把财富从富人重新分配给早期采用者，创造一个更公平的社会，并对税收政策产生政治影响"
  - "Bitcoin 是道德的，因为 Satoshi Nakamoto 在协议中嵌入了伦理戒律，而它的政治后果是把所有政治家族联合到一个共同的货币体系下"
explanation: >-
  Bitcoin 的设计不是为了让人致富，而是为了让人自由。它实现了三个道德结果：使有效财产成为可能（激励责任），保护由劳动创造的价值（鼓励生产性努力），并保存隐私（让人们能够无惧地生活）。这些都是带有政治后果的道德成就，却不属于任何政治阵营，因此它首先是道德项目，其次才是政治项目。
reviewed: false
