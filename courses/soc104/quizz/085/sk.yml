question: "Aký je kľúčový rozdiel medzi tým, byť pro-business, a tým, byť pro-market?"
answer: "Zástancovia pro-business hľadajú štátny zásah na ochranu konkrétnych firiem pred zlyhaním, zatiaľ čo zástancovia pro-market podporujú dereguláciu a nechávajú podniky zlyhať, aby sa trh mohol prirodzene reorganizovať"
wrong_answers:
  - "Zástancovia pro-business sa zameriavajú na veľké korporácie, zatiaľ čo zástancovia pro-market sa zameriavajú výlučne na podporu malých podnikov a startupov"
  - "Pro-business je ľavicová pozícia, ktorá uprednostňuje robotnícke družstvá, zatiaľ čo pro-market je pravicová pozícia, ktorá uprednostňuje súkromné vlastníctvo"
  - "Zástancovia pro-business odmietajú všetku konkurenciu, zatiaľ čo zástancovia pro-market podporujú vládou regulovanú konkurenciu medzi schválenými podnikmi"
explanation: >-
  Pozícia pro-business chápe konkurenciu ako nástroj vládnutia získaný prostredníctvom regulácií a ospravedlňuje dotácie a záchranné balíky, aby zabránila strate pracovných miest. V pohľade pro-business je trh krehký a potrebuje záchranu zo strany štátu. Zástancovia pro-market vidia konkurenciu ako prirodzený výsledok slobodného podnikania, čo znamená dereguláciu a umožnenie podnikom zlyhať, pretože zlyhanie umožňuje trhu prirodzene sa reorganizovať a otvára pole schopnejším aktérom.
