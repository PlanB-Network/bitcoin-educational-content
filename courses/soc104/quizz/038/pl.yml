question: "Dlaczego definicje intencjonalne systemów politycznych uznaje się za problematyczne dla celów analitycznych?"
answer: "Tworzą pojęciowe zamieszanie, ponieważ wszystkie systemy twierdzą, że dążą do podobnych celów, takich jak sprawiedliwość, słuszność i wolność"
wrong_answers:
  - "Są zbyt precyzyjne i sztywne, nie pozostawiając miejsca na naturalną ewolucję ruchów politycznych w czasie"
  - "Zbyt mocno skupiają się na wynikach gospodarczych i ignorują kulturowe oraz społeczne wymiary życia politycznego"
  - "Opierają się na tajnych dokumentach rządowych, które rzadko są dostępne niezależnym badaczom"
explanation: >-
  Definicje intencjonalne opierają się na deklarowanych motywacjach i celach, ale każdy system polityczny twierdzi, że dąży do sprawiedliwości, słuszności i wolności. To sprawia, że systemów nie da się od siebie odróżnić. Analiza strukturalna przeciwnie, ocenia systemy według ich empirycznych, mierzalnych konsekwencji i środków, których używają, ujawniając ich prawdziwą naturę poza retoryką.
reviewed: false
