question: "Šta libertarijanci veruju o sposobnosti pojedinaca da donose odluke?"
answer: "Pojedinci imaju i pravo i odgovornost da donose sopstvene odluke o svom životu"
wrong_answers:
  - "Pojedinci treba da donose odluke tek nakon konsultacija s izabranim predstavnicima koji razumeju političke implikacije"
  - "Pojedinci su uglavnom nesposobni da donose dobre odluke i potrebne su im stručne smernice državnih institucija"
  - "Pojedinci treba slobodno da donose ekonomske odluke, ali da se povinuju državi u svim društvenim i kulturnim pitanjima"
explanation: >-
  S libertarijanskog stanovišta, pojedinci imaju i pravo i odgovornost da donose sopstvene odluke. To je u suprotnosti s konvencionalnim političkim porodicama od levice do desnice, koje veruju da vlada treba da donosi neke ili mnoge važne odluke u životu pojedinca i u ekonomskom životu uopšte.
