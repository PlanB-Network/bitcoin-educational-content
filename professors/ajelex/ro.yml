bio: |
  Pasionat de Bitcoin și mining, îl însoțesc pe DiscoverBitcoin în misiunea lor educațională din El Salvador și din întreaga lume. De-a lungul călătoriei mele prin gaura de iepure a Bitcoin, am descoperit o pasiune anume pentru mining și conceptul de Home Miner. Cu acest gând în minte, am lansat, în paralel, proiectul Attakai Explorer la MIN201.

short_bio: Creatorul Attakai
