question: "¿Cómo llegaron al poder todos los regímenes totalitarios?"
answer: "Mediante una revolución violenta que justificaba hacer borrón y cuenta nueva del sistema anterior"
wrong_answers:
  - "Mediante una reforma legislativa gradual dentro de las instituciones democráticas existentes"
  - "Mediante golpes militares organizados por potencias extranjeras que buscaban el control regional"
  - "Mediante movimientos de masas pacíficos que ganaron elecciones populares por amplios márgenes"
explanation: >-
  Todos los regímenes totalitarios llegaron al poder mediante una revolución violenta. Esta revolución cumple un doble propósito: destruye físicamente el antiguo orden y justifica ideológicamente el uso de la violencia como necesario para construir la nueva sociedad. Esto distingue las tomas de poder totalitarias de las transiciones democráticas, los golpes respaldados por el extranjero o las victorias electorales pacíficas.
