question: Почему выражения Simplicity сериализуются как DAG, а не как деревья?
answer: Чтобы предотвратить экспоненциальный рост, поскольку общие подвыражения хранятся только один раз.
wrong_answers:
  - Потому что обычные древовидные структуры вообще не способны представлять условное ветвление.
  - Чтобы обеспечить параллельное выполнение на множестве отдельных многоядерных процессоров.
  - Потому что протокол сети Liquid Network строго предписывает здесь формат DAG.
explanation: >-
  Выражения Simplicity естественным образом образуют деревья, которые могли
  бы расти экспоненциально по мере роста сложности. За счёт сериализации в
  виде направленных ациклических графов (DAG) подвыражения, встречающиеся
  несколько раз, хранятся один раз и на них ссылаются несколько
  родительских узлов. Это позволяет реальному размеру программы расти
  линейно, а не экспоненциально.
reviewed: false
