question: Ni iki gituma pruned node itandukana na full node?
answer: Ihita isiba buhoro buhoro blocks za kera.
wrong_answers:
  - Ntishobora kugenzura (validate) transactions za kera
  - Ntishobora gutanga (relay) blocks zose
  - Nta kopi n’imwe y’aho hantu ibika ya Blockchain, ahubwo ibika UTXO gusa .
explanation: |
  Igikoresho ca pruned cemeza uruhererekane rwose, ariko kigumya gusa igice gishasha c’amabuye kugira ngo kigabanye ububiko bwaco.
reviewed: true
