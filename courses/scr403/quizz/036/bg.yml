question: push-<n има тип Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ. Защо изходът му трябва да бъде sum, който включва пълния векторен тип Aⁿ?
answer: Буфер Aᑉⁿ съдържа най-много n−1 елемента, така че push върху пълен буфер дава n елемента — само Aⁿ може да представи това.
wrong_answers:
  - Sum-ът позволява на извикващите да изберат по-евтиното кодиране, тъй като векторите се сериализират по-компактно от option products.
  - Push може да се провали при празен буфер, а клонът Aⁿ е случаят на грешка, носещ старото съдържание.
  - case изисква всяка функция, която консумира sum-типизиран буфер, също да произвежда sum-типизиран изход.
explanation: >-
  Aᑉⁿ е точно типът на списъците, чиято дължина е строго по-малка от n,
  така че буфер с максимален капацитет държи n−1 елемента. Push на още един
  елемент произвежда точно n елемента, които Aᑉⁿ не може да представи; сумандът Aⁿ
  връща този резултат от препълване като пълен вектор. Кодирането на препълването в
  изходния тип запазва push-<n като тотална функция, а не частична — случаят на
  провал при празен буфер принадлежи на pop-<n, не на push.
