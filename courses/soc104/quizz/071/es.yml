question: "¿Cuál es la postura socialista sobre la atención sanitaria?"
answer: "El acceso a la atención sanitaria es un derecho fundamental, y el Estado debe garantizar un sistema universal financiado públicamente para todos, independientemente de los ingresos"
wrong_answers:
  - "La atención sanitaria debería ser un sistema mixto con cobertura estatal básica complementada por opciones de seguro privado"
  - "Los mercados privados ofrecen una atención sanitaria más innovadora, por lo que los individuos deberían elegir libremente su propio sistema"
  - "El Estado debería proporcionar atención sanitaria solo a los ciudadanos más pobres, mientras que el seguro privado cubre a todos los demás"
explanation: >-
  Para los socialistas, el acceso a la atención sanitaria es un derecho fundamental, no una mercancía. El Estado debe garantizar un sistema sanitario universal financiado públicamente para que todos tengan acceso a la atención, independientemente de los ingresos. Esto refleja la preocupación socialista por la igualdad, la justicia social y la importancia del Estado en la organización de servicios en interés general. El sistema mixto describe la visión centrista, mientras que los enfoques basados en la elección reflejan posturas libertarias y conservadoras.
