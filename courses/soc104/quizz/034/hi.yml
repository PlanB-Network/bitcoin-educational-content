question: "राजनीतिक प्रणालियों की आशय-आधारित परिभाषाएँ विश्लेषणात्मक प्रयोजनों के लिए समस्याग्रस्त क्यों मानी जाती हैं?"
answer: "वे वैचारिक भ्रम पैदा करती हैं क्योंकि सभी प्रणालियाँ न्याय, समता और स्वतंत्रता जैसे समान उद्देश्यों का पीछा करने का दावा करती हैं"
wrong_answers:
  - "वे बहुत सटीक और कठोर होती हैं, जिससे समय के साथ राजनीतिक आंदोलनों के स्वाभाविक विकास के लिए कोई जगह नहीं बचती"
  - "वे आर्थिक परिणामों पर अत्यधिक ध्यान देती हैं और राजनीतिक जीवन के सांस्कृतिक तथा सामाजिक आयामों की उपेक्षा करती हैं"
  - "वे वर्गीकृत सरकारी दस्तावेज़ों पर निर्भर करती हैं जो स्वतंत्र शोधकर्ताओं को शायद ही उपलब्ध होते हैं"
explanation: >-
  आशय-आधारित परिभाषाएँ घोषित प्रेरणाओं और लक्ष्यों पर निर्भर करती हैं, लेकिन हर राजनीतिक प्रणाली न्याय, समता और स्वतंत्रता का पीछा करने का दावा करती है। इससे प्रणालियों को एक-दूसरे से अलग करना असंभव हो जाता है। इसके विपरीत, संरचनात्मक विश्लेषण प्रणालियों का मूल्यांकन उनके अनुभवजन्य, मापनीय परिणामों और उनके द्वारा अपनाए गए साधनों से करता है, जिससे भाषा-शैली से परे उनकी वास्तविक प्रकृति सामने आती है।
reviewed: false
