question: "自由至上主義的自由觀與中間派的自由觀有何不同？"
answer: "自由至上主義者把自由視為無條件的公理，而中間派則依脈絡與效率，以機會主義方式捍衛各種自由"
wrong_answers:
  - "自由至上主義者允許國家選擇性保護自由，而中間派拒絕國家在保護個人權利上的任何參與"
  - "自由至上主義者只把自由聚焦於經濟事務，而中間派則把自由廣泛套用於社會與文化領域"
  - "自由至上主義者與中間派共享同一種自由觀，但在執行它所需的政府規模上有分歧"
explanation: >-
  自由至上主義者把自由定義為一般且無條件的原則，作為一項公理運作。相反地，中間派以機會主義且依脈絡的方式捍衛某些自由，而不套用任何一般原則。中間派方法揭示的是一種工具性的自由觀，總是從屬於效率等務實目標，而這正是自由至上主義者根本拒絕的。
reviewed: false
