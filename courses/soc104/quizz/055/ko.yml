question: "비침해 원칙은 무엇을 말하나요?"
answer: "타인의 생명, 자유, 재산에 대해 폭력이 행사되지 않는 한 사람은 원하는 대로 행동할 자유가 있습니다"
wrong_answers:
  - "국가는 사회 질서를 유지하기 위해 무력을 사용할 유일한 권리를 가집니다"
  - "시민은 개인의 자유를 제한하더라도 다수결의 지배에 복종해야 합니다"
  - "행동의 자유는 사회의 집단적 선에 이익이 될 때에만 허용됩니다"
explanation: >-
  비침해 원칙은 자유지상주의 정치의 초석으로, 개인이 타인의 생명, 자유, 재산에 대해 폭력을 행사하지 않는 한 자유롭게 행동할 수 있다고 말합니다. 이는 여러 문명에서 발견되는 황금률을 떠올리게 합니다. 다른 선택지들과 달리, 이 원칙은 국가에 특별한 도덕적 권위를 부여하지도 않고 개인의 권리를 집단적 이익에 종속시키지도 않습니다.
reviewed: false
