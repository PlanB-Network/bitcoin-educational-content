question: "در سراسر پنج مناظره اقتصادی (مالیات‌ها، حداقل دستمزد، مراقبت سلامت، محیط زیست، یارانه‌ها)، چه الگوی ثابتی روش میانه‌رو را از مواضع خانواده‌های سیاسی دیگر متمایز می‌کند؟"
answer: "میانه‌روها از پایبندی به یک اصل ثابت خودداری می‌کنند و در عوض تحلیل تجربی و ارزیابی کارشناسانه را برای تعیین سیاست به‌صورت موردبه‌مورد مطالبه می‌کنند، که رویکردشان را ذاتاً تکنوکراتیک می‌سازد"
wrong_answers:
  - "میانه‌روها همیشه موضعی میانی میان دیدگاه‌های سوسیالیستی و محافظه‌کارانه اتخاذ می‌کنند و در هر مسئله اختلاف را به‌طور مساوی تقسیم می‌کنند"
  - "میانه‌روها همواره رشد اقتصادی را بر رفاه اجتماعی مقدم می‌دارند، در سیاست مالی کنار لیبرتارین‌ها می‌ایستند و در مقررات‌گذاری با سوسیالیست‌ها موافق‌اند"
  - "میانه‌روها همه تصمیم‌های اقتصادی را به سازمان‌های بین‌المللی و توافق‌های تجاری واگذار می‌کنند، نه اینکه سیاست ملی مستقلی اتخاذ کنند"
explanation: >-
  در سراسر پنج مناظره اقتصادی، رویکرد میانه‌رو از همان الگو پیروی می‌کند: میانه‌روها به جای پایبندی به یک اصل ایدئولوژیک ثابت، پیش از تصمیم‌گیری شواهد تجربی و ارزیابی کارشناسانه مطالبه می‌کنند. درباره مالیات‌ها، سطح درست باید با تحلیل تعیین شود. درباره حداقل دستمزد، سطح آن باید به‌صورت عمل‌گرایانه تنظیم شود. درباره مراقبت سلامت، ترکیبی که کارشناسان آن را تنظیم کرده‌اند ایدئال است. درباره محیط زیست، سیاست باید رقابت‌پذیری را متوازن کند. درباره یارانه‌ها، هر مورد باید بر پایه شایستگی‌های خودش ارزیابی شود. این امر میانه‌روی را ذاتاً تکنوکراتیک می‌سازد، که با صرفاً نصف‌کردن اختلاف یا واگذاری تصمیم به نهادهای بین‌المللی متفاوت است.
reviewed: false
