  - "Bitcoin moral project එකක් ලෙස ක්‍රියා කරන්නේ wealth rich අයගෙන් early adopters වෙත redistribute කරන නිසා, tax policy සඳහා political implications සහිත වඩා සාධාරණ society එකක් නිර්මාණය කරමින්"
  - "Bitcoin moral වන්නේ Satoshi Nakamoto protocol එක තුළ ethical commandments embed කළ නිසා වන අතර, එහි political consequence එක සියලු political families shared monetary system එකක් යටතේ එක් කිරීමයි"
explanation: >-
  Bitcoin නිර්මාණය කළේ මිනිසුන් rich කිරීමට නොව free කිරීමටය. එය moral outcomes තුනක් ලබා දෙයි: effective property සක්‍රීය කිරීම (responsibility සඳහා incentive දීම), work මඟින් නිර්මාණය කරන value ආරක්ෂා කිරීම (productive effort දිරිමත් කිරීම), සහ privacy රැක ගැනීම (මිනිසුන්ට fear නොමැතිව ජීවත් වීමට ඉඩ දීම). මේවා political camp කිසිවකට අයත් නොවී political consequences රැගෙන යන moral achievements වන අතර, එය පළමුව moral project එකක් සහ දෙවනුව political එකක් බවට පත් කරයි.
