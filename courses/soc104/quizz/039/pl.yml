question: "Jak podejście strukturalne definiuje fundamentalną różnicę między socjalizmem a libertarianizmem?"
answer: "Socjalizm daje pierwszeństwo państwu poprzez regulację, planowanie i kontrolę, podczas gdy libertarianizm daje pierwszeństwo jednostce poprzez minimalną interwencję państwa"
wrong_answers:
  - "Socjalizm priorytetowo traktuje wiejskie wspólnoty rolnicze, podczas gdy libertarianizm sprzyja miejskiemu rozwojowi przemysłowemu"
  - "Socjalizm jest definiowany przez poparcie dla demokratycznych wyborów, podczas gdy libertarianizm odrzuca wszystkie formy uczestnictwa politycznego"
  - "Socjalizm skupia się na polityce zagranicznej i współpracy międzynarodowej, podczas gdy libertarianizm dotyczy wyłącznie krajowych kwestii gospodarczych"
explanation: >-
  Strukturalnie socjalizm charakteryzuje się wszechobecnością państwa, które reguluje, planuje i kontroluje. Libertarianizm jest definiowany przez minimalną interwencję państwa w gospodarkę i życie prywatne, z tendencją ku prymatowi wolności jednostki i wolnego rynku. To rozróżnienie strukturalne jest znacznie bardziej użyteczne analitycznie niż porównywanie deklarowanych intencji każdego systemu.
