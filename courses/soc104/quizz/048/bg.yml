question: "Как Michael Oakeshott характеризира консерватизма във философската си работа?"
answer: "Като темперамент и предразположение към живота, а не като твърда систематична идеология"
wrong_answers:
  - "Като всеобхватна икономическа теория с точни политически предписания за всяка област на управлението"
  - "Като революционно движение, което се стреми да демонтира модерните институции и да се върне към прединдустриално общество"
  - "Като чисто религиозна доктрина, основана на християнска теология и църковна власт"
explanation: >-
  Michael Oakeshott, британски философ, защитава концепция за консерватизма като темперамент, а не като систематична идеология. Есето му On Being Conservative (1956) остава съществена референция. Този възглед за консерватизма като предразположение повлиява също Friedrich Hayek. Подходът на Oakeshott е забележителен с критиката си на рационализма в политиката, отхвърляйки идеята, че политиката може да бъде сведена до система.
reviewed: false
