question: "Michael Oakeshott đã mô tả chủ nghĩa bảo thủ như thế nào trong công trình triết học của ông?"
answer: "Như một khí chất và khuynh hướng đối với cuộc sống hơn là một hệ tư tưởng có hệ thống cứng nhắc"
wrong_answers:
  - "Như một lý thuyết kinh tế toàn diện với các chỉ dẫn chính sách chính xác cho mọi lĩnh vực của chính phủ"
  - "Như một phong trào cách mạng tìm cách tháo dỡ các định chế hiện đại và quay lại xã hội tiền công nghiệp"
  - "Như một học thuyết thuần túy tôn giáo đặt nền trên thần học Kitô giáo và quyền lực giáo hội"
explanation: >-
  Michael Oakeshott, một triết gia Anh, bảo vệ một quan niệm về chủ nghĩa bảo thủ như khí chất hơn là hệ tư tưởng có hệ thống. Tiểu luận On Being Conservative (1956) của ông vẫn là một tham chiếu thiết yếu. Cách nhìn chủ nghĩa bảo thủ như một khuynh hướng này cũng ảnh hưởng đến Friedrich Hayek. Cách tiếp cận của Oakeshott nổi bật nhờ phê phán chủ nghĩa duy lý trong chính trị, bác bỏ ý tưởng rằng chính trị có thể được quy giản thành một hệ thống.
