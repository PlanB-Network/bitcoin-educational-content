question: Quel risque existe t-il si un portefeuille dépend d’un nœud tiers ?
answer: Un risque de surveillance et de censure.
wrong_answers:
  - Un risque de double dépense automatique;
  - Un risque de perte de ses clés privées;
  - Un risque de perte et de surveillance.
explanation: |
  Un nœud tiers peut analyser ou bloquer vos transactions, voire associer vos données à votre identité.
reviewed: true 
