question: "¿Cómo caracterizó Michael Oakeshott el conservadurismo en su obra filosófica?"
answer: "Como un temperamento y una disposición ante la vida, más que como una ideología sistemática rígida"
wrong_answers:
  - "Como una teoría económica integral con prescripciones políticas precisas para cada área del gobierno"
  - "Como un movimiento revolucionario que busca desmantelar las instituciones modernas y volver a la sociedad preindustrial"
  - "Como una doctrina puramente religiosa fundamentada en la teología cristiana y la autoridad eclesiástica"
explanation: >-
  Michael Oakeshott, un filósofo británico, defendió una concepción del conservadurismo como temperamento más que como ideología sistemática. Su ensayo On Being Conservative (1956) sigue siendo una referencia esencial. Esta visión del conservadurismo como una disposición también influyó en Friedrich Hayek. El enfoque de Oakeshott destaca por su crítica del racionalismo en la política, rechazando la idea de que la política pueda reducirse a un sistema.
