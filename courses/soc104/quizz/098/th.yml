question: "ทำไม monetary inflation จึงถูกอธิบายว่าเป็นภาษีซ่อนเร้นที่ถูกบังคับโดยปราศจากความยินยอมของพลเมือง?"
answer: "เพราะการสร้างเงินของรัฐบาลลดค่าของสกุลเงิน ทำให้ผู้คนซื้อของได้น้อยลงด้วยเงินจำนวนเดิม แต่คนส่วนใหญ่ไม่ตระหนักว่าราคาที่สูงขึ้นสะท้อนนโยบายรัฐบาล ไม่ใช่พลังตลาดตามธรรมชาติ"
wrong_answers:
  - "เพราะธนาคารกลางแอบเรียกเก็บค่าธรรมเนียมจากทุกธุรกรรมที่ประมวลผลผ่านระบบธนาคารโดยไม่เปิดเผยต่อเจ้าของบัญชี"
  - "เพราะรัฐบาลพิมพ์เงินและแจกจ่ายให้เฉพาะบุคคลที่ร่ำรวย ขณะที่เก็บภาษีคนจนผ่านภาษีขายที่สูงขึ้นต่อสินค้าจำเป็น"
  - "เพราะเงินเฟ้อเกิดจากบริษัทเอกชนขึ้นราคาเพื่อเพิ่มกำไร ซึ่งทำหน้าที่เป็นภาษีไม่เป็นทางการต่อผู้บริโภค"
explanation: >-
  การอัดฉีดเงินเข้าสู่ระบบแปลเป็นการลดค่าของสกุลเงิน โดยเงินจำนวนเดิมซื้อได้น้อยลง เพราะเงินใหม่ไม่ได้สะท้อนการเติบโตทางเศรษฐกิจจริง คนส่วนใหญ่ไม่เห็นว่านโยบายรัฐบาลนำไปสู่ราคาที่สูงขึ้น ซึ่งเป็นเพียงภาพสะท้อนของการลดค่าของสกุลเงิน สิ่งนี้เท่ากับการขโมยตามกฎหมายและการปล้นที่ถูกทำให้เป็นสถาบัน ทำให้ชนชั้นกลางยากจนลง ขณะที่คนมั่งคั่งคว้าเงินใหม่ผ่านสินทรัพย์เก็งกำไร
reviewed: false
