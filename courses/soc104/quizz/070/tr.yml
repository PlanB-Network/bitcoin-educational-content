question: "Beş toplumsal tartışma boyunca (evlilik, göç, ateşli silahlar, uyuşturucular, şekerli içecekler), her meselede sosyalist tutumu şekillendiren tekrar eden analitik çerçeve nedir?"
answer: "Toplumun baskı yoluyla yapılandığı ve devletin kırılgan grubu korumak için müdahale etmesi gerektiği, egemenler ile ezilenler arasındaki bir çatışma çerçevesi"
wrong_answers:
  - "En fazla sayıda yurttaş için genel mutluluğu ve ekonomik üretkenliği en üst düzeye çıkarmaya odaklanan faydacı bir çerçeve"
  - "Bireysel özgürlüklerin hem devlet hem de şirket müdahalesinden korunması gerektiği bir doğal haklar çerçevesi"
  - "Yerleşik toplumsal kurumların yıkıcı modern değişimlere karşı korunması gerektiği gelenekçi bir çerçeve"
explanation: >-
  Toplumsal tartışmalar boyunca sosyalist tutum tutarlı biçimde egemen/ezilen çatışma çerçevesi tarafından şekillendirilir. Evlilikte, eşcinsel azınlığa baskı yapan heteroseksüel çoğunluktur. Göçte, milliyet temelli kısıtlamalar baskı biçimleridir. Ateşli silahlarda, kırılganları korumak için güç yalnızca devletin elinde olmalıdır. Şekerli içeceklerde, sanayiciler en az korunanların kırılganlığından kâr eder. Bu ezen/ezilen merceği; toplumsal cinsiyet, ırk ve hatta insanlık ile doğa arasındaki ilişki dâhil çok sayıda alanda yeniden üretilir.
reviewed: false
