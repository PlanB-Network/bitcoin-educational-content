question: "Welke interne spanning bestaat er onder libertariërs op het Nolan-diagram?"
answer: "Sommigen willen de staat volledig afschaffen (anarcho-kapitalisten), terwijl anderen een minimale staat verkiezen die kernfuncties van soevereiniteit behoudt (minarchisten)"
wrong_answers:
  - "Sommigen willen strenge economische regulering, terwijl anderen volledige deregulering van alle industrieën verkiezen"
  - "Sommigen ondersteunen democratische verkiezingen, terwijl anderen een erfelijk bestuurssysteem verkiezen"
  - "Sommigen pleiten voor progressief sociaal beleid, terwijl anderen strikt traditionele morele waarden verdedigen"
explanation: >-
  Binnen de libertaire familie bestaat er een fundamenteel meningsverschil over de rol van de staat. Anarcho-kapitalisten willen alle staatsfuncties vervangen door private diensten, terwijl minarchisten een minimale staat aanvaarden die kernfuncties van soevereiniteit behoudt, zoals defensie en rechtbanken. Beide groepen delen de libertaire top, maar verschillen over de vraag of er überhaupt enige staat zou moeten bestaan.
reviewed: false
