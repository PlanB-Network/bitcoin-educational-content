question: "Que divisão fundamental separou os socialistas a partir do início do século XX?"
answer: "Socialistas revolucionários que buscavam tomar o poder por meio da violência versus socialistas reformistas que buscavam mudanças por meio de eleições democráticas"
wrong_answers:
  - "Socialistas urbanos que se concentravam em trabalhadores industriais versus socialistas rurais que organizavam comunas agrícolas"
  - "Socialistas nacionalistas que priorizavam seu próprio país versus socialistas internacionalistas que defendiam a revolução global"
  - "Socialistas intelectuais que escreviam textos teóricos versus socialistas ativistas que organizavam greves trabalhistas"
explanation: >-
  A partir do início do século XX, uma divisão fundamental separou os socialistas revolucionários, que se opunham aos direitos de propriedade e buscavam destruir a sociedade capitalista por meio da violência ou da ditadura do proletariado, dos socialistas reformistas, que buscavam justiça social por meio de eleições democráticas e tributação, enquanto aceitavam temporariamente o capitalismo. Essa cisão moldou toda a história subsequente dos movimentos socialistas.
