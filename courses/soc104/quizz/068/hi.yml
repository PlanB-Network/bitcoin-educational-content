question: "समलैंगिक विवाह के प्रश्न पर लिबर्टेरियन स्थिति क्या है?"
answer: "विवाह को परिभाषित करना राज्य का काम नहीं है; इसे निजी बनाया जाना चाहिए और व्यक्तियों, संघों तथा धार्मिक संस्थाओं पर छोड़ देना चाहिए"
wrong_answers:
  - "समलैंगिक विवाह को वैध किया जाना चाहिए, क्योंकि सभी नागरिकों को कानून के तहत समान व्यवहार मिलना चाहिए"
  - "समलैंगिक विवाह पर प्रतिबंध लगाया जाना चाहिए, क्योंकि पारंपरिक विवाह प्रजनन के लिए एक मूलभूत संस्था है"
  - "समलैंगिक विवाह को वैध किया जाना चाहिए, लेकिन केवल पारंपरिक विवाह से अलग एक पृथक कानूनी ढांचे के माध्यम से"
explanation: >-
  लिबर्टेरियन तर्क देते हैं कि विवाह का प्रश्न मूलतः गलत ढंग से प्रस्तुत किया गया है, क्योंकि इसे राज्यवादी शब्दों में रखा जाता है। वे मानते हैं कि निजी जीवन में हस्तक्षेप करना राज्य का काम नहीं है, इसलिए समाधान यह है कि विवाह को राज्य से पूरी तरह अलग कर दिया जाए। एक ही परिभाषा थोपकर राज्य संघर्ष पैदा करता है। पहला गलत उत्तर समाजवादी या मध्यमार्गी स्थिति को दर्शाता है, और दूसरा कंजरवेटिव स्थिति को।
