question: "O que o eixo vertical do diagrama de Nolan revela sobre a verdadeira questão política?"
answer: "Ele revela se você quer impor suas próprias sensibilidades aos outros por meio do Estado, ou prefere que cada pessoa seja livre para decidir por si mesma"
wrong_answers:
  - "Ele revela se você apoia a governança democrática ou prefere o governo autoritário de um único líder"
  - "Ele revela se você se identifica com movimentos sociais progressistas ou com instituições religiosas tradicionais"
  - "Ele revela se sua preocupação principal é a segurança nacional ou a prosperidade econômica"
explanation: >-
  O eixo vertical expõe a verdadeira questão política: não se você é de esquerda ou de direita, mas até que ponto você quer que o Estado intervenha na moldagem da sociedade de acordo com seus valores. Você deseja impor suas sensibilidades aos outros, ou prefere que cada pessoa seja livre para decidir por si mesma? Esse enquadramento transcende a divisão esquerda-direita e mostra que ambos os campos podem ser igualmente estatistas.
reviewed: false
