question: "ตลอดการถกเถียงทางสังคมห้าประเด็น (การแต่งงาน การย้ายถิ่นฐาน อาวุธปืน ยาเสพติด เครื่องดื่มมีน้ำตาล) กรอบวิเคราะห์ที่เกิดซ้ำและกำหนดจุดยืนสังคมนิยมในแต่ละประเด็นคืออะไร?"
answer: "กรอบความขัดแย้งระหว่างผู้ครอบงำกับผู้ถูกครอบงำ ซึ่งสังคมถูกจัดโครงสร้างโดยการกดขี่ และรัฐต้องแทรกแซงเพื่อปกป้องกลุ่มเปราะบาง"
wrong_answers:
  - "กรอบอรรถประโยชน์นิยมที่มุ่งเพิ่มความสุขโดยรวมและผลิตภาพทางเศรษฐกิจให้มากที่สุดสำหรับพลเมืองจำนวนมากที่สุด"
  - "กรอบสิทธิตามธรรมชาติที่เสรีภาพส่วนบุคคลต้องได้รับการปกป้องจากทั้งรัฐและการแทรกแซงของบริษัท"
  - "กรอบจารีตนิยมที่สถาบันสังคมที่ตั้งมั่นแล้วต้องได้รับการอนุรักษ์จากการเปลี่ยนแปลงสมัยใหม่ที่ก่อกวน"
explanation: >-
  จุดยืนสังคมนิยมตลอดการถกเถียงทางสังคมถูกกำหนดอย่างสม่ำเสมอโดยกรอบความขัดแย้งระหว่างผู้ครอบงำกับผู้ถูกครอบงำ ในเรื่องการแต่งงาน คือเสียงข้างมากรักต่างเพศกดขี่ชนกลุ่มน้อยรักร่วมเพศ ในเรื่องการย้ายถิ่นฐาน ข้อจำกัดที่ตั้งอยู่บนสัญชาติคือรูปแบบของการกดขี่ ในเรื่องอาวุธปืน มีเพียงรัฐเท่านั้นที่ควรถือกำลังเพื่อปกป้องผู้เปราะบาง ในเรื่องเครื่องดื่มมีน้ำตาล นักอุตสาหกรรมหากำไรจากความเปราะบางของผู้ที่ได้รับการคุ้มครองน้อยที่สุด เลนส์ผู้กดขี่/ผู้ถูกกดขี่นี้ถูกผลิตซ้ำในหลายอาณาเขต รวมถึงเพศสภาพ เชื้อชาติ และแม้แต่ความสัมพันธ์ระหว่างมนุษยชาติกับธรรมชาติ
reviewed: false
