question: "20世紀初頭以降、社会主義者を分けた根本的な分裂は何でしたか？"
answer: "暴力による権力奪取を目指す革命的社会主義者と、民主的選挙を通じて変化を追求する改良主義的社会主義者"
wrong_answers:
  - "産業労働者に注目する都市社会主義者と、農業コミューンを組織する農村社会主義者"
  - "自国を優先する民族主義的社会主義者と、世界革命を主張する国際主義的社会主義者"
  - "理論的テキストを書く知識人社会主義者と、労働ストライキを組織する活動家社会主義者"
explanation: >-
  20世紀初頭から、根本的な分裂が社会主義者を分けた。すなわち、財産権に反対し、暴力またはプロレタリアート独裁によって資本主義社会を破壊しようとした革命的社会主義者と、資本主義を一時的に受け入れつつ、民主的選挙と課税を通じて社会正義を追求した改良主義的社会主義者である。この分裂は、その後の社会主義運動の歴史全体を形作った。
reviewed: false
