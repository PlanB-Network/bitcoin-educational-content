question: "¿Qué es el principio de no agresión tal como lo teorizó Murray Rothbard?"
answer: "Es ilegítimo iniciar la fuerza física contra otro individuo o su propiedad, aunque se permite la violencia defensiva"
wrong_answers:
  - "Todas las formas de violencia son siempre incorrectas, incluida la legítima defensa y la resistencia a la opresión"
  - "La violencia es aceptable cuando se dirige contra instituciones opresivas, pero nunca contra otros individuos"
  - "Solo el Estado tiene el derecho legítimo a usar la fuerza, y los individuos nunca deben recurrir a la violencia"
explanation: >-
  El principio de no agresión de Rothbard sostiene que iniciar la fuerza física contra otra persona o su propiedad es ilegítimo. Es una traducción filosófica de la regla de oro. Sin embargo, no prohíbe toda violencia: la violencia defensiva, incluida la legítima defensa y la resistencia a la opresión, se considera legítima. Esto lo distingue del pacifismo puro y del supuesto monopolio de la fuerza reclamado por el Estado.
