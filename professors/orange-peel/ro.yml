bio: |
  Descoperirea Bitcoin nu m-a schimbat fundamental, dar mi-a amplificat considerabil puterea de a acționa, atât la scara mea proprie, cât și pentru societate în ansamblu. Deținerea de Bitcoin întruchipează o viziune clară, gândire critică și tărie de caracter. Protejându-și finanțele de inflație și cenzură, bitcoinerii își consolidează autonomia și influența, modelând viitorul în funcție de valorile lor. În ciuda provocărilor, Bitcoin inspiră un optimism hotărât de a construi o lume de mâine mai liberă și mai rezilientă. Sunt, de asemenea, consultant și coach în Bitcoin, fondator al orangepeel.fr, administrator al Bitcoin Meetup din Nantes (Franța) și un pasionat înfocat de sporturi cu placă.
  
short_bio: Consultant și coach în Bitcoin, fondator al orangepeel.fr și administrator al Bitcoin Meetup din Nantes
