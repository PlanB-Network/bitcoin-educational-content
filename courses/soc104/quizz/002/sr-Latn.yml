question: "Zašto se osa levo-desno smatra neadekvatnom za smeštanje klasičnih liberalnih mislilaca poput Bastiata ili Rona Paula?"
answer: "Zato što klasični liberalizam ceni i ekonomske i lične slobode, koje ni levica ni desnica ne prihvataju u potpunosti"
wrong_answers:
  - "Zato što se klasični liberali uvek svrstavaju uz desničarske ekonomske politike i odbacuju sve levičarske stavove"
  - "Zato što su klasični liberali centristi koji usvajaju umerene verzije i levih i desnih ideologija"
  - "Zato što se klasični liberali protive svim oblicima vlasti, što ih čini anarhistima, a ne političkim misliocima"
explanation: >-
  Osa levo-desno ne odgovara klasičnim liberalima zato što ne može da obuhvati poziciju koja istovremeno brani ekonomsku slobodu (tipično desno) i ličnu slobodu (tipično levo). Klasični liberali nisu centristi koji traže kompromis, niti su anarhisti ili čisto desničarski. Oni se jednostavno ne uklapaju u jednodimenzionalni spektar.
reviewed: false
