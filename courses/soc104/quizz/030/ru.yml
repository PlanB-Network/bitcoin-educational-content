question: "Почему классические либералы в Соединенных Штатах с 1960-х годов начали называть себя «либертарианцами»?"
answer: "Чтобы отличить себя от американских liberals, у которых значение термина сместилось к государственному интервенционизму"
wrong_answers:
  - "Чтобы присоединиться к Демократической партии и ее прогрессивным социальным программам"
  - "Чтобы обозначить свою поддержку реформ Great Society Линдона Б. Джонсона"
  - "Чтобы принять более радикальную революционную идентичность, вдохновленную европейскими социалистическими движениями"
explanation: >-
  В Соединенных Штатах слово 'liberal' сместилось и стало означать сторонников Big Government и государственного вмешательства, особенно после New Deal и Great Society. Классические либералы приняли ярлык 'libertarian', чтобы сохранить исходный смысл своей философии. Они дистанцировались от американских liberals, а не присоединялись к ним.
reviewed: false
