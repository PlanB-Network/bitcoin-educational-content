question: "Göç konusunda muhafazakâr tutum nedir?"
answer: "Devlet, ulusal güvenliği ve kültürel kimliği korumak için sınırlarını kontrol etme egemen hakkına sahiptir"
wrong_answers:
  - "Sınırlar koşulsuz olarak açık olmalıdır çünkü ayrımcı kısıtlamalar insan haklarını ihlal eder"
  - "Göç, piyasa talebine göre belirlenmeli; yurttaşlar yabancılarla ilişkilerine sözleşmesel olarak karar vermelidir"
  - "Göç politikası, ekonomik ihtiyaçları uzman değerlendirmesine dayalı başarılı entegrasyonla dengelemelidir"
explanation: >-
  Muhafazakârlar, düzenin, kimliğin ve ulusal egemenliğin yabancıların veya mültecilerin sınırsız kabulüne göre öncelikli olması gerektiğini savunur. Sınırlar ve iyi tanımlanmış bir nüfus, medeni değerlerin parçasıdır. Yanlış cevaplar sosyalist tutumu (insan hakkı olarak açık sınırlar), liberteryen tutumu (piyasa temelli göç) ve merkezci tutumu (uzmanlarca yönlendirilen dengeli yaklaşım) temsil eder.
