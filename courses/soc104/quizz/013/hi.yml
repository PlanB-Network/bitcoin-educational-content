question: "Nolan diagram पर व्यक्तिगत स्वतंत्रता अक्ष का निचला भाग किसकी विशेषता बताता है?"
answer: "व्यवस्था, सुरक्षा, पारंपरिक मूल्यों, और राज्य द्वारा नैतिकता को विनियमित करने तथा सार्वजनिक व्यवस्था बनाए रखने की प्राथमिकता"
wrong_answers:
  - "व्यक्तिगत स्वायत्तता, सहिष्णुता, और व्यक्तिगत जीवन-चयनों में न्यूनतम राज्य हस्तक्षेप की प्राथमिकता"
  - "आर्थिक deregulation, मुक्त व्यापार, और tariffs तथा subsidies के उन्मूलन की प्राथमिकता"
  - "धन पुनर्वितरण, उच्च करों, और प्रमुख उद्योगों के राष्ट्रीयकरण की प्राथमिकता"
explanation: >-
  व्यक्तिगत स्वतंत्रता अक्ष का निचला भाग व्यक्तिगत जीवन पर अधिकतम राज्य नियंत्रण का प्रतिनिधित्व करता है, जिसकी विशेषता व्यवस्था, सुरक्षा, और पारंपरिक मूल्यों की प्राथमिकता है। राज्य नैतिकता को विनियमित करता है, सार्वजनिक व्यवस्था बनाए रखता है, और नैतिकता या परंपरा की किसी विशिष्ट दृष्टि की रक्षा कर सकता है। अक्ष का शीर्ष इसके विपरीत का प्रतिनिधित्व करता है: व्यक्तिगत स्वतंत्रता और सहिष्णुता। आर्थिक नीतियाँ अलग क्षैतिज अक्ष पर मापी जाती हैं।
reviewed: false
