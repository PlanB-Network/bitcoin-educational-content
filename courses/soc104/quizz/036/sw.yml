question: "Ufafanuzi wa kimuundo wa mfumo wa kisiasa huzingatia nini?"
answer: "Jinsi mfumo unavyofanya kazi kwa kweli na sifa zake zinazoonekana, kama kiwango cha udhibiti wa dola"
wrong_answers:
  - "Malengo yaliyotajwa na nia njema zilizotangazwa na waanzilishi na viongozi wa mfumo huo"
  - "Asili za kihistoria za harakati ya kisiasa na wasifu wa wanafikra wake wakuu"
  - "Idadi ya vyama vya kisiasa vinavyoruhusiwa na marudio ya uchaguzi wa kidemokrasia unaofanyika"
explanation: >-
  Ufafanuzi wa kimuundo huzingatia jinsi mifumo ya kisiasa inavyofanya kazi kwa kweli na sifa zake zinazoonekana. Kwa mfano, usoshalisti kimuundo hubainishwa na uwepo wa kila mahali wa dola. Mtazamo huu unatofautiana na ufafanuzi wa kimakusudi, ambao hutegemea motisha na malengo yaliyotajwa. Mtazamo wa kimuundo huruhusu tathmini iliyo ya kimalengo zaidi kwa msingi wa matokeo yanayopimika.
