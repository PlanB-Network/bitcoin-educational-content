question: Qual è lo scopo dei file revNNNN.dat memorizzati insieme a blkNNNN.dat?
answer: Ripristino del set UTXO impostato durante la riorganizzazione
wrong_answers:
  - Ripristino delle UTXO impostato durante un hard fork
  - Ripristino della Mempool durante l'hard fork
  - Ripristino della Mempool durante una riorganizzazione
explanation: |
  Ogni revNNNNN.dat contiene i dati necessari per annullare gli effetti di un blocco sul set UTXO, facilitando la gestione delle riorganizzazioni.
reviewed: true
