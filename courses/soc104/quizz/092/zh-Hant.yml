question: "Satoshi Nakamoto 指出的法定貨幣根本問題是什麼？"
answer: "它們要求人們信任中央銀行不會讓貨幣貶值，但法定貨幣的歷史充滿了對這種信任的背叛"
wrong_answers:
  - "它們太難用於日常交易，因為實體現金很快磨損且製造成本高昂"
  - "它們無法進行國際轉帳，因為每個國家都有互不相容的貨幣標準與法規"
  - "它們由黃金儲備支持，而這些儲備不足以覆蓋流通中的貨幣總供給"
explanation: >-
  Satoshi Nakamoto 表示，傳統貨幣的根本問題在於其運作所需的信任。法定貨幣並不由商品背書，而是完全建立在制度權威之上。當一個機構掌握對貨幣的全部控制權時，濫用的誘惑過於強烈，而歷史已透過貨幣貶值一再證明了這一點。
reviewed: false
