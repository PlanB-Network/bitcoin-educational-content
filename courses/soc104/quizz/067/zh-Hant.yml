question: "保守主義者在移民問題上的立場是什麼？"
answer: "國家擁有控制自身邊界的主權權利，以保護國家安全與文化身份"
wrong_answers:
  - "邊界應無條件開放，因為歧視性限制違反人權"
  - "移民應由市場需求決定，由公民透過契約決定自己與外國人的關係"
  - "移民政策應根據專家評估，在經濟需求與成功整合之間取得平衡"
explanation: >-
  保守主義者認為，秩序、身份與國家主權必須優先於不受限制地接納外國人或難民。邊界與明確界定的人口，是文明價值的一部分。錯誤答案分別代表社會主義立場（開放邊界作為人權）、自由至上主義立場（以市場為基礎的移民），以及中間派立場（由專家驅動的平衡方法）。
reviewed: false
