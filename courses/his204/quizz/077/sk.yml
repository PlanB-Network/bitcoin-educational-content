question: Ktorému ekonómovi vzdal Turgot chválu?
answer: Vincent de Gournay
wrong_answers:
  - François Quesnay
  - Markíz d'Argenson
  - Adam Smith
explanation: |
  Turgot napísal pochvalnú reč na Vincenta de Gournay, v ktorej zdôraznil jeho úlohu priekopníka ekonomického liberalizmu a jeho vplyv na francúzske ekonomické myslenie.
