question: یک خروجی Simplicity از نقطهٔ ثابت BIP-0341 NUMS به‌عنوان کلید داخلی خود استفاده می‌کند. چرا خرج از مسیر کلید به‌طور اثبات‌پذیر ناممکن است، و تصادفی‌سازی نقطهٔ NUMS چه چیزی اضافه می‌کند؟
answer: هیچ‌کس لگاریتم گسستهٔ نقطهٔ NUMS را نمی‌داند، پس هیچ امضای مسیر کلیدی نمی‌تواند وجود داشته باشد؛ تصادفی‌سازی فقط حریم خصوصی اضافه می‌کند.
wrong_answers:
  - نقطهٔ NUMS خارج از منحنی قرار دارد، بنابراین امضاهای مسیر کلید شکست می‌خورند؛ تصادفی‌سازی آن را دوباره روی منحنی می‌آورد.
  - کلید خصوصی نقطهٔ NUMS صفر است، که consensus آن را رد می‌کند؛ تصادفی‌سازی tweak را در برابر کانال‌های جانبی محافظت می‌کند.
  - tweak کردن نقطهٔ NUMS کلیدی خارج از محدوده می‌دهد و key-spend را غیراستاندارد می‌کند؛ تصادفی‌سازی از بازاستفادهٔ آدرس جلوگیری می‌کند.
explanation: >-
  یک نقطهٔ NUMS ('Nothing-Up-My-Sleeve') یک نقطهٔ کاملاً معتبر روی منحنی است که
  طوری ساخته شده تا هیچ‌کس کلید خصوصی متناظر با آن را نداند — لگاریتم گسستهٔ آن
  ناشناخته است. چون خرج از مسیر کلید به امضای Schnorr زیر کلید داخلی نیاز دارد،
  و بدون کلید خصوصی چنین امضایی تولید نمی‌شود، مسیر key-spend به‌طور اثبات‌پذیر
  غیرقابل‌استفاده است و وجوه فقط می‌توانند از مسیر اسکریپتِ تعهدشده جابه‌جا شوند.
  تصادفی‌سازی نقطهٔ NUMS هیچ‌یک از این‌ها را تغییر نمی‌دهد؛ صرفاً این واقعیت را
  پنهان می‌کند که key-spend غیرفعال است، پس خروجی مثل هر خروجی Taproot دیگری به
  نظر می‌رسد — یک مزیت حریم خصوصی.
reviewed: false
