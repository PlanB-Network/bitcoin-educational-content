question: "Khóa học xác định sự phân chia chính trị thực sự là gì, vượt ra ngoài phổ truyền thống tả-hữu-trung dung?"
answer: "Sự phân chia giữa các nguyên tắc triết học căn bản: tự do hay cưỡng chế, đồng thuận tự nguyện hay ép buộc, cá nhân có trách nhiệm hay tập thể"
wrong_answers:
  - "Sự phân chia giữa các quốc gia giàu và nghèo về quyền kiểm soát các hiệp định thương mại quốc tế và các định chế tài chính toàn cầu"
  - "Sự phân chia giữa dân cư đô thị và nông thôn về các ưu tiên chi tiêu của chính phủ và đầu tư hạ tầng"
  - "Sự phân chia giữa các nền văn hóa tiến bộ và truyền thống về chuẩn mực xã hội, giá trị gia đình và giáo dục tôn giáo"
explanation: >-
  Khóa học lập luận rằng sự phân chia chính trị thực sự không nằm ở các nhãn tả-hữu-trung dung truyền thống mà nằm ở các nguyên tắc triết học căn bản: tự do hay cưỡng chế, đồng thuận tự nguyện hay ép buộc, cá nhân có trách nhiệm hay tập thể. Cách đúng để suy nghĩ về chính trị là bắt đầu từ các nguyên tắc đạo đức thay vì các nhãn.
