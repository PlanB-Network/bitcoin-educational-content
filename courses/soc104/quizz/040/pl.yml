question: "Jak programy pomocy społecznej finansowane przez państwo mogą wywoływać efekty perwersyjne, ilustrując niebezpieczeństwo polegania wyłącznie na intencjach?"
answer: "Mogą tworzyć zależność, usuwać bodźce do pracy i stanowić spoliację, ponieważ pieniądze muszą najpierw zostać zabrane tym, którzy wytworzyli bogactwo"
wrong_answers:
  - "Zachęcają do nadmiernych oszczędności osobistych, zmniejszają wydatki konsumpcyjne i powodują deflację w szerszej gospodarce"
  - "Wzmacniają prywatną przedsiębiorczość, przenosząc koszty pracy na rząd i zmniejszając potrzebę konkurencyjnych płac"
  - "Eliminują rozróżnienia klasowe tak dokładnie, że mobilność społeczna staje się niepotrzebna, a innowacja zamiera"
explanation: >-
  Friedman ostrzega, że hojne intencje mogą wywoływać szkodliwe konsekwencje, gdy zaniedbują rygorystyczną analizę ludzkich bodźców. Programy pomocy finansowane przez państwo ryzykują tworzenie zależności, brak bodźców do pracy oraz stanowienie formy spoliacji, ponieważ środki muszą najpierw zostać zabrane wytwórcom bogactwa. Mierzalne rezultaty, takie jak redukcja ubóstwa i efektywność, muszą mieć pierwszeństwo przed szlachetnymi intencjami.
