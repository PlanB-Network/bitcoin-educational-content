question: Защо комбинаторът 'case' включва споделен тип среда C в своята сигнатура?
answer: За да могат и двата клона да четат споделени контекстни данни заедно с тагнатия вход.
wrong_answers:
  - За да ограничи размера на входа с цел предотвратяване на препълване на стека.
  - За да позволи рекурсивни извиквания напред-назад между двата клона.
  - За да съхранява изхода на предишния комбинатор по-рано във веригата.
explanation: >-
  Комбинаторът case има сигнатура (A + B) × C ⊢ D. Допълнителният тип C
  действа като споделена среда, до която и левият клон (f : A × C ⊢ D)
  и десният клон (g : B × C ⊢ D) имат достъп. Това е по-мощно
  от обикновено if-then-else, защото клоновете получават както своите специфични
  данни, така и контекстната информация, необходима за изчислението.
reviewed: false
