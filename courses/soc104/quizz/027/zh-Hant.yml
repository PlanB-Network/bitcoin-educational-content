question: "為什麼美國的古典自由主義者從 1960 年代起開始稱自己為 'libertarians'？"
answer: "為了將自己與美國的 liberals 區分開來，因為後者的含義已轉向國家干預主義"
wrong_answers:
  - "為了與民主黨及其進步社會計畫結盟"
  - "為了表明他們支持 Lyndon B. Johnson 的 Great Society 改革"
  - "為了採用一種受歐洲社會主義運動啟發的更激進革命身份"
explanation: >-
  在美國，'liberal' 一詞轉變為指大政府與國家干預的支持者，尤其是在 New Deal 與 Great Society 之後。古典自由主義者採用 'libertarian' 這一標籤，以保存其哲學的原初含義。他們是在與美國 liberals 拉開距離，而不是與他們結盟。
reviewed: false
