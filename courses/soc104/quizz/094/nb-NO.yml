question: "Hvordan fungerer Bitcoin som et moralsk prosjekt med politiske konsekvenser snarere enn et politisk prosjekt med moralske påstander?"
answer: "Bitcoin ble utformet for å gjøre mennesker frie snarere enn rike, ved å muliggjøre reell eiendom, beskytte arbeidets verdi og bevare personvernet, som er moralske prestasjoner som skaper politiske virkninger uten å hevde tilhørighet til noen politisk leir"
wrong_answers:
  - "Bitcoin er et moralsk prosjekt fordi koden håndhever etiske regler som forhindrer svindel, og den politiske konsekvensen er å erstatte demokratisk styring med algoritmisk beslutningstaking"
  - "Bitcoin fungerer som et moralsk prosjekt fordi det omfordeler rikdom fra de rike til tidlige brukere, og skaper et mer rettferdig samfunn med politiske implikasjoner for skattepolitikk"
  - "Bitcoin er moralsk fordi Satoshi Nakamoto la inn etiske bud i protokollen, og den politiske konsekvensen er å samle alle politiske familier under et felles monetært system"
explanation: >-
  Bitcoin ble ikke utformet for å gjøre mennesker rike, men for å gjøre dem frie. Det oppnår tre moralske resultater: å muliggjøre reell eiendom (som gir insentiv til ansvar), å beskytte verdien som skapes av arbeid (som oppmuntrer til produktiv innsats), og å bevare personvernet (som lar mennesker leve uten frykt). Dette er moralske prestasjoner som bærer politiske konsekvenser uten å tilhøre noen politisk leir, noe som gjør det til et moralsk prosjekt først og et politisk prosjekt deretter.
reviewed: false
