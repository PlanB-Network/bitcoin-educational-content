question: "सांस्कृतिक रूप से रूढ़िवादी लिबर्टेरियन उन व्यवहारों से कैसे निपटता है जिन्हें वह नैतिक रूप से अस्वीकार करता है?"
answer: "वे समझाइश और उदाहरण के माध्यम से उन व्यवहारों का विरोध और निरुत्साहन करते हैं, लेकिन कानून की दमनकारी शक्ति का सहारा लिए बिना"
wrong_answers:
  - "वे संघीय-स्तर के प्रतिबंधों का विरोध करते हुए उन व्यवहारों पर स्थानीय सरकारी प्रतिबंधों का समर्थन करते हैं"
  - "वे उन व्यवहारों के बारे में पूरी तरह चुप रहते हैं, यह मानते हुए कि किसी भी प्रकार की अस्वीकृति व्यक्तिगत स्वतंत्रता का उल्लंघन करती है"
  - "वे सामुदायिक न्यायाधिकरणों की वकालत करते हैं जो औपचारिक कानूनी प्रणाली के बाहर उन व्यवहारों को दंडित कर सकें"
explanation: >-
  सांस्कृतिक रूप से रूढ़िवादी लिबर्टेरियन कुछ व्यवहारों को नैतिक रूप से अस्वीकार कर सकता है, लेकिन सहमति-आधारित, अनाक्रामक क्रियाओं के कानूनी निषेध की वकालत नहीं करता। वे ऐसी क्रियाओं को नापसंद कर सकते हैं, उनका विरोध कर सकते हैं, और सक्रिय रूप से उन्हें निरुत्साहित कर सकते हैं, लेकिन हमेशा समझाइश, शिक्षा और उदाहरण के माध्यम से, कानून की दमनकारी शक्ति के माध्यम से नहीं। यह चुप रहने या वैकल्पिक प्रवर्तन तंत्र बनाने के बारे में नहीं है।
reviewed: false
