question: "Come tratta il conservatorismo le libertà nelle sfere economica e sociale?"
answer: "Forti libertà nella sfera economica ma deboli libertà nella sfera sociale"
wrong_answers:
  - "Deboli libertà sia nella sfera economica sia in quella sociale per mantenere l'ordine sociale tradizionale"
  - "Forti libertà nella sfera sociale ma deboli libertà nella sfera economica"
  - "Libertà uguali e illimitate in entrambe le sfere con un intervento governativo minimo di qualsiasi tipo"
explanation: >-
  Il conservatorismo presenta una dicotomia che è l'immagine speculare del socialismo. Nel dominio economico, i conservatori difendono il libero mercato, l'imprenditorialità e la proprietà privata. Nel dominio sociale, le restrizioni sono giustificate dalla preservazione delle norme morali tradizionali e della stabilità sociale. La terza risposta errata descrive il modello socialista, che è l'opposto.
