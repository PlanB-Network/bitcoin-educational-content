question: "Các đảng chính trị cánh tả và cánh hữu có điểm chung nào bất chấp sự đối lập bề ngoài của họ?"
answer: "Cả hai đều bảo vệ quyền của nhà nước trong việc quản lý đời sống của người dân thông qua các quy định và thuế"
wrong_answers:
  - "Cả hai đều ủng hộ việc bãi bỏ hoàn toàn sự can thiệp của nhà nước vào các vấn đề kinh tế"
  - "Cả hai đều ưu tiên tự do cá nhân hơn tổ chức tập thể của xã hội"
  - "Cả hai đều bác bỏ việc sử dụng chính sách tiền tệ như một công cụ cho chi tiêu chính phủ"
explanation: >-
  Dù có vẻ đối lập, cánh tả và cánh hữu cùng chia sẻ sự ưu tiên dành cho can thiệp của nhà nước. Cả hai đều phê phán thị trường tự do và bảo vệ quyền của nhà nước trong việc quản lý đời sống của người dân thông qua các quy định và thuế. Cánh tả phê phán thị trường như một nguồn gốc của bất bình đẳng, trong khi cánh hữu xem thị trường là mối đe dọa đối với chủ quyền, nhưng cả hai đều quay sang nhà nước để tìm giải pháp.
