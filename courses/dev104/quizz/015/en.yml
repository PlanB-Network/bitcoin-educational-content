question: What is the correct sequence that describes how JavaScript executes code and handles API requests?
answer: JavaScript runs line by line from top to bottom, but API requests return Promises that resolve asynchronously
wrong_answers:
  - JavaScript executes all functions first, then variables, and finally processes API requests in parallel
  - JavaScript runs bottom to top for variables, then top to bottom for functions, with APIs blocking execution
  - JavaScript processes all API requests first, then executes the remaining code in random order
explanation: |
  JavaScript follows a sequential execution model, running code line by line from top to bottom. However, when making API requests, JavaScript uses Promises to handle asynchronous operations. This means the API request is initiated in sequence, but the response is handled separately when it arrives, allowing other code to continue executing without waiting. The other options incorrectly describe JavaScript's execution order or suggest that APIs block execution or run in non-sequential patterns.
