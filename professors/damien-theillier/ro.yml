bio: |
  Damien Theillier este profesor de filosofie la Paris, absolvent al Sorbonei Paris IV, fondator al Institut Coppet și al École de la liberté. Este co-autor al manualului pentru clasele pregătitoare General Culture (Pearson, 2013) și al lucrării A Path to Freedom, the philosophy from Antiquity to our days (Berg International, 2013). A contribuit, de asemenea, la Philosophy in 60 Books (Ellipse, 2021). 

short_bio: Profesor de filosofie la Paris
