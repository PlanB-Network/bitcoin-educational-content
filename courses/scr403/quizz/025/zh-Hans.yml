question: "为什么见证值被排除在 Commitment Merkle Root (CMR) 之外？"
answer: 这样地址可以在见证已知之前形成，且未使用的分支可以私下剪枝。
wrong_answers:
  - 因为见证值实在太大，无法包含在 256 位哈希中。
  - 因为见证值完全由 Failure 效应单独验证。
  - 因为包含见证值会使 CMR 变得非确定性。
explanation: >-
  见证表达式（如签名）在花费时提供，而不是在地址创建时提供。
  将它们排除在 CMR 之外可实现两个重要性质：地址可以在
  花费交易存在之前生成，并且未执行的条件分支可以从
  链上数据中剪枝，而不会暴露其关联的见证值。
reviewed: true
