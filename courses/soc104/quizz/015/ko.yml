question: "개인적 자유 범주에는 무엇이 포함되나요?"
answer: "사적 관계에서 하는 일, 의견과 신념, 그리고 자신의 몸과 마음에 관련된 모든 것"
wrong_answers:
  - "사업 시작, 직원 고용, 상품 거래를 포함해 생산자로서 하는 일"
  - "내는 세금의 양, 하는 투자, 금융 자산을 관리하는 방식"
  - "시장에서 경쟁하고, 제품 가격을 정하고, 공급업체를 선택할 수 있는 능력"
explanation: >-
  개인적 자유는 사적 관계에서 하는 일, 의견과 신념, 그리고 자신의 몸과 마음에 관련된 모든 것을 포괄합니다. 여기에는 결혼, 읽을거리 선택, 종교적 관행, 음식과 약에 대한 선택, 그리고 누구와 교류할지가 포함됩니다. 사업 활동, 세금, 시장에서의 결정은 경제적 자유에 속합니다.
reviewed: false
