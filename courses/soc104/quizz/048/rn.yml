question: "Centrism ikunda gushika ku buhe buryo bw'ubutegetsi?"
answer: "Technocracy, aho ububasha buhabwa abahinga bayobora ubutunzi na politike y'amafaranga"
wrong_answers:
  - "Demokarasi itaziguye, aho abanyagihugu batora ku ngingo zose nyamukuru za politike"
  - "Aristocracy, aho ububasha buba mu maboko y'umugwi w'abategetsi b'imigenzo ya kera"
  - "Ubutegetsi bwa laissez-faire, aho isoko ryigenzura ata kwivanga kwa Leta"
explanation: >-
  Centrism ishira imbere gukora neza, pragmatism, kandi ikunda kwerekeza kuri technocracy, bisigura ko ububasha bukwiye guhabwa abahinga bayobora ubutunzi kandi bagatwara politike y'amafaranga. Ivyo bitandukanye ku mushinge na demokarasi itaziguye, aristocracy, canke laissez-faire, aho kimwekimwe cose kigabura ububasha hisunzwe ingingo zitandukanye rwose.
reviewed: false
