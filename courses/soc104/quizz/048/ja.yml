question: "近代保守主義の創始者としてしばしば挙げられるのは誰か？"
answer: "フランス革命の急進的変化に対して、制度と伝統の保存を主張した Edmund Burke"
wrong_answers:
  - "19 世紀に階級闘争と史的唯物論の理論を発展させた Karl Marx"
  - "17 世紀に自然権と社会契約の理論を明確に述べた John Locke"
  - "The Wealth of Nations を著し、古典派経済学という学問分野を創始した Adam Smith"
explanation: >-
  Edmund Burke は、フランス革命への反対により、保守主義の創始者としてしばしば挙げられる。彼の Reflections on the Revolution in France（1790 年）は、急進的変化よりも慎重さと漸進的改革を擁護した。彼は、社会は白紙に戻して進むべきではなく、実証済みの制度と伝統を保存する漸進的改革を通じて進歩すべきだと考えた。
reviewed: false
