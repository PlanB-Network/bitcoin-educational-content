question: "自由意志主义者在同性婚姻问题上的立场是什么？"
answer: "国家无权定义婚姻；婚姻应当私有化，并留给个人、协会和宗教机构"
wrong_answers:
  - "同性婚姻应当合法化，因为所有公民都应在法律下受到平等待遇"
  - "同性婚姻应当被禁止，因为传统婚姻是生育的根本制度"
  - "同性婚姻应当合法化，但只能通过一种不同于传统婚姻的单独法律框架"
explanation: >-
  自由意志主义者认为，婚姻问题从根本上被错误地设定了，因为它是在国家主义框架中被提出的。他们相信国家无权干涉私人生活，因此解决方案是把婚姻与国家完全分离。通过强加单一定义，国家制造了冲突。第一个错误答案反映的是社会主义或中间主义立场，第二个反映的是保守主义立场。
reviewed: false
