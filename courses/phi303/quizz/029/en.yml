question: "Why are simple improvements to democratic life (more seats, term limits, lower thresholds) not implemented?"
answer: "Because every one of them would dilute the power of the ruling minority."
wrong_answers:
  - "Because constitutional amendments are technically impossible."
  - "Because voters have rejected them in referendums."
  - "Because they would cost too much to administer."
explanation: |
  More representatives closer to voters, term limits, easier entry for new parties, no state funding bias — all feasible, all improving democratic life, all reducing incumbent power. Their absence is not an accident.
reviewed: false
