question: "哪些代表性人物与诺兰图上的最大经济自由相关？"
answer: "Margaret Thatcher、Ronald Reagan 与 Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt、Jean Jaures 与 Bernie Sanders"
  - "Nelson Mandela、Simone Veil 与 Noam Chomsky"
  - "Vladimir Putin、Xi Jinping 与 Joseph de Maistre"
explanation: >-
  Thatcher、Reagan 与 Milei 被列为最大经济自由的代表性人物，他们偏好更少的国家干预、更少的监管与更低的税收。Roosevelt、Jaures 与 Sanders 代表相反端点，偏好国家控制经济。Mandela、Veil 与 Chomsky 代表最大个人自由。Putin、Xi Jinping 与 de Maistre 代表对个人生活的最大国家控制。
reviewed: false
