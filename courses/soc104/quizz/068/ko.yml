question: "총기 규제 문제에서 보수주의자와 리버테리언 입장 사이의 결정적 차이는 무엇인가요?"
answer: "둘 다 일정한 규제를 받아들이지만, 보수주의자는 정당한 공적 권위가 규칙을 만들기를 원하고 리버테리언은 시민 결사체와 시장 경쟁처럼 직접 관련된 사람들이 규칙을 만들어내기를 원합니다"
wrong_answers:
  - "보수주의자는 모든 총기 규제에 반대하는 반면, 리버테리언은 공공 안전을 위한 엄격한 정부 통제를 받아들입니다"
  - "보수주의자는 총기를 완전히 금지하기를 원하는 반면, 리버테리언은 모든 무기에 대한 제한 없는 접근을 지지합니다"
  - "보수주의자는 개인 권리에 근거해 입장을 세우는 반면, 리버테리언은 집단 책임에 근거해 입장을 세웁니다"
explanation: >-
  보수주의자와 리버테리언은 모두 무기 소지에는 어떤 형태의 규제가 필요하다는 데 동의합니다. 결정적 차이는 누가 그 규칙을 세우느냐에 있습니다. 보수주의자들은 규제가 공동선을 보호하는 임무를 맡은 공적 권위로부터 나와야 한다고 주장합니다(하향식). 리버테리언들은 규제가 직접 관련된 사람들, 즉 보안 전문가, 시민 결사체, 시장 경쟁으로부터 나와야 한다고 주장합니다(상향식).
reviewed: false
