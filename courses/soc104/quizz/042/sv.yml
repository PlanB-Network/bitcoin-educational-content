question: "Vilken distinktion gjorde Karl Marx mellan utopisk socialism och vetenskaplig socialism?"
answer: "Han anklagade tidiga franska socialister för att föreslå imaginära lösningar, medan hans vetenskapliga socialism var grundad i historisk materialism och klasskamp"
wrong_answers:
  - "Han hävdade att utopisk socialism var alltför fokuserad på ekonomi, medan vetenskaplig socialism prioriterade kulturell och konstnärlig omvandling"
  - "Han berömde utopiska socialister för deras praktiska experiment och kritiserade vetenskaplig socialism för att vara alltför abstrakt och teoretisk"
  - "Han påstod att utopisk socialism var våldsam och revolutionär, medan vetenskaplig socialism förespråkade fredlig demokratisk reform"
explanation: >-
  Marx anklagade tidiga franska socialister som Proudhon, Saint-Simon och Fourier för att vara utopister som föreslog rent imaginära lösningar. Hans vetenskapliga socialism vilade på historisk materialism: idén att historien framskrider genom klasskamp och tillägnandet av produktionsmedlen, där alla kulturella föreställningar betingas av produktivkrafter och produktionsförhållanden.
