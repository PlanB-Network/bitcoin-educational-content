question: "How can state-funded social assistance programs produce perverse effects, illustrating the danger of relying solely on intentions?"
answer: "They can create dependency, remove incentives to work, and amount to spoliation since the money must first be taken from those who produced the wealth"
wrong_answers:
  - "They encourage excessive personal savings, reduce consumer spending, and cause deflation in the broader economy"
  - "They strengthen private enterprise by shifting labor costs to the government and reducing the need for competitive wages"
  - "They eliminate class distinctions so thoroughly that social mobility becomes unnecessary and innovation stagnates"
explanation: >-
  Friedman warns that generous intentions can produce harmful consequences when they neglect rigorous analysis of human incentives. State-funded assistance programs risk creating dependency, generating no incentive to work, and constituting a form of spoliation since funds must first be taken from wealth producers. Measurable results like poverty reduction and efficiency must take precedence over noble intentions.
reviewed: false
