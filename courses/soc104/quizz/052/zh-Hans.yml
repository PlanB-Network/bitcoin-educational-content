question: "在外交政策方法上，新保守主义者与古保守主义者有何区别？"
answer: "新保守主义者为通过军事干预传播民主辩护，而古保守主义者捍卫一种更孤立主义的外交政策"
wrong_answers:
  - "新保守主义者反对一切军事行动并支持外交，而古保守主义者支持对潜在威胁发动先发制人的打击"
  - "新保守主义者只关注经济制裁，而古保守主义者主张建立国际联盟以开展联合军事行动"
  - "新保守主义者和古保守主义者在外交政策上意见一致，但在国内经济监管上差异尖锐"
explanation: >-
  从 2000 年代起，新保守主义者越来越多地参与为军事干预主义辩护，以便在世界各地植入民主，尤其是在 2001 年 9 月 11 日之后。作为回应，传统保守主义者采用“古保守主义者”这一标签来区分自己。古保守主义者批评军事干预主义，捍卫一种更孤立主义的外交政策，并更加强调国家和文化身份。
reviewed: false
