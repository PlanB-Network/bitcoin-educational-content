question: "What does the non-aggression principle state?"
answer: "A person is free to act as they wish so long as no violence is committed against the life, liberty, or property of another"
wrong_answers:
  - "The state has the sole right to use force in order to maintain social order"
  - "Citizens must submit to majority rule even when it restricts individual freedoms"
  - "Freedom of action is permitted only when it benefits the collective good of society"
explanation: >-
  The non-aggression principle is a cornerstone of libertarian politics, stating that individuals may act freely provided they do not commit violence against the life, liberty, or property of others. It recalls the golden rule found across civilizations. Unlike the other options, it does not grant the state special moral authority or subordinate individual rights to collective benefit.
