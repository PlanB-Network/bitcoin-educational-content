question: Quelle est l'importance du pluralisme juridique dans l'analyse d'Harold J. Berman ?
answer: Il a conduit à une fragmentation du pouvoir.
wrong_answers:
  - Il a établi un code juridique unique et unifié à travers l'Europe.
  - Il a concentré toute l'autorité juridique sous l'Église.
  - Il a aboli la distinction entre le droit canonique et le droit séculier.
explanation: |
  Harold J. Berman souligne que le pluralisme juridique a fragmenté le pouvoir entre des juridictions concurrentes (droit canonique, royal, féodal et urbain), empêchant sa concentration excessive. Cette fragmentation est, à son tour, devenue un moteur de liberté et d'innovation dans la tradition juridique occidentale.
reviewed: true
