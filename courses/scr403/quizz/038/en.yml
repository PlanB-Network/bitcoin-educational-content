question: To make Simplicity forward-compatible with cross-input signature aggregation, a half-agg-verify jet is imagined as a Writer effect whose transaction log is treated as a set of (key, message, r-component) tuples rather than a list. Under the commutative/idempotent/unitary classification, what does this set-based design achieve, and what limit remains?
answer: "It becomes commutative and idempotent, meeting Simplicity's requirement, but not unitary: discarding a call with unused output would drop its tuple from the log and skip a signature in the aggregate check."
wrong_answers:
  - It becomes idempotent and unitary, but stays non-commutative because the aggregate s-component must combine the logged r-components in the exact order the individual signatures were produced.
  - It gains all three properties, so an optimizer may freely duplicate, reorder, or discard half-agg-verify calls without any risk of changing whether the transaction is valid.
  - It becomes commutative but stays non-idempotent, since inserting an identical tuple twice would make the verifier demand two aggregate s-components for a single logged signature.
explanation: >-
  Treating the writer log as a set makes the effect idempotent and
  commutative, because set insertion itself has both properties — exactly
  the two Simplicity demands of every effect. Unitarity is still out of
  reach: like Failure, the write influences transaction validity, since
  the transaction is only valid when an aggregate s-component covers every
  logged tuple. An expression performing the write therefore cannot be
  discarded merely because its unit output is unused, as its tuple would
  silently vanish from the half-aggregation verification.
reviewed: false
