question: "Na co se zaměřuje strukturální definice politického systému?"
answer: "Na to, jak systém skutečně funguje, a na jeho pozorovatelné vlastnosti, například míru státní kontroly"
wrong_answers:
  - "Na deklarované cíle a ušlechtilé záměry vyhlášené zakladateli a vůdci systému"
  - "Na historický původ politického hnutí a životopisy jeho klíčových myslitelů"
  - "Na počet povolených politických stran a četnost konaných demokratických voleb"
explanation: >-
  Strukturální definice se soustředí na to, jak politické systémy skutečně fungují, a na jejich pozorovatelné vlastnosti. Socialismus je například strukturálně charakterizován všudypřítomností státu. Tento přístup kontrastuje s intencionálními definicemi, které se opírají o deklarované motivace a cíle. Strukturální přístup umožňuje objektivnější hodnocení založené na měřitelných výsledcích.
