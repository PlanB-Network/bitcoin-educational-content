question: "อะไรคือลักษณะของด้านล่างของแกนเสรีภาพส่วนบุคคลบน Nolan diagram?"
answer: "ความชอบต่อระเบียบ ความมั่นคง ค่านิยมแบบดั้งเดิม และรัฐที่กำกับศีลธรรมและรักษาความสงบเรียบร้อยสาธารณะ"
wrong_answers:
  - "ความชอบต่ออัตตาณัติของปัจเจกบุคคล ความอดทน และการแทรกแซงของรัฐให้น้อยที่สุดในทางเลือกชีวิตส่วนบุคคล"
  - "ความชอบต่อการยกเลิกกฎระเบียบทางเศรษฐกิจ การค้าเสรี และการยกเลิกภาษีนำเข้าและเงินอุดหนุน"
  - "ความชอบต่อการกระจายความมั่งคั่งซ้ำ ภาษีสูง และการโอนอุตสาหกรรมสำคัญเป็นของชาติ"
explanation: >-
  ด้านล่างของแกนเสรีภาพส่วนบุคคลแทนการควบคุมชีวิตส่วนบุคคลโดยรัฐสูงสุด มีลักษณะเป็นความชอบต่อระเบียบ ความมั่นคง และค่านิยมแบบดั้งเดิม รัฐกำกับศีลธรรม รักษาความสงบเรียบร้อยสาธารณะ และอาจปกป้องวิสัยทัศน์เฉพาะของศีลธรรมหรือจารีต ด้านบนของแกนแทนสิ่งตรงข้าม: เสรีภาพส่วนบุคคลและความอดทน นโยบายเศรษฐกิจวัดบนแกนนอนที่แยกต่างหาก
reviewed: false
