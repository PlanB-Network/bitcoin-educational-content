question: "Hvordan skiller den libertarianske forståelsen av frihet seg fra den sentristiske forståelsen?"
answer: "Libertarianere behandler frihet som et ubetinget aksiom, mens sentrister forsvarer friheter opportunistisk avhengig av kontekst og effektivitet"
wrong_answers:
  - "Libertarianere tillater staten å beskytte frihet selektivt, mens sentrister avviser enhver statlig involvering i å beskytte individuelle rettigheter"
  - "Libertarianere fokuserer frihet bare på økonomiske spørsmål, mens sentrister anvender frihet bredt på tvers av sosiale og kulturelle områder"
  - "Libertarianere og sentrister deler det samme synet på frihet, men er uenige om størrelsen på staten som trengs for å håndheve den"
explanation: >-
  Libertarianere definerer frihet som et generelt, ubetinget prinsipp som fungerer som et aksiom. Sentrister forsvarer derimot visse friheter på en opportunistisk og kontekstuell måte uten å anvende noe generelt prinsipp. Den sentristiske tilnærmingen avslører en instrumentell forståelse av frihet, alltid underordnet pragmatiske mål som effektivitet, noe libertarianere grunnleggende avviser.
reviewed: false
