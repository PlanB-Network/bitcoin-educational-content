question: "O que Ludwig von Mises quis dizer quando escreveu que apenas o indivíduo pensa, raciocina e age?"
answer: "Que coletividades como o estado ou uma nação não têm existência própria para além das ações de seus membros individuais"
wrong_answers:
  - "Que os indivíduos devem evitar formar grupos ou associações porque a ação coletiva é sempre prejudicial"
  - "Que apenas certos indivíduos dotados são capazes de pensamento racional, enquanto a maioria das pessoas segue o instinto"
  - "Que pensar e raciocinar são atividades privadas que nunca devem ser compartilhadas ou discutidas em público"
explanation: >-
  Mises esclareceu que o individualismo se opõe à noção de que entidades sociais, como a sociedade ou a nação, poderiam existir independentemente dos indivíduos que as compõem. Uma coletividade não tem existência própria para além das ações de seus membros individuais. Não podemos falar de modo significativo da ação do estado ou de uma empresa porque essas entidades não têm vontade nem pensamento próprios e agem apenas por meio de indivíduos.
