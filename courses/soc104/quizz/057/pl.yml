question: "Jakie są kardynalne wartości centryzmu?"
answer: "Umiarkowanie, kompromis, adaptacja i użyteczność publiczna"
wrong_answers:
  - "Tradycja, porządek, autorytet i tożsamość narodowa"
  - "Wolność, własność prywatna, zgoda i odpowiedzialność jednostki"
  - "Równość, sprawiedliwość społeczna, solidarność i własność zbiorowa"
explanation: >-
  Kardynalnymi wartościami centryzmu są umiarkowanie, kompromis, adaptacja i użyteczność publiczna. Odzwierciedlają one centrowy nacisk na pragmatyczną równowagę zamiast ideologicznego zobowiązania. Pozostałe opcje opisują odpowiednio kardynalne wartości konserwatyzmu, libertarianizmu i socjalizmu.
reviewed: false
