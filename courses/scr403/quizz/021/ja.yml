question: "bip0340-verify がブール値（true/false）を返すのではなく Failure エフェクトを使うのはなぜですか？"
answer: シュノア署名のバッチ検証を可能にするためです。1つの検査が失敗するとバッチ全体が失敗します。
wrong_answers:
  - ブール型は、unit 型と比べてブロックスペースの面で高価すぎるから。
  - Simplicity の型システムは、jets から来るブール戻り値を表現できないから。
  - 単純なブール値を返すことは、完全性定理に直接違反するから。
explanation: >-
  bip0340-verify がブール値を返す場合、署名検査が失敗しても、スクリプトが成功する分岐へ進めてしまう可能性があります。
  その場合、検証者はどの具体的な署名が失敗したのかを知る必要があり、
  バッチ検証が妨げられます。Failure エフェクトを使うことで、検査の失敗は常に
  計算全体を中断させ、多数の署名をまとめる効率的なバッチ検証を可能にします。
reviewed: true
