question: Čo je osobitné na spisoch Gournayovho krúžku?
answer: Sú to prevažne preklady zahraničných autorov
wrong_answers:
  - Sú to všetko spisy obhajujúce hospodársky liberalizmus
  - Sú to traktáty o vedeckom štúdiu ekonómie
  - Sú to satirické pamflety
explanation: |
  Cercle de Gournay je známy prekladmi anglických a holandských ekonomických diel, ktoré pomohli rozšíriť liberálne myšlienky vo Francúzsku.
