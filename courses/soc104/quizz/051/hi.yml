question: "Libertarians अपनी political philosophy के केंद्र में क्या रखते हैं?"
answer: "Ethics और law"
wrong_answers:
  - "Economic growth और wealth creation"
  - "Social equality और collective welfare"
  - "National identity और cultural preservation"
explanation: >-
  Libertarians स्वयं को सभी अन्य political families से अलग करते हैं क्योंकि वे अपनी philosophy के केंद्र में economy नहीं, बल्कि ethics और law रखते हैं। जब वे market economy की रक्षा करते हैं, तो यह wealth produce करने की उसकी capacity से कम और individual freedom तथा responsibility को promote करने के लिए अधिक होता है। Economic growth एक secondary benefit है, foundational principle नहीं।
reviewed: false
