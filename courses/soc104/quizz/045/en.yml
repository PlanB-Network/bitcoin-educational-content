question: "How does the Green New Deal represent a contemporary evolution of democratic socialism?"
answer: "It uses environmental concerns as a new justification for state intervention and confiscation of private income, subordinating individual interest to collective planetary health"
wrong_answers:
  - "It abandons traditional socialist economics entirely in favor of free-market solutions to environmental problems through carbon trading"
  - "It rejects state intervention and instead relies on voluntary individual action and private-sector innovation to address climate change"
  - "It represents a break from socialism by prioritizing environmental protection over all social justice and employment concerns"
explanation: >-
  The Green New Deal fuses environmental concerns with social objectives, combining ecological transition with social justice, employment guarantees, and reinforced public services. Individual interest is subordinated to collective interest defined by planetary health. At its core, it provides a new rhetorical envelope justifying state intervention and confiscation of private income, no longer solely in the name of social justice but also in the name of the environment.
