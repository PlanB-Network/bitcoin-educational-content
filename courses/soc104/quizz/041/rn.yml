question: "Sosiyalizimu ifata gute imwidegemvyo mu buryo butandukanye mu nzego z'imibano n'iz'ubutunzi?"
answer: "Sosiyalizimu ishigikira imwidegemvyo ikomeye mu rwego rw'imibano, ariko imwidegemvyo idakomeye mu rwego rw'ubutunzi"
wrong_answers:
  - "Sosiyalizimu iragabanya imwidegemvyo yose ku rugero rumwe mu nzego z'imibano n'iz'ubutunzi"
  - "Sosiyalizimu ishigikira imwidegemvyo ikomeye y'ubutunzi ariko ikagabanya imwidegemvyo y'imibano kugira igumize urutonde rw'ikibano"
  - "Sosiyalizimu itanga imwidegemvyo itagira imbibe mu nzego zose uko ari zibiri kandi ikizigira ugukorana ku bushake kugira igumize uburinganire"
explanation: >-
  Mu ciyumviro ca sosiyaliste, hariho itandukaniro ry'ishingiro hagati y'imwidegemvyo y'imibano n'iy'ubutunzi. Imwidegemvyo y'imibano irakomeye, ariko imwidegemvyo y'ubutunzi iragoyagoya kubera ugushimika ku bugenzuzi bwa Leta, ugutegura, n'ugusubira kugabura ubutunzi. Inyishu ya gatatu itari yo idondora iciyumviro ca libertarian, mu gihe iya kabiri idondora uburyo bwa conservatisme, buri nk'ishusho ihushanye na sosiyalizimu.
