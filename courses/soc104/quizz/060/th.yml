question: "สายกลางมีแนวโน้มไปสู่รูปแบบการปกครองแบบใด?"
answer: "เทคโนแครต ซึ่งอำนาจถูกมอบให้ผู้เชี่ยวชาญที่ขับเคลื่อนเศรษฐกิจและนโยบายการเงิน"
wrong_answers:
  - "ประชาธิปไตยทางตรง ซึ่งพลเมืองลงคะแนนต่อการตัดสินใจนโยบายสำคัญทุกเรื่อง"
  - "อภิชนาธิปไตย ซึ่งอำนาจอยู่ในมือชนชั้นปกครองแบบดั้งเดิม"
  - "การปกครองแบบ laissez-faire ซึ่งตลาดกำกับตนเองโดยไม่มีการแทรกแซงจากรัฐ"
explanation: >-
  สายกลางให้ความสำคัญกับประสิทธิภาพ ความเป็นปฏิบัตินิยม และโน้มไปสู่เทคโนแครต หมายความว่าอำนาจควรถูกมอบให้ผู้เชี่ยวชาญที่ขับเคลื่อนเศรษฐกิจและดำเนินนโยบายการเงิน สิ่งนี้แตกต่างโดยพื้นฐานจากประชาธิปไตยทางตรง อภิชนาธิปไตย หรือ laissez-faire ซึ่งแต่ละแบบกระจายอำนาจตามหลักการที่แตกต่างกันโดยสิ้นเชิง
reviewed: false
