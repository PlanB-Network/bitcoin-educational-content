question: "법정화폐 시스템은 통치자와 피통치자 사이의 구분을 어떻게 강화하나요?"
answer: "정부가 화폐 창출을 통해 무제한 지출을 조달할 수 있게 하며, 이는 인플레이션을 통해 저축의 가치를 떨어뜨립니다"
wrong_answers:
  - "시민들에게 민주적 선거와 국민투표를 통해 통화 정책을 직접 통제할 수 있게 합니다"
  - "정부의 차입을 막아 세입을 오직 세금에만 의존하도록 강제합니다"
  - "경제 성장을 촉진하기 위해 새로 창출된 돈을 모든 시민에게 동등하게 분배합니다"
explanation: >-
  법정화폐는 정부가 차입하고 은행에 새 돈을 찍어내도록 밀어붙일 수 있게 하기 때문에 국가 권력 확장의 초석으로 설명됩니다. 그 결과 발생하는 인플레이션은 사람들의 저축 가치를 떨어뜨리고, 가장 부유하고 강력한 주체들에게 이익을 줍니다. 이는 시민들에게 통화 통제권을 주지도 않고, 차입을 막지도 않으며, 돈을 동등하게 분배하지도 않습니다.
reviewed: false
