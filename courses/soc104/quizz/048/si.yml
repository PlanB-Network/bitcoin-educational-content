question: "modern conservatism හි founding figure ලෙස බොහෝ විට සඳහන් කරන්නේ කවුද?"
answer: "French Revolution හි radical changes වලට එරෙහිව institutions සහ traditions රැක ගැනීමට පෙනී සිටි Edmund Burke"
wrong_answers:
  - "දහනවවන සියවසේ class struggle සහ historical materialism theory වර්ධනය කළ Karl Marx"
  - "දහහත්වන සියවසේ natural rights සහ social contract theory පැහැදිලි කළ John Locke"
  - "The Wealth of Nations ලියා classical economics discipline එක පිහිටුවූ Adam Smith"
explanation: >-
  French Revolution ට එරෙහි වීම නිසා Edmund Burke බොහෝ විට conservatism හි founding figure ලෙස සඳහන් වේ. ඔහුගේ Reflections on the Revolution in France (1790) radical change වෙනුවට prudence සහ gradual reform වෙනුවෙන් පෙනී සිටියේය. සමාජය clean slate එකක් නිර්මාණය කිරීමෙන් නොව, tested institutions සහ traditions රැකගන්නා incremental reforms හරහා ඉදිරියට යා යුතු බව ඔහු විශ්වාස කළේය.
