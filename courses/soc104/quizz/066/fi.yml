question: "Miten konservatiivien ja libertaarien kannat vähimmäispalkkaan eroavat perusteluiltaan, vaikka molemmat kannattavat sen poistamista?"
answer: "Konservatiivit hyväksyvät jonkinasteisen valtion osallistumisen palkkojen määrittelyyn, jos se ei haittaa kilpailukykyä, kun taas libertaarit pitävät vähimmäispalkkaa moraalisena pakkona palkkaamisen ja liiketoiminnan vapaudelle"
wrong_answers:
  - "Konservatiivit vastustavat vähimmäispalkkaa, koska se aiheuttaa inflaatiota, kun taas libertaarit vastustavat sitä, koska se antaa liikaa valtaa ammattiliitoille"
  - "Konservatiivit haluavat uskonnollisten ja yhteisöllisten instituutioiden määrittävän palkat, kun taas libertaarit haluavat palkkojen määräytyvän hallituksen hyväksymien markkinatutkimusten perusteella"
  - "Konservatiivit uskovat, että vähimmäispalkkojen pitäisi vaihdella alueittain, kun taas libertaarit uskovat, että yhden yhtenäisen palkan pitäisi koskea koko maata"
explanation: >-
  Molemmat kannattavat vähimmäispalkan alentamista tai poistamista, mutta niiden perustelut eroavat perustavasti. Konservatiivit hyväksyvät jonkinasteisen valtion osallistumisen palkkojen määrittelyyn, mutta vaativat sen pysyvän vähäisenä ja kontekstista riippuvaisena sekä keskittyvät kilpailukykyyn. Libertaarit ottavat vahvemman moraalisen kannan: vähimmäispalkka on pakko palkkaamisen ja liiketoiminnan vapaudelle. Kun libertaarit sanovat "markkinat", he tarkoittavat sopimusta, joka neuvotellaan vapaasti kahden osapuolen välillä ilman valtion puuttumista.
