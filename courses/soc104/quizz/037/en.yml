question: "What warning did Milton Friedman give about judging political policies?"
answer: "Policies should be judged by their results rather than by their intentions"
wrong_answers:
  - "Policies should be judged by the moral character of the politicians who propose them"
  - "Policies should be judged by how popular they are with the general voting public"
  - "Policies should be judged by whether they align with the original constitution of the country"
explanation: >-
  Friedman wrote that one of the biggest mistakes is to judge policies on their intentions rather than their results, noting that programs labeled as being for the poor almost always produce effects opposite to what their sponsors intended. This echoes Bastiat's teaching that a good economist considers both short-term and long-term effects on the entire population.
