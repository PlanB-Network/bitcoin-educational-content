question: "政治保守主義是什麼？"
answer: "一種旨在保存既有政治制度與社會秩序、反對重大結構性動盪的意識形態"
wrong_answers:
  - "一種對傳統家庭價值與宗教實踐的個人承諾，但並不尋求將它們強加給他人"
  - "一種透過民主改革與進步立法促進快速社會變革的哲學"
  - "一種主張自由市場、最低稅收與廢除貿易壁壘的經濟理論"
explanation: >-
  政治保守主義是一種意識形態，常由右翼或極右翼政黨代表，旨在保存既有政治制度與社會秩序，同時反對重大結構性動盪。其支持者希望使用權力與法律來維護自己的遺產。這不同於文化保守主義，後者是一種個人生活選擇，而不是政治綱領。
reviewed: false
