question: "Jaký opakující se analytický rámec formuje socialistickou pozici v každé z pěti společenských debat (manželství, imigrace, střelné zbraně, drogy, slazené nápoje)?"
answer: "Rámec konfliktu mezi dominantními a ovládanými, v němž je společnost strukturována útlakem a stát musí zasahovat na ochranu zranitelné skupiny"
wrong_answers:
  - "Utilitaristický rámec zaměřený na maximalizaci celkového štěstí a ekonomické produktivity pro co největší počet občanů"
  - "Rámec přirozených práv, v němž musí být individuální svobody chráněny před státními i korporátními zásahy"
  - "Tradicionalistický rámec, v němž musí být zavedené společenské instituce chráněny před rušivými moderními změnami"
explanation: >-
  Socialistická pozice napříč společenskými debatami je důsledně formována rámcem konfliktu mezi dominantními a ovládanými. U manželství jde o heterosexuální většinu utlačující homosexuální menšinu. U imigrace jsou omezení založená na národnosti formami útlaku. U střelných zbraní by měl sílu držet pouze stát, aby chránil zranitelné. U slazených nápojů průmyslníci profitují ze zranitelnosti nejméně chráněných. Tato optika utlačovatelů a utlačovaných se reprodukuje v mnoha oblastech včetně genderu, rasy a dokonce vztahu mezi lidstvem a přírodou.
