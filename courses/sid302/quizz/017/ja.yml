question: Liquidのフェデレーテッド・コンセンサスモデルで、ブロックを有効にするために必要なファンクショナリーの署名の最小数と、ネットワークが許容できるノード障害の最大数はいくつですか？
answer: 11の署名が必要で、最大4ノードの障害まで許容できる
wrong_answers:
  - 8の署名が必要で、最大7ノードの障害まで許容できる
  - 15の署名が必要で、最大2ノードの障害まで許容できる
  - 9の署名が必要で、最大6ノードの障害まで許容できる
explanation: |
  Liquidは11-of-15のしきい値方式を採用しており、各ブロックが有効になるには15人のファンクショナリーのうち少なくとも11人の署名が必要です。この設計により、最大4ノード（15 - 11 = 4）が停止してもネットワークは動き続けられます。他の選択肢は、署名のしきい値が誤っているか、耐障害性の計算を誤っています。耐障害性は常に「ノードの総数から必要な署名数を引いた数」になります。