question: În ce provincie franceză a experimentat Turgot pentru prima dată principiile sale de liberalism economic?
answer: Limousin
wrong_answers:
  - Bretania
  - Alsacia
  - Normandia
explanation: |
  Turgot a fost intendent al provinciei Limousin, o provincie săracă și izolată, unde a pus în aplicare o serie de reforme economice inspirate de liberalism.
