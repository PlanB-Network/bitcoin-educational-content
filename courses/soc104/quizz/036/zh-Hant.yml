question: "政治制度的結構性定義關注什麼？"
answer: "該制度實際如何運作及其可觀察特徵，例如國家控制的程度"
wrong_answers:
  - "該制度創立者與領導人所宣稱的目標與高尚意圖"
  - "該政治運動的歷史起源及其關鍵思想家的傳記"
  - "被允許的政黨數量，以及舉行民主選舉的頻率"
explanation: >-
  結構性定義關注政治制度實際如何運作，以及它們的可觀察特徵。舉例而言，社會主義在結構上以國家的無所不在為特徵。這種方法不同於意圖性定義，後者依賴所宣稱的動機與目標。結構性方法能根據可衡量的結果進行更客觀的評估。
reviewed: false
