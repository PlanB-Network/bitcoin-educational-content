question: "Muri ibi bikurikira, ni ikihe ari akarorero k'urutonde rwizana nk'uko Hayek abidondora?"
answer: "Ururimi, rwakuze ku buryo bwizana biciye mu migenderanire y'amateka aho kuba rwarateguwe n'abanyabwenge bari mu biro"
wrong_answers:
  - "Itegeko nshinga ry'igihugu, ryateguwe neza n'abaserukira abandi batowe kugira ngo rishinge amategeko y'imibano"
  - "Umugambi wa leta wo gukabura ubutunzi, wateguwe n'abahinga b'ubutunzi kugira ngo bahuze ibikorwa vy'ubutunzi"
  - "Sisitemu y'indero ya leta, yashizweho n'abashingamategeko kugira ngo bose bashobore gushikira ubumenyi"
explanation: >-
  Hayek adondora urutonde rwizana nk'icavuye mu migenderanire yidegemvya mu kibano, kiva ku bikorwa vy'abantu ariko kitava ku mugambi wateguwe n'abantu n'ibigirankana. Ururimi ni akarorero nyamukuru: Igifaransa, Icongereza, n'Ikidagi ntivyubatswe n'abanyabwenge bicaye bagena amategeko y'indimburo, ahubwo vyaserutse nk'icamwa c'ugutungana buhorobuhoro kandi kwizana kwubatswe biciye mu migenderanire y'amateka.
