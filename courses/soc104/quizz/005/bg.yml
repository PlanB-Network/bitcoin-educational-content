question: "Каква обща точка споделят левите и десните политически партии въпреки привидното си противопоставяне?"
answer: "И двете защитават правото на държавата да управлява живота на хората чрез регулации и данъци"
wrong_answers:
  - "И двете се застъпват за пълното премахване на държавната намеса в икономическите въпроси"
  - "И двете поставят индивидуалната свобода над колективната организация на обществото"
  - "И двете отхвърлят използването на паричната политика като инструмент за държавни разходи"
explanation: >-
  Въпреки че изглеждат противопоставени, лявото и дясното споделят предпочитание към държавна намеса. И двете критикуват свободния пазар и защитават правото на държавата да управлява живота на хората чрез регулации и данъци. Левицата критикува пазарите като източник на неравенство, докато десницата ги вижда като заплаха за суверенитета, но и двете се обръщат към държавата за решения.
reviewed: false
