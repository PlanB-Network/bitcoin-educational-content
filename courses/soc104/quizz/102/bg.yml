question: "Защо курсът описва Bitcoin като пазарна валута, противопоставена на държавните пари, а не като десен или ляв проект?"
answer: "Защото Bitcoin е доброволно възприета, трудна за производство, децентрализирана валута, която запазва стойността си, в контраст с принудителните, централизирани фиатни пари, които губят стойност, така че разделението е пазар срещу държава, а не политическа идеология"
wrong_answers:
  - "Защото Bitcoin е създаден от анонимен разработчик, който умишлено избягва да прави каквито и да било политически изявления за предназначението или философията му"
  - "Защото алгоритъмът за копаене на Bitcoin гарантира равномерно разпределение на нови монети към всички политически партии, предотвратявайки всяко идеологическо пристрастие в паричната система"
  - "Защото Bitcoin функционира идентично на съществуващите фиатни валути, но работи върху по-бърза платежна мрежа, което прави политическите разграничения ирелевантни"
explanation: >-
  Bitcoin е описан като мирен бунт срещу политизацията на парите. Държавните или фиатните пари са принудителна, централизирана система, която има склонност да губи стойност. Пазарните пари, исторически златото и днес Bitcoin, са здравословна, трудна за производство валута, която възниква доброволно и запазва стойността си в дългосрочен план. Истинското противопоставяне не е ляво срещу дясно, а пазар срещу държава, което прави Bitcoin политически разрив, надхвърлящ традиционните идеологически лагери.
reviewed: false
