question: Ktorá udalosť, ktorej bol súčasníkom, inšpirovala Cantillonovu ekonomickú teóriu?
answer: Zlyhanie systému Johna Lawa
wrong_answers:
  - Veľká hospodárska kríza rokov 1705-1707
  - Vojna medzi Francúzskom a Holandskom
  - Anglická revolúcia
explanation: |
  Cantillon bol svedkom zrútenia Lawovho systému a jeho príčiny i dôsledky analyzoval vo svojej "Essai sur la nature du commerce en général". Táto udalosť hlboko ovplyvnila jeho ekonomické myslenie a jeho chápanie peňažných javov.
