question: "Защо вертикалната ос (горе-долу) се смята за по-фундаментална от хоризонталната ос (ляво-дясно) в диаграмата на Нолан?"
answer: "Защото разкрива истинското разделение между онези, които защитават максимални индивидуални свободи, и онези, които предпочитат максимален държавен контрол"
wrong_answers:
  - "Защото измерва икономическото производство по-точно, отколкото хоризонталната ос измерва социалните политики"
  - "Защото повечето политически конфликти през историята са били за културна идентичност, а не за управление"
  - "Защото хоризонталната ос се прилага само за съвременни демокрации, докато вертикалната ос е универсална"
explanation: >-
  Фундаменталната ос е вертикалната, защото улавя съществения политически въпрос: в каква степен държавата трябва да контролира човешкото действие? Оста ляво-дясно просто отразява различни чувствителности (социална справедливост срещу традиция), но и двете страни могат да заемат една и съща позиция върху вертикалната ос като етатисти. Вертикалната ос разкрива дали някой иска да налага визията си чрез сила, или уважава индивидуалната свобода.
reviewed: false
