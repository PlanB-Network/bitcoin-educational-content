question: "Milton Friedman 对判断政治政策给出了什么警告？"
answer: "政策应根据其结果而不是其意图来判断"
wrong_answers:
  - "政策应根据提出它们的政治家的道德品格来判断"
  - "政策应根据它们在普通选民中有多受欢迎来判断"
  - "政策应根据它们是否符合该国原始宪法来判断"
explanation: >-
  Friedman 写道，最大的错误之一是根据政策的意图而不是其结果来判断政策，并指出那些被标榜为帮助穷人的项目，几乎总是产生与其发起者意图相反的效果。这呼应了 Bastiat 的教导：一位好经济学家会同时考虑对全体人口的短期和长期影响。
reviewed: false
