question: "Kako kulturno konzervativni libertarijanac postupa sa ponašanjima koja moralno ne odobrava?"
answer: "Protivi se tim ponašanjima i odvraća od njih ubeđivanjem i primerom, ali bez pribegavanja prinudnoj sili zakona"
wrong_answers:
  - "Podržava zabrane lokalne vlasti za ta ponašanja, dok se protivi zabranama na federalnom nivou"
  - "Ostaje potpuno tih o tim ponašanjima, verujući da svaki oblik neodobravanja krši individualnu slobodu"
  - "Zalaže se za tribunale zajednice koji mogu kažnjavati ta ponašanja izvan formalnog pravnog sistema"
explanation: >-
  Kulturno konzervativni libertarijanac može moralno ne odobravati određena ponašanja, ali ne zagovara zakonsku zabranu sporazumnih, neagresivnih radnji. Može mu se ne sviđati takvo delovanje, može mu se protiviti i aktivno odvraćati od njega, ali uvek ubeđivanjem, obrazovanjem i primerom, a ne prinudnom silom zakona. Ne radi se o ćutanju niti o stvaranju alternativnih mehanizama sprovođenja.
reviewed: false
