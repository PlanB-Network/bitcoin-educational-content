question: Tại sao Bitcoin chưa được chấp nhận rộng rãi trong thương mại ngày nay?
answer: Bởi vì nó chưa được người dùng chấp nhận rộng rãi.
wrong_answers:
  - Bởi vì nó không thể vận chuyển.
  - Bởi vì nó không thể chia nhỏ thành các đơn vị nhỏ.
  - Bởi vì nó không có tính thanh khoản.
explanation: |
  Mặc dù có những đặc tính như nguồn cung đơn vị có hạn, Bitcoin vẫn chưa được chấp nhận rộng rãi trong thương mại ngày nay, do thiếu sự chấp nhận từ phía người dùng, vì vậy các nhà bán lẻ chưa nhận thấy được sự tiện lợi khi chấp nhận nó.
reviewed: true