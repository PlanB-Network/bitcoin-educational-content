question: "Koja je ključna razlika između pro-business i pro-market stava?"
answer: "Zagovornici pro-business stava traže državnu intervenciju da zaštiti određene kompanije od propasti, dok zagovornici pro-market stava podržavaju deregulaciju i dopuštaju preduzećima da propadnu kako bi se tržište prirodno reorganizovalo"
wrong_answers:
  - "Zagovornici pro-business stava usredsređuju se na velike korporacije, dok se zagovornici pro-market stava usredsređuju isključivo na podršku malim preduzećima i startup-ima"
  - "Pro-business je levičarski stav koji favorizuje radničke zadruge, dok je pro-market desničarski stav koji favorizuje privatno vlasništvo"
  - "Zagovornici pro-business stava odbacuju svaku konkurenciju, dok zagovornici pro-market stava podržavaju državom regulisanu konkurenciju između odobrenih preduzeća"
explanation: >-
  Pro-business stav vidi konkurenciju kao instrument upravljanja dobijen kroz regulative i opravdava subvencije i spasavanje firmi da bi se sprečili gubici radnih mesta. U pro-business pogledu, tržište je krhko i potrebna mu je državna pomoć. Zagovornici pro-market stava vide konkurenciju kao prirodan rezultat slobodnog preduzetništva, što podrazumeva deregulaciju i dopuštanje preduzećima da propadnu, zato što propast omogućava tržištu da se prirodno reorganizuje i otvara prostor sposobnijim akterima.
