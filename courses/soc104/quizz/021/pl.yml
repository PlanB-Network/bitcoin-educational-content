question: "Jaki wspólny cel polityczny mają etatyści lewicowi i prawicowi?"
answer: "Zdobyć władzę, aby zorganizować społeczeństwo zgodnie ze swoją wizją świata i narzucić ją wszystkim"
wrong_answers:
  - "Zmniejszyć rozmiary rządu i zwrócić władzę decyzyjną poszczególnym obywatelom"
  - "Ustanowić demokrację bezpośrednią, w której każdy obywatel głosuje nad każdą decyzją ustawodawczą"
  - "Wyeliminować partie polityczne i zastąpić je niezależnymi rządami technokratycznymi"
explanation: >-
  Etatyści lewicowi i prawicowi mają ten sam cel polityczny: zdobycie władzy, aby organizować społeczeństwo zgodnie ze swoim światopoglądem i narzucać go wszystkim poprzez ustawodawstwo. Różnica dotyczy tylko ich wartości: prawica przywołuje obronę cywilizacji, podczas gdy lewica przywołuje obronę klasy pracującej lub uciskanych. Żadna z nich nie dąży do zmniejszenia rządu ani wyeliminowania partii.
