question: "Gustave de Molinari の 1849 年の対話篇では、自由を他の目標に従属させるのではなく、根本原理として擁護するのはどの登場人物か？"
answer: "自由を他のいかなる目的にも従属しない原理として扱う経済学者"
wrong_answers:
  - "社会的平等を目指す進歩的改革を通じて自由を擁護する社会主義者"
  - "伝統的な社会秩序と安定を保つことで自由を支持する保守主義者"
  - "3 人の登場人物全員が自由を等しく擁護するが、その実装方法で意見が異なる"
explanation: >-
  Molinari の Les Soirees de la rue Saint-Lazare における対話篇では、経済学者は社会主義者と保守主義者の双方と恒常的に対立している。彼だけが自由を根本原理として擁護する。社会主義者は自由を進歩的理想に従属させ、保守主義者は秩序の維持に従属させるため、自由を無条件に擁護する点で経済学者は独自である。
reviewed: false
