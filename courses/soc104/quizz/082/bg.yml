question: "Какво е конструктивизмът като споделено политическо убеждение?"
answer: "Убеждението, че централно правителство може да създаде чрез силата на закона социален ред, който е добър за най-голям брой хора"
wrong_answers:
  - "Убеждението, че обществото трябва да бъде организирано чрез доброволно сътрудничество между индивидите без държавна намеса"
  - "Убеждението, че само свободните пазари могат да определят оптималното разпределение на ресурсите в обществото"
  - "Убеждението, че политическата власт трябва да бъде разпределена поравно между всички граждани чрез пряка демокрация"
explanation: >-
  Конструктивизмът обединява центристи, консерватори и социалисти около споделено убеждение: превъзходството на политическия процес над пазарния процес. Това е убеждението, че централно правителство може да създаде чрез силата на закона социален ред, добър за най-голям брой хора. Това стои в пряка опозиция на либертарианската защита на спонтанния ред, възникващ от доброволни взаимодействия.
