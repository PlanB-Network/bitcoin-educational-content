question: "Czym różnią się rozumowania konserwatystów i libertarian w sprawie płacy minimalnej, mimo że obie grupy opowiadają się za jej zniesieniem?"
answer: "Konserwatyści akceptują pewien udział państwa w ustalaniu płac, jeśli nie szkodzi on konkurencyjności, podczas gdy libertarianie postrzegają płacę minimalną jako moralne narzucenie ograniczenia wolności zatrudniania i prowadzenia działalności"
wrong_answers:
  - "Konserwatyści sprzeciwiają się płacy minimalnej, ponieważ powoduje inflację, podczas gdy libertarianie sprzeciwiają się jej, ponieważ daje zbyt dużą władzę związkom zawodowym"
  - "Konserwatyści chcą, by płace były ustalane przez instytucje religijne i wspólnotowe, podczas gdy libertarianie chcą, by płace były określane przez zatwierdzone przez rząd badania rynku"
  - "Konserwatyści uważają, że płace minimalne powinny różnić się regionalnie, podczas gdy libertarianie uważają, że jedna płaska płaca powinna obowiązywać w całym kraju"
explanation: >-
  Obie strony opowiadają się za ograniczeniem lub zniesieniem płacy minimalnej, ale ich rozumowanie zasadniczo się różni. Konserwatyści akceptują pewien udział państwa w ustalaniu płac, podkreślając, że powinien pozostać minimalny i zależny od kontekstu, z naciskiem na konkurencyjność. Libertarianie zajmują silniejsze stanowisko moralne: płaca minimalna jest narzuceniem ograniczenia wolności zatrudniania i prowadzenia działalności. Kiedy libertarianie mówią „rynek”, mają na myśli umowę swobodnie negocjowaną między dwiema stronami bez ingerencji państwa.
