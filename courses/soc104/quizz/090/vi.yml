question: "Lập luận nền tảng của Hayek về lý do kế hoạch hóa trung ương thất bại là gì?"
answer: "Tri thức chỉ tồn tại dưới dạng những mảnh phân tán do các cá nhân khác nhau nắm giữ và không thể được tập trung hay tích hợp bởi một quyền lực trung ương"
wrong_answers:
  - "Những người kế hoạch hóa trung ương suy đồi về đạo đức và luôn hành động vì lợi ích riêng thay vì lợi ích công"
  - "Các thiết chế dân chủ phản ứng quá chậm trước những thay đổi kinh tế, khiến các quyết định tập trung luôn lỗi thời"
  - "Kế hoạch hóa trung ương thất bại vì công dân cố ý chống lại các mệnh lệnh của chính phủ và từ chối tuân thủ các quy định"
explanation: >-
  Lập luận nền tảng của Hayek dựa trên bản chất của thông tin. Ông chứng minh rằng tri thức không bao giờ tồn tại dưới dạng tập trung hay tích hợp, mà chỉ dưới dạng những mảnh phân tán do tất cả các cá nhân khác nhau nắm giữ. Giá trị là chủ quan và chỉ được biết tại chỗ cũng như không đầy đủ. Người kế hoạch hóa trung ương, ngồi trong một văn phòng, không có tri thức về giá thật của sự vật vì ông không tham gia vào tương tác và trao đổi.
