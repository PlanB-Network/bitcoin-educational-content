question: "론 폴은 왜 연방준비제도가 해롭다고 주장하며, Bitcoin은 그의 입장과 어떻게 관련되나요?"
answer: "연방준비제도는 법정화폐 조작을 통해 인플레이션과 경제 순환을 일으키며, Bitcoin은 금본위제를 대체할 수 있는 건전한 화폐의 한 형태를 나타냅니다"
wrong_answers:
  - "연방준비제도는 은행 경쟁을 제한하며, Bitcoin은 금융 포용성을 개선하기 위해 은행 서비스를 탈중앙화합니다"
  - "연방준비제도는 국가 간 자유무역을 막으며, Bitcoin은 정부 승인 없이 국경 없는 거래를 가능하게 합니다"
  - "연방준비제도는 과도한 정부 부채를 만들어 내며, Bitcoin은 국가 부채를 없애는 디플레이션 통화를 제공합니다"
explanation: >-
  최소국가주의자인 론 폴은 연방준비제도가 법정화폐를 조작하기 때문에 인플레이션과 경제 순환에 책임이 있다고 주장합니다. 그는 프리드리히 하이에크가 옹호한 사상인 화폐의 탈국가화를 지지하며, Bitcoin을 금본위제를 대체할 수 있는 건전한 화폐의 한 형태로 봅니다. 그의 비판은 주로 은행 경쟁, 무역 장벽, 또는 정부 부채가 아니라 자유지상주의적 화폐 이론에 뿌리를 두고 있습니다.
reviewed: false
