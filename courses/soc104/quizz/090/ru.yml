question: "Почему Поппер утверждает, что открытое общество остается по своей природе хрупким, несмотря на свои преимущества?"
answer: "Потому что ответственность, которую предполагает индивидуализм, может казаться пугающей, создавая искушение искать убежище в общинной защите, власти или ностальгии по идеализированному прошлому"
wrong_answers:
  - "Потому что открытым обществам не хватает военной силы, и они не могут защищаться от вторжения закрытых обществ"
  - "Потому что демократические институты по своей природе неэффективны и в итоге рушатся под тяжестью бюрократической сложности"
  - "Потому что открытые общества допускают слишком большое экономическое неравенство, что неизбежно ведет к революции и установлению авторитарных режимов"
explanation: >-
  Поппер подчеркивает, что хрупкость открытого общества проистекает из психологической уязвимости. Ответственность, которую предполагает индивидуализм, может казаться пугающей и рискованной, потому что человек должен делать собственный выбор и может потерпеть неудачу. Это создает искушение искать убежище в общинной защите или ностальгических устремлениях к идеализированному прошлому. Открытое общество сталкивается с постоянными вызовами со стороны коммунитарных импульсов и повторяющимся искушением насилия.
