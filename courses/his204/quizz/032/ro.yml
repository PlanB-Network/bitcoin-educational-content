question: Gournay a luptat pentru comerțul liber în special pentru două mărfuri
answer: Grânele și pânza vopsită
wrong_answers:
  - Fierul și cărbunele
  - Vinul și grânele
  - Sarea și tutunul
explanation: |
  Gournay a militat pentru liberalizarea comerțului cu grâne și pânză, considerând că reglementările care apăsau aceste sectoare erau dăunătoare economiei.
