question: 操作f（A → B）と操作g（B → C）を連鎖させるとき、逐次合成は何を生成しますか？
answer: AからCへの単一の複合操作で、fの出力がgに入力されます。
wrong_answers:
  - 型BとCの両方の中間出力を含むペア値です。
  - 入力に基づいてfとgのどちらかを選ぶ条件分岐です。
  - データを共有せずに独立して実行される2つの別々の操作です。
explanation: >-
  逐次合成は2つの操作を端から端へ連鎖させる。最初の操作の出力が
  2番目の操作の入力になる。Simplicityでは、これはcompコンビネータで
  表現される。comp f gはまずfを適用し、次にその結果へgを適用する。
reviewed: false
