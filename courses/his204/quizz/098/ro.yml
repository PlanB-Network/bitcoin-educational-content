question: Cum se prezintă Dupont de Nemours în broșura sa despre asignate?
answer: Ca un prieten al poporului
wrong_answers:
  - Ca un prieten al regelui
  - Ca un prieten al libertății
  - Ca un prieten al burgheziei
explanation: |
  Dupont de Nemours s-a prezentat ca un „prieten al poporului”, subliniindu-și grija pentru bunăstarea populației.
