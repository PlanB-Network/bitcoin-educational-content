question: "Каква е ключовата разлика между това да си pro-business и това да си pro-market?"
answer: "Защитниците на pro-business търсят държавна намеса за защита на конкретни компании от провал, докато защитниците на pro-market подкрепят дерегулацията и позволяват на бизнесите да се провалят, за да може пазарът да се реорганизира естествено"
wrong_answers:
  - "Защитниците на pro-business се фокусират върху големите корпорации, докато защитниците на pro-market се фокусират изключително върху подкрепата за малки бизнеси и стартъпи"
  - "Pro-business е лява позиция, която подкрепя работнически кооперативи, докато pro-market е дясна позиция, която подкрепя частната собственост"
  - "Защитниците на pro-business отхвърлят всякаква конкуренция, докато защитниците на pro-market подкрепят регулирана от правителството конкуренция между одобрени предприятия"
explanation: >-
  Позицията pro-business разглежда конкуренцията като инструмент на управление, получен чрез регулации, и оправдава субсидии и спасявания, за да се предотврати загуба на работни места. Според възгледа pro-business пазарът е крехък и се нуждае от държавно спасяване. Защитниците на pro-market виждат конкуренцията като естествения резултат от свободното предприемачество, което предполага дерегулация и позволяване на бизнесите да се провалят, защото провалът позволява на пазара да се реорганизира естествено и отваря полето за по-способни участници.
reviewed: false
