question: "Milton Friedman 對於評判政治政策提出了什麼警告？"
answer: "政策應依其結果來評判，而不是依其意圖來評判"
wrong_answers:
  - "政策應依提出它們的政治人物的道德品格來評判"
  - "政策應依它們在一般投票大眾中有多受歡迎來評判"
  - "政策應依它們是否符合該國原始憲法來評判"
explanation: >-
  Friedman 寫道，最大的錯誤之一是依政策的意圖而非其結果來評判政策，並指出那些被標榜為幫助窮人的計畫，幾乎總是產生與其支持者意圖相反的效果。這呼應了 Bastiat 的教導：好的經濟學家會考量對整體人口的短期與長期影響。
reviewed: false
