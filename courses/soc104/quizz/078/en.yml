question: "How does the libertarian conception of freedom differ from the centrist conception?"
answer: "Libertarians treat freedom as an unconditional axiom, while centrists defend freedoms opportunistically depending on context and efficiency"
wrong_answers:
  - "Libertarians allow the state to protect freedom selectively, while centrists reject any state involvement in protecting individual rights"
  - "Libertarians focus freedom on economic matters only, while centrists apply freedom broadly across social and cultural domains"
  - "Libertarians and centrists share the same view of freedom but disagree on the size of government needed to enforce it"
explanation: >-
  Libertarians define freedom as a general, unconditional principle that functions as an axiom. Centrists, by contrast, defend certain freedoms in an opportunistic and contextual manner without applying any general principle. The centrist approach reveals an instrumental conception of freedom, always subordinated to pragmatic goals like efficiency, which libertarians fundamentally reject.
reviewed: false
