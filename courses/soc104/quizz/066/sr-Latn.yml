question: "Zašto su totalitarni režimi opisivani kao „sekularne religije” i šta to otkriva o uslovima neophodnim da totalitarizam postoji?"
answer: "Oni zahtevaju kvazireligijsku veru militanata i koriste strah protiv protivnika, a totalitarizam zahteva sve karakteristike istovremeno: ukinute slobode, jednopartijsku vlast, nasilnu revoluciju i usmeravanu ekonomiju"
wrong_answers:
  - "Oni zamenjuju tradicionalno bogosluženje državnim ceremonijama, a totalitarizam zahteva samo harizmatičnog vođu i vojnu kontrolu"
  - "Oni koriste verske institucije za sprovođenje državne ideologije, a totalitarizam može nastati kad god jedna politička partija dominira parlamentom"
  - "Oni obećavaju duhovno spasenje kroz političko delovanje, a totalitarizam postoji kad god država kontroliše ekonomiju bez obzira na političke slobode"
explanation: >-
  Raymond Aron je primetio da totalitarni režimi funkcionišu po dva principa: veri militanata i strahu protivnika. Taj kvazireligijski fanatizam karakteriše ih iznad njihovih različitih motivacija, zbog čega su nazvani sekularnim religijama. Presudno je to što totalitarizam zahteva sve definišuće karakteristike istovremeno: ukinute slobode, neograničenu vlast kroz jednu partiju, nasilnu revoluciju i usmeravanu ekonomiju. Moderne demokratije mogu pokazivati neke od tih osobina, ali totalitarizam je prisutan samo kada su sve sastavljene zajedno.
