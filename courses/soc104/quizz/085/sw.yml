question: "Kazi tatu muhimu za soko huru, kama zinavyoelezwa na walibertari, zinaundaje pamoja mfumo wa mpangilio wa kijamii ulio na ufanisi na maadili?"
answer: "Bei hutoa dira kwa maamuzi, soko hufichua mapendeleo halisi kupitia ugavi na mahitaji, na ubadilishanaji huru huwawezesha watu binafsi kuamua mambo yao wenyewe kulingana na maadili binafsi, hivyo kuchanganya ufanisi wa taarifa na uhuru wa kimaadili"
wrong_answers:
  - "Soko huongeza utajiri wa jumla, huzuia ukiritimba kupitia ushindani wa kiasili, na huhakikisha mgawanyo sawa wa rasilimali, hivyo kuchanganya uzalishaji na haki ya kijamii"
  - "Masoko huru hupunguza matumizi ya serikali, huchochea uvumbuzi wa kiteknolojia, na huunda fursa za ajira, hivyo kuchanganya uwajibikaji wa kifedha na ukuaji wa kiuchumi"
  - "Masoko hupunguza bei za watumiaji, huongeza ubora wa bidhaa kupitia ushindani, na hupanua biashara ya kimataifa, hivyo kuchanganya ustawi wa ndani na ushirikiano wa kimataifa"
explanation: >-
  Hoja ya kilibertari kwa ajili ya soko huru inategemea kazi tatu zilizounganishwa. Kwanza, bei hutumika kama viashiria vya kuaminika vinavyoongoza maamuzi ya kiuchumi na kijamii (dira). Pili, soko hufichua mapendeleo halisi ya watu binafsi kupitia ugavi na mahitaji. Tatu, ubadilishanaji huru huwawezesha watendaji kuamua mambo yao wenyewe kulingana na maadili binafsi. Hayek alionyesha kwamba masoko huru huratibu taarifa zilizotawanyika vizuri zaidi kuliko upangaji wa kati (ufanisi), ilhali ridhaa ya pande zote huheshimu utu wa binadamu kuliko ulazimishaji (haki).
