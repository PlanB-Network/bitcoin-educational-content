question: "Hva er definisjonen på statisme slik den presenteres i Nolan-rammeverket?"
answer: "Å bruke lovgivning til å kontrollere og forme samfunnet, enten i navnet til forsvar av sivilisasjonen, arbeiderklassen, naturen eller de undertrykte"
wrong_answers:
  - "Et styresett der folkevalgte tjenestepersoner sitter i faste perioder og makt overføres gjennom demokratiske valg"
  - "Troen på at bare et sterkt militær kan beskytte en nasjons suverenitet og territorielle integritet"
  - "En økonomisk filosofi som prioriterer nasjonale industrier fremfor utenlandsk konkurranse gjennom tollsatser og kvoter"
explanation: >-
  Statisme defineres som å bruke lovgivning til å kontrollere og forme samfunnet. Både venstresiden og høyresiden praktiserer det: noen i navnet til forsvar av sivilisasjonen, andre i navnet til forsvar av arbeiderklassen, naturen eller de undertrykte. Selv sentrister godkjenner det når det passer dem. Statisme er ikke begrenset til militærpolitikk, handelsproteksjonisme eller bare det å ha folkevalgte regjeringer.
reviewed: false
