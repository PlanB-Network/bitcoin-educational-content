question: "Karl Popper の開かれた社会と閉じた社会の区別は、個人主義対集団主義の議論とどのように関係しているか？"
answer: "開かれた社会は、個人が個人的決定を通じて自ら判断する権利を認める一方、閉じた社会は集団主義的であり、部族的心性と批判的自由の拒否に依拠する"
wrong_answers:
  - "開かれた社会は国境を越えた自由貿易を認める社会である一方、閉じた社会は関税と保護主義的な経済政策を課す"
  - "開かれた社会はすべての市民が投票する直接民主制によって統治される一方、閉じた社会は単一の世襲君主によって支配される"
  - "開かれた社会はすべての政府文書を透明に公開する一方、閉じた社会は情報を国家機密として分類する"
explanation: >-
  Popper は、閉じた社会を魔術的または部族的社会と定義し、開かれた社会を個人が個人的決定に直面する社会と定義した。閉じた社会は集団主義的であり、批判的自由の拒否と静的秩序の理想化を伴う部族的心性に依拠する。開かれた社会は、価値、信念、関係を自由に選ぶことを優先し、個人主義の原理を直接体現する。
reviewed: false
