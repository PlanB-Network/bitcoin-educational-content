question: "Quel est le désaccord essentiel entre les libertariens et les autres familles politiques lorsqu'ils partagent les mêmes objectifs ?"
answer: "Le désaccord porte sur les moyens : les libertariens rejettent les solutions coercitives et privilégient l'échange volontaire par le processus de marché"
wrong_answers:
  - "Le désaccord porte sur les fins : les libertariens poursuivent des objectifs différents comme la richesse individuelle plutôt que le bien-être social"
  - "Le désaccord porte sur le calendrier : les libertariens veulent atteindre les mêmes objectifs plus lentement par une réforme graduelle"
  - "Le désaccord porte sur l'échelle : les libertariens veulent appliquer les mêmes politiques uniquement au niveau local plutôt qu'au niveau national"
explanation: >-
  Les libertariens peuvent être d'accord avec les socialistes, les conservateurs et les centristes sur certains objectifs comme défendre les opprimés ou promouvoir la cohésion sociale. Le désaccord ne réside pas dans les fins mais dans les moyens. Les libertariens rejettent toutes les solutions coercitives qui cherchent à uniformiser les pratiques et les réglementations, défendant plutôt le pouvoir de choisir et la liberté responsable par l'échange libre et décentralisé fondé sur des contrats volontaires.
