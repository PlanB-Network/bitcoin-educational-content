question: "Ron Paul ने नशीले पदार्थों के उपयोग और गर्भपात जैसे मुद्दों पर paleo-libertarian स्थिति को कैसे दर्शाया?"
answer: "उन्होंने व्यक्तिगत रूप से नशीले पदार्थों के उपयोग के खिलाफ सलाह दी और गर्भपात का विरोध किया, लेकिन राजनीतिक रूप से संघीय प्रतिबंध के खिलाफ लड़े और तर्क दिया कि चुनाव व्यक्तियों या राज्यों पर छोड़े जाने चाहिए"
wrong_answers:
  - "उन्होंने पूर्ण व्यक्तिगत अधिकारों के मामले के रूप में सभी नशीले पदार्थों और गर्भपात के संघीय वैधीकरण का समर्थन किया"
  - "उन्होंने अपने व्यक्तिगत नैतिक विश्वासों के आधार पर नशीले पदार्थों और गर्भपात दोनों पर कड़े संघीय प्रतिबंधों के लिए अभियान चलाया"
  - "उन्होंने इन मुद्दों पर कोई भी व्यक्तिगत राय व्यक्त करने से इनकार किया, यह तर्क देते हुए कि राजनेताओं को नैतिक रूप से तटस्थ रहना चाहिए"
explanation: >-
  Ron Paul व्यक्तिगत नैतिक विश्वासों को राजनीतिक बलप्रयोग से अलग करके paleo-libertarian समन्वय का उदाहरण देते हैं। उन्होंने हमेशा नशीले पदार्थों के उपयोग के खिलाफ सलाह दी, लेकिन साथ ही नशीले पदार्थों पर प्रतिबंध का विरोध किया। वे व्यक्तिगत रूप से गर्भपात के विरोधी थे, फिर भी उन्होंने तर्क दिया कि चुनाव ऊपर से थोपे जाने के बजाय राज्यों पर छोड़ा जाना चाहिए। यह दिखाता है कि कोई व्यक्ति मजबूत पारंपरिक मूल्य रख सकता है और फिर भी उन्हें लागू कराने के लिए संघीय सरकार की दमनकारी शक्ति का उपयोग करने से इनकार कर सकता है।
reviewed: false
