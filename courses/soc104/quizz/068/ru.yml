question: "В вопросе регулирования огнестрельного оружия в чём состоит ключевое различие между консервативной и либертарианской позициями?"
answer: "Обе признают некоторое регулирование, но консерваторы хотят правил от легитимной публичной власти, тогда как либертарианцы хотят, чтобы правила возникали от непосредственно заинтересованных сторон, таких как ассоциации граждан и рыночная конкуренция"
wrong_answers:
  - "Консерваторы выступают против любого регулирования огнестрельного оружия, тогда как либертарианцы принимают строгий государственный контроль ради общественной безопасности"
  - "Консерваторы хотят полностью запретить огнестрельное оружие, тогда как либертарианцы поддерживают неограниченный доступ ко всем видам оружия"
  - "Консерваторы основывают свою позицию на индивидуальных правах, тогда как либертарианцы основывают свою на коллективной ответственности"
explanation: >-
  И консерваторы, и либертарианцы согласны, что некоторая форма регулирования ношения оружия необходима. Ключевое различие состоит в том, кто устанавливает эти правила. Консерваторы настаивают, что регулирование должно исходить от публичной власти, отвечающей за охрану общего блага (сверху вниз). Либертарианцы утверждают, что регулирование должно возникать от непосредственно заинтересованных сторон: специалистов по безопасности, ассоциаций граждан и рыночной конкуренции (снизу вверх).
reviewed: false
