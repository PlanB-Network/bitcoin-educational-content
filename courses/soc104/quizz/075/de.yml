question: "Was ist das Konzept des 'Moral Hazard' im Kontext der Subventionsdebatte, und welche politische Familie bringt diese Sorge vor?"
answer: "Moral Hazard ist der Anreiz zur Verantwortungslosigkeit, wenn Unternehmen durch Subventionen vor dem Scheitern bewahrt werden, weil letztlich der Steuerzahler zahlt; diese Sorge wird von Libertären vorgebracht"
wrong_answers:
  - "Moral Hazard ist das Risiko, dass subventionierte Unternehmen in Länder mit niedrigeren Steuern abwandern und Arbeitsplätze mitnehmen; diese Sorge wird von Konservativen vorgebracht"
  - "Moral Hazard ist die Gefahr, dass Regierungsbeamte korrupt werden, indem sie auswählen, welche Unternehmen Subventionen erhalten; diese Sorge wird von Zentristen vorgebracht"
  - "Moral Hazard ist das ethische Problem, dass Unternehmen Arbeiter ausbeuten, nachdem sie öffentliche Mittel erhalten haben; diese Sorge wird von Sozialisten vorgebracht"
explanation: >-
  Libertäre argumentieren, dass Subventionen und Rettungsaktionen Moral Hazard erzeugen: Wenn Unternehmen vor dem Scheitern bewahrt werden, schafft dies Anreize für Verantwortungslosigkeit und Leichtsinn, weil es keine Folgen für schlechte Entscheidungen gibt. Am Ende zahlt der Steuerzahler, was Libertäre für zutiefst ungerecht halten. Dieses Konzept unterscheidet sich von Sorgen über Unternehmensabwanderung, Korruption von Amtsträgern oder Ausbeutung von Arbeitern, die von anderen politischen Familien vorgebracht werden.
