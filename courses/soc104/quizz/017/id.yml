question: "Tentang apa kanan ingin membuat undang-undang?"
answer: "Moralitas dan agama, didorong oleh keinginan untuk mempertahankan institusi tradisional dan hierarki sosial"
wrong_answers:
  - "Ekonomi dan pasar keuangan, didorong oleh keinginan untuk mengurangi ketimpangan dan mendistribusikan ulang kekayaan"
  - "Sains dan pendidikan, didorong oleh keinginan untuk mengontrol apa yang diajarkan di sekolah negeri"
  - "Perdagangan internasional dan diplomasi, didorong oleh keinginan untuk memperluas pengaruh nasional di luar negeri"
explanation: >-
  Kanan memprioritaskan moralitas pribadi dan nilai-nilai tradisional. Ia menganggap bahwa peradaban dibangun di atas institusi tradisional dan hierarki sosial tertentu yang harus dipertahankan, dan ia ingin membuat undang-undang tentang moralitas dan agama. Kiri, bukan kanan, berfokus pada pembuatan undang-undang atas ekonomi. Sains, pendidikan, dan kebijakan perdagangan bukanlah fokus utama yang dijelaskan untuk kanan.
reviewed: false
