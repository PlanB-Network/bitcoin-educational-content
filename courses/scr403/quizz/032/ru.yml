question: Доказательство полноты строит любую функцию, вкладывая case для декомпозиции входа и scribe для каждого выхода. Почему это лишь теоретический инструмент?
answer: Полученное выражение представляет собой гигантскую таблицу поиска, размер которой растёт экспоненциально — для 256-битного входа понадобилось бы около 2²⁵⁶ записей.
wrong_answers:
  - scribe — это макрос, а не базовый комбинатор, поэтому выражение выходит за пределы формально верифицированного языка.
  - Bit Machine вычисляет его за экспоненциальное время, хотя само выражение остаётся компактным благодаря разделению общих частей.
  - Вложенный case может декомпозировать только типы-суммы, поэтому построение не работает для входов типа произведение.
explanation: >-
  Эта конструкция перечисляет все возможные входы через вложенную
  декомпозицию case и жёстко прописывает каждый выход с помощью scribe,
  из-за чего размер выражения растёт экспоненциально — астрономически
  для реалистичных типов, таких как 256-битные слова. Взрыв происходит
  именно в размере выражения, а не во времени выполнения иначе
  компактного выражения. scribe разворачивается в настоящие базовые
  комбинаторы (unit, injl, injr, pair), поэтому результат остаётся
  внутри базового языка, теорема полноты которого формально
  верифицирована в Rocq; а декомпозиция обрабатывает входы любого типа,
  включая произведения.
