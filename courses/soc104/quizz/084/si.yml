  - "rational thought කිරීමට හැකියාව ඇත්තේ ඇතැම් gifted individualsට පමණක් වන අතර බොහෝ මිනිසුන් instinct අනුගමනය කරන බව"
  - "thinking සහ reasoning යනු කිසිදා public තුළ බෙදාගැනීම හෝ සාකච්ඡා කිරීම නොකළ යුතු private activities බව"
explanation: >-
  society හෝ nation වැනි social entities ඒවා compose කරන individualsගෙන් ස්වාධීනව පවතින්නට හැකිය යන අදහසට individualism විරුද්ධ වන බව Mises පැහැදිලි කළේය. collectivity එකකට එහි individual membersගේ actions ඉක්මවා තමන්ගේම existence එකක් නැත. state එකක හෝ company එකක action ගැන අර්ථවත් ලෙස කතා කළ නොහැක, මන්ද මෙම entities වලට තමන්ගේම will හෝ thought නොමැති අතර ඒවා act කරන්නේ individuals හරහා පමණක් වන නිසාය.
