question: "Ce tensiune internă există între libertarieni în diagrama Nolan?"
answer: "Unii vor să abolească statul complet (anarho-capitaliști), în timp ce alții preferă un stat minimal care păstrează funcțiile suverane de bază (minarhiști)"
wrong_answers:
  - "Unii vor reglementare economică puternică, în timp ce alții preferă dereglementarea completă a tuturor industriilor"
  - "Unii susțin alegeri democratice, în timp ce alții favorizează un sistem ereditar de guvernare"
  - "Unii pledează pentru politici sociale progresiste, în timp ce alții apără valori morale strict tradiționale"
explanation: >-
  În cadrul familiei libertariene, există un dezacord fundamental cu privire la rolul statului. Anarho-capitaliștii vor să înlocuiască toate funcțiile statului cu servicii private, în timp ce minarhiștii acceptă un stat minimal care păstrează funcții suverane de bază precum apărarea și instanțele. Ambele grupuri împart vârful libertarian, dar diferă în privința întrebării dacă ar trebui să existe vreun stat.
