question: What is the significance of legal pluralism in Harold J. Berman's analysis?
answer: It led to a fragmentation of power
wrong_answers:
  - It established a single unified legal code across Europe
  - It concentrated all legal authority under the Church
  - It abolished the distinction between canon law and secular law
explanation: |
  Harold J. Berman emphasizes that legal pluralism fragmented power among competing jurisdictions (canon, royal, feudal, and urban law), preventing its excessive concentration. This fragmentation, in turn, became a driver of freedom and innovation in the Western legal tradition.
reviewed: true
