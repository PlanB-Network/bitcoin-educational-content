question: "Michael Oakeshott felsefi çalışmalarında muhafazakârlığı nasıl nitelendirdi?"
answer: "Katı ve sistematik bir ideolojiden ziyade hayata yönelik bir mizaç ve eğilim olarak"
wrong_answers:
  - "Devletin her alanı için kesin politika reçeteleri olan kapsamlı bir ekonomik teori olarak"
  - "Modern kurumları ortadan kaldırıp sanayi öncesi topluma dönmeyi amaçlayan devrimci bir hareket olarak"
  - "Hristiyan teolojisine ve kilise otoritesine dayanan bütünüyle dini bir doktrin olarak"
explanation: >-
  Britanyalı bir filozof olan Michael Oakeshott, muhafazakârlığın sistematik bir ideolojiden ziyade mizaç olarak anlaşılmasını savundu. Muhafazakâr Olmak Üzerine (1956) adlı denemesi temel bir referans olmayı sürdürür. Muhafazakârlığın bir eğilim olarak bu yorumu Friedrich Hayek'i de etkiledi. Oakeshott'ın yaklaşımı, siyasetin bir sisteme indirgenebileceği fikrini reddederek siyasette rasyonalizm eleştirisiyle öne çıkar.
