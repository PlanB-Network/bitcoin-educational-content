question: "ปัญหาพื้นฐานของสกุลเงิน fiat ที่ Satoshi Nakamoto ระบุคืออะไร?"
answer: "มันต้องการความไว้วางใจในธนาคารกลางว่าจะไม่ลดค่าของสกุลเงิน แต่ประวัติศาสตร์ของสกุลเงิน fiat เต็มไปด้วยการละเมิดความไว้วางใจนี้"
wrong_answers:
  - "มันใช้งานยากเกินไปสำหรับธุรกรรมประจำวัน เพราะเงินสดทางกายภาพสึกหรอเร็วและมีต้นทุนผลิตสูง"
  - "มันไม่สามารถโอนระหว่างประเทศได้ เพราะแต่ละประเทศมีมาตรฐานและกฎระเบียบทางการเงินที่เข้ากันไม่ได้"
  - "มันมีทุนสำรองทองคำหนุนหลังซึ่งไม่เพียงพอที่จะครอบคลุมปริมาณเงินทั้งหมดที่หมุนเวียนอยู่"
explanation: >-
  Satoshi Nakamoto ระบุว่าปัญหาพื้นฐานของสกุลเงินตามธรรมเนียมคือความไว้วางใจที่ต้องวางไว้ในมันเพื่อให้มันทำงานได้ สกุลเงิน fiat ไม่ได้ถูกหนุนหลังด้วย commodity แต่ตั้งอยู่ทั้งหมดบนอำนาจของสถาบัน เมื่อสถาบันหนึ่งถือการควบคุมเงินทั้งหมด สิ่งยั่วยวนให้ abuse ก็รุนแรงเกินไป และประวัติศาสตร์ได้แสดงสิ่งนี้ซ้ำแล้วซ้ำเล่าผ่านการลดค่าของสกุลเงิน
reviewed: false
