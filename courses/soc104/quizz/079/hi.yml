question: "साझा राजनीतिक विश्वास के रूप में निर्माणवाद क्या है?"
answer: "यह विश्वास कि एक केंद्रीय सरकार कानून के बल पर ऐसी सामाजिक व्यवस्था बना सकती है जो सबसे बड़ी संख्या के लोगों के लिए अच्छी हो"
wrong_answers:
  - "यह विश्वास कि समाज को राज्य के हस्तक्षेप के बिना व्यक्तियों के बीच स्वैच्छिक सहयोग के माध्यम से संगठित किया जाना चाहिए"
  - "यह विश्वास कि केवल मुक्त बाज़ार ही समाज में संसाधनों के सर्वोत्तम वितरण को निर्धारित कर सकते हैं"
  - "यह विश्वास कि राजनीतिक अधिकार को प्रत्यक्ष लोकतंत्र के माध्यम से सभी नागरिकों में समान रूप से वितरित किया जाना चाहिए"
explanation: >-
  निर्माणवाद केंद्रवादियों, रूढ़िवादियों और समाजवादियों को एक साझा विश्वास के इर्द-गिर्द एक करता है: बाज़ार प्रक्रिया पर राजनीतिक प्रक्रिया की श्रेष्ठता। यह विश्वास है कि एक केंद्रीय सरकार कानून के बल पर ऐसी सामाजिक व्यवस्था बना सकती है जो सबसे बड़ी संख्या के लोगों के लिए अच्छी हो। यह स्वैच्छिक अंतःक्रियाओं से उभरने वाली स्वस्फूर्त व्यवस्था की लिबर्टेरियन रक्षा के सीधे विरोध में खड़ा है।
