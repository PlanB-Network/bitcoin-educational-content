question: "Ludwig von Mises หมายความว่าอย่างไรเมื่อเขาเขียนว่ามีเพียงปัจเจกบุคคลเท่านั้นที่คิด ใช้เหตุผล และกระทำ?"
answer: "ว่ากลุ่มรวมอย่างรัฐหรือชาติไม่มีการดำรงอยู่ของตนเองนอกเหนือจากการกระทำของสมาชิกปัจเจกบุคคลของมัน"
wrong_answers:
  - "ว่าปัจเจกบุคคลควรหลีกเลี่ยงการตั้งกลุ่มหรือสมาคม เพราะการกระทำร่วมกันเป็นอันตรายเสมอ"
  - "ว่ามีเพียงปัจเจกบุคคลที่มีพรสวรรค์บางคนเท่านั้นที่มีความสามารถในการคิดอย่างมีเหตุผล ส่วนคนส่วนใหญ่ทำตามสัญชาตญาณ"
  - "ว่าการคิดและการใช้เหตุผลเป็นกิจกรรมส่วนตัวที่ไม่ควรถูกแบ่งปันหรืออภิปรายในที่สาธารณะ"
explanation: >-
  Mises ชี้แจงว่าปัจเจกนิยมต่อต้านแนวคิดที่ว่าองค์รวมทางสังคม เช่น สังคมหรือชาติ สามารถดำรงอยู่ได้อย่างเป็นอิสระจากปัจเจกบุคคลที่ประกอบเป็นมัน กลุ่มรวมไม่มีการดำรงอยู่ของตนเองนอกเหนือจากการกระทำของสมาชิกปัจเจกบุคคลของมัน เราไม่สามารถพูดอย่างมีความหมายถึงการกระทำของรัฐหรือบริษัทได้ เพราะองค์รวมเหล่านี้ไม่มีเจตจำนงหรือความคิดของตนเอง และกระทำผ่านปัจเจกบุคคลเท่านั้น
reviewed: false
