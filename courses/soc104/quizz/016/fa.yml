question: "چپ چه چیزی را می‌خواهد قانون‌گذاری و تنظیم کند؟"
answer: "اقتصاد را، که از خصومت با آزادی اقتصادی، سرمایه‌داری و بازار آزاد ناشی می‌شود"
wrong_answers:
  - "اخلاق شخصی و اعمال دینی را، که از میل به حفظ نهادهای سنتی ناشی می‌شود"
  - "مهاجرت و مرزهای ملی را، که از نگرانی دربارهٔ هویت فرهنگی و حاکمیت ناشی می‌شود"
  - "فناوری و نوآوری را، که از ترس جایگزین‌شدن کارگران انسانی توسط خودکارسازی ناشی می‌شود"
explanation: >-
  چپ به عدالت اجتماعی و برابری اولویت می‌دهد، به‌ویژه در سطح اقتصادی. این امر به خصومت آن با آزادی اقتصادی، سرمایه‌داری و بازار آزاد، و تمایلش به قانون‌گذاری و تنظیم اقتصاد می‌انجامد. در مقابل، راست می‌خواهد دربارهٔ اخلاق و دین قانون‌گذاری کند. تنظیم مهاجرت و فناوری تمرکز اصلیِ توصیف‌شده در اینجا نیستند.
reviewed: false
