question: "左翼和右翼国家主义者共享什么政治目标？"
answer: "赢得权力，以便按照自己的世界观组织社会，并将其强加给所有人"
wrong_answers:
  - "缩小政府规模，并把决策权还给个体公民"
  - "建立一种直接民主，让每个公民对每项立法决定投票"
  - "消除政党，并用独立的技术官僚治理取而代之"
explanation: >-
  左派和右派的国家主义者共享同一个政治目标：赢得权力，以便按照自己的世界观组织社会，并通过立法将其强加给所有人。差别只在于他们的价值观：右派援引捍卫文明，而左派援引捍卫工人阶级或被压迫者。两者都不是在寻求缩小政府或消除政党。
reviewed: false
