question: Какво произвежда последователната композиция при свързване на операция f (A → B) с операция g (B → C)?
answer: Една съставна операция от A до C, като изходът на f се подава към g.
wrong_answers:
  - Стойност двойка, съдържаща и двата междинни изхода от тип B и C.
  - Условие, което избира между f и g според входа.
  - Две отделни операции, които се изпълняват независимо и не споделят данни.
explanation: >-
  Последователната композиция свързва две операции от край до край. Изходът на
  първата операция става вход на втората. В Simplicity това се изразява с
  комбинатора comp: comp f g първо прилага f, а след това g върху
  резултата.
reviewed: false
