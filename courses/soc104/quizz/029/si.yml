question: "Friedrich Hayek විසින් විස්තර කරන 'spontaneous order' සංකල්පය කුමක්ද?"
answer: "සමාජ නීති සහ norms authoritarian planning මගින් පැනවීම වෙනුවට නිදහස් පුද්ගල අන්තර්ක්‍රියා වලින් මතුවිය යුතුය"
wrong_answers:
  - "competitive balance පවත්වා ගැනීමට state මැදිහත් නොවන්නේ නම් markets ස්වභාවිකව monopoly දෙසට නැඹුරු වේ"
  - "සමාජය පාලනය කරන laws ස්ථාපිත කිරීමට ඇති එකම legitimate mechanism එක democratic elections වේ"
  - "Economic crises spontaneous ලෙස ඇති වන අතර stability නැවත පිහිටුවීමට immediate government intervention අවශ්‍ය වේ"
explanation: >-
  Hayek ගේ spontaneous order සංකල්පය අනුව, සමාජය පාලනය කරන නීති ඉහළින් central planning මගින් පැනවිය යුතු නැත; ඒවා individual wills, contracts, සහ voluntary relationships හි නිදහස් ක්‍රීඩාවෙන් මතුවිය යුතුය. මෙය libertarian thought හි මූලික axis එකකි. Markets monopoly දෙසට නැඹුරු වන බව හෝ crises සඳහා government intervention අවශ්‍ය බව එයින් අදහස් නොවේ.
reviewed: false
