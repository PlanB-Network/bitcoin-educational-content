question: Ni ubuhe buryo nyamukuru bwo gushirwa mu ngiro kwa Bitcoin core?
answer: Bitcoin Knots
wrong_answers:
  - Bitcoin Cash
  - BTCD
  - Bcoin
explanation: Bitcoin Knots ni fork ya Bitcoin Core yatunganijwe na Luke Dashjr, ni Fork ya Core, itanga uburyo bwo kwongerako n’iyerekwa ry’ubuhinga.
reviewed: true
