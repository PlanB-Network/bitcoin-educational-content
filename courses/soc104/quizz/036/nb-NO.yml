question: "Hva fokuserer en strukturell definisjon av et politisk system på?"
answer: "Hvordan systemet faktisk fungerer og dets observerbare kjennetegn, som graden av statlig kontroll"
wrong_answers:
  - "De uttalte målene og edle intensjonene som erklæres av systemets grunnleggere og ledere"
  - "Den politiske bevegelsens historiske opprinnelse og biografiene til dens sentrale tenkere"
  - "Antallet tillatte politiske partier og hyppigheten av demokratiske valg som holdes"
explanation: >-
  Strukturelle definisjoner fokuserer på hvordan politiske systemer faktisk fungerer og på deres observerbare kjennetegn. For eksempel kjennetegnes sosialisme strukturelt av statens allestedsnærvær. Denne tilnærmingen står i kontrast til intensjonelle definisjoner, som bygger på uttalte motivasjoner og mål. Den strukturelle tilnærmingen muliggjør en mer objektiv vurdering basert på målbare resultater.
reviewed: false
