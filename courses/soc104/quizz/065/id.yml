question: "Apa posisi libertarian tentang pertanyaan pernikahan sesama jenis?"
answer: "Negara tidak punya urusan mendefinisikan pernikahan; pernikahan harus diprivatisasi dan diserahkan kepada individu, asosiasi, dan institusi keagamaan"
wrong_answers:
  - "Pernikahan sesama jenis harus dilegalkan karena semua warga berhak mendapatkan perlakuan setara di bawah hukum"
  - "Pernikahan sesama jenis harus dilarang karena pernikahan tradisional adalah institusi fundamental untuk prokreasi"
  - "Pernikahan sesama jenis harus dilegalkan tetapi hanya melalui kerangka hukum terpisah yang berbeda dari pernikahan tradisional"
explanation: >-
  Libertarian berargumen bahwa pertanyaan pernikahan pada dasarnya dibingkai secara keliru karena diajukan dalam istilah etatis. Mereka percaya negara tidak punya urusan mencampuri kehidupan privat, sehingga solusinya adalah memisahkan pernikahan dari negara sepenuhnya. Dengan memaksakan satu definisi, negara menciptakan konflik. Jawaban salah pertama mencerminkan posisi sosialis atau sentris, dan yang kedua mencerminkan posisi konservatif.
