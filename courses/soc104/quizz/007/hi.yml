question: "Nolan diamond में कौन-सी स्थिति शीर्ष पर होती है और अधिकतम स्वतंत्रता का प्रतिनिधित्व करती है?"
answer: "Libertarianism, जो सबसे अधिक आर्थिक और व्यक्तिगत स्वतंत्रता का समर्थन करता है"
wrong_answers:
  - "Conservatism, जो पारंपरिक मूल्यों और आर्थिक स्वतंत्रता का समर्थन करता है"
  - "Centrism, जो सभी राजनीतिक स्थितियों को व्यावहारिक तरीके से संतुलित करता है"
  - "Socialism, जो व्यक्तिगत स्वतंत्रता और सामाजिक समानता का समर्थन करता है"
explanation: >-
  Libertarianism Nolan diamond के शीर्ष पर statism के विपरीत के रूप में स्थित है। यह उन लोगों का प्रतिनिधित्व करता है जो आर्थिक और व्यक्तिगत स्वतंत्रता दोनों की सबसे अधिक मात्रा का समर्थन करते हैं। Conservatism दाईं ओर स्थित है (उच्च आर्थिक, कम व्यक्तिगत स्वतंत्रता), socialism बाईं ओर (उच्च व्यक्तिगत, कम आर्थिक स्वतंत्रता), और centrism बीच में।
