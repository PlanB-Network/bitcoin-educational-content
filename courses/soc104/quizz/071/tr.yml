question: "Sağlık hizmetleri konusunda sosyalist tutum nedir?"
answer: "Sağlık hizmetlerine erişim temel bir haktır ve devlet, gelirden bağımsız olarak herkes için evrensel, kamu tarafından finanse edilen bir sistemi garanti etmelidir"
wrong_answers:
  - "Sağlık hizmetleri, özel sigorta seçenekleriyle desteklenen temel devlet kapsamına sahip karma bir sistem olmalıdır"
  - "Özel piyasalar daha yenilikçi sağlık hizmetleri sunar, bu yüzden bireyler kendi sistemlerini özgürce seçmelidir"
  - "Devlet sağlık hizmetlerini yalnızca en yoksul yurttaşlar için sağlamalı, özel sigorta ise geri kalan herkesi kapsamalıdır"
explanation: >-
  Sosyalistler için sağlık hizmetlerine erişim bir meta değil, temel bir haktır. Devlet, gelirden bağımsız olarak herkesin bakıma erişebilmesi için evrensel, kamu tarafından finanse edilen bir sağlık sistemini garanti etmelidir. Bu, sosyalistlerin eşitlik, sosyal adalet ve genel çıkar doğrultusunda hizmetlerin örgütlenmesinde devletin önemi konusundaki kaygısını yansıtır. Karma sistem merkezci görüşü tanımlarken, tercih temelli yaklaşımlar liberteryen ve muhafazakâr tutumları yansıtır.
