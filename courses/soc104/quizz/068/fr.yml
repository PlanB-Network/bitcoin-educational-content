question: "Sur la question de la réglementation des armes à feu, quelle est la différence cruciale entre les positions conservatrice et libertarienne ?"
answer: "Les deux acceptent une certaine réglementation, mais les conservateurs veulent des règles émanant d'une autorité publique légitime tandis que les libertariens veulent que les règles émergent des personnes directement concernées, comme les associations de citoyens et la concurrence du marché"
wrong_answers:
  - "Les conservateurs s'opposent à toute réglementation des armes à feu tandis que les libertariens acceptent un strict contrôle gouvernemental au nom de la sécurité publique"
  - "Les conservateurs veulent interdire entièrement les armes à feu tandis que les libertariens soutiennent un accès sans restriction à toutes les armes"
  - "Les conservateurs fondent leur position sur les droits individuels tandis que les libertariens fondent la leur sur la responsabilité collective"
explanation: >-
  Les conservateurs et les libertariens s'accordent sur le fait qu'une certaine forme de réglementation du port d'armes est nécessaire. La différence cruciale tient à qui établit ces règles. Les conservateurs insistent pour que les réglementations émanent d'une autorité publique chargée de préserver le bien commun (de haut en bas). Les libertariens soutiennent que la réglementation devrait émerger des personnes directement concernées : professionnels de la sécurité, associations de citoyens et concurrence du marché (de bas en haut).
