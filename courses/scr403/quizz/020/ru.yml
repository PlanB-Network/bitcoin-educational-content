question: "Какие два побочных эффекта используются в Simplicity для приложений Bitcoin и Liquid?"
answer: "Эффект Failure (исключение типа 1) и эффект Reader (доступ к данным окружения транзакции)."
wrong_answers:
  - "Эффект State (изменяемые переменные) и эффект Writer (запись в журнал транзакции)."
  - "Эффект IO (сетевое взаимодействие) и эффект Memory (динамическое выделение памяти)."
  - "Эффект Continuation (обратные вызовы) и эффект Nondeterminism (множественные пути выполнения)."
explanation: >-
  Simplicity использует ровно два побочных эффекта для блокчейн-приложений.
  Эффект Failure позволяет вычислениям прерываться (например, при
  неудачной проверке подписи), а эффект Reader позволяет выражениям
  читать данные из окружения транзакции. Базовые комбинаторы остаются
  чистыми — побочные эффекты вносятся через джеты.
reviewed: true
