question: "Mida näitab Mussolini 1920. aasta avaldus „Kõik riigis, mitte midagi väljaspool riiki, mitte midagi riigi vastu“ totalitarismi kohta?"
answer: "Avaliku ja privaatse ruumi vahel ei ole enam mingit eraldust, sest riik neelab ühiskonna täielikult endasse"
wrong_answers:
  - "Riik keskendub eranditult sõjalisele võimule, jättes majanduse eraettevõtlusele"
  - "Kodanikud võivad vabalt eraviisiliselt organiseeruda, kuni nad valitsust avalikult ei kritiseeri"
  - "Valitsus kontrollib ainult poliitilist tegevust, samal ajal kui kultuuriline ja religioosne elu jäävad autonoomseks"
explanation: >-
  Mussolini avaldus tabab totalitarismi olemust: totaalsust. Kõik neelatakse riiki, mis tähendab, et avaliku ja privaatse ruumi vahel ei ole mingit eraldust. Ühiskond kaotab igasuguse autonoomia, kuni kõige argisemate tegevusteni nagu spordiklubi avamine. See läheb palju kaugemale üksnes sõjalise, poliitilise või majandusliku sfääri kontrollimisest.
