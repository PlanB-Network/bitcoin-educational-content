question: De ce se poate spune că filosofii Iluminismului au avut un rol contrastant în dezvoltarea economiei politice?
answer: Au fost în același timp sărbătoriți și condamnați pentru principiile lor
wrong_answers:
  - S-au interesat de această știință abia foarte târziu, în viața lor
  - Unii sunt clar economiști, alții sunt adversarii acestora
  - Erau prea teoretici și nu suficient de practici
explanation: |
  Filosofii Iluminismului au avut păreri diverse despre economia politică, atât favorabile, cât și critice. Unii au apărat principiile liberalismului economic, în timp ce alții au avertizat asupra pericolelor inegalității și exploatării.
