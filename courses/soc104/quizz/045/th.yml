question: "คำว่า 'holism' หมายถึงอะไรในบริบทของปรัชญาสังคมนิยม?"
answer: "วิสัยทัศน์ที่มองสังคมเป็นทั้งมวลที่แบ่งแยกไม่ได้ ซึ่งส่วนรวมมีความเป็นอันดับแรกเหนือปัจเจกบุคคล"
wrong_answers:
  - "ปรัชญาที่มองปัจเจกบุคคลแต่ละคนเป็นหน่วยที่สมบูรณ์ในตัวเอง ซึ่งสิทธิของเขาไม่อาจถูกกลุ่มใดลบล้างได้"
  - "ทฤษฎีเศรษฐกิจที่สนับสนุนการสร้างสมดุลระหว่างภาครัฐกับภาคเอกชนในสัดส่วนเท่ากัน"
  - "ยุทธศาสตร์ทางการเมืองที่ผนวกมุมมองของชนกลุ่มน้อยทั้งหมดเข้าเป็นแพลตฟอร์มเดียวบนฐานฉันทามติ"
explanation: >-
  Holism มาจากภาษากรีก 'holos' หมายถึง 'ทั้งหมด' ในความคิดสังคมนิยม มันหมายถึงวิสัยทัศน์ที่มองสังคมเป็นทั้งมวลที่แบ่งแยกไม่ได้ ไม่ใช่ผลรวมง่าย ๆ ของปัจเจกบุคคล รัฐสังคมนิยมมุ่งรับผิดชอบและชี้นำกิจกรรมมนุษย์ให้มากที่สุด ส่วนรวมนี้อาจถูกแทนด้วยชนชั้นทางสังคม ชาติ เชื้อชาติ หรือเพศสภาวะ แต่ในแต่ละกรณี ปัจเจกบุคคลถูกกำหนดโดยการเป็นสมาชิกของกลุ่ม
reviewed: false
