question: Quels sont les moyens utilisés par les rois pour affirmer leur souveraineté face à l'Église ?
answer: Le développement d'un appareil d'État centralisé et puissant.
wrong_answers:
  - La création de leurs propres systèmes juridiques et fiscaux.
  - L'adoption de religions non chrétiennes pour saper l'autorité papale.
  - La levée d'armées et la conduite de guerres contre l'Église.
explanation: |
  Les rois ont principalement affirmé leur souveraineté face à l'Église en développant un appareil d'État centralisé, établissant des structures de pouvoir indépendantes capables de rivaliser avec l'autorité ecclésiastique et de réduire l'influence de l'Église sur la gouvernance.
reviewed: true
