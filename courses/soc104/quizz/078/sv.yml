question: "Hur skiljer sig den libertarianska uppfattningen om frihet från den centristiska uppfattningen?"
answer: "Libertarianer behandlar frihet som ett ovillkorligt axiom, medan centrister försvarar friheter opportunistiskt beroende på sammanhang och effektivitet"
wrong_answers:
  - "Libertarianer tillåter staten att skydda frihet selektivt, medan centrister avvisar varje statlig inblandning i skyddet av individuella rättigheter"
  - "Libertarianer fokuserar frihet enbart på ekonomiska frågor, medan centrister tillämpar frihet brett över sociala och kulturella områden"
  - "Libertarianer och centrister delar samma syn på frihet men är oense om hur stor stat som krävs för att upprätthålla den"
explanation: >-
  Libertarianer definierar frihet som en allmän, ovillkorlig princip som fungerar som ett axiom. Centrister försvarar däremot vissa friheter på ett opportunistiskt och kontextuellt sätt utan att tillämpa någon allmän princip. Det centristiska angreppssättet visar en instrumentell uppfattning om frihet, alltid underordnad pragmatiska mål som effektivitet, vilket libertarianer i grunden avvisar.
