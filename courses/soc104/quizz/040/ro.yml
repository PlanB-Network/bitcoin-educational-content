question: "Cum tratează socialismul libertățile în mod diferit în sferele societală și economică?"
answer: "Socialismul favorizează libertăți puternice în sfera societală, dar libertăți slabe în sfera economică"
wrong_answers:
  - "Socialismul restrânge toate libertățile în mod egal în ambele sfere, societală și economică"
  - "Socialismul favorizează libertăți economice puternice, dar restrânge libertățile societale pentru a menține ordinea socială"
  - "Socialismul acordă libertăți nelimitate în ambele sfere și se bazează pe cooperare voluntară pentru a menține echilibrul"
explanation: >-
  În gândirea socialistă, există o dihotomie fundamentală între libertățile societale și cele economice. Libertățile societale sunt puternice, dar libertățile economice sunt slabe din cauza accentului pus pe controlul statului, planificare și redistribuirea bogăției. Al treilea răspuns greșit descrie idealul libertarian, în timp ce al doilea descrie tiparul conservator, care este imaginea în oglindă a socialismului.
