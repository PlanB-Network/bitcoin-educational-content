question: "Jak konserwatyzm traktuje wolności w sferze gospodarczej i społecznej?"
answer: "Silne wolności w sferze gospodarczej, lecz słabe wolności w sferze społecznej"
wrong_answers:
  - "Słabe wolności zarówno w sferze gospodarczej, jak i społecznej, aby utrzymać tradycyjny porządek społeczny"
  - "Silne wolności w sferze społecznej, lecz słabe wolności w sferze gospodarczej"
  - "Równe i nieograniczone wolności w obu sferach przy minimalnej interwencji rządu jakiegokolwiek rodzaju"
explanation: >-
  Konserwatyzm wykazuje dychotomię będącą lustrzanym odbiciem socjalizmu. W domenie gospodarczej konserwatyści bronią wolnego rynku, przedsiębiorczości i własności prywatnej. W domenie społecznej ograniczenia uzasadnia się ochroną tradycyjnych norm moralnych i stabilności społecznej. Trzecia błędna odpowiedź opisuje wzorzec socjalistyczny, który jest przeciwieństwem.
