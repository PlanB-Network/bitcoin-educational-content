question: "Hva identifiserer kurset som det egentlige politiske skillet, bortenfor det tradisjonelle venstre-høyre-sentrum-spekteret?"
answer: "Skillet mellom grunnleggende filosofiske prinsipper: frihet eller tvang, frivillig samtykke eller påbud, det ansvarlige individet eller kollektivet"
wrong_answers:
  - "Skillet mellom rike og fattige nasjoner om kontroll over internasjonale handelsavtaler og globale finansinstitusjoner"
  - "Skillet mellom urbane og rurale befolkninger om prioriteringer for offentlige utgifter og infrastrukturinvesteringer"
  - "Skillet mellom progressive og tradisjonelle kulturer om sosiale normer, familieverdier og religiøs utdanning"
explanation: >-
  Kurset argumenterer for at det egentlige politiske skillet ikke ligger i de tradisjonelle merkelappene venstre, høyre og sentrum, men i grunnleggende filosofiske prinsipper: frihet eller tvang, frivillig samtykke eller påbud, det ansvarlige individet eller kollektivet. Den riktige måten å tenke om politikk på er å starte fra etiske prinsipper snarere enn merkelapper.
reviewed: false
