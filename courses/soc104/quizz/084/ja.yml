question: "Mises は、個人主義を自給自足や人間嫌いと混同すべきではないと強調するのはなぜか？"
answer: "個人主義は、参加者の自由な同意に基づく限り、協力と結社を促進し、人間は他者との自発的関係を通じて自らの潜在能力を完全に発展させると認めるから"
wrong_answers:
  - "個人主義は、人々が共通善に貢献することを保証するために、義務的な市民組織に参加することを要求するから"
  - "個人主義は、各人が自分で提供できないサービスについて国家に完全に依存しなければならないことを意味するから"
  - "個人主義は、人々があらゆる領域で互いに競争し、自分の個人的優越性を証明することを要求するから"
explanation: >-
  Mises は、人間が社会的な存在であることを強調する。個人主義は孤立を意味しない。それは、参加者の自由な同意に基づくという条件のもとで、協力と結社を促進する。人間は他者との関係の中でのみ自らの潜在能力を完全に発展させることができるが、その協力は集合的権威によって押しつけられるのではなく、自発的でなければならない。
reviewed: false
