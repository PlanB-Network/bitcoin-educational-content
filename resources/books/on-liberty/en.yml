title: "On Liberty"

publication_year: 1859

cover: cover_en.webp

original: true

description: |
  Mill's foundational essay on individual freedom articulates the "harm principle": the only legitimate reason for society to exercise power over an individual is to prevent harm to others. The work defends freedom of thought, expression, and lifestyle against both government tyranny and the "tyranny of the majority." Mill argues that political and economic freedom are inseparable, and that a society which suppresses individuality stagnates.
