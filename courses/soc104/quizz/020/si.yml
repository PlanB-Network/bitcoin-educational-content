question: "United States හි classical liberals 1960 දශකයෙන් පසුව තමන්ව 'libertarians' ලෙස හැඳින්වීමට පටන් ගත්තේ ඇයි?"
answer: "අර්ථය state interventionism දෙසට මාරු වී තිබූ American liberals ගෙන් තමන් වෙන් කර දැක්වීමට"
wrong_answers:
  - "Democratic Party සහ එහි progressive social programs සමඟ තමන් පෙළගැස්වීමට"
  - "Lyndon B. Johnson ගේ Great Society reforms සඳහා තම සහයෝගය සංඥා කිරීමට"
  - "European socialist movements මගින් ප්‍රේරණය වූ වඩාත් radical revolutionary identity එකක් භාර ගැනීමට"
explanation: >-
  United States හි, 'liberal' යන වචනය Big Government සහ state intervention සඳහා සහාය දක්වන අය අදහස් කිරීමට මාරු විය, විශේෂයෙන් New Deal සහ Great Society න් පසුව. Classical liberals තම දර්ශනයේ මුල් අර්ථය රැක ගැනීමට 'libertarian' ලේබලය භාර ගත්තේය. ඔවුන් American liberals ගෙන් තමන් ඈත් කරගනිමින් සිටියා මිස ඔවුන් සමඟ පෙළගැස්වෙමින් නොසිටියේය.
reviewed: false
