question: "หลักสูตรนี้โต้แย้งอย่างไรว่าเสรีภาพเปิดให้ค่านิยมฝ่ายซ้ายและฝ่ายขวาอยู่ร่วมกันอย่างสันติได้?"
answer: "ในระบอบเสรีภาพที่แท้จริง ผู้ที่มีอุดมคติฝ่ายซ้ายสามารถแบ่งปันทรัพย์สินและกระจายเงินทุนใหม่ได้โดยสมัครใจ ขณะที่ผู้มีค่านิยมฝ่ายขวาสามารถออมและส่งต่อจารีตได้ โดยไม่มีฝ่ายใดบังคับวิถีชีวิตของตนต่ออีกฝ่าย"
wrong_answers:
  - "เสรีภาพกำหนดให้ทั้งสองฝ่ายประนีประนอมด้วยการยอมรับจุดยืนสายกลางที่รัฐบาลถ่วงดุลค่านิยมที่แข่งขันกันผ่านกฎระเบียบระดับปานกลาง"
  - "เสรีภาพหมายความว่าชุมชนฝ่ายซ้ายและฝ่ายขวาต้องอยู่ในเขตภูมิศาสตร์แยกกันพร้อมรัฐบาลอิสระของตนเอง"
  - "เสรีภาพทำงานโดยเปิดให้พลเมืองลงคะแนนว่าค่านิยมใดควรถูกบังคับใช้ในแต่ละภูมิภาค โดยสลับนโยบายฝ่ายซ้ายและฝ่ายขวาทุกวัฏจักรการเลือกตั้ง"
explanation: >-
  หลักสูตรแสดงให้เห็นว่าในระบอบเสรีภาพที่แท้จริง ผู้ที่ยึดถืออุดมคติฝ่ายซ้ายสามารถสละทรัพย์สิน แบ่งปันปัจจัยการผลิต หรือบริจาคค่าจ้างให้แก่องค์กรเพื่อการกระจายทรัพยากรใหม่ได้โดยสมัครใจ ผู้ที่มีค่านิยมฝ่ายขวาสามารถทำงานหนัก ออม และส่งต่อคุณค่าครอบครัวได้ ไม่มีใครควรบังคับวิถีชีวิตของตนต่อผู้อื่น เป้าหมายสามารถบรรลุได้อย่างสันติผ่านเสรีภาพของตลาดและพลังแห่งการเลือก
reviewed: false
