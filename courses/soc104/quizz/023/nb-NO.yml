question: "Hvordan håndterer en kulturelt konservativ libertarianer atferd de moralsk misliker?"
answer: "De motsetter seg og fraråder slik atferd gjennom overtalelse og eksempel, men uten å ty til lovens tvangskraft"
wrong_answers:
  - "De støtter forbud fra lokale myndigheter mot slik atferd, samtidig som de motsetter seg forbud på føderalt nivå"
  - "De forholder seg helt tause om slik atferd, fordi de mener at enhver form for misbilligelse krenker individuell frihet"
  - "De tar til orde for samfunnstribunaler som kan straffe slik atferd utenfor det formelle rettssystemet"
explanation: >-
  Den kulturelt konservative libertarianeren kan moralsk mislike visse former for atferd, men tar ikke til orde for juridisk forbud mot frivillige, ikke-aggressive handlinger. De kan mislike slike handlinger, motsette seg dem og aktivt fraråde dem, men alltid gjennom overtalelse, utdanning og eksempel snarere enn gjennom lovens tvangskraft. Dette handler ikke om å forholde seg taus eller å skape alternative håndhevingsmekanismer.
reviewed: false
