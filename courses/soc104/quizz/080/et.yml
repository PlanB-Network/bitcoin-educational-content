question: "Mis on konstruktivism jagatud poliitilise veendumusena?"
answer: "Uskumus, et keskvalitsus saab seaduse jõuga luua ühiskondliku korra, mis on hea võimalikult paljudele"
wrong_answers:
  - "Uskumus, et ühiskond peaks olema korraldatud indiviidide vabatahtliku koostöö kaudu ilma riigi sekkumiseta"
  - "Uskumus, et ainult vabad turud saavad määrata ressursside optimaalse jaotuse ühiskonnas"
  - "Uskumus, et poliitiline võim peaks otsedemokraatia kaudu olema võrdselt jaotatud kõigi kodanike vahel"
explanation: >-
  Konstruktivism ühendab tsentriste, konservatiive ja sotsialiste jagatud veendumuse ümber: poliitilise protsessi ülimuslikkus turuprotsessi ees. See on uskumus, et keskvalitsus saab seaduse jõuga luua ühiskondliku korra, mis on hea võimalikult paljudele. See seisab otseses vastanduses libertaarsele kaitsele spontaanse korra eest, mis tekib vabatahtlikest vastastikmõjudest.
