question: Ni igiki gisabwa kugira ngo nodeikingirwe igihe umuriro ugiye?
answer: Inverter
wrong_answers:
  - Ikarata ya kabiri y'ibishushanyo
  - Iyindi router
  - Igikoresho ca USB
explanation: |
  Inverter irabuza guhagarara bukwi na bukwi iyo umuriro wacitse kandi igakingira ukudahungabana kw’iyo node.
reviewed: true
