question: "Apa definisi statisme sebagaimana disajikan dalam kerangka Nolan?"
answer: "Menggunakan legislasi untuk mengontrol dan membentuk masyarakat, baik atas nama pembelaan peradaban, kelas pekerja, alam, maupun kaum tertindas"
wrong_answers:
  - "Sistem pemerintahan di mana pejabat terpilih menjabat untuk masa jabatan tetap dan transisi kekuasaan terjadi melalui pemilihan demokratis"
  - "Keyakinan bahwa hanya militer yang kuat yang dapat melindungi kedaulatan dan keutuhan wilayah suatu bangsa"
  - "Filsafat ekonomi yang memprioritaskan industri nasional di atas persaingan asing melalui tarif dan kuota"
explanation: >-
  Statisme didefinisikan sebagai penggunaan legislasi untuk mengontrol dan membentuk masyarakat. Baik kiri maupun kanan mempraktikkannya: sebagian atas nama pembelaan peradaban, sebagian lainnya atas nama pembelaan kelas pekerja, alam, atau kaum tertindas. Bahkan kaum sentris menyetujuinya ketika itu sesuai dengan kepentingan mereka. Statisme tidak terbatas pada kebijakan militer, proteksionisme perdagangan, atau sekadar memiliki pemerintahan terpilih.
reviewed: false
