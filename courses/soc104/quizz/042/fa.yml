question: "رویکرد ساختاری تفاوت بنیادین میان سوسیالیسم و لیبرترینیسم را چگونه تعریف می‌کند؟"
answer: "سوسیالیسم از راه مقررات‌گذاری، برنامه‌ریزی و کنترل به دولت تقدم می‌دهد، در حالی که لیبرترینیسم از راه حداقل مداخله دولت به فرد تقدم می‌دهد"
wrong_answers:
  - "سوسیالیسم جوامع کشاورزی روستایی را در اولویت می‌گذارد، در حالی که لیبرترینیسم توسعه صنعتی شهری را ترجیح می‌دهد"
  - "سوسیالیسم با حمایت از انتخابات دموکراتیک تعریف می‌شود، در حالی که لیبرترینیسم همه شکل‌های مشارکت سیاسی را رد می‌کند"
  - "سوسیالیسم بر سیاست خارجی و همکاری بین‌المللی تمرکز دارد، در حالی که لیبرترینیسم فقط به مسائل اقتصادی داخلی می‌پردازد"
explanation: >-
  از نظر ساختاری، سوسیالیسم با حضور همه‌جانبه دولت مشخص می‌شود؛ دولتی که مقررات‌گذاری، برنامه‌ریزی و کنترل می‌کند. لیبرترینیسم با حداقل مداخله دولت در اقتصاد و زندگی خصوصی تعریف می‌شود و به سوی تقدم آزادی فردی و بازار آزاد گرایش دارد. این تمایز ساختاری از مقایسه نیت‌های اعلام‌شده هر نظام برای تحلیل بسیار سودمندتر است.
reviewed: false
