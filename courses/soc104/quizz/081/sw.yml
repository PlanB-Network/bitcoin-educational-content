question: "Constructivism ni nini kama imani ya kisiasa inayoshirikiwa?"
answer: "Imani kwamba serikali ya kati inaweza kuunda, kwa nguvu ya sheria, utaratibu wa kijamii ulio mzuri kwa idadi kubwa zaidi ya watu"
wrong_answers:
  - "Imani kwamba jamii inapaswa kupangwa kupitia ushirikiano wa hiari kati ya watu binafsi bila kuingiliwa na dola"
  - "Imani kwamba ni masoko huru pekee yanaweza kuamua mgawanyo bora wa rasilimali katika jamii"
  - "Imani kwamba mamlaka ya kisiasa inapaswa kugawanywa kwa usawa miongoni mwa raia wote kupitia demokrasia ya moja kwa moja"
explanation: >-
  Constructivism huwaunganisha watu wa msimamo wa kati, wahafidhina, na wanasoshalisti karibu na imani ya pamoja: ubora wa mchakato wa kisiasa kuliko mchakato wa soko. Ni imani kwamba serikali ya kati inaweza kuunda, kwa nguvu ya sheria, utaratibu wa kijamii ulio mzuri kwa idadi kubwa zaidi ya watu. Hili linasimama katika upinzani wa moja kwa moja dhidi ya utetezi wa kilibertari wa utaratibu unaojitokeza wenyewe kutokana na mwingiliano wa hiari.
