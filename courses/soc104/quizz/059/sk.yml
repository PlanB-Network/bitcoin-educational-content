question: "Aký skrytý paradox sa nachádza v centristickom pragmatizme?"
answer: "Samotný pragmatizmus spočíva na určitej forme dogmatizmu, konkrétne na nevyslovenom presvedčení, že iba experti sú kompetentní riadiť spoločnosť"
wrong_answers:
  - "Centristi tvrdia, že sú umiernení, ale v koaličných vládach sa dôsledne spájajú s ľavicovými stranami"
  - "Centristické politiky pôsobia vyvážene, ale vždy uprednostňujú ekonomický rast pred ochranou životného prostredia"
  - "Centristi odmietajú ideológiu, ale pri ekonomických rozhodnutiach prijímajú rigidné princípy voľného trhu"
explanation: >-
  Paradox centristického pragmatizmu spočíva v tom, že tvrdí, že odmieta ideológiu v prospech racionálnej odbornosti, no práve toto tvrdenie stojí na neviditeľnej a nevyslovenej dogme: že iba technokrati sú schopní robiť správne rozhodnutia. Toto presvedčenie, že spoločnosť majú riadiť iba experti, je samo osebe ideologickým záväzkom, aj keď ho centristi ako taký neuznávajú.
