question: "Liberteryenler vergilendirmeye neden karşı çıkar?"
answer: "Çünkü bu, mülkiyet haklarının ahlaki bir ihlalidir; rıza olmadan başkasının mülküne el koyan bir devlet hırsızlığı biçimidir"
wrong_answers:
  - "Çünkü vergiler ekonomik açıdan verimsizdir ve her zaman daha yüksek işsizlik oranlarına yol açar"
  - "Çünkü vergilendirme yabancı yatırımı caydırır ve bir ülkenin rekabetçi konumunu zayıflatır"
  - "Çünkü artan oranlı vergi sistemleri, en çok işi yaratan varlıklı bireyleri adaletsiz biçimde hedef alır"
explanation: >-
  Liberteryenlerin vergilendirmeye itirazı ekonomik olmadan önce ahlakidir. Liberteryenler vergilendirmeyi bir devlet hırsızlığı biçimi ve özel mülkiyetin önünde bir engel olarak görür; çünkü vergilendirme, rıza olmadan başkasının mülküne el koymaktan ibarettir. Vergilendirmeye karşı ekonomik argümanlar olabilir, ancak temel liberteryen argüman, verimlilik veya rekabet gücü hesaplarına değil, mülkiyet haklarını ihlal ettiği ilkesine dayanır.
