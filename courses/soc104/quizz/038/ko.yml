question: "Murray Rothbard가 이론화한 비공격 원칙은 무엇인가요?"
answer: "다른 개인이나 그 재산에 대해 물리적 힘을 먼저 행사하는 것은 부당하지만, 방어적 폭력은 허용된다는 원칙입니다"
wrong_answers:
  - "자기방어와 억압에 대한 저항을 포함해 모든 형태의 폭력은 언제나 잘못이라는 원칙입니다"
  - "폭력이 억압적 제도를 향할 때는 허용되지만 다른 개인을 향해서는 절대 안 된다는 원칙입니다"
  - "국가만이 힘을 사용할 정당한 권리를 가지며, 개인은 결코 폭력에 의존해서는 안 된다는 원칙입니다"
explanation: >-
  Rothbard의 비공격 원칙은 다른 사람이나 그 재산에 대해 물리적 힘을 먼저 행사하는 것이 부당하다고 봅니다. 이는 황금률의 철학적 번역입니다. 그러나 모든 폭력을 금지하지는 않습니다. 자기방어와 억압에 대한 저항을 포함한 방어적 폭력은 정당한 것으로 간주됩니다. 이 점이 순수 평화주의 및 국가가 주장하는 폭력 독점과 구별됩니다.
reviewed: false
