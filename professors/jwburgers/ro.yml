bio: |
  Jan-Willem este activ în ecosistemul Bitcoin de peste zece ani. În prezent, predă diverse cursuri despre Bitcoin, inclusiv pentru University of the Andes, programul Cubo+ și platforma Discovering Bitcoin. De asemenea, co-organizează BitDevs Amsterdam și Amsterdam Bitcoin Meetup. Pe lângă activitățile sale legate de Bitcoin, Jan-Willem este partener la Great Stuff Ventures, un fond de investiții aflat la stadiu incipient.

short_bio: Expert în criptografie.
