question: SHA-256 compression becomes a jet, but the fold and map combinators cannot. What explains the asymmetry?
answer: A jet replaces one fixed expression; fold and map aren't single expressions but schemas, yielding a different one per inner function f.
wrong_answers:
  - Jets only accelerate straight-line code, so iterating combinators must be unrolled first and then match no jet.
  - Only expressions with a machine-checked Rocq proof qualify, which exists for SHA-256 but not the folds.
  - Folds over short vectors are too cheap to benefit, so jets are reserved for costly crypto operations.
explanation: >-
  A jet is a native replacement for one specific, fully-formed Simplicity
  expression, which nodes can substitute while preserving its exact
  semantics. fold-right-n, map, zip and their variants are not single
  expressions but construction schemes: each choice of the inner function
  f yields a structurally different expression, so no single jet can stand
  in for the whole family. That is why these iteration patterns appear as
  genuine combinator code in real programs, typically generated by higher-
  level languages like SimplicityHL.
