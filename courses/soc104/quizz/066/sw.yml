question: "Msimamo wa kihafidhina kuhusu uhamiaji ni upi?"
answer: "Dola ina haki ya mamlaka kuu kudhibiti mipaka yake ili kulinda usalama wa taifa na utambulisho wa kitamaduni"
wrong_answers:
  - "Mipaka inapaswa kuwa wazi bila masharti kwa sababu vikwazo vya kibaguzi vinakiuka haki za binadamu"
  - "Uhamiaji unapaswa kuamuliwa na mahitaji ya soko, huku raia wakiamua kimkataba mahusiano yao na wageni"
  - "Sera ya uhamiaji inapaswa kusawazisha mahitaji ya kiuchumi na ujumuishaji uliofanikiwa kulingana na tathmini ya wataalamu"
explanation: >-
  Wahafidhina hushikilia kwamba utaratibu, utambulisho, na mamlaka ya kitaifa lazima yapewe kipaumbele kuliko kukaribisha bila mipaka wageni au wakimbizi. Mipaka na idadi ya watu iliyofafanuliwa vizuri ni sehemu ya maadili ya ustaarabu. Majibu yasiyo sahihi yanawakilisha msimamo wa kijamaa (mipaka wazi kama haki za binadamu), msimamo wa kilibertaria (uhamiaji unaotegemea soko), na msimamo wa kati (mbinu yenye uwiano inayoongozwa na wataalamu).
