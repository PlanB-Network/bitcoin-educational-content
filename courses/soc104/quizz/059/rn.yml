question: "Ni nde akunda kuvugwa nk'umuntu yatanguje conservatism ya kijambere?"
answer: "Edmund Burke, yarwaniye ukuzigama inzego n'imigenzo imbere y'impinduka zikomeye za French Revolution"
wrong_answers:
  - "Karl Marx, yateje imbere inyigisho y'intambara y'imigwi n'ivyiyumviro vy'uko kahise gashingiye ku bintu bifatika mu kinjana ca nineteenth century"
  - "John Locke, yasobanuye inyigisho y'uburenganzira kavukire n'amasezerano y'imibano mu kinjana ca seventeenth century"
  - "Adam Smith, yanditse The Wealth of Nations kandi atanguza icigwa ca classical economics"
explanation: >-
  Edmund Burke akunda kuvugwa nk'umuntu yatanguje conservatism kubera ukurwanya French Revolution. Igitabu ciwe Reflections on the Revolution in France (1790) cashigikiye ukwiyubara n'ivugurura rya buhorobuhoro aho gushigikira impinduka zikomeye. Yemera ko ikibano gikwiye gutera imbere atari mu guhanagura vyose ngo gitangure bundi busha, ahubwo biciye mu mavugurura y'intambwe ku yindi azigama inzego n'imigenzo vyageragejwe.
