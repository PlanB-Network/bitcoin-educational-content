question: "Šta razlikuje neokonzervativce od paleokonzervativaca u njihovom pristupu spoljnoj politici?"
answer: "Neokonzervativci opravdavaju vojni intervencionizam radi širenja demokratije, dok paleokonzervativci brane spoljnu politiku skloniju izolacionizmu"
wrong_answers:
  - "Neokonzervativci se protive svakoj vojnoj akciji i daju prednost diplomatiji, dok paleokonzervativci podržavaju preventivne udare protiv potencijalnih pretnji"
  - "Neokonzervativci se usredsređuju isključivo na ekonomske sankcije, dok paleokonzervativci zagovaraju izgradnju međunarodnih koalicija za zajedničke vojne operacije"
  - "Neokonzervativci i paleokonzervativci se slažu oko spoljne politike, ali se oštro razlikuju oko domaće ekonomske regulacije"
explanation: >-
  Od 2000-ih nadalje, neokonzervativci su se sve više uključivali u opravdavanje vojnog intervencionizma radi usađivanja demokratije širom sveta, naročito posle 11. septembra 2001. Kao reakciju na to, tradicionalni konzervativci prisvojili su oznaku 'paleokonzervativac' kako bi se razlikovali. Paleokonzervativci kritikuju vojni intervencionizam, brane spoljnu politiku skloniju izolacionizmu i stavljaju veći naglasak na nacionalni i kulturni identitet.
