question: Când a propus Vauban pentru prima dată o reformă fiscală?
answer: 1695
wrong_answers:
  - 1693
  - 1697
  - 1700
explanation: |
  Vauban, mareșal al Franței și inginer militar, a propus o reformă fiscală în 1695, cunoscută sub numele de „Dîme Royale”. Această propunere urmărea simplificarea sistemului fiscal și distribuirea mai echitabilă a poverii fiscale.
