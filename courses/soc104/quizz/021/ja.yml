question: "フリードリヒ・ハイエクが述べた「自生的秩序」の概念とは何か？"
answer: "社会の規則や規範は、権威主義的な計画によって押し付けられるのではなく、自由な個人間の相互作用から生まれるべきだという考え"
wrong_answers:
  - "国家が競争的均衡を維持するために介入しない限り、市場は自然に独占へ向かうという考え"
  - "民主的選挙こそが、社会を統治する法律を確立する唯一正当な仕組みであるという考え"
  - "経済危機は自発的に発生し、安定を回復するには即時の政府介入が必要であるという考え"
explanation: >-
  ハイエクの自生的秩序の概念は、社会を統治する規則は中央計画によって上から押し付けられるべきではなく、個人の意思、契約、自発的関係の自由な働きから生まれるべきだとするものである。
  これはリバタリアン思想の根本的な軸である。
  それは、市場が独占へ向かう傾向があることや、危機には政府介入が必要であることを意味しない。
reviewed: false
