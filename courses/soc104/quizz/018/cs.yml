question: "Jaký společný politický cíl mají levicoví a pravicoví etatisté?"
answer: "Získat moc, aby mohli organizovat společnost podle své vize světa a vnutit ji všem"
wrong_answers:
  - "Zmenšit rozsah vlády a vrátit rozhodovací moc jednotlivým občanům"
  - "Zavést přímou demokracii, v níž každý občan hlasuje o každém legislativním rozhodnutí"
  - "Odstranit politické strany a nahradit je nezávislou technokratickou správou"
explanation: >-
  Levicoví i pravicoví etatisté sdílejí stejný politický cíl: získat moc, aby mohli organizovat společnost podle svého pohledu na svět a vnutit ji všem prostřednictvím zákonodárství. Rozdíl je pouze v jejich hodnotách: pravice se dovolává obrany civilizace, zatímco levice se dovolává obrany dělnické třídy nebo utlačovaných. Ani jedna strana neusiluje o omezení vlády nebo odstranění stran.
