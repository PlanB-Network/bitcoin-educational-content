question: Ni ikihe kigo cashinzwe mu 1998 kugira ngo giteze imbere ijambo open source?
answer: Open Source Initiative (OSI)
wrong_answers:
  - Ishirahamwe rya porogarame z’ubuntu (FSF)
  - Umugambi wa Debian
  - Ishirahamwe rya Mozilla
explanation: |
  OSI yaremewe gushimika ku bijanye, n’ubuhinga bwo kwugururira kode bose, nk’uko bitandukanye n’ubuhinga bwa porogarama z’ubuntu.
reviewed: true
