question: "ยุทธศาสตร์ในการยกเลิกรัฐของกลุ่ม libertaires และลิเบอร์ทาเรียนแตกต่างกันอย่างไร?"
answer: "กลุ่ม libertaires ในประวัติศาสตร์สนับสนุนการทำลายด้วยความรุนแรง ขณะที่ลิเบอร์ทาเรียนมุ่งทำให้รัฐสูญเสียความชอบธรรมผ่านการศึกษาและการขัดขืนทางแพ่ง"
wrong_answers:
  - "กลุ่ม libertaires ใช้การเลือกตั้งประชาธิปไตยเพื่อรื้อรัฐ ขณะที่ลิเบอร์ทาเรียนสนับสนุนการปฏิวัติติดอาวุธและการลงมือโดยตรง"
  - "กลุ่ม libertaires มุ่งสร้างชุมชนทางเลือก ขณะที่ลิเบอร์ทาเรียนทำงานภายในระบบการเมืองเดิมเพื่อผ่านการปฏิรูป"
  - "ทั้งกลุ่ม libertaires และลิเบอร์ทาเรียนเห็นพ้องกันว่าการประท้วงอย่างสันติเป็นวิธีเดียวที่ชอบธรรมของการเปลี่ยนแปลงสังคม"
explanation: >-
  กลุ่ม libertaires ในประวัติศาสตร์สนับสนุนการทำลายรัฐและทุนนิยมด้วยความรุนแรง รวมถึงความหวาดกลัวและการโจมตีแบบกำหนดเป้าหมาย ในทางตรงกันข้าม ลิเบอร์ทาเรียนปฏิเสธความรุนแรงเชิงรุกรานว่าไม่ชอบธรรม ยุทธศาสตร์ของพวกเขาตั้งอยู่บนการทำให้รัฐสูญเสียความชอบธรรมผ่านการให้เหตุผล การถกเถียง การศึกษา และการขัดขืนทางแพ่ง แนวทางต่อการเปลี่ยนแปลงที่แตกต่างกันอย่างรากฐานเหล่านี้สะท้อนความไม่เห็นพ้องทางปรัชญาที่ลึกกว่าของพวกเขา
reviewed: false
