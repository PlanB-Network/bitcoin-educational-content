question: Ktorej z týchto udalostí sa Dupont de Nemours zúčastnil počas Francúzskej revolúcie?
answer: Ústavodarné zhromaždenie a spisovanie "cahiers de doléances"
wrong_answers:
  - Spisovanie cahiers de doléances a útok na Bastilu
  - Útok na Bastilu a Ústavodarné zhromaždenie
  - Kráľov útek a Ústavodarné zhromaždenie
explanation: |
  Dupont de Nemours sa zúčastnil Ústavodarného zhromaždenia a spisovania cahiers de doléances a zohral dôležitú úlohu v prvých dňoch Francúzskej revolúcie.
