question: "چرا اثر Failure در Simplicity جابجایی‌پذیر است، با اینکه استثناها عموماً جابجایی‌پذیر نیستند؟"
answer: چون نوع استثنا unit (1) است و فقط یک مقدار دارد، پس ترتیب پرتاب شدن اهمیتی ندارد.
wrong_answers:
  - چون Simplicity همه عبارت‌ها را به ترتیبی قطعی که توسط درخت ترکیب‌گر تعریف شده اجرا می‌کند.
  - چون اثر Failure همیشه توسط ترکیب‌گر case گرفته می‌شود و سپس دوباره پرتاب می‌شود.
  - چون Simplicity از تأیید دسته‌ای استفاده می‌کند، که همه استثناهای پرتاب‌شده را معادل می‌سازد.
explanation: >-
  به‌طور کلی، استثناها جابجایی‌پذیر نیستند، زیرا عبارت‌های مختلف ممکن است مقادیر
  استثنای متفاوتی پرتاب کنند. با این حال، Simplicity استثناها را به نوع unit محدود می‌کند (فقط یک مقدار ممکن)،
  بنابراین جابه‌جا کردن ترتیب دو عبارت بالقوه ناموفق، فارغ از اینکه
  کدام‌یک واقعاً شکست می‌خورد، همان استثنا را تولید می‌کند. این خاصیت جابجایی‌پذیری بهینه‌سازی‌های مهم برنامه را ممکن می‌سازد.
reviewed: true
