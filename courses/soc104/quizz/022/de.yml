question: "Was ist kultureller Konservatismus?"
answer: "Ein persönliches Festhalten an familiären, moralischen, ästhetischen und metaphysischen Werten, die aus der Vergangenheit überliefert sind, keine politische Philosophie"
wrong_answers:
  - "Eine politische Ideologie, die Staatsmacht nutzt, um traditionelle Werte der gesamten Gesellschaft durch Gesetzgebung aufzuzwingen"
  - "Eine Bewegung, die alle Formen der Moderne ablehnt und die Gesellschaft zu einer vorindustriellen Lebensweise zurückführen will"
  - "Eine Wirtschaftslehre, die nationale Industrien schützt und freien Handel mit ausländischen Ländern ablehnt"
explanation: >-
  Kultureller Konservatismus wird als Lebensweisheit definiert: das persönliche Festhalten an familiären, moralischen, ästhetischen und metaphysischen Werten, die aus der Vergangenheit überliefert sind, ob griechisch-römisch oder jüdisch-christlich. Er ist ausdrücklich keine politische Philosophie. Er unterscheidet sich vom politischen Konservatismus, der politische Institutionen und die gesellschaftliche Ordnung durch Staatsmacht bewahren will. Es geht dabei auch nicht um die Ablehnung der Moderne oder um wirtschaftlichen Protektionismus.
reviewed: false
