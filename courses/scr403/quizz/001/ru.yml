question: Что производит последовательная композиция при объединении операции f (A → B) с операцией g (B → C)?
answer: Единую составную операцию из A в C, где выход f подаётся на вход g.
wrong_answers:
  - Значение-пару, содержащее оба промежуточных результата типов B и C.
  - Условный оператор, который выбирает между f и g в зависимости от входных данных.
  - Две отдельные операции, которые выполняются независимо, не разделяя данные.
explanation: >-
  Последовательная композиция соединяет две операции друг за другом. Выход
  первой операции становится входом второй. В Simplicity это выражается
  комбинатором comp: comp f g сначала применяет f, а затем g к результату.
