question: "Wat plaatsen libertariërs centraal in hun politieke filosofie?"
answer: "Ethiek en recht"
wrong_answers:
  - "Economische groei en welvaartscreatie"
  - "Sociale gelijkheid en collectief welzijn"
  - "Nationale identiteit en cultureel behoud"
explanation: >-
  Libertariërs onderscheiden zich van alle andere politieke families door ethiek en recht centraal te plaatsen in hun filosofie, niet de economie. Wanneer zij de markteconomie verdedigen, is dat minder vanwege haar vermogen om welvaart te produceren dan vanwege haar bevordering van individuele vrijheid en verantwoordelijkheid. Economische groei is een secundair voordeel, niet het fundamentele principe.
reviewed: false
