question: În concepția marchizului d'Argenson, ce ar trebui să fie statul?
answer: Un stat minimal, trebuie să asigure securitatea, justiția, moneda și infrastructura
wrong_answers:
  - Un stat protector, care protejează comercianții și meșteșugarii
  - Statul nu are nicio legitimitate; nu trebuie să ofere niciun serviciu
  - Un stat intervenționist, care trebuie să reglementeze toate aspectele vieții economice
explanation: |
  Marchizul d'Argenson pleda pentru un stat minimal, limitat la funcțiile esențiale precum securitatea, justiția, moneda și infrastructura. El credea că statul trebuie să lase indivizii liberi să acționeze în sfera economică.
