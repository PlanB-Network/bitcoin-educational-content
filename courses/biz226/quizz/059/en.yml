question: "In Efrat's advanced brand identity framework, what is the distinction between your 'mission,' 'vision,' and 'essence'?"
answer: "Mission is why you do what you do, vision is your long-term northern star, and essence is the vehicle through which you bring your vision to life"
wrong_answers:
  - "Mission is your daily content schedule, vision is your five-year business plan, and essence is your visual design language"
  - "Mission is your target audience definition, vision is the market you want to dominate, and essence is your unique selling proposition"
  - "Mission is your professional biography, vision is your positioning statement, and essence is your tone of voice across platforms"
explanation: >-
  The chapter presents these as the deepest layer of brand identity work. Efrat's own mission is to shed light on hidden truths and help people become more self-sovereign. Her vision is a world where the next generation lives detached from state dependency. Her essence is her voice, the specific vehicle she uses to make that vision real. These three elements go beyond the five basic brand identity components into purpose-driven territory.
reviewed: false
