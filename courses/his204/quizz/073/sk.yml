question: Na čo sa Voltaire zameriava v diele L'Homme aux quarante écus?
answer: Daňová teória fyziokratov
wrong_answers:
  - Menová teória fyziokratov
  - Politická teória fyziokratov
  - Teória hodnoty fyziokratov
explanation: |
  Voltaire kritizuje daňovú teóriu fyziokratov v "L'Homme aux quarante écus", filozofickej poviedke, v ktorej sa vysmieva jedinej dani z pôdy, ktorú fyziokrati navrhovali.
