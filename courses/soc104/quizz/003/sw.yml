question: "Kwa nini mhimili wa kushoto-kulia unachukuliwa kuwa hautoshi kuwaweka wanafikra wa uliberali wa kilasiki kama Bastiat au Ron Paul?"
answer: "Kwa sababu uliberali wa kilasiki unathamini uhuru wa kiuchumi na wa binafsi, ambao si kushoto wala kulia kunaukumbatia kikamilifu"
wrong_answers:
  - "Kwa sababu waliberali wa kilasiki daima hujipanga na sera za kiuchumi za mrengo wa kulia na kukataa misimamo yote ya mrengo wa kushoto"
  - "Kwa sababu waliberali wa kilasiki ni masentrista wanaochukua matoleo ya wastani ya itikadi za kushoto na kulia"
  - "Kwa sababu waliberali wa kilasiki hupinga aina zote za serikali, jambo linalowafanya wawe waanarkia badala ya wanafikra wa kisiasa"
explanation: >-
  Mhimili wa kushoto-kulia unashindwa kuwaweka waliberali wa kilasiki kwa sababu hauwezi kukubali msimamo unaotetea kwa wakati mmoja uhuru wa kiuchumi (kwa kawaida kulia) na uhuru wa binafsi (kwa kawaida kushoto). Waliberali wa kilasiki si masentrista wanaotafuta maelewano, wala si waanarkia au watu wa mrengo wa kulia tu. Hawatoshei tu katika wigo wa mwelekeo mmoja.
reviewed: false
