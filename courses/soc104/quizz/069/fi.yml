question: "Mikä toistuva analyysikehys muovaa sosialistista kantaa kussakin viidessä yhteiskunnallisessa kiistassa (avioliitto, maahanmuutto, tuliaseet, huumeet, sokeripitoiset juomat)?"
answer: "Konfliktikehys hallitsevien ja alistettujen välillä, jossa yhteiskunta rakentuu sorron varaan ja valtion on puututtava tilanteeseen suojellakseen haavoittuvaa ryhmää"
wrong_answers:
  - "Utilitaristinen kehys, joka keskittyy kokonaisonnen ja taloudellisen tuottavuuden maksimointiin mahdollisimman suurelle kansalaismäärälle"
  - "Luonnollisten oikeuksien kehys, jossa yksilönvapauksia on suojeltava sekä valtion että yritysten puuttumiselta"
  - "Traditionalistinen kehys, jossa vakiintuneet sosiaaliset instituutiot on säilytettävä häiritseviä moderneja muutoksia vastaan"
explanation: >-
  Sosialistista kantaa yhteiskunnallisissa kiistoissa muovaa johdonmukaisesti hallitsevien ja alistettujen konfliktikehys. Avioliitossa kyse on heteroseksuaalisesta enemmistöstä, joka sortaa homoseksuaalista vähemmistöä. Maahanmuutossa kansallisuuteen perustuvat rajoitukset ovat sorron muotoja. Tuliaseissa vain valtiolla tulisi olla voima haavoittuvien suojelemiseksi. Sokeripitoisissa juomissa teollisuudenharjoittajat hyötyvät vähiten suojeltujen haavoittuvuudesta. Tämä sortajan ja sorretun näkökulma toistuu lukuisilla alueilla, kuten sukupuolessa, rodussa ja jopa ihmiskunnan ja luonnon välisessä suhteessa.
