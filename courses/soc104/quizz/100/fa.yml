question: "فلسفه سایفرپانک درباره تمرکزگرایی چگونه به اصل لیبرتارینِ رضایت به‌عنوان هنجار بنیادی عدالت پیوند می‌خورد؟"
answer: "سایفرپانک‌ها همه تمرکزگرایی را مبتنی بر اجبار می‌دانند نه رضایت، و این بازتاب موضع لیبرتارین است که هیچ چیز اگر با زور از سوی اقتداری متمرکز تحمیل شود نمی‌تواند عادلانه باشد"
wrong_answers:
  - "سایفرپانک‌ها باور دارند تمرکزگرایی وقتی با رأی اکثریت دموکراتیک تأیید شود پذیرفتنی است، که با احترام لیبرتارین‌ها به حکمرانی قانون اساسی همسو است"
  - "سایفرپانک‌ها در وضعیت‌های اضطراری از تمرکزگرایی موقت پشتیبانی می‌کنند، که بازتاب دیدگاه لیبرتارین است مبنی بر اینکه حقوق فردی می‌تواند هنگام تهدید شدن جمع تعلیق شود"
  - "سایفرپانک‌ها فقط با تمرکزگرایی در نظام‌های فناوری مخالف‌اند، اما تمرکزگرایی سیاسی را برای اجرای حقوق مالکیت و قراردادها ضروری می‌پذیرند"
explanation: >-
  سایفرپانک‌ها به نظام‌های رمزنگاری غیرمتمرکز اعتماد می‌کنند نه به نهادهای متمرکز. همه تمرکزگرایی مبتنی بر اجبار، نه رضایت، دانسته می‌شود. این امر مستقیماً بازتاب فلسفه لیبرتارین است که رضایت را هنجار بنیادی عدالت می‌داند. هیچ چیز اگر با زور از سوی اقتداری متمرکز تحمیل شود نمی‌تواند عادلانه باشد؛ به همین دلیل آن‌ها کوشیدند شبکه‌های غیرمتمرکزی بسازند که در آن هیچ موجودیت واحدی نتواند اراده خود را تحمیل کند.
reviewed: false
