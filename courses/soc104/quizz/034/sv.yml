question: "Hur skiljer sig strategierna för att avskaffa staten mellan libertärer och libertarianer?"
answer: "Libertärer har historiskt förespråkat våldsam förstörelse, medan libertarianer försöker delegitimera staten genom utbildning och civil olydnad"
wrong_answers:
  - "Libertärer använder demokratiska val för att avveckla staten, medan libertarianer föredrar väpnad revolution och direkt aktion"
  - "Libertärer fokuserar på att bygga alternativa gemenskaper, medan libertarianer arbetar inom det befintliga politiska systemet för att genomföra reformer"
  - "Både libertärer och libertarianer är överens om att fredlig protest är det enda legitima medlet för social omvandling"
explanation: >-
  Libertärerna har historiskt förespråkat att staten och kapitalismen ska förstöras genom våld, inklusive terror och riktade attacker. Libertarianer däremot avvisar aggressivt våld som illegitimt. Deras strategi bygger på att delegitimera staten genom argumentation, debatt, utbildning och civil olydnad. Dessa i grunden olika förhållningssätt till förändring återspeglar deras djupare filosofiska meningsskiljaktigheter.
reviewed: false
