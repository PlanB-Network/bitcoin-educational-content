question: "사이퍼펑크는 왜 익명성 속성을 가진 디지털 통화가 필요하다고 주장했나요?"
answer: "주요 익명 트랜잭션 시스템인 현금이 디지털 사회에서 사라지고 있으며, 같은 프라이버시 속성을 가진 디지털 대체물이 발명되어야 하기 때문입니다"
wrong_answers:
  - "기존 디지털 결제 시스템이 너무 느리고 비싸서 온라인 상거래를 위한 더 빠르고 저렴한 대안이 필요했기 때문입니다"
  - "정부가 이미 모든 형태의 익명 트랜잭션을 금지했고, 새로운 기술만이 이러한 법을 우회할 수 있었기 때문입니다"
  - "전통적 은행들이 특정 인구집단에 서비스를 제공하기를 거부해, 보편적으로 접근 가능한 디지털 결제 시스템이 경제적 필수가 되었기 때문입니다"
explanation: >-
  사이퍼펑크 선언문은 열린 사회에서의 기밀성이 익명 트랜잭션 시스템을 필요로 한다고 말합니다. 디지털 시대 이전까지 현금은 이 유형의 주요 시스템 역할을 했습니다. 그러나 현금이 사라지는 디지털 사회에서는 동일한 익명성 속성을 가진 디지털 통화가 발명되어야 합니다. 이 비전은 Bitcoin이 성취하게 될 것을 직접 예견했습니다.
