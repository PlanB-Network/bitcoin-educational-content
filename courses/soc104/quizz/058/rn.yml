question: "Michael Oakeshott yadondoye gute conservatism mu bikorwa vyiwe vya filozofiya?"
answer: "Nk'akamere n'inyifato ku buzima aho kuba ideology ikomeye iri kuri sisitemu idahinduka"
wrong_answers:
  - "Nk'inyigisho y'ubutunzi yuzuye ifise ivyokorwa vya politike bitomoye ku rwego rwose rwa Leta"
  - "Nk'umuhari w'impinduka zikomeye ushaka gusambura inzego za kijambere no gusubira mu kibano ca mbere y'amahinguriro"
  - "Nk'inyigisho y'idini gusa ishingiye kuri tewolojiya ya gikirisu n'ububasha bw'ishengero"
explanation: >-
  Michael Oakeshott, filozofe w'Umwongereza, yarwaniye iciyumviro ca conservatism nk'akamere kurusha ideology iri kuri sisitemu. Inyandiko yiwe On Being Conservative (1956) iguma ari isoko ry'ingenzi. Uko kubona conservatism nk'inyifato kwaragize n'ico gukoze kuri Friedrich Hayek. Uburyo bwa Oakeshott burazwi kubera ukunegura rationalism muri politike, akanka iciyumviro c'uko politike ishobora kugabanywa ikaba sisitemu.
