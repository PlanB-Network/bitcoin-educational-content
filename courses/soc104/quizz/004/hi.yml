question: "Bastiat या Ron Paul जैसे classical liberal विचारकों को रखने के लिए बाएँ-दाएँ अक्ष को अपर्याप्त क्यों माना जाता है?"
answer: "क्योंकि classical liberalism आर्थिक और व्यक्तिगत दोनों स्वतंत्रताओं को महत्व देता है, जिन्हें न वाम पूरी तरह अपनाता है और न दक्षिण"
wrong_answers:
  - "क्योंकि classical liberals हमेशा दक्षिणपंथी आर्थिक नीतियों के साथ रहते हैं और सभी वामपंथी स्थितियों को अस्वीकार करते हैं"
  - "क्योंकि classical liberals मध्यमार्गी होते हैं जो वाम और दक्षिण दोनों विचारधाराओं के मध्यम संस्करण अपनाते हैं"
  - "क्योंकि classical liberals सरकार के सभी रूपों का विरोध करते हैं, जिससे वे राजनीतिक विचारक के बजाय अराजकतावादी बन जाते हैं"
explanation: >-
  बाएँ-दाएँ अक्ष classical liberals के लिए विफल रहता है क्योंकि वह ऐसी स्थिति को समाहित नहीं कर सकता जो आर्थिक स्वतंत्रता (आम तौर पर दक्षिण) और व्यक्तिगत स्वतंत्रता (आम तौर पर वाम) दोनों की साथ-साथ रक्षा करती है। Classical liberals समझौता खोजने वाले मध्यमार्गी नहीं हैं, न ही वे अराजकतावादी या पूरी तरह दक्षिणपंथी हैं। वे बस एक-आयामी स्पेक्ट्रम में फिट नहीं बैठते।
reviewed: false
