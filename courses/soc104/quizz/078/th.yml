question: "มโนทัศน์เรื่องเสรีภาพของลิเบอร์ทาเรียนแตกต่างจากมโนทัศน์ของสายกลางอย่างไร?"
answer: "ลิเบอร์ทาเรียนถือว่าเสรีภาพเป็นสัจพจน์ที่ไม่มีเงื่อนไข ส่วนสายกลางปกป้องเสรีภาพแบบฉวยโอกาสตามบริบทและประสิทธิภาพ"
wrong_answers:
  - "ลิเบอร์ทาเรียนยอมให้รัฐคุ้มครองเสรีภาพแบบเลือกเฉพาะกรณี ส่วนสายกลางปฏิเสธการมีส่วนร่วมใด ๆ ของรัฐในการคุ้มครองสิทธิของปัจเจกบุคคล"
  - "ลิเบอร์ทาเรียนมุ่งเสรีภาพเฉพาะเรื่องเศรษฐกิจเท่านั้น ส่วนสายกลางใช้เสรีภาพอย่างกว้างขวางในขอบเขตทางสังคมและวัฒนธรรม"
  - "ลิเบอร์ทาเรียนและสายกลางมีมุมมองเรื่องเสรีภาพเหมือนกัน แต่ไม่เห็นด้วยกันเรื่องขนาดของรัฐบาลที่จำเป็นต่อการบังคับใช้เสรีภาพนั้น"
explanation: >-
  ลิเบอร์ทาเรียนให้นิยามเสรีภาพว่าเป็นหลักการทั่วไปที่ไม่มีเงื่อนไขและทำหน้าที่เป็นสัจพจน์ ในทางตรงกันข้าม สายกลางปกป้องเสรีภาพบางอย่างในลักษณะฉวยโอกาสและขึ้นกับบริบท โดยไม่ใช้หลักการทั่วไปใด ๆ แนวทางของสายกลางเผยให้เห็นมโนทัศน์เชิงเครื่องมือของเสรีภาพ ซึ่งถูกทำให้อยู่ใต้เป้าหมายเชิงปฏิบัติ เช่น ประสิทธิภาพ เสมอ และเป็นสิ่งที่ลิเบอร์ทาเรียนปฏิเสธโดยพื้นฐาน
reviewed: false
