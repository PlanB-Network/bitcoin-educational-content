question: "Kategoria ya uhuru wa kiuchumi inajumuisha nini?"
answer: "Unachofanya kama mzalishaji na mtumiaji: kununua, kuuza, kuzalisha, kufanya kazi, kuajiri, na kusimamia pesa zako"
wrong_answers:
  - "Imani zako za kidini, mahusiano yako ya binafsi, na uhuru wa kujieleza"
  - "Haki yako ya kupiga kura, kushiriki katika uchaguzi, na kujiunga na vyama vya kisiasa"
  - "Uwezo wako wa kusafiri kwa uhuru, kuchagua makazi yako, na kuvuka mipaka ya kitaifa"
explanation: >-
  Uhuru wa kiuchumi unahusu unachofanya kama mzalishaji na mtumiaji: kile unachoweza kununua, kuuza, au kuzalisha; mahali unapofanya kazi; unayemwajiri; na unachofanya na pesa zako. Mahusiano ya binafsi, imani za kidini, na uhuru wa kusafiri huangukia chini ya kategoria ya uhuru wa binafsi, si ile ya kiuchumi.
reviewed: false
