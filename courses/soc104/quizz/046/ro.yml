question: "Cum tratează conservatorismul libertățile în sferele economică și societală?"
answer: "Libertăți puternice în sfera economică, dar libertăți slabe în sfera societală"
wrong_answers:
  - "Libertăți slabe atât în sfera economică, cât și în cea societală, pentru a menține ordinea socială tradițională"
  - "Libertăți puternice în sfera societală, dar libertăți slabe în sfera economică"
  - "Libertăți egale și nelimitate în ambele sfere, cu intervenție guvernamentală minimă de orice fel"
explanation: >-
  Conservatorismul prezintă o dihotomie care este imaginea în oglindă a socialismului. În domeniul economic, conservatorii apără piața liberă, antreprenoriatul și proprietatea privată. În domeniul societal, restricțiile sunt justificate prin păstrarea normelor morale tradiționale și a stabilității sociale. Al treilea răspuns greșit descrie tiparul socialist, care este opusul.
reviewed: false
