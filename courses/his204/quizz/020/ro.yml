question: Care a fost evenimentul contemporan lui care i-a inspirat teoria economică a lui Cantillon?
answer: Prăbușirea sistemului lui John Law
wrong_answers:
  - Marea criză economică din 1705-1707
  - Războiul dintre Franța și Olanda
  - Revoluția engleză
explanation: |
  Cantillon a fost martor la prăbușirea sistemului lui Law și a analizat cauzele și consecințele acesteia în "Essai sur la nature du commerce en général". Acest eveniment i-a influențat profund gândirea economică și înțelegerea fenomenelor monetare.
