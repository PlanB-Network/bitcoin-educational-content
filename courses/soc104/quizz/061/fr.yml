question: "Que révèle la déclaration de Mussolini de 1920, « Tout dans l'État, rien hors de l'État, rien contre l'État », à propos du totalitarisme ?"
answer: "Il n'y a plus de séparation entre l'espace public et l'espace privé, car l'État absorbe entièrement la société"
wrong_answers:
  - "L'État se concentre exclusivement sur la puissance militaire tout en laissant l'économie à l'entreprise privée"
  - "Les citoyens sont libres de s'organiser en privé tant qu'ils ne critiquent pas ouvertement le gouvernement"
  - "Le gouvernement contrôle seulement l'activité politique tandis que la vie culturelle et religieuse reste autonome"
explanation: >-
  La déclaration de Mussolini saisit l'essence du totalitarisme : la totalité. Tout est absorbé dans l'État, ce qui signifie qu'il n'y a pas de séparation entre l'espace public et l'espace privé. La société perd toute forme d'autonomie, jusque dans les activités les plus banales comme ouvrir un club de sport. Cela va bien au-delà du contrôle des seules sphères militaire, politique ou économique.
reviewed: false
