question: "Hva er paleo-libertarianisme?"
answer: "En syntese som kombinerer avvisningen av staten som en kilde til tvang med en styrking av tradisjonelle institusjoner og frivillige sosiale strukturer"
wrong_answers:
  - "En libertariansk bevegelse som avviser alle tradisjonelle verdier og fremmer radikal sosial progressivisme"
  - "En konservativ ideologi som bruker statsmakt til å håndheve tradisjonelle verdier, samtidig som den tillater noe økonomisk frihet"
  - "En sentristisk filosofi som søker et balansert kompromiss mellom sosialistisk økonomi og konservativ sosialpolitikk"
explanation: >-
  Paleo-libertarianisme kombinerer avvisningen av staten som den institusjonelle kilden til tvang med en styrking av tradisjonelle institusjoner og en preferanse for frivillige sosiale strukturer fremfor statlig autoritet. Den skiller seg fra neo-libertarianisme ved å være mer sympatisk innstilt til tradisjonelle verdier. Paleo-libertarianeren motsetter seg ikke at fellesskap organiserer seg rundt sosialistiske eller kommunitære prinsipper; de nekter bare at slike fellesskap påtvinger alle sine verdier med lovens makt.
