question: "Cum diferă rolurile Cato Institute, Mises Institute și Libertarian Party în cadrul mișcării libertariene?"
answer: "Cato Institute se concentrează pe propuneri de politici publice, Mises Institute pe educație și publicații academice, iar Libertarian Party pe politica electorală"
wrong_answers:
  - "Cato Institute finanțează campanii politice, Mises Institute face lobby direct în Congres, iar Libertarian Party organizează conferințe academice"
  - "Cato Institute publică manuale de economie, Mises Institute organizează campanii de înregistrare a alegătorilor, iar Libertarian Party redactează proiecte de lege"
  - "Cato Institute organizează proteste de bază, Mises Institute oferă apărare juridică libertarienilor, iar Libertarian Party gestionează cercetarea de think tank"
explanation: >-
  Cato Institute (fondat în 1977) este un think tank cu sediul la Washington care lucrează la propuneri de politici publice. Mises Institute (fondat în 1982) se concentrează pe educație, nu pe lobby politic, funcționând ca un fel de universitate online cu conferințe și lucrări republicate. Libertarian Party (fondat în 1971) este al treilea cel mai mare partid politic american, participând la alegeri unde chiar și ponderea sa de aproximativ 2% din voturi poate înclina rezultatele.
reviewed: false
