question: "Care este dezacordul esențial dintre libertarieni și alte familii politice atunci când împărtășesc aceleași obiective?"
answer: "Dezacordul privește mijloacele: libertarienii resping soluțiile coercitive și favorizează schimbul voluntar prin procesul de piață"
wrong_answers:
  - "Dezacordul privește scopurile: libertarienii urmăresc obiective diferite, precum bogăția individuală, mai degrabă decât bunăstarea socială"
  - "Dezacordul privește calendarul: libertarienii vor să atingă aceleași obiective mai lent, prin reformă graduală"
  - "Dezacordul privește domeniul de aplicare: libertarienii vor să aplice aceleași politici doar la nivel local, nu național"
explanation: >-
  Libertarienii pot fi de acord cu socialiștii, conservatorii și centriștii asupra anumitor obiective, precum apărarea celor oprimați sau promovarea coeziunii sociale. Dezacordul nu stă în scopuri, ci în mijloace. Libertarienii resping toate soluțiile coercitive care caută să uniformizeze practicile și reglementările, apărând în schimb puterea alegerii și libertatea responsabilă prin schimb liber, descentralizat, întemeiat pe contracte voluntare.
reviewed: false
