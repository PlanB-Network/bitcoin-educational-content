question: "ජාතික සභාවේ Frederic Bastiatගේ ඡන්දවලට මඟ පෙන්වූ මූලධර්මය කුමක්ද?"
answer: "පුද්ගලික සහ ආර්ථික නිදහස්තා ප්‍රවර්ධනය කිරීම සහ රජයේ මැදිහත්වීම අඩු කිරීම"
wrong_answers:
  - "රාජකීය අධිකාරිය ආරක්ෂා කිරීම සහ රාජාණ්ඩු සම්ප්‍රදායන් පවත්වා ගැනීම"
  - "ධනය වඩා සමානව නැවත බෙදාහැරීමට සමාජවාදී ප්‍රතිපත්ති ඉදිරියට ගෙන යාම"
  - "වම් සහ දකුණු කණ්ඩායම් අතර සම්මුතියක් සොයන මධ්‍යවාදී උපායමාර්ගයක්"
explanation: >-
  Bastiat මූලික මූලධර්මයක් මත ඡන්දය දුන්නේය: රජයේ මැදිහත්වීම අඩු කරමින් පුද්ගලික සහ ආර්ථික නිදහස්තා ප්‍රවර්ධනය කිරීම. ඔහු මධ්‍යවාදී අවස්ථාවාදියෙකු නොවූ අතර, රාජාණ්ඩුවාදියෙකු හෝ සමාජවාදියෙකු ද නොවීය. නිදහස සහ සීමිත රජය සමඟ ගැළපෙන පියවර යෝජනා කළ කවර පැත්තක් වුවද ඔහු එය සමඟ ඡන්දය දුන්නේය.
reviewed: false
