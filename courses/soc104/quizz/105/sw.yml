question: "Kwa kuzingatia hoja kamili ya kozi hii, Bitcoin hujumuishaje kwa wakati mmoja ukosoaji wa libertarian dhidi ya constructivism, kujitolea kwa cypherpunk kuchukua hatua, na utetezi wa kibinafsi wa uhuru wa kimaadili?"
answer: "Bitcoin hubadilisha pesa iliyopangwa na mamlaka ya kati kwa utaratibu wa soko unaojitokeza wenyewe (anti-constructivism), hubadilisha dhana dhahania ya uhuru wa kifedha kuwa code inayofanya kazi (hatua ya cypherpunk), na humrejeshea mtu binafsi umiliki huru na faragha (uhuru wa kimaadili)"
wrong_answers:
  - "Bitcoin hutumia utawala wa kidemokrasia kuweka sera ya fedha (anti-constructivism), huchapisha maudhui ya elimu kuhusu uhuru wa kifedha (hatua ya cypherpunk), na huruhusu watu binafsi kupiga kura kuhusu mabadiliko ya itifaki (uhuru wa kimaadili)"
  - "Bitcoin huondoa udhibiti wote wa kifedha (anti-constructivism), huunda jumuiya ya watengenezaji programu wanaoshawishi kuondolewa kwa udhibiti (hatua ya cypherpunk), na huwapa watu matajiri udhibiti zaidi juu ya sera ya fedha (uhuru wa kimaadili)"
  - "Bitcoin hugatua miundombinu ya server katika nchi nyingi (anti-constructivism), hutumia leseni ya open-source kushiriki teknolojia kwa uhuru (hatua ya cypherpunk), na hutoa majukwaa ya mitandao ya kijamii yasiyotambulisha wahusika kwa upinzani wa kisiasa (uhuru wa kimaadili)"
explanation: >-
  Bitcoin iko katika makutano ya mapokeo matatu ya kiakili yaliyochunguzwa katika kozi. Inajumuisha hoja ya anti-constructivist kwa kubadilisha pesa za Fiat zilizopangwa na mamlaka ya kati kwa utaratibu wa kifedha unaojitokeza wenyewe na uliogatuliwa ambao hakuna mpangaji mkuu anayeweza kuudhibiti. Inatimiza wajibu wa cypherpunk wa kuandika code kwa kugeuza dhana dhahania za uhuru wa kifedha na faragha kuwa teknolojia inayofanya kazi. Na inahudumia utetezi wa kibinafsi wa uhuru wa kimaadili kwa kuwezesha umiliki huru, kulinda matunda ya kazi, na kuhifadhi faragha, ikimruhusu kila mtu kuwa bwana wa maisha yake mwenyewe.
