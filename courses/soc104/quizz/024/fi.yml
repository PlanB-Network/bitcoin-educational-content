question: "Mitä paleolibertarismi on?"
answer: "Synteesi, joka yhdistää valtion hylkäämisen pakottamisen lähteenä perinteisten instituutioiden ja vapaaehtoisten yhteiskunnallisten rakenteiden vahvistamiseen"
wrong_answers:
  - "Libertaristinen liike, joka hylkää kaikki perinteiset arvot ja edistää radikaalia yhteiskunnallista progressivismia"
  - "Konservatiivinen ideologia, joka käyttää valtiovaltaa perinteisten arvojen toimeenpanemiseen mutta sallii jonkin verran taloudellista vapautta"
  - "Keskustalainen filosofia, joka etsii tasapainoista kompromissia sosialistisen talouden ja konservatiivisen sosiaalipolitiikan välillä"
explanation: >-
  Paleolibertarismi yhdistää valtion hylkäämisen pakottamisen institutionaalisena lähteenä perinteisten instituutioiden vahvistamiseen ja vapaaehtoisten yhteiskunnallisten rakenteiden suosimiseen valtiovallan sijaan. Se erottaa itsensä neolibertarismista suhtautumalla myötämielisemmin perinteisiin arvoihin. Paleolibertaristi ei vastusta yhteisöjä, jotka järjestäytyvät sosialististen tai yhteisöllisten periaatteiden ympärille; hän kieltäytyy vain siitä, että tällaiset yhteisöt pakottaisivat arvonsa kaikille lain voimalla.
