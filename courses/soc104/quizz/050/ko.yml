question: "외교 정책 접근에서 신보수주의자들과 고보수주의자들을 구분하는 것은 무엇인가요?"
answer: "신보수주의자들은 민주주의를 확산하기 위한 군사 개입주의를 정당화하는 반면, 고보수주의자들은 더 고립주의적인 외교 정책을 옹호합니다"
wrong_answers:
  - "신보수주의자들은 모든 군사 행동에 반대하고 외교를 선호하는 반면, 고보수주의자들은 잠재적 위협에 대한 선제공격을 지지합니다"
  - "신보수주의자들은 경제 제재에만 집중하는 반면, 고보수주의자들은 공동 군사 작전을 위한 국제 연합 구축을 주장합니다"
  - "신보수주의자들과 고보수주의자들은 외교 정책에는 동의하지만 국내 경제 규제에서는 날카롭게 갈립니다"
explanation: >-
  2000년대 이후 신보수주의자들은 전 세계에 민주주의를 심기 위한 군사 개입주의를 정당화하는 데 점점 더 깊이 관여하게 되었으며, 특히 2001년 9월 11일 이후 그러했습니다. 이에 대한 반응으로 전통적 보수주의자들은 자신들을 구분하기 위해 '고보수주의자'라는 명칭을 주장했습니다. 고보수주의자들은 군사 개입주의를 비판하고, 더 고립주의적인 외교 정책을 옹호하며, 국가적·문화적 정체성을 더 중시합니다.
