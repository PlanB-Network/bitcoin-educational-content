question: The proof of the Simplicity Completeness theorem constructs an expression for any function by nesting case expressions to fully decompose the input and composing with scribe expressions for each output. Why is this construction useful only as a theoretical tool?
answer: The constructed expression is effectively a giant lookup table whose size grows exponentially with input width — a function on 256-bit inputs would need about 2²⁵⁶ entries
wrong_answers:
  - Because scribe is a macro rather than a true combinator, the constructed expression falls outside the formally verified core Simplicity language and cannot be machine-checked
  - Because the Bit Machine takes exponential time to evaluate the constructed expression, even though the expression itself stays compact thanks to sharing between branches
  - Because nested case expressions can only decompose sum types, so the lookup-table construction fails whenever the function's input type is built from products
explanation: >-
  The construction enumerates every possible input via nested case
  decomposition and hard-codes each output with scribe, so expression size
  explodes exponentially — astronomical for realistic types like 256-bit
  words. The blowup is in the expression's size, not in an otherwise-
  compact expression's runtime. scribe expands into genuine core
  combinators (unit, injl, injr, pair), so the result stays inside the
  core language, whose completeness theorem is formally verified in Rocq;
  and the decomposition handles inputs of any type, products included.
reviewed: false
