question: "놀런 도표의 두 축은 무엇인가요?"
answer: "개인적 자유를 측정하는 수직축과 경제적 자유를 측정하는 수평축"
wrong_answers:
  - "좌에서 우로 이어지는 수평축과 권위주의에서 민주주의로 이어지는 수직축"
  - "부를 측정하는 수직축과 교육 수준을 측정하는 수평축"
  - "사회주의에서 자본주의로 이어지는 수평축과 전통에서 진보로 이어지는 수직축"
explanation: >-
  데이비드 놀런은 자신의 도표를 두 개의 특정한 축으로 설계했습니다. 개인적 자유(수직)와 경제적 자유(수평)입니다. 이 2차원 접근은 지나치게 단순화된 좌우 선을 대체하며, 자유의 두 주요 범주를 분리함으로써 정치 이념의 복잡성을 더 잘 포착합니다.
reviewed: false
