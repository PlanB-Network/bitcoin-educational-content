question: "Amerika Birleşik Devletleri'ndeki klasik liberaller neden 1960'lardan itibaren kendilerine 'liberteryen' demeye başladı?"
answer: "Anlamı devlet müdahaleciliğine doğru kaymış olan Amerikan liberallerinden kendilerini ayırmak için"
wrong_answers:
  - "Demokrat Parti ve onun ilerici sosyal programlarıyla aynı çizgiye gelmek için"
  - "Lyndon B. Johnson'ın Great Society reformlarına desteklerini göstermek için"
  - "Avrupa sosyalist hareketlerinden ilham alan daha radikal devrimci bir kimlik benimsemek için"
explanation: >-
  Amerika Birleşik Devletleri'nde 'liberal' sözcüğü, özellikle New Deal ve Great Society sonrasında Büyük Devlet ve devlet müdahalesi destekçileri anlamına kaydı. Klasik liberaller, felsefelerinin özgün anlamını korumak için 'liberteryen' etiketini benimsedi. Amerikan liberalleriyle aynı hizaya gelmiyor, onlardan uzaklaşıyorlardı.
reviewed: false
