question: "'case' combinator එක එහි signature එකෙහි shared environment type C එකක් ඇතුළත් කරන්නේ ඇයි?"
answer: branches දෙකටම tagged input එක සමඟම shared context data කියවිය හැකි වන පරිදි.
wrong_answers:
  - stack overflows වැළැක්වීම සඳහා input එකෙහි size එක සීමා කිරීමට.
  - branches දෙක අතර ඉදිරියට හා පසුපසට recursive calls සක්‍රීය කිරීමට.
  - chain එකෙහි කලින් තිබූ previous combinator එකෙහි output එක store කිරීමට.
