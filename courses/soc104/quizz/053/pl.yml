question: "Co głosi zasada nieagresji?"
answer: "Osoba może działać tak, jak chce, dopóki nie stosuje przemocy wobec życia, wolności ani własności innej osoby"
wrong_answers:
  - "Państwo ma wyłączne prawo używać siły w celu utrzymania porządku społecznego"
  - "Obywatele muszą podporządkować się rządom większości nawet wtedy, gdy ograniczają one wolności jednostki"
  - "Swoboda działania jest dopuszczalna tylko wtedy, gdy służy zbiorowemu dobru społeczeństwa"
explanation: >-
  Zasada nieagresji jest kamieniem węgielnym polityki libertariańskiej i głosi, że jednostki mogą działać swobodnie pod warunkiem, że nie stosują przemocy wobec życia, wolności ani własności innych. Przywodzi na myśl złotą regułę obecną w różnych cywilizacjach. W przeciwieństwie do pozostałych opcji nie przyznaje państwu szczególnego autorytetu moralnego ani nie podporządkowuje praw jednostki zbiorowej korzyści.
