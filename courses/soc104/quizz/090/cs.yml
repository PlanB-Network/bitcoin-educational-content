question: "Proč Popper tvrdí, že otevřená společnost zůstává navzdory svým výhodám vnitřně křehká?"
answer: "Protože odpovědnost, kterou individualismus implikuje, se může zdát děsivá, což vytváří pokušení hledat útočiště v komunitární ochraně, autoritě nebo nostalgii po idealizované minulosti"
wrong_answers:
  - "Protože otevřené společnosti postrádají vojenskou sílu a nedokážou se bránit invazi uzavřených společností"
  - "Protože demokratické instituce jsou ze své podstaty neefektivní a nakonec se zhroutí pod tíhou byrokratické složitosti"
  - "Protože otevřené společnosti dovolují příliš velkou ekonomickou nerovnost, což nevyhnutelně vede k revoluci a nastolení autoritářských režimů"
explanation: >-
  Popper zdůrazňuje, že křehkost otevřené společnosti pramení z psychologické zranitelnosti. Odpovědnost, kterou individualismus implikuje, se může zdát děsivá a riskantní, protože člověk musí činit vlastní volby a může selhat. To vytváří pokušení hledat útočiště v komunitární ochraně nebo nostalgických tendencích k idealizované minulosti. Otevřená společnost čelí trvalým výzvám ze strany komunitárních impulzů a opakujícího se pokušení násilí.
