question: "프레데릭 바스티아가 국민의회에서 투표할 때 따른 지도 원칙은 무엇이었나요?"
answer: "개인적·경제적 자유의 증진과 정부 간섭의 축소"
wrong_answers:
  - "왕권의 수호와 군주제 전통의 보존"
  - "부를 더 평등하게 재분배하기 위한 사회주의 정책의 추진"
  - "좌파와 우파 진영 사이에서 타협하는 중도주의 전략"
explanation: >-
  바스티아는 근본 원칙에 따라 투표했습니다. 정부 간섭을 줄이는 동시에 개인적·경제적 자유를 증진하는 것이었습니다. 그는 중도적 기회주의자도, 왕당파나 사회주의자도 아니었습니다. 그는 자유와 제한된 정부에 부합하는 조치를 제안한 쪽이라면 어느 쪽이든 함께 투표했습니다.
reviewed: false
