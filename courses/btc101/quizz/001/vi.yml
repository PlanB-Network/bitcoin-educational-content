question: Cuộc chiến về kích thước khối xảy ra khi nào?
answer: Vào năm 2017.
wrong_answers:
  - Vào năm 2008.
  - Vào năm 2010.
  - Vào năm 2019.
explanation: >-
  Cuộc chiến về kích thước khối xảy ra vào năm 2017. Đây là xung đột giữa những người muốn thay đổi Bitcoin bằng cách tăng kích thước khối để tăng khả năng xử lý giao dịch, với những người tìm cách bảo vệ sự độc lập và quyền lợi của người dùng bằng cách giữ kích thước ở mức 1 MB.
reviewed: true