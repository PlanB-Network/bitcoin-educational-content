question: Как е дефиниран булевият тип (𝟚) в Simplicity?
answer: Като sum тип 𝟙 + 𝟙, съдържащ точно две стойности (false и true).
wrong_answers:
  - Като product тип 𝟙 × 𝟙, който тогава би съдържал само една стойност.
  - Като специален примитивен тип, вграден директно в езика.
  - Като 32-битов целочислен тип, ограничен само до стойностите 0 и 1.
explanation: >-
  Булевият тип 𝟚 е дефиниран като 𝟙 + 𝟙, sum от два unit типа. Стойността
  с ляв таг σᴸ⟨⟩ представлява false (0), а стойността с десен таг
  σᴿ⟨⟩ представлява true (1). Това е еднобитов тип данни, изграден само
  от unit типа и конструктора за sum — конструкторът за product не е нужен.
