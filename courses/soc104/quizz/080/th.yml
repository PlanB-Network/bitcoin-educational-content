question: "เหตุใดคำทำนายปี 1849 ของ Molinari จึงพิสูจน์ว่าเป็นเชิงพยากรณ์เกี่ยวกับความสัมพันธ์ระหว่างเสรีภาพกับอำนาจทางการเมือง?"
answer: "เพราะฝ่ายอนุรักษนิยมและฝ่ายสังคมนิยมได้ผลัดกันขึ้นสู่อำนาจ และทำให้เสรีภาพกลายเป็นเครื่องมือรับใช้เป้าหมายทางการเมืองของตนเอง ตามที่เขาอธิบายไว้ทุกประการ"
wrong_answers:
  - "เพราะตัวละครนักเศรษฐศาสตร์ที่เขาอธิบายในที่สุดก็ได้อำนาจทางการเมืองและนำนโยบายลิเบอร์ทาเรียนไปใช้ทั่วยุโรป"
  - "เพราะคำทำนายของเขาที่ว่าครอบครัวการเมืองทั้งสามจะรวมกันเป็นขบวนการสายกลางเดียวได้กลายเป็นจริงในศตวรรษที่ยี่สิบ"
  - "เพราะเสรีภาพถูกขยายอย่างค่อยเป็นค่อยไปโดยรัฐบาลต่อเนื่อง จนกลายเป็นหลักการจัดระเบียบหลักของประชาธิปไตยสมัยใหม่"
explanation: >-
  วิสัยทัศน์ของ Molinari พิสูจน์ว่าเป็นเชิงพยากรณ์ เพราะนับตั้งแต่กลางศตวรรษที่สิบเก้า ฝ่ายอนุรักษนิยมและฝ่ายสังคมนิยมได้ผลัดกันขึ้นสู่อำนาจ และดำเนินสิ่งที่เขาอธิบายไว้อย่างแม่นยำ: การทำให้เสรีภาพกลายเป็นเครื่องมือรับใช้เป้าหมายทางการเมือง ทั้งสองครอบครัวยินดีจำกัดเสรีภาพและเรียกรัฐให้บังคับใช้วาระของตนเอง ขณะที่จุดยืนของนักเศรษฐศาสตร์ที่สนับสนุนเสรีภาพอย่างไม่มีเงื่อนไขยังคงถูกผลักไปอยู่ชายขอบ
reviewed: false
