question: "پاسخ جورج دبلیو. بوش به بحران مالی 2008 چگونه «انعطاف‌پذیری مسئله‌ساز» اصول محافظه‌کارانه را نشان می‌دهد؟"
answer: "او اصول بازار آزاد را برای نجات بانک‌های بزرگ کنار گذاشت، و نگاه محافظه‌کارانه به دولت را به‌عنوان ضامن نهایی ثبات اقتصادی ملی آشکار کرد"
wrong_answers:
  - "او هرگونه مداخله دولتی را رد کرد و اجازه داد بانک‌ها ورشکست شوند، و صرف‌نظر از پیامدها سخت‌گیرانه به ایدئولوژی بازار آزاد پایبند ماند"
  - "او بخش بانکی را برای همیشه ملی کرد و مالیات‌ستانی تصاعدی را معرفی کرد، و از محافظه‌کاری به سوسیالیسم دموکراتیک تغییر جهت داد"
  - "او با کاهش همه هزینه‌های دولت و حذف مقررات مالی پاسخ داد تا بازار خود را اصلاح کند"
explanation: >-
  بوش اعلام کرد که با مداخله برای نجات بانک‌های بزرگ، «اصول بازار آزاد را کنار گذاشته بود تا نظام بازار آزاد را نجات دهد». این نشان می‌دهد که محافظه‌کاران چگونه می‌توانند قدرت و تداوم ملت را بر اصول انتزاعی بازار مقدم بدانند. همین منطق انعطاف‌پذیر در سیاست‌های تجاری حمایت‌گرایانه ترامپ نیز دیده می‌شود، که به نام منافع ملی دنبال شدند، با خطر دامن زدن به کورپوراتیسم و سرمایه‌داری رفاقتی.
reviewed: false
