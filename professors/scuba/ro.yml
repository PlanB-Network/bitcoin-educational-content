bio: |
  Cursant pe viață, îmi place să învăț și să împărtășesc cunoștințe. Pasionat de scufundări și astronomie, a fost firesc ca, atunci când am căzut în rabbit hole, să pornesc în explorarea profunzimilor Bitcoin – de la economie la tehnologie.

short_bio: Explorator curios și pasionat, care se scufundă cu entuziasm în profunzimile Bitcoin, între economie și tehnologie.
