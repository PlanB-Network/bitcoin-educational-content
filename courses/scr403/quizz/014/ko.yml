question: 유닛 타입(𝟙)이란 무엇이며, 정보를 담지 않는데도 왜 유용한가요?
answer: 하나의 값(빈 튜플)을 담으며, 다른 모든 타입의 기반이 됩니다.
wrong_answers:
  - 숫자 1을 나타내며 산술 연산에 직접 사용됩니다.
  - 실행 trace를 파일로 기록하는 특별한 디버깅 타입입니다.
  - 불리언 연산에 사용되는 정확히 한 비트의 데이터를 저장합니다.
explanation: >-
  유닛 타입 𝟙은 정확히 하나의 값, 즉 빈 튜플 ⟨⟩만 가집니다. 이는 정보 비트를
  전혀 담지 않지만, 합 타입과 곱 타입이 모든 유용한 데이터 타입을 만들어 내는
  씨앗으로서 필수적입니다. 예를 들어 불리언 타입 𝟚은 유닛 타입만으로 구성된
  𝟙 + 𝟙입니다.
reviewed: false
