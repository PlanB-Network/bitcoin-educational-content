question: "下列哪一項是 Hayek 所描述的自發秩序例子？"
answer: "語言，它透過歷史互動有機發展，而不是由某個辦公室裡的知識分子設計出來"
wrong_answers:
  - "國家憲法，它由民選代表仔細起草，以建立社會規則"
  - "政府刺激計畫，它由經濟學家設計，以協調經濟活動"
  - "公共教育制度，它由立法者建立，以確保人人都能取得知識"
explanation: >-
  Hayek 把自發秩序描述為社會中自由互動的產物，源自人類行動，但不是源自人類有意設計。語言就是主要例子：French、English、German 並不是由知識分子決定文法規則而建構出來，而是作為透過歷史互動建立的緩慢、有機組織之成果而浮現。
reviewed: false
