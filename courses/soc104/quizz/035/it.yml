question: "Su che cosa si concentra una definizione strutturale di un sistema politico?"
answer: "Su come il sistema funziona effettivamente e sulle sue caratteristiche osservabili, come il grado di controllo statale"
wrong_answers:
  - "Sugli obiettivi dichiarati e sulle nobili intenzioni proclamate dai fondatori e dai leader del sistema"
  - "Sulle origini storiche del movimento politico e sulle biografie dei suoi pensatori chiave"
  - "Sul numero di partiti politici consentiti e sulla frequenza delle elezioni democratiche tenute"
explanation: >-
  Le definizioni strutturali si concentrano su come i sistemi politici funzionano effettivamente e sulle loro caratteristiche osservabili. Per esempio, il socialismo è caratterizzato strutturalmente dall'onnipresenza dello Stato. Questo approccio contrasta con le definizioni intenzionali, che si basano su motivazioni e obiettivi dichiarati. L'approccio strutturale consente una valutazione più oggettiva basata su risultati misurabili.
