question: "Dlaczego klasyczni liberałowie w Stanach Zjednoczonych od lat 60. XX wieku zaczęli nazywać siebie libertarianami?"
answer: "Aby odróżnić się od amerykańskich liberałów, u których znaczenie tego terminu przesunęło się w stronę interwencjonizmu państwowego"
wrong_answers:
  - "Aby związać się z Partią Demokratyczną i jej postępowymi programami społecznymi"
  - "Aby zasygnalizować swoje poparcie dla reform Great Society Lyndona B. Johnsona"
  - "Aby przyjąć bardziej radykalną tożsamość rewolucyjną inspirowaną europejskimi ruchami socjalistycznymi"
explanation: >-
  W Stanach Zjednoczonych słowo 'liberalny' zaczęło oznaczać zwolenników rozbudowanego państwa i interwencji państwowej, szczególnie po Nowym Ładzie i Great Society. Klasyczni liberałowie przyjęli etykietę 'libertariański', aby zachować pierwotne znaczenie swojej filozofii. Dystansowali się od amerykańskich liberałów, a nie sprzymierzali z nimi.
reviewed: false
