question: "چرا ران پال استدلال می‌کند که فدرال رزرو زیان‌بار است، و Bitcoin چه ارتباطی با موضع او دارد؟"
answer: "فدرال رزرو از طریق دستکاری پول فیات باعث تورم و چرخه‌های اقتصادی می‌شود، و Bitcoin نماینده شکلی از پول سالم است که می‌تواند جایگزین استاندارد طلا شود"
wrong_answers:
  - "فدرال رزرو رقابت بانکی را محدود می‌کند، و Bitcoin خدمات بانکی را برای بهبود شمول مالی غیرمتمرکز می‌کند"
  - "فدرال رزرو مانع تجارت آزاد میان ملت‌ها می‌شود، و Bitcoin تراکنش‌های بدون مرز را بدون تأیید دولت ممکن می‌کند"
  - "فدرال رزرو بدهی دولتی بیش‌ازحد ایجاد می‌کند، و Bitcoin ارزی تورم‌زدا ارائه می‌دهد که بدهی ملی را از میان می‌برد"
explanation: >-
  ران پال، یک مینارشیست، استدلال می‌کند که فدرال رزرو مسئول تورم و چرخه‌های اقتصادی است، زیرا پول فیات را دستکاری می‌کند. او از ملی‌زدایی از پول، ایده‌ای که فریدریش هایک از آن دفاع می‌کرد، حمایت می‌کند و Bitcoin را شکلی از پول سالم می‌بیند که می‌تواند جایگزین استاندارد طلا شود. نقد او ریشه در نظریه پولی لیبرتارین دارد، نه عمدتاً در رقابت بانکی، موانع تجاری، یا بدهی دولتی.
reviewed: false
