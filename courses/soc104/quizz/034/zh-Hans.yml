question: "libertaires 与自由意志主义者在废除国家的策略上有何不同？"
answer: "libertaires 历史上主张暴力摧毁国家，而自由意志主义者寻求通过教育和公民不服从使国家失去合法性"
wrong_answers:
  - "libertaires 利用民主选举来拆解国家，而自由意志主义者偏好武装革命和直接行动"
  - "libertaires 专注于建设替代性共同体，而自由意志主义者在现有政治体系内推动改革"
  - "libertaires 和自由意志主义者都同意，和平抗议是社会转型的唯一正当手段"
explanation: >-
  libertaires 历史上主张通过暴力摧毁国家和资本主义，包括恐怖行动和有目标的袭击。相比之下，自由意志主义者拒绝侵略性暴力，认为它是不正当的。他们的策略建立在通过论证、辩论、教育和公民不服从来使国家失去合法性之上。这些在变革方法上的根本差异，反映了他们更深层的哲学分歧。
reviewed: false
