question: 1776දී Le commerce et le gouvernement considérés relativement l'un avec l'autre ප්‍රකාශයට පත් විය. එම වසරේම ප්‍රකාශයට පත් වූ වෙනත් පොත කුමක්ද?
answer: Adam Smithගේ The Wealth of Nations
wrong_answers:
  - Jean-Baptiste Sayගේ Treatise on Political Economy
  - Turgotගේ Reflections on the formation and distribution of wealth
  - The Social Contract
explanation: |
  Adam Smithගේ "The Wealth of Nations" 1776දී ප්‍රකාශයට පත් විය. එය ආර්ථික චින්තනය සඳහා තීරණාත්මක වසරක් විය.