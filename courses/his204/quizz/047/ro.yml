question: De ce a rămas François Quesnay la Versailles, în întresolul apartamentelor doamnei de Pompadour?
answer: Era medicul ei personal
wrong_answers:
  - Era unul dintre favoriții ei
  - Îi căuta protecția și favorurile
  - Era consilierul ei financiar
explanation: |
  Quesnay era medicul personal al doamnei de Pompadour, ceea ce îi oferea un acces privilegiat la curte și îi permitea să influențeze deciziile politice.
