question: "Why did aggressive branding and billboards backfire in Witsand's Bitcoin adoption efforts?"
answer: "Moving too fast with visible branding created pushback from skeptics in the community"
wrong_answers:
  - "The billboards attracted government regulators who imposed new restrictions on Bitcoin use in the town"
  - "Competing cryptocurrency projects used the same advertising spaces, which confused potential adopters"
  - "The cost of billboard advertising drained the community fund and left no budget for education programs"
explanation: >-
  The chapter lists "moving too fast" as one of the approaches that does not work. In Witsand, aggressive branding and billboards created resistance from skeptics. The lesson is to go at the community's pace, not yours. This contrasts with the patience principle, where Edwin spent two years getting just two merchants before adoption accelerated. **Forcing visibility before building understanding generates opposition rather than interest.**
