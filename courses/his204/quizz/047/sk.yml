question: Prečo François Quesnay býval vo Versailles, v medziposchodí apartmánu Madame de Pompadour?
answer: Bol jej osobným lekárom
wrong_answers:
  - Bol jedným z jej favoritov
  - Hľadal u nej ochranu a výhody
  - Bol jej finančným poradcom
explanation: |
  Quesnay bol osobným lekárom Madame de Pompadour, čo mu dalo privilegovaný prístup na dvor a umožnilo mu ovplyvňovať politické rozhodnutia.
