question: "为什么本课程把 Bitcoin 描述为一种反对国家货币的市场货币，而不是右翼或左翼项目？"
answer: "因为 Bitcoin 是一种自愿采用、难以生产、去中心化且能保值的货币，与强制性、中心化且会失去价值的法定货币形成对照，因此分野在于市场与国家，而不是政治意识形态"
wrong_answers:
  - "因为 Bitcoin 由一位匿名开发者创造，他刻意避免就其预期目的或哲学发表任何政治声明"
  - "因为 Bitcoin 的挖矿算法确保新币平等分配给所有政党，防止货币体系中出现任何意识形态偏向"
  - "因为 Bitcoin 的功能与现有法定货币完全相同，只是运行在一个更快的支付网络上，因此政治区分无关紧要"
explanation: >-
  Bitcoin 被描述为一场反对货币政治化的和平反抗。国家货币或法定货币是一种强制性、中心化且倾向于失去价值的体系。市场货币，历史上是黄金、当前是 Bitcoin，是一种健康、难以生产、以自愿方式产生并在长期保值的货币。真正的对立不是左与右，而是市场与国家，这使 Bitcoin 成为一种超越传统意识形态阵营的政治断裂。
reviewed: false
