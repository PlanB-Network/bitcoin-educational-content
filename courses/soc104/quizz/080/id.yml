question: "Apa perbedaan utama antara pro-bisnis dan pro-pasar?"
answer: "Pendukung pro-bisnis mencari intervensi negara untuk melindungi perusahaan tertentu dari kegagalan, sementara pendukung pro-pasar mendukung deregulasi dan membiarkan bisnis gagal agar pasar dapat mereorganisasi diri secara alami"
wrong_answers:
  - "Pendukung pro-bisnis berfokus pada korporasi besar sementara pendukung pro-pasar berfokus secara eksklusif pada dukungan untuk usaha kecil dan startup"
  - "Pro-bisnis adalah posisi sayap kiri yang mendukung koperasi pekerja sementara pro-pasar adalah posisi sayap kanan yang mendukung kepemilikan privat"
  - "Pendukung pro-bisnis menolak semua kompetisi sementara pendukung pro-pasar mendukung kompetisi yang diatur pemerintah antara perusahaan yang disetujui"
explanation: >-
  Posisi pro-bisnis memandang kompetisi sebagai instrumen tata kelola yang diperoleh melalui regulasi dan membenarkan subsidi serta bailout untuk mencegah kehilangan pekerjaan. Dalam pandangan pro-bisnis, pasar itu rapuh dan membutuhkan penyelamatan negara. Pendukung pro-pasar melihat kompetisi sebagai hasil alami dari usaha bebas, yang menyiratkan deregulasi dan pembiaran bisnis untuk gagal, karena kegagalan memungkinkan pasar mereorganisasi diri secara alami dan membuka medan bagi aktor yang lebih mampu.
