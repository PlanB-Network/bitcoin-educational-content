question: Simplicity 표현식은 왜 tree가 아니라 DAG로 직렬화되나요?
answer: 공유 하위 표현식이 한 번만 저장되므로 지수적 증가를 방지하기 위해서입니다.
wrong_answers:
  - 일반 tree 구조는 조건부 분기를 전혀 표현할 수 없기 때문입니다.
  - 여러 별도 multi-core 프로세서에 걸친 병렬 실행을 가능하게 하기 위해서입니다.
  - Liquid Network 프로토콜이 여기서 DAG 형식을 엄격히 의무화하기 때문입니다.
explanation: >-
  Simplicity 표현식은 자연스럽게 tree를 이루며, 복잡도가 증가할수록 지수적으로
  커질 수 있습니다. 방향성 비순환 그래프(DAG)로 직렬화하면, 여러 번 나타나는
  하위 표현식은 한 번 저장되고 여러 부모가 참조합니다. 이렇게 하면 실제 프로그램
  크기가 지수적이 아니라 선형적으로 증가합니다.
reviewed: false
