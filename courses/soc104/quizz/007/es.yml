question: "En el diamante de Nolan, ¿qué posición se sitúa arriba y representa la máxima libertad?"
answer: "El libertarismo, que apoya la mayor libertad económica y personal"
wrong_answers:
  - "El conservadurismo, que apoya los valores tradicionales y la libertad económica"
  - "El centrismo, que equilibra todas las posiciones políticas de forma pragmática"
  - "El socialismo, que apoya la libertad personal y la igualdad social"
explanation: >-
  El libertarismo ocupa la parte superior del diamante de Nolan como opuesto al estatismo. Representa a quienes apoyan el mayor grado de libertad tanto económica como personal. El conservadurismo se sitúa a la derecha (alta libertad económica, baja libertad personal), el socialismo a la izquierda (alta libertad personal, baja libertad económica) y el centrismo en el centro.
reviewed: false
