question: Simplicity 排除了無界遞迴。它為無界迭代所預期採用的替代方案是什麼？
answer: 遞迴契約，將運算分散到多筆交易上，使每筆交易的成本保持可預測。
wrong_answers:
  - 委派功能，專門打造來在單一筆交易內提供一種受計量的無界遞迴形式。
  - 九個核心組合子，其完備性讓一個不動點建構得以編碼任何遞迴函數。
  - 編譯期的迴圈展開，其中靜態分析推斷出最大的迭代次數並複製迴圈主體。
explanation: >-
  文章的主張是：無界迭代更適合以在多筆交易上進行運算的遞迴契約來實作，這避開了區塊空間與標準性的限制，並使交易成本變得可預測。委派只能被濫用來產生某種類似無界遞迴的東西——它並不是所預期採用的機制——而九個核心組合子僅對有限運算是完備的，因此在單一程式內並不存在不動點建構。
reviewed: false
