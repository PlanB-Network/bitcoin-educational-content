question: "Devlet tarafından finanse edilen sosyal yardım programları, yalnızca niyetlere güvenmenin tehlikesini göstererek nasıl ters etkiler üretebilir?"
answer: "Bağımlılık yaratabilir, çalışma teşviklerini ortadan kaldırabilir ve para önce serveti üretenlerden alınmak zorunda olduğu için yağma anlamına gelebilir"
wrong_answers:
  - "Aşırı kişisel tasarrufu teşvik eder, tüketici harcamalarını azaltır ve daha geniş ekonomide deflasyona neden olurlar"
  - "İşgücü maliyetlerini devlete kaydırarak ve rekabetçi ücret ihtiyacını azaltarak özel girişimi güçlendirirler"
  - "Sınıf ayrımlarını o kadar bütünüyle ortadan kaldırırlar ki sosyal hareketlilik gereksiz hale gelir ve inovasyon durgunlaşır"
explanation: >-
  Friedman, cömert niyetlerin insan teşviklerine ilişkin titiz analizi ihmal ettiğinde zararlı sonuçlar doğurabileceği konusunda uyarır. Devlet tarafından finanse edilen yardım programları bağımlılık yaratma, çalışmak için hiçbir teşvik üretmeme ve fonların önce servet üreticilerinden alınmak zorunda olması nedeniyle bir tür yağma oluşturma riski taşır. Yoksulluğun azaltılması ve verimlilik gibi ölçülebilir sonuçlar, yüce niyetlerin önüne geçmelidir.
