question: "Mitä Kantin motto 'Sapere aude' rohkaisee ihmisiä tekemään?"
answer: "Uskaltamaan ajatella itse ja poistumaan alaikäisyyden tilasta, jossa he ovat riippuvaisia ylemmän auktoriteetin ohjauksesta"
wrong_answers:
  - "Tavoittelemaan akateemista tietoa ilmoittautumalla muodollisiin oppilaitoksiin ja hankkimalla tutkintoja"
  - "Haastamaan kaikki moraalin muodot ja luomaan täysin uusia eettisiä järjestelmiä henkilökohtaisen halun pohjalta"
  - "Etsimään viisautta uskonnollisen hartauden ja kirkon opetuksille alistumisen kautta"
explanation: >-
  Sapere aude, joka tarkoittaa "Uskalla ajatella itse", oli Kantin runoilija Horatiukselta ottama ja valistuksen motoksi tekemä ilmaus. Se symboloi poistumista alaikäisyydestä, tilasta, jossa ihmiset eivät kykene käyttämään ymmärrystään ilman ylemmän luokan tai auktoriteetin ohjausta. Kant rohkaisee emansipaatioon ja täyden vastuun ottamiseen omasta ajattelusta.
