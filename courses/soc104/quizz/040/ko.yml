question: "국가 재원 사회부조 프로그램은 어떻게 역효과를 낳아, 의도에만 의존하는 위험을 보여줄 수 있나요?"
answer: "의존을 만들고, 일할 유인을 없애며, 돈이 먼저 부를 생산한 사람들에게서 가져와져야 하므로 수탈에 해당할 수 있습니다"
wrong_answers:
  - "과도한 개인 저축을 장려하고 소비 지출을 줄이며 더 넓은 경제에서 디플레이션을 일으킵니다"
  - "노동 비용을 정부로 이전하고 경쟁적 임금의 필요성을 줄임으로써 민간 기업을 강화합니다"
  - "계급 구분을 너무 철저히 없애 사회적 이동성이 불필요해지고 혁신이 정체됩니다"
explanation: >-
  Friedman은 관대한 의도가 인간의 인센티브에 대한 엄밀한 분석을 소홀히 할 때 해로운 결과를 낳을 수 있다고 경고합니다. 국가 재원 지원 프로그램은 의존을 만들고, 일할 유인을 낳지 않으며, 자금이 먼저 부의 생산자들에게서 가져와져야 하므로 일종의 수탈을 구성할 위험이 있습니다. 빈곤 감소와 효율성 같은 측정 가능한 결과가 고귀한 의도보다 우선해야 합니다.
