question: "Care sunt valorile cardinale ale centrismului?"
answer: "Moderația, compromisul, adaptarea și utilitatea publică"
wrong_answers:
  - "Tradiția, ordinea, autoritatea și identitatea națională"
  - "Libertatea, proprietatea privată, consimțământul și responsabilitatea individuală"
  - "Egalitatea, dreptatea socială, solidaritatea și proprietatea colectivă"
explanation: >-
  Valorile cardinale ale centrismului sunt moderația, compromisul, adaptarea și utilitatea publică. Acestea reflectă accentul centrist pe echilibrul pragmatic, mai degrabă decât pe angajamentul ideologic. Celelalte opțiuni descriu valorile cardinale ale conservatorismului, libertarianismului și, respectiv, socialismului.
