question: "Warum gelten intentionale Definitionen politischer Systeme für analytische Zwecke als problematisch?"
answer: "Sie schaffen begriffliche Verwirrung, weil alle Systeme behaupten, ähnliche Ziele wie Gerechtigkeit, Gleichheit und Freiheit zu verfolgen"
wrong_answers:
  - "Sie sind zu präzise und starr und lassen keinen Raum für die natürliche Entwicklung politischer Bewegungen im Laufe der Zeit"
  - "Sie konzentrieren sich zu stark auf wirtschaftliche Ergebnisse und ignorieren die kulturellen und sozialen Dimensionen des politischen Lebens"
  - "Sie stützen sich auf geheime Regierungsdokumente, die unabhängigen Forschern selten zur Verfügung stehen"
explanation: >-
  Intentionale Definitionen stützen sich auf erklärte Motivationen und Ziele, aber jedes politische System behauptet, Gerechtigkeit, Gleichheit und Freiheit zu verfolgen. Dadurch lassen sich Systeme nicht voneinander unterscheiden. Die strukturelle Analyse bewertet Systeme dagegen anhand ihrer empirischen, messbaren Folgen und der Mittel, die sie einsetzen, und enthüllt so ihre wahre Natur jenseits der Rhetorik.
