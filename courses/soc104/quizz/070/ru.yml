question: "Во всех пяти общественных дебатах (брак, иммиграция, огнестрельное оружие, наркотики, сладкие напитки) какая повторяющаяся аналитическая рамка формирует социалистическую позицию по каждому вопросу?"
answer: "Рамка конфликта между господствующими и подчинёнными, где общество структурировано угнетением, а государство должно вмешиваться для защиты уязвимой группы"
wrong_answers:
  - "Утилитаристская рамка, сосредоточенная на максимизации общего счастья и экономической продуктивности для наибольшего числа граждан"
  - "Рамка естественных прав, в которой индивидуальные свободы должны быть защищены как от государственного, так и от корпоративного вмешательства"
  - "Традиционалистская рамка, в которой сложившиеся социальные институты должны сохраняться перед лицом разрушительных современных изменений"
explanation: >-
  Социалистическая позиция во всех общественных дебатах последовательно формируется рамкой конфликта между господствующими и подчинёнными. В вопросе брака это гетеросексуальное большинство, угнетающее гомосексуальное меньшинство. В вопросе иммиграции ограничения по национальному признаку являются формами угнетения. В вопросе огнестрельного оружия только государство должно обладать силой для защиты уязвимых. В вопросе сладких напитков промышленники извлекают прибыль из уязвимости наименее защищённых. Эта оптика угнетателя и угнетённого воспроизводится во множестве областей, включая гендер, расу и даже отношения между человечеством и природой.
reviewed: false
