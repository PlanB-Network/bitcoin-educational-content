question: "Что раскрывает декларация Муссолини 1920 года 'Всё в государстве, ничего вне государства, ничего против государства' о тоталитаризме?"
answer: "Больше не существует разделения между публичным и частным пространством, поскольку государство полностью поглощает общество"
wrong_answers:
  - "Государство сосредоточено исключительно на военной мощи, оставляя экономику частному предпринимательству"
  - "Граждане свободны организовываться частным образом, пока они открыто не критикуют правительство"
  - "Правительство контролирует только политическую деятельность, тогда как культурная и религиозная жизнь остаются автономными"
explanation: >-
  Декларация Муссолини выражает сущность тоталитаризма: тотальность. Всё поглощается государством, что означает отсутствие разделения между публичным и частным пространством. Общество утрачивает всякую форму автономии, вплоть до самых повседневных занятий вроде открытия спортивного клуба. Это выходит далеко за пределы контроля только военной, политической или экономической сфер.
reviewed: false
