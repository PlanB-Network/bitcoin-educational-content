question: "Programu za msaada wa kijamii zinazofadhiliwa na dola zinawezaje kuzalisha athari potovu, zikionyesha hatari ya kutegemea nia pekee?"
answer: "Zinaweza kuunda utegemezi, kuondoa motisha ya kufanya kazi, na kuwa sawa na uporaji kwa kuwa pesa lazima kwanza zichukuliwe kutoka kwa wale waliozalisha utajiri"
wrong_answers:
  - "Huhimiza akiba binafsi iliyopitiliza, hupunguza matumizi ya walaji, na husababisha deflation katika uchumi mpana"
  - "Huimarisha biashara binafsi kwa kuhamisha gharama za kazi kwa serikali na kupunguza hitaji la mishahara ya ushindani"
  - "Huondoa tofauti za kitabaka kwa ukamilifu kiasi kwamba uhamaji wa kijamii huwa usiohitajika na ubunifu hukwama"
explanation: >-
  Friedman anaonya kwamba nia za ukarimu zinaweza kuzalisha matokeo yenye madhara zinapopuuza uchambuzi makini wa motisha za binadamu. Programu za msaada zinazofadhiliwa na dola huhatarisha kuunda utegemezi, kutozalisha motisha ya kufanya kazi, na kutengeneza aina ya uporaji kwa kuwa fedha lazima kwanza zichukuliwe kutoka kwa wazalishaji wa utajiri. Matokeo yanayopimika kama kupunguza umaskini na ufanisi lazima yatangulie nia njema.
