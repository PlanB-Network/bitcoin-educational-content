question: "Como todos os regimes totalitários chegaram ao poder?"
answer: "Por meio de uma revolução violenta que justificou fazer tábula rasa do sistema anterior"
wrong_answers:
  - "Por meio de reforma legislativa gradual dentro das instituições democráticas existentes"
  - "Por meio de golpes militares organizados por potências estrangeiras em busca de controle regional"
  - "Por meio de movimentos de massa pacíficos que venceram eleições populares por amplas margens"
explanation: >-
  Todos os regimes totalitários chegaram ao poder por meio de uma revolução violenta. Essa revolução serve a um duplo propósito: destrói fisicamente a antiga ordem e justifica ideologicamente o uso da violência como necessário para construir a nova sociedade. Isso distingue as tomadas totalitárias do poder das transições democráticas, dos golpes apoiados por estrangeiros ou das vitórias eleitorais pacíficas.
