question: "Kuidas käsitleb sotsialism vabadusi ühiskondlikus ja majanduslikus sfääris erinevalt?"
answer: "Sotsialism soosib tugevaid vabadusi ühiskondlikus sfääris, kuid nõrku vabadusi majanduslikus sfääris"
wrong_answers:
  - "Sotsialism piirab kõiki vabadusi võrdselt nii ühiskondlikus kui ka majanduslikus sfääris"
  - "Sotsialism soosib tugevaid majanduslikke vabadusi, kuid piirab ühiskondlikke vabadusi sotsiaalse korra säilitamiseks"
  - "Sotsialism annab mõlemas sfääris piiramatud vabadused ja tugineb tasakaalu säilitamiseks vabatahtlikule koostööle"
explanation: >-
  Sotsialistlikus mõtlemises on ühiskondlike ja majanduslike vabaduste vahel põhimõtteline dihhotoomia. Ühiskondlikud vabadused on tugevad, kuid majanduslikud vabadused on nõrgad rõhuasetuse tõttu riiklikule kontrollile, planeerimisele ja rikkuse ümberjaotamisele. Kolmas vale vastus kirjeldab libertariaanlikku ideaali, samas kui teine kirjeldab konservatiivset mustrit, mis on sotsialismi peegelpilt.
