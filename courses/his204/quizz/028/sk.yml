question: Aký mal byť podľa koncepcie markíza d'Argensona štát?
answer: Minimálny štát, ktorý musí zabezpečovať bezpečnosť, spravodlivosť, menu a infraštruktúru
wrong_answers:
  - Ochranársky štát, ktorý chráni obchodníkov a remeselníkov
  - Štát nemá žiadnu legitimitu; nesmie poskytovať žiadne služby
  - Intervencionistický štát, ktorý musí regulovať všetky aspekty hospodárskeho života
explanation: |
  Markíz d'Argenson bol za minimálny štát, ktorý sa obmedzuje na základné funkcie ako bezpečnosť, spravodlivosť, mena a infraštruktúra. Veril, že štát má nechať jednotlivcom slobodu konať v hospodárskej oblasti.
