question: "為什麼貨幣通膨被描述為未經公民同意而徵收的隱形稅？"
answer: "因為政府創造貨幣會讓貨幣貶值，使人們用同樣金額能買到的東西變少，但多數人沒有意識到價格上漲反映的是政府政策，而不是自然的市場力量"
wrong_answers:
  - "因為中央銀行祕密對每一筆透過銀行系統處理的交易收費，卻不向帳戶持有人揭露"
  - "因為政府印鈔並只分配給富人，同時透過必需品更高的銷售稅向窮人課稅"
  - "因為通膨是由私人企業為增加利潤而提高價格造成的，這等同於對消費者徵收非正式稅"
explanation: >-
  向系統注入貨幣會轉化為貨幣貶值，也就是同樣金額能買到的東西變少，因為新貨幣並不反映真正的經濟成長。多數人看不見是政府政策導致價格上漲，而價格上漲只是貨幣貶值的反映。這等同於合法竊取與制度化掠奪，使中產階級變窮，同時富人則透過投機性資產取得新貨幣。
reviewed: false
