question: Liquid Network上で使われるBitcoinは、何と呼ばれていますか？
answer: Liquid Bitcoin（LBTC）
wrong_answers:
  - Wrapped Bitcoin（WBTC）
  - Sidechain Bitcoin（SBTC）
  - Federated Bitcoin（FBTC）
explanation: |
  Liquidサイドチェーン上に存在するBitcoinの正しい名称は、Liquid Bitcoin（LBTC）です。ユーザーがBitcoinをLiquidにペグインすると、Liquid Network内のトランザクションに使える同額のLBTCを受け取ります。WBTCはEthereum上のBitcoinトークンであり、SBTCとFBTCは主要なネットワークで実際に使われているBitcoinの表現ではありません。