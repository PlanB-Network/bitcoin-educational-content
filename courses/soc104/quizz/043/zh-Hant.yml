question: "社會主義如何在社會領域與經濟領域中差異化地對待自由？"
answer: "社會主義在社會領域偏好強自由，但在經濟領域偏好弱自由"
wrong_answers:
  - "社會主義在社會與經濟兩個領域同等限制所有自由"
  - "社會主義偏好強經濟自由，但限制社會自由以維持社會秩序"
  - "社會主義在兩個領域都給予不受限制的自由，並依賴自願合作來維持平衡"
explanation: >-
  在社會主義思想中，社會自由與經濟自由之間存在根本二分。社會自由很強，但由於強調國家控制、規劃與財富再分配，經濟自由很弱。第三個錯誤答案描述的是自由意志主義理想，而第二個描述的是保守主義模式，這是社會主義的鏡像。
reviewed: false
