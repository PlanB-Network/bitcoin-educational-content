question: Assignats නිර්මාණය කල් දැමීම සඳහා Dupont de Nemours දෙන හේතුව කුමක්ද?
answer: Assignats මිල ඉහළ නංවනු ඇත
wrong_answers:
  - ආක්‍රමණශීලී යුද්ධ පැවැත්වීමට Assignats භාවිතා කරනු ඇත
  - Assignats විදේශීය ප්‍රාග්ධනය විනාශ කරනු ඇත
  - Assignats යනු දේපළ අයිතිවාසිකම් උල්ලංඝනය කිරීමකි
explanation: |
  ජාතික සභාව විසින් නිකුත් කළ කඩදාසි මුදලක් වූ assignats නිසා ඇතිවන උද්ධමනය Dupont de Nemours බිය විය. මෙම උද්ධමනය ප්‍රංශ ආර්ථිකය විනාශ කරනු ඇතැයි ඔහු විශ්වාස කළේය.