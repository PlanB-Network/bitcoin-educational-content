question: "Vì sao khóa học mô tả Bitcoin là một đồng tiền thị trường đối lập với tiền nhà nước, thay vì một dự án cánh hữu hay cánh tả?"
answer: "Vì Bitcoin là một đồng tiền được chấp nhận tự nguyện, khó sản xuất, phi tập trung và giữ được giá trị, tương phản với tiền pháp định mang tính cưỡng chế, tập trung và mất giá, khiến sự phân chia nằm ở thị trường đối lập nhà nước hơn là hệ tư tưởng chính trị"
wrong_answers:
  - "Vì Bitcoin được tạo ra bởi một nhà phát triển ẩn danh cố ý tránh đưa ra bất kỳ tuyên bố chính trị nào về mục đích hoặc triết lý dự định của nó"
  - "Vì thuật toán đào của Bitcoin bảo đảm phân phối đồng coin mới ngang bằng cho tất cả các đảng chính trị, ngăn mọi thiên kiến hệ tư tưởng trong hệ thống tiền tệ"
  - "Vì Bitcoin vận hành giống hệt các đồng tiền pháp định hiện có nhưng hoạt động trên một mạng thanh toán nhanh hơn, khiến các phân biệt chính trị trở nên không liên quan"
explanation: >-
  Bitcoin được mô tả như một cuộc nổi dậy hòa bình chống lại việc chính trị hóa tiền. Tiền nhà nước hay tiền pháp định là một hệ thống cưỡng chế, tập trung, có xu hướng mất giá. Tiền thị trường, trong lịch sử là vàng và hiện nay là Bitcoin, là đồng tiền lành mạnh, khó sản xuất, xuất hiện một cách tự nguyện và giữ giá trị trong dài hạn. Sự đối lập thực sự không phải là tả đối lập hữu mà là thị trường đối lập nhà nước, khiến Bitcoin trở thành một đứt gãy chính trị vượt qua các phe hệ tư tưởng truyền thống.
