explanation: >-
  Формула "Cypherpunks write code" отражает приверженность движения активному вмешательству, а не простой надежде. Для Эрика Хьюза путь к свободе проходит через активное построение анонимных систем, которые делают произвольные политические разделения несущественными. Код становится фундаментальным инструментом для превращения абстрактных идей свободы в реальность, поэтому Сатоши Накамото написал весь код Bitcoin ещё до того, как написал white paper.
