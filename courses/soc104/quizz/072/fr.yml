question: "Quelle est la position socialiste sur la santé ?"
answer: "L'accès aux soins de santé est un droit fondamental, et l'État doit garantir un système universel financé publiquement pour tous, quel que soit le revenu"
wrong_answers:
  - "La santé devrait être un système mixte avec une couverture de base assurée par l'État, complétée par des options d'assurance privée"
  - "Les marchés privés fournissent des soins de santé plus innovants, donc les individus devraient choisir librement leur propre système"
  - "L'État devrait fournir des soins de santé uniquement aux citoyens les plus pauvres, tandis que l'assurance privée couvrirait tous les autres"
explanation: >-
  Pour les socialistes, l'accès aux soins de santé est un droit fondamental, et non une marchandise. L'État doit garantir un système de santé universel financé publiquement afin que chacun ait accès aux soins, quel que soit son revenu. Cela reflète la préoccupation socialiste pour l'égalité, la justice sociale et l'importance de l'État dans l'organisation des services d'intérêt général. Le système mixte décrit la vision centriste, tandis que les approches fondées sur le choix reflètent les positions libertarienne et conservatrice.
reviewed: false
