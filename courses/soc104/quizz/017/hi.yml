question: "सांस्कृतिक रूढ़िवाद क्या है?"
answer: "अतीत से विरासत में मिले पारिवारिक, नैतिक, सौंदर्यात्मक और तत्त्वमीमांसात्मक मूल्यों के प्रति व्यक्तिगत निष्ठा, कोई राजनीतिक दर्शन नहीं"
wrong_answers:
  - "एक राजनीतिक विचारधारा जो कानून बनाकर पूरे समाज पर पारंपरिक मूल्यों को थोपने के लिए राज्य-शक्ति का उपयोग करती है"
  - "एक आंदोलन जो आधुनिकता के सभी रूपों को अस्वीकार करता है और समाज को पूर्व-औद्योगिक जीवन-पद्धति में लौटाना चाहता है"
  - "एक आर्थिक सिद्धांत जो राष्ट्रीय उद्योगों की रक्षा करता है और विदेशी देशों के साथ मुक्त व्यापार का विरोध करता है"
explanation: >-
  सांस्कृतिक रूढ़िवाद को जीवन-बुद्धि के रूप में परिभाषित किया जाता है: अतीत से विरासत में मिले पारिवारिक, नैतिक, सौंदर्यात्मक और तत्त्वमीमांसात्मक मूल्यों के प्रति व्यक्तिगत निष्ठा, चाहे वे Greco-Roman हों या Judeo-Christian। यह स्पष्ट रूप से कोई राजनीतिक दर्शन नहीं है। यह राजनीतिक रूढ़िवाद से अलग है, जिसका लक्ष्य राज्य-शक्ति के माध्यम से राजनीतिक संस्थाओं और सामाजिक व्यवस्था को संरक्षित रखना है। यह आधुनिकता को अस्वीकार करने या आर्थिक संरक्षणवाद के बारे में भी नहीं है।
