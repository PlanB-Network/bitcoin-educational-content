question: "Karl Marx วางความแตกต่างระหว่างสังคมนิยมยูโทเปียกับสังคมนิยมวิทยาศาสตร์ไว้อย่างไร?"
answer: "เขากล่าวหาสังคมนิยมฝรั่งเศสยุคต้นว่าเสนอทางออกในจินตนาการ ขณะที่สังคมนิยมวิทยาศาสตร์ของเขาตั้งอยู่บนวัตถุนิยมประวัติศาสตร์และการต่อสู้ทางชนชั้น"
wrong_answers:
  - "เขาโต้แย้งว่าสังคมนิยมยูโทเปียมุ่งเน้นเศรษฐศาสตร์มากเกินไป ขณะที่สังคมนิยมวิทยาศาสตร์ให้ความสำคัญกับการเปลี่ยนแปลงทางวัฒนธรรมและศิลปะ"
  - "เขาชื่นชมสังคมนิยมยูโทเปียสำหรับการทดลองเชิงปฏิบัติ และวิจารณ์สังคมนิยมวิทยาศาสตร์ว่าเป็นนามธรรมและทฤษฎีเกินไป"
  - "เขาอ้างว่าสังคมนิยมยูโทเปียใช้ความรุนแรงและเป็นปฏิวัติ ขณะที่สังคมนิยมวิทยาศาสตร์สนับสนุนการปฏิรูปประชาธิปไตยอย่างสันติ"
explanation: >-
  Marx กล่าวหาสังคมนิยมฝรั่งเศสยุคต้นอย่าง Proudhon, Saint-Simon และ Fourier ว่าเป็นยูโทเปียนที่เสนอทางออกในจินตนาการล้วน ๆ สังคมนิยมวิทยาศาสตร์ของเขาตั้งอยู่บนวัตถุนิยมประวัติศาสตร์: แนวคิดที่ว่าประวัติศาสตร์ก้าวหน้าผ่านการต่อสู้ทางชนชั้นและการครอบครองปัจจัยการผลิต โดยตัวแทนทางวัฒนธรรมทั้งหมดถูกกำหนดโดยพลังการผลิตและความสัมพันธ์การผลิต
reviewed: false
