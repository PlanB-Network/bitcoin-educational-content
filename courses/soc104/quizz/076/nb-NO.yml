question: "I Gustave de Molinaris dialoger fra 1849, hvilken figur forsvarer frihet som et grunnleggende prinsipp i stedet for å underordne den andre mål?"
answer: "Økonomen, som behandler frihet som et prinsipp som ikke er underordnet noe annet mål"
wrong_answers:
  - "Sosialisten, som forsvarer frihet gjennom progressive reformer rettet mot sosial likhet"
  - "Den konservative, som opprettholder frihet ved å bevare tradisjonell sosial orden og stabilitet"
  - "Alle tre figurene forsvarer frihet likt, men er uenige om hvordan den skal gjennomføres"
explanation: >-
  I Molinaris dialoger fra Les Soirees de la rue Saint-Lazare står økonomen i permanent uenighet med både sosialisten og den konservative. Han er den eneste som forsvarer frihet som et grunnleggende prinsipp. Sosialisten underordner frihet progressive idealer, og den konservative underordner den bevaring av orden, noe som gjør økonomen unik i sitt ubetingede forsvar av frihet.
reviewed: false
