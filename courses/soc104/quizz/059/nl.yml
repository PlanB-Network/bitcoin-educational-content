question: "Welke verborgen paradox ligt in centristisch pragmatisme?"
answer: "Het pragmatisme zelf rust op een vorm van dogmatisme, namelijk de onuitgesproken overtuiging dat alleen experts competent zijn om de samenleving te sturen"
wrong_answers:
  - "Centristen beweren gematigd te zijn maar sluiten zich in coalitieregeringen consequent aan bij linkse partijen"
  - "Centristisch beleid lijkt evenwichtig maar geeft altijd voorrang aan economische groei boven milieubescherming"
  - "Centristen verwerpen ideologie maar nemen rigide vrijemarktprincipes over wanneer zij economische beslissingen nemen"
explanation: >-
  De paradox van centristisch pragmatisme is dat het beweert ideologie te verwerpen ten gunste van rationele expertise, maar dat juist deze claim rust op een onzichtbaar en onuitgesproken dogma: dat alleen technocraten in staat zijn de juiste beslissingen te nemen. Deze overtuiging dat alleen experts de samenleving zouden moeten sturen, is zelf een ideologische toewijding, ook al erkennen centristen haar niet als zodanig.
reviewed: false
