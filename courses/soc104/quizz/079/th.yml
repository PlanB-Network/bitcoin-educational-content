question: "ในบทสนทนาปี 1849 ของ Gustave de Molinari ตัวละครใดปกป้องเสรีภาพในฐานะหลักการพื้นฐาน แทนที่จะทำให้มันอยู่ใต้เป้าหมายอื่น?"
answer: "นักเศรษฐศาสตร์ ผู้ถือว่าเสรีภาพเป็นหลักการที่ไม่อยู่ใต้เป้าหมายอื่นใด"
wrong_answers:
  - "ฝ่ายสังคมนิยม ผู้ปกป้องเสรีภาพผ่านการปฏิรูปก้าวหน้าที่มุ่งสู่ความเท่าเทียมทางสังคม"
  - "ฝ่ายอนุรักษนิยม ผู้ธำรงเสรีภาพด้วยการรักษาระเบียบและเสถียรภาพทางสังคมแบบดั้งเดิม"
  - "ตัวละครทั้งสามปกป้องเสรีภาพเท่า ๆ กัน แต่ไม่เห็นด้วยกันว่าจะนำไปปฏิบัติอย่างไร"
explanation: >-
  ในบทสนทนาของ Molinari จาก Les Soirees de la rue Saint-Lazare นักเศรษฐศาสตร์อยู่ในความขัดแย้งถาวรกับทั้งฝ่ายสังคมนิยมและฝ่ายอนุรักษนิยม เขาเป็นคนเดียวที่ปกป้องเสรีภาพในฐานะหลักการพื้นฐาน ฝ่ายสังคมนิยมทำให้เสรีภาพอยู่ใต้อุดมคติก้าวหน้า และฝ่ายอนุรักษนิยมทำให้มันอยู่ใต้การรักษาระเบียบ จึงทำให้นักเศรษฐศาสตร์มีลักษณะเฉพาะในการปกป้องเสรีภาพอย่างไม่มีเงื่อนไข
reviewed: false
