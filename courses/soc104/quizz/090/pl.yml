question: "Dlaczego Popper twierdzi, że społeczeństwo otwarte pozostaje z natury kruche mimo swoich zalet?"
answer: "Ponieważ odpowiedzialność, którą implikuje indywidualizm, może wydawać się przerażająca, tworząc pokusę szukania schronienia w ochronie wspólnotowej, autorytecie albo nostalgii za wyidealizowaną przeszłością"
wrong_answers:
  - "Ponieważ społeczeństwa otwarte nie mają siły militarnej i nie mogą bronić się przed inwazją społeczeństw zamkniętych"
  - "Ponieważ instytucje demokratyczne są z natury nieefektywne i ostatecznie załamują się pod ciężarem biurokratycznej złożoności"
  - "Ponieważ społeczeństwa otwarte dopuszczają zbyt dużą nierówność gospodarczą, co nieuchronnie prowadzi do rewolucji i ustanowienia reżimów autorytarnych"
explanation: >-
  Popper podkreśla, że kruchość społeczeństwa otwartego wynika z psychologicznej podatności. Odpowiedzialność, którą implikuje indywidualizm, może wydawać się przerażająca i ryzykowna, ponieważ trzeba dokonywać własnych wyborów i można ponieść porażkę. Tworzy to pokusę szukania schronienia w ochronie wspólnotowej albo nostalgicznych tendencjach ku wyidealizowanej przeszłości. Społeczeństwo otwarte stoi wobec ciągłych wyzwań ze strony impulsów komunitariańskich i powracającej pokusy przemocy.
reviewed: false
