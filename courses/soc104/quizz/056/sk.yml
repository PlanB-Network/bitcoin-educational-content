question: "Aké sú základné hodnoty centrizmu?"
answer: "Umiernenosť, kompromis, adaptácia a verejný úžitok"
wrong_answers:
  - "Tradícia, poriadok, autorita a národná identita"
  - "Sloboda, súkromné vlastníctvo, súhlas a individuálna zodpovednosť"
  - "Rovnosť, sociálna spravodlivosť, solidarita a kolektívne vlastníctvo"
explanation: >-
  Základnými hodnotami centrizmu sú umiernenosť, kompromis, adaptácia a verejný úžitok. Odrážajú centristický dôraz na pragmatickú rovnováhu, nie na ideologický záväzok. Ostatné možnosti opisujú základné hodnoty konzervatizmu, libertarianizmu a socializmu.
