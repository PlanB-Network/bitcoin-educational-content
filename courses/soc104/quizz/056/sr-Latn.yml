question: "Koja je ključna razlika između minarhista i anarho-kapitalista unutar libertarijanizma?"
answer: "Minarhisti prihvataju minimalnu državu za odbranu, pravosuđe i policiju, dok anarho-kapitalisti žele da sve državne funkcije budu privatizovane"
wrong_answers:
  - "Minarhisti odbacuju sve oblike vlasti, dok anarho-kapitalisti prihvataju ograničenu državnu regulaciju tržišta"
  - "Minarhisti favorizuju progresivno oporezivanje za osnovne usluge, dok se anarho-kapitalisti protive svakom oporezivanju"
  - "Minarhisti se usredsređuju samo na ekonomsku slobodu, dok anarho-kapitalisti brane i ekonomske i društvene slobode"
explanation: >-
  Minarhisti veruju da država treba da bude ograničena na osnovne funkcije kao što su odbrana, pravosuđe i policija ("država noćni čuvar"), dok anarho-kapitalisti tvrde da čak i te funkcije treba privatizovati i njima upravljati kroz dobrovoljnu tržišnu konkurenciju. Njihovo neslaganje više se tiče praktične primene nego temeljnih etičkih principa. Obe struje dele iste libertarijanske vrednosti samovlasništva i nenapadanja.
