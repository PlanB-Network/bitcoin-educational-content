question: "Why, according to the course, are monarchies less inflationary than democracies?"
answer: "Monarchies were tied to property and gold-based money, while democracies run fiat money and expanding public domains."
wrong_answers:
  - "Because kings were better economists than presidents."
  - "Because monarchies had no armies to finance."
  - "Because inflation had not been invented before 1900."
explanation: |
  Monarchy's constitutional principle is respect for (aristocratic) property, and its gold-based systems even produced deflationary periods — falling prices and rising real wages — almost inconceivable under modern fiat democracy.
reviewed: false
