question: "Šta Mussolinijeva izjava iz 1920. „Sve u Državi, ništa izvan Države, ništa protiv Države” otkriva o totalitarizmu?"
answer: "Da više nema nikakvog razdvajanja između javnog i privatnog prostora, jer država potpuno apsorbuje društvo"
wrong_answers:
  - "Država se fokusira isključivo na vojnu moć, dok ekonomiju prepušta privatnom preduzetništvu"
  - "Građani su slobodni da se privatno organizuju sve dok otvoreno ne kritikuju vladu"
  - "Vlada kontroliše samo političku aktivnost, dok kulturni i verski život ostaju autonomni"
explanation: >-
  Mussolinijeva izjava hvata suštinu totalitarizma: totalitet. Sve je apsorbovano u državu, što znači da nema razdvajanja između javnog i privatnog prostora. Društvo gubi svaki oblik autonomije, sve do najobičnijih aktivnosti poput otvaranja sportskog kluba. To ide mnogo dalje od kontrole samo vojnih, političkih ili ekonomskih sfera.
reviewed: false
