question: "Aké rozlíšenie urobil Karl Marx medzi utopickým socializmom a vedeckým socializmom?"
answer: "Raných francúzskych socialistov obvinil z navrhovania imaginárnych riešení, zatiaľ čo jeho vedecký socializmus bol založený na historickom materializme a triednom boji"
wrong_answers:
  - "Tvrdil, že utopický socializmus sa príliš zameriaval na ekonomiku, zatiaľ čo vedecký socializmus uprednostňoval kultúrnu a umeleckú transformáciu"
  - "Chválil utopických socialistov za ich praktické experimenty a kritizoval vedecký socializmus za prílišnú abstraktnosť a teoretickosť"
  - "Tvrdil, že utopický socializmus bol násilný a revolučný, zatiaľ čo vedecký socializmus uprednostňoval pokojné demokratické reformy"
explanation: >-
  Marx obvinil raných francúzskych socialistov ako Proudhon, Saint-Simon a Fourier z utopizmu, pretože navrhovali čisto imaginárne riešenia. Jeho vedecký socializmus spočíval na historickom materializme: na myšlienke, že dejiny napredujú prostredníctvom triedneho boja a privlastňovania výrobných prostriedkov, pričom všetky kultúrne reprezentácie sú podmienené výrobnými silami a výrobnými vzťahmi.
reviewed: false
