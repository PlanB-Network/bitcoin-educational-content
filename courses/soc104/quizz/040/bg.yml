question: "Върху какво се фокусира структурната дефиниция на една политическа система?"
answer: "Върху това как системата действително функционира и върху нейните наблюдаеми характеристики, като степента на държавен контрол"
wrong_answers:
  - "Върху заявените цели и благородни намерения, обявени от основателите и лидерите на системата"
  - "Върху историческия произход на политическото движение и биографиите на ключовите му мислители"
  - "Върху броя на разрешените политически партии и честотата на провежданите демократични избори"
explanation: >-
  Структурните дефиниции се фокусират върху това как политическите системи действително функционират и върху техните наблюдаеми характеристики. Например социализмът структурно се характеризира с вездесъщието на държавата. Този подход контрастира с интенционалните дефиниции, които разчитат на заявени мотивации и цели. Структурният подход позволява по-обективна оценка въз основа на измерими резултати.
reviewed: false
