question: "诺兰图上个人自由轴的底部有什么特征？"
answer: "偏好秩序、安全、传统价值观，以及国家规范道德并维护公共秩序"
wrong_answers:
  - "偏好个人自主、宽容，以及国家对个人生活选择的最小干预"
  - "偏好经济解除监管、自由贸易，以及废除关税与补贴"
  - "偏好财富重新分配、高税收，以及关键产业国有化"
explanation: >-
  个人自由轴的底部代表国家对个人生活的最大控制，其特征是偏好秩序、安全与传统价值观。国家规范道德、维护公共秩序，并可能捍卫某种特定的道德或传统愿景。轴的顶端代表相反面：个人自由与宽容。经济政策则由独立的横轴衡量。
