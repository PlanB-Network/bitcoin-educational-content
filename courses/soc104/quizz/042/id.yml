question: "Apa arti istilah 'holism' dalam konteks filsafat sosialis?"
answer: "Sebuah visi tentang masyarakat sebagai satu keseluruhan yang tak terbagi, di mana kolektif memiliki primasi atas individu"
wrong_answers:
  - "Sebuah filsafat yang memperlakukan setiap individu sebagai unit mandiri yang hak-haknya tidak dapat dikesampingkan oleh kelompok mana pun"
  - "Sebuah teori ekonomi yang menganjurkan penyeimbangan sektor publik dan swasta dalam ukuran yang sama"
  - "Sebuah strategi politik yang mengintegrasikan semua sudut pandang minoritas ke dalam satu platform berbasis konsensus"
explanation: >-
  Holism berasal dari bahasa Yunani 'holos' yang berarti 'keseluruhan.' Dalam pemikiran sosialis, istilah ini merujuk pada visi tentang masyarakat sebagai satu keseluruhan yang tak terbagi, bukan sekadar jumlah individu. Negara sosialis bertujuan mengambil alih dan mengarahkan aktivitas manusia semaksimal mungkin. Kolektif ini dapat direpresentasikan sebagai kelas sosial, bangsa, ras, atau gender, tetapi dalam setiap kasus individu didefinisikan oleh keanggotaan kelompok.
