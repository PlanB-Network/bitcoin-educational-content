question: "නිදහස පිළිබඳ libertarian conception එක centrist conception එකෙන් වෙනස් වන්නේ කෙසේද?"
answer: "Libertarians නිදහස කොන්දේසි රහිත axiom එකක් ලෙස සලකන අතර, centrists context සහ efficiency මත පදනම්ව අවස්ථාවාදී ලෙස freedoms ආරක්ෂා කරයි"
wrong_answers:
  - "Libertarians state එකට නිදහස තෝරාගත් ලෙස ආරක්ෂා කිරීමට ඉඩ දෙන අතර, centrists පුද්ගල අයිතිවාසිකම් ආරක්ෂා කිරීමේ ඕනෑම state involvement ප්‍රතික්ෂේප කරයි"
  - "Libertarians නිදහස ආර්ථික කරුණු වලට පමණක් කේන්ද්‍ර කරයි, centrists නිදහස සමාජ සහ සංස්කෘතික domains පුරා පුළුල්ව යොදයි"
  - "Libertarians සහ centrists නිදහස පිළිබඳ එකම දෘෂ්ටිය බෙදාගන්නා නමුත් එය enforce කිරීමට අවශ්‍ය government ප්‍රමාණය පිළිබඳ එකඟ නොවේ"
explanation: >-
  Libertarians නිදහස general, unconditional principle එකක් ලෙස, axiom එකක් ලෙස ක්‍රියා කරන දෙයක් ලෙස, අර්ථ දක්වයි. එයට වෙනස්ව, centrists කිසිදු general principle එකක් යෙදීමකින් තොරව ඇතැම් freedoms අවස්ථාවාදී සහ contextual ආකාරයෙන් ආරක්ෂා කරයි. centrist approach එක නිදහස පිළිබඳ instrumental conception එකක් හෙළි කරයි; එය සැමවිටම efficiency වැනි pragmatic goals වලට යටත් වන අතර, libertarians එය මූලිකවම ප්‍රතික්ෂේප කරයි.
reviewed: false
