question: "Ni igiki kiza imbere y'ubwisanzure muri filozofiya ya politike y'aba conservative?"
answer: "Urutonde n'imigenzo, bitegerezwa kuba vyarashinzwe neza imbere y'uko ubwisanzure bushobora guhabwa agaciro"
wrong_answers:
  - "Ubutungane bw'imibano n'uburinganire, bitegerezwa kuba vyemejwe imbere y'uko abantu bashobora kuba abidegemvya vy'ukuri"
  - "Ukugira akamaro mu butunzi n'ivyavuyemwo ngirakamaro, ari vyo bigena igihe ubwisanzure bukwiye"
  - "Uburenganzira bw'umuntu ku mutungo, butegerezwa gukingirwa imbere y'uko ubundi bwisanzure ubwo ari bwo bwose butangwa"
explanation: >-
  Ku ba conservative, urutonde n'imigenzo biza imbere y'ubwisanzure. Bavuga ko ubwisanzure burenze urugero butera akajagari n'ukudatungana kw'imibano, ku buryo ubwisanzure bushobora guhabwa agaciro gusa igihe urutonde rumaze gushingwa neza. Ivyo bitandukanye n'ukubona kw'abasosiyaliste gushira imbere ubutungane, canke n'ukwibanda kw'aba centrist ku kugira akamaro.
