question: "Mitä yhteistä libertaristeilla ja konservatiiveilla on, ja mikä erottaa heidät?"
answer: "Heitä yhdistää kiintymys rajoitettuun hallintoon ja pakotetun egalitarismin torjuminen, mutta he ovat eri mieltä sotilaallisesta interventionismista ja sosiaalipolitiikasta"
wrong_answers:
  - "Heitä yhdistää protektionistisen kauppapolitiikan ja kansallisen puolustuksen tukeminen, mutta he ovat eri mieltä uskonnon roolista julkisessa elämässä"
  - "Heitä yhdistää sitoutuminen progressiiviseen verotukseen ja hyvinvointiohjelmiin, mutta he ovat eri mieltä maahanmuuttopolitiikasta"
  - "Heitä yhdistää vapaakaupan ja huumeiden laillistamisen vastustaminen, mutta he ovat eri mieltä liittovaltion koosta"
explanation: >-
  Libertaristit ja konservatiivit molemmat puolustavat rajoitettua hallintoa, torjuvat pakotetun egalitarismin, vastustavat julkista velkaa ja puolustavat osavaltioiden oikeuksia. Libertaristit kuitenkin torjuvat uuskonservatiivien sotilaallisen interventionismin, vastustavat konservatiivista sosiaalipolitiikkaa ja tukiaisia, tuomitsevat huumekiellon ja torjuvat protektionismin. Liittouma on todellinen mutta luonnostaan jännitteinen.
