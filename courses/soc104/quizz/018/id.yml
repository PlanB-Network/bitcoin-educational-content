question: "Apa itu konservatisme budaya?"
answer: "Kepatuhan pribadi pada nilai-nilai keluarga, moral, estetika, dan metafisika yang diwarisi dari masa lalu, bukan filsafat politik"
wrong_answers:
  - "Ideologi politik yang menggunakan kekuasaan negara untuk memaksakan nilai-nilai tradisional pada seluruh masyarakat melalui legislasi"
  - "Gerakan yang menolak semua bentuk modernitas dan berupaya mengembalikan masyarakat ke cara hidup pra-industri"
  - "Doktrin ekonomi yang melindungi industri nasional dan menentang perdagangan bebas dengan negara asing"
explanation: >-
  Konservatisme budaya didefinisikan sebagai kebijaksanaan hidup: kepatuhan pribadi pada nilai-nilai keluarga, moral, estetika, dan metafisika yang diwarisi dari masa lalu, baik Yunani-Romawi maupun Yudeo-Kristen. Ini secara eksplisit bukan filsafat politik. Ia berbeda dari konservatisme politik, yang bertujuan mempertahankan institusi politik dan tatanan sosial melalui kekuasaan negara. Ini juga bukan tentang menolak modernitas atau proteksionisme ekonomi.
