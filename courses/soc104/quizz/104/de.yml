question: "Was glauben Libertäre über die Fähigkeit von Individuen, Entscheidungen zu treffen?"
answer: "Individuen haben sowohl das Recht als auch die Verantwortung, ihre eigenen Entscheidungen über ihr Leben zu treffen"
wrong_answers:
  - "Individuen sollten Entscheidungen erst nach Rücksprache mit gewählten Vertretern treffen, die politische Implikationen verstehen"
  - "Individuen sind im Allgemeinen unfähig, gute Entscheidungen zu treffen, und brauchen fachkundige Anleitung durch staatliche Institutionen"
  - "Individuen sollten wirtschaftliche Entscheidungen frei treffen, sich aber in allen sozialen und kulturellen Fragen dem Staat unterordnen"
explanation: >-
  Aus libertärer Sicht haben Individuen sowohl das Recht als auch die Verantwortung, ihre eigenen Entscheidungen zu treffen. Dies steht im Gegensatz zu konventionellen politischen Familien von links bis rechts, die glauben, dass die Regierung einige oder viele der wichtigen Entscheidungen im Leben eines Individuums und im Wirtschaftsleben allgemein treffen sollte.
reviewed: false
