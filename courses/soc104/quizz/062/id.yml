question: "Bagaimana semua rezim totalitarian berkuasa?"
answer: "Melalui revolusi kekerasan yang membenarkan penghapusan total sistem sebelumnya"
wrong_answers:
  - "Melalui reformasi legislatif bertahap di dalam institusi demokratis yang sudah ada"
  - "Melalui kudeta militer yang diorganisasi oleh kekuatan asing yang mencari kendali regional"
  - "Melalui gerakan massa damai yang memenangkan pemilihan umum populer dengan selisih besar"
explanation: >-
  Semua rezim totalitarian berkuasa melalui revolusi kekerasan. Revolusi ini memiliki tujuan ganda: secara fisik menghancurkan tatanan lama dan secara ideologis membenarkan penggunaan kekerasan sebagai sesuatu yang diperlukan untuk membangun masyarakat baru. Ini membedakan perebutan kekuasaan totalitarian dari transisi demokratis, kudeta yang didukung asing, atau kemenangan elektoral yang damai.
