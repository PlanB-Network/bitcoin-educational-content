question: Ktorý z týchto autorov nepatrí do Gournayovho krúžku?
answer: Dupont de Nemours
wrong_answers:
  - Véron de Forbonnais
  - Turgot
  - Abbé Morellet
explanation: |
  Dupont de Nemours bol fyziokrat, nie člen Gournayovho krúžku. Fyziokrati mali myšlienky blízke Gournayovmu krúžku, no tvorili odlišnú skupinu.
