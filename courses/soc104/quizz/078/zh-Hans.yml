question: "为什么 Molinari 1849 年关于自由与政治权力关系的预言后来证明具有预言性？"
answer: "因为保守主义者和社会主义者轮流掌权，并把自由工具化，使其服务于各自的政治目标，正如他所描述的那样"
wrong_answers:
  - "因为他所描述的经济学家人物最终获得了政治权力，并在整个欧洲实施了自由意志主义政策"
  - "因为他关于三个政治家族会合并成一个单一中间主义运动的预言在二十世纪成真了"
  - "因为自由被历届政府逐步扩展，直到它成为现代民主制度的主要组织原则"
explanation: >-
  Molinari 的愿景后来证明具有预言性，因为自十九世纪中叶以来，保守主义者和社会主义者轮流掌权，并精确实施了他所描述的事情：把自由工具化，以服务政治目标。两个家族都愿意限制自由，并呼吁国家强加各自的议程，而经济学家关于无条件自由的立场仍被边缘化。
reviewed: false
