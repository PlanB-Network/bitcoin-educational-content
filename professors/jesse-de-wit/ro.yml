bio: |
  Este un specialist versatil în date, cu cunoștințe în Business Intelligence, Inteligență Artificială și analiza datelor. Poate gândi alături de un utilizator și astfel poate analiza o cerere de informații și proiecta un dashboard. Ca dezvoltator, poate scrie ETL și modela date. În cele din urmă, este un entuziast al Lightning Network, lucrând în prezent ca dezvoltator Rust la Breez.

short_bio: Entuziast Lightning Network | dezvoltator | Breez
