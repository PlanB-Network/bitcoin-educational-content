question: "為什麼 Popper 主張開放社會儘管有其優勢，仍然內在脆弱？"
answer: "因為個人主義所意味的責任可能顯得可怕，產生逃入共同體保護、權威，或對理想化過去的懷舊之誘惑"
wrong_answers:
  - "因為開放社會缺乏軍事力量，無法防衛自己免受封閉社會入侵"
  - "因為民主制度本質上低效率，最終會在官僚複雜性的重壓下崩潰"
  - "因為開放社會允許過多經濟不平等，這必然導致革命與威權政權建立"
explanation: >-
  Popper 強調，開放社會的脆弱性源自心理上的脆弱。個人主義所意味的責任可能顯得可怕且有風險，因為一個人必須作出自己的選擇，而且可能失敗。這產生逃入共同體保護，或逃入對理想化過去的懷舊傾向之誘惑。開放社會持續面對來自共同體衝動與反覆出現的暴力誘惑之挑戰。
reviewed: false
