question: "In che modo differiscono le strategie per abolire lo Stato tra libertaires e libertariani?"
answer: "I libertaires hanno storicamente sostenuto la distruzione violenta, mentre i libertariani cercano di delegittimare lo Stato attraverso l'educazione e la disobbedienza civile"
wrong_answers:
  - "I libertaires usano le elezioni democratiche per smantellare lo Stato, mentre i libertariani favoriscono la rivoluzione armata e l'azione diretta"
  - "I libertaires si concentrano sulla costruzione di comunità alternative, mentre i libertariani lavorano all'interno del sistema politico esistente per approvare riforme"
  - "Sia i libertaires sia i libertariani concordano sul fatto che la protesta pacifica sia l'unico mezzo legittimo di trasformazione sociale"
explanation: >-
  I libertaires hanno storicamente sostenuto la distruzione dello Stato e del capitalismo attraverso la violenza, incluso il terrore e gli attacchi mirati. I libertariani, al contrario, rifiutano la violenza aggressiva come illegittima. La loro strategia si fonda sulla delegittimazione dello Stato attraverso argomentazione, dibattito, educazione e disobbedienza civile. Questi approcci al cambiamento fondamentalmente diversi riflettono i loro più profondi disaccordi filosofici.
