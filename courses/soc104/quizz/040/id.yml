question: "Bagaimana pendekatan struktural mendefinisikan perbedaan mendasar antara sosialisme dan libertarianisme?"
answer: "Sosialisme memberi primasi kepada negara melalui regulasi, perencanaan, dan kontrol, sementara libertarianisme memberi primasi kepada individu melalui intervensi negara yang minimal"
wrong_answers:
  - "Sosialisme memprioritaskan komunitas pertanian pedesaan, sementara libertarianisme mendukung pengembangan industri perkotaan"
  - "Sosialisme didefinisikan oleh dukungannya terhadap pemilihan demokratis, sementara libertarianisme menolak semua bentuk partisipasi politik"
  - "Sosialisme berfokus pada kebijakan luar negeri dan kerja sama internasional, sementara libertarianisme hanya berkaitan dengan isu ekonomi domestik"
explanation: >-
  Secara struktural, sosialisme dicirikan oleh kemahahadiran negara, yang mengatur, merencanakan, dan mengontrol. Libertarianisme didefinisikan oleh intervensi negara yang minimal dalam ekonomi dan kehidupan pribadi, yang cenderung menuju primasi kebebasan individu dan pasar bebas. Pembedaan struktural ini jauh lebih berguna secara analitis daripada membandingkan niat yang dinyatakan oleh masing-masing sistem.
