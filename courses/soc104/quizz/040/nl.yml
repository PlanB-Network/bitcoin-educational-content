question: "Hoe behandelt socialisme vrijheden verschillend in de maatschappelijke en economische sferen?"
answer: "Socialisme bevordert sterke vrijheden in de maatschappelijke sfeer, maar zwakke vrijheden in de economische sfeer"
wrong_answers:
  - "Socialisme beperkt alle vrijheden in gelijke mate in zowel de maatschappelijke als de economische sfeer"
  - "Socialisme bevordert sterke economische vrijheden, maar beperkt maatschappelijke vrijheden om de sociale orde te handhaven"
  - "Socialisme verleent onbeperkte vrijheden in beide sferen en vertrouwt op vrijwillige samenwerking om evenwicht te bewaren"
explanation: >-
  In socialistisch denken bestaat er een fundamentele dichotomie tussen maatschappelijke en economische vrijheden. Maatschappelijke vrijheden zijn sterk, maar economische vrijheden zijn zwak door de nadruk op staatscontrole, planning en herverdeling van rijkdom. Het derde foute antwoord beschrijft het libertarische ideaal, terwijl het tweede het conservatieve patroon beschrijft, dat het spiegelbeeld van socialisme is.
