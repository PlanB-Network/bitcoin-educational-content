question: 1774දී, Physiocrats මහත් සාර්ථකත්වයක් ලැබුවේ කුමන සිදුවීමෙන් පසුවද?
answer: Turgot අමාත්‍යාංශයට පැමිණීම
wrong_answers:
  - Dupont de Nemours සභාවට පැමිණීම
  - Dupont de Nemours අමාත්‍යාංශයට පැමිණීම
  - Turgot සභාවට පැමිණීම
explanation: |
  1774දී Turgot අමාත්‍යාංශයට පැමිණීම Physiocrats සඳහා සාර්ථකත්වයක් සනිටුහන් කළේය, මන්ද ඔහු ඔවුන්ගේ අදහස්වල උද්යෝගී ආධාරකරුවෙකු වූ අතර ඔවුන්ගේ නිර්දේශ කිහිපයක් ක්‍රියාත්මක කළේය.
