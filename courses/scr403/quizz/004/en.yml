question: How many core combinators does Simplicity have?
answer: Nine (iden, unit, comp, pair, case, take, drop, injl, injr).
wrong_answers:
  - Three (sequential, parallel, conditional).
  - Five (comp, pair, case, take, drop).
  - Twelve (nine core plus three extension combinators).
explanation: >-
  Simplicity has exactly nine core combinators. Two basic operations
  (iden and unit), three composition methods (comp, pair, case), and four
  accessors (take, drop for products, injl and injr for sums). These nine
  are sufficient to express any computable function between Simplicity types.
