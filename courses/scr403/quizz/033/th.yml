question: ภายใต้กฎการกำหนดชนิดแบบ 'ชนิดใน premise เล็กกว่า' คอร์คอมบิเนเตอร์ใดบ้างที่เคลื่อนย้ายข้อมูลจริง ๆ ระหว่างการประมวลผล?
answer: มีเพียง iden และ comp; อีกเจ็ดตัวถูกใช้งานด้วย bookkeeping เท่านั้น
wrong_answers:
  - มีเพียง take และ drop; การดึงองค์ประกอบหนึ่งบังคับให้เครื่องต้องคัดลอกมันออกจาก product
  - มีเพียง pair และ case; การทำซ้ำอินพุตให้สองสาขาและการ dispatch ตาม tag จะสับย้ายข้อมูล
  - มีเพียง injl และ injr; การเพิ่ม tag เขียนค่าใหม่เข้าเป็นตัวแทนชนิด sum ที่ใหญ่กว่า
explanation: >-
  ตรงข้ามกับสัญชาตญาณ คอมบิเนเตอร์ที่ดูเหมือนการเข้าถึงข้อมูล (take,
  drop, pair, case, injl, injr) ไม่ต้องคัดลอกเลย: เพราะ premises ใน
  กฎการกำหนดชนิดเกี่ยวข้องกับชนิดที่เล็กกว่าข้อสรุปของมัน Bit
  Machine จึงสามารถใช้งานพวกมันด้วย bookkeeping อย่างเดียว มีเพียง iden ซึ่ง
  คัดลอกอินพุตทั้งหมดไปยังเอาต์พุต และ comp ซึ่ง materialize ค่ากลาง
  ที่ส่งจาก f ไปยัง g เท่านั้นที่เคลื่อนย้ายข้อมูลจริง ๆ
reviewed: false
