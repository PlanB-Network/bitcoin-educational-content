question: Полный сумматор объединяет через OR биты переноса своих двух полусумматоров вместо того, чтобы применить XOR. Почему OR корректен?
answer: Для любого входа перенос может дать не более одного полусумматора, поэтому OR точно объединяет два взаимоисключающих случая.
wrong_answers:
  - Два бита переноса нужно сложить, а OR — это то, как в Simplicity выполняется однобитовое двоичное сложение.
  - После ветвления OR — единственный булев оператор, тип которого всё ещё соответствует окружению.
  - OR даёт завышенную оценку переноса; любые ложные переносы впоследствии отбрасываются финальной проекцией.
explanation: >-
  Если первый полусумматор даёт перенос, оба его входных бита были
  равны 1, значит его бит суммы равен 0 — а полусумматор, на вход
  которого подан 0, никогда не может дать перенос. Поэтому два бита
  переноса никогда не равны 1 одновременно, и OR объединяет их точно
  (на достижимых входах он даже совпадает с XOR). Именно эта взаимная
  исключительность делает корректной декомпозицию полного сумматора на
  два полусумматора.
