question: "Wie können staatlich finanzierte Sozialhilfeprogramme perverse Effekte erzeugen und damit die Gefahr veranschaulichen, sich ausschließlich auf Absichten zu stützen?"
answer: "Sie können Abhängigkeit schaffen, Arbeitsanreize beseitigen und einer Spoliation gleichkommen, da das Geld zuerst denen genommen werden muss, die den Wohlstand geschaffen haben"
wrong_answers:
  - "Sie fördern übermäßige private Ersparnisse, verringern die Konsumausgaben und verursachen Deflation in der Gesamtwirtschaft"
  - "Sie stärken private Unternehmen, indem sie Arbeitskosten auf die Regierung verlagern und den Bedarf an wettbewerbsfähigen Löhnen reduzieren"
  - "Sie beseitigen Klassenunterschiede so gründlich, dass soziale Mobilität unnötig wird und Innovation stagniert"
explanation: >-
  Friedman warnt, dass großzügige Absichten schädliche Folgen haben können, wenn sie eine strenge Analyse menschlicher Anreize vernachlässigen. Staatlich finanzierte Hilfsprogramme riskieren, Abhängigkeit zu schaffen, keinen Arbeitsanreiz zu erzeugen und eine Form der Spoliation darzustellen, da die Mittel zuerst den Wohlstandsproduzenten genommen werden müssen. Messbare Ergebnisse wie Armutsreduzierung und Effizienz müssen Vorrang vor edlen Absichten haben.
reviewed: false
