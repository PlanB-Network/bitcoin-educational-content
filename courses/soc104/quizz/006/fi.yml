question: "Mikä sijainti on Nolanin timantin huipulla ja edustaa suurinta vapautta?"
answer: "Libertarismi, joka kannattaa suurinta taloudellista ja henkilökohtaista vapautta"
wrong_answers:
  - "Konservatismi, joka kannattaa perinteisiä arvoja ja taloudellista vapautta"
  - "Keskustalaisuus, joka tasapainottaa kaikkia poliittisia kantoja pragmaattisesti"
  - "Sosialismi, joka kannattaa henkilökohtaista vapautta ja sosiaalista tasa-arvoa"
explanation: >-
  Libertarismi sijaitsee Nolanin timantin huipulla etatismin vastakohtana. Se edustaa niitä, jotka kannattavat sekä taloudellisen että henkilökohtaisen vapauden suurinta astetta. Konservatismi sijaitsee oikealla (suuri taloudellinen vapaus, vähäinen henkilökohtainen vapaus), sosialismi vasemmalla (suuri henkilökohtainen vapaus, vähäinen taloudellinen vapaus) ja keskustalaisuus keskellä.
