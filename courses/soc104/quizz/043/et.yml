question: "Kuidas esindab Green New Deal demokraatliku sotsialismi tänapäevast arengut?"
answer: "See kasutab keskkonnamuresid uue õigustusena riigi sekkumisele ja eratulu konfiskeerimisele, allutades üksikisiku huvi kollektiivsele planeedi tervisele"
wrong_answers:
  - "See hülgab traditsioonilise sotsialistliku majanduse täielikult vabaturulahenduste kasuks, et lahendada keskkonnaprobleeme süsinikukaubanduse kaudu"
  - "See lükkab tagasi riigi sekkumise ning tugineb kliimamuutustega tegelemisel hoopis vabatahtlikule individuaalsele tegevusele ja erasektori innovatsioonile"
  - "See kujutab endast lahknemist sotsialismist, sest seab keskkonnakaitse kõigist sotsiaalse õigluse ja tööhõive muredest kõrgemale"
explanation: >-
  Green New Deal ühendab keskkonnamured sotsiaalsete eesmärkidega, sidudes ökoloogilise ülemineku sotsiaalse õigluse, tööhõivegarantiide ja tugevdatud avalike teenustega. Üksikisiku huvi allutatakse kollektiivsele huvile, mis määratletakse planeedi tervise kaudu. Oma tuumas pakub see uue retoorilise ümbrise riigi sekkumise ja eratulu konfiskeerimise õigustamiseks, enam mitte üksnes sotsiaalse õigluse, vaid ka keskkonna nimel.
