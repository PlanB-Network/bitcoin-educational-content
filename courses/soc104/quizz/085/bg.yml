question: "Какъв е фундаменталният аргумент на Hayek за това защо централното планиране се проваля?"
answer: "Знанието съществува само като разпръснати фрагменти, притежавани от отделни индивиди, и не може да бъде концентрирано или интегрирано от централна власт"
wrong_answers:
  - "Централните плановици са морално корумпирани и винаги действат в свой собствен интерес, а не в името на общественото благо"
  - "Демократичните институции са твърде бавни, за да реагират на икономически промени, което прави централизираните решения винаги остарели"
  - "Централното планиране се проваля, защото гражданите умишлено се съпротивляват на правителствените разпореждания и отказват да спазват регулациите"
explanation: >-
  Фундаменталният аргумент на Hayek почива върху природата на информацията. Той показва, че знанието никога не съществува в концентрирана или интегрирана форма, а само като разпръснати фрагменти, притежавани от всички отделни индивиди. Стойността е субективна и е позната само локално и непълно. Централният плановик, седящ в офис, няма знание за истинската цена на нещата, защото не участва във взаимодействие и обмен.
