question: "libertarianism තුළ minarchists සහ anarcho-capitalists අතර key difference එක කුමක්ද?"
answer: "Minarchists defense, justice, සහ police සඳහා minimal state එකක් පිළිගන්නා අතර, anarcho-capitalists සියලු state functions privatized කිරීමට අවශ්‍ය වේ"
wrong_answers:
  - "Minarchists government හි සියලු ආකාර ප්‍රතික්ෂේප කරන අතර, anarcho-capitalists markets සඳහා limited state regulation පිළිගනිති"
  - "Minarchists essential services සඳහා progressive taxation කැමති වන අතර, anarcho-capitalists taxation සියල්ලට විරුද්ධ වෙති"
  - "Minarchists economic freedom පමණක් වෙත අවධානය යොමු කරන අතර, anarcho-capitalists economic සහ societal freedoms දෙකම ආරක්ෂා කරති"
explanation: >-
  Minarchists විශ්වාස කරන්නේ state defense, justice, සහ police වැනි core functions වලට සීමා විය යුතු බවයි ("night-watchman state"), අතර anarcho-capitalists තර්ක කරන්නේ මෙම functions පවා privatized කර voluntary market competition හරහා කළමනාකරණය කළ යුතු බවයි. ඔවුන්ගේ එකඟ නොවීම fundamental ethical principles වලට වඩා practical implementation පිළිබඳය. tendencies දෙකම self-ownership සහ non-aggression යන එකම libertarian values බෙදාගනී.
reviewed: false
