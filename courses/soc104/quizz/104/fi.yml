question: "Miten kurssi väittää vapauden sallivan sekä vasemmistolaisten että oikeistolaisten arvojen elää rauhanomaisesti rinnakkain?"
answer: "Aidosti vapaan järjestelmän vallitessa vasemmistolaisia ihanteita kannattavat ihmiset voivat vapaaehtoisesti jakaa omaisuutta ja jakaa varoja uudelleen, kun taas oikeistolaisia arvoja kannattavat voivat säästää ja siirtää perinteitä eteenpäin ilman, että kumpikaan puoli pakottaa elämäntapaansa toiselle"
wrong_answers:
  - "Vapaus edellyttää molempien puolten kompromissia hyväksymällä keskustalaisen kannan, jossa valtio tasapainottaa kilpailevia arvoja maltillisella sääntelyllä"
  - "Vapaus tarkoittaa, että vasemmistolaisten ja oikeistolaisten yhteisöjen on elettävä erillisillä maantieteellisillä alueilla omine itsenäisine hallintoineen"
  - "Vapaus toimii sallimalla kansalaisten äänestää siitä, mitkä arvot tulisi panna täytäntöön kullakin alueella, vuorotellen vasemmistolaisten ja oikeistolaisten politiikkojen välillä jokaisessa vaalisyklissä"
explanation: >-
  Kurssi osoittaa, että aidossa vapauden järjestelmässä vasemmistolaisia ihanteita kannattavat voivat vapaaehtoisesti luopua omaisuudesta, jakaa tuotantovälineitä tai lahjoittaa palkkoja uudelleenjakaville organisaatioille. Oikeistolaisia arvoja kannattavat voivat tehdä ahkerasti työtä, säästää ja siirtää perhearvoja eteenpäin. Kenenkään ei pitäisi pakottaa elämäntapaansa muille. Tavoitteet voidaan saavuttaa rauhanomaisesti markkinoiden vapauden ja valinnan voiman kautta.
