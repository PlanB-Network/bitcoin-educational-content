question: "Почему денежную инфляцию описывают как скрытый налог, взимаемый без согласия граждан?"
answer: "Потому что создание денег государством обесценивает валюту, так что люди могут купить меньше за ту же сумму, но большинство не понимает, что рост цен отражает государственную политику, а не естественные рыночные силы"
wrong_answers:
  - "Потому что центральные банки тайно взимают комиссии с каждой транзакции, проходящей через банковскую систему, не раскрывая их владельцам счетов"
  - "Потому что правительства печатают деньги и распределяют их только среди богатых людей, одновременно облагая бедных более высокими налогами с продаж на товары первой необходимости"
  - "Потому что инфляция вызвана частными корпорациями, повышающими цены для увеличения прибыли, что действует как неофициальный налог на потребителей"
explanation: >-
  Вливание денег в систему превращается в обесценение валюты, при котором на ту же сумму можно купить меньше, потому что новые деньги не отражают подлинного экономического роста. Большинство людей не видит, что именно государственная политика привела к росту цен, который является лишь отражением обесценения валюты. Это равносильно легализованной краже и институционализированному грабежу, обедняющему средний класс, тогда как богатые захватывают новые деньги через спекулятивные активы.
