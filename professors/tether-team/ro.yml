bio: |
    Echipa Tether. Lansat în 2014, Tether este o platformă bazată pe blockchain concepută pentru a facilita utilizarea monedelor fiat într-un mod digital. Tether lucrează pentru a perturba sistemul financiar convențional printr-o abordare mai modernă a banilor. Tether a făcut progrese oferind clienților posibilitatea de a tranzacționa cu monede tradiționale printr-un blockchain, fără volatilitatea și complexitatea inerente asociate de obicei cu o monedă digitală. Fiind prima platformă bazată pe blockchain care facilitează utilizarea digitală a monedelor tradiționale (o unitate de cont familiară și stabilă), Tether a democratizat tranzacțiile transfrontaliere printr-un blockchain.

