question: "Murray Rothbard द्वारा सिद्धांतबद्ध non-aggression principle क्या है?"
answer: "किसी अन्य व्यक्ति या उसकी संपत्ति के विरुद्ध शारीरिक बल शुरू करना अवैध है, हालांकि रक्षात्मक हिंसा की अनुमति है"
wrong_answers:
  - "आत्मरक्षा और उत्पीड़न के प्रतिरोध सहित हिंसा के सभी रूप हमेशा गलत हैं"
  - "हिंसा तब स्वीकार्य है जब वह दमनकारी संस्थाओं के विरुद्ध निर्देशित हो, लेकिन अन्य व्यक्तियों के विरुद्ध कभी नहीं"
  - "केवल राज्य को बल प्रयोग करने का वैध अधिकार है, और व्यक्तियों को कभी हिंसा का सहारा नहीं लेना चाहिए"
explanation: >-
  Rothbard का non-aggression principle कहता है कि किसी अन्य व्यक्ति या उसकी संपत्ति के विरुद्ध शारीरिक बल शुरू करना अवैध है। यह स्वर्णिम नियम का दार्शनिक अनुवाद है। हालांकि, यह सभी हिंसा को निषिद्ध नहीं करता: आत्मरक्षा और उत्पीड़न के प्रतिरोध सहित रक्षात्मक हिंसा को वैध माना जाता है। यही इसे शुद्ध शांतिवाद और राज्य द्वारा दावा किए गए बल पर एकाधिकार से अलग करता है।
