question: "Co znamená termín „holismus“ v kontextu socialistické filozofie?"
answer: "Vizi společnosti jako nedělitelného celku, v němž kolektiv získává primát nad jednotlivcem"
wrong_answers:
  - "Filozofii, která chápe každého jednotlivce jako soběstačnou jednotku, jejíž práva nemůže žádná skupina převážit"
  - "Ekonomickou teorii, která prosazuje vyvážení veřejného a soukromého sektoru ve stejné míře"
  - "Politickou strategii, která integruje všechna menšinová stanoviska do jediné platformy založené na konsenzu"
explanation: >-
  Holismus pochází z řeckého „holos“, což znamená „celek“. V socialistickém myšlení označuje vizi společnosti jako nedělitelného celku, nikoli jako prostého součtu jednotlivců. Socialistický stát usiluje o to, aby v maximální míře přebíral a řídil lidskou činnost. Tento kolektiv může být reprezentován jako sociální třída, národ, rasa nebo gender, ale v každém případě je jednotlivec definován příslušností ke skupině.
