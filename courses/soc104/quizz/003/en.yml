question: "Why is the left-right axis considered inadequate for placing classical liberal thinkers like Bastiat or Ron Paul?"
answer: "Because classical liberalism values both economic and personal freedoms, which neither the left nor the right fully embrace"
wrong_answers:
  - "Because classical liberals always align with right-wing economic policies and reject all left-wing positions"
  - "Because classical liberals are centrists who adopt moderate versions of both left and right ideologies"
  - "Because classical liberals oppose all forms of government, making them anarchists rather than political thinkers"
explanation: >-
  The left-right axis fails classical liberals because it cannot accommodate a position that simultaneously defends economic freedom (typically right) and personal freedom (typically left). Classical liberals are not centrists seeking compromise, nor are they anarchists or purely right-wing. They simply do not fit on a one-dimensional spectrum.
reviewed: false
