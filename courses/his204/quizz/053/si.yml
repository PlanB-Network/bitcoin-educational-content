question: Physiocratesගේ සඟරාවේ නම කුමක්ද?
answer: Les Ephémérides du Citoyen
wrong_answers:
  - Les Ephémérides du Peuple
  - The New Citizen
  - Le Journal des Économistes
explanation: |
  Physiocratsගේ පුවත්පත "Les Éphémérides du Citoyen" වූ අතර, එය ඔවුන්ගේ අදහස් සහ ආර්ථික විශ්ලේෂණ පැතිරවූ කාලීන ප්‍රකාශනයක් විය.