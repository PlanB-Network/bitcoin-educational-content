question: "Qual è la posizione conservatrice sull'immigrazione?"
answer: "Lo Stato ha il diritto sovrano di controllare i propri confini per proteggere la sicurezza nazionale e l'identità culturale"
wrong_answers:
  - "I confini dovrebbero essere aperti incondizionatamente perché le restrizioni discriminatorie violano i diritti umani"
  - "L'immigrazione dovrebbe essere determinata dalla domanda di mercato, con i cittadini che decidono contrattualmente sui propri rapporti con gli stranieri"
  - "La politica migratoria dovrebbe bilanciare esigenze economiche e integrazione riuscita sulla base della valutazione degli esperti"
explanation: >-
  I conservatori sostengono che ordine, identità e sovranità nazionale debbano avere la priorità sull'accoglienza illimitata di stranieri o rifugiati. I confini e una popolazione ben definita fanno parte dei valori civilizzati. Le risposte sbagliate rappresentano la posizione socialista (confini aperti come diritti umani), la posizione libertaria (immigrazione basata sul mercato) e la posizione centrista (approccio equilibrato guidato dagli esperti).
