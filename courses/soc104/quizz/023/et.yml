question: "Mis on paleolibertarism?"
answer: "Süntees, mis ühendab riigi kui sunni allika hülgamise traditsiooniliste institutsioonide ja vabatahtlike sotsiaalsete struktuuride tugevdamisega"
wrong_answers:
  - "Libertaarne liikumine, mis hülgab kõik traditsioonilised väärtused ja edendab radikaalset sotsiaalset progressivismi"
  - "Konservatiivne ideoloogia, mis kasutab riigivõimu traditsiooniliste väärtuste jõustamiseks, lubades samal ajal teatavat majandusvabadust"
  - "Tsentristlik filosoofia, mis otsib tasakaalustatud kompromissi sotsialistliku majanduse ja konservatiivse sotsiaalpoliitika vahel"
explanation: >-
  Paleolibertarism ühendab riigi kui institutsionaalse sunni allika hülgamise traditsiooniliste institutsioonide tugevdamise ja eelistusega vabatahtlike sotsiaalsete struktuuride suhtes riigivõimu ees. See eristub neolibertarismist suurema sümpaatia poolest traditsiooniliste väärtuste vastu. Paleolibertaarlane ei vastusta kogukondi, mis korralduvad sotsialistlike või kommunitaarsete põhimõtete ümber; ta keeldub üksnes sellest, et sellised kogukonnad suruksid oma väärtused seaduse jõuga kõigile peale.
