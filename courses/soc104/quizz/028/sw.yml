question: "Paleo-libertarianism ni nini?"
answer: "Muunganiko unaochanganya kukataliwa kwa dola kama chanzo cha ulazimishaji na kuimarishwa kwa taasisi za jadi na miundo ya kijamii ya hiari"
wrong_answers:
  - "Harakati ya libertarian inayokataa thamani zote za jadi na kuendeleza progressivism kali ya kijamii"
  - "Itikadi ya kihafidhina inayotumia nguvu ya dola kutekeleza thamani za jadi huku ikiruhusu kiasi fulani cha uhuru wa kiuchumi"
  - "Falsafa ya msimamo wa kati inayotafuta maelewano yaliyosawazishwa kati ya uchumi wa kisoshalisti na sera ya kijamii ya kihafidhina"
explanation: >-
  Paleo-libertarianism huchanganya kukataliwa kwa dola kama chanzo cha kitaasisi cha ulazimishaji na kuimarishwa kwa taasisi za jadi pamoja na upendeleo kwa miundo ya kijamii ya hiari kuliko mamlaka ya dola. Hujitofautisha na neo-libertarianism kwa kuwa na huruma zaidi kwa thamani za jadi. Paleo-libertarian hapingi jamii kujipanga kuzunguka kanuni za kisoshalisti au kikomunitaria; anakataa tu kwamba jamii hizo zilazimishe thamani zao kwa kila mtu kwa nguvu ya sheria.
