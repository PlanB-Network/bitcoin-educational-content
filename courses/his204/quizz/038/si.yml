question: අනෙකුත් රටවලට අදාළ කළ හැකි Chinki, histoire cochininoise නම් කෙටි නවකතාව පිටුපස ඇති තර්කය කුමක්ද?
answer: වෘත්තීය සංස්ථා නියමන මිනිසුන්ට වැඩ කිරීම වැළැක්වී, උත්සාහය අධෛර්යමත් කරයි යන්න
wrong_answers:
  - Cochinchina ලිබරල් පාලනයක උදාහරණයක් වන බව
  - ධාන්‍ය වෙළඳාම සියලු වරායන් හරහා නිදහස් විය යුතු බව
  - Cochinchina ස්වාභාවික සම්පත්වලින් පොහොසත් රටක් වන බව
explanation: |
  "Chinki" ආර්ථික ක්‍රියාකාරකම්වලට බාධා කර පුද්ගලික මුලපිරීම අධෛර්යමත් කරන වෘත්තීය සංස්ථා නියමන විවේචනය කරයි.
