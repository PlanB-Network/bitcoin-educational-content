question: "Изчисляването на #ᶜ(comp f g) хешира 128 байта: тагът comp два пъти, после CMR-ите на двете деца. Защо това все още е най-много едно извикване на компресията на SHA-256?"
answer: Първият 64-байтов блок е константният tag∥tag, чийто midstate се изчислява предварително веднъж; компресира се само блокът, съдържащ CMR-ите на децата.
wrong_answers:
  - Самото премахване на финалния блок с length-padding на SHA-256 позволява всички 128 байта да се поберат в едно извикване.
  - Двата CMR-а на децата се XOR-ват в един 32-байтов digest, свивайки входа до един блок.
  - SHA-256-midstate е вариант с широки блокове, който поглъща 128-байтови блокове от съобщението с едно преминаване.
explanation: >-
  Компресионната функция на SHA-256 обработва фиксирани 64-байтови блокове, така че
  128-байтов вход обикновено изисква две извиквания (плюс още едно за length
  padding-а в пълния SHA-256). Тъй като първият блок на всеки комбинатор е
  константният tag∥tag, неговият midstate може да бъде изчислен предварително
  веднъж и кеширан; всеки израз след това се нуждае само от една нова компресия
  на блока, съдържащ CMR-ите на децата му. Midstates също премахват финалния
  padding блок, но само това все още би оставило две компресии — предварително
  изчисленият tag midstate е това, което го свежда до най-много една.
reviewed: false
