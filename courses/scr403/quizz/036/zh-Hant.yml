question: push-<n 的型別是 Aᑉⁿ × A ⊢ Aⁿ + Aᑉⁿ。為什麼它的輸出必須是一個包含完整向量型別 Aⁿ 的和？
answer: 一個緩衝區 Aᑉⁿ 至多容納 n−1 個項目，所以推入一個已滿的緩衝區會產生 n 個項目 —— 只有 Aⁿ 能表示這一點。
wrong_answers:
  - 這個和讓呼叫者得以挑選較便宜的編碼，因為向量的序列化比 option 積更精簡。
  - push 在空緩衝區上可能失敗，而 Aⁿ 分支就是攜帶舊有內容的錯誤情況。
  - case 要求任何消耗和型別緩衝區的函數也必須產生和型別的輸出。
explanation: >-
  Aᑉⁿ 恰好是長度嚴格小於 n 之列表的型別，所以一個處於最大容量的緩衝區容納 n−1 個元素。再推入一個就會產生恰好 n 個元素，而這是 Aᑉⁿ 無法表示的；Aⁿ 這個加項會把那個溢位的結果以完整向量的形式回傳。將溢位編碼在輸出型別中，能讓 push-<n 維持為一個全函數，而非偏函數 —— 空緩衝區的失敗情況屬於 pop-<n，而非 push。
