question: "Ce principiu director a ghidat voturile lui Frederic Bastiat în Adunarea Națională?"
answer: "Promovarea libertăților individuale și economice și reducerea interferenței guvernului"
wrong_answers:
  - "Apărarea autorității regale și păstrarea tradițiilor monarhice"
  - "Promovarea politicilor socialiste pentru a redistribui averea mai egal"
  - "O strategie centristă de compromis între facțiunile de stânga și de dreapta"
explanation: >-
  Bastiat a votat pe baza unui principiu fundamental: promovarea libertăților individuale și economice, reducând în același timp interferența guvernului. El nu a fost un oportunist centrist, nici un regalist sau un socialist. A votat cu oricare dintre tabere propunea măsuri aliniate cu libertatea și guvernarea limitată.
reviewed: false
