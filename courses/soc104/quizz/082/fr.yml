question: "Pourquoi Mises souligne-t-il que l'individualisme ne doit pas être confondu avec l'autosuffisance ou la misanthropie ?"
answer: "Parce que l'individualisme favorise la coopération et l'association, à condition qu'elles reposent sur le libre consentement des participants, en reconnaissant que les humains développent leur plein potentiel par des relations volontaires avec les autres"
wrong_answers:
  - "Parce que l'individualisme exige que les personnes rejoignent des organisations civiques obligatoires pour garantir qu'elles contribuent au bien commun"
  - "Parce que l'individualisme signifie que chaque personne doit dépendre entièrement de l'État pour les services qu'elle ne peut pas fournir elle-même"
  - "Parce que l'individualisme exige que les personnes soient en concurrence les unes avec les autres dans tous les domaines pour prouver leur supériorité personnelle"
explanation: >-
  Mises souligne que l'être humain est une créature sociale. L'individualisme ne signifie pas l'isolement. Il favorise la coopération et l'association à condition qu'elles reposent sur le libre consentement des participants. L'être humain ne peut développer son plein potentiel que dans la relation avec les autres, mais cette coopération doit être volontaire plutôt qu'imposée par l'autorité collective.
reviewed: false
