question: "Защо свидетелските стойности са изключени от Commitment Merkle Root (CMR)?"
answer: За да могат адресите да се формират преди свидетелите да са известни, а неизползваните клонове да се орязват поверително.
wrong_answers:
  - Защото свидетелските стойности просто са твърде големи, за да бъдат включени в 256-битов хеш.
  - Защото свидетелските стойности се валидират напълно отделно от ефекта Failure.
  - Защото включването на свидетелските стойности би направило CMR недетерминиран.
explanation: >-
  Свидетелските изрази (като подписи) се предоставят по време на харчене, а не по време на създаване на адрес.
  Изключването им от CMR позволява две важни свойства: адресите могат да бъдат генерирани преди
  да съществува транзакцията за харчене, а неизпълнените условни клонове могат да бъдат орязани от
  on-chain данните, без да се разкриват свързаните с тях свидетелски стойности.
reviewed: true
