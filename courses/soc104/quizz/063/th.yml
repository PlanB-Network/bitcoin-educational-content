question: "ระบอบเบ็ดเสร็จทั้งหมดขึ้นสู่อำนาจได้อย่างไร?"
answer: "ผ่านการปฏิวัติรุนแรงที่ให้เหตุผลแก่การล้างกระดานจากระบบก่อนหน้า"
wrong_answers:
  - "ผ่านการปฏิรูปกฎหมายอย่างค่อยเป็นค่อยไปภายในสถาบันประชาธิปไตยที่มีอยู่"
  - "ผ่านรัฐประหารทางทหารที่จัดโดยมหาอำนาจต่างชาติซึ่งต้องการควบคุมภูมิภาค"
  - "ผ่านขบวนการมวลชนอย่างสันติที่ชนะการเลือกตั้งด้วยคะแนนถล่มทลาย"
explanation: >-
  ระบอบเบ็ดเสร็จทั้งหมดขึ้นสู่อำนาจผ่านการปฏิวัติรุนแรง การปฏิวัตินี้มีวัตถุประสงค์สองอย่าง: มันทำลายระเบียบเก่าทางกายภาพ และให้เหตุผลทาง ideology แก่การใช้ความรุนแรงว่าเป็นสิ่งจำเป็นต่อการสร้างสังคมใหม่ สิ่งนี้ทำให้การยึดอำนาจแบบเบ็ดเสร็จแตกต่างจากการเปลี่ยนผ่านสู่ประชาธิปไตย รัฐประหารที่ต่างชาติหนุนหลัง หรือชัยชนะทางเลือกตั้งอย่างสันติ
reviewed: false
