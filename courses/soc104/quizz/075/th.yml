question: "ตลอดการถกเถียงทางเศรษฐกิจทั้งห้าประเด็น (ภาษี ค่าแรงขั้นต่ำ การดูแลสุขภาพ สิ่งแวดล้อม เงินอุดหนุน) รูปแบบสม่ำเสมอใดที่แยกวิธีสายกลางออกจากจุดยืนของกลุ่มการเมืองอื่น?"
answer: "สายกลางปฏิเสธการยึดมั่นในหลักการตายตัว และเรียกร้องการวิเคราะห์เชิงประจักษ์กับการประเมินของผู้เชี่ยวชาญแทน เพื่อกำหนดนโยบายเป็นกรณี ๆ ไป ทำให้แนวทางของพวกเขาเป็นเทคโนแครตโดยเนื้อแท้"
wrong_answers:
  - "สายกลางรับตำแหน่งตรงกลางระหว่างจุดยืนสังคมนิยมกับอนุรักษนิยมเสมอ โดยแบ่งครึ่งความต่างอย่างเท่า ๆ กันในทุกประเด็น"
  - "สายกลางให้ความสำคัญกับการเติบโตทางเศรษฐกิจเหนือสวัสดิการสังคมอย่างสม่ำเสมอ โดยอยู่ข้างลิเบอร์ทาเรียนในนโยบายการคลัง ขณะเห็นด้วยกับสังคมนิยมเรื่องกฎระเบียบ"
  - "สายกลางมอบการตัดสินใจทางเศรษฐกิจทั้งหมดให้องค์กรระหว่างประเทศและข้อตกลงการค้า แทนที่จะกำหนดนโยบายแห่งชาติอย่างเป็นอิสระ"
explanation: >-
  ตลอดการถกเถียงทางเศรษฐกิจทั้งห้าประเด็น แนวทางสายกลางเป็นไปตามรูปแบบเดียวกัน: แทนที่จะยึดมั่นในหลักอุดมการณ์ตายตัว สายกลางเรียกร้องหลักฐานเชิงประจักษ์และการประเมินของผู้เชี่ยวชาญก่อนตัดสินใจ ในเรื่องภาษี ระดับที่ถูกต้องต้องถูกกำหนดด้วยการวิเคราะห์ ในเรื่องค่าแรงขั้นต่ำ ระดับต้องถูกปรับอย่างปฏิบัตินิยม ในเรื่องการดูแลสุขภาพ อุดมคติคือการผสมผสานที่ผู้เชี่ยวชาญปรับเทียบ ในเรื่องสิ่งแวดล้อม นโยบายต้องสร้างสมดุลกับความสามารถในการแข่งขัน ในเรื่องเงินอุดหนุน แต่ละกรณีต้องถูกประเมินตามคุณค่าเฉพาะของมัน สิ่งนี้ทำให้สายกลางเป็นเทคโนแครตโดยเนื้อแท้ ซึ่งแตกต่างจากการแบ่งครึ่งความต่างหรือการมอบอำนาจให้องค์กรระหว่างประเทศ
reviewed: false
