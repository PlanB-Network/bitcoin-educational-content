question: "Bagaimana program bantuan sosial yang didanai negara dapat menghasilkan efek menyimpang, yang menggambarkan bahaya mengandalkan niat semata?"
answer: "Program tersebut dapat menciptakan ketergantungan, menghilangkan insentif untuk bekerja, dan menjadi perampasan karena uangnya terlebih dahulu harus diambil dari mereka yang menghasilkan kekayaan"
wrong_answers:
  - "Program tersebut mendorong tabungan pribadi yang berlebihan, mengurangi belanja konsumen, dan menyebabkan deflasi dalam ekonomi yang lebih luas"
  - "Program tersebut memperkuat perusahaan swasta dengan mengalihkan biaya tenaga kerja kepada pemerintah dan mengurangi kebutuhan akan upah yang kompetitif"
  - "Program tersebut menghapus perbedaan kelas secara begitu menyeluruh sehingga mobilitas sosial menjadi tidak perlu dan inovasi mandek"
explanation: >-
  Friedman memperingatkan bahwa niat yang murah hati dapat menghasilkan konsekuensi merugikan ketika mengabaikan analisis ketat atas insentif manusia. Program bantuan yang didanai negara berisiko menciptakan ketergantungan, tidak menghasilkan insentif untuk bekerja, dan membentuk suatu bentuk perampasan karena dana terlebih dahulu harus diambil dari para penghasil kekayaan. Hasil yang dapat diukur seperti pengurangan kemiskinan dan efisiensi harus didahulukan daripada niat luhur.
