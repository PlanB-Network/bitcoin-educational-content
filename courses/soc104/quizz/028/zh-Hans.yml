question: "自由意志主义者和保守主义者有哪些共同基础，又是什么使他们分裂？"
answer: "他们都依恋有限政府并拒绝强制平等主义，但在军事干预主义和社会政策上存在分歧"
wrong_answers:
  - "他们都支持保护主义贸易政策和国防，但在宗教在公共生活中的作用上存在分歧"
  - "他们都承诺支持累进税和福利项目，但在移民政策上存在分歧"
  - "他们都反对自由贸易和毒品合法化，但在联邦政府规模上存在分歧"
explanation: >-
  自由意志主义者和保守主义者都支持有限政府、拒绝强制平等主义、反对公共债务，并捍卫各州权利。然而，自由意志主义者拒绝新保守主义者的军事干预主义，反对保守主义社会政策和补贴，谴责禁毒，并拒绝保护主义。这一联盟是真实的，但内在紧张。
reviewed: false
