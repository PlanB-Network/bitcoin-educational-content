question: "Proč byly totalitní režimy popisovány jako ‚sekulární náboženství‘ a co to odhaluje o podmínkách nutných pro existenci totalitarismu?"
answer: "Vyžadují od militantů kvazináboženskou víru a proti odpůrcům používají strach, a totalitarismus vyžaduje všechny charakteristiky současně: potlačené svobody, vládu jedné strany, násilnou revoluci a řízenou ekonomiku"
wrong_answers:
  - "Nahrazují tradiční bohoslužbu státními obřady a totalitarismus vyžaduje pouze charismatického vůdce a vojenskou kontrolu"
  - "Používají náboženské instituce k prosazování státní ideologie a totalitarismus může vzniknout kdykoli jedna politická strana ovládne parlament"
  - "Slibují duchovní spásu prostřednictvím politického jednání a totalitarismus existuje vždy, když stát kontroluje ekonomiku bez ohledu na politické svobody"
explanation: >-
  Raymond Aron pozoroval, že totalitní režimy fungují na dvou principech: víře militantů a strachu oponentů. Tento kvazináboženský fanatismus je charakterizuje napříč jejich odlišnými motivacemi a vysloužil jim označení sekulární náboženství. Zásadní je, že totalitarismus vyžaduje všechny definiční charakteristiky současně: potlačené svobody, neomezenou autoritu prostřednictvím jediné strany, násilnou revoluci a řízenou ekonomiku. Moderní demokracie mohou vykazovat některé z těchto rysů, ale totalitarismus je přítomen pouze tehdy, když jsou shromážděny všechny dohromady.
