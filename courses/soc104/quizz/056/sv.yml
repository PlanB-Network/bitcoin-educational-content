question: "Vilken form av styre tenderar centrism mot?"
answer: "Teknokrati, där makten anförtros åt experter som styr ekonomin och penningpolitiken"
wrong_answers:
  - "Direktdemokrati, där medborgare röstar om varje större policybeslut"
  - "Aristokrati, där makten innehas av en traditionell härskande klass"
  - "Laissez-faire-styre, där marknaden reglerar sig själv utan statlig intervention"
explanation: >-
  Centrism privilegierar effektivitet och pragmatism och tenderar mot teknokrati, vilket betyder att makten bör anförtros åt experter som styr ekonomin och leder penningpolitiken. Detta skiljer sig i grunden från direktdemokrati, aristokrati eller laissez-faire, där makten i varje fall fördelas enligt helt andra principer.
reviewed: false
