question: "paleo-libertarianism क्या है?"
answer: "एक समन्वय जो बलप्रयोग के स्रोत के रूप में राज्य की अस्वीकृति को पारंपरिक संस्थाओं और स्वैच्छिक सामाजिक संरचनाओं के सुदृढ़ीकरण के साथ जोड़ता है"
wrong_answers:
  - "एक लिबर्टेरियन आंदोलन जो सभी पारंपरिक मूल्यों को अस्वीकार करता है और कट्टर सामाजिक प्रगतिवाद को बढ़ावा देता है"
  - "एक रूढ़िवादी विचारधारा जो कुछ आर्थिक स्वतंत्रता की अनुमति देते हुए पारंपरिक मूल्यों को लागू कराने के लिए राज्य-शक्ति का उपयोग करती है"
  - "एक मध्यमार्गी दर्शन जो समाजवादी अर्थशास्त्र और रूढ़िवादी सामाजिक नीति के बीच संतुलित समझौता चाहता है"
explanation: >-
  Paleo-libertarianism बलप्रयोग के संस्थागत स्रोत के रूप में राज्य की अस्वीकृति को पारंपरिक संस्थाओं के सुदृढ़ीकरण और राज्य-प्राधिकार की तुलना में स्वैच्छिक सामाजिक संरचनाओं को प्राथमिकता देने के साथ जोड़ता है। यह पारंपरिक मूल्यों के प्रति अधिक सहानुभूति रखकर neo-libertarianism से अलग होता है। paleo-libertarian समाजवादी या सामुदायिकतावादी सिद्धांतों के आसपास संगठित समुदायों का विरोध नहीं करता; वह केवल यह अस्वीकार करता है कि ऐसे समुदाय कानून के बल से अपने मूल्य सभी पर थोपें।
reviewed: false
