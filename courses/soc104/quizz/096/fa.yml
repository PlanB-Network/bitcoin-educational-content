question: "چه کسی نخستین فهرست پستی Cypherpunk را در سال 1992 راه‌اندازی کرد؟"
answer: "Tim May و Eric Hughes، که بستری ایجاد کردند که به مرکز عصبی این جنبش تبدیل شد"
wrong_answers:
  - "Satoshi Nakamoto و Hal Finney، که بعدها در سال 2008 با هم Bitcoin را ساختند"
  - "Julian Assange و Edward Snowden، که از این فهرست برای هماهنگ کردن فعالیت‌های افشاگری دولتی استفاده کردند"
  - "Phil Zimmermann و Bruce Schneier، که این فهرست را به‌عنوان ابزاری برای توزیع نرم‌افزار رمزگذاری طراحی کردند"
explanation: >-
  در سال 1992، Tim May و Eric Hughes نخستین فهرست پستی Cypherpunk را راه‌اندازی کردند. این بستر به‌سرعت به مرکز عصبی جنبش تبدیل شد و توسعه‌دهندگان، رمزنگاران، و مدافعان آزادی دیجیتال را گرد هم آورد. Satoshi Nakamoto بعدها در سال 2008 برای نخستین بار وایت‌پیپر Bitcoin را در همین فهرست به اشتراک گذاشت.
reviewed: false
