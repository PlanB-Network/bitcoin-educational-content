bio: |
  Pregătit ca designer de interior și arhitect, am vrut să îmi leg proiectele de spațiu de pasiunea mea pentru tehnologie și Bitcoin. Prin hacking-ul obiectelor și conectarea lor la soluții de layer doi, am descoperit un mod simplu și distractiv de a populariza Bitcoin prin experiențe interactive. Astăzi, împărtășesc această abordare pentru a-i ajuta pe toți să înțeleagă, să experimenteze și să își construiască propriile proiecte interactive.
  
short_bio: Designer
