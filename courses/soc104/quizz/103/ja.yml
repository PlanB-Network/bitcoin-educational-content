question: "このコースは、自由が左派と右派の価値をどのように平和的に共存させると論じているか？"
answer: "本物の自由の体制では、左派の理想を持つ人々は自発的に所有物を共有し資金を再分配でき、右派の価値を持つ人々は貯蓄し伝統を伝えられる。どちらの側も自分たちの生き方を相手に押しつけないから"
wrong_answers:
  - "自由は、政府が穏健な規制を通じて競合する価値を均衡させる中道的立場を受け入れることで、双方が妥協することを必要とするから"
  - "自由とは、左派と右派の共同体が、それぞれ独立した政府を持つ別々の地理的領域に住まなければならないことを意味するから"
  - "自由は、市民が各地域でどの価値を強制すべきか投票できるようにし、選挙ごとに左派政策と右派政策を交替させることで機能するから"
explanation: >-
  このコースは、本物の自由の体制では、左派の理想に従う人々が自発的に所有物を手放し、生産手段を共有し、再分配組織に賃金を寄付できることを示している。
  右派の価値を持つ人々は、一生懸命働き、貯蓄し、家族的価値を伝えることができる。
  誰も自分の生き方を他者に押しつけるべきではない。
  目標は、市場の自由と選択の力を通じて平和的に達成され得る。
reviewed: false
