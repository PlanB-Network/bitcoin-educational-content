question: Vincent de Gournay ආදර්ශ ලෙස යෝජනා කරන ජාතීන් කවුරුන්ද?
answer: එංගලන්තය සහ හොලන්තය
wrong_answers:
  - හොලන්තය සහ ස්විට්සර්ලන්තය
  - ස්කොට්ලන්තය සහ එංගලන්තය
  - ස්පාඤ්ඤය සහ පෘතුගාලය
explanation: |
  Gournay එංගලන්තයේ සහ හොලන්තයේ ආර්ථික පද්ධති අගය කළේය. ඒවා ප්‍රංශයේ පද්ධතිවලට වඩා වැඩි නිදහස්භාවයක් හා වෙළඳාමට හිතකර බවක් තිබුණි.
