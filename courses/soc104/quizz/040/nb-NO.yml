question: "Hvordan definerer den strukturelle tilnærmingen den grunnleggende forskjellen mellom sosialisme og libertarianisme?"
answer: "Sosialisme gir forrang til staten gjennom regulering, planlegging og kontroll, mens libertarianisme gir forrang til individet gjennom minimal statlig inngripen"
wrong_answers:
  - "Sosialisme prioriterer rurale jordbrukssamfunn, mens libertarianisme favoriserer urban industriell utvikling"
  - "Sosialisme defineres av sin støtte til demokratiske valg, mens libertarianisme avviser alle former for politisk deltakelse"
  - "Sosialisme fokuserer på utenrikspolitikk og internasjonalt samarbeid, mens libertarianisme bare er opptatt av innenlandske økonomiske spørsmål"
explanation: >-
  Strukturelt kjennetegnes sosialisme av statens allestedsnærvær, som regulerer, planlegger og kontrollerer. Libertarianisme defineres av minimal statlig inngripen i økonomien og privatlivet, med en tendens mot forrang for individuell frihet og det frie markedet. Dette strukturelle skillet er langt mer analytisk nyttig enn å sammenligne de uttalte intensjonene til hvert system.
