question: "Welke emblematische figuren worden geassocieerd met maximale economische vrijheid op het Nolan-diagram?"
answer: "Margaret Thatcher, Ronald Reagan en Javier Milei"
wrong_answers:
  - "Franklin D. Roosevelt, Jean Jaures en Bernie Sanders"
  - "Nelson Mandela, Simone Veil en Noam Chomsky"
  - "Vladimir Putin, Xi Jinping en Joseph de Maistre"
explanation: >-
  Thatcher, Reagan en Milei worden aangehaald als emblematische figuren van maximale economische vrijheid, met een voorkeur voor minder staatsinterventie, minder regelgeving en lagere belastingen. Roosevelt, Jaures en Sanders vertegenwoordigen het tegenovergestelde uiteinde, dat staatscontrole over de economie voorstaat. Mandela, Veil en Chomsky vertegenwoordigen maximale persoonlijke vrijheid. Putin, Xi Jinping en de Maistre vertegenwoordigen maximale staatscontrole over het persoonlijke leven.
reviewed: false
