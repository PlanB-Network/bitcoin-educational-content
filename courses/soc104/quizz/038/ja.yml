question: "国家を廃止するための戦略は、リベルテールとリバタリアンの間でどのように異なりますか？"
answer: "リベルテールは歴史的に暴力的破壊を主張する一方、リバタリアンは教育と市民的不服従を通じて国家の正統性を失わせようとする"
wrong_answers:
  - "リベルテールは民主的選挙を用いて国家を解体する一方、リバタリアンは武装革命と直接行動を好む"
  - "リベルテールは代替的な共同体の構築に注力する一方、リバタリアンは既存の政治体制内で改革を通過させるために活動する"
  - "リベルテールとリバタリアンはどちらも、平和的抗議だけが社会変革の正当な手段だという点で一致している"
explanation: >-
  リベルテールは歴史的に、テロや標的攻撃を含む暴力によって国家と資本主義を破壊することを主張してきた。これに対してリバタリアンは、攻撃的な暴力を正当ではないとして拒否する。彼らの戦略は、論証、討論、教育、市民的不服従を通じて国家の正統性を失わせることに基づく。変化へのこれらの根本的に異なるアプローチは、彼らのより深い哲学的対立を反映している。
reviewed: false
