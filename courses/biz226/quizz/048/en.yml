question: "According to Efrat Fenigson, what is personal branding fundamentally about?"
answer: "Deliberately shaping how other people perceive you"
wrong_answers:
  - "Advertising your products and services to potential customers"
  - "Creating a polished public relations image for social media"
  - "Building a portfolio of professional certifications and degrees"
explanation: >-
  Efrat defines personal branding as the unique combination of values, character, skills, and expertise that reflects who you are and how you are perceived. The key word is "perceived," meaning the playing field is actively shaping how others see you. It is explicitly distinguished from PR or advertising, which are outward promotional activities rather than authentic self-articulation.
reviewed: false
