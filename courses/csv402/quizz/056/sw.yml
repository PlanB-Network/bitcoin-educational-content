question: Je, ni sehemu gani kuu zinazohitajika ili kuendesha Lightning node inayoendana na RGB?
answer: bitcoind, faharasa na server mbadala ya RGB
wrong_answers:
  - Nodi ya umeme, indexer na server ya IPFS
  - RGB ya wallet ya rununu, server ya proksi ya RGB na bitcoind
  - Mteja wa wavuti, faharasa na server mbadala ya RGB
explanation: |
  Ili kuendesha Lightning node iliyowezeshwa na RGB, unahitaji node ya bitcoind ili kuingiliana na Bitcoin Blockchain, faharasa ya mining miamala ya On-Chain, na server ya proksi ya RGB ili kuwezesha Exchange ya shehena kati ya programu zingine.
reviewed: true
