question: "В диалозите на Gustave de Molinari от 1849 г. кой персонаж защитава свободата като фундаментален принцип, вместо да я подчинява на други цели?"
answer: "Икономистът, който разглежда свободата като принцип, който не е подчинен на никаква друга цел"
wrong_answers:
  - "Социалистът, който защитава свободата чрез прогресивни реформи, насочени към социално равенство"
  - "Консерваторът, който отстоява свободата чрез запазване на традиционния социален ред и стабилност"
  - "И тримата персонажи защитават свободата еднакво, но не са съгласни как да я приложат"
explanation: >-
  В диалозите на Molinari от Les Soirees de la rue Saint-Lazare икономистът е в постоянно несъгласие както със социалиста, така и с консерватора. Той е единственият, който защитава свободата като фундаментален принцип. Социалистът подчинява свободата на прогресивни идеали, а консерваторът я подчинява на запазването на реда, което прави икономиста уникален в неговата безусловна защита на свободата.
reviewed: false
