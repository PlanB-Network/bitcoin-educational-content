question: "計算 #ᶜ(comp f g) 會雜湊 128 位元組：兩次 comp 標籤，接著是兩個子 CMR。為什麼這仍然至多只是一次 SHA-256 壓縮呼叫？"
answer: 第一個 64 位元組區塊是常數 tag∥tag，它的 midstate 只需預先計算一次；只有承載子 CMR 的那個區塊會被壓縮。
wrong_answers:
  - 光是省去 SHA-256 最終的長度填充區塊，就能讓整個 128 位元組塞進一次呼叫。
  - 兩個子 CMR 被 XOR 成一個 32 位元組的摘要，將輸入縮減為單一個區塊。
  - SHA-256-midstate 是一種寬區塊變體，能一次吸收 128 位元組的訊息區塊。
explanation: >-
  SHA-256 的壓縮函數處理的是固定的 64 位元組區塊，所以一個 128 位元組的輸入通常需要兩次呼叫（在完整的 SHA-256 中，還要再加一次來處理長度填充）。因為每個組合子的第一個區塊都是常數 tag∥tag，它的 midstate 可以預先計算一次並加以快取；於是每個運算式只需要對承載其子節點 CMR 的那個區塊做一次全新的壓縮。midstate 同樣會省去最終的填充區塊，但光憑這一點仍會留下兩次壓縮 —— 是那個預先計算好的 tag midstate 才把它降到至多一次。
reviewed: false
