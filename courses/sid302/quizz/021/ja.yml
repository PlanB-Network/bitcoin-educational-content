question: Liquidの2分という決済時間は、従来の金融システムと比べてどのような主なビジネス上の利点をもたらしますか？
answer: 受け渡しと支払いが同時に行われるアトミックな決済を可能にし、カウンターパーティーリスクを減らす
wrong_answers:
  - アセット取引における規制への準拠やKYCの必要性をなくす
  - 取引手数料なしで、高頻度取引を無制限にスケールさせられる
  - 組み込みのマーケットメイク・アルゴリズムにより、自動的な価格発見を可能にする
explanation: |
  Liquidの2分決済はアトミックな決済を可能にします。両者が受け取るべきものを同時に受け取るため、一方が債務不履行に陥りうる時間差がなくなり、カウンターパーティーリスクを減らすうえで非常に重要です。従来のT+2決済では、カウンターパーティーリスクが存在する期間が生じます。他の選択肢は誤りです。LiquidでもAMPによるコンプライアンスは必要であり、取引手数料もスケーラビリティの限界もあり、自動的なマーケットメイク機能も提供していません。