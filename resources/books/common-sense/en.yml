title: "Common Sense"

publication_year: 1776

cover: cover_en.webp

original: true

description: |
  Thomas Paine's incendiary pamphlet, published anonymously in January 1776, made the case for American independence from Great Britain in plain language accessible to ordinary colonists. Selling over 500,000 copies in its first year, it remains one of the most influential political pamphlets ever written. Paine argued that hereditary monarchy was absurd, that government existed only to secure liberty and property, and that separation from Britain was both inevitable and urgent.
