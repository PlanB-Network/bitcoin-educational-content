question: "Nguyên tắc bất xâm phạm do Murray Rothbard lý thuyết hóa là gì?"
answer: "Việc khởi xướng vũ lực thể chất chống lại một cá nhân khác hoặc tài sản của họ là phi chính đáng, dù bạo lực phòng vệ được cho phép"
wrong_answers:
  - "Mọi hình thức bạo lực luôn sai trái, bao gồm cả tự vệ và phản kháng áp bức"
  - "Bạo lực có thể chấp nhận được khi nhắm vào các định chế áp bức nhưng không bao giờ được nhắm vào các cá nhân khác"
  - "Chỉ nhà nước mới có quyền chính đáng sử dụng vũ lực, và các cá nhân không bao giờ được dùng đến bạo lực"
explanation: >-
  Nguyên tắc bất xâm phạm của Rothbard cho rằng việc khởi xướng vũ lực thể chất chống lại một người khác hoặc tài sản của họ là phi chính đáng. Đó là một chuyển dịch triết học của quy tắc vàng. Tuy nhiên, nguyên tắc này không cấm mọi bạo lực: bạo lực phòng vệ, bao gồm tự vệ và phản kháng áp bức, được coi là chính đáng. Điều này phân biệt nó với chủ nghĩa hòa bình tuyệt đối và với độc quyền dùng vũ lực mà nhà nước tuyên bố nắm giữ.
