question: "Vilka är centrismens kardinalvärden?"
answer: "Måttfullhet, kompromiss, anpassning och allmän nytta"
wrong_answers:
  - "Tradition, ordning, auktoritet och nationell identitet"
  - "Frihet, privat egendom, samtycke och individuellt ansvar"
  - "Jämlikhet, social rättvisa, solidaritet och kollektivt ägande"
explanation: >-
  Centrismens kardinalvärden är måttfullhet, kompromiss, anpassning och allmän nytta. De återspeglar den centristiska betoningen på pragmatisk balans snarare än ideologisk förpliktelse. De andra alternativen beskriver kardinalvärdena för konservatism, libertarianism respektive socialism.
reviewed: false
