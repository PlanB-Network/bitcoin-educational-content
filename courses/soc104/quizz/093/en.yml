question: "What three pillars of the welfare state does Bitcoin challenge?"
answer: "The fiscal system, the monetary monopoly to finance spending through debt, and the surveillance of transactions to prevent use of alternative currencies"
wrong_answers:
  - "The military budget, the public education system, and the government-controlled healthcare infrastructure"
  - "The judicial system, the legislative process, and the executive enforcement of regulations on businesses"
  - "The social security system, the minimum wage legislation, and the progressive income tax structure"
explanation: >-
  Bitcoin challenges the three pillars on which the welfare state rests. First, the fiscal system which is insufficient to cover expenditures. Second, the monetary monopoly, meaning the capacity to issue money to finance spending through debt. Third, the surveillance of transactions, the ability to prevent people from using any currency other than the state-imposed fiat. Bitcoin undermines all three simultaneously.
reviewed: false
