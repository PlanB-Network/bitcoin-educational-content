question: Kde sa stretli Adam Smith a fyziokrati?
answer: V Paríži
wrong_answers:
  - V Glasgowe
  - V Londýne
  - Nikdy sa nestretli
explanation: |
  Adam Smith sa s fyziokratmi stretol v Paríži počas svojej cesty po Európe. Ich myšlienky ho ovplyvnili, no vytvoril aj vlastnú ekonomickú teóriu, ktorá sa v niektorých ohľadoch od fyziokracie líšila.
