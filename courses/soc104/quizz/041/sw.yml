question: "Usoshalisti hushughulikiaje uhuru kwa namna tofauti katika nyanja za kijamii na kiuchumi?"
answer: "Usoshalisti hupendelea uhuru wenye nguvu katika nyanja ya kijamii lakini uhuru dhaifu katika nyanja ya kiuchumi"
wrong_answers:
  - "Usoshalisti huzuia uhuru wote kwa usawa katika nyanja zote mbili, ya kijamii na ya kiuchumi"
  - "Usoshalisti hupendelea uhuru imara wa kiuchumi lakini huzuia uhuru wa kijamii ili kudumisha utaratibu wa kijamii"
  - "Usoshalisti hutoa uhuru usio na kikomo katika nyanja zote mbili na hutegemea ushirikiano wa hiari kudumisha uwiano"
explanation: >-
  Katika fikra za kisoshalisti, kuna mgawanyiko wa msingi kati ya uhuru wa kijamii na uhuru wa kiuchumi. Uhuru wa kijamii ni wenye nguvu, lakini uhuru wa kiuchumi ni dhaifu kutokana na msisitizo juu ya udhibiti wa dola, upangaji, na ugawaji upya wa utajiri. Jibu la tatu lisilo sahihi linaeleza fikra bora ya libertarian, ilhali la pili linaeleza muundo wa kihafidhina, ambao ni taswira ya kinyume ya usoshalisti.
