question: "Která postava v dialozích Gustava de Molinariho z roku 1849 hájí svobodu jako základní princip, místo aby ji podřizovala jiným cílům?"
answer: "Ekonom, který chápe svobodu jako princip nepodřízený žádnému jinému cíli"
wrong_answers:
  - "Socialista, který hájí svobodu prostřednictvím progresivních reforem zaměřených na sociální rovnost"
  - "Konzervativec, který podporuje svobodu zachováváním tradičního společenského řádu a stability"
  - "Všechny tři postavy hájí svobodu stejně, ale neshodnou se na tom, jak ji uskutečnit"
explanation: >-
  V Molinariho dialozích z Les Soirees de la rue Saint-Lazare stojí ekonom v trvalém nesouhlasu jak se socialistou, tak s konzervativcem. Je jediný, kdo hájí svobodu jako základní princip. Socialista podřizuje svobodu progresivním ideálům a konzervativec ji podřizuje zachování řádu, čímž se ekonom stává jedinečným svou bezpodmínečnou obranou svobody.
