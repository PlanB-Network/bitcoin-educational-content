question: Chi phí để vận hành một máy chủ Bitcoin trên Raspberry Pi 4 về mặt tiêu thụ điện năng hàng năm là bao nhiêu (tính đến năm 2023)?
answer:  Ít hơn 10€ một chút mỗi năm.
wrong_answers:
  - Nhiều hơn 50€ một chút mỗi năm.
  - Ít hơn 100€ một chút mỗi năm.
  - Khoảng 200€ mỗi năm.
explanation: |
  Việc vận hành một máy chủ Bitcoin trên Raspberry Pi 4 tiêu thụ một lượng điện năng khiến chi phí hàng năm ít hơn 10€  một chút tính đến năm 2023.
reviewed: true