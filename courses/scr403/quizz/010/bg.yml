question: Как работи логическата операция AND в Simplicity?
answer: Тя се разклонява по първия бит — ако е false, връща false, иначе връща втория бит.
wrong_answers:
  - Тя умножава двете булеви стойности една с друга чрез product типа.
  - Тя използва таблица за търсене с всички четири възможни входни комбинации.
  - Тя прилага комбинатора XOR и след това комбинатора NOT към резултата.
explanation: >-
  AND е дефинирана като case (injl unit) (drop iden). Комбинаторът case
  се разклонява по първия бит. Ако той е false (с ляв таг), injl unit
  връща false независимо от втория бит. Ако е true (с десен таг),
  drop iden връща втория бит непроменен. Това съответства на таблицата на истинност за AND.
