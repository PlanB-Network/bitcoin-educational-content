question: "Qual é a posição socialista sobre saúde?"
answer: "O acesso à saúde é um direito fundamental, e o Estado deve garantir um sistema universal, financiado publicamente, para todos, independentemente da renda"
wrong_answers:
  - "A saúde deve ser um sistema misto, com cobertura estatal básica suplementada por opções de seguro privado"
  - "Mercados privados entregam uma saúde mais inovadora, portanto os indivíduos devem escolher livremente seu próprio sistema"
  - "O Estado deve fornecer saúde apenas aos cidadãos mais pobres, enquanto o seguro privado cobre todos os demais"
explanation: >-
  Para os socialistas, o acesso à saúde é um direito fundamental, não uma mercadoria. O Estado deve garantir um sistema universal de saúde financiado publicamente para que todos tenham acesso a cuidados, independentemente da renda. Isso reflete a preocupação socialista com igualdade, justiça social e a importância do Estado na organização de serviços de interesse geral. O sistema misto descreve a visão centrista, enquanto abordagens baseadas na escolha refletem posições libertárias e conservadoras.
