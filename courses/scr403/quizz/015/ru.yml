question: Почему комбинатор 'case' включает в свою сигнатуру общий тип окружения C?
answer: Чтобы обе ветви могли читать общие контекстные данные наряду с помеченным входным значением.
wrong_answers:
  - Чтобы ограничить размер входных данных и предотвратить переполнение стека.
  - Чтобы обеспечить рекурсивные вызовы туда и обратно между двумя ветвями.
  - Чтобы сохранять выходные данные предыдущего комбинатора в цепочке.
explanation: >-
  Комбинатор case имеет сигнатуру (A + B) × C ⊢ D. Дополнительный тип C
  выступает как общее окружение, к которому имеют доступ и левая ветвь
  (f : A × C ⊢ D), и правая ветвь (g : B × C ⊢ D). Это мощнее простого
  if-then-else, поскольку ветви получают как свои специфичные данные,
  так и контекстную информацию, необходимую для вычисления.
reviewed: false
