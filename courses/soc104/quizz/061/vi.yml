question: "Tuyên bố năm 1920 của Mussolini 'Tất cả trong Nhà nước, không gì ngoài Nhà nước, không gì chống lại Nhà nước' cho thấy điều gì về chủ nghĩa toàn trị?"
answer: "Không còn bất kỳ sự tách biệt nào giữa không gian công và không gian tư, vì nhà nước hấp thụ hoàn toàn xã hội"
wrong_answers:
  - "Nhà nước chỉ tập trung vào sức mạnh quân sự trong khi để nền kinh tế cho doanh nghiệp tư nhân"
  - "Công dân được tự do tổ chức riêng tư miễn là họ không công khai chỉ trích chính phủ"
  - "Chính phủ chỉ kiểm soát hoạt động chính trị trong khi đời sống văn hóa và tôn giáo vẫn tự chủ"
explanation: >-
  Tuyên bố của Mussolini nắm bắt bản chất của chủ nghĩa toàn trị: tính toàn thể. Mọi thứ đều bị hấp thụ vào nhà nước, nghĩa là không có sự tách biệt giữa không gian công và không gian tư. Xã hội mất mọi hình thức tự chủ, cho đến cả những hoạt động tầm thường nhất như mở một câu lạc bộ thể thao. Điều này vượt xa việc chỉ kiểm soát các lĩnh vực quân sự, chính trị hoặc kinh tế.
reviewed: false
