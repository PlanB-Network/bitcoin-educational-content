question: "Mengapa sumbu kiri-kanan dianggap tidak memadai untuk menempatkan pemikir liberal klasik seperti Bastiat atau Ron Paul?"
answer: "Karena liberalisme klasik menghargai kebebasan ekonomi dan pribadi, yang tidak sepenuhnya dianut baik oleh kiri maupun kanan"
wrong_answers:
  - "Karena kaum liberal klasik selalu sejalan dengan kebijakan ekonomi sayap kanan dan menolak semua posisi sayap kiri"
  - "Karena kaum liberal klasik adalah kaum sentris yang mengadopsi versi moderat dari ideologi kiri dan kanan"
  - "Karena kaum liberal klasik menentang semua bentuk pemerintahan, sehingga mereka adalah anarkis, bukan pemikir politik"
explanation: >-
  Sumbu kiri-kanan gagal memetakan kaum liberal klasik karena tidak dapat mengakomodasi posisi yang secara bersamaan membela kebebasan ekonomi (biasanya kanan) dan kebebasan pribadi (biasanya kiri). Kaum liberal klasik bukanlah kaum sentris yang mencari kompromi, juga bukan anarkis atau sepenuhnya sayap kanan. Mereka memang tidak cocok ditempatkan pada spektrum satu dimensi.
