question: "U pitanju regulacije vatrenog oružja, koja je ključna razlika između konzervativne i libertarijanske pozicije?"
answer: "Obe prihvataju određenu regulaciju, ali konzervativci žele pravila od legitimne javne vlasti, dok libertarijanci žele da pravila nastanu od onih na koje se neposredno odnose, poput udruženja građana i tržišne konkurencije"
wrong_answers:
  - "Konzervativci se protive svakoj regulaciji vatrenog oružja, dok libertarijanci prihvataju strogu državnu kontrolu radi javne bezbednosti"
  - "Konzervativci žele potpuno da zabrane vatreno oružje, dok libertarijanci podržavaju neograničen pristup svakom oružju"
  - "Konzervativci zasnivaju svoju poziciju na individualnim pravima, dok libertarijanci svoju zasnivaju na kolektivnoj odgovornosti"
explanation: >-
  I konzervativci i libertarijanci slažu se da je neki oblik regulacije nošenja oružja neophodan. Ključna razlika je u tome ko uspostavlja ta pravila. Konzervativci insistiraju da propisi moraju poticati od javne vlasti zadužene za očuvanje opšteg dobra (odozgo nadole). Libertarijanci tvrde da regulacija treba da nastane od onih na koje se neposredno odnosi: stručnjaka za bezbednost, udruženja građana i tržišne konkurencije (odozdo nagore).
