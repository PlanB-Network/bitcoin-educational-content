question: "Siyasi muhafazakârlık nedir?"
answer: "Yerleşik siyasi kurumları ve toplumsal düzeni korumayı amaçlayan, büyük yapısal sarsıntılara karşı çıkan bir ideoloji"
wrong_answers:
  - "Geleneksel aile değerlerine ve dini uygulamalara, bunları başkalarına dayatmaya çalışmadan kişisel bağlılık"
  - "Demokratik reform ve ilerici mevzuat yoluyla hızlı toplumsal değişimi teşvik eden bir felsefe"
  - "Serbest piyasaları, asgari vergilendirmeyi ve ticaret engellerinin kaldırılmasını savunan bir ekonomik teori"
explanation: >-
  Siyasi muhafazakârlık, çoğu zaman sağ veya aşırı sağ partilerde temsil edilen, yerleşik siyasi kurumları ve toplumsal düzeni korumayı amaçlayan, büyük yapısal sarsıntılara karşı çıkan bir ideolojidir. Savunucuları miraslarını korumak için iktidarı ve yasayı kullanmak ister. Bu, siyasi bir programdan ziyade kişisel bir yaşam tercihi olan kültürel muhafazakârlıktan farklıdır.
