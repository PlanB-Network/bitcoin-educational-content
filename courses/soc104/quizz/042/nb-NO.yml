question: "Hva betyr begrepet 'holisme' i konteksten av sosialistisk filosofi?"
answer: "Et syn på samfunnet som en udelelig helhet der kollektivet får forrang over individet"
wrong_answers:
  - "En filosofi som behandler hvert individ som en selvstendig enhet hvis rettigheter ikke kan overstyres av noen gruppe"
  - "En økonomisk teori som tar til orde for å balansere offentlig og privat sektor i like stor grad"
  - "En politisk strategi som integrerer alle minoritetssynspunkter i én konsensusbasert plattform"
explanation: >-
  Holisme kommer fra det greske 'holos', som betyr 'helheten.' I sosialistisk tenkning viser det til et syn på samfunnet som en udelelig helhet heller enn en enkel sum av individer. Den sosialistiske staten har som mål å ta ansvar for og styre menneskelig aktivitet maksimalt. Dette kollektivet kan representeres som en sosial klasse, en nasjon, en rase eller et kjønn, men i hvert tilfelle defineres individet av gruppetilhørighet.
