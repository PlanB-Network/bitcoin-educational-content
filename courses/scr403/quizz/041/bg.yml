question: По време на харчене клон на case се орязва. Как верификаторът все пак може да съпостави разкритата програма с ангажирания CMR?
answer: CMR е Merkle корен, така че харчещата страна предоставя само CMR-а на орязания клон, а верификаторът го включва, за да преизчисли корена.
wrong_answers:
  - Верификаторът използва само изпълнения клон, тъй като неизпълнените case клонове никога не са били в CMR.
  - Орязаните клонове стават каноничен заместител, чийто фиксиран CMR замества клона при преизчисляване на корена.
  - Пълният код на орязания клон остава в witness-а, където верификаторът го хешира, но не го изпълнява.
explanation: >-
  CMR на case f g е тагнат хеш върху CMR-ите на двете деца, така че всеки
  клон — изпълнен или не — е ангажиран при създаването на адреса. Тъй като
  конструкцията е Merkle дърво, орязан клон може да бъде обобщен само чрез своя
  32-байтов CMR: верификаторът включва този хеш в рекурсивното изчисление и
  проверява, че коренът съвпада с ангажимента на UTXO, без никога да вижда
  орязания код. Именно затова за ангажимента се използва Merkle корен и затова
  всякакви witness изрази вътре в орязания клон никога не се появяват on-chain.
reviewed: false
