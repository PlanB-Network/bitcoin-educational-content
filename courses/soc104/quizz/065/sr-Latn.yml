question: "Kako su se ekonomski pristupi Hitlerove Nemačke i Staljinovog Sovjetskog Saveza razlikovali, uprkos njihovim zajedničkim totalitarnim metodama?"
answer: "Nacistička Nemačka zadržala je privid privatne svojine dok je privatni sektor podredila državnim ciljevima, dok je staljinizam ukinuo svu privatnu svojinu i potpuno planirao ekonomiju"
wrong_answers:
  - "Nacistička Nemačka je potpuno nacionalizovala sve industrije, dok je Staljinov režim dopuštao ograničeno privatno preduzetništvo u poljoprivredi"
  - "Nacistička Nemačka je promovisala slobodnu međunarodnu trgovinu kako bi finansirala ponovno naoružavanje, dok je staljinizam nametnuo potpunu ekonomsku izolaciju"
  - "Nacistička Nemačka se oslanjala na dobrovoljnu korporativnu saradnju s državom, dok je staljinizam koristio samo prisilni rad"
explanation: >-
  Iako su oba režima koristila identične političke metode (kult ličnosti, totalni nadzor, sistematsko eliminisanje opozicije), njihovi ekonomski modeli razlikovali su se po formi. Nacistička Nemačka nije formalno ukinula privatnu svojinu, ali je potpuno podredila privatni sektor državnim ciljevima poput rata i ponovnog naoružavanja, namećući ekonomsku autarkiju. Staljinizam je otišao dalje ukidanjem sve privatne svojine, sprovođenjem petogodišnjih planova i direktnom kontrolom celokupne proizvodnje i distribucije.
