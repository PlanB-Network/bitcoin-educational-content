question: 32비트 논스(nonce)를 모두 소진했을 때 탐색 범위를 확장하는 메커니즘은 무엇인가요
answer: 엑스트라 논스(extra-nonce)
wrong_answers:
  - 슈퍼 논스(super-nonce)
  - 코인베이스 논스(coinbase-nonce)
  - 더블 논스(double-nonce)
explanation: |
  코인베이스 트랜잭션의 scriptSig 내에 있는 엑스트라 논스를 수정하면 머클 루트가 변경되고 결과적으로 블록 헤더가 바뀌어 새로운 탐색 범위가 생성됩니다.
reviewed: true