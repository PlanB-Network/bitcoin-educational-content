question: "Кои са двата странични ефекта, използвани в Simplicity за приложения в Bitcoin и Liquid?"
answer: "Ефектът Failure (изключение от тип 1) и ефектът Reader (достъп до данни от транзакционната среда)."
wrong_answers:
  - "Ефектът State (променливи с променяемо състояние) и ефектът Writer (логване в транзакционен лог)."
  - "Ефектът IO (мрежова комуникация) и ефектът Memory (динамично заделяне на памет)."
  - "Ефектът Continuation (callback-и) и ефектът Nondeterminism (множество пътища на изпълнение)."
explanation: >-
  Simplicity използва точно два странични ефекта за блокчейн приложения. Ефектът Failure позволява
  изчисленията да прекъсват (напр. когато проверка на подпис се провали), а ефектът Reader позволява
  на изразите да четат данни от транзакционната среда. Основните комбинатори остават чисти —
  страничните ефекти се въвеждат чрез джетове.
reviewed: true
