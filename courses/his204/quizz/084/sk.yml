question: Aké sú tri finančné imperatívy, ktoré Turgot predložil vo svojom slávnom liste Ľudovítovi XVI., keď vstúpil do Contrôle Général?
answer: Žiadny bankrot. Žiadne zvyšovanie daní. Žiadne požičiavanie
wrong_answers:
  - Žiadna reforma. Žiadne nové dane. Žiadne nové zákony.
  - Žiadna nová vojna. Žiadne zvyšovanie daní. Žiadne požičiavanie
  - Žiadne nepotrebné výdavky. Žiadne privilégiá. Žiadne protekcionárstvo.
explanation: |
  Turgotove tri imperatívy boli: žiadny bankrot, žiadne zvyšovanie daní, žiadne požičiavanie. Veril, že tieto tri princípy sú nevyhnutné na ozdravenie štátnych financií a na oživenie hospodárstva.
