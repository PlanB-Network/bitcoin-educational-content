question: "Zašto su klasični liberali u Sjedinjenim Državama od 1960-ih nadalje počeli da sebe nazivaju 'libertarijancima'?"
answer: "Da bi se razlikovali od američkih liberala, čije se značenje pomerilo ka državnom intervencionizmu"
wrong_answers:
  - "Da bi se svrstali uz Democratic Party i njene progresivne socijalne programe"
  - "Da bi signalizirali svoju podršku reformama Great Society Lyndona B. Johnsona"
  - "Da bi usvojili radikalniji revolucionarni identitet inspirisan evropskim socijalističkim pokretima"
explanation: >-
  U Sjedinjenim Državama reč 'liberal' pomerila se ka značenju pristalica Big Government-a i državne intervencije, naročito posle New Deal-a i Great Society. Klasični liberali su usvojili oznaku 'libertarijanac' kako bi sačuvali izvorno značenje svoje filozofije. Distancirali su se od američkih liberala, nisu se svrstavali uz njih.
reviewed: false
