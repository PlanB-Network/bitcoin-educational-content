question: "Wat onderscheidt neoconservatieven van paleoconservatieven in hun benadering van buitenlands beleid?"
answer: "Neoconservatieven rechtvaardigen militair interventionisme om democratie te verspreiden, terwijl paleoconservatieven een meer isolationistisch buitenlands beleid verdedigen"
wrong_answers:
  - "Neoconservatieven verzetten zich tegen elke militaire actie en verkiezen diplomatie, terwijl paleoconservatieven preventieve aanvallen tegen potentiële dreigingen steunen"
  - "Neoconservatieven richten zich uitsluitend op economische sancties, terwijl paleoconservatieven pleiten voor het bouwen van internationale coalities voor gezamenlijke militaire operaties"
  - "Neoconservatieven en paleoconservatieven zijn het eens over buitenlands beleid maar verschillen sterk over binnenlandse economische regulering"
explanation: >-
  Vanaf de jaren 2000 raakten neoconservatieven steeds sterker betrokken bij het rechtvaardigen van militair interventionisme om democratie over de hele wereld te vestigen, vooral na 11 september 2001. Als reactie claimden traditionele conservatieven het label 'paleoconservatief' om zich te onderscheiden. Paleoconservatieven bekritiseren militair interventionisme, verdedigen een meer isolationistisch buitenlands beleid en leggen meer nadruk op nationale en culturele identiteit.
reviewed: false
