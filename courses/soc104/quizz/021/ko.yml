question: "정치적 보수주의란 무엇인가요?"
answer: "기존 정치 제도와 사회 질서를 보존하려 하며, 중대한 구조적 격변에 반대하는 이념입니다"
wrong_answers:
  - "전통적 가족 가치와 종교 관행을 타인에게 강요하려 하지 않는 개인적 헌신입니다"
  - "민주적 개혁과 진보적 입법을 통해 빠른 사회 변화를 촉진하는 철학입니다"
  - "자유 시장, 최소한의 과세, 무역 장벽 철폐를 옹호하는 경제 이론입니다"
explanation: >-
  정치적 보수주의는 흔히 우파 또는 극우 정당으로 대표되는 이념으로, 기존 정치 제도와 사회 질서를 보존하고 중대한 구조적 격변에 반대하려 합니다. 그 지지자들은 권력과 법을 사용해 자신들의 유산을 지키고자 합니다. 이는 정치적 프로그램이 아니라 개인적 삶의 선택인 문화적 보수주의와 다릅니다.
