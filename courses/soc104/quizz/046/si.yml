question: "conservatism ආර්ථික සහ සමාජීය ක්ෂේත්‍රවල නිදහස්වලට කෙසේ සලකයිද?"
answer: "ආර්ථික ක්ෂේත්‍රයේ ශක්තිමත් නිදහස්, නමුත් සමාජීය ක්ෂේත්‍රයේ දුර්වල නිදහස්"
wrong_answers:
  - "සම්ප්‍රදායික සමාජ පිළිවෙළ පවත්වා ගැනීමට ආර්ථික සහ සමාජීය ක්ෂේත්‍ර දෙකේම දුර්වල නිදහස්"
  - "සමාජීය ක්ෂේත්‍රයේ ශක්තිමත් නිදහස්, නමුත් ආර්ථික ක්ෂේත්‍රයේ දුර්වල නිදහස්"
  - "ඕනෑම ආකාරයක government intervention අවම වන පරිදි ක්ෂේත්‍ර දෙකේම සමාන සහ සීමාවක් නැති නිදහස්"
explanation: >-
  Conservatism සමාජවාදයේ mirror image එකක් වන dichotomy එකක් පෙන්වයි. ආර්ථික domain තුළ, conservatives free market, entrepreneurship, සහ private property ආරක්ෂා කරති. සමාජීය domain තුළ, සීමා සාධාරණීකරණය කරන්නේ සම්ප්‍රදායික සදාචාර norms සහ සමාජ stability රැක ගැනීම මගිනි. තුන්වන වැරදි පිළිතුර විස්තර කරන්නේ socialist pattern එක වන අතර, එය විරුද්ධය.
reviewed: false
