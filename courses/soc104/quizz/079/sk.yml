question: "Prečo sa Molinariho predpoveď z roku 1849 ukázala ako prorocká, pokiaľ ide o vzťah medzi slobodou a politickou mocou?"
answer: "Pretože konzervatívci a socialisti sa striedali pri moci a inštrumentalizovali slobodu v službách svojich príslušných politických cieľov presne tak, ako opísal"
wrong_answers:
  - "Pretože postava ekonóma, ktorú opísal, napokon získala politickú moc a zaviedla libertariánske politiky v celej Európe"
  - "Pretože jeho predpoveď, že všetky tri politické rodiny sa zlúčia do jediného centristického hnutia, sa v dvadsiatom storočí naplnila"
  - "Pretože sloboda sa postupne rozširovala po sebe idúcimi vládami, až sa stala hlavným organizačným princípom moderných demokracií"
explanation: >-
  Molinariho vízia sa ukázala ako prorocká, pretože od polovice devätnásteho storočia sa konzervatívci a socialisti striedali pri moci a uskutočňovali presne to, čo opísal: inštrumentalizáciu slobody v službách politických cieľov. Obe rodiny sú ochotné obmedzovať slobody a volať na pomoc štát, aby presadil ich príslušné agendy, zatiaľ čo ekonómova pozícia bezpodmienečnej slobody zostala marginalizovaná.
