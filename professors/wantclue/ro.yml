bio: |
  Informatician pasionat cu expertiză în networking, criptomonede și tehnologii de calcul. Dedicat să ajute oamenii prin găsirea unor soluții inovatoare la probleme și prin partajarea cunoștințelor prin conținut educațional. Specializat în hardware pentru minerit Bitcoin, în special dezvoltarea Bitaxe, și oferă tutoriale practice despre infrastructură de criptomonede și soluții hardware.

short_bio: Informatician specializat în hardware pentru minerit Bitcoin și educație despre criptomonede
