question: Je, usalama wa mpito wa RGB katika chaneli ya Lightning unahakikishwa vipi ikiwa hali ya kizamani itatangazwa?
answer: Kupitia mitambo ya kuadhibu ya Idhaa ya Lightning 
wrong_answers:
  - Kwa kughairi miamala yote ya awali kiotomatiki
  - Kupitia mechanics ya adhabu ya protocol ya RGB
  - Kupitia uingiliaji kati wa mtoaji wa mali wa RGB kupitia saini yake inayohusishwa na Genesis
explanation: |
  Utaratibu wa kawaida wa adhabu wa Lightning Network unahakikisha kwamba uenezaji wa hali ya zamani unaweza kuadhibiwa kwa kurejesha fedha zote zinazohusika, ikiwa ni pamoja na mali ya RGB.
reviewed: true
