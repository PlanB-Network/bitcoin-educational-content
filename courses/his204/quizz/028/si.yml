question: Marquis d'Argensonගේ සංකල්පය අනුව, රාජ්‍යය කුමක් විය යුතුද?
answer: අවම රාජ්‍යයක්; එය ආරක්ෂාව, යුක්තිය, මුදල් ඒකකය සහ යටිතල පහසුකම් සැපයිය යුතුය
wrong_answers:
  - ආරක්ෂණ රාජ්‍යයක්; වෙළඳුන් සහ ශිල්පීන් ආරක්ෂා කරන රාජ්‍යයක්
  - රාජ්‍යයට කිසිදු නීත්‍යානුකූලභාවයක් නැත; එය කිසිදු සේවාවක් ලබා නොදිය යුතුය
  - මැදිහත්වන රාජ්‍යයක්; ආර්ථික ජීවිතයේ සියලු අංශ නියාමනය කළ යුතු රාජ්‍යයක්
explanation: |
  Marquis d'Argenson අවම රාජ්‍යයකට කැමති වූ අතර, එය ආරක්ෂාව, යුක්තිය, මුදල් ඒකකය සහ යටිතල පහසුකම් වැනි අත්‍යවශ්‍ය කාර්යයන්ට පමණක් සීමා විය යුතු බව සැලකීය. ආර්ථික ක්ෂේත්‍රයේ ක්‍රියා කිරීමට පුද්ගලයන්ට නිදහස ලබා දිය යුතු බව ඔහු විශ්වාස කළේය.