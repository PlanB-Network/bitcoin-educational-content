question: "Cum diferă strategiile pentru abolirea statului între libertaires și libertarieni?"
answer: "Libertaires au susținut istoric distrugerea violentă, în timp ce libertarienii caută să delegitimeze statul prin educație și nesupunere civilă"
wrong_answers:
  - "Libertaires folosesc alegeri democratice pentru a demonta statul, în timp ce libertarienii favorizează revoluția armată și acțiunea directă"
  - "Libertaires se concentrează pe construirea de comunități alternative, în timp ce libertarienii lucrează în cadrul sistemului politic existent pentru a adopta reforme"
  - "Atât libertaires, cât și libertarienii sunt de acord că protestul pașnic este singurul mijloc legitim de transformare socială"
explanation: >-
  Libertaires au susținut istoric distrugerea statului și a capitalismului prin violență, inclusiv prin teroare și atacuri țintite. Libertarienii, în schimb, resping violența agresivă ca ilegitimă. Strategia lor se bazează pe delegitimarea statului prin argumentare, dezbatere, educație și nesupunere civilă. Aceste abordări fundamental diferite ale schimbării reflectă dezacordurile lor filosofice mai profunde.
