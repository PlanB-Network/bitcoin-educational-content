question: "Varför hävdar Popper att det öppna samhället förblir inneboende skört trots sina fördelar?"
answer: "Eftersom ansvaret som individualismen innebär kan verka skrämmande, vilket skapar en frestelse att söka skydd i gemenskap, auktoritet eller nostalgi efter ett idealiserat förflutet"
wrong_answers:
  - "Eftersom öppna samhällen saknar militär styrka och inte kan försvara sig mot invasion av slutna samhällen"
  - "Eftersom demokratiska institutioner är inneboende ineffektiva och till slut kollapsar under den byråkratiska komplexitetens tyngd"
  - "Eftersom öppna samhällen tillåter för stor ekonomisk ojämlikhet, vilket oundvikligen leder till revolution och införandet av auktoritära regimer"
explanation: >-
  Popper betonar att det öppna samhällets skörhet härrör från en psykologisk sårbarhet. Ansvaret som individualismen innebär kan verka skrämmande och riskabelt eftersom man måste göra sina egna val och kan misslyckas. Detta skapar en frestelse att söka skydd i gemenskap eller nostalgiska tendenser mot ett idealiserat förflutet. Det öppna samhället står inför ständiga utmaningar från kommunitära impulser och den återkommande frestelsen till våld.
