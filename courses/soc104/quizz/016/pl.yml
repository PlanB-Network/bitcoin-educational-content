question: "Co lewica chce obejmować ustawodawstwem i regulacjami?"
answer: "Gospodarkę, kierując się wrogością wobec wolności gospodarczej, kapitalizmu i wolnego rynku"
wrong_answers:
  - "Moralność osobistą i praktyki religijne, kierując się pragnieniem zachowania tradycyjnych instytucji"
  - "Imigrację i granice państwowe, kierując się obawami o tożsamość kulturową i suwerenność"
  - "Technologię i innowacje, kierując się obawami, że automatyzacja zastąpi pracowników"
explanation: >-
  Lewica nadaje priorytet sprawiedliwości społecznej i równości, szczególnie na poziomie gospodarczym. Prowadzi to do jej wrogości wobec wolności gospodarczej, kapitalizmu i wolnego rynku oraz do chęci obejmowania gospodarki ustawodawstwem i regulacjami. Prawica natomiast chce stanowić prawo dotyczące moralności i religii. Regulacja imigracji i technologii nie jest głównym opisanym tutaj przedmiotem zainteresowania.
