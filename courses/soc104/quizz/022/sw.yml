question: "Libertarian mwenye uhifadhi wa kitamaduni hushughulikiaje tabia anazozikataa kimaadili?"
answer: "Huzipinga na kuzivunja moyo tabia hizo kupitia ushawishi na mfano, lakini bila kutumia nguvu ya kulazimisha ya sheria"
wrong_answers:
  - "Huunga mkono marufuku za serikali za mitaa dhidi ya tabia hizo huku akipinga marufuku za ngazi ya shirikisho"
  - "Hunyamaza kabisa kuhusu tabia hizo, akiamini kwamba aina yoyote ya kukataa kimaadili inakiuka uhuru wa mtu binafsi"
  - "Hutetea mahakama za jamii zinazoweza kuadhibu tabia hizo nje ya mfumo rasmi wa kisheria"
explanation: >-
  Libertarian mwenye uhifadhi wa kitamaduni anaweza kukataa tabia fulani kimaadili, lakini hatetei marufuku ya kisheria ya vitendo vya hiari, visivyo vya uchokozi. Anaweza kuvichukia vitendo hivyo, kuvipinga, na kuvivunja moyo kwa bidii, lakini daima kupitia ushawishi, elimu, na mfano badala ya nguvu ya kulazimisha ya sheria. Hili halihusu kunyamaza au kuunda mbinu mbadala za utekelezaji wa adhabu.
