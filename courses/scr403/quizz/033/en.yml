question: Given the 'smaller types in the premises' typing rules, which core combinators actually move data during execution?
answer: Only iden and comp; the other seven are implemented with nothing more than bookkeeping.
wrong_answers:
  - Only take and drop; extracting one component forces the machine to copy it out of the product.
  - Only pair and case; duplicating the input for two branches and dispatching on a tag shuffle data.
  - Only injl and injr; adding a tag rewrites the value into a larger sum-type representation.
explanation: >-
  Counterintuitively, the combinators that look like data access (take,
  drop, pair, case, injl, injr) need no copying: because premises in the
  typing rules involve smaller types than their conclusions, the Bit
  Machine can implement them with bookkeeping alone. Only iden, which
  copies its entire input to its output, and comp, which materializes an
  intermediate value passed from f to g, genuinely move data around.
reviewed: false
