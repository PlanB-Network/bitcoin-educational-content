question: pair (drop iden) (take iden) มีชนิดอะไร และมันหมายถึงฟังก์ชันใด?
answer: A × B ⊢ B × A — มันสลับองค์ประกอบทั้งสองของคู่
wrong_answers:
  - A × B ⊢ A × B — มันส่งองค์ประกอบทั้งสองผ่านไปโดยไม่เปลี่ยนแปลง (identity)
  - "Ill-typed: take iden และ drop iden มีชนิดเอาต์พุตต่างกัน ซึ่ง pair ไม่สามารถรวมได้"
  - (A × B) × (A × B) ⊢ B × A — pair รวมชนิดอินพุตของนิพจน์ย่อยทั้งสองของมัน
explanation: >-
  drop iden : A × B ⊢ B ดึงองค์ประกอบที่สอง และ take iden : A ×
  B ⊢ A ดึงองค์ประกอบแรก คอมบิเนเตอร์ pair ต้องการเพียงให้นิพจน์ย่อยทั้งสอง
  ใช้ชนิดอินพุตเดียวกัน (ที่นี่คือ A × B); เอาต์พุตของมันอาจต่างกันได้
  และจะถูกคืนเป็นคู่ เมื่อรับอินพุต ⟨a, b⟩ นิพจน์นี้จึงให้ผลเป็น
  ⟨b, a⟩: ฟังก์ชัน swap ซึ่งมีชนิด A × B ⊢ B × A
reviewed: false
