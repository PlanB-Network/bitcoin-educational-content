question: According to Schumpeter, what characterized Dupont de Nemours throughout his career?
answer: He remained faithful to Physiocracy despite many opportunities to renounce it
wrong_answers:
  - He constantly adapted his ideas to stay in favor with those in power
  - He gradually abandoned Physiocracy in favor of Adam Smith's theories
  - He lacked recognition from his peers throughout his life
explanation: |
  Schumpeter wrote that Dupont de Nemours "stayed faithful to Physiocracy throughout a career during which he had many opportunities to renounce it." He was a man of conviction who never denied his beliefs, even when doing so would have been politically advantageous.