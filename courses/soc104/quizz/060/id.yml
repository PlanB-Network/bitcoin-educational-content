question: "Apa dua prinsip keadilan John Rawls?"
answer: "Kebebasan setara untuk semua, dan prinsip perbedaan yang mengizinkan ketimpangan hanya jika menguntungkan mereka yang paling kurang beruntung"
wrong_answers:
  - "Hak pilih universal untuk semua warga negara, dan perpajakan progresif untuk mendanai layanan publik"
  - "Kebebasan berbicara tanpa pembatasan, dan redistribusi kekayaan wajib untuk mencapai kesetaraan"
  - "Perlindungan hak properti privat, dan prinsip non-agresi yang diterapkan pada semua tindakan negara"
explanation: >-
  Rawls mengusulkan dua prinsip: pertama, kebebasan setara untuk semua (fondasi demokrasi), dan kedua, prinsip perbedaan, yang mengizinkan ketimpangan hanya jika ketimpangan itu menguntungkan anggota masyarakat yang paling kurang beruntung. Ini berarti seseorang berhak menjadi kaya, asalkan redistribusi memungkinkan pihak yang paling tidak diuntungkan ikut memperoleh manfaat. Opsi lain mencampur unsur-unsur dari berbagai filsafat politik.
