question: "Hvorfor hevder den todimensjonale modellen at de fleste politiske spørsmål kan deles inn i økonomiske og personlige kategorier?"
answer: "Fordi økonomiske spørsmål gjelder hva du gjør som produsent og forbruker, mens personlige spørsmål gjelder dine private relasjoner, overbevisninger og kroppslige autonomi"
wrong_answers:
  - "Fordi alle politiske debatter til syvende og sist reduseres til uenigheter om skattenivåer og religiøs praksis"
  - "Fordi regjeringer historisk sett bare regulerer to ting: markedet og militæret"
  - "Fordi politiske filosofer alltid har skilt materielle anliggender fra åndelige anliggender siden antikken"
explanation: >-
  Den todimensjonale modellen bygger på ideen om at politiske spørsmål deles inn i to brede kategorier. Økonomiske friheter dekker produksjon, forbruk, handel, sysselsetting og pengeforvaltning. Personlige friheter dekker private relasjoner, meninger, overbevisninger og valg om din egen kropp og ditt eget sinn. Dette skillet muliggjør en langt mer nyansert kartlegging av politiske posisjoner enn én enkelt venstre-høyre-akse.
