question: Ce este special la scrierile cercului lui Gournay?
answer: Sunt în mare parte traduceri ale unor autori străini
wrong_answers:
  - Sunt toate scrieri care apără liberalismul economic
  - Sunt tratate de studiu științific al economiei
  - Sunt pamflete satirice
explanation: |
  Cercul lui Gournay este cunoscut pentru traducerea lucrărilor economice engleze și olandeze, contribuind la răspândirea ideilor liberale în Franța.
