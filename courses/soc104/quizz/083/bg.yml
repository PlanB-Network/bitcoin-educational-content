question: "Какво има предвид Ludwig von Mises, когато пише, че само индивидът мисли, разсъждава и действа?"
answer: "Че колективности като държавата или нацията нямат собствено съществуване отвъд действията на индивидуалните си членове"
wrong_answers:
  - "Че индивидите трябва да избягват формирането на групи или сдружения, защото колективното действие винаги е вредно"
  - "Че само определени надарени индивиди са способни на рационална мисъл, докато повечето хора следват инстинкт"
  - "Че мисленето и разсъждаването са частни дейности, които никога не трябва да бъдат споделяни или обсъждани публично"
explanation: >-
  Mises изяснява, че индивидуализмът се противопоставя на представата, че социални образувания като обществото или нацията могат да съществуват независимо от индивидите, които ги съставляват. Една колективност няма собствено съществуване отвъд действията на своите индивидуални членове. Не можем смислено да говорим за действието на държавата или на компания, защото тези образувания нямат собствена воля или мисъл и действат само чрез индивиди.
