question: "Какво разкрива cypherpunk принципът 'Cypherpunks write code' за подхода на движението към постигането на свобода?"
answer: "Че пътят към свободата минава през активно изграждане на анонимни системи, използвайки кода като фундаментален инструмент за превръщане на абстрактните идеи за свобода в реалност"
wrong_answers:
  - "Че cypherpunk-овете са предимно софтуерни разработчици, които пишат търговски приложения, за да финансират кампаниите си за политически активизъм"
  - "Че движението вярва в образоването на обществеността чрез писмени манифести и академични публикации, а не чрез пряко действие"
  - "Че cypherpunk-овете се фокусират върху хакване на съществуващи правителствени системи, за да разобличат програми за наблюдение и да наложат законодателна реформа"
explanation: >-
  Формулата "Cypherpunks write code" отразява ангажимента на движението към активна намеса, а не към проста надежда. За Eric Hughes пътят към свободата минава през активното изграждане на анонимни системи, които правят произволните политически разделения ирелевантни. Кодът става фундаменталният инструмент за превръщане на абстрактни идеи за свобода в реалност, поради което Satoshi Nakamoto написва целия Bitcoin код, преди дори да напише white paper-а.
reviewed: false
