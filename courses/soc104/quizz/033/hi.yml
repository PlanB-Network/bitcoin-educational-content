question: "Rothbard ने libertaires की मानव प्रकृति की दृष्टि की आलोचना क्यों की, और उन्होंने कौन-सा विकल्प प्रस्तावित किया?"
answer: "उन्होंने उन पर भोले-भाले 'noble savage' दृष्टिकोण का आरोप लगाया और तर्क दिया कि समाज को स्वार्थ-प्रेरित व्यवहार का मार्गदर्शन करने के लिए निजी संपत्ति और अच्छे प्रोत्साहनों का उपयोग करना चाहिए"
wrong_answers:
  - "उन्होंने मानव सहयोग की उनकी समझ की प्रशंसा की लेकिन तर्क दिया कि अनुबंधों को लागू कराने के लिए एक न्यूनतम राज्य फिर भी आवश्यक था"
  - "उन्होंने माना कि मनुष्य स्वाभाविक रूप से अच्छे हैं लेकिन ज़ोर दिया कि केवल मुक्त बाज़ार ही उस अच्छाई को उत्पादक गतिविधि में बदल सकते हैं"
  - "उन्होंने व्यक्तिगत अधिकारों पर उनके ज़ोर को अस्वीकार किया और इसके बजाय तर्क दिया कि समुदायों को सामूहिक रूप से नैतिक मानकों को परिभाषित करना चाहिए"
explanation: >-
  Rothbard ने libertaires की आलोचना की कि उन्होंने मानव प्रकृति को स्वाभाविक रूप से अच्छा मानने वाली भोली, Rousseau-सदृश दृष्टि अपनाई। इसके बजाय उन्होंने तर्क दिया कि लोग स्वार्थ से संचालित होते हैं, और समाज को इस तरह संगठित होना चाहिए कि अच्छे प्रोत्साहन व्यवहार का मार्गदर्शन करें। इसके लिए निजी संपत्ति को मान्यता देना और उसकी गारंटी देना आवश्यक है। राज्य को समाप्त करने का अर्थ उसके कार्यों को समाप्त करना नहीं है; पुलिस और न्याय को प्रतिस्पर्धा के माध्यम से मुक्त बाज़ार द्वारा प्रबंधित किया जाना चाहिए।
reviewed: false
