question: "Miten libertaarit näkevät yksityisomaisuuden ja vapauden välisen suhteen?"
answer: "Yksityisomaisuus on luonnollinen oikeus, joka edeltää lakia ja valtiota, ja se on vapauden varsinainen perusta"
wrong_answers:
  - "Yksityisomaisuus on valtion luoma yhteiskunnallinen sopimus, joka voidaan kumota, kun se aiheuttaa eriarvoisuutta"
  - "Yksityisomaisuus on hyödyllistä taloudellisen tehokkuuden kannalta, mutta sillä ei ole luontaista moraalista tai filosofista merkitystä"
  - "Yksityisomaisuutta tulisi olla vain henkilökohtaisissa esineissä, ei tuotannollisessa omaisuudessa tai maassa"
explanation: >-
  Libertaarit puolustavat yksityisomaisuutta luonnollisena oikeutena, joka edeltää lakia ja valtiota. He väittävät, että jos yksilö omistaa oman kehonsa, hän omistaa myös työnsä ja sen hedelmät. Aineellisten hyödykkeiden omistus on itseomistuksen jatke. Tämä on jyrkässä ristiriidassa libertaire-näkemyksen kanssa, jonka mukaan omaisuus on yhteiskunnallinen sopimus tai sorron lähde.
reviewed: false
