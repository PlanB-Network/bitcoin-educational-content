question: "Was zeigt die vertikale Achse des Nolan-Diagramms über die eigentliche politische Frage?"
answer: "Sie zeigt, ob du deine eigenen Empfindungen anderen durch den Staat aufzwingen willst oder ob du es vorziehst, dass jeder Mensch frei ist, selbst zu entscheiden"
wrong_answers:
  - "Sie zeigt, ob du demokratische Regierungsführung unterstützt oder autoritäre Herrschaft durch einen einzelnen Führer bevorzugst"
  - "Sie zeigt, ob du dich mit progressiven sozialen Bewegungen oder mit traditionellen religiösen Institutionen identifizierst"
  - "Sie zeigt, ob dein Hauptanliegen nationale Sicherheit oder wirtschaftlicher Wohlstand ist"
explanation: >-
  Die vertikale Achse legt die eigentliche politische Frage offen: nicht, ob du links oder rechts bist, sondern in welchem Ausmaß du willst, dass der Staat in die Gestaltung der Gesellschaft nach deinen Werten eingreift. Willst du anderen deine Empfindungen aufzwingen, oder ziehst du es vor, dass jeder Mensch frei ist, selbst zu entscheiden? Diese Rahmung überschreitet die Links-Rechts-Trennung und zeigt, dass beide Lager gleichermaßen etatistisch sein können.
reviewed: false
