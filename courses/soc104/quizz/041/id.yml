question: "Perpecahan mendasar apa yang memisahkan kaum sosialis sejak awal abad kedua puluh dan seterusnya?"
answer: "Sosialis revolusioner yang berusaha merebut kekuasaan melalui kekerasan versus sosialis reformis yang mengejar perubahan melalui pemilihan demokratis"
wrong_answers:
  - "Sosialis perkotaan yang berfokus pada pekerja industri versus sosialis pedesaan yang mengorganisasi komune pertanian"
  - "Sosialis nasionalis yang memprioritaskan negaranya sendiri versus sosialis internasionalis yang menganjurkan revolusi global"
  - "Sosialis intelektual yang menulis teks teoretis versus sosialis aktivis yang mengorganisasi pemogokan buruh"
explanation: >-
  Sejak awal abad kedua puluh, sebuah perpecahan mendasar memisahkan sosialis revolusioner, yang menentang hak kepemilikan dan berusaha menghancurkan masyarakat kapitalis melalui kekerasan atau kediktatoran proletariat, dari sosialis reformis, yang mengejar keadilan sosial melalui pemilihan demokratis dan perpajakan sambil sementara menerima kapitalisme. Perpecahan ini membentuk seluruh sejarah berikutnya dari gerakan-gerakan sosialis.
reviewed: false
