question: "Co libertariáni kladou do středu své politické filozofie?"
answer: "Etiku a právo"
wrong_answers:
  - "Ekonomický růst a tvorbu bohatství"
  - "Sociální rovnost a kolektivní blahobyt"
  - "Národní identitu a kulturní zachování"
explanation: >-
  Libertariáni se od všech ostatních politických rodin odlišují tím, že do středu své filozofie kladou etiku a právo, nikoli ekonomiku. Když hájí tržní ekonomiku, činí tak méně kvůli její schopnosti vytvářet bohatství než kvůli tomu, že podporuje individuální svobodu a odpovědnost. Ekonomický růst je vedlejším přínosem, nikoli základním principem.
