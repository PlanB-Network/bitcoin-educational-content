question: "Why does the course say we do not actually live in a free market?"
answer: "Because heavy regulation, taxation and state-controlled interest rates make it a hampered market, not an unhampered one."
wrong_answers:
  - "Because private property was abolished in the West."
  - "Because all prices are set by ministries."
  - "Because the free market requires a gold standard by definition."
explanation: |
  The 'free market' we are told fails here and there is not a free market at all. Even economic-freedom indices substantially understate the real coercion in Western systems.
reviewed: false
