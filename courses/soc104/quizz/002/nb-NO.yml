question: "Hvilket ledende prinsipp styrte Frederic Bastiats stemmer i nasjonalforsamlingen?"
answer: "Å fremme individuelle og økonomiske friheter og redusere statlig innblanding"
wrong_answers:
  - "Forsvaret av kongelig autoritet og bevaringen av monarkiske tradisjoner"
  - "Fremmingen av sosialistisk politikk for å omfordele rikdom mer likt"
  - "En sentrumsstrategi med kompromiss mellom venstre- og høyrefraksjonene"
explanation: >-
  Bastiat stemte ut fra et grunnleggende prinsipp: å fremme individuelle og økonomiske friheter samtidig som statlig innblanding ble redusert. Han var ikke en sentrumsorientert opportunist, og heller ikke royalist eller sosialist. Han stemte med den siden som foreslo tiltak i tråd med frihet og begrenset statsmakt.
reviewed: false
