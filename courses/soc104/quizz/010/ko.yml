question: "경제적 자유 범주에는 무엇이 포함되나요?"
answer: "생산자와 소비자로서 하는 일: 구매, 판매, 생산, 노동, 고용, 그리고 자신의 돈 관리"
wrong_answers:
  - "종교적 신념, 개인적 관계, 표현의 자유"
  - "투표권, 선거 참여, 정당 가입"
  - "자유롭게 여행하고, 거주지를 선택하며, 국경을 넘을 수 있는 능력"
explanation: >-
  경제적 자유는 생산자와 소비자로서 하는 일을 포괄합니다. 무엇을 사고, 팔고, 생산할 수 있는지, 어디에서 일하는지, 누구를 고용하는지, 그리고 자신의 돈으로 무엇을 하는지가 여기에 포함됩니다. 개인적 관계, 종교적 신념, 이동의 자유는 경제적 자유가 아니라 개인적 자유 범주에 속합니다.
reviewed: false
