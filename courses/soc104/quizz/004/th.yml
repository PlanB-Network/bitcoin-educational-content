question: "พรรคการเมืองฝ่ายซ้ายและฝ่ายขวามีจุดร่วมใด แม้จะดูเหมือนเป็นฝ่ายตรงข้ามกัน?"
answer: "ทั้งสองฝ่ายปกป้องสิทธิของรัฐในการปกครองชีวิตผู้คนผ่านกฎระเบียบและภาษี"
wrong_answers:
  - "ทั้งสองฝ่ายสนับสนุนการยกเลิกการแทรกแซงของรัฐในเรื่องเศรษฐกิจโดยสมบูรณ์"
  - "ทั้งสองฝ่ายให้ความสำคัญกับเสรีภาพส่วนบุคคลเหนือการจัดระเบียบสังคมแบบรวมหมู่"
  - "ทั้งสองฝ่ายปฏิเสธการใช้นโยบายการเงินเป็นเครื่องมือสำหรับการใช้จ่ายของรัฐบาล"
explanation: >-
  แม้ดูเหมือนตรงข้ามกัน ซ้ายและขวามีความชอบร่วมกันต่อการแทรกแซงของรัฐ ทั้งสองฝ่ายวิจารณ์ตลาดเสรีและปกป้องสิทธิของรัฐในการปกครองชีวิตผู้คนผ่านกฎระเบียบและภาษี ฝ่ายซ้ายวิจารณ์ตลาดว่าเป็นแหล่งของความเหลื่อมล้ำ ขณะที่ฝ่ายขวามองว่าตลาดเป็นภัยคุกคามต่ออธิปไตย แต่ทั้งสองฝ่ายต่างหันไปหารัฐเพื่อแก้ปัญหา
reviewed: false
