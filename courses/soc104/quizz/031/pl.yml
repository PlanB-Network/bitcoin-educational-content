question: "Co francuscy libertaires (anarchiści socjalistyczni) sądzą o własności prywatnej?"
answer: "Własność prywatna i kapitalizm muszą zostać zniesione, ponieważ są źródłami opresji"
wrong_answers:
  - "Własność prywatna jest prawem naturalnym, które poprzedza państwo i musi być chronione za wszelką cenę"
  - "Własność prywatna powinna być regulowana przez państwo, ale nigdy całkowicie wyeliminowana ze społeczeństwa"
  - "Własność prywatna jest dopuszczalna tylko wtedy, gdy jest równo rozdzielona między wszystkich członków wspólnoty"
explanation: >-
  Francuscy libertaires, spadkobiercy anarchizmu socjalistycznego poprzez myślicieli takich jak Proudhon i Bakunin, utrzymują, że zarówno państwo, jak i własność prywatna muszą zostać zniesione jako bliźniacze źródła opresji. Ujmuje to słynna formuła Proudhona: „Własność to kradzież.” Pierwsza błędna odpowiedź opisuje stanowisko libertariańskie, które jest fundamentalnie przeciwstawne poglądowi libertaire.
reviewed: false
