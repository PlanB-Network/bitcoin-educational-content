question: "¿Por qué se oponen los libertarios a los impuestos?"
answer: "Porque son una violación moral de los derechos de propiedad, una forma de robo estatal que se apodera de la propiedad ajena sin consentimiento"
wrong_answers:
  - "Porque los impuestos son económicamente ineficientes y siempre conducen a tasas de desempleo más altas"
  - "Porque los impuestos desalientan la inversión extranjera y debilitan la posición competitiva de un país"
  - "Porque los sistemas fiscales progresivos apuntan injustamente a los individuos ricos que crean la mayor cantidad de empleos"
explanation: >-
  La objeción libertaria a los impuestos es moral antes que económica. Los libertarios ven los impuestos como una forma de robo estatal y un impedimento a la propiedad privada, porque consisten en apoderarse de la propiedad ajena sin consentimiento. Aunque puede haber argumentos económicos contra los impuestos, el argumento libertario fundamental descansa en el principio de que violan los derechos de propiedad, no en cálculos de eficiencia o competitividad.
