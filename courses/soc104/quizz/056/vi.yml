question: "Chủ nghĩa trung dung có xu hướng hướng tới hình thức quản trị nào?"
answer: "Kỹ trị, trong đó quyền lực được trao cho các chuyên gia lèo lái nền kinh tế và chính sách tiền tệ"
wrong_answers:
  - "Dân chủ trực tiếp, trong đó công dân bỏ phiếu về mọi quyết định chính sách lớn"
  - "Quý tộc trị, trong đó quyền lực do một tầng lớp cai trị truyền thống nắm giữ"
  - "Quản trị laissez-faire, trong đó thị trường tự điều tiết mà không có sự can thiệp của nhà nước"
explanation: >-
  Chủ nghĩa trung dung ưu tiên hiệu quả, chủ nghĩa thực dụng, và có xu hướng hướng tới kỹ trị, nghĩa là quyền lực nên được trao cho các chuyên gia lèo lái nền kinh tế và điều khiển chính sách tiền tệ. Điều này khác về căn bản với dân chủ trực tiếp, quý tộc trị, hay laissez-faire, mỗi hình thức phân phối quyền lực theo những nguyên tắc hoàn toàn khác.
