question: "Quel objectif politique commun les étatistes de gauche et de droite ont-ils ?"
answer: "Conquérir le pouvoir afin d'organiser la société selon leur vision du monde et de l'imposer à tous"
wrong_answers:
  - "Réduire la taille du gouvernement et rendre le pouvoir de décision aux citoyens individuels"
  - "Établir une démocratie directe où chaque citoyen vote sur chaque décision législative"
  - "Éliminer les partis politiques et les remplacer par une gouvernance technocratique indépendante"
explanation: >-
  Les étatistes de gauche comme de droite partagent le même objectif politique : conquérir le pouvoir pour organiser la société selon leur vision du monde et l'imposer à tous par la législation. La différence tient seulement à leurs valeurs : la droite invoque la défense de la civilisation, tandis que la gauche invoque la défense de la classe ouvrière ou des opprimés. Aucun des deux ne cherche à réduire le gouvernement ou à éliminer les partis.
reviewed: false
