question: Giai đoạn thứ hai của hiện tượng lạm phát phi mã là gì?
answer: Sự sụp đổ của tiền tệ & hiện tượng tăng giá.
wrong_answers:
  - Mất niềm tin.
  - Vòng luẩn quẩn của việc in tiền.
  - Một loại tiền tệ mới xuất hiện.
explanation: |
  Giai đoạn thứ hai của lạm phát phi mã là sụp đổ của tiền tệ & hiện tượng tăng giá, ngay sau Giai đoạn Mất niềm tin.
reviewed: true