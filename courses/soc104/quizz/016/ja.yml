question: "左派は何を立法化し、規制したいと考えているのか？"
answer: "経済であり、その動機は経済的自由、資本主義、自由市場への敵意である"
wrong_answers:
  - "個人の道徳と宗教的慣行であり、その動機は伝統的制度を守りたいという願望である"
  - "移民と国境であり、その動機は文化的アイデンティティと主権への懸念である"
  - "テクノロジーとイノベーションであり、その動機は自動化が人間の労働者に取って代わることへの恐れである"
explanation: >-
  左派は社会正義と平等、とりわけ経済面でのそれを優先する。
  これにより、左派は経済的自由、資本主義、自由市場に敵意を持ち、経済を立法化し規制したいと考えるようになる。
  これに対し、右派は道徳と宗教について立法したいと考える。
  移民やテクノロジー規制は、ここで述べられている主な焦点ではない。
reviewed: false
