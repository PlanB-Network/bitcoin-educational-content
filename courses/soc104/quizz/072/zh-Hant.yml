question: "社會主義者在醫療照護問題上的立場是什麼？"
answer: "取得醫療照護是一項基本權利，國家必須保障一個普遍、由公共資金資助的制度，使每個人不論收入如何都能使用"
wrong_answers:
  - "醫療照護應是一種混合制度，由基本國家覆蓋搭配私人保險選項補充"
  - "私人市場能提供更具創新的醫療照護，因此個人應能自由選擇自己的制度"
  - "國家應只為最貧困的公民提供醫療照護，而私人保險覆蓋其他所有人"
explanation: >-
  對社會主義者而言，取得醫療照護是一項基本權利，不是商品。國家必須保障普遍、由公共資金資助的醫療體系，使每個人都能獲得照護，不論收入如何。這反映了社會主義對平等、社會正義與國家重要性的關切，由國家在一般利益中組織服務。混合制度描述中間派觀點，而以選擇為基礎的方法則反映自由至上主義者與保守主義者的立場。
reviewed: false
