question: Tại sao nên tránh lưu ký (trữ) Bitcoin của bạn trên các sàn giao dịch?
answer: Các sàn giao dịch có thể bị tấn công bởi hacker.
wrong_answers:
  - Các sàn giao dịch tính phí ngẫu nhiên.
  - Bitcoin mất giá trên các sàn giao dịch.
  - Các sàn giao dịch không phải là cơ quan được quản lý.
explanation: |
  Nên tránh lưu ký (trữ) Bitcoin của bạn trên các sàn giao dịch vì các sàn có thể bị tấn công bởi hacker.
reviewed: true