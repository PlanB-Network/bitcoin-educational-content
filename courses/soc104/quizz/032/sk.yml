question: "Ako môžu programy sociálnej pomoci financované štátom vytvárať perverzné účinky, čím ilustrujú nebezpečenstvo spoliehania sa výlučne na zámery?"
answer: "Môžu vytvárať závislosť, odstraňovať stimuly pracovať a predstavovať vyvlastnenie, keďže peniaze sa najprv musia vziať tým, ktorí bohatstvo vytvorili"
wrong_answers:
  - "Podporujú nadmerné osobné úspory, znižujú spotrebiteľské výdavky a spôsobujú defláciu v širšej ekonomike"
  - "Posilňujú súkromné podnikanie tým, že presúvajú náklady na prácu na vládu a znižujú potrebu konkurenčných miezd"
  - "Odstraňujú triedne rozdiely tak dôkladne, že sociálna mobilita sa stáva zbytočnou a inovácie stagnujú"
explanation: >-
  Friedman varuje, že štedré úmysly môžu vytvárať škodlivé dôsledky, keď zanedbajú prísnu analýzu ľudských stimulov. Programy pomoci financované štátom riskujú vytváranie závislosti, nevytvárajú stimul pracovať a predstavujú formu vyvlastnenia, keďže prostriedky sa najprv musia vziať tým, ktorí bohatstvo vytvárajú. Merateľné výsledky, ako znižovanie chudoby a efektívnosť, musia mať prednosť pred ušľachtilými zámermi.
reviewed: false
