question: "Aký spoločný základ zdieľajú libertariáni a konzervatívci a čo ich rozdeľuje?"
answer: "Zdieľajú pripútanosť k obmedzenej vláde a odmietanie núteného egalitarizmu, ale nezhodujú sa v otázke vojenského intervencionizmu a sociálnych politík"
wrong_answers:
  - "Zdieľajú podporu protekcionistických obchodných politík a národnej obrany, ale nezhodujú sa v úlohe náboženstva vo verejnom živote"
  - "Zdieľajú záväzok k progresívnemu zdaneniu a sociálnym programom, ale nezhodujú sa v imigračnej politike"
  - "Zdieľajú odpor voči voľnému obchodu a legalizácii drog, ale nezhodujú sa vo veľkosti federálnej vlády"
explanation: >-
  Libertariáni aj konzervatívci obhajujú obmedzenú vládu, odmietajú nútený egalitarizmus, stavajú sa proti verejnému dlhu a bránia práva štátov. Libertariáni však odmietajú vojenský intervencionizmus neokonzervatívcov, stavajú sa proti konzervatívnym sociálnym politikám a dotáciám, odsudzujú zákaz drog a odmietajú protekcionizmus. Aliancia je skutočná, ale vnútorne napätá.
