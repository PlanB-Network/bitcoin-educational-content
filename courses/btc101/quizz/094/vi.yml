question: Rủi ro khi sử dụng ví hỗ trợ đa chữ ký (multisig) là gì?
answer: Không có quyền truy cập vào đủ số lượng khóa riêng cá nhân hoặc thành phần sao lưu.
wrong_answers:
  - Có quyền truy cập vào đủ số lượng khóa riêng cá nhân hoặc thành phần sao lưu.
  - Chia sẻ khóa riêng cá nhân của bạn với các bên khác.
  - Chia sẻ khóa công khai của bạn với các bên khác.
explanation: |
  Khi bạn sử dụng ví multisig, mỗi khóa riêng cá nhân của
  ví multisig nên được lưu trữ ở các nơi khác nhau. Điều này
  là bởi vì ví multisig yêu cầu nhiều chữ ký để thực hiện
  một giao dịch, do đó, một số lượng ví nhất định là
  cần thiết. Vì vậy, việc lưu trữ mỗi phần ở một nơi khác nhau
  thêm một lớp bảo mật nữa.
reviewed: true