question: "놀런 도표의 수직축은 진정한 정치적 질문에 대해 무엇을 드러내나요?"
answer: "국가를 통해 자신의 감수성을 타인에게 강요하고 싶은지, 아니면 각자가 스스로 결정할 자유를 갖는 것을 선호하는지를 드러냅니다"
wrong_answers:
  - "민주적 통치를 지지하는지, 아니면 한 지도자에 의한 권위주의 통치를 선호하는지를 드러냅니다"
  - "진보적 사회운동과 동일시하는지, 아니면 전통적 종교 제도와 동일시하는지를 드러냅니다"
  - "주된 관심사가 국가 안보인지 경제적 번영인지를 드러냅니다"
explanation: >-
  수직축은 진정한 정치적 질문을 드러냅니다. 당신이 좌파인지 우파인지가 아니라, 자신의 가치에 따라 사회를 형성하는 데 국가가 어느 정도 개입하기를 원하는가입니다. 당신은 자신의 감수성을 타인에게 강요하고 싶습니까, 아니면 각자가 스스로 결정할 자유를 갖는 것을 선호합니까? 이 틀은 좌우 구분을 넘어, 양쪽 진영 모두 똑같이 국가주의적일 수 있음을 보여줍니다.
reviewed: false
