question: "Как cypherpunk философията за централизацията се свързва с либертарианския принцип на съгласието като фундаментална норма на справедливостта?"
answer: "Cypherpunk-овете разглеждат всяка централизация като основана на принуда, а не на съгласие, отеквайки либертарианската позиция, че нищо не може да бъде справедливо, ако е наложено от централизирана власт чрез сила"
wrong_answers:
  - "Cypherpunk-овете вярват, че централизацията е приемлива, когато е одобрена чрез демократично мнозинство, съответствайки на либертарианското уважение към конституционното управление"
  - "Cypherpunk-овете подкрепят временна централизация по време на извънредни ситуации, отразявайки либертарианския възглед, че индивидуалните права могат да бъдат суспендирани, когато колективът е застрашен"
  - "Cypherpunk-овете се противопоставят на централизацията само в технологичните системи, докато приемат политическата централизация като необходима за прилагане на правата на собственост и договорите"
explanation: >-
  Cypherpunk-овете поставят доверието си в децентрализирани криптографски системи, а не в централизирани институции. Всяка централизация се възприема като основана на принуда, а не на съгласие. Това директно отеква в либертарианската философия, според която съгласието е фундаменталната норма на справедливостта. Нищо не може да бъде справедливо, ако е наложено от централизирана власт чрез сила, поради което те се стремят да изградят децентрализирани мрежи, където нито един субект не може да наложи волята си.
