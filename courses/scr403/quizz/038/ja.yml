question: 「前提の型はより小さい」という型付け規則の下で、実行中に実際にデータを移動するコアコンビネータはどれですか？
answer: iden と comp だけです。他の 7 つは、管理情報の処理だけで実装されます。
wrong_answers:
  - take と drop だけである。1 つの成分を取り出すには、機械がそれを積からコピーし出す必要があるためである。
  - pair と case だけである。2 つの分岐のために入力を複製し、タグでディスパッチすることがデータをシャッフルするためである。
  - injl と injr だけである。タグを追加することは、値をより大きな和型表現へ書き換えるためである。
explanation: >-
  直感に反して、データアクセスのように見えるコンビネータ（take、
  drop、pair、case、injl、injr）はコピーを必要としません。型付け規則の
  前提は結論より小さい型を扱うため、Bit Machine はそれらを管理情報の処理だけで
  実装できます。実際にデータを移動するのは、入力全体を出力へコピーする iden と、
  f から g へ渡される中間値を実体化する comp だけです。
reviewed: false
