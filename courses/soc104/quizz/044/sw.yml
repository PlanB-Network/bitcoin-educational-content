question: "Karl Marx alitoa tofauti gani kati ya usoshalisti wa kiutopia na usoshalisti wa kisayansi?"
answer: "Aliwatuhumu wanasoshalisti wa mwanzo wa Kifaransa kwa kupendekeza suluhisho za kufikirika, ilhali usoshalisti wake wa kisayansi ulijengwa juu ya uyakinifu wa kihistoria na mapambano ya kitabaka"
wrong_answers:
  - "Alisema kwamba usoshalisti wa kiutopia ulijikita kupita kiasi katika uchumi, ilhali usoshalisti wa kisayansi ulitanguliza mabadiliko ya kitamaduni na kisanaa"
  - "Aliwasifu wanasoshalisti wa kiutopia kwa majaribio yao ya kivitendo na akaukosoa usoshalisti wa kisayansi kwa kuwa wa kinadharia na wa kufikirika kupita kiasi"
  - "Alidai kwamba usoshalisti wa kiutopia ulikuwa wa vurugu na kimapinduzi, ilhali usoshalisti wa kisayansi ulipendelea mageuzi ya amani ya kidemokrasia"
explanation: >-
  Marx aliwatuhumu wanasoshalisti wa mwanzo wa Kifaransa kama Proudhon, Saint-Simon, na Fourier kuwa watu wa kiutopia waliopendekeza suluhisho za kufikirika tu. Usoshalisti wake wa kisayansi uliegemea uyakinifu wa kihistoria: wazo kwamba historia husonga mbele kupitia mapambano ya kitabaka na utwaaji wa njia za uzalishaji, ambapo uwakilishi wote wa kitamaduni huwekewa masharti na nguvu za uzalishaji na mahusiano ya uzalishaji.
