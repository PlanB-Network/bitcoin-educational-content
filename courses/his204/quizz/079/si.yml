question: Montaigneගේ sophism ලෙස හඳුන්වා ඇත්තේ කුමන අදහසද?
answer: හුවමාරුව ශුන්‍ය-එකතු ක්‍රීඩාවකි
wrong_answers:
  - හුවමාරුව ධන-එකතු ක්‍රීඩාවකි
  - කාලය සහ ස්ථානය අනුව, හුවමාරුව සමහර විට ශුන්‍ය-එකතු ක්‍රීඩාවක් වන අතර සමහර විට ධන-එකතු ක්‍රීඩාවක් වේ
  - හුවමාරුව සැමවිටම දුර්වල පාර්ශ්වයට අහිතකරය
explanation: |
  Montaigneගේ වැරදි තර්කය නම් හුවමාරුව ශුන්‍ය-එකතු ක්‍රීඩාවක් යන අදහසයි. එනම්, එකෙකු ලබා ගන්නා දෙය අනෙකාට අහිමි වේ. මෙම අදහස වැරදිය, මන්ද ස්වේච්ඡා හුවමාරුව දෙපාර්ශ්වයටම ප්‍රයෝජනවත් වේ.