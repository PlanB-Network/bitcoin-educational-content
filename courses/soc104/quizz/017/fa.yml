question: "راست می‌خواهد دربارهٔ چه چیزی قانون‌گذاری کند؟"
answer: "اخلاق و دین، که از میل به حفظ نهادهای سنتی و سلسله‌مراتب اجتماعی ناشی می‌شود"
wrong_answers:
  - "اقتصاد و بازارهای مالی، که از میل به کاهش نابرابری و بازتوزیع ثروت ناشی می‌شود"
  - "علم و آموزش، که از میل به کنترل آنچه در مدارس دولتی آموزش داده می‌شود ناشی می‌شود"
  - "تجارت بین‌المللی و دیپلماسی، که از میل به گسترش نفوذ ملی در خارج ناشی می‌شود"
explanation: >-
  راست به اخلاق شخصی و ارزش‌های سنتی اولویت می‌دهد. راست بر این باور است که تمدن بر برخی نهادهای سنتی و سلسله‌مراتب اجتماعی بنا شده که باید حفظ شوند، و می‌خواهد دربارهٔ اخلاق و دین قانون‌گذاری کند. این چپ است، نه راست، که بر قانون‌گذاری اقتصاد تمرکز دارد. علم، آموزش و سیاست تجاری تمرکز اصلیِ توصیف‌شده برای راست نیستند.
reviewed: false
