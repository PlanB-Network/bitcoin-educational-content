question: "Comment un libertarien culturellement conservateur traite-t-il les comportements qu'il désapprouve moralement ?"
answer: "Il s'oppose à ces comportements et les décourage par la persuasion et l'exemple, mais sans recourir à la force coercitive de la loi"
wrong_answers:
  - "Il soutient des interdictions de ces comportements par les autorités locales tout en s'opposant aux interdictions au niveau fédéral"
  - "Il reste complètement silencieux au sujet de ces comportements, estimant que toute forme de désapprobation viole la liberté individuelle"
  - "Il plaide pour des tribunaux communautaires capables de punir ces comportements en dehors du système juridique formel"
explanation: >-
  Le libertarien culturellement conservateur peut désapprouver moralement certains comportements, mais il ne défend pas l'interdiction légale d'actions consenties et non agressives. Il peut ne pas aimer ces actions, s'y opposer et les décourager activement, mais toujours par la persuasion, l'éducation et l'exemple plutôt que par la force coercitive de la loi. Il ne s'agit pas de rester silencieux ni de créer des mécanismes d'application alternatifs.
reviewed: false
