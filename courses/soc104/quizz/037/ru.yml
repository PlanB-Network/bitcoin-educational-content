question: "Как структурный подход определяет фундаментальное различие между социализмом и либертарианством?"
answer: "Социализм отдаёт первенство государству через регулирование, планирование и контроль, тогда как либертарианство отдаёт первенство индивиду через минимальное вмешательство государства"
wrong_answers:
  - "Социализм отдаёт приоритет сельским аграрным сообществам, тогда как либертарианство предпочитает городское промышленное развитие"
  - "Социализм определяется поддержкой демократических выборов, тогда как либертарианство отвергает все формы политического участия"
  - "Социализм сосредоточен на внешней политике и международном сотрудничестве, тогда как либертарианство интересуется только внутренними экономическими вопросами"
explanation: >-
  Структурно социализм характеризуется всеприсутствием государства, которое регулирует, планирует и контролирует. Либертарианство определяется минимальным вмешательством государства в экономику и частную жизнь, стремясь к первенству индивидуальной свободы и свободного рынка. Это структурное различие намного более полезно для анализа, чем сравнение заявленных намерений каждой системы.
