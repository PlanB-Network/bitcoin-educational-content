question: "Hvordan argumenterer kurset for at frihet lar både venstreorienterte og høyreorienterte verdier sameksistere fredelig?"
answer: "I et regime med ekte frihet kan mennesker med venstreorienterte idealer frivillig dele eiendeler og omfordele midler, mens de med høyreorienterte verdier kan spare og føre tradisjoner videre, uten at noen av sidene påtvinger den andre sin livsform"
wrong_answers:
  - "Frihet krever at begge sider inngår kompromiss ved å akseptere en sentrumsposisjon der myndighetene balanserer konkurrerende verdier gjennom moderat regulering"
  - "Frihet betyr at venstreorienterte og høyreorienterte fellesskap må leve i separate geografiske territorier med sine egne uavhengige myndigheter"
  - "Frihet fungerer ved å la borgere stemme over hvilke verdier som skal håndheves i hver region, med rotasjon mellom venstreorientert og høyreorientert politikk ved hvert valg"
explanation: >-
  Kurset viser at i et ekte frihetsregime kan de som slutter seg til venstreorienterte idealer, frivillig gi avkall på eiendeler, dele produksjonsmidler eller donere lønn til omfordelende organisasjoner. De med høyreorienterte verdier kan arbeide hardt, spare og videreføre familieverdier. Ingen bør påtvinge andre sin livsform. Det er gjennom markedets frihet og valgets makt at mål kan oppnås fredelig.
reviewed: false
