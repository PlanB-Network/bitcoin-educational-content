question: En quoi consiste la liberté ?
answer: Le pouvoir de faire ce que l'on veut avec ce qui nous appartient.
wrong_answers:
  - L'absence de contraintes extérieures.
  - Le droit de participer aux décisions politiques collectives.
  - La capacité de penser et d'agir par soi-même.
explanation: |
  La liberté est définie dans ce cours comme la capacité de faire des choix concernant ses propres affaires et de disposer de soi-même et de ses biens sous la condition de la responsabilité. Elle est fondamentalement individuelle et liée aux droits de propriété.
reviewed: true
