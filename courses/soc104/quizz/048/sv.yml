question: "Hur beskrev Michael Oakeshott konservatism i sitt filosofiska arbete?"
answer: "Som ett temperament och en hållning till livet snarare än en rigid systematisk ideologi"
wrong_answers:
  - "Som en heltäckande ekonomisk teori med precisa policyföreskrifter för varje område av staten"
  - "Som en revolutionär rörelse som försöker riva ned moderna institutioner och återvända till ett förindustriellt samhälle"
  - "Som en rent religiös doktrin grundad i kristen teologi och kyrklig auktoritet"
explanation: >-
  Michael Oakeshott, en brittisk filosof, försvarade en uppfattning om konservatism som temperament snarare än systematisk ideologi. Hans essä On Being Conservative (1956) förblir en central referens. Denna syn på konservatism som en hållning påverkade också Friedrich Hayek. Oakeshotts angreppssätt är anmärkningsvärt för sin kritik av rationalism i politiken, där han avvisar idén att politik kan reduceras till ett system.
reviewed: false
