question: "Čo je politický konzervativizmus?"
answer: "Ideológia, ktorej cieľom je zachovať etablované politické inštitúcie a spoločenský poriadok a ktorá sa stavia proti veľkým štrukturálnym otrasom"
wrong_answers:
  - "Osobný záväzok k tradičným rodinným hodnotám a náboženským praktikám bez snahy vnucovať ich iným"
  - "Filozofia, ktorá podporuje rýchlu spoločenskú zmenu prostredníctvom demokratickej reformy a progresívnej legislatívy"
  - "Ekonomická teória, ktorá obhajuje slobodné trhy, minimálne zdanenie a zrušenie obchodných bariér"
explanation: >-
  Politický konzervativizmus je ideológia, často zastúpená v pravicových alebo krajne pravicových stranách, ktorej cieľom je zachovať etablované politické inštitúcie a spoločenský poriadok a zároveň sa staviať proti veľkým štrukturálnym otrasom. Jeho zástancovia chcú používať moc a zákon na ochranu svojho dedičstva. To sa líši od kultúrneho konzervativizmu, ktorý je osobnou životnou voľbou, nie politickým programom.
