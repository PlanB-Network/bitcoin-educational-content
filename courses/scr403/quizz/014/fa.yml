question: چرا Simplicity به‌جای مدل گس پویا مانند Ethereum از تحلیل ایستا استفاده می‌کند؟
answer: برای تعیین کران‌های منابع پیش از آغاز اجرا، و در نتیجه فراهم کردن هزینه‌های قابل پیش‌بینی.
wrong_answers:
  - چون پیاده‌سازی تحلیل ایستا برای توسعه‌دهندگان صرفاً بسیار سریع‌تر است.
  - چون مدل گس خود Ethereum ثبت اختراع شده بود و بنابراین در دسترس نبود.
  - چون برنامه‌های Simplicity بسیار کوتاه‌تر از آن هستند که واقعاً هرگز به اندازه‌گیری نیاز داشته باشند.
explanation: >-
  تحلیل ایستای Simplicity به شبکه اجازه می‌دهد پیش از اجرای یک برنامه دقیقاً
  بداند آن برنامه به چه مقدار محاسبه نیاز دارد. این کار پیش‌بینی‌ناپذیری
  اندازه‌گیری پویا را حذف می‌کند، از حمله منع سرویس از طریق اتمام منابع
  جلوگیری می‌کند، و به نودها امکان می‌دهد برنامه‌هایی را که از محدودیت‌ها
  فراتر می‌روند بدون هدر دادن محاسبه رد کنند.
reviewed: false
