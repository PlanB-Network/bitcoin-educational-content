question: "Prečo libertariánska pozícia k legalizácii drog prichádza s podmienkou, že úloha štátu v spoločnosti sa musí znížiť?"
answer: "Pretože liberalizácia prevzatá štátom by nahradila individuálnu zodpovednosť štátom riadenou starostlivosťou, zatiaľ čo libertariáni chcú, aby občania niesli dôsledky svojich rozhodnutí s podporou súkromných združení"
wrong_answers:
  - "Pretože štátom kontrolovaná legalizácia by vytvorila príliš veľké daňové príjmy, čím by vládu urobila nadmerne mocnou a skorumpovanou"
  - "Pretože štát by zaviedol kvalitatívne normy, ktoré by zvýšili ceny a znovu vytvorili čierne trhy"
  - "Pretože vládna regulácia drog by porušovala medzinárodné obchodné dohody a diplomatické vzťahy"
explanation: >-
  Libertariáni podporujú liberalizáciu drog, ale trvajú na tom, že úloha štátu sa musí znížiť, pretože ich cieľom je obnoviť individuálnu zodpovednosť, nie rozšíriť štátne riadenie. Ak sa niekto stane závislým, musí prevziať zodpovednosť namiesto toho, aby žiadal štát o poskytnutie starostlivosti. Riešenie závislosti spočíva v súkromnej iniciatíve: dobrovoľnej podpore od jednotlivcov, rodín a charitatívnych združení. Štátom riadená legalizácia by odporovala základnému libertariánskemu princípu osobnej zodpovednosti.
