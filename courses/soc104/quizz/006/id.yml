question: "Titik kesamaan apa yang dimiliki partai politik sayap kiri dan sayap kanan meskipun tampak saling bertentangan?"
answer: "Keduanya membela hak negara untuk mengatur kehidupan orang melalui regulasi dan pajak"
wrong_answers:
  - "Keduanya menganjurkan penghapusan total intervensi negara dalam urusan ekonomi"
  - "Keduanya memprioritaskan kebebasan individu di atas pengorganisasian kolektif masyarakat"
  - "Keduanya menolak penggunaan kebijakan moneter sebagai alat untuk belanja pemerintah"
explanation: >-
  Meskipun tampak bertentangan, kiri dan kanan sama-sama memiliki preferensi terhadap intervensi negara. Keduanya mengkritik pasar bebas dan membela hak negara untuk mengatur kehidupan orang melalui regulasi dan pajak. Kiri mengkritik pasar sebagai sumber ketimpangan, sementara kanan melihat pasar sebagai ancaman terhadap kedaulatan, tetapi keduanya berpaling kepada negara untuk solusi.
