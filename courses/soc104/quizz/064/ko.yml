question: "Hitler의 독일과 Stalin의 소비에트 연방은 공유한 전체주의적 방법에도 불구하고 경제 접근 방식에서 어떻게 달랐나요?"
answer: "Nazi 독일은 사유 재산의 외형을 유지하면서 민간 부문을 국가 목표에 종속시킨 반면, Stalin주의는 모든 사적 소유를 폐지하고 경제를 완전히 계획했습니다"
wrong_answers:
  - "Nazi 독일은 모든 산업을 완전히 국유화한 반면, Stalin 정권은 농업에서 제한적 민간 기업을 허용했습니다"
  - "Nazi 독일은 재무장을 위한 자금을 마련하기 위해 자유로운 국제 무역을 촉진한 반면, Stalin주의는 완전한 경제적 고립을 부과했습니다"
  - "Nazi 독일은 국가와의 자발적 기업 협력에 의존한 반면, Stalin주의는 강제 노동만 사용했습니다"
explanation: >-
  두 정권은 동일한 정치적 방법(개인숭배, 전면적 감시, 반대파의 체계적 제거)을 사용했지만, 그들의 경제 모델은 형식상 달랐습니다. Nazi 독일은 사유 재산을 공식적으로 폐지하지 않았지만 민간 부문을 전쟁과 재무장 같은 국가 목표에 완전히 종속시키고 경제적 자급자족을 강제했습니다. Stalin주의는 모든 사적 소유를 폐지하고, 5개년 계획을 시행하며, 모든 생산과 분배를 직접 통제함으로써 더 멀리 나아갔습니다.
