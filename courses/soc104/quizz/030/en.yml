question: "How do the roles of the Cato Institute, the Mises Institute, and the Libertarian Party differ within the libertarian movement?"
answer: "The Cato Institute focuses on public policy proposals, the Mises Institute on education and academic publishing, and the Libertarian Party on electoral politics"
wrong_answers:
  - "The Cato Institute funds political campaigns, the Mises Institute lobbies Congress directly, and the Libertarian Party organizes academic conferences"
  - "The Cato Institute publishes economic textbooks, the Mises Institute runs voter registration drives, and the Libertarian Party drafts legislative bills"
  - "The Cato Institute organizes grassroots protests, the Mises Institute provides legal defense for libertarians, and the Libertarian Party manages think tank research"
explanation: >-
  The Cato Institute (founded 1977) is a Washington-based think tank working on public policy proposals. The Mises Institute (founded 1982) focuses on education rather than political lobbying, functioning as a kind of online university with conferences and republished works. The Libertarian Party (founded 1971) is the third largest American political party, participating in elections where even its roughly 2% vote share can tip outcomes.
