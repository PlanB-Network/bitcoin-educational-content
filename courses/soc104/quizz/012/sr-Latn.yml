question: "Zašto se vertikalna osa (vrh-dno) smatra temeljnijom od horizontalne ose (levo-desno) u Nolanovom dijagramu?"
answer: "Zato što otkriva pravu podelu između onih koji brane maksimalne individualne slobode i onih koji favorizuju maksimalnu državnu kontrolu"
wrong_answers:
  - "Zato što meri ekonomski učinak preciznije nego što horizontalna osa meri društvene politike"
  - "Zato što se većina političkih sukoba kroz istoriju ticala kulturnog identiteta, a ne upravljanja"
  - "Zato što se horizontalna osa primenjuje samo na moderne demokratije, dok je vertikalna osa univerzalna"
explanation: >-
  Temeljna osa je vertikalna zato što obuhvata suštinsko političko pitanje: u kojoj meri država treba da kontroliše ljudsko delovanje? Osa levo-desno samo odražava različite senzibilitete (društvena pravda naspram tradicije), ali obe strane mogu zauzimati istu poziciju na vertikalnoj osi kao etatisti. Vertikalna osa otkriva da li neko želi da silom nametne svoju viziju ili poštuje individualnu slobodu.
reviewed: false
