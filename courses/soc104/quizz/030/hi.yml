question: "लिबर्टेरियन आंदोलन के भीतर Cato Institute, Mises Institute और Libertarian Party की भूमिकाएँ कैसे अलग हैं?"
answer: "Cato Institute सार्वजनिक नीति प्रस्तावों पर केंद्रित है, Mises Institute शिक्षा और अकादमिक प्रकाशन पर, और Libertarian Party चुनावी राजनीति पर"
wrong_answers:
  - "Cato Institute राजनीतिक अभियानों को धन देता है, Mises Institute सीधे Congress में लॉबिंग करता है, और Libertarian Party अकादमिक सम्मेलन आयोजित करती है"
  - "Cato Institute आर्थिक पाठ्यपुस्तकें प्रकाशित करता है, Mises Institute मतदाता पंजीकरण अभियान चलाता है, और Libertarian Party विधेयक तैयार करती है"
  - "Cato Institute जमीनी विरोध-प्रदर्शन आयोजित करता है, Mises Institute लिबर्टेरियन लोगों के लिए कानूनी रक्षा प्रदान करता है, और Libertarian Party think tank शोध संभालती है"
explanation: >-
  Cato Institute (1977 में स्थापित) Washington-स्थित think tank है जो सार्वजनिक नीति प्रस्तावों पर काम करता है। Mises Institute (1982 में स्थापित) राजनीतिक लॉबिंग के बजाय शिक्षा पर केंद्रित है, सम्मेलनों और पुनर्प्रकाशित कृतियों के साथ एक प्रकार के ऑनलाइन विश्वविद्यालय की तरह काम करता है। Libertarian Party (1971 में स्थापित) तीसरी सबसे बड़ी अमेरिकी राजनीतिक पार्टी है, जो चुनावों में भाग लेती है जहाँ उसका लगभग 2% मत-हिस्सा भी परिणामों को बदल सकता है।
