question: "लिबर्टेरियन और रूढ़िवादी कौन-सा साझा आधार रखते हैं, और उन्हें क्या विभाजित करता है?"
answer: "वे सीमित सरकार और जबरन समानतावाद के विरोध से जुड़े हैं, लेकिन सैन्य हस्तक्षेपवाद और सामाजिक नीतियों पर असहमत हैं"
wrong_answers:
  - "वे संरक्षणवादी व्यापार नीतियों और राष्ट्रीय रक्षा का समर्थन साझा करते हैं, लेकिन सार्वजनिक जीवन में धर्म की भूमिका पर असहमत हैं"
  - "वे प्रगतिशील कराधान और कल्याणकारी कार्यक्रमों के प्रति प्रतिबद्धता साझा करते हैं, लेकिन आप्रवासन नीति पर असहमत हैं"
  - "वे मुक्त व्यापार और नशीले पदार्थों के वैधीकरण के विरोध को साझा करते हैं, लेकिन संघीय सरकार के आकार पर असहमत हैं"
explanation: >-
  लिबर्टेरियन और रूढ़िवादी दोनों सीमित सरकार का समर्थन करते हैं, जबरन समानतावाद को अस्वीकार करते हैं, सार्वजनिक ऋण का विरोध करते हैं, और राज्यों के अधिकारों की रक्षा करते हैं। हालांकि, लिबर्टेरियन नव-रूढ़िवादियों के सैन्य हस्तक्षेपवाद को अस्वीकार करते हैं, रूढ़िवादी सामाजिक नीतियों और अनुदानों का विरोध करते हैं, नशीले पदार्थों पर प्रतिबंध की निंदा करते हैं, और संरक्षणवाद को अस्वीकार करते हैं। गठबंधन वास्तविक है, लेकिन स्वभावतः तनावपूर्ण है।
