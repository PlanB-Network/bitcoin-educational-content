question: "Comment le conservatisme traite-t-il les libertés dans les sphères économique et sociétale ?"
answer: "Des libertés fortes dans la sphère économique mais des libertés faibles dans la sphère sociétale"
wrong_answers:
  - "Des libertés faibles dans les sphères économique et sociétale afin de maintenir l'ordre social traditionnel"
  - "Des libertés fortes dans la sphère sociétale mais des libertés faibles dans la sphère économique"
  - "Des libertés égales et illimitées dans les deux sphères avec une intervention gouvernementale minimale de toute nature"
explanation: >-
  Le conservatisme présente une dichotomie qui est l'image miroir du socialisme. Dans le domaine économique, les conservateurs défendent le marché libre, l'entrepreneuriat et la propriété privée. Dans le domaine sociétal, les restrictions sont justifiées par la préservation des normes morales traditionnelles et de la stabilité sociale. La troisième mauvaise réponse décrit le schéma socialiste, qui est l'opposé.
