question: "中道主義の実用主義の中には、どのような隠れた逆説があるか？"
answer: "その実用主義自体が一種の教条主義、すなわち社会を操縦する能力を持つのは専門家だけだという明示されない確信に依拠している"
wrong_answers:
  - "中道主義者は穏健であると主張するが、連立政権では一貫して左派政党と連携する"
  - "中道主義の政策は均衡しているように見えるが、常に環境保護より経済成長を優先する"
  - "中道主義者はイデオロギーを拒否するが、経済的決定を行う際には硬直した自由市場原則を採用する"
explanation: >-
  中道主義的実用主義の逆説は、それが合理的専門知を支持してイデオロギーを拒否すると主張する一方で、その主張自体が見えない、明示されない教義に依拠している点にある。すなわち、正しい決定を下せるのはテクノクラートだけだという教義である。専門家だけが社会を操縦すべきだというこの確信は、中道主義者がそのようには認識していなくても、それ自体がイデオロギー的コミットメントである。
reviewed: false
