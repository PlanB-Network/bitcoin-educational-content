question: "Ce a vrut să spună Ludwig von Mises când a scris că doar individul gândește, raționează și acționează?"
answer: "Că colectivități precum statul sau o națiune nu au o existență proprie dincolo de acțiunile membrilor lor individuali"
wrong_answers:
  - "Că indivizii ar trebui să evite formarea de grupuri sau asociații, deoarece acțiunea colectivă este întotdeauna dăunătoare"
  - "Că doar anumiți indivizi înzestrați sunt capabili de gândire rațională, în timp ce majoritatea oamenilor urmează instinctul"
  - "Că gândirea și raționamentul sunt activități private care nu ar trebui niciodată împărtășite sau discutate în public"
explanation: >-
  Mises a clarificat că individualismul se opune noțiunii că entități sociale precum societatea sau națiunea ar putea exista independent de indivizii care le compun. O colectivitate nu are o existență proprie dincolo de acțiunile membrilor săi individuali. Nu putem vorbi în mod semnificativ despre acțiunea statului sau a unei companii, deoarece aceste entități nu au voință sau gândire proprie și acționează doar prin indivizi.
reviewed: false
