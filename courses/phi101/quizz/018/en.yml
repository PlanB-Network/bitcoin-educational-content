question: How did industrialization affect the living conditions of workers?
answer: It created new opportunities and improved their standard of living
wrong_answers:
  - It led to a general deterioration of their living conditions
  - It had different effects depending on the regions and sectors of activity
  - The impact of industrialization on workers is too complex to be judged
explanation: |
  According to Mises and Hayek (Capitalism and the Historians), industrialization created new opportunities and raised living standards: factory jobs, though miserable by our standards, were the best available option and lifted the surplus population out of pre-industrial poverty. The Marxist "dark legend" of a general deterioration is contradicted by the historical record.
reviewed: true
