question: "Что отличает неоконсерваторов от палеоконсерваторов в их подходе к внешней политике?"
answer: "Неоконсерваторы оправдывают военный интервенционизм ради распространения демократии, тогда как палеоконсерваторы защищают более изоляционистскую внешнюю политику"
wrong_answers:
  - "Неоконсерваторы выступают против любых военных действий и поддерживают дипломатию, тогда как палеоконсерваторы поддерживают превентивные удары по потенциальным угрозам"
  - "Неоконсерваторы сосредоточены исключительно на экономических санкциях, тогда как палеоконсерваторы выступают за создание международных коалиций для совместных военных операций"
  - "Неоконсерваторы и палеоконсерваторы согласны во внешней политике, но резко расходятся по вопросам внутреннего экономического регулирования"
explanation: >-
  Начиная с 2000-х годов неоконсерваторы всё активнее участвовали в оправдании военного интервенционизма для насаждения демократии по всему миру, особенно после 11 сентября 2001 года. В ответ традиционные консерваторы стали использовать ярлык «палеоконсерватор», чтобы отличать себя. Палеоконсерваторы критикуют военный интервенционизм, защищают более изоляционистскую внешнюю политику и придают большее значение национальной и культурной идентичности.
