bio: |
  Bitcoin Austria este o organizație non-profit austriacă fondată în 2011 pentru a promova adoptarea și înțelegerea Bitcoin în Austria. Fiind una dintre cele mai vechi organizații Bitcoin din Europa, asociația funcționează pe bază de voluntariat pentru a împărtăși cunoștințe, a organiza întâlniri și a susține comunitatea locală Bitcoin.

short_bio: ONG austriac pentru Bitcoin, înființat în 2011
