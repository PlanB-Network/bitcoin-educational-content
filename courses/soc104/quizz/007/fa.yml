question: "کدام چهره‌های نمادین با بیشترین آزادی اقتصادی در نمودار نولان مرتبط‌اند؟"
answer: "مارگارت تاچر، رونالد ریگان، و خاویر میلی"
wrong_answers:
  - "فرانکلین دی. روزولت، ژان ژورس، و برنی سندرز"
  - "نلسون ماندلا، سیمون وی، و نوآم چامسکی"
  - "ولادیمیر پوتین، شی جین‌پینگ، و ژوزف دو مستر"
explanation: >-
  تاچر، ریگان، و میلی به عنوان چهره‌های نمادین بیشترین آزادی اقتصادی ذکر می‌شوند، که طرفدار مداخلهٔ کمتر دولت، مقررات کمتر، و مالیات‌های پایین‌تر هستند. روزولت، ژورس، و سندرز نمایندهٔ سر دیگر طیف‌اند که طرفدار کنترل دولت بر اقتصاد است. ماندلا، وی، و چامسکی نمایندهٔ بیشترین آزادی شخصی هستند. پوتین، شی جین‌پینگ، و دو مستر نمایندهٔ بیشترین کنترل دولت بر زندگی شخصی‌اند.
reviewed: false
