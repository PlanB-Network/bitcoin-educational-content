question: Mis on FOMO ja FUD?
answer: Emotsioonid, mis võivad viia impulsiivsete ja potentsiaalselt kahjulike otsusteni.
wrong_answers:
  - Bitcoin'i rahakotitüübid.
  - Strateegiad Bitcoin'i ostmiseks.
  - Bitcoin'iga seotud regulatsioonid.
explanation: >-
  Tekst selgitab, et FOMO (Fear of Missing Out) ja FUD (Fear, Uncertainty, Doubt) on emotsioonid, mis võivad viia impulsiivsete ja potentsiaalselt kahjulike otsusteni Bitcoin'i ostes.
reviewed: false
