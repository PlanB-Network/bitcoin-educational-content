question: "Why did classical liberals in the United States start calling themselves 'libertarians' from the 1960s onward?"
answer: "To distinguish themselves from American liberals, whose meaning had shifted toward state interventionism"
wrong_answers:
  - "To align themselves with the Democratic Party and its progressive social programs"
  - "To signal their support for Lyndon B. Johnson's Great Society reforms"
  - "To adopt a more radical revolutionary identity inspired by European socialist movements"
explanation: >-
  In the United States, the word 'liberal' shifted to mean supporters of Big Government and state intervention, particularly after the New Deal and the Great Society. Classical liberals adopted the label 'libertarian' to preserve the original meaning of their philosophy. They were distancing themselves from American liberals, not aligning with them.
reviewed: false
