question: "What is the 'intransigent minority' concept as described in this chapter?"
answer: "You only need 3-5 obsessed Bitcoiners to pull an entire community into adoption"
wrong_answers:
  - "A majority of community members must vote to adopt Bitcoin before merchants will begin accepting it"
  - "At least 25% of a town's population must own Bitcoin before circular economy effects can begin"
  - "A dedicated team of 50 or more volunteers is required to sustain any Bitcoin community long-term"
explanation: >-
  The intransigent minority concept, illustrated by Edwin in Witsand, means a small group of 3-5 passionate Bitcoiners can influence an entire community. He compared it to halal food in South Africa, where Muslims are only 3-5% of the population yet halal food is in every supermarket. The key is **convincing a few influential people** and letting adoption snowball from there.
reviewed: false
