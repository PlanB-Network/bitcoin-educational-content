bio: |
  Autor de tutoriale și lector pe tehnici de simplificare a utilizării practice a diverselor instrumente legate de auto-custodia Bitcoin, atât software, cât și hardware. Oricine poate face față provocării pe care o oferă această tehnologie, cu implicare și ajutorul potrivit. Am pornit de la zero, realizând treptat câte puțin PoW de fiecare dată.
  
  Nostr-maxi. EST 720730, LN la f205sats@sats.mobi
  
short_bio: Lector, autor, expert în auto-custodie.
