question: "Hva er den konservative posisjonen om innvandring?"
answer: "Staten har suveren rett til å kontrollere sine grenser for å beskytte nasjonal sikkerhet og kulturell identitet"
wrong_answers:
  - "Grenser bør være åpne uten betingelser fordi diskriminerende restriksjoner bryter menneskerettighetene"
  - "Innvandring bør bestemmes av markedsetterspørsel, der borgere kontraktsmessig bestemmer sine relasjoner med utlendinger"
  - "Innvandringspolitikk bør balansere økonomiske behov med vellykket integrering basert på ekspertvurdering"
explanation: >-
  Konservative mener at orden, identitet og nasjonal suverenitet må prioriteres over ubegrenset mottak av utlendinger eller flyktninger. Grenser og en veldefinert befolkning er en del av siviliserte verdier. De gale svarene representerer den sosialistiske posisjonen (åpne grenser som menneskerettigheter), den libertarianske posisjonen (markedsbasert innvandring) og den sentristiske posisjonen (balansert, ekspertdrevet tilnærming).
reviewed: false
