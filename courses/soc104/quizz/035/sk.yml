question: "Ako sa líšia stratégie zrušenia štátu medzi libertaires a libertariánmi?"
answer: "Libertaires historicky obhajujú násilné zničenie, zatiaľ čo libertariáni sa usilujú delegitimizovať štát prostredníctvom vzdelávania a občianskej neposlušnosti"
wrong_answers:
  - "Libertaires používajú demokratické voľby na demontáž štátu, zatiaľ čo libertariáni uprednostňujú ozbrojenú revolúciu a priamu akciu"
  - "Libertaires sa zameriavajú na budovanie alternatívnych komunít, zatiaľ čo libertariáni pracujú v rámci existujúceho politického systému na prijímaní reforiem"
  - "Libertaires aj libertariáni sa zhodujú, že pokojný protest je jediným legitímnym prostriedkom spoločenskej transformácie"
explanation: >-
  Libertaires historicky obhajujú zničenie štátu a kapitalizmu násilím, vrátane teroru a cielených útokov. Libertariáni naopak odmietajú agresívne násilie ako nelegitímne. Ich stratégia spočíva na delegitimizácii štátu prostredníctvom argumentácie, debaty, vzdelávania a občianskej neposlušnosti. Tieto zásadne odlišné prístupy k zmene odrážajú ich hlbšie filozofické nezhody.
