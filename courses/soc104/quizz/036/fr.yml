question: "Pourquoi Rothbard a-t-il critiqué la vision libertaire de la nature humaine, et quelle alternative a-t-il proposée ?"
answer: "Il les a accusés d'avoir une vision naïve du 'bon sauvage' et a soutenu que la société doit utiliser la propriété privée et de bonnes incitations pour guider les comportements intéressés"
wrong_answers:
  - "Il a salué leur compréhension de la coopération humaine mais a soutenu qu'un État minimal restait nécessaire pour faire respecter les contrats"
  - "Il était d'accord pour dire que les humains sont naturellement bons mais insistait sur le fait que seuls les marchés libres pouvaient canaliser cette bonté vers une activité productive"
  - "Il a rejeté leur insistance sur les droits individuels et a plutôt soutenu que les communautés devraient définir collectivement les normes morales"
explanation: >-
  Rothbard a critiqué les libertaires pour avoir adopté une vision naïve, de type rousseauiste, de la nature humaine comme naturellement bonne. Il a plutôt soutenu que les gens sont guidés par leur intérêt personnel, et que la société doit être organisée de sorte que de bonnes incitations guident les comportements. Cela exige de reconnaître et de garantir la propriété privée. Abolir l'État ne signifie pas abolir ses fonctions ; la police et la justice devraient être gérées par le marché libre à travers la concurrence.
reviewed: false
