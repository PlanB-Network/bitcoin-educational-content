question: "Prečo Mises zdôrazňuje, že individualizmus by sa nemal zamieňať so sebestačnosťou alebo mizantropiou?"
answer: "Pretože individualizmus podporuje spoluprácu a združovanie, pokiaľ stoja na slobodnom súhlase účastníkov, a uznáva, že ľudia rozvíjajú svoj plný potenciál prostredníctvom dobrovoľných vzťahov s inými"
wrong_answers:
  - "Pretože individualizmus vyžaduje, aby sa ľudia pridávali k povinným občianskym organizáciám a zabezpečili tak svoj príspevok k spoločnému dobru"
  - "Pretože individualizmus znamená, že každý človek sa musí úplne spoliehať na štát pri službách, ktoré si nevie zabezpečiť sám"
  - "Pretože individualizmus vyžaduje, aby ľudia medzi sebou súťažili vo všetkých oblastiach a dokazovali svoju osobnú nadradenosť"
explanation: >-
  Mises zdôrazňuje, že ľudská bytosť je spoločenský tvor. Individualizmus neznamená izoláciu. Podporuje spoluprácu a združovanie pod podmienkou, že stoja na slobodnom súhlase účastníkov. Ľudská bytosť môže rozvinúť svoj plný potenciál iba vo vzťahu s inými, no táto spolupráca musí byť dobrovoľná, a nie vnucovaná kolektívnou autoritou.
