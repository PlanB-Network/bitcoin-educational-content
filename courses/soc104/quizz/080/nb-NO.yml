question: "Hva er den sentrale uenigheten mellom libertarianere og andre politiske familier når de deler de samme målene?"
answer: "Uenigheten handler om midler: libertarianere avviser tvangsløsninger og foretrekker frivillig utveksling gjennom markedsprosessen"
wrong_answers:
  - "Uenigheten handler om mål: libertarianere forfølger andre mål, som individuell rikdom heller enn sosial velferd"
  - "Uenigheten handler om timing: libertarianere vil oppnå de samme målene langsommere gjennom gradvis reform"
  - "Uenigheten handler om omfang: libertarianere vil anvende de samme politiske tiltakene bare på lokalt nivå heller enn nasjonalt nivå"
explanation: >-
  Libertarianere kan være enige med sosialister, konservative og sentrister om visse mål, som å forsvare de undertrykte eller fremme sosial samhørighet. Uenigheten ligger ikke i målene, men i midlene. Libertarianere avviser alle tvangsløsninger som søker å ensrette praksiser og reguleringer, og forsvarer i stedet valgmakt og ansvarlig frihet gjennom fri, desentralisert utveksling basert på frivillige kontrakter.
reviewed: false
