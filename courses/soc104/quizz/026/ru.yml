question: "Чем различаются роли Cato Institute, Mises Institute и Libertarian Party внутри либертарианского движения?"
answer: "Cato Institute сосредоточен на предложениях в области публичной политики, Mises Institute — на образовании и академических публикациях, а Libertarian Party — на электоральной политике"
wrong_answers:
  - "Cato Institute финансирует политические кампании, Mises Institute напрямую лоббирует Конгресс, а Libertarian Party организует академические конференции"
  - "Cato Institute публикует учебники по экономике, Mises Institute проводит кампании по регистрации избирателей, а Libertarian Party составляет законопроекты"
  - "Cato Institute организует низовые протесты, Mises Institute обеспечивает юридическую защиту либертарианцев, а Libertarian Party управляет исследованиями аналитических центров"
explanation: >-
  Cato Institute (основан в 1977 году) — аналитический центр в Вашингтоне, работающий над предложениями в области публичной политики. Mises Institute (основан в 1982 году) сосредоточен на образовании, а не на политическом лоббировании, функционируя как своего рода онлайн-университет с конференциями и переизданными работами. Libertarian Party (основана в 1971 году) является третьей по величине американской политической партией и участвует в выборах, где даже ее доля голосов около 2% может решить исход.
