question: "Ni kubera iki Popper avuga ko ikibano cuguruye kiguma gifise intege nke mu kamere yaco naho gifise ivyiza?"
answer: "Kuko inshingano individualism isaba zishobora gusa n'izitera ubwoba, bigatera ikigeragezo co guhungira mu gukingirwa n'umuryango, mu bubasha, canke mu gukumbura kahise kagaragazwa nk'akarangamuneza"
wrong_answers:
  - "Kuko ibibano vyuguruye bidafise inguvu za gisirikare kandi bidashobora kwikingira ibitero vy'ibibano vyugarijwe"
  - "Kuko inzego za demokarasi mu kamere yazo zidakora neza kandi amaherezo zisenyuka munsi y'uburemere bw'ubusobangane bwa birokrasi"
  - "Kuko ibibano vyuguruye birekura ubusumbane bwinshi cane mu butunzi, ivyo bikama bishikana kuri revolisiyo no ku gushinga intwaro z'agahotoro"
explanation: >-
  Popper ashimika ko intege nke z'ikibano cuguruye ziva ku bugoyagoye bwo mu mitekerereze. Inshingano individualism isaba zishobora gusa n'izitera ubwoba kandi zirimwo ivyago kuko umuntu ategerezwa kwihitiramwo kandi ashobora gutsindwa. Ivyo bitera ikigeragezo co kurondera ubuhungiro mu gukingirwa n'umuryango canke mu mpengamiro z'ugukumbura kahise kagaragazwa nk'akarangamuneza. Ikibano cuguruye gihura n'ibibazo bibandanya biva ku mpengamiro za communitarian n'ikigeragezo c'agahotoro cama kigaruka.
