question: "Kako kurs tvrdi da sloboda omogućava da levičarske i desničarske vrednosti mirno koegzistiraju?"
answer: "U režimu istinske slobode, ljudi s levičarskim idealima mogu dobrovoljno deliti imovinu i redistribuirati sredstva, dok oni s desničarskim vrednostima mogu štedeti i prenositi tradicije, bez toga da bilo koja strana nameće svoj način života drugoj"
wrong_answers:
  - "Sloboda zahteva da obe strane naprave kompromis prihvatanjem centrističke pozicije u kojoj vlada uravnotežuje suprotstavljene vrednosti kroz umerenu regulaciju"
  - "Sloboda znači da levičarske i desničarske zajednice moraju živeti na odvojenim geografskim teritorijama sa sopstvenim nezavisnim vladama"
  - "Sloboda funkcioniše tako što građanima omogućava da glasaju o tome koje vrednosti treba sprovoditi u svakom regionu, rotirajući između levičarskih i desničarskih politika u svakom izbornom ciklusu"
explanation: >-
  Kurs pokazuje da u istinskom režimu slobode oni koji se drže levičarskih ideala mogu dobrovoljno odustati od imovine, deliti sredstva za proizvodnju ili donirati plate redistributivnim organizacijama. Oni s desničarskim vrednostima mogu naporno raditi, štedeti i prenositi porodične vrednosti. Niko ne treba da nameće svoj način života drugima. Ciljevi se mogu postići mirno kroz slobodu tržišta i moć izbora.
