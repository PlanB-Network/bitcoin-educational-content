question: "Libertarians wanaonaje uhusiano kati ya mali binafsi na uhuru?"
answer: "Mali binafsi ni haki ya asili inayotangulia sheria na dola, na ndiyo msingi wenyewe wa uhuru"
wrong_answers:
  - "Mali binafsi ni desturi ya kijamii iliyoundwa na dola ambayo inaweza kufutwa inapozalisha ukosefu wa usawa"
  - "Mali binafsi ni muhimu kwa ufanisi wa kiuchumi lakini haina umuhimu wa kimaadili au kifalsafa ulio wa ndani"
  - "Mali binafsi inapaswa kuwepo tu kwa vitu vya matumizi binafsi, si kwa mali za uzalishaji au ardhi"
explanation: >-
  Libertarians hutetea mali binafsi kama haki ya asili inayotangulia sheria na dola. Hudai kwamba ikiwa mtu binafsi anamiliki mwili wake mwenyewe, pia anamiliki kazi yake na matunda yake. Umiliki wa bidhaa za kimwili ni mwendelezo wa kujimiliki. Hili linatofautiana vikali na mtazamo wa libertaire kwamba mali ni desturi ya kijamii au chanzo cha ukandamizaji.
