question: "What role do Universe services play in the Taproot Assets ecosystem?"
answer: "They provide off-chain infrastructure for asset discovery and proof distribution, like block explorers for Taproot data"
wrong_answers:
  - "They serve as mandatory consensus validators that must confirm every Taproot Asset transaction before final on-chain settlement occurs"
  - "They act as centralized custodians that hold and safeguard all Taproot assets on behalf of their registered users"
  - "They manage and rotate the private keys required to sign and authorize Taproot Asset transfers between counterparties"
explanation: >-
  Universe services function as off-chain data stores for asset discovery and proof distribution, comparable to how Bitcoin block explorers work for blockchain data. They hold no protocol-level privileges and anyone can run one. By keeping detailed transaction histories off-chain while anchoring cryptographic commitments on-chain, the protocol achieves scalability without sacrificing security.
reviewed: false
