question: "사회주의 철학의 맥락에서 'holism'이라는 용어는 무엇을 의미하나요?"
answer: "집단이 개인보다 우선권을 갖는, 사회를 나눌 수 없는 전체로 보는 비전입니다"
wrong_answers:
  - "각 개인을 어떤 집단도 침해할 수 없는 권리를 가진 자기완결적 단위로 보는 철학입니다"
  - "공공 부문과 민간 부문을 같은 비율로 균형 있게 조정하자고 주장하는 경제 이론입니다"
  - "모든 소수자 관점을 하나의 합의 기반 플랫폼으로 통합하는 정치 전략입니다"
explanation: >-
  Holism은 '전체'를 뜻하는 그리스어 'holos'에서 나옵니다. 사회주의 사상에서는 사회를 개인들의 단순한 합이 아니라 나눌 수 없는 전체로 보는 비전을 가리킵니다. 사회주의 국가는 인간 활동을 최대한 맡고 지시하는 것을 목표로 합니다. 이 집단은 사회계급, 국가, 인종 또는 젠더로 대표될 수 있지만, 각각의 경우 개인은 집단 소속에 의해 정의됩니다.
reviewed: false
