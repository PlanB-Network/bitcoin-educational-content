question: "Welche grundlegende Spaltung trennte die Sozialisten ab dem frühen zwanzigsten Jahrhundert?"
answer: "Revolutionäre Sozialisten, die die Macht durch Gewalt ergreifen wollten, gegenüber reformistischen Sozialisten, die Wandel durch demokratische Wahlen anstrebten"
wrong_answers:
  - "Städtische Sozialisten, die sich auf Industriearbeiter konzentrierten, gegenüber ländlichen Sozialisten, die landwirtschaftliche Kommunen organisierten"
  - "Nationalistische Sozialisten, die ihr eigenes Land priorisierten, gegenüber internationalistischen Sozialisten, die eine globale Revolution befürworteten"
  - "Intellektuelle Sozialisten, die theoretische Texte schrieben, gegenüber aktivistischen Sozialisten, die Arbeitsstreiks organisierten"
explanation: >-
  Ab dem frühen zwanzigsten Jahrhundert trennte eine grundlegende Spaltung revolutionäre Sozialisten, die Eigentumsrechte ablehnten und die kapitalistische Gesellschaft durch Gewalt oder die Diktatur des Proletariats zerstören wollten, von reformistischen Sozialisten, die soziale Gerechtigkeit durch demokratische Wahlen und Besteuerung anstrebten, während sie den Kapitalismus vorübergehend akzeptierten. Diese Spaltung prägte die gesamte spätere Geschichte sozialistischer Bewegungen.
reviewed: false
