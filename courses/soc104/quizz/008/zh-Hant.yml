question: "Nolan diagram 上的自由意志主義者之間存在什麼內部張力？"
answer: "有些人想完全廢除國家（無政府資本主義者），另一些人則偏好保留核心主權功能的最小國家（最小國家主義者）"
wrong_answers:
  - "有些人想要強力的經濟管制，另一些人則偏好完全解除所有產業的管制"
  - "有些人支持民主選舉，另一些人則偏好世襲治理制度"
  - "有些人主張進步社會政策，另一些人則捍衛嚴格的傳統道德價值"
explanation: >-
  在自由意志主義家族內部，對國家角色存在根本分歧。無政府資本主義者想用私人服務取代所有國家功能，而最小國家主義者接受保留國防與法院等核心主權功能的最小國家。兩個群體同處自由意志主義的頂端，但在是否應該存在任何國家這一點上有所不同。
reviewed: false
