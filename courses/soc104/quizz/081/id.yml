question: "Apa yang didorong oleh moto Kant 'Sapere aude' agar dilakukan orang?"
answer: "Berani berpikir untuk diri sendiri dan keluar dari keadaan minoritas ketika mereka bergantung pada arahan otoritas yang lebih tinggi"
wrong_answers:
  - "Mengejar pengetahuan akademik dengan mendaftar di lembaga pendidikan formal dan memperoleh kredensial"
  - "Menantang semua bentuk moralitas dan menciptakan sistem etika yang sepenuhnya baru berdasarkan hasrat pribadi"
  - "Mencari kebijaksanaan melalui devosi religius dan ketundukan pada ajaran gereja"
explanation: >-
  Sapere aude, yang berarti "Beranilah berpikir untuk dirimu sendiri," diambil oleh Kant dari penyair Horace dan dijadikan moto Pencerahan. Ini melambangkan keluarnya seseorang dari minoritas, suatu keadaan ketika orang tidak mampu menggunakan pemahamannya tanpa arahan dari kelas atau otoritas yang lebih tinggi. Kant mendorong emansipasi dan tanggung jawab penuh atas pemikiran sendiri.
