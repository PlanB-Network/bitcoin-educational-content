question: "Uruhara rwa Cato Institute, Mises Institute, na Libertarian Party rutandukana gute mu muhari w'abaharanira umwidegemvyo?"
answer: "Cato Institute yibanda ku vyiyumviro vya politike rusangi, Mises Institute ku nyigisho no ku bisohokayandikiro vy'ubushakashatsi, Libertarian Party na yo ku matora"
wrong_answers:
  - "Cato Institute iha amafaranga ibikorwa vyo kwiyamamaza, Mises Institute ikora lobbying muri Congress idaciye ku bandi, Libertarian Party na yo itunganya amanama y'abashakashatsi"
  - "Cato Institute isohora ibitabu vy'ubutunzi, Mises Institute itunganya ibikorwa vyo kwandikisha abatora, Libertarian Party na yo itegura imishinga y'amategeko"
  - "Cato Institute itunganya imyiyerekano iva mu banyagihugu, Mises Institute itanga ubufasha mu mategeko ku baharanira umwidegemvyo, Libertarian Party na yo icungera ubushakashatsi bwa think tank"
explanation: >-
  Cato Institute (yashinzwe mu 1977) ni think tank ikorera i Washington ikora ku vyiyumviro vya politike rusangi. Mises Institute (yashinzwe mu 1982) yibanda ku nyigisho aho kwibanda kuri lobbying ya politike, ikora nk'ubwoko bwa kaminuza yo kuri internet ifise amanama n'ibikorwa vyasubiye gusohorwa. Libertarian Party (yashinzwe mu 1971) ni umugambwe wa gatatu munini muri Amerika, witaba amatora aho n'imigabane y'amajwi yayo ingana hafi na 2% ishobora guhindura ivyavuye mu matora.
