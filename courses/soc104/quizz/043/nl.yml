question: "Hoe vertegenwoordigt de Green New Deal een hedendaagse evolutie van democratisch socialisme?"
answer: "Hij gebruikt milieuzorgen als een nieuwe rechtvaardiging voor staatsinterventie en confiscatie van privé-inkomen, waarbij individueel belang ondergeschikt wordt gemaakt aan collectieve planetaire gezondheid"
wrong_answers:
  - "Hij laat traditionele socialistische economie volledig achter zich ten gunste van vrijemarkt-oplossingen voor milieuproblemen via koolstofhandel"
  - "Hij verwerpt staatsinterventie en vertrouwt in plaats daarvan op vrijwillig individueel handelen en innovatie uit de private sector om klimaatverandering aan te pakken"
  - "Hij vertegenwoordigt een breuk met socialisme door milieubescherming boven alle zorgen over sociale rechtvaardigheid en werkgelegenheid te plaatsen"
explanation: >-
  De Green New Deal versmelt milieuzorgen met sociale doelstellingen, door ecologische transitie te combineren met sociale rechtvaardigheid, werkgelegenheidsgaranties en versterkte publieke diensten. Individueel belang wordt ondergeschikt gemaakt aan collectief belang zoals gedefinieerd door planetaire gezondheid. In de kern biedt hij een nieuwe retorische verpakking die staatsinterventie en confiscatie van privé-inkomen rechtvaardigt, niet langer uitsluitend in naam van sociale rechtvaardigheid maar ook in naam van het milieu.
reviewed: false
