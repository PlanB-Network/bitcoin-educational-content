question: 一個 Simplicity 輸出使用固定的 BIP-0341 NUMS 點作為它的內部金鑰。為什麼金鑰花費被證明是不可能的，而隨機化這個 NUMS 點又增添了什麼？
answer: 沒有人知道這個 NUMS 點的離散對數，所以不可能存在任何金鑰路徑簽章；隨機化只是增添了隱私。
wrong_answers:
  - NUMS 點位於曲線之外，所以金鑰路徑簽章會失敗；隨機化把它帶回曲線上。
  - NUMS 點的私鑰是零，而共識會拒絕它；隨機化保護微調值免受側信道攻擊。
  - 對一個 NUMS 點進行微調會產生一個超出範圍的金鑰，使金鑰花費成為非標準；隨機化則避免了位址重用。
explanation: >-
  一個 NUMS（『Nothing-Up-My-Sleeve』，意即『袖中藏無一物』）點是一個完全有效的曲線點，其構造方式使得沒有人知道對應的私鑰 —— 它的離散對數是未知的。既然金鑰路徑花費需要在內部金鑰下的一個 Schnorr 簽章，而沒有私鑰便無法產生這樣的簽章，金鑰花費路徑便被證明是不可用的，資金只能透過已承諾的腳本路徑移動。隨機化這個 NUMS 點並不會改變其中任何一點；它僅僅是隱藏了金鑰花費已被停用這個事實，使得該輸出看起來就像任何其他的 Taproot 輸出 —— 這是一項隱私上的好處。
reviewed: false
