question: "Green New Deal은 민주사회주의의 현대적 진화를 어떻게 대표하나요?"
answer: "환경적 관심을 국가 개입과 사적 소득 몰수의 새로운 정당화로 사용하며, 개인의 이익을 집단적 지구 건강에 종속시킵니다"
wrong_answers:
  - "탄소 거래를 통한 환경 문제의 자유시장 해법을 위해 전통적 사회주의 경제학을 완전히 포기합니다"
  - "국가 개입을 거부하고 대신 기후변화 대응을 자발적 개인 행동과 민간 부문 혁신에 의존합니다"
  - "환경 보호를 모든 사회정의와 고용 문제보다 우선시함으로써 사회주의와의 단절을 나타냅니다"
explanation: >-
  Green New Deal은 환경적 관심과 사회적 목표를 융합하여, 생태 전환을 사회정의, 고용 보장, 강화된 공공서비스와 결합합니다. 개인의 이익은 지구의 건강으로 정의되는 집단 이익에 종속됩니다. 그 핵심에서 이는 더 이상 사회정의의 이름으로만이 아니라 환경의 이름으로도 국가 개입과 사적 소득의 몰수를 정당화하는 새로운 수사적 포장을 제공합니다.
reviewed: false
