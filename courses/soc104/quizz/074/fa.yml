question: "مواضع محافظه‌کارانه و لیبرتارین درباره حداقل دستمزد، با وجود اینکه هر دو طرفدار لغو آن‌اند، در استدلال خود چگونه تفاوت دارند؟"
answer: "محافظه‌کاران تا زمانی که رقابت‌پذیری مختل نشود، میزانی از دخالت دولت در تعیین دستمزد را می‌پذیرند، در حالی که لیبرتارین‌ها حداقل دستمزد را تحمیلی اخلاقی بر آزادی استخدام و کسب‌وکار می‌دانند"
wrong_answers:
  - "محافظه‌کاران با حداقل دستمزد مخالف‌اند چون تورم ایجاد می‌کند، در حالی که لیبرتارین‌ها با آن مخالف‌اند چون قدرت بیش از حدی به اتحادیه‌های کارگری می‌دهد"
  - "محافظه‌کاران می‌خواهند دستمزدها توسط نهادهای دینی و اجتماعی تعیین شود، در حالی که لیبرتارین‌ها می‌خواهند دستمزدها بر پایه مطالعات بازار تأییدشده دولتی تعیین شوند"
  - "محافظه‌کاران معتقدند حداقل دستمزد باید بر حسب منطقه متفاوت باشد، در حالی که لیبرتارین‌ها معتقدند یک دستمزد ثابت واحد باید در سطح ملی اعمال شود"
explanation: >-
  هر دو طرفدار کاهش یا لغو حداقل دستمزدند، اما استدلالشان اساساً متفاوت است. محافظه‌کاران میزانی از دخالت دولت در تعیین دستمزد را می‌پذیرند، در حالی که اصرار دارند این دخالت حداقلی و وابسته به زمینه بماند و بر رقابت‌پذیری تمرکز می‌کنند. لیبرتارین‌ها موضع اخلاقی قوی‌تری می‌گیرند: حداقل دستمزد تحمیلی بر آزادی استخدام و کسب‌وکار است. وقتی لیبرتارین‌ها می‌گویند «بازار»، منظورشان قرارداد است؛ قراردادی که آزادانه میان دو طرف و بدون مداخله دولت مذاکره می‌شود.
reviewed: false
