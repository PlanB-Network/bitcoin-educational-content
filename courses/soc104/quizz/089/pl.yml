question: "Dlaczego Mises podkreśla, że indywidualizmu nie należy mylić z samowystarczalnością albo mizantropią?"
answer: "Ponieważ indywidualizm promuje współpracę i zrzeszanie się, pod warunkiem że opierają się one na dobrowolnej zgodzie uczestników, uznając, że ludzie rozwijają swój pełny potencjał przez dobrowolne relacje z innymi"
wrong_answers:
  - "Ponieważ indywidualizm wymaga, aby ludzie dołączali do obowiązkowych organizacji obywatelskich w celu zapewnienia wkładu w dobro wspólne"
  - "Ponieważ indywidualizm oznacza, że każda osoba musi polegać całkowicie na państwie w zakresie usług, których nie może zapewnić sobie sama"
  - "Ponieważ indywidualizm wymaga, aby ludzie rywalizowali ze sobą we wszystkich dziedzinach, by dowieść swojej osobistej wyższości"
explanation: >-
  Mises podkreśla, że człowiek jest stworzeniem społecznym. Indywidualizm nie oznacza izolacji. Promuje współpracę i zrzeszanie się pod warunkiem, że opierają się one na dobrowolnej zgodzie uczestników. Człowiek może rozwinąć swój pełny potencjał tylko w relacji z innymi, ale ta współpraca musi być dobrowolna, a nie narzucona przez zbiorową władzę.
reviewed: false
