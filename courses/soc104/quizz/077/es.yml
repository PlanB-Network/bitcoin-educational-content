question: "¿Qué tiene prioridad sobre la libertad en la filosofía política conservadora?"
answer: "El orden y la tradición, que deben estar firmemente establecidos antes de que la libertad pueda ser valorada"
wrong_answers:
  - "La justicia social y la igualdad, que deben garantizarse antes de que los individuos puedan ser verdaderamente libres"
  - "La eficiencia económica y los resultados pragmáticos, que determinan cuándo es apropiada la libertad"
  - "Los derechos de propiedad individuales, que deben protegerse antes de conceder cualquier otra libertad"
explanation: >-
  Para los conservadores, el orden y la tradición tienen prioridad sobre la libertad. Argumentan que demasiada libertad genera caos y desorden social, por lo que la libertad solo puede valorarse una vez que el orden se ha establecido firmemente. Esto contrasta con la visión socialista que prioriza la justicia, o con el enfoque centrista en la eficiencia.
