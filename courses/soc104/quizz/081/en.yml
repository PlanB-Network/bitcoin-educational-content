question: "What is constructivism as a shared political conviction?"
answer: "The belief that a central government can create, by force of law, a social order that is good for the greatest number"
wrong_answers:
  - "The belief that society should be organized through voluntary cooperation between individuals without state interference"
  - "The belief that only free markets can determine the optimal distribution of resources in society"
  - "The belief that political authority should be distributed equally among all citizens through direct democracy"
explanation: >-
  Constructivism unites centrists, conservatives, and socialists around a shared conviction: the superiority of the political process over the market process. It is the belief that a central government can create, by force of law, a social order good for the greatest number. This stands in direct opposition to the libertarian defense of spontaneous order emerging from voluntary interactions.
reviewed: false
