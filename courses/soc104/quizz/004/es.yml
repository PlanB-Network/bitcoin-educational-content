question: "¿Por qué se considera inadecuado el eje izquierda-derecha para ubicar a pensadores liberales clásicos como Bastiat o Ron Paul?"
answer: "Porque el liberalismo clásico valora tanto las libertades económicas como las personales, que ni la izquierda ni la derecha abrazan plenamente"
wrong_answers:
  - "Porque los liberales clásicos siempre se alinean con las políticas económicas de derecha y rechazan todas las posiciones de izquierda"
  - "Porque los liberales clásicos son centristas que adoptan versiones moderadas de las ideologías de izquierda y derecha"
  - "Porque los liberales clásicos se oponen a toda forma de gobierno, lo que los convierte en anarquistas y no en pensadores políticos"
explanation: >-
  El eje izquierda-derecha falla con los liberales clásicos porque no puede acomodar una posición que defiende simultáneamente la libertad económica (normalmente de derecha) y la libertad personal (normalmente de izquierda). Los liberales clásicos no son centristas que busquen compromiso, ni son anarquistas o puramente de derecha. Simplemente no encajan en un espectro unidimensional.
