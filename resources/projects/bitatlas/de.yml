description: |
  BitAtlas ist ein unabhängiges, deutschsprachiges Portal über Bitcoin und Selbstbestimmung. Es bietet ausführliche Erklärtexte zu Geld, Geschichte und Technik, praktische Anleitungen zur Selbstverwahrung, ein laufend gepflegtes Verzeichnis von Sicherheitsvorfällen bei Bitcoin-Anbietern und kostenlose Rechner, etwa zum Sparplan oder zur Erbschaftsplanung. Behandelt wird ausschließlich Bitcoin; Testberichte zu Hardware und Diensten legen Partnerlinks offen.
