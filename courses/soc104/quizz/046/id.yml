question: "Bagaimana konservatisme memperlakukan kebebasan dalam ranah ekonomi dan sosial?"
answer: "Kebebasan yang kuat dalam ranah ekonomi tetapi kebebasan yang lemah dalam ranah sosial"
wrong_answers:
  - "Kebebasan yang lemah dalam ranah ekonomi maupun sosial untuk mempertahankan tatanan sosial tradisional"
  - "Kebebasan yang kuat dalam ranah sosial tetapi kebebasan yang lemah dalam ranah ekonomi"
  - "Kebebasan yang setara dan tak terbatas dalam kedua ranah dengan intervensi pemerintah minimal dalam bentuk apa pun"
explanation: >-
  Konservatisme menunjukkan dikotomi yang merupakan bayangan cermin sosialisme. Dalam ranah ekonomi, kaum konservatif membela pasar bebas, kewirausahaan, dan properti privat. Dalam ranah sosial, pembatasan dibenarkan demi pelestarian norma moral tradisional dan stabilitas sosial. Jawaban salah ketiga menggambarkan pola sosialis, yang merupakan kebalikannya.
