question: Adam Smith බෙදාගන්නා Marquis d'Argensonගේ මූලධර්ම කුමක්ද?
answer: ශ්‍රම විභජනය සහ ස්ව-අභිලාෂය
wrong_answers:
  - Laissez faire සහ ස්ව-අභිලාෂය
  - Laissez faire සහ ශ්‍රම විභජනය
  - ශ්‍රම විභජනය සහ ආරක්ෂණවාදය
explanation: |
  Marquis d'Argenson ශ්‍රම විභජනය සහ ආර්ථිකයේ ක්‍රියාකාරිත්වයේ ස්ව-අභිලාෂයේ භූමිකාව වැනි Adam Smithගේ ප්‍රධාන අදහස් කිහිපයක් පූර්වයෙන් දැක්වීය. Smith මෙම අදහස් "The Wealth of Nations" තුළ වඩා පද්ධතිගත ලෙස වර්ධනය කළේය.