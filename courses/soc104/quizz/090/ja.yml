question: "企業寄りであることと市場寄りであることの重要な違いは何か？"
answer: "企業寄りの擁護者は特定の企業を失敗から守るために国家介入を求める一方、市場寄りの擁護者は規制緩和を支持し、市場が自然に再編成できるよう企業の失敗を認める"
wrong_answers:
  - "企業寄りの擁護者は大企業に焦点を当てる一方、市場寄りの擁護者は中小企業とスタートアップの支援だけに焦点を当てる"
  - "企業寄りは労働者協同組合を好む左派の立場である一方、市場寄りは私有を好む右派の立場である"
  - "企業寄りの擁護者はすべての競争を拒否する一方、市場寄りの擁護者は承認された企業間の政府規制された競争を支持する"
explanation: >-
  企業寄りの立場は、競争を規制を通じて得られる統治の道具と見なし、雇用喪失を防ぐために補助金や救済を正当化する。企業寄りの見方では、市場は脆弱であり、国家による救済を必要とする。市場寄りの擁護者は、競争を自由企業の自然な結果と見なし、規制緩和と企業が失敗することを認めることを含意する。なぜなら、失敗は市場が自然に再編成し、より有能な行為者に場を開くことを可能にするからである。
