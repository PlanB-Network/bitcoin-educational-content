question: "Qu'est-ce que la devise de Kant « Sapere aude » encourage les gens à faire ?"
answer: "Oser penser par eux-mêmes et sortir de l'état de minorité où ils dépendent de la direction d'une autorité supérieure"
wrong_answers:
  - "Poursuivre le savoir académique en s'inscrivant dans des institutions éducatives formelles et en obtenant des diplômes"
  - "Remettre en cause toutes les formes de moralité et créer des systèmes éthiques entièrement nouveaux fondés sur le désir personnel"
  - "Chercher la sagesse par la dévotion religieuse et la soumission aux enseignements de l'Église"
explanation: >-
  Sapere aude, qui signifie « Ose penser par toi-même », a été repris par Kant au poète Horace et fait la devise des Lumières. Il symbolise la sortie de la minorité, un état dans lequel les personnes sont incapables de se servir de leur entendement sans la direction d'une classe ou d'une autorité supérieure. Kant encourage l'émancipation et la pleine responsabilité de sa propre pensée.
