question: Mirabeau physiocratic පාසල තුළ සක්‍රීය භූමිකාවක් ඉටු කළේය. ඔහු විශේෂයෙන් කාව පරිවර්තනය කළේද?
answer: Dupont de Nemours
wrong_answers:
  - François Quesnay
  - Turgot
  - Adam Smith
explanation: |
  Mirabeau Dupont de Nemoursව physiocracy වෙත පරිවර්තනය කළේය. එමගින් පසුව ඔහුට මෙම චින්තන පාසලේ ප්‍රධාන ආධාරකරුවෙකු වීමට හැකි විය.
