question: "Che cos'è il conservatorismo politico?"
answer: "Un'ideologia che mira a preservare le istituzioni politiche stabilite e l'ordine sociale, opponendosi a grandi sconvolgimenti strutturali"
wrong_answers:
  - "Un impegno personale verso i valori familiari tradizionali e le pratiche religiose senza cercare di imporli agli altri"
  - "Una filosofia che promuove un rapido cambiamento sociale attraverso la riforma democratica e una legislazione progressista"
  - "Una teoria economica che sostiene i liberi mercati, una tassazione minima e l'abolizione delle barriere commerciali"
explanation: >-
  Il conservatorismo politico è un'ideologia, spesso rappresentata da partiti di destra o di estrema destra, che mira a preservare le istituzioni politiche stabilite e l'ordine sociale, opponendosi a grandi sconvolgimenti strutturali. I suoi sostenitori desiderano usare il potere e la legge per salvaguardare la propria eredità. Questo differisce dal conservatorismo culturale, che è una scelta di vita personale più che un programma politico.
