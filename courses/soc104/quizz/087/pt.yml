question: "O que o lema de Kant 'Sapere aude' encoraja as pessoas a fazer?"
answer: "A ousar pensar por si mesmas e sair do estado de menoridade em que dependem da direção de uma autoridade superior"
wrong_answers:
  - "A buscar conhecimento acadêmico matriculando-se em instituições formais de ensino e obtendo credenciais"
  - "A desafiar todas as formas de moralidade e criar sistemas éticos inteiramente novos baseados no desejo pessoal"
  - "A buscar sabedoria por meio da devoção religiosa e da submissão aos ensinamentos da igreja"
explanation: >-
  Sapere aude, que significa "Ouse pensar por si mesmo", foi tomado por Kant do poeta Horácio e transformado no lema do Iluminismo. Ele simboliza a saída da menoridade, um estado em que as pessoas são incapazes de usar seu entendimento sem a direção de uma classe ou autoridade superior. Kant encoraja a emancipação e a plena responsabilidade pelo próprio pensamento.
