question: "Чем различается аргументация консерваторов и либертарианцев по вопросу минимальной заработной платы, несмотря на то что обе стороны выступают за её отмену?"
answer: "Консерваторы допускают некоторое участие государства в установлении заработной платы, если оно не мешает конкурентоспособности, тогда как либертарианцы рассматривают минимальную заработную плату как моральное навязывание ограничения свободы нанимать и вести бизнес"
wrong_answers:
  - "Консерваторы выступают против минимальной заработной платы, потому что она создаёт инфляцию, тогда как либертарианцы выступают против неё, потому что она даёт слишком много власти профсоюзам"
  - "Консерваторы хотят, чтобы заработная плата устанавливалась религиозными и общинными институтами, тогда как либертарианцы хотят, чтобы заработная плата определялась одобренными государством рыночными исследованиями"
  - "Консерваторы считают, что минимальная заработная плата должна различаться по регионам, тогда как либертарианцы считают, что единая фиксированная заработная плата должна применяться по всей стране"
explanation: >-
  Обе стороны выступают за сокращение или отмену минимальной заработной платы, но их аргументация принципиально различается. Консерваторы допускают некоторое участие государства в установлении заработной платы, настаивая при этом, что оно должно оставаться минимальным и зависимым от контекста, с акцентом на конкурентоспособность. Либертарианцы занимают более сильную моральную позицию: минимальная заработная плата является навязыванием ограничения свободы нанимать и вести бизнес. Когда либертарианцы говорят "рынок", они имеют в виду договор, свободно согласованный между двумя сторонами без вмешательства государства.
