question: Why do Austrians claim that socialism is impossible to achieve?
answer: Without a free price system, central planners cannot make accurate economic calculations.
wrong_answers:
  - Socialism is contrary to nature.
  - Socialism is economically efficient but immoral.
  - Socialism requires too many bureaucrats to function properly.
explanation: |
  Ludwig von Mises demonstrated that socialism is impossible in practice because, without a free price system provided by the market, central planners cannot make accurate economic calculations, inevitably leading to widespread shortages and misallocation of resources.
reviewed: true
