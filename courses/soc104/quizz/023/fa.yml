question: "محافظه‌کاری فرهنگی چیست؟"
answer: "پایبندی شخصی به ارزش‌های خانوادگی، اخلاقی، زیبایی‌شناختی و متافیزیکیِ به‌ارث‌رسیده از گذشته، نه یک فلسفهٔ سیاسی"
wrong_answers:
  - "ایدئولوژی‌ای سیاسی که از قدرت دولت برای تحمیل ارزش‌های سنتی بر سراسر جامعه از طریق قانون‌گذاری استفاده می‌کند"
  - "جنبشی که همهٔ شکل‌های مدرنیته را رد می‌کند و می‌کوشد جامعه را به شیوهٔ زندگی پیشاصنعتی بازگرداند"
  - "دکترینی اقتصادی که از صنایع ملی حمایت می‌کند و با تجارت آزاد با کشورهای خارجی مخالفت می‌کند"
explanation: >-
  محافظه‌کاری فرهنگی به‌عنوان حکمتی برای زندگی تعریف می‌شود: پایبندی شخصی به ارزش‌های خانوادگی، اخلاقی، زیبایی‌شناختی و متافیزیکیِ به‌ارث‌رسیده از گذشته، خواه یونانی-رومی باشد خواه یهودی-مسیحی. این به‌صراحت یک فلسفهٔ سیاسی نیست. با محافظه‌کاری سیاسی تفاوت دارد، که هدفش حفظ نهادهای سیاسی و نظم اجتماعی از طریق قدرت دولت است. همچنین دربارهٔ رد مدرنیته یا حمایت‌گرایی اقتصادی نیست.
reviewed: false
