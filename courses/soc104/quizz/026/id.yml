question: "Apa yang diungkapkan sumbu vertikal diagram Nolan tentang pertanyaan politik yang sebenarnya?"
answer: "Ia mengungkap apakah Anda ingin memaksakan kepekaan Anda sendiri kepada orang lain melalui negara, atau lebih memilih setiap orang bebas memutuskan bagi dirinya sendiri"
wrong_answers:
  - "Ia mengungkap apakah Anda mendukung tata kelola demokratis atau lebih memilih pemerintahan otoriter oleh satu pemimpin"
  - "Ia mengungkap apakah Anda mengidentifikasi diri dengan gerakan sosial progresif atau dengan institusi keagamaan tradisional"
  - "Ia mengungkap apakah perhatian utama Anda adalah keamanan nasional atau kemakmuran ekonomi"
explanation: >-
  Sumbu vertikal menyingkap pertanyaan politik yang sebenarnya: bukan apakah Anda kiri atau kanan, tetapi sejauh mana Anda ingin negara campur tangan dalam membentuk masyarakat sesuai dengan nilai-nilai Anda. Apakah Anda ingin memaksakan kepekaan Anda kepada orang lain, atau apakah Anda lebih memilih setiap orang bebas memutuskan bagi dirinya sendiri? Kerangka ini melampaui pemisahan kiri-kanan dan menunjukkan bahwa kedua kubu dapat sama-sama statis.
reviewed: false
