question: "Vers quelle forme de gouvernance le centrisme tend-il ?"
answer: "La technocratie, où le pouvoir est confié à des experts qui orientent l'économie et la politique monétaire"
wrong_answers:
  - "La démocratie directe, où les citoyens votent sur chaque grande décision politique"
  - "L'aristocratie, où le pouvoir est détenu par une classe dirigeante traditionnelle"
  - "La gouvernance de laissez-faire, où le marché se régule lui-même sans intervention de l'État"
explanation: >-
  Le centrisme privilégie l'efficacité, le pragmatisme et tend vers la technocratie, ce qui signifie que le pouvoir devrait être confié à des experts qui orientent l'économie et pilotent la politique monétaire. Cela est fondamentalement différent de la démocratie directe, de l'aristocratie ou du laissez-faire, chacune de ces formes distribuant le pouvoir selon des principes entièrement différents.
