question: "Чем различались экономические подходы гитлеровской Германии и сталинского Советского Союза, несмотря на общие тоталитарные методы?"
answer: "Нацистская Германия сохраняла видимость частной собственности, подчиняя частный сектор государственным целям, тогда как сталинизм отменил всю частную собственность и полностью планировал экономику"
wrong_answers:
  - "Нацистская Германия полностью национализировала все отрасли, тогда как режим Сталина допускал ограниченное частное предпринимательство в сельском хозяйстве"
  - "Нацистская Германия продвигала свободную международную торговлю для финансирования перевооружения, тогда как сталинизм ввёл полную экономическую изоляцию"
  - "Нацистская Германия опиралась на добровольное сотрудничество корпораций с государством, тогда как сталинизм использовал только принудительный труд"
explanation: >-
  Хотя оба режима использовали одинаковые политические методы (культ личности, тотальная слежка, систематическое устранение оппозиции), их экономические модели различались по форме. Нацистская Германия формально не отменяла частную собственность, но полностью подчиняла частный сектор государственным целям, таким как война и перевооружение, вводя экономическую автаркию. Сталинизм пошёл дальше: он отменил всю частную собственность, внедрил пятилетние планы и напрямую контролировал всё производство и распределение.
