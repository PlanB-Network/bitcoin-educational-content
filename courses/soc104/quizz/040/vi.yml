question: "Thuật ngữ 'chủ nghĩa toàn thể' có nghĩa là gì trong bối cảnh triết học xã hội chủ nghĩa?"
answer: "Một tầm nhìn về xã hội như một chỉnh thể không thể phân chia, trong đó tập thể có vị thế ưu tiên hơn cá nhân"
wrong_answers:
  - "Một triết lý xem mỗi cá nhân như một đơn vị tự đủ, với các quyền không thể bị bất kỳ nhóm nào lấn át"
  - "Một lý thuyết kinh tế ủng hộ việc cân bằng khu vực công và khu vực tư ở mức ngang nhau"
  - "Một chiến lược chính trị tích hợp mọi quan điểm thiểu số vào một nền tảng duy nhất dựa trên đồng thuận"
explanation: >-
  Chủ nghĩa toàn thể bắt nguồn từ tiếng Hy Lạp 'holos', nghĩa là 'cái toàn bộ.' Trong tư tưởng xã hội chủ nghĩa, nó chỉ một tầm nhìn về xã hội như một chỉnh thể không thể phân chia thay vì một tổng đơn giản của các cá nhân. Nhà nước xã hội chủ nghĩa nhằm phụ trách và định hướng hoạt động của con người đến mức tối đa. Tập thể này có thể được đại diện như một giai cấp xã hội, một quốc gia, một chủng tộc hoặc một giới tính, nhưng trong mỗi trường hợp cá nhân được định nghĩa bởi sự thuộc về nhóm.
