question: "Čo odlišuje neokonzervatívcov od paleokonzervatívcov v ich prístupe k zahraničnej politike?"
answer: "Neokonzervatívci ospravedlňujú vojenský intervencionizmus na šírenie demokracie, zatiaľ čo paleokonzervatívci obhajujú izolacionistickejšiu zahraničnú politiku"
wrong_answers:
  - "Neokonzervatívci odmietajú akékoľvek vojenské akcie a uprednostňujú diplomaciu, zatiaľ čo paleokonzervatívci podporujú preventívne údery proti potenciálnym hrozbám"
  - "Neokonzervatívci sa sústreďujú výlučne na ekonomické sankcie, zatiaľ čo paleokonzervatívci presadzujú budovanie medzinárodných koalícií pre spoločné vojenské operácie"
  - "Neokonzervatívci a paleokonzervatívci sa zhodujú v zahraničnej politike, ale ostro sa líšia v domácej ekonomickej regulácii"
explanation: >-
  Od 2000. rokov sa neokonzervatívci čoraz viac zapájali do ospravedlňovania vojenského intervencionizmu s cieľom zavádzať demokraciu po celom svete, najmä po 11. septembri 2001. Ako reakciu si tradiční konzervatívci nárokovali označenie „paleokonzervatívec“, aby sa odlíšili. Paleokonzervatívci kritizujú vojenský intervencionizmus, obhajujú izolacionistickejšiu zahraničnú politiku a kladú väčší dôraz na národnú a kultúrnu identitu.
