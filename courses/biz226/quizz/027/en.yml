question: "According to BPI, what is the most durable foundation for pro-Bitcoin policy?"
answer: "Officials who genuinely believe that Bitcoin advances their country's strategic interests"
wrong_answers:
  - "Large campaign donations from cryptocurrency companies to sympathetic elected officials"
  - "Grassroots social media pressure campaigns that force politicians to adopt pro-Bitcoin positions"
  - "International treaties that legally require participating countries to adopt Bitcoin-friendly laws"
explanation: >-
  BPI argues that officials must genuinely believe Bitcoin advances their country's interests before they will support pro-Bitcoin policy. Lobbying and donations may create short-term wins, but **they do not survive administration changes**. What survives is genuine conviction backed by deep understanding, which is why BPI prioritizes credentialed research and relationship-building over transactional lobbying.
reviewed: false
