question: Care sunt cele trei imperative financiare formulate de Turgot în celebra sa scrisoare către Ludovic al XVI-lea, la intrarea sa în Contrôle Général?
answer: Fără faliment. Fără creșteri de taxe. Fără împrumuturi
wrong_answers:
  - Fără reforme. Fără taxe noi. Fără legi noi.
  - Fără un război nou. Fără creșteri de taxe. Fără împrumuturi
  - Fără cheltuieli inutile. Fără privilegii. Fără favoritism.
explanation: |
  Cele trei imperative ale lui Turgot au fost: fără faliment, fără creșteri de taxe, fără împrumuturi. El credea că aceste trei principii erau esențiale pentru a restabili finanțele statului și a relansa economia.
