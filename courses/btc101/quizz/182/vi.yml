question: Đặc điểm nào sau đây đã góp phần vào sự mở rộng việc sử dụng Bitcoin trong các chợ đen như Silk Road? 
answer: Bản chất ẩn danh và không thể kiểm soát.
wrong_answers:
  - Sự kiểm soát tập trung của nó.
  - Tính dễ dàng truy vết và có thể kiểm soát của nó.
  - Thiếu ẩn danh của nó.
explanation: >-
  Việc sử dụng Bitcoin mở rộng ra các chợ đen như Silk Road do
  bản chất ẩn danh và không thể kiểm soát của nó.
reviewed: true
