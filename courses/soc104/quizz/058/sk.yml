question: "Aký je dôležitý rozdiel medzi postojom pro-business a postojom pro-market?"
answer: "Postoj pro-business znamená uprednostňovanie aliancie medzi veľkými podnikmi a štátom, zatiaľ čo postoj pro-market znamená podporu slobodnej konkurencie bez štátneho zvýhodňovania"
wrong_answers:
  - "Postoj pro-business znamená podporu malých podnikov, zatiaľ čo postoj pro-market znamená podporu nadnárodných korporácií"
  - "Postoj pro-business znamená úplné odmietanie regulácie, zatiaľ čo postoj pro-market znamená prijatie miernej regulácie"
  - "Postoj pro-business sa zameriava na domáci priemysel, zatiaľ čo postoj pro-market sa zameriava na medzinárodný obchod"
explanation: >-
  Centristi majú sklon byť pro-business, čo znamená, že uprednostňujú určitý druh aliancie medzi veľkými podnikmi a štátom, čo sa líši od postoja pro-market. Postoj pro-market podporuje slobodnú konkurenciu bez štátneho zvýhodňovania alebo korporátneho protekcionizmu. Toto rozlíšenie je kľúčové, pretože politiky pro-business môžu vytvárať monopoly a regulačné ochrany, ktoré v skutočnosti podkopávajú konkurenciu voľného trhu.
reviewed: false
