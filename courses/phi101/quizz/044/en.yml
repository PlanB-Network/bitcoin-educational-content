question: How did the assertion of human freedom in medieval Christian theology contribute to the development of modern thought?
answer: It led to the questioning of political authority and the assertion of freedom of conscience.
wrong_answers:
  - It replaced classical philosophy with a purely theological worldview.
  - It laid the groundwork for a defense of individual rights.
  - It fostered the development of experimental science and rational research.
explanation: |
  Medieval Christian theology's assertion of human freedom paved the way for modern thought by establishing that political authority must respect natural law and individual conscience, laying the groundwork for the concept of rights that transcend political power.
reviewed: true
