question: Breez SDKが、フェデレーションによるペグアウトや中央集権的な取引所に頼らずに、LiquidからBitcoinへの送金を行えるのは、どのようなアーキテクチャ上の仕組みによるものですか？
answer: 両方のチェーンで同時にロックアップ・トランザクションを行い、送金者がBitcoinの資金を、受取人がLiquidの資金を受け取るデュアルスワップの仕組み
wrong_answers:
  - Bitcoinの資金を先にロックし、その後Liquidのトランザクションから得たLightningのペイメント・プリイメージを使って受け取る、単一のサブマリンスワップ
  - Liquid Networkが仲介のブリッジとして、Bitcoinのメインチェーンのトランザクションを検証するリバース・サブマリンスワップの仕組み
  - Boltzが管理し、タイムロック付きコントラクトを使ってLiquidとBitcoinの間のアトミックスワップを調整する、フェデレーション型のマルチシグ・エスクロー
explanation: |
  デュアルスワップの仕組みは、チェーンをまたいでBitcoinを送るために設計されたもので、LiquidとBitcoinの両方のネットワークで同時にロックアップ・トランザクションを行います。このトラストレスな方法により、フェデレーションによるペグアウトなしで直接ブリッジできます。他の選択肢は、一方向のサブマリンスワップを誤って説明していたり、Liquid Networkの役割を取り違えていたり、SDKが明確に避けているフェデレーション型の仕組みに頼っているかのように示していたりします。