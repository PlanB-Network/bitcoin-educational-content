question: Cu ce a comparat marchizul d'Argenson societatea?
answer: Cu un stup de albine, unde fiecare insectă acționează după propriile interese, rezultând bunăstarea comună a tuturor
wrong_answers:
  - Cu o junglă, unde domnește doar legea celui mai puternic
  - Cu un râu, care curge natural fără intervenția legilor
  - O mașinărie complexă care necesită întreținere constantă
explanation: |
  D'Argenson a comparat societatea cu un stup de albine, unde fiecare insectă își urmează instinctul, producând o mare acumulare pentru nevoile micii societăți fără ordine din partea vreunui general. Aceasta este poate expresia cea mai apropiată din gândirea economică franceză de celebra "mână invizibilă" a lui Adam Smith.
