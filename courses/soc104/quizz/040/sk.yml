question: "Čo si francúzski libertaires (socialistickí anarchisti) myslia o súkromnom vlastníctve?"
answer: "Súkromné vlastníctvo a kapitalizmus musia byť zrušené, pretože sú zdrojmi útlaku"
wrong_answers:
  - "Súkromné vlastníctvo je prirodzené právo, ktoré predchádza štátu a musí byť chránené za každú cenu"
  - "Súkromné vlastníctvo by mal regulovať štát, ale nikdy by nemalo byť zo spoločnosti úplne odstránené"
  - "Súkromné vlastníctvo je prijateľné iba vtedy, keď je rovnomerne rozdelené medzi všetkých členov komúny"
explanation: >-
  Francúzski libertaires, dediči socialistického anarchizmu prostredníctvom mysliteľov ako Proudhon a Bakunin, zastávajú názor, že štát aj súkromné vlastníctvo musia byť zrušené ako dvojité zdroje útlaku. Vystihuje to Proudhonova slávna formula „Vlastníctvo je krádež.“ Prvá nesprávna odpoveď opisuje libertariánsku pozíciu, ktorá je zásadne protikladná pohľadu libertaires.
