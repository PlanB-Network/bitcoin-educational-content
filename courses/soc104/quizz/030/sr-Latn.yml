question: "Koje zajedničko tlo dele libertarijanci i konzervativci, i šta ih razdvaja?"
answer: "Dele privrženost ograničenoj vlasti i odbacivanje prinudnog egalitarizma, ali se ne slažu oko vojnog intervencionizma i društvenih politika"
wrong_answers:
  - "Dele podršku protekcionističkim trgovinskim politikama i nacionalnoj odbrani, ali se ne slažu oko uloge religije u javnom životu"
  - "Dele posvećenost progresivnom oporezivanju i programima socijalne pomoći, ali se ne slažu oko imigracione politike"
  - "Dele protivljenje slobodnoj trgovini i legalizaciji droga, ali se ne slažu oko veličine federalne vlade"
explanation: >-
  Libertarijanci i konzervativci zagovaraju ograničenu vlast, odbacuju prinudni egalitarizam, protive se javnom dugu i brane prava saveznih država. Međutim, libertarijanci odbacuju vojni intervencionizam neokonzervativaca, protive se konzervativnim društvenim politikama i subvencijama, osuđuju zabranu droga i odbacuju protekcionizam. Savez je stvaran, ali suštinski napet.
reviewed: false
