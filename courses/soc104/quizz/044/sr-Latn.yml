question: "Šta termin 'holizam' znači u kontekstu socijalističke filozofije?"
answer: "Viziju društva kao nedeljive celine u kojoj kolektiv ima primat nad pojedincem"
wrong_answers:
  - "Filozofiju koja svakog pojedinca tretira kao samostalnu jedinicu čija prava ne može poništiti nijedna grupa"
  - "Ekonomsku teoriju koja zagovara uravnoteženje javnog i privatnog sektora u jednakoj meri"
  - "Političku strategiju koja integriše sva manjinska gledišta u jedinstvenu platformu zasnovanu na konsenzusu"
explanation: >-
  Holizam potiče od grčkog 'holos', što znači 'celina.' U socijalističkoj misli odnosi se na viziju društva kao nedeljive celine, a ne kao prostog zbira pojedinaca. Socijalistička država nastoji da maksimalno preuzme i usmerava ljudsku aktivnost. Taj kolektiv može biti predstavljen kao društvena klasa, nacija, rasa ili rod, ali u svakom slučaju pojedinac se definiše pripadnošću grupi.
reviewed: false
