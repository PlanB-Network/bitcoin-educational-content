question: "In che modo la concezione libertaria della libertà differisce dalla concezione centrista?"
answer: "I libertari trattano la libertà come un assioma incondizionato, mentre i centristi difendono le libertà opportunisticamente in base al contesto e all'efficienza"
wrong_answers:
  - "I libertari permettono allo Stato di proteggere la libertà in modo selettivo, mentre i centristi rifiutano qualsiasi coinvolgimento dello Stato nella protezione dei diritti individuali"
  - "I libertari concentrano la libertà solo sulle questioni economiche, mentre i centristi applicano la libertà ampiamente ai domini sociali e culturali"
  - "Libertari e centristi condividono la stessa visione della libertà ma dissentono sulla dimensione del governo necessaria per farla rispettare"
explanation: >-
  I libertari definiscono la libertà come un principio generale e incondizionato che funziona come un assioma. I centristi, al contrario, difendono certe libertà in modo opportunistico e contestuale, senza applicare alcun principio generale. L'approccio centrista rivela una concezione strumentale della libertà, sempre subordinata a obiettivi pragmatici come l'efficienza, che i libertari rifiutano fondamentalmente.
