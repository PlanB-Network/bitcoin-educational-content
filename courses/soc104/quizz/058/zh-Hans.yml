question: "亲商和亲市场之间的重要区别是什么？"
answer: "亲商意味着支持大企业与国家之间的联盟，而亲市场意味着支持没有国家偏袒的自由竞争"
wrong_answers:
  - "亲商意味着支持小企业，而亲市场意味着支持跨国公司"
  - "亲商意味着完全反对监管，而亲市场意味着接受适度监管"
  - "亲商关注国内产业，而亲市场关注国际贸易"
explanation: >-
  中间主义者往往是亲商的，这意味着他们支持大企业与国家之间的某种联盟，这不同于亲市场。亲市场支持没有国家偏袒或企业保护主义的自由竞争。这一区别至关重要，因为亲商政策可能创造垄断和监管保护，而这些实际上会破坏自由市场竞争。
reviewed: false
