question: "W jakich sprawach prawica chce stanowić prawo?"
answer: "Moralności i religii, kierując się pragnieniem zachowania tradycyjnych instytucji i hierarchii społecznych"
wrong_answers:
  - "Gospodarki i rynków finansowych, kierując się pragnieniem zmniejszenia nierówności i redystrybucji bogactwa"
  - "Nauki i edukacji, kierując się pragnieniem kontrolowania tego, czego uczy się w szkołach publicznych"
  - "Handlu międzynarodowego i dyplomacji, kierując się pragnieniem zwiększenia wpływów narodowych za granicą"
explanation: >-
  Prawica nadaje priorytet moralności osobistej i tradycyjnym wartościom. Uważa, że cywilizacja jest zbudowana na pewnych tradycyjnych instytucjach i hierarchiach społecznych, które trzeba zachować, i chce stanowić prawo dotyczące moralności i religii. To lewica, nie prawica, skupia się na stanowieniu prawa dotyczącego gospodarki. Nauka, edukacja i polityka handlowa nie są głównym opisanym tutaj przedmiotem zainteresowania prawicy.
