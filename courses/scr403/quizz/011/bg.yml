question: Каква е ролята на джетовете в Simplicity?
answer: Джетовете са нативни имплементации, които заменят дадени изрази на Simplicity за по-висока скорост.
wrong_answers:
  - Джетовете са стъпка на компилация, която преобразува Simplicity в Bitcoin Script.
  - Джетовете са мрежови съобщения, които излъчват програми на Simplicity до всички възли.
  - Джетовете са инструменти за дебъгване за тестване и проследяване на изрази на Simplicity.
explanation: >-
  Джетът е нативна имплементация, за която мрежата се съгласява да замести
  определен израз на Simplicity (идентифициран чрез неговия Merkle корен).
  Изразът на Simplicity служи като формална спецификация на това, което
  джетът изчислява, докато нативният код осигурява практична скорост на изпълнение.
  Често срещани джетове обработват аритметични и криптографски операции като SHA-256.
