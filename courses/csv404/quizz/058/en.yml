question: What alternative installation methods exist besides compiling TAPD from source?
answer: Pre-built binaries from the Lightning Labs releases page, or Lightning Terminal (LitD) which bundles TAPD with LND and other services
wrong_answers:
  - A Docker image maintained by the Bitcoin Core team, or installation via the Ubuntu package manager (apt)
  - A snap package available in the Canonical store, or a Homebrew formula for macOS users only
  - An npm package installable via Node.js, or a Python pip package that wraps the Go binary
explanation: >-
  Besides compiling from source, two alternatives are available. Pre-built binaries
  from the Lightning Labs releases page eliminate the need for a Go toolchain.
  Lightning Terminal (LitD) provides an even more integrated approach by bundling
  TAPD alongside LND and several other services into a single package, which the
  course covers in detail in a later chapter.
reviewed: false
