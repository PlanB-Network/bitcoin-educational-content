question: "Was umfasst die Kategorie wirtschaftliche Freiheit?"
answer: "Was du als Produzent und Verbraucher tust: kaufen, verkaufen, produzieren, arbeiten, einstellen und dein Geld verwalten"
wrong_answers:
  - "Deine religiösen Überzeugungen, persönlichen Beziehungen und Meinungsfreiheit"
  - "Dein Recht zu wählen, an Wahlen teilzunehmen und politischen Parteien beizutreten"
  - "Deine Fähigkeit, frei zu reisen, deinen Wohnsitz zu wählen und nationale Grenzen zu überschreiten"
explanation: >-
  Wirtschaftliche Freiheit umfasst, was du als Produzent und Verbraucher tust: was du kaufen, verkaufen oder produzieren kannst; wo du arbeitest; wen du einstellst; und was du mit deinem Geld machst. Persönliche Beziehungen, religiöse Überzeugungen und Bewegungsfreiheit fallen unter die Kategorie persönliche Freiheit, nicht unter die wirtschaftliche.
reviewed: false
