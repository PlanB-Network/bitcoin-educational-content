question: "केंद्रीय नियोजन क्यों विफल होता है, इस बारे में Hayek का मूलभूत तर्क क्या है?"
answer: "ज्ञान केवल अलग-अलग व्यक्तियों के पास मौजूद बिखरे हुए अंशों के रूप में होता है और उसे किसी केंद्रीय प्राधिकरण द्वारा केंद्रित या एकीकृत नहीं किया जा सकता"
wrong_answers:
  - "केंद्रीय नियोजक नैतिक रूप से भ्रष्ट होते हैं और हमेशा सार्वजनिक भलाई के बजाय अपने स्वार्थ में कार्य करते हैं"
  - "लोकतांत्रिक संस्थाएँ आर्थिक परिवर्तनों पर प्रतिक्रिया देने में बहुत धीमी होती हैं, जिससे केंद्रीकृत निर्णय हमेशा पुराने पड़ जाते हैं"
  - "केंद्रीय नियोजन इसलिए विफल होता है क्योंकि नागरिक जानबूझकर सरकारी आदेशों का विरोध करते हैं और नियमों का पालन करने से इंकार करते हैं"
explanation: >-
  Hayek का मूलभूत तर्क सूचना की प्रकृति पर आधारित है। उन्होंने दिखाया कि ज्ञान कभी भी केंद्रित या एकीकृत रूप में मौजूद नहीं होता, बल्कि सभी अलग-अलग व्यक्तियों के पास मौजूद बिखरे हुए अंशों के रूप में ही होता है। मूल्य व्यक्तिनिष्ठ होता है और केवल स्थानीय तथा अपूर्ण रूप से जाना जाता है। दफ़्तर में बैठा केंद्रीय नियोजक चीज़ों की वास्तविक कीमत का कोई ज्ञान नहीं रखता क्योंकि वह अंतःक्रिया और विनिमय में शामिल नहीं होता।
reviewed: false
