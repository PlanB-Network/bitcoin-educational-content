question: "В диаманта на Нолан коя позиция се намира най-горе и представлява максимална свобода?"
answer: "Либертарианството, което подкрепя най-голямата икономическа и лична свобода"
wrong_answers:
  - "Консерватизмът, който подкрепя традиционни ценности и икономическа свобода"
  - "Центризмът, който балансира всички политически позиции по прагматичен начин"
  - "Социализмът, който подкрепя личната свобода и социалното равенство"
explanation: >-
  Либертарианството заема върха на диаманта на Нолан като противоположност на етатизма. То представлява онези, които подкрепят най-голямата степен както на икономическа, така и на лична свобода. Консерватизмът се намира вдясно (висока икономическа, ниска лична свобода), социализмът вляво (висока лична, ниска икономическа свобода), а центризмът в средата.
reviewed: false
