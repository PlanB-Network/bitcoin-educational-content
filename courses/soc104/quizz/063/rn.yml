question: "Ni irihe tandukaniro nyamukuru Hannah Arendt ashira hagati y'ubutegetsi bw'agahotoro bwa kera n'ubutegetsi bw'igitugu bugenzura vyose?"
answer: "Ubutegetsi bw'igitugu bugenzura vyose ntibushira gusa abantu munsi y'amategeko y'igitugu, ahubwo butuma abantu badashobora gukora bigenge, bugahakana politike ubwayo"
wrong_answers:
  - "Ubutegetsi bw'agahotoro bwa kera bugenzura ubukungu mu gihe ubutegetsi bw'igitugu bugenzura vyose bugenzura gusa inzego za politike n'iza gisirikare"
  - "Ubutegetsi bw'igitugu bugenzura vyose ni gusa uburyo bukabije kuruta bw'ubutegetsi bw'agahotoro, butandukana na bwo gusa ku rugero rw'agahato"
  - "Ubutegetsi bw'agahotoro bwa kera bukoresha iciyumviro c'ingenderwako kugira bwisigure mu gihe ubutegetsi bw'igitugu bugenzura vyose bwishimikiza gusa inguvu za gisirikare"
explanation: >-
  Arendt avuga ko ubutegetsi bw'igitugu bugenzura vyose butandukanye mu kamere n'ubutegetsi bw'agahotoro bwa kera. Si igitugu gikabije gusa, ahubwo ni uburyo butuma abantu basa n'abatagifise akamaro, bugasambura ubushobozi bwabo bwo gukora bigenge. Kuri Arendt, politike ni ubushobozi bw'abantu bwo kwifatira kazoza kabo mu minwe, kandi ubutegetsi bw'igitugu bugenzura vyose ni uguhakana nyene ubwo bushobozi; ni co gituma butandukanye mu kamere n'ubutegetsi bw'agahotoro.
