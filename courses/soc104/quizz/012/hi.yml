question: "आर्थिक स्वतंत्रता की श्रेणी में क्या शामिल है?"
answer: "आप उत्पादक और उपभोक्ता के रूप में क्या करते हैं: खरीदना, बेचना, उत्पादन करना, काम करना, नियुक्त करना, और अपने धन का प्रबंधन करना"
wrong_answers:
  - "आपके धार्मिक विश्वास, व्यक्तिगत संबंध, और अभिव्यक्ति की स्वतंत्रता"
  - "मतदान करने, चुनावों में भाग लेने, और राजनीतिक दलों से जुड़ने का आपका अधिकार"
  - "स्वतंत्र रूप से यात्रा करने, अपना निवास चुनने, और राष्ट्रीय सीमाएँ पार करने की आपकी क्षमता"
explanation: >-
  आर्थिक स्वतंत्रता उत्पादक और उपभोक्ता के रूप में आपके कार्यों को कवर करती है: आप क्या खरीद, बेच या उत्पादित कर सकते हैं; आप कहाँ काम करते हैं; आप किसे नियुक्त करते हैं; और आप अपने धन के साथ क्या करते हैं। व्यक्तिगत संबंध, धार्मिक विश्वास, और आवाजाही की स्वतंत्रता व्यक्तिगत स्वतंत्रता की श्रेणी में आते हैं, आर्थिक श्रेणी में नहीं।
