question: "Ce dezvăluie declarația lui Mussolini din 1920 «Totul în Stat, nimic în afara Statului, nimic împotriva Statului» despre totalitarism?"
answer: "Nu mai există nicio separare între spațiul public și cel privat, deoarece statul absoarbe în întregime societatea"
wrong_answers:
  - "Statul se concentrează exclusiv pe puterea militară, lăsând economia întreprinderii private"
  - "Cetățenii sunt liberi să se organizeze în privat atât timp cât nu critică deschis guvernul"
  - "Guvernul controlează doar activitatea politică, în timp ce viața culturală și religioasă rămân autonome"
explanation: >-
  Declarația lui Mussolini surprinde esența totalitarismului: totalitatea. Totul este absorbit în stat, ceea ce înseamnă că nu există nicio separare între spațiul public și cel privat. Societatea își pierde orice formă de autonomie, până la cele mai banale activități, precum deschiderea unui club sportiv. Acest lucru merge mult dincolo de controlul doar al sferelor militară, politică sau economică.
reviewed: false
