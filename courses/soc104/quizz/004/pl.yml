question: "Jaki wspólny punkt łączy lewicowe i prawicowe partie polityczne mimo ich pozornej opozycji?"
answer: "Obie bronią prawa państwa do rządzenia życiem ludzi poprzez regulacje i podatki"
wrong_answers:
  - "Obie opowiadają się za całkowitym zniesieniem interwencji państwa w sprawach gospodarczych"
  - "Obie przedkładają wolność jednostki nad zbiorową organizację społeczeństwa"
  - "Obie odrzucają użycie polityki monetarnej jako narzędzia wydatków rządowych"
explanation: >-
  Mimo że wydają się przeciwstawne, lewica i prawica podzielają preferencję dla interwencji państwa. Obie krytykują wolny rynek i bronią prawa państwa do rządzenia życiem ludzi poprzez regulacje i podatki. Lewica krytykuje rynki jako źródło nierówności, podczas gdy prawica widzi w nich zagrożenie dla suwerenności, ale obie zwracają się do państwa po rozwiązania.
reviewed: false
