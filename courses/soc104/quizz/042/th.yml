question: "การแบ่งแยกพื้นฐานใดที่แยกสังคมนิยมออกจากกันตั้งแต่ต้นศตวรรษที่ยี่สิบเป็นต้นมา?"
answer: "สังคมนิยมปฏิวัติที่มุ่งยึดอำนาจผ่านความรุนแรง เทียบกับสังคมนิยมปฏิรูปที่ไล่ตามการเปลี่ยนแปลงผ่านการเลือกตั้งประชาธิปไตย"
wrong_answers:
  - "สังคมนิยมเมืองที่มุ่งเน้นคนงานอุตสาหกรรม เทียบกับสังคมนิยมชนบทที่จัดตั้งคอมมูนเกษตรกรรม"
  - "สังคมนิยมชาตินิยมที่ให้ความสำคัญกับประเทศของตน เทียบกับสังคมนิยมสากลนิยมที่สนับสนุนการปฏิวัติโลก"
  - "สังคมนิยมปัญญาชนที่เขียนตำราทฤษฎี เทียบกับสังคมนิยมปฏิบัติการที่จัดตั้งการนัดหยุดงานของแรงงาน"
explanation: >-
  ตั้งแต่ต้นศตวรรษที่ยี่สิบเป็นต้นมา การแบ่งแยกพื้นฐานแยกสังคมนิยมปฏิวัติ ซึ่งคัดค้านสิทธิในทรัพย์สินและมุ่งทำลายสังคมทุนนิยมผ่านความรุนแรงหรือเผด็จการของชนชั้นกรรมาชีพ ออกจากสังคมนิยมปฏิรูป ซึ่งไล่ตามความยุติธรรมทางสังคมผ่านการเลือกตั้งประชาธิปไตยและภาษี ขณะยอมรับทุนนิยมชั่วคราว รอยแยกนี้หล่อหลอมประวัติศาสตร์ทั้งหมดภายหลังของขบวนการสังคมนิยม
reviewed: false
