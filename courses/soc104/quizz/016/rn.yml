question: "Insobanuro ya statism itangwa mu buryo bwa Nolan ni iyihe?"
answer: "Gukoresha amategeko kugira ngo ugenzure kandi uhingure ikibano, haba mw'izina ryo gukingira ubusivilizasioni, umugwi w'abakozi, ibidukikije, canke abahahazwa"
wrong_answers:
  - "Uburyo bw'intwaro aho abatowe n'abanyagihugu bakora ibiringo vyagenwe kandi ubutegetsi bugahererekanywa biciye mu matora ya demokarasi"
  - "Ukwemera ko igisirikare gikomeye gusa ari co gishobora gukingira ubusugire bw'igihugu n'ubutaka bwaco"
  - "Inyigisho y'ubutunzi ishira imbere inganda z'igihugu kuruta ihiganwa riva hanze biciye ku misoro y'ibicuruzwa n'ibipimo ntarengwa"
explanation: >-
  Statism isobanurwa nk'ugukoresha amategeko kugira ngo ugenzure kandi uhingure ikibano. Ibumoso n'iburyo vyompi birabikora: bamwe mw'izina ryo gukingira ubusivilizasioni, abandi mw'izina ryo gukingira umugwi w'abakozi, ibidukikije, canke abahahazwa. N'abari hagati baravyemera iyo bibagiriye akamaro. Statism ntigarukira kuri politike y'igisirikare, protectionism y'ubudandaji, canke gusa kugira intwaro zitowe.
