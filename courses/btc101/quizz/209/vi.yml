question: Đường đồ thị cho chu kỳ phát triển của Bitcoin được áp dụng tương tự như thế nào?
answer: Một đường cong chữ S.
wrong_answers:
  - Một đường cong chữ U.
  - Một đường cong chữ V.
  - Một đường cong chữ W.
explanation: >-
  Việc áp dụng Bitcoin, giống như bất kỳ công nghệ mới nào, tuân theo một đường cong chữ S.
  Đây là một mô hình phổ biến cho việc áp dụng các công nghệ mới, nơi việc áp dụng bắt đầu
  chậm rãi, sau đó tăng tốc trước khi chậm lại khi đạt đến bão hòa.
reviewed: true