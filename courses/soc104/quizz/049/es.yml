question: "¿Qué distingue a los neoconservadores de los paleoconservadores en su enfoque de la política exterior?"
answer: "Los neoconservadores justifican el intervencionismo militar para difundir la democracia, mientras que los paleoconservadores defienden una política exterior más aislacionista"
wrong_answers:
  - "Los neoconservadores se oponen a toda acción militar y favorecen la diplomacia, mientras que los paleoconservadores apoyan ataques preventivos contra amenazas potenciales"
  - "Los neoconservadores se centran exclusivamente en las sanciones económicas, mientras que los paleoconservadores abogan por construir coaliciones internacionales para operaciones militares conjuntas"
  - "Los neoconservadores y los paleoconservadores están de acuerdo en política exterior, pero difieren marcadamente en la regulación económica interna"
explanation: >-
  A partir de la década de 2000, los neoconservadores se implicaron cada vez más en justificar el intervencionismo militar para implantar la democracia en todo el mundo, especialmente después del 11 de septiembre de 2001. En reacción, los conservadores tradicionales reivindicaron la etiqueta 'paleoconservador' para distinguirse. Los paleoconservadores critican el intervencionismo militar, defienden una política exterior más aislacionista y ponen mayor énfasis en la identidad nacional y cultural.
