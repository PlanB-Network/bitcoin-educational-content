question: "Greens Nolan diagram पर कहाँ बैठते हैं, और क्यों?"
answer: "Diagram में बहुत नीचे, क्योंकि वे मानते हैं कि व्यक्तिगत हित को ग्रह के सामूहिक हित पर प्राथमिकता नहीं मिलनी चाहिए"
wrong_answers:
  - "Diagram के शीर्ष पर, क्योंकि वे व्यक्तिगत स्वतंत्रता और पर्यावरणीय जागरूकता को समान रूप से प्राथमिकता देते हैं"
  - "Diagram के केंद्र में, क्योंकि वे आर्थिक वृद्धि को पर्यावरण संरक्षण के साथ संतुलित करते हैं"
  - "बहुत दाईं ओर, क्योंकि वे पर्यावरणीय चुनौतियों के लिए बाज़ार-आधारित समाधानों का समर्थन करते हैं"
explanation: >-
  Greens Nolan diagram में बहुत नीचे बैठते हैं क्योंकि वे ग्रह की भलाई के नाम पर आर्थिक और व्यक्तिगत दोनों निर्णयों पर मजबूत राज्य नियंत्रण का समर्थन करते हैं। उन्होंने Marxist वर्ग संघर्ष की जगह मनुष्य और प्रकृति के बीच संघर्ष को रख दिया है, और वे आर्थिक नियंत्रण तथा निजी संपत्ति के उन्मूलन तक का बचाव करने की प्रवृत्ति रखते हैं। यह उन्हें authoritarian क्षेत्र में रखता है, शीर्ष या केंद्र में नहीं।
