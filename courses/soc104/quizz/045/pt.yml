question: "Que distinção Karl Marx fez entre socialismo utópico e socialismo científico?"
answer: "Ele acusou os primeiros socialistas franceses de propor soluções imaginárias, enquanto seu socialismo científico estava fundamentado no materialismo histórico e na luta de classes"
wrong_answers:
  - "Ele argumentou que o socialismo utópico se concentrava demais na economia, enquanto o socialismo científico priorizava a transformação cultural e artística"
  - "Ele elogiou os socialistas utópicos por seus experimentos práticos e criticou o socialismo científico por ser abstrato e teórico demais"
  - "Ele afirmou que o socialismo utópico era violento e revolucionário, enquanto o socialismo científico favorecia a reforma democrática pacífica"
explanation: >-
  Marx acusou os primeiros socialistas franceses, como Proudhon, Saint-Simon e Fourier, de serem utópicos que propunham soluções puramente imaginárias. Seu socialismo científico se apoiava no materialismo histórico: a ideia de que a história progride por meio da luta de classes e da apropriação dos meios de produção, em que todas as representações culturais são condicionadas pelas forças produtivas e pelas relações de produção.
