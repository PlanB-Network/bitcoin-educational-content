question: "Jak se všechny totalitní režimy dostaly k moci?"
answer: "Násilnou revolucí, která ospravedlňovala udělání tlusté čáry za předchozím systémem"
wrong_answers:
  - "Postupnou legislativní reformou v rámci existujících demokratických institucí"
  - "Vojenskými převraty organizovanými cizími mocnostmi usilujícími o regionální kontrolu"
  - "Pokojnými masovými hnutími, která vyhrála lidové volby s velkým náskokem"
explanation: >-
  Všechny totalitní režimy se dostaly k moci násilnou revolucí. Tato revoluce slouží dvojímu účelu: fyzicky ničí starý řád a ideologicky ospravedlňuje použití násilí jako nezbytné pro vybudování nové společnosti. Tím se totalitní převzetí moci odlišuje od demokratických přechodů, převratů podporovaných ze zahraničí nebo pokojných volebních vítězství.
