question: "Wie behandelt der Konservatismus Freiheiten im wirtschaftlichen und gesellschaftlichen Bereich?"
answer: "Starke Freiheiten im wirtschaftlichen Bereich, aber schwache Freiheiten im gesellschaftlichen Bereich"
wrong_answers:
  - "Schwache Freiheiten sowohl im wirtschaftlichen als auch im gesellschaftlichen Bereich, um die traditionelle soziale Ordnung zu bewahren"
  - "Starke Freiheiten im gesellschaftlichen Bereich, aber schwache Freiheiten im wirtschaftlichen Bereich"
  - "Gleiche und unbegrenzte Freiheiten in beiden Bereichen mit minimaler staatlicher Intervention jeglicher Art"
explanation: >-
  Der Konservatismus weist eine Dichotomie auf, die das Spiegelbild des Sozialismus ist. Im wirtschaftlichen Bereich verteidigen Konservative den freien Markt, Unternehmertum und Privateigentum. Im gesellschaftlichen Bereich werden Einschränkungen durch die Bewahrung traditioneller moralischer Normen und sozialer Stabilität gerechtfertigt. Die dritte falsche Antwort beschreibt das sozialistische Muster, das das Gegenteil ist.
