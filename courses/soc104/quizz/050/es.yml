question: "¿Cómo ilustra la respuesta de George W. Bush a la crisis financiera de 2008 la 'flexibilidad problemática' de los principios conservadores?"
answer: "Abandonó los principios de libre mercado para rescatar a los grandes bancos, revelando la visión conservadora del Estado como garante último de la estabilidad económica nacional"
wrong_answers:
  - "Rechazó toda intervención gubernamental y dejó quebrar a los bancos, adhiriéndose estrictamente a la ideología de libre mercado sin importar las consecuencias"
  - "Nacionalizó permanentemente el sector bancario e introdujo una tributación progresiva, pasando del conservadurismo al socialismo democrático"
  - "Respondió recortando todo el gasto público y eliminando las regulaciones financieras para dejar que el mercado se autocorrigiera"
explanation: >-
  Bush declaró que había 'abandonado los principios de libre mercado para salvar el sistema de libre mercado' al intervenir para rescatar a los grandes bancos. Esto ilustra cómo los conservadores pueden priorizar el poder y la continuidad de la nación por encima de principios abstractos de mercado. La misma lógica flexible aparece en las políticas comerciales proteccionistas de Trump, aplicadas en nombre del interés nacional con el riesgo de alimentar el corporativismo y el capitalismo de amigos.
