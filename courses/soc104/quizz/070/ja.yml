question: "薬物合法化に関するリバタリアンの立場に、社会における国家の役割が縮小されなければならないという条件が付くのはなぜですか？"
answer: "国家が引き受ける自由化は個人責任を政府管理のケアに置き換えてしまう一方、リバタリアンは市民が私的結社の支援を受けつつ自らの選択の結果を引き受けることを望むからである"
wrong_answers:
  - "国家管理の合法化は税収を生みすぎ、政府を過度に強力で腐敗したものにするからである"
  - "国家は価格を押し上げ、闇市場を再び生み出す品質基準を課すからである"
  - "政府による薬物規制は国際貿易協定と外交関係に違反するからである"
explanation: >-
  リバタリアンは薬物の自由化を支持しますが、国家の役割が縮小されなければならないと主張します。なぜなら、彼らの目的は個人責任を回復することであり、国家管理を拡大することではないからです。もし誰かが依存状態になったなら、国家にケアを求めるのではなく、自ら責任を負わなければなりません。依存への解決策は、個人、家族、慈善団体による自発的支援という私的イニシアチブにあります。国家管理の合法化は、個人責任というリバタリアンの根本原則に反します。
reviewed: false
