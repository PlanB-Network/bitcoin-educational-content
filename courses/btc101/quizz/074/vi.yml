question: Bitcoin được lưu trữ ở đâu?
answer: Trên chuỗi khối dữ liệu (blockchain) của Bitcoin.
wrong_answers:
  - Trong ví Bitcoin.
  - Trên thiết bị mà ví được cài đặt.
  - Trong két sắt của Cục Dự trữ Liên bang.
explanation:
  Mặc dù khóa riêng của bạn được lưu trữ trong ví của bạn, nhưng chính bitcoin thì thực sự được lưu trữ trong chuỗi khối dữ liệu (blockchain) của Bitcoin, đó là sổ cái phân tán công khai trong mạng ngang hàng của Bitcoin.
reviewed: true