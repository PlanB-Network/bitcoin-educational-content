question: "Co libertarianie sądzą o zdolności jednostek do podejmowania decyzji?"
answer: "Jednostki mają zarówno prawo, jak i odpowiedzialność podejmowania własnych decyzji dotyczących swojego życia"
wrong_answers:
  - "Jednostki powinny podejmować decyzje dopiero po konsultacji z wybranymi przedstawicielami, którzy rozumieją konsekwencje polityk publicznych"
  - "Jednostki zasadniczo nie są zdolne do podejmowania dobrych decyzji i potrzebują eksperckiego przewodnictwa instytucji rządowych"
  - "Jednostki powinny podejmować decyzje gospodarcze swobodnie, ale ustępować państwu we wszystkich sprawach społecznych i kulturowych"
explanation: >-
  Z libertariańskiego punktu widzenia jednostki mają zarówno prawo, jak i odpowiedzialność podejmowania własnych decyzji. Kontrastuje to z konwencjonalnymi rodzinami politycznymi, od lewicy po prawicę, które wierzą, że rząd powinien podejmować część albo wiele ważnych decyzji w życiu jednostki i ogólnie w życiu gospodarczym.
reviewed: false
