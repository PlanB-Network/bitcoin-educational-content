question: "Mengapa Mises menekankan bahwa individualisme tidak boleh disamakan dengan swasembada atau misantropi?"
answer: "Karena individualisme mempromosikan kerja sama dan asosiasi, asalkan keduanya bertumpu pada persetujuan bebas para peserta, dengan mengakui bahwa manusia mengembangkan potensi penuhnya melalui relasi sukarela dengan orang lain"
wrong_answers:
  - "Karena individualisme mewajibkan orang bergabung dengan organisasi kewargaan wajib untuk memastikan mereka berkontribusi pada kebaikan bersama"
  - "Karena individualisme berarti setiap orang harus bergantung sepenuhnya pada negara untuk layanan yang tidak dapat mereka sediakan sendiri"
  - "Karena individualisme menuntut orang saling bersaing di semua domain untuk membuktikan superioritas pribadi mereka"
explanation: >-
  Mises menekankan bahwa manusia adalah makhluk sosial. Individualisme tidak berarti isolasi. Ia mempromosikan kerja sama dan asosiasi dengan syarat keduanya bertumpu pada persetujuan bebas para peserta. Manusia hanya dapat mengembangkan potensi penuhnya dalam relasi dengan orang lain, tetapi kerja sama ini harus bersifat sukarela alih-alih dipaksakan oleh otoritas kolektif.
