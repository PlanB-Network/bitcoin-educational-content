question: "Hva ønsker høyresiden å lovfeste?"
answer: "Moral og religion, drevet av et ønske om å bevare tradisjonelle institusjoner og sosiale hierarkier"
wrong_answers:
  - "Økonomien og finansmarkedene, drevet av et ønske om å redusere ulikhet og omfordele rikdom"
  - "Vitenskap og utdanning, drevet av et ønske om å kontrollere hva som undervises i offentlige skoler"
  - "Internasjonal handel og diplomati, drevet av et ønske om å utvide nasjonal innflytelse i utlandet"
explanation: >-
  Høyresiden prioriterer personlig moral og tradisjonelle verdier. Den mener at sivilisasjonen er bygget på visse tradisjonelle institusjoner og sosiale hierarkier som må bevares, og den ønsker å lovfeste moral og religion. Venstresiden, ikke høyresiden, fokuserer på å lovfeste økonomien. Vitenskap, utdanning og handelspolitikk er ikke hovedfokuset som beskrives for høyresiden.
reviewed: false
