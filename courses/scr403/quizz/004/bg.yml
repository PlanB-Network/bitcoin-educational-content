question: Какво изчислява half-adder?
answer: Преноса (AND) и сумата (XOR) на два входни бита.
wrong_answers:
  - Сумата на две многобитови цели числа с разпространение на пренос.
  - Средната стойност на два бита, закръглена надолу.
  - Побитовите OR и AND на два входни бита.
explanation: >-
  Half-adder приема два единични бита и произвежда два изхода чрез
  паралелна композиция: бита за пренос (AND на входовете) и бита за сума
  (XOR на входовете). В Simplicity той е дефиниран като and ▵ xor, изпълнявайки
  и двете операции върху една и съща входна двойка.
