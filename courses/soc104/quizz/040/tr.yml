question: "Yirminci yüzyılın başlarından itibaren sosyalistleri hangi temel bölünme ayırdı?"
answer: "Şiddet yoluyla iktidarı ele geçirmeye çalışan devrimci sosyalistler ile demokratik seçimler yoluyla değişim arayan reformist sosyalistler"
wrong_answers:
  - "Sanayi işçilerine odaklanan kentsel sosyalistler ile tarımsal komünler örgütleyen kırsal sosyalistler"
  - "Kendi ülkelerine öncelik veren milliyetçi sosyalistler ile küresel devrimi savunan enternasyonalist sosyalistler"
  - "Teorik metinler yazan entelektüel sosyalistler ile işçi grevleri örgütleyen aktivist sosyalistler"
explanation: >-
  Yirminci yüzyılın başlarından itibaren temel bir bölünme, mülkiyet haklarına karşı çıkan ve kapitalist toplumu şiddet ya da proletarya diktatörlüğü yoluyla yıkmaya çalışan devrimci sosyalistleri; kapitalizmi geçici olarak kabul ederken demokratik seçimler ve vergilendirme yoluyla sosyal adalet peşinde koşan reformist sosyalistlerden ayırdı. Bu bölünme, sosyalist hareketlerin sonraki tüm tarihini şekillendirdi.
reviewed: false
