question: "¿Cuáles son los valores cardinales del centrismo?"
answer: "Moderación, compromiso, adaptación y utilidad pública"
wrong_answers:
  - "Tradición, orden, autoridad e identidad nacional"
  - "Libertad, propiedad privada, consentimiento y responsabilidad individual"
  - "Igualdad, justicia social, solidaridad y propiedad colectiva"
explanation: >-
  Los valores cardinales del centrismo son la moderación, el compromiso, la adaptación y la utilidad pública. Estos reflejan el énfasis centrista en el equilibrio pragmático más que en el compromiso ideológico. Las otras opciones describen los valores cardinales del conservadurismo, el libertarismo y el socialismo, respectivamente.
