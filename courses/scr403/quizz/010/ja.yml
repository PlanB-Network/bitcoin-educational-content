question: Simplicityではboolean型（𝟚）はどのように定義されますか？
answer: 和型𝟙 + 𝟙として定義され、ちょうど2つの値（falseとtrue）を保持します。
wrong_answers:
  - 積型𝟙 × 𝟙として定義され、その場合は1つの値しか保持しません。
  - 言語に直接組み込まれた特別なプリミティブ型として定義されます。
  - 値0と1だけに制限された32ビット整数型として定義されます。
explanation: >-
  boolean型𝟚は、2つのunit型の和である𝟙 + 𝟙として定義される。
  左タグ付きの値σᴸ⟨⟩はfalse（0）を表し、右タグ付きの値σᴿ⟨⟩は
  true（1）を表す。これはunit型と和型構成子だけから構築される
  1ビットのデータ型であり、積型構成子は不要である。
reviewed: false
