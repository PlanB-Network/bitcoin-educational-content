question: "¿Cómo sostiene el curso que la libertad permite que los valores de izquierda y de derecha coexistan pacíficamente?"
answer: "En un régimen de libertad genuina, las personas con ideales de izquierda pueden compartir voluntariamente posesiones y redistribuir fondos, mientras que quienes tienen valores de derecha pueden ahorrar y transmitir tradiciones, sin que ningún lado imponga su forma de vida al otro"
wrong_answers:
  - "La libertad requiere que ambos lados lleguen a un compromiso aceptando una posición centrista en la que el gobierno equilibre valores contrapuestos mediante regulación moderada"
  - "La libertad significa que las comunidades de izquierda y de derecha deben vivir en territorios geográficos separados con sus propios gobiernos independientes"
  - "La libertad funciona permitiendo a los ciudadanos votar qué valores deben aplicarse en cada región, alternando entre políticas de izquierda y de derecha en cada ciclo electoral"
explanation: >-
  El curso muestra que, en un régimen genuino de libertad, quienes se adhieren a ideales de izquierda pueden renunciar voluntariamente a posesiones, compartir medios de producción o donar salarios a organizaciones redistributivas. Quienes tienen valores de derecha pueden trabajar duro, ahorrar y transmitir valores familiares. Nadie debería imponer su forma de vida a los demás. Es mediante la libertad del mercado y el poder de elección como los objetivos pueden alcanzarse pacíficamente.
