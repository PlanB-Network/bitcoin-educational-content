question: "Miks väidab Popper, et avatud ühiskond jääb oma eelistest hoolimata olemuslikult hapraks?"
answer: "Sest vastutus, mida individualism eeldab, võib tunduda hirmutav, luues kiusatuse otsida varjupaika kogukondlikus kaitses, võimus või nostalgias idealiseeritud mineviku järele"
wrong_answers:
  - "Sest avatud ühiskondadel puudub sõjaline tugevus ja nad ei suuda end kaitsta suletud ühiskondade sissetungi eest"
  - "Sest demokraatlikud institutsioonid on olemuslikult ebatõhusad ja varisevad lõpuks bürokraatliku keerukuse raskuse all kokku"
  - "Sest avatud ühiskonnad lubavad liiga suurt majanduslikku ebavõrdsust, mis viib paratamatult revolutsiooni ja autoritaarsete režiimide kehtestamiseni"
explanation: >-
  Popper rõhutab, et avatud ühiskonna haprus tuleneb psühholoogilisest haavatavusest. Vastutus, mida individualism eeldab, võib tunduda hirmutav ja riskantne, sest inimene peab tegema omaenda valikuid ja võib ebaõnnestuda. See loob kiusatuse otsida varjupaika kogukondlikus kaitses või nostalgilistes kalduvustes idealiseeritud mineviku poole. Avatud ühiskond seisab silmitsi pidevate väljakutsetega kommunitaarsetest impulssidest ja korduvast vägivalla kiusatusest.
reviewed: false
