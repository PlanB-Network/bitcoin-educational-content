question: "Какво е политически консерватизъм?"
answer: "Идеология, която цели да запази установените политически институции и социалния ред, противопоставяйки се на голямо структурно сътресение"
wrong_answers:
  - "Лична привързаност към традиционни семейни ценности и религиозни практики, без стремеж те да бъдат налагани на другите"
  - "Философия, която насърчава бърза социална промяна чрез демократична реформа и прогресивно законодателство"
  - "Икономическа теория, която защитава свободните пазари, минималното данъчно облагане и премахването на търговските бариери"
explanation: >-
  Политическият консерватизъм е идеология, често представена в десни или крайнодесни партии, която цели да запази установените политически институции и социалния ред, като се противопоставя на голямо структурно сътресение. Неговите привърженици искат да използват властта и закона, за да опазят наследството си. Това се различава от културния консерватизъм, който е личен житейски избор, а не политическа програма.
