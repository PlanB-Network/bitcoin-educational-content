question: ප්‍රංශයේ හොරබඩු වෙළඳාම මෙතරම් ව්‍යාප්ත වී ඇතැයි ඔහු සිතන්නේ ඇයි?
answer: නියමන හේතුවෙන් ඇතැම් භාණ්ඩ නීත්‍යානුකූලව වෙළඳාම් කිරීම වැළැක්වෙන නිසා, සමාන්තර වෙළඳපොළක් විවෘත වේ
wrong_answers:
  - ප්‍රංශයේ දුප්පත් මිනිසුන් එතරම් බොහෝ බැවින්, ඔවුන්ගේ එකම සම්පත හොරබඩු වෙළඳාම වන නිසා
  - ප්‍රොතෙස්තන්ත විගමනය හොරබඩු වෙළඳාමට පෝෂක භූමියක් වන නිසා
  - රේගු නිලධාරීන් දූෂිත නිසා
explanation: |
  අධික නියමන, වෙළඳාම තහනම් වූ හෝ දැඩි බදු පැනවූ භාණ්ඩ සඳහා සමාන්තර වෙළඳපොළවල් නිර්මාණය කිරීමෙන්, හොරබඩු වෙළඳාම දිරිමත් කරන බව Gournay විශ්වාස කළේය.
