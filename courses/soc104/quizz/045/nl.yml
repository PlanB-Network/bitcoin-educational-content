question: "Wat betekent de term 'holisme' in de context van socialistische filosofie?"
answer: "Een visie op de samenleving als een ondeelbaar geheel waarin het collectief voorrang heeft op het individu"
wrong_answers:
  - "Een filosofie die elk individu behandelt als een op zichzelf staande eenheid waarvan de rechten door geen enkele groep terzijde kunnen worden geschoven"
  - "Een economische theorie die pleit voor het in gelijke mate in evenwicht brengen van publieke en private sectoren"
  - "Een politieke strategie die alle minderheidsstandpunten integreert in één op consensus gebaseerd platform"
explanation: >-
  Holisme komt van het Griekse 'holos', dat 'het geheel' betekent. In socialistisch denken verwijst het naar een visie op de samenleving als een ondeelbaar geheel in plaats van een eenvoudige som van individuen. De socialistische staat beoogt menselijke activiteit maximaal op zich te nemen en te sturen. Dit collectief kan worden voorgesteld als een sociale klasse, een natie, een ras of een gender, maar in elk geval wordt het individu gedefinieerd door groepslidmaatschap.
reviewed: false
