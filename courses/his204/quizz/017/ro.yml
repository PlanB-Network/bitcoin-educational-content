question: Deși Richard Cantillon a devenit cetățean francez în 1708, de unde provenea?
answer: Din Irlanda
wrong_answers:
  - Din Spania
  - Din Anglia
  - Din Germania
explanation: |
  Richard Cantillon era de origine irlandeză și a dobândit ulterior naționalitatea franceză în 1708. Și-a petrecut o mare parte din viață în Franța și a fost influențat de ideile economice franceze ale vremii sale.
