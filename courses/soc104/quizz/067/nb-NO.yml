question: "Hvorfor har totalitære regimer blitt beskrevet som «sekulære religioner», og hva avslører dette om betingelsene som må være til stede for at totalitarisme skal eksistere?"
answer: "De krever kvasi-religiøs tro fra militantene og bruker frykt mot motstanderne, og totalitarisme krever alle kjennetegn samtidig: undertrykte friheter, ettpartistyre, voldelig revolusjon og en styrt økonomi"
wrong_answers:
  - "De erstatter tradisjonell gudsdyrkelse med statlige seremonier, og totalitarisme krever bare en karismatisk leder og militær kontroll"
  - "De bruker religiøse institusjoner til å håndheve statsideologi, og totalitarisme kan oppstå når et enkelt politisk parti dominerer parlamentet"
  - "De lover åndelig frelse gjennom politisk handling, og totalitarisme eksisterer når staten kontrollerer økonomien uavhengig av politiske friheter"
explanation: >-
  Raymond Aron observerte at totalitære regimer fungerer etter to prinsipper: militantenes tro og motstandernes frykt. Denne kvasi-religiøse fanatismen kjennetegner dem på tvers av deres ulike motivasjoner, og gir dem merkelappen sekulære religioner. Avgjørende er at totalitarisme krever alle definerende kjennetegn samtidig: undertrykte friheter, ubegrenset autoritet gjennom ett parti, voldelig revolusjon og en styrt økonomi. Moderne demokratier kan vise noen av disse trekkene, men totalitarisme er bare til stede når alle er samlet.
