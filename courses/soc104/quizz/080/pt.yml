question: "Qual é a discordância central entre libertários e outras famílias políticas quando eles compartilham os mesmos objetivos?"
answer: "A discordância é sobre os meios: os libertários rejeitam soluções coercitivas e favorecem a troca voluntária por meio do processo de mercado"
wrong_answers:
  - "A discordância é sobre os fins: os libertários buscam objetivos diferentes, como riqueza individual em vez de bem-estar social"
  - "A discordância é sobre o timing: os libertários querem alcançar os mesmos objetivos mais lentamente, por meio de reformas graduais"
  - "A discordância é sobre o escopo: os libertários querem aplicar as mesmas políticas apenas em níveis locais, e não nacionais"
explanation: >-
  Os libertários podem concordar com socialistas, conservadores e centristas sobre certos objetivos, como defender os oprimidos ou promover a coesão social. A discordância não está nos fins, mas nos meios. Os libertários rejeitam todas as soluções coercitivas que buscam uniformizar práticas e regulamentações, defendendo em vez disso o poder de escolha e a liberdade responsável por meio de trocas livres e descentralizadas fundadas em contratos voluntários.
