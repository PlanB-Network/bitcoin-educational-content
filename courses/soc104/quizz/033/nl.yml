question: "Hoe zien libertariërs de relatie tussen privé-eigendom en vrijheid?"
answer: "Privé-eigendom is een natuurlijk recht dat aan de wet en de staat voorafgaat, en is het eigenlijke fundament van vrijheid"
wrong_answers:
  - "Privé-eigendom is een sociale conventie die door de staat is gecreëerd en kan worden ingetrokken wanneer het ongelijkheid veroorzaakt"
  - "Privé-eigendom is nuttig voor economische efficiëntie, maar heeft geen intrinsieke morele of filosofische betekenis"
  - "Privé-eigendom zou alleen moeten bestaan voor persoonlijke bezittingen, niet voor productieve activa of grond"
explanation: >-
  Libertariërs verdedigen privé-eigendom als een natuurlijk recht dat aan de wet en de staat voorafgaat. Zij betogen dat als een individu zijn eigen lichaam bezit, hij ook zijn arbeid en de vruchten daarvan bezit. Eigendom van materiële goederen is een uitbreiding van zelfeigendom. Dit staat scherp tegenover de libertaire visie dat eigendom een sociale conventie of een bron van onderdrukking is.
