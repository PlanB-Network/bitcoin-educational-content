question: Boisguilbertට Vauban සමඟ පොදු වන්නේ කුමක්ද?
answer: ග්‍රාමීය ජනතාවගේ දුක්ඛිත තත්ත්වය දීර්ඝ ලෙස විස්තර කිරීම සහ සියලු දෙනා සඳහා සමානුපාතික බද්දක් යෝජනා කිරීම
wrong_answers:
  - ග්‍රාමීය ජනතාවගේ දුක්ඛිත තත්ත්වය දීර්ඝ ලෙස විස්තර කිරීම, සහ ලේඛකයෙකු ලෙස තම වෘත්තීය ජීවිතය ආරම්භ කිරීම
  - සියලු දෙනා සඳහා සමානුපාතික බද්දක් යෝජනා කිරීම සහ මුදල් ඇමතිවරයා වීම
  - මුදල් ඇමතිවරයා වීම සහ සාහිත්‍ය වෘත්තීය ජීවිතයකින් ආරම්භ කිරීම
explanation: |
  Pierre Le Pesant, sieur de Boisguilbert, Vauban මෙන්, ගොවි ජනතාවගේ දුක්ඛිත තත්ත්වය පිළිබඳ තියුණු නිරීක්ෂකයෙකු වූ අතර සමානුපාතික බද්දක් මත පදනම් වූ බදු ප්‍රතිසංස්කරණයක් යෝජනා කළේය. කෙසේ වෙතත්, Colbert මෙන් නොව, Boisguilbert හෝ Vauban දෙදෙනාම මුදල් ඇමතිවරු නොවූහ.
