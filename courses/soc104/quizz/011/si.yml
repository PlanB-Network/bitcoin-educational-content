question: "Nolan රූපසටහනේ තිරස් අක්ෂයට (වම-දකුණ) වඩා සිරස් අක්ෂය (ඉහළ-පහළ) වඩා මූලික ලෙස සැලකෙන්නේ ඇයි?"
answer: "උපරිම පුද්ගලික නිදහස්තා ආරක්ෂා කරන අය සහ උපරිම රාජ්‍ය පාලනයට කැමති අය අතර සැබෑ බෙදීම එය හෙළි කරන නිසා"
wrong_answers:
  - "තිරස් අක්ෂය සමාජ ප්‍රතිපත්ති මනිනවාට වඩා එය ආර්ථික නිෂ්පාදනය වඩා නිවැරදිව මනින නිසා"
  - "ඉතිහාසය පුරා බොහෝ දේශපාලන ගැටුම් පාලනයට වඩා සංස්කෘතික අනන්‍යතාව පිළිබඳ වූ නිසා"
  - "තිරස් අක්ෂය නූතන ප්‍රජාතන්ත්‍රවාදයන්ට පමණක් අදාළ වන අතර සිරස් අක්ෂය සාර්වත්‍රික වන නිසා"
explanation: >-
  මූලික අක්ෂය සිරස් එකයි, මන්ද එය අත්‍යවශ්‍ය දේශපාලන ප්‍රශ්නය ග්‍රහණය කරන නිසාය: රාජ්‍යය මිනිස් ක්‍රියාව කොපමණ මට්ටමකට පාලනය කළ යුතුද? වම-දකුණ අක්ෂය සමාජ යුක්තියට එරෙහිව සම්ප්‍රදාය වැනි වෙනස් සංවේදීතා පමණක් පිළිබිඹු කරයි, නමුත් දෙපැත්තම statists ලෙස සිරස් අක්ෂයේ එකම ස්ථානයක් අත්පත් කරගත හැක. සිරස් අක්ෂය කෙනෙකු තම දැක්ම බලයෙන් පැනවීමට කැමතිද නැතහොත් පුද්ගලික නිදහසට ගරු කරනද යන්න හෙළි කරයි.
