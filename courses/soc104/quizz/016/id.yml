question: "Apa yang ingin diatur melalui undang-undang dan regulasi oleh kiri?"
answer: "Ekonomi, didorong oleh permusuhan terhadap kebebasan ekonomi, kapitalisme, dan pasar bebas"
wrong_answers:
  - "Moralitas pribadi dan praktik keagamaan, didorong oleh keinginan untuk mempertahankan institusi tradisional"
  - "Imigrasi dan perbatasan nasional, didorong oleh kekhawatiran tentang identitas budaya dan kedaulatan"
  - "Teknologi dan inovasi, didorong oleh ketakutan bahwa otomatisasi akan menggantikan pekerja manusia"
explanation: >-
  Kiri memprioritaskan keadilan sosial dan kesetaraan, terutama pada tingkat ekonomi. Ini mengarah pada permusuhannya terhadap kebebasan ekonomi, kapitalisme, dan pasar bebas, serta keinginannya untuk membuat undang-undang dan mengatur ekonomi. Sebaliknya, kanan ingin membuat undang-undang tentang moralitas dan agama. Regulasi imigrasi dan teknologi bukanlah fokus utama yang dijelaskan di sini.
