question: Какво прави комбинаторът 'take'?
answer: Той извлича левия компонент на product, като изхвърля десния.
wrong_answers:
  - Той премахва елемент от sum тип, като изхвърля битовия таг.
  - Той последователно композира две отделни операции от край до край.
  - Той обвива стойност с ляв таг, за да изгради нов sum тип.
explanation: >-
  Комбинаторът take е извличащ комбинатор за product типове. При take f,
  приложен към двойка ⟨a, b⟩, той изхвърля b и прилага f към a. В комбинация
  с iden, take iden извлича първия елемент на всяка двойка.
reviewed: false
