question: "Unde se află Verzii pe diagrama Nolan și de ce?"
answer: "Foarte jos pe diagramă, deoarece consideră că interesul individual nu trebuie să aibă prioritate asupra interesului colectiv al planetei"
wrong_answers:
  - "În vârful diagramei, deoarece prioritizează în mod egal libertatea personală și conștientizarea mediului"
  - "În centrul diagramei, deoarece echilibrează creșterea economică cu protecția mediului"
  - "În extrema dreaptă, deoarece susțin soluții bazate pe piață pentru provocările de mediu"
explanation: >-
  Verzii se află foarte jos pe diagrama Nolan deoarece favorizează un control puternic al statului asupra deciziilor atât economice, cât și personale, în numele bunăstării planetare. Ei au înlocuit lupta de clasă marxistă cu o luptă între om și natură și tind să apere controlul economic și chiar abolirea proprietății private. Acest lucru îi plasează în sectorul autoritar, nu în vârf sau în centru.
reviewed: false
