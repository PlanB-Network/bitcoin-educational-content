question: "Ludwig von Mises yashaka kuvuga iki igihe yandika ko umuntu ku giti ciwe gusa ari we yiyumvira, azirikana, kandi akora?"
answer: "Ko amakoraniro y'abantu nka leta canke igihugu atagira ukubaho kwayo bwite kurenga ibikorwa vy'abayagize nk'abantu ku giti cabo"
wrong_answers:
  - "Ko abantu bakwiye kwirinda gushinga imigwi canke amashirahamwe kuko igikorwa rusangi cama ari kibi"
  - "Ko abantu bamwe bamwe b'abahanga gusa ari bo bashoboye kwiyumvira mu buryo bw'ubwenge, mu gihe benshi bakurikira impengamiro y'akameremere"
  - "Ko ukwiyumvira n'ukuzirikana ari ibikorwa vyihariye bitakwiye kwigera bisangizwa abandi canke biganirirwa ku mugaragaro"
explanation: >-
  Mises yasiguye ko individualism irwanya iciyumviro c'uko ibiremwa vy'imibano nk'ikibano canke igihugu vyoshobora kubaho vyigenga ku bantu babigize. Ikoraniro ry'abantu nta kubaho kwaryo bwite rifise kurenga ibikorwa vy'abayagize nk'abantu ku giti cabo. Ntitushobora kuvuga mu buryo bufise insobanuro igikorwa ca leta canke c'ishirahamwe kuko ivyo bintu bitagira ubushake canke iciyumviro vyavyo bwite, kandi bikora gusa biciye ku bantu.
