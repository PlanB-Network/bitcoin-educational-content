question: "Che cos'è il conservatorismo culturale?"
answer: "Un'adesione personale a valori familiari, morali, estetici e metafisici ereditati dal passato, non una filosofia politica"
wrong_answers:
  - "Un'ideologia politica che usa il potere dello stato per imporre valori tradizionali a tutta la società attraverso la legislazione"
  - "Un movimento che rifiuta ogni forma di modernità e cerca di riportare la società a un modo di vivere preindustriale"
  - "Una dottrina economica che protegge le industrie nazionali e si oppone al libero scambio con i paesi stranieri"
explanation: >-
  Il conservatorismo culturale è definito come una saggezza di vita: l'adesione personale a valori familiari, morali, estetici e metafisici ereditati dal passato, siano essi greco-romani o giudaico-cristiani. Esplicitamente non è una filosofia politica. Differisce dal conservatorismo politico, che mira a preservare le istituzioni politiche e l'ordine sociale attraverso il potere dello stato. Inoltre non riguarda il rifiuto della modernità o il protezionismo economico.
reviewed: false
