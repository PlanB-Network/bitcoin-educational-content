question: "Ni iyihe ngabisho Milton Friedman yatanze ku bijanye no guca urubanza kuri politike za Leta?"
answer: "Politike zikwiye gucirwa urubanza hakurikijwe ibivamwo, aho kugendera ku migambi yazo"
wrong_answers:
  - "Politike zikwiye gucirwa urubanza hakurikijwe ingeso nziza z'abanyapolitike bazishikiriza"
  - "Politike zikwiye gucirwa urubanza hakurikijwe ukuntu zikundwa n'abatora muri rusangi"
  - "Politike zikwiye gucirwa urubanza hakurikijwe ko zihuye n'ibwirizwa shingiro rya mbere ry'igihugu"
explanation: >-
  Friedman yanditse ko rimwe mu makosa akomeye ari uguca urubanza kuri politike hakurikijwe imigambi yazo aho kuruguca hakurikijwe ibivamwo, avuga ko porogarama zitwa ko zigenewe abakene hafi zama zivyara ingaruka zihushanye n'ivyo abazishigikiye bari bagamije. Ivyo birasubiramwo inyigisho ya Bastiat ivuga ko umuhinga mwiza w'ubutunzi araba ingaruka zo mu gihe gito n'izo mu gihe kirekire ku bantu bose.
