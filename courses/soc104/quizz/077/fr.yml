question: "Qu'est-ce qui prime sur la liberté dans la philosophie politique conservatrice ?"
answer: "L'ordre et la tradition, qui doivent être fermement établis avant que la liberté puisse être valorisée"
wrong_answers:
  - "La justice sociale et l'égalité, qui doivent être garanties avant que les individus puissent être véritablement libres"
  - "L'efficacité économique et les résultats pragmatiques, qui déterminent quand la liberté est appropriée"
  - "Les droits de propriété individuels, qui doivent être protégés avant que toute autre liberté soit accordée"
explanation: >-
  Pour les conservateurs, l'ordre et la tradition priment sur la liberté. Ils soutiennent qu'un excès de liberté engendre le chaos et le désordre social, si bien que la liberté ne peut être valorisée qu'une fois l'ordre fermement établi. Cela contraste avec la vision socialiste qui donne la priorité à la justice, ou avec l'accent centriste mis sur l'efficacité.
reviewed: false
