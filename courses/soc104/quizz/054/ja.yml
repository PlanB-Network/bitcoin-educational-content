question: "中道主義はどのような統治形態へ向かう傾向があるか？"
answer: "経済と金融政策を操縦する専門家に権力が委ねられるテクノクラシー"
wrong_answers:
  - "市民がすべての主要な政策決定に投票する直接民主主義"
  - "伝統的な支配階級が権力を保持する貴族制"
  - "国家介入なしに市場が自己調整するレッセフェール型統治"
explanation: >-
  中道主義は効率性と実用主義を重視し、テクノクラシーへ向かう傾向がある。つまり、経済を操縦し、金融政策を操作する専門家に権力が委ねられるべきだという考えである。これは直接民主主義、貴族制、レッセフェールとは根本的に異なる。それぞれは、まったく別の原理に従って権力を配分するからである。
reviewed: false
