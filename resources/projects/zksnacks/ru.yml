description: |
  "zk" в zkSNACKs означает "нулевое знание", что значит, мы не собираем и не можем собирать какую-либо личную информацию пользователей в наших продуктах.

  zkSNACKs отключил свой координатор coinjoin 1 июня 2024 года, а его сайт недоступен. Wasabi Wallet продолжает существовать как программа с открытым исходным кодом.

