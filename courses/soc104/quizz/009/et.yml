question: "Milline sisemine pinge eksisteerib libertaaride seas Nolani diagrammil?"
answer: "Mõned tahavad riigi täielikult kaotada (anarhokapitalistid), samas kui teised eelistavad minimaalset riiki, mis säilitab põhilised suveräänsed funktsioonid (minarhistid)"
wrong_answers:
  - "Mõned tahavad tugevat majandusregulatsiooni, samas kui teised eelistavad kõigi tööstusharude täielikku dereguleerimist"
  - "Mõned toetavad demokraatlikke valimisi, samas kui teised eelistavad pärilikku valitsemissüsteemi"
  - "Mõned pooldavad progressiivseid sotsiaalpoliitikaid, samas kui teised kaitsevad rangelt traditsioonilisi moraalseid väärtusi"
explanation: >-
  Libertaaride perekonnas on põhimõtteline lahkarvamus riigi rolli üle. Anarhokapitalistid tahavad asendada kõik riigi funktsioonid erateenustega, samas kui minarhistid aktsepteerivad minimaalset riiki, mis säilitab põhilised suveräänsed funktsioonid nagu kaitse ja kohtud. Mõlemad rühmad jagavad libertarismi tippu, kuid erinevad selles, kas üldse mingi riik peaks eksisteerima.
reviewed: false
