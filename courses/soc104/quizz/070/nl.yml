question: "Welk terugkerend analytisch kader vormt bij de vijf maatschappelijke debatten (huwelijk, immigratie, vuurwapens, drugs, suikerhoudende dranken) het socialistische standpunt over elk onderwerp?"
answer: "Een conflictkader tussen dominanten en gedomineerden, waarin de samenleving wordt gestructureerd door onderdrukking en de staat moet ingrijpen om de kwetsbare groep te beschermen"
wrong_answers:
  - "Een utilitaristisch kader dat gericht is op het maximaliseren van algemeen geluk en economische productiviteit voor het grootste aantal burgers"
  - "Een natuurrechtenkader waarin individuele vrijheden moeten worden beschermd tegen zowel staats- als bedrijfsinmenging"
  - "Een traditionalistisch kader waarin gevestigde sociale instellingen moeten worden behouden tegen ontwrichtende moderne veranderingen"
explanation: >-
  Het socialistische standpunt in maatschappelijke debatten wordt consequent gevormd door een conflictkader van dominant/gedomineerd. Bij het huwelijk is het de heteroseksuele meerderheid die een homoseksuele minderheid onderdrukt. Bij immigratie zijn beperkingen op basis van nationaliteit vormen van onderdrukking. Bij vuurwapens zou alleen de staat geweld moeten bezitten om de kwetsbaren te beschermen. Bij suikerhoudende dranken profiteren industriëlen van de kwetsbaarheid van de minst beschermden. Deze lens van onderdrukker/onderdrukte wordt gereproduceerd in talrijke domeinen, waaronder gender, ras en zelfs de relatie tussen mensheid en natuur.
reviewed: false
