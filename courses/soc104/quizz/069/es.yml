question: "En los cinco debates sociales (matrimonio, inmigración, armas de fuego, drogas, bebidas azucaradas), ¿qué marco analítico recurrente configura la postura socialista sobre cada cuestión?"
answer: "Un marco de conflicto entre dominantes y dominados, donde la sociedad está estructurada por la opresión y el Estado debe intervenir para proteger al grupo vulnerable"
wrong_answers:
  - "Un marco utilitarista centrado en maximizar la felicidad general y la productividad económica para el mayor número de ciudadanos"
  - "Un marco de derechos naturales donde las libertades individuales deben protegerse tanto de la interferencia estatal como de la corporativa"
  - "Un marco tradicionalista donde las instituciones sociales establecidas deben preservarse frente a los cambios modernos disruptivos"
explanation: >-
  La postura socialista en los debates sociales está configurada de manera consistente por un marco de conflicto dominante/dominado. En el matrimonio, es la mayoría heterosexual oprimiendo a una minoría homosexual. En la inmigración, las restricciones basadas en la nacionalidad son formas de opresión. En las armas de fuego, solo el Estado debería detentar la fuerza para proteger a los vulnerables. En las bebidas azucaradas, los industriales se benefician de la vulnerabilidad de los menos protegidos. Esta lente opresor/oprimido se reproduce en numerosos ámbitos, incluidos el género, la raza e incluso la relación entre la humanidad y la naturaleza.
reviewed: false
