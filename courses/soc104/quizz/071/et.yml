question: "Miks on libertaarid maksustamise vastu?"
answer: "Sest see on omandiõiguste moraalne rikkumine, riikliku varguse vorm, mis võtab teise inimese vara ära ilma nõusolekuta"
wrong_answers:
  - "Sest maksud on majanduslikult ebatõhusad ja viivad alati kõrgema töötuse määrani"
  - "Sest maksustamine heidutab välisinvesteeringuid ja nõrgestab riigi konkurentsipositsiooni"
  - "Sest progressiivsed maksusüsteemid võtavad ebaõiglaselt sihikule jõukad inimesed, kes loovad kõige rohkem töökohti"
explanation: >-
  Libertaarne vastuväide maksustamisele on moraalne enne, kui see on majanduslik. Libertaarid näevad maksustamist riikliku varguse vormina ja eraomandi takistusena, sest see seisneb teise inimese vara äravõtmises ilma nõusolekuta. Kuigi maksustamise vastu võib olla majanduslikke argumente, toetub fundamentaalne libertaarne argument põhimõttele, et see rikub omandiõigusi, mitte tõhususe või konkurentsivõime arvutustele.
reviewed: false
