question: "Xét toàn bộ lập luận của khóa học này, Bitcoin đồng thời hiện thân cho phê phán libertarian đối với chủ nghĩa kiến tạo, cam kết hành động của cypherpunk, và sự bảo vệ cá nhân chủ nghĩa đối với tự chủ đạo đức như thế nào?"
answer: "Bitcoin thay thế tiền được kế hoạch hóa tập trung bằng một trật tự thị trường tự phát (phản kiến tạo), biến lý tưởng trừu tượng về tự do tài chính thành mã hoạt động được (hành động cypherpunk), và khôi phục quyền sở hữu có chủ quyền cùng quyền riêng tư cho cá nhân (tự chủ đạo đức)"
wrong_answers:
  - "Bitcoin dùng quản trị dân chủ để đặt chính sách tiền tệ (phản kiến tạo), xuất bản nội dung giáo dục về tự do tài chính (hành động cypherpunk), và cho phép các cá nhân bỏ phiếu về thay đổi giao thức (tự chủ đạo đức)"
  - "Bitcoin loại bỏ mọi điều tiết tài chính (phản kiến tạo), tạo ra một cộng đồng nhà phát triển vận động hành lang cho phi điều tiết (hành động cypherpunk), và trao cho các cá nhân giàu có nhiều quyền kiểm soát hơn đối với chính sách tiền tệ (tự chủ đạo đức)"
  - "Bitcoin phi tập trung hóa hạ tầng máy chủ trên nhiều quốc gia (phản kiến tạo), sử dụng giấy phép mã nguồn mở để chia sẻ công nghệ tự do (hành động cypherpunk), và cung cấp các nền tảng mạng xã hội ẩn danh cho bất đồng chính trị (tự chủ đạo đức)"
explanation: >-
  Bitcoin nằm tại giao điểm của ba truyền thống trí tuệ được khảo sát trong khóa học. Nó hiện thân cho lập luận phản kiến tạo bằng cách thay thế tiền pháp định được kế hoạch hóa tập trung bằng một trật tự tiền tệ tự phát, phi tập trung mà không nhà kế hoạch trung ương nào có thể kiểm soát. Nó hoàn thành mệnh lệnh cypherpunk là viết mã bằng cách biến các lý tưởng trừu tượng về tự do tài chính và quyền riêng tư thành công nghệ hoạt động được. Và nó phục vụ sự bảo vệ cá nhân chủ nghĩa đối với tự chủ đạo đức bằng cách cho phép quyền sở hữu có chủ quyền, bảo vệ thành quả lao động, và bảo tồn quyền riêng tư, để mỗi người làm chủ cuộc đời của chính mình.
