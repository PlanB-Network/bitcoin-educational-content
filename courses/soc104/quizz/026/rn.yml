question: "Kubera iki classical liberals bo muri Leta Zunze Ubumwe za Amerika batanguye kwiyita 'libertarians' kuva mu myaka ya 1960?"
answer: "Kugira ngo bitandukanye na American liberals, abo insobanuro yabo yari yahindukiye ku kwinjira kwa Leta"
wrong_answers:
  - "Kugira ngo bihuze n'Umugambwe w'Abademokarate n'imigambi yawo y'iterambere ry'ikibano"
  - "Kugira ngo berekane ko bashigikiye amavugurura ya Great Society ya Lyndon B. Johnson"
  - "Kugira ngo bafate akaranga k'akagumuko gakaze kahumetswe n'imihari ya gisosiyalisite yo mu Buraya"
explanation: >-
  Muri Leta Zunze Ubumwe za Amerika, ijambo 'liberal' ryahindutse risigura abashigikira Big Government n'ukwinjira kwa Leta, cane cane inyuma ya New Deal na Great Society. Classical liberals bafashe izina 'libertarian' kugira ngo bazigame insobanuro y'intango ya filozofiya yabo. Bariko baritandukanya na American liberals, ntibariko barifatanya na bo.
