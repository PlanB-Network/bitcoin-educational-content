question: Что вычисляет полусумматор?
answer: Перенос (AND) и сумму (XOR) двух входных битов.
wrong_answers:
  - Сумму двух многобитных целых чисел с распространением переноса.
  - Среднее значение двух битов, округлённое вниз.
  - Побитовые OR и AND двух входных битов.
explanation: >-
  Полусумматор принимает два отдельных бита и с помощью параллельной
  композиции производит два выхода: бит переноса (AND входов) и бит суммы
  (XOR входов). В Simplicity он определяется как and ▵ xor, выполняя
  обе операции над одной и той же входной парой.
